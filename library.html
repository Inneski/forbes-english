<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Barlow+Condensed:wght@700;800&family=Lato:wght@300;400;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-deep: #1b3a28;
    --green-mid: #2d6044;
    --green-light: #4a8f61;
    --green-pale: #e8f2ec;
    --gold: #b8962e;
    --gold-light: #f0d080;
    --gold-bright: #e8c04a;
    --cream: #faf8f3;
    --ink: #111;
    --ink-soft: #333;
    --muted: #6b7a6b;
    --border: #c8d4c8;
    --white: #ffffff;
    --radius: 10px;
    --pro: #1b3a28;
    --pro-bg: #e8f2ec;
    --free: #1a6b3c;
    --free-bg: #dff3e6;
  }
  body {
    font-family: 'Lato', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--green-deep);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .fe-logo-lockup { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; text-decoration: none; }
  .fe-logo-svg { width: 108px; height: auto; display: block; color: var(--cream); }
  .fe-logo-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.152rem;
    color: var(--gold-bright);
    margin-top: 4px;
    white-space: nowrap;
  }
  .nav-links { display: flex; gap: 10px; }
  .nav-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    color: var(--cream);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s ease;
  }
  .nav-pill:hover { background: rgba(255,255,255,0.16); }
  .nav-pill.gold { background: var(--gold-bright); color: var(--ink); border-color: var(--gold-bright); font-weight: 800; }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(180deg, var(--green-deep), #234a33);
    padding: 16px 24px 20px;
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; text-align: center; }
  .hero-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-bright);
    font-size: 0.72rem;
    margin-bottom: 10px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 620px;
    margin: 0 auto;
  }
  @media (max-width: 620px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius);
    padding: 10px 18px;
    min-width: 110px;
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.3rem;
    color: var(--gold-bright);
    line-height: 1;
  }
  .stat-lbl {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #cddccf;
    font-size: 0.65rem;
    margin-top: 3px;
    text-transform: uppercase;
  }
  .stat-deck {
    background: #2fae5c;
    border: 1px solid #38c96a;
    border-radius: var(--radius);
    padding: 16px 12px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    box-shadow: 0 4px 16px rgba(47,174,92,.35);
    transition: background .15s ease, transform .15s ease;
  }
  .stat-deck:hover { background: #38c96a; transform: translateY(-2px); }
  .stat-ico {
    font-size: 1.35rem;
    line-height: 1;
    height: 1.35rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-deck .stat-lbl {
    color: #0f1a13;
    opacity: 1;
    margin-top: 0;
    text-align: center;
    line-height: 1.25;
    font-size: 0.7rem;
    letter-spacing: 0.6px;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
  }
  #search {
    flex: 1 1 260px;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Lato', sans-serif;
    font-size: 1rem;
    background: var(--white);
  }
  #search:focus { outline: none; border-color: var(--green-mid); }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }
  .level-btn, .cat-btn, .free-toggle {
    padding: 7px 14px;
    border: 1.5px solid var(--border);
    background: var(--white);
    border-radius: 999px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all .15s ease;
  }
  .level-btn:hover, .cat-btn:hover, .free-toggle:hover { border-color: var(--green-light); }
  .level-btn.active, .cat-btn.active, .free-toggle.active {
    background: var(--green-deep);
    border-color: var(--green-deep);
    color: var(--white);
  }
  .free-toggle.active { background: var(--free); border-color: var(--free); }
  #count { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    padding: 0;
    text-decoration: none;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .card:hover {
    box-shadow: 0 4px 16px rgba(27,58,40,0.12);
    border-color: var(--green-light);
    transform: translateY(-2px);
  }
  .card-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--green-pale);
    flex: none;
  }
  .card-img-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-img-wrap.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-img-wrap.placeholder .ph-icon {
    font-size: 2.1rem;
    opacity: 0.55;
    filter: grayscale(0.15);
  }
  .card-body {
    padding: 14px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1 1 auto;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .card-cat {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 2px;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.35;
    color: var(--green-deep);
  }
  .badge {
    align-self: flex-start;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--green-pale);
    color: var(--green-mid);
  }
  .badge.gold { background: var(--gold-light); color: #6b5010; }
  .access-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .access-badge.free { background: var(--free-bg); color: var(--free); }
  .access-badge.pro { background: var(--pro-bg); color: var(--pro); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
  }
  .sherpa-banner {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 620px;
    margin: 12px auto 0;
    padding: 14px 20px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #C2185B, #7A0F3E);
    border: 1px solid #e0568f;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(194,24,91,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .sherpa-banner:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(194,24,91,.5); }
  .sherpa-banner .sherpa-ico { font-size: 1.7rem; line-height: 1; }
  .sherpa-banner .sherpa-text { text-align: left; }
  .sherpa-banner .sherpa-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.4px;
    color: #fff;
    text-transform: uppercase;
  }
  .sherpa-banner .sherpa-sub {
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    color: #f6cfe1;
    margin-top: 2px;
  }
</style>

<script>
function matchLogoSubWidth() {
  var svg = document.getElementById('fe-logo-svg');
  var sub = document.getElementById('fe-logo-sub');
  if (!svg || !sub) return;
  sub.style.letterSpacing = '0px';
  var targetWidth = svg.getBoundingClientRect().width;
  var naturalWidth = sub.getBoundingClientRect().width;
  var chars = sub.textContent.length;
  if (chars > 1 && naturalWidth > 0 && targetWidth > naturalWidth) {
    var extra = (targetWidth - naturalWidth) / (chars - 1);
    sub.style.letterSpacing = extra + 'px';
  }
}
window.addEventListener('load', matchLogoSubWidth);
window.addEventListener('resize', matchLogoSubWidth);

(async function init() {
const LESSONS = await sbGetLessons();


function detectLevel(item) {
  if (item.level) return item.level;
  const m = (item.title + ' ' + item.file).match(/\b(A1|A2|B1|B2|C1|C2)\b/i);
  return m ? m[1].toUpperCase() : '';
}
// Lessons whose title/filename says "roleplay" but whose actual content is a
// graded multiple-choice test with a narrative skin (no real speech output) —
// verified by hand against each file's JS data, since keyword-matching alone
// can't tell a real dialogue script from an MCQ wearing a story costume.
const NOT_ACTUALLY_SPEAKING = new Set([
  'case-file-b2-roleplay.html',
  'football_c1_roleplay.html',
  'fireshield-pitch-roleplay.html',
  'ridgeline_run.html',
  'forbes-roleplay-reddit-french-TEST-p3.html'
]);

function detectCategories(item) {
  const t = (item.title + ' ' + item.file).toLowerCase();
  const cats = [];
  if (/stranger[\s_-]?things|twin[\s_-]?peaks|harry[\s_-]?quebert|filmmaking|\bfilm\b|cinema|top gear/.test(t)) cats.push('Film & TV');
  if (/geopolitics|ukraine|harari|davos|venezuela|el zar|friedrich.*prussia|\bjfk\b|falklands/.test(t)) cats.push('Geopolitics');
  if (/nietzsche|eckhart tolle|\btolle\b/.test(t)) cats.push('Philosophy');
  if (/minecraft|\blego\b|\bdnd\b|dungeon|d&d/.test(t)) cats.push('Gaming');
  if (/\brpg\b|role[\s_-]?playing|career quest|falcon racing|parisian conquest|wild frame/.test(t)) cats.push('Role Playing Games');
  if (/football|soccer|champions league|eintracht|vfb[\s_-]?stuttgart|\bgolf\b|tennis|skiing|\bski\b|water polo|\bmtb\b|mountain[\s_-]?bik|ridgeline|dartboard|scooter tricks/.test(t)) cats.push('Sports');
  if (/architect|rem koolhaas|max lamb|interior design|restaurant interior|\binterior\b|cafe kowloon/.test(t)) cats.push('Architectural Design');
  if (/fashion|atelier|couture/.test(t)) cats.push('Fashion');
  if (/construction|site visit|contracts?\b/.test(t)) cats.push('Construction');
  if (/refinery|turnaround|pipeline|petrochemical|\boil\b|\bgas\b|geoscience/.test(t)) cats.push('Energy');
  if (/\bai\b|artificial intelligence|chatgpt|large language model|\bllm\b|machine learning|algorithm|productive struggle|automation|robotic/.test(t)) cats.push('Technology & AI');
  if (/negotiat/.test(t)) cats.push('Negotiation');
  if (/business|market prospecting|strategic vocabulary|supply chain|staffing strateg|sales tactics|e-?commerce|product strategy/.test(t)) cats.push('Business');
  if (/animal welfare|\bfawn\b|\bdeer\b|mower/.test(t)) cats.push('Animal Welfare');
  if (/ecuador|penguin|dinosaur|dino-craft|conservation|nature/.test(t)) cats.push('Nature & Wildlife');
  if (/email|talking with clients|meetings?\b|professional speaking|dailies review|workplace roleplay|coo briefings|decision-making under uncertainty|contingency|fireshield|energy sector project management|design pitch/.test(t)) cats.push('Workplace Communication');
  if (/fire[\s_-]?brigade|feuerwehr|firefighter/.test(t)) cats.push('Emergency Services');
  if (/taekwondo/.test(t)) cats.push('Martial Arts');
  if (/\bielts\b/.test(t)) cats.push('IELTS');
  if (/\bmodal\b|\bmust\b|have to|\bshould\b|might vs|going to/.test(t)) cats.push('Modal Verbs');
  if (/past simple|present perfect|present continuous|present simple|past continuous|past modals|\btense\b/.test(t)) cats.push('Tenses');
  if (/preposition/.test(t)) cats.push('Prepositions');
  if (/phrasal verb|take.{0,3}put|make.{0,3}do/.test(t)) cats.push('Phrasal Verbs');
  if (/passive/.test(t)) cats.push('Passive Voice');
  if (/gerund|infinitive/.test(t)) cats.push('Gerunds & Infinitives');
  if (item.video) cats.push('Video Lessons');
  if (NOT_ACTUALLY_SPEAKING.has(item.file)) {
    cats.push('Grammar activity');
  } else if (/quiz|grammar[\s_-]?test|jeopardy|grammar atelier/.test(t)) {
    cats.push('Grammar activity');
  } else if (/roleplay|role-play|escape room|alias|speaking activity/.test(t)) {
    cats.push('Speaking activity');
  }
  if (/\.pptx$/i.test(item.file) || item.deck) cats.push('Slide Decks');
  if (cats.length === 0) cats.push('Lesson plan');
  return cats;
}

// the Cloudflare Worker enforces before it serves the file (src/index.js).
// This badge only reports that value — it does not decide it, and hiding it
// would not protect anything.
function detectAccess(item) {
  return item.access === 'free' ? 'Free' : 'Pro';
}

    return `<div class="card-img-wrap"><img src="${encodeURI(img)}" alt="" loading="lazy"></div>`;
  }
  const override = PLACEHOLDER_OVERRIDE[l.file];
  const cat = l.categories.find(c => CATEGORY_STYLE[c]) || 'default';
  const [gradient, icon] = override || CATEGORY_STYLE[cat] || CATEGORY_STYLE.default;
  return `<div class="card-img-wrap placeholder" style="background:linear-gradient(135deg, ${gradient});"><span class="ph-icon">${icon}</span></div>`;
}

function render() {
  const q = normalizeForSearch(searchEl.value.trim());
  const filtered = LESSONS.filter(l => {
    const matchesLevel = activeLevel === 'ALL' || l.level === activeLevel;
    const matchesCategory = activeCategory === 'ALL' || l.categories.includes(activeCategory);
    const matchesFree = !freeOnly || l.access === 'Free';
    const matchesQuery = !q || normalizeForSearch(l.title).includes(q) || normalizeForSearch(l.file).includes(q);
    return matchesLevel && matchesCategory && matchesFree && matchesQuery;
  });
  grid.innerHTML = '';
  filtered.forEach(l => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = encodeURI(l.file);
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `
      ${cardImageHTML(l)}
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-cat">${l.categories.join(' · ')}</div>
            ${l.level ? `<span class="badge${l.level.startsWith('C') ? ' gold' : ''}">${l.level}</span>` : ''}
          </div>
          <span class="access-badge ${l.access.toLowerCase()}">${l.access}</span>
        </div>
        <span class="card-title">${l.title}</span>
      </div>
    `;
    grid.appendChild(a);
  });
  countEl.textContent = `${filtered.length} lesson${filtered.length !== 1 ? 's' : ''}`;
  emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
}

searchEl.addEventListener('input', render);
renderStats();
render();
if (window.applyHashCategory) window.applyHashCategory();
window.addEventListener('hashchange', () => { if (window.applyHashCategory) window.applyHashCategory(); });
})();
</script>
</body>
</html>
