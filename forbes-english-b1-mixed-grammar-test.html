<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1 Mixed Grammar Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E2A38;
    --ink-light: #4A5568;
    --paper: #EDF1EC;
    --card-bg: rgba(255, 255, 255, 0.78);
    --accent: #2F6B4F;
    --accent-dark: #1F4A36;
    --accent-light: #DCEDE3;
    --border: #D7DED8;
    --wrong: #B3261E;
    --wrong-bg: #FBEAE9;
    --correct-bg: #E4F3E9;
    --correct-text: #1F4A36;

    --tense-pressimple: #2F6FB0;
    --tense-prescont: #D6368F;
    --tense-preperf: #1E8A7A;
    --tense-preperfcont: #5AAFA0;
    --tense-pastsimple: #B08D57;
    --tense-pastcont: #E0B93C;
    --tense-pastperf: #7A1F3D;
    --tense-pastperfcont: #6B4C9A;
    --tense-futsimple: #C99A3E;
    --tense-futcont: #D97A34;
    --tense-futperf: #8A8478;
    --tense-futperfcont: #8B6FBF;

    --font-display: 'Fraunces', serif;
    --font-body: 'Work Sans', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .logo-svg { flex-shrink: 0; display: block; }

  .top-badges { display: flex; gap: 8px; flex-wrap: wrap; }

  .badge {
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-level { background: var(--accent-light); color: var(--accent-dark); }
  .badge-lang { background: #fff; border: 1px solid var(--border); color: var(--ink); }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .score-display {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px 28px;
    box-shadow: 0 2px 10px rgba(30, 42, 56, 0.05);
  }

  /* ─── BACKGROUND PHOTO (persistent, low-opacity) ─ */
  .bg-photo {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
  }

  .bg-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
    opacity: 0.4;
    filter: saturate(0.85);
  }

  .bg-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--paper) 0%, rgba(237,241,236,0.15) 40%, var(--paper) 100%);
  }

  /* ─── INTRO HERO IMAGE ────────────────────────── */
  .intro-hero {
    position: relative;
    margin: -30px -28px 24px;
    border-radius: 18px 18px 0 0;
    overflow: hidden;
  }

  .intro-hero img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    object-position: center 45%;
    display: block;
  }

  h1, h2 { font-family: var(--font-display); margin: 0 0 10px; color: var(--ink); }

  .intro-title { font-size: 32px; font-style: italic; font-weight: 600; }
  .intro-subtitle { color: var(--ink-light); font-size: 16px; margin: 0 0 20px; line-height: 1.5; }
  .badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .intro-info-list { margin: 0 0 18px; padding-left: 20px; color: var(--ink-light); line-height: 1.9; }
  .intro-note { font-size: 14px; color: var(--ink-light); font-style: italic; margin: 0 0 22px; }

  .section-title { font-size: 24px; font-weight: 600; }
  .section-instructions { color: var(--ink-light); margin: 0 0 22px; line-height: 1.6; font-size: 15.5px; }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: transparent; border: 1.5px solid var(--accent); color: var(--accent-dark); }
  .next-btn { margin-top: 20px; }

  .tag-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .tag-badge-tense::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--badge-color);
    display: inline-block;
  }
  .tag-badge-grammar { background: var(--accent-light); border-color: var(--accent-light); color: var(--accent-dark); }

  .prompt-text { font-size: 17px; line-height: 1.7; margin: 0 0 20px; }

  .blank-slot {
    display: inline-block;
    min-width: 76px;
    border-bottom: 2px solid var(--ink-light);
    text-align: center;
    font-weight: 600;
    color: var(--accent-dark);
    padding-bottom: 1px;
  }

  .fill-hint { color: var(--ink-light); font-style: italic; font-size: 0.9em; margin-left: 4px; }

  .gloss { border-bottom: 1px dotted var(--ink-light); cursor: pointer; }
  .gloss.revealed::after {
    content: " (" attr(data-es) ")";
    color: var(--accent-dark);
    font-style: italic;
    font-weight: 500;
  }

  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #fff;
    font-family: var(--font-body);
    font-size: 15.5px;
    cursor: pointer;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); }
  .option-btn.correct { background: var(--correct-bg); border-color: var(--accent); color: var(--correct-text); font-weight: 600; }
  .option-btn.incorrect { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .option-btn:disabled { cursor: not-allowed; }
  .option-btn:disabled:not(.correct):not(.incorrect) { opacity: 0.55; }

  .tf-buttons { display: flex; gap: 12px; }
  .tf-btn {
    flex: 1;
    padding: 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    color: var(--ink);
  }
  .tf-btn:hover:not(:disabled) { border-color: var(--accent); }
  .tf-btn.correct { background: var(--correct-bg); border-color: var(--accent); color: var(--correct-text); }
  .tf-btn.incorrect { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .tf-btn:disabled { cursor: not-allowed; }
  .tf-btn:disabled:not(.correct):not(.incorrect) { opacity: 0.55; }

  .fill-paragraph { font-size: 16.5px; line-height: 2; margin: 0 0 20px; }
  .fill-input {
    width: 138px;
    padding: 5px 9px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 15px;
    margin: 0 2px;
  }
  .fill-input.correct { border-color: var(--accent); background: var(--correct-bg); }
  .fill-input.incorrect { border-color: var(--wrong); background: var(--wrong-bg); }

  .fill-feedback-list { margin-top: 8px; }
  .blank-feedback {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13.5px;
    padding: 9px 12px;
    border-radius: 10px;
    flex-wrap: wrap;
  }
  .blank-feedback .tag-badge { margin-bottom: 0; }
  .blank-feedback.good { background: var(--correct-bg); }
  .blank-feedback.bad { background: var(--wrong-bg); }

  .reorder-answer {
    min-height: 58px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
  }
  .reorder-placeholder { color: var(--ink-light); font-style: italic; font-size: 14px; }
  .reorder-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip {
    padding: 9px 15px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
  }
  .chip.placed { background: var(--accent-light); border-color: var(--accent); }
  .chip:disabled { cursor: not-allowed; opacity: 0.75; }

  .wrong-sentence {
    background: var(--paper);
    padding: 13px 16px;
    border-radius: 10px;
    border-left: 4px solid var(--wrong);
    margin: 0 0 16px;
    font-size: 16px;
  }
  .error-input {
    width: 100%;
    padding: 13px 15px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15.5px;
    margin: 0 0 14px;
    font-family: var(--font-body);
  }

  .correct-reveal { color: var(--accent-dark); font-weight: 600; margin-top: 12px; }

  .feedback-box { margin-top: 18px; padding: 16px 18px; border-radius: 12px; }
  .feedback-box.correct { background: var(--correct-bg); }
  .feedback-box.incorrect { background: var(--wrong-bg); }
  .feedback-head { font-weight: 700; margin: 0 0 6px; }
  .explanation-text { color: var(--ink-light); line-height: 1.6; font-size: 14.5px; margin: 0; }

  .results-title { font-size: 26px; }
  .results-score { font-size: 40px; font-weight: 700; color: var(--accent-dark); margin: 6px 0 14px; }
  .results-tier { font-size: 16px; line-height: 1.6; color: var(--ink); margin: 0 0 24px; }
  .results-breakdown { margin-bottom: 26px; }
  .results-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
  }
  .results-row:last-child { border-bottom: none; }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent-dark);
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .page { padding: 20px 16px 48px; }
    .card { padding: 22px 18px; }
    .intro-hero { margin: -22px -18px 20px; }
    .intro-hero img { height: 190px; }
    .intro-title { font-size: 26px; }
    .results-score { font-size: 32px; }
  }
</style>
</head>

<script>
const TEST_DATA = {
  meta: {
    level: "B1 · Intermediate",
    title: "Mixed Grammar Test",
    subtitle: "Ten grammar areas, one test — tenses, modals, conditionals, passives and more.",
    totalPoints: 35
  },
  sections: [
    {
      id: "mc",
      type: "mc",
      title: "Section 1 · Multiple Choice",
      intro: "Ten sentences, ten different grammar points. Choose the option that completes each one correctly.",
      items: [
        {
          id: "mc1",
          prompt: "Listen! Someone {{blank}} at the door.",
          hint: "(knock)",
          options: ["knocks", "is knocking", "knocked", "was knocking"],
          correct: "is knocking",
          tag: { type: "tense", label: "Present Continuous", color: "--tense-prescont" },
          explanation: "We use the Present Continuous for an action happening right now. \u2018Listen!\u2019 signals the present moment, so \u2018knocks\u2019 (simple present), \u2018knocked\u2019 and \u2018was knocking\u2019 (both past) don\u2019t fit."
        },
        {
          id: "mc2",
          prompt: "While I {{blank}} dinner, the phone rang.",
          hint: "(cook)",
          options: ["cook", "was cooking", "cooks", "am cooking"],
          correct: "was cooking",
          tag: { type: "tense", label: "Past Continuous", color: "--tense-pastcont" },
          explanation: "\u2018While\u2019 + Past Continuous describes a background action interrupted by another past event (\u2018rang\u2019). The other three options are all present tense, which can\u2019t combine with a past event like \u2018rang\u2019."
        },
        {
          id: "mc3",
          prompt: "She {{blank}} in Madrid since 2019.",
          hint: "(live)",
          options: ["lives", "lived", "has lived", "is living"],
          correct: "has lived",
          tag: { type: "tense", label: "Present Perfect Simple", color: "--tense-preperf" },
          explanation: "\u2018Since\u2019 + a point in time needs the Present Perfect. \u2018Lives\u2019 and \u2018is living\u2019 are present tenses that don\u2019t pair with \u2018since\u2019, and \u2018lived\u2019 (Past Simple) can\u2019t combine with \u2018since 2019\u2019 either."
        },
        {
          id: "mc4",
          prompt: "I think Brazil {{blank}} the tournament.",
          hint: "(win)",
          options: ["is winning", "won", "wins", "will win"],
          correct: "will win",
          tag: { type: "tense", label: "Future Simple", color: "--tense-futsimple" },
          explanation: "\u2018I think...\u2019 introduces an opinion-based prediction with no evidence \u2014 the classic trigger for \u2018will\u2019. The other options are present or past tenses and don\u2019t express this kind of future prediction.",
          glossary: [{ word: "tournament", es: "torneo" }]
        },
        {
          id: "mc5",
          prompt: "This is {{blank}} film I\u2019ve seen this year.",
          hint: "(good)",
          options: ["the goodest", "the better", "more good", "the best"],
          correct: "the best",
          tag: { type: "grammar", label: "Comparatives & Superlatives" },
          explanation: "With \u2018the\u2019 and a comparison against everything else in a category (\u2018...I\u2019ve seen this year\u2019), we need the superlative \u2018the best\u2019. \u2018The goodest\u2019 and \u2018more good\u2019 aren\u2019t real English forms, and \u2018the better\u2019 is a comparative, not a superlative."
        },
        {
          id: "mc6",
          prompt: "You {{blank}} wear a seatbelt in this country \u2014 it\u2019s the law.",
          hint: "",
          options: ["might", "could", "would", "must"],
          correct: "must",
          tag: { type: "grammar", label: "Modal Verbs" },
          explanation: "\u2018Must\u2019 expresses strong obligation, which fits a legal requirement. \u2018Might\u2019 and \u2018could\u2019 express possibility, and \u2018would\u2019 is used for hypotheticals, not obligation.",
          glossary: [{ word: "seatbelt", es: "cintur\u00f3n de seguridad" }]
        },
        {
          id: "mc7",
          prompt: "If it {{blank}} tomorrow, we\u2019ll cancel the picnic.",
          hint: "(rain)",
          options: ["will rain", "rained", "would rain", "rains"],
          correct: "rains",
          tag: { type: "grammar", label: "Conditionals" },
          explanation: "The if-clause of a First Conditional uses the Present Simple. \u2018Will rain\u2019 and \u2018would rain\u2019 can\u2019t go in the if-clause, and \u2018rained\u2019 is the wrong tense for a real future possibility."
        },
        {
          id: "mc8",
          prompt: "If I {{blank}} more free time, I would learn to paint.",
          hint: "(have)",
          options: ["have", "will have", "has", "had"],
          correct: "had",
          tag: { type: "grammar", label: "Conditionals" },
          explanation: "\u2018Would learn\u2019 in the main clause signals a Second Conditional, whose if-clause needs the Past Simple. \u2018Have\u2019, \u2018has\u2019 and \u2018will have\u2019 don\u2019t match this hypothetical, unlikely situation."
        },
        {
          id: "mc9",

/* ---------- Utilities ---------- */

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function escapeRegex(str) {
  return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function applyGlossary(text, glossaryList) {
  let html = escapeHtml(text);
  if (glossaryList && glossaryList.length) {
    glossaryList.forEach(function (g) {
      const re = new RegExp("\\b(" + escapeRegex(g.word) + ")\\b", "i");
      const esSafe = escapeHtml(g.es).replace(/"/g, "&quot;");
      html = html.replace(re, '<span class="gloss" data-es="' + esSafe + '">$1</span>');
    });
  }
  return html;
}

function normalizeText(s) {
  return String(s)
    .toLowerCase()
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201c\u201d]/g, '"')
    .replace(/[.!?]+$/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function createCard() {
  const card = document.createElement("div");
  card.className = "card";
  return card;
}

function makeBadge(text, cls) {
  const span = document.createElement("span");
  span.className = "badge " + cls;
  span.textContent = text;
  return span;
}

function tagBadge(tag) {
  const span = document.createElement("span");
  if (!tag) {
    span.className = "tag-badge tag-badge-grammar";
    return span;
  }
  if (tag.type === "tense") {
    span.className = "tag-badge tag-badge-tense";
    span.style.setProperty("--badge-color", "var(" + tag.color + ")");
    span.textContent = tag.label;
  } else {
    span.className = "tag-badge tag-badge-grammar";
    span.textContent = tag.label;
  }
  return span;
}

function showFeedback(card, isCorrect, explanation) {
  const box = document.createElement("div");
  box.className = "feedback-box " + (isCorrect ? "correct" : "incorrect");
  const head = document.createElement("p");
  head.className = "feedback-head";
  head.textContent = isCorrect ? "\u2713 Correct!" : "\u2717 Not quite.";
  const exp = document.createElement("p");
  exp.className = "explanation-text";
  exp.textContent = explanation;
  box.appendChild(head);
  box.appendChild(exp);
  card.appendChild(box);
  return box;
}

/* ---------- State ---------- */

const state = {
  steps: [],
  stepIndex: 0,
  totalUnits: 0,
  unitsCompleted: 0,
  score: 0,
  sectionStats: {},
  currentAnswered: false
};

function buildSteps(data) {
  const steps = [];
  steps.push({ type: "intro" });
  data.sections.forEach(function (section) {
    steps.push({ type: "section-intro", section: section });
    if (section.type === "fill") {
      steps.push({ type: "fill-block", section: section, weight: section.blanks.length });
    } else {
      section.items.forEach(function (item) {
        steps.push({ type: section.type + "-item", section: section, item: item, weight: 1 });
      });
    }
  });
  steps.push({ type: "results" });
  return steps;
}

function resetState() {
  state.stepIndex = 0;
  state.unitsCompleted = 0;
  state.score = 0;
  state.sectionStats = {};
  state.currentAnswered = false;
}

function recordPoints(step, correctPoints, totalPoints) {
  state.unitsCompleted += totalPoints;
  state.score += correctPoints;
  const sid = step.section.id;
  if (!state.sectionStats[sid]) {
    state.sectionStats[sid] = { correct: 0, total: 0, title: step.section.title };
  }
  state.sectionStats[sid].correct += correctPoints;
  state.sectionStats[sid].total += totalPoints;
  updateHeader();
}

function updateHeader() {
  const fill = document.getElementById("progressFill");
  const pct = state.totalUnits ? (state.unitsCompleted / state.totalUnits) * 100 : 0;
  if (fill) fill.style.width = pct + "%";
  const scoreDisplay = document.getElementById("scoreDisplay");
  if (scoreDisplay) scoreDisplay.textContent = "Score: " + state.score + " / " + state.totalUnits;
}

function addNextButton(card) {
  const btn = document.createElement("button");
  btn.className = "btn btn-primary next-btn";
  const isLastContentStep = state.stepIndex === state.steps.length - 2;
  btn.textContent = isLastContentStep ? "See My Results" : "Next \u2192";
  btn.type = "button";
  btn.addEventListener("click", advance);
  card.appendChild(btn);
  return btn;
}

function attachGlossListeners(container) {
  const glosses = container.querySelectorAll(".gloss");
  glosses.forEach(function (el) {
    el.addEventListener("click", function () {
      el.classList.toggle("revealed");
    });
  });
}

/* ---------- Render: Multiple choice ---------- */

function renderMCItem(app, step) {
  const item = step.item;
  const card = createCard();
  card.appendChild(tagBadge(item.tag));

  const promptEl = document.createElement("p");
  promptEl.className = "prompt-text";
  const parts = item.prompt.split("{{blank}}");
  const beforeHtml = applyGlossary(parts[0], item.glossary);
  const afterHtml = applyGlossary(parts[1] || "", item.glossary);
  const hintHtml = item.hint ? ' <span class="fill-hint">' + escapeHtml(item.hint) + "</span>" : "";
  promptEl.innerHTML = beforeHtml + '<span class="blank-slot">_____</span>' + hintHtml + afterHtml;
  card.appendChild(promptEl);

  const optionsList = document.createElement("div");
  optionsList.className = "options-list";
  const shuffled = shuffle(item.options.slice());
  shuffled.forEach(function (opt) {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.type = "button";
    btn.textContent = opt;
    btn.addEventListener("click", function () {
      if (state.currentAnswered) return;
      state.currentAnswered = true;
      const isCorrect = opt === item.correct;
      Array.prototype.forEach.call(optionsList.children, function (b) {
        b.disabled = true;
        if (b.textContent === item.correct) b.classList.add("correct");
        else if (b === btn) b.classList.add("incorrect");
      });
      recordPoints(step, isCorrect ? 1 : 0, 1);
      showFeedback(card, isCorrect, item.explanation);
      addNextButton(card);
    });
    optionsList.appendChild(btn);
  });
  card.appendChild(optionsList);
  app.appendChild(card);
}

/* ---------- Render: Sentence reordering ---------- */

function renderReorderItem(app, step) {
  const item = step.item;
  const card = createCard();
  card.appendChild(tagBadge(item.tag));

  const instructions = document.createElement("p");
  instructions.className = "prompt-text";
  instructions.textContent = "Tap the words in order to build the sentence:";
  card.appendChild(instructions);

  const answerArea = document.createElement("div");
  answerArea.className = "reorder-answer";
  const bankArea = document.createElement("div");
  bankArea.className = "reorder-bank";
  card.appendChild(answerArea);
  card.appendChild(bankArea);

  let bank = shuffle(item.words.slice());
  let attempts = 0;
  while (bank.join(" ") === item.words.join(" ") && attempts < 10) {
    bank = shuffle(item.words.slice());
    attempts++;
  }
  let answer = [];

  const checkBtn = document.createElement("button");
  checkBtn.className = "btn btn-primary check-btn";
  checkBtn.type = "button";
  checkBtn.textContent = "Check Sentence";
  checkBtn.disabled = true;

  function renderChips() {
    answerArea.innerHTML = "";
    bankArea.innerHTML = "";
    if (answer.length === 0) {
      const placeholder = document.createElement("span");
      placeholder.className = "reorder-placeholder";
      placeholder.textContent = "Tap words below to build your sentence here.";
      answerArea.appendChild(placeholder);
    }
    answer.forEach(function (word, idx) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip placed";
      chip.textContent = word;
      chip.addEventListener("click", function () {
        if (state.currentAnswered) return;
        answer.splice(idx, 1);
        bank.push(word);
        renderChips();
      });
      answerArea.appendChild(chip);
    });
    bank.forEach(function (word, idx) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = word;
      chip.addEventListener("click", function () {
        if (state.currentAnswered) return;
        bank.splice(idx, 1);
        answer.push(word);
        renderChips();
      });
      bankArea.appendChild(chip);
    });
    checkBtn.disabled = bank.length !== 0;
  }
  renderChips();

  checkBtn.addEventListener("click", function () {
    if (state.currentAnswered || bank.length !== 0) return;
    state.currentAnswered = true;
    const builtSentence = answer.join(" ");
    const isCorrect = builtSentence === item.correct;
    Array.prototype.forEach.call(answerArea.querySelectorAll(".chip"), function (c) {
      c.disabled = true;
    });
    checkBtn.disabled = true;
    recordPoints(step, isCorrect ? 1 : 0, 1);
    if (!isCorrect) {
      const reveal = document.createElement("p");
      reveal.className = "correct-reveal";
      reveal.textContent = "Correct sentence: " + item.correct;
      card.appendChild(reveal);
    }
    showFeedback(card, isCorrect, item.explanation);
    addNextButton(card);
  });

  card.appendChild(checkBtn);
  app.appendChild(card);
}

  checkBtn.type = "button";
  checkBtn.textContent = "Check";
  card.appendChild(checkBtn);

  function submit() {
    if (state.currentAnswered) return;
    if (!input.value.trim()) return;
    state.currentAnswered = true;
    input.disabled = true;
    checkBtn.disabled = true;
    const normalized = normalizeText(input.value);
    const isCorrect = item.answers.some(function (a) {
      return normalizeText(a) === normalized;
    });
    if (!isCorrect) {
      const reveal = document.createElement("p");
      reveal.className = "correct-reveal";
      const correctAnswer = item.answers[0];
      reveal.textContent =
        "Correct answer: " + correctAnswer.charAt(0).toUpperCase() + correctAnswer.slice(1) + ".";
      card.appendChild(reveal);
    }
    recordPoints(step, isCorrect ? 1 : 0, 1);
    showFeedback(card, isCorrect, item.explanation);
    addNextButton(card);
  }

  checkBtn.addEventListener("click", submit);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") submit();
  });
  app.appendChild(card);
}

/* ---------- Render: Fill in the blank block ---------- */

function renderFillBlock(app, step) {
  const section = step.section;
  const card = createCard();

  const introEl = document.createElement("p");
  introEl.className = "section-instructions";
  introEl.textContent = section.intro;
  card.appendChild(introEl);

  const textContainer = document.createElement("p");
  textContainer.className = "fill-paragraph";

  const regex = /\{\{(\d+)\}\}\s*(\[[^\]]*\])?/g;
  let html = "";
  let lastIndex = 0;
  let match;
  const rawText = section.text;
  while ((match = regex.exec(rawText)) !== null) {
    const segment = rawText.slice(lastIndex, match.index);
    html += applyGlossary(segment, section.glossary);
    const blankId = match[1];
    const hintBracket = match[2];
    html += '<input type="text" class="fill-input" data-blank-id="' + blankId + '" autocomplete="off" spellcheck="false">';
    if (hintBracket) {
      const hintText = hintBracket.slice(1, -1);
      html += ' <span class="fill-hint">(' + escapeHtml(hintText) + ")</span>";
    }
    lastIndex = regex.lastIndex;
  }
  html += applyGlossary(rawText.slice(lastIndex), section.glossary);
  textContainer.innerHTML = html;
  card.appendChild(textContainer);

  const checkBtn = document.createElement("button");
  checkBtn.className = "btn btn-primary check-btn";
  checkBtn.type = "button";
  checkBtn.textContent = "Check My Answers";
  card.appendChild(checkBtn);

  const feedbackContainer = document.createElement("div");
  feedbackContainer.className = "fill-feedback-list";
  card.appendChild(feedbackContainer);

  checkBtn.addEventListener("click", function () {
    if (state.currentAnswered) return;
    state.currentAnswered = true;
    checkBtn.disabled = true;
    let correctCount = 0;
    const inputs = textContainer.querySelectorAll(".fill-input");
    inputs.forEach(function (inp) {
      inp.disabled = true;
      const blankId = parseInt(inp.getAttribute("data-blank-id"), 10);
      const blankData = section.blanks.find(function (b) {
        return b.id === blankId;
      });
      const normalized = normalizeText(inp.value);
      const isCorrect = blankData.answers.some(function (a) {
        return normalizeText(a) === normalized;
      });
      inp.classList.add(isCorrect ? "correct" : "incorrect");
      if (isCorrect) correctCount++;

      const row = document.createElement("div");
      row.className = "blank-feedback " + (isCorrect ? "good" : "bad");
      row.appendChild(tagBadge(blankData.tag));
      const msg = document.createElement("span");
      msg.textContent = isCorrect
        ? "Correct: " + blankData.answers[0]
        : 'Your answer: "' + inp.value.trim() + '" \u2014 correct: ' + blankData.answers[0];
      row.appendChild(msg);
      feedbackContainer.appendChild(row);
    });

    recordPoints(step, correctCount, section.blanks.length);

    const summary = document.createElement("p");
    summary.className = "feedback-head";
    summary.textContent = "You got " + correctCount + " / " + section.blanks.length + " correct.";
    feedbackContainer.insertBefore(summary, feedbackContainer.firstChild);

    addNextButton(card);
  });

  app.appendChild(card);
}

/* ---------- Render: Results ---------- */

function renderResults(app) {
  const card = createCard();
  const h2 = document.createElement("h2");
  h2.className = "results-title";
  h2.textContent = "Your Results";

  const pct = state.totalUnits ? Math.round((state.score / state.totalUnits) * 100) : 0;
  const scoreLine = document.createElement("p");
  scoreLine.className = "results-score";
  scoreLine.textContent = state.score + " / " + state.totalUnits + " (" + pct + "%)";

  const tier = TEST_DATA.results.find(function (r) {
    return pct >= r.min;
  });
  const tierMsg = document.createElement("p");
  tierMsg.className = "results-tier";
  tierMsg.textContent = tier ? tier.message : "";

  const table = document.createElement("div");
  table.className = "results-breakdown";
  TEST_DATA.sections.forEach(function (sec) {
    const stat = state.sectionStats[sec.id] || { correct: 0, total: 0 };
    const row = document.createElement("div");
    row.className = "results-row";
    const label = document.createElement("span");
    label.textContent = sec.title;
    const value = document.createElement("span");
    value.textContent = stat.correct + " / " + stat.total;
    row.appendChild(label);
    row.appendChild(value);
    table.appendChild(row);
  });

  const restartBtn = document.createElement("button");
  restartBtn.className = "btn btn-secondary";
  restartBtn.type = "button";
  restartBtn.textContent = "Restart Test";
  restartBtn.addEventListener("click", function () {
    resetState();
    renderStep();
  });

  card.appendChild(h2);
  card.appendChild(scoreLine);
  card.appendChild(tierMsg);
  card.appendChild(table);
  card.appendChild(restartBtn);
  app.appendChild(card);
}

/* ---------- Controller ---------- */

function renderStep() {
  const step = state.steps[state.stepIndex];
  const app = document.getElementById("app");
  app.innerHTML = "";
  state.currentAnswered = false;

  switch (step.type) {
    case "intro":
      renderIntroScreen(app);
      break;
    case "section-intro":
      renderSectionIntro(app, step.section);
      break;
    case "mc-item":
      renderMCItem(app, step);
      break;
    case "tf-item":
      renderTFItem(app, step);
      break;
    case "reorder-item":
      renderReorderItem(app, step);
      break;
    case "error-item":
      renderErrorItem(app, step);
      break;
    case "fill-block":
      renderFillBlock(app, step);
      break;
    case "results":
      renderResults(app);
      break;
    default:
      break;
  }
  attachGlossListeners(app);
  updateHeader();
}

function advance() {
  state.stepIndex++;
  renderStep();
  if (typeof window !== "undefined" && window.scrollTo) {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function initTest() {
  state.steps = buildSteps(TEST_DATA);
  state.totalUnits = TEST_DATA.meta.totalPoints;
  resetState();
  renderStep();
}

initTest();
</script>
