<!DOCTYPE html>

<head>
<!--
  FORBES ENGLISH — LEVEL CHECKER v2 (adaptive tense placement test)
  =================================================================
  A ruled-paper placement test. Six questions per band, adaptive.

  v2 CHANGES
  ----------
  * BANK TRIPLED: 60 questions, 12 per band, up from 20. Each run draws
    6 at random from the 12, so a retake is a genuinely different test
    rather than a memory exercise. With 12 choose 6 there are 924
    possible papers per band.

  * BAND LENGTH: 6 questions, pass at 4. This replaced 4-pass-at-3, which
    was too short to place anyone reliably. Chosen from 4,000 simulated
    learners per level at five configurations:

        config    A1     A2     B1     B2     C1     mean q
        4 of 3   84.8%  93.8%  89.7%  84.3%  84.4%    12.9   <- was
        5 of 4   88.5%  97.3%  88.4%  80.4%  75.3%    15.9
        6 of 4   91.4%  95.8%  95.1%  93.6%  95.5%    19.3   <- now
        6 of 5   88.2%  97.0%  86.2%  75.7%  67.1%    18.9
        8 of 6   95.0%  99.2%  96.0%  92.3%  89.4%    25.6

    Two things fall out of that table. First, 4-of-3 let a pure guesser
    clear a band 5.08% of the time (binomial, p=0.25); 6-of-4 cuts that to
    3.76% while adding six questions, and 8-of-6 barely improves on it for
    another six. Second, RAISING the threshold makes placement WORSE at the
    top: 6-of-5 and 5-of-4 punish a strong learner for one slip, which is
    why C1 accuracy collapses to 67-75%. More questions help; a harsher
    pass mark does not.

  * BANDING LOGIC REWRITTEN. v1's step-down condition was tangled and
    could settle a band early in one edge case. Now it is three lines
    and provably terminates:
        pass  -> record it as the floor; climb, or settle if at C1
        fail  -> settle at the floor if we ever passed one;
                 otherwise step DOWN and test the band below;
                 if we fail A1 itself, settle at pre-A1
    At 6-of-4 this places correctly 91–96% at every level, mean 19.3
    questions, worst case 36. The worst case is failing the A2 start,
    passing A1, then climbing back through A2 — one band re-tested, with
    fresh random questions, so it reads as a second look, not a repeat.

  * SUBGROUP COVERAGE IS NOW DELIBERATE. The 60 questions cover 46 of
    the 58 codes in claude/tense-subgroups-syllabus.md. The 10 not
    covered are marked at the bottom of this comment — they are the
    ones that cannot be tested in a single four-option gap without
    giving the answer away in the stem.

  * assertBank() runs at load and checks, per question:
      - the key is not conspicuously the longest option
        (>10% longer than the longest distractor AND >=4 chars longer)
      - there are exactly 4 options and no duplicates
      - the subgroup code is a known code
      - every question has an explanation
    Failures print to the console with the exact question. This is the
    ANSWERS/BANK gate idea from lesson-build-house-style.js §12, applied
    to a file the real checker cannot parse.

  * KEY POSITION IS NOT A TELL. All keys are authored at index 0 for
    editing sanity, then shuffled at runtime — same approach the deck
    engine uses. Never read c: as "the answer is A".

  NOT COVERED BY THE BANK, and why:
    PS3 partially, PC2, PC3, PA4, PP8, PPC3, PGC4, PGC5, FS5, FS6,
    FC2, PPFC1 — each needs either a longer stem than a placement test
    should carry, or a production task rather than a choice.

  STILL TO WIRE
  -------------
  - Result -> Supabase `placement` row (user, level, entry_code, taken_at).
    Nothing is stored today, so a result is gone on refresh — the same gap
    the FAQ is honest about for the rest of the site.
  - Result -> the Block Camp map, to pre-clear everything below the entry
    point instead of making a learner click through what they already know.
  - DE/ES chrome. Stems and options stay English (house style §8).
-->

<style>
/* No @import. Courier New is a system face, so nothing is fetched: the page
   paints correctly on the FIRST frame instead of reflowing when a webfont
   lands. That also removes the document.fonts.ready dependency the snapper
   was carrying — it still waits, it just resolves instantly now.
   To go back to the Playfair/Lato/Barlow set, restore the @import and swap
   --face / --face-display below; nothing else references a family. */

/* ============================================================
   RULED PAPER THEME
   Drawn in CSS, not shipped as the 2944x1648 / 940KB image it
   came from. Three reasons that is the right call here:

     1. A bitmap has one rule spacing. This page grows and shrinks
        with the question, so the image would stretch and the lines
        would stop meaning anything.
     2. --line is the single source of truth for BOTH the rule
        spacing and the body line-height, so the text sits ON the
        rules instead of floating across them. That is the whole
        point of ruled paper, and an image cannot do it.
     3. 940KB against roughly 400 bytes, and it stays crisp at any
        zoom or pixel density.

   Colours sampled from the supplied image, not guessed:
     paper  #f9f2e3   rule #b9b4a8   margin #e18755
     rule spacing 55px in a 1648px-tall image -> 28px on screen.
   ============================================================ */

:root{
  --face: 'Courier New', Courier, 'Nimbus Mono PS', monospace;
  /* Courier New ships only 400 and 700 — there is no middle. At 400 it went
     thin and grey on a cream ground, which is the one thing a typed exam
     paper never looks like. 700 throughout is also authentic: a typewriter
     has one weight, and emphasis came from CAPS, spacing and underline, not
     from a heavier face. Bold Courier carries the SAME advance widths as
     regular, so nothing reflows and the 720px column still holds. */
  --weight: 700;
  --line: 28px;             /* rule pitch AND body line-height */
  --col:  720px;            /* the writing column; the margin rule hangs off it */
  /* Starting offset only; snapToRules overwrites background-position with a
     measured value on every render. Kept so the page is not visibly wrong in
     the frame before the script runs. */
  --rule-shift: -7.5px;
  /* --baseline is measured at runtime by snapToRules, not declared here:
     it depends on the rendered font, which depends on zoom and on whether
     the webfont has loaded. The static value that used to live here was
     right at 100% zoom only. */
  --paper:  #f9f2e3;
  --rule:   #b9b4a8;
  --margin: #e18755;
  --margin-vis: var(--margin);   /* set transparent on narrow, never removed */
  --ink:    #1e2327;        /* typewriter ribbon, not pencil */
  --ink-soft:#5d6469;
  --pen-red:  #b3261e;      /* marking red */
  --pen-green:#1d6b3f;      /* marking green */
  --green-deep:#14301f;     /* Forbes green, from the site */
  --gold:#b8962e;
  --gold-bright:#e8c04a;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; color:var(--ink);
  font-family:var(--face);
  font-weight:var(--weight);
  font-size:17px; line-height:var(--line);
  background-color:var(--paper);
  background-image:
    /* The margin rule is positioned off the CENTRED column, not off the
       viewport edge. Pinned to the left of the screen it stranded itself
       metres away from the text on a wide monitor, which is not how a
       margin works — you write immediately to the right of it. */
    linear-gradient(90deg,
      transparent 0 calc(50% - var(--col)/2 - 32px),
      var(--margin-vis) calc(50% - var(--col)/2 - 32px) calc(50% - var(--col)/2 - 30px),
      transparent calc(50% - var(--col)/2 - 30px)),
    /* the horizontal ruling — last 1px of every --line band */
    repeating-linear-gradient(180deg,
      transparent 0 calc(var(--line) - 1px),
      var(--rule) calc(var(--line) - 1px) var(--line));
  background-repeat:no-repeat, repeat;
  background-position:0 0, 0 var(--rule-shift);
}
/* On a phone the margin rule would eat a third of the width — so it is made
   TRANSPARENT rather than removed. Dropping the layer here was a real bug:
   snapToRules writes `background-position: 0 0, 0 <shift>px`, and with only
   one layer left the second value had nothing to apply to, so the ruling
   silently stopped being shifted below 620px while every check still passed
   because the checks measured the maths, not the paint. */
@media (max-width:620px){ :root{ --margin-vis: transparent; } }

.wrap{max-width:var(--col);margin:0 auto;padding:calc(var(--line)*2) 0 calc(var(--line)*3)}
@media (max-width:620px){ .wrap{padding-left:22px;padding-right:22px} }

/* ---------- masthead ----------
   The real lockup, lifted verbatim from index.html: the Forbes wordmark as
   SVG paths plus the ENGLISH sub, whose letter-spacing is set at runtime by
   matchLogoSubWidth() so the sub measures exactly as wide as the wordmark's
   ink. That measurement is why the sub cannot simply be given a fixed
   letter-spacing — the earlier text-only stand-in guessed .52em and was
   wrong at every viewport. Sized off --line so it stays on the ruling. */
.fe-logo-lockup{display:block;text-decoration:none;line-height:1;
  margin-bottom:var(--line)}
.fe-logo-svg{width:clamp(150px,17vw,208px);height:auto;display:block;
  position:relative;   /* snapToRules lands its baseline on a rule */
  color:var(--green-deep)}
.fe-logo-sub{display:block;width:max-content;font-family:var(--face);
  font-weight:var(--weight);font-size:19px;line-height:var(--line);
  color:var(--gold);white-space:nowrap}
/* 21px is not arbitrary. On the live site a 116px wordmark carries an
   ~11.8px sub, which works out to a letter-gap of about 0.9x the font size.
   Enlarging the mark to 208px without scaling the sub gave a 26px gap —
   ENGLISH strung out like a shop awning. Solving for the same ratio at this
   mark width gives 21px. Scale both or neither. */
h1{font-family:var(--face);font-size:33px;line-height:calc(var(--line)*2);
  margin:var(--line) 0 var(--line);font-weight:var(--weight);color:var(--green-deep)}
.lede{margin:0 0 var(--line);max-width:56ch;line-height:var(--line);font-weight:var(--weight)}
.meta{font-family:var(--face);font-weight:var(--weight);letter-spacing:.06em;
  text-transform:uppercase;font-size:12.5px;color:var(--ink-soft);line-height:var(--line)}

/* ---------- buttons: rubber-stamped, not glassy ---------- */
.btn{font-family:var(--face);font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;font-size:15px;line-height:var(--line);
  padding:0 26px;height:calc(var(--line)*1.5);cursor:pointer;
  background:var(--green-deep);color:var(--paper);border:2px solid var(--green-deep);
  margin-top:var(--line);transition:background .15s,color .15s}
.btn:hover{background:var(--gold-bright);color:var(--green-deep);border-color:var(--green-deep)}
.btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
.btn.ghost:hover{background:transparent;color:var(--green-deep);border-color:var(--green-deep)}

/* ---------- progress ---------- */
.bar{display:flex;gap:5px;margin-bottom:var(--line)}
.pip{flex:1;height:6px;background:transparent;border:1px solid var(--rule)}
.pip.on{background:var(--green-deep);border-color:var(--green-deep)}
.band-tag{font-family:var(--face);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;font-size:12.5px;color:var(--ink-soft);
  display:flex;justify-content:space-between;line-height:var(--line)}
.band-tag b{color:var(--green-deep);font-weight:800}

/* ---------- the question ---------- */
.stem{font-family:var(--face);font-weight:var(--weight);font-size:20px;
  line-height:var(--line);margin:0 0 var(--line);max-width:34ch}
/* the gap is a real ruled blank, the way it looks on a paper test */
.stem u{text-decoration:none;border-bottom:2px solid var(--ink);
  padding:0 30px;margin:0 3px}

.opts{display:flex;flex-direction:column;gap:0}
/* No boxes. A box drawn on ruled paper fights the ruling — it hides the
   lines it covers and re-draws its own, so the page reads as cards floating
   over paper rather than answers written on it. The lettered circle is the
   only chrome an answer needs. */
.opt{display:flex;align-items:baseline;gap:14px;text-align:left;
  font-family:var(--face);font-weight:var(--weight);font-size:17px;line-height:var(--line);
  padding:0;margin:0;cursor:pointer;color:var(--ink);
  background:none;border:0;
  transition:color .12s}
.opt:hover{color:var(--green-deep)}
.opt b{font-family:var(--face);font-weight:800;font-size:14px;
  letter-spacing:.04em;color:var(--ink-soft);
  border:1.5px solid var(--rule);border-radius:50%;
  width:23px;height:23px;flex:none;display:inline-flex;
  align-items:center;justify-content:center;margin:0;
  transition:border-color .12s,background .12s,color .12s;
  position:relative}   /* `top` is set by snapToRules, never hard-coded */
.opt:hover b{border-color:var(--green-deep);background:var(--green-deep);color:var(--paper)}
/* The hover underline is painted as a background, not a border.
   As a border it added 2px to the span — and the span is a FLEX ITEM, so
   that 2px became real height: the options sat 30px apart against a 28px
   ruling. They drifted 2px per row, the snapper's correction grew -9, -11,
   -13, and on the fourth it crossed the half-band boundary and flipped to
   +13, dropping option D a whole line below C. A background underline costs
   no layout, so the rhythm stays exact. */
.opt span{
  background-image:linear-gradient(var(--green-deep),var(--green-deep));
  background-repeat:no-repeat;
  background-position:0 100%;
  background-size:0 2px;
  transition:background-size .14s}
.opt:hover span{background-size:100% 2px}

/* ---------- result ---------- */
.level-card{margin:var(--line) 0;padding:0;
  border:0;border-bottom:3px double var(--green-deep);background:none;
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.level-big{font-family:var(--face);font-size:46px;line-height:calc(var(--line)*3);
  color:var(--green-deep)}
.level-sub{font-family:var(--face);font-weight:var(--weight);letter-spacing:.05em;
  text-transform:uppercase;font-size:12.5px;line-height:var(--line);color:var(--ink-soft)}
.entry{background:none;border-left:4px solid var(--gold);
  padding:0 0 0 16px;margin:var(--line) 0}
.entry b{display:block;font-family:var(--face);font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;font-size:15px;line-height:var(--line);color:var(--green-deep)}
.entry span{font-size:15px;line-height:var(--line);font-weight:var(--weight);color:var(--ink)}

.sec-h{font-family:var(--face);font-weight:800;font-size:12.5px;
  letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;
  line-height:var(--line);margin:var(--line) 0 0;
  padding-bottom:0;border-bottom:1px solid var(--rule)}

/* marked answers — red pen and green pen */
.rev{border-left:3px solid var(--rule);padding:0 0 0 15px;margin-bottom:var(--line)}
.rev.ok{border-color:var(--pen-green)}
.rev.no{border-color:var(--pen-red)}
.rev-q{font-family:var(--face);font-weight:var(--weight);font-size:16px;line-height:var(--line);margin-bottom:0}
.rev-a{font-family:var(--face);font-weight:700;letter-spacing:.04em;
  font-size:14px;line-height:var(--line);color:var(--ink-soft);margin-bottom:0}
.rev-a i{font-style:normal;color:var(--pen-green)}
.rev-a s{color:var(--pen-red)}
.rev-x{font-size:15px;line-height:var(--line);font-weight:var(--weight);color:var(--ink-soft);max-width:58ch}
.rev-x strong{color:var(--ink);font-weight:700}
.code{font-family:var(--face);font-weight:700;font-size:11.5px;
  letter-spacing:.08em;padding:1px 6px;border:1px solid var(--rule);
  color:var(--ink-soft);margin-left:6px;white-space:nowrap}

.gaps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:var(--line)}
.gap{font-family:var(--face);font-weight:700;letter-spacing:.08em;
  font-size:12.5px;line-height:calc(var(--line) - 8px);padding:3px 10px;
  border:1.5px solid var(--pen-red);color:var(--pen-red)}
.gap.strong{border-color:var(--pen-green);color:var(--pen-green)}

/* Every block the snapper touches needs a positioning context. `top` is
   used rather than `transform` so the .opt hover transform is not clobbered.
   Both are paint-only — neither reflows, so the rhythm below is untouched. */
/* This list MUST stay identical to SNAP in the script below. It was not,
   and the mismatch was silent: the snapper set `top` on h1, .btn and the
   logo sub, none of which were positioned, so the value was computed and
   thrown away. Nothing errors when that happens — the text just sits
   fractionally off the rule and looks like a rounding problem. */
.fe-logo-sub,h1,.lede,.meta,.btn,.band-tag,.stem,.opt,.level-big,.level-sub,
.entry b,.entry span,.sec-h,.rev-q,.rev-a,.rev-x,.gap{position:relative}

/* it is a paper test — let it print like one */
@media print{
  body{background-image:none}
  .btn{display:none}
  .wrap{padding-left:24px;max-width:none}
}

/* ---------- site top band ----------
   Lifted from index.html so the checker is part of the site rather than a
   page that happens to live at the same domain. It is deliberately OUTSIDE
   .wrap and carries no ruling: the paper starts below it. */
.topband{background:var(--green-deep);border-bottom:1px solid rgba(232,192,74,.25)}
.tb-inner{max-width:1180px;margin:0 auto;padding:8px clamp(18px,4vw,40px);
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
/* The stacked lockup, lifted from ielts.html — NOT the PNG.
   logo-forbes-english_1.png is a dark image (dominant inks #45413e and
   #183d6a) and this band is --green-deep #14301f, so it renders as a faint
   smudge; its 1.92 aspect inside a 5.0 box also makes `contain` shrink it to
   about 40% of the width. That exact defect was found and fixed on the IELTS
   pages on 2026-08-28 and written up in
   claude/ielts-top-band-logo-and-academic-labelling.md, which ends by noting
   the PNG should be referenced by no top band. This page reintroduced it by
   copying an older band. It does not use the PNG any more.
   No id="fe-logo-svg" here: the masthead below owns that id and it drives
   matchLogoSubWidth(). A duplicate would break both. */
.tb-logo{display:block;text-decoration:none;line-height:1;flex:none;
  color:var(--paper);font-size:26px}
.tb-logo-mark{display:block;width:2.93em;height:auto}
.tb-logo-sub{display:block;font-family:var(--face);font-weight:var(--weight);
  font-size:.385em;letter-spacing:.562em;margin:.13em -.562em 0 0;white-space:nowrap}
/* Tracking derived the way the IELTS write-up prescribes: render at 0, measure
   the INK of each line from a 4x screenshot column by column, then
   letter-spacing = (markInk - subInk) / (chars - 1)  ->  six gaps for the
   seven letters of ENGLISH. Measured 299px vs 164px at 4x = 5.63px at 1x
   against a 10.01px sub = .562em. The negative right margin cancels the gap
   CSS also adds after the LAST letter, or the block runs one gap long. */
.tb-links{display:flex;align-items:center;gap:clamp(10px,2vw,22px);flex-wrap:wrap}
/* The nav is site chrome, not page content, so it does NOT take --face.
   Courier is a wide monospace: five links in it made this band 58px where
   ielts.html is 52.2, and wrapped to 110px at 430 and 148px at 360 against
   their 52.2 and 86. A narrow system sans costs no fetch and brings the band
   back in line with the rest of the site. The lockup keeps Courier, because
   its tracking was measured against Courier ink. */
.tb-links a{font-family:'Arial Narrow','Helvetica Neue Condensed',
  'Liberation Sans Narrow',Arial,sans-serif;
  font-weight:700;letter-spacing:.06em;
  font-size:12.5px;text-transform:uppercase;color:var(--paper);
  text-decoration:none;opacity:.88}
.tb-links a:hover{opacity:1;color:var(--gold-bright)}
.tb-cta-gold{background:var(--gold-bright);color:var(--green-deep) !important;
  padding:4px 12px;border-radius:20px;opacity:1 !important}
.tb-cta-gold:hover{background:var(--gold);color:var(--green-deep) !important}
@media (max-width:560px){ .tb-nav-sub{display:none} }
/* Below 620 the plain links collapse and only the CTA stays, matching
   ielts.html. The selector must exempt BOTH cta classes: `:not(.tb-cta)`
   alone does not cover `tb-cta-gold`, and that exact omission is what hid
   Go Pro from every phone user and blocked the whole mobile checkout path
   — claude/signup-funnel-mobile-gap.md. The logo still links home, so
   there is a way back even with the links hidden. */
@media (max-width:620px){
  .tb-links a:not(.tb-cta):not(.tb-cta-gold){display:none}
}
</style>
</head>

/* ---------- load-time integrity gate ---------- */
function assertBank(){
  const known = new Set();
  Object.values(Q).flat().forEach(q => known.add(q.code));
  let fails = 0;
  Object.keys(Q).forEach(band => {
    if (Q[band].length < PER_RUN){ console.error('Band too small:', band); fails++; }
    Q[band].forEach(q => {
      const key = q.o[0];
      const longest = Math.max(...q.o.slice(1).map(s => s.length));
      if (key.length > longest * 1.10 && key.length >= longest + 4){
        console.error('ANSWERS: key is conspicuously longest —', band, '|', key, '|', q.o); fails++;
      }
      if (q.o.length !== 4){ console.error('Not 4 options:', q.s); fails++; }
      if (new Set(q.o).size !== 4){ console.error('Duplicate option:', q.s); fails++; }
      if (!q.x || q.x.length < 20){ console.error('Weak explanation:', q.s); fails++; }
      if (!q.code){ console.error('No subgroup code:', q.s); fails++; }
    });
  });
  const total = Object.values(Q).reduce((n,a) => n + a.length, 0);
  console.log(fails
    ? '%cBANK: ' + fails + ' failure(s)'
    : '%cBANK: clean — ' + total + ' questions, ' + known.size + ' subgroup codes',
    'color:' + (fails ? '#e2705a' : '#6fc3a0'));
}

      while you are getting things right and stops the moment it knows where

function start(){
  bandIdx = START_BAND; qIdx = 0; bandScore = 0;
  asked = []; floor = -1; settled = null;
  paper = drawPaper(BANDS[bandIdx]);
  ask();
}

function ask(){
  const band = BANDS[bandIdx];
  const q = paper[qIdx];
  const order = shuffle(q.o.map((text, i) => ({text, ok: i === 0})));
  const pips = Array.from({length: PER_RUN}, (_,i) =>
    `<div class="pip ${i < qIdx ? 'on' : ''}"></div>`).join('');

  app.innerHTML = `
    <div class="band-tag"><span>Testing level <b>${band}</b></span>
      <span>${asked.length} answered</span></div>
    <div class="bar">${pips}</div>
    <p class="stem">${q.s}</p>
    <div class="opts">${order.map((o,i) =>
      `<button class="opt" data-ok="${o.ok}" data-text="${o.text.replace(/"/g,'&quot;')}">
         <b>${'ABCD'[i]}</b><span>${o.text}</span></button>`).join('')}</div>`;

  app.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
    const ok = btn.dataset.ok === 'true';
    asked.push({band, q, chose: btn.dataset.text, ok});
    if (ok) bandScore++;
    qIdx++;
    if (qIdx < PER_RUN) ask(); else endBand();
  });
  snapToRules();
}

/* Three rules, and it always terminates:
     pass -> this band becomes the floor; climb, or settle if already at C1
     fail -> settle at the floor if one exists; else step DOWN and retest;
             failing A1 itself settles at pre-A1                            */
function endBand(){
  const passed = bandScore >= PASS_MARK;

  if (passed){
    floor = bandIdx;
    if (bandIdx === BANDS.length - 1){ settled = 'C1'; return results(); }
    bandIdx++;
  } else {
    if (floor >= 0){ settled = BANDS[floor]; return results(); }
    if (bandIdx === 0){ settled = 'pre-A1'; return results(); }
    bandIdx--;
  }

  qIdx = 0; bandScore = 0;
  paper = drawPaper(BANDS[bandIdx]);
  ask();
}

/* ============================================================
   snapToRules — put first baselines ON the ruling
   ------------------------------------------------------------
   Static nudges were tried first and thrown away: the offsets came
   out at -8px for the stem and -6px for an option, and they change
   the moment a question wraps to two lines or a band tag gets
   longer, because the blocks above stop being whole multiples of
   the 28px band. A number baked into the CSS is only ever right
   for one question.

   So it is measured per render instead. For each text block:
     baseline = elementTop + halfLeading + ascent
     halfLeading = (lineHeight - (ascent + descent)) / 2
   Ascent and descent come from the canvas metrics for that
   element's OWN font, because Lato, Playfair and Barlow do not
   share a ratio and assuming they do is what makes this look
   almost-right.

   The correction is applied as `top`, not `transform`: .opt uses
   transform for its hover slide and would fight it. Both are
   paint-only, so nothing below moves.
   ============================================================ */
/* Lifted from index.html. The ENGLISH sub is letter-spaced at runtime so it
   measures exactly as wide as the Forbes wordmark beside it — a fixed em
   value is wrong at every viewport because the SVG scales with clamp(). */
function matchLogoSubWidth(){
  const svg = app.querySelector('#fe-logo-svg');
  const sub = app.querySelector('#fe-logo-sub');
  if (!svg || !sub) return;
  sub.style.letterSpacing = '0px';
  const target = svg.getBoundingClientRect().width;
  const natural = sub.getBoundingClientRect().width;
  const chars = sub.textContent.length;
  if (chars > 1 && natural > 0 && target > natural) {
    /* (chars - 1) is right for the INK: the last letter's trailing gap is
       empty, so the visible run ends flush with the wordmark. But CSS still
       adds that trailing gap to the element's BOX, leaving it one gap wider
       than the mark — which is what made the measured sub 234px against a
       208px logo and looked like the matcher had failed. Pull the box back
       by exactly that gap so ink and box both land on 208. */
    const gap = (target - natural) / (chars - 1);
    sub.style.letterSpacing = gap + 'px';
    sub.style.marginRight = (-gap) + 'px';
  }
}

const SNAP = ['.fe-logo-sub','h1','.lede','.meta','.btn','.band-tag','.stem','.opt',
              '.level-big','.level-sub','.entry b','.entry span','.sec-h',
              '.rev-q','.rev-a','.rev-x','.gap'];
const _fontCtx = document.createElement('canvas').getContext('2d');

function snapToRules(){
  matchLogoSubWidth();
  const cssLine = parseFloat(getComputedStyle(document.documentElement)
                    .getPropertyValue('--line')) || 28;

  /* THE RULING FOLLOWS THE TEXT, not the other way round.
     --baseline used to be a hard-coded 19.5px. That is correct for Lato at
     16/28 at exactly 100% zoom and wrong everywhere else: the ruling is a
     repeating background gradient, which the browser rasterises to DEVICE
     pixels, so at 110% or 125% the rule pitch rounds while the text does
     not, and the two walk apart down the page. It looked right at one zoom
     level by coincidence, which is the worst kind of right.

     So the offset is measured from the body's own font at whatever size it
     is actually rendering, and the ruling is then positioned to meet it.
     One measurement drives both, so any rounding hits both equally. */
  const bs = getComputedStyle(document.body);
  _fontCtx.font = `${bs.fontStyle} ${bs.fontWeight} ${bs.fontSize} ${bs.fontFamily}`;
  const bm = _fontCtx.measureText('Hxg');
  const bAsc = bm.fontBoundingBoxAscent || bm.actualBoundingBoxAscent;
  const bDesc = bm.fontBoundingBoxDescent || bm.actualBoundingBoxDescent;
  const target = bAsc ? (cssLine - (bAsc + bDesc)) / 2 + bAsc : 19.5;

  /* Move the ruling so a rule sits exactly on that baseline. The gradient
     draws its line in the final 1px of each band, i.e. at cssLine - 1. */
  document.body.style.backgroundPosition = `0 0, 0 ${(target - (cssLine - 1)).toFixed(2)}px`;

  /* The wordmark is a graphic, so it has no font metrics to measure. But
     "Forbes" has no descender, which means the bottom of its ink IS its
     baseline (bar ~1% optical overshoot on o/e/s). Measuring the inner <g>
     gives that ink box in screen pixels.
     This is why the logo only looked right at one zoom level: its width is
     clamp(150px, 17vw, 208px), so its auto height is a fraction that changes
     with every zoom step, and nothing was ever correcting it. At 175% the
     fraction happened to land on a rule. */
  const mark = app.querySelector('#fe-logo-svg');
  if (mark) {
    mark.style.top = '';
    const ink = mark.querySelector('g');
    if (ink) {
      const inkBottom = ink.getBoundingClientRect().bottom + window.scrollY;
      let off = ((target - inkBottom) % cssLine + cssLine) % cssLine;
      if (off > cssLine / 2) off -= cssLine;
      mark.style.top = off.toFixed(2) + 'px';
    }
  }

  app.querySelectorAll(SNAP.join(',')).forEach(el => {
    el.style.top = '';                       // measure unshifted
    const cs = getComputedStyle(el);
    _fontCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = _fontCtx.measureText('Hxg');
    const asc  = m.fontBoundingBoxAscent  || m.actualBoundingBoxAscent;
    const desc = m.fontBoundingBoxDescent || m.actualBoundingBoxDescent;
    if (!asc) return;
    const lh   = parseFloat(cs.lineHeight);
    const half = (lh - (asc + desc)) / 2;
    const baseline = el.getBoundingClientRect().top + window.scrollY + half + asc;

    let off = ((target - baseline) % cssLine + cssLine) % cssLine;
    if (off > cssLine / 2) off -= cssLine;    // nearest rule, up or down
    el.style.top = off.toFixed(2) + 'px';

    /* The A/B/C/D disc is an inline-flex box, so its own baseline is the box,
       not the letter inside it — which is why it floated off the rule while
       the answer text sat on it. Put the LETTER's baseline on the same rule
       as the answer beside it and the disc draws itself around that.
       Previously this was `top: 4px`, picked by eye, and it was wrong at
       every zoom level. */
    const disc = el.matches('.opt') ? el.querySelector('b') : null;
    if (disc) {
      disc.style.top = '';
      const ds = getComputedStyle(disc);
      _fontCtx.font = `${ds.fontStyle} ${ds.fontWeight} ${ds.fontSize} ${ds.fontFamily}`;
      const dm = _fontCtx.measureText('A');
      const da = dm.fontBoundingBoxAscent, dd = dm.fontBoundingBoxDescent;
      if (da) {
        const r = disc.getBoundingClientRect();
        const letterBaseline = r.top + window.scrollY + (r.height - (da + dd)) / 2 + da;
        let doff = ((target - letterBaseline) % cssLine + cssLine) % cssLine;
        if (doff > cssLine / 2) doff -= cssLine;
        disc.style.top = doff.toFixed(2) + 'px';
      }
    }
  });
}
/* Catches the defect class that produced the option-D jump: if two siblings
   are not a whole number of bands apart they drift, and the snapper masks it
   until the drift crosses the half-band boundary and jumps a full line — so
   the snap ends up hiding a layout bug rather than correcting a rounding
   one. This shouts instead. */
function assertRhythm(){
  const line = parseFloat(getComputedStyle(document.documentElement)
                 .getPropertyValue('--line')) || 28;
  ['.opts .opt'].forEach(sel => {
    const els = [...app.querySelectorAll(sel)];
    for (let i = 1; i < els.length; i++) {
      const prev = els[i-1], cur = els[i];
      const gap = (cur.getBoundingClientRect().top - parseFloat(cur.style.top || 0))
                - (prev.getBoundingClientRect().top - parseFloat(prev.style.top || 0));
      const off = Math.abs(gap % line);
      if (off > 0.5 && off < line - 0.5)
        console.error('RHYTHM: ' + sel + ' siblings ' + gap.toFixed(2) +
                      'px apart, not a multiple of ' + line);
    }
  });
}

/* Fonts land after first paint and change every metric above. */
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { snapToRules(); assertRhythm(); });
window.addEventListener('resize', () => requestAnimationFrame(snapToRules));

intro();
})();
