<title>LEGO Prepositions &amp; Phrasal Verbs — Part 2 (B2) | Forbes English</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lego-red:#DA291C;--lego-red-dark:#A01A10;
    --lego-yellow:#FFD700;--lego-yellow-dark:#C8A800;
    --lego-blue:#006DB7;--lego-blue-dark:#00336F;
    --lego-green:#00A650;--lego-green-dark:#006030;
    --lego-orange:#F47B20;--lego-orange-dark:#C05A00;
    --lego-purple:#6B2D8B;--lego-purple-dark:#4A1A66;
    --lego-teal:#008080;--lego-teal-dark:#005050;
    --bg:#FFF8E7;--card:#FFFFFF;--text:#1C1C1B;--text-mid:#4A4A48;--text-light:#888880;
    --border:#DDD8C8;--border-bottom:#C8C0A8;--shadow:rgba(0,0,51,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 10% 15%,rgba(107,45,139,.07) 0%,transparent 45%),radial-gradient(circle at 90% 85%,rgba(0,128,128,.07) 0%,transparent 45%),radial-gradient(circle at 50% 50%,rgba(255,215,0,.04) 0%,transparent 60%);pointer-events:none;z-index:0;}

  /* ── HEADER ── */
  header{background:var(--lego-yellow);border-bottom:4px solid var(--lego-yellow-dark);padding:0 36px;position:sticky;top:0;z-index:100;display:flex;align-items:stretch;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,51,.18);}
  .header-left{display:flex;align-items:center;gap:18px;padding:14px 0;}
  .part-badge{background:var(--lego-purple);color:#fff;font-family:'Nunito',sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:6px;border-bottom:3px solid var(--lego-purple-dark);}
  #score-board{display:flex;align-items:center;gap:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--lego-blue-dark);}
  .score-pill{background:var(--lego-purple);color:#fff;padding:7px 20px;border-radius:6px;font-weight:900;font-size:15px;min-width:80px;text-align:center;border-bottom:3px solid var(--lego-purple-dark);letter-spacing:.5px;font-family:'Nunito',sans-serif;}

  /* ── PROGRESS ── */
  .progress-wrap{padding:16px 36px 0;max-width:940px;margin:0 auto;position:relative;z-index:1;}
  .progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-light);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-family:'Nunito',sans-serif;}
  .progress-bar{height:10px;background:#DDD8C8;border-radius:5px;overflow:hidden;border-bottom:2px solid #C8C0A8;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--lego-purple) 0%,var(--lego-teal) 100%);border-radius:5px 0 0 5px;transition:width .5s cubic-bezier(.4,0,.2,1);}

  /* ── MAIN ── */
  main{max-width:940px;margin:0 auto;padding:28px 36px 70px;position:relative;z-index:1;}

  /* ── TABS ── */
  .activity-tabs{display:flex;gap:6px;margin-bottom:26px;overflow-x:auto;padding-bottom:4px;}
  .tab-btn{background:var(--card);border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);border-radius:8px;padding:8px 16px;font-size:13px;font-weight:800;color:var(--text-light);cursor:pointer;white-space:nowrap;transition:all .16s;font-family:'Nunito',sans-serif;}
  .tab-btn:hover{border-color:var(--lego-purple);color:var(--lego-purple);}
  .tab-btn.active{background:var(--lego-purple);border-color:var(--lego-purple-dark);border-bottom-color:var(--lego-purple-dark);color:#fff;}
  .tab-btn.completed{border-color:var(--lego-green);color:var(--lego-green);}
  .tab-btn.completed.active{background:var(--lego-green);border-color:var(--lego-green-dark);border-bottom-color:var(--lego-green-dark);color:#fff;}

  /* ── ACTIVITY HEADER ── */
  .activity-header{display:flex;align-items:flex-start;gap:24px;margin-bottom:24px;background:var(--card);border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);border-radius:14px;padding:24px 28px;}
  .act-illustration{flex-shrink:0;}
  .act-text{flex:1;}
  .activity-tag{display:inline-block;background:var(--lego-yellow);color:var(--lego-blue-dark);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:3px 12px;border-radius:4px;border-bottom:2px solid var(--lego-yellow-dark);margin-bottom:10px;font-family:'Nunito',sans-serif;}
  .activity-title{font-family:'Nunito',sans-serif;font-size:24px;font-weight:900;color:var(--text);margin-bottom:6px;line-height:1.2;letter-spacing:-.3px;}
  .activity-subtitle{font-size:14px;color:var(--text-mid);line-height:1.55;}

  /* ── LEGO CARD ── */
  .lego-card{background:var(--card);border:2px solid var(--border);border-bottom:5px solid var(--border-bottom);border-radius:14px;overflow:hidden;margin-bottom:20px;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px var(--shadow);}
  @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .card-body{padding:28px 32px 24px;}

  /* ── QUESTION ── */
  .q-label{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);margin-bottom:12px;font-family:'Nunito',sans-serif;}
  .q-text{font-size:19px;font-weight:700;line-height:1.5;color:var(--text);margin-bottom:26px;font-family:'Nunito',sans-serif;}

  /* ── MULTIPLE CHOICE ── */
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .option-btn{background:var(--bg);border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);border-radius:10px;padding:12px 16px;text-align:left;cursor:pointer;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:var(--text);transition:all .15s;display:flex;align-items:flex-start;gap:12px;line-height:1.4;}
  .option-btn:hover:not(:disabled){border-color:var(--lego-purple);border-bottom-color:var(--lego-purple-dark);background:#F3EBF9;transform:translateY(-2px);}
  .option-btn:active:not(:disabled){transform:translateY(1px);border-bottom-width:2px;}
  .opt-letter{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-width:30px;border-radius:6px;background:var(--border);color:var(--text-mid);font-weight:900;font-size:13px;border-bottom:2px solid var(--border-bottom);transition:all .15s;}
  .option-btn:hover:not(:disabled) .opt-letter{background:var(--lego-purple);color:#fff;border-bottom-color:var(--lego-purple-dark);}
  .option-btn.correct{border-color:var(--lego-green);border-bottom-color:var(--lego-green-dark);background:#E8F8EF;}
  .option-btn.correct .opt-letter{background:var(--lego-green);color:#fff;border-bottom-color:var(--lego-green-dark);}
  .option-btn.wrong{border-color:var(--lego-red);border-bottom-color:var(--lego-red-dark);background:#FDECEA;}
  .option-btn.wrong .opt-letter{background:var(--lego-red);color:#fff;border-bottom-color:var(--lego-red-dark);}
  .option-btn:disabled{cursor:not-allowed;}

  /* ── FEEDBACK ── */
  .feedback-box{border-radius:10px;padding:14px 18px;font-size:14px;line-height:1.6;margin-top:18px;display:none;font-family:'Nunito Sans',sans-serif;animation:fadeIn .3s ease;font-weight:600;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .feedback-box.show{display:block;}
  .feedback-box.fb-correct{background:#E8F8EF;border:2px solid var(--lego-green);border-bottom:4px solid var(--lego-green-dark);color:#004020;}
  .feedback-box.fb-wrong{background:#FDECEA;border:2px solid var(--lego-red);border-bottom:4px solid var(--lego-red-dark);color:#5A0A08;}
  .feedback-box.fb-partial{background:#FFF3D0;border:2px solid var(--lego-orange);border-bottom:4px solid var(--lego-orange-dark);color:#5A3000;}
  .feedback-title{font-weight:900;font-size:15px;margin-bottom:5px;font-family:'Nunito',sans-serif;}

  /* ── FILL IN BLANK ── */
  .fitb-wrap{display:flex;flex-direction:column;gap:12px;}
  .fitb-item{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--bg);border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;transition:border-color .15s;font-family:'Nunito',sans-serif;}
  .fitb-item:focus-within{border-color:var(--lego-purple);border-bottom-color:var(--lego-purple-dark);background:#F3EBF9;}
  .fitb-item.fitb-correct{border-color:var(--lego-green);border-bottom-color:var(--lego-green-dark);background:#E8F8EF;}
  .fitb-item.fitb-wrong{border-color:var(--lego-red);border-bottom-color:var(--lego-red-dark);background:#FDECEA;}
  .fitb-num{font-size:12px;font-weight:900;color:var(--text-light);min-width:22px;font-family:'Nunito',sans-serif;}
  .fitb-input{border:none;border-bottom:3px solid var(--lego-purple);background:transparent;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;color:var(--lego-purple);outline:none;width:160px;text-align:center;padding:2px 4px;}
  .fitb-input:disabled{color:var(--text);border-color:var(--border);}
  .fitb-fb{font-size:13px;color:var(--text-light);margin-top:4px;margin-left:30px;font-weight:700;}
  .fitb-fb.fc{color:var(--lego-green);}
  .fitb-fb.fw{color:var(--lego-red);}
  .word-bank-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding:14px;background:var(--lego-yellow);border-radius:10px;border-bottom:4px solid var(--lego-yellow-dark);}
  .wb-chip{background:var(--lego-purple);color:#fff;border-radius:6px;padding:5px 13px;font-size:13px;font-weight:800;border-bottom:3px solid var(--lego-purple-dark);font-family:'Nunito',sans-serif;}

  /* ── MATCHING ── */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .match-col-title{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);margin-bottom:10px;font-family:'Nunito',sans-serif;}
  .match-list{display:flex;flex-direction:column;gap:8px;}
  .draggable-item{background:var(--lego-purple);color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:800;cursor:grab;user-select:none;border-bottom:4px solid var(--lego-purple-dark);font-family:'Nunito',sans-serif;transition:all .15s;}
  .draggable-item:active{cursor:grabbing;transform:scale(1.04) rotate(-1deg);}
  .draggable-item.dragging{opacity:.4;}
  .draggable-item.matched{background:var(--lego-green);border-bottom-color:var(--lego-green-dark);cursor:default;}
  .drop-target{background:var(--bg);border:2.5px dashed var(--border);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--text-light);min-height:50px;transition:all .15s;font-family:'Nunito',sans-serif;}
  .drop-target.drag-over{border-color:var(--lego-orange);background:#FFF3D0;}
  .drop-target.filled{border-style:solid;border-color:var(--lego-green);background:#E8F8EF;}
  .drop-target.match-correct{border-color:var(--lego-green);background:#E8F8EF;}
  .drop-target.match-wrong{border-color:var(--lego-red);background:#FDECEA;}
  .drop-target .def-text{color:var(--text);line-height:1.4;}
  .drop-target .dropped-lbl{font-weight:900;font-size:14px;color:var(--lego-green);margin-bottom:3px;font-family:'Nunito',sans-serif;}

  /* ── REORDER ── */
  .ro-drop-area{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:var(--bg);border:2.5px dashed var(--border);border-radius:10px;min-height:56px;margin-bottom:12px;transition:border-color .15s;}
  .ro-drop-area.drag-over{border-color:var(--lego-orange);background:#FFF3D0;}
  .ro-bank{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:#E8E4D9;border-radius:10px;border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);min-height:56px;}
  .ro-zone-label{font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light);margin-bottom:6px;font-family:'Nunito',sans-serif;}
  .word-chip{background:var(--lego-teal);color:#fff;border-radius:7px;padding:7px 15px;font-size:14px;font-weight:800;cursor:grab;user-select:none;border-bottom:3px solid var(--lego-teal-dark);font-family:'Nunito',sans-serif;transition:all .15s;}
  .word-chip:active{cursor:grabbing;transform:scale(1.06) rotate(1deg);}
  .word-chip.in-answer{background:var(--lego-orange);border-bottom-color:var(--lego-orange-dark);}

  /* ── TRUE / FALSE ── */
  .tf-list{display:flex;flex-direction:column;gap:16px;}
  .tf-item{background:var(--bg);border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);border-radius:12px;padding:18px 20px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;transition:border-color .15s;}
  .tf-item.tf-correct{border-color:var(--lego-green);border-bottom-color:var(--lego-green-dark);background:#E8F8EF;}
  .tf-item.tf-wrong{border-color:var(--lego-red);border-bottom-color:var(--lego-red-dark);background:#FDECEA;}
  .tf-sentence{margin-bottom:14px;line-height:1.5;color:var(--text);}
  .tf-underlined{text-decoration:underline;text-decoration-color:var(--lego-purple);text-underline-offset:3px;font-weight:900;}
  .tf-btn-row{display:flex;gap:10px;}
  .tf-btn{flex:1;padding:10px 16px;border-radius:8px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:all .15s;border:2px solid;border-bottom-width:4px;}
  .tf-btn.true-btn{background:var(--bg);color:var(--lego-green);border-color:var(--lego-green);border-bottom-color:var(--lego-green-dark);}
  .tf-btn.true-btn:hover:not(:disabled){background:var(--lego-green);color:#fff;}
  .tf-btn.false-btn{background:var(--bg);color:var(--lego-red);border-color:var(--lego-red);border-bottom-color:var(--lego-red-dark);}
  .tf-btn.false-btn:hover:not(:disabled){background:var(--lego-red);color:#fff;}
  .tf-btn.selected-true{background:var(--lego-green);color:#fff;}
  .tf-btn.selected-false{background:var(--lego-red);color:#fff;}
  .tf-btn:disabled{cursor:not-allowed;opacity:.6;}
  .tf-feedback{margin-top:12px;font-size:13px;font-weight:700;display:none;padding:10px 14px;border-radius:8px;font-family:'Nunito',sans-serif;}
  .tf-feedback.show{display:block;}
  .tf-feedback.tf-fb-ok{background:#E8F8EF;color:#004020;border:1.5px solid var(--lego-green);}
  .tf-feedback.tf-fb-no{background:#FDECEA;color:#5A0A08;border:1.5px solid var(--lego-red);}

  /* ── ERROR CORRECTION ── */
  .ec-list{display:flex;flex-direction:column;gap:16px;}
  .ec-item{background:var(--bg);border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);border-radius:12px;padding:18px 20px;font-family:'Nunito',sans-serif;}
  .ec-item.ec-correct{border-color:var(--lego-green);border-bottom-color:var(--lego-green-dark);background:#E8F8EF;}
  .ec-item.ec-wrong{border-color:var(--lego-red);border-bottom-color:var(--lego-red-dark);background:#FDECEA;}
  .ec-sentence{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:14px;color:var(--text);}
  .ec-wrong-word{color:var(--lego-red);text-decoration:line-through;font-weight:900;}
  .ec-options{display:flex;flex-direction:column;gap:8px;}
  .ec-opt{background:var(--card);border:2px solid var(--border);border-bottom:3px solid var(--border-bottom);border-radius:8px;padding:9px 16px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:var(--text);transition:all .15s;display:flex;align-items:center;gap:10px;}
  .ec-opt:hover:not(:disabled){border-color:var(--lego-teal);background:#E0F4F4;color:var(--lego-teal-dark);}
  .ec-opt.ec-opt-correct{border-color:var(--lego-green);background:#E8F8EF;color:var(--lego-green-dark);}
  .ec-opt.ec-opt-wrong{border-color:var(--lego-red);background:#FDECEA;color:var(--lego-red-dark);}
  .ec-opt:disabled{cursor:not-allowed;}
  .ec-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;min-width:26px;border-radius:5px;background:var(--border);color:var(--text-mid);font-size:12px;font-weight:900;border-bottom:2px solid var(--border-bottom);}
  .ec-feedback{margin-top:12px;font-size:13px;font-weight:700;display:none;padding:10px 14px;border-radius:8px;font-family:'Nunito',sans-serif;}
  .ec-feedback.show{display:block;}
  .ec-feedback.ec-fb-ok{background:#E8F8EF;color:#004020;border:1.5px solid var(--lego-green);}
  .ec-feedback.ec-fb-no{background:#FDECEA;color:#5A0A08;border:1.5px solid var(--lego-red);}

  /* ── BUTTONS ── */
  .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .btn-primary{background:var(--lego-purple);color:#fff;border:none;border-radius:9px;padding:12px 28px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;cursor:pointer;transition:all .15s;border-bottom:4px solid var(--lego-purple-dark);}
  .btn-primary:hover{background:#5A2078;transform:translateY(-2px);}
  .btn-primary:active{transform:translateY(2px);border-bottom-width:2px;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-primary.hidden{display:none;}
  .btn-secondary{background:var(--card);color:var(--lego-teal);border:2px solid var(--lego-teal);border-bottom:4px solid var(--lego-teal-dark);border-radius:9px;padding:10px 22px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;cursor:pointer;transition:all .15s;}
  .btn-secondary:hover{background:var(--lego-teal);color:#fff;}

  /* ── FINAL ── */
  #final-screen{display:none;text-align:center;padding:48px 32px 60px;}
  #final-screen.show{display:block;animation:popIn .5s ease;}
  .final-title{font-family:'Nunito',sans-serif;font-size:36px;font-weight:900;color:var(--text);margin-bottom:10px;}
  .final-score-display{font-size:72px;font-weight:900;font-family:'Nunito',sans-serif;color:var(--lego-purple);line-height:1;margin:16px 0 4px;}
  .final-message{font-size:16px;color:var(--text-mid);max-width:500px;margin:20px auto 36px;line-height:1.6;font-weight:600;}
  .final-breakdown{display:flex;justify-content:center;gap:16px;margin-bottom:36px;flex-wrap:wrap;}
  .breakdown-pill{background:var(--card);border:2px solid var(--border);border-bottom:4px solid var(--border-bottom);border-radius:12px;padding:12px 22px;text-align:center;min-width:110px;}
  .bp-num{font-family:'Nunito',sans-serif;font-size:28px;font-weight:900;color:var(--lego-purple);}

  .hero-band{width:170px;margin:20px auto 0;border-radius:14px;overflow:hidden;border:2px solid var(--border);border-bottom:5px solid var(--border-bottom);box-shadow:0 4px 20px var(--shadow);aspect-ratio:1/1;position:relative;z-index:1;}
  .hero-band img{width:100%;height:100%;object-fit:cover;}
  @media(max-width:640px){.hero-band{margin:14px auto 0;}}

// ── STUD STRIP ───────────────────────────────────────────────────────────────
const LIGHT={'#6B2D8B':'#7D3AA8','#008080':'#009A9A','#DA291C':'#E84030','#00A650':'#00B860','#F47B20':'#FF9040','#FFD700':'#FFE840'};
const DARK= {'#6B2D8B':'#4A1A66','#008080':'#005050','#DA291C':'#A01A10','#00A650':'#006030','#F47B20':'#C05A00','#FFD700':'#C8A800'};
function lt(c){return LIGHT[c]||c;} function dk(c){return DARK[c]||c;}
function studStrip(color){
  const s=Array.from({length:14},(_,i)=>`
    <ellipse cx="${i*9+10}" cy="7" rx="4.5" ry="2.5" fill="${lt(color)}" stroke="${dk(color)}" stroke-width=".6"/>
    <ellipse cx="${i*9+10}" cy="5" rx="4.5" ry="2.5" fill="${color}" stroke="${dk(color)}" stroke-width=".6"/>
  `).join('');
  return `<svg width="100%" height="14" style="display:block;overflow:visible;" viewBox="0 0 130 14" preserveAspectRatio="xMidYMid meet"><rect x="0" y="7" width="130" height="7" fill="${color}"/>${s}</svg>`;
}
function makeCard(color,body){
  return `<div class="lego-card"><div style="line-height:0">${studStrip(color)}</div><div class="card-body">${body}</div></div>`;
}
function hdr(act){
  return `<div class="activity-header"><div class="act-illustration">${SVG[act.id]}</div><div class="act-text"><div class="activity-tag">${act.tag}</div><div class="activity-title">${act.title}</div><div class="activity-subtitle">${act.subtitle}</div></div></div>`;
}

// ══ STATE ══════════════════════════════════════════════════════════════════════
let S = {};

function init(){
  S = {
    cur:0, scores:[0,0,0,0,0], totals:[0,0,0,0,0],
    mcIdx:0, mcDone:false, mcShuffled:{},
    fitbDone:false,
    tfSubmitted:false,
    matchDone:false, matchDropped:{},
    ecIdx:0, ecDone:false, ecShuffled:{},
    roStates:[],
  };
  activities.forEach((a,i)=>{
    S.totals[i] = a.type==='matching'?a.pairs.length:(a.questions||[]).length;
  });
  document.getElementById('final-screen').classList.remove('show');
  document.getElementById('activities-wrap').style.display='block';
  render(); updateScore(); updateProgress();
}

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function norm(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }

function updateScore(){
  const t=S.scores.reduce((a,b)=>a+b,0), m=S.totals.reduce((a,b)=>a+b,0);
  document.getElementById('total-score').textContent=`${t} / ${m}`;
}

function updateProgress(){
  const act=activities[S.cur]; let qLbl='', pct=0;
  if(act.type==='multiple-choice'){ qLbl=`Q ${Math.min(S.mcIdx+1,act.questions.length)} of ${act.questions.length}`; pct=(S.mcIdx/act.questions.length)*100; }
  else if(act.type==='fill-blank'){ qLbl=`${act.questions.length} blanks`; pct=S.fitbDone?100:0; }
  else if(act.type==='true-false'){ qLbl=`${act.questions.length} statements`; pct=S.tfSubmitted?100:0; }
  else if(act.type==='matching'){ const f=Object.keys(S.matchDropped).length; qLbl=`${f} of ${act.pairs.length} matched`; pct=(f/act.pairs.length)*100; }
  else if(act.type==='error-correction'){ qLbl=`Q ${Math.min(S.ecIdx+1,act.questions.length)} of ${act.questions.length}`; pct=(S.ecIdx/act.questions.length)*100; }
  document.getElementById('progress-label').textContent=`Activity ${S.cur+1} of ${activities.length}`;
  document.getElementById('question-label').textContent=qLbl;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{ b.className='tab-btn'; if(i===S.cur) b.classList.add('active'); if(i<S.cur) b.classList.add('completed'); });
}

function render(){
  const act=activities[S.cur]; const W=document.getElementById('activities-wrap');
  if(act.type==='multiple-choice') rMC(act,W);
  else if(act.type==='fill-blank') rFITB(act,W);
  else if(act.type==='true-false') rTF(act,W);
  else if(act.type==='matching') rMatch(act,W);
  else if(act.type==='error-correction') rEC(act,W);
}

// ══ ACTIVITY 1: MULTIPLE CHOICE ═══════════════════════════════════════════════
function rMC(act,W){
  if(S.mcIdx>=act.questions.length){ advance(); return; }
  const q=act.questions[S.mcIdx]; S.mcDone=false;
  if(!S.mcShuffled[S.mcIdx]){
    const order=shuffle(q.options.map((_,i)=>i));
    S.mcShuffled[S.mcIdx]={ order, newCorrect: order.indexOf(q.correct) };
  }
  const {order, newCorrect}=S.mcShuffled[S.mcIdx];
  const L=['A','B','C','D'];
  const opts=order.map((origIdx,pos)=>`<button class="option-btn" id="opt-${pos}" onclick="selMC(${pos})"><span class="opt-letter">${L[pos]}</span><span>${q.options[origIdx]}</span></button>`).join('');
  W.innerHTML=hdr(act)+makeCard(act.color,`
    <div class="q-label">Question ${S.mcIdx+1} of ${act.questions.length}</div>
    <p class="q-text">${q.text}</p>
    <div class="options-grid">${opts}</div>
    <div class="feedback-box" id="mc-fb"></div>
  `)+`<div class="btn-row"><button class="btn-primary hidden" id="mc-nxt" onclick="nxtMC()">${S.mcIdx+1<act.questions.length?'Next Question →':'Finish Activity →'}</button></div>`;
  updateProgress();
}
function selMC(idx){
  if(S.mcDone) return; S.mcDone=true;
  const q=activities[S.cur].questions[S.mcIdx];
  const {newCorrect}=S.mcShuffled[S.mcIdx];
  const ok=idx===newCorrect;
  if(ok){ S.scores[S.cur]++; updateScore(); }
  document.querySelectorAll('.option-btn').forEach((b,i)=>{ b.disabled=true; if(i===newCorrect) b.classList.add('correct'); if(i===idx&&!ok) b.classList.add('wrong'); });
  const fb=document.getElementById('mc-fb');
  fb.className=`feedback-box show ${ok?'fb-correct':'fb-wrong'}`;
  fb.innerHTML=`<div class="feedback-title">${ok?'✅ Correct!':'❌ The answer is: '+q.options[q.correct]}</div><div>${q.explanation}</div>`;
  document.getElementById('mc-nxt').classList.remove('hidden');
  updateProgress();
}
function nxtMC(){ S.mcIdx++; if(S.mcIdx>=activities[S.cur].questions.length) advance(); else render(); }

// ══ ACTIVITY 2: FILL IN BLANK ══════════════════════════════════════════════════
function rFITB(act,W){
  const wb=act.wordBank.map(w=>`<span class="wb-chip">${w}</span>`).join('');
  const items=act.questions.map((q,i)=>`
    <div class="fitb-item" id="fitb-${i}"><span class="fitb-num">${i+1}.</span>
    <span style="font-weight:700">${q.before?q.before+'&nbsp;':''}<input class="fitb-input" id="fi-${i}" type="text" placeholder="…" autocomplete="off" spellcheck="false">&nbsp;${q.after}</span></div>
    <div class="fitb-fb" id="fb-${i}"></div>`).join('');
  W.innerHTML=hdr(act)+makeCard(act.color,`
    <div class="q-label">Word Bank</div>
    <div class="word-bank-wrap">${wb}</div>
    <div class="fitb-wrap">${items}</div>
    <div class="feedback-box" id="fitb-ov"></div>
  `)+`<div class="btn-row"><button class="btn-primary" id="fitb-chk" onclick="subFITB()">Check Answers</button><button class="btn-primary hidden" id="fitb-nxt" onclick="advance()">Finish Activity →</button></div>`;
  S.fitbDone=false; updateProgress();
}
function subFITB(){
  if(S.fitbDone) return; S.fitbDone=true;
  const act=activities[S.cur]; let correct=0;
  act.questions.forEach((q,i)=>{
    const inp=document.getElementById(`fi-${i}`); const ok=norm(inp.value)===norm(q.answer); if(ok) correct++;
    inp.disabled=true;
    document.getElementById(`fitb-${i}`).classList.add(ok?'fitb-correct':'fitb-wrong');
    const fb=document.getElementById(`fb-${i}`);
    if(ok){ fb.textContent='✅ Correct! — '+q.explanation; fb.className='fitb-fb fc'; }
    else{ fb.innerHTML=`❌ Answer: <strong>${q.answer}</strong> — ${q.explanation}`; fb.className='fitb-fb fw'; inp.value=q.answer; }
  });
  S.scores[S.cur]=correct; updateScore();
  const ov=document.getElementById('fitb-ov');
  ov.className=`feedback-box show ${correct===act.questions.length?'fb-correct':correct>2?'fb-partial':'fb-wrong'}`;
  ov.innerHTML=`<strong>You got ${correct} of ${act.questions.length} correct.</strong>`;
  document.getElementById('fitb-chk').classList.add('hidden');
  document.getElementById('fitb-nxt').classList.remove('hidden');
  updateProgress();
}

// ══ ACTIVITY 3: TRUE OR FALSE ══════════════════════════════════════════════════
function rTF(act,W){
  S.tfSubmitted=false;
  const items=act.questions.map((q,i)=>`
    <div class="tf-item" id="tf-item-${i}">
      <div class="tf-sentence">${i+1}. ${q.sentence}</div>
      <div class="tf-btn-row">
        <button class="tf-btn true-btn" id="tf-t-${i}" onclick="selTF(${i},true)">✔ True</button>
        <button class="tf-btn false-btn" id="tf-f-${i}" onclick="selTF(${i},false)">✘ False</button>
      </div>
      <div class="tf-feedback" id="tf-fb-${i}"></div>
    </div>`).join('');

  W.innerHTML=hdr(act)+makeCard(act.color,`
    <div class="q-label">Read carefully — some errors are subtle!</div>
    <div class="tf-list">${items}</div>
    <div class="feedback-box" id="tf-ov"></div>
  `)+`<div class="btn-row"><button class="btn-primary hidden" id="tf-nxt" onclick="advance()">Finish Activity →</button></div>`;
  // Track per-item answered state
  W._tfAnswered = new Array(act.questions.length).fill(false);
  updateProgress();
}

function selTF(idx, chosen){
  const act=activities[S.cur];
  const W=document.getElementById('activities-wrap');
  if(W._tfAnswered[idx]) return;
  W._tfAnswered[idx]=true;

  const q=act.questions[idx]; const ok=chosen===q.correct;
  if(ok){ S.scores[S.cur]++; updateScore(); }

  // Style buttons
  const tBtn=document.getElementById(`tf-t-${idx}`);
  const fBtn=document.getElementById(`tf-f-${idx}`);
  tBtn.disabled=true; fBtn.disabled=true;
  if(chosen){ tBtn.classList.add('selected-true'); } else{ fBtn.classList.add('selected-false'); }
  if(q.correct){ tBtn.style.background='var(--lego-green)'; tBtn.style.color='#fff'; }
  else{ fBtn.style.background='var(--lego-red)'; fBtn.style.color='#fff'; }

  // Style item
  document.getElementById(`tf-item-${idx}`).classList.add(ok?'tf-correct':'tf-wrong');

  // Feedback
  const fb=document.getElementById(`tf-fb-${idx}`);
  fb.className=`tf-feedback show ${ok?'tf-fb-ok':'tf-fb-no'}`;
  fb.innerHTML=(ok?'✅ Correct! ':'❌ Incorrect — This is '+(q.correct?'TRUE':'FALSE')+'. ')+q.explanation;

  // Show next button once all answered
  if(W._tfAnswered.every(Boolean)){
    updateProgress();
    document.getElementById('tf-nxt').classList.remove('hidden');
    const total=W._tfAnswered.length;
    const score=S.scores[S.cur];
    const ov=document.getElementById('tf-ov');
    ov.className=`feedback-box show ${score===total?'fb-correct':score>=Math.ceil(total/2)?'fb-partial':'fb-wrong'}`;
    ov.innerHTML=`<strong>You got ${score} of ${total} correct.</strong>`;
  }
}

// ══ ACTIVITY 4: MATCHING ═══════════════════════════════════════════════════════
function rMatch(act,W){
  S.matchDropped={}; S.matchDone=false;
  const sT=shuffle(act.pairs.map((_,i)=>i)); const sD=shuffle(act.pairs.map((_,i)=>i));
  const terms=sT.map(i=>`<div class="draggable-item" id="drag-${i}" draggable="true" ondragstart="mdS(event,${i})" ondragend="mdE(event)">${act.pairs[i].term}</div>`).join('');
  const defs=sD.map(i=>`<div class="drop-target" id="drop-${i}" ondragover="mdO(event)" ondragleave="mdL(event)" ondrop="mdD(event,${i})"><div class="dropped-lbl" id="dlbl-${i}" style="display:none"></div><div class="def-text">${act.pairs[i].definition}</div></div>`).join('');
  W.innerHTML=hdr(act)+makeCard(act.color,`
    <div class="match-grid">
      <div><div class="match-col-title">Expressions</div><div class="match-list">${terms}</div></div>
      <div><div class="match-col-title">Definitions</div><div class="match-list">${defs}</div></div>
    </div>
    <div class="feedback-box" id="match-fb"></div>
  `)+`<div class="btn-row"><button class="btn-primary" id="match-chk" onclick="chkMatch()" disabled>Check Matches</button><button class="btn-primary hidden" id="match-nxt" onclick="advance()">Finish Activity →</button></div>`;
  updateProgress();
}
let mdItem=null;
function mdS(e,i){ mdItem=i; setTimeout(()=>{ const el=document.getElementById(`drag-${i}`); if(el) el.classList.add('dragging'); },0); e.dataTransfer.setData('text',i); }
function mdE(){ if(mdItem!==null){ const el=document.getElementById(`drag-${mdItem}`); if(el) el.classList.remove('dragging'); } mdItem=null; }
function mdO(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function mdL(e){ e.currentTarget.classList.remove('drag-over'); }
function mdD(e,di){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(mdItem===null||S.matchDone) return;
  Object.entries(S.matchDropped).forEach(([d,t])=>{ if(parseInt(t)===mdItem){ delete S.matchDropped[d]; const pd=document.getElementById(`drop-${d}`); if(pd) pd.classList.remove('filled'); document.getElementById(`dlbl-${d}`).style.display='none'; } });
  S.matchDropped[di]=mdItem;
  document.getElementById(`drop-${di}`).classList.add('filled');
  const lbl=document.getElementById(`dlbl-${di}`); lbl.textContent=activities[S.cur].pairs[mdItem].term; lbl.style.display='block';
  document.getElementById(`drag-${mdItem}`).classList.add('matched');
  document.getElementById('match-chk').disabled=Object.keys(S.matchDropped).length<activities[S.cur].pairs.length;
  updateProgress();
}
function chkMatch(){
  if(S.matchDone) return; S.matchDone=true;
  const act=activities[S.cur]; let correct=0;
  act.pairs.forEach((_,di)=>{ const ti=S.matchDropped[di]; const ok=parseInt(ti)===di; if(ok) correct++; const dt=document.getElementById(`drop-${di}`); dt.classList.remove('filled'); dt.classList.add(ok?'match-correct':'match-wrong'); });
  S.scores[S.cur]=correct; updateScore();
  const fb=document.getElementById('match-fb');
  fb.className=`feedback-box show ${correct===act.pairs.length?'fb-correct':correct>=3?'fb-partial':'fb-wrong'}`;
  fb.innerHTML=`<strong>You matched ${correct} of ${act.pairs.length} correctly.</strong>${correct<act.pairs.length?' Incorrect pairs are highlighted in red.':' Excellent — full marks! 🎉'}`;
  document.getElementById('match-chk').classList.add('hidden');
  document.getElementById('match-nxt').classList.remove('hidden');
  document.querySelectorAll('.draggable-item').forEach(el=>el.setAttribute('draggable','false'));
  updateProgress();
}

// ══ ACTIVITY 5: ERROR CORRECTION ══════════════════════════════════════════════
function rEC(act,W){
  if(S.ecIdx>=act.questions.length){ advance(); return; }
  const q=act.questions[S.ecIdx]; S.ecDone=false;
  if(!S.ecShuffled[S.ecIdx]){
    const order=shuffle(q.options.map((_,i)=>i));
    S.ecShuffled[S.ecIdx]={ order, newCorrect: order.indexOf(q.correct) };
  }
  const {order, newCorrect}=S.ecShuffled[S.ecIdx];
  const L=['A','B','C','D'];
  const opts=order.map((origIdx,pos)=>`<button class="ec-opt" id="eco-${pos}" onclick="selEC(${pos})"><span class="ec-badge">${L[pos]}</span><span>${q.options[origIdx]}</span></button>`).join('');
  W.innerHTML=hdr(act)+makeCard(act.color,`
    <div class="q-label">Question ${S.ecIdx+1} of ${act.questions.length} — find the correct replacement for the <span style="color:var(--lego-red);text-decoration:line-through;">crossed-out</span> word</div>
    <p class="q-text" style="font-size:17px;">${q.sentence}</p>
    <div class="ec-list"><div class="ec-item" id="ec-item"><div class="ec-options" id="ec-opts">${opts}</div><div class="ec-feedback" id="ec-fb"></div></div></div>
  `)+`<div class="btn-row"><button class="btn-primary hidden" id="ec-nxt" onclick="nxtEC()">${S.ecIdx+1<act.questions.length?'Next Question →':'See Results →'}</button></div>`;
  updateProgress();
}
function selEC(idx){
  if(S.ecDone) return; S.ecDone=true;
  const q=activities[S.cur].questions[S.ecIdx];
  const {order, newCorrect}=S.ecShuffled[S.ecIdx];
  const ok=idx===newCorrect;
  if(ok){ S.scores[S.cur]++; updateScore(); }
  document.querySelectorAll('.ec-opt').forEach((b,i)=>{ b.disabled=true; if(i===newCorrect) b.classList.add('ec-opt-correct'); if(i===idx&&!ok) b.classList.add('ec-opt-wrong'); });
  const fb=document.getElementById('ec-fb');
  fb.className=`ec-feedback show ${ok?'ec-fb-ok':'ec-fb-no'}`;
  fb.innerHTML=(ok?'✅ Correct! ':'❌ The correction is: <strong>'+q.options[q.correct]+'</strong>. ')+q.explanation;
  document.getElementById('ec-nxt').classList.remove('hidden');
  updateProgress();
}
function nxtEC(){ S.ecIdx++; S.ecDone=false; if(S.ecIdx>=activities[S.cur].questions.length) advance(); else render(); }

// ══ NAV & FINAL ════════════════════════════════════════════════════════════════
function advance(){ if(S.cur>=activities.length-1) showFinal(); else{ S.cur++; S.mcIdx=0; S.mcDone=false; S.mcShuffled={}; S.fitbDone=false; S.tfSubmitted=false; S.matchDone=false; S.ecIdx=0; S.ecDone=false; S.ecShuffled={}; render(); updateProgress(); } }
function goToActivity(i){ S.cur=i; render(); updateProgress(); }

function showFinal(){
  document.getElementById('activities-wrap').style.display='none';
  const fs=document.getElementById('final-screen'); fs.classList.add('show');
  const t=S.scores.reduce((a,b)=>a+b,0), m=S.totals.reduce((a,b)=>a+b,0), pct=Math.round((t/m)*100);
  document.getElementById('final-score-num').textContent=`${t} / ${m}`;
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('final-trophy').innerHTML=getTrophySVG(pct);
  let title='Part 2 Complete!', msg='';
  if(pct>=90){ title='🏆 Legendary Builder!'; msg='Remarkable performance! Your precision with prepositions and phrasal verbs is at an advanced level. Share your score with pride!'; }
  else if(pct>=75){ title='🥇 Expert Builder!'; msg='Impressive work! You have a strong grasp of these challenging structures. One more pass through the tricky questions will make you unstoppable.'; }
  else if(pct>=55){ title='🔨 Solid Progress!'; msg='Good effort! Focus on the error correction and true/false activities — those require a sharp eye. Keep practising and the patterns will click.'; }
  else{ title='🧩 Keep at It!'; msg='Part 2 is tough — these are B2-level structures. Read every explanation carefully and try again. Every attempt makes you stronger!'; }
  document.getElementById('final-title').textContent=title;
  document.getElementById('final-msg').textContent=msg;
  document.getElementById('final-breakdown').innerHTML=S.scores.map((s,i)=>`<div class="breakdown-pill"><div class="bp-num">${s}/${S.totals[i]}</div><div class="bp-label">Activity ${i+1}</div></div>`).join('');
}
function restartAll(){ document.getElementById('final-screen').classList.remove('show'); document.getElementById('activities-wrap').style.display='block'; init(); }

init();
</script>
