<style>

<body>

<header>
  <h1>Breaking Bad — Present Continuous <span>baking bread: what is happening right now?</span></h1>
  <a class="back-link" href="library.html">← Back to the library</a>
</header>

<div class="stage" id="stage">
  <button class="nav-arrow prev" id="prevBtn" aria-label="Previous slide">‹</button>
  <div class="slide-wrap">
    <img id="slideImg" src="breaking-bad-present-continuous-slides/slide-01.jpg" alt="Slide 1">
  </div>
  <button class="nav-arrow next" id="nextBtn" aria-label="Next slide">›</button>
</div>

<footer>
  <span class="counter" id="counter">1 / 16</span>
  <div class="dots" id="dots"></div>
  <a class="download-btn" href="breaking-bad-present-continuous.pptx" download>⬇ Download .pptx</a>
</footer>

<script>
const TOTAL = 16;
const SRC = i => `breaking-bad-present-continuous-slides/slide-${String(i + 1).padStart(2, '0')}.jpg`;
let idx = 0;

const img = document.getElementById('slideImg');
const counter = document.getElementById('counter');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const stage = document.getElementById('stage');

for (let i = 0; i < TOTAL; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.setAttribute('role', 'button');
  d.setAttribute('aria-label', `Go to slide ${i + 1}`);
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}
const dots = dotsEl.querySelectorAll('.dot');

// These slides are ~250KB each. Without this, every arrow press shows an
// empty frame while the next one downloads — which on a projector reads as
// the deck having broken. Warm the neighbours instead; the browser cache
// serves them instantly when they are actually asked for.
const warmed = new Set();
function warm(i) {
  if (i < 0 || i >= TOTAL || warmed.has(i)) return;
  warmed.add(i);
  new Image().src = SRC(i);
}

function render() {
  img.src = SRC(idx);
  img.alt = `Slide ${idx + 1}`;
  counter.textContent = `${idx + 1} / ${TOTAL}`;
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === TOTAL - 1;
  warm(idx + 1);
  warm(idx - 1);
}
function goTo(i) {
  idx = Math.max(0, Math.min(TOTAL - 1, i));
  render();
}
prevBtn.addEventListener('click', () => goTo(idx - 1));
nextBtn.addEventListener('click', () => goTo(idx + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goTo(idx - 1);
  if (e.key === 'ArrowRight') goTo(idx + 1);
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End') goTo(TOTAL - 1);
});

// Swipe. A slide deck on a phone that only advances by hitting a 40px
// circle is a deck nobody reads to the end.
let x0 = null, y0 = null;
stage.addEventListener('touchstart', e => {
  x0 = e.changedTouches[0].clientX; y0 = e.changedTouches[0].clientY;
}, { passive: true });
stage.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  // Horizontal intent only, or a scroll down the page flips the slide.
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    goTo(idx + (dx < 0 ? 1 : -1));
  }
  x0 = y0 = null;
}, { passive: true });

render();
</script>
</body>
