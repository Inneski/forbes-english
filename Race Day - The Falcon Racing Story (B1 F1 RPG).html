<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Day: The Falcon Racing Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#6E99AD;
    --sky-dark:#4F7A90;
    --cream:#F8E6BE;
    --cream-dim:#EAD9AE;
    --ink:#2A2417;
    --ink-soft:#4A4232;
    --red:#E64652;
    --red-dark:#C93544;
    --orange:#E75333;
    --tense-blue:#2D6FA0;
    --tense-pink:#FF4FA0;
    --grid-line:#00000022;
    --radius:14px;
    --shadow: 0 6px 20px rgba(20,17,10,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.55;
    position:relative;
  }
  h1,h2,h3,.headline{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin:0 0 0.4em 0;
  }
  /* grain texture overlay */
  .grain{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:multiply;
    z-index:1;
  }
  #app{position:relative;max-width:900px;margin:0 auto;min-height:100vh;background:var(--cream);box-shadow:var(--shadow);overflow:hidden;}

  /* ---------- HEADER / STICKY BARS ---------- */
  header.top{
    background:var(--ink);
    color:var(--cream);
    padding:10px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{display:block;}
  .brand-name{font-family:'Oswald',sans-serif;font-size:0.95rem;letter-spacing:0.08em;text-transform:uppercase;}
  .brand-name small{display:block;font-family:'Work Sans',sans-serif;font-size:0.62rem;letter-spacing:0.12em;color:var(--sky);text-transform:uppercase;}
  .lang-toggle{
    background:var(--orange);
    color:var(--ink);
    border:none;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.05em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.8rem;
    transition:transform .15s ease, background .15s ease;
  }
  .lang-toggle:hover{background:var(--red);transform:translateY(-1px);}

  .statusbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--cream);
    border-bottom:2px solid var(--ink);
    padding:10px 16px 12px;
  }
  .progress-track{
    height:10px;
    background:var(--cream-dim);
    border:1px solid var(--ink);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .progress-fill{
    height:100%;
    background:repeating-linear-gradient(45deg, var(--red) 0 10px, var(--orange) 10px 20px);
    width:0%;
    transition:width .4s ease;
  }
  .status-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-size:0.78rem;font-family:'Oswald',sans-serif;letter-spacing:0.03em;text-transform:uppercase;}
  .score-chip, .conf-chip{display:flex;align-items:center;gap:8px;}
  .conf-meter{
    width:120px;height:10px;background:var(--cream-dim);border:1px solid var(--ink);border-radius:999px;overflow:hidden;
  }
  .conf-fill{height:100%;background:linear-gradient(90deg, var(--sky), var(--red));width:50%;transition:width .5s ease;}

  /* ---------- STAGE ---------- */
  #stage{position:relative;z-index:2;padding:0 0 40px;}

  /* COVER */
  .cover{position:relative;}
  .cover img{width:100%;display:block;}
  .cover-overlay{
    position:relative;
    margin-top:-90px;
    background:linear-gradient(180deg, transparent, var(--ink) 55%);
    padding:110px 24px 26px;
    color:var(--cream);
  }
  .badge-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .badge{
    display:inline-block;
    background:var(--red);
    color:var(--cream);
    font-family:'Oswald',sans-serif;
    font-size:0.72rem;
    letter-spacing:0.08em;
    padding:4px 10px;
    border-radius:999px;
    text-transform:uppercase;
  }
  .badge.alt{background:var(--sky);color:var(--ink);}
  .cover h1{font-size:2rem;color:var(--cream);margin-bottom:6px;}
  .cover .subtitle{color:var(--sky);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:0.95rem;margin-bottom:14px;}
  .cover-body{padding:20px 24px 6px;}
  .cover-body p{margin:0 0 14px;}
  .intro-box{
    background:var(--ink);
    color:var(--cream);
    border-radius:var(--radius);
    padding:16px 18px;
    margin:0 24px 20px;
    border-left:6px solid var(--orange);
  }
  .intro-box h3{color:var(--cream);font-size:1rem;margin-bottom:8px;}
  .intro-box ul{margin:0;padding-left:20px;}
  .intro-box li{margin-bottom:4px;}
  .start-btn-wrap{padding:0 24px 30px;text-align:center;}
  .btn{
    display:inline-block;
    background:var(--red);
    color:var(--cream);
    border:none;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:14px 34px;
    border-radius:999px;
    font-size:1rem;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover:not(:disabled){background:var(--orange);transform:translateY(-2px);}
  .btn:disabled{background:#bbb3;color:#8886;cursor:not-allowed;box-shadow:none;}
  .btn.secondary{background:transparent;color:var(--ink);border:2px solid var(--ink);}
  .btn.secondary:hover:not(:disabled){background:var(--ink);color:var(--cream);}

  /* SCENE */
  .scene{padding:26px 24px 10px;}
  .scene .scene-tag{
    font-family:'Oswald',sans-serif;
    color:var(--red);
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-size:0.78rem;
    margin-bottom:6px;
  }
  .scene h2{font-size:1.5rem;border-bottom:3px solid var(--ink);padding-bottom:8px;}
  .scene p{margin:14px 0;font-size:1.02rem;}
  .radio{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:var(--radius);
    padding:14px 16px;
    margin:16px 0;
    position:relative;
  }
  .radio:before{
    content:"TEAM RADIO";
    position:absolute;top:-11px;left:14px;
    background:var(--sky);
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-size:0.65rem;
    letter-spacing:0.1em;
    padding:2px 8px;
    border-radius:999px;
    border:2px solid var(--ink);
  }
  .radio p{margin:6px 0 0;font-style:italic;}

  .choice-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:18px 0;}
  @media(min-width:600px){.choice-grid{grid-template-columns:1fr 1fr;}}
  .choice-card{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
    text-align:left;
  }
  .choice-card:hover{transform:translateY(-3px);background:var(--cream-dim);}
  .choice-card h4{margin:0 0 6px;font-family:'Oswald',sans-serif;color:var(--red);text-transform:uppercase;font-size:0.95rem;}
  .choice-card p{margin:0;font-size:0.92rem;}
  .choice-card.chosen{background:var(--ink);color:var(--cream);}
  .choice-card.chosen h4{color:var(--orange);}

  .next-wrap{padding:10px 24px 30px;text-align:right;}

  /* CHECKPOINT */
  .checkpoint{padding:24px;}
  .cp-header{
    border-radius:var(--radius) var(--radius) 0 0;
    padding:16px 18px;
    color:var(--cream);
  }
  .cp-header h2{color:var(--cream);font-size:1.2rem;margin-bottom:4px;}
  .cp-header .cp-sub{font-size:0.82rem;letter-spacing:0.04em;opacity:0.9;}
  .cp-body{
    background:#fff;
    border:2px solid var(--ink);
    border-top:none;
    border-radius:0 0 var(--radius) var(--radius);
    padding:20px;
  }
  .q-count{font-family:'Oswald',sans-serif;font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
  .tag-chip{
    display:inline-block;
    font-family:'Oswald',sans-serif;
    font-size:0.68rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
    color:#fff;
    margin-bottom:10px;
  }
  .tag-simple{background:var(--tense-blue);}
  .tag-continuous{background:var(--tense-pink);}
  .q-text{font-size:1.08rem;margin:0 0 16px;font-weight:500;}
  .options{display:grid;gap:10px;margin-bottom:14px;}
  .option{
    background:var(--cream);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:11px 14px;
    cursor:pointer;
    font-size:0.96rem;
    transition:background .15s ease, transform .1s ease;
  }
  .option:hover{background:var(--cream-dim);}
  .option.correct{background:#CFE8CE;border-color:#3D8B3D;}
  .option.incorrect{background:#F3CACA;border-color:#B23A3A;}
  .option.disabled{cursor:default;}
  .feedback{
    border-radius:10px;
    padding:12px 14px;
    margin-top:6px;
    font-size:0.92rem;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:#E4F3E4;border:1px solid #3D8B3D;}
  .feedback.bad{background:#FBE7E7;border:1px solid #B23A3A;}
  .feedback strong{display:block;margin-bottom:4px;font-family:'Oswald',sans-serif;letter-spacing:0.03em;}

  /* RESULTS */
  .results{padding:30px 24px;text-align:center;}
  .results h2{font-size:1.7rem;}
  .result-flag{font-size:2.4rem;margin-bottom:10px;}
  .result-card{
    background:var(--ink);
    color:var(--cream);
    border-radius:var(--radius);
    padding:26px 20px;
    margin:20px 0;
  }
  .result-card h3{color:var(--orange);font-size:1.3rem;}
  .result-stats{display:flex;justify-content:center;gap:26px;margin:20px 0;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .num{font-family:'Oswald',sans-serif;font-size:1.8rem;color:var(--red);}
  .stat .label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);}
  .cap-note{font-size:0.85rem;color:var(--ink-soft);font-style:italic;margin-top:8px;}

  /* GLOSSARY */
  .glossary{background:#fff;border:2px solid var(--ink);border-radius:var(--radius);padding:16px 18px;margin:20px 0;}
  .glossary h3{font-size:1rem;}
  .glossary table{width:100%;border-collapse:collapse;font-size:0.9rem;}
  .glossary td{padding:6px 4px;border-bottom:1px solid var(--grid-line);}
  .glossary td:first-child{font-weight:600;width:40%;}

  .lang-en .de-only{display:none;}
  .lang-de .en-only{display:none;}

  .flag-divider{display:flex;height:8px;margin:0;}
  .flag-divider span{flex:1;}
  .flag-divider span:nth-child(odd){background:var(--ink);}
  .flag-divider span:nth-child(even){background:var(--cream);}

  footer.credit{padding:16px 24px 30px;text-align:center;font-size:0.72rem;color:var(--ink-soft);letter-spacing:0.03em;}
</style>
</head>
<body class="lang-en">
<svg width="0" height="0">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<div id="app">
  <div class="grain"><svg width="100%" height="100%"><rect width="100%" height="100%" filter="url(#noiseFilter)"/></svg></div>

  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="19" fill="#2A2417" stroke="#F8E6BE" stroke-width="1.5"/>
        <path d="M20 4 L34 20 L20 36 L6 20 Z" fill="#E75333"/>
        <text x="20" y="25" font-family="Oswald, sans-serif" font-size="13" font-weight="700" fill="#F8E6BE" text-anchor="middle">FE</text>
      </svg>
      <div class="brand-name">Forbes English<small>B1 &middot; Grammar &amp; Vocabulary RPG</small></div>
    </div>
    <button class="lang-toggle" id="langBtn" type="button">Deutsch</button>
  </header>

  <div class="statusbar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status-row">
      <div class="score-chip">
        <span class="en-only">Score:</span><span class="de-only">Punkte:</span>
        <span id="scoreText">0 / 25</span>
      </div>
      <div class="conf-chip">
        <span class="en-only">Team Confidence</span><span class="de-only">Team-Vertrauen</span>
        <div class="conf-meter"><div class="conf-fill" id="confFill"></div></div>
      </div>
    </div>
  </div>

  <div id="stage"></div>

  <footer class="credit">Forbes English &middot; Interactive B1 Roleplay &middot; Race Day: The Falcon Racing Story</footer>
</div>

<script>
/* ======================= UTILITIES ======================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ======================= STATE ======================= */
const state = {
  stepIndex: 0,
  totalCorrect: 0,
  confidence: 50,
  branchChoice: null,
  maxTier: 4,
  cpResults: {}
};

const TOTAL_QUESTIONS = 25;

/* ======================= CHECKPOINT DATA ======================= */

const cpVocab = {
  id: 'cp1',
  color: 'var(--orange)',
  titleEN: 'Checkpoint 1: Racing Vocabulary',
  titleDE: 'Checkpoint 1: Rennsport-Wortschatz',
  subEN: 'Choose the correct racing word for each sentence.',
  subDE: 'Wähle für jeden Satz das richtige Rennsport-Wort.',
  questions: [
    {
      text: 'Alex starts the race from third place on the ___.',
      options: ['grid', 'podium', 'throttle', 'tyres'],
      correct: 'grid',
      exEN: '"Grid" is the starting line-up of cars before the race begins.',
      exDE: '"Grid" (die Startaufstellung) ist die Reihenfolge der Autos vor dem Rennstart.'
    },
    {
      text: 'The team changes all four ___ during the pit stop.',
      options: ['tyres', 'laps', 'flags', 'mirrors'],
      correct: 'tyres',
      exEN: '"Tyres" are the wheels\' rubber covers - the pit crew changes them for grip.',
      exDE: '"Tyres" (die Reifen) werden beim Boxenstopp gewechselt, damit das Auto besser greift.'
    },
    {
      text: 'Alex wants to ___ the car in front before the next corner.',
      options: ['overtake', 'park', 'refuel', 'reverse'],
      correct: 'overtake',
      exEN: '"Overtake" means to drive past another car and take its position.',
      exDE: '"Overtake" (überholen) bedeutet, an einem anderen Auto vorbeizufahren.'
    },
    {
      text: 'When the driver pushes the pedal, they open the ___.',
      options: ['throttle', 'cockpit', 'bonnet', 'wing'],
      correct: 'throttle',
      exEN: 'The "throttle" controls how much power the engine gives.',
      exDE: 'Das "throttle" (Gaspedal) steuert, wie viel Kraft der Motor bekommt.'
    },
    {
      text: 'The winner stands on the top step of the ___.',
      options: ['podium', 'grid', 'pit lane', 'paddock'],
      correct: 'podium',
      exEN: 'The "podium" is where the top three drivers celebrate after the race.',
      exDE: 'Das "podium" ist der Ort, an dem die besten drei Fahrer nach dem Rennen feiern.'
    }
  ]
};

const cpTense = {
  id: 'cp2',
  color: 'var(--tense-blue)',
  titleEN: 'Checkpoint 2: Present Simple vs. Present Continuous',
  titleDE: 'Checkpoint 2: Present Simple vs. Present Continuous',
  subEN: 'Choose the correct verb form. Watch the colour tag: blue = Present Simple, pink = Present Continuous.',
  subDE: 'Wähle die richtige Verbform. Achte auf die Farbe: Blau = Present Simple, Pink = Present Continuous.',
  questions: [
    {
      tag: 'continuous',
      text: 'Listen! The engines ___ right now.',
      options: ['are roaring', 'roar', 'roared', 'will roar'],
      correct: 'are roaring',
      exEN: 'We use Present Continuous ("are roaring") for an action happening now, at this moment.',
      exDE: 'Present Continuous ("are roaring") benutzt man für eine Handlung, die genau jetzt passiert.'
    },
    {
      tag: 'simple',
      text: 'Alex usually ___ his mirrors every few seconds.',
      options: ['checks', 'is checking', 'checked', 'will check'],
      correct: 'checks',
      exEN: 'We use Present Simple ("checks") for habits and routines, with words like "usually".',
      exDE: 'Present Simple ("checks") benutzt man für Gewohnheiten, z. B. mit dem Wort "usually".'
    },
    {
      tag: 'continuous',
      text: 'Look! Alex ___ the McLaren at this moment!',
      options: ['is overtaking', 'overtakes', 'overtook', 'will overtake'],
      correct: 'is overtaking',
      exEN: '"At this moment" signals Present Continuous - the action is happening right now.',
      exDE: '"At this moment" zeigt Present Continuous - die Handlung passiert gerade jetzt.'
    },
    {
      tag: 'continuous',
      text: 'The team ___ pit stops today; they are resting before the race.',
      options: ["isn't practising", "doesn't practise", "wasn't practising", "hasn't practised"],
      correct: "isn't practising",
      exEN: 'The negative Present Continuous ("isn\'t practising") describes what is not happening today.',
      exDE: 'Das negative Present Continuous ("isn\'t practising") beschreibt, was heute nicht passiert.'
    },
    {
      tag: 'simple',
      text: 'Every Sunday, millions of fans ___ the Grand Prix on TV.',
      options: ['watch', 'are watching', 'watched', 'will watch'],
      correct: 'watch',
      exEN: '"Every Sunday" is a repeated routine, so we use Present Simple ("watch").',
      exDE: '"Every Sunday" zeigt eine Routine, deshalb benutzt man Present Simple ("watch").'
    }
  ]
};

const cpCompare = {
  id: 'cp3',
  color: '#B98A2E',
  titleEN: 'Checkpoint 3: Comparatives &amp; Superlatives',
  titleDE: 'Checkpoint 3: Comparatives &amp; Superlatives',
  subEN: 'Choose the correct comparative or superlative form.',
  subDE: 'Wähle die richtige Steigerungsform.',
  questions: [
    {
      text: "Alex's car is ___ than the Williams this weekend.",
      options: ['faster', 'fastest', 'more fast', 'the fastest'],
      correct: 'faster',
      exEN: 'For short adjectives we add "-er" + "than" to compare two things: "faster than".',
      exDE: 'Bei kurzen Adjektiven bildet man den Komparativ mit "-er" + "than": "faster than".'
    },
    {
      text: 'Of all twenty drivers, Alex has ___ start.',
      options: ['the best', 'better', 'the goodest', 'best'],
      correct: 'the best',
      exEN: '"Good" is irregular: better (comparative) and the best (superlative, with "the").',
      exDE: '"Good" ist unregelmäßig: better (Komparativ) und the best (Superlativ, mit "the").'
    },
    {
      text: 'This track is ___ than Monaco because the cars go very fast here.',
      options: ['more dangerous', 'dangerouser', 'the most dangerous', 'dangerous'],
      correct: 'more dangerous',
      exEN: 'Longer adjectives use "more" + adjective + "than": "more dangerous than".',
      exDE: 'Längere Adjektive bilden den Komparativ mit "more" + Adjektiv + "than".'
    },
    {
      text: 'The new tyres are ___ than the old ones, so they grip the road better.',
      options: ['softer', 'softest', 'more soft', 'the softest'],
      correct: 'softer',
      exEN: '"Soft" is a short adjective, so the comparative is "softer" (+ than).',
      exDE: '"Soft" ist ein kurzes Adjektiv, der Komparativ lautet "softer" (+ than).'
    },
    {
      text: 'Everyone agrees: the last lap was ___ part of the whole race.',
      options: ['the most exciting', 'more exciting', 'excitinger', 'the excitingest'],
      correct: 'the most exciting',
      exEN: 'For the superlative of a long adjective, use "the most" + adjective.',
      exDE: 'Der Superlativ eines langen Adjektivs wird mit "the most" + Adjektiv gebildet.'
    }
  ]
};

const cpConditional = {
  id: 'cp4',
  color: 'var(--red)',
  titleEN: 'Checkpoint 4: First Conditional',
  titleDE: 'Checkpoint 4: First Conditional',
  subEN: 'Complete each sentence with the correct First Conditional form.',
  subDE: 'Vervollständige jeden Satz mit der richtigen First-Conditional-Form.',
  questions: [
    {
      text: 'If Alex pushes too hard now, he ___ control of the car.',
      options: ['will lose', 'loses', 'lost', 'would lose'],
      correct: 'will lose',
      exEN: 'First Conditional: If + present simple, ... will + infinitive (a real future possibility).',
      exDE: 'First Conditional: If + Present Simple, ... will + Infinitiv (eine reale zukünftige Möglichkeit).'
    },
    {
      text: 'If it ___ tomorrow, the track will be very slippery.',
      options: ['rains', 'will rain', 'rained', 'is raining'],
      correct: 'rains',
      exEN: 'After "if" we use the present simple, even when we talk about the future.',
      exDE: 'Nach "if" benutzt man das Present Simple, auch wenn man über die Zukunft spricht.'
    },
    {
      text: 'The team will change strategy if the rival ___ into the pits early.',
      options: ['comes', 'will come', 'came', 'is coming'],
      correct: 'comes',
      exEN: 'The "if" clause always takes present simple, whichever half of the sentence comes first.',
      exDE: 'Der "if"-Satz steht immer im Present Simple, egal welcher Satzteil zuerst kommt.'
    },
    {
      text: 'If Alex finishes in the top three, the fans ___ very happy.',
      options: ['will be', 'are', 'were', 'would be'],
      correct: 'will be',
      exEN: 'The main (result) clause uses "will" + infinitive: "will be".',
      exDE: 'Der Hauptsatz (das Ergebnis) benutzt "will" + Infinitiv: "will be".'
    },
    {
      text: 'If the engineers ___ the tyres correctly, the car will grip well.',
      options: ['check', 'will check', 'checked', 'are checking'],

/* ======================= RENDER HELPERS ======================= */
const stageEl = document.getElementById('stage');
const progressFill = document.getElementById('progressFill');
const scoreText = document.getElementById('scoreText');
const confFill = document.getElementById('confFill');

function updateStatusBar(){
  const pct = Math.min(100, Math.round((state.stepIndex / (steps.length - 1)) * 100));
  progressFill.style.width = pct + '%';
  scoreText.textContent = state.totalCorrect + ' / ' + TOTAL_QUESTIONS;
  const c = Math.max(0, Math.min(100, state.confidence));
  confFill.style.width = c + '%';
}

function goToStep(i){
  state.stepIndex = i;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render(){
  updateStatusBar();
  const step = steps[state.stepIndex];
  if(step.type === 'cover') renderCover();
  else if(step.type === 'scene') renderScene(step.id);
  else if(step.type === 'checkpoint') renderCheckpoint(step.data);
  else if(step.type === 'choice') renderChoice();
  else if(step.type === 'results') renderResults();
}

  const sc = scenes[id];
  let bodyHtml = '';

  if(id === 's4b'){
    // branch resolution text, depends on choice
    const aggressive = state.branchChoice === 'aggressive';
    bodyHtml = `
      <div class="radio">
        <p class="en-only">${aggressive
          ? "You grip the wheel tighter. 'Let's push, Maria. Box this lap!' The pit crew works fast, and you rejoin the track on fresh tyres, ready to attack."
          : "You take a breath. 'Let's stay out, Maria. We protect the position.' You settle into a steady rhythm, watching your mirrors carefully."}</p>
        <p class="de-only">${aggressive
          ? "Du greifst das Lenkrad fester. 'Lass uns pushen, Maria. Box in dieser Runde!' Die Boxencrew arbeitet schnell, und du fährst mit frischen Reifen zurück auf die Strecke, bereit anzugreifen."
          : "Du atmest tief durch. 'Lass uns draußen bleiben, Maria. Wir sichern die Position.' Du findest einen ruhigen Rhythmus und beobachtest genau deine Spiegel."}</p>
      </div>
    `;
  } else {
    bodyHtml = sc.bodyEN.map((p, idx) => `
      <p class="en-only">${p}</p>
      <p class="de-only">${sc.bodyDE[idx] || ''}</p>
    `).join('');
  }

  stageEl.innerHTML = `
    <div class="scene">
      <div class="scene-tag"><span class="en-only">${sc.tagEN}</span><span class="de-only">${sc.tagDE}</span></div>
      <h2><span class="en-only">${sc.titleEN}</span><span class="de-only">${sc.titleDE}</span></h2>
      ${bodyHtml}
    </div>
    <div class="next-wrap">
      <button class="btn" id="sceneNextBtn" type="button">
        <span class="en-only">Continue &rarr;</span><span class="de-only">Weiter &rarr;</span>
      </button>
    </div>
  `;
  document.getElementById('sceneNextBtn').addEventListener('click', () => goToStep(state.stepIndex + 1));
}

/* ---------- CHOICE (branch) ---------- */
function renderChoice(){
  stageEl.innerHTML = `
    <div class="scene">
      <div class="scene-tag"><span class="en-only">Scene 4 &middot; Lap 22</span><span class="de-only">Szene 4 &middot; Runde 22</span></div>
      <h2><span class="en-only">Pit Strategy</span><span class="de-only">Boxenstopp-Strategie</span></h2>
      <div class="radio">
        <p class="en-only">"Alex, we have a decision. We can pit now for fresh tyres and try to undercut the cars in front - it's risky, but it could win us the race. Or we can stay out longer and play it safe, protecting our current position. What do you want to do?"</p>
        <p class="de-only">"Alex, wir müssen uns entscheiden. Wir können jetzt für frische Reifen an die Box kommen und die Autos vor uns zu überholen versuchen - riskant, aber es könnte uns das Rennen gewinnen. Oder wir bleiben länger draußen und sichern unsere aktuelle Position. Was willst du tun?"</p>
      </div>
      <div class="choice-grid">
        <div class="choice-card" id="choiceAggressive">
          <h4><span class="en-only">Push Now</span><span class="de-only">Jetzt pushen</span></h4>
          <p class="en-only">Pit for the undercut. High risk, high reward - a Grand Prix win is possible, but so is disaster.</p>
          <p class="de-only">An die Box für den Undercut. Hohes Risiko, große Chance - ein Grand-Prix-Sieg ist möglich, aber auch ein Desaster.</p>
        </div>
        <div class="choice-card" id="choiceSafe">
          <h4><span class="en-only">Play It Safe</span><span class="de-only">Auf Nummer sicher gehen</span></h4>
          <p class="en-only">Stay out and protect your position. A podium is still possible, but not a win.</p>
          <p class="de-only">Draußen bleiben und die Position sichern. Ein Podiumsplatz ist noch möglich, aber kein Sieg.</p>
        </div>
      </div>
    </div>
  `;
  document.getElementById('choiceAggressive').addEventListener('click', () => makeChoice('aggressive'));
  document.getElementById('choiceSafe').addEventListener('click', () => makeChoice('safe'));
}

function makeChoice(choice){
  state.branchChoice = choice;
  if(choice === 'safe'){
    state.confidence += 8;
    state.maxTier = 3;
  } else {
    state.maxTier = 4;
  }
  goToStep(state.stepIndex + 1);
}

/* ---------- CHECKPOINT ---------- */
function renderCheckpoint(cp){
  const shuffledQs = cp.questions.map(q => {
    return { ...q, shuffledOptions: shuffle(q.options) };
  });
  let qIndex = 0;
  let correctCount = 0;

  function renderQuestion(){
    const q = shuffledQs[qIndex];
    const tagHtml = q.tag ? `<div class="tag-chip ${q.tag === 'simple' ? 'tag-simple' : 'tag-continuous'}">${q.tag === 'simple' ? 'Present Simple' : 'Present Continuous'}</div>` : '';
    stageEl.innerHTML = `
      <div class="checkpoint">
        <div class="cp-header" style="background:${cp.color};">
          <h2><span class="en-only">${cp.titleEN}</span><span class="de-only">${cp.titleDE}</span></h2>
          <div class="cp-sub"><span class="en-only">${cp.subEN}</span><span class="de-only">${cp.subDE}</span></div>
        </div>
        <div class="cp-body">
          <div class="q-count"><span class="en-only">Question</span><span class="de-only">Frage</span> ${qIndex + 1} / 5</div>
          ${tagHtml}
          <p class="q-text">${q.text}</p>
          <div class="options" id="optionsWrap"></div>
          <div class="feedback" id="feedbackBox"></div>
          <div style="text-align:right;">
            <button class="btn" id="cpNextBtn" type="button" disabled>
              <span class="en-only">Next &rarr;</span><span class="de-only">Weiter &rarr;</span>
            </button>
          </div>
        </div>
      </div>
    `;

    const optionsWrap = document.getElementById('optionsWrap');
    const feedbackBox = document.getElementById('feedbackBox');
    const nextBtn = document.getElementById('cpNextBtn');
    let answered = false;

    q.shuffledOptions.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'option';
      div.textContent = opt;
      div.addEventListener('click', () => {
        if(answered) return;
        answered = true;
        const isCorrect = opt === q.correct;
        if(isCorrect) correctCount++;

        [...optionsWrap.children].forEach(child => {
          child.classList.add('disabled');
          if(child.textContent === q.correct) child.classList.add('correct');
          else if(child === div) child.classList.add('incorrect');
        });

        feedbackBox.className = 'feedback show ' + (isCorrect ? 'good' : 'bad');
        feedbackBox.innerHTML = `
          <strong class="en-only">${isCorrect ? 'Correct!' : 'Not quite.'}</strong>
          <strong class="de-only">${isCorrect ? 'Richtig!' : 'Nicht ganz.'}</strong>
          <span class="en-only">${q.exEN}</span>
          <span class="de-only">${q.exDE}</span>
        `;
        nextBtn.disabled = false;
      });
      optionsWrap.appendChild(div);
    });

    nextBtn.addEventListener('click', () => {
      qIndex++;
      if(qIndex < shuffledQs.length){
        renderQuestion();
      } else {
        state.totalCorrect += correctCount;
        state.confidence += correctCount * 2;
        state.cpResults[cp.id] = correctCount;
        goToStep(state.stepIndex + 1);
      }
    });
  }

  renderQuestion();
}

/* ---------- RESULTS ---------- */
function computeEnding(){
  const score = Math.max(0, Math.min(100, state.confidence));
  let tierByScore;
  if(score >= 85) tierByScore = 4;
  else if(score >= 65) tierByScore = 3;
  else if(score >= 40) tierByScore = 2;
  else tierByScore = 1;

  const finalTier = Math.min(tierByScore, state.maxTier);
  const capped = finalTier < tierByScore;
  return { score, finalTier, capped };
}

function renderResults(){
  const { score, finalTier, capped } = computeEnding();
  const ending = endings[finalTier];
  const glossaryRows = glossary.map(([en, de]) => `<tr><td>${en}</td><td>${de}</td></tr>`).join('');

    <div class="results">

      <h2><span class="en-only">Race Finished!</span><span class="de-only">Rennen beendet!</span></h2>
      <div class="result-card">
        <h3><span class="en-only">${ending.titleEN}</span><span class="de-only">${ending.titleDE}</span></h3>
        <p class="en-only">${ending.textEN}</p>
        <p class="de-only">${ending.textDE}</p>
        ${capped ? `<p class="cap-note en-only">Because you chose to play it safe at the pit stop, third place was the best possible result today &mdash; even with a perfect score.</p>
                    <p class="cap-note de-only">Weil du dich beim Boxenstopp für die sichere Variante entschieden hast, war der dritte Platz heute das bestmögliche Ergebnis &mdash; selbst bei perfekter Punktzahl.</p>` : ''}
      </div>
      <div class="result-stats">
        <div class="stat">
          <div class="num">${state.totalCorrect} / ${TOTAL_QUESTIONS}</div>
          <div class="label en-only">Correct Answers</div>
          <div class="label de-only">Richtige Antworten</div>
        </div>
        <div class="stat">
          <div class="num">${score}%</div>
          <div class="label en-only">Team Confidence</div>
          <div class="label de-only">Team-Vertrauen</div>
        </div>
        <div class="stat">
          <div class="num">${state.branchChoice === 'aggressive' ? (state.lang === 'de' ? 'Angriff' : 'Push') : (state.lang === 'de' ? 'Sicher' : 'Safe')}</div>
          <div class="label en-only">Pit Strategy</div>
          <div class="label de-only">Boxenstrategie</div>
        </div>
      </div>
      <div class="glossary">
        <h3><span class="en-only">Race Vocabulary Glossary</span><span class="de-only">Rennsport-Wortschatz-Glossar</span></h3>
        <table>${glossaryRows}</table>
      </div>
      <button class="btn secondary" id="restartBtn" type="button">
        <span class="en-only">Race Again &rarr;</span><span class="de-only">Nochmal fahren &rarr;</span>
      </button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => {
    state.stepIndex = 0;
    state.totalCorrect = 0;
    state.confidence = 50;
    state.branchChoice = null;
    state.maxTier = 4;
    state.cpResults = {};
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

/* ======================= LANGUAGE TOGGLE ======================= */
const langBtn = document.getElementById('langBtn');
state.lang = 'en';
langBtn.addEventListener('click', () => {
  const isEN = document.body.classList.contains('lang-en');
  if(isEN){
    document.body.classList.remove('lang-en');
    document.body.classList.add('lang-de');
    state.lang = 'de';
    langBtn.textContent = 'English';
  } else {
    document.body.classList.remove('lang-de');
    document.body.classList.add('lang-en');
    state.lang = 'en';
    langBtn.textContent = 'Deutsch';
  }
});

/* ======================= INIT ======================= */
render();
</script>
