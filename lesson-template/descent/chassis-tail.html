     - prev must retrace the route actually taken, not slides[idx-1];
     - the score denominator must count only the questions this learner met,
       or every player is marked out of a paper they never sat;
     - the ending must be decided by the ledger rather than by whichever
       button the learner feels like pressing. */
const BRANCH = document.body.dataset.flow === 'branch';
const nodeOf = {};
if (BRANCH) slides.forEach(sl => { if (sl.dataset.node) nodeOf[sl.dataset.node] = sl; });
const START = BRANCH ? (document.body.dataset.start || slides[0].dataset.node) : null;
const trail = [];
const ledger = { dp: 0, time: 0, clues: new Set() };
const seenScored = new Set();

function ledgerInit() {
  ledger.dp = 0;
  ledger.time = +(document.body.dataset.time || 3);
  ledger.clues.clear();
  drawLedger();
}
function drawLedger() {
  const box = document.getElementById('ledger');
  if (!box) return;
  box.hidden = !BRANCH;
  if (!BRANCH) return;
  document.getElementById('ledDp').textContent = ledger.dp;
  document.getElementById('ledTime').textContent =
    ledger.time > 0 ? '\u25CF'.repeat(ledger.time) : '\u2014';
  document.getElementById('ledClues').textContent = ledger.clues.size;
}
/* Apply the cost or reward an element declares. Idempotent per element, so
   paging back over a node never pays twice. */
const spent = new WeakSet();
function applyLedger(el) {
  if (!BRANCH || !el || spent.has(el)) return;
  spent.add(el);
  if (el.dataset.dp)   ledger.dp = Math.max(0, ledger.dp + (+el.dataset.dp));
  if (el.dataset.time) ledger.time = Math.max(0, ledger.time + (+el.dataset.time));
  if (el.dataset.clue) el.dataset.clue.split(/\s+/).filter(Boolean)
                          .forEach(c => ledger.clues.add(c));
  drawLedger();
}
/* A ledger gate: data-require="dp>=8 && time>=1 && clues>=4".
   Only these three names are in scope, and nothing is eval'd. */
function meets(expr) {
  if (!expr) return true;
  const val = { dp: ledger.dp, time: ledger.time, clues: ledger.clues.size };
  return expr.split('&&').every(part => {
    const m = part.trim().match(/^(dp|time|clues)\s*(>=|<=|>|<|==)\s*(\d+)$/);
    if (!m) return true;
    const a = val[m[1]], b = +m[3];
    return m[2] === '>=' ? a >= b : m[2] === '<=' ? a <= b
         : m[2] === '>'  ? a >  b : m[2] === '<'  ? a <  b : a === b;
  });
}
function goNode(id, record) {
  const target = nodeOf[id];
  if (!target) return;
  if (record !== false) trail.push(idx);
  show(slides.indexOf(target));
}

/* ── Scale the 1280×720 stage to fit any viewport, never scroll ── */
if (BRANCH) ledgerInit();
setTimeout(wireGlosses, 0);

function fitStage() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  // Centre explicitly. Relying on the wrapper to centre an oversized child is
  // what put the stage off-screen on every viewport under 1280px wide.
  const x = (window.innerWidth  - 1280 * s) / 2;
  const y = (window.innerHeight -  720 * s) / 2;
  stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}
addEventListener('resize', fitStage);

/* ── Navigation ── */
function show(n) {
  // A slide may own a running clock. Leaving it pauses; coming back
  // resumes with the time that was left, so paging back to re-read a
  // rule never costs the learner the answer.
  const leaving = slides[idx];
  if (leaving && leaving._leave) leaving._leave();
  idx = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('is-active', i === idx));
  stage.classList.toggle('on-cover', slides[idx].dataset.type === 'cover');
  // A slide may swap the background pattern for a second illustration from the
  // same set (data-bg). Same idiom as the hero — picture at reduced opacity
  // under the wash — so extra artwork never becomes a pasted-in box.
  stage.style.setProperty('--hero', slides[idx].dataset.bg
    ? `url('${slides[idx].dataset.bg}')` : '');
  // In branch mode idx/length is meaningless — a learner sees roughly half the
  // nodes — so progress and the counter come from the node itself.
  const cur = slides[idx];
  document.getElementById('progressFill').style.width = BRANCH
    ? (cur.dataset.progress || 0) + '%'
    : (slides.length > 1 ? (idx / (slides.length - 1)) * 100 : 0) + '%';
  document.getElementById('deckCount').textContent = BRANCH
    ? (cur.dataset.act || '')
    : t('slideOf')(idx + 1, slides.length);
  document.querySelector('[data-action="prev"]').disabled =
    BRANCH ? !trail.length : idx === 0;
  document.querySelector('[data-action="next"]').disabled =
    BRANCH ? !cur.querySelector('[data-goto]') : idx === slides.length - 1;
  if (BRANCH) {
    applyLedger(cur);
    if (['mc','gap','match','order','sort','lock'].includes(cur.dataset.type))
      seenScored.add(cur);
    // A ledger gate greys out the endings the run did not earn.
    cur.querySelectorAll('[data-require]').forEach(b => {
      const okay = meets(b.dataset.require);
      b.disabled = !okay;
      b.classList.toggle('locked', !okay);
    });
  }
  if (slides[idx].dataset.type === 'results') renderResults();
  markRail(slides[idx]);
  if (slides[idx]._enter) slides[idx]._enter();
  const gap = slides[idx].querySelector('.gap');
  if (gap && !answered.has(slides[idx])) setTimeout(() => gap.focus(), 60);
}

function renderResults() {
  // Branch mode scores out of what this learner actually met. Counting every
  // question in the file would mark them against a paper half of which was
  // on the road not taken.
  const max = BRANCH
    ? [...seenScored].reduce((n, s) => n + Math.max(1, countIn(s)), 0)
    : maxScore;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('scoreMax').textContent = max;
  const pct = max ? score / max : 0;
  // innerHTML, not textContent: these strings are authored HTML like every
  // other data-i18n value, so &lsquo;did&rsquo; has to arrive as a quote mark
  // and not as the six literal characters "&lsquo;". The band was the one
  // i18n slot still being written as plain text.
  document.getElementById('scoreMsg').innerHTML =
    pct === 1 ? t('resPerfect') : pct >= .75 ? t('resStrong')
    : pct >= .5 ? t('resMid') : t('resLow');
}

function updateScoreChip() {
  document.getElementById('deckScore').textContent =
    maxScore ? `${t('scoreLabel')} ${score}/${maxScore}` : '';
}

/* ── Answer handling ── */
function award(slide, ok) {
  if (answered.has(slide)) return;
  answered.add(slide);
  if (ok) score++;
  updateScoreChip();
}

function feedback(slide, ok, extra, ownExplain) {
  const el = slide.querySelector('.feedback');
  if (!el) return;
  // An option's own explanation wins: telling a learner why THEIR answer was
  // wrong beats restating why the key was right.
  const reason = ownExplain || el.dataset.explain;
  const why = reason ? ' ' + reason : '';
  // innerHTML, not textContent: explanations carry <strong> and <em>, and the
  // whole point of an explanation is that the word being taught is marked.
  // Written with textContent this printed the tags as literal source text on
  // every deck built from this template.
  el.innerHTML = (ok ? t('fbCorrect') : t('fbWrong') + (extra ? ` ${t('fbAnswer')} ${extra}` : '')) + why;
  el.className = 'feedback show ' + (ok ? 'ok' : 'no');
}

/* A real shuffle.
   `arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1])` is not one, and it was doing visible
   damage here. Array.prototype.sort assumes a consistent comparator; given an
   inconsistent one it does whatever its insertion sort happens to do, which
   for short arrays is mostly nothing. Measured in this engine's own runtime
   over 400,000 trials, n=4: an option authored first landed at A 35.9% of the
   time and at D 31.2%, against 25% for a fair shuffle — B and C shared the
   remaining third. Every one of this lesson's six keys was authored first, so
   "always press A" scored well above chance and a student noticed.
   Fisher-Yates is uniform, and the source order no longer leaks. */
function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Multiple choice — shuffled on first view so option order is never a tell. */
slides.filter(s => s.dataset.type === 'mc').forEach(slide => {
  const box = slide.querySelector('.opts');
  const opts = [...box.querySelectorAll('.opt')];
  shuffled(opts).forEach((o, i) => {
    o.prepend(Object.assign(document.createElement('span'), {
      className: 'opt-key', textContent: 'ABCD'[i]
    }));
    box.appendChild(o);
  });
  opts.forEach(o => o.addEventListener('click', () => {
    if (answered.has(slide)) return;
    const ok = o.hasAttribute('data-correct');
    opts.forEach(x => {
      x.disabled = true;
      if (x.hasAttribute('data-correct')) x.classList.add('correct');
    });
    if (!ok) o.classList.add('wrong');
    award(slide, ok);
    feedback(slide, ok, null, o.dataset.explain);
    if (BRANCH) {
      // The chosen option carries its own consequence and its own destination,
      // so a wrong answer costs Time and routes to a setback node rather than
      // simply refusing to move.
      applyLedger(o);
      const to = o.dataset.goto || slide.dataset.goto;
      const cont = slide.querySelector('[data-action="branch-continue"]');
      if (cont) { cont.hidden = false; cont.dataset.goto = to; }
      else if (to) setTimeout(() => goNode(to), 1400);
    }
  }));
});

/* Matching. Author as <div class="match-pair" data-term data-def> rows; the
   engine builds both columns and shuffles the definitions. One point per pair. */
slides.filter(s => s.dataset.type === 'match').forEach(slide => {
  const pairs = [...slide.querySelectorAll('.match-pair')];
  const grid = slide.querySelector('.match-grid');
  if (!grid || !pairs.length) return;
  const terms = document.createElement('div');
  const defs = document.createElement('div');
  terms.className = defs.className = 'match-col';
  /* A MATCH SLIDE WAS THE ONE EXERCISE WITH NOWHERE TO PUT A TRANSLATION.
     Every other shape carries its ES/DE gloss in the markup; this one builds
     its items from data-term/data-def in JS, so there was no element to hang
     one on and the slide simply had none. Innes, on Present Continuous 2b
     slide 16: "translate words underneath".

     Optional and backward-compatible: a pair with no data-term-es/-de and no
     data-def-es/-de renders exactly the button it rendered before. The gloss
     goes in a .sup, which is the site's existing mechanism - hidden unless
     the root lang matches, and stripped by bwNorm() so the EN/DE panel still
     lists the English, not the English plus its own translation. */
  const mk = (txt, cls, key, glosses) => {
    const b = document.createElement('button');
    b.className = 'match-item ' + cls;
    b.appendChild(document.createTextNode(txt));
    b.dataset.key = key;
    (glosses || []).forEach(([lang, label, text]) => {
      if (!text) return;
      const s = document.createElement('span');
      s.className = 'sup';
      s.dataset.lang = lang;
      const tag = document.createElement('b');
      tag.textContent = label;
      const body = document.createElement('span');
      body.innerHTML = text;
      s.append(tag, body);
      b.appendChild(s);
    });
    return b;
  };
  const gl = (p, side) => [['es', 'ES', p.dataset[side + 'Es']],
                           ['de', 'DE', p.dataset[side + 'De']]];
  pairs.forEach(p => terms.appendChild(
    mk(p.dataset.term, 'term', p.dataset.term, gl(p, 'term'))));
  shuffled(pairs)
    .forEach(p => defs.appendChild(
      mk(p.dataset.def, 'def', p.dataset.term, gl(p, 'def'))));
  grid.replaceChildren(terms, defs);

  let picked = null, done = 0;
  const total = pairs.length;
  grid.addEventListener('click', e => {
    const el = e.target.closest('.match-item');
    if (!el || el.classList.contains('done')) return;
    if (el.classList.contains('term')) {
      grid.querySelectorAll('.term.picked').forEach(x => x.classList.remove('picked'));
      el.classList.add('picked');
      picked = el;
      return;
    }
    if (!picked) return;
    if (el.dataset.key === picked.dataset.key) {
      el.classList.add('done'); picked.classList.add('done');
      picked.classList.remove('picked');
      picked = null; done++; score++; updateScoreChip();
      if (done === total) {
        answered.add(slide);
        feedback(slide, true);
      }
    } else {
      el.classList.add('miss');
      setTimeout(() => el.classList.remove('miss'), 320);
    }
  });
});

/* Sentence building. Author as
     <div class="order" data-answer="chunk|chunk|chunk"></div>
   with a [data-action="check-order"] button and a .feedback alongside it.
   The engine shuffles the chunks into a pool; clicking places one, clicking a
   placed one takes it back. One point for the whole sentence — a half-right
   word order is not half-right English. */
slides.filter(s => s.dataset.type === 'order').forEach(slide => {
  const box = slide.querySelector('.order');
  if (!box) return;
  const answer = box.dataset.answer.split('|').map(x => x.trim());
  const target = document.createElement('div'); target.className = 'order-target';
  const pool   = document.createElement('div'); pool.className   = 'order-pool';
  shuffled(answer.map((txt, i) => ({ txt, i })))
        .forEach(({ txt, i }) => {
          const b = document.createElement('button');
          b.className = 'chunk';
          b.textContent = txt;
          b.dataset.i = i;
          pool.appendChild(b);
        });
  box.replaceChildren(target, pool);

  box.addEventListener('click', e => {
    const c = e.target.closest('.chunk');
    if (!c || c.disabled) return;
    if (c.parentElement === pool) { c.classList.add('placed');    target.appendChild(c); }
    else                          { c.classList.remove('placed'); pool.appendChild(c); }
  });

  slide._check = () => {
    if (answered.has(slide)) return;
    // Marking a half-built sentence teaches nothing; wait until it is complete.
    if (target.children.length < answer.length) return;
    answered.add(slide);
    const ok = [...target.children].map(c => +c.dataset.i).every((v, i) => v === i);
    target.classList.add(ok ? 'correct' : 'wrong');
    box.querySelectorAll('.chunk').forEach(c => c.disabled = true);
    if (ok) score++;
    updateScoreChip();
    feedback(slide, ok, ok ? null : answer.join(' '));
    const btn = slide.querySelector('[data-action="check-order"]');
    if (btn) btn.disabled = true;
  };
});

/* Sorting. Author as
     <div class="sort" data-bins="Label one|Label two" data-explain="…">
       <span class="sort-item" data-bin="0">every day</span>
       …
     </div>
   The engine shuffles the items into a pool and builds one bin per label.
   Drag an item into a bin, or click the item and then click the bin —
   both do the same thing, and the click path is the one that works on a
   touch screen. One point per item.

   Unlike matching, a wrong placement costs the point for that item: the
   learner can still put it right and finish the slide, but the first
   answer is the one that counts. A sorting task with unlimited free
   retries is a task you cannot fail, and a score that cannot go down
   tells the learner nothing. (Matching still allows free retries; that
   is thirty-odd shipped lessons' worth of behaviour to change, and it
   should be changed deliberately, not as a side effect of this.) */
slides.filter(s => s.dataset.type === 'sort').forEach(slide => {
  const box = slide.querySelector('.sort');
  if (!box) return;
  const labels = (box.dataset.bins || '').split('|').map(x => x.trim());
  const items = [...box.querySelectorAll('.sort-item')];
  if (labels.length < 2 || !items.length) return;

  const pool = document.createElement('div');
  pool.className = 'sort-pool';
  const bins = document.createElement('div');
  bins.className = 'sort-bins';
  bins.style.gridTemplateColumns = '1fr '.repeat(labels.length).trim();

  const binEls = labels.map((label, i) => {
    const bin = document.createElement('div');
    bin.className = 'sort-bin';
    bin.dataset.bin = i;
    const h = document.createElement('div');
    h.className = 'sort-bin-label';
    h.textContent = label;
    const body = document.createElement('div');
    body.className = 'sort-bin-items';
    bin.append(h, body);
    bins.appendChild(bin);
    return bin;
  });

  shuffled(items).forEach(it => {
    it.setAttribute('draggable', 'true');
    it.tabIndex = 0;
    pool.appendChild(it);
  });
  box.replaceChildren(pool, bins);

  let picked = null, placed = 0, dragged = null;
  const missed = new WeakSet();   // items answered wrongly at least once

  function place(item, binIndex) {
    if (item.classList.contains('placed')) return;
    if (+item.dataset.bin !== binIndex) {
      missed.add(item);
      item.classList.add('miss');
      setTimeout(() => item.classList.remove('miss'), 320);
      return;
    }
    item.classList.remove('picked');
    item.classList.add('placed');
    item.setAttribute('draggable', 'false');
    binEls[binIndex].querySelector('.sort-bin-items').appendChild(item);
    placed++;
    if (!missed.has(item)) { score++; updateScoreChip(); }
    if (placed === items.length) {
      binEls.forEach(b => b.classList.add('full'));
      answered.add(slide);
      // Right only if every item went to the right bin first time.
      feedback(slide, !items.some(i => missed.has(i)));
    }
  }

  box.addEventListener('click', e => {
    const item = e.target.closest('.sort-item');
    if (item && !item.classList.contains('placed')) {
      box.querySelectorAll('.sort-item.picked').forEach(x => x.classList.remove('picked'));
      item.classList.add('picked');
      picked = item;
      return;
    }
    const bin = e.target.closest('.sort-bin');
    if (bin && picked) { place(picked, +bin.dataset.bin); picked = null; }
  });

  box.addEventListener('dragstart', e => {
    const item = e.target.closest('.sort-item');
    if (!item || item.classList.contains('placed')) return;
    dragged = item;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    // Firefox will not start a drag without data on the transfer.
    e.dataTransfer.setData('text/plain', '');
  });
  box.addEventListener('dragend', () => {
    if (dragged) dragged.classList.remove('dragging');
    dragged = null;
    binEls.forEach(b => b.classList.remove('over'));
  });
  binEls.forEach(bin => {
    bin.addEventListener('dragover', e => { e.preventDefault(); bin.classList.add('over'); });
    bin.addEventListener('dragleave', () => bin.classList.remove('over'));
    bin.addEventListener('drop', e => {
      e.preventDefault();
      bin.classList.remove('over');
      if (dragged) { place(dragged, +bin.dataset.bin); dragged = null; }
    });
  });
});

/* ══ ESCAPE-ROOM MECHANICS ═══════════════════════════════════════════
   Added for the puzzle-lesson format. A deck that uses none of them is
   unaffected: the selectors match nothing and the rail stays hidden. */

/* Timed search. Author as
     <div class="search" data-limit="20">
       <button class="find" data-name="a spoon" data-correct><svg…></button>
       …
     </div>
   The engine adds the clock, hides the names until the item is answered,
   and marks it wrong if the clock runs out. One point.

   The names must stay hidden while the clock runs. A labelled picture
   turns a vocabulary task into a reading task: the learner scans for the
   word in the stem instead of recognising the object. They are revealed
   on answering, which is when they teach. */
slides.filter(s => s.dataset.type === 'search').forEach(slide => {
  const box = slide.querySelector('.search');
  if (!box) return;
  const items = [...box.querySelectorAll('.find')];
  if (!items.length) return;
  const limit = +(box.dataset.limit || 20);
  const key = items.find(i => i.hasAttribute('data-correct'));

  const bar = document.createElement('div'); bar.className = 'search-bar';
  const track = document.createElement('div'); track.className = 'search-track';
  const fill = document.createElement('div'); fill.className = 'search-fill';
  const clock = document.createElement('span'); clock.className = 'search-clock';
  track.appendChild(fill);
  bar.append(track, clock);
  const grid = document.createElement('div');
  grid.className = 'find-grid';
  grid.style.gridTemplateColumns = `repeat(${items.length}, 1fr)`;
  items.forEach(it => {
    const n = document.createElement('span');
    n.className = 'find-name';
    n.textContent = it.dataset.name || '';
    it.appendChild(n);
    grid.appendChild(it);
  });
  box.replaceChildren(bar, grid);

  let left = limit, tid = null;
  clock.textContent = left + 's';

  function finish(chosen) {
    if (answered.has(slide)) return;
    if (tid) { clearInterval(tid); tid = null; }
    answered.add(slide);
    const ok = !!chosen && chosen.hasAttribute('data-correct');
    items.forEach(i => { i.disabled = true; i.classList.add('revealed'); });
    if (key) key.classList.add('correct');
    if (chosen && !ok) chosen.classList.add('wrong');
    if (ok) score++;
    updateScoreChip();
    feedback(slide, ok, ok || !key ? null : key.dataset.name);
    markRail(slide);          // the digit is picked up here, not on arrival
  }

  items.forEach(i => i.addEventListener('click', () => finish(i)));

  slide._enter = () => {
    if (answered.has(slide) || tid) return;
    tid = setInterval(() => {
      left--;
      clock.textContent = Math.max(0, left) + 's';
      fill.style.width = Math.max(0, left / limit * 100) + '%';
      if (left <= 5) bar.classList.add('urgent');
      if (left <= 0) finish(null);
    }, 1000);
  };
  slide._leave = () => { if (tid) { clearInterval(tid); tid = null; } };
});

/* Combination lock. Author as
     <div class="lock" data-code="63741"></div>
   The engine builds the display and the keypad. The first attempt is the
   one that scores; after that the learner keeps trying until it opens,
   because the lock is the last door and the story has to get through it. */
slides.filter(s => s.dataset.type === 'lock').forEach(slide => {
  const box = slide.querySelector('.lock');
  if (!box) return;
  const code = (box.dataset.code || '').trim().split('');
  if (!code.length) return;

  const disp = document.createElement('div'); disp.className = 'lock-display';
  const cells = code.map(() => {
    const c = document.createElement('span'); c.className = 'lock-cell';
    disp.appendChild(c); return c;
  });
  const keys = document.createElement('div'); keys.className = 'lock-keys';
  const pad  = document.createElement('div'); pad.className  = 'lock-pad';

  let entry = [], scoredOnce = false, opened = false;
  const draw = () => cells.forEach((c, i) => {
    c.textContent = entry[i] != null ? entry[i] : '';
    c.classList.toggle('filled', entry[i] != null);
  });

  '1234567890'.split('').forEach(n => {
    const b = document.createElement('button');
    b.className = 'lock-key'; b.textContent = n;
    b.addEventListener('click', () => {
      if (opened || entry.length >= code.length) return;
      entry.push(n); draw();
    });
    pad.appendChild(b);
  });
  const del = document.createElement('button');
  del.className = 'lock-key'; del.textContent = '⌫';
  del.setAttribute('aria-label', 'delete');
  del.addEventListener('click', () => { if (!opened) { entry.pop(); draw(); } });
  pad.appendChild(del);

  const go = document.createElement('button');
  go.className = 'btn'; go.dataset.i18n = 'btnOpen'; go.textContent = 'Open';
  go.addEventListener('click', () => {
    if (opened || entry.length < code.length) return;
    const ok = entry.join('') === code.join('');
    if (!scoredOnce) {
      scoredOnce = true; answered.add(slide);
      if (ok) score++;
      updateScoreChip();
    }
    if (ok) {
      opened = true;
      cells.forEach(c => c.classList.add('ok'));
      pad.querySelectorAll('.lock-key').forEach(k => k.disabled = true);
      go.disabled = true;
      feedback(slide, true);
    } else {
      box.classList.add('bad');
      setTimeout(() => box.classList.remove('bad'), 400);
      feedback(slide, false, code.join(''));
      entry = []; draw();
    }
  });

  keys.append(pad, go);
  box.replaceChildren(disp, keys);
  draw();
});

/* The rail. A lesson declares its stops as a pipe-separated string, in
   UI_I18N under the key named by data-i18n-stops, and each slide says
   which stop it belongs to (data-stop) and what was picked up there
   (data-take). Reached stops stay reached when the learner pages back. */
const deckRail = document.getElementById('deckRail');
const railTakes = new Map();
let railMax = 0, railCur = 0;

function markRail(slide) {
  const st = +(slide.dataset.stop || 0);
  if (st) {
    railCur = st;
    railMax = Math.max(railMax, st);
    // A digit carried by a scored slide is only picked up once that slide
    // has been answered. Otherwise the rail prints the reward the moment
    // the learner arrives, and the question is over before it is asked.
    if (slide.dataset.take &&
        (!scored.includes(slide) || answered.has(slide)))
      railTakes.set(st, slide.dataset.take);
  }
  renderRail();
}

function renderRail() {
  if (!deckRail) return;
  const raw = (deckRail.dataset.i18nStops ? t(deckRail.dataset.i18nStops) : null)
            || deckRail.dataset.stops || '';
  const labels = raw.split('|').map(x => x.trim()).filter(Boolean);
  if (!labels.length) { deckRail.hidden = true; stage.classList.remove('has-rail'); return; }
  deckRail.replaceChildren(...labels.map((label, i) => {
    const n = i + 1;
    const el = document.createElement('div');
    el.className = 'rail-stop'
      + (n <= railMax ? ' reached' : '')
      + (n === railCur ? ' current' : '')
      + (railTakes.has(n) ? ' has-digit' : '');
    const d = document.createElement('span');
    d.className = 'rail-digit';
    d.textContent = railTakes.has(n) ? railTakes.get(n) : '·';
    const l = document.createElement('span');
    l.className = 'rail-label'; l.textContent = label;
    el.append(d, l);
    return el;
  }));
  deckRail.hidden = false;
  stage.classList.add('has-rail');
}

/* Gap fill. Several gaps per slide, grouped and explained by .gap-row —
   and several gaps per row, which the engine scores individually. */
/* Typography must never decide whether a learner is right. An author writing
   can’t / couldn’t with a curly apostrophe — which is what good prose wants —
   made the answer unreachable from a keyboard, which types a straight one.
   Both sides are normalised: curly quotes flattened, and the various dashes
   too, for the same reason. Found on the Scarlet Star final lock, where the
   key AND every alternative were unmatchable. */
const flatten = s => s.trim().toLowerCase()
  .replace(/[\u2018\u2019\u201B\u02BC\u00B4\u0060]/g, "'")
  .replace(/[\u201C\u201D]/g, '"')
  .replace(/[\u2010-\u2015]/g, '-')
  .replace(/\s+/g, ' ');
const gapOk = g => g.dataset.answer.split('|')
  .map(flatten)
  .includes(flatten(g.value));

function markGap(g) {
  const ok = gapOk(g);
  g.classList.add(ok ? 'correct' : 'wrong');
  g.disabled = true;
  if (ok) score++;
  return ok;
}

/* Mark EVERY input in a group and write ONE piece of feedback for it.

   This used to mark the first input and stop, while maxScore counted them
   all — so a row like "___ she ___ an alien?" was worth two points and
   could only ever earn one. The learner typed both words correctly and
   watched the score go up by one, with no way to tell which half had
   supposedly failed. Found on Food A1 Part 1; it was also costing
   exam-prep five points and two other lessons one each.

   A miss now names every answer it missed, not just the first. */
function fillFeedback(fb, missed) {
  const why = fb.dataset.explain ? ' ' + fb.dataset.explain : '';
  fb.innerHTML = (missed.length === 0 ? t('fbCorrect')
    : `${t('fbWrong')} ${t('fbAnswer')} ` +
      missed.map(g => g.dataset.answer.split('|')[0]).join(', ') + '.') + why;
  fb.className = 'feedback show ' + (missed.length === 0 ? 'ok' : 'no');
}

function markGroup(gaps, fb) {
  const missed = gaps.filter(g => !markGap(g));
  if (fb) fillFeedback(fb, missed);
  return missed;
}

function checkGaps(slide) {
  if (answered.has(slide)) return;
  // A slide with no gap on it is not a gap-fill: sentence-building shipped
  // for months with a plain [data-action="check"] button, which landed
  // here, threw on a null input and left the Check button dead. Route it
  // to the slide's own checker instead of guessing.
  if (!slide.querySelector('.gap')) {
    if (slide._check) slide._check();
    return;
  }
  answered.add(slide);
  const rows = [...slide.querySelectorAll('.gap-row')];
  // A screen may carry ONE pooled explanation instead of one per row — the
  // four traps are variations on a single point and read better together,
  // and four per-row feedback blocks reserve 46px each whether or not
  // anyone has pressed Check. It shipped that way on Food A1 and was never
  // once displayed: this loop only ever touched feedback found *inside* a
  // row, so the slide's own note sat in the DOM with no code path to reach
  // it. The learner pressed Check, saw the gaps go green, and got no
  // explanation at all.
  const pooled = [...slide.querySelectorAll('.feedback')]
    .find(f => !f.closest('.gap-row'));
  if (rows.length) {
    const missed = rows.flatMap(r => markGroup([...r.querySelectorAll('.gap')],
                                               r.querySelector('.feedback')));
    if (pooled) fillFeedback(pooled, missed);
  } else {
    // No .gap-row wrappers: the whole slide is one group. Marking only the
    // first input here is the same bug in its other form.
    markGroup([...slide.querySelectorAll('.gap')], pooled);
  }
  const btn = slide.querySelector('[data-action="check"]');
  if (btn) btn.disabled = true;
  updateScoreChip();
  // In branch mode a gap slide may pay into the ledger, but only when every
  // gap on it is right. Without this a scored slide costs the learner effort
  // and returns nothing to the state that picks their ending.
  if (BRANCH && slide.dataset.dp) {
    const clean = ![...slide.querySelectorAll('.gap')].some(g => g.classList.contains('wrong'));
    if (clean) applyLedger(slide); else spent.add(slide);
  }
}

/* ── Activation: word count, copy, and a print mirror (a textarea's
   value does not appear in a PDF, so we mirror it into a div). ── */
const actInput = document.getElementById('actInput');
if (actInput) {
  const countEl = document.getElementById('actCount');
  const printEl = document.getElementById('actPrint');
  const sync = () => {
    const words = actInput.value.trim().split(/\s+/).filter(Boolean).length;
    countEl.textContent = t('wordCount')(words);
    printEl.textContent = actInput.value;
  };
  actInput.addEventListener('input', sync);
  window.syncActivation = sync;
  sync();
}

/* ── Glosses. NARRATIVE_TR is per-lesson; absent, none of this runs. ── */
function wireGlosses() {
  if (typeof NARRATIVE_TR === 'undefined') return;
  document.querySelectorAll('.gloss[data-tr]').forEach(el => {
    if (el._glossed) return;
    el._glossed = true;
    const tr = document.createElement('p'); tr.className = 'gloss-tr';
    const btn = document.createElement('button'); btn.className = 'gloss-btn'; btn.type = 'button';
    el.after(tr); tr.before(btn);
    btn.addEventListener('click', () => {
      const on = tr.classList.toggle('show');
      btn.textContent = t(on ? 'glossHide' : 'glossShow');
    });
    el._gloss = { tr, btn };
  });
  syncGlosses();
}
function syncGlosses() {
  if (typeof NARRATIVE_TR === 'undefined') return;
  const bank = NARRATIVE_TR[currentLang];
  // No translation for this language means no control — an empty reveal is
  // worse than none, which is the same reason a half-done language stays out
  // of the switcher entirely.
  document.documentElement.dataset.gloss = bank ? 'on' : 'off';
  document.querySelectorAll('.gloss[data-tr]').forEach(el => {
    const g = el._gloss; if (!g) return;
    const txt = bank && bank[el.dataset.tr];
    g.btn.hidden = !txt;
    g.tr.innerHTML = txt || '';
    g.tr.classList.remove('show');
    g.btn.textContent = t('glossShow');
  });
}

/* ── Events ── */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const act = a.dataset.action;
  if (act === 'next') BRANCH ? followFirst() : show(idx + 1);
  if (act === 'prev') BRANCH ? (trail.length && show(trail.pop())) : show(idx - 1);
  if (act === 'check') checkGaps(a.closest('.slide'));
  if (act === 'check-order') { const sl = a.closest('.slide'); if (sl._check) sl._check(); }
  if (act === 'restart') {
    if (!BRANCH) return location.reload();
    // Replay resets the ledger but keeps the learner in the page, so a class
    // can run the other route immediately.
    trail.length = 0; seenScored.clear(); score = 0;
    slides.forEach(sl => { answered.delete(sl); });
    ledgerInit(); updateScoreChip();
    goNode(a.dataset.goto || START, false);
  }
  if (act === 'copy-writing') {
    const ta = document.getElementById('actInput');
    if (ta && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => {
      const was = a.textContent;
      a.textContent = t('btnCopied');
      setTimeout(() => { a.textContent = was; }, 1400);
    });
  }
});

/* Branch links. A choice may also move the ledger; the cost is paid once,
   on the click that commits to it. */
document.addEventListener('click', e => {
  if (!BRANCH) return;
  const g = e.target.closest('[data-goto]');
  if (!g || g.disabled || g.dataset.action === 'restart') return;
  if (g.classList.contains('opt')) return;   // options route after feedback
  applyLedger(g);
  goNode(g.dataset.goto);
});
function followFirst() {
  const g = slides[idx].querySelector('[data-goto]:not([disabled])');
  if (g) { applyLedger(g); goNode(g.dataset.goto); }
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) {
    if (e.key === 'Enter') checkGaps(e.target.closest('.slide'));
    return;
  }
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) {
    e.preventDefault(); BRANCH ? followFirst() : show(idx + 1);
  }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) {
    e.preventDefault(); BRANCH ? (trail.length && show(trail.pop())) : show(idx - 1);
  }
});

/* ── Language ── */
/* Turn authored HTML into the plain text an attribute can hold. */
function decodeEntities(str) {
  const d = document.createElement('textarea');
  d.innerHTML = str;
  return d.value;
}

function applyLang() {
  syncGlosses();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (v != null) el.innerHTML = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = t(el.dataset.i18nPh);
    // A placeholder is a plain-text attribute, so it cannot take HTML - but
    // the string is authored as HTML like every other one, so decode it first
    // or "Yesterday I&hellip;" reaches the box with the entity spelled out.
    if (v != null) el.placeholder = decodeEntities(v);
  });
  if (window.syncActivation) window.syncActivation();
  document.documentElement.lang = currentLang;
  document.documentElement.dir = RTL_LANGS.includes(currentLang) ? 'rtl' : 'ltr';
  updateScoreChip();
  show(idx);
}

function initLang() {
  const sel = document.getElementById('langSelect');
  // Only offer languages that are actually translated. An empty or partial
  // scaffold stays in the code for a future pass but never appears as a dead
  // option in the menu.
  const enKeys = Object.keys(UI_I18N.en).length;
  LANGS.filter(l => l.code === 'en' ||
                    Object.keys(UI_I18N[l.code] || {}).length >= enKeys)
       .forEach(l => sel.add(new Option(l.label, l.code)));
  sel.value = currentLang;
  sel.hidden = sel.options.length < 2;
  sel.addEventListener('change', () => { currentLang = sel.value; applyLang(); });
}

/* Per-slide background art: set the variable on the element as well, because
   the print stylesheet paints each slide's own ::before from var(--hero).

   Decode them all up front. A background-image on a display:none slide is
   never fetched, so a deck printed without visiting every slide first
   exported those pages with no artwork at all — black interiors in the
   PDF while the screen looked right. */
slides.filter(s => s.dataset.bg).forEach(s => {
  s.style.setProperty('--hero', `url('${s.dataset.bg}')`);
  new Image().src = s.dataset.bg;
});

/* ── Boot ── */
initLang();
fitStage();
applyLang();
updateScoreChip();

/* Reveal the wordmark only once DM Sans is really available, so the
   Forbes/ENGLISH lockup never renders at fallback-font proportions. */
const ready = () => document.body.classList.add('fonts-ready');
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(ready); setTimeout(ready, 1500); }
else ready();
</script>

<script>
/* TRANSLATE-ON-REQUEST.
   The dictionary is keyed by the EXACT normalised English on screen, and the
   normaliser is shared with check-i18n.js so the gate and the runtime can
   never disagree about what a key is. .opt-key (the A/B/C/D letter) and any
   gloss are stripped first - they are chrome, not the sentence. */
(function () {
  var TR = window.BW_TR || {};
  var SEL = '.q-stem, .opt, .sort-item, .sort-bin-label, .match-item, ' +
            '.order-chip, .chunk, .bank-chip, .act-item, .exlist span, ' +
            '.gap-row .dim, .cover-title, .formula, .dictum';
  function norm(el) {
    var c = el.cloneNode(true);
    c.querySelectorAll('.opt-key, .sup, .fnote').forEach(function (x) { x.remove(); });
    return (c.textContent || '').replace(/\s+/g, ' ').trim();
  }
  window.bwNorm = norm;
  var btn = document.getElementById('bwTrBtn');
  var panel = document.getElementById('bwTrPanel');
  if (!btn || !panel) return;

  function lang() { return document.documentElement.lang || 'en'; }
  function active() { return document.querySelector('.slide.is-active'); }

  /* THE PANEL WAS EMPTY ON A THIRD OF THE LINE, AND IT WAS LOOKING IN ONE
     PLACE ONLY. Innes: "ENG/DE button skimps on duties a lot". Measured
     across the eighteen Block Camp decks in German: 137 of 414 slides opened
     the panel and were told "nothing here is English-only" - and the empty
     ones are almost always slides 1-8, the TEACH slides.

     The reason is SEL. It lists the exercise shapes - stems, options, chips,
     sort items, match items - because those are what the DICTIONARY holds.
     A teach slide's prose is not in the dictionary at all. But it is not
     untranslated: it carries its ES/DE gloss inline, in a .sup, right there
     in the markup. The panel simply never looked at them.

     So the dictionary is now the first source and the slide's own glosses are
     the second. Each visible .sup is paired with the English of the element
     it hangs off - the example list, the paradigm head, the stem - and listed
     like any other row. Nothing new to author: this is the deck showing what
     it already says.

     It also rescues the two passive decks, which are the worst on the line
     (7 and 15 strings covered out of 86 and 88) because they take their
     chassis, and therefore their dictionary, from the ACTIVE camp they
     descend past - so almost nothing in it matches their own sentences. */
  function glossRows(s, L, seen, rows) {
    var esc = function (t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
    var add = function (en, de) {
      if (!en || !de || seen[en]) return;
      seen[en] = 1;
      rows.push('<div class="tr-row"><span>' + esc(en) + '</span><span>' + esc(de) + '</span></div>');
    };
    [].forEach.call(s.querySelectorAll('.sup[data-lang="' + L + '"]'), function (sup) {
      if (!sup.offsetParent && getComputedStyle(sup).display === 'none') return;
      var host = sup.parentElement;
      if (!host) return;
      var de = (sup.querySelector('span') || sup).textContent.replace(/\s+/g, ' ').trim();
      if (!de) return;
      /* AN EXAMPLE LIST IS A LIST ON BOTH SIDES, AND norm() FLATTENS IT.
         Its first output read "yesterdaylast nightin 1990when I was a child"
         against the whole German line - one unreadable row that also repeated
         four rows the dictionary had already given individually. The gloss is
         written with the same middots and in the same order as the chips, so
         when the two sides count the same they are paired one to one, and
         anything already listed is skipped. Only a mismatch falls back to the
         single joined row, which is still better than nothing. */
      var list = host.querySelector('.exlist');
      if (list) {
        var chips = [].map.call(list.children, function (c) {
          return (c.textContent || '').replace(/\s+/g, ' ').trim(); });
        var parts = de.split(/\s*[\u00b7\u2022]\s*/).filter(Boolean);
        if (chips.length && chips.length === parts.length) {
          chips.forEach(function (c, i) { add(c, parts[i]); });
          return;
        }
        add(chips.join(' \u00b7 '), de);
        return;
      }
      add(norm(host), de);
    });
  }

  function render() {
    var L = lang(), dict = TR[L] || {}, s = active();
    var seen = {}, rows = [];
    if (s) [].forEach.call(s.querySelectorAll(SEL), function (el) {
      var k = norm(el);
      if (!k || seen[k] || !dict[k]) return;
      seen[k] = 1;
      rows.push('<div class="tr-row"><span>' + k.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
                '</span><span>' + dict[k] + '</span></div>');
    });
    if (s && L !== 'en') glossRows(s, L, seen, rows);
    panel.innerHTML = '<h4>' + (L === 'de' ? 'Auf Deutsch' : L === 'es' ? 'En español' : 'Translation') + '</h4>' +
      (rows.length ? '<div class="tr-grid">' + rows.join('') + '</div>'
                   : '<p class="tr-empty">' +
                     (L === 'de' ? 'Auf dieser Seite steht nichts, was nur auf Englisch ist.'
                      : L === 'es' ? 'En esta página no hay nada solo en inglés.'
                      : 'Nothing on this slide is English-only.') + '</p>');
  }

  function sync() {
    var L = lang(), on = L !== 'en' && Object.keys(TR[L] || {}).length;
    btn.hidden = !on;
    btn.textContent = 'EN / ' + L.toUpperCase();
    if (!on) { panel.classList.remove('show'); btn.classList.remove('on'); }
    else if (panel.classList.contains('show')) render();
  }

  btn.addEventListener('click', function () {
    var open = panel.classList.toggle('show');
    btn.classList.toggle('on', open);
    if (open) render();
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-action="next"], [data-action="prev"]')) {
      if (panel.classList.contains('show')) setTimeout(render, 60);
    }
  });
  var sel = document.getElementById('langSelect');
  if (sel) sel.addEventListener('change', function () { setTimeout(sync, 30); });
  new MutationObserver(function () {
    if (panel.classList.contains('show')) render();
  }).observe(document.querySelector('.stage') || document.body,
             { attributes: true, subtree: true, attributeFilter: ['class'] });
  sync();
})();
</script>
<script>
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-action="hint"]');
  if (!b) return;
  var panel = b.parentElement.querySelector('.hint-panel');
  if (!panel) return;
  var on = panel.classList.toggle('show');
  b.classList.toggle('on', on);
});
</script>
</body>
</html>
