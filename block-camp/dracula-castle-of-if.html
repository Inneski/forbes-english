all verursachen.','Enlever la goupille pourrait causer un accident réel.','Togliere il perno potrebbe causare un vero incidente futuro.','Retirar o perno pode causar um acidente real no futuro.','Usunięcie sworznia może spowodować realny wypadek w przyszłości.','拔掉这枚销钉,可能在未来真的引发事故。','留め金を外せば、現実に将来事故が起こるかもしれない。','Pimi çıkarmak gerçek bir gelecek kazasına yol açabilir.','قد تسبب إزالة المسمار حادثاً مستقبلياً حقيقياً.','Снятие штифта может вызвать реальную аварию в будущем.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.','Choisis le PREMIER CONDITIONNEL.','Scegli il PRIMO CONDIZIONALE.','Escolha o PRIMEIRO CONDICIONAL.','Wybierz PIERWSZY OKRES WARUNKOWY.','选出第一条件句。','第一条件文を選べ。','BİRİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الأول.','Выбери ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan removes the pin, the carriage will lose a wheel.','Si Jonathan quita el perno, el coche perderá una rueda.','Wenn Jonathan den Bolzen entfernt, wird die Kutsche ein Rad verlieren.','Si Jonathan enlève la goupille, le carrosse perdra une roue.','Se Jonathan toglie il perno, la carrozza perderà una ruota.','Se Jonathan retirar o perno, a carruagem vai perder uma roda.','Jeśli Jonathan usunie sworzeń, powóz straci koło.','如果乔纳森拔掉销钉,马车就会掉一个轮子。','もしジョナサンが留め金を外せば、馬車は車輪を失うだろう。','Jonathan pimi çıkarırsa, araba bir tekerlek kaybedecek.','إن أزال جوناثان المسمار، ستفقد العربة عجلة.','Если Джонатан снимет штифт, экипаж потеряет колесо.'),T('If Jonathan removed the pin, the carriage loses yesterday.','Si Jonathan quitara el perno, el coche pierde ayer.','Wenn Jonathan den Bolzen entfernte, verliert die Kutsche gestern.','Si Jonathan enlevait la goupille, le carrosse perd hier.','Se Jonathan togliesse il perno, la carrozza perde ieri.','Se Jonathan retirasse o perno, a carruagem perde ontem.','Gdyby Jonathan usunął sworzeń, traci wczoraj.','如果乔纳森拔掉了销钉,马车昨天掉轮子。','もしジョナサンが留め金を外したら、昨日車輪を失う。','Jonathan pimi çıkarsaydı, araba dün kaybeder.','لو أزال جوناثان المسمار، تفقد أمس.','Если бы Джонатан снял штифт, экипаж теряет вчера.'),T('If Jonathan will remove the pin, the carriage lost a wheel.','Si Jonathan quitará el perno, el coche perdió una rueda.','Wenn Jonathan den Bolzen entfernen wird, verlor die Kutsche ein Rad.','Si Jonathan enlèvera la goupille, le carrosse a perdu une roue.','Se Jonathan toglierà il perno, la carrozza perse una ruota.','Se Jonathan vai retirar o perno, a carruagem perdeu uma roda.','Jeśli Jonathan będzie usuwał sworzeń, powóz stracił koło.','如果乔纳森将会拔掉销钉,马车掉过一个轮子。','もしジョナサンが留め金を外すでしょうなら、馬車は車輪を失った。','Jonathan pimi çıkaracaksa, araba bir tekerlek kaybetti.','إن سيزيل جوناثان المسمار، فقدت العربة عجلة.','Если Джонатан будет снимать штифт, экипаж потерял колесо.')],answer:0,fb:T('First conditional predicts a real possible result.','El primer condicional predice un resultado real y posible.','Der erste Konditionalsatz sagt ein reales mögliches Ergebnis voraus.','Le premier conditionnel prédit un résultat réel et possible.','Il primo condizionale predice un esito reale e possibile.','O primeiro condicional prevê um resultado real e possível.','Pierwszy okres warunkowy przewiduje realny, możliwy skutek.','第一条件句预测一个真实可能的结果。','第一条件文は現実に起こりうる結果を予測する。','Birinci şart cümlesi, gerçek ve mümkün bir sonucu öngörür.','الشرط الأول يتنبأ بنتيجة حقيقية ممكنة.','Первый условный предсказывает реальный возможный результат.'),evidence:1,next:'final_escape'},
final_escape:{img:'27_final_escape',pos:'left',kind:'question',q:17,k:T('FINAL TEST · THE CLIFF WALL','PRUEBA FINAL · EL MURO DEL ACANTILADO','LETZTE PRÜFUNG · DIE FELSWAND','TEST FINAL · MUR DU PRÉCIPICE','PROVA FINALE · PARETE DEL DIRUPO','TESTE FINAL · MURO DO PRECIPÍCIO','OSTATNIA PRÓBA · ŚCIANA URWISKA','最终考验 · 崖壁','最後の試練 · 崖の壁','SON SINAV · UÇURUM DUVARI','الاختبار الأخير · جدار الجرف','ПОСЛЕДНЕЕ ИСПЫТАНИЕ · СТЕНА ОБРЫВА'),title:T('IF THE ROPE HOLDS…','SI LA CUERDA AGUANTA…','WENN DAS SEIL HÄLT…','SI LA CORDE TIENT…','SE LA CORDA REGGE…','SE A CORDA AGUENTAR…','JEŚLI LINA UTRZYMA…','若绳索能撑住……','もしロープが持ちこたえたら…','İP DAYANIRSA…','إن صمد الحبل…','ЕСЛИ ВЕРЁВКА ВЫДЕРЖИТ…'),story:T('Jonathan climbs down the sheet-rope. Wolves race across the battlements. Dracula reaches the window above.','Jonathan baja por la cuerda de sábanas. Los lobos corren por las murallas. Drácula llega a la ventana de arriba.','Jonathan klettert am Bettlakenseil hinab. Wölfe rasen über die Zinnen. Dracula erreicht das Fenster über ihm.','Jonathan descend le long de la corde de draps. Des loups courent sur les remparts. Dracula atteint la fenêtre au-dessus.','Jonathan scende lungo la corda di lenzuola. I lupi corrono lungo i bastioni. Dracula raggiunge la finestra sopra.','Jonathan desce pela corda de lençóis. Os lobos correm pelas ameias. Drácula alcança a janela lá em cima.','Jonathan schodzi po linie z prześcieradeł. Wilki pędzą po blankach murów. Drakula dociera do okna w górze.','乔纳森顺着床单绳往下爬。狼群沿城垛疾奔而过。德古拉已到了上方的窗口。','ジョナサンはシーツのロープを伝って下りる。狼たちが胸壁を駆け抜ける。ドラキュラが上の窓にたどり着く。','Jonathan çarşaf ipinden aşağı iner. Kurtlar siperlerin üzerinden koşar. Drakula yukarıdaki pencereye ulaşır.','ينزل جوناثان عبر حبل الملاءات. تركض الذئاب فوق الأسوار. يصل دراكولا إلى النافذة في الأعلى.','Джонатан спускается по верёвке из простыней. Волки мчатся по зубцам стены. Дракула добирается до окна наверху.'),clue:T('The rope is holding now. The cliff path is below.','La cuerda aguanta ahora. El sendero está abajo.','Das Seil hält jetzt. Der Felsenpfad liegt darunter.','La corde tient maintenant. Le sentier est en bas.','La corda regge ora. Il sentiero del dirupo è più in basso.','A corda aguenta agora. O caminho está lá em baixo.','Lina trzyma teraz. Ścieżka nad urwiskiem jest poniżej.','此刻绳索正撑着。悬崖小径就在下方。','ロープは今持ちこたえている。崖の小道は下にある。','İp şu anda dayanıyor. Uçurum patikası aşağıda.','الحبل يصمد الآن. طريق الجرف في الأسفل.','Верёвка держит сейчас. Тропа над обрывом — внизу.'),prompt:T('Complete the final FIRST CONDITIONAL.','Completa el PRIMER CONDICIONAL final.','Vervollständige den letzten ERSTEN KONDITIONALSATZ.','Complète le PREMIER CONDITIONNEL final.','Completa il PRIMO CONDIZIONALE finale.','Complete o PRIMEIRO CONDICIONAL final.','Uzupełnij ostatni PIERWSZY OKRES WARUNKOWY.','补全最后的第一条件句。','最後の第一条件文を完成させよ。','Son BİRİNCİ ŞART CÜMLESİ\'ni tamamla.','أكمل الشرط الأول الأخير.','Заверши финальный ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If the rope held, Jonathan reaches yesterday.','Si la cuerda aguantara, Jonathan llega ayer.','Wenn das Seil hielte, erreicht Jonathan gestern.','Si la corde tenait, Jonathan atteint hier.','Se la corda reggesse, Jonathan arriva ieri.','Se a corda aguentasse, Jonathan chega ontem.','Gdyby lina wytrzymała, Jonathan dociera wczoraj.','如果绳索撑住了,乔纳森昨天就到达。','もしロープが持ちこたえたら、昨日たどり着く。','İp dayansaydı, Jonathan dün ulaşır.','لو صمد الحبل، يصل جوناثان أمس.','Если бы верёвка выдержала, Джонатан добирается вчера.'),T('If the rope holds, Jonathan will reach the cliff path.','Si la cuerda aguanta, Jonathan llegará al sendero.','Wenn das Seil hält, wird Jonathan den Felsenpfad erreichen.','Si la corde tient, Jonathan atteindra le sentier.','Se la corda regge, Jonathan raggiungerà il sentiero del dirupo.','Se a corda aguentar, Jonathan vai chegar ao caminho do precipício.','Jeśli lina wytrzyma, Jonathan dotrze do ścieżki nad urwiskiem.','如果绳索撑得住,乔纳森就会到达悬崖小径。','もしロープが持ちこたえれば、ジョナサンは崖の小道にたどり着くだろう。','İp dayanırsa, Jonathan uçurum patikasına ulaşacak.','إن صمد الحبل، سيصل جوناثان إلى طريق الجرف.','Если верёвка выдержит, Джонатан доберётся до тропы над обрывом.'),T('If the rope will hold, Jonathan reached the path.','Si la cuerda aguantará, Jonathan llegó al sendero.','Wenn das Seil halten wird, erreichte Jonathan den Pfad.','Si la corde tiendra, Jonathan a atteint le sentier.','Se la corda reggerà, Jonathan raggiunse il sentiero.','Se a corda vai aguentar, Jonathan chegou ao caminho.','Jeśli lina będzie trzymać, Jonathan dotarł do ścieżki.','如果绳索将会撑住,乔纳森到达过小径。','もしロープが持ちこたえるでしょうなら、ジョナサンは小道にたどり着いた。','İp dayanacaksa, Jonathan patikaya ulaştı.','إن سيصمد الحبل، وصل جوناثان إلى الطريق.','Если верёвка будет держать, Джонатан добрался до тропы.')],answer:1,fb:T('Present after if; will + verb in the result clause. The route is open.','Presente después de si; futuro en el resultado. La ruta está abierta.','Präsens nach wenn; wird + Verb im Ergebnissatz. Der Weg ist frei.','Présent après si ; futur dans la proposition résultat. La voie est ouverte.','Presente dopo se; futuro nella proposizione principale. Il percorso è aperto.','Presente depois de se; futuro na oração-resultado. A rota está aberta.','Czas teraźniejszy po if; czas przyszły w zdaniu głównym. Droga jest otwarta.','if 后用现在时;结果从句用 will + 动词。出路已然打开。','ifの後は現在形、結果節はwill+動詞。道は開かれている。','Eğer\'den sonra geniş zaman; sonuç cümlesinde will + fiil. Yol açık.','مضارع بعد إن؛ سـ + فعل في جملة النتيجة. الطريق مفتوح.','Настоящее после if; will + глагол в результате. Путь открыт.'),next:'resolve'},
success:{img:'28_success_dawn',pos:'left',kind:'ending',k:T('DAWN · OUTSIDE THE CASTLE','AMANECER · FUERA DEL CASTILLO','MORGENRÖTE · AUSSERHALB DES SCHLOSSES','AUBE · HORS DU CHÂTEAU','ALBA · FUORI DAL CASTELLO','AMANHECER · FORA DO CASTELO','ŚWIT · POZA ZAMKIEM','黎明 · 城堡之外','夜明け · 城の外','ŞAFAK · ŞATONUN DIŞINDA','الفجر · خارج القلعة','РАССВЕТ · ЗА СТЕНАМИ ЗАМКА'),title:T('JONATHAN ESCAPES','JONATHAN ESCAPA','JONATHAN ENTKOMMT','JONATHAN S\'ÉCHAPPE','JONATHAN FUGGE','JONATHAN ESCAPA','JONATHAN UCIEKA','乔纳森逃脱','ジョナサン、脱出する','JONATHAN KAÇIYOR','جوناثان يهرب','ДЖОНАТАН СБЕГАЕТ'),story:T('Monks pull Jonathan through their gate as the sun reaches the valley. His journal, evidence and memory have survived. Dracula’s castle is behind him—but the Count’s boxes are already moving west.','Unos monjes llevan a Jonathan tras su puerta cuando el sol toca el valle. Su diario, sus pruebas y su memoria han sobrevivido. El castillo queda atrás, pero las cajas del Conde ya viajan hacia el oeste.','Mönche ziehen Jonathan durch ihr Tor, als die Sonne das Tal erreicht. Sein Tagebuch, seine Beweise und seine Erinnerung haben überlebt. Draculas Schloss liegt hinter ihm – doch die Kisten des Grafen reisen bereits nach Westen.','Des moines tirent Jonathan par leur portail quand le soleil atteint la vallée. Son journal, ses preuves et sa mémoire ont survécu. Le château est derrière lui — mais les caisses du Comte roulent déjà vers l\'ouest.','Dei monaci trascinano Jonathan oltre il loro cancello mentre il sole raggiunge la valle. Il suo diario, le prove e la memoria sono sopravvissuti. Il castello di Dracula è alle sue spalle, ma le casse del Conte viaggiano già verso ovest.','Uns monges puxam Jonathan pelo seu portão enquanto o sol alcança o vale. O seu diário, as provas e a memória sobreviveram. O castelo de Drácula fica para trás — mas as caixas do Conde já se dirigem para o oeste.','Mnisi wciągają Jonathana przez swoją bramę, gdy słońce dociera do doliny. Jego dziennik, dowody i pamięć przetrwały. Zamek Drakuli zostaje za nim — lecz skrzynie hrabiego już podążają na zachód.','阳光洒落山谷之际,修士们把乔纳森拉进了他们的大门。他的日记、证据与记忆都保住了。德古拉的城堡已被抛在身后——但伯爵的木箱早已向西而去。','太陽が谷に届くころ、修道士たちがジョナサンを門の中へ引き入れる。日記も、証拠も、記憶も無事だった。ドラキュラの城は背後に去った——だが伯爵の箱はすでに西へと動き出している。','Güneş vadiye ulaşırken keşişler Jonathan\'ı kapılarından içeri çeker. Günlüğü, kanıtları ve hafızası hayatta kalmıştır. Drakula\'nın şatosu artık arkasında kalmıştır—ama Kont\'un kutuları çoktan batıya doğru yol almaktadır.','يجذب الرهبان جوناثان عبر بوابتهم بينما تصل الشمس إلى الوادي. نجت يومياته وأدلته وذاكرته. قلعة دراكولا خلفه الآن—لكن صناديق الكونت تتحرك بالفعل غرباً.','Монахи втягивают Джонатана через свои ворота, когда солнце достигает долины. Его дневник, улики и память уцелели. Замок Дракулы остался позади — но ящики графа уже движутся на запад.'),next:'epilogue'},
failure:{img:'29_failure',pos:'left',kind:'failure',k:T('THE GATE CLOSES · NO DAWN','LA PUERTA SE CIERRA · SIN AMANECER','DAS TOR SCHLIESST SICH · KEIN MORGEN','LA PORTE SE FERME · PAS D\'AUBE','CANCELLO CHIUSO · NESSUNA ALBA','O PORTÃO FECHA · SEM AMANHECER','BRAMA SIĘ ZAMYKA · BEZ ŚWITU','大门关闭 · 不见天明','門は閉じる · 夜明けは来ない','KAPI KAPANIYOR · ŞAFAK YOK','البوابة تُغلق · لا فجر','ВОРОТА ЗАПЕРТЫ · БЕЗ РАССВЕТА'),title:T('THE CASTLE CLAIMS HIM','EL CASTILLO LO RECLAMA','DAS SCHLOSS FORDERT IHN','LE CHÂTEAU LE RÉCLAME','IL CASTELLO LO RECLAMA','O CASTELO RECLAMA-O','ZAMEK GO POCHŁANIA','城堡将他吞噬','城が彼を奪う','ŞATO ONU ELE GEÇİRİYOR','القلعة تطالب به','ЗАМОК ЗАБИРАЕТ ЕГО'),story:T('Jonathan’s nerve or evidence failed before he reached the cliff. Dracula seals the gate. A final journal page is left unfinished in the dark.','El valor o las pruebas de Jonathan fallaron antes de llegar al acantilado. Drácula cierra la puerta. Una última página del diario queda sin terminar en la oscuridad.','Jonathans Mut oder seine Beweise reichten vor der Felswand nicht aus. Dracula versiegelt das Tor. Eine letzte Tagebuchseite bleibt im Dunkeln unvollendet.','Le courage ou les preuves de Jonathan ont manqué avant qu\'il n\'atteigne le précipice. Dracula scelle la porte. Une dernière page du journal reste inachevée dans le noir.','Il coraggio o le prove di Jonathan sono venuti meno prima che raggiungesse il dirupo. Dracula sigilla il cancello. Un\'ultima pagina del diario resta incompiuta nel buio.','A coragem ou as provas de Jonathan falharam antes de chegar ao precipício. Drácula sela o portão. Uma última página do diário fica por terminar na escuridão.','Odwaga lub dowody Jonathana zawiodły, zanim dotarł do urwiska. Drakula pieczętuje bramę. Ostatnia strona dziennika zostaje niedokończona w ciemności.','乔纳森在抵达悬崖之前,勇气或证据先耗尽了。德古拉封死了大门。日记的最后一页,永远留在了黑暗中,未曾写完。','崖にたどり着く前に、ジョナサンの気力か証拠が尽きた。ドラキュラが門を封じる。日記の最後のページは、闇の中で未完のまま残される。','Jonathan uçuruma ulaşmadan önce cesareti ya da kanıtları tükendi. Drakula kapıyı mühürler. Son bir günlük sayfası karanlıkta yarım kalır.','خانت جوناثان شجاعته أو أدلته قبل أن يبلغ الجرف. يُغلق دراكولا البوابة. تبقى صفحة أخيرة من اليوميات غير مكتملة في الظلام.','Смелость или улики Джонатана подвели его прежде, чем он добрался до обрыва. Дракула запечатывает ворота. Последняя страница дневника остаётся незаконченной во тьме.')},
epilogue:{img:'30_epilogue_ship',pos:'left',kind:'epilogue',k:T('EPILOGUE · THE BLACK SEA','EPÍLOGO · EL MAR NEGRO','EPILOG · DAS SCHWARZE MEER','ÉPILOGUE · LA MER NOIRE','EPILOGO · IL MAR NERO','EPÍLOGO · O MAR NEGRO','EPILOG · CZARNE MORZE','尾声 · 黑海','エピローグ · 黒海','SON SÖZ · KARADENİZ','الخاتمة · البحر الأسود','ЭПИЛОГ · ЧЁРНОЕ МОРЕ'),title:T('THE DEMETER SAILS','EL DEMÉTER NAVEGA','DIE DEMETER SEGELT','LE DEMETER APPAREILLE','IL DEMETER SALPA','O DEMÉTER NAVEGA','DEMETER WYPŁYWA','德梅特号启航','デメテル号、出航す','DEMETER YELKEN AÇIYOR','الديميتر تُبحر','«ДЕМЕТРА» ОТПЛЫВАЕТ'),story:T('Jonathan survived the visit. Dracula did not abandon his plan. Beneath the Demeter’s deck, earth boxes breathe in the storm—and England waits beyond the horizon.','Jonathan sobrevivió a la visita. Drácula no abandonó su plan. Bajo la cubierta del Deméter, las cajas de tierra respiran en la tormenta, e Inglaterra espera tras el horizonte.','Jonathan hat den Besuch überlebt. Dracula gab seinen Plan nicht auf. Unter dem Deck der Demeter atmen die Erdkisten im Sturm – und England wartet hinter dem Horizont.','Jonathan a survécu à la visite. Dracula n\'a pas abandonné son plan. Sous le pont du Demeter, des caisses de terre respirent dans la tempête — et l\'Angleterre attend au-delà de l\'horizon.','Jonathan è sopravvissuto alla visita. Dracula non ha abbandonato il suo piano. Sotto il ponte del Demeter, le casse di terra respirano nella tempesta, e l\'Inghilterra aspetta oltre l\'orizzonte.','Jonathan sobreviveu à visita. Drácula não abandonou o seu plano. Sob o convés do Deméter, as caixas de terra respiram na tempestade — e a Inglaterra espera para além do horizonte.','Jonathan przeżył tę wizytę. Drakula nie porzucił swojego planu. Pod pokładem Demetera skrzynie z ziemią oddychają w sztormie — a Anglia czeka za horyzontem.','乔纳森从这场造访中生还,德古拉却未曾放弃他的计划。德梅特号的甲板之下,木箱中的泥土在风暴中静静"呼吸"——而英格兰,正在地平线的另一端等待。','ジョナサンは訪問を生き延びた。だがドラキュラは計画を捨てなかった。デメテル号の甲板の下、嵐の中で土の箱が息づく——そして水平線の先にはイングランドが待っている。','Jonathan ziyaretten sağ çıktı. Drakula planından vazgeçmedi. Demeter\'in güvertesinin altında, toprak kutuları fırtınada nefes alır—ve İngiltere ufkun ötesinde bekler.','نجا جوناثان من الزيارة. لم يتخلَّ دراكولا عن خطته. تحت سطح الديميتر، تتنفس صناديق التراب في العاصفة—وتنتظر إنجلترا خلف الأفق.','Джонатан пережил визит. Дракула не отказался от своего плана. Под палубой «Деметры» ящики с землёй дышат в буре — а Англия ждёт за горизонтом.')}
};

const HOT={"cover": [84, 24, 10, 26, "left", "center"], "rules": [60, 74, 20, 18, "left", "center", 58], "train": [62, 55, 10, 13, "left", "center"], "inn": [27, 48, 6, 10, "right", "center"], "coach": [72, 28, 10, 18, "left", "top", 36], "blue_fire": [63, 68, 20, 26, "left", "top"], "choice1": [12, 11, 8, 13, "left", "top"], "blue_treasure": [80, 76, 15, 16, "left", "top", 34], "blue_cross": [30, 38, 7, 11, "right", "center"], "wolves": [85, 24, 12, 20, "left", "center"], "coach_rescue": [63, 52, 11, 30, "left", "top", 32], "castle_gate": [72, 58, 7, 15, "left", "top", 38], "dinner": [76, 44, 10, 24, "left", "center"], "mirror": [45, 30, 10, 15, "left", "center", 32], "locked_room": [40, 75, 8, 12, "right", "center"], "choice2": [80, 22, 9, 15, "left", "top"], "forged_letters": [43, 72, 24, 15, "left", "top"], "stolen_key": [46, 44, 7, 11, "right", "bottom"], "wall_crawl": [77, 56, 14, 56, "left", "top", 38, 14], "vampire_brides": [40, 27, 10, 17, "right", "top"], "shipping_plan": [46, 72, 22, 15, "left", "center"], "earth_boxes": [72, 42, 9, 11, "left", "center"], "stolen_clothes": [86, 52, 7, 18, "left", "center"], "last_chance": [17, 50, 11, 28, "right", "center"], "escape_plan": [66, 55, 6, 34, "left", "bottom"], "choice3": [12, 45, 15, 32, "center", "top"], "crypt_tomb": [70, 57, 24, 22, "left", "top"], "stake_decision": [75, 63, 12, 13, "left", "center"], "courtyard_carts": [62, 62, 20, 20, "right", "top"], "carriage_sabotage": [48, 62, 15, 22, "left", "top", 32], "final_escape": [87, 14, 9, 13, "left", "center"], "success": [55, 58, 24, 28, "right", "top"], "failure": [56, 70, 12, 32, "left", "top"], "epilogue": [75, 55, 32, 32, "left", "center"]};
let state={scene:'cover',score:0,nerve:5,evidence:0,lang:'off',open:false,answered:false,route:[],awards:new Set(),visited:new Set(),results:{}};
const frame=document.getElementById('frame'), content=document.getElementById('content'), sceneImage=document.getElementById('sceneImage');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function line(obj,cls=''){const en=escapeHTML(obj.en);if(state.lang==='off')return `<span class="${cls}">${en}</span>`;return `<span class="${cls}">${en}<span class="translation">${escapeHTML(obj[state.lang])}</span></span>`}
function label(obj){return state.lang==='off'?escapeHTML(obj.en):`${escapeHTML(obj.en)}<span class="translation">${escapeHTML(obj[state.lang])}</span>`}
function updateHUD(){document.getElementById('score').textContent=state.score;document.getElementById('nerve').textContent='♥'.repeat(state.nerve)+'♡'.repeat(5-state.nerve);document.getElementById('evidence').textContent='◆'.repeat(state.evidence)+'◇'.repeat(3-state.evidence);const s=scenes[state.scene];document.getElementById('progress').textContent=`${s.q||Math.min(17,[...state.visited].filter(x=>scenes[x]?.q).length)}/17`;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function head(s,cover=false){const t=cover?`<span class="pre">GRAMMAR STOKER’S</span><span class="big">BLOCULA</span>`:label(s.title);return `${line(s.k,'kicker')}<h1 class="title ${cover?'cover-title':''}">${t}</h1>${line(s.story,'story')}`}
function render(){const s=scenes[state.scene];state.answered=false;const h=HOT[state.scene];frame.className=`frame ${h[4]} v-${h[5]}${state.lang==='ar'?' rtl':''}`;sceneImage.src=IMAGES[s.img];sceneImage.alt=s.title.en;placeHot(h);const tr=state.lang!=='off';frame.classList.toggle('tr-on',tr);content.style.width=((h[6]||42)+(tr?10:0))+'%';content.style.marginLeft=h[4]==='left'&&h[7]?h[7]+'%':'';content.style.marginRight=h[4]==='right'&&h[7]?h[7]+'%':'';let html=`<button class="hide-btn" onclick="closePanel()" title="Esc">✕ ${escapeHTML(state.lang==='off'?LABELS.hide.en:LABELS.hide[state.lang])}</button>`+head(s,s.kind==='intro');if(s.kind==='intro'){html+=`<button class="start" onclick="go('${s.next}')">${label(LABELS.enter)}</button><div class="small">${label(LABELS.subtitle)}</div>`}else if(s.kind==='rules'){html+=`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div><div class="rule-note">${label(s.note)}</div><button class="continue" onclick="go('${s.next}')">${label(LABELS.begin)}</button>`}else if(s.kind==='story'){html+=`${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${label(LABELS.continue)}</button>`}else if(s.kind==='question'){html+=`<div class="clue"><b>${label(LABELS.visual)}</b><br>${label(s.clue)}</div><div class="prompt">${label(s.prompt)}</div><div class="options">${s.opts.map((o,i)=>`<button class="option" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span><span>${label(o)}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="continue" class="continue" hidden onclick="advance()">${label(LABELS.continue)}</button>`}else if(s.kind==='choice'){html+=`<div class="route-options">${s.routes.map((r,i)=>`<button class="route" onclick="chooseRoute(${i})"><b>${i+1} · ${label(r.name)}</b>${label(r.desc)}</button>`).join('')}</div>`}else if(s.kind==='ending'){html+=`<div class="final-score">${state.score}/85 · ${state.evidence}/3 EVIDENCE</div><button class="continue" onclick="go('${s.next}')">${label(LABELS.continue)}</button>`}else if(s.kind==='failure'){html+=`<div class="final-score">${state.score}/85 · ${state.evidence}/3 EVIDENCE</div><button class="restart" onclick="restart()">${label(LABELS.restart)}</button>`}else if(s.kind==='epilogue'){html+=`<div class="final-score">ROUTE: ${escapeHTML(state.route.join(' · ').toUpperCase())}</div><button class="restart" onclick="restart()">${label(LABELS.restart)}</button>`}content.innerHTML=html;updateHUD();setOpen(s.kind==='intro');if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene)){setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}}

const hot=document.getElementById('hot'), hotLabel=document.getElementById('hotLabel'), zone=document.getElementById('zone');
function ui(key){return state.lang==='off'?LABELS[key].en:LABELS[key][state.lang]}
// HOT coordinates are % of the 16:9 frame at desktop; the picture is 3:2 and object-fit:cover, so convert to image space and back for the actual frame (a phone shows a narrow central slice)
function placeHot(h){const W=frame.clientWidth,H=frame.clientHeight,sc=Math.max(W/1536,H/1024),dw=1536*sc,dh=1024*sc,ox=(W-dw)/2,oy=(H-dh)/2;const ix=h[0]/100,iy=0.078+h[1]/100*0.844,iw=h[2]/100,ih=h[3]/100*0.844;hot.style.left=(ox+ix*dw)+'px';hot.style.top=(oy+iy*dh)+'px';hot.style.width=(iw*dw)+'px';hot.style.height=(ih*dh)+'px';const cy=oy+iy*dh,ch=ih*dh;hot.classList.toggle('above',cy+ch/2>H*0.84);hotLabel.textContent=ui('read');
  document.getElementById('fsLabel').textContent=ui('fullscreen');document.getElementById('langWord').textContent=ui('translate');document.getElementById('langCur').textContent=state.lang==='off'?'OFF':LANG_NAMES[state.lang];
  document.querySelectorAll('.lang-item').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function setOpen(on){state.open=!!on;if(on){const hr=hot.getBoundingClientRect(),zr=zone.getBoundingClientRect();const cl=zr.left+content.offsetLeft,ct=zr.top+content.offsetTop;const ox=hr.left+hr.width/2-cl,oy=hr.top+hr.height/2-ct;content.style.transformOrigin=`${ox}px ${oy}px`}frame.classList.toggle('open',state.open)}
function openPanel(){if(!state.open)setOpen(true)}
function closePanel(){if(state.open)setOpen(false)}
hot.addEventListener('click',e=>{e.stopPropagation();openPanel()});
sceneImage.addEventListener('click',()=>{closeMenu();closePanel()});
window.addEventListener('resize',()=>{if(HOT[state.scene])placeHot(HOT[state.scene])});
const langMenu=document.getElementById('langMenu'), langBtn=document.getElementById('langBtn');
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
function toggleMenu(){langMenu.hidden=!langMenu.hidden;langBtn.setAttribute('aria-expanded',String(!langMenu.hidden))}
function go(id){state.scene=id;state.visited.add(id);render()}
function displayAnswer(i,apply){state.answered=true;const s=scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];buttons.forEach(b=>b.disabled=true);const ok=i===s.answer;buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');const fb=document.getElementById('feedback');if(apply){if(ok){state.score+=5}else{state.nerve=Math.max(0,state.nerve-1)}if(s.award&&!state.awards.has(s.award)){state.awards.add(s.award)}if(s.evidence&&!state.awards.has(state.scene)){state.awards.add(state.scene);state.evidence=Math.min(3,state.evidence+s.evidence)}}fb.innerHTML=`<strong>${label(ok?LABELS.correct:LABELS.wrong)}</strong><br>${label(s.fb)}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD()}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;state.results[state.scene]=i;displayAnswer(i,true)}
function advance(){const s=scenes[state.scene];if(state.nerve<=0){go('failure');return}if(s.next==='resolve'){go(state.score>=70&&state.evidence===3?'success':'failure');return}go(s.next)}
function chooseRoute(i){const s=scenes[state.scene],r=s.routes[i];state.route.push(r.route);go(r.target)}
function restart(){state={scene:'cover',score:0,nerve:5,evidence:0,lang:state.lang,open:false,answered:false,route:[],awards:new Set(),visited:new Set(),results:{}};render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?'<b>OFF</b><span>English only</span>':`<b>${l.toUpperCase()}</b><span>${LANG_NAMES[l]}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(e.key==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(e.key==='Enter'&&!state.open){openPanel();return}if(['1','2','3'].includes(e.key)&&!state.open){openPanel();return}if(e.key.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(['1','2','3'].includes(e.key)){const i=Number(e.key)-1;const s=scenes[state.scene];if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click()}if(e.key==='Enter'){document.querySelector('.continue:not([hidden]),.start,.restart')?.click()}});
render();
</script>
