śniej.','乔纳森犹豫了。设想他更早出手。','ジョナサンはためらった。彼がもっと早く打ったと想像せよ。','Jonathan tereddüt etti. Daha erken vurduğunu hayal et.','تردد جوناثان. تخيّل أنه ضرب في وقت أبكر.','Джонатан замешкался. Представь, что он ударил раньше.'),prompt:T('Choose the THIRD CONDITIONAL.','Elige el TERCER CONDICIONAL.','Wähle den DRITTEN KONDITIONALSATZ.','Choisis le TROISIÈME CONDITIONNEL.','Scegli il TERZO CONDIZIONALE.','Escolha o TERCEIRO CONDICIONAL.','Wybierz TRZECI OKRES WARUNKOWY.','选出第三条件句。','第三条件文を選べ。','ÜÇÜNCÜ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثالث.','Выбери ТРЕТИЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan strikes sooner, Dracula would not escaped.','Si Jonathan golpea antes, Drácula no escaparía.','Wenn Jonathan früher zuschlägt, wäre Dracula nicht entkommen.','Si Jonathan frappait plus tôt, Dracula n\'échapperait pas.','Se Jonathan colpisce prima, Dracula non scapperebbe.','Se Jonathan golpeia mais cedo, Drácula não escaparia.','Jeśli Jonathan uderza wcześniej, Drakula nie uciekłby.','如果乔纳森早点出手,德古拉不会逃脱。','もしジョナサンがもっと早く打てば、ドラキュラは逃げないだろう。','Jonathan daha erken vurursa, Drakula kaçmazdı.','لو يضرب جوناثان أبكر، دراكولا لن يهرب.','Если Джонатан ударит раньше, Дракула не сбежал бы.'),T('If Jonathan had struck sooner, Dracula would not have escaped the coffin.','Si Jonathan hubiera golpeado antes, Drácula no habría escapado del ataúd.','Wenn Jonathan früher zugeschlagen hätte, wäre Dracula dem Sarg nicht entkommen.','Si Jonathan avait frappé plus tôt, Dracula n\'aurait pas échappé au cercueil.','Se Jonathan avesse colpito prima, Dracula non sarebbe scappato dalla bara.','Se Jonathan tivesse golpeado mais cedo, Drácula não teria escapado do caixão.','Gdyby Jonathan uderzył wcześniej, Drakula nie uciekłby z trumny.','如果乔纳森早点出手,德古拉就不会逃出棺木了。','もしジョナサンがもっと早く打っていたら、ドラキュラは棺から逃げられなかっただろう。','Jonathan daha erken vurmuş olsaydı, Drakula tabuttan kaçmamış olurdu.','لو ضرب جوناثان أبكر، لما هرب دراكولا من التابوت.','Если бы Джонатан ударил раньше, Дракула не сбежал бы из гроба.'),T('If Jonathan had strike sooner, Dracula will not escape.','Si Jonathan hubiera golpear antes, Drácula no escapará.','Wenn Jonathan früher zugeschlagen, wird Dracula nicht entkommen.','Si Jonathan avait frapper plus tôt, Dracula n\'échappera pas.','Se Jonathan avesse colpire prima, Dracula non scapperà.','Se Jonathan tivesse golpear mais cedo, Drácula não vai escapar.','Gdyby Jonathan uderzyć wcześniej, Drakula nie ucieknie.','如果乔纳森当初早点出手,德古拉将不会逃脱。','もしジョナサンがもっと早く打っていたら、ドラキュラは逃げないだろう。','Jonathan daha erken vur olsaydı, Drakula kaçmayacak.','لو كان جوناثان قد يضرب أبكر، دراكولا لن يهرب.','Если бы Джонатан ударить раньше, Дракула не сбежит.')],answer:1,fb:T('Third conditional: had + struck, then would have + escaped.','Tercer condicional: hubiera + golpeado, después habría + escapado.','Dritter Konditionalsatz: hätte + zugeschlagen, dann wäre + entkommen.','Troisième conditionnel : avait + frappé, puis aurait + échappé.','Terzo condizionale: avesse + colpito, poi sarebbe + scappato.','Terceiro condicional: tivesse + golpeado, depois teria + escapado.','Trzeci okres warunkowy: zaprzeszły, potem would have + III forma czasownika.','第三条件句:had + struck,然后 would have + escaped。','第三条件文:had+struck(打っていた)、その後would have+escaped(逃げていただろう)。','Üçüncü şart cümlesi: had + ortaç, ardından would have + ortaç.','الشرط الثالث: كان قد ضرب، ثم لـ كان قد هرب.','Третий условный: had + struck, потом would have + escaped.'),evidence:1,next:'crypt_chase'},
courtyard_carts:{img:'25_courtyard_carts',pos:'left',kind:'question',q:15,k:T('ROUTE · THE NIGHT CONVOY','RUTA · EL CONVOY NOCTURNO','ROUTE · DER NACHTKONVOI','ROUTE · LE CONVOI NOCTURNE','VIA · IL CONVOGLIO NOTTURNO','ROTA · O COMBOIO NOTURNO','TRASA · NOCNY KONWÓJ','路线 · 夜间车队','ルート · 夜の隊列','ROTA · GECE KERVANI','المسار · القافلة الليلية','ПУТЬ · НОЧНОЙ ОБОЗ'),title:T('BOXES IN MOTION','CAJAS EN MOVIMIENTO','KISTEN IN BEWEGUNG','CAISSES MOBILES','CASSE IN MOVIMENTO','CAIXAS EM MOVIMENTO','SKRZYNIE W RUCHU','移动中的木箱','動き出す箱','KUTULAR HAREKETTE','صناديق في حركة','ЯЩИКИ В ДВИЖЕНИИ'),story:T('Workers carry the earth boxes toward black wagons. Jonathan hides behind a broken saint.','Los trabajadores llevan las cajas de tierra hacia carros negros. Jonathan se esconde tras un santo roto.','Arbeiter tragen die Erdkisten zu schwarzen Wagen. Jonathan versteckt sich hinter einem zerbrochenen Heiligen.','Des ouvriers portent les caisses de terre vers des chariots. Jonathan se cache derrière un saint brisé.','I lavoratori portano le casse di terra verso i carri neri. Jonathan si nasconde dietro un santo spezzato.','Os trabalhadores levam as caixas de terra para os carros negros. Jonathan esconde-se atrás de um santo partido.','Robotnicy niosą skrzynie z ziemią w stronę czarnych wozów. Jonathan chowa się za połamanym posągiem świętego.','工人们把泥土木箱搬向黑色货车。乔纳森躲在一尊残破的圣像后面。','労働者たちが土の箱を黒い荷馬車へと運ぶ。ジョナサンは壊れた聖人像の陰に隠れる。','İşçiler toprak kutularını siyah kağnılara doğru taşır. Jonathan kırık bir azizin arkasına saklanır.','يحمل العمال صناديق التراب نحو عربات سوداء. يختبئ جوناثان خلف قديس محطم.','Рабочие несут ящики с землёй к чёрным повозкам. Джонатан прячется за разбитой статуей святого.'),clue:T('The action is happening now. Put the boxes first.','La acción está ocurriendo ahora. Pon las cajas primero.','Die Handlung geschieht gerade. Stelle die Kisten an den Anfang.','L\'action se passe maintenant. Mets les caisses en premier.','L\'azione sta avvenendo ora. Metti le casse per prime.','A ação está a acontecer agora. Ponha as caixas primeiro.','Czynność dzieje się teraz. Postaw skrzynie na pierwszym miejscu.','这动作正在发生。请把木箱放在前面。','その動作は今起きている。箱を先に置け。','Eylem şu anda gerçekleşiyor. Önce kutuları söyle.','الفعل يحدث الآن. ضع الصناديق أولاً.','Действие происходит сейчас. Поставь ящики на первое место.'),prompt:T('Choose the PRESENT CONTINUOUS PASSIVE.','Elige la PASIVA CONTINUA DEL PRESENTE.','Wähle das PASSIV IM VERLAUF.','Choisis le PASSIF AU PRÉSENT CONTINU.','Scegli la PASSIVA CONTINUA DEL PRESENTE.','Escolha a PASSIVA CONTÍNUA DO PRESENTE.','Wybierz STRONĘ BIERNĄ w czasie PRESENT CONTINUOUS.','选出现在进行时的被动句。','現在進行形の受動態を選べ。','ŞİMDİKİ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في المضارع المستمر.','Выбери ПАССИВ ПРОДОЛЖЕННОГО НАСТОЯЩЕГО.'),opts:[T('The boxes are load onto wagons.','Las cajas cargan en los carros.','Die Kisten laden auf Wagen.','Les caisses sont charger aux chariots.','Le casse caricano sui carri.','As caixas são carregar nos carros.','Skrzynie są ładować na wozy.','木箱装上货车。','箱は荷馬車に積む。','Kutular kağnılara yüklenir.','الصناديق حمل على العربات.','Ящики грузить на повозки.'),T('The boxes were being load tomorrow.','Las cajas estaban siendo cargar mañana.','Die Kisten wurden morgen geladen sein.','Les caisses étaient charger demain.','Le casse stavano venendo caricare domani.','As caixas estavam a ser carregar amanhã.','Skrzynie były być ładowane jutro.','木箱明天曾经正在被装。','箱は明日積まれていた。','Kutular kağnılara yarın yükleniyordu.','كانت الصناديق يتم تحميلها غداً.','Ящики были грузить завтра.'),T('The boxes are being loaded onto wagons.','Las cajas están siendo cargadas en los carros.','Die Kisten werden gerade auf Wagen geladen.','Les caisses sont chargées sur les chariots.','Le casse stanno venendo caricate sui carri.','As caixas estão a ser carregadas nos carros.','Skrzynie są ładowane na wozy.','木箱正被装上货车。','箱は荷馬車に積まれているところだ。','Kutular şu anda kağnılara yükleniyor.','الصناديق يتم تحميلها على العربات الآن.','Ящики сейчас грузятся на повозки.')],answer:2,fb:T('Present continuous passive: are being + past participle.','Pasiva continua del presente: están siendo + participio.','Verlaufspassiv: werden gerade + Partizip II.','Passif au présent continu : sont en train d\'être + participe passé.','Passiva continua del presente: stanno venendo + participio.','Passiva contínua do presente: estão a ser + particípio.','Strona bierna Present Continuous: are being + III forma czasownika.','现在进行时被动:are being + 过去分词。','現在進行形の受動態:are being+過去分詞。','Şimdiki zaman pasifi: are being + geçmiş zaman ortacı (yükleniyor).','مجهول المضارع المستمر: يتم + مصدر الفعل.','Пассив продолженного настоящего: are being + 3-я форма глагола.'),next:'carriage_sabotage'},
carriage_sabotage:{img:'26_carriage_sabotage',pos:'right',kind:'question',q:16,k:T('ROUTE · THE BLACK CARRIAGE','RUTA · EL COCHE NEGRO','ROUTE · DIE SCHWARZE KUTSCHE','ROUTE · LE CARROSSE NOIR','VIA · LA CARROZZA NERA','ROTA · A CARRUAGEM NEGRA','TRASA · CZARNY POWÓZ','路线 · 黑色马车','ルート · 黒い馬車','ROTA · SİYAH ARABA','المسار · العربة السوداء','ПУТЬ · ЧЁРНЫЙ ЭКИПАЖ'),title:T('ONE MISSING PIN','UN PERNO AUSENTE','EIN FEHLENDER BOLZEN','GOUPILLE ABSENTE','UN PERNO MANCANTE','UM PERNO EM FALTA','BRAKUJĄCY SWORZEŃ','一枚缺失的销钉','一本消えた留め金','EKSİK BİR PİM','مسمار مفقود','ПРОПАВШИЙ ШТИФТ'),story:T('Jonathan loosens a wheel pin while the guards watch the loading crew. The road crosses a steep bridge.','Jonathan afloja un perno de la rueda mientras los guardias observan a los trabajadores. El camino cruza un puente empinado.','Jonathan lockert einen Radbolzen, während die Wachen die Arbeiter beobachten. Die Straße führt über eine steile Brücke.','Jonathan desserre une goupille pendant que les gardes surveillent le chargement. La route traverse un pont escarpé.','Jonathan allenta un perno della ruota mentre le guardie osservano la squadra di carico. La strada attraversa un ponte ripido.','Jonathan desaperta um perno da roda enquanto os guardas observam a equipa de carregamento. A estrada atravessa uma ponte íngreme.','Jonathan poluzowuje sworzeń koła, gdy strażnicy obserwują ekipę ładującą. Droga przecina stromy most.','卫兵盯着装货的工人时,乔纳森松开了一枚车轮销钉。这条路要经过一座陡峭的桥。','見張りが積み込みの作業員を見ている間に、ジョナサンは車輪の留め金を緩める。道は険しい橋を渡る。','Muhafızlar yükleme ekibini izlerken Jonathan bir tekerlek pimini gevşetir. Yol dik bir köprüden geçer.','يُرخي جوناثان مسمار عجلة بينما يراقب الحراس طاقم التحميل. يعبر الطريق جسراً شديد الانحدار.','Джонатан ослабляет штифт колеса, пока стражники следят за грузчиками. Дорога пересекает крутой мост.'),clue:T('Removing the pin may cause a real future accident.','Quitar el perno puede causar un accidente real en el futuro.','Das Entfernen des Bolzens kann einen echten zukünftigen Unfall verursachen.','Enlever la goupille pourrait causer un accident réel.','Togliere il perno potrebbe causare un vero incidente futuro.','Retirar o perno pode causar um acidente real no futuro.','Usunięcie sworznia może spowodować realny wypadek w przyszłości.','拔掉这枚销钉,可能在未来真的引发事故。','留め金を外せば、現実に将来事故が起こるかもしれない。','Pimi çıkarmak gerçek bir gelecek kazasına yol açabilir.','قد تسبب إزالة المسمار حادثاً مستقبلياً حقيقياً.','Снятие штифта может вызвать реальную аварию в будущем.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.','Choisis le PREMIER CONDITIONNEL.','Scegli il PRIMO CONDIZIONALE.','Escolha o PRIMEIRO CONDICIONAL.','Wybierz PIERWSZY OKRES WARUNKOWY.','选出第一条件句。','第一条件文を選べ。','BİRİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الأول.','Выбери ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan removes the pin, the carriage will lose a wheel.','Si Jonathan quita el perno, el coche perderá una rueda.','Wenn Jonathan den Bolzen entfernt, wird die Kutsche ein Rad verlieren.','Si Jonathan enlève la goupille, le carrosse perdra une roue.','Se Jonathan toglie il perno, la carrozza perderà una ruota.','Se Jonathan retirar o perno, a carruagem vai perder uma roda.','Jeśli Jonathan usunie sworzeń, powóz straci koło.','如果乔纳森拔掉销钉,马车就会掉一个轮子。','もしジョナサンが留め金を外せば、馬車は車輪を失うだろう。','Jonathan pimi çıkarırsa, araba bir tekerlek kaybedecek.','إن أزال جوناثان المسمار، ستفقد العربة عجلة.','Если Джонатан снимет штифт, экипаж потеряет колесо.'),T('If Jonathan removed the pin, the carriage loses yesterday.','Si Jonathan quitara el perno, el coche pierde ayer.','Wenn Jonathan den Bolzen entfernte, verliert die Kutsche gestern.','Si Jonathan enlevait la goupille, le carrosse perd hier.','Se Jonathan togliesse il perno, la carrozza perde ieri.','Se Jonathan retirasse o perno, a carruagem perde ontem.','Gdyby Jonathan usunął sworzeń, traci wczoraj.','如果乔纳森拔掉了销钉,马车昨天掉轮子。','もしジョナサンが留め金を外したら、昨日車輪を失う。','Jonathan pimi çıkarsaydı, araba dün kaybeder.','لو أزال جوناثان المسمار، تفقد أمس.','Если бы Джонатан снял штифт, экипаж теряет вчера.'),T('If Jonathan will remove the pin, the carriage lost a wheel.','Si Jonathan quitará el perno, el coche perdió una rueda.','Wenn Jonathan den Bolzen entfernen wird, verlor die Kutsche ein Rad.','Si Jonathan enlèvera la goupille, le carrosse a perdu une roue.','Se Jonathan toglierà il perno, la carrozza perse una ruota.','Se Jonathan vai retirar o perno, a carruagem perdeu uma roda.','Jeśli Jonathan będzie usuwał sworzeń, powóz stracił koło.','如果乔纳森将会拔掉销钉,马车掉过一个轮子。','もしジョナサンが留め金を外すでしょうなら、馬車は車輪を失った。','Jonathan pimi çıkaracaksa, araba bir tekerlek kaybetti.','إن سيزيل جوناثان المسمار، فقدت العربة عجلة.','Если Джонатан будет снимать штифт, экипаж потерял колесо.')],answer:0,fb:T('First conditional predicts a real possible result.','El primer condicional predice un resultado real y posible.','Der erste Konditionalsatz sagt ein reales mögliches Ergebnis voraus.','Le premier conditionnel prédit un résultat réel et possible.','Il primo condizionale predice un esito reale e possibile.','O primeiro condicional prevê um resultado real e possível.','Pierwszy okres warunkowy przewiduje realny, możliwy skutek.','第一条件句预测一个真实可能的结果。','第一条件文は現実に起こりうる結果を予測する。','Birinci şart cümlesi, gerçek ve mümkün bir sonucu öngörür.','الشرط الأول يتنبأ بنتيجة حقيقية ممكنة.','Первый условный предсказывает реальный возможный результат.'),evidence:1,next:'courtyard_escape'},
final_escape:{img:'27_final_escape',pos:'left',kind:'question',q:17,k:T('FINAL TEST · THE CLIFF WALL','PRUEBA FINAL · EL MURO DEL ACANTILADO','LETZTE PRÜFUNG · DIE FELSWAND','TEST FINAL · MUR DU PRÉCIPICE','PROVA FINALE · PARETE DEL DIRUPO','TESTE FINAL · MURO DO PRECIPÍCIO','OSTATNIA PRÓBA · ŚCIANA URWISKA','最终考验 · 崖壁','最後の試練 · 崖の壁','SON SINAV · UÇURUM DUVARI','الاختبار الأخير · جدار الجرف','ПОСЛЕДНЕЕ ИСПЫТАНИЕ · СТЕНА ОБРЫВА'),title:T('IF THE ROPE HOLDS…','SI LA CUERDA AGUANTA…','WENN DAS SEIL HÄLT…','SI LA CORDE TIENT…','SE LA CORDA REGGE…','SE A CORDA AGUENTAR…','JEŚLI LINA UTRZYMA…','若绳索能撑住……','もしロープが持ちこたえたら…','İP DAYANIRSA…','إن صمد الحبل…','ЕСЛИ ВЕРЁВКА ВЫДЕРЖИТ…'),story:T('Jonathan reaches the parapet and resumes his descent on the sheet-rope. Wolves race across the battlements while Dracula reaches the parapet above.','Jonathan llega al parapeto y reanuda el descenso por la cuerda de sábanas. Los lobos corren por las almenas mientras Drácula alcanza el parapeto superior.','Jonathan erreicht die Brüstung und setzt den Abstieg am Laken-Seil fort. Wölfe rasen über die Zinnen, während Dracula die obere Brüstung erreicht.','Jonathan atteint le parapet et reprend sa descente le long de la corde de draps. Des loups filent sur les remparts tandis que Dracula parvient au parapet, au-dessus.','Jonathan raggiunge il parapetto e riprende la discesa lungo la corda di lenzuola. I lupi corrono sui bastioni mentre Dracula arriva al parapetto, sopra di lui.','Jonathan alcança o parapeito e retoma a descida pela corda de lençóis. Os lobos correm pelas ameias enquanto Drácula chega ao parapeito, lá em cima.','Jonathan dociera do gzymsu i wznawia zejście po linie z prześcieradeł. Wilki pędzą po blankach, a Drakula wychodzi na gzyms powyżej.','乔纳森抵达女墙,继续顺着床单绳索下降。狼群在城垛上疾奔,德古拉则出现在上方的女墙边。','ジョナサンは胸壁にたどり着き、シーツの縄をふたたび下りはじめる。狼たちが城壁の上を駆け、ドラキュラが頭上の胸壁に姿を現す。','Jonathan korkuluğa ulaşır ve çarşaf halatındaki inişini sürdürür. Kurtlar mazgallı siperlerde koşarken Drakula yukarıdaki korkuluğa varır.','يبلغ جوناثان الحاجز ويستأنف نزوله على حبل الملاءات. تنطلق الذئاب فوق الأسوار بينما يصل دراكولا إلى الحاجز في الأعلى.','Джонатан добирается до парапета и продолжает спуск по верёвке из простыней. Волки мчатся по зубцам стены, а Дракула выходит на парапет наверху.'),clue:T('The rope is holding now. The cliff path is directly below.','La cuerda aguanta. El sendero del acantilado está justo debajo.','Das Seil hält. Der Klippenpfad liegt direkt darunter.','La corde tient pour l\'instant. Le sentier du précipice est juste en dessous.','La corda regge, adesso. Il sentiero del dirupo è proprio sotto.','A corda está a aguentar. O carreiro do precipício está mesmo por baixo.','Lina na razie trzyma. Ścieżka nad urwiskiem jest tuż poniżej.','绳索此刻还撑得住。崖边小径就在正下方。','縄は今のところ持ちこたえている。崖道はすぐ真下だ。','Halat şimdilik tutuyor. Uçurum patikası tam aşağıda.','الحبل صامد الآن. ودرب الجرف مباشرةً في الأسفل.','Верёвка пока держит. Тропа над обрывом прямо внизу.'),prompt:T('Complete the final FIRST CONDITIONAL.','Completa el PRIMER CONDICIONAL final.','Vervollständige den letzten ERSTEN KONDITIONALSATZ.','Complète le PREMIER CONDITIONNEL final.','Completa il PRIMO CONDIZIONALE finale.','Complete o PRIMEIRO CONDICIONAL final.','Uzupełnij ostatni PIERWSZY OKRES WARUNKOWY.','补全最后的第一条件句。','最後の第一条件文を完成させよ。','Son BİRİNCİ ŞART CÜMLESİ\'ni tamamla.','أكمل الشرط الأول الأخير.','Заверши финальный ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If the rope held, Jonathan reaches yesterday.','Si la cuerda aguantara, Jonathan llega ayer.','Wenn das Seil hielte, erreicht Jonathan gestern.','Si la corde tenait, Jonathan atteint hier.','Se la corda reggesse, Jonathan arriva ieri.','Se a corda aguentasse, Jonathan chega ontem.','Gdyby lina wytrzymała, Jonathan dociera wczoraj.','如果绳索撑住了,乔纳森昨天就到达。','もしロープが持ちこたえたら、昨日たどり着く。','İp dayansaydı, Jonathan dün ulaşır.','لو صمد الحبل، يصل جوناثان أمس.','Если бы верёвка выдержала, Джонатан добирается вчера.'),T('If the rope holds, Jonathan will reach the cliff path.','Si la cuerda aguanta, Jonathan llegará al sendero.','Wenn das Seil hält, wird Jonathan den Felsenpfad erreichen.','Si la corde tient, Jonathan atteindra le sentier.','Se la corda regge, Jonathan raggiungerà il sentiero del dirupo.','Se a corda aguentar, Jonathan vai chegar ao caminho do precipício.','Jeśli lina wytrzyma, Jonathan dotrze do ścieżki nad urwiskiem.','如果绳索撑得住,乔纳森就会到达悬崖小径。','もしロープが持ちこたえれば、ジョナサンは崖の小道にたどり着くだろう。','İp dayanırsa, Jonathan uçurum patikasına ulaşacak.','إن صمد الحبل، سيصل جوناثان إلى طريق الجرف.','Если верёвка выдержит, Джонатан доберётся до тропы над обрывом.'),T('If the rope will hold, Jonathan reached the path.','Si la cuerda aguantará, Jonathan llegó al sendero.','Wenn das Seil halten wird, erreichte Jonathan den Pfad.','Si la corde tiendra, Jonathan a atteint le sentier.','Se la corda reggerà, Jonathan raggiunse il sentiero.','Se a corda vai aguentar, Jonathan chegou ao caminho.','Jeśli lina będzie trzymać, Jonathan dotarł do ścieżki.','如果绳索将会撑住,乔纳森到达过小径。','もしロープが持ちこたえるでしょうなら、ジョナサンは小道にたどり着いた。','İp dayanacaksa, Jonathan patikaya ulaştı.','إن سيصمد الحبل، وصل جوناثان إلى الطريق.','Если верёвка будет держать, Джонатан добрался до тропы.')],answer:1,fb:T('Present after if; will + verb in the result clause. The route is open.','Presente después de si; futuro en el resultado. La ruta está abierta.','Präsens nach wenn; wird + Verb im Ergebnissatz. Der Weg ist frei.','Présent après si ; futur dans la proposition résultat. La voie est ouverte.','Presente dopo se; futuro nella proposizione principale. Il percorso è aperto.','Presente depois de se; futuro na oração-resultado. A rota está aberta.','Czas teraźniejszy po if; czas przyszły w zdaniu głównym. Droga jest otwarta.','if 后用现在时;结果从句用 will + 动词。出路已然打开。','ifの後は現在形、結果節はwill+動詞。道は開かれている。','Eğer\'den sonra geniş zaman; sonuç cümlesinde will + fiil. Yol açık.','مضارع بعد إن؛ سـ + فعل في جملة النتيجة. الطريق مفتوح.','Настоящее после if; will + глагол в результате. Путь открыт.'),next:'resolve'},
success:{img:'28_success_dawn',pos:'left',kind:'ending',k:T('DAWN · OUTSIDE THE CASTLE','AMANECER · FUERA DEL CASTILLO','MORGENRÖTE · AUSSERHALB DES SCHLOSSES','AUBE · HORS DU CHÂTEAU','ALBA · FUORI DAL CASTELLO','AMANHECER · FORA DO CASTELO','ŚWIT · POZA ZAMKIEM','黎明 · 城堡之外','夜明け · 城の外','ŞAFAK · ŞATONUN DIŞINDA','الفجر · خارج القلعة','РАССВЕТ · ЗА СТЕНАМИ ЗАМКА'),title:T('JONATHAN ESCAPES','JONATHAN ESCAPA','JONATHAN ENTKOMMT','JONATHAN S\'ÉCHAPPE','JONATHAN FUGGE','JONATHAN ESCAPA','JONATHAN UCIEKA','乔纳森逃脱','ジョナサン、脱出する','JONATHAN KAÇIYOR','جوناثان يهرب','ДЖОНАТАН СБЕГАЕТ'),story:T('Monks pull Jonathan through their gate as the sun reaches the valley. His journal, three pieces of evidence and memory have survived. Dracula’s castle is behind him—but other earth boxes are already moving west.','Los monjes llevan a Jonathan al otro lado de su puerta cuando el sol alcanza el valle. Su diario, tres pruebas y sus recuerdos han sobrevivido. El castillo de Drácula queda atrás, pero otras cajas de tierra ya avanzan hacia el oeste.','Mönche ziehen Jonathan durch ihr Tor, als die Sonne das Tal erreicht. Sein Tagebuch, drei Beweise und seine Erinnerung haben überlebt. Draculas Schloss liegt hinter ihm – doch andere Erdkisten bewegen sich bereits nach Westen.','Des moines tirent Jonathan par leur portail quand le soleil atteint la vallée. Son journal, ses trois preuves et sa mémoire ont survécu. Le château de Dracula est derrière lui — mais d\'autres caisses de terre roulent déjà vers l\'ouest.','Dei monaci trascinano Jonathan oltre il loro cancello mentre il sole raggiunge la valle. Il suo diario, le tre prove e la memoria sono sopravvissuti. Il castello di Dracula è alle sue spalle, ma altre casse di terra viaggiano già verso ovest.','Uns monges puxam Jonathan pelo seu portão enquanto o sol alcança o vale. O seu diário, as três provas e a memória sobreviveram. O castelo de Drácula fica para trás — mas outras caixas de terra já se dirigem para o oeste.','Mnisi wciągają Jonathana przez swoją bramę, gdy słońce dociera do doliny. Jego dziennik, trzy dowody i pamięć przetrwały. Zamek Drakuli zostaje za nim — lecz inne skrzynie z ziemią już podążają na zachód.','阳光洒落山谷之际,修士们把乔纳森拉进了他们的大门。他的日记、三件证据与记忆都保住了。德古拉的城堡已被抛在身后——但另一批泥土木箱早已向西而去。','太陽が谷に届くころ、修道士たちがジョナサンを門の中へ引き入れる。日記も、三つの証拠も、記憶も無事だった。ドラキュラの城は背後に去った——だが別の土の箱がすでに西へと動き出している。','Güneş vadiye ulaşırken keşişler Jonathan\'ı kapılarından içeri çeker. Günlüğü, üç kanıtı ve hafızası hayatta kalmıştır. Drakula\'nın şatosu artık arkasında kalmıştır — ama başka toprak kutuları çoktan batıya doğru yol almaktadır.','يجذب الرهبان جوناثان عبر بوابتهم بينما تصل الشمس إلى الوادي. نجت يومياته وأدلته الثلاثة وذاكرته. قلعة دراكولا خلفه الآن — لكن صناديق تراب أخرى تتحرك بالفعل غرباً.','Монахи втягивают Джонатана через свои ворота, когда солнце достигает долины. Его дневник, три улики и память уцелели. Замок Дракулы остался позади — но другие ящики с землёй уже движутся на запад.'),next:'epilogue'},
failure:{img:'29_failure',pos:'left',kind:'failure',k:T('THE GATE CLOSES · NO DAWN','LA PUERTA SE CIERRA · SIN AMANECER','DAS TOR SCHLIESST SICH · KEIN MORGEN','LA PORTE SE FERME · PAS D\'AUBE','CANCELLO CHIUSO · NESSUNA ALBA','O PORTÃO FECHA · SEM AMANHECER','BRAMA SIĘ ZAMYKA · BEZ ŚWITU','大门关闭 · 不见天明','門は閉じる · 夜明けは来ない','KAPI KAPANIYOR · ŞAFAK YOK','البوابة تُغلق · لا فجر','ВОРОТА ЗАПЕРТЫ · БЕЗ РАССВЕТА'),title:T('THE CASTLE CLAIMS HIM','EL CASTILLO LO RECLAMA','DAS SCHLOSS FORDERT IHN','LE CHÂTEAU LE RÉCLAME','IL CASTELLO LO RECLAMA','O CASTELO RECLAMA-O','ZAMEK GO POCHŁANIA','城堡将他吞噬','城が彼を奪う','ŞATO ONU ELE GEÇİRİYOR','القلعة تطالب به','ЗАМОК ЗАБИРАЕТ ЕГО'),story:T('Jonathan’s nerve or evidence failed before he reached the cliff. Dracula seals the gate. A final journal page is left unfinished in the dark.','El valor o las pruebas de Jonathan fallaron antes de llegar al acantilado. Drácula cierra la puerta. Una última página del diario queda sin terminar en la oscuridad.','Jonathans Mut oder seine Beweise reichten vor der Felswand nicht aus. Dracula versiegelt das Tor. Eine letzte Tagebuchseite bleibt im Dunkeln unvollendet.','Le courage ou les preuves de Jonathan ont manqué avant qu\'il n\'atteigne le précipice. Dracula scelle la porte. Une dernière page du journal reste inachevée dans le noir.','Il coraggio o le prove di Jonathan sono venuti meno prima che raggiungesse il dirupo. Dracula sigilla il cancello. Un\'ultima pagina del diario resta incompiuta nel buio.','A coragem ou as provas de Jonathan falharam antes de chegar ao precipício. Drácula sela o portão. Uma última página do diário fica por terminar na escuridão.','Odwaga lub dowody Jonathana zawiodły, zanim dotarł do urwiska. Drakula pieczętuje bramę. Ostatnia strona dziennika zostaje niedokończona w ciemności.','乔纳森在抵达悬崖之前,勇气或证据先耗尽了。德古拉封死了大门。日记的最后一页,永远留在了黑暗中,未曾写完。','崖にたどり着く前に、ジョナサンの気力か証拠が尽きた。ドラキュラが門を封じる。日記の最後のページは、闇の中で未完のまま残される。','Jonathan uçuruma ulaşmadan önce cesareti ya da kanıtları tükendi. Drakula kapıyı mühürler. Son bir günlük sayfası karanlıkta yarım kalır.','خانت جوناثان شجاعته أو أدلته قبل أن يبلغ الجرف. يُغلق دراكولا البوابة. تبقى صفحة أخيرة من اليوميات غير مكتملة في الظلام.','Смелость или улики Джонатана подвели его прежде, чем он добрался до обрыва. Дракула запечатывает ворота. Последняя страница дневника остаётся незаконченной во тьме.')},
epilogue:{img:'30_epilogue_ship',pos:'left',kind:'epilogue',k:T('EPILOGUE · THE BLACK SEA','EPÍLOGO · EL MAR NEGRO','EPILOG · DAS SCHWARZE MEER','ÉPILOGUE · LA MER NOIRE','EPILOGO · IL MAR NERO','EPÍLOGO · O MAR NEGRO','EPILOG · CZARNE MORZE','尾声 · 黑海','エピローグ · 黒海','SON SÖZ · KARADENİZ','الخاتمة · البحر الأسود','ЭПИЛОГ · ЧЁРНОЕ МОРЕ'),title:T('THE DEMETER SAILS','EL DEMÉTER NAVEGA','DIE DEMETER SEGELT','LE DEMETER APPAREILLE','IL DEMETER SALPA','O DEMÉTER NAVEGA','DEMETER WYPŁYWA','德梅特号启航','デメテル号、出航す','DEMETER YELKEN AÇIYOR','الديميتر تُبحر','«ДЕМЕТРА» ОТПЛЫВАЕТ'),story:T('Jonathan survived the visit. Dracula did not abandon his plan. Beneath the Demeter’s deck, earth boxes breathe in the storm—and England waits beyond the horizon.','Jonathan sobrevivió a la visita. Drácula no abandonó su plan. Bajo la cubierta del Deméter, las cajas de tierra respiran en la tormenta, e Inglaterra espera tras el horizonte.','Jonathan hat den Besuch überlebt. Dracula gab seinen Plan nicht auf. Unter dem Deck der Demeter atmen die Erdkisten im Sturm – und England wartet hinter dem Horizont.','Jonathan a survécu à la visite. Dracula n\'a pas abandonné son plan. Sous le pont du Demeter, des caisses de terre respirent dans la tempête — et l\'Angleterre attend au-delà de l\'horizon.','Jonathan è sopravvissuto alla visita. Dracula non ha abbandonato il suo piano. Sotto il ponte del Demeter, le casse di terra respirano nella tempesta, e l\'Inghilterra aspetta oltre l\'orizzonte.','Jonathan sobreviveu à visita. Drácula não abandonou o seu plano. Sob o convés do Deméter, as caixas de terra respiram na tempestade — e a Inglaterra espera para além do horizonte.','Jonathan przeżył tę wizytę. Drakula nie porzucił swojego planu. Pod pokładem Demetera skrzynie z ziemią oddychają w sztormie — a Anglia czeka za horyzontem.','乔纳森从这场造访中生还,德古拉却未曾放弃他的计划。德梅特号的甲板之下,木箱中的泥土在风暴中静静"呼吸"——而英格兰,正在地平线的另一端等待。','ジョナサンは訪問を生き延びた。だがドラキュラは計画を捨てなかった。デメテル号の甲板の下、嵐の中で土の箱が息づく——そして水平線の先にはイングランドが待っている。','Jonathan ziyaretten sağ çıktı. Drakula planından vazgeçmedi. Demeter\'in güvertesinin altında, toprak kutuları fırtınada nefes alır—ve İngiltere ufkun ötesinde bekler.','نجا جوناثان من الزيارة. لم يتخلَّ دراكولا عن خطته. تحت سطح الديميتر، تتنفس صناديق التراب في العاصفة—وتنتظر إنجلترا خلف الأفق.','Джонатан пережил визит. Дракула не отказался от своего плана. Под палубой «Деметры» ящики с землёй дышат в буре — а Англия ждёт за горизонтом.')},
fallen_key:{img:'35_fallen_key',pos:'right',kind:'story',k:T('TOWER BEDROOM · AFTER THE ATTACK','DORMITORIO DE LA TORRE · TRAS EL ATAQUE','TURMSCHLAFZIMMER · NACH DEM ANGRIFF','CHAMBRE DE LA TOUR · APRÈS L\'ATTAQUE','CAMERA DELLA TORRE · DOPO L\'ATTACCO','QUARTO DA TORRE · DEPOIS DO ATAQUE','SYPIALNIA W WIEŻY · PO ATAKU','塔楼卧室 · 袭击之后','塔の寝室 · 襲撃のあと','KULE YATAK ODASI · SALDIRIDAN SONRA','غرفة نوم البرج · بعد الهجوم','СПАЛЬНЯ В БАШНЕ · ПОСЛЕ НАПАДЕНИЯ'),title:T('THE KEY BENEATH THE BED','LA LLAVE BAJO LA CAMA','DER SCHLÜSSEL UNTER DEM BETT','LA CLÉ SOUS LE LIT','LA CHIAVE SOTTO IL LETTO','A CHAVE DEBAIXO DA CAMA','KLUCZ POD ŁÓŻKIEM','床下的钥匙','寝台の下の鍵','YATAĞIN ALTINDAKİ ANAHTAR','المفتاح تحت السرير','КЛЮЧ ПОД КРОВАТЬЮ'),story:T('When Jonathan wakes, Dracula and the Brides are gone. An iron key lies beneath the bed, torn from the Count’s robe during the struggle. Jonathan takes it and slips into the empty corridor in his white shirt and dark waistcoat.','Cuando Jonathan despierta, Drácula y las Novias han desaparecido. Bajo la cama hay una llave de hierro arrancada de la túnica del Conde durante el forcejeo. Jonathan la toma y sale al pasillo vacío con camisa blanca y chaleco oscuro.','Als Jonathan erwacht, sind Dracula und die Bräute verschwunden. Unter dem Bett liegt ein eiserner Schlüssel, der dem Grafen im Kampf aus der Robe gerissen wurde. Jonathan nimmt ihn und schleicht im weißen Hemd und in der dunklen Weste in den leeren Gang.','Quand Jonathan se réveille, Dracula et les épouses ont disparu. Sous le lit gît une clé de fer, arrachée à la robe du Comte pendant la lutte. Jonathan la prend et se glisse dans le couloir vide, en chemise blanche et gilet sombre.','Quando Jonathan si sveglia, Dracula e le spose sono spariti. Sotto il letto giace una chiave di ferro, strappata alla veste del Conte durante la colluttazione. Jonathan la raccoglie e scivola nel corridoio vuoto, in camicia bianca e panciotto scuro.','Quando Jonathan acorda, Drácula e as noivas desapareceram. Debaixo da cama jaz uma chave de ferro, arrancada ao manto do Conde durante a luta. Jonathan pega nela e esgueira-se para o corredor vazio, de camisa branca e colete escuro.','Gdy Jonathan się budzi, Drakuli i narzeczonych już nie ma. Pod łóżkiem leży żelazny klucz, wyrwany z szaty hrabiego podczas szamotaniny. Jonathan zabiera go i wymyka się na pusty korytarz w białej koszuli i ciemnej kamizelce.','乔纳森醒来时,德古拉和新娘们都已不见。床下躺着一把铁钥匙——是搏斗中从伯爵长袍上扯落的。他捡起钥匙,穿着白衬衫和深色马甲,溜进空荡的走廊。','ジョナサンが目覚めると、ドラキュラも花嫁たちも消えていた。寝台の下に鉄の鍵が落ちている——もみ合いのさなか、伯爵の衣から引きちぎられたものだ。彼はそれを拾い、白いシャツと暗色の胴着のまま、無人の廊下へ滑り出る。','Jonathan uyandığında Drakula da gelinler de gitmiştir. Yatağın altında, boğuşma sırasında Kont\'un cüppesinden kopmuş demir bir anahtar durur. Jonathan onu alır ve beyaz gömleği ile koyu yeleğiyle boş koridora süzülür.','حين يستيقظ جوناثان، يكون دراكولا والعرائس قد رحلوا. تحت السرير يرقد مفتاح حديدي، انتُزع من رداء الكونت أثناء العراك. يأخذه جوناثان وينسلّ إلى الممر الخالي بقميصه الأبيض وصدريته الداكنة.','Проснувшись, Джонатан не находит ни Дракулы, ни невест. Под кроватью лежит железный ключ, вырванный из одежды графа во время борьбы. Джонатан берёт его и выскальзывает в пустой коридор в белой рубашке и тёмном жилете.'),next:'servant_stair'},
servant_stair:{img:'36_servant_stair',pos:'left',kind:'story',k:T('CASTLE DRACULA · THE WEST DOOR','CASTILLO DE DRÁCULA · LA PUERTA OESTE','SCHLOSS DRACULA · DIE WESTTÜR','CHÂTEAU DE DRACULA · LA PORTE OUEST','CASTELLO DI DRACULA · LA PORTA OVEST','CASTELO DE DRÁCULA · A PORTA OESTE','ZAMEK DRAKULI · DRZWI ZACHODNIE','德古拉城堡 · 西门','ドラキュラ城 · 西の扉','DRAKULA ŞATOSU · BATI KAPISI','قلعة دراكولا · الباب الغربي','ЗАМОК ДРАКУЛЫ · ЗАПАДНАЯ ДВЕРЬ'),title:T('THE KEY FINDS ITS LOCK','LA LLAVE ENCUENTRA SU CERRADURA','DER SCHLÜSSEL FINDET SEIN SCHLOSS','LA CLÉ TROUVE SA SERRURE','LA CHIAVE TROVA LA SUA SERRATURA','A CHAVE ENCONTRA A SUA FECHADURA','KLUCZ ZNAJDUJE SWÓJ ZAMEK','钥匙找到了它的锁','鍵はその錠を見つける','ANAHTAR KİLİDİNİ BULUR','المفتاح يجد قفله','КЛЮЧ НАХОДИТ СВОЙ ЗАМОК'),story:T('Before testing the iron key, Jonathan returns for his journal and finds that his travelling coat and hat have vanished. Wearing only his white shirt and dark waistcoat, he returns to the library. The key opens the west door behind a bookcase, revealing a servant stair descending toward the records chamber and cellar.','Antes de probar la llave de hierro, Jonathan vuelve a buscar su diario y descubre que su abrigo de viaje y su sombrero han desaparecido. Con solo la camisa blanca y el chaleco oscuro, regresa a la biblioteca. La llave abre la puerta oeste detrás de una estantería y revela una escalera de servicio que baja hacia la sala de archivos y el sótano.','Bevor Jonathan den Eisenschlüssel ausprobiert, kehrt er wegen seines Tagebuchs zurück und entdeckt, dass Reisemantel und Hut verschwunden sind. Nur im weißen Hemd und in der dunklen Weste geht er zur Bibliothek zurück. Der Schlüssel öffnet die Westtür hinter einem Bücherregal und gibt eine Dienstbotentreppe zum Aktenraum und Keller frei.','Avant d\'essayer la clé de fer, Jonathan retourne chercher son journal et découvre que son manteau de voyage et son chapeau ont disparu. En chemise blanche et gilet sombre, il revient à la bibliothèque. La clé ouvre la porte ouest derrière une étagère et découvre un escalier de service qui descend vers la salle des archives et la cave.','Prima di provare la chiave di ferro, Jonathan torna a prendere il diario e scopre che il cappotto da viaggio e il cappello sono spariti. In camicia bianca e panciotto scuro, ritorna in biblioteca. La chiave apre la porta ovest dietro una libreria e rivela una scala di servizio che scende verso la sala degli archivi e la cantina.','Antes de experimentar a chave de ferro, Jonathan volta para buscar o diário e descobre que o casaco de viagem e o chapéu desapareceram. De camisa branca e colete escuro, regressa à biblioteca. A chave abre a porta oeste atrás de uma estante e revela uma escada de serviço que desce para a sala de arquivos e a cave.','Zanim spróbuje żelaznego klucza, Jonathan wraca po dziennik i odkrywa, że jego płaszcz podróżny i kapelusz zniknęły. W białej koszuli i ciemnej kamizelce wraca do biblioteki. Klucz otwiera drzwi zachodnie ukryte za regałem i odsłania schody dla służby, wiodące w dół, do sali archiwum i piwnicy.','在试那把铁钥匙之前,乔纳森回去取日记,却发现自己的旅行外套和帽子不见了。他只穿着白衬衫和深色马甲回到书房。钥匙打开了书架后的西门,露出一段通往档案室和地窖的仆人楼梯。','鉄の鍵を試す前に、ジョナサンは日記を取りに戻り、旅外套と帽子が消えていることに気づく。白いシャツと暗色の胴着だけの姿で書庫へ引き返す。鍵は書棚の裏の西の扉を開き、記録室と地下室へ下る使用人階段を現す。','Demir anahtarı denemeden önce Jonathan günlüğü için geri döner ve yolculuk paltosuyla şapkasının kaybolduğunu görür. Yalnızca beyaz gömleği ve koyu yeleğiyle kütüphaneye döner. Anahtar, bir kitaplığın ardındaki batı kapısını açar ve kayıt odasıyla mahzene inen bir hizmetli merdivenini ortaya çıkarır.','قبل أن يجرّب المفتاح الحديدي، يعود جوناثان ليأخذ يومياته فيجد أن معطف سفره وقبعته قد اختفيا. وبقميصه الأبيض وصدريته الداكنة وحدهما، يعود إلى المكتبة. يفتح المفتاح الباب الغربي خلف رفّ للكتب، فيكشف عن درج للخدم ينحدر نحو غرفة السجلات والقبو.','Прежде чем испытать железный ключ, Джонатан возвращается за дневником и обнаруживает, что дорожный плащ и шляпа исчезли. В одной белой рубашке и тёмном жилете он идёт обратно в библиотеку. Ключ открывает западную дверь за книжным шкафом, за которой начинается лестница для прислуги, ведущая вниз, к архивной палате и подвалу.'),next:'shipping_plan'},
box_moved:{img:'37_box_moved',pos:'center',kind:'story',k:T('BENEATH THE CHAPEL · BEFORE DAWN','BAJO LA CAPILLA · ANTES DEL AMANECER','UNTER DER KAPELLE · VOR TAGESANBRUCH','SOUS LA CHAPELLE · AVANT L\'AUBE','SOTTO LA CAPPELLA · PRIMA DELL\'ALBA','POR BAIXO DA CAPELA · ANTES DO AMANHECER','POD KAPLICĄ · PRZED ŚWITEM','礼拜堂之下 · 黎明之前','礼拝堂の下 · 夜明け前','ŞAPELİN ALTINDA · ŞAFAKTAN ÖNCE','تحت المصلّى · قبل الفجر','ПОД ЧАСОВНЕЙ · ПЕРЕД РАССВЕТОМ'),title:T('THE COFFIN CHANGES ROOMS','EL ATAÚD CAMBIA DE LUGAR','DER SARG WECHSELT DEN RAUM','LE CERCUEIL CHANGE DE SALLE','LA BARA CAMBIA STANZA','O CAIXÃO MUDA DE SALA','TRUMNA ZMIENIA MIEJSCE','棺木换了房间','棺は部屋を移る','TABUT ODA DEĞİŞTİRİR','التابوت يبدّل غرفته','ГРОБ МЕНЯЕТ КОМНАТУ'),story:T('Jonathan hides as the workers lower a heavy wooden lid onto Dracula’s earth box, fasten it shut and carry the sealed coffin through the chapel passage toward the crypt. The Count is completely hidden inside. Jonathan cannot reach him without being seen, but now he knows exactly where the coffin is going.','Jonathan se esconde mientras los trabajadores colocan una pesada tapa de madera sobre la caja de tierra de Drácula, la cierran y llevan el ataúd sellado por el pasadizo de la capilla hacia la cripta. El Conde queda completamente oculto. Jonathan no puede alcanzarlo sin ser visto, pero ahora sabe exactamente adónde va el ataúd.','Jonathan versteckt sich, während die Arbeiter einen schweren Holzdeckel auf Draculas Erdkiste setzen, ihn befestigen und den versiegelten Sarg durch den Kapellengang zur Gruft tragen. Der Graf ist vollständig darin verborgen. Jonathan kann ihn nicht erreichen, ohne entdeckt zu werden, doch nun weiß er genau, wohin der Sarg gebracht wird.','Jonathan se cache tandis que les ouvriers abaissent un lourd couvercle de bois sur la caisse de terre de Dracula, le fixent et emportent le cercueil scellé par le passage de la chapelle, vers la crypte. Le Comte y est entièrement dissimulé. Jonathan ne peut l\'atteindre sans être vu, mais il sait désormais exactement où va le cercueil.','Jonathan si nasconde mentre gli operai calano un pesante coperchio di legno sulla cassa di terra di Dracula, lo fissano e portano la bara sigillata lungo il passaggio della cappella, verso la cripta. Il Conte vi è completamente nascosto. Jonathan non può raggiungerlo senza farsi vedere, ma ora sa esattamente dove sta andando la bara.','Jonathan esconde-se enquanto os trabalhadores baixam uma pesada tampa de madeira sobre a caixa de terra de Drácula, a fixam e levam o caixão selado pela passagem da capela, rumo à cripta. O Conde fica completamente escondido lá dentro. Jonathan não consegue alcançá-lo sem ser visto, mas agora sabe exactamente para onde vai o caixão.','Jonathan kryje się, gdy robotnicy opuszczają ciężkie drewniane wieko na skrzynię z ziemią Drakuli, przybijają je i niosą zapieczętowaną trumnę przejściem pod kaplicą ku krypcie. Hrabia jest w niej całkowicie ukryty. Jonathan nie może go dosięgnąć niezauważony, lecz teraz wie dokładnie, dokąd trumna trafia.','乔纳森藏起身来。工人们把沉重的木盖压在德古拉的泥土木箱上,钉紧,再抬着封好的棺木穿过礼拜堂的通道,送往地下墓室。伯爵完全被封在里面。乔纳森无法在不被发现的情况下接近他——但现在,他确切地知道那口棺木要去哪里。','ジョナサンは身を隠す。人夫たちはドラキュラの土の箱に重い木の蓋をかぶせ、打ちつけ、封じた棺を礼拝堂の通路づたいに地下墓所へと運んでいく。伯爵はその中に完全に隠されている。見つからずに近づくことはできない——だが、棺の行き先だけは、いま正確にわかった。','Jonathan saklanır; işçiler Drakula\'nın toprak kutusunun üzerine ağır bir tahta kapak indirir, onu çakar ve mühürlenmiş tabutu şapel geçidinden mahzene taşır. Kont içeride tümüyle gizlenmiştir. Jonathan görülmeden ona ulaşamaz, ama artık tabutun tam olarak nereye gittiğini bilmektedir.','يختبئ جوناثان بينما ينزل العمال غطاءً خشبياً ثقيلاً على صندوق تراب دراكولا، ويثبّتونه، ثم يحملون التابوت المختوم عبر ممرّ المصلّى نحو السرداب. الكونت مخفيّ تماماً في داخله. لا يستطيع جوناثان بلوغه دون أن يُرى، لكنه صار يعرف الآن تماماً إلى أين يذهب التابوت.','Джонатан прячется, пока рабочие опускают тяжёлую деревянную крышку на ящик с землёй Дракулы, закрепляют её и несут запечатанный гроб по переходу под часовней к склепу. Граф скрыт внутри целиком. Подойти незамеченным Джонатан не может — но теперь он точно знает, куда несут гроб.'),next:'stolen_clothes'},
crypt_chase:{img:'38_crypt_chase',pos:'center',kind:'story',k:T('CRYPT · FIRST LIGHT','CRIPTA · PRIMERA LUZ','GRUFT · ERSTES LICHT','CRYPTE · PREMIÈRE LUEUR','CRIPTA · PRIMA LUCE','CRIPTA · PRIMEIRA LUZ','KRYPTA · PIERWSZE ŚWIATŁO','地下墓室 · 天光初现','地下墓所 · 最初の光','MAHZEN · İLK IŞIK','السرداب · أول الضوء','СКЛЕП · ПЕРВЫЙ СВЕТ'),title:T('DAWN BREAKS IN','IRRUMPE EL AMANECER','DER MORGEN BRICHT HEREIN','L\'AUBE FAIT IRRUPTION','IRROMPE L\'ALBA','O AMANHECER IRROMPE','WDZIERA SIĘ ŚWIT','黎明破窗而入','夜明けが射し込む','ŞAFAK İÇERİ VURUYOR','الفجر يقتحم المكان','ВРЫВАЕТСЯ РАССВЕТ'),story:T('Dracula rises before Jonathan can strike. A blade of dawn cuts through the cracked crypt window and drives the Count back into shadow. Jonathan drops the hammer, runs through the chapel arch and reaches the parapet where his sheet-rope still hangs.','Drácula se levanta antes de que Jonathan pueda golpear. Un rayo del amanecer atraviesa la ventana rota de la cripta y obliga al Conde a retroceder hacia la sombra. Jonathan suelta el martillo, corre por el arco de la capilla y llega al parapeto donde aún cuelga su cuerda de sábanas.','Dracula erhebt sich, bevor Jonathan zuschlagen kann. Ein Strahl der Morgendämmerung fällt durch das gesprungene Gruftfenster und treibt den Grafen in den Schatten zurück. Jonathan lässt den Hammer fallen, rennt durch den Kapellenbogen und erreicht die Brüstung, an der sein Laken-Seil noch hängt.','Dracula se lève avant que Jonathan puisse frapper. Une lame d\'aube traverse la fenêtre fendue de la crypte et repousse le Comte dans l\'ombre. Jonathan lâche le marteau, court sous l\'arche de la chapelle et atteint le parapet où pend encore sa corde de draps.','Dracula si leva prima che Jonathan possa colpire. Una lama d\'alba taglia la finestra incrinata della cripta e ricaccia il Conte nell\'ombra. Jonathan lascia cadere il martello, corre sotto l\'arco della cappella e raggiunge il parapetto dove pende ancora la sua corda di lenzuola.','Drácula ergue-se antes que Jonathan possa golpear. Uma lâmina de amanhecer atravessa a janela rachada da cripta e empurra o Conde de volta à sombra. Jonathan larga o martelo, corre pelo arco da capela e alcança o parapeito onde a sua corda de lençóis ainda pende.','Drakula podnosi się, zanim Jonathan zdąży uderzyć. Ostrze świtu przecina pękniętą szybę krypty i spycha hrabiego z powrotem w cień. Jonathan upuszcza młot, biegnie przez łuk kaplicy i dopada gzymsu, na którym wciąż zwisa jego lina z prześcieradeł.','乔纳森还未挥下,德古拉便已立起。一道黎明的光刃穿过地下墓室破裂的窗子,把伯爵逼回阴影里。乔纳森丢下锤子,穿过礼拜堂的拱门,奔到那道仍垂着床单绳索的女墙边。','ジョナサンが打ち下ろすより先に、ドラキュラが起き上がる。ひび割れた地下墓所の窓から差し込んだ夜明けの刃が、伯爵を影の中へ押し戻す。ジョナサンは槌を投げ捨て、礼拝堂の拱門を駆け抜け、シーツの縄がまだ垂れている胸壁にたどり着く。','Jonathan vuramadan Drakula doğrulur. Çatlak mahzen penceresinden giren bir şafak bıçağı Kont\'u gölgeye geri sürer. Jonathan çekici bırakır, şapel kemerinden koşarak geçer ve çarşaf halatının hâlâ sarktığı korkuluğa ulaşır.','ينهض دراكولا قبل أن يتمكّن جوناثان من الضرب. نصل من ضوء الفجر يخترق نافذة السرداب المشقوقة فيدفع الكونت إلى الظل. يُلقي جوناثان المطرقة، ويركض عبر قوس المصلّى، ويبلغ الحاجز حيث ما زال حبل الملاءات متدلياً.','Дракула поднимается прежде, чем Джонатан успевает ударить. Клинок рассвета рассекает треснувшее окно склепа и загоняет графа обратно в тень. Джонатан бросает молот, бежит под аркой часовни и добирается до парапета, где всё ещё висит его верёвка из простыней.'),next:'final_escape'},
courtyard_escape:{img:'39_courtyard_escape',pos:'center',kind:'question',q:17,k:T('THE OUTER BRIDGE · FIRST LIGHT','EL PUENTE EXTERIOR · PRIMERA LUZ','DIE ÄUSSERE BRÜCKE · ERSTES LICHT','LE PONT EXTÉRIEUR · PREMIÈRE LUEUR','IL PONTE ESTERNO · PRIMA LUCE','A PONTE EXTERIOR · PRIMEIRA LUZ','MOST ZEWNĘTRZNY · PIERWSZE ŚWIATŁO','外桥 · 天光初现','外橋 · 最初の光','DIŞ KÖPRÜ · İLK IŞIK','الجسر الخارجي · أول الضوء','ВНЕШНИЙ МОСТ · ПЕРВЫЙ СВЕТ'),title:T('THE WHEEL BREAKS','LA RUEDA SE ROMPE','DAS RAD BRICHT','LA ROUE SE BRISE','LA RUOTA SI SPEZZA','A RODA PARTE-SE','KOŁO PĘKA','车轮断裂','車輪が砕ける','TEKERLEK KIRILIYOR','العجلة تنكسر','КОЛЕСО ЛОМАЕТСЯ'),story:T('The loosened wheel tears free on the steep bridge. The wagon crashes sideways, blocks the castle gate and spills earth boxes across the road. Jonathan leaps clear and runs toward the monastery lights.','La rueda aflojada se desprende en el puente empinado. El carro vuelca de lado, bloquea la puerta del castillo y derrama las cajas de tierra por el camino. Jonathan salta y corre hacia las luces del monasterio.','Das gelockerte Rad löst sich auf der steilen Brücke. Der Wagen stürzt quer um, blockiert das Schlosstor und verstreut Erdkisten über die Straße. Jonathan springt zur Seite und rennt zu den Lichtern des Klosters.','La roue desserrée se détache sur le pont en pente. Le chariot verse en travers, bloque le portail du château et répand les caisses de terre sur la route. Jonathan saute de côté et court vers les lumières du monastère.','La ruota allentata si stacca sul ponte in pendenza. Il carro si rovescia di traverso, blocca il cancello del castello e sparge le casse di terra sulla strada. Jonathan salta di lato e corre verso le luci del monastero.','A roda desapertada solta-se na ponte íngreme. A carroça tomba de lado, bloqueia o portão do castelo e espalha as caixas de terra pela estrada. Jonathan salta para o lado e corre para as luzes do mosteiro.','Poluzowane koło odpada na stromym moście. Wóz przewraca się w poprzek, blokuje bramę zamku i rozsypuje skrzynie z ziemią po drodze. Jonathan odskakuje i biegnie ku światłom klasztoru.','在陡峭的桥面上,那只被松动的车轮脱落了。货车横着翻倒,堵死了城堡大门,泥土木箱撒了一路。乔纳森纵身跃开,朝着修道院的灯火奔去。','緩められた車輪が急な橋の上で外れる。荷車は横倒しになって城門をふさぎ、土の箱を道に撒き散らす。ジョナサンは跳びのき、修道院の灯りへ向かって走りだす。','Gevşetilmiş tekerlek dik köprüde yerinden fırlar. Araba yan devrilir, şato kapısını tıkar ve toprak kutularını yola saçar. Jonathan kenara sıçrar ve manastırın ışıklarına doğru koşar.','تنفلت العجلة المُرخاة على الجسر المنحدر. تنقلب العربة على جانبها، فتسدّ بوابة القلعة وتنثر صناديق التراب على الطريق. يقفز جوناثان جانباً ويركض نحو أضواء الدير.','Ослабленное колесо срывается на крутом мосту. Повозка валится поперёк, перекрывает ворота замка и рассыпает ящики с землёй по дороге. Джонатан отскакивает в сторону и бежит к огням монастыря.'),clue:T('The gate is blocked now. Jonathan’s escape is a real future possibility.','La puerta está bloqueada. La huida de Jonathan es una posibilidad futura real.','Das Tor ist nun blockiert. Jonathans Flucht ist eine reale Möglichkeit für die Zukunft.','Le portail est bloqué, maintenant. La fuite de Jonathan est une possibilité future réelle.','Ora il cancello è bloccato. La fuga di Jonathan è una possibilità futura reale.','O portão está bloqueado. A fuga de Jonathan é uma possibilidade futura real.','Brama jest teraz zablokowana. Ucieczka Jonathana to realna przyszła możliwość.','大门现在被堵住了。乔纳森的逃脱是一个真实的未来可能。','門はいま塞がれている。ジョナサンの脱出は、現実にありうる未来の可能性だ。','Kapı artık kapalı. Jonathan\'ın kaçışı gerçek bir gelecek olasılığıdır.','البوابة مسدودة الآن. وهروب جوناثان احتمال مستقبلي حقيقي.','Ворота теперь перекрыты. Побег Джонатана — реальная возможность в будущем.'),prompt:T('Complete the final FIRST CONDITIONAL.','Completa el último PRIMER CONDICIONAL.','Vervollständige den letzten ERSTEN KONDITIONALSATZ.','Complète le dernier PREMIER CONDITIONNEL.','Completa l\'ultimo PRIMO CONDIZIONALE.','Completa o último PRIMEIRO CONDICIONAL.','Uzupełnij ostatni PIERWSZY TRYB WARUNKOWY.','完成最后一个第一条件句。','最後の第一条件文を完成させよう。','Son BİRİNCİ KOŞUL CÜMLESİNİ tamamla.','أكمل الشرط الأول الأخير.','Заверши последнее ПЕРВОЕ УСЛОВНОЕ предложение.'),opts:[T('If the broken wagon blocks the gate, Jonathan will reach the monastery.','Si el carro roto bloquea la puerta, Jonathan llegará al monasterio.','Wenn der zerbrochene Wagen das Tor blockiert, wird Jonathan das Kloster erreichen.','Si le chariot brisé bloque le portail, Jonathan atteindra le monastère.','Se il carro rotto blocca il cancello, Jonathan raggiungerà il monastero.','Se a carroça partida bloquear o portão, Jonathan chegará ao mosteiro.','Jeśli połamany wóz blokuje bramę, Jonathan dotrze do klasztoru.','如果这辆破车堵住了大门,乔纳森将到达修道院。','壊れた荷車が門をふさげば、ジョナサンは修道院にたどり着くだろう。','Kırık araba kapıyı tıkarsa, Jonathan manastıra ulaşacak.','إذا سدّت العربة المحطّمة البوابة، فسيبلغ جوناثان الدير.','Если сломанная повозка перекрывает ворота, Джонатан доберётся до монастыря.'),T('If the broken wagon blocked the gate, Jonathan would have reached the monastery.','Si el carro roto bloqueara la puerta, Jonathan habría llegado al monasterio.','Wenn der zerbrochene Wagen das Tor blockieren würde, hätte Jonathan das Kloster erreicht.','Si le chariot brisé bloquait le portail, Jonathan aurait atteint le monastère.','Se il carro rotto bloccasse il cancello, Jonathan avrebbe raggiunto il monastero.','Se a carroça partida bloqueasse o portão, Jonathan teria chegado ao mosteiro.','Gdyby połamany wóz blokował bramę, Jonathan byłby dotarł do klasztoru.','如果这辆破车堵住大门,乔纳森就已经到达修道院了。','壊れた荷車が門をふさぐとすれば、ジョナサンは修道院にたどり着いていただろう。','Kırık araba kapıyı tıkıyor olsaydı, Jonathan manastıra ulaşmış olurdu.','لو كانت العربة المحطّمة تسدّ البوابة، لكان جوناثان قد بلغ الدير.','Если бы сломанная повозка перекрывала ворота, Джонатан добрался бы до монастыря.'),T('If the broken wagon will block the gate, Jonathan reaches the monastery.','Si el carro roto bloqueará la puerta, Jonathan llega al monasterio.','Wenn der zerbrochene Wagen das Tor blockieren wird, erreicht Jonathan das Kloster.','Si le chariot brisé bloquera le portail, Jonathan atteint le monastère.','Se il carro rotto bloccherà il cancello, Jonathan raggiunge il monastero.','Se a carroça partida bloqueará o portão, Jonathan chega ao mosteiro.','Jeśli połamany wóz będzie blokował bramę, Jonathan dociera do klasztoru.','如果这辆破车将会堵住大门,乔纳森到达修道院。','壊れた荷車が門をふさぐだろうならば、ジョナサンは修道院にたどり着く。','Kırık araba kapıyı tıkayacaksa, Jonathan manastıra ulaşır.','إذا سوف تسدّ العربة المحطّمة البوابة، يبلغ جوناثان الدير.','Если сломанная повозка будет перекрывать ворота, Джонатан добирается до монастыря.')],answer:0,fb:T('First conditional describes a real future possibility: if + present, then will + base verb.','El primer condicional describe una posibilidad futura real: si + presente, después futuro.','Der erste Konditionalsatz beschreibt eine reale zukünftige Möglichkeit: wenn + Präsens, dann wird + Grundform.','Le premier conditionnel décrit une possibilité future réelle : si + présent, puis will + verbe à la base.','Il primo condizionale descrive una possibilità futura reale: if + presente, poi will + verbo base.','O primeiro condicional descreve uma possibilidade futura real: if + presente, depois will + verbo na forma base.','Pierwszy tryb warunkowy opisuje realną przyszłą możliwość: if + czas teraźniejszy, potem will + bezokolicznik.','第一条件句描述真实的未来可能:if + 现在时,然后 will + 动词原形。','第一条件文は現実にありうる未来の可能性を表す。if + 現在形、そして will + 動詞の原形。','Birinci koşul cümlesi gerçek bir gelecek olasılığını anlatır: if + geniş zaman, sonra will + yalın fiil.','الشرط الأول يصف احتمالاً مستقبلياً حقيقياً: if + المضارع، ثم will + الفعل المجرّد.','Первое условное описывает реальную возможность в будущем: if + настоящее, затем will + инфинитив без to.'),next:'resolve'}

let state={scene:'cover',score:0,nerve:5,evidence:0,lang:'off',open:false,answered:false,route:[],awards:new Set(),visited:new Set(),results:{}};
const frame=document.getElementById('frame'), content=document.getElementById('content'), sceneImage=document.getElementById('sceneImage');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function line(obj,cls=''){const en=escapeHTML(obj.en);if(state.lang==='off')return `<span class="${cls}">${en}</span>`;return `<span class="${cls}">${en}<span class="translation">${escapeHTML(obj[state.lang])}</span></span>`}
function label(obj){return state.lang==='off'?escapeHTML(obj.en):`${escapeHTML(obj.en)}<span class="translation">${escapeHTML(obj[state.lang])}</span>`}
function updateHUD(){document.getElementById('score').textContent=state.score;document.getElementById('nerve').textContent='♥'.repeat(state.nerve)+'♡'.repeat(5-state.nerve);document.getElementById('evidence').textContent='◆'.repeat(state.evidence)+'◇'.repeat(3-state.evidence);const s=scenes[state.scene];document.getElementById('progress').textContent=`${s.q||Math.min(17,[...state.visited].filter(x=>scenes[x]?.q).length)}/17`;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function head(s,cover=false){const t=cover?`<span class="pre">GRAMMAR STOKER’S</span><span class="big">BLOCULA</span>`:label(s.title);return `${line(s.k,'kicker')}<h1 class="title ${cover?'cover-title':''}">${t}</h1>${line(s.story,'story')}`}
function fitPanel(){content.style.setProperty('--fit',1);if(!frame.classList.contains('open'))return;let f=1;let guard=0;while(content.scrollHeight>content.clientHeight+1&&f>0.5&&guard++<40){f-=0.025;content.style.setProperty('--fit',f)}}
function render(){const s=scenes[state.scene];state.answered=false;const h=HOT[state.scene];frame.className=`frame ${h[4]} v-${h[5]}${state.lang==='ar'?' rtl':''}`;sceneImage.src=IMAGES[s.img];sceneImage.alt=s.title.en;placeHot(h);const tr=state.lang!=='off';frame.classList.toggle('tr-on',tr);content.style.width=((h[6]||42)+(tr?10:0))+'%';content.style.marginLeft=h[4]==='left'&&h[7]?h[7]+'%':'';content.style.marginRight=h[4]==='right'&&h[7]?h[7]+'%':'';let html=`<button class="hide-btn" onclick="closePanel()" title="Esc">✕ ${escapeHTML(state.lang==='off'?LABELS.hide.en:LABELS.hide[state.lang])}</button>`+head(s,s.kind==='intro');if(s.kind==='intro'){html+=`<button class="start" onclick="go('${s.next}')">${label(LABELS.enter)}</button><div class="small">${label(LABELS.subtitle)}</div>`}else if(s.kind==='rules'){html+=`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div><div class="rule-note">${label(s.note)}</div><button class="continue" onclick="go('${s.next}')">${label(LABELS.begin)}</button>`}else if(s.kind==='story'){html+=`${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${label(LABELS.continue)}</button>`}else if(s.kind==='question'){html+=`<div class="clue"><b>${label(LABELS.visual)}</b><br>${label(s.clue)}</div><div class="prompt">${label(s.prompt)}</div><div class="options">${s.opts.map((o,i)=>`<button class="option" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span><span>${label(o)}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="continue" class="continue" hidden onclick="advance()">${label(LABELS.continue)}</button>`}else if(s.kind==='choice'){html+=`<div class="route-options">${s.routes.map((r,i)=>`<button class="route" onclick="chooseRoute(${i})"><b>${i+1} · ${label(r.name)}</b>${label(r.desc)}</button>`).join('')}</div>`}else if(s.kind==='ending'){html+=`<div class="final-score">${state.score}/85 · ${state.evidence}/3 EVIDENCE</div><button class="continue" onclick="go('${s.next}')">${label(LABELS.continue)}</button>`}else if(s.kind==='failure'){html+=`<div class="final-score">${state.score}/85 · ${state.evidence}/3 EVIDENCE</div><button class="restart" onclick="restart()">${label(LABELS.restart)}</button>`}else if(s.kind==='epilogue'){html+=`<div class="final-score">ROUTE: ${escapeHTML(state.route.join(' · ').toUpperCase())}</div><button class="restart" onclick="restart()">${label(LABELS.restart)}</button>`}content.innerHTML=html;updateHUD();fitPanel();setOpen(s.kind==='intro');if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene)){setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}}

const hot=document.getElementById('hot'), hotLabel=document.getElementById('hotLabel'), zone=document.getElementById('zone');
function ui(key){return state.lang==='off'?LABELS[key].en:LABELS[key][state.lang]}
// HOT coordinates are % of the 16:9 frame at desktop; the picture is 3:2 and object-fit:cover, so convert to image space and back for the actual frame (a phone shows a narrow central slice)
function placeHot(h){const W=frame.clientWidth,H=frame.clientHeight,sc=Math.max(W/1536,H/1024),dw=1536*sc,dh=1024*sc,ox=(W-dw)/2,oy=(H-dh)/2;const ix=h[0]/100,iy=0.078+h[1]/100*0.844,iw=h[2]/100,ih=h[3]/100*0.844;hot.style.left=(ox+ix*dw)+'px';hot.style.top=(oy+iy*dh)+'px';hot.style.width=(iw*dw)+'px';hot.style.height=(ih*dh)+'px';const cy=oy+iy*dh,ch=ih*dh;hot.classList.toggle('above',cy+ch/2>H*0.84);hotLabel.textContent=ui('read');
  document.getElementById('fsLabel').textContent=ui('fullscreen');document.getElementById('langWord').textContent=ui('translate');document.getElementById('langCur').textContent=state.lang==='off'?'OFF':LANG_NAMES[state.lang];
  document.querySelectorAll('.lang-item').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function setOpen(on){state.open=!!on;if(on){const hr=hot.getBoundingClientRect(),zr=zone.getBoundingClientRect();const cl=zr.left+content.offsetLeft,ct=zr.top+content.offsetTop;const ox=hr.left+hr.width/2-cl,oy=hr.top+hr.height/2-ct;content.style.transformOrigin=`${ox}px ${oy}px`}frame.classList.toggle('open',state.open);if(state.open)fitPanel()}
function openPanel(){if(!state.open)setOpen(true)}
function closePanel(){if(state.open)setOpen(false)}
addEventListener('resize',fitPanel);
hot.addEventListener('click',e=>{e.stopPropagation();openPanel()});
sceneImage.addEventListener('click',()=>{closeMenu();closePanel()});
window.addEventListener('resize',()=>{if(HOT[state.scene])placeHot(HOT[state.scene])});
const langMenu=document.getElementById('langMenu'), langBtn=document.getElementById('langBtn');
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
function toggleMenu(){langMenu.hidden=!langMenu.hidden;langBtn.setAttribute('aria-expanded',String(!langMenu.hidden))}
function go(id){state.scene=id;state.visited.add(id);render()}
function displayAnswer(i,apply){state.answered=true;const s=scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];buttons.forEach(b=>b.disabled=true);const ok=i===s.answer;buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');const fb=document.getElementById('feedback');if(apply){if(ok){state.score+=5}else{state.nerve=Math.max(0,state.nerve-1)}if(s.award&&!state.awards.has(s.award)){state.awards.add(s.award)}if(s.evidence&&!state.awards.has(state.scene)){state.awards.add(state.scene);state.evidence=Math.min(3,state.evidence+s.evidence)}}fb.innerHTML=`<strong>${label(ok?LABELS.correct:LABELS.wrong)}</strong><br>${label(s.fb)}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD();requestAnimationFrame(fitPanel)}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;state.results[state.scene]=i;displayAnswer(i,true)}
function advance(){const s=scenes[state.scene];if(state.nerve<=0){go('failure');return}if(s.next==='resolve'){go(state.score>=70&&state.evidence===3?'success':'failure');return}go(s.next)}
function chooseRoute(i){const s=scenes[state.scene],r=s.routes[i];state.route.push(r.route);go(r.target)}
function restart(){state={scene:'cover',score:0,nerve:5,evidence:0,lang:state.lang,open:false,answered:false,route:[],awards:new Set(),visited:new Set(),results:{}};render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?'<b>OFF</b><span>English only</span>':`<b>${l.toUpperCase()}</b><span>${LANG_NAMES[l]}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(e.key==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(e.key==='Enter'&&!state.open){openPanel();return}if(['1','2','3'].includes(e.key)&&!state.open){openPanel();return}if(e.key.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(['1','2','3'].includes(e.key)){const i=Number(e.key)-1;const s=scenes[state.scene];if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click()}if(e.key==='Enter'){document.querySelector('.continue:not([hidden]),.start,.restart')?.click()}});
render();
