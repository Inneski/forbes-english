oir en premier.','Dracula ha rotto lo specchio. Metti lo specchio per primo.','Drácula partiu o espelho. Ponha o espelho primeiro.','Drakula rozbił lustro. Postaw lustro na pierwszym miejscu.','德古拉打碎了镜子。请把镜子放在前面。','ドラキュラが鏡を割った。鏡を先に置け。','Drakula aynayı parçaladı. Önce aynayı söyle.','حطّم دراكولا المرآة. ضع المرآة أولاً.','Дракула разбил зеркало. Поставь зеркало на первое место.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.','Choisis le PASSIF PASSÉ correct.','Scegli PASSIVA DEL PASSATO corretta.','Escolha a PASSIVA DO PASSADO correta.','Wybierz poprawną STRONĘ BIERNĄ CZASU PRZESZŁEGO.','选出正确的过去时被动句。','正しい過去の受動態を選べ。','Doğru GEÇMİŞ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في الماضي الصحيح.','Выбери верный ПАССИВ ПРОШЕДШЕГО.'),opts:[T('The mirror smashed by Dracula.','El espejo rompió por Drácula.','Der Spiegel zerbrach von Dracula.','Le miroir a brisé par Dracula.','Lo specchio ruppe da Dracula.','O espelho partiu por Drácula.','Lustro rozbite przez Drakulę.','镜子打碎被德古拉。','鏡はドラキュラによって割った。','Ayna Drakula tarafından parçaladı.','المرآة تحطمت من قِبل دراكولا.','Зеркало разбил Дракулой.'),T('The mirror was smashed by Dracula.','El espejo fue roto por Drácula.','Der Spiegel wurde von Dracula zerbrochen.','Le miroir a été brisé par Dracula.','Lo specchio fu rotto da Dracula.','O espelho foi partido por Drácula.','Lustro zostało rozbite przez Drakulę.','镜子被德古拉打碎了。','鏡はドラキュラによって割られた。','Ayna Drakula tarafından parçalandı.','حُطّمت المرآة من قِبل دراكولا.','Зеркало было разбито Дракулой.'),T('The mirror was smash by Dracula.','El espejo fue romper por Drácula.','Der Spiegel wurde von Dracula zerbrechen.','Le miroir a été briser par Dracula.','Lo specchio fu rompere da Dracula.','O espelho foi partir por Drácula.','Lustro zostało rozbić przez Drakulę.','镜子被德古拉打碎。','鏡はドラキュラによって割られる。','Ayna Drakula tarafından parçala oldu.','كانت المرآة تحطيم من قِبل دراكولا.','Зеркало было разбивать Дракулой.')],answer:1,fb:T('Was + smashed forms the past passive.','Fue + roto forma la pasiva del pasado.','Wurde + zerbrochen bildet das Passiv der Vergangenheit.','A été + brisé forme le passif passé.','Fu + rotto forma la passiva del passato.','Foi + partido forma a passiva do passado.','Zostało + rozbite tworzy stronę bierną przeszłą.','was + smashed 构成过去时被动。','was+割られた(smashed)が過去の受動態を作る。','Was + smashed, geçmiş zaman pasifini oluşturur.','"حُطّمت" تكوّن المبني للمجهول في الماضي.','Was + smashed образует пассив прошедшего.'),next:'locked_room'},
locked_room:{img:'14_locked_room',pos:'right',kind:'question',q:10,k:T('CASTLE DRACULA · PRISON','CASTILLO DE DRÁCULA · PRISIÓN','SCHLOSS DRACULA · GEFÄNGNIS','CHÂTEAU DE DRACULA · PRISON','CASTELLO DRACULA · PRIGIONE','CASTELO DE DRÁCULA · PRISÃO','ZAMEK DRAKULI · WIĘZIENIE','德古拉城堡 · 囚室','ドラキュラ城 · 牢獄','DRAKULA ŞATOSU · ZİNDAN','قلعة دراكولا · السجن','ЗАМОК ДРАКУЛЫ · ТЕМНИЦА'),title:T('EVERY DOOR IS LOCKED','TODAS LAS PUERTAS ESTÁN CERRADAS','JEDE TÜR IST VERSCHLOSSEN','AUCUNE PORTE N\'OUVRE','OGNI PORTA È BLOCCATA','TODAS AS PORTAS FECHADAS','KAŻDE DRZWI SĄ ZAMKNIĘTE','每扇门都锁着','すべての扉に鍵がかかっている','HER KAPI KİLİTLİ','كل باب موصد','ВСЕ ДВЕРИ ЗАПЕРТЫ'),story:T('Jonathan tests every key. Corridors fold into corridors, but no door leads outside.','Jonathan prueba cada llave. Los pasillos se repiten, pero ninguna puerta lleva fuera.','Jonathan probiert jeden Schlüssel. Korridore führen in Korridore, doch keine Tür führt hinaus.','Jonathan essaie chaque clé. Les couloirs se répètent, mais aucune porte ne mène dehors.','Jonathan prova ogni chiave. I corridoi si ripiegano su se stessi, ma nessuna porta conduce fuori.','Jonathan experimenta todas as chaves. Os corredores repetem-se, mas nenhuma porta leva ao exterior.','Jonathan sprawdza każdy klucz. Korytarze przechodzą w kolejne korytarze, lecz żadne drzwi nie prowadzą na zewnątrz.','乔纳森试遍了每一把钥匙。回廊套着回廊,却没有一扇门通向外面。','ジョナサンはすべての鍵を試す。廊下は廊下へと折り重なるが、外へ通じる扉はない。','Jonathan her anahtarı dener. Koridorlar koridorlara açılır, ama hiçbir kapı dışarıya çıkmaz.','يجرّب جوناثان كل مفتاح. تتكرر الممرات، لكن لا باب يقود إلى الخارج.','Джонатан пробует каждый ключ. Коридоры переходят в коридоры, но ни одна дверь не ведёт наружу.'),clue:T('He does not have the right key. Imagine a different present.','No tiene la llave correcta. Imagina un presente diferente.','Er hat nicht den richtigen Schlüssel. Stell dir eine andere Gegenwart vor.','Il n\'a pas la bonne clé. Imagine un présent différent.','Non ha la chiave giusta. Immagina un presente diverso.','Ele não tem a chave certa. Imagine um presente diferente.','Nie ma odpowiedniego klucza. Wyobraź sobie inną teraźniejszość.','他没有那把对的钥匙。设想一个不同的当下。','彼は正しい鍵を持っていない。異なる現在を想像せよ。','Doğru anahtara sahip değil. Farklı bir şimdiki zaman hayal et.','لا يملك المفتاح الصحيح. تخيّل حاضراً مختلفاً.','У него нет нужного ключа. Представь другое настоящее.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.','Choisis le DEUXIÈME CONDITIONNEL.','Scegli il SECONDO CONDIZIONALE.','Escolha o SEGUNDO CONDICIONAL.','Wybierz DRUGI OKRES WARUNKOWY.','选出第二条件句。','第二条件文を選べ。','İKİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثاني.','Выбери ВТОРОЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan has a key, he left the room.','Si Jonathan tiene una llave, salió de la habitación.','Wenn Jonathan einen Schlüssel hat, verließ er das Zimmer.','Si Jonathan a une clé, il est sorti de la pièce.','Se Jonathan ha una chiave, uscì dalla stanza.','Se Jonathan tem uma chave, saiu do quarto.','Jeśli Jonathan ma klucz, opuścił pokój.','如果乔纳森有钥匙,他离开了房间。','もしジョナサンが鍵を持っているなら、彼は部屋を出た。','Jonathan\'ın bir anahtarı varsa, odadan çıktı.','إن كان لدى جوناثان مفتاح، غادر الغرفة.','Если у Джонатана есть ключ, он вышел из комнаты.'),T('If Jonathan had had a key, he can leave now.','Si Jonathan hubiera tenido una llave, puede salir ahora.','Wenn Jonathan einen Schlüssel gehabt hätte, kann er jetzt gehen.','S\'il avait eu une clé, il peut sortir maintenant.','Se Jonathan avesse avuto una chiave, può uscire ora.','Se Jonathan tivesse tido uma chave, pode sair agora.','Gdyby Jonathan miał wcześniej klucz, może teraz wyjść.','如果乔纳森当初有钥匙,他现在可以离开。','もしジョナサンが鍵を持っていたら、今出られる。','Jonathan\'ın bir anahtarı olmuş olsaydı, şimdi çıkabilir.','لو كان جوناثان امتلك مفتاحاً، يستطيع المغادرة الآن.','Если бы у Джонатана был ключ, он может выйти сейчас.'),T('If Jonathan had the right key, he could leave the room.','Si Jonathan tuviera la llave correcta, podría salir de la habitación.','Wenn Jonathan den richtigen Schlüssel hätte, könnte er das Zimmer verlassen.','Si Jonathan avait la bonne clé, il pourrait sortir de la pièce.','Se Jonathan avesse la chiave giusta, potrebbe uscire dalla stanza.','Se Jonathan tivesse a chave certa, poderia sair do quarto.','Gdyby Jonathan miał odpowiedni klucz, mógłby opuścić pokój.','如果乔纳森有那把对的钥匙,他就能离开房间。','もしジョナサンが正しい鍵を持っていたら、部屋を出られるだろう。','Jonathan\'da doğru anahtar olsaydı, odadan çıkabilirdi.','لو كان لدى جوناثان المفتاح الصحيح، لاستطاع مغادرة الغرفة.','Если бы у Джонатана был нужный ключ, он мог бы выйти из комнаты.')],answer:2,fb:T('Second conditional imagines an unreal present: if + past, then could/would + verb.','El segundo condicional imagina un presente irreal: si + pasado, después podría/haría.','Der zweite Konditionalsatz beschreibt eine irreale Gegenwart: wenn + Vergangenheit, dann könnte/würde + Verb.','Le deuxième conditionnel imagine un présent irréel : si + passé, puis conditionnel.','Il secondo condizionale immagina un presente irreale: se + passato, poi potrebbe/farebbe.','O segundo condicional imagina um presente irreal: se + passado, depois poderia/faria.','Drugi okres warunkowy wyobraża nierealną teraźniejszość: jeśli + czas przeszły, potem tryb warunkowy (could/would).','第二条件句设想不真实的现在:if + 过去时,然后 could/would + 动词。','第二条件文は非現実の現在を想像する:if+過去形、その後could/would+動詞。','İkinci şart cümlesi gerçek dışı bir şimdiki zamanı hayal eder: eğer + geçmiş zaman, ardından could/would + fiil.','الشرط الثاني يتخيل حاضراً غير واقعي: إن + ماضٍ، ثم لـ + فعل.','Второй условный описывает нереальное настоящее: если + прошедшее, потом could/would + глагол.'),next:'choice2'},
choice2:{img:'15_choice2',pos:'center',kind:'choice',k:T('DECISION II · THE CASTLE’S HEART','DECISIÓN II · EL CORAZÓN DEL CASTILLO','ENTSCHEIDUNG II · DAS HERZ DES SCHLOSSES','DÉCISION II · LE CŒUR DU CHÂTEAU','DECISIONE II · IL CUORE DEL CASTELLO','DECISÃO II · O CORAÇÃO DO CASTELO','DECYZJA II · SERCE ZAMKU','抉择二 · 城堡之心','決断II · 城の中心','KARAR II · ŞATONUN KALBİ','القرار الثاني · قلب القلعة','РЕШЕНИЕ II · СЕРДЦЕ ЗАМКА'),title:T('LIBRARY OR TOWER?','¿BIBLIOTECA O TORRE?','BIBLIOTHEK ODER TURM?','BIBLIOTHÈQUE OU TOUR ?','BIBLIOTECA O TORRE?','BIBLIOTECA OU TORRE?','BIBLIOTEKA CZY WIEŻA?','藏书室还是高塔?','書庫か塔か?','KÜTÜPHANE Mİ, KULE Mİ?','المكتبة أم البرج؟','БИБЛИОТЕКА ИЛИ БАШНЯ?'),story:T('The west passage divides. Papers and keys wait in the red library. An impossible shadow moves beyond the tower window.','El pasillo oeste se divide. Papeles y llaves esperan en la biblioteca roja. Una sombra imposible se mueve tras la ventana de la torre.','Der Westgang teilt sich. Papiere und Schlüssel warten in der roten Bibliothek. Ein unmöglicher Schatten bewegt sich vor dem Turmfenster.','Le couloir ouest se divise. Papiers et clés attendent dans la bibliothèque rouge. Une ombre impossible bouge à la fenêtre de la tour.','Il corridoio ovest si divide. Carte e chiavi aspettano nella biblioteca rossa. Un\'ombra impossibile si muove oltre la finestra della torre.','A passagem oeste divide-se. Papéis e chaves esperam na biblioteca vermelha. Uma sombra impossível move-se para lá da janela da torre.','Zachodni korytarz się rozdziela. Papiery i klucze czekają w czerwonej bibliotece. Niemożliwy cień porusza się za oknem wieży.','西侧通道分成两条。文件与钥匙就在红色藏书室中。一道不可能存在的影子,在塔楼窗外移动。','西の通路が分かれる。赤い書庫には書類と鍵が待つ。塔の窓の向こうでは、あり得ない影が動いている。','Batı koridoru ikiye ayrılır. Kızıl kütüphanede kâğıtlar ve anahtarlar bekler. Kule penceresinin ardında imkânsız bir gölge hareket eder.','ينقسم الممر الغربي. تنتظر أوراق ومفاتيح في المكتبة الحمراء. يتحرك ظل مستحيل خلف نافذة البرج.','Западный проход разделяется. В красной библиотеке ждут бумаги и ключи. За окном башни движется невозможная тень.'),routes:[{name:T('SEARCH THE LIBRARY','REGISTRAR LA BIBLIOTECA','DIE BIBLIOTHEK DURCHSUCHEN','FOUILLER BIBLIOTHÈQUE','ESPLORA LA BIBLIOTECA','PROCURAR NA BIBLIOTECA','PRZESZUKAJ BIBLIOTEKĘ','搜查藏书室','書庫を捜索する','KÜTÜPHANEYİ ARA','فتّش المكتبة','ОБЫСКАТЬ БИБЛИОТЕКУ'),desc:T('Find the false letters and steal a key.','Encuentra las cartas falsas y roba una llave.','Finde die falschen Briefe und stiehl einen Schlüssel.','Trouve les fausses lettres et vole une clé.','Trova le false lettere e ruba una chiave.','Encontre as cartas falsas e roube uma chave.','Znajdź fałszywe listy i ukradnij klucz.','找出伪造的信件,偷走一把钥匙。','偽の手紙を見つけ、鍵を盗む。','Sahte mektupları bul ve bir anahtar çal.','اعثر على الرسائل المزيفة واسرق مفتاحاً.','Найди поддельные письма и укради ключ.'),target:'forged_letters',route:'library'},{name:T('CLIMB THE TOWER','SUBIR A LA TORRE','DEN TURM BESTEIGEN','GRIMPER À LA TOUR','SALI SULLA TORRE','SUBIR À TORRE','WEJDŹ NA WIEŻĘ','攀上高塔','塔を登る','KULEYE TIRMAN','تسلّق البرج','ПОДНЯТЬСЯ НА БАШНЮ'),desc:T('Follow Dracula’s shadow into the storm.','Sigue la sombra de Drácula hacia la tormenta.','Folge Draculas Schatten in den Sturm.','Suis l\'ombre de Dracula dans la tempête.','Segui l\'ombra di Dracula nella tempesta.','Siga a sombra de Drácula até à tempestade.','Podążaj za cieniem Drakuli w burzę.','追随德古拉的影子,步入风暴。','嵐の中、ドラキュラの影を追う。','Drakula\'nın gölgesini fırtınaya kadar takip et.','اتبع ظل دراكولا إلى العاصفة.','Следуй за тенью Дракулы в бурю.'),target:'wall_crawl',route:'tower'}]},
forged_letters:{img:'16_forged_letters',pos:'left',kind:'question',q:11,k:T('ROUTE · THE RED LIBRARY','RUTA · LA BIBLIOTECA ROJA','ROUTE · DIE ROTE BIBLIOTHEK','ROUTE · BIBLIOTHÈQUE ROUGE','VIA · LA BIBLIOTECA ROSSA','ROTA · A BIBLIOTECA VERMELHA','TRASA · CZERWONA BIBLIOTEKA','路线 · 红色藏书室','ルート · 赤い書庫','ROTA · KIZIL KÜTÜPHANE','المسار · المكتبة الحمراء','ПУТЬ · КРАСНАЯ БИБЛИОТЕКА'),title:T('LETTERS FROM A PRISONER','CARTAS DE UN PRISIONERO','BRIEFE EINES GEFANGENEN','LETTRES D\'UN PRISONNIER','LETTERE DI UN PRIGIONIERO','CARTAS DE UM PRISIONEIRO','LISTY WIĘŹNIA','囚徒的信','囚人からの手紙','BİR MAHKUMDAN MEKTUPLAR','رسائل من سجين','ПИСЬМА ПЛЕННИКА'),story:T('Jonathan finds letters dated weeks ahead. Dracula plans to force him to write that he is safe.','Jonathan encuentra cartas fechadas semanas después. Drácula planea obligarlo a escribir que está a salvo.','Jonathan findet Briefe mit Daten Wochen in der Zukunft. Dracula will ihn zwingen zu schreiben, dass er sicher ist.','Jonathan trouve des lettres datées à l\'avance. Dracula veut le forcer à écrire qu\'il va bien.','Jonathan trova lettere datate settimane più avanti. Dracula progetta di costringerlo a scrivere che è al sicuro.','Jonathan encontra cartas datadas de semanas mais tarde. Drácula planeia obrigá-lo a escrever que está a salvo.','Jonathan znajduje listy datowane na kolejne tygodnie. Drakula planuje zmusić go do napisania, że jest bezpieczny.','乔纳森发现了几周后日期的信件。德古拉打算逼他写信,谎称自己安然无恙。','ジョナサンは数週間先の日付が書かれた手紙を見つける。ドラキュラは彼に無事だと書かせるつもりだ。','Jonathan, haftalar sonrasına tarihlenmiş mektuplar bulur. Drakula onu güvende olduğunu yazmaya zorlamayı planlıyor.','يجد جوناثان رسائل مؤرخة بعد أسابيع. يخطط دراكولا لإجباره على كتابة أنه بأمان.','Джонатан находит письма, датированные на недели вперёд. Дракула планирует заставить его написать, что он в безопасности.'),clue:T('Dracula ordered Jonathan to write the letters. Focus on the letters.','Drácula ordenó a Jonathan escribir las cartas. Concéntrate en las cartas.','Dracula befahl Jonathan, die Briefe zu schreiben. Konzentriere dich auf die Briefe.','Dracula a ordonné à Jonathan d\'écrire les lettres. Concentre-toi sur les lettres.','Dracula ha ordinato a Jonathan di scrivere le lettere. Concentrati sulle lettere.','Drácula ordenou a Jonathan que escrevesse as cartas. Concentre-se nas cartas.','Drakula nakazał Jonathanowi napisać listy. Skup się na listach.','德古拉命令乔纳森写下这些信。请聚焦这些信件。','ドラキュラはジョナサンに手紙を書くよう命じた。手紙に焦点を当てよ。','Drakula, Jonathan\'a mektupları yazmasını emretti. Mektuplara odaklan.','أمر دراكولا جوناثان بكتابة الرسائل. ركّز على الرسائل.','Дракула приказал Джонатану написать письма. Сосредоточься на письмах.'),prompt:T('Choose the correct PASSIVE sentence.','Elige la oración correcta en PASIVA.','Wähle den richtigen PASSIVSATZ.','Choisis la phrase correcte au PASSIF.','Scegli la frase corretta in PASSIVA.','Escolha a frase correta na PASSIVA.','Wybierz poprawne zdanie w STRONIE BIERNEJ.','选出正确的被动句。','正しい受動態の文を選べ。','Doğru PASİF cümleyi seç.','اختر الجملة الصحيحة في المبني للمجهول.','Выбери верное предложение в ПАССИВЕ.'),opts:[T('The letters were written under Dracula’s orders.','Las cartas fueron escritas bajo las órdenes de Drácula.','Die Briefe wurden auf Draculas Befehl geschrieben.','Les lettres ont été écrites sur ordre de Dracula.','Le lettere furono scritte sotto gli ordini di Dracula.','As cartas foram escritas sob as ordens de Drácula.','Listy zostały napisane na rozkaz Drakuli.','这些信是在德古拉的命令下写成的。','手紙はドラキュラの命令の下で書かれた。','Mektuplar, Drakula\'nın emriyle yazıldı.','كُتبت الرسائل بأوامر دراكولا.','Письма были написаны по приказу Дракулы.'),T('The letters wrote under Dracula’s orders.','Las cartas escribieron bajo las órdenes de Drácula.','Die Briefe schrieben auf Draculas Befehl.','Les lettres ont écrit sur ordre de Dracula.','Le lettere scrissero sotto gli ordini di Dracula.','As cartas escreveram sob as ordens de Drácula.','Listy napisały na rozkaz Drakuli.','这些信在德古拉的命令下写。','手紙はドラキュラの命令の下で書いた。','Mektuplar Drakula\'nın emriyle yazdı.','الرسائل كَتبت تحت أوامر دراكولا.','Письма написали по приказу Дракулы.'),T('The letters were wrote by Jonathan.','Las cartas fueron escribió por Jonathan.','Die Briefe wurden von Jonathan schrieb.','Les lettres ont été écrire par Jonathan.','Le lettere furono scrisse da Jonathan.','As cartas foram escreveu por Jonathan.','Listy zostały pisać przez Jonathana.','这些信被乔纳森写。','手紙はジョナサンによって書かれる。','Mektuplar Jonathan tarafından yazdı oldu.','كانت الرسائل كَتب من قِبل جوناثان.','Письма были написать Джонатаном.')],answer:0,fb:T('Were + written is the correct past passive.','Fueron + escritas es la pasiva correcta del pasado.','Wurden + geschrieben ist das richtige Passiv der Vergangenheit.','Ont été + écrites est le passif passé correct.','Furono + scritte è la passiva corretta del passato.','Foram + escritas é a passiva correta do passado.','Zostały + napisane to poprawna strona bierna przeszła.','were + written 才是正确的过去时被动。','were+書かれた(written)が正しい過去の受動態。','Were + written (yazıldı), doğru geçmiş zaman pasifidir.','"كُتبت" هي المبني للمجهول الصحيح في الماضي.','Were + written — верный пассив прошедшего.'),next:'stolen_key'},
stolen_key:{img:'17_stolen_key',pos:'right',kind:'question',q:12,k:T('ROUTE · THE MASTER KEY','RUTA · LA LLAVE MAESTRA','ROUTE · DER HAUPTSCHLÜSSEL','ROUTE · LA CLÉ MAÎTRESSE','VIA · LA CHIAVE MAESTRA','ROTA · A CHAVE-MESTRA','TRASA · KLUCZ UNIWERSALNY','路线 · 万能钥匙','ルート · 合鍵','ROTA · ANA ANAHTAR','المسار · المفتاح الرئيسي','ПУТЬ · ГЛАВНЫЙ КЛЮЧ'),title:T('A SHADOW REACHES','UNA SOMBRA SE ACERCA','EIN SCHATTEN GREIFT AUS','UNE OMBRE S\'ÉTEND','UN\'OMBRA SI ALLUNGA','SOMBRA APROXIMA-SE','CIEŃ SIĘGA','阴影伸来','影が伸びる','BİR GÖLGE UZANIYOR','ظل يمتد','ТЕНЬ ТЯНЕТСЯ'),story:T('The iron key hangs from Dracula’s coat. A huge hand-shaped shadow moves across the wall.','La llave de hierro cuelga del abrigo de Drácula. Una gran sombra con forma de mano avanza por la pared.','Der Eisenschlüssel hängt an Draculas Mantel. Ein riesiger handförmiger Schatten bewegt sich über die Wand.','La clé de fer pend au manteau de Dracula. Une immense ombre en forme de main se déplace sur le mur.','La chiave di ferro pende dal cappotto di Dracula. Un\'enorme ombra a forma di mano avanza sul muro.','A chave de ferro pende do casaco de Drácula. Uma enorme sombra em forma de mão move-se pela parede.','Żelazny klucz zwisa z płaszcza Drakuli. Ogromny cień w kształcie dłoni przesuwa się po ścianie.','那把铁钥匙挂在德古拉的外衣上。一道巨大的、手形的阴影掠过墙面。','鉄の鍵がドラキュラの上着から下がっている。巨大な手の形をした影が壁を横切る。','Demir anahtar, Drakula\'nın paltosundan sarkar. Dev, el biçimli bir gölge duvar boyunca hareket eder.','يتدلى المفتاح الحديدي من معطف دراكولا. يتحرك ظل ضخم بشكل يد عبر الجدار.','Железный ключ висит на пальто Дракулы. Огромная тень в форме руки движется по стене.'),clue:T('Taking the key is dangerous, but it may open the west door.','Tomar la llave es peligroso, pero puede abrir la puerta oeste.','Den Schlüssel zu nehmen ist gefährlich, aber er könnte die Westtür öffnen.','Prendre la clé est dangereux, mais elle peut ouvrir la porte ouest.','Prendere la chiave è pericoloso, ma potrebbe aprire la porta ovest.','Tirar a chave é perigoso, mas pode abrir a porta oeste.','Zabranie klucza jest niebezpieczne, ale może otworzyć zachodnie drzwi.','拿走钥匙很危险,但它或许能打开西门。','鍵を取るのは危険だが、西の扉を開けるかもしれない。','Anahtarı almak tehlikeli, ama batı kapısını açabilir.','أخذ المفتاح خطر، لكنه قد يفتح الباب الغربي.','Взять ключ опасно, но он может открыть западную дверь.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.','Choisis le PREMIER CONDITIONNEL.','Scegli il PRIMO CONDIZIONALE.','Escolha o PRIMEIRO CONDICIONAL.','Wybierz PIERWSZY OKRES WARUNKOWY.','选出第一条件句。','第一条件文を選べ。','BİRİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الأول.','Выбери ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan stole the key, he unlocks yesterday.','Si Jonathan robara la llave, abre ayer.','Wenn Jonathan den Schlüssel stähle, öffnet er gestern.','Si Jonathan volait la clé, il ouvre hier.','Se Jonathan rubasse la chiave, apre ieri.','Se Jonathan roubasse a chave, ele abre ontem.','Gdyby Jonathan ukradł klucz, otwiera wczoraj.','如果乔纳森偷走了钥匙,他昨天开锁。','もしジョナサンが鍵を盗んだら、昨日開ける。','Jonathan anahtarı çalsaydı, dün açar.','لو سرق جوناثان المفتاح، يفتح أمس.','Если бы Джонатан украл ключ, он отпирает вчера.'),T('If Jonathan steals the key, he will unlock the west door.','Si Jonathan roba la llave, abrirá la puerta oeste.','Wenn Jonathan den Schlüssel stiehlt, wird er die Westtür öffnen.','Si Jonathan vole la clé, il ouvrira la porte ouest.','Se Jonathan ruba la chiave, aprirà la porta ovest.','Se Jonathan roubar a chave, vai abrir a porta oeste.','Jeśli Jonathan ukradnie klucz, otworzy zachodnie drzwi.','如果乔纳森偷走钥匙,他就会打开西门。','もしジョナサンが鍵を盗めば、西の扉を開けるだろう。','Jonathan anahtarı çalarsa, batı kapısını açacak.','إن سرق جوناثان المفتاح، سيفتح الباب الغربي.','Если Джонатан украдёт ключ, он откроет западную дверь.'),T('If Jonathan will steal the key, he unlocked the door.','Si Jonathan robará la llave, abrió la puerta.','Wenn Jonathan den Schlüssel stehlen wird, öffnete er die Tür.','Si Jonathan volera la clé, il a ouvert la porte.','Se Jonathan ruberà la chiave, aprì la porta.','Se Jonathan vai roubar a chave, ele abriu a porta.','Jeśli Jonathan będzie kradł klucz, otworzył drzwi.','如果乔纳森将会偷走钥匙,他打开过门。','もしジョナサンが鍵を盗むでしょうなら、扉を開けた。','Jonathan anahtarı çalacaksa, kapıyı açtı.','إن سيسرق جوناثان المفتاح، فتح الباب.','Если Джонатан будет красть ключ, он открыл дверь.')],answer:1,fb:T('First conditional: present after if, then will + verb.','Primer condicional: presente después de si, después futuro.','Erster Konditionalsatz: Präsens nach wenn, dann wird + Verb.','Premier conditionnel : présent après si, puis futur.','Primo condizionale: presente dopo se, poi futuro.','Primeiro condicional: presente depois de se, depois futuro.','Pierwszy okres warunkowy: czas teraźniejszy po if, potem czas przyszły.','第一条件句:if 之后用现在时,然后 will + 动词。','第一条件文:ifの後は現在形、その後will+動詞。','Birinci şart cümlesi: eğer\'den sonra geniş zaman, ardından will + fiil.','الشرط الأول: مضارع بعد إن، ثم سـ + فعل.','Первый условный: настоящее после if, потом will + глагол.'),evidence:1,next:'shipping_plan'},
wall_crawl:{img:'18_wall_crawl',pos:'center',kind:'question',q:11,k:T('ROUTE · THE NORTH TOWER','RUTA · LA TORRE NORTE','ROUTE · DER NORDTURM','ROUTE · LA TOUR NORD','VIA · LA TORRE NORD','ROTA · A TORRE NORTE','TRASA · PÓŁNOCNA WIEŻA','路线 · 北塔','ルート · 北の塔','ROTA · KUZEY KULESİ','المسار · البرج الشمالي','ПУТЬ · СЕВЕРНАЯ БАШНЯ'),title:T('THE WALL WALKER','EL QUE CAMINA POR LA PARED','DER WANDKRIECHER','MARCHEUR DU MUR','CAMMINA SUL MURO','ANDARILHO DA PAREDE','WĘDROWIEC PO MURZE','行于墙上者','壁を歩く者','DUVARDA YÜRÜYEN','السائر على الجدار','ИДУЩИЙ ПО СТЕНЕ'),story:T('Dracula crawls head-first down the outer wall. His cape falls upward into the storm.','Drácula baja de cabeza por el muro exterior. Su capa cae hacia arriba en la tormenta.','Dracula kriecht kopfüber die Außenwand hinab. Sein Umhang fällt nach oben in den Sturm.','Dracula rampe tête première le long du mur extérieur. Sa cape tombe vers le haut dans la tempête.','Dracula scende a testa in giù lungo il muro esterno. Il suo mantello cade verso l\'alto nella tempesta.','Drácula desce de cabeça para baixo pela parede exterior. A sua capa cai para cima, em direção à tempestade.','Drakula schodzi głową w dół po zewnętrznym murze. Jego peleryna unosi się w górę, ku burzy.','德古拉头朝下,沿着外墙向下爬行。他的斗篷竟朝上飘入风暴之中。','ドラキュラが頭を下にして外壁を這い下りる。マントは嵐の中で上向きに翻る。','Drakula, dış duvardan baş aşağı sürünerek iner. Pelerini fırtınaya doğru yukarı savrulur.','يزحف دراكولا رأساً على عقب أسفل الجدار الخارجي. تسقط عباءته إلى الأعلى في العاصفة.','Дракула ползёт головой вниз по внешней стене. Его плащ падает вверх, в бурю.'),clue:T('Jonathan saw Dracula on the wall. Put Dracula first, but keep the focus on what Jonathan observed.','Jonathan vio a Drácula en la pared. Pon a Drácula primero, pero mantén el foco en lo observado.','Jonathan sah Dracula an der Wand. Stelle Dracula an den Anfang, aber konzentriere dich auf die Beobachtung.','Jonathan a vu Dracula sur le mur. Mets Dracula en premier, mais garde le foyer sur ce que Jonathan a observé.','Jonathan ha visto Dracula sul muro. Metti Dracula per primo, ma mantieni il focus su ciò che Jonathan ha osservato.','Jonathan viu Drácula na parede. Ponha Drácula primeiro, mas mantenha o foco no que foi observado.','Jonathan zobaczył Drakulę na murze. Postaw Drakulę na pierwszym miejscu, ale zachowaj skupienie na tym, co zaobserwował Jonathan.','乔纳森看见了墙上的德古拉。请把德古拉放在前面,但焦点仍在乔纳森所见之事。','ジョナサンは壁の上のドラキュラを見た。ドラキュラを先に置きつつ、ジョナサンが観察した内容に焦点を当てよ。','Jonathan, Drakula\'yı duvarda gördü. Önce Drakula\'yı söyle, ama odağı Jonathan\'ın gördüğünde tut.','رأى جوناثان دراكولا على الجدار. ضع دراكولا أولاً، لكن حافظ على التركيز على ما شاهده جوناثان.','Джонатан увидел Дракулу на стене. Поставь Дракулу первым, но сохрани фокус на увиденном.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.','Choisis le PASSIF PASSÉ correct.','Scegli PASSIVA DEL PASSATO corretta.','Escolha a PASSIVA DO PASSADO correta.','Wybierz poprawną STRONĘ BIERNĄ CZASU PRZESZŁEGO.','选出正确的过去时被动句。','正しい過去の受動態を選べ。','Doğru GEÇMİŞ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في الماضي الصحيح.','Выбери верный ПАССИВ ПРОШЕДШЕГО.'),opts:[T('Dracula seen crawling by Jonathan.','Drácula visto bajando por Jonathan.','Dracula gesehen kriechend von Jonathan.','Dracula vu ramper par Jonathan.','Dracula visto scendere da Jonathan.','Drácula visto a descer por Jonathan.','Drakula widziany schodzący przez Jonathana.','德古拉看见被乔纳森爬行。','ドラキュラはジョナサンによって這うのを見られる。','Jonathan tarafından Drakula duvarda sürünerek gördü.','دراكولا رأى يزحف من قِبل جوناثان.','Дракула видел ползущим Джонатаном.'),T('Dracula is saw crawling by Jonathan.','Drácula es vio bajando por Jonathan.','Dracula wird von Jonathan sah kriechend.','Dracula est vit ramper par Jonathan.','Dracula è vide scendere da Jonathan.','Drácula é viu a descer por Jonathan.','Drakula jest widział schodzącego przez Jonathana.','德古拉是看见被乔纳森爬行着。','ドラキュラはジョナサンが這うのを見た。','Drakula duvarda sürünerek Jonathan tarafından görür.','دراكولا يُرى يزحف من قِبل جوناثان.','Дракула есть видел ползущим Джонатаном.'),T('Dracula was seen crawling down the wall.','Drácula fue visto bajando por el muro.','Dracula wurde gesehen, wie er die Wand hinabkroch.','Dracula a été vu ramper le long du mur.','Dracula fu visto scendere lungo il muro.','Drácula foi visto a descer pela parede.','Drakula został widziany, jak schodzi po murze.','德古拉被看见正沿墙爬下。','ドラキュラは壁を這い下りるところを見られた。','Drakula, duvardan sürünerek inerken görüldü.','رُئي دراكولا يزحف أسفل الجدار.','Дракула был замечен ползущим по стене.')],answer:2,fb:T('Was seen is the past passive; crawling describes the action observed.','Fue visto es la pasiva del pasado; bajando describe la acción observada.','Wurde gesehen ist das Passiv der Vergangenheit; kriechend beschreibt die beobachtete Handlung.','A été vu est le passif passé ; ramper décrit l\'action observée.','Fu visto è la passiva del passato; scendere descrive l\'azione osservata.','Foi visto é a passiva do passado; a descer descreve a ação observada.','Został widziany to strona bierna czasu przeszłego; schodzący opisuje zaobserwowaną czynność.','was seen 是过去时被动;crawling 描述被观察到的动作。','was seen(見られた)が過去の受動態;crawling(這っている)は観察された動作を表す。','Was seen (görüldü), geçmiş zaman pasifidir; sürünerek, gözlemlenen eylemi anlatır.','"رُئي" هو المبني للمجهول في الماضي؛ و"يزحف" يصف الفعل الذي شوهد.','Was seen — это пассив прошедшего; crawling описывает увиденное действие.'),next:'vampire_brides'},
vampire_brides:{img:'19_vampire_brides',pos:'left',kind:'question',q:12,k:T('ROUTE · THE FORBIDDEN ROOM','RUTA · LA HABITACIÓN PROHIBIDA','ROUTE · DAS VERBOTENE ZIMMER','ROUTE · LA CHAMBRE INTERDITE','VIA · LA STANZA PROIBITA','ROTA · O QUARTO PROIBIDO','TRASA · ZAKAZANY POKÓJ','路线 · 禁室','ルート · 禁じられた部屋','ROTA · YASAK ODA','المسار · الغرفة المحرّمة','ПУТЬ · ЗАПРЕТНАЯ КОМНАТА'),title:T('THE THREE BRIDES','LAS TRES NOVIAS','DIE DREI BRÄUTE','LES TROIS ÉPOUSES','LE TRE SPOSE','AS TRÊS NOIVAS','TRZY NARZECZONE','三位新娘','三人の花嫁','ÜÇ GELİN','العرائس الثلاث','ТРИ НЕВЕСТЫ'),story:T('Three vampire brides lean over Jonathan. Dracula arrives and drives them back one heartbeat before they bite.','Tres novias vampiras se inclinan sobre Jonathan. Drácula llega y las aparta un instante antes de que muerdan.','Drei Vampirbräute beugen sich über Jonathan. Dracula kommt und treibt sie einen Herzschlag vor dem Biss zurück.','Trois épouses vampires se penchent sur Jonathan. Dracula arrive et les repousse un battement de cœur avant qu\'elles ne mordent.','Tre spose vampiro si chinano su Jonathan. Dracula arriva e le respinge un istante prima che mordano.','Três noivas vampiras inclinam-se sobre Jonathan. Drácula chega e afasta-as um instante antes de morderem.','Trzy wampirze narzeczone pochylają się nad Jonathanem. Drakula przybywa i odpędza je jedno uderzenie serca przed ukąszeniem.','三位吸血鬼新娘俯身靠近乔纳森。就在她们咬下的前一刻,德古拉赶到,将她们逼退。','三人の吸血鬼の花嫁がジョナサンに身を乗り出す。噛みつく寸前、ドラキュラが現れて彼女たちを追い払う。','Üç vampir gelin, Jonathan\'ın üzerine eğilir. Drakula tam ısıracakları an gelir ve onları geri püskürtür.','تنحني ثلاث عرائس مصاصات دماء فوق جوناثان. يصل دراكولا ويبعدهن قبل لحظة واحدة من العض.','Три невесты-вампирши склоняются над Джонатаном. Дракула появляется и отгоняет их за миг до укуса.'),clue:T('Dracula arrived in time. Imagine that he arrived later.','Drácula llegó a tiempo. Imagina que hubiera llegado más tarde.','Dracula kam rechtzeitig. Stell dir vor, er wäre später gekommen.','Dracula est arrivé à temps. Imagine qu\'il soit arrivé plus tard.','Dracula arrivò in tempo. Immagina che fosse arrivato più tardi.','Drácula chegou a tempo. Imagine que tinha chegado mais tarde.','Drakula przybył na czas. Wyobraź sobie, że przybyłby później.','德古拉及时赶到了。设想他来得更晚。','ドラキュラは間に合った。彼がもっと遅く着いたと想像せよ。','Drakula zamanında geldi. Daha geç geldiğini hayal et.','وصل دراكولا في الوقت المناسب. تخيّل أنه وصل متأخراً.','Дракула прибыл вовремя. Представь, что он прибыл позже.'),prompt:T('Choose the THIRD CONDITIONAL.','Elige el TERCER CONDICIONAL.','Wähle den DRITTEN KONDITIONALSATZ.','Choisis le TROISIÈME CONDITIONNEL.','Scegli il TERZO CONDIZIONALE.','Escolha o TERCEIRO CONDICIONAL.','Wybierz TRZECI OKRES WARUNKOWY.','选出第三条件句。','第三条件文を選べ。','ÜÇÜNCÜ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثالث.','Выбери ТРЕТИЙ УСЛОВНЫЙ.'),opts:[T('If Dracula had arrived later, the brides would have bitten Jonathan.','Si Drácula hubiera llegado más tarde, las novias habrían mordido a Jonathan.','Wenn Dracula später gekommen wäre, hätten die Bräute Jonathan gebissen.','Si Dracula était arrivé plus tard, les épouses auraient mordu Jonathan.','Se Dracula fosse arrivato più tardi, le spose avrebbero morso Jonathan.','Se Drácula tivesse chegado mais tarde, as noivas teriam mordido Jonathan.','Gdyby Drakula przybył później, narzeczone ukąsiłyby Jonathana.','如果德古拉来得更晚,新娘们本会咬伤乔纳森。','もしドラキュラがもっと遅く着いていたら、花嫁たちはジョナサンを噛んでいただろう。','Drakula daha geç gelmiş olsaydı, gelinler Jonathan\'ı ısırmış olurdu.','لو وصل دراكولا متأخراً، لكانت العرائس قد عضّت جوناثان.','Если бы Дракула прибыл позже, невесты укусили бы Джонатана.'),T('If Dracula arrived later, the brides will bite Jonathan.','Si Drácula llegó más tarde, las novias morderán a Jonathan.','Wenn Dracula später kam, werden die Bräute Jonathan beißen.','Si Dracula arrivait plus tard, les épouses mordront Jonathan.','Se Dracula arrivò più tardi, le spose morderanno Jonathan.','Se Drácula chegou mais tarde, as noivas vão morder Jonathan.','Jeśli Drakula przybył później, narzeczone ukąszą Jonathana.','如果德古拉来得更晚,新娘们将会咬乔纳森。','もしドラキュラがもっと遅く着いたら、花嫁たちはジョナサンを噛むだろう。','Drakula daha geç gelseydi, gelinler Jonathan\'ı ısıracak.','إن وصل دراكولا متأخراً، ستعض العرائس جوناثان.','Если Дракула прибыл позже, невесты укусят Джонатана.'),T('If Dracula had arrive later, the brides would bite yesterday.','Si Drácula hubiera llegar más tarde, las novias morderían ayer.','Wenn Dracula später gekommen, würden die Bräute gestern beißen.','Si Dracula avait arriver plus tard, les épouses mordraient hier.','Se Dracula fosse arrivare più tardi, le spose morderebbero ieri.','Se Drácula tivesse chegar mais tarde, as noivas morderiam ontem.','Gdyby Drakula przybyć później, narzeczone ukąsiłyby wczoraj.','如果德古拉当初来得更晚,新娘们昨天就会咬人。','もしドラキュラが遅く着いていたら、花嫁たちは昨日噛むだろう。','Drakula daha geç gel olsaydı, gelinler dün ısırırdı.','لو دراكولا يصل متأخراً، لعضّت العرائس أمس.','Если бы Дракула прибыть позже, невесты кусали бы вчера.')],answer:0,fb:T('Third conditional imagines a different past: if + had + participle, then would have + participle.','El tercer condicional imagina un pasado diferente: si + hubiera + participio, después habría + participio.','Der dritte Konditionalsatz stellt eine andere Vergangenheit vor: wenn + Plusquamperfekt, dann hätte/wäre + Partizip.','Le troisième conditionnel imagine un passé différent : si + plus-que-parfait, puis conditionnel passé.','Il terzo condizionale immagina un passato diverso: se + trapassato, poi avrebbe + participio.','O terceiro condicional imagina um passado diferente: se + tivesse + particípio, depois teria + particípio.','Trzeci okres warunkowy wyobraża inną przeszłość: jeśli + zaprzeszły, potem would have + III forma czasownika.','第三条件句设想不同的过去:if + had + 过去分词,然后 would have + 过去分词。','第三条件文は異なる過去を想像する:if+had+過去分詞、その後would have+過去分詞。','Üçüncü şart cümlesi farklı bir geçmişi hayal eder: eğer + had + ortaç, ardından would have + ortaç.','الشرط الثالث يتخيل ماضياً مختلفاً: إن + كان قد + التصريف الثالث، ثم لـ + كان قد + التصريف الثالث.','Третий условный описывает иное прошлое: если + had + 3-я форма, потом would have + 3-я форма.'),evidence:1,next:'shipping_plan'},
shipping_plan:{img:'32_shipping_plan',pos:'left',kind:'story',k:T('BELOW THE WEST ROOMS · HIDDEN RECORDS','BAJO LAS HABITACIONES DEL OESTE · ARCHIVOS OCULTOS','UNTER DEN WESTZIMMERN · VERBORGENE AKTEN','SOUS LES CHAMBRES OUEST · ARCHIVES CACHÉES','SOTTO LE STANZE OVEST · ARCHIVI NASCOSTI','SOB OS QUARTOS DO OESTE · REGISTOS OCULTOS','POD ZACHODNIMI KOMNATAMI · UKRYTE ARCHIWA','西厢之下 · 隐秘档案','西の部屋の下 · 隠された記録','BATI ODALARININ ALTINDA · GİZLİ KAYITLAR','أسفل الغرف الغربية · سجلات خفية','ПОД ЗАПАДНЫМИ КОМНАТАМИ · СКРЫТЫЕ АРХИВЫ'),title:T('ENGLAND IS THE DESTINATION','INGLATERRA ES EL DESTINO','ENGLAND IST DAS ZIEL','L\'ANGLETERRE EST LA DESTINATION','L\'INGHILTERRA È LA DESTINAZIONE','A INGLATERRA É O DESTINO','ANGLIA JEST CELEM','目的地是英格兰','目的地はイングランド','HEDEF İNGİLTERE','إنجلترا هي الوجهة','АНГЛИЯ — ЦЕЛЬ ПУТИ'),story:T('Beyond the west rooms, Jonathan finds a servant stair and a records chamber. A shipping ledger, English property deeds and cargo tags lie beside a model of a black ship. Through an archway, workers carry heavy boxes into the cellar.','Más allá de las habitaciones del oeste, Jonathan encuentra una escalera de servicio y una sala de archivos. Un registro de envíos, escrituras de una propiedad inglesa y etiquetas de carga están junto a la maqueta de un barco negro. Por un arco, unos trabajadores llevan pesadas cajas al sótano.','Hinter den Westzimmern entdeckt Jonathan eine Dienstbotentreppe und eine geheime Aktenkammer. Neben dem Modell eines schwarzen Schiffes liegen ein Frachtbuch, englische Grundstücksurkunden und Anhänger für Ladung. Durch einen Torbogen tragen Arbeiter schwere Kisten in den Keller.','Au-delà des chambres ouest, Jonathan trouve un escalier de service et une salle d\'archives. Un registre d\'expédition, des actes de propriété anglais et des étiquettes de cargaison sont près d\'une maquette de navire noir. Sous une arche, des ouvriers portent des caisses lourdes vers la cave.','Oltre le stanze ovest, Jonathan trova una scala di servizio e una sala d\'archivio. Un registro di spedizioni, atti di proprietà inglesi ed etichette di carico giacciono accanto al modellino di una nave nera. Attraverso un arco, dei lavoratori portano pesanti casse in cantina.','Para além dos quartos do oeste, Jonathan encontra uma escada de serviço e uma sala de arquivos. Um livro de registo de cargas, escrituras de uma propriedade inglesa e etiquetas de carga estão junto à maquete de um navio negro. Através de um arco, trabalhadores levam caixas pesadas para a cave.','Za zachodnimi komnatami Jonathan znajduje schody dla służby i komnatę archiwów. Rejestr przewozów, angielskie akty własności i etykiety ładunku leżą obok modelu czarnego statku. Przez łuk sklepienia robotnicy wnoszą ciężkie skrzynie do piwnicy.','穿过西厢房,乔纳森发现了一条仆役楼梯和一间档案室。航运账簿、英格兰房产契据和货运标签,摆放在一艘黑色船只的模型旁。透过拱门,可见工人正把沉重的木箱搬入地窖。','西の部屋の先で、ジョナサンは使用人用の階段と記録室を見つける。積荷台帳、イングランドの不動産権利書、荷札が黒い船の模型のそばに置かれている。アーチの向こうでは、労働者たちが重い箱を地下室へ運んでいる。','Batı odalarının ötesinde Jonathan, bir hizmetçi merdiveni ve bir kayıt odası bulur. Bir sevkiyat defteri, İngiliz mülk senetleri ve kargo etiketleri, siyah bir geminin maketinin yanında durur. Bir kemerin ardında işçiler ağır kutuları mahzene taşır.','خلف الغرف الغربية، يجد جوناثان درج خدم وغرفة سجلات. يوجد سجل شحن وصكوك ملكية إنجليزية وبطاقات بضائع بجانب نموذج لسفينة سوداء. عبر قوس، يحمل عمال صناديق ثقيلة إلى القبو.','За западными комнатами Джонатан находит лестницу для слуг и архивную комнату. Судовой журнал, документы на английскую недвижимость и грузовые бирки лежат рядом с моделью чёрного корабля. Через арку рабочие носят тяжёлые ящики в подвал.'),note:T('Now the pieces connect: the forced letters will hide Jonathan’s disappearance, the English estate will shelter Dracula, and the boxes will carry his native earth west.','Ahora las piezas encajan: las cartas forzadas ocultarán la desaparición de Jonathan, la propiedad inglesa dará refugio a Drácula y las cajas llevarán su tierra natal hacia el oeste.','Jetzt passt alles zusammen: Die erzwungenen Briefe werden Jonathans Verschwinden verbergen, das englische Anwesen wird Dracula schützen und die Kisten werden seine Heimaterde nach Westen bringen.','Maintenant les pièces s\'assemblent : les lettres forcées cacheront la disparition de Jonathan, la propriété anglaise abritera Dracula, et les caisses transporteront sa terre natale vers l\'ouest.','Ora i pezzi combaciano: le lettere forzate nasconderanno la scomparsa di Jonathan, la tenuta inglese darà rifugio a Dracula, e le casse porteranno la sua terra natale verso ovest.','Agora as peças encaixam: as cartas forçadas vão esconder o desaparecimento de Jonathan, a propriedade inglesa vai abrigar Drácula, e as caixas vão levar a sua terra natal para o oeste.','Teraz wszystko się układa: wymuszone listy ukryją zniknięcie Jonathana, angielska posiadłość da schronienie Drakuli, a skrzynie zawiozą jego rodzimą ziemię na zachód.','此刻线索终于连成一线:被迫写下的信件将掩盖乔纳森的失踪,英格兰的庄园将庇护德古拉,而那些木箱将载着他的故土泥土西行。','ここでつながりが見えてくる:強要された手紙はジョナサンの失踪を隠し、イングランドの屋敷はドラキュラを匿い、箱は彼の故郷の土を西へ運ぶ。','Artık parçalar birleşiyor: zorla yazdırılan mektuplar Jonathan\'ın kayboluşunu gizleyecek, İngiliz malikânesi Drakula\'ya sığınak olacak ve kutular onun ana toprağını batıya taşıyacak.','الآن تترابط القطع: الرسائل المُجبرة ستُخفي اختفاء جوناثان، والعقار الإنجليزي سيؤوي دراكولا، والصناديق ستحمل ترابه الأصلي غرباً.','Теперь всё складывается: вынужденные письма скроют исчезновение Джонатана, английское поместье укроет Дракулу, а ящики понесут его родную землю на запад.'),next:'earth_boxes'},
earth_boxes:{img:'20_earth_boxes',pos:'left',kind:'question',q:13,k:T('CASTLE CELLAR · FIFTY BOXES','SÓTANO DEL CASTILLO · CINCUENTA CAJAS','SCHLOSSKELLER · FÜNFZIG KISTEN','CAVE DU CHÂTEAU · 50 CAISSES','CANTINA CASTELLO · 50 CASSE','CAVE DO CASTELO · CINQUENTA CAIXAS','PIWNICA ZAMKOWA · PIĘĆDZIESIĄT SKRZYŃ','城堡地窖 · 五十只木箱','城の地下室 · 五十の箱','ŞATO MAHZENİ · ELLİ KUTU','قبو القلعة · خمسون صندوقاً','ПОДВАЛ ЗАМКА · ПЯТЬДЕСЯТ ЯЩИКОВ'),title:T('EARTH FOR A NEW COUNTRY','ERDE PARA UN PAÍS NUEVO','ERDE FÜR EIN NEUES LAND','TERRE POUR UN NOUVEAU PAYS','TERRA PER UN PAESE NUOVO','TERRA PARA UM NOVO PAÍS','ZIEMIA DLA NOWEGO KRAJU','带往新国度的泥土','新天地のための土','YENİ BİR ÜLKE İÇİN TOPRAK','تراب لبلد جديد','ЗЕМЛЯ ДЛЯ НОВОЙ СТРАНЫ'),story:T('The cellar is packed with boxes of Transylvanian earth. Dracula lies awake inside one of them.','El sótano está lleno de cajas con tierra de Transilvania. Drácula yace despierto dentro de una.','Der Keller ist voller Kisten mit transsilvanischer Erde. Dracula liegt wach in einer von ihnen.','La cave est remplie de caisses de terre transylvanienne. Dracula gît éveillé dans l\'une d\'elles.','La cantina è piena di casse di terra della Transilvania. Dracula giace sveglio dentro una di esse.','A cave está cheia de caixas com terra da Transilvânia. Drácula jaz acordado dentro de uma delas.','Piwnica jest zapełniona skrzyniami z transylwańską ziemią. Drakula leży rozbudzony w jednej z nich.','地窖里堆满了装着特兰西瓦尼亚泥土的木箱。德古拉正醒着,躺在其中一只箱子里。','地下室はトランシルヴァニアの土を詰めた箱でいっぱいだ。ドラキュラはその一つの中で目を覚ましたまま横たわっている。','Mahzen, Transilvanya toprağıyla dolu kutularla tıka basa doludur. Drakula bunlardan birinin içinde uyanık yatar.','القبو مكتظ بصناديق من تراب ترانسيلفانيا. يرقد دراكولا مستيقظاً داخل أحدها.','Подвал заполнен ящиками с трансильванской землёй. Дракула лежит без сна внутри одного из них.'),clue:T('Workers filled the boxes. The result is visible now.','Los trabajadores llenaron las cajas. El resultado es visible ahora.','Arbeiter füllten die Kisten. Das Ergebnis ist jetzt sichtbar.','Les ouvriers ont rempli les caisses. Visible maintenant.','I lavoratori hanno riempito le casse. Il risultato è visibile.','Os trabalhadores encheram as caixas. O resultado é visível agora.','Robotnicy napełnili skrzynie. Rezultat jest widoczny teraz.','工人们装满了这些木箱。结果如今清晰可见。','労働者たちが箱に土を詰めた。その結果は今見えている。','İşçiler kutuları doldurdu. Sonuç şimdi görünür.','ملأ العمال الصناديق. النتيجة مرئية الآن.','Рабочие заполнили ящики. Результат виден сейчас.'),prompt:T('Choose the PRESENT PERFECT PASSIVE.','Elige la PASIVA DEL PRETÉRITO PERFECTO.','Wähle das PERFEKT-PASSIV.','Choisis le PASSIF AU PASSÉ COMPOSÉ.','Scegli la PASSIVA DEL PRESENTE PERFETTO.','Escolha a PASSIVA DO PRETÉRITO PERFEITO.','Wybierz STRONĘ BIERNĄ w czasie PRESENT PERFECT.','选出现在完成时的被动句。','現在完了の受動態を選べ。','YAKIN GEÇMİŞ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في المضارع التام.','Выбери ПЕРФЕКТНЫЙ ПАССИВ.'),opts:[T('Fifty boxes have filled with earth.','Cincuenta cajas han llenado con tierra.','Fünfzig Kisten haben mit Erde gefüllt.','50 caisses ont rempli de terre.','Cinquanta casse hanno riempito di terra.','Cinquenta caixas têm enchido com terra.','Pięćdziesiąt skrzyń napełniło ziemią.','五十只木箱已经装满泥土。','五十の箱は土で満たしてきた。','Elli kutu toprak doldurmuş.','خمسون صندوقاً قد ملأت بالتراب.','Пятьдесят ящиков наполнили землёй.'),T('Fifty boxes have been filled with earth.','Cincuenta cajas han sido llenadas con tierra.','Fünfzig Kisten sind mit Erde gefüllt worden.','50 caisses ont été remplies de terre.','Cinquanta casse sono state riempite di terra.','Cinquenta caixas têm sido enchidas com terra.','Pięćdziesiąt skrzyń zostało napełnionych ziemią.','五十只木箱已经被装满了泥土。','五十の箱は土で満たされてきた。','Elli kutu toprakla doldurulmuş.','خمسون صندوقاً قد مُلئت بالتراب.','Пятьдесят ящиков были наполнены землёй.'),T('Fifty boxes were been filling with earth.','Cincuenta cajas fueron sido llenando con tierra.','Fünfzig Kisten wurden mit Erde füllend gewesen.','50 caisses étaient été remplissant de terre.','Cinquanta casse furono state riempiendo di terra.','Cinquenta caixas foram sido a encher com terra.','Pięćdziesiąt skrzyń były zostały napełniające ziemią.','五十只木箱曾经被正在装泥土。','五十の箱は土で満たされていた。','Elli kutu toprakla doluyor olmuştu.','خمسون صندوقاً كانت قد كان يُملأ بالتراب.','Пятьдесят ящиков были быть наполняющими землёй.')],answer:1,fb:T('Present perfect passive: have/has + been + past participle.','Pasiva del pretérito perfecto: ha/han + sido + participio.','Perfekt-Passiv: ist/sind + Partizip II + worden.','Passif au passé composé : a/ont été + participe passé.','Passiva del presente perfetto: sono state + participio.','Passiva do pretérito perfeito: tem/têm + sido + particípio.','Strona bierna Present Perfect: have/has + been + III forma czasownika.','现在完成时被动:have/has + been + 过去分词。','現在完了の受動態:have/has+been+過去分詞。','Yakın geçmiş zaman pasifi: have/has + been + geçmiş zaman ortacı.','المبني للمجهول في المضارع التام: قد كان/كانت + التصريف الثالث.','Пассив перфекта: have/has + been + 3-я форма глагола.'),next:'stolen_clothes'},
stolen_clothes:{img:'33_stolen_clothes',pos:'left',kind:'story',k:T('JONATHAN’S ROOM · SOMETHING IS MISSING','HABITACIÓN DE JONATHAN · FALTA ALGO','JONATHANS ZIMMER · ETWAS FEHLT','CHAMBRE DE JONATHAN · QUELQUE CHOSE MANQUE','LA STANZA DI JONATHAN · MANCA QUALCOSA','QUARTO DE JONATHAN · FALTA ALGO','POKÓJ JONATHANA · CZEGOŚ BRAKUJE','乔纳森的房间 · 少了些什么','ジョナサンの部屋 · 何かが消えている','JONATHAN\'IN ODASI · BİR ŞEY EKSİK','غرفة جوناثان · شيء مفقود','КОМНАТА ДЖОНАТАНА · ЧТО-ТО ПРОПАЛО'),title:T('THE COUNT STOLE HIS CLOTHES','EL CONDE ROBÓ SU ROPA','DER GRAF STAHL SEINE KLEIDER','LE COMTE A VOLÉ SES VÊTEMENTS','IL CONTE RUBÒ I SUOI VESTITI','O CONDE ROUBOU-LHE A ROUPA','HRABIA UKRADŁ JEGO UBRANIA','伯爵偷走了他的衣服','伯爵は彼の服を盗んだ','KONT ONUN KIYAFETLERİNİ ÇALDI','الكونت سرق ثيابه','ГРАФ УКРАЛ ЕГО ОДЕЖДУ'),story:T('Jonathan returns to his room. His travelling coat and hat are gone. A blood-smeared cuff hangs inside the empty wardrobe. Dracula has worn Jonathan’s clothes beyond the castle so that any witness will blame the English prisoner for his attacks.','Jonathan vuelve a su habitación. Su abrigo de viaje y su sombrero han desaparecido. Un puño manchado de sangre cuelga dentro del armario vacío. Drácula ha usado la ropa de Jonathan fuera del castillo para que cualquier testigo culpe al prisionero inglés de sus ataques.','Jonathan kehrt in sein Zimmer zurück. Reisemantel und Hut sind verschwunden. In dem leeren Schrank hängt eine blutbefleckte Manschette. Dracula hat Jonathans Kleider außerhalb des Schlosses getragen, damit jeder Zeuge den englischen Gefangenen für seine Angriffe verantwortlich macht.','Jonathan retourne dans sa chambre. Son manteau de voyage et son chapeau ont disparu. Un poignet taché de sang pend dans l\'armoire vide. Dracula a porté les vêtements de Jonathan hors du château afin que tout témoin accuse le prisonnier anglais de ses attaques.','Jonathan torna nella sua stanza. Il suo cappotto da viaggio e il cappello sono spariti. Un polsino macchiato di sangue pende dentro l\'armadio vuoto. Dracula ha indossato i vestiti di Jonathan fuori dal castello, così che ogni testimone incolperà il prigioniero inglese dei suoi attacchi.','Jonathan volta ao seu quarto. O seu casaco de viagem e o chapéu desapareceram. Um punho manchado de sangue pende dentro do guarda-roupa vazio. Drácula usou a roupa de Jonathan fora do castelo para que qualquer testemunha culpe o prisioneiro inglês pelos seus ataques.','Jonathan wraca do swojego pokoju. Jego podróżny płaszcz i kapelusz zniknęły. Zakrwawiony mankiet wisi w pustej szafie. Drakula nosił ubrania Jonathana poza zamkiem, by każdy świadek obwinił angielskiego więźnia o jego ataki.','乔纳森回到房间,旅行大衣和帽子都不见了。空荡的衣柜里挂着一只沾血的袖口。德古拉穿着乔纳森的衣服出没于城堡之外,好让任何目击者都把袭击归咎于这名英国囚徒。','ジョナサンは部屋に戻る。旅行用のコートと帽子が消えている。空の衣装棚の中には、血の付いた袖口がかかっている。ドラキュラは城の外でジョナサンの服を身につけ、目撃者が彼の襲撃をこのイングランド人の囚人のせいにするよう仕向けている。','Jonathan odasına döner. Yolculuk paltosu ve şapkası yok olmuştur. Boş gardırobun içinde kana bulanmış bir manşet asılıdır. Drakula, herhangi bir tanık saldırılarından İngiliz mahkumu suçlasın diye Jonathan\'ın kıyafetlerini şatonun dışında giymiştir.','يعود جوناثان إلى غرفته. اختفى معطف سفره وقبعته. يتدلى كُمّ ملطخ بالدم داخل الخزانة الفارغة. ارتدى دراكولا ثياب جوناثان خارج القلعة حتى يُلقي أي شاهد باللوم على السجين الإنجليزي في هجماته.','Джонатан возвращается в комнату. Его дорожное пальто и шляпа исчезли. Манжета в пятнах крови висит в пустом шкафу. Дракула надевал одежду Джонатана за пределами замка, чтобы любой свидетель обвинил английского пленника в его нападениях.'),note:T('Jonathan is not only imprisoned; his identity is being used as a weapon. He must leave before Dracula completes the deception.','Jonathan no solo está prisionero: su identidad se usa como arma. Debe marcharse antes de que Drácula complete el engaño.','Jonathan ist nicht nur gefangen; seine Identität wird als Waffe benutzt. Er muss fliehen, bevor Dracula die Täuschung vollendet.','Jonathan n\'est pas seulement emprisonné : son identité est utilisée comme une arme. Il doit partir avant que Dracula n\'achève la tromperie.','Jonathan non è solo prigioniero: la sua identità viene usata come arma. Deve partire prima che Dracula completi l\'inganno.','Jonathan não está apenas preso: a sua identidade está a ser usada como arma. Tem de partir antes que Drácula complete o engano.','Jonathan nie jest tylko więźniem; jego tożsamość jest wykorzystywana jako broń. Musi uciec, zanim Drakula dokończy oszustwo.','乔纳森不仅被囚禁,他的身份正被当作武器利用。他必须在德古拉完成这场骗局之前离开。','ジョナサンは幽閉されているだけではない。彼の身元が武器として使われているのだ。ドラキュラが欺瞞を完成させる前に、彼は逃げなければならない。','Jonathan yalnızca hapsedilmiş değil; kimliği de bir silah olarak kullanılıyor. Drakula aldatmacayı tamamlamadan önce buradan gitmelidir.','لم يعد جوناثان سجيناً فحسب؛ بل تُستخدم هويته كسلاح. عليه أن يرحل قبل أن يُكمل دراكولا خداعه.','Джонатан не просто пленник: его личность используют как оружие. Он должен уйти, пока Дракула не завершил обман.'),next:'last_chance'},
last_chance:{img:'34_last_chance',pos:'left',kind:'story',k:T('PRE-DAWN · THE FINAL WAGON','ANTES DEL AMANECER · EL ÚLTIMO CARRO','VOR TAGESANBRUCH · DER LETZTE WAGEN','AVANT L\'AUBE · DERNIER CHARIOT','PRE-ALBA · L\'ULTIMO CARRO','MADRUGADA · O ÚLTIMO CARRO','PRZED ŚWITEM · OSTATNI WÓZ','黎明之前 · 最后一辆货车','夜明け前 · 最後の荷馬車','ŞAFAKTAN ÖNCE · SON KAĞNI','قبيل الفجر · العربة الأخيرة','ДО РАССВЕТА · ПОСЛЕДНЯЯ ПОВОЗКА'),title:T('ONLY THE WINDOW REMAINS','SOLO QUEDA LA VENTANA','NUR DAS FENSTER BLEIBT','SEULE LA FENÊTRE RESTE','RESTA SOLO LA FINESTRA','SÓ RESTA A JANELA','ZOSTAJE TYLKO OKNO','只剩一扇窗','残るは窓だけ','YALNIZCA PENCERE KALIYOR','لم يبقَ سوى النافذة','ОСТАЁТСЯ ТОЛЬКО ОКНО'),story:T('Jonathan hears the door bolt slide from the outside. Through the narrow window, workers load the final earth boxes onto black wagons. The last convoy is leaving—and his bedroom door will never open in time.','Jonathan oye cómo corren el cerrojo desde fuera. Por la estrecha ventana ve a los trabajadores cargar las últimas cajas de tierra en carros negros. El último convoy se marcha y la puerta de su habitación no se abrirá a tiempo.','Jonathan hört, wie der Riegel draußen vorgeschoben wird. Durch das schmale Fenster sieht er, wie Arbeiter die letzten Erdkisten auf schwarze Wagen laden. Der letzte Konvoi fährt ab – und seine Zimmertür wird sich nicht rechtzeitig öffnen.','Jonathan entend le verrou de la porte glisser de l\'extérieur. Par l\'étroite fenêtre, des ouvriers chargent les dernières caisses de terre sur des chariots. Le dernier convoi s\'en va — et la porte de sa chambre ne s\'ouvrira jamais à temps.','Jonathan sente il chiavistello della porta scorrere dall\'esterno. Dalla stretta finestra, vede i lavoratori caricare le ultime casse di terra su carri neri. L\'ultimo convoglio sta partendo, e la porta della sua camera non si aprirà in tempo.','Jonathan ouve o ferrolho da porta a correr do lado de fora. Pela janela estreita, os trabalhadores carregam as últimas caixas de terra em carros negros. O último comboio está a partir — e a porta do seu quarto nunca vai abrir a tempo.','Jonathan słyszy, jak zasuwa się rygiel drzwi od zewnątrz. Przez wąskie okno widzi robotników ładujących ostatnie skrzynie ziemi na czarne wozy. Ostatni konwój odjeżdża — a drzwi jego sypialni nie otworzą się na czas.','乔纳森听见门闩从外面滑上的声音。透过狭窄的窗户,他看见工人正把最后几只泥土木箱装上黑色货车。最后一支车队即将离开——而他卧室的门,永远不会及时打开。','ジョナサンは外側で扉のかんぬきが滑る音を聞く。狭い窓越しに、労働者たちが最後の土の箱を黒い荷馬車に積み込んでいるのが見える。最後の隊列が出発しようとしている——そして寝室の扉は決して間に合って開かないだろう。','Jonathan, kapı sürgüsünün dışarıdan kaydığını duyar. Dar pencereden işçilerin son toprak kutularını siyah kağnılara yüklediğini görür. Son kervan ayrılıyor—ve yatak odasının kapısı asla zamanında açılmayacak.','يسمع جوناثان مزلاج الباب ينزلق من الخارج. عبر النافذة الضيقة، يرى العمال يحملون صناديق التراب الأخيرة إلى عربات سوداء. القافلة الأخيرة تغادر—ولن يُفتح باب غرفته في الوقت المناسب.','Джонатан слышит, как снаружи задвигают засов двери. Через узкое окно он видит, как рабочие грузят последние ящики земли на чёрные повозки. Последний обоз уходит — а дверь его спальни не откроется вовремя.'),note:T('Then he sees the long white sheets on the bed. The door is useless. The cliff window is not.','Entonces ve las largas sábanas blancas de la cama. La puerta no sirve. La ventana sobre el acantilado, sí.','Dann sieht er die langen weißen Bettlaken. Die Tür ist nutzlos. Das Fenster über der Felswand nicht.','Alors il voit les longs draps blancs sur le lit. La porte est inutile. Pas la fenêtre du précipice.','Poi vede le lunghe lenzuola bianche sul letto. La porta è inutile. La finestra sul dirupo no.','Então ele vê os lençóis brancos e compridos na cama. A porta é inútil. A janela sobre o precipício não é.','Wtedy dostrzega długie białe prześcieradła na łóżku. Drzwi są bezużyteczne. Okno nad urwiskiem — nie.','这时他看见了床上那几条长长的白床单。门已无用,但那扇临崖的窗户还有希望。','そのとき、ベッドの上の長い白いシーツが目に入る。扉は役に立たない。だが崖に面した窓は違う。','Sonra yatağın üzerindeki uzun beyaz çarşafları görür. Kapı işe yaramaz. Uçurumdaki pencere ise yarar.','ثم يرى الملاءات البيضاء الطويلة على السرير. الباب عديم الفائدة. أما النافذة المطلة على الجرف فليست كذلك.','Тогда он замечает длинные белые простыни на кровати. Дверь бесполезна. Окно над обрывом — нет.'),next:'escape_plan'},
escape_plan:{img:'21_escape_plan',pos:'left',kind:'question',q:14,k:T('JONATHAN’S ROOM · THE PLAN','HABITACIÓN DE JONATHAN · EL PLAN','JONATHANS ZIMMER · DER PLAN','CHAMBRE DE JONATHAN · LE PLAN','STANZA DI JONATHAN · IL PIANO','QUARTO DE JONATHAN · O PLANO','POKÓJ JONATHANA · PLAN','乔纳森的房间 · 计划','ジョナサンの部屋 · 計画','JONATHAN\'IN ODASI · PLAN','غرفة جوناثان · الخطة','КОМНАТА ДЖОНАТАНА · ПЛАН'),title:T('A ROPE OF SHEETS','UNA CUERDA DE SÁBANAS','EIN SEIL AUS BETTLAKEN','UNE CORDE DE DRAPS','CORDA DI LENZUOLA','UMA CORDA DE LENÇÓIS','LINA Z PRZEŚCIERADEŁ','床单做的绳索','シーツのロープ','ÇARŞAFLARDAN BİR İP','حبل من الملاءات','ВЕРЁВКА ИЗ ПРОСТЫНЬ'),story:T('Jonathan knots the bed sheets together. Far below, the earth boxes are being moved toward the gate.','Jonathan ata las sábanas. Muy abajo, las cajas de tierra están siendo llevadas hacia la puerta.','Jonathan knotet die Bettlaken zusammen. Tief unten werden die Erdkisten zum Tor gebracht.','Jonathan noue les draps ensemble. Loin en dessous, les caisses de terre sont déplacées vers le portail.','Jonathan annoda insieme le lenzuola. Molto più in basso, le casse di terra vengono portate verso il cancello.','Jonathan ata os lençóis da cama uns aos outros. Muito lá em baixo, as caixas de terra estão a ser levadas para o portão.','Jonathan wiąże ze sobą prześcieradła. Daleko w dole skrzynie z ziemią są przenoszone w stronę bramy.','乔纳森把床单打成结,连成一条绳索。远远的下方,泥土木箱正被搬往大门。','ジョナサンはベッドのシーツを結び合わせる。はるか下では、土の箱が門へと運ばれている。','Jonathan yatak çarşaflarını birbirine bağlar. Çok aşağıda, toprak kutuları kapıya doğru taşınmaktadır.','يعقد جوناثان الملاءات معاً. في الأسفل البعيد، تُنقل صناديق التراب نحو البوابة.','Джонатан связывает простыни узлами. Далеко внизу ящики с землёй перемещают к воротам.'),clue:T('The rope does not exist yet. Imagine that he makes it.','La cuerda todavía no existe. Imagina que la hace.','Das Seil existiert noch nicht. Stell dir vor, er macht es.','La corde n\'existe pas encore. Imagine qu\'il la fasse.','La corda non esiste ancora. Immagina che la faccia.','A corda ainda não existe. Imagine que ele a faz.','Lina jeszcze nie istnieje. Wyobraź sobie, że ją robi.','这条绳索尚未存在。设想他把它做出来。','ロープはまだ存在しない。彼がそれを作ると想像せよ。','İp henüz yok. Onu yaptığını hayal et.','الحبل غير موجود بعد. تخيّل أنه يصنعه.','Верёвки пока не существует. Представь, что он её делает.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.','Choisis le DEUXIÈME CONDITIONNEL.','Scegli il SECONDO CONDIZIONALE.','Escolha o SEGUNDO CONDICIONAL.','Wybierz DRUGI OKRES WARUNKOWY.','选出第二条件句。','第二条件文を選べ。','İKİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثاني.','Выбери ВТОРОЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan ties the sheets, he escaped yesterday.','Si Jonathan ata las sábanas, escapó ayer.','Wenn Jonathan die Laken knotet, entkam er gestern.','Si Jonathan noue les draps, il s\'est échappé hier.','Se Jonathan lega le lenzuola, è scappato ieri.','Se Jonathan atasse os lençóis, escapou ontem.','Jeśli Jonathan zwiąże prześcieradła, uciekł wczoraj.','如果乔纳森把床单系起来,他昨天就逃走了。','もしジョナサンがシーツを結べば、昨日逃げた。','Jonathan çarşafları bağlarsa, dün kaçtı.','إن ربط جوناثان الملاءات، هرب أمس.','Если Джонатан свяжет простыни, он сбежал вчера.'),T('If Jonathan had tied the sheets, he will escape.','Si Jonathan hubiera atado las sábanas, escapará.','Wenn Jonathan die Laken geknotet hätte, wird er entkommen.','S\'il avait noué les draps, il s\'échappera.','Se Jonathan avesse legato le lenzuola, scapperà.','Se Jonathan tivesse atado os lençóis, vai escapar.','Gdyby Jonathan związał prześcieradła, ucieknie.','如果乔纳森当初系好了床单,他将会逃走。','もしジョナサンがシーツを結んでいたら、彼は逃げるだろう。','Jonathan çarşafları bağlamış olsaydı, kaçacak.','لو ربط جوناثان الملاءات، سيهرب.','Если бы Джонатан связал простыни, он сбежит.'),T('If Jonathan tied the sheets together, he could climb down.','Si Jonathan atara las sábanas, podría bajar.','Wenn Jonathan die Laken zusammenknotete, könnte er hinabklettern.','Si Jonathan nouait les draps ensemble, il pourrait descendre.','Se Jonathan legasse insieme le lenzuola, potrebbe scendere.','Se Jonathan atasse os lençóis uns aos outros, poderia descer.','Gdyby Jonathan związał prześcieradła, mógłby zejść w dół.','如果乔纳森把床单系在一起,他就能爬下去。','もしジョナサンがシーツを結び合わせれば、下りられるだろう。','Jonathan çarşafları birbirine bağlasaydı, aşağı inebilirdi.','لو ربط جوناثان الملاءات معاً، لاستطاع النزول.','Если бы Джонатан связал простыни, он мог бы спуститься.')],answer:2,fb:T('This imagines an unreal present plan: if + past, then could + verb.','Esto imagina un plan irreal en el presente: si + pasado, después podría + verbo.','Das ist ein irrealer Plan in der Gegenwart: wenn + Vergangenheitsform, dann könnte + Verb.','Ceci imagine un plan présent irréel : si + passé, puis conditionnel.','Immagina un piano irreale nel presente: se + passato, poi potrebbe + verbo.','Isto imagina um plano irreal no presente: se + passado, depois poderia + verbo.','To wyobraża nierealny plan w teraźniejszości: jeśli + czas przeszły, potem tryb warunkowy (could).','这设想了一个不真实的当下计划:if + 过去时,然后 could + 动词。','これは非現実の現在の計画を想像する:if+過去形、その後could+動詞。','Bu, gerçek dışı bir şimdiki plan hayal eder: eğer + geçmiş zaman, ardından could + fiil.','هذا يتخيل خطة حاضرة غير واقعية: إن + ماضٍ، ثم لـ + فعل.','Это нереальный план в настоящем: если + прошедшее, потом could + глагол.'),next:'choice3'},
choice3:{img:'22_choice3',pos:'center',kind:'choice',k:T('DECISION III · BEFORE DAWN','DECISIÓN III · ANTES DEL AMANECER','ENTSCHEIDUNG III · VOR TAGESANBRUCH','DÉCISION III · AVANT L\'AUBE','DECISIONE III · PRE-ALBA','DECISÃO III · ANTES DO AMANHECER','DECYZJA III · PRZED ŚWITEM','抉择三 · 黎明之前','決断III · 夜明け前','KARAR III · ŞAFAKTAN ÖNCE','القرار الثالث · قبل الفجر','РЕШЕНИЕ III · ПЕРЕД РАССВЕТОМ'),title:T('CRYPT OR COURTYARD?','¿CRIPTA O PATIO?','GRUFT ODER HOF?','CRYPTE OU COUR ?','CRIPTA O CORTILE?','CRIPTA OU PÁTIO?','KRYPTA CZY DZIEDZINIEC?','墓穴还是庭院?','地下墓所か中庭か?','MEZAR ODASI MI, AVLU MU?','السرداب أم الفناء؟','СКЛЕП ИЛИ ДВОР?'),story:T('There is time for one final act. The crypt may hold Dracula’s coffin. The courtyard may hold the last wagon out.','Hay tiempo para un último acto. La cripta puede guardar el ataúd de Drácula. El patio puede ofrecer el último carro de salida.','Es bleibt Zeit für eine letzte Tat. In der Gruft könnte Draculas Sarg liegen. Im Hof könnte der letzte Wagen hinausfahren.','Il reste du temps pour un dernier acte. La crypte peut cacher le cercueil de Dracula. La cour peut offrir le dernier chariot.','C\'è tempo per un ultimo atto. La cripta potrebbe custodire la bara di Dracula. Il cortile potrebbe offrire l\'ultimo carro in uscita.','Há tempo para um último ato. A cripta pode guardar o caixão de Drácula. O pátio pode oferecer o último carro de saída.','Jest czas na jeszcze jeden, ostatni czyn. Krypta może kryć trumnę Drakuli. Dziedziniec może kryć ostatni wóz na zewnątrz.','还有时间做最后一件事。墓穴中或许藏着德古拉的棺木,庭院中或许停着最后一辆能出城的货车。','最後の行動をする時間が残っている。地下墓所にはドラキュラの棺があるかもしれない。中庭には最後の脱出用の荷馬車があるかもしれない。','Son bir eylem için zaman var. Mezar odası, Drakula\'nın tabutunu barındırabilir. Avlu ise dışarı çıkacak son kağnıyı barındırabilir.','هناك وقت لفعل أخير. قد يحوي السرداب تابوت دراكولا. وقد يحمل الفناء العربة الأخيرة للخروج.','Есть время на один последний поступок. В склепе может быть гроб Дракулы. Во дворе может быть последняя повозка наружу.'),routes:[{name:T('DESCEND TO THE CRYPT','BAJAR A LA CRIPTA','IN DIE GRUFT HINABSTEIGEN','DESCENDRE À LA CRYPTE','SCENDI NELLA CRIPTA','DESCER À CRIPTA','ZEJDŹ DO KRYPTY','下到墓穴','地下墓所へ下りる','MEZAR ODASINA İN','انزل إلى السرداب','СПУСТИТЬСЯ В СКЛЕП'),desc:T('Confront the coffin before sunrise.','Enfréntate al ataúd antes del amanecer.','Stelle dich vor Sonnenaufgang dem Sarg.','Affronte le cercueil avant l\'aube.','Affronta la bara prima dell\'alba.','Enfrente o caixão antes do amanhecer.','Stań naprzeciw trumny przed wschodem słońca.','在日出前直面那口棺木。','日の出前に棺と対峙する。','Gün doğmadan önce tabutla yüzleş.','واجه التابوت قبل شروق الشمس.','Встреть гроб до восхода солнца.'),target:'crypt_tomb',route:'crypt'},{name:T('INFILTRATE THE COURTYARD','INFILTRARSE EN EL PATIO','DEN HOF INFILTRIEREN','S\'INFILTRER DANS LA COUR','INFILTRATI NEL CORTILE','INFILTRAR-SE NO PÁTIO','WKRADNIJ SIĘ NA DZIEDZINIEC','潜入庭院','中庭に潜入する','AVLUYA SIZ','تسلل إلى الفناء','ПРОНИКНУТЬ ВО ДВОР'),desc:T('Sabotage the convoy and steal a path out.','Sabotea el convoy y roba una salida.','Sabotiere den Konvoi und stiehl einen Fluchtweg.','Sabote le convoi et vole une voie de sortie.','Sabota il convoglio e ruba una via d\'uscita.','Sabote o comboio e roube uma saída.','Sabotuj konwój i ukradnij drogę ucieczki.','破坏车队,偷得一条出路。','隊列を妨害し、脱出路を奪う。','Kervanı sabote et ve dışarı bir yol çal.','خرّب القافلة واسرق طريق خروج.','Саботируй обоз и укради путь наружу.'),target:'courtyard_carts',route:'courtyard'}]},
crypt_tomb:{img:'23_crypt_tomb',pos:'left',kind:'question',q:15,k:T('ROUTE · THE RUINED CHAPEL','RUTA · LA CAPILLA EN RUINAS','ROUTE · DIE ZERSTÖRTE KAPELLE','ROUTE · LA CHAPELLE EN RUINE','VIA · LA CAPPELLA IN ROVINA','ROTA · A CAPELA EM RUÍNAS','TRASA · ZRUJNOWANA KAPLICA','路线 · 残破礼拜堂','ルート · 廃れた礼拝堂','ROTA · YIKIK ŞAPEL','المسار · الكنيسة المتهدمة','ПУТЬ · РАЗРУШЕННАЯ ЧАСОВНЯ'),title:T('THE COFFIN MUST OPEN','EL ATAÚD DEBE ABRIRSE','DER SARG MUSS GEÖFFNET WERDEN','CERCUEIL DOIT S\'OUVRIR','LA BARA DEVE APRIRSI','O CAIXÃO TEM DE SE ABRIR','TRUMNA MUSI ZOSTAĆ OTWARTA','棺木必须打开','棺は開かねばならない','TABUT AÇILMALI','يجب أن يُفتح التابوت','ГРОБ ДОЛЖЕН ОТКРЫТЬСЯ'),story:T('A stone coffin waits beneath broken saints. Dawn is less than an hour away.','Un ataúd de piedra espera bajo santos rotos. Falta menos de una hora para el amanecer.','Ein Steinsarg wartet unter zerbrochenen Heiligen. Bis zum Morgengrauen bleibt weniger als eine Stunde.','Un cercueil de pierre attend sous des saints brisés. L\'aube est à moins d\'une heure.','Una bara di pietra aspetta sotto santi spezzati. Manca meno di un\'ora all\'alba.','Um caixão de pedra espera sob santos partidos. Falta menos de uma hora para o amanhecer.','Kamienna trumna czeka pod połamanymi posągami świętych. Do świtu zostało mniej niż godzina.','一口石棺静置于残破的圣像之下。距天亮已不足一小时。','石の棺が、壊れた聖人像の下で待っている。夜明けまで一時間もない。','Kırık azizlerin altında taş bir tabut bekler. Şafağa bir saatten az kalmıştır.','ينتظر تابوت حجري تحت قديسين محطمين. يفصل الفجر أقل من ساعة.','Каменный гроб ждёт под разбитыми святыми. До рассвета меньше часа.'),clue:T('Someone must open the coffin. The coffin is more important than the person.','Alguien debe abrir el ataúd. El ataúd es más importante que la persona.','Jemand muss den Sarg öffnen. Der Sarg ist wichtiger als die Person.','Quelqu\'un doit ouvrir le cercueil. Le cercueil est plus important que la personne.','Qualcuno deve aprire la bara. La bara è più importante della persona.','Alguém tem de abrir o caixão. O caixão é mais importante do que a pessoa.','Ktoś musi otworzyć trumnę. Trumna jest ważniejsza niż osoba.','必须有人打开棺木。棺木比这个人更重要。','誰かが棺を開けなければならない。棺はその人物よりも重要だ。','Biri tabutu açmalı. Tabut, kişiden daha önemli.','يجب أن يفتح أحدهم التابوت. التابوت أهم من الشخص.','Кто-то должен открыть гроб. Гроб важнее, чем человек.'),prompt:T('Choose the correct MODAL PASSIVE.','Elige la PASIVA MODAL correcta.','Wähle das richtige MODALPASSIV.','Choisis le PASSIF MODAL correct.','Scegli la PASSIVA MODALE corretta.','Escolha a PASSIVA MODAL correta.','Wybierz poprawną STRONĘ BIERNĄ MODALNĄ.','选出正确的情态动词被动句。','正しい助動詞の受動態を選べ。','Doğru MODAL PASİF\'i seç.','اختر المجهول الصحيح مع الناقص.','Выбери верный МОДАЛЬНЫЙ ПАССИВ.'),opts:[T('The coffin must be opened before dawn.','El ataúd debe ser abierto antes del amanecer.','Der Sarg muss vor Tagesanbruch geöffnet werden.','Le cercueil doit être ouvert avant l\'aube.','La bara deve essere aperta prima dell\'alba.','O caixão deve ser aberto antes do amanhecer.','Trumna musi zostać otwarta przed świtem.','棺木必须在天亮前被打开。','棺は夜明け前に開けられなければならない。','Tabut şafaktan önce açılmalıdır.','يجب أن يُفتح التابوت قبل الفجر.','Гроб должен быть открыт до рассвета.'),T('The coffin must opened before dawn.','El ataúd debe abierto antes del amanecer.','Der Sarg muss vor Tagesanbruch geöffnet.','Le cercueil doit ouvert avant l\'aube.','La bara deve aperta prima dell\'alba.','O caixão deve aberto antes do amanhecer.','Trumna musi otwarta przed świtem.','棺木必须打开了在天亮前。','棺は夜明け前に開けなければならない。','Tabut şafaktan önce açmalı.','التابوت يجب فُتح قبل الفجر.','Гроб должен открытый до рассвета.'),T('The coffin must be open someone.','El ataúd debe ser abre alguien.','Der Sarg muss jemand öffnen sein.','Le cercueil doit être ouvre quelqu\'un.','La bara deve essere apre qualcuno.','O caixão deve ser abre alguém.','Trumna musi być otworzyć ktoś.','棺木必须被打开某人。','棺は誰かによって開くなければならない。','Tabut biri açık olmalı.','يجب أن يكون التابوت مفتوحاً أحد.','Гроб должен быть открыть кто-то.')],answer:0,fb:T('Modal passive: modal + be + past participle.','Pasiva modal: modal + ser + participio.','Modalpassiv: Modalverb + Partizip II + werden.','Passif modal : modal + être + participe passé.','Passiva modale: modale + essere + participio.','Passiva modal: modal + ser + particípio.','Bierna modalna: modal + zostać + III forma.','情态动词被动:情态动词 + be + 过去分词。','助動詞の受動態:助動詞+be+過去分詞。','Modal pasif: modal + be + geçmiş zaman ortacı.','مجهول الناقص: فعل ناقص + يكون + التصريف الثالث.','Модальный пассив: modal + be + 3-я форма глагола.'),next:'stake_decision'},
stake_decision:{img:'24_stake_decision',pos:'left',kind:'question',q:16,k:T('ROUTE · ONE HEARTBEAT','RUTA · UN LATIDO','ROUTE · EIN HERZSCHLAG','ROUTE · BATTEMENT DE CŒUR','VIA · UN BATTITO','ROTA · UM BATIMENTO','TRASA · JEDNO UDERZENIE SERCA','路线 · 一瞬之间','ルート · 一つの鼓動','ROTA · TEK BİR KALP ATIŞI','المسار · نبضة واحدة','ПУТЬ · ОДИН УДАР СЕРДЦА'),title:T('THE BLOW NOT STRUCK','EL GOLPE NO DADO','DER NICHT GEFÜHRTE SCHLAG','LE COUP NON PORTÉ','IL COLPO NON DATO','O GOLPE NÃO DADO','CIOS, KTÓRY NIE PADŁ','未曾落下的一击','振り下ろされなかった一撃','İNDİRİLMEYEN DARBE','الضربة التي لم تُوجَّه','НЕНАНЕСЁННЫЙ УДАР'),story:T('Jonathan raises the hammer, but the first light touches the crypt. Dracula’s eyes open.','Jonathan levanta el martillo, pero la primera luz toca la cripta. Los ojos de Drácula se abren.','Jonathan hebt den Hammer, doch das erste Licht erreicht die Gruft. Draculas Augen öffnen sich.','Jonathan lève le marteau, mais la première lumière touche la crypte. Les yeux de Dracula s\'ouvrent.','Jonathan alza il martello, ma la prima luce tocca la cripta. Gli occhi di Dracula si aprono.','Jonathan ergue o martelo, mas a primeira luz toca a cripta. Os olhos de Drácula abrem-se.','Jonathan unosi młot, lecz pierwsze światło dotyka krypty. Oczy Drakuli się otwierają.','乔纳森举起铁锤,但第一缕晨光已触及墓穴。德古拉睁开了双眼。','ジョナサンは槌を振り上げるが、最初の光が地下墓所に差し込む。ドラキュラの目が開く。','Jonathan çekici kaldırır, ama ilk ışık mezar odasına değer. Drakula\'nın gözleri açılır.','يرفع جوناثان المطرقة، لكن الضوء الأول يلامس السرداب. تنفتح عينا دراكولا.','Джонатан поднимает молот, но первый луч касается склепа. Глаза Дракулы открываются.'),clue:T('Jonathan hesitated. Imagine that he struck earlier.','Jonathan dudó. Imagina que hubiera golpeado antes.','Jonathan zögerte. Stell dir vor, er hätte früher zugeschlagen.','Jonathan a hésité. Imagine qu\'il ait frappé plus tôt.','Jonathan ha esitato. Immagina che avesse colpito prima.','Jonathan hesitou. Imagine que tinha golpeado antes.','Jonathan zawahał się. Wyobraź sobie, że uderzył wcześniej.','乔纳森犹豫了。设想他更早出手。','ジョナサンはためらった。彼がもっと早く打ったと想像せよ。','Jonathan tereddüt etti. Daha erken vurduğunu hayal et.','تردد جوناثان. تخيّل أنه ضرب في وقت أبكر.','Джонатан замешкался. Представь, что он ударил раньше.'),prompt:T('Choose the THIRD CONDITIONAL.','Elige el TERCER CONDICIONAL.','Wähle den DRITTEN KONDITIONALSATZ.','Choisis le TROISIÈME CONDITIONNEL.','Scegli il TERZO CONDIZIONALE.','Escolha o TERCEIRO CONDICIONAL.','Wybierz TRZECI OKRES WARUNKOWY.','选出第三条件句。','第三条件文を選べ。','ÜÇÜNCÜ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثالث.','Выбери ТРЕТИЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan strikes sooner, Dracula would not escaped.','Si Jonathan golpea antes, Drácula no escaparía.','Wenn Jonathan früher zuschlägt, wäre Dracula nicht entkommen.','Si Jonathan frappait plus tôt, Dracula n\'échapperait pas.','Se Jonathan colpisce prima, Dracula non scapperebbe.','Se Jonathan golpeia mais cedo, Drácula não escaparia.','Jeśli Jonathan uderza wcześniej, Drakula nie uciekłby.','如果乔纳森早点出手,德古拉不会逃脱。','もしジョナサンがもっと早く打てば、ドラキュラは逃げないだろう。','Jonathan daha erken vurursa, Drakula kaçmazdı.','لو يضرب جوناثان أبكر، دراكولا لن يهرب.','Если Джонатан ударит раньше, Дракула не сбежал бы.'),T('If Jonathan had struck sooner, Dracula would not have escaped the coffin.','Si Jonathan hubiera golpeado antes, Drácula no habría escapado del ataúd.','Wenn Jonathan früher zugeschlagen hätte, wäre Dracula dem Sarg nicht entkommen.','Si Jonathan avait frappé plus tôt, Dracula n\'aurait pas échappé au cercueil.','Se Jonathan avesse colpito prima, Dracula non sarebbe scappato dalla bara.','Se Jonathan tivesse golpeado mais cedo, Drácula não teria escapado do caixão.','Gdyby Jonathan uderzył wcześniej, Drakula nie uciekłby z trumny.','如果乔纳森早点出手,德古拉就不会逃出棺木了。','もしジョナサンがもっと早く打っていたら、ドラキュラは棺から逃げられなかっただろう。','Jonathan daha erken vurmuş olsaydı, Drakula tabuttan kaçmamış olurdu.','لو ضرب جوناثان أبكر، لما هرب دراكولا من التابوت.','Если бы Джонатан ударил раньше, Дракула не сбежал бы из гроба.'),T('If Jonathan had strike sooner, Dracula will not escape.','Si Jonathan hubiera golpear antes, Drácula no escapará.','Wenn Jonathan früher zugeschlagen, wird Dracula nicht entkommen.','Si Jonathan avait frapper plus tôt, Dracula n\'échappera pas.','Se Jonathan avesse colpire prima, Dracula non scapperà.','Se Jonathan tivesse golpear mais cedo, Drácula não vai escapar.','Gdyby Jonathan uderzyć wcześniej, Drakula nie ucieknie.','如果乔纳森当初早点出手,德古拉将不会逃脱。','もしジョナサンがもっと早く打っていたら、ドラキュラは逃げないだろう。','Jonathan daha erken vur olsaydı, Drakula kaçmayacak.','لو كان جوناثان قد يضرب أبكر، دراكولا لن يهرب.','Если бы Джонатан ударить раньше, Дракула не сбежит.')],answer:1,fb:T('Third conditional: had + struck, then would have + escaped.','Tercer condicional: hubiera + golpeado, después habría + escapado.','Dritter Konditionalsatz: hätte + zugeschlagen, dann wäre + entkommen.','Troisième conditionnel : avait + frappé, puis aurait + échappé.','Terzo condizionale: avesse + colpito, poi sarebbe + scappato.','Terceiro condicional: tivesse + golpeado, depois teria + escapado.','Trzeci okres warunkowy: zaprzeszły, potem would have + III forma czasownika.','第三条件句:had + struck,然后 would have + escaped。','第三条件文:had+struck(打っていた)、その後would have+escaped(逃げていただろう)。','Üçüncü şart cümlesi: had + ortaç, ardından would have + ortaç.','الشرط الثالث: كان قد ضرب، ثم لـ كان قد هرب.','Третий условный: had + struck, потом would have + escaped.'),evidence:1,next:'final_escape'},
courtyard_carts:{img:'25_courtyard_carts',pos:'left',kind:'question',q:15,k:T('ROUTE · THE NIGHT CONVOY','RUTA · EL CONVOY NOCTURNO','ROUTE · DER NACHTKONVOI','ROUTE · LE CONVOI NOCTURNE','VIA · IL CONVOGLIO NOTTURNO','ROTA · O COMBOIO NOTURNO','TRASA · NOCNY KONWÓJ','路线 · 夜间车队','ルート · 夜の隊列','ROTA · GECE KERVANI','المسار · القافلة الليلية','ПУТЬ · НОЧНОЙ ОБОЗ'),title:T('BOXES IN MOTION','CAJAS EN MOVIMIENTO','KISTEN IN BEWEGUNG','CAISSES MOBILES','CASSE IN MOVIMENTO','CAIXAS EM MOVIMENTO','SKRZYNIE W RUCHU','移动中的木箱','動き出す箱','KUTULAR HAREKETTE','صناديق في حركة','ЯЩИКИ В ДВИЖЕНИИ'),story:T('Workers carry the earth boxes toward black wagons. Jonathan hides behind a broken saint.','Los trabajadores llevan las cajas de tierra hacia carros negros. Jonathan se esconde tras un santo roto.','Arbeiter tragen die Erdkisten zu schwarzen Wagen. Jonathan versteckt sich hinter einem zerbrochenen Heiligen.','Des ouvriers portent les caisses de terre vers des chariots. Jonathan se cache derrière un saint brisé.','I lavoratori portano le casse di terra verso i carri neri. Jonathan si nasconde dietro un santo spezzato.','Os trabalhadores levam as caixas de terra para os carros negros. Jonathan esconde-se atrás de um santo partido.','Robotnicy niosą skrzynie z ziemią w stronę czarnych wozów. Jonathan chowa się za połamanym posągiem świętego.','工人们把泥土木箱搬向黑色货车。乔纳森躲在一尊残破的圣像后面。','労働者たちが土の箱を黒い荷馬車へと運ぶ。ジョナサンは壊れた聖人像の陰に隠れる。','İşçiler toprak kutularını siyah kağnılara doğru taşır. Jonathan kırık bir azizin arkasına saklanır.','يحمل العمال صناديق التراب نحو عربات سوداء. يختبئ جوناثان خلف قديس محطم.','Рабочие несут ящики с землёй к чёрным повозкам. Джонатан прячется за разбитой статуей святого.'),clue:T('The action is happening now. Put the boxes first.','La acción está ocurriendo ahora. Pon las cajas primero.','Die Handlung geschieht gerade. Stelle die Kisten an den Anfang.','L\'action se passe maintenant. Mets les caisses en premier.','L\'azione sta avvenendo ora. Metti le casse per prime.','A ação está a acontecer agora. Ponha as caixas primeiro.','Czynność dzieje się teraz. Postaw skrzynie na pierwszym miejscu.','这动作正在发生。请把木箱放在前面。','その動作は今起きている。箱を先に置け。','Eylem şu anda gerçekleşiyor. Önce kutuları söyle.','الفعل يحدث الآن. ضع الصناديق أولاً.','Действие происходит сейчас. Поставь ящики на первое место.'),prompt:T('Choose the PRESENT CONTINUOUS PASSIVE.','Elige la PASIVA CONTINUA DEL PRESENTE.','Wähle das PASSIV IM VERLAUF.','Choisis le PASSIF AU PRÉSENT CONTINU.','Scegli la PASSIVA CONTINUA DEL PRESENTE.','Escolha a PASSIVA CONTÍNUA DO PRESENTE.','Wybierz STRONĘ BIERNĄ w czasie PRESENT CONTINUOUS.','选出现在进行时的被动句。','現在進行形の受動態を選べ。','ŞİMDİKİ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في المضارع المستمر.','Выбери ПАССИВ ПРОДОЛЖЕННОГО НАСТОЯЩЕГО.'),opts:[T('The boxes are load onto wagons.','Las cajas cargan en los carros.','Die Kisten laden auf Wagen.','Les caisses sont charger aux chariots.','Le casse caricano sui carri.','As caixas são carregar nos carros.','Skrzynie są ładować na wozy.','木箱装上货车。','箱は荷馬車に積む。','Kutular kağnılara yüklenir.','الصناديق حمل على العربات.','Ящики грузить на повозки.'),T('The boxes were being load tomorrow.','Las cajas estaban siendo cargar mañana.','Die Kisten wurden morgen geladen sein.','Les caisses étaient charger demain.','Le casse stavano venendo caricare domani.','As caixas estavam a ser carregar amanhã.','Skrzynie były być ładowane jutro.','木箱明天曾经正在被装。','箱は明日積まれていた。','Kutular kağnılara yarın yükleniyordu.','كانت الصناديق يتم تحميلها غداً.','Ящики были грузить завтра.'),T('The boxes are being loaded onto wagons.','Las cajas están siendo cargadas en los carros.','Die Kisten werden gerade auf Wagen geladen.','Les caisses sont chargées sur les chariots.','Le casse stanno venendo caricate sui carri.','As caixas estão a ser carregadas nos carros.','Skrzynie są ładowane na wozy.','木箱正被装上货车。','箱は荷馬車に積まれているところだ。','Kutular şu anda kağnılara yükleniyor.','الصناديق يتم تحميلها على العربات الآن.','Ящики сейчас грузятся на повозки.')],answer:2,fb:T('Present continuous passive: are being + past participle.','Pasiva continua del presente: están siendo + participio.','Verlaufspassiv: werden gerade + Partizip II.','Passif au présent continu : sont en train d\'être + participe passé.','Passiva continua del presente: stanno venendo + participio.','Passiva contínua do presente: estão a ser + particípio.','Strona bierna Present Continuous: are being + III forma czasownika.','现在进行时被动:are being + 过去分词。','現在進行形の受動態:are being+過去分詞。','Şimdiki zaman pasifi: are being + geçmiş zaman ortacı (yükleniyor).','مجهول المضارع المستمر: يتم + مصدر الفعل.','Пассив продолженного настоящего: are being + 3-я форма глагола.'),next:'carriage_sabotage'},
carriage_sabotage:{img:'26_carriage_sabotage',pos:'right',kind:'question',q:16,k:T('ROUTE · THE BLACK CARRIAGE','RUTA · EL COCHE NEGRO','ROUTE · DIE SCHWARZE KUTSCHE','ROUTE · LE CARROSSE NOIR','VIA · LA CARROZZA NERA','ROTA · A CARRUAGEM NEGRA','TRASA · CZARNY POWÓZ','路线 · 黑色马车','ルート · 黒い馬車','ROTA · SİYAH ARABA','المسار · العربة السوداء','ПУТЬ · ЧЁРНЫЙ ЭКИПАЖ'),title:T('ONE MISSING PIN','UN PERNO AUSENTE','EIN FEHLENDER BOLZEN','GOUPILLE ABSENTE','UN PERNO MANCANTE','UM PERNO EM FALTA','BRAKUJĄCY SWORZEŃ','一枚缺失的销钉','一本消えた留め金','EKSİK BİR PİM','مسمار مفقود','ПРОПАВШИЙ ШТИФТ'),story:T('Jonathan loosens a wheel pin while the guards watch the loading crew. The road crosses a steep bridge.','Jonathan afloja un perno de la rueda mientras los guardias observan a los trabajadores. El camino cruza un puente empinado.','Jonathan lockert einen Radbolzen, während die Wachen die Arbeiter beobachten. Die Straße führt über eine steile Brücke.','Jonathan desserre une goupille pendant que les gardes surveillent le chargement. La route traverse un pont escarpé.','Jonathan allenta un perno della ruota mentre le guardie osservano la squadra di carico. La strada attraversa un ponte ripido.','Jonathan desaperta um perno da roda enquanto os guardas observam a equipa de carregamento. A estrada atravessa uma ponte íngreme.','Jonathan poluzowuje sworzeń koła, gdy strażnicy obserwują ekipę ładującą. Droga przecina stromy most.','卫兵盯着装货的工人时,乔纳森松开了一枚车轮销钉。这条路要经过一座陡峭的桥。','見張りが積み込みの作業員を見ている間に、ジョナサンは車輪の留め金を緩める。道は険しい橋を渡る。','Muhafızlar yükleme ekibini izlerken Jonathan bir tekerlek pimini gevşetir. Yol dik bir köprüden geçer.','يُرخي جوناثان مسمار عجلة بينما يراقب الحراس طاقم التحميل. يعبر الطريق جسراً شديد الانحدار.','Джонатан ослабляет штифт колеса, пока стражники следят за грузчиками. Дорога пересекает крутой мост.'),clue:T('Removing the pin may cause a real future accident.','Quitar el perno puede causar un accidente real en el futuro.','Das Entfernen des Bolzens kann einen echten zukünftigen Unf
