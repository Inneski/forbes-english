:root{--blood:#d21f3c;--deep:#16040a;--bone:#f5ead7;--ice:#a7ddf2;--gold:#f0c878;--muted:#c8b9ad;--shadow:#3c1a66}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050306;color:var(--bone);font-family:"Courier New",Courier,monospace}
button{font:inherit}.game{position:fixed;inset:0;background:#050306}.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
.hud{position:absolute;z-index:5;top:1.4cqw;left:1.5cqw;right:1.5cqw;display:flex;align-items:center;justify-content:space-between;gap:1cqw;pointer-events:none}
.hud-group{display:flex;gap:.55cqw;align-items:center;flex-wrap:wrap}.badge{background:rgba(8,4,9,.78);border:1px solid rgba(245,234,215,.34);box-shadow:0 0 1.3cqw rgba(0,0,0,.55);padding:.48cqw .72cqw;font-size:1.05cqw;letter-spacing:.04em;white-space:nowrap}.badge b{color:var(--gold)}
.langs{display:flex;gap:.35cqw;pointer-events:auto}.lang-btn,.utility{border:1px solid rgba(245,234,215,.35);color:var(--bone);background:rgba(8,4,9,.78);padding:.48cqw .68cqw;cursor:pointer;font-size:1cqw}.lang-btn.active{color:#fff;background:var(--blood);border-color:#ff7186}.utility:hover,.lang-btn:hover{border-color:var(--bone)}
.zone{position:absolute;z-index:4;top:8%;bottom:3.5%;left:2.2%;right:2.2%;display:flex;pointer-events:none}
.content{pointer-events:auto;display:flex;flex-direction:column;gap:.78cqw;width:42%;max-height:100%;overflow:auto;scrollbar-width:thin;padding:1.15cqw 1.3cqw;background:rgba(7,3,8,.86);border:1px solid rgba(245,234,215,.2);box-shadow:0 1.4cqw 4cqw rgba(0,0,0,.55);backdrop-filter:blur(6px);transition:transform .38s cubic-bezier(.2,.9,.3,1.15),opacity .22s ease;transform-origin:50% 50%}
.frame:not(.open) .content{opacity:0;transform:scale(.12);pointer-events:none;transition:transform .26s ease-in,opacity .18s ease-in}
.left .zone{justify-content:flex-start}.left .content{text-align:left}.right .zone{justify-content:flex-end}.right .content{text-align:right}.center .zone{justify-content:center}.center .content{width:60%;text-align:center}
.v-top .zone{align-items:flex-start}.v-center .zone{align-items:center}.v-bottom .zone{align-items:flex-end}
.hide-btn{align-self:flex-end;order:-1;margin:-.4cqw -.5cqw -.2cqw 0;border:0;background:none;color:#e5d3c6;font-size:.82cqw;letter-spacing:.08em;cursor:pointer;padding:.25cqw .4cqw}.hide-btn:hover{color:#fff}.left .hide-btn,.center .hide-btn{align-self:flex-end}.right .hide-btn{align-self:flex-start}
.hot{position:absolute;z-index:6;left:50%;top:50%;width:10%;height:14%;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;transition:opacity .25s;min-width:3.6cqw;min-height:3.6cqw}
.hot i{position:absolute;inset:-.4cqw;border-radius:38%;background:linear-gradient(115deg,transparent 28%,rgba(255,240,190,.28) 42%,rgba(255,250,225,.62) 50%,rgba(255,240,190,.28) 58%,transparent 72%);background-size:260% 260%;mix-blend-mode:screen;box-shadow:0 0 0 .14cqw rgba(240,200,120,.9),0 0 1.4cqw .25cqw rgba(240,200,120,.55),inset 0 0 1.4cqw rgba(255,235,170,.35);animation:shimmer 2.2s linear infinite,pulse 1.8s ease-in-out infinite}
.hot::before{content:"";position:absolute;inset:-.4cqw;border-radius:38%;border:.16cqw solid rgba(255,240,190,.9);opacity:0;animation:ring 1.8s ease-out infinite}
.hot:hover i{animation-duration:1s,1.8s;box-shadow:0 0 0 .18cqw #fff3c4,0 0 2.2cqw .5cqw rgba(240,200,120,.85),inset 0 0 1.8cqw rgba(255,235,170,.5)}
.hot-label{position:absolute;left:50%;top:calc(100% + .7cqw);transform:translateX(-50%);white-space:nowrap;color:var(--gold);font-family:'Pixelify Sans','Courier New',monospace;font-size:1.15cqw;letter-spacing:.04em;text-shadow:-.09em -.09em 0 var(--deep),0 -.09em 0 var(--deep),.09em -.09em 0 var(--deep),-.09em 0 0 var(--deep),.09em 0 0 var(--deep),-.09em .09em 0 var(--deep),0 .09em 0 var(--deep),.09em .09em 0 var(--deep),0 .14em .5em rgba(5,3,7,.9);pointer-events:none}
.hot.above .hot-label{top:auto;bottom:calc(100% + .7cqw)}
.langs{position:relative}.lang-btn{display:flex;align-items:center;gap:.3cqw;white-space:nowrap}.lang-btn b{color:var(--gold)}
.lang-menu[hidden]{display:none}.lang-menu{position:absolute;right:0;top:calc(100% + .4cqw);z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:.25cqw;min-width:22cqw;padding:.45cqw;background:rgba(8,4,9,.96);border:1px solid rgba(245,234,215,.4);box-shadow:0 1cqw 3cqw rgba(0,0,0,.7)}
.lang-item{display:grid;grid-template-columns:2.6cqw 1fr;align-items:center;gap:.4cqw;border:1px solid transparent;background:none;color:var(--bone);padding:.4cqw .5cqw;text-align:left;cursor:pointer;font-size:1cqw}.lang-item b{color:var(--gold);font-size:.9cqw}.lang-item span{font-size:.95cqw}.lang-item:hover{border-color:rgba(245,234,215,.5);background:rgba(60,9,21,.9)}.lang-item.active{background:var(--blood);color:#fff}.lang-item.active b{color:#fff}
.utility.fs{display:flex;align-items:center;gap:.35cqw;color:#1a0810;background:linear-gradient(180deg,#f7d98c,#d9a94a);border:1px solid #fff0c0;font-weight:700;letter-spacing:.06em;box-shadow:0 0 1cqw rgba(240,200,120,.55);animation:fsglow 2.4s ease-in-out infinite}.utility.fs:hover{filter:brightness(1.1)}
.translation{unicode-bidi:plaintext}.rtl .translation{direction:rtl;text-align:right}.utility{pointer-events:auto}
.frame.open .hot{opacity:0;pointer-events:none}
.tr-on .content{gap:.5cqw;padding:.9cqw 1.1cqw}.tr-on .translation{font-size:.86cqw;line-height:1.22;margin-top:.12cqw}.tr-on .option{padding:.42cqw .6cqw}.tr-on .options{gap:.36cqw}.tr-on .clue{padding:.45cqw .7cqw}.tr-on .feedback{padding:.5cqw .7cqw}.tr-on .story{font-size:1.25cqw;line-height:1.28}.rules-intro{grid-template-columns:1fr 1fr}.rule-card:last-child{grid-column:1/-1}.tr-on .rules-intro{gap:.32cqw}.tr-on .rule-card{padding:.36cqw .55cqw;font-size:.88cqw}.tr-on .rule-card .translation{font-size:.7cqw}.tr-on .rule-note{font-size:.88cqw}.tr-on .title{font-size:3cqw}
@keyframes shimmer{0%{background-position:110% 110%}100%{background-position:-10% -10%}}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes fsglow{0%,100%{box-shadow:0 0 .6cqw rgba(240,200,120,.4)}50%{box-shadow:0 0 1.6cqw rgba(240,200,120,.9)}}
.kicker{color:#ff8ea0;font-weight:700;font-size:1.15cqw;letter-spacing:.14em;text-transform:uppercase}.title{margin:0;color:var(--gold);font-family:'Pixelify Sans','Courier New',monospace;font-size:3.6cqw;line-height:1.08;letter-spacing:0;text-shadow:-.05em 0 0 var(--shadow),.05em 0 0 var(--shadow),0 -.05em 0 var(--shadow),0 .05em 0 var(--shadow),-.05em -.05em 0 var(--shadow),.05em -.05em 0 var(--shadow),-.05em .05em 0 var(--shadow),.05em .05em 0 var(--shadow),0 0 .6em rgba(60,26,102,.75)}.story{font-size:1.36cqw;line-height:1.34;font-weight:700}.clue{border-left:.28cqw solid var(--blood);padding:.65cqw .8cqw;background:rgba(99,6,22,.4);font-size:1.13cqw;line-height:1.28}.right .clue{border-left:0;border-right:.28cqw solid var(--blood)}.center .clue{border-right:.28cqw solid var(--blood)}
.prompt{color:var(--ice);font-weight:700;font-size:1.35cqw;line-height:1.24}.translation{display:block;color:#e5d3c6;font-size:.92cqw;line-height:1.28;margin-top:.2cqw;font-style:italic}.title .translation{font-size:1.05cqw;letter-spacing:0;color:#f0d8dd;margin-top:.4cqw;font-family:"Courier New",Courier,monospace}.kicker .translation{font-size:.78cqw;letter-spacing:.05em;color:#e5d3c6}
.options{display:grid;gap:.52cqw;margin-top:.15cqw}.option{display:grid;grid-template-columns:2.2cqw 1fr;align-items:center;gap:.55cqw;width:100%;border:1px solid rgba(245,234,215,.36);background:rgba(9,4,10,.77);color:var(--bone);padding:.62cqw .72cqw;text-align:left;cursor:pointer;font-size:1.04cqw;line-height:1.22;transition:.16s}.option:hover{transform:translateY(-1px);border-color:#fff;background:rgba(60,9,21,.9)}.option .key{display:grid;place-items:center;width:2cqw;height:2cqw;border:1px solid rgba(245,234,215,.45);color:#fff;font-weight:700}.option.correct{background:rgba(25,102,69,.9);border-color:#77efb4}.option.wrong{background:rgba(131,12,34,.93);border-color:#ff6f82}.option:disabled{cursor:default;transform:none}.option .translation{font-size:.82cqw}
.feedback{display:none;padding:.72cqw .82cqw;border:1px solid rgba(245,234,215,.3);background:rgba(7,3,8,.82);font-size:1.04cqw;line-height:1.28}.feedback.show{display:block}.feedback.good{border-color:#77efb4}.feedback.bad{border-color:#ff6f82}.feedback strong{color:var(--gold)}

const scenes={
cover:{img:'01_cover',pos:'left',kind:'intro',k:T('DRACULA · A GRAMMAR HORROR RPG','DRÁCULA · UN RPG DE GRAMÁTICA Y TERROR','DRACULA · EIN GRAMMATIK-HORROR-RPG','DRACULA · UN RPG GRAMMAIRE-HORREUR','DRACULA · RPG GRAMMATICA E TERRORE','DRÁCULA · RPG DE GRAMÁTICA E TERROR','DRAKULA · GRAMATYCZNE RPG GROZY','德古拉 · 语法恐怖RPG','ドラキュラ · 文法ホラーRPG','DRAKULA · BİR GRAMER KORKU RPG\'Sİ','دراكولا · لعبة رعب نحوي','ДРАКУЛА · РПГ УЖАСОВ ПО ГРАММАТИКЕ'),title:T('BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA','BLOCULA'),story:T('Jonathan Harker has come to Transylvania to complete a property sale. Master conditionals and the active and passive voice. Earn 70 points, preserve your nerve and collect three pieces of evidence before Dracula closes the gates forever.','Jonathan Harker ha venido a Transilvania para cerrar una venta. Domina los condicionales y la voz activa y pasiva. Gana 70 puntos, conserva tu valor y reúne tres pruebas antes de que Drácula cierre las puertas para siempre.','Jonathan Harker ist nach Transsilvanien gekommen, um einen Verkauf abzuschließen. Meistere Konditionalsätze sowie Aktiv und Passiv. Sammle 70 Punkte, behalte deinen Mut und finde drei Beweise, bevor Dracula die Tore für immer schließt.','Jonathan Harker est venu en Transylvanie pour conclure une vente immobilière. Maîtrise les conditionnels et les voix active et passive. Gagne 70 points, préserve ton courage et réunis trois preuves avant que Dracula ne ferme les portes pour toujours.','Jonathan Harker è arrivato in Transilvania per concludere una vendita immobiliare. Domina i condizionali e la voce attiva e passiva. Guadagna 70 punti, conserva il coraggio e raccogli tre prove prima che Dracula chiuda i cancelli per sempre.','Jonathan Harker veio à Transilvânia para fechar uma venda de propriedade. Domine os condicionais e as vozes ativa e passiva. Ganhe 70 pontos, preserve a sua coragem e reúna três provas antes que Drácula feche os portões para sempre.','Jonathan Harker przybył do Transylwanii, aby sfinalizować sprzedaż nieruchomości. Opanuj okresy warunkowe oraz stronę czynną i bierną. Zdobądź 70 punktów, zachowaj odwagę i zbierz trzy dowody, zanim Drakula zamknie bramy na zawsze.','乔纳森·哈克来到特兰西瓦尼亚,完成一笔房产交易。掌握条件句与主被动语态。在德古拉永远关闭城门之前,赚取70分,保住勇气,并收集三份证据。','ジョナサン・ハーカーは不動産契約のためトランシルヴァニアを訪れた。条件文と能動態・受動態を身につけよ。ドラキュラが門を永遠に閉ざす前に、70点を稼ぎ、気力を保ち、証拠を3つ集めよ。','Jonathan Harker bir mülk satışını tamamlamak için Transilvanya\'ya gelmiştir. Şart cümlelerinde ve aktif-pasif çatıda ustalaş. Drakula kapıları sonsuza dek kapatmadan önce 70 puan topla, cesaretini koru ve üç kanıt parçası bul.','جاء جوناثان هاركر إلى ترانسيلفانيا لإتمام صفقة بيع عقار. أتقن الجمل الشرطية والمبني للمعلوم والمبني للمجهول. اجمع 70 نقطة، حافظ على شجاعتك، واجمع ثلاث قطع دليل قبل أن يُغلق دراكولا الأبواب إلى الأبد.','Джонатан Харкер приехал в Трансильванию, чтобы завершить сделку по продаже недвижимости. Освой условные предложения и активный и пассивный залог. Набери 70 очков, сохрани смелость и собери три улики, прежде чем Дракула закроет ворота навсегда.'),next:'rules'},
rules:{img:'31_rules_briefing',pos:'left',kind:'rules',k:T('BEFORE THE JOURNEY · HOW THE GRAMMAR WORKS','ANTES DEL VIAJE · CÓMO FUNCIONA LA GRAMÁTICA','VOR DER REISE · SO FUNKTIONIERT DIE GRAMMATIK','AVANT LE VOYAGE · COMMENT FONCTIONNE LA GRAMMAIRE','PRIMA DEL VIAGGIO · COME FUNZIONA LA GRAMMATICA','ANTES DA VIAGEM · COMO FUNCIONA A GRAMÁTICA','PRZED PODRÓŻĄ · JAK DZIAŁA GRAMATYKA','旅程之前 · 语法规则说明','旅の前に · 文法の仕組み','YOLCULUKTAN ÖNCE · GRAMER NASIL İŞLER','قبل الرحلة · كيف تعمل القواعد','ПЕРЕД ПУТЕШЕСТВИЕМ · КАК РАБОТАЕТ ГРАММАТИКА'),title:T('READ THE SIGNS','LEE LAS SEÑALES','LIES DIE ZEICHEN','LIS LES SIGNES','LEGGI I SEGNALI','LEIA OS SINAIS','CZYTAJ ZNAKI','解读征兆','兆しを読め','İŞARETLERİ OKU','اقرأ الإشارات','ЧИТАЙ ЗНАКИ'),story:T('Every challenge asks what the speaker means and what form expresses it. First decide whether the situation is a fact, a real possibility, an unreal idea or an impossible past. For voice questions, decide whether the doer or the receiver deserves the focus.','Cada desafío pregunta qué quiere decir el hablante y qué forma lo expresa. Primero decide si la situación es un hecho, una posibilidad real, una idea irreal o un pasado imposible. Para las voces, decide si el foco debe estar en quien actúa o en quien recibe la acción.','Jede Aufgabe fragt, was gemeint ist und welche Form dies ausdrückt. Entscheide zuerst, ob es um eine Tatsache, eine reale Möglichkeit, eine irreale Vorstellung oder eine unmögliche Vergangenheit geht. Bei Aktiv und Passiv entscheidest du, ob Handelnder oder Empfänger im Mittelpunkt steht.','Chaque défi demande ce que veut dire le locuteur et quelle forme l\'exprime. Décide d\'abord si la situation est un fait, une possibilité réelle, une idée irréelle ou un passé impossible. Pour les voix, décide si l\'accent porte sur qui agit ou sur qui reçoit l\'action.','Ogni sfida chiede cosa intende chi parla e quale forma lo esprime. Prima decidi se la situazione è un fatto, una possibilità reale, un\'idea irreale o un passato impossibile. Per le domande sulla voce, decidi se l\'attenzione va su chi agisce o su chi riceve l\'azione.','Cada desafio pergunta o que o falante quer dizer e que forma o expressa. Primeiro, decida se a situação é um facto, uma possibilidade real, uma ideia irreal ou um passado impossível. Nas perguntas de voz, decida se o foco deve estar em quem age ou em quem recebe a ação.','Każde wyzwanie pyta, co ma na myśli mówiący i jaka forma to wyraża. Najpierw ustal, czy sytuacja to fakt, realna możliwość, nierealny pomysł czy niemożliwa przeszłość. W pytaniach o stronę zdecyduj, czy uwaga ma być na wykonawcy, czy na odbiorcy czynności.','每个挑战都在问:说话人想表达什么,该用什么形式表达。先判断情境是事实、真实的可能、不真实的想法,还是不可能的过去。遇到语态问题时,判断该聚焦施动者还是受动者。','どの課題も、話し手の意図とそれを表す形を問う。まず状況が事実か、現実的な可能性か、非現実的な考えか、あり得ない過去かを判断せよ。態の問題では、動作主と受け手のどちらに焦点を置くべきかを判断せよ。','Her bölüm, konuşmacının ne demek istediğini ve bunu hangi yapının ifade ettiğini sorar. Önce durumun bir gerçek mi, gerçek bir olasılık mı, gerçek dışı bir fikir mi yoksa imkânsız bir geçmiş mi olduğuna karar ver. Çatı sorularında ise odağın eylemi yapanda mı yoksa eylemi alanda mı olması gerektiğine karar ver.','كل تحدٍّ يسأل عمّا يقصده المتحدث وما الصيغة التي تعبّر عنه. أولاً حدّد إن كان الموقف حقيقة، أو احتمالاً حقيقياً، أو فكرة غير واقعية، أو ماضياً مستحيلاً. أما في أسئلة المبني، فحدّد إن كان التركيز على الفاعل أم على من وقع عليه الفعل.','Каждое задание спрашивает, что имеет в виду говорящий и какая форма это выражает. Сначала реши, идёт ли речь о факте, реальной возможности, нереальной идее или невозможном прошлом. В вопросах о залоге реши, на ком акцент — на том, кто действует, или на том, кто получает действие.'),rules:[{name:T('ZERO · FACTS AND RULES','CERO · HECHOS Y REGLAS','NULL · FAKTEN UND REGELN','ZÉRO · FAITS ET RÈGLES','ZERO · FATTI E REGOLE','ZERO · FACTOS E REGRAS','ZERO · FAKTY I ZASADY','零 · 事实与规则','ゼロ · 事実とルール','SIFIR · GERÇEKLER VE KURALLAR','صفري · حقائق وقواعد','НУЛЕВОЙ · ФАКТЫ И ПРАВИЛА'),form:T('if/when + present, present','si/cuando + presente, presente','wenn + Präsens, Präsens','si/quand + présent, présent','se/quando + presente, presente','se/quando + presente, presente','jeśli/kiedy + teraźniejszy, teraźniejszy','if/when + 现在时,现在时','if/when + 現在形, 現在形','eğer/-dığında + geniş zaman, geniş zaman','إن/عندما + مضارع، مضارع','если/когда + настоящее, настоящее')},{name:T('FIRST · REAL FUTURE POSSIBILITY','PRIMERO · POSIBILIDAD FUTURA REAL','ERSTER · REALE ZUKUNFTSMÖGLICHKEIT','PREMIER · POSSIBILITÉ FUTURE RÉELLE','PRIMO · POSSIBILITÀ FUTURA REALE','PRIMEIRO · POSSIBILIDADE FUTURA REAL','PIERWSZY · REALNA MOŻLIWOŚĆ W PRZYSZŁOŚCI','第一 · 真实的未来可能','第一 · 現実的な未来の可能性','BİRİNCİ · GERÇEK GELECEK OLASILIĞI','أول · احتمال مستقبلي حقيقي','ПЕРВЫЙ · РЕАЛЬНАЯ ВОЗМОЖНОСТЬ В БУДУЩЕМ'),form:T('if + present, will + BASE VERB','si + presente, futuro','wenn + Präsens, wird + Grundform','si + présent, futur','se + presente, futuro','se + presente, futuro','jeśli + teraźniejszy, przyszły','if + 现在时,will + 动词原形','if + 現在形, will + 動詞の原形','eğer + geniş zaman, gelecek zaman','إن + مضارع، سـ + مضارع','если + настоящее, will + 1-я форма')},{name:T('SECOND · UNREAL NOW OR FUTURE','SEGUNDO · PRESENTE O FUTURO IRREAL','ZWEITER · IRREALE GEGENWART ODER ZUKUNFT','DEUXIÈME · PRÉSENT OU FUTUR IRRÉEL','SECONDO · PRESENTE/FUTURO IRREALE','SEGUNDO · PRESENTE OU FUTURO IRREAL','DRUGI · NIEREALNA TERAŹNIEJSZOŚĆ LUB PRZYSZŁOŚĆ','第二 · 不真实的现在或未来','第二 · 非現実の現在・未来','İKİNCİ · GERÇEK DIŞI ŞİMDİ VEYA GELECEK','ثانٍ · حاضر أو مستقبل غير واقعي','ВТОРОЙ · НЕРЕАЛЬНОЕ НАСТОЯЩЕЕ'),form:T('if + past, would/could + BASE VERB','si + pasado, condicional','wenn + Vergangenheit, würde/könnte + Grundform','si + passé, conditionnel','se + passato, condizionale','se + passado, condicional','jeśli + przeszły, warunkowy','if + 过去时,would/could + 动词原形','if + 過去形, would/could + 動詞の原形','eğer + geçmiş zaman, şart kipi','لو + ماضٍ، لـ + ماضٍ','если + прошедшее, would/could + 1-я форма')},{name:T('THIRD · DIFFERENT PAST','TERCERO · UN PASADO DIFERENTE','DRITTER · EINE ANDERE VERGANGENHEIT','TROISIÈME · PASSÉ DIFFÉRENT','TERZO · UN PASSATO DIVERSO','TERCEIRO · PASSADO DIFERENTE','TRZECI · INNA PRZESZŁOŚĆ','第三 · 不同的过去','第三 · 異なる過去','ÜÇÜNCÜ · FARKLI BİR GEÇMİŞ','ثالث · ماضٍ مختلف','ТРЕТИЙ · ИНОЕ ПРОШЛОЕ'),form:T('if + had + past participle, would have + past participle','si + pluscuamperfecto, habría + participio','wenn + Plusquamperfekt, hätte/wäre + Partizip','si + plus-que-parfait, aurait + participe passé','se + trapassato, avrebbe + participio','se + mais-que-perfeito, teria + particípio','jeśli + zaprzeszły, warunkowy + III forma','if + had + 过去分词,would have + 过去分词','if + had + 過去分詞, would have + 過去分詞','eğer + geçmişte bitmiş zaman, geçmiş şart kipi','لو + ماضٍ تام، لـ + ماضٍ تام','если + had + 3-я форма, would have + 3-я форма')},{name:T('ACTIVE AND PASSIVE','ACTIVA Y PASIVA','AKTIV UND PASSIV','ACTIVE ET PASSIVE','ATTIVA E PASSIVA','ATIVA E PASSIVA','CZYNNA I BIERNA','主动与被动','能動態と受動態','AKTİF VE PASİF','المعلوم والمجهول','АКТИВ И ПАССИВ'),form:T('ACTIVE: the subject does the action. PASSIVE: the receiver comes first; use BE in the right tense + PAST PARTICIPLE.','ACTIVA: el sujeto realiza la acción. PASIVA: el receptor va primero; usa SER en el tiempo correcto + PARTICIPIO.','AKTIV: Das Subjekt handelt. PASSIV: Der Empfänger steht zuerst; nutze WERDEN/SEIN in der richtigen Zeit + PARTIZIP II.','ACTIVE : le sujet fait l\'action. PASSIVE : le receveur vient en premier ; utilise ÊTRE au bon temps + PARTICIPE PASSÉ.','ATTIVA: il soggetto compie l\'azione. PASSIVA: il ricevente va per primo; usa ESSERE nel tempo corretto + PARTICIPIO PASSATO.','ATIVA: o sujeito realiza a ação. PASSIVA: quem recebe a ação vem primeiro; usa-se SER no tempo correto + PARTICÍPIO.','STRONA CZYNNA: podmiot wykonuje czynność. STRONA BIERNA: na pierwszym miejscu stoi odbiorca czynności; użyj BYĆ w odpowiednim czasie + III FORMA CZASOWNIKA.','主动:主语执行动作。被动:受动者在前;用相应时态的BE + 过去分词。','能動態:主語が動作を行う。受動態:受け手を先に置き、適切な時制のBE動詞+過去分詞を使う。','AKTİF: özne eylemi yapar. PASİF: alıcı önce gelir; doğru zamanda BE + GEÇMİŞ ZAMAN ORTACI kullan.','المبني للمعلوم: الفاعل هو من يقوم بالفعل. المبني للمجهول: يأتي المفعول به أولاً؛ استخدم كان/يكون في الزمن المناسب + التصريف الثالث.','АКТИВ: подлежащее выполняет действие. ПАССИВ: получатель действия — на первом месте; "be" в нужном времени + 3-я форма глагола.')}],note:T('In an if-clause, do not normally use “will”. Look for the time and the meaning before choosing the structure.','En una oración con si, normalmente no se usa “will” en la parte con si. Busca primero el tiempo y el significado.','Im wenn-Satz steht normalerweise kein „will“. Achte zuerst auf Zeit und Bedeutung.','Dans une proposition avec si, on n\'utilise pas « will ». Cherche le temps et le sens avant de choisir la structure.','In una frase con \'se\', di norma non si usa il futuro dopo \'se\'. Cerca prima il tempo e il significato.','Numa oração com "se", normalmente não se usa "will" na parte com "se". Procure primeiro o tempo e o significado.','W zdaniu warunkowym po "if" zwykle nie używa się "will". Najpierw znajdź czas i znaczenie, zanim wybierzesz strukturę.','if从句中通常不用"will"。选结构前,先看清时间和含义。','if節では通常「will」を使わない。構造を選ぶ前に、時と意味を確認せよ。','Eğer\'li cümlede genellikle “will” kullanılmaz. Yapıyı seçmeden önce zamana ve anlama bak.','في جملة الشرط، لا تُستخدم "will" عادة في جملة إن. ابحث عن الزمن والمعنى قبل اختيار التركيب.','В придаточном с "if" обычно не используют "will". Сначала определи время и смысл, а потом выбирай структуру.'),next:'train'},
train:{img:'02_train',pos:'left',kind:'question',q:1,k:T('JONATHAN’S JOURNAL · 3 MAY','DIARIO DE JONATHAN · 3 DE MAYO','JONATHANS TAGEBUCH · 3. MAI','JOURNAL DE JONATHAN · 3 MAI','DIARIO DI JONATHAN · 3 MAGGIO','DIÁRIO DE JONATHAN · 3 DE MAIO','DZIENNIK JONATHANA · 3 MAJA','乔纳森的日记 · 5月3日','ジョナサンの日記 · 5月3日','JONATHAN\'IN GÜNLÜĞÜ · 3 MAYIS','يوميات جوناثان · 3 مايو','ДНЕВНИК ДЖОНАТАНА · 3 МАЯ'),title:T('THE INVITATION','LA INVITACIÓN','DIE EINLADUNG','L\'INVITATION','L\'INVITO','O CONVITE','ZAPROSZENIE','邀请函','招待状','DAVET','الدعوة','ПРИГЛАШЕНИЕ'),story:T('A letter has brought Jonathan east. Beyond the train window, the Carpathians rise like black teeth.','Una carta ha llevado a Jonathan hacia el este. Tras la ventana, los Cárpatos se alzan como dientes negros.','Ein Brief hat Jonathan nach Osten gebracht. Hinter dem Zugfenster ragen die Karpaten wie schwarze Zähne auf.','Une lettre a conduit Jonathan vers l\'est. Par la fenêtre du train, les Carpates se dressent comme des dents noires.','Una lettera ha portato Jonathan verso est. Oltre il finestrino del treno, i Carpazi si alzano come denti neri.','Uma carta trouxe Jonathan para leste. Além da janela do comboio, os Cárpatos erguem-se como dentes negros.','List sprowadził Jonathana na wschód. Za oknem pociągu Karpaty wznoszą się jak czarne zęby.','一封信将乔纳森带往东方。车窗外,喀尔巴阡山如黑色的獠牙般耸立。','一通の手紙がジョナサンを東へ導いた。列車の窓の向こうに、カルパティア山脈が黒い歯のようにそびえる。','Bir mektup Jonathan\'ı doğuya getirmiştir. Tren penceresinin ardında Karpatlar, siyah dişler gibi yükselir.','حملت رسالة جوناثان نحو الشرق. خلف نافذة القطار، ترتفع جبال الكاربات كأنياب سوداء.','Письмо привело Джонатана на восток. За окном поезда Карпаты вздымаются, как чёрные зубы.'),clue:T('Dracula sent the letter. Jonathan received it in London.','Drácula envió la carta. Jonathan la recibió en Londres.','Dracula schickte den Brief. Jonathan erhielt ihn in London.','Dracula a envoyé la lettre. Jonathan l\'a reçue à Londres.','Dracula ha inviato la lettera. Jonathan l\'ha ricevuta a Londra.','Drácula enviou a carta. Jonathan recebeu-a em Londres.','Drakula wysłał list. Jonathan otrzymał go w Londynie.','德古拉寄出了这封信。乔纳森在伦敦收到了它。','ドラキュラが手紙を送った。ジョナサンはロンドンでそれを受け取った。','Drakula mektubu gönderdi. Jonathan onu Londra\'da aldı.','أرسل دراكولا الرسالة. تلقّاها جوناثان في لندن.','Дракула отправил письмо. Джонатан получил его в Лондоне.'),prompt:T('Which sentence is ACTIVE?','¿Qué oración está en ACTIVA?','Welcher Satz steht im AKTIV?','Quelle phrase est ACTIVE ?','Quale frase è in ATTIVA?','Qual frase está na ATIVA?','Które zdanie jest w STRONIE CZYNNEJ?','哪句是主动语态?','能動態の文はどれか?','Hangi cümle AKTİF\'tir?','أي جملة في المبني للمعلوم؟','Какое предложение — АКТИВ?'),opts:[T('Jonathan was invited to Transylvania.','Jonathan fue invitado a Transilvania.','Jonathan wurde nach Transsilvanien eingeladen.','Jonathan a été invité en Transylvanie.','Jonathan è stato invitato in Transilvania.','Jonathan foi convidado para a Transilvânia.','Jonathan został zaproszony do Transylwanii.','乔纳森被邀请去了特兰西瓦尼亚。','ジョナサンはトランシルヴァニアに招待された。','Jonathan Transilvanya\'ya davet edildi.','دُعي جوناثان إلى ترانسيلفانيا.','Джонатан был приглашён в Трансильванию.'),T('Dracula invited Jonathan to Transylvania.','Drácula invitó a Jonathan a Transilvania.','Dracula lud Jonathan nach Transsilvanien ein.','Dracula a invité Jonathan en Transylvanie.','Dracula ha invitato Jonathan in Transilvania.','Drácula convidou Jonathan para a Transilvânia.','Drakula zaprosił Jonathana do Transylwanii.','德古拉邀请乔纳森去了特兰西瓦尼亚。','ドラキュラはジョナサンをトランシルヴァニアに招待した。','Drakula, Jonathan\'ı Transilvanya\'ya davet etti.','دعا دراكولا جوناثان إلى ترانسيلفانيا.','Дракула пригласил Джонатана в Трансильванию.'),T('The invitation was carried by train.','La invitación fue llevada en tren.','Die Einladung wurde mit dem Zug gebracht.','L\'invitation a été transportée en train.','L\'invito è stato portato in treno.','O convite foi levado de comboio.','Zaproszenie zostało przewiezione pociągiem.','邀请函是由火车送达的。','招待状は列車で運ばれた。','Davet trenle taşındı.','نُقلت الدعوة بالقطار.','Приглашение было доставлено поездом.')],answer:1,fb:T('The subject, Dracula, performs the action. That makes the sentence active.','El sujeto, Drácula, realiza la acción. Por eso la oración es activa.','Das Subjekt Dracula führt die Handlung aus. Darum ist der Satz aktiv.','Le sujet, Dracula, réalise l\'action. C\'est pourquoi la phrase est active.','Il soggetto, Dracula, compie l\'azione. Per questo la frase è attiva.','O sujeito, Drácula, realiza a ação. Por isso a frase está na ativa.','Podmiot, Drakula, wykonuje czynność. Dlatego zdanie jest w stronie czynnej.','主语德古拉执行了动作,所以这句是主动语态。','主語のドラキュラが動作を行っている。だからこの文は能動態である。','Özne olan Drakula, eylemi gerçekleştirir. Bu da cümleyi aktif yapar.','الفاعل، دراكولا، هو من يقوم بالفعل. لهذا فالجملة في المبني للمعلوم.','Подлежащее, Дракула, выполняет действие. Поэтому предложение в активе.'),next:'inn'},
inn:{img:'03_inn',pos:'right',kind:'question',q:2,k:T('BORGO PASS · LAST SAFE INN','PASO DE BORGO · ÚLTIMA POSADA SEGURA','BORGO-PASS · LETZTES SICHERES GASTHAUS','COL BORGO · DERNIER REFUGE SÛR','PASSO BORGO · LOCANDA SICURA','PASSO DE BORGO · POUSADA SEGURA','PRZEŁĘCZ BORGO · OSTATNI PEWNY ZAJAZD','博尔戈山口 · 最后一家安全客栈','ボルゴ峠 · 最後の安全な宿','BORGO GEÇİDİ · SON GÜVENLİ HAN','ممر بورغو · آخر نزل آمن','ПЕРЕВАЛ БОРГО · ПОСЛЕДНИЙ ПРИЮТ'),title:T('A GIFT AGAINST EVIL','UN REGALO CONTRA EL MAL','EIN GESCHENK GEGEN DAS BÖSE','UN DON CONTRE LE MAL','UN DONO CONTRO IL MALE','PRESENTE CONTRA O MAL','DAR PRZECIW ZŁU','抵御邪恶的礼物','悪に抗う贈り物','KÖTÜLÜĞE KARŞI BİR HEDİYE','هدية ضد الشر','ДАР ПРОТИВ ЗЛА'),story:T('The innkeeper presses a crucifix into Jonathan’s hand. Everyone stops speaking when Dracula’s name is heard.','La posadera pone un crucifijo en la mano de Jonathan. Todos dejan de hablar al oír el nombre de Drácula.','Die Wirtin drückt Jonathan ein Kruzifix in die Hand. Alle verstummen, als Draculas Name fällt.','L\'aubergiste presse un crucifix dans la main de Jonathan. Tout le monde se tait en entendant le nom de Dracula.','La locandiera mette un crocifisso nella mano di Jonathan. Tutti smettono di parlare quando sentono il nome di Dracula.','A estalajadeira coloca um crucifixo na mão de Jonathan. Todos deixam de falar ao ouvir o nome de Drácula.','Karczmarka wciska krucyfiks w dłoń Jonathana. Wszyscy milkną, gdy pada imię Drakuli.','客栈老板娘把一个十字架塞进乔纳森手中。一听到德古拉的名字,众人便都噤声。','宿の女主人がジョナサンの手に十字架を握らせる。ドラキュラの名が聞こえると、誰もが口をつぐむ。','Hancı kadın, Jonathan\'ın eline bir haç sıkıştırır. Drakula\'nın adı duyulunca herkes susar.','تضع صاحبة النزل صليباً في يد جوناثان. يصمت الجميع عند سماع اسم دراكولا.','Хозяйка трактира вкладывает распятие в руку Джонатана. Все замолкают, услышав имя Дракулы.'),clue:T('The cross may protect him later.','La cruz puede protegerlo más tarde.','Das Kreuz kann ihn später schützen.','La croix peut le protéger plus tard.','La croce può proteggerlo più tardi.','A cruz pode protegê-lo mais tarde.','Krzyż może go ochronić później.','这个十字架日后或许能保护他。','その十字架は後で彼を守るかもしれない。','Haç onu ileride koruyabilir.','قد يحميه الصليب لاحقاً.','Крест может защитить его позже.'),prompt:T('Complete the FIRST CONDITIONAL.','Completa el PRIMER CONDICIONAL.','Vervollständige den ERSTEN KONDITIONALSATZ.','Complète le PREMIER CONDITIONNEL.','Completa il PRIMO CONDIZIONALE.','Complete o PRIMEIRO CONDICIONAL.','Uzupełnij PIERWSZY OKRES WARUNKOWY.','补全第一条件句。','第一条件文を完成させよ。','BİRİNCİ ŞART CÜMLESİ\'ni tamamla.','أكمل الشرط الأول.','Заверши ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If you take this cross, it will protect you.','Si llevas esta cruz, te protegerá.','Wenn du dieses Kreuz mitnimmst, wird es dich schützen.','Si tu prends cette croix, elle te protégera.','Se prendi questa croce, ti proteggerà.','Se levar esta cruz, ela vai protegê-lo.','Jeśli weźmiesz ten krzyż, ochroni cię.','如果你拿上这个十字架,它会保护你。','この十字架を持っていけば、それがあなたを守るだろう。','Bu haçı alırsan, seni koruyacak.','إن حملت هذا الصليب، سيحميك.','Если ты возьмёшь этот крест, он защитит тебя.'),T('If you took this cross, it protects you yesterday.','Si llevaras esta cruz, te protege ayer.','Wenn du dieses Kreuz nähmest, schützt es dich gestern.','Si tu prenais cette croix, elle te protège hier.','Se prendessi questa croce, ti protegge ieri.','Se levasse esta cruz, ela protege-o ontem.','Gdybyś nosił ten krzyż, chroni cię wczoraj.','如果你拿了这个十字架,它昨天保护你。','もしこの十字架を持っていったら、それは昨日あなたを守る。','Bu haçı alsaydın, seni dün korur.','لو حملتَ هذا الصليب، يحميك أمس.','Если бы ты взял этот крест, он защищает тебя вчера.'),T('If you will take this cross, it protected you.','Si llevarás esta cruz, te protegió.','Wenn du dieses Kreuz mitnehmen wirst, schützte es dich.','Si tu prendras cette croix, elle t\'a protégé.','Se prenderai questa croce, ti ha protetto.','Se vai levar esta cruz, ela protegeu-o.','Jeśli będziesz nosił ten krzyż, ochronił cię.','如果你将会拿这个十字架,它曾经保护你。','もしこの十字架を持っていくでしょうなら、それはあなたを守った。','Eğer bu haçı alacaksan, seni korudu.','إن ستحمل هذا الصليب، حماك.','Если ты будешь брать этот крест, он защитил тебя.')],answer:0,fb:T('First conditional: if + present simple, then will + base verb.','Primer condicional: si + presente, después futuro.','Erster Konditionalsatz: if/wenn + Präsens, dann will/wird + Grundform.','Premier conditionnel : si + présent, puis futur.','Primo condizionale: se + presente, poi futuro.','Primeiro condicional: se + presente simples, depois futuro.','Pierwszy okres warunkowy: jeśli + czas teraźniejszy, potem czas przyszły.','第一条件句:if + 一般现在时,然后 will + 动词原形。','第一条件文:if+現在形、その後にwill+動詞の原形。','Birinci şart cümlesi: eğer + geniş zaman, ardından gelecek zaman.','الشرط الأول: إن + مضارع بسيط، ثم سـ + فعل.','Первый условный: если + настоящее простое, потом will + 1-я форма глагола.'),award:'crucifix',next:'coach'},
coach:{img:'04_coach',pos:'left',kind:'question',q:3,k:T('MIDNIGHT COACH · NO DRIVER’S NAME','COCHE DE MEDIANOCHE · CONDUCTOR SIN NOMBRE','MITTERNACHTSKUTSCHE · FAHRER OHNE NAMEN','CARROSSE DE MINUIT · COCHER SANS NOM','CARROZZA NOTTURNA · COCCHIERE IGNOTO','COCHE DA MEIA-NOITE · CONDUTOR SEM NOME','NOCNY POWÓZ · WOŹNICA BEZ IMIENIA','午夜马车 · 车夫无名','真夜中の馬車 · 名もなき御者','GECE YARISI ARABASI · SÜRÜCÜNÜN ADI YOK','عربة منتصف الليل · سائق بلا اسم','ПОЛУНОЧНЫЙ ЭКИПАЖ · КУЧЕР БЕЗ ИМЕНИ'),title:T('COLLECTED IN DARKNESS','RECOGIDO EN LA OSCURIDAD','IN DER DUNKELHEIT ABGEHOLT','RECUEILLI DANS L\'OMBRE','RACCOLTO NELL\'OSCURITÀ','RECOLHIDO NA ESCURIDÃO','ZABRANY W CIEMNOŚCI','黑暗中的接应','闇の中で拾われて','KARANLIKTA ALINDI','اصطُحب في الظلام','ЗАБРАН ВО ТЬМЕ'),story:T('A black coach arrives exactly at midnight. Its driver wears a deep black hood over his hair and a black cloth across his mouth. Only an angular red-pale face and two blazing eyes remain visible.','Un coche negro llega exactamente a medianoche. Su conductor lleva una capucha negra sobre el pelo y una tela negra sobre la boca. Solo quedan visibles un rostro anguloso, rojo y pálido, y dos ojos ardientes.','Eine schwarze Kutsche kommt genau um Mitternacht. Der Fahrer trägt eine tiefschwarze Kapuze über dem Haar und ein schwarzes Tuch vor dem Mund. Nur ein kantiges, rötlich-blasses Gesicht und zwei glühende Augen bleiben sichtbar.','Un carrosse noir arrive exactement à minuit. Son cocher porte une capuche noire sur les cheveux et un tissu noir sur la bouche. Seuls un visage anguleux, rouge et pâle, et deux yeux ardents restent visibles.','Una carrozza nera arriva esattamente a mezzanotte. Il suo cocchiere indossa un cappuccio nero profondo sui capelli e un panno nero sulla bocca. Restano visibili solo un volto angoloso, rosso pallido, e due occhi ardenti.','Um coche negro chega exatamente à meia-noite. O condutor usa um capuz negro sobre o cabelo e um pano negro sobre a boca. Só ficam visíveis um rosto anguloso, vermelho-pálido, e dois olhos ardentes.','Czarny powóz przybywa dokładnie o północy. Jego woźnica ma na głowie głęboki czarny kaptur, a usta zasłonięte czarną tkaniną. Widać tylko kanciastą, czerwonawo-bladą twarz i dwoje płonących oczu.','一辆黑色马车正值午夜抵达。车夫头戴深黑色兜帽,嘴上蒙着黑布,唯有一张棱角分明、红白相间的脸和两只炽烈的眼睛露在外面。','漆黒の馬車が真夜中ぴったりに到着する。御者は髪に深い黒頭巾をかぶり、口には黒い布を巻いている。見えるのは角ばった赤白い顔と、燃えるような二つの目だけだ。','Tam gece yarısında siyah bir araba gelir. Sürücüsü saçlarının üzerinde koyu siyah bir kukuleta, ağzının üzerinde ise siyah bir bez taşır. Yalnızca köşeli, kızıl-solgun bir yüz ve alev alev yanan iki göz görünür.','تصل عربة سوداء عند منتصف الليل تماماً. يرتدي سائقها غطاء رأس أسود عميقاً فوق شعره وقطعة قماش سوداء على فمه. لا يظهر سوى وجه حاد أحمر شاحب وعينين متّقدتين.','Чёрный экипаж прибывает точно в полночь. Его возница носит глубокий чёрный капюшон на волосах и чёрную ткань поперёк рта. Видны лишь угловатое красновато-бледное лицо и два пылающих глаза.'),clue:T('The hooded coachman collected Jonathan. Focus on Jonathan, not the coachman.','El cochero encapuchado recogió a Jonathan. Concéntrate en Jonathan, no en el cochero.','Der vermummte Kutscher holte Jonathan ab. Konzentriere dich auf Jonathan, nicht auf den Kutscher.','Le cocher encapuchonné a recueilli Jonathan. Concentre-toi sur Jonathan, pas sur le cocher.','Il cocchiere incappucciato ha raccolto Jonathan. Concentrati su Jonathan, non sul cocchiere.','O cocheiro encapuzado recolheu Jonathan. Concentre-se em Jonathan, não no cocheiro.','Zakapturzony woźnica zabrał Jonathana. Skup się na Jonathanie, nie na woźnicy.','戴兜帽的车夫接走了乔纳森。请聚焦乔纳森,而非车夫。','頭巾の御者がジョナサンを拾った。御者ではなくジョナサンに焦点を当てよ。','Kukuletalı arabacı Jonathan\'ı aldı. Arabacıya değil, Jonathan\'a odaklan.','اصطحب السائق ذو الغطاء جوناثان. ركّز على جوناثان، لا على السائق.','Кучер в капюшоне забрал Джонатана. Сосредоточься на Джонатане, а не на кучере.'),prompt:T('Choose the correct PAST PASSIVE sentence.','Elige la oración correcta en PASIVA DEL PASADO.','Wähle den richtigen Satz im PASSIV DER VERGANGENHEIT.','Choisis la phrase correcte au PASSIF PASSÉ.','Scegli la frase corretta in PASSIVA DEL PASSATO.','Escolha a frase correta na PASSIVA DO PASSADO.','Wybierz poprawne zdanie w STRONIE BIERNEJ CZASU PRZESZŁEGO.','选出正确的过去时被动句。','正しい過去の受動態の文を選べ。','Doğru GEÇMİŞ ZAMAN PASİFİ cümlesini seç.','اختر الجملة الصحيحة في المبني للمجهول في الماضي.','Выбери верное предложение в ПАССИВЕ ПРОШЕДШЕГО.'),opts:[T('Jonathan collected at midnight.','Jonathan recogió a medianoche.','Jonathan holte um Mitternacht ab.','Jonathan a recueilli à minuit.','Jonathan raccolse a mezzanotte.','Jonathan recolhido à meia-noite.','Jonathan zabrał o północy.','乔纳森午夜接走。','ジョナサンは真夜中に拾った。','Jonathan gece yarısı aldı.','جوناثان اصطحب عند منتصف الليل.','Джонатан забрал в полночь.'),T('Jonathan is collected yesterday.','Jonathan es recogido ayer.','Jonathan wird gestern abgeholt.','Jonathan est recueilli hier.','Jonathan è raccolto ieri.','Jonathan é recolhido ontem.','Jonathan jest zabierany wczoraj.','乔纳森昨天被接走着。','ジョナサンは昨日拾われる。','Jonathan dün alınıyor.','جوناثان يُصطحب أمس.','Джонатан забирается вчера.'),T('Jonathan was collected at midnight.','Jonathan fue recogido a medianoche.','Jonathan wurde um Mitternacht abgeholt.','Jonathan a été recueilli à minuit.','Jonathan fu raccolto a mezzanotte.','Jonathan foi recolhido à meia-noite.','Jonathan został zabrany o północy.','乔纳森在午夜被接走了。','ジョナサンは真夜中に拾われた。','Jonathan gece yarısı alındı.','اصطُحب جوناثان عند منتصف الليل.','Джонатан был забран в полночь.')],answer:2,fb:T('Past passive: was/were + past participle.','Pasiva del pasado: fue/fueron + participio.','Passiv im Präteritum: wurde/wurden + Partizip II.','Passif passé : a été/ont été + participe passé.','Passiva del passato: fu/furono + participio.','Passiva do passado: foi/foram + particípio.','Bierna przeszła: został/została + III forma czasownika.','过去时被动:was/were + 过去分词。','過去の受動態:was/were+過去分詞。','Geçmiş zaman pasifi: was/were + geçmiş zaman ortacı.','مجهول الماضي: كان/كانت + التصريف الثالث.','Пассив прошедшего: was/were + 3-я форма глагола.'),next:'blue_fire'},
blue_fire:{img:'05_blue_fire',pos:'left',kind:'question',q:4,k:T('THE DEAD ROAD · BLUE FIRE','EL CAMINO MUERTO · FUEGO AZUL','DIE TOTE STRASSE · BLAUES FEUER','LA ROUTE MORTE · FEU BLEU','LA STRADA MORTA · FUOCO BLU','A ESTRADA MORTA · FOGO AZUL','MARTWY TRAKT · NIEBIESKI OGIEŃ','死亡之路 · 蓝色火焰','死者の道 · 青い炎','ÖLÜ YOL · MAVİ ATEŞ','الطريق الميت · النار الزرقاء','МЁРТВАЯ ДОРОГА · СИНИЙ ОГОНЬ'),title:T('A LAW OF THE MOUNTAINS','UNA LEY DE LAS MONTAÑAS','EIN GESETZ DER BERGE','UNE LOI DES MONTAGNES','UNA LEGGE DELLE MONTAGNE','UMA LEI DAS MONTANHAS','PRAWO GÓR','山中法则','山の掟','DAĞLARIN BİR YASASI','قانون الجبال','ЗАКОН ГОР'),story:T('Blue flames rise from forgotten graves. The coach stops, but the horses make no sound.','Llamas azules salen de tumbas olvidadas. El coche se detiene, pero los caballos no hacen ruido.','Blaue Flammen steigen aus vergessenen Gräbern. Die Kutsche hält, doch die Pferde geben keinen Laut von sich.','Des flammes bleues montent des tombes oubliées. Le carrosse s\'arrête ; les chevaux restent silencieux.','Fiamme blu si alzano da tombe dimenticate. La carrozza si ferma, ma i cavalli non fanno rumore.','Chamas azuis erguem-se de campas esquecidas. O coche para, mas os cavalos não fazem nenhum som.','Niebieskie płomienie unoszą się z zapomnianych grobów. Powóz się zatrzymuje, lecz konie nie wydają żadnego dźwięku.','蓝色的火焰从被遗忘的坟墓中升起。马车停了下来,但马匹却悄然无声。','忘れられた墓から青い炎が立ちのぼる。馬車は止まるが、馬たちは物音一つ立てない。','Mavi alevler unutulmuş mezarlardan yükselir. Araba durur, ama atlar hiç ses çıkarmaz.','ترتفع ألسنة نار زرقاء من قبور منسية. تتوقف العربة، لكن الخيول لا تصدر صوتاً.','Синие языки пламени поднимаются над забытыми могилами. Экипаж останавливается, но лошади не издают ни звука.'),clue:T('Local people say this always happens above buried treasure.','La gente local dice que esto siempre ocurre sobre un tesoro enterrado.','Die Menschen hier sagen, dass dies immer über einem vergrabenen Schatz geschieht.','Les gens disent que cela arrive toujours sur un trésor enterré.','La gente del posto dice che accade sempre sopra un tesoro sepolto.','Dizem que isto acontece sempre sobre um tesouro enterrado.','Miejscowi mówią, że zawsze dzieje się to nad zakopanym skarbem.','当地人说,这种现象总是出现在埋藏的宝藏之上。','地元の人々は、これは必ず埋蔵金の上で起こると言う。','Yerel halk bunun her zaman gömülü bir hazinenin üzerinde olduğunu söyler.','يقول أهل المنطقة إن هذا يحدث دائماً فوق كنز مدفون.','Местные говорят, что так всегда бывает над зарытым кладом.'),prompt:T('Choose the ZERO CONDITIONAL.','Elige el CONDICIONAL CERO.','Wähle den NULLTEN KONDITIONALSATZ.','Choisis le CONDITIONNEL ZÉRO.','Scegli il CONDIZIONALE ZERO.','Escolha o CONDICIONAL ZERO.','Wybierz ZEROWY OKRES WARUNKOWY.','选出零条件句。','ゼロ条件文を選べ。','SIFIR ŞART CÜMLESİ\'ni seç.','اختر الشرط الصفري.','Выбери НУЛЕВОЙ УСЛОВНЫЙ.'),opts:[T('If blue flames appeared, treasure would be below.','Si aparecieran llamas azules, habría un tesoro debajo.','Wenn blaue Flammen erschienen, wäre darunter ein Schatz.','Si des flammes bleues apparaissaient, un trésor serait dessous.','Se apparissero fiamme blu, ci sarebbe un tesoro sotto.','Se chamas azuis aparecessem, haveria um tesouro por baixo.','Gdyby pojawiły się niebieskie płomienie, skarb byłby poniżej.','如果出现了蓝色火焰,下面本会有宝藏。','もし青い炎が現れたら、下に宝があるだろう。','Mavi alevler belirseydi, altında hazine olurdu.','لو ظهرت نيران زرقاء، لكان هناك كنز في الأسفل.','Если бы синее пламя появилось, клад был бы внизу.'),T('When blue flames appear, treasure is buried below.','Cuando aparecen llamas azules, hay un tesoro enterrado debajo.','Wenn blaue Flammen erscheinen, ist darunter ein Schatz vergraben.','Quand des flammes bleues apparaissent, un trésor est enterré.','Quando appaiono fiamme blu, c\'è un tesoro sepolto sotto.','Quando chamas azuis aparecem, há um tesouro enterrado por baixo.','Kiedy pojawiają się niebieskie płomienie, skarb jest zakopany poniżej.','当蓝色火焰出现时,下面就埋着宝藏。','青い炎が現れるとき、下に宝が埋まっている。','Mavi alevler belirdiğinde, altında hazine gömülüdür.','عندما تظهر نيران زرقاء، يكون هناك كنز مدفون في الأسفل.','Когда появляется синее пламя, клад зарыт внизу.'),T('If blue flames will appear, treasure was below.','Si aparecerán llamas azules, había un tesoro debajo.','Wenn blaue Flammen erscheinen werden, war darunter ein Schatz.','Si des flammes bleues apparaîtront, un trésor était dessous.','Se appariranno fiamme blu, c\'era un tesoro sotto.','Se chamas azuis vão aparecer, havia um tesouro por baixo.','Jeśli niebieskie płomienie będą się pojawiać, skarb był poniżej.','如果蓝色火焰将会出现,下面曾经有宝藏。','もし青い炎がwill現れるなら、宝は下にあった。','Mavi alevler belirecekse, altında hazine vardı.','إن ستظهر نيران زرقاء، كان هناك كنز في الأسفل.','Если синее пламя появится, клад был внизу.')],answer:1,fb:T('Zero conditional describes a general rule: present + present.','El condicional cero describe una regla general: presente + presente.','Der nullte Konditionalsatz beschreibt eine Regel: Präsens + Präsens.','Le conditionnel zéro décrit une règle générale : présent + présent.','Il condizionale zero descrive una regola generale: presente + presente.','O condicional zero descreve uma regra geral: presente + presente.','Zerowy okres warunkowy opisuje ogólną zasadę: teraźniejszy + teraźniejszy.','零条件句描述普遍规律:现在时 + 现在时。','ゼロ条件文は一般的な規則を表す:現在形+現在形。','Sıfır şart cümlesi genel bir kuralı anlatır: geniş zaman + geniş zaman.','الشرط الصفري يصف قاعدة عامة: مضارع + مضارع.','Нулевой условный описывает общее правило: настоящее + настоящее.'),next:'choice1'},
choice1:{img:'06_choice1',pos:'center',kind:'choice',k:T('DECISION I · THE MOUNTAIN ROAD','DECISIÓN I · EL CAMINO DE MONTAÑA','ENTSCHEIDUNG I · DIE BERGSTRASSE','DÉCISION I · LA ROUTE DE MONTAGNE','DECISIONE I · LA STRADA DI MONTAGNA','DECISÃO I · A ESTRADA DA MONTANHA','DECYZJA I · GÓRSKI TRAKT','抉择一 · 山路','決断I · 山道','KARAR I · DAĞ YOLU','القرار الأول · طريق الجبل','РЕШЕНИЕ I · ГОРНАЯ ДОРОГА'),title:T('FIRE OR WOLVES?','¿FUEGO O LOBOS?','FEUER ODER WÖLFE?','FEU OU LOUPS ?','FUOCO O LUPI?','FOGO OU LOBOS?','OGIEŃ CZY WILKI?','火焰还是狼群?','炎か狼か?','ATEŞ Mİ, KURTLAR MI?','النار أم الذئاب؟','ОГОНЬ ИЛИ ВОЛКИ?'),story:T('The coach waits beside a fork. One path burns blue among the graves. The other climbs with the wolves.','El coche espera junto a una bifurcación. Un camino arde azul entre las tumbas. El otro sube con los lobos.','Die Kutsche wartet an einer Weggabelung. Ein Pfad brennt blau zwischen Gräbern. Der andere führt mit den Wölfen hinauf.','Le carrosse attend près d\'une bifurcation. Un chemin brûle en bleu parmi les tombes. L\'autre grimpe avec les loups.','La carrozza aspetta accanto a un bivio. Un sentiero arde blu tra le tombe. L\'altro sale insieme ai lupi.','O coche espera junto a uma bifurcação. Um caminho arde azul entre as campas. O outro sobe com os lobos.','Powóz czeka przy rozwidleniu. Jedna droga płonie niebiesko wśród grobów. Druga wspina się wraz z wilkami.','马车停在岔路口。一条小径在坟墓间燃着蓝焰,另一条则与狼群一同蜿蜒而上。','馬車は分かれ道で待つ。一方の道は墓の間で青く燃え、もう一方は狼とともに上る。','Araba bir yol ayrımında bekler. Bir yol, mezarlar arasında mavi yanar. Diğeri kurtlarla birlikte yükselir.','تنتظر العربة عند مفترق طرق. يشتعل أحد الطريقين أزرق بين القبور. أما الآخر فيصعد مع الذئاب.','Экипаж ждёт у развилки. Одна тропа горит синим среди могил. Другая поднимается вместе с волками.'),routes:[{name:T('FOLLOW THE BLUE FIRE','SEGUIR EL FUEGO AZUL','DEM BLAUEN FEUER FOLGEN','SUIVRE LE FEU BLEU','SEGUI IL FUOCO BLU','SEGUIR O FOGO AZUL','PODĄŻAJ ZA NIEBIESKIM OGNIEM','跟随蓝色火焰','青い炎を追う','MAVİ ATEŞİ TAKİP ET','اتبع النار الزرقاء','ИДТИ ЗА СИНИМ ОГНЁМ'),desc:T('Risk the graveyard and search for its secret.','Arriesga el cementerio y busca su secreto.','Riskiere den Friedhof und suche sein Geheimnis.','Risque le cimetière et cherche son secret.','Rischia il cimitero e cerca il suo segreto.','Arrisque o cemitério e procure o seu segredo.','Zaryzykuj wejście na cmentarz i poszukaj jego tajemnicy.','冒险闯入墓地,探寻其中秘密。','墓地の危険を冒し、その秘密を探る。','Mezarlığı göze al ve sırrını araştır.','جازف بدخول المقبرة وابحث عن سرّها.','Рискни зайти на кладбище и найди его тайну.'),target:'blue_treasure',route:'fire'},{name:T('STAY WITH THE COACH','QUEDARSE CON EL COCHE','BEI DER KUTSCHE BLEIBEN','RESTER AU CARROSSE','RESTA CON LA CARROZZA','FICAR COM O COCHE','ZOSTAŃ PRZY POWOZIE','留在马车旁','馬車にとどまる','ARABAYLA KAL','ابقَ مع العربة','ОСТАТЬСЯ С ЭКИПАЖЕМ'),desc:T('Face the wolf pack and study the driver.','Enfréntate a los lobos y observa al conductor.','Stelle dich dem Wolfsrudel und beobachte den Fahrer.','Affronte la meute de loups et observe le cocher.','Affronta i lupi e osserva il cocchiere.','Enfrente a matilha de lobos e observe o condutor.','Stań twarzą w twarz z wilkami i przyjrzyj się woźnicy.','直面狼群,细察车夫。','狼の群れに立ち向かい、御者を観察する。','Kurt sürüsüyle yüzleş ve sürücüyü incele.','واجه قطيع الذئاب وراقب السائق.','Встреть волчью стаю и присмотрись к вознице.'),target:'wolves',route:'wolves'}]},
blue_treasure:{img:'07_blue_treasure',pos:'left',kind:'question',q:5,k:T('ROUTE · GRAVE-FIRE','RUTA · FUEGO DE TUMBA','ROUTE · GRABFEUER','ROUTE · FEU DE TOMBE','VIA · FUOCO DI TOMBA','ROTA · FOGO DE CAMPA','TRASA · OGIEŃ GROBOWY','路线 · 坟墓之火','ルート · 墓の炎','ROTA · MEZAR ATEŞİ','المسار · نار القبر','ПУТЬ · МОГИЛЬНЫЙ ОГОНЬ'),title:T('CURIOSITY HAS TEETH','LA CURIOSIDAD TIENE DIENTES','NEUGIER HAT ZÄHNE','CURIOSITÉ A DES DENTS','LA CURIOSITÀ MORDE','CURIOSIDADE TEM DENTES','CIEKAWOŚĆ MA ZĘBY','好奇心的代价','好奇心には牙がある','MERAKIN DİŞLERİ VAR','للفضول أنياب','У ЛЮБОПЫТСТВА ЕСТЬ ЗУБЫ'),story:T('Jonathan leaves the coach. Wolves circle the grave while the blue fire opens an iron chest.','Jonathan sale del coche. Los lobos rodean la tumba mientras el fuego azul abre un cofre de hierro.','Jonathan verlässt die Kutsche. Wölfe umkreisen das Grab, während das blaue Feuer eine Eisentruhe öffnet.','Jonathan quitte le carrosse. Les loups encerclent la tombe tandis que le feu bleu ouvre un coffre de fer.','Jonathan lascia la carrozza. I lupi circondano la tomba mentre il fuoco blu apre un baule di ferro.','Jonathan sai do coche. Os lobos rodeiam a campa enquanto o fogo azul abre um baú de ferro.','Jonathan wysiada z powozu. Wilki krążą wokół grobu, podczas gdy niebieski ogień otwiera żelazną skrzynię.','乔纳森下了马车。狼群绕着坟墓打转,蓝色火焰揭开了一口铁箱。','ジョナサンは馬車を降りる。青い炎が鉄の箱を開ける間、狼たちが墓の周りを回る。','Jonathan arabadan iner. Mavi ateş demir bir sandığı açarken kurtlar mezarın etrafında döner.','يغادر جوناثان العربة. تحيط الذئاب بالقبر بينما تفتح النار الزرقاء صندوقاً حديدياً.','Джонатан выходит из экипажа. Волки кружат у могилы, пока синий огонь открывает железный сундук.'),clue:T('Imagine a less curious Jonathan. He would stay inside.','Imagina a un Jonathan menos curioso. Se quedaría dentro.','Stell dir einen weniger neugierigen Jonathan vor. Er würde drinnen bleiben.','Imagine un Jonathan moins curieux. Il resterait à l\'intérieur.','Immagina un Jonathan meno curioso. Resterebbe dentro.','Imagine um Jonathan menos curioso. Ele ficaria dentro.','Wyobraź sobie mniej ciekawskiego Jonathana. Zostałby w środku.','设想一个不那么好奇的乔纳森,他本会留在车里。','もっと好奇心の薄いジョナサンを想像せよ。彼なら中にとどまるだろう。','Daha az meraklı bir Jonathan hayal et. İçeride kalırdı.','تخيّل جوناثان أقل فضولاً. كان سيبقى في الداخل.','Представь менее любопытного Джонатана. Он остался бы внутри.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.','Choisis le DEUXIÈME CONDITIONNEL.','Scegli il SECONDO CONDIZIONALE.','Escolha o SEGUNDO CONDICIONAL.','Wybierz DRUGI OKRES WARUNKOWY.','选出第二条件句。','第二条件文を選べ。','İKİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثاني.','Выбери ВТОРОЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan were less curious, he would stay in the coach.','Si Jonathan fuera menos curioso, se quedaría en el coche.','Wenn Jonathan weniger neugierig wäre, würde er in der Kutsche bleiben.','Si Jonathan était moins curieux, il resterait dans le carrosse.','Se Jonathan fosse meno curioso, resterebbe in carrozza.','Se Jonathan fosse menos curioso, ficaria no coche.','Gdyby Jonathan był mniej ciekawski, zostałby w powozie.','如果乔纳森不那么好奇,他就会留在马车里。','もしジョナサンがもっと好奇心が薄ければ、馬車の中にとどまるだろう。','Jonathan daha az meraklı olsaydı, arabada kalırdı.','لو كان جوناثان أقل فضولاً، لبقي في العربة.','Если бы Джонатан был менее любопытен, он остался бы в экипаже.'),T('If Jonathan is less curious, he stayed in the coach.','Si Jonathan es menos curioso, se quedó en el coche.','Wenn Jonathan weniger neugierig ist, blieb er in der Kutsche.','Si Jonathan est moins curieux, il est resté dans le carrosse.','Se Jonathan è meno curioso, restò in carrozza.','Se Jonathan é menos curioso, ficou no coche.','Jeśli Jonathan jest mniej ciekawski, został w powozie.','如果乔纳森不那么好奇,他留在了马车里。','もしジョナサンが好奇心が薄いなら、彼は馬車にとどまった。','Jonathan daha az meraklıysa, arabada kaldı.','إن كان جوناثان أقل فضولاً، بقي في العربة.','Если Джонатан менее любопытен, он остался в экипаже.'),T('If Jonathan had been less curious, he stays in the coach.','Si Jonathan hubiera sido menos curioso, se queda en el coche.','Wenn Jonathan weniger neugierig gewesen wäre, bleibt er in der Kutsche.','Si Jonathan avait été moins curieux, il reste dans le carrosse.','Se Jonathan fosse stato meno curioso, resta in carrozza.','Se Jonathan tivesse sido menos curioso, fica no coche.','Gdyby Jonathan był mniej ciekawski wcześniej, zostaje w powozie.','如果乔纳森当初不那么好奇,他现在留在马车里。','もしジョナサンが好奇心が薄かったなら、彼は馬車にとどまる。','Jonathan daha az meraklı olmuş olsaydı, arabada kalıyor.','لو كان جوناثان قد صار أقل فضولاً، يبقى في العربة.','Если бы Джонатан был менее любопытным, он остаётся в экипаже.')],answer:0,fb:T('Second conditional: if + past form, then would + base verb.','Segundo condicional: si + pasado, después condicional.','Zweiter Konditionalsatz: if/wenn + Vergangenheitsform, dann would/würde + Grundform.','Deuxième conditionnel : si + passé, puis conditionnel.','Secondo condizionale: se + passato, poi condizionale.','Segundo condicional: se + passado, depois condicional.','Drugi okres warunkowy: jeśli + czas przeszły, potem tryb warunkowy.','第二条件句:if + 过去时形式,然后 would + 动词原形。','第二条件文:if+過去形、その後にwould+動詞の原形。','İkinci şart cümlesi: eğer + geçmiş zaman biçimi, ardından would + yalın fiil.','الشرط الثاني: إن + صيغة الماضي، ثم لـ + فعل.','Второй условный: если + прошедшее время, потом would + 1-я форма глагола.'),next:'blue_cross'},
blue_cross:{img:'08_blue_cross',pos:'right',kind:'question',q:6,k:T('ROUTE · THE BURIED OATH','RUTA · EL JURAMENTO ENTERRADO','ROUTE · DER BEGRABENE SCHWUR','ROUTE · LE SERMENT ENTERRÉ','VIA · IL GIURAMENTO SEPOLTO','ROTA · O JURAMENTO ENTERRADO','TRASA · ZAKOPANA PRZYSIĘGA','路线 · 埋藏的誓言','ルート · 埋もれた誓い','ROTA · GÖMÜLÜ YEMİN','المسار · القسم المدفون','ПУТЬ · ЗАРЫТАЯ КЛЯТВА'),title:T('WHO HID THE SILVER?','¿QUIÉN ESCONDIÓ LA PLATA?','WER VERSTECKTE DAS SILBER?','QUI A CACHÉ L\'ARGENT ?','CHI NASCOSE L\'ARGENTO?','QUEM ESCONDEU A PRATA?','KTO UKRYŁ SREBRO?','是谁藏起了银器?','誰が銀を隠したのか?','GÜMÜŞÜ KİM SAKLADI?','من أخفى الفضة؟','КТО СПРЯТАЛ СЕРЕБРО?'),story:T('The chest contains old silver and a soldier’s seal. The crucifix burns warm in Jonathan’s hand.','El cofre contiene plata antigua y el sello de un soldado. El crucifijo arde cálido en la mano de Jonathan.','Die Truhe enthält altes Silber und das Siegel eines Soldaten. Das Kruzifix wird warm in Jonathans Hand.','Le coffre contient de l\'argent ancien et le sceau d\'un soldat. Le crucifix chauffe dans la main de Jonathan.','Il baule contiene argento antico e il sigillo di un soldato. Il crocifisso arde caldo nella mano di Jonathan.','O baú contém prata antiga e o selo de um soldado. O crucifixo arde quente na mão de Jonathan.','Skrzynia zawiera stare srebro i pieczęć żołnierza. Krucyfiks pali ciepłem w dłoni Jonathana.','箱中装着古老的银器和一枚士兵的印信。十字架在乔纳森手中散发着暖意。','箱には古い銀と兵士の印章が入っている。十字架はジョナサンの手の中で温かく燃える。','Sandık eski gümüş ve bir askerin mührünü içerir. Haç, Jonathan\'ın elinde sıcacık yanar.','يحوي الصندوق فضة قديمة وختم جندي. يحترق الصليب دافئاً في يد جوناثان.','В сундуке старое серебро и печать солдата. Распятие тепло горит в руке Джонатана.'),clue:T('Forgotten soldiers hid the treasure centuries ago. Focus on the treasure.','Soldados olvidados escondieron el tesoro hace siglos. Concéntrate en el tesoro.','Vergessene Soldaten versteckten den Schatz vor Jahrhunderten. Konzentriere dich auf den Schatz.','Des soldats oubliés ont caché le trésor il y a des siècles. Pense au trésor.','Soldati dimenticati nascosero il tesoro secoli fa. Concentrati sul tesoro.','Soldados esquecidos esconderam o tesouro há séculos. Concentre-se no tesouro.','Zapomniani żołnierze ukryli skarb wieki temu. Skup się na skarbie.','几个世纪前,几名无人记得的士兵藏下了这批财宝。请聚焦财宝。','忘れられた兵士たちが何世紀も前に宝を隠した。宝に焦点を当てよ。','Unutulmuş askerler hazineyi yüzyıllar önce sakladı. Hazineye odaklan.','أخفى جنود منسيون الكنز منذ قرون. ركّز على الكنز.','Забытые солдаты спрятали клад века назад. Сосредоточься на кладе.'),prompt:T('Choose the correct PASSIVE sentence.','Elige la oración correcta en PASIVA.','Wähle den richtigen PASSIVSATZ.','Choisis la phrase correcte au PASSIF.','Scegli la frase corretta in PASSIVA.','Escolha a frase correta na PASSIVA.','Wybierz poprawne zdanie w STRONIE BIERNEJ.','选出正确的被动句。','正しい受動態の文を選べ。','Doğru PASİF cümleyi seç.','اختر الجملة الصحيحة في المبني للمجهول.','Выбери верное предложение в ПАССИВЕ.'),opts:[T('The treasure hidden forgotten soldiers.','El tesoro escondido soldados olvidados.','Der Schatz versteckt vergessene Soldaten.','Le trésor caché soldats oubliés.','Il tesoro nascosto soldati dimenticati.','O tesouro escondido soldados esquecidos.','Skarb ukryty zapomniani żołnierze.','财宝藏起无人记得的士兵。','宝は忘れられた兵士たち隠された。','Hazine unutulmuş askerler saklı.','الكنز مخفي جنود منسيون.','Клад спрятанный забытые солдаты.'),T('The treasure was hide by forgotten soldiers.','El tesoro fue esconder por soldados olvidados.','Der Schatz wurde von vergessenen Soldaten verstecken.','Le trésor a été cacher par des soldats oubliés.','Il tesoro fu nascondere da soldati dimenticati.','O tesouro foi esconder por soldados esquecidos.','Skarb był ukrywać przez zapomnianych żołnierzy.','财宝被无人记得的士兵藏。','宝は忘れられた兵士たちによって隠される。','Hazine unutulmuş askerler tarafından sakla oldu.','الكنز يُخفى من قِبل جنود منسيون.','Клад был прятать забытыми солдатами.'),T('The treasure was hidden by forgotten soldiers.','El tesoro fue escondido por soldados olvidados.','Der Schatz wurde von vergessenen Soldaten versteckt.','Le trésor a été caché par des soldats oubliés.','Il tesoro fu nascosto da soldati dimenticati.','O tesouro foi escondido por soldados esquecidos.','Skarb został ukryty przez zapomnianych żołnierzy.','财宝被无人记得的士兵藏了起来。','宝は忘れられた兵士たちによって隠された。','Hazine unutulmuş askerler tarafından saklandı.','الكنز أُخفي من قِبل جنود منسيون.','Клад был спрятан забытыми солдатами.')],answer:2,fb:T('Passive: was + hidden. The treasure receives the action.','Pasiva: fue + escondido. El tesoro recibe la acción.','Passiv: wurde + versteckt. Der Schatz erhält die Handlung.','Passif : a été + caché. Le trésor reçoit l\'action.','Passiva: fu + nascosto. Il tesoro riceve l\'azione.','Passiva: foi + escondido. O tesouro recebe a ação.','Strona bierna: został + ukryty. Skarb odbiera czynność.','被动语态:was + hidden。财宝是动作的承受者。','受動態:was+隠された(hidden)。宝が動作を受ける。','Pasif yapı: was + geçmiş zaman ortacı (saklandı). Hazine eylemi alır.','المبني للمجهول: أُخفي. الكنز هو من وقع عليه الفعل.','Пассив: was + hidden. Клад получает действие.'),evidence:1,next:'castle_gate'},
wolves:{img:'09_wolves',pos:'left',kind:'question',q:5,k:T('ROUTE · WOLF CIRCLE','RUTA · CÍRCULO DE LOBOS','ROUTE · WOLFSKREIS','ROUTE · CERCLE DE LOUPS','VIA · CERCHIO DI LUPI','ROTA · CÍRCULO DE LOBOS','TRASA · KRĄG WILKÓW','路线 · 狼群包围','ルート · 狼の輪','ROTA · KURT ÇEMBERİ','المسار · دائرة الذئاب','ПУТЬ · ВОЛЧИЙ КРУГ'),title:T('IF THEY COME CLOSER…','SI SE ACERCAN…','WENN SIE NÄHER KOMMEN…','S\'ILS S\'APPROCHENT…','SE SI AVVICINANO…','SE SE APROXIMAREM…','GDY PODEJDĄ BLIŻEJ…','若它们靠近……','もし近づいてきたら…','YAKLAŞIRLARSA…','إن اقتربت أكثر…','ЕСЛИ ОНИ ПОДОЙДУТ БЛИЖЕ…'),story:T('The wolves surround the coach. The black-hooded coachman raises one gloved hand, and the pack freezes. Above the cloth covering his mouth, his square red eyes burn in the dark.','Los lobos rodean el coche. El cochero de capucha negra levanta una mano enguantada y la manada se queda inmóvil. Sobre la tela que cubre su boca, sus ojos rojos y cuadrados arden en la oscuridad.','Die Wölfe umringen die Kutsche. Der schwarz vermummte Kutscher hebt eine behandschuhte Hand, und das Rudel erstarrt. Über dem Tuch vor seinem Mund glühen seine kantigen roten Augen in der Dunkelheit.','Les loups encerclent le carrosse. Le cocher à capuche noire lève une main gantée, et la meute se fige. Au-dessus du tissu qui couvre sa bouche, ses yeux rouges et carrés brûlent dans l\'obscurité.','I lupi circondano la carrozza. Il cocchiere dal cappuccio nero alza una mano guantata e il branco si blocca. Sopra il panno che gli copre la bocca, i suoi occhi rossi e squadrati ardono nel buio.','Os lobos rodeiam o coche. O cocheiro de capuz negro ergue uma mão enluvada, e a matilha imobiliza-se. Sobre o pano que cobre a boca, os seus olhos vermelhos e quadrados ardem na escuridão.','Wilki otaczają powóz. Woźnica w czarnym kapturze unosi jedną dłoń w rękawiczce, a stado zamiera w bezruchu. Nad tkaniną zasłaniającą usta jego kwadratowe czerwone oczy płoną w ciemności.','狼群包围了马车。戴黑色兜帽的车夫举起一只戴着手套的手,狼群顿时僵住不动。蒙布之上,那双方正的红色眼睛在黑暗中燃烧。','狼たちが馬車を取り囲む。黒頭巾の御者が手袋をした片手を上げると、群れは凍りつく。口を覆う布の上で、角ばった赤い目が闇の中で燃える。','Kurtlar arabayı kuşatır. Siyah kukuletalı arabacı eldivenli bir elini kaldırır ve sürü olduğu yerde donar. Ağzını örten bezin üzerinde, köşeli kızıl gözleri karanlıkta yanar.','تحاصر الذئاب العربة. يرفع السائق ذو الغطاء الأسود يداً بقفاز، فيتجمد القطيع. فوق القماش الذي يغطي فمه، تتّقد عيناه الحمراوان المربعتان في الظلام.','Волки окружают экипаж. Кучер в чёрном капюшоне поднимает руку в перчатке, и стая замирает. Над тканью, закрывающей его рот, во тьме горят его квадратные красные глаза.'),clue:T('Jonathan still has the crucifix. The danger is real and possible.','Jonathan todavía tiene el crucifijo. El peligro es real y posible.','Jonathan hat noch das Kruzifix. Die Gefahr ist real und möglich.','Jonathan a toujours le crucifix. Le danger est réel et possible.','Jonathan ha ancora il crocifisso. Il pericolo è reale e possibile.','Jonathan ainda tem o crucifixo. O perigo é real e possível.','Jonathan wciąż ma krucyfiks. Niebezpieczeństwo jest realne i możliwe.','乔纳森仍握着十字架。危险真实存在,且随时可能发生。','ジョナサンはまだ十字架を持っている。危険は現実的で起こりうる。','Jonathan hâlâ haçı taşıyor. Tehlike gerçek ve mümkün.','لا يزال الصليب مع جوناثان. الخطر حقيقي وممكن.','У Джонатана всё ещё есть распятие. Опасность реальна и возможна.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.','Choisis le PREMIER CONDITIONNEL.','Scegli il PRIMO CONDIZIONALE.','Escolha o PRIMEIRO CONDICIONAL.','Wybierz PIERWSZY OKRES WARUNKOWY.','选出第一条件句。','第一条件文を選べ。','BİRİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الأول.','Выбери ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If wolves came closer, Jonathan uses the cross.','Si los lobos se acercaran, Jonathan usa la cruz.','Wenn die Wölfe näher kämen, benutzt Jonathan das Kreuz.','Si les loups s\'approchaient, Jonathan utilise la croix.','Se i lupi si avvicinassero, Jonathan usa la croce.','Se os lobos se aproximassem, Jonathan usa a cruz.','Gdyby wilki podeszły bliżej, Jonathan używa krzyża.','如果狼群靠近了,乔纳森用十字架。','もし狼が近づいたら、ジョナサンは十字架を使う。','Kurtlar yaklaşsaydı, Jonathan haçı kullanır.','لو اقتربت الذئاب، يستخدم جوناثان الصليب.','Если бы волки подошли ближе, Джонатан использует крест.'),T('If the wolves come closer, Jonathan will use the cross.','Si los lobos se acercan, Jonathan usará la cruz.','Wenn die Wölfe näher kommen, wird Jonathan das Kreuz benutzen.','Si les loups s\'approchent, Jonathan utilisera la croix.','Se i lupi si avvicinano, Jonathan userà la croce.','Se os lobos se aproximarem, Jonathan vai usar a cruz.','Jeśli wilki podejdą bliżej, Jonathan użyje krzyża.','如果狼群靠近,乔纳森就会用十字架。','もし狼が近づいてきたら、ジョナサンは十字架を使うだろう。','Kurtlar yaklaşırsa, Jonathan haçı kullanacak.','إن اقتربت الذئاب أكثر، سيستخدم جوناثان الصليب.','Если волки подойдут ближе, Джонатан использует крест.'),T('If the wolves had come closer, Jonathan will use the cross.','Si los lobos se hubieran acercado, Jonathan usará la cruz.','Wenn die Wölfe näher gekommen wären, wird Jonathan das Kreuz benutzen.','Si les loups s\'étaient approchés, Jonathan utilisera la croix.','Se i lupi si fossero avvicinati, Jonathan userà la croce.','Se os lobos se tivessem aproximado, Jonathan vai usar a cruz.','Gdyby wilki podeszły bliżej, Jonathan użyje krzyża.','如果狼群当初靠近了,乔纳森将会用十字架。','もし狼が近づいていたら、ジョナサンは十字架を使うだろう。','Kurtlar yaklaşmış olsaydı, Jonathan haçı kullanacak.','لو كانت الذئاب قد اقتربت أكثر، سيستخدم جوناثان الصليب.','Если бы волки подошли ближе, Джонатан использует крест.')],answer:1,fb:T('A real future possibility uses if + present, then will + verb.','Una posibilidad futura real usa si + presente, después futuro.','Eine reale Zukunftsmöglichkeit nutzt wenn + Präsens, dann wird + Verb.','Une possibilité future réelle utilise si + présent, puis futur.','Una possibilità futura reale usa se + presente, poi futuro.','Uma possibilidade futura real usa se + presente, depois futuro.','Realna możliwość w przyszłości używa: jeśli + czas teraźniejszy, potem czas przyszły.','真实的未来可能性用 if + 现在时,然后 will + 动词。','現実的な未来の可能性はif+現在形、その後will+動詞を使う。','Gerçek bir gelecek olasılığı eğer + geniş zaman, ardından will + fiil kullanır.','الاحتمال المستقبلي الحقيقي يستخدم إن + مضارع، ثم سـ + فعل.','Реальная возможность в будущем: если + настоящее, потом will + глагол.'),next:'coach_rescue'},
coach_rescue:{img:'10_coach_rescue',pos:'left',kind:'question',q:6,k:T('ROUTE · FOOTPRINTS OF NOBODY','RUTA · HUELLAS DE NADIE','ROUTE · SPUREN VON NIEMANDEM','ROUTE · TRACES DE PERSONNE','VIA · IMPRONTE DI NESSUNO','ROTA · PEGADAS DE NINGUÉM','TRASA · ŚLADY NICZYJE','路线 · 无人的脚印','ルート · 誰でもない足跡','ROTA · KİMSENİN AYAK İZLERİ','المسار · آثار أقدام لا أحد','ПУТЬ · СЛЕДЫ НИКОГО'),title:T('THE PACK OBEYS','LA MANADA OBEDECE','DAS RUDEL GEHORCHT','LA MEUTE OBÉIT','BRANCO OBBEDISCE','A MATILHA OBEDECE','STADO SŁUCHA','狼群听命','群れは従う','SÜRÜ İTAAT EDER','القطيع يطيع','СТАЯ ПОВИНУЕТСЯ'),story:T('The wolves retreat at one gesture from the black-robed coachman. Fresh snow lies around him, but his boots have left no footprints. His hood and face covering cannot hide those red eyes.','Los lobos se retiran con un gesto del cochero vestido de negro. Hay nieve fresca a su alrededor, pero sus botas no han dejado huellas. La capucha y la tela sobre su rostro no pueden ocultar esos ojos rojos.','Mit einer Geste des schwarz gekleideten Kutschers ziehen sich die Wölfe zurück. Frischer Schnee liegt um ihn, doch seine Stiefel haben keine Spuren hinterlassen. Kapuze und Gesichtstuch können diese roten Augen nicht verbergen.','Les loups reculent au moindre geste du cocher vêtu de noir. De la neige fraîche l\'entoure, mais ses bottes n\'ont laissé aucune trace. Sa capuche et le tissu sur son visage ne peuvent cacher ces yeux rouges.','I lupi si ritirano a un gesto del cocchiere vestito di nero. C\'è neve fresca intorno a lui, ma i suoi stivali non hanno lasciato impronte. Il cappuccio e il panno sul volto non possono nascondere quegli occhi rossi.','Os lobos recuam com um gesto do cocheiro vestido de negro. Há neve fresca à sua volta, mas as suas botas não deixaram pegadas. O capuz e o pano no rosto não conseguem esconder aqueles olhos vermelhos.','Wilki wycofują się na jeden gest woźnicy odzianego na czarno. Wokół niego leży świeży śnieg, lecz jego buty nie zostawiły żadnych śladów. Kaptur i zasłona na twarzy nie mogą ukryć tych czerwonych oczu.','黑袍车夫一个手势,狼群便退去了。他周身覆着新雪,靴子却未留下一丝脚印。兜帽与蒙面布也遮不住那双红色的眼睛。','黒衣の御者が一つ身振りをすると、狼たちは退く。彼の周りには新雪が積もっているのに、ブーツは足跡一つ残していない。頭巾と口の布も、あの赤い目を隠すことはできない。','Kurtlar, siyah cüppeli arabacının tek bir işaretiyle geri çekilir. Çevresinde taze kar vardır, ama çizmeleri hiç iz bırakmamıştır. Kukuletası ve yüzünü örten bez, o kızıl gözleri gizleyemez.','تتراجع الذئاب بإشارة واحدة من السائق ذي الرداء الأسود. ثلج طازج يحيط به، لكن حذاءه لم يترك أثراً. لا يستطيع غطاء رأسه وقناع وجهه إخفاء تلك العينين الحمراوين.','Волки отступают по одному жесту кучера в чёрном одеянии. Вокруг него лежит свежий снег, но его сапоги не оставили следов. Капюшон и ткань на лице не могут скрыть эти красные глаза.'),clue:T('The coachman controls the wolves. Put the wolves first.','El cochero controla a los lobos. Pon a los lobos primero.','Der Kutscher kontrolliert die Wölfe. Stelle die Wölfe an den Anfang.','Le cocher contrôle les loups. Mets les loups en premier.','Il cocchiere controlla i lupi. Metti i lupi per primi.','O cocheiro controla os lobos. Ponha os lobos primeiro.','Woźnica kontroluje wilki. Postaw wilki na pierwszym miejscu.','车夫操控着狼群。请把狼群放在前面。','御者が狼を操っている。狼を先に置け。','Arabacı kurtları kontrol eder. Önce kurtları söyle.','يتحكم السائق في الذئاب. ضع الذئاب أولاً.','Кучер управляет волками. Поставь волков на первое место.'),prompt:T('Choose the correct PASSIVE sentence.','Elige la oración correcta en PASIVA.','Wähle den richtigen PASSIVSATZ.','Choisis la phrase correcte au PASSIF.','Scegli la frase corretta in PASSIVA.','Escolha a frase correta na PASSIVA.','Wybierz poprawne zdanie w STRONIE BIERNEJ.','选出正确的被动句。','正しい受動態の文を選べ。','Doğru PASİF cümleyi seç.','اختر الجملة الصحيحة في المبني للمجهول.','Выбери верное предложение в ПАССИВЕ.'),opts:[T('The wolves are controlled by the coachman.','Los lobos son controlados por el cochero.','Die Wölfe werden vom Kutscher kontrolliert.','Les loups sont contrôlés par le cocher.','I lupi sono controllati dal cocchiere.','Os lobos são controlados pelo cocheiro.','Wilki są kontrolowane przez woźnicę.','狼群被车夫操控着。','狼たちは御者によって操られている。','Kurtlar arabacı tarafından kontrol edilir.','يُسيطَر على الذئاب من قِبل السائق.','Волки контролируются кучером.'),T('The wolves control by the coachman.','Los lobos controlan por el cochero.','Die Wölfe kontrollieren vom Kutscher.','Les loups contrôlent par le cocher.','I lupi controllano dal cocchiere.','Os lobos controlam pelo cocheiro.','Wilki kontrolują przez woźnicę.','狼群操控被车夫。','狼たちは御者によって操る。','Kurtlar arabacı tarafından kontrol eder.','الذئاب تسيطر من قِبل السائق.','Волки контролируют кучером.'),T('The wolves were controlling the coachman.','Los lobos estaban controlando al cochero.','Die Wölfe kontrollierten den Kutscher.','Les loups contrôlaient le cocher.','I lupi stavano controllando il cocchiere.','Os lobos estavam a controlar o cocheiro.','Wilki kontrolowały woźnicę.','狼群曾操控着车夫。','狼たちは御者を操っていた。','Kurtlar arabacıyı kontrol ediyordu.','كانت الذئاب تسيطر على السائق.','Волки контролировали кучера.')],answer:0,fb:T('Present passive: are + controlled.','Pasiva del presente: son + controlados.','Passiv im Präsens: werden + kontrolliert.','Passif présent : sont + contrôlés.','Passiva del presente: sono + controllati.','Passiva do presente: são + controlados.','Bierna teraźniejsza: są + kontrolowane.','现在时被动:are + controlled。','現在の受動態:are+操られる(controlled)。','Şimdiki zaman pasifi: are + ortaç.','المبني للمجهول في المضارع: يُسيطَر على.','Пассив настоящего: are + controlled.'),evidence:1,next:'castle_gate'},
castle_gate:{img:'11_castle_gate',pos:'left',kind:'question',q:7,k:T('CASTLE DRACULA · THE THRESHOLD','CASTILLO DE DRÁCULA · EL UMBRAL','SCHLOSS DRACULA · DIE SCHWELLE','CHÂTEAU DE DRACULA · LE SEUIL','CASTELLO DRACULA · LA SOGLIA','CASTELO DE DRÁCULA · A SOLEIRA','ZAMEK DRAKULI · PRÓG','德古拉城堡 · 门槛','ドラキュラ城 · 敷居','DRAKULA ŞATOSU · EŞİK','قلعة دراكولا · العتبة','ЗАМОК ДРАКУЛЫ · ПОРОГ'),title:T('OPENED BY NO ONE','ABIERTO POR NADIE','VON NIEMANDEM GEÖFFNET','OUVERT PAR PERSONNE','APERTO DA NESSUNO','ABERTO POR NINGUÉM','OTWARTA PRZEZ NIKOGO','无人开启','誰にも開けられずに','FAİLSİZ AÇILIŞ','فُتح بلا أحد','ОТКРЫТЫ НИКЕМ'),story:T('The iron gate opens by itself. Dracula waits beyond it with a single candle.','La puerta de hierro se abre sola. Drácula espera detrás con una sola vela.','Das Eisentor öffnet sich von selbst. Dracula wartet dahinter mit einer einzigen Kerze.','Le portail de fer s\'ouvre tout seul. Dracula attend derrière avec une seule bougie.','Il cancello di ferro si apre da solo. Dracula aspetta oltre con una sola candela.','O portão de ferro abre-se sozinho. Drácula espera do outro lado com uma única vela.','Żelazna brama otwiera się sama. Drakula czeka za nią z jedną świecą.','铁门自行打开。德古拉手持一支蜡烛,在门后等候。','鉄の門がひとりでに開く。その向こうでドラキュラが一本の蝋燭を手に待っている。','Demir kapı kendiliğinden açılır. Drakula, ardında tek bir mumla bekler.','تُفتح البوابة الحديدية من تلقاء نفسها. ينتظر دراكولا خلفها بشمعة واحدة.','Железные ворота открываются сами. За ними Дракула ждёт с одинокой свечой.'),clue:T('No servant touches the gate. Focus on what happened to it.','Ningún sirviente toca la puerta. Concéntrate en lo que le ocurrió.','Kein Diener berührt das Tor. Konzentriere dich darauf, was mit ihm geschah.','Aucun serviteur ne touche le portail. Pense à ce qui lui est arrivé.','Nessun servitore tocca il cancello. Concentrati su cosa gli accadde.','Nenhum criado toca no portão. Concentre-se no que lhe aconteceu.','Żaden sługa nie dotyka bramy. Skup się na tym, co się z nią stało.','没有仆人碰过这扇门。请聚焦它本身发生了什么。','どの召使いも門に触れていない。門に何が起きたかに焦点を当てよ。','Hiçbir hizmetçi kapıya dokunmaz. Kapıya ne olduğuna odaklan.','لا يلمس أي خادم البوابة. ركّز على ما حدث لها.','Ни один слуга не касается ворот. Сосредоточься на том, что с ними произошло.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.','Choisis le PASSIF PASSÉ correct.','Scegli PASSIVA DEL PASSATO corretta.','Escolha a PASSIVA DO PASSADO correta.','Wybierz poprawną STRONĘ BIERNĄ CZASU PRZESZŁEGO.','选出正确的过去时被动句。','正しい過去の受動態を選べ。','Doğru GEÇMİŞ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في الماضي الصحيح.','Выбери верный ПАССИВ ПРОШЕДШЕГО.'),opts:[T('The gate opened a servant.','La puerta abrió a un sirviente.','Das Tor öffnete einen Diener.','Le portail ouvrit un serviteur.','Il cancello aprì un servitore.','O portão abriu um criado.','Brama otworzyła sługę.','大门打开了一名仆人。','門は召使いを開けた。','Kapı bir hizmetçiyi açtı.','فتحت البوابة خادماً.','Ворота открыли слугу.'),T('The gate is opened last night.','La puerta es abierta anoche.','Das Tor wird letzte Nacht geöffnet.','Le portail est ouvert hier soir.','Il cancello è aperto ieri notte.','O portão é aberto ontem à noite.','Brama jest otwarta zeszłej nocy.','大门昨晚被打开着。','門は昨夜開けられる。','Kapı dün gece açılıyor.','البوابة تُفتح الليلة الماضية.','Ворота открываются прошлой ночью.'),T('The gate was opened without a servant.','La puerta fue abierta sin un sirviente.','Das Tor wurde ohne einen Diener geöffnet.','Le portail a été ouvert sans serviteur.','Il cancello fu aperto senza un servitore.','O portão foi aberto sem nenhum criado.','Brama została otwarta bez sługi.','大门没有仆人的帮助便被打开了。','門は召使いなしに開けられた。','Kapı bir hizmetçi olmadan açıldı.','فُتحت البوابة بلا خادم.','Ворота были открыты без слуги.')],answer:2,fb:T('Was opened is the past passive. The unknown agent increases the mystery.','Fue abierta es la pasiva del pasado. El agente desconocido aumenta el misterio.','Wurde geöffnet ist das Passiv der Vergangenheit. Der unbekannte Handelnde macht es geheimnisvoller.','A été ouvert est le passif passé. L\'agent inconnu accroît le mystère.','Fu aperto è la passiva del passato. L\'agente sconosciuto aumenta il mistero.','Foi aberto é a passiva do passado. O agente desconhecido aumenta o mistério.','Została otwarta to strona bierna czasu przeszłego. Nieznany sprawca potęguje tajemnicę.','was opened 是过去时被动。未知的施动者让谜团更深。','was openedが過去の受動態。動作主が不明であることが謎を深める。','Was opened (açıldı), geçmiş zaman pasifidir. Bilinmeyen fail, gizemi artırır.','"فُتحت" هي المبني للمجهول في الماضي. الفاعل المجهول يزيد الغموض.','Was opened — это пассив прошедшего. Неизвестный исполнитель усиливает тайну.'),next:'dinner'},
dinner:{img:'12_dinner',pos:'left',kind:'question',q:8,k:T('CASTLE DRACULA · DINNER','CASTILLO DE DRÁCULA · CENA','SCHLOSS DRACULA · ABENDESSEN','CHÂTEAU DE DRACULA · DÎNER','CASTELLO DRACULA · CENA','CASTELO DE DRÁCULA · JANTAR','ZAMEK DRAKULI · KOLACJA','德古拉城堡 · 晚餐','ドラキュラ城 · 夕食','DRAKULA ŞATOSU · AKŞAM YEMEĞİ','قلعة دراكولا · العشاء','ЗАМОК ДРАКУЛЫ · УЖИН'),title:T('THE HOST DOES NOT EAT','EL ANFITRIÓN NO COME','DER GASTGEBER ISST NICHT','L\'HÔTE NE MANGE PAS','L\'ANFITRIONE NON MANGIA','O ANFITRIÃO NÃO COME','GOSPODARZ NIE JE','主人不曾进食','主人は食べない','EV SAHİBİ YEMEK YEMİYOR','المضيف لا يأكل','ХОЗЯИН НЕ ЕСТ'),story:T('Jonathan eats before a roaring fire. Dracula watches from an empty place and never touches food.','Jonathan come ante un gran fuego. Drácula observa desde un sitio vacío y nunca toca la comida.','Jonathan isst vor einem lodernden Feuer. Dracula beobachtet ihn von einem leeren Platz und berührt kein Essen.','Jonathan mange devant un grand feu. Dracula observe depuis une place vide et ne touche jamais à la nourriture.','Jonathan mangia davanti a un grande fuoco. Dracula osserva da un posto vuoto e non tocca mai il cibo.','Jonathan janta diante de um fogo intenso. Drácula observa de um lugar vazio e nunca toca na comida.','Jonathan je przy huczącym ogniu. Drakula obserwuje z pustego miejsca i nigdy nie dotyka jedzenia.','乔纳森在熊熊炉火前用餐。德古拉坐在空位上注视着他,从未碰过食物。','ジョナサンは勢いよく燃える暖炉の前で食事をする。ドラキュラは空いた席から見つめ、食べ物には決して手を触れない。','Jonathan, harıl harıl yanan bir ateşin önünde yemek yer. Drakula boş bir yerden izler ve yemeğe hiç dokunmaz.','يأكل جوناثان أمام نار مشتعلة. يراقب دراكولا من مكان خالٍ ولا يلمس الطعام أبداً.','Джонатан ужинает у ревущего камина. Дракула наблюдает с пустого места и никогда не притрагивается к еде.'),clue:T('Dracula puts the meal on the table. He performs the action.','Drácula pone la comida en la mesa. Él realiza la acción.','Dracula stellt das Essen auf den Tisch. Er führt die Handlung aus.','Dracula met le repas sur la table. Il réalise l\'action.','Dracula mette il pasto sul tavolo. Lui compie l\'azione.','Drácula põe a refeição na mesa. Ele realiza a ação.','Drakula stawia posiłek na stole. To on wykonuje czynność.','德古拉把饭菜摆上餐桌,是他执行了这个动作。','ドラキュラが食事をテーブルに置く。彼が動作を行っている。','Drakula yemeği masaya koyar. Eylemi o gerçekleştirir.','يضع دراكولا الطعام على المائدة. هو من يقوم بالفعل.','Дракула ставит еду на стол. Он выполняет действие.'),prompt:T('Which sentence is ACTIVE?','¿Qué oración está en ACTIVA?','Welcher Satz steht im AKTIV?','Quelle phrase est ACTIVE ?','Quale frase è in ATTIVA?','Qual frase está na ATIVA?','Które zdanie jest w STRONIE CZYNNEJ?','哪句是主动语态?','能動態の文はどれか?','Hangi cümle AKTİF\'tir?','أي جملة في المبني للمعلوم؟','Какое предложение — АКТИВ?'),opts:[T('Dracula served Jonathan dinner.','Drácula sirvió la cena a Jonathan.','Dracula servierte Jonathan das Abendessen.','Dracula a servi le dîner à Jonathan.','Dracula servì la cena a Jonathan.','Drácula serviu o jantar a Jonathan.','Drakula podał Jonathanowi kolację.','德古拉为乔纳森端上了晚餐。','ドラキュラはジョナサンに夕食を出した。','Drakula, Jonathan\'a akşam yemeği servis etti.','قدّم دراكولا العشاء لجوناثان.','Дракула подал Джонатану ужин.'),T('Dinner was served to Jonathan.','La cena fue servida a Jonathan.','Das Abendessen wurde Jonathan serviert.','Le dîner a été servi à Jonathan.','La cena fu servita a Jonathan.','O jantar foi servido a Jonathan.','Kolacja została podana Jonathanowi.','晚餐被端给了乔纳森。','夕食はジョナサンに出された。','Akşam yemeği Jonathan\'a servis edildi.','قُدّم العشاء لجوناثان.','Ужин был подан Джонатану.'),T('Jonathan was watched by Dracula.','Jonathan fue observado por Drácula.','Jonathan wurde von Dracula beobachtet.','Jonathan a été observé par Dracula.','Jonathan fu osservato da Dracula.','Jonathan foi observado por Drácula.','Jonathan był obserwowany przez Drakulę.','乔纳森被德古拉注视着。','ジョナサンはドラキュラに見つめられた。','Jonathan, Drakula tarafından izlendi.','رُوقب جوناثان من قِبل دراكولا.','Джонатан был под наблюдением Дракулы.')],answer:0,fb:T('Dracula is the subject and performs the action: active voice.','Drácula es el sujeto y realiza la acción: voz activa.','Dracula ist das Subjekt und führt die Handlung aus: Aktiv.','Dracula est le sujet et réalise l\'action : voix active.','Dracula è il soggetto e compie l\'azione: voce attiva.','Drácula é o sujeito e realiza a ação: voz ativa.','Drakula jest podmiotem i wykonuje czynność: strona czynna.','德古拉是主语,执行了动作:主动语态。','ドラキュラが主語で動作を行っている:能動態。','Drakula öznedir ve eylemi gerçekleştirir: aktif çatı.','دراكولا هو الفاعل ومن يقوم بالفعل: المبني للمعلوم.','Дракула — подлежащее и выполняет действие: активный залог.'),next:'mirror'},
mirror:{img:'13_mirror',pos:'left',kind:'question',q:9,k:T('CASTLE DRACULA · MORNING','CASTILLO DE DRÁCULA · MAÑANA','SCHLOSS DRACULA · MORGEN','CHÂTEAU DE DRACULA · MATIN','CASTELLO DRACULA · MATTINO','CASTELO DE DRÁCULA · MANHÃ','ZAMEK DRAKULI · PORANEK','德古拉城堡 · 清晨','ドラキュラ城 · 朝','DRAKULA ŞATOSU · SABAH','قلعة دراكولا · الصباح','ЗАМОК ДРАКУЛЫ · УТРО'),title:T('THE MISSING REFLECTION','EL REFLEJO AUSENTE','DAS FEHLENDE SPIEGELBILD','LE REFLET ABSENT','IL RIFLESSO ASSENTE','O REFLEXO AUSENTE','ZAGINIONE ODBICIE','消失的倒影','消えた鏡像','KAYIP YANSIMA','الانعكاس الغائب','ПРОПАВШЕЕ ОТРАЖЕНИЕ'),story:T('Dracula stands behind Jonathan, but the mirror reflects only one man. Then a red hand strikes the glass.','Drácula está detrás de Jonathan, pero el espejo refleja solo a un hombre. Entonces una mano roja golpea el cristal.','Dracula steht hinter Jonathan, doch der Spiegel zeigt nur einen Mann. Dann schlägt eine rote Hand gegen das Glas.','Dracula se tient derrière Jonathan, mais le miroir reflète un seul homme. Puis une main rouge frappe le verre.','Dracula sta dietro Jonathan, ma lo specchio riflette solo un uomo. Poi una mano rossa colpisce il vetro.','Drácula está atrás de Jonathan, mas o espelho reflete apenas um homem. Depois, uma mão vermelha bate no vidro.','Drakula stoi za Jonathanem, lecz lustro odbija tylko jednego mężczyznę. Wtedy czerwona dłoń uderza w szkło.','德古拉站在乔纳森身后,镜中却只映出一人。忽然,一只赤红的手击碎了镜面。','ドラキュラがジョナサンの背後に立つが、鏡には一人の男しか映らない。そして赤い手が鏡を打ち砕く。','Drakula, Jonathan\'ın arkasında durur, ama ayna yalnızca tek bir adamı yansıtır. Sonra kızıl bir el cama vurur.','يقف دراكولا خلف جوناثان، لكن المرآة تعكس رجلاً واحداً فقط. ثم تضرب يد حمراء الزجاج.','Дракула стоит позади Джонатана, но зеркало отражает только одного человека. Затем красная рука бьёт по стеклу.'),clue:T('Dracula smashed the mirror. Put the mirror first.','Drácula rompió el espejo. Pon el espejo primero.','Dracula zerbrach den Spiegel. Stelle den Spiegel an den Anfang.','Dracula a brisé le miroir. Mets le mir
