:root{--blood:#d21f3c;--deep:#16040a;--bone:#f5ead7;--ice:#a7ddf2;--gold:#f0c878;--muted:#c8b9ad;--shadow:#3c1a66}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050306;color:var(--bone);font-family:"Courier New",Courier,monospace}
button{font:inherit}.game{position:fixed;inset:0;background:#050306}.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
.shade{position:absolute;inset:0;pointer-events:none}.frame.left .shade{background:linear-gradient(90deg,rgba(5,3,7,.91) 0%,rgba(5,3,7,.73) 34%,rgba(5,3,7,.14) 57%,transparent 70%)}
.frame.right .shade{background:linear-gradient(270deg,rgba(5,3,7,.91) 0%,rgba(5,3,7,.73) 34%,rgba(5,3,7,.14) 57%,transparent 70%)}
.frame.center .shade{background:linear-gradient(180deg,rgba(5,3,7,.83) 0%,rgba(5,3,7,.42) 35%,transparent 63%)}
.hud{position:absolute;z-index:5;top:1.4cqw;left:1.5cqw;right:1.5cqw;display:flex;align-items:center;justify-content:space-between;gap:1cqw;pointer-events:none}
.hud-group{display:flex;gap:.55cqw;align-items:center;flex-wrap:wrap}.badge{background:rgba(8,4,9,.78);border:1px solid rgba(245,234,215,.34);box-shadow:0 0 1.3cqw rgba(0,0,0,.55);padding:.48cqw .72cqw;font-size:1.05cqw;letter-spacing:.04em;white-space:nowrap}.badge b{color:var(--gold)}
.langs{display:flex;gap:.35cqw;pointer-events:auto}.lang-btn,.utility{border:1px solid rgba(245,234,215,.35);color:var(--bone);background:rgba(8,4,9,.78);padding:.48cqw .68cqw;cursor:pointer;font-size:1cqw}.lang-btn.active{color:#fff;background:var(--blood);border-color:#ff7186}.utility:hover,.lang-btn:hover{border-color:var(--bone)}
.content{position:absolute;z-index:4;top:10%;bottom:6%;width:46%;display:flex;flex-direction:column;justify-content:center;gap:.78cqw;overflow:auto;scrollbar-width:thin;padding:1.15cqw 1.3cqw;background:rgba(7,3,8,.34);border:1px solid rgba(245,234,215,.13);box-shadow:0 1.4cqw 4cqw rgba(0,0,0,.38);backdrop-filter:blur(2px)}
.left .content{left:2.2%;text-align:left}.right .content{right:2.2%;text-align:right}.center .content{top:8%;bottom:auto;left:50%;transform:translateX(-50%);width:64%;max-height:78%;text-align:center}
.kicker{color:#ff8ea0;font-weight:700;font-size:1.15cqw;letter-spacing:.14em;text-transform:uppercase}.title{margin:0;color:var(--gold);font-family:'Pixelify Sans','Courier New',monospace;font-size:3.6cqw;line-height:1.08;letter-spacing:0;text-shadow:-.05em 0 0 var(--shadow),.05em 0 0 var(--shadow),0 -.05em 0 var(--shadow),0 .05em 0 var(--shadow),-.05em -.05em 0 var(--shadow),.05em -.05em 0 var(--shadow),-.05em .05em 0 var(--shadow),.05em .05em 0 var(--shadow),0 0 .6em rgba(60,26,102,.75)}.story{font-size:1.36cqw;line-height:1.34;font-weight:700}.clue{border-left:.28cqw solid var(--blood);padding:.65cqw .8cqw;background:rgba(99,6,22,.4);font-size:1.13cqw;line-height:1.28}.right .clue{border-left:0;border-right:.28cqw solid var(--blood)}.center .clue{border-right:.28cqw solid var(--blood)}
.prompt{color:var(--ice);font-weight:700;font-size:1.35cqw;line-height:1.24}.translation{display:block;color:#e5d3c6;font-size:.92cqw;line-height:1.28;margin-top:.2cqw;font-style:italic}.title .translation{font-size:1.05cqw;letter-spacing:0;color:#f0d8dd;margin-top:.4cqw;font-family:"Courier New",Courier,monospace}.kicker .translation{font-size:.78cqw;letter-spacing:.05em;color:#e5d3c6}
.options{display:grid;gap:.52cqw;margin-top:.15cqw}.option{display:grid;grid-template-columns:2.2cqw 1fr;align-items:center;gap:.55cqw;width:100%;border:1px solid rgba(245,234,215,.36);background:rgba(9,4,10,.77);color:var(--bone);padding:.62cqw .72cqw;text-align:left;cursor:pointer;font-size:1.04cqw;line-height:1.22;transition:.16s}.option:hover{transform:translateY(-1px);border-color:#fff;background:rgba(60,9,21,.9)}.option .key{display:grid;place-items:center;width:2cqw;height:2cqw;border:1px solid rgba(245,234,215,.45);color:#fff;font-weight:700}.option.correct{background:rgba(25,102,69,.9);border-color:#77efb4}.option.wrong{background:rgba(131,12,34,.93);border-color:#ff6f82}.option:disabled{cursor:default;transform:none}.option .translation{font-size:.82cqw}
.feedback{display:none;padding:.72cqw .82cqw;border:1px solid rgba(245,234,215,.3);background:rgba(7,3,8,.82);font-size:1.04cqw;line-height:1.28}.feedback.show{display:block}.feedback.good{border-color:#77efb4}.feedback.bad{border-color:#ff6f82}.feedback strong{color:var(--gold)}
.continue,.start,.restart{align-self:flex-start;border:1px solid #ff8196;background:linear-gradient(180deg,#a7102b,#6e071a);color:#fff;font-weight:700;letter-spacing:.07em;padding:.72cqw 1.05cqw;cursor:pointer;font-size:1.03cqw;box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.48)}.right .continue,.right .start,.right .restart{align-self:flex-end}.center .continue,.center .start,.center .restart{align-self:center}.continue:hover,.start:hover,.restart:hover{filter:brightness(1.2)}
.route-options{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw}.route{border:1px solid rgba(245,234,215,.43);background:rgba(9,4,10,.79);color:#fff;padding:1cqw;cursor:pointer;text-align:left;min-height:6.8cqw}.route:hover{border-color:#ff8196;background:rgba(74,7,21,.91)}.route b{display:block;color:#ff8ea0;font-size:1.12cqw;margin-bottom:.35cqw}.route .translation{font-size:.8cqw}
.rules-intro{display:grid;gap:.48cqw}.rule-card{border:1px solid rgba(245,234,215,.3);background:rgba(9,4,10,.76);padding:.55cqw .68cqw;font-size:.94cqw;line-height:1.22}.rule-card b{display:block;color:var(--gold);font-size:1.02cqw;margin-bottom:.12cqw}.rule-card .translation{font-size:.75cqw}.rule-note{color:var(--ice);font-size:.94cqw;line-height:1.25;border-left:.25cqw solid var(--blood);padding:.5cqw .65cqw;background:rgba(99,6,22,.35)}
.cover-title{font-size:5.3cqw}.final-score{font-size:2cqw;color:var(--gold);font-weight:700}.small{font-size:.86cqw;color:var(--muted)}
.corner-help{position:absolute;z-index:5;right:1.5cqw;bottom:1.2cqw;color:#d1c2b8;font-size:.78cqw;background:rgba(7,3,8,.68);padding:.35cqw .5cqw;pointer-events:none}
@media(max-aspect-ratio:4/3){.content{width:58%}.center .content{width:82%}.title{font-size:4.4cqw}.story,.prompt{font-size:1.75cqw}.option,.feedback{font-size:1.4cqw}.translation{font-size:1.15cqw}.badge{font-size:1.35cqw}.lang-btn,.utility{font-size:1.28cqw}}
@media(max-width:700px){.hud{top:8px;left:8px;right:8px}.badge{font-size:10px;padding:5px}.lang-btn,.utility{font-size:10px;padding:5px}.content,.center .content{top:58px;bottom:14px;left:3%;right:3%;transform:none;width:94%;max-height:none;text-align:left;justify-content:flex-end;background:linear-gradient(180deg,transparent 0%,rgba(5,3,7,.91) 32%);border:0;padding:18px}.title,.cover-title{font-size:36px}.kicker{font-size:12px}.story,.prompt{font-size:15px}.translation{font-size:12px}.option,.feedback{font-size:13px;padding:8px}.route-options{grid-template-columns:1fr}.corner-help{display:none}}
</style>
</head>
<body>
<main class="game" aria-live="polite">
  <section id="frame" class="frame left">
    <img id="sceneImage" class="scene-img" alt="">
    <div class="shade"></div>
    <header class="hud">
      <div class="hud-group">
        <div class="badge">POINTS <b id="score">0</b>/85</div>
        <div class="badge">NERVE <b id="nerve">♥♥♥</b></div>
        <div class="badge">EVIDENCE <b id="evidence">◇◇◇</b></div>
        <div class="badge">TEST <b id="progress">0/17</b></div>
      </div>
      <div class="hud-group">
        <div class="langs" aria-label="Translation language">
          <button class="lang-btn active" data-lang="off">OFF</button>
          <button class="lang-btn" data-lang="es">ES</button>
          <button class="lang-btn" data-lang="de">DE</button>
        </div>
        <button id="fullscreen" class="utility" title="Fullscreen">⛶</button>
      </div>
    </header>
    <article id="content" class="content"></article>
    <div class="corner-help">1–3 choose · ENTER continue · L language · F fullscreen</div>
  </section>

const scenes={
cover:{img:'01_cover',pos:'left',kind:'intro',k:T('DRACULA · A GRAMMAR HORROR RPG','DRÁCULA · UN RPG DE GRAMÁTICA Y TERROR','DRACULA · EIN GRAMMATIK-HORROR-RPG'),title:T('THE CASTLE OF IF','EL CASTILLO DEL SI','DAS SCHLOSS DES WENN'),story:T('Jonathan Harker has come to Transylvania to complete a property sale. Master conditionals and the active and passive voice. Earn 70 points, preserve your nerve and collect three pieces of evidence before Dracula closes the gates forever.','Jonathan Harker ha venido a Transilvania para cerrar una venta. Domina los condicionales y la voz activa y pasiva. Gana 70 puntos, conserva tu valor y reúne tres pruebas antes de que Drácula cierre las puertas para siempre.','Jonathan Harker ist nach Transsilvanien gekommen, um einen Verkauf abzuschließen. Meistere Konditionalsätze sowie Aktiv und Passiv. Sammle 70 Punkte, behalte deinen Mut und finde drei Beweise, bevor Dracula die Tore für immer schließt.'),next:'rules'},
rules:{img:'31_rules_briefing',pos:'left',kind:'rules',k:T('BEFORE THE JOURNEY · HOW THE GRAMMAR WORKS','ANTES DEL VIAJE · CÓMO FUNCIONA LA GRAMÁTICA','VOR DER REISE · SO FUNKTIONIERT DIE GRAMMATIK'),title:T('READ THE SIGNS','LEE LAS SEÑALES','LIES DIE ZEICHEN'),story:T('Every challenge asks what the speaker means and what form expresses it. First decide whether the situation is a fact, a real possibility, an unreal idea or an impossible past. For voice questions, decide whether the doer or the receiver deserves the focus.','Cada desafío pregunta qué quiere decir el hablante y qué forma lo expresa. Primero decide si la situación es un hecho, una posibilidad real, una idea irreal o un pasado imposible. Para las voces, decide si el foco debe estar en quien actúa o en quien recibe la acción.','Jede Aufgabe fragt, was gemeint ist und welche Form dies ausdrückt. Entscheide zuerst, ob es um eine Tatsache, eine reale Möglichkeit, eine irreale Vorstellung oder eine unmögliche Vergangenheit geht. Bei Aktiv und Passiv entscheidest du, ob Handelnder oder Empfänger im Mittelpunkt steht.'),rules:[{name:T('ZERO · FACTS AND RULES','CERO · HECHOS Y REGLAS','NULL · FAKTEN UND REGELN'),form:T('if/when + present, present','si/cuando + presente, presente','wenn + Präsens, Präsens')},{name:T('FIRST · REAL FUTURE POSSIBILITY','PRIMERO · POSIBILIDAD FUTURA REAL','ERSTER · REALE ZUKUNFTSMÖGLICHKEIT'),form:T('if + present, will + BASE VERB','si + presente, futuro','wenn + Präsens, wird + Grundform')},{name:T('SECOND · UNREAL NOW OR FUTURE','SEGUNDO · PRESENTE O FUTURO IRREAL','ZWEITER · IRREALE GEGENWART ODER ZUKUNFT'),form:T('if + past, would/could + BASE VERB','si + pasado, condicional','wenn + Vergangenheit, würde/könnte + Grundform')},{name:T('THIRD · DIFFERENT PAST','TERCERO · UN PASADO DIFERENTE','DRITTER · EINE ANDERE VERGANGENHEIT'),form:T('if + had + past participle, would have + past participle','si + pluscuamperfecto, habría + participio','wenn + Plusquamperfekt, hätte/wäre + Partizip')},{name:T('ACTIVE AND PASSIVE','ACTIVA Y PASIVA','AKTIV UND PASSIV'),form:T('ACTIVE: the subject does the action. PASSIVE: the receiver comes first; use BE in the right tense + PAST PARTICIPLE.','ACTIVA: el sujeto realiza la acción. PASIVA: el receptor va primero; usa SER en el tiempo correcto + PARTICIPIO.','AKTIV: Das Subjekt handelt. PASSIV: Der Empfänger steht zuerst; nutze WERDEN/SEIN in der richtigen Zeit + PARTIZIP II.')}],note:T('In an if-clause, do not normally use “will”. Look for the time and the meaning before choosing the structure.','En una oración con si, normalmente no se usa “will” en la parte con si. Busca primero el tiempo y el significado.','Im wenn-Satz steht normalerweise kein „will“. Achte zuerst auf Zeit und Bedeutung.'),next:'train'},
train:{img:'02_train',pos:'left',kind:'question',q:1,k:T('JONATHAN’S JOURNAL · 3 MAY','DIARIO DE JONATHAN · 3 DE MAYO','JONATHANS TAGEBUCH · 3. MAI'),title:T('THE INVITATION','LA INVITACIÓN','DIE EINLADUNG'),story:T('A letter has brought Jonathan east. Beyond the train window, the Carpathians rise like black teeth.','Una carta ha llevado a Jonathan hacia el este. Tras la ventana, los Cárpatos se alzan como dientes negros.','Ein Brief hat Jonathan nach Osten gebracht. Hinter dem Zugfenster ragen die Karpaten wie schwarze Zähne auf.'),clue:T('Dracula sent the letter. Jonathan received it in London.','Drácula envió la carta. Jonathan la recibió en Londres.','Dracula schickte den Brief. Jonathan erhielt ihn in London.'),prompt:T('Which sentence is ACTIVE?','¿Qué oración está en ACTIVA?','Welcher Satz steht im AKTIV?'),opts:[T('Jonathan was invited to Transylvania.','Jonathan fue invitado a Transilvania.','Jonathan wurde nach Transsilvanien eingeladen.'),T('Dracula invited Jonathan to Transylvania.','Drácula invitó a Jonathan a Transilvania.','Dracula lud Jonathan nach Transsilvanien ein.'),T('The invitation was carried by train.','La invitación fue llevada en tren.','Die Einladung wurde mit dem Zug gebracht.')],answer:1,fb:T('The subject, Dracula, performs the action. That makes the sentence active.','El sujeto, Drácula, realiza la acción. Por eso la oración es activa.','Das Subjekt Dracula führt die Handlung aus. Darum ist der Satz aktiv.'),next:'inn'},
inn:{img:'03_inn',pos:'right',kind:'question',q:2,k:T('BORGO PASS · LAST SAFE INN','PASO DE BORGO · ÚLTIMA POSADA SEGURA','BORGO-PASS · LETZTES SICHERES GASTHAUS'),title:T('A GIFT AGAINST EVIL','UN REGALO CONTRA EL MAL','EIN GESCHENK GEGEN DAS BÖSE'),story:T('The innkeeper presses a crucifix into Jonathan’s hand. Everyone stops speaking when Dracula’s name is heard.','La posadera pone un crucifijo en la mano de Jonathan. Todos dejan de hablar al oír el nombre de Drácula.','Die Wirtin drückt Jonathan ein Kruzifix in die Hand. Alle verstummen, als Draculas Name fällt.'),clue:T('The cross may protect him later.','La cruz puede protegerlo más tarde.','Das Kreuz kann ihn später schützen.'),prompt:T('Complete the FIRST CONDITIONAL.','Completa el PRIMER CONDICIONAL.','Vervollständige den ERSTEN KONDITIONALSATZ.'),opts:[T('If you take this cross, it will protect you.','Si llevas esta cruz, te protegerá.','Wenn du dieses Kreuz mitnimmst, wird es dich schützen.'),T('If you took this cross, it protects you yesterday.','Si llevaras esta cruz, te protege ayer.','Wenn du dieses Kreuz nähmest, schützt es dich gestern.'),T('If you will take this cross, it protected you.','Si llevarás esta cruz, te protegió.','Wenn du dieses Kreuz mitnehmen wirst, schützte es dich.')],answer:0,fb:T('First conditional: if + present simple, then will + base verb.','Primer condicional: si + presente, después futuro.','Erster Konditionalsatz: if/wenn + Präsens, dann will/wird + Grundform.'),award:'crucifix',next:'coach'},
coach:{img:'04_coach',pos:'left',kind:'question',q:3,k:T('MIDNIGHT COACH · NO DRIVER’S NAME','COCHE DE MEDIANOCHE · CONDUCTOR SIN NOMBRE','MITTERNACHTSKUTSCHE · FAHRER OHNE NAMEN'),title:T('COLLECTED IN DARKNESS','RECOGIDO EN LA OSCURIDAD','IN DER DUNKELHEIT ABGEHOLT'),story:T('A black coach arrives exactly at midnight. Its driver wears a deep black hood over his hair and a black cloth across his mouth. Only an angular red-pale face and two blazing eyes remain visible.','Un coche negro llega exactamente a medianoche. Su conductor lleva una capucha negra sobre el pelo y una tela negra sobre la boca. Solo quedan visibles un rostro anguloso, rojo y pálido, y dos ojos ardientes.','Eine schwarze Kutsche kommt genau um Mitternacht. Der Fahrer trägt eine tiefschwarze Kapuze über dem Haar und ein schwarzes Tuch vor dem Mund. Nur ein kantiges, rötlich-blasses Gesicht und zwei glühende Augen bleiben sichtbar.'),clue:T('The hooded coachman collected Jonathan. Focus on Jonathan, not the coachman.','El cochero encapuchado recogió a Jonathan. Concéntrate en Jonathan, no en el cochero.','Der vermummte Kutscher holte Jonathan ab. Konzentriere dich auf Jonathan, nicht auf den Kutscher.'),prompt:T('Choose the correct PAST PASSIVE sentence.','Elige la oración correcta en PASIVA DEL PASADO.','Wähle den richtigen Satz im PASSIV DER VERGANGENHEIT.'),opts:[T('Jonathan collected at midnight.','Jonathan recogió a medianoche.','Jonathan holte um Mitternacht ab.'),T('Jonathan is collected yesterday.','Jonathan es recogido ayer.','Jonathan wird gestern abgeholt.'),T('Jonathan was collected at midnight.','Jonathan fue recogido a medianoche.','Jonathan wurde um Mitternacht abgeholt.')],answer:2,fb:T('Past passive: was/were + past participle.','Pasiva del pasado: fue/fueron + participio.','Passiv im Präteritum: wurde/wurden + Partizip II.'),next:'blue_fire'},
blue_fire:{img:'05_blue_fire',pos:'left',kind:'question',q:4,k:T('THE DEAD ROAD · BLUE FIRE','EL CAMINO MUERTO · FUEGO AZUL','DIE TOTE STRASSE · BLAUES FEUER'),title:T('A LAW OF THE MOUNTAINS','UNA LEY DE LAS MONTAÑAS','EIN GESETZ DER BERGE'),story:T('Blue flames rise from forgotten graves. The coach stops, but the horses make no sound.','Llamas azules salen de tumbas olvidadas. El coche se detiene, pero los caballos no hacen ruido.','Blaue Flammen steigen aus vergessenen Gräbern. Die Kutsche hält, doch die Pferde geben keinen Laut von sich.'),clue:T('Local people say this always happens above buried treasure.','La gente local dice que esto siempre ocurre sobre un tesoro enterrado.','Die Menschen hier sagen, dass dies immer über einem vergrabenen Schatz geschieht.'),prompt:T('Choose the ZERO CONDITIONAL.','Elige el CONDICIONAL CERO.','Wähle den NULLTEN KONDITIONALSATZ.'),opts:[T('If blue flames appeared, treasure would be below.','Si aparecieran llamas azules, habría un tesoro debajo.','Wenn blaue Flammen erschienen, wäre darunter ein Schatz.'),T('When blue flames appear, treasure is buried below.','Cuando aparecen llamas azules, hay un tesoro enterrado debajo.','Wenn blaue Flammen erscheinen, ist darunter ein Schatz vergraben.'),T('If blue flames will appear, treasure was below.','Si aparecerán llamas azules, había un tesoro debajo.','Wenn blaue Flammen erscheinen werden, war darunter ein Schatz.')],answer:1,fb:T('Zero conditional describes a general rule: present + present.','El condicional cero describe una regla general: presente + presente.','Der nullte Konditionalsatz beschreibt eine Regel: Präsens + Präsens.'),next:'choice1'},
choice1:{img:'06_choice1',pos:'center',kind:'choice',k:T('DECISION I · THE MOUNTAIN ROAD','DECISIÓN I · EL CAMINO DE MONTAÑA','ENTSCHEIDUNG I · DIE BERGSTRASSE'),title:T('FIRE OR WOLVES?','¿FUEGO O LOBOS?','FEUER ODER WÖLFE?'),story:T('The coach waits beside a fork. One path burns blue among the graves. The other climbs with the wolves.','El coche espera junto a una bifurcación. Un camino arde azul entre las tumbas. El otro sube con los lobos.','Die Kutsche wartet an einer Weggabelung. Ein Pfad brennt blau zwischen Gräbern. Der andere führt mit den Wölfen hinauf.'),routes:[{name:T('FOLLOW THE BLUE FIRE','SEGUIR EL FUEGO AZUL','DEM BLAUEN FEUER FOLGEN'),desc:T('Risk the graveyard and search for its secret.','Arriesga el cementerio y busca su secreto.','Riskiere den Friedhof und suche sein Geheimnis.'),target:'blue_treasure',route:'fire'},{name:T('STAY WITH THE COACH','QUEDARSE CON EL COCHE','BEI DER KUTSCHE BLEIBEN'),desc:T('Face the wolf pack and study the driver.','Enfréntate a los lobos y observa al conductor.','Stelle dich dem Wolfsrudel und beobachte den Fahrer.'),target:'wolves',route:'wolves'}]},
blue_treasure:{img:'07_blue_treasure',pos:'left',kind:'question',q:5,k:T('ROUTE · GRAVE-FIRE','RUTA · FUEGO DE TUMBA','ROUTE · GRABFEUER'),title:T('CURIOSITY HAS TEETH','LA CURIOSIDAD TIENE DIENTES','NEUGIER HAT ZÄHNE'),story:T('Jonathan leaves the coach. Wolves circle the grave while the blue fire opens an iron chest.','Jonathan sale del coche. Los lobos rodean la tumba mientras el fuego azul abre un cofre de hierro.','Jonathan verlässt die Kutsche. Wölfe umkreisen das Grab, während das blaue Feuer eine Eisentruhe öffnet.'),clue:T('Imagine a less curious Jonathan. He would stay inside.','Imagina a un Jonathan menos curioso. Se quedaría dentro.','Stell dir einen weniger neugierigen Jonathan vor. Er würde drinnen bleiben.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.'),opts:[T('If Jonathan were less curious, he would stay in the coach.','Si Jonathan fuera menos curioso, se quedaría en el coche.','Wenn Jonathan weniger neugierig wäre, würde er in der Kutsche bleiben.'),T('If Jonathan is less curious, he stayed in the coach.','Si Jonathan es menos curioso, se quedó en el coche.','Wenn Jonathan weniger neugierig ist, blieb er in der Kutsche.'),T('If Jonathan had been less curious, he stays in the coach.','Si Jonathan hubiera sido menos curioso, se queda en el coche.','Wenn Jonathan weniger neugierig gewesen wäre, bleibt er in der Kutsche.')],answer:0,fb:T('Second conditional: if + past form, then would + base verb.','Segundo condicional: si + pasado, después condicional.','Zweiter Konditionalsatz: if/wenn + Vergangenheitsform, dann would/würde + Grundform.'),next:'blue_cross'},
blue_cross:{img:'08_blue_cross',pos:'right',kind:'question',q:6,k:T('ROUTE · THE BURIED OATH','RUTA · EL JURAMENTO ENTERRADO','ROUTE · DER BEGRABENE SCHWUR'),title:T('WHO HID THE SILVER?','¿QUIÉN ESCONDIÓ LA PLATA?','WER VERSTECKTE DAS SILBER?'),story:T('The chest contains old silver and a soldier’s seal. The crucifix burns warm in Jonathan’s hand.','El cofre contiene plata antigua y el sello de un soldado. El crucifijo arde cálido en la mano de Jonathan.','Die Truhe enthält altes Silber und das Siegel eines Soldaten. Das Kruzifix wird warm in Jonathans Hand.'),clue:T('Forgotten soldiers hid the treasure centuries ago. Focus on the treasure.','Soldados olvidados escondieron el tesoro hace siglos. Concéntrate en el tesoro.','Vergessene Soldaten versteckten den Schatz vor Jahrhunderten. Konzentriere dich auf den Schatz.'),prompt:T('Choose the correct PASSIVE sentence.','Elige la oración correcta en PASIVA.','Wähle den richtigen PASSIVSATZ.'),opts:[T('The treasure hidden forgotten soldiers.','El tesoro escondido soldados olvidados.','Der Schatz versteckt vergessene Soldaten.'),T('The treasure was hide by forgotten soldiers.','El tesoro fue esconder por soldados olvidados.','Der Schatz wurde von vergessenen Soldaten verstecken.'),T('The treasure was hidden by forgotten soldiers.','El tesoro fue escondido por soldados olvidados.','Der Schatz wurde von vergessenen Soldaten versteckt.')],answer:2,fb:T('Passive: was + hidden. The treasure receives the action.','Pasiva: fue + escondido. El tesoro recibe la acción.','Passiv: wurde + versteckt. Der Schatz erhält die Handlung.'),evidence:1,next:'castle_gate'},
wolves:{img:'09_wolves',pos:'left',kind:'question',q:5,k:T('ROUTE · WOLF CIRCLE','RUTA · CÍRCULO DE LOBOS','ROUTE · WOLFSKREIS'),title:T('IF THEY COME CLOSER…','SI SE ACERCAN…','WENN SIE NÄHER KOMMEN…'),story:T('The wolves surround the coach. The black-hooded coachman raises one gloved hand, and the pack freezes. Above the cloth covering his mouth, his square red eyes burn in the dark.','Los lobos rodean el coche. El cochero de capucha negra levanta una mano enguantada y la manada se queda inmóvil. Sobre la tela que cubre su boca, sus ojos rojos y cuadrados arden en la oscuridad.','Die Wölfe umringen die Kutsche. Der schwarz vermummte Kutscher hebt eine behandschuhte Hand, und das Rudel erstarrt. Über dem Tuch vor seinem Mund glühen seine kantigen roten Augen in der Dunkelheit.'),clue:T('Jonathan still has the crucifix. The danger is real and possible.','Jonathan todavía tiene el crucifijo. El peligro es real y posible.','Jonathan hat noch das Kruzifix. Die Gefahr ist real und möglich.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.'),opts:[T('If wolves came closer, Jonathan uses the cross.','Si los lobos se acercaran, Jonathan usa la cruz.','Wenn die Wölfe näher kämen, benutzt Jonathan das Kreuz.'),T('If the wolves come closer, Jonathan will use the cross.','Si los lobos se acercan, Jonathan usará la cruz.','Wenn die Wölfe näher kommen, wird Jonathan das Kreuz benutzen.'),T('If the wolves had come closer, Jonathan will use the cross.','Si los lobos se hubieran acercado, Jonathan usará la cruz.','Wenn die Wölfe näher gekommen wären, wird Jonathan das Kreuz benutzen.')],answer:1,fb:T('A real future possibility uses if + present, then will + verb.','Una posibilidad futura real usa si + presente, después futuro.','Eine reale Zukunftsmöglichkeit nutzt wenn + Präsens, dann wird + Verb.'),next:'coach_rescue'},
coach_rescue:{img:'10_coach_rescue',pos:'left',kind:'question',q:6,k:T('ROUTE · FOOTPRINTS OF NOBODY','RUTA · HUELLAS DE NADIE','ROUTE · SPUREN VON NIEMANDEM'),title:T('THE PACK OBEYS','LA MANADA OBEDECE','DAS RUDEL GEHORCHT'),story:T('The wolves retreat at one gesture from the black-robed coachman. Fresh snow lies around him, but his boots have left no footprints. His hood and face covering cannot hide those red eyes.','Los lobos se retiran con un gesto del cochero vestido de negro. Hay nieve fresca a su alrededor, pero sus botas no han dejado huellas. La capucha y la tela sobre su rostro no pueden ocultar esos ojos rojos.','Mit einer Geste des schwarz gekleideten Kutschers ziehen sich die Wölfe zurück. Frischer Schnee liegt um ihn, doch seine Stiefel haben keine Spuren hinterlassen. Kapuze und Gesichtstuch können diese roten Augen nicht verbergen.'),clue:T('The coachman controls the wolves. Put the wolves first.','El cochero controla a los lobos. Pon a los lobos primero.','Der Kutscher kontrolliert die Wölfe. Stelle die Wölfe an den Anfang.'),prompt:T('Choose the correct PASSIVE sentence.','Elige la oración correcta en PASIVA.','Wähle den richtigen PASSIVSATZ.'),opts:[T('The wolves are controlled by the coachman.','Los lobos son controlados por el cochero.','Die Wölfe werden vom Kutscher kontrolliert.'),T('The wolves control by the coachman.','Los lobos controlan por el cochero.','Die Wölfe kontrollieren vom Kutscher.'),T('The wolves were controlling the coachman.','Los lobos estaban controlando al cochero.','Die Wölfe kontrollierten den Kutscher.')],answer:0,fb:T('Present passive: are + controlled.','Pasiva del presente: son + controlados.','Passiv im Präsens: werden + kontrolliert.'),evidence:1,next:'castle_gate'},
castle_gate:{img:'11_castle_gate',pos:'left',kind:'question',q:7,k:T('CASTLE DRACULA · THE THRESHOLD','CASTILLO DE DRÁCULA · EL UMBRAL','SCHLOSS DRACULA · DIE SCHWELLE'),title:T('OPENED BY NO ONE','ABIERTO POR NADIE','VON NIEMANDEM GEÖFFNET'),story:T('The iron gate opens by itself. Dracula waits beyond it with a single candle.','La puerta de hierro se abre sola. Drácula espera detrás con una sola vela.','Das Eisentor öffnet sich von selbst. Dracula wartet dahinter mit einer einzigen Kerze.'),clue:T('No servant touches the gate. Focus on what happened to it.','Ningún sirviente toca la puerta. Concéntrate en lo que le ocurrió.','Kein Diener berührt das Tor. Konzentriere dich darauf, was mit ihm geschah.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.'),opts:[T('The gate opened a servant.','La puerta abrió a un sirviente.','Das Tor öffnete einen Diener.'),T('The gate is opened last night.','La puerta es abierta anoche.','Das Tor wird letzte Nacht geöffnet.'),T('The gate was opened without a servant.','La puerta fue abierta sin un sirviente.','Das Tor wurde ohne einen Diener geöffnet.')],answer:2,fb:T('Was opened is the past passive. The unknown agent increases the mystery.','Fue abierta es la pasiva del pasado. El agente desconocido aumenta el misterio.','Wurde geöffnet ist das Passiv der Vergangenheit. Der unbekannte Handelnde macht es geheimnisvoller.'),next:'dinner'},
dinner:{img:'12_dinner',pos:'left',kind:'question',q:8,k:T('CASTLE DRACULA · DINNER','CASTILLO DE DRÁCULA · CENA','SCHLOSS DRACULA · ABENDESSEN'),title:T('THE HOST DOES NOT EAT','EL ANFITRIÓN NO COME','DER GASTGEBER ISST NICHT'),story:T('Jonathan eats before a roaring fire. Dracula watches from an empty place and never touches food.','Jonathan come ante un gran fuego. Drácula observa desde un sitio vacío y nunca toca la comida.','Jonathan isst vor einem lodernden Feuer. Dracula beobachtet ihn von einem leeren Platz und berührt kein Essen.'),clue:T('Dracula puts the meal on the table. He performs the action.','Drácula pone la comida en la mesa. Él realiza la acción.','Dracula stellt das Essen auf den Tisch. Er führt die Handlung aus.'),prompt:T('Which sentence is ACTIVE?','¿Qué oración está en ACTIVA?','Welcher Satz steht im AKTIV?'),opts:[T('Dracula served Jonathan dinner.','Drácula sirvió la cena a Jonathan.','Dracula servierte Jonathan das Abendessen.'),T('Dinner was served to Jonathan.','La cena fue servida a Jonathan.','Das Abendessen wurde Jonathan serviert.'),T('Jonathan was watched by Dracula.','Jonathan fue observado por Drácula.','Jonathan wurde von Dracula beobachtet.')],answer:0,fb:T('Dracula is the subject and performs the action: active voice.','Drácula es el sujeto y realiza la acción: voz activa.','Dracula ist das Subjekt und führt die Handlung aus: Aktiv.'),next:'mirror'},
mirror:{img:'13_mirror',pos:'left',kind:'question',q:9,k:T('CASTLE DRACULA · MORNING','CASTILLO DE DRÁCULA · MAÑANA','SCHLOSS DRACULA · MORGEN'),title:T('THE MISSING REFLECTION','EL REFLEJO AUSENTE','DAS FEHLENDE SPIEGELBILD'),story:T('Dracula stands behind Jonathan, but the mirror reflects only one man. Then a red hand strikes the glass.','Drácula está detrás de Jonathan, pero el espejo refleja solo a un hombre. Entonces una mano roja golpea el cristal.','Dracula steht hinter Jonathan, doch der Spiegel zeigt nur einen Mann. Dann schlägt eine rote Hand gegen das Glas.'),clue:T('Dracula smashed the mirror. Put the mirror first.','Drácula rompió el espejo. Pon el espejo primero.','Dracula zerbrach den Spiegel. Stelle den Spiegel an den Anfang.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.'),opts:[T('The mirror smashed by Dracula.','El espejo rompió por Drácula.','Der Spiegel zerbrach von Dracula.'),T('The mirror was smashed by Dracula.','El espejo fue roto por Drácula.','Der Spiegel wurde von Dracula zerbrochen.'),T('The mirror was smash by Dracula.','El espejo fue romper por Drácula.','Der Spiegel wurde von Dracula zerbrechen.')],answer:1,fb:T('Was + smashed forms the past passive.','Fue + roto forma la pasiva del pasado.','Wurde + zerbrochen bildet das Passiv der Vergangenheit.'),next:'locked_room'},
locked_room:{img:'14_locked_room',pos:'right',kind:'question',q:10,k:T('CASTLE DRACULA · PRISON','CASTILLO DE DRÁCULA · PRISIÓN','SCHLOSS DRACULA · GEFÄNGNIS'),title:T('EVERY DOOR IS LOCKED','TODAS LAS PUERTAS ESTÁN CERRADAS','JEDE TÜR IST VERSCHLOSSEN'),story:T('Jonathan tests every key. Corridors fold into corridors, but no door leads outside.','Jonathan prueba cada llave. Los pasillos se repiten, pero ninguna puerta lleva fuera.','Jonathan probiert jeden Schlüssel. Korridore führen in Korridore, doch keine Tür führt hinaus.'),clue:T('He does not have the right key. Imagine a different present.','No tiene la llave correcta. Imagina un presente diferente.','Er hat nicht den richtigen Schlüssel. Stell dir eine andere Gegenwart vor.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.'),opts:[T('If Jonathan has a key, he left the room.','Si Jonathan tiene una llave, salió de la habitación.','Wenn Jonathan einen Schlüssel hat, verließ er das Zimmer.'),T('If Jonathan had had a key, he can leave now.','Si Jonathan hubiera tenido una llave, puede salir ahora.','Wenn Jonathan einen Schlüssel gehabt hätte, kann er jetzt gehen.'),T('If Jonathan had the right key, he could leave the room.','Si Jonathan tuviera la llave correcta, podría salir de la habitación.','Wenn Jonathan den richtigen Schlüssel hätte, könnte er das Zimmer verlassen.')],answer:2,fb:T('Second conditional imagines an unreal present: if + past, then could/would + verb.','El segundo condicional imagina un presente irreal: si + pasado, después podría/haría.','Der zweite Konditionalsatz beschreibt eine irreale Gegenwart: wenn + Vergangenheit, dann könnte/würde + Verb.'),next:'choice2'},
choice2:{img:'15_choice2',pos:'center',kind:'choice',k:T('DECISION II · THE CASTLE’S HEART','DECISIÓN II · EL CORAZÓN DEL CASTILLO','ENTSCHEIDUNG II · DAS HERZ DES SCHLOSSES'),title:T('LIBRARY OR TOWER?','¿BIBLIOTECA O TORRE?','BIBLIOTHEK ODER TURM?'),story:T('The west passage divides. Papers and keys wait in the red library. An impossible shadow moves beyond the tower window.','El pasillo oeste se divide. Papeles y llaves esperan en la biblioteca roja. Una sombra imposible se mueve tras la ventana de la torre.','Der Westgang teilt sich. Papiere und Schlüssel warten in der roten Bibliothek. Ein unmöglicher Schatten bewegt sich vor dem Turmfenster.'),routes:[{name:T('SEARCH THE LIBRARY','REGISTRAR LA BIBLIOTECA','DIE BIBLIOTHEK DURCHSUCHEN'),desc:T('Find the false letters and steal a key.','Encuentra las cartas falsas y roba una llave.','Finde die falschen Briefe und stiehl einen Schlüssel.'),target:'forged_letters',route:'library'},{name:T('CLIMB THE TOWER','SUBIR A LA TORRE','DEN TURM BESTEIGEN'),desc:T('Follow Dracula’s shadow into the storm.','Sigue la sombra de Drácula hacia la tormenta.','Folge Draculas Schatten in den Sturm.'),target:'wall_crawl',route:'tower'}]},
forged_letters:{img:'16_forged_letters',pos:'left',kind:'question',q:11,k:T('ROUTE · THE RED LIBRARY','RUTA · LA BIBLIOTECA ROJA','ROUTE · DIE ROTE BIBLIOTHEK'),title:T('LETTERS FROM A PRISONER','CARTAS DE UN PRISIONERO','BRIEFE EINES GEFANGENEN'),story:T('Jonathan finds letters dated weeks ahead. Dracula plans to force him to write that he is safe.','Jonathan encuentra cartas fechadas semanas después. Drácula planea obligarlo a escribir que está a salvo.','Jonathan findet Briefe mit Daten Wochen in der Zukunft. Dracula will ihn zwingen zu schreiben, dass er sicher ist.'),clue:T('Dracula ordered Jonathan to write the letters. Focus on the letters.','Drácula ordenó a Jonathan escribir las cartas. Concéntrate en las cartas.','Dracula befahl Jonathan, die Briefe zu schreiben. Konzentriere dich auf die Briefe.'),prompt:T('Choose the correct PASSIVE sentence.','Elige la oración correcta en PASIVA.','Wähle den richtigen PASSIVSATZ.'),opts:[T('The letters were written under Dracula’s orders.','Las cartas fueron escritas bajo las órdenes de Drácula.','Die Briefe wurden auf Draculas Befehl geschrieben.'),T('The letters wrote under Dracula’s orders.','Las cartas escribieron bajo las órdenes de Drácula.','Die Briefe schrieben auf Draculas Befehl.'),T('The letters were wrote by Jonathan.','Las cartas fueron escribió por Jonathan.','Die Briefe wurden von Jonathan schrieb.')],answer:0,fb:T('Were + written is the correct past passive.','Fueron + escritas es la pasiva correcta del pasado.','Wurden + geschrieben ist das richtige Passiv der Vergangenheit.'),next:'stolen_key'},
stolen_key:{img:'17_stolen_key',pos:'right',kind:'question',q:12,k:T('ROUTE · THE MASTER KEY','RUTA · LA LLAVE MAESTRA','ROUTE · DER HAUPTSCHLÜSSEL'),title:T('A SHADOW REACHES','UNA SOMBRA SE ACERCA','EIN SCHATTEN GREIFT AUS'),story:T('The iron key hangs from Dracula’s coat. A huge hand-shaped shadow moves across the wall.','La llave de hierro cuelga del abrigo de Drácula. Una gran sombra con forma de mano avanza por la pared.','Der Eisenschlüssel hängt an Draculas Mantel. Ein riesiger handförmiger Schatten bewegt sich über die Wand.'),clue:T('Taking the key is dangerous, but it may open the west door.','Tomar la llave es peligroso, pero puede abrir la puerta oeste.','Den Schlüssel zu nehmen ist gefährlich, aber er könnte die Westtür öffnen.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.'),opts:[T('If Jonathan stole the key, he unlocks yesterday.','Si Jonathan robara la llave, abre ayer.','Wenn Jonathan den Schlüssel stähle, öffnet er gestern.'),T('If Jonathan steals the key, he will unlock the west door.','Si Jonathan roba la llave, abrirá la puerta oeste.','Wenn Jonathan den Schlüssel stiehlt, wird er die Westtür öffnen.'),T('If Jonathan will steal the key, he unlocked the door.','Si Jonathan robará la llave, abrió la puerta.','Wenn Jonathan den Schlüssel stehlen wird, öffnete er die Tür.')],answer:1,fb:T('First conditional: present after if, then will + verb.','Primer condicional: presente después de si, después futuro.','Erster Konditionalsatz: Präsens nach wenn, dann wird + Verb.'),evidence:1,next:'shipping_plan'},
wall_crawl:{img:'18_wall_crawl',pos:'center',kind:'question',q:11,k:T('ROUTE · THE NORTH TOWER','RUTA · LA TORRE NORTE','ROUTE · DER NORDTURM'),title:T('THE WALL WALKER','EL QUE CAMINA POR LA PARED','DER WANDKRIECHER'),story:T('Dracula crawls head-first down the outer wall. His cape falls upward into the storm.','Drácula baja de cabeza por el muro exterior. Su capa cae hacia arriba en la tormenta.','Dracula kriecht kopfüber die Außenwand hinab. Sein Umhang fällt nach oben in den Sturm.'),clue:T('Jonathan saw Dracula on the wall. Put Dracula first, but keep the focus on what Jonathan observed.','Jonathan vio a Drácula en la pared. Pon a Drácula primero, pero mantén el foco en lo observado.','Jonathan sah Dracula an der Wand. Stelle Dracula an den Anfang, aber konzentriere dich auf die Beobachtung.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.'),opts:[T('Dracula seen crawling by Jonathan.','Drácula visto bajando por Jonathan.','Dracula gesehen kriechend von Jonathan.'),T('Dracula is saw crawling by Jonathan.','Drácula es vio bajando por Jonathan.','Dracula wird von Jonathan sah kriechend.'),T('Dracula was seen crawling down the wall.','Drácula fue visto bajando por el muro.','Dracula wurde gesehen, wie er die Wand hinabkroch.')],answer:2,fb:T('Was seen is the past passive; crawling describes the action observed.','Fue visto es la pasiva del pasado; bajando describe la acción observada.','Wurde gesehen ist das Passiv der Vergangenheit; kriechend beschreibt die beobachtete Handlung.'),next:'vampire_brides'},
vampire_brides:{img:'19_vampire_brides',pos:'left',kind:'question',q:12,k:T('ROUTE · THE FORBIDDEN ROOM','RUTA · LA HABITACIÓN PROHIBIDA','ROUTE · DAS VERBOTENE ZIMMER'),title:T('THE THREE BRIDES','LAS TRES NOVIAS','DIE DREI BRÄUTE'),story:T('Three vampire brides lean over Jonathan. Dracula arrives and drives them back one heartbeat before they bite.','Tres novias vampiras se inclinan sobre Jonathan. Drácula llega y las aparta un instante antes de que muerdan.','Drei Vampirbräute beugen sich über Jonathan. Dracula kommt und treibt sie einen Herzschlag vor dem Biss zurück.'),clue:T('Dracula arrived in time. Imagine that he arrived later.','Drácula llegó a tiempo. Imagina que hubiera llegado más tarde.','Dracula kam rechtzeitig. Stell dir vor, er wäre später gekommen.'),prompt:T('Choose the THIRD CONDITIONAL.','Elige el TERCER CONDICIONAL.','Wähle den DRITTEN KONDITIONALSATZ.'),opts:[T('If Dracula had arrived later, the brides would have bitten Jonathan.','Si Drácula hubiera llegado más tarde, las novias habrían mordido a Jonathan.','Wenn Dracula später gekommen wäre, hätten die Bräute Jonathan gebissen.'),T('If Dracula arrived later, the brides will bite Jonathan.','Si Drácula llegó más tarde, las novias morderán a Jonathan.','Wenn Dracula später kam, werden die Bräute Jonathan beißen.'),T('If Dracula had arrive later, the brides would bite yesterday.','Si Drácula hubiera llegar más tarde, las novias morderían ayer.','Wenn Dracula später gekommen, würden die Bräute gestern beißen.')],answer:0,fb:T('Third conditional imagines a different past: if + had + participle, then would have + participle.','El tercer condicional imagina un pasado diferente: si + hubiera + participio, después habría + participio.','Der dritte Konditionalsatz stellt eine andere Vergangenheit vor: wenn + Plusquamperfekt, dann hätte/wäre + Partizip.'),evidence:1,next:'shipping_plan'},
shipping_plan:{img:'32_shipping_plan',pos:'left',kind:'story',k:T('BELOW THE WEST ROOMS · HIDDEN RECORDS','BAJO LAS HABITACIONES DEL OESTE · ARCHIVOS OCULTOS','UNTER DEN WESTZIMMERN · VERBORGENE AKTEN'),title:T('ENGLAND IS THE DESTINATION','INGLATERRA ES EL DESTINO','ENGLAND IST DAS ZIEL'),story:T('Beyond the west rooms, Jonathan finds a servant stair and a records chamber. A shipping ledger, English property deeds and cargo tags lie beside a model of a black ship. Through an archway, workers carry heavy boxes into the cellar.','Más allá de las habitaciones del oeste, Jonathan encuentra una escalera de servicio y una sala de archivos. Un registro de envíos, escrituras de una propiedad inglesa y etiquetas de carga están junto a la maqueta de un barco negro. Por un arco, unos trabajadores llevan pesadas cajas al sótano.','Hinter den Westzimmern entdeckt Jonathan eine Dienstbotentreppe und eine geheime Aktenkammer. Neben dem Modell eines schwarzen Schiffes liegen ein Frachtbuch, englische Grundstücksurkunden und Anhänger für Ladung. Durch einen Torbogen tragen Arbeiter schwere Kisten in den Keller.'),note:T('Now the pieces connect: the forced letters will hide Jonathan’s disappearance, the English estate will shelter Dracula, and the boxes will carry his native earth west.','Ahora las piezas encajan: las cartas forzadas ocultarán la desaparición de Jonathan, la propiedad inglesa dará refugio a Drácula y las cajas llevarán su tierra natal hacia el oeste.','Jetzt passt alles zusammen: Die erzwungenen Briefe werden Jonathans Verschwinden verbergen, das englische Anwesen wird Dracula schützen und die Kisten werden seine Heimaterde nach Westen bringen.'),next:'earth_boxes'},
earth_boxes:{img:'20_earth_boxes',pos:'left',kind:'question',q:13,k:T('CASTLE CELLAR · FIFTY BOXES','SÓTANO DEL CASTILLO · CINCUENTA CAJAS','SCHLOSSKELLER · FÜNFZIG KISTEN'),title:T('EARTH FOR A NEW COUNTRY','ERDE PARA UN PAÍS NUEVO','ERDE FÜR EIN NEUES LAND'),story:T('The cellar is packed with boxes of Transylvanian earth. Dracula lies awake inside one of them.','El sótano está lleno de cajas con tierra de Transilvania. Drácula yace despierto dentro de una.','Der Keller ist voller Kisten mit transsilvanischer Erde. Dracula liegt wach in einer von ihnen.'),clue:T('Workers filled the boxes. The result is visible now.','Los trabajadores llenaron las cajas. El resultado es visible ahora.','Arbeiter füllten die Kisten. Das Ergebnis ist jetzt sichtbar.'),prompt:T('Choose the PRESENT PERFECT PASSIVE.','Elige la PASIVA DEL PRETÉRITO PERFECTO.','Wähle das PERFEKT-PASSIV.'),opts:[T('Fifty boxes have filled with earth.','Cincuenta cajas han llenado con tierra.','Fünfzig Kisten haben mit Erde gefüllt.'),T('Fifty boxes have been filled with earth.','Cincuenta cajas han sido llenadas con tierra.','Fünfzig Kisten sind mit Erde gefüllt worden.'),T('Fifty boxes were been filling with earth.','Cincuenta cajas fueron sido llenando con tierra.','Fünfzig Kisten wurden mit Erde füllend gewesen.')],answer:1,fb:T('Present perfect passive: have/has + been + past participle.','Pasiva del pretérito perfecto: ha/han + sido + participio.','Perfekt-Passiv: ist/sind + Partizip II + worden.'),next:'stolen_clothes'},
stolen_clothes:{img:'33_stolen_clothes',pos:'left',kind:'story',k:T('JONATHAN’S ROOM · SOMETHING IS MISSING','HABITACIÓN DE JONATHAN · FALTA ALGO','JONATHANS ZIMMER · ETWAS FEHLT'),title:T('THE COUNT STOLE HIS CLOTHES','EL CONDE ROBÓ SU ROPA','DER GRAF STAHL SEINE KLEIDER'),story:T('Jonathan returns to his room. His travelling coat and hat are gone. A blood-smeared cuff hangs inside the empty wardrobe. Dracula has worn Jonathan’s clothes beyond the castle so that any witness will blame the English prisoner for his attacks.','Jonathan vuelve a su habitación. Su abrigo de viaje y su sombrero han desaparecido. Un puño manchado de sangre cuelga dentro del armario vacío. Drácula ha usado la ropa de Jonathan fuera del castillo para que cualquier testigo culpe al prisionero inglés de sus ataques.','Jonathan kehrt in sein Zimmer zurück. Reisemantel und Hut sind verschwunden. In dem leeren Schrank hängt eine blutbefleckte Manschette. Dracula hat Jonathans Kleider außerhalb des Schlosses getragen, damit jeder Zeuge den englischen Gefangenen für seine Angriffe verantwortlich macht.'),note:T('Jonathan is not only imprisoned; his identity is being used as a weapon. He must leave before Dracula completes the deception.','Jonathan no solo está prisionero: su identidad se usa como arma. Debe marcharse antes de que Drácula complete el engaño.','Jonathan ist nicht nur gefangen; seine Identität wird als Waffe benutzt. Er muss fliehen, bevor Dracula die Täuschung vollendet.'),next:'last_chance'},
last_chance:{img:'34_last_chance',pos:'left',kind:'story',k:T('PRE-DAWN · THE FINAL WAGON','ANTES DEL AMANECER · EL ÚLTIMO CARRO','VOR TAGESANBRUCH · DER LETZTE WAGEN'),title:T('ONLY THE WINDOW REMAINS','SOLO QUEDA LA VENTANA','NUR DAS FENSTER BLEIBT'),story:T('Jonathan hears the door bolt slide from the outside. Through the narrow window, workers load the final earth boxes onto black wagons. The last convoy is leaving—and his bedroom door will never open in time.','Jonathan oye cómo corren el cerrojo desde fuera. Por la estrecha ventana ve a los trabajadores cargar las últimas cajas de tierra en carros negros. El último convoy se marcha y la puerta de su habitación no se abrirá a tiempo.','Jonathan hört, wie der Riegel draußen vorgeschoben wird. Durch das schmale Fenster sieht er, wie Arbeiter die letzten Erdkisten auf schwarze Wagen laden. Der letzte Konvoi fährt ab – und seine Zimmertür wird sich nicht rechtzeitig öffnen.'),note:T('Then he sees the long white sheets on the bed. The door is useless. The cliff window is not.','Entonces ve las largas sábanas blancas de la cama. La puerta no sirve. La ventana sobre el acantilado, sí.','Dann sieht er die langen weißen Bettlaken. Die Tür ist nutzlos. Das Fenster über der Felswand nicht.'),next:'escape_plan'},
escape_plan:{img:'21_escape_plan',pos:'left',kind:'question',q:14,k:T('JONATHAN’S ROOM · THE PLAN','HABITACIÓN DE JONATHAN · EL PLAN','JONATHANS ZIMMER · DER PLAN'),title:T('A ROPE OF SHEETS','UNA CUERDA DE SÁBANAS','EIN SEIL AUS BETTLAKEN'),story:T('Jonathan knots the bed sheets together. Far below, the earth boxes are being moved toward the gate.','Jonathan ata las sábanas. Muy abajo, las cajas de tierra están siendo llevadas hacia la puerta.','Jonathan knotet die Bettlaken zusammen. Tief unten werden die Erdkisten zum Tor gebracht.'),clue:T('The rope does not exist yet. Imagine that he makes it.','La cuerda todavía no existe. Imagina que la hace.','Das Seil existiert noch nicht. Stell dir vor, er macht es.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.'),opts:[T('If Jonathan ties the sheets, he escaped yesterday.','Si Jonathan ata las sábanas, escapó ayer.','Wenn Jonathan die Laken knotet, entkam er gestern.'),T('If Jonathan had tied the sheets, he will escape.','Si Jonathan hubiera atado las sábanas, escapará.','Wenn Jonathan die Laken geknotet hätte, wird er entkommen.'),T('If Jonathan tied the sheets together, he could climb down.','Si Jonathan atara las sábanas, podría bajar.','Wenn Jonathan die Laken zusammenknotete, könnte er hinabklettern.')],answer:2,fb:T('This imagines an unreal present plan: if + past, then could + verb.','Esto imagina un plan irreal en el presente: si + pasado, después podría + verbo.','Das ist ein irrealer Plan in der Gegenwart: wenn + Vergangenheitsform, dann könnte + Verb.'),next:'choice3'},
choice3:{img:'22_choice3',pos:'center',kind:'choice',k:T('DECISION III · BEFORE DAWN','DECISIÓN III · ANTES DEL AMANECER','ENTSCHEIDUNG III · VOR TAGESANBRUCH'),title:T('CRYPT OR COURTYARD?','¿CRIPTA O PATIO?','GRUFT ODER HOF?'),story:T('There is time for one final act. The crypt may hold Dracula’s coffin. The courtyard may hold the last wagon out.','Hay tiempo para un último acto. La cripta puede guardar el ataúd de Drácula. El patio puede ofrecer el último carro de salida.','Es bleibt Zeit für eine letzte Tat. In der Gruft könnte Draculas Sarg liegen. Im Hof könnte der letzte Wagen hinausfahren.'),routes:[{name:T('DESCEND TO THE CRYPT','BAJAR A LA CRIPTA','IN DIE GRUFT HINABSTEIGEN'),desc:T('Confront the coffin before sunrise.','Enfréntate al ataúd antes del amanecer.','Stelle dich vor Sonnenaufgang dem Sarg.'),target:'crypt_tomb',route:'crypt'},{name:T('INFILTRATE THE COURTYARD','INFILTRARSE EN EL PATIO','DEN HOF INFILTRIEREN'),desc:T('Sabotage the convoy and steal a path out.','Sabotea el convoy y roba una salida.','Sabotiere den Konvoi und stiehl einen Fluchtweg.'),target:'courtyard_carts',route:'courtyard'}]},
crypt_tomb:{img:'23_crypt_tomb',pos:'left',kind:'question',q:15,k:T('ROUTE · THE RUINED CHAPEL','RUTA · LA CAPILLA EN RUINAS','ROUTE · DIE ZERSTÖRTE KAPELLE'),title:T('THE COFFIN MUST OPEN','EL ATAÚD DEBE ABRIRSE','DER SARG MUSS GEÖFFNET WERDEN'),story:T('A stone coffin waits beneath broken saints. Dawn is less than an hour away.','Un ataúd de piedra espera bajo santos rotos. Falta menos de una hora para el amanecer.','Ein Steinsarg wartet unter zerbrochenen Heiligen. Bis zum Morgengrauen bleibt weniger als eine Stunde.'),clue:T('Someone must open the coffin. The coffin is more important than the person.','Alguien debe abrir el ataúd. El ataúd es más importante que la persona.','Jemand muss den Sarg öffnen. Der Sarg ist wichtiger als die Person.'),prompt:T('Choose the correct MODAL PASSIVE.','Elige la PASIVA MODAL correcta.','Wähle das richtige MODALPASSIV.'),opts:[T('The coffin must be opened before dawn.','El ataúd debe ser abierto antes del amanecer.','Der Sarg muss vor Tagesanbruch geöffnet werden.'),T('The coffin must opened before dawn.','El ataúd debe abierto antes del amanecer.','Der Sarg muss vor Tagesanbruch geöffnet.'),T('The coffin must be open someone.','El ataúd debe ser abre alguien.','Der Sarg muss jemand öffnen sein.')],answer:0,fb:T('Modal passive: modal + be + past participle.','Pasiva modal: modal + ser + participio.','Modalpassiv: Modalverb + Partizip II + werden.'),next:'stake_decision'},
stake_decision:{img:'24_stake_decision',pos:'left',kind:'question',q:16,k:T('ROUTE · ONE HEARTBEAT','RUTA · UN LATIDO','ROUTE · EIN HERZSCHLAG'),title:T('THE BLOW NOT STRUCK','EL GOLPE NO DADO','DER NICHT GEFÜHRTE SCHLAG'),story:T('Jonathan raises the hammer, but the first light touches the crypt. Dracula’s eyes open.','Jonathan levanta el martillo, pero la primera luz toca la cripta. Los ojos de Drácula se abren.','Jonathan hebt den Hammer, doch das erste Licht erreicht die Gruft. Draculas Augen öffnen sich.'),clue:T('Jonathan hesitated. Imagine that he struck earlier.','Jonathan dudó. Imagina que hubiera golpeado antes.','Jonathan zögerte. Stell dir vor, er hätte früher zugeschlagen.'),prompt:T('Choose the THIRD CONDITIONAL.','Elige el TERCER CONDICIONAL.','Wähle den DRITTEN KONDITIONALSATZ.'),opts:[T('If Jonathan strikes sooner, Dracula would not escaped.','Si Jonathan golpea antes, Drácula no escaparía.','Wenn Jonathan früher zuschlägt, wäre Dracula nicht entkommen.'),T('If Jonathan had struck sooner, Dracula would not have escaped the coffin.','Si Jonathan hubiera golpeado antes, Drácula no habría escapado del ataúd.','Wenn Jonathan früher zugeschlagen hätte, wäre Dracula dem Sarg nicht entkommen.'),T('If Jonathan had strike sooner, Dracula will not escape.','Si Jonathan hubiera golpear antes, Drácula no escapará.','Wenn Jonathan früher zugeschlagen, wird Dracula nicht entkommen.')],answer:1,fb:T('Third conditional: had + struck, then would have + escaped.','Tercer condicional: hubiera + golpeado, después habría + escapado.','Dritter Konditionalsatz: hätte + zugeschlagen, dann wäre + entkommen.'),evidence:1,next:'final_escape'},
courtyard_carts:{img:'25_courtyard_carts',pos:'left',kind:'question',q:15,k:T('ROUTE · THE NIGHT CONVOY','RUTA · EL CONVOY NOCTURNO','ROUTE · DER NACHTKONVOI'),title:T('BOXES IN MOTION','CAJAS EN MOVIMIENTO','KISTEN IN BEWEGUNG'),story:T('Workers carry the earth boxes toward black wagons. Jonathan hides behind a broken saint.','Los trabajadores llevan las cajas de tierra hacia carros negros. Jonathan se esconde tras un santo roto.','Arbeiter tragen die Erdkisten zu schwarzen Wagen. Jonathan versteckt sich hinter einem zerbrochenen Heiligen.'),clue:T('The action is happening now. Put the boxes first.','La acción está ocurriendo ahora. Pon las cajas primero.','Die Handlung geschieht gerade. Stelle die Kisten an den Anfang.'),prompt:T('Choose the PRESENT CONTINUOUS PASSIVE.','Elige la PASIVA CONTINUA DEL PRESENTE.','Wähle das PASSIV IM VERLAUF.'),opts:[T('The boxes are load onto wagons.','Las cajas cargan en los carros.','Die Kisten laden auf Wagen.'),T('The boxes were being load tomorrow.','Las cajas estaban siendo cargar mañana.','Die Kisten wurden morgen geladen sein.'),T('The boxes are being loaded onto wagons.','Las cajas están siendo cargadas en los carros.','Die Kisten werden gerade auf Wagen geladen.')],answer:2,fb:T('Present continuous passive: are being + past participle.','Pasiva continua del presente: están siendo + participio.','Verlaufspassiv: werden gerade + Partizip II.'),next:'carriage_sabotage'},
carriage_sabotage:{img:'26_carriage_sabotage',pos:'right',kind:'question',q:16,k:T('ROUTE · THE BLACK CARRIAGE','RUTA · EL COCHE NEGRO','ROUTE · DIE SCHWARZE KUTSCHE'),title:T('ONE MISSING PIN','UN PERNO AUSENTE','EIN FEHLENDER BOLZEN'),story:T('Jonathan loosens a wheel pin while the guards watch the loading crew. The road crosses a steep bridge.','Jonathan afloja un perno de la rueda mientras los guardias observan a los trabajadores. El camino cruza un puente empinado.','Jonathan lockert einen Radbolzen, während die Wachen die Arbeiter beobachten. Die Straße führt über eine steile Brücke.'),clue:T('Removing the pin may cause a real future accident.','Quitar el perno puede causar un accidente real en el futuro.','Das Entfernen des Bolzens kann einen echten zukünftigen Unfall verursachen.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.'),opts:[T('If Jonathan removes the pin, the carriage will lose a wheel.','Si Jonathan quita el perno, el coche perderá una rueda.','Wenn Jonathan den Bolzen entfernt, wird die Kutsche ein Rad verlieren.'),T('If Jonathan removed the pin, the carriage loses yesterday.','Si Jonathan quitara el perno, el coche pierde ayer.','Wenn Jonathan den Bolzen entfernte, verliert die Kutsche gestern.'),T('If Jonathan will remove the pin, the carriage lost a wheel.','Si Jonathan quitará el perno, el coche perdió una rueda.','Wenn Jonathan den Bolzen entfernen wird, verlor die Kutsche ein Rad.')],answer:0,fb:T('First conditional predicts a real possible result.','El primer condicional predice un resultado real y posible.','Der erste Konditionalsatz sagt ein reales mögliches Ergebnis voraus.'),evidence:1,next:'final_escape'},
final_escape:{img:'27_final_escape',pos:'left',kind:'question',q:17,k:T('FINAL TEST · THE CLIFF WALL','PRUEBA FINAL · EL MURO DEL ACANTILADO','LETZTE PRÜFUNG · DIE FELSWAND'),title:T('IF THE ROPE HOLDS…','SI LA CUERDA AGUANTA…','WENN DAS SEIL HÄLT…'),story:T('Jonathan climbs down the sheet-rope. Wolves race across the battlements. Dracula reaches the window above.','Jonathan baja por la cuerda de sábanas. Los lobos corren por las murallas. Drácula llega a la ventana de arriba.','Jonathan klettert am Bettlakenseil hinab. Wölfe rasen über die Zinnen. Dracula erreicht das Fenster über ihm.'),clue:T('The rope is holding now. The cliff path is below.','La cuerda aguanta ahora. El sendero está abajo.','Das Seil hält jetzt. Der Felsenpfad liegt darunter.'),prompt:T('Complete the final FIRST CONDITIONAL.','Completa el PRIMER CONDICIONAL final.','Vervollständige den letzten ERSTEN KONDITIONALSATZ.'),opts:[T('If the rope held, Jonathan reaches yesterday.','Si la cuerda aguantara, Jonathan llega ayer.','Wenn das Seil hielte, erreicht Jonathan gestern.'),T('If the rope holds, Jonathan will reach the cliff path.','Si la cuerda aguanta, Jonathan llegará al sendero.','Wenn das Seil hält, wird Jonathan den Felsenpfad erreichen.'),T('If the rope will hold, Jonathan reached the path.','Si la cuerda aguantará, Jonathan llegó al sendero.','Wenn das Seil halten wird, erreichte Jonathan den Pfad.')],answer:1,fb:T('Present after if; will + verb in the result clause. The route is open.','Presente después de si; futuro en el resultado. La ruta está abierta.','Präsens nach wenn; wird + Verb im Ergebnissatz. Der Weg ist frei.'),next:'resolve'},
success:{img:'28_success_dawn',pos:'left',kind:'ending',k:T('DAWN · OUTSIDE THE CASTLE','AMANECER · FUERA DEL CASTILLO','MORGENRÖTE · AUSSERHALB DES SCHLOSSES'),title:T('JONATHAN ESCAPES','JONATHAN ESCAPA','JONATHAN ENTKOMMT'),story:T('Monks pull Jonathan through their gate as the sun reaches the valley. His journal, evidence and memory have survived. Dracula’s castle is behind him—but the Count’s boxes are already moving west.','Unos monjes llevan a Jonathan tras su puerta cuando el sol toca el valle. Su diario, sus pruebas y su memoria han sobrevivido. El castillo queda atrás, pero las cajas del Conde ya viajan hacia el oeste.','Mönche ziehen Jonathan durch ihr Tor, als die Sonne das Tal erreicht. Sein Tagebuch, seine Beweise und seine Erinnerung haben überlebt. Draculas Schloss liegt hinter ihm – doch die Kisten des Grafen reisen bereits nach Westen.'),next:'epilogue'},
failure:{img:'29_failure',pos:'left',kind:'failure',k:T('THE GATE CLOSES · NO DAWN','LA PUERTA SE CIERRA · SIN AMANECER','DAS TOR SCHLIESST SICH · KEIN MORGEN'),title:T('THE CASTLE CLAIMS HIM','EL CASTILLO LO RECLAMA','DAS SCHLOSS FORDERT IHN'),story:T('Jonathan’s nerve or evidence failed before he reached the cliff. Dracula seals the gate. A final journal page is left unfinished in the dark.','El valor o las pruebas de Jonathan fallaron antes de llegar al acantilado. Drácula cierra la puerta. Una última página del diario queda sin terminar en la oscuridad.','Jonathans Mut oder seine Beweise reichten vor der Felswand nicht aus. Dracula versiegelt das Tor. Eine letzte Tagebuchseite bleibt im Dunkeln unvollendet.')},
epilogue:{img:'30_epilogue_ship',pos:'left',kind:'epilogue',k:T('EPILOGUE · THE BLACK SEA','EPÍLOGO · EL MAR NEGRO','EPILOG · DAS SCHWARZE MEER'),title:T('THE DEMETER SAILS','EL DEMÉTER NAVEGA','DIE DEMETER SEGELT'),story:T('Jonathan survived the visit. Dracula did not abandon his plan. Beneath the Demeter’s deck, earth boxes breathe in the storm—and England waits beyond the horizon.','Jonathan sobrevivió a la visita. Drácula no abandonó su plan. Bajo la cubierta del Deméter, las cajas de tierra respiran en la tormenta, e Inglaterra espera tras el horizonte.','Jonathan hat den Besuch überlebt. Dracula gab seinen Plan nicht auf. Unter dem Deck der Demeter atmen die Erdkisten im Sturm – und England wartet hinter dem Horizont.')}
};

let state={scene:'cover',score:0,nerve:5,evidence:0,lang:'off',answered:false,route:[],awards:new Set(),visited:new Set(),results:{}};
const frame=document.getElementById('frame'), content=document.getElementById('content'), sceneImage=document.getElementById('sceneImage');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function line(obj,cls=''){const en=escapeHTML(obj.en);if(state.lang==='off')return `<span class="${cls}">${en}</span>`;return `<span class="${cls}">${en}<span class="translation">${escapeHTML(obj[state.lang])}</span></span>`}
function label(obj){return state.lang==='off'?escapeHTML(obj.en):`${escapeHTML(obj.en)}<span class="translation">${escapeHTML(obj[state.lang])}</span>`}
function updateHUD(){document.getElementById('score').textContent=state.score;document.getElementById('nerve').textContent='♥'.repeat(state.nerve)+'♡'.repeat(5-state.nerve);document.getElementById('evidence').textContent='◆'.repeat(state.evidence)+'◇'.repeat(3-state.evidence);const s=scenes[state.scene];document.getElementById('progress').textContent=`${s.q||Math.min(17,[...state.visited].filter(x=>scenes[x]?.q).length)}/17`;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function head(s,cover=false){return `${line(s.k,'kicker')}<h1 class="title ${cover?'cover-title':''}">${label(s.title)}</h1>${line(s.story,'story')}`}
function render(){const s=scenes[state.scene];state.answered=false;frame.className=`frame ${s.pos}`;sceneImage.src=IMAGES[s.img];sceneImage.alt=s.title.en;let html=head(s,s.kind==='intro');if(s.kind==='intro'){html+=`<button class="start" onclick="go('${s.next}')">${label(LABELS.enter)}</button><div class="small">${label(LABELS.subtitle)}</div>`}else if(s.kind==='rules'){html+=`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div><div class="rule-note">${label(s.note)}</div><button class="continue" onclick="go('${s.next}')">${label(LABELS.begin)}</button>`}else if(s.kind==='story'){html+=`${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${label(LABELS.continue)}</button>`}else if(s.kind==='question'){html+=`<div class="clue"><b>${label(LABELS.visual)}</b><br>${label(s.clue)}</div><div class="prompt">${label(s.prompt)}</div><div class="options">${s.opts.map((o,i)=>`<button class="option" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span><span>${label(o)}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="continue" class="continue" hidden onclick="advance()">${label(LABELS.continue)}</button>`}else if(s.kind==='choice'){html+=`<div class="route-options">${s.routes.map((r,i)=>`<button class="route" onclick="chooseRoute(${i})"><b>${i+1} · ${label(r.name)}</b>${label(r.desc)}</button>`).join('')}</div>`}else if(s.kind==='ending'){html+=`<div class="final-score">${state.score}/85 · ${state.evidence}/3 EVIDENCE</div><button class="continue" onclick="go('${s.next}')">${label(LABELS.continue)}</button>`}else if(s.kind==='failure'){html+=`<div class="final-score">${state.score}/85 · ${state.evidence}/3 EVIDENCE</div><button class="restart" onclick="restart()">${label(LABELS.restart)}</button>`}else if(s.kind==='epilogue'){html+=`<div class="final-score">ROUTE: ${escapeHTML(state.route.join(' · ').toUpperCase())}</div><button class="restart" onclick="restart()">${label(LABELS.restart)}</button>`}content.innerHTML=html;updateHUD();if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene)){setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}}
function go(id){state.scene=id;state.visited.add(id);render()}
function displayAnswer(i,apply){state.answered=true;const s=scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];buttons.forEach(b=>b.disabled=true);const ok=i===s.answer;buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');const fb=document.getElementById('feedback');if(apply){if(ok){state.score+=5}else{state.nerve=Math.max(0,state.nerve-1)}if(s.award&&!state.awards.has(s.award)){state.awards.add(s.award)}if(s.evidence&&!state.awards.has(state.scene)){state.awards.add(state.scene);state.evidence=Math.min(3,state.evidence+s.evidence)}}fb.innerHTML=`<strong>${label(ok?LABELS.correct:LABELS.wrong)}</strong><br>${label(s.fb)}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD()}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;state.results[state.scene]=i;displayAnswer(i,true)}
function advance(){const s=scenes[state.scene];if(state.nerve<=0){go('failure');return}if(s.next==='resolve'){go(state.score>=70&&state.evidence===3?'success':'failure');return}go(s.next)}
function chooseRoute(i){const s=scenes[state.scene],r=s.routes[i];state.route.push(r.route);go(r.target)}
function restart(){state={scene:'cover',score:0,nerve:5,evidence:0,lang:state.lang,answered:false,route:[],awards:new Set(),visited:new Set(),results:{}};render()}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;render()}));
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='l'){state.lang=state.lang==='off'?'es':state.lang==='es'?'de':'off';render();return}if(e.key.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(['1','2','3'].includes(e.key)){const i=Number(e.key)-1;const s=scenes[state.scene];if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click()}if(e.key==='Enter'){document.querySelector('.continue:not([hidden]),.start,.restart')?.click()}});
render();
</script>
</body>
</html>
