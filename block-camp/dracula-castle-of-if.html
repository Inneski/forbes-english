mirror:{img:'13_mirror',pos:'left',kind:'question',q:9,k:T('CASTLE DRACULA · MORNING','CASTILLO DE DRÁCULA · MAÑANA','SCHLOSS DRACULA · MORGEN','CHÂTEAU DE DRACULA · MATIN','CASTELLO DRACULA · MATTINO','CASTELO DE DRÁCULA · MANHÃ','ZAMEK DRAKULI · PORANEK','德古拉城堡 · 清晨','ドラキュラ城 · 朝','DRAKULA ŞATOSU · SABAH','قلعة دراكولا · الصباح','ЗАМОК ДРАКУЛЫ · УТРО'),title:T('THE MISSING REFLECTION','EL REFLEJO AUSENTE','DAS FEHLENDE SPIEGELBILD','LE REFLET ABSENT','IL RIFLESSO ASSENTE','O REFLEXO AUSENTE','ZAGINIONE ODBICIE','消失的倒影','消えた鏡像','KAYIP YANSIMA','الانعكاس الغائب','ПРОПАВШЕЕ ОТРАЖЕНИЕ'),story:T('Dracula stands behind Jonathan, but the mirror reflects only one man. Then a red hand strikes the glass.','Drácula está detrás de Jonathan, pero el espejo refleja solo a un hombre. Entonces una mano roja golpea el cristal.','Dracula steht hinter Jonathan, doch der Spiegel zeigt nur einen Mann. Dann schlägt eine rote Hand gegen das Glas.','Dracula se tient derrière Jonathan, mais le miroir reflète un seul homme. Puis une main rouge frappe le verre.','Dracula sta dietro Jonathan, ma lo specchio riflette solo un uomo. Poi una mano rossa colpisce il vetro.','Drácula está atrás de Jonathan, mas o espelho reflete apenas um homem. Depois, uma mão vermelha bate no vidro.','Drakula stoi za Jonathanem, lecz lustro odbija tylko jednego mężczyznę. Wtedy czerwona dłoń uderza w szkło.','德古拉站在乔纳森身后,镜中却只映出一人。忽然,一只赤红的手击碎了镜面。','ドラキュラがジョナサンの背後に立つが、鏡には一人の男しか映らない。そして赤い手が鏡を打ち砕く。','Drakula, Jonathan\'ın arkasında durur, ama ayna yalnızca tek bir adamı yansıtır. Sonra kızıl bir el cama vurur.','يقف دراكولا خلف جوناثان، لكن المرآة تعكس رجلاً واحداً فقط. ثم تضرب يد حمراء الزجاج.','Дракула стоит позади Джонатана, но зеркало отражает только одного человека. Затем красная рука бьёт по стеклу.'),clue:T('Dracula smashed the mirror. Put the mirror first.','Drácula rompió el espejo. Pon el espejo primero.','Dracula zerbrach den Spiegel. Stelle den Spiegel an den Anfang.','Dracula a brisé le miroir. Mets le miroir en premier.','Dracula ha rotto lo specchio. Metti lo specchio per primo.','Drácula partiu o espelho. Ponha o espelho primeiro.','Drakula rozbił lustro. Postaw lustro na pierwszym miejscu.','德古拉打碎了镜子。请把镜子放在前面。','ドラキュラが鏡を割った。鏡を先に置け。','Drakula aynayı parçaladı. Önce aynayı söyle.','حطّم دراكولا المرآة. ضع المرآة أولاً.','Дракула разбил зеркало. Поставь зеркало на первое место.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.','Choisis le PASSIF PASSÉ correct.','Scegli PASSIVA DEL PASSATO corretta.','Escolha a PASSIVA DO PASSADO correta.','Wybierz poprawną STRONĘ BIERNĄ CZASU PRZESZŁEGO.','选出正确的过去时被动句。','正しい過去の受動態を選べ。','Doğru GEÇMİŞ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في الماضي الصحيح.','Выбери верный ПАССИВ ПРОШЕДШЕГО.'),opts:[T('The mirror smashed by Dracula.','El espejo rompió por Drácula.','Der Spiegel zerbrach von Dracula.','Le miroir a brisé par Dracula.','Lo specchio ruppe da Dracula.','O espelho partiu por Drácula.','Lustro rozbite przez Drakulę.','镜子打碎被德古拉。','鏡はドラキュラによって割った。','Ayna Drakula tarafından parçaladı.','المرآة تحطمت من قِبل دراكولا.','Зеркало разбил Дракулой.'),T('The mirror was smashed by Dracula.','El espejo fue roto por Drácula.','Der Spiegel wurde von Dracula zerbrochen.','Le miroir a été brisé par Dracula.','Lo specchio fu rotto da Dracula.','O espelho foi partido por Drácula.','Lustro zostało rozbite przez Drakulę.','镜子被德古拉打碎了。','鏡はドラキュラによって割られた。','Ayna Drakula tarafından parçalandı.','حُطّمت المرآة من قِبل دراكولا.','Зеркало было разбито Дракулой.'),T('The mirror was smash by Dracula.','El espejo fue romper por Drácula.','Der Spiegel wurde von Dracula zerbrechen.','Le miroir a été briser par Dracula.','Lo specchio fu rompere da Dracula.','O espelho foi partir por Drácula.','Lustro zostało rozbić przez Drakulę.','镜子被德古拉打碎。','鏡はドラキュラによって割られる。','Ayna Drakula tarafından parçala oldu.','كانت المرآة تحطيم من قِبل دراكولا.','Зеркало было разбивать Дракулой.')],answer:1,fb:T('Was + smashed forms the past passive.','Fue + roto forma la pasiva del pasado.','Wurde + zerbrochen bildet das Passiv der Vergangenheit.','A été + brisé forme le passif passé.','Fu + rotto forma la passiva del passato.','Foi + partido forma a passiva do passado.','Zostało + rozbite tworzy stronę bierną przeszłą.','was + smashed 构成过去时被动。','was+割られた(smashed)が過去の受動態を作る。','Was + smashed, geçmiş zaman pasifini oluşturur.','"حُطّمت" تكوّن المبني للمجهول في الماضي.','Was + smashed образует пассив прошедшего.'),next:'locked_room'},
locked_room:{img:'14_locked_room',pos:'right',kind:'question',q:10,k:T('CASTLE DRACULA · PRISON','CASTILLO DE DRÁCULA · PRISIÓN','SCHLOSS DRACULA · GEFÄNGNIS','CHÂTEAU DE DRACULA · PRISON','CASTELLO DRACULA · PRIGIONE','CASTELO DE DRÁCULA · PRISÃO','ZAMEK DRAKULI · WIĘZIENIE','德古拉城堡 · 囚室','ドラキュラ城 · 牢獄','DRAKULA ŞATOSU · ZİNDAN','قلعة دراكولا · السجن','ЗАМОК ДРАКУЛЫ · ТЕМНИЦА'),title:T('EVERY DOOR IS LOCKED','TODAS LAS PUERTAS ESTÁN CERRADAS','JEDE TÜR IST VERSCHLOSSEN','AUCUNE PORTE N\'OUVRE','OGNI PORTA È BLOCCATA','TODAS AS PORTAS FECHADAS','KAŻDE DRZWI SĄ ZAMKNIĘTE','每扇门都锁着','すべての扉に鍵がかかっている','HER KAPI KİLİTLİ','كل باب موصد','ВСЕ ДВЕРИ ЗАПЕРТЫ'),story:T('Jonathan tries every brass guest key Dracula gave him. They open his bedroom and a few empty passages, but none opens the iron west door or leads outside.','Jonathan prueba todas las llaves de latón que le dio Drácula. Abren su dormitorio y algunos pasillos vacíos, pero ninguna abre la puerta de hierro del oeste ni conduce al exterior.','Jonathan probiert jeden Messingschlüssel, den Dracula ihm gegeben hat. Sie öffnen sein Schlafzimmer und einige leere Gänge, aber keiner öffnet die eiserne Westtür oder führt hinaus.','Jonathan essaie chacune des clés de laiton que Dracula lui a données. Elles ouvrent sa chambre et quelques couloirs vides, mais aucune n\'ouvre la porte ouest en fer ni ne mène dehors.','Jonathan prova ogni chiave d\'ottone che Dracula gli ha dato. Aprono la sua camera e qualche corridoio vuoto, ma nessuna apre la porta ovest di ferro né porta all\'esterno.','Jonathan experimenta todas as chaves de latão que Drácula lhe deu. Abrem o seu quarto e algumas passagens vazias, mas nenhuma abre a porta oeste de ferro nem dá para o exterior.','Jonathan próbuje każdego mosiężnego klucza, który dał mu Drakula. Otwierają jego sypialnię i kilka pustych przejść, lecz żaden nie otwiera żelaznych drzwi zachodnich ani nie prowadzi na zewnątrz.','乔纳森试遍了德古拉给他的每一把黄铜钥匙。它们能打开他的卧室和几条空荡的通道,却没有一把能打开那扇铁制的西门,也没有一条通向外面。','ジョナサンはドラキュラから渡された真鍮の鍵をひとつずつ試す。自分の寝室といくつかの空の通路は開くが、鉄の西の扉を開けるものはなく、外へ通じるものもない。','Jonathan, Drakula\'nın verdiği her pirinç misafir anahtarını dener. Yatak odasını ve birkaç boş geçidi açarlar, ama hiçbiri demir batı kapısını açmaz ya da dışarı çıkarmaz.','يجرّب جوناثان كل مفتاح نحاسي أعطاه إياه دراكولا. تفتح غرفته وبضعة ممرات خالية، لكن لا شيء منها يفتح الباب الغربي الحديدي أو يؤدي إلى الخارج.','Джонатан пробует каждый латунный гостевой ключ, который дал ему Дракула. Они открывают его спальню и несколько пустых переходов, но ни один не отпирает железную западную дверь и не ведёт наружу.'),clue:T('The guest keys do not include the iron west-door key. Imagine a different present.','Entre las llaves de los huéspedes no está la llave de hierro de la puerta oeste. Imagina un presente diferente.','Unter den Gästeschlüsseln befindet sich nicht der eiserne Schlüssel zur Westtür. Stell dir eine andere Gegenwart vor.','Les clés d\'invité ne comprennent pas la clé de fer de la porte ouest. Imagine un présent différent.','Tra le chiavi degli ospiti non c\'è la chiave di ferro della porta ovest. Immagina un presente diverso.','As chaves de hóspede não incluem a chave de ferro da porta oeste. Imagina um presente diferente.','Wśród kluczy dla gości nie ma żelaznego klucza do drzwi zachodnich. Wyobraź sobie inną teraźniejszość.','这串客房钥匙里没有那把西门的铁钥匙。设想一个不同的现在。','客用の鍵の中に、鉄の西扉の鍵は入っていない。今とは違う現在を想像しよう。','Misafir anahtarlarının arasında demir batı kapısının anahtarı yoktur. Farklı bir şimdiki zaman hayal et.','مفاتيح الضيوف لا تتضمّن مفتاح الباب الغربي الحديدي. تخيّل حاضراً مختلفاً.','Среди гостевых ключей нет железного ключа от западной двери. Представь другое настоящее.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.','Choisis le DEUXIÈME CONDITIONNEL.','Scegli il SECONDO CONDIZIONALE.','Escolha o SEGUNDO CONDICIONAL.','Wybierz DRUGI OKRES WARUNKOWY.','选出第二条件句。','第二条件文を選べ。','İKİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثاني.','Выбери ВТОРОЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan has a key, he left the room.','Si Jonathan tiene una llave, salió de la habitación.','Wenn Jonathan einen Schlüssel hat, verließ er das Zimmer.','Si Jonathan a une clé, il est sorti de la pièce.','Se Jonathan ha una chiave, uscì dalla stanza.','Se Jonathan tem uma chave, saiu do quarto.','Jeśli Jonathan ma klucz, opuścił pokój.','如果乔纳森有钥匙,他离开了房间。','もしジョナサンが鍵を持っているなら、彼は部屋を出た。','Jonathan\'ın bir anahtarı varsa, odadan çıktı.','إن كان لدى جوناثان مفتاح، غادر الغرفة.','Если у Джонатана есть ключ, он вышел из комнаты.'),T('If Jonathan had had a key, he can leave now.','Si Jonathan hubiera tenido una llave, puede salir ahora.','Wenn Jonathan einen Schlüssel gehabt hätte, kann er jetzt gehen.','S\'il avait eu une clé, il peut sortir maintenant.','Se Jonathan avesse avuto una chiave, può uscire ora.','Se Jonathan tivesse tido uma chave, pode sair agora.','Gdyby Jonathan miał wcześniej klucz, może teraz wyjść.','如果乔纳森当初有钥匙,他现在可以离开。','もしジョナサンが鍵を持っていたら、今出られる。','Jonathan\'ın bir anahtarı olmuş olsaydı, şimdi çıkabilir.','لو كان جوناثان امتلك مفتاحاً، يستطيع المغادرة الآن.','Если бы у Джонатана был ключ, он может выйти сейчас.'),T('If Jonathan had the right key, he could leave the room.','Si Jonathan tuviera la llave correcta, podría salir de la habitación.','Wenn Jonathan den richtigen Schlüssel hätte, könnte er das Zimmer verlassen.','Si Jonathan avait la bonne clé, il pourrait sortir de la pièce.','Se Jonathan avesse la chiave giusta, potrebbe uscire dalla stanza.','Se Jonathan tivesse a chave certa, poderia sair do quarto.','Gdyby Jonathan miał odpowiedni klucz, mógłby opuścić pokój.','如果乔纳森有那把对的钥匙,他就能离开房间。','もしジョナサンが正しい鍵を持っていたら、部屋を出られるだろう。','Jonathan\'da doğru anahtar olsaydı, odadan çıkabilirdi.','لو كان لدى جوناثان المفتاح الصحيح، لاستطاع مغادرة الغرفة.','Если бы у Джонатана был нужный ключ, он мог бы выйти из комнаты.')],answer:2,fb:T('Second conditional imagines an unreal present: if + past, then could/would + verb.','El segundo condicional imagina un presente irreal: si + pasado, después podría/haría.','Der zweite Konditionalsatz beschreibt eine irreale Gegenwart: wenn + Vergangenheit, dann könnte/würde + Verb.','Le deuxième conditionnel imagine un présent irréel : si + passé, puis conditionnel.','Il secondo condizionale immagina un presente irreale: se + passato, poi potrebbe/farebbe.','O segundo condicional imagina um presente irreal: se + passado, depois poderia/faria.','Drugi okres warunkowy wyobraża nierealną teraźniejszość: jeśli + czas przeszły, potem tryb warunkowy (could/would).','第二条件句设想不真实的现在:if + 过去时,然后 could/would + 动词。','第二条件文は非現実の現在を想像する:if+過去形、その後could/would+動詞。','İkinci şart cümlesi gerçek dışı bir şimdiki zamanı hayal eder: eğer + geçmiş zaman, ardından could/would + fiil.','الشرط الثاني يتخيل حاضراً غير واقعي: إن + ماضٍ، ثم لـ + فعل.','Второй условный описывает нереальное настоящее: если + прошедшее, потом could/would + глагол.'),next:'choice2'},
choice2:{img:'15_choice2',pos:'center',kind:'choice',k:T('DECISION II · THE CASTLE’S HEART','DECISIÓN II · EL CORAZÓN DEL CASTILLO','ENTSCHEIDUNG II · DAS HERZ DES SCHLOSSES','DÉCISION II · LE CŒUR DU CHÂTEAU','DECISIONE II · IL CUORE DEL CASTELLO','DECISÃO II · O CORAÇÃO DO CASTELO','DECYZJA II · SERCE ZAMKU','抉择二 · 城堡之心','決断II · 城の中心','KARAR II · ŞATONUN KALBİ','القرار الثاني · قلب القلعة','РЕШЕНИЕ II · СЕРДЦЕ ЗАМКА'),title:T('LIBRARY OR TOWER?','¿BIBLIOTECA O TORRE?','BIBLIOTHEK ODER TURM?','BIBLIOTHÈQUE OU TOUR ?','BIBLIOTECA O TORRE?','BIBLIOTECA OU TORRE?','BIBLIOTEKA CZY WIEŻA?','藏书室还是高塔?','書庫か塔か?','KÜTÜPHANE Mİ, KULE Mİ?','المكتبة أم البرج؟','БИБЛИОТЕКА ИЛИ БАШНЯ?'),story:T('The west passage divides. Papers and keys wait in the red library. An impossible shadow moves beyond the tower window.','El pasillo oeste se divide. Papeles y llaves esperan en la biblioteca roja. Una sombra imposible se mueve tras la ventana de la torre.','Der Westgang teilt sich. Papiere und Schlüssel warten in der roten Bibliothek. Ein unmöglicher Schatten bewegt sich vor dem Turmfenster.','Le couloir ouest se divise. Papiers et clés attendent dans la bibliothèque rouge. Une ombre impossible bouge à la fenêtre de la tour.','Il corridoio ovest si divide. Carte e chiavi aspettano nella biblioteca rossa. Un\'ombra impossibile si muove oltre la finestra della torre.','A passagem oeste divide-se. Papéis e chaves esperam na biblioteca vermelha. Uma sombra impossível move-se para lá da janela da torre.','Zachodni korytarz się rozdziela. Papiery i klucze czekają w czerwonej bibliotece. Niemożliwy cień porusza się za oknem wieży.','西侧通道分成两条。文件与钥匙就在红色藏书室中。一道不可能存在的影子,在塔楼窗外移动。','西の通路が分かれる。赤い書庫には書類と鍵が待つ。塔の窓の向こうでは、あり得ない影が動いている。','Batı koridoru ikiye ayrılır. Kızıl kütüphanede kâğıtlar ve anahtarlar bekler. Kule penceresinin ardında imkânsız bir gölge hareket eder.','ينقسم الممر الغربي. تنتظر أوراق ومفاتيح في المكتبة الحمراء. يتحرك ظل مستحيل خلف نافذة البرج.','Западный проход разделяется. В красной библиотеке ждут бумаги и ключи. За окном башни движется невозможная тень.'),routes:[{name:T('SEARCH THE LIBRARY','REGISTRAR LA BIBLIOTECA','DIE BIBLIOTHEK DURCHSUCHEN','FOUILLER BIBLIOTHÈQUE','ESPLORA LA BIBLIOTECA','PROCURAR NA BIBLIOTECA','PRZESZUKAJ BIBLIOTEKĘ','搜查藏书室','書庫を捜索する','KÜTÜPHANEYİ ARA','فتّش المكتبة','ОБЫСКАТЬ БИБЛИОТЕКУ'),desc:T('Find the false letters and steal a key.','Encuentra las cartas falsas y roba una llave.','Finde die falschen Briefe und stiehl einen Schlüssel.','Trouve les fausses lettres et vole une clé.','Trova le false lettere e ruba una chiave.','Encontre as cartas falsas e roube uma chave.','Znajdź fałszywe listy i ukradnij klucz.','找出伪造的信件,偷走一把钥匙。','偽の手紙を見つけ、鍵を盗む。','Sahte mektupları bul ve bir anahtar çal.','اعثر على الرسائل المزيفة واسرق مفتاحاً.','Найди поддельные письма и укради ключ.'),target:'forged_letters',route:'library'},{name:T('CLIMB THE TOWER','SUBIR A LA TORRE','DEN TURM BESTEIGEN','GRIMPER À LA TOUR','SALI SULLA TORRE','SUBIR À TORRE','WEJDŹ NA WIEŻĘ','攀上高塔','塔を登る','KULEYE TIRMAN','تسلّق البرج','ПОДНЯТЬСЯ НА БАШНЮ'),desc:T('Follow Dracula’s shadow into the storm.','Sigue la sombra de Drácula hacia la tormenta.','Folge Draculas Schatten in den Sturm.','Suis l\'ombre de Dracula dans la tempête.','Segui l\'ombra di Dracula nella tempesta.','Siga a sombra de Drácula até à tempestade.','Podążaj za cieniem Drakuli w burzę.','追随德古拉的影子,步入风暴。','嵐の中、ドラキュラの影を追う。','Drakula\'nın gölgesini fırtınaya kadar takip et.','اتبع ظل دراكولا إلى العاصفة.','Следуй за тенью Дракулы в бурю.'),target:'wall_crawl',route:'tower'}]},
forged_letters:{img:'16_forged_letters',pos:'left',kind:'question',q:11,k:T('ROUTE · THE RED LIBRARY','RUTA · LA BIBLIOTECA ROJA','ROUTE · DIE ROTE BIBLIOTHEK','ROUTE · BIBLIOTHÈQUE ROUGE','VIA · LA BIBLIOTECA ROSSA','ROTA · A BIBLIOTECA VERMELHA','TRASA · CZERWONA BIBLIOTEKA','路线 · 红色藏书室','ルート · 赤い書庫','ROTA · KIZIL KÜTÜPHANE','المسار · المكتبة الحمراء','ПУТЬ · КРАСНАЯ БИБЛИОТЕКА'),title:T('LETTERS FROM A PRISONER','CARTAS DE UN PRISIONERO','BRIEFE EINES GEFANGENEN','LETTRES D\'UN PRISONNIER','LETTERE DI UN PRIGIONIERO','CARTAS DE UM PRISIONEIRO','LISTY WIĘŹNIA','囚徒的信','囚人からの手紙','BİR MAHKUMDAN MEKTUPLAR','رسائل من سجين','ПИСЬМА ПЛЕННИКА'),story:T('Jonathan finds letters dated weeks ahead. Dracula plans to force him to write that he is safe.','Jonathan encuentra cartas fechadas semanas después. Drácula planea obligarlo a escribir que está a salvo.','Jonathan findet Briefe mit Daten Wochen in der Zukunft. Dracula will ihn zwingen zu schreiben, dass er sicher ist.','Jonathan trouve des lettres datées à l\'avance. Dracula veut le forcer à écrire qu\'il va bien.','Jonathan trova lettere datate settimane più avanti. Dracula progetta di costringerlo a scrivere che è al sicuro.','Jonathan encontra cartas datadas de semanas mais tarde. Drácula planeia obrigá-lo a escrever que está a salvo.','Jonathan znajduje listy datowane na kolejne tygodnie. Drakula planuje zmusić go do napisania, że jest bezpieczny.','乔纳森发现了几周后日期的信件。德古拉打算逼他写信,谎称自己安然无恙。','ジョナサンは数週間先の日付が書かれた手紙を見つける。ドラキュラは彼に無事だと書かせるつもりだ。','Jonathan, haftalar sonrasına tarihlenmiş mektuplar bulur. Drakula onu güvende olduğunu yazmaya zorlamayı planlıyor.','يجد جوناثان رسائل مؤرخة بعد أسابيع. يخطط دراكولا لإجباره على كتابة أنه بأمان.','Джонатан находит письма, датированные на недели вперёд. Дракула планирует заставить его написать, что он в безопасности.'),clue:T('Dracula ordered Jonathan to write the letters. Focus on the letters.','Drácula ordenó a Jonathan escribir las cartas. Concéntrate en las cartas.','Dracula befahl Jonathan, die Briefe zu schreiben. Konzentriere dich auf die Briefe.','Dracula a ordonné à Jonathan d\'écrire les lettres. Concentre-toi sur les lettres.','Dracula ha ordinato a Jonathan di scrivere le lettere. Concentrati sulle lettere.','Drácula ordenou a Jonathan que escrevesse as cartas. Concentre-se nas cartas.','Drakula nakazał Jonathanowi napisać listy. Skup się na listach.','德古拉命令乔纳森写下这些信。请聚焦这些信件。','ドラキュラはジョナサンに手紙を書くよう命じた。手紙に焦点を当てよ。','Drakula, Jonathan\'a mektupları yazmasını emretti. Mektuplara odaklan.','أمر دراكولا جوناثان بكتابة الرسائل. ركّز على الرسائل.','Дракула приказал Джонатану написать письма. Сосредоточься на письмах.'),prompt:T('Choose the correct PASSIVE sentence.','Elige la oración correcta en PASIVA.','Wähle den richtigen PASSIVSATZ.','Choisis la phrase correcte au PASSIF.','Scegli la frase corretta in PASSIVA.','Escolha a frase correta na PASSIVA.','Wybierz poprawne zdanie w STRONIE BIERNEJ.','选出正确的被动句。','正しい受動態の文を選べ。','Doğru PASİF cümleyi seç.','اختر الجملة الصحيحة في المبني للمجهول.','Выбери верное предложение в ПАССИВЕ.'),opts:[T('The letters were written under Dracula’s orders.','Las cartas fueron escritas bajo las órdenes de Drácula.','Die Briefe wurden auf Draculas Befehl geschrieben.','Les lettres ont été écrites sur ordre de Dracula.','Le lettere furono scritte sotto gli ordini di Dracula.','As cartas foram escritas sob as ordens de Drácula.','Listy zostały napisane na rozkaz Drakuli.','这些信是在德古拉的命令下写成的。','手紙はドラキュラの命令の下で書かれた。','Mektuplar, Drakula\'nın emriyle yazıldı.','كُتبت الرسائل بأوامر دراكولا.','Письма были написаны по приказу Дракулы.'),T('The letters wrote under Dracula’s orders.','Las cartas escribieron bajo las órdenes de Drácula.','Die Briefe schrieben auf Draculas Befehl.','Les lettres ont écrit sur ordre de Dracula.','Le lettere scrissero sotto gli ordini di Dracula.','As cartas escreveram sob as ordens de Drácula.','Listy napisały na rozkaz Drakuli.','这些信在德古拉的命令下写。','手紙はドラキュラの命令の下で書いた。','Mektuplar Drakula\'nın emriyle yazdı.','الرسائل كَتبت تحت أوامر دراكولا.','Письма написали по приказу Дракулы.'),T('The letters were wrote by Jonathan.','Las cartas fueron escribió por Jonathan.','Die Briefe wurden von Jonathan schrieb.','Les lettres ont été écrire par Jonathan.','Le lettere furono scrisse da Jonathan.','As cartas foram escreveu por Jonathan.','Listy zostały pisać przez Jonathana.','这些信被乔纳森写。','手紙はジョナサンによって書かれる。','Mektuplar Jonathan tarafından yazdı oldu.','كانت الرسائل كَتب من قِبل جوناثان.','Письма были написать Джонатаном.')],answer:0,fb:T('Were + written is the correct past passive.','Fueron + escritas es la pasiva correcta del pasado.','Wurden + geschrieben ist das richtige Passiv der Vergangenheit.','Ont été + écrites est le passif passé correct.','Furono + scritte è la passiva corretta del passato.','Foram + escritas é a passiva correta do passado.','Zostały + napisane to poprawna strona bierna przeszła.','were + written 才是正确的过去时被动。','were+書かれた(written)が正しい過去の受動態。','Were + written (yazıldı), doğru geçmiş zaman pasifidir.','"كُتبت" هي المبني للمجهول الصحيح في الماضي.','Were + written — верный пассив прошедшего.'),next:'stolen_key'},
stolen_key:{img:'17_stolen_key',pos:'right',kind:'question',q:12,k:T('ROUTE · THE MASTER KEY','RUTA · LA LLAVE MAESTRA','ROUTE · DER HAUPTSCHLÜSSEL','ROUTE · LA CLÉ MAÎTRESSE','VIA · LA CHIAVE MAESTRA','ROTA · A CHAVE-MESTRA','TRASA · KLUCZ UNIWERSALNY','路线 · 万能钥匙','ルート · 合鍵','ROTA · ANA ANAHTAR','المسار · المفتاح الرئيسي','ПУТЬ · ГЛАВНЫЙ КЛЮЧ'),title:T('A SHADOW REACHES','UNA SOMBRA SE ACERCA','EIN SCHATTEN GREIFT AUS','UNE OMBRE S\'ÉTEND','UN\'OMBRA SI ALLUNGA','SOMBRA APROXIMA-SE','CIEŃ SIĘGA','阴影伸来','影が伸びる','BİR GÖLGE UZANIYOR','ظل يمتد','ТЕНЬ ТЯНЕТСЯ'),story:T('Dracula has left his black travelling coat on a stand beside the library. The iron west-door key hangs from it while a huge hand-shaped shadow moves across the wall.','Drácula ha dejado su abrigo negro de viaje en un perchero junto a la biblioteca. La llave de hierro de la puerta oeste cuelga de él mientras una enorme sombra con forma de mano cruza la pared.','Dracula hat seinen schwarzen Reisemantel auf einem Ständer neben der Bibliothek zurückgelassen. Der eiserne Schlüssel zur Westtür hängt daran, während ein riesiger handförmiger Schatten über die Wand wandert.','Dracula a laissé son manteau de voyage noir sur un portant près de la bibliothèque. La clé de fer de la porte ouest y pend, tandis qu\'une immense ombre en forme de main glisse sur le mur.','Dracula ha lasciato il suo mantello da viaggio nero su un attaccapanni accanto alla biblioteca. La chiave di ferro della porta ovest vi pende, mentre un\'enorme ombra a forma di mano scorre sulla parete.','Drácula deixou o seu casaco de viagem preto num cabide junto à biblioteca. A chave de ferro da porta oeste pende dele, enquanto uma enorme sombra em forma de mão atravessa a parede.','Drakula zostawił swój czarny płaszcz podróżny na stojaku obok biblioteki. Wisi na nim żelazny klucz do drzwi zachodnich, a po ścianie przesuwa się ogromny cień w kształcie dłoni.','德古拉把他那件黑色旅行斗篷留在了书房旁的衣架上。西门的铁钥匙就挂在上面,而一道巨大的手形阴影正掠过墙壁。','ドラキュラは黒い旅外套を書庫のわきの衣掛けに残していった。鉄の西扉の鍵がそこに下がっている——壁の上を、手の形をした巨大な影が動いていく。','Drakula siyah yolculuk paltosunu kütüphanenin yanındaki askıda bırakmıştır. Demir batı kapısının anahtarı ondan sarkarken, duvarda el biçiminde kocaman bir gölge ilerler.','ترك دراكولا معطف سفره الأسود على حمّالة بجوار المكتبة. مفتاح الباب الغربي الحديدي معلّق فيه، بينما يتحرك ظل هائل على هيئة يد عبر الجدار.','Дракула оставил свой чёрный дорожный плащ на вешалке возле библиотеки. С него свисает железный ключ от западной двери, а по стене движется огромная тень в форме руки.'),clue:T('Taking the key is dangerous, but it may open the west door.','Tomar la llave es peligroso, pero puede abrir la puerta oeste.','Den Schlüssel zu nehmen ist gefährlich, aber er könnte die Westtür öffnen.','Prendre la clé est dangereux, mais elle peut ouvrir la porte ouest.','Prendere la chiave è pericoloso, ma potrebbe aprire la porta ovest.','Tirar a chave é perigoso, mas pode abrir a porta oeste.','Zabranie klucza jest niebezpieczne, ale może otworzyć zachodnie drzwi.','拿走钥匙很危险,但它或许能打开西门。','鍵を取るのは危険だが、西の扉を開けるかもしれない。','Anahtarı almak tehlikeli, ama batı kapısını açabilir.','أخذ المفتاح خطر، لكنه قد يفتح الباب الغربي.','Взять ключ опасно, но он может открыть западную дверь.'),prompt:T('Choose the FIRST CONDITIONAL.','Elige el PRIMER CONDICIONAL.','Wähle den ERSTEN KONDITIONALSATZ.','Choisis le PREMIER CONDITIONNEL.','Scegli il PRIMO CONDIZIONALE.','Escolha o PRIMEIRO CONDICIONAL.','Wybierz PIERWSZY OKRES WARUNKOWY.','选出第一条件句。','第一条件文を選べ。','BİRİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الأول.','Выбери ПЕРВЫЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan stole the key, he unlocks yesterday.','Si Jonathan robara la llave, abre ayer.','Wenn Jonathan den Schlüssel stähle, öffnet er gestern.','Si Jonathan volait la clé, il ouvre hier.','Se Jonathan rubasse la chiave, apre ieri.','Se Jonathan roubasse a chave, ele abre ontem.','Gdyby Jonathan ukradł klucz, otwiera wczoraj.','如果乔纳森偷走了钥匙,他昨天开锁。','もしジョナサンが鍵を盗んだら、昨日開ける。','Jonathan anahtarı çalsaydı, dün açar.','لو سرق جوناثان المفتاح، يفتح أمس.','Если бы Джонатан украл ключ, он отпирает вчера.'),T('If Jonathan steals the key, he will unlock the west door.','Si Jonathan roba la llave, abrirá la puerta oeste.','Wenn Jonathan den Schlüssel stiehlt, wird er die Westtür öffnen.','Si Jonathan vole la clé, il ouvrira la porte ouest.','Se Jonathan ruba la chiave, aprirà la porta ovest.','Se Jonathan roubar a chave, vai abrir a porta oeste.','Jeśli Jonathan ukradnie klucz, otworzy zachodnie drzwi.','如果乔纳森偷走钥匙,他就会打开西门。','もしジョナサンが鍵を盗めば、西の扉を開けるだろう。','Jonathan anahtarı çalarsa, batı kapısını açacak.','إن سرق جوناثان المفتاح، سيفتح الباب الغربي.','Если Джонатан украдёт ключ, он откроет западную дверь.'),T('If Jonathan will steal the key, he unlocked the door.','Si Jonathan robará la llave, abrió la puerta.','Wenn Jonathan den Schlüssel stehlen wird, öffnete er die Tür.','Si Jonathan volera la clé, il a ouvert la porte.','Se Jonathan ruberà la chiave, aprì la porta.','Se Jonathan vai roubar a chave, ele abriu a porta.','Jeśli Jonathan będzie kradł klucz, otworzył drzwi.','如果乔纳森将会偷走钥匙,他打开过门。','もしジョナサンが鍵を盗むでしょうなら、扉を開けた。','Jonathan anahtarı çalacaksa, kapıyı açtı.','إن سيسرق جوناثان المفتاح، فتح الباب.','Если Джонатан будет красть ключ, он открыл дверь.')],answer:1,fb:T('First conditional: present after if, then will + verb.','Primer condicional: presente después de si, después futuro.','Erster Konditionalsatz: Präsens nach wenn, dann wird + Verb.','Premier conditionnel : présent après si, puis futur.','Primo condizionale: presente dopo se, poi futuro.','Primeiro condicional: presente depois de se, depois futuro.','Pierwszy okres warunkowy: czas teraźniejszy po if, potem czas przyszły.','第一条件句:if 之后用现在时,然后 will + 动词。','第一条件文:ifの後は現在形、その後will+動詞。','Birinci şart cümlesi: eğer\'den sonra geniş zaman, ardından will + fiil.','الشرط الأول: مضارع بعد إن، ثم سـ + فعل.','Первый условный: настоящее после if, потом will + глагол.'),evidence:1,next:'servant_stair'},
wall_crawl:{img:'18_wall_crawl',pos:'center',kind:'question',q:11,k:T('ROUTE · THE NORTH TOWER','RUTA · LA TORRE NORTE','ROUTE · DER NORDTURM','ROUTE · LA TOUR NORD','VIA · LA TORRE NORD','ROTA · A TORRE NORTE','TRASA · PÓŁNOCNA WIEŻA','路线 · 北塔','ルート · 北の塔','ROTA · KUZEY KULESİ','المسار · البرج الشمالي','ПУТЬ · СЕВЕРНАЯ БАШНЯ'),title:T('THE WALL WALKER','EL QUE CAMINA POR LA PARED','DER WANDKRIECHER','MARCHEUR DU MUR','CAMMINA SUL MURO','ANDARILHO DA PAREDE','WĘDROWIEC PO MURZE','行于墙上者','壁を歩く者','DUVARDA YÜRÜYEN','السائر على الجدار','ИДУЩИЙ ПО СТЕНЕ'),story:T('Dracula crawls head-first down the outer wall. His cape falls upward into the storm.','Drácula baja de cabeza por el muro exterior. Su capa cae hacia arriba en la tormenta.','Dracula kriecht kopfüber die Außenwand hinab. Sein Umhang fällt nach oben in den Sturm.','Dracula rampe tête première le long du mur extérieur. Sa cape tombe vers le haut dans la tempête.','Dracula scende a testa in giù lungo il muro esterno. Il suo mantello cade verso l\'alto nella tempesta.','Drácula desce de cabeça para baixo pela parede exterior. A sua capa cai para cima, em direção à tempestade.','Drakula schodzi głową w dół po zewnętrznym murze. Jego peleryna unosi się w górę, ku burzy.','德古拉头朝下,沿着外墙向下爬行。他的斗篷竟朝上飘入风暴之中。','ドラキュラが頭を下にして外壁を這い下りる。マントは嵐の中で上向きに翻る。','Drakula, dış duvardan baş aşağı sürünerek iner. Pelerini fırtınaya doğru yukarı savrulur.','يزحف دراكولا رأساً على عقب أسفل الجدار الخارجي. تسقط عباءته إلى الأعلى في العاصفة.','Дракула ползёт головой вниз по внешней стене. Его плащ падает вверх, в бурю.'),clue:T('Jonathan saw Dracula on the wall. Put Dracula first, but keep the focus on what Jonathan observed.','Jonathan vio a Drácula en la pared. Pon a Drácula primero, pero mantén el foco en lo observado.','Jonathan sah Dracula an der Wand. Stelle Dracula an den Anfang, aber konzentriere dich auf die Beobachtung.','Jonathan a vu Dracula sur le mur. Mets Dracula en premier, mais garde le foyer sur ce que Jonathan a observé.','Jonathan ha visto Dracula sul muro. Metti Dracula per primo, ma mantieni il focus su ciò che Jonathan ha osservato.','Jonathan viu Drácula na parede. Ponha Drácula primeiro, mas mantenha o foco no que foi observado.','Jonathan zobaczył Drakulę na murze. Postaw Drakulę na pierwszym miejscu, ale zachowaj skupienie na tym, co zaobserwował Jonathan.','乔纳森看见了墙上的德古拉。请把德古拉放在前面,但焦点仍在乔纳森所见之事。','ジョナサンは壁の上のドラキュラを見た。ドラキュラを先に置きつつ、ジョナサンが観察した内容に焦点を当てよ。','Jonathan, Drakula\'yı duvarda gördü. Önce Drakula\'yı söyle, ama odağı Jonathan\'ın gördüğünde tut.','رأى جوناثان دراكولا على الجدار. ضع دراكولا أولاً، لكن حافظ على التركيز على ما شاهده جوناثان.','Джонатан увидел Дракулу на стене. Поставь Дракулу первым, но сохрани фокус на увиденном.'),prompt:T('Choose the correct PAST PASSIVE.','Elige la PASIVA DEL PASADO correcta.','Wähle das richtige PASSIV DER VERGANGENHEIT.','Choisis le PASSIF PASSÉ correct.','Scegli PASSIVA DEL PASSATO corretta.','Escolha a PASSIVA DO PASSADO correta.','Wybierz poprawną STRONĘ BIERNĄ CZASU PRZESZŁEGO.','选出正确的过去时被动句。','正しい過去の受動態を選べ。','Doğru GEÇMİŞ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في الماضي الصحيح.','Выбери верный ПАССИВ ПРОШЕДШЕГО.'),opts:[T('Dracula seen crawling by Jonathan.','Drácula visto bajando por Jonathan.','Dracula gesehen kriechend von Jonathan.','Dracula vu ramper par Jonathan.','Dracula visto scendere da Jonathan.','Drácula visto a descer por Jonathan.','Drakula widziany schodzący przez Jonathana.','德古拉看见被乔纳森爬行。','ドラキュラはジョナサンによって這うのを見られる。','Jonathan tarafından Drakula duvarda sürünerek gördü.','دراكولا رأى يزحف من قِبل جوناثان.','Дракула видел ползущим Джонатаном.'),T('Dracula is saw crawling by Jonathan.','Drácula es vio bajando por Jonathan.','Dracula wird von Jonathan sah kriechend.','Dracula est vit ramper par Jonathan.','Dracula è vide scendere da Jonathan.','Drácula é viu a descer por Jonathan.','Drakula jest widział schodzącego przez Jonathana.','德古拉是看见被乔纳森爬行着。','ドラキュラはジョナサンが這うのを見た。','Drakula duvarda sürünerek Jonathan tarafından görür.','دراكولا يُرى يزحف من قِبل جوناثان.','Дракула есть видел ползущим Джонатаном.'),T('Dracula was seen crawling down the wall.','Drácula fue visto bajando por el muro.','Dracula wurde gesehen, wie er die Wand hinabkroch.','Dracula a été vu ramper le long du mur.','Dracula fu visto scendere lungo il muro.','Drácula foi visto a descer pela parede.','Drakula został widziany, jak schodzi po murze.','德古拉被看见正沿墙爬下。','ドラキュラは壁を這い下りるところを見られた。','Drakula, duvardan sürünerek inerken görüldü.','رُئي دراكولا يزحف أسفل الجدار.','Дракула был замечен ползущим по стене.')],answer:2,fb:T('Was seen is the past passive; crawling describes the action observed.','Fue visto es la pasiva del pasado; bajando describe la acción observada.','Wurde gesehen ist das Passiv der Vergangenheit; kriechend beschreibt die beobachtete Handlung.','A été vu est le passif passé ; ramper décrit l\'action observée.','Fu visto è la passiva del passato; scendere descrive l\'azione osservata.','Foi visto é a passiva do passado; a descer descreve a ação observada.','Został widziany to strona bierna czasu przeszłego; schodzący opisuje zaobserwowaną czynność.','was seen 是过去时被动;crawling 描述被观察到的动作。','was seen(見られた)が過去の受動態;crawling(這っている)は観察された動作を表す。','Was seen (görüldü), geçmiş zaman pasifidir; sürünerek, gözlemlenen eylemi anlatır.','"رُئي" هو المبني للمجهول في الماضي؛ و"يزحف" يصف الفعل الذي شوهد.','Was seen — это пассив прошедшего; crawling описывает увиденное действие.'),next:'vampire_brides'},
vampire_brides:{img:'19_vampire_brides',pos:'left',kind:'question',q:12,k:T('ROUTE · THE FORBIDDEN ROOM','RUTA · LA HABITACIÓN PROHIBIDA','ROUTE · DAS VERBOTENE ZIMMER','ROUTE · LA CHAMBRE INTERDITE','VIA · LA STANZA PROIBITA','ROTA · O QUARTO PROIBIDO','TRASA · ZAKAZANY POKÓJ','路线 · 禁室','ルート · 禁じられた部屋','ROTA · YASAK ODA','المسار · الغرفة المحرّمة','ПУТЬ · ЗАПРЕТНАЯ КОМНАТА'),title:T('THE THREE BRIDES','LAS TRES NOVIAS','DIE DREI BRÄUTE','LES TROIS ÉPOUSES','LE TRE SPOSE','AS TRÊS NOIVAS','TRZY NARZECZONE','三位新娘','三人の花嫁','ÜÇ GELİN','العرائس الثلاث','ТРИ НЕВЕСТЫ'),story:T('Following Dracula’s shadow, Jonathan enters an abandoned tower bedroom and collapses on its bed. Three vampire brides lean over him. Dracula arrives and drives them back one heartbeat before they bite.','Siguiendo la sombra de Drácula, Jonathan entra en un dormitorio abandonado de la torre y cae sobre la cama. Tres novias vampiras se inclinan sobre él. Drácula llega y las aparta un instante antes de que muerdan.','Jonathan folgt Draculas Schatten in ein verlassenes Turmschlafzimmer und sinkt auf das Bett. Drei Vampirbräute beugen sich über ihn. Dracula erscheint und treibt sie einen Herzschlag vor dem Biss zurück.','Suivant l\'ombre de Dracula, Jonathan entre dans une chambre de tour abandonnée et s\'effondre sur le lit. Trois épouses vampires se penchent sur lui. Dracula arrive et les repousse un battement de cœur avant la morsure.','Seguendo l\'ombra di Dracula, Jonathan entra in una camera abbandonata della torre e crolla sul letto. Tre spose vampire si chinano su di lui. Dracula arriva e le ricaccia indietro un battito di cuore prima del morso.','Seguindo a sombra de Drácula, Jonathan entra num quarto abandonado da torre e desaba na cama. Três noivas vampiras debruçam-se sobre ele. Drácula chega e afasta-as um batimento de coração antes da dentada.','Idąc za cieniem Drakuli, Jonathan wchodzi do opuszczonej sypialni w wieży i pada na łóżko. Trzy wampirze narzeczone pochylają się nad nim. Drakula zjawia się i odpycha je uderzenie serca przed ukąszeniem.','循着德古拉的影子,乔纳森走进一间废弃的塔楼卧室,倒在床上。三位吸血鬼新娘俯身向他。就在利齿落下的前一瞬,德古拉赶到,把她们逼退。','ドラキュラの影を追って、ジョナサンは打ち捨てられた塔の寝室に入り、寝台に倒れ込む。三人の吸血鬼の花嫁が彼の上に身を屈める。牙が届く一拍前に、ドラキュラが現れて彼女たちを退ける。','Drakula\'nın gölgesini izleyen Jonathan, terk edilmiş bir kule yatak odasına girer ve yatağın üstüne yığılır. Üç vampir gelin üzerine eğilir. Isırıktan bir kalp atışı önce Drakula gelip onları geri püskürtür.','يتبع جوناثان ظل دراكولا فيدخل غرفة نوم مهجورة في البرج وينهار على السرير. تنحني عليه ثلاث عرائس مصاصات دماء. ويصل دراكولا فيردّهنّ قبل العضّة بنبضة قلب واحدة.','Следуя за тенью Дракулы, Джонатан входит в заброшенную спальню башни и падает на кровать. Три невесты-вампирши склоняются над ним. Дракула появляется и отгоняет их за удар сердца до укуса.'),clue:T('Dracula arrived in time. Imagine that he arrived later.','Drácula llegó a tiempo. Imagina que hubiera llegado más tarde.','Dracula kam rechtzeitig. Stell dir vor, er wäre später gekommen.','Dracula est arrivé à temps. Imagine qu\'il soit arrivé plus tard.','Dracula arrivò in tempo. Immagina che fosse arrivato più tardi.','Drácula chegou a tempo. Imagine que tinha chegado mais tarde.','Drakula przybył na czas. Wyobraź sobie, że przybyłby później.','德古拉及时赶到了。设想他来得更晚。','ドラキュラは間に合った。彼がもっと遅く着いたと想像せよ。','Drakula zamanında geldi. Daha geç geldiğini hayal et.','وصل دراكولا في الوقت المناسب. تخيّل أنه وصل متأخراً.','Дракула прибыл вовремя. Представь, что он прибыл позже.'),prompt:T('Choose the THIRD CONDITIONAL.','Elige el TERCER CONDICIONAL.','Wähle den DRITTEN KONDITIONALSATZ.','Choisis le TROISIÈME CONDITIONNEL.','Scegli il TERZO CONDIZIONALE.','Escolha o TERCEIRO CONDICIONAL.','Wybierz TRZECI OKRES WARUNKOWY.','选出第三条件句。','第三条件文を選べ。','ÜÇÜNCÜ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثالث.','Выбери ТРЕТИЙ УСЛОВНЫЙ.'),opts:[T('If Dracula had arrived later, the brides would have bitten Jonathan.','Si Drácula hubiera llegado más tarde, las novias habrían mordido a Jonathan.','Wenn Dracula später gekommen wäre, hätten die Bräute Jonathan gebissen.','Si Dracula était arrivé plus tard, les épouses auraient mordu Jonathan.','Se Dracula fosse arrivato più tardi, le spose avrebbero morso Jonathan.','Se Drácula tivesse chegado mais tarde, as noivas teriam mordido Jonathan.','Gdyby Drakula przybył później, narzeczone ukąsiłyby Jonathana.','如果德古拉来得更晚,新娘们本会咬伤乔纳森。','もしドラキュラがもっと遅く着いていたら、花嫁たちはジョナサンを噛んでいただろう。','Drakula daha geç gelmiş olsaydı, gelinler Jonathan\'ı ısırmış olurdu.','لو وصل دراكولا متأخراً، لكانت العرائس قد عضّت جوناثان.','Если бы Дракула прибыл позже, невесты укусили бы Джонатана.'),T('If Dracula arrived later, the brides will bite Jonathan.','Si Drácula llegó más tarde, las novias morderán a Jonathan.','Wenn Dracula später kam, werden die Bräute Jonathan beißen.','Si Dracula arrivait plus tard, les épouses mordront Jonathan.','Se Dracula arrivò più tardi, le spose morderanno Jonathan.','Se Drácula chegou mais tarde, as noivas vão morder Jonathan.','Jeśli Drakula przybył później, narzeczone ukąszą Jonathana.','如果德古拉来得更晚,新娘们将会咬乔纳森。','もしドラキュラがもっと遅く着いたら、花嫁たちはジョナサンを噛むだろう。','Drakula daha geç gelseydi, gelinler Jonathan\'ı ısıracak.','إن وصل دراكولا متأخراً، ستعض العرائس جوناثان.','Если Дракула прибыл позже, невесты укусят Джонатана.'),T('If Dracula had arrive later, the brides would bite yesterday.','Si Drácula hubiera llegar más tarde, las novias morderían ayer.','Wenn Dracula später gekommen, würden die Bräute gestern beißen.','Si Dracula avait arriver plus tard, les épouses mordraient hier.','Se Dracula fosse arrivare più tardi, le spose morderebbero ieri.','Se Drácula tivesse chegar mais tarde, as noivas morderiam ontem.','Gdyby Drakula przybyć później, narzeczone ukąsiłyby wczoraj.','如果德古拉当初来得更晚,新娘们昨天就会咬人。','もしドラキュラが遅く着いていたら、花嫁たちは昨日噛むだろう。','Drakula daha geç gel olsaydı, gelinler dün ısırırdı.','لو دراكولا يصل متأخراً، لعضّت العرائس أمس.','Если бы Дракула прибыть позже, невесты кусали бы вчера.')],answer:0,fb:T('Third conditional imagines a different past: if + had + participle, then would have + participle.','El tercer condicional imagina un pasado diferente: si + hubiera + participio, después habría + participio.','Der dritte Konditionalsatz stellt eine andere Vergangenheit vor: wenn + Plusquamperfekt, dann hätte/wäre + Partizip.','Le troisième conditionnel imagine un passé différent : si + plus-que-parfait, puis conditionnel passé.','Il terzo condizionale immagina un passato diverso: se + trapassato, poi avrebbe + participio.','O terceiro condicional imagina um passado diferente: se + tivesse + particípio, depois teria + particípio.','Trzeci okres warunkowy wyobraża inną przeszłość: jeśli + zaprzeszły, potem would have + III forma czasownika.','第三条件句设想不同的过去:if + had + 过去分词,然后 would have + 过去分词。','第三条件文は異なる過去を想像する:if+had+過去分詞、その後would have+過去分詞。','Üçüncü şart cümlesi farklı bir geçmişi hayal eder: eğer + had + ortaç, ardından would have + ortaç.','الشرط الثالث يتخيل ماضياً مختلفاً: إن + كان قد + التصريف الثالث، ثم لـ + كان قد + التصريف الثالث.','Третий условный описывает иное прошлое: если + had + 3-я форма, потом would have + 3-я форма.'),evidence:1,next:'fallen_key'},
shipping_plan:{img:'32_shipping_plan',pos:'left',kind:'story',k:T('BELOW THE WEST ROOMS · HIDDEN RECORDS','BAJO LAS HABITACIONES DEL OESTE · ARCHIVOS OCULTOS','UNTER DEN WESTZIMMERN · VERBORGENE AKTEN','SOUS LES CHAMBRES OUEST · ARCHIVES CACHÉES','SOTTO LE STANZE OVEST · ARCHIVI NASCOSTI','SOB OS QUARTOS DO OESTE · REGISTOS OCULTOS','POD ZACHODNIMI KOMNATAMI · UKRYTE ARCHIWA','西厢之下 · 隐秘档案','西の部屋の下 · 隠された記録','BATI ODALARININ ALTINDA · GİZLİ KAYITLAR','أسفل الغرف الغربية · سجلات خفية','ПОД ЗАПАДНЫМИ КОМНАТАМИ · СКРЫТЫЕ АРХИВЫ'),title:T('ENGLAND IS THE DESTINATION','INGLATERRA ES EL DESTINO','ENGLAND IST DAS ZIEL','L\'ANGLETERRE EST LA DESTINATION','L\'INGHILTERRA È LA DESTINAZIONE','A INGLATERRA É O DESTINO','ANGLIA JEST CELEM','目的地是英格兰','目的地はイングランド','HEDEF İNGİLTERE','إنجلترا هي الوجهة','АНГЛИЯ — ЦЕЛЬ ПУТИ'),story:T('The records chamber contains copies of Jonathan’s forced letters, an English property deed, a shipping ledger and cargo tags beside a model of a black ship. Through the cellar arch, workers carry heavy boxes toward waiting wagons.','La sala de archivos contiene copias de las cartas forzadas de Jonathan, una escritura inglesa, un registro de envíos y etiquetas de carga junto a la maqueta de un barco negro. Por el arco del sótano, los trabajadores llevan pesadas cajas hacia los carros.','Im Aktenraum liegen Kopien von Jonathans erzwungenen Briefen, eine englische Besitzurkunde, ein Frachtbuch und Gepäckanhänger neben dem Modell eines schwarzen Schiffes. Durch den Kellerbogen tragen Arbeiter schwere Kisten zu wartenden Wagen.','La salle des archives contient des copies des lettres que Jonathan a été forcé d\'écrire, un acte de propriété anglais, un registre d\'expédition et des étiquettes de fret, à côté de la maquette d\'un navire noir. Par l\'arcade de la cave, des ouvriers portent de lourdes caisses vers des chariots qui attendent.','La sala degli archivi contiene copie delle lettere che Jonathan è stato costretto a scrivere, un atto di proprietà inglese, un registro di spedizione e cartellini di carico accanto al modello di una nave nera. Oltre l\'arco della cantina, gli operai portano casse pesanti verso i carri in attesa.','A sala de arquivos contém cópias das cartas que Jonathan foi obrigado a escrever, uma escritura de propriedade inglesa, um livro de embarques e etiquetas de carga junto à maqueta de um navio negro. Pelo arco da cave, os trabalhadores levam caixas pesadas para carroças à espera.','W sali archiwum leżą kopie listów, które Jonathan musiał napisać, angielski akt własności, księga przewozowa i etykiety ładunkowe obok modelu czarnego statku. Za łukiem piwnicy robotnicy niosą ciężkie skrzynie ku czekającym wozom.','档案室里放着乔纳森被迫写下的信件副本、一份英格兰地产契约、一本装运登记簿和货运标签,旁边是一艘黑船的模型。透过地窖的拱门,工人们正把沉重的木箱搬向等候的马车。','記録室には、ジョナサンが書かされた手紙の写し、イングランドの不動産権利証、船積み台帳、貨物札が、黒い船の模型のかたわらに並んでいる。地下室のアーチの向こうでは、人夫たちが重い箱を待機する荷車へと運んでいる。','Kayıt odasında Jonathan\'a zorla yazdırılan mektupların kopyaları, bir İngiliz mülk tapusu, bir sevkiyat defteri ve yük etiketleri, siyah bir geminin maketinin yanında durur. Mahzen kemerinin ötesinde işçiler ağır kutuları bekleyen arabalara taşır.','تضمّ غرفة السجلات نسخاً من الرسائل التي أُجبر جوناثان على كتابتها، وسند ملكية إنجليزياً، ودفتر شحن، وبطاقات بضائع، إلى جوار نموذج لسفينة سوداء. ومن قوس القبو، يحمل العمال صناديق ثقيلة نحو عربات تنتظر.','В архивной палате лежат копии писем, которые Джонатана заставили написать, английская купчая на имение, судовой реестр и грузовые бирки — рядом с моделью чёрного корабля. За аркой подвала рабочие несут тяжёлые ящики к ожидающим повозкам.'),note:T('Now the pieces connect: the forced letters will hide Jonathan’s disappearance, the English estate will shelter Dracula, and the boxes will carry his native earth west.','Ahora las piezas encajan: las cartas forzadas ocultarán la desaparición de Jonathan, la propiedad inglesa dará refugio a Drácula y las cajas llevarán su tierra natal hacia el oeste.','Jetzt passt alles zusammen: Die erzwungenen Briefe werden Jonathans Verschwinden verbergen, das englische Anwesen wird Dracula schützen und die Kisten werden seine Heimaterde nach Westen bringen.','Maintenant les pièces s\'assemblent : les lettres forcées cacheront la disparition de Jonathan, la propriété anglaise abritera Dracula, et les caisses transporteront sa terre natale vers l\'ouest.','Ora i pezzi combaciano: le lettere forzate nasconderanno la scomparsa di Jonathan, la tenuta inglese darà rifugio a Dracula, e le casse porteranno la sua terra natale verso ovest.','Agora as peças encaixam: as cartas forçadas vão esconder o desaparecimento de Jonathan, a propriedade inglesa vai abrigar Drácula, e as caixas vão levar a sua terra natal para o oeste.','Teraz wszystko się układa: wymuszone listy ukryją zniknięcie Jonathana, angielska posiadłość da schronienie Drakuli, a skrzynie zawiozą jego rodzimą ziemię na zachód.','此刻线索终于连成一线:被迫写下的信件将掩盖乔纳森的失踪,英格兰的庄园将庇护德古拉,而那些木箱将载着他的故土泥土西行。','ここでつながりが見えてくる:強要された手紙はジョナサンの失踪を隠し、イングランドの屋敷はドラキュラを匿い、箱は彼の故郷の土を西へ運ぶ。','Artık parçalar birleşiyor: zorla yazdırılan mektuplar Jonathan\'ın kayboluşunu gizleyecek, İngiliz malikânesi Drakula\'ya sığınak olacak ve kutular onun ana toprağını batıya taşıyacak.','الآن تترابط القطع: الرسائل المُجبرة ستُخفي اختفاء جوناثان، والعقار الإنجليزي سيؤوي دراكولا، والصناديق ستحمل ترابه الأصلي غرباً.','Теперь всё складывается: вынужденные письма скроют исчезновение Джонатана, английское поместье укроет Дракулу, а ящики понесут его родную землю на запад.'),next:'earth_boxes'},
earth_boxes:{img:'20_earth_boxes',pos:'left',kind:'question',q:13,k:T('CASTLE CELLAR · FIFTY BOXES','SÓTANO DEL CASTILLO · CINCUENTA CAJAS','SCHLOSSKELLER · FÜNFZIG KISTEN','CAVE DU CHÂTEAU · 50 CAISSES','CANTINA CASTELLO · 50 CASSE','CAVE DO CASTELO · CINQUENTA CAIXAS','PIWNICA ZAMKOWA · PIĘĆDZIESIĄT SKRZYŃ','城堡地窖 · 五十只木箱','城の地下室 · 五十の箱','ŞATO MAHZENİ · ELLİ KUTU','قبو القلعة · خمسون صندوقاً','ПОДВАЛ ЗАМКА · ПЯТЬДЕСЯТ ЯЩИКОВ'),title:T('EARTH FOR A NEW COUNTRY','ERDE PARA UN PAÍS NUEVO','ERDE FÜR EIN NEUES LAND','TERRE POUR UN NOUVEAU PAYS','TERRA PER UN PAESE NUOVO','TERRA PARA UM NOVO PAÍS','ZIEMIA DLA NOWEGO KRAJU','带往新国度的泥土','新天地のための土','YENİ BİR ÜLKE İÇİN TOPRAK','تراب لبلد جديد','ЗЕМЛЯ ДЛЯ НОВОЙ СТРАНЫ'),story:T('The cellar is packed with boxes of Transylvanian earth. One open box holds Dracula. His eyes are open, but his body lies rigid and helpless in the soil. Before Jonathan can act, workers’ lanterns approach.','El sótano está lleno de cajas de tierra transilvana. Una caja abierta contiene a Drácula. Tiene los ojos abiertos, pero su cuerpo yace rígido e indefenso en la tierra. Antes de que Jonathan pueda actuar, se acercan las lámparas de los trabajadores.','Der Keller ist voller Kisten mit transsilvanischer Erde. In einer offenen Kiste liegt Dracula. Seine Augen sind offen, doch sein Körper liegt starr und hilflos in der Erde. Bevor Jonathan handeln kann, nähern sich die Laternen der Arbeiter.','La cave est remplie de caisses de terre transylvanienne. Une caisse ouverte contient Dracula. Ses yeux sont ouverts, mais son corps gît raide et sans force dans la terre. Avant que Jonathan puisse agir, les lanternes des ouvriers approchent.','La cantina è piena di casse di terra della Transilvania. Una cassa aperta contiene Dracula. Ha gli occhi aperti, ma il corpo giace rigido e inerme nella terra. Prima che Jonathan possa agire, le lanterne degli operai si avvicinano.','A cave está cheia de caixas com terra da Transilvânia. Uma caixa aberta contém Drácula. Tem os olhos abertos, mas o corpo jaz rígido e indefeso na terra. Antes que Jonathan possa agir, as lanternas dos trabalhadores aproximam-se.','Piwnica jest zapełniona skrzyniami z transylwańską ziemią. W jednej otwartej leży Drakula. Ma otwarte oczy, lecz jego ciało spoczywa sztywno i bezbronnie w ziemi. Zanim Jonathan zdąży coś zrobić, zbliżają się latarnie robotników.','地窖里堆满了装着特兰西瓦尼亚泥土的木箱。一只敞开的箱子里躺着德古拉。他双眼睁着,身体却僵直无力地陷在泥土中。乔纳森还来不及动手,工人的灯笼已经逼近。','地下室はトランシルヴァニアの土を詰めた箱でいっぱいだ。蓋の開いた一つにドラキュラが横たわっている。目は開いているが、体は土の中で硬直し、なすすべもない。ジョナサンが手を下す前に、人夫たちの提灯が近づいてくる。','Mahzen, Transilvanya toprağıyla dolu kutularla tıka basa doludur. Açık duran bir kutuda Drakula yatar. Gözleri açıktır, ama bedeni toprağın içinde katı ve çaresiz uzanır. Jonathan harekete geçemeden işçilerin fenerleri yaklaşır.','القبو مكتظ بصناديق من تراب ترانسيلفانيا. في صندوق مفتوح يرقد دراكولا. عيناه مفتوحتان، لكن جسده ممدّد في التراب متيبّساً عاجزاً. وقبل أن يتمكّن جوناثان من الحركة، تقترب فوانيس العمال.','Подвал заполнен ящиками с трансильванской землёй. В одном открытом ящике лежит Дракула. Глаза его открыты, но тело коченеет в земле, беспомощное. Прежде чем Джонатан успевает что-либо сделать, приближаются фонари рабочих.'),clue:T('Workers filled the boxes. The result is visible now.','Los trabajadores llenaron las cajas. El resultado es visible ahora.','Arbeiter füllten die Kisten. Das Ergebnis ist jetzt sichtbar.','Les ouvriers ont rempli les caisses. Visible maintenant.','I lavoratori hanno riempito le casse. Il risultato è visibile.','Os trabalhadores encheram as caixas. O resultado é visível agora.','Robotnicy napełnili skrzynie. Rezultat jest widoczny teraz.','工人们装满了这些木箱。结果如今清晰可见。','労働者たちが箱に土を詰めた。その結果は今見えている。','İşçiler kutuları doldurdu. Sonuç şimdi görünür.','ملأ العمال الصناديق. النتيجة مرئية الآن.','Рабочие заполнили ящики. Результат виден сейчас.'),prompt:T('Choose the PRESENT PERFECT PASSIVE.','Elige la PASIVA DEL PRETÉRITO PERFECTO.','Wähle das PERFEKT-PASSIV.','Choisis le PASSIF AU PASSÉ COMPOSÉ.','Scegli la PASSIVA DEL PRESENTE PERFETTO.','Escolha a PASSIVA DO PRETÉRITO PERFEITO.','Wybierz STRONĘ BIERNĄ w czasie PRESENT PERFECT.','选出现在完成时的被动句。','現在完了の受動態を選べ。','YAKIN GEÇMİŞ ZAMAN PASİFİ\'ni seç.','اختر المبني للمجهول في المضارع التام.','Выбери ПЕРФЕКТНЫЙ ПАССИВ.'),opts:[T('Fifty boxes have filled with earth.','Cincuenta cajas han llenado con tierra.','Fünfzig Kisten haben mit Erde gefüllt.','50 caisses ont rempli de terre.','Cinquanta casse hanno riempito di terra.','Cinquenta caixas têm enchido com terra.','Pięćdziesiąt skrzyń napełniło ziemią.','五十只木箱已经装满泥土。','五十の箱は土で満たしてきた。','Elli kutu toprak doldurmuş.','خمسون صندوقاً قد ملأت بالتراب.','Пятьдесят ящиков наполнили землёй.'),T('Fifty boxes have been filled with earth.','Cincuenta cajas han sido llenadas con tierra.','Fünfzig Kisten sind mit Erde gefüllt worden.','50 caisses ont été remplies de terre.','Cinquanta casse sono state riempite di terra.','Cinquenta caixas têm sido enchidas com terra.','Pięćdziesiąt skrzyń zostało napełnionych ziemią.','五十只木箱已经被装满了泥土。','五十の箱は土で満たされてきた。','Elli kutu toprakla doldurulmuş.','خمسون صندوقاً قد مُلئت بالتراب.','Пятьдесят ящиков были наполнены землёй.'),T('Fifty boxes were been filling with earth.','Cincuenta cajas fueron sido llenando con tierra.','Fünfzig Kisten wurden mit Erde füllend gewesen.','50 caisses étaient été remplissant de terre.','Cinquanta casse furono state riempiendo di terra.','Cinquenta caixas foram sido a encher com terra.','Pięćdziesiąt skrzyń były zostały napełniające ziemią.','五十只木箱曾经被正在装泥土。','五十の箱は土で満たされていた。','Elli kutu toprakla doluyor olmuştu.','خمسون صندوقاً كانت قد كان يُملأ بالتراب.','Пятьдесят ящиков были быть наполняющими землёй.')],answer:1,fb:T('Present perfect passive: have/has + been + past participle.','Pasiva del pretérito perfecto: ha/han + sido + participio.','Perfekt-Passiv: ist/sind + Partizip II + worden.','Passif au passé composé : a/ont été + participe passé.','Passiva del presente perfetto: sono state + participio.','Passiva do pretérito perfeito: tem/têm + sido + particípio.','Strona bierna Present Perfect: have/has + been + III forma czasownika.','现在完成时被动:have/has + been + 过去分词。','現在完了の受動態:have/has+been+過去分詞。','Yakın geçmiş zaman pasifi: have/has + been + geçmiş zaman ortacı.','المبني للمجهول في المضارع التام: قد كان/كانت + التصريف الثالث.','Пассив перфекта: have/has + been + 3-я форма глагола.'),next:'box_moved'},
stolen_clothes:{img:'33_stolen_clothes',pos:'left',kind:'story',k:T('JONATHAN’S ROOM · SOMETHING IS MISSING','HABITACIÓN DE JONATHAN · FALTA ALGO','JONATHANS ZIMMER · ETWAS FEHLT','CHAMBRE DE JONATHAN · QUELQUE CHOSE MANQUE','LA STANZA DI JONATHAN · MANCA QUALCOSA','QUARTO DE JONATHAN · FALTA ALGO','POKÓJ JONATHANA · CZEGOŚ BRAKUJE','乔纳森的房间 · 少了些什么','ジョナサンの部屋 · 何かが消えている','JONATHAN\'IN ODASI · BİR ŞEY EKSİK','غرفة جوناثان · شيء مفقود','КОМНАТА ДЖОНАТАНА · ЧТО-ТО ПРОПАЛО'),title:T('THE COUNT STOLE HIS CLOTHES','EL CONDE ROBÓ SU ROPA','DER GRAF STAHL SEINE KLEIDER','LE COMTE A VOLÉ SES VÊTEMENTS','IL CONTE RUBÒ I SUOI VESTITI','O CONDE ROUBOU-LHE A ROUPA','HRABIA UKRADŁ JEGO UBRANIA','伯爵偷走了他的衣服','伯爵は彼の服を盗んだ','KONT ONUN KIYAFETLERİNİ ÇALDI','الكونت سرق ثيابه','ГРАФ УКРАЛ ЕГО ОДЕЖДУ'),story:T('Jonathan returns to his room. His missing travelling coat and hat have been returned to the wardrobe. One cuff is smeared with blood. Dracula wore them beyond the castle so witnesses would blame the English prisoner—and then returned them.','Jonathan regresa a su habitación. Su abrigo de viaje y su sombrero desaparecidos han sido devueltos al armario. Un puño está manchado de sangre. Drácula los usó fuera del castillo para que los testigos culparan al prisionero inglés y después los devolvió.','Jonathan kehrt in sein Zimmer zurück. Sein verschwundener Reisemantel und sein Hut sind in den Schrank zurückgebracht worden. Eine Manschette ist blutverschmiert. Dracula trug die Sachen außerhalb des Schlosses, damit Zeugen den englischen Gefangenen beschuldigten – und brachte sie dann zurück.','Jonathan revient dans sa chambre. Son manteau de voyage et son chapeau, disparus, ont été remis dans l\'armoire. Une manchette est maculée de sang. Dracula les a portés hors du château pour que les témoins accusent le prisonnier anglais — puis il les a rendus.','Jonathan torna nella sua stanza. Il cappotto da viaggio e il cappello scomparsi sono stati rimessi nell\'armadio. Un polsino è sporco di sangue. Dracula li ha indossati fuori dal castello perché i testimoni accusassero il prigioniero inglese, e poi li ha restituiti.','Jonathan regressa ao seu quarto. O casaco de viagem e o chapéu que faltavam foram devolvidos ao guarda-roupa. Um punho está manchado de sangue. Drácula usou-os para lá do castelo para que as testemunhas culpassem o prisioneiro inglês — e depois devolveu-os.','Jonathan wraca do swojego pokoju. Zaginiony płaszcz podróżny i kapelusz wróciły do szafy. Jeden mankiet jest zbroczony krwią. Drakula nosił je poza zamkiem, by świadkowie obwinili angielskiego więźnia — a potem je odniósł.','乔纳森回到房间。原本不见了的旅行外套和帽子,已被放回衣柜。一只袖口沾着血。德古拉曾穿着它们走出城堡,好让目击者把罪责推到这个英格兰囚徒身上——然后又把它们送了回来。','ジョナサンは自室へ戻る。消えていた旅外套と帽子が、衣裳戸棚に返されている。片方の袖口には血がにじんでいる。ドラキュラはそれを着て城の外へ出た——目撃者がイングランド人の囚人を疑うように。そして、返しておいたのだ。','Jonathan odasına döner. Kaybolan yolculuk paltosu ile şapkası gardıroba geri konmuştur. Bir kol ağzı kana bulanmıştır. Drakula onları şatonun dışında giymiştir ki tanıklar İngiliz tutsağı suçlasın — sonra da geri getirmiştir.','يعود جوناثان إلى غرفته. معطف سفره وقبعته المفقودان أُعيدا إلى الخزانة. أحد الكمّين ملطّخ بالدم. لقد ارتداهما دراكولا خارج القلعة كي يلقي الشهود اللوم على السجين الإنجليزي — ثم أعادهما.','Джонатан возвращается в свою комнату. Пропавшие дорожный плащ и шляпа возвращены в шкаф. Один манжет измазан кровью. Дракула носил их за стенами замка, чтобы свидетели винили английского пленника, — а потом вернул на место.'),note:T('The returned clothes expose Dracula’s deception. Jonathan keeps them because the descent into the freezing mountains will be impossible without his coat.','La ropa devuelta revela el engaño de Drácula. Jonathan la conserva porque el descenso por las montañas heladas será imposible sin su abrigo.','Die zurückgebrachte Kleidung entlarvt Draculas Täuschung. Jonathan behält sie, denn ohne den Mantel wäre der Abstieg in die eisigen Berge unmöglich.','Les vêtements rendus révèlent la supercherie de Dracula. Jonathan les garde : sans son manteau, la descente dans les montagnes glacées serait impossible.','Gli abiti restituiti svelano l\'inganno di Dracula. Jonathan li tiene, perché la discesa tra le montagne gelate sarebbe impossibile senza il cappotto.','As roupas devolvidas expõem o embuste de Drácula. Jonathan fica com elas porque a descida pelas montanhas geladas será impossível sem o casaco.','Zwrócone ubranie zdradza podstęp Drakuli. Jonathan je zatrzymuje, bo zejście w lodowate góry będzie bez płaszcza niemożliwe.','被送回的衣物揭穿了德古拉的骗局。乔纳森留下了它们——没有外套,翻越冰封群山的下山之路根本无法完成。','返された衣服が、ドラキュラの欺きを露わにする。ジョナサンはそれを手元に置く。凍てつく山を下るのに、外套なしでは到底かなわないからだ。','Geri getirilen giysiler Drakula\'nın oyununu açığa çıkarır. Jonathan onları saklar; çünkü paltosu olmadan dondurucu dağlardan inmek imkânsız olacaktır.','تفضح الثياب المعادة خديعة دراكولا. ويحتفظ بها جوناثان لأن النزول في الجبال المتجمّدة سيكون مستحيلاً من دون معطفه.','Возвращённая одежда выдаёт обман Дракулы. Джонатан оставляет её себе: без плаща спуск по обледенелым горам будет невозможен.'),next:'last_chance'},
last_chance:{img:'34_last_chance',pos:'left',kind:'story',k:T('PRE-DAWN · THE FINAL WAGON','ANTES DEL AMANECER · EL ÚLTIMO CARRO','VOR TAGESANBRUCH · DER LETZTE WAGEN','AVANT L\'AUBE · DERNIER CHARIOT','PRE-ALBA · L\'ULTIMO CARRO','MADRUGADA · O ÚLTIMO CARRO','PRZED ŚWITEM · OSTATNI WÓZ','黎明之前 · 最后一辆货车','夜明け前 · 最後の荷馬車','ŞAFAKTAN ÖNCE · SON KAĞNI','قبيل الفجر · العربة الأخيرة','ДО РАССВЕТА · ПОСЛЕДНЯЯ ПОВОЗКА'),title:T('ONLY THE WINDOW REMAINS','SOLO QUEDA LA VENTANA','NUR DAS FENSTER BLEIBT','SEULE LA FENÊTRE RESTE','RESTA SOLO LA FINESTRA','SÓ RESTA A JANELA','ZOSTAJE TYLKO OKNO','只剩一扇窗','残るは窓だけ','YALNIZCA PENCERE KALIYOR','لم يبقَ سوى النافذة','ОСТАЁТСЯ ТОЛЬКО ОКНО'),story:T('Jonathan pulls on the returned coat despite the bloodstain; freezing air pours through the cliff window. Then the door bolt slides shut from outside. Below, workers load the final earth boxes onto black wagons.','Jonathan se pone el abrigo devuelto a pesar de la mancha de sangre; por la ventana del acantilado entra aire helado. Entonces el cerrojo de la puerta se cierra desde fuera. Abajo, los trabajadores cargan las últimas cajas de tierra en carros negros.','Jonathan zieht den zurückgebrachten Mantel trotz des Blutflecks an; eisige Luft strömt durch das Klippenfenster. Dann schiebt sich draußen der Türriegel zu. Unten laden Arbeiter die letzten Erdkisten auf schwarze Wagen.','Jonathan enfile le manteau rendu malgré la tache de sang ; l\'air glacé s\'engouffre par la fenêtre du précipice. Puis le verrou de la porte se ferme depuis l\'extérieur. En bas, des ouvriers chargent les dernières caisses de terre sur des chariots noirs.','Jonathan indossa il cappotto restituito nonostante la macchia di sangue; l\'aria gelata entra dalla finestra sul dirupo. Poi il chiavistello della porta scorre dall\'esterno. Sotto, gli operai caricano le ultime casse di terra su carri neri.','Jonathan veste o casaco devolvido apesar da mancha de sangue; o ar gelado entra pela janela do precipício. Depois, o ferrolho da porta corre por fora. Lá em baixo, os trabalhadores carregam as últimas caixas de terra em carroças negras.','Jonathan wkłada zwrócony płaszcz mimo plamy krwi; przez okno nad urwiskiem wdziera się lodowate powietrze. Potem rygiel drzwi zasuwa się od zewnątrz. W dole robotnicy ładują ostatnie skrzynie z ziemią na czarne wozy.','尽管沾着血迹,乔纳森还是穿上了那件被送回的外套;凛冽的空气从悬崖窗口灌入。接着,门闩从外面插上了。下方,工人们正把最后几只泥土木箱装上黑色马车。','血の染みもかまわず、ジョナサンは返された外套を羽織る。崖に面した窓から凍える風が吹き込む。そのとき、扉のかんぬきが外から差し込まれた。眼下では、人夫たちが最後の土の箱を黒い荷車に積んでいる。','Jonathan kan lekesine rağmen geri getirilen paltoyu giyer; uçurum penceresinden buz gibi hava dolar. Sonra kapının sürgüsü dışarıdan sürülür. Aşağıda işçiler son toprak kutularını siyah arabalara yükler.','يرتدي جوناثان المعطف المعاد رغم بقعة الدم؛ ويندفع الهواء المتجمّد من نافذة الجرف. ثم ينزلق مزلاج الباب من الخارج. وفي الأسفل، يحمّل العمال آخر صناديق التراب على عربات سوداء.','Джонатан надевает возвращённый плащ, не глядя на пятно крови; сквозь окно над обрывом врывается ледяной воздух. Затем засов двери задвигается снаружи. Внизу рабочие грузят последние ящики с землёй на чёрные повозки.'),note:T('Then he sees the long white sheets on the bed. The door is useless. The cliff window is not.','Entonces ve las largas sábanas blancas de la cama. La puerta no sirve. La ventana sobre el acantilado, sí.','Dann sieht er die langen weißen Bettlaken. Die Tür ist nutzlos. Das Fenster über der Felswand nicht.','Alors il voit les longs draps blancs sur le lit. La porte est inutile. Pas la fenêtre du précipice.','Poi vede le lunghe lenzuola bianche sul letto. La porta è inutile. La finestra sul dirupo no.','Então ele vê os lençóis brancos e compridos na cama. A porta é inútil. A janela sobre o precipício não é.','Wtedy dostrzega długie białe prześcieradła na łóżku. Drzwi są bezużyteczne. Okno nad urwiskiem — nie.','这时他看见了床上那几条长长的白床单。门已无用,但那扇临崖的窗户还有希望。','そのとき、ベッドの上の長い白いシーツが目に入る。扉は役に立たない。だが崖に面した窓は違う。','Sonra yatağın üzerindeki uzun beyaz çarşafları görür. Kapı işe yaramaz. Uçurumdaki pencere ise yarar.','ثم يرى الملاءات البيضاء الطويلة على السرير. الباب عديم الفائدة. أما النافذة المطلة على الجرف فليست كذلك.','Тогда он замечает длинные белые простыни на кровати. Дверь бесполезна. Окно над обрывом — нет.'),next:'escape_plan'},
escape_plan:{img:'21_escape_plan',pos:'left',kind:'question',q:14,k:T('JONATHAN’S ROOM · THE PLAN','HABITACIÓN DE JONATHAN · EL PLAN','JONATHANS ZIMMER · DER PLAN','CHAMBRE DE JONATHAN · LE PLAN','STANZA DI JONATHAN · IL PIANO','QUARTO DE JONATHAN · O PLANO','POKÓJ JONATHANA · PLAN','乔纳森的房间 · 计划','ジョナサンの部屋 · 計画','JONATHAN\'IN ODASI · PLAN','غرفة جوناثان · الخطة','КОМНАТА ДЖОНАТАНА · ПЛАН'),title:T('A ROPE OF SHEETS','UNA CUERDA DE SÁBANAS','EIN SEIL AUS BETTLAKEN','UNE CORDE DE DRAPS','CORDA DI LENZUOLA','UMA CORDA DE LENÇÓIS','LINA Z PRZEŚCIERADEŁ','床单做的绳索','シーツのロープ','ÇARŞAFLARDAN BİR İP','حبل من الملاءات','ВЕРЁВКА ИЗ ПРОСТЫНЬ'),story:T('Jonathan knots the bed sheets into a rope and anchors it to the heavy bedframe. Far below, the last earth wagons are being moved toward the gate.','Jonathan anuda las sábanas para formar una cuerda y la fija al pesado armazón de la cama. Muy abajo, los últimos carros de tierra avanzan hacia la puerta.','Jonathan knotet die Bettlaken zu einem Seil und befestigt es am schweren Bettgestell. Tief unten werden die letzten Erdwagen zum Tor bewegt.','Jonathan noue les draps en une corde et l\'amarre au lourd cadre du lit. Loin en dessous, les derniers chariots de terre sont déplacés vers le portail.','Jonathan annoda le lenzuola in una corda e la fissa alla pesante struttura del letto. Molto più in basso, gli ultimi carri di terra vengono portati verso il cancello.','Jonathan ata os lençóis numa corda e prende-a à pesada armação da cama. Muito lá em baixo, as últimas carroças de terra estão a ser levadas para o portão.','Jonathan wiąże prześcieradła w linę i mocuje ją do ciężkiej ramy łóżka. Daleko w dole ostatnie wozy z ziemią są przetaczane w stronę bramy.','乔纳森把床单结成一条绳索,系在沉重的床架上。远远的下方,最后几辆泥土货车正被推往大门。','ジョナサンはシーツを結んで縄にし、重い寝台の枠に結わえつける。はるか下では、最後の土の荷車が門へと運ばれていく。','Jonathan çarşafları bir halat hâline düğümler ve ağır karyola gövdesine bağlar. Çok aşağıda, son toprak arabaları kapıya doğru taşınmaktadır.','يعقد جوناثان الملاءات ليصنع حبلاً ويثبّته في هيكل السرير الثقيل. في الأسفل البعيد، تُنقل آخر عربات التراب نحو البوابة.','Джонатан связывает простыни в верёвку и крепит её к тяжёлой раме кровати. Далеко внизу последние повозки с землёй катят к воротам.'),clue:T('The rope does not exist yet. Imagine that he makes it.','La cuerda todavía no existe. Imagina que la hace.','Das Seil existiert noch nicht. Stell dir vor, er macht es.','La corde n\'existe pas encore. Imagine qu\'il la fasse.','La corda non esiste ancora. Immagina che la faccia.','A corda ainda não existe. Imagine que ele a faz.','Lina jeszcze nie istnieje. Wyobraź sobie, że ją robi.','这条绳索尚未存在。设想他把它做出来。','ロープはまだ存在しない。彼がそれを作ると想像せよ。','İp henüz yok. Onu yaptığını hayal et.','الحبل غير موجود بعد. تخيّل أنه يصنعه.','Верёвки пока не существует. Представь, что он её делает.'),prompt:T('Choose the SECOND CONDITIONAL.','Elige el SEGUNDO CONDICIONAL.','Wähle den ZWEITEN KONDITIONALSATZ.','Choisis le DEUXIÈME CONDITIONNEL.','Scegli il SECONDO CONDIZIONALE.','Escolha o SEGUNDO CONDICIONAL.','Wybierz DRUGI OKRES WARUNKOWY.','选出第二条件句。','第二条件文を選べ。','İKİNCİ ŞART CÜMLESİ\'ni seç.','اختر الشرط الثاني.','Выбери ВТОРОЙ УСЛОВНЫЙ.'),opts:[T('If Jonathan ties the sheets, he escaped yesterday.','Si Jonathan ata las sábanas, escapó ayer.','Wenn Jonathan die Laken knotet, entkam er gestern.','Si Jonathan noue les draps, il s\'est échappé hier.','Se Jonathan lega le lenzuola, è scappato ieri.','Se Jonathan atasse os lençóis, escapou ontem.','Jeśli Jonathan zwiąże prześcieradła, uciekł wczoraj.','如果乔纳森把床单系起来,他昨天就逃走了。','もしジョナサンがシーツを結べば、昨日逃げた。','Jonathan çarşafları bağlarsa, dün kaçtı.','إن ربط جوناثان الملاءات، هرب أمس.','Если Джонатан свяжет простыни, он сбежал вчера.'),T('If Jonathan had tied the sheets, he will escape.','Si Jonathan hubiera atado las sábanas, escapará.','Wenn Jonathan die Laken geknotet hätte, wird er entkommen.','S\'il avait noué les draps, il s\'échappera.','Se Jonathan avesse legato le lenzuola, scapperà.','Se Jonathan tivesse atado os lençóis, vai escapar.','Gdyby Jonathan związał prześcieradła, ucieknie.','如果乔纳森当初系好了床单,他将会逃走。','もしジョナサンがシーツを結んでいたら、彼は逃げるだろう。','Jonathan çarşafları bağlamış olsaydı, kaçacak.','لو ربط جوناثان الملاءات، سيهرب.','Если бы Джонатан связал простыни, он сбежит.'),T('If Jonathan tied the sheets together, he could climb down.','Si Jonathan atara las sábanas, podría bajar.','Wenn Jonathan die Laken zusammenknotete, könnte er hinabklettern.','Si Jonathan nouait les draps ensemble, il pourrait descendre.','Se Jonathan legasse insieme le lenzuola, potrebbe scendere.','Se Jonathan atasse os lençóis uns aos outros, poderia descer.','Gdyby Jonathan związał prześcieradła, mógłby zejść w dół.','如果乔纳森把床单系在一起,他就能爬下去。','もしジョナサンがシーツを結び合わせれば、下りられるだろう。','Jonathan çarşafları birbirine bağlasaydı, aşağı inebilirdi.','لو ربط جوناثان الملاءات معاً، لاستطاع النزول.','Если бы Джонатан связал простыни, он мог бы спуститься.')],answer:2,fb:T('This imagines an unreal present plan: if + past, then could + verb.','Esto imagina un plan irreal en el presente: si + pasado, después podría + verbo.','Das ist ein irrealer Plan in der Gegenwart: wenn + Vergangenheitsform, dann könnte + Verb.','Ceci imagine un plan présent irréel : si + passé, puis conditionnel.','Immagina un piano irreale nel presente: se + passato, poi potrebbe + verbo.','Isto imagina um plano irreal no presente: se + passado, depois poderia + verbo.','To wyobraża nierealny plan w teraźniejszości: jeśli + czas przeszły, potem tryb warunkowy (could).','这设想了一个不真实的当下计划:if + 过去时,然后 could + 动词。','これは非現実の現在の計画を想像する:if+過去形、その後could+動詞。','Bu, gerçek dışı bir şimdiki plan hayal eder: eğer + geçmiş zaman, ardından could + fiil.','هذا يتخيل خطة حاضرة غير واقعية: إن + ماضٍ، ثم لـ + فعل.','Это нереальный план в настоящем: если + прошедшее, потом could + глагол.'),next:'choice3'},
choice3:{img:'22_choice3',pos:'center',kind:'choice',k:T('DECISION III · BEFORE DAWN','DECISIÓN III · ANTES DEL AMANECER','ENTSCHEIDUNG III · VOR TAGESANBRUCH','DÉCISION III · AVANT L\'AUBE','DECISIONE III · PRE-ALBA','DECISÃO III · ANTES DO AMANHECER','DECYZJA III · PRZED ŚWITEM','抉择三 · 黎明之前','決断III · 夜明け前','KARAR III · ŞAFAKTAN ÖNCE','القرار الثالث · قبل الفجر','РЕШЕНИЕ III · ПЕРЕД РАССВЕТОМ'),title:T('CRYPT OR COURTYARD?','¿CRIPTA O PATIO?','GRUFT ODER HOF?','CRYPTE OU COUR ?','CRIPTA O CORTILE?','CRIPTA OU PÁTIO?','KRYPTA CZY DZIEDZINIEC?','墓穴还是庭院?','地下墓所か中庭か?','MEZAR ODASI MI, AVLU MU?','السرداب أم الفناء؟','СКЛЕП ИЛИ ДВОР?'),story:T('Jonathan climbs halfway down the sheet-rope and reaches a lower parapet. A broken chapel window opens toward the crypt on his left. A drainpipe drops into the courtyard on his right. The remaining rope hangs toward the cliff path below.','Jonathan baja hasta la mitad de la cuerda de sábanas y llega a un parapeto inferior. A su izquierda, una ventana rota de la capilla conduce a la cripta. A su derecha, una tubería baja al patio. El resto de la cuerda cuelga hacia el sendero del acantilado.','Jonathan steigt das Laken-Seil halb hinab und erreicht eine tiefere Brüstung. Links führt ein zerbrochenes Kapellenfenster zur Gruft. Rechts reicht ein Fallrohr in den Hof. Der Rest des Seils hängt zum Klippenpfad hinunter.','Jonathan descend à mi-hauteur le long de la corde de draps et atteint un parapet inférieur. À sa gauche, une fenêtre brisée de la chapelle s\'ouvre vers la crypte. À sa droite, une gouttière plonge dans la cour. Le reste de la corde pend vers le sentier du précipice, en bas.','Jonathan scende a metà lungo la corda di lenzuola e raggiunge un parapetto più basso. Alla sua sinistra, una finestra rotta della cappella si apre verso la cripta. Alla sua destra, un pluviale scende nel cortile. La corda che resta pende verso il sentiero del dirupo, in basso.','Jonathan desce a meio da corda de lençóis e alcança um parapeito mais baixo. À sua esquerda, uma janela partida da capela abre-se para a cripta. À sua direita, um algeroz desce até ao pátio. A corda restante pende para o carreiro do precipício, lá em baixo.','Jonathan schodzi do połowy po linie z prześcieradeł i staje na niższym gzymsie. Po lewej rozbite okno kaplicy otwiera drogę do krypty. Po prawej rynna opada na dziedziniec. Reszta liny zwisa ku ścieżce nad urwiskiem w dole.','乔纳森顺着床单绳索下到一半,落在一处较低的女墙上。左侧,一扇破碎的礼拜堂窗户通向地下墓室;右侧,一根落水管直落庭院;余下的绳索则垂向下方的崖边小径。','ジョナサンはシーツの縄を半ばまで下り、低い胸壁にたどり着く。左手には、割れた礼拝堂の窓が地下墓所へと開いている。右手には、雨樋が中庭へと落ちている。残りの縄は、その下の崖道へ向かって垂れている。','Jonathan çarşaf halatından yarı yola iner ve alçak bir korkuluğa ulaşır. Solunda, kırık bir şapel penceresi mahzene açılır. Sağında, bir yağmur borusu avluya iner. Kalan halat ise aşağıdaki uçurum patikasına doğru sarkar.','ينزل جوناثان منتصف حبل الملاءات ويبلغ حاجزاً أدنى. على يساره، تنفتح نافذة مكسورة في المصلّى نحو السرداب. وعلى يمينه، ينحدر ماسورة مطر إلى الفناء. أما بقية الحبل فتتدلى نحو درب الجرف في الأسفل.','Джонатан спускается по верёвке из простыней до середины и оказывается на нижнем парапете. Слева разбитое окно часовни открывает путь в склеп. Справа водосточная труба уходит во двор. Оставшаяся верёвка свисает к тропе над обрывом внизу.'),routes:[{name:T('DESCEND TO THE CRYPT','BAJAR A LA CRIPTA','IN DIE GRUFT HINABSTEIGEN','DESCENDRE À LA CRYPTE','SCENDI NELLA CRIPTA','DESCER À CRIPTA','ZEJDŹ DO KRYPTY','下到墓穴','地下墓所へ下りる','MEZAR ODASINA İN','انزل إلى السرداب','СПУСТИТЬСЯ В СКЛЕП'),desc:T('Enter through the broken chapel window and confront the coffin.','Entra por la ventana rota de la capilla y enfréntate al ataúd.','Steig durch das zerbrochene Kapellenfenster und stell dich dem Sarg.','Entre par la fenêtre brisée de la chapelle et affronte le cercueil.','Entra dalla finestra rotta della cappella e affronta la bara.','Entra pela janela partida da capela e enfrenta o caixão.','Wejdź przez rozbite okno kaplicy i stań naprzeciw trumny.','从破碎的礼拜堂窗口进去,直面那口棺木。','割れた礼拝堂の窓から入り、棺と対峙する。','Kırık şapel penceresinden gir ve tabutla yüzleş.','ادخل من نافذة المصلّى المكسورة وواجه التابوت.','Влезь через разбитое окно часовни и встреться с гробом.'),target:'crypt_tomb',route:'crypt'},{name:T('INFILTRATE THE COURTYARD','INFILTRARSE EN EL PATIO','DEN HOF INFILTRIEREN','S\'INFILTRER DANS LA COUR','INFILTRATI NEL CORTILE','INFILTRAR-SE NO PÁTIO','WKRADNIJ SIĘ NA DZIEDZINIEC','潜入庭院','中庭に潜入する','AVLUYA SIZ','تسلل إلى الفناء','ПРОНИКНУТЬ ВО ДВОР'),desc:T('Slide down the drainpipe, sabotage the convoy and escape through the gate.','Baja por la tubería, sabotea el convoy y escapa por la puerta.','Rutsch das Fallrohr hinab, sabotiere den Konvoi und flieh durch das Tor.','Descends par la gouttière, sabote le convoi et fuis par le portail.','Scendi dal pluviale, sabota il convoglio e fuggi dal cancello.','Desce pelo algeroz, sabota o comboio e foge pelo portão.','Zjedź po rynnie, uszkodź konwój i uciekaj przez bramę.','顺着落水管滑下,破坏车队,再从大门逃出去。','雨樋を伝って下り、荷車の列に細工をして、門から逃げる。','Yağmur borusundan kay, konvoyu sabote et ve kapıdan kaç.','انزلق على ماسورة المطر، وخرّب القافلة، واهرب عبر البوابة.','Спустись по водосточной трубе, выведи обоз из строя и беги через ворота.'),target:'courtyard_carts',route:'courtyard'}]},
crypt_tomb:{img:'23_crypt_tomb',pos:'left',kind:'question',q:15,k:T('ROUTE · THE RUINED CHAPEL','RUTA · LA CAPILLA EN RUINAS','ROUTE · DIE ZERSTÖRTE KAPELLE','ROUTE · LA CHAPELLE EN RUINE','VIA · LA CAPPELLA IN ROVINA','ROTA · A CAPELA EM RUÍNAS','TRASA · ZRUJNOWANA KAPLICA','路线 · 残破礼拜堂','ルート · 廃れた礼拝堂','ROTA · YIKIK ŞAPEL','المسار · الكنيسة المتهدمة','ПУТЬ · РАЗРУШЕННАЯ ЧАСОВНЯ'),title:T('THE COFFIN MUST OPEN','EL ATAÚD DEBE ABRIRSE','DER SARG MUSS GEÖFFNET WERDEN','CERCUEIL DOIT S\'OUVRIR','LA BARA DEVE APRIRSI','O CAIXÃO TEM DE SE ABRIR','TRUMNA MUSI ZOSTAĆ OTWARTA','棺木必须打开','棺は開かねばならない','TABUT AÇILMALI','يجب أن يُفتح التابوت','ГРОБ ДОЛЖЕН ОТКРЫТЬСЯ'),story:T('Inside the crypt, the workers have lowered Dracula’s earth box into an open ancestral stone sarcophagus beneath broken saints. They have gone. Dawn is less than an hour away. A mason’s hammer lies beside unfinished repairs, and Jonathan tears a pointed wooden arm from a ruined prayer bench.','Dentro de la cripta, los trabajadores han colocado la caja de tierra de Drácula dentro de un antiguo sarcófago de piedra abierto bajo santos rotos. Ya se han ido. Falta menos de una hora para el amanecer. Junto a unas reparaciones sin terminar hay un martillo de albañil, y Jonathan arranca un brazo de madera puntiagudo de un banco de oración roto.','In der Gruft haben die Arbeiter Draculas Erdkiste in einen offenen steinernen Ahnensarkophag unter zerbrochenen Heiligen gesenkt. Sie sind fort. Bis zum Morgengrauen bleibt weniger als eine Stunde. Neben unfertigen Reparaturen liegt ein Maurerhammer, und Jonathan bricht eine zugespitzte Holzlehne von einer zerstörten Gebetsbank ab.','Dans la crypte, les ouvriers ont descendu la caisse de terre de Dracula dans un sarcophage de pierre ancestral ouvert, sous des saints brisés. Ils sont partis. L\'aube est à moins d\'une heure. Un marteau de maçon traîne près de réparations inachevées, et Jonathan arrache un bras de bois pointu à un banc de prière en ruine.','Nella cripta gli operai hanno calato la cassa di terra di Dracula in un sarcofago di pietra degli avi, aperto sotto santi spezzati. Se ne sono andati. All\'alba manca meno di un\'ora. Un martello da muratore giace accanto a riparazioni incompiute, e Jonathan strappa un braccio di legno appuntito da un banco di preghiera in rovina.','Dentro da cripta, os trabalhadores baixaram a caixa de terra de Drácula para um sarcófago de pedra ancestral, aberto sob santos partidos. Já se foram. Falta menos de uma hora para o amanhecer. Um martelo de pedreiro jaz junto a reparações inacabadas, e Jonathan arranca um braço de madeira pontiagudo a um banco de oração em ruínas.','W krypcie robotnicy opuścili skrzynię z ziemią Drakuli do otwartego kamiennego sarkofagu przodków pod strzaskanymi świętymi. Odeszli. Do świtu mniej niż godzina. Obok niedokończonych napraw leży młot murarski, a Jonathan wyłamuje zaostrzone drewniane ramię ze zrujnowanej ławki modlitewnej.','在地下墓室里,工人们已把德古拉的泥土木箱放进一具敞开的祖传石棺,棺上是残破的圣像。他们已经离开。距离黎明不到一个小时。未完的修缮旁躺着一把石匠锤,乔纳森从一张朽坏的祈祷长凳上掰下一根尖木条。','地下墓所では、人夫たちがドラキュラの土の箱を、砕けた聖人像の下にある先祖代々の石棺に降ろしていた。彼らはもういない。夜明けまで一時間もない。やりかけの修繕のかたわらに石工の槌が転がり、ジョナサンは朽ちた祈祷用長椅子から尖った木の腕木をもぎ取る。','Mahzende işçiler Drakula\'nın toprak kutusunu, kırık azizlerin altındaki açık atalar lahdine indirmişlerdir. Gitmişlerdir. Şafağa bir saatten az kalmıştır. Yarım kalmış onarımların yanında bir duvarcı çekici durur ve Jonathan yıkık bir dua sırasından sivri bir tahta kol koparır.','داخل السرداب، أنزل العمال صندوق تراب دراكولا في ناووس حجري قديم مفتوح تحت قدّيسين محطّمين. ثم مضوا. لم يبقَ على الفجر أقل من ساعة. مطرقة بنّاء ملقاة قرب إصلاحات لم تكتمل، وينتزع جوناثان ذراعاً خشبية مدبّبة من مقعد صلاة متهدّم.','В склепе рабочие опустили ящик с землёй Дракулы в открытый родовой каменный саркофаг под разбитыми святыми. Они ушли. До рассвета меньше часа. Рядом с недоделанным ремонтом лежит молот каменщика, и Джонатан выламывает заострённый деревянный подлокотник из разрушенной молитвенной скамьи.'),clue:T('Someone must open the coffin. The coffin is more important than the person.','Alguien debe abrir el ataúd. El ataúd es más importante que la persona.','Jemand muss den Sarg öffnen. Der Sarg ist wichtiger als die Person.','Quelqu\'un doit ouvrir le cercueil. Le cercueil est plus important que la personne.','Qualcuno deve aprire la bara. La bara è più importante della persona.','Alguém tem de abrir o caixão. O caixão é mais importante do que a pessoa.','Ktoś musi otworzyć trumnę. Trumna jest ważniejsza niż osoba.','必须有人打开棺木。棺木比这个人更重要。','誰かが棺を開けなければならない。棺はその人物よりも重要だ。','Biri tabutu açmalı. Tabut, kişiden daha önemli.','يجب أن يفتح أحدهم التابوت. التابوت أهم من الشخص.','Кто-то должен открыть гроб. Гроб важнее, чем человек.'),prompt:T('Choose the correct MODAL PASSIVE.','Elige la PASIVA MODAL correcta.','Wähle das richtige MODALPASSIV.','Choisis le PASSIF MODAL correct.','Scegli la PASSIVA MODALE corretta.','Escolha a PASSIVA MODAL correta.','Wybierz poprawną STRONĘ BIERNĄ MODALNĄ.','选出正确的情态动词被动句。','正しい助動詞の受動態を選べ。','Doğru MODAL PASİF\'i seç.','اختر المجهول الصحيح مع الناقص.','Выбери верный МОДАЛЬНЫЙ ПАССИВ.'),opts:[T('The coffin must be opened before dawn.','El ataúd debe ser abierto antes del amanecer.','Der Sarg muss vor Tagesanbruch geöffnet werden.','Le cercueil doit être ouvert avant l\'aube.','La bara deve essere aperta prima dell\'alba.','O caixão deve ser aberto antes do amanhecer.','Trumna musi zostać otwarta przed świtem.','棺木必须在天亮前被打开。','棺は夜明け前に開けられなければならない。','Tabut şafaktan önce açılmalıdır.','يجب أن يُفتح التابوت قبل الفجر.','Гроб должен быть открыт до рассвета.'),T('The coffin must opened before dawn.','El ataúd debe abierto antes del amanecer.','Der Sarg muss vor Tagesanbruch geöffnet.','Le cercueil doit ouvert avant l\'aube.','La bara deve aperta prima dell\'alba.','O caixão deve aberto antes do amanhecer.','Trumna musi otwarta przed świtem.','棺木必须打开了在天亮前。','棺は夜明け前に開けなければならない。','Tabut şafaktan önce açmalı.','التابوت يجب فُتح قبل الفجر.','Гроб должен открытый до рассвета.'),T('The coffin must be open someone.','El ataúd debe ser abre alguien.','Der Sarg muss jemand öffnen sein.','Le cercueil doit être ouvre quelqu\'un.','La bara deve essere apre qualcuno.','O caixão deve ser abre alguém.','Trumna musi być otworzyć ktoś.','棺木必须被打开某人。','棺は誰かによって開くなければならない。','Tabut biri açık olmalı.','يجب أن يكون التابوت مفتوحاً أحد.','Гроб должен быть открыть кто-то.')],answer:0,fb:T('Modal passive: modal + be + past participle.','Pasiva modal: modal + ser + participio.','Modalpassiv: Modalverb + Partizip II + werden.','Passif modal : modal + être + participe passé.','Passiva modale: modale + essere + participio.','Passiva modal: modal + ser + particípio.','Bierna modalna: modal + zostać + III forma.','情态动词被动:情态动词 + be + 过去分词。','助動詞の受動態:助動詞+be+過去分詞。','Modal pasif: modal + be + geçmiş zaman ortacı.','مجهول الناقص: فعل ناقص + يكون + التصريف الثالث.','Модальный пассив: modal + be + 3-я форма глагола.'),next:'stake_decision'},
stake_decision:{img:'24_stake_decision',pos:'left',kind:'question',q:16,k:T('ROUTE · ONE HEARTBEAT','RUTA · UN LATIDO','ROUTE · EIN HERZSCHLAG','ROUTE · BATTEMENT DE CŒUR','VIA · UN BATTITO','ROTA · UM BATIMENTO','TRASA · JEDNO UDERZENIE SERCA','路线 · 一瞬之间','ルート · 一つの鼓動','ROTA · TEK BİR KALP ATIŞI','المسار · نبضة واحدة','ПУТЬ · ОДИН УДАР СЕРДЦА'),title:T('THE BLOW NOT STRUCK','EL GOLPE NO DADO','DER NICHT GEFÜHRTE SCHLAG','LE COUP NON PORTÉ','IL COLPO NON DATO','O GOLPE NÃO DADO','CIOS, KTÓRY NIE PADŁ','未曾落下的一击','振り下ろされなかった一撃','İNDİRİLMEYEN DARBE','الضربة التي لم تُوجَّه','НЕНАНЕСЁННЫЙ УДАР'),story:T('Jonathan raises the hammer, but the first light touches the crypt. Dracula’s eyes open.','Jonathan levanta el martillo, pero la primera luz toca la cripta. Los ojos de Drácula se abren.','Jonathan hebt den Hammer, doch das erste Licht erreicht die Gruft. Draculas Augen öffnen sich.','Jonathan lève le marteau, mais la première lumière touche la crypte. Les yeux de Dracula s\'ouvrent.','Jonathan alza il martello, ma la prima luce tocca la cripta. Gli occhi di Dracula si aprono.','Jonathan ergue o martelo, mas a primeira luz toca a cripta. Os olhos de Drácula abrem-se.','Jonathan unosi młot, lecz pierwsze światło dotyka krypty. Oczy Drakuli się otwierają.','乔纳森举起铁锤,但第一缕晨光已触及墓穴。德古拉睁开了双眼。','ジョナサンは槌を振り上げるが、最初の光が地下墓所に差し込む。ドラキュラの目が開く。','Jonathan çekici kaldırır, ama ilk ışık mezar odasına değer. Drakula\'nın gözleri açılır.','يرفع جوناثان المطرقة، لكن الضوء الأول يلامس السرداب. تنفتح عينا دراكولا.','Джонатан поднимает молот, но первый луч касается склепа. Глаза Дракулы открываются.'),clue:T('Jonathan hesitated. Imagine that he struck earlier.','Jonathan dudó. Imagina que hubiera golpeado antes.','Jonathan zögerte. Stell dir vor, er hätte früher zugeschlagen.','Jonathan a hésité. Imagine qu\'il ait frappé plus tôt.','Jonathan ha esitato. Immagina che avesse colpito prima.','Jonathan hesitou. Imagine que tinha golpeado antes.','Jonathan zawahał się. Wyobraź sobie, że uderzył wcze
