:root {
  --brown: #F0723F;
  --brown-light: #F6A04B;
  --brown-dark: #6E2418;
  --ink: #24100A;
  --cream: #FFF4D8;
  --gold: #FFD166;
  --burgundy: #9F321F;
  --accent: #FFE9A8;
  --right: #4f815e;
  --wrong: #a13e44;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; background: var(--brown); }
body, button { font-family: "Courier New", Courier, monospace; }
button { -webkit-tap-highlight-color: transparent; }

.game { position: relative; isolation: isolate; width: 100vw; min-height: 100svh; overflow-x: hidden; overflow-y: auto; color: var(--ink); background: linear-gradient(135deg,var(--brown-light),var(--brown)); }
.scene, .wash { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene { z-index: 0; object-fit: cover; object-position: center; background: var(--brown); }
.wash { z-index: 1; pointer-events: none; }
.cover-wash, .wash-left, .success-wash { background: linear-gradient(90deg,rgba(255,244,216,.93) 0%,rgba(246,160,75,.77) 40%,rgba(240,114,63,.03) 70%); }
.wash-right, .failure-wash { background: linear-gradient(270deg,rgba(255,244,216,.93) 0%,rgba(246,160,75,.77) 40%,rgba(240,114,63,.03) 70%); }
.wash-centre { background: radial-gradient(circle at center,rgba(255,244,216,.94) 0%,rgba(246,160,75,.76) 41%,rgba(240,114,63,.04) 73%); }
.tone-light { color: var(--cream); }
.tone-light .cover-wash, .tone-light .wash-left, .tone-light .success-wash { background: linear-gradient(90deg,rgba(36,16,10,.91) 0%,rgba(110,36,24,.76) 42%,rgba(240,114,63,.02) 72%); }
.tone-light .wash-right, .tone-light .failure-wash { background: linear-gradient(270deg,rgba(36,16,10,.91) 0%,rgba(110,36,24,.76) 42%,rgba(240,114,63,.02) 72%); }
.tone-light .wash-centre { background: radial-gradient(circle at center,rgba(36,16,10,.91) 0%,rgba(110,36,24,.72) 42%,rgba(240,114,63,.03) 74%); }

.cover-copy, .copy, .ending-copy { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; }
.cover-copy { width: min(780px,54vw); min-height: 100svh; justify-content: center; padding: clamp(6rem,10vh,8.5rem) clamp(1.2rem,4.6vw,5.4rem); }
.cover-copy h1, .copy h1, .ending-copy h1 { margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-weight: 700; line-height: 1.05; letter-spacing: 0; text-wrap: balance; text-shadow: 0 0 .15rem #fff,0 0 .48rem #fff,0 0 1.05rem var(--cream); }
.tone-light .cover-copy h1, .tone-light .copy h1, .tone-light .ending-copy h1, .tone-light .story, .tone-light .copy h2, .tone-light .lead, .tone-light .ending-copy > p { text-shadow: 0 0 .18rem var(--ink),0 0 .52rem var(--ink),0 0 1.1rem var(--brown-light); }
.cover-copy h1 { font-size: clamp(3rem,6.1vw,7rem); }
.cover-copy h1 em { color: var(--burgundy); font-style: normal; }
.eyebrow { margin: 0 0 .85rem; color: var(--burgundy); font-size: clamp(.7rem,1vw,.94rem); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 0 .22rem #fff,0 0 .72rem var(--cream); }
.tone-light .eyebrow { color: var(--accent); text-shadow: 0 0 .18rem var(--ink),0 0 .58rem var(--ink); }
.lead, .ending-copy > p:not(.eyebrow) { max-width: 660px; margin: 1.2rem 0; font-size: clamp(1rem,1.42vw,1.38rem); font-weight: 700; line-height: 1.5; text-shadow: 0 0 .22rem #fff,0 0 .72rem var(--cream); }
.rules { display: flex; flex-wrap: wrap; gap: .6rem; margin: .1rem 0 1.5rem; }
.rules > span, .result { color: var(--ink); background: rgba(255,244,216,.96); border: 3px solid var(--ink); box-shadow: 6px 6px 0 rgba(36,16,10,.38); text-shadow: none; }
.rules > span { padding: .62rem .76rem; font-size: clamp(.66rem,.82vw,.8rem); font-weight: 700; letter-spacing: .04em; }
.cover-copy small { margin-top: 1rem; color: var(--ink); font-size: .72rem; font-weight: 700; text-shadow: 0 0 .4rem var(--cream); }
.tone-light .cover-copy small { color: var(--cream); text-shadow: 0 0 .18rem var(--ink),0 0 .55rem var(--ink); }

.translation { display: block; margin-top: .28em; color: inherit; font: inherit; line-height: 1.24; letter-spacing: normal; text-transform: none; }
h1 > .translation { margin-top: .22em; line-height: 1.08; }
.story > .translation, .lead > .translation, .ending-copy > p > .translation { margin-top: .42em; }
.answer-copy { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.bilingual-button { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.22; }
.language-controls { display: flex; justify-self: end; gap: .28rem; }
.language-controls.standalone { position: absolute; z-index: 10; top: 1rem; right: 1rem; }
.language-controls button { min-width: 40px; padding: .38rem .45rem; color: var(--cream); background: rgba(36,16,10,.78); border: 2px solid rgba(255,244,216,.75); font-size: .58rem; font-weight: 700; cursor: pointer; }
.language-controls button.active { color: var(--ink); background: var(--cream); border-color: var(--gold); box-shadow: 3px 3px 0 rgba(36,16,10,.55); }
.language-controls button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.translated .copy, .translated .cover-copy, .translated .ending-copy { justify-content: flex-start; padding-top: clamp(6.3rem,9vh,7.4rem); padding-bottom: 4rem; }

.primary, .secondary, .answers button, .routes button { appearance: none; border-radius: 0; cursor: pointer; transition: transform .12s ease,filter .12s ease,box-shadow .12s ease; }
.primary, .secondary { min-height: 52px; padding: .82rem 1.1rem; color: var(--cream); background: var(--burgundy); border: 3px solid var(--ink); box-shadow: 7px 7px 0 rgba(36,16,10,.78); font-size: clamp(.78rem,.95vw,.94rem); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.secondary { color: var(--ink); background: var(--cream); }
.primary:hover, .secondary:hover, .answers button:hover, .routes button:hover { transform: translate(-2px,-2px); filter: brightness(1.06); box-shadow: 9px 9px 0 rgba(36,16,10,.65); }
.primary:active, .secondary:active, .answers button:active, .routes button:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 rgba(36,16,10,.72); }
.primary:focus-visible, .secondary:focus-visible, .answers button:focus-visible, .routes button:focus-visible, .restart:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

.hud { position: absolute; z-index: 5; inset: 0 0 auto; display: grid; grid-template-columns: 110px minmax(150px,1fr) 150px 110px auto; align-items: center; gap: clamp(.5rem,1.1vw,1rem); width: 100%; padding: clamp(.7rem,1.5vw,1.05rem) clamp(.8rem,3.2vw,3.2rem); background: linear-gradient(180deg,rgba(36,16,10,.92),rgba(36,16,10,0)); color: var(--cream); text-shadow: 2px 2px 0 var(--ink); }
.hud-stat { display: flex; flex-direction: column; gap: .12rem; }
.hud-stat span { color: var(--brown-light); font-size: .56rem; font-weight: 700; letter-spacing: .1em; }
.hud-stat strong { color: var(--cream); font-size: clamp(.92rem,1.2vw,1.16rem); letter-spacing: .05em; }
.tiles, .chances { align-items: flex-end; text-align: right; }
.meter { position: relative; height: 14px; border: 3px solid var(--cream); background: rgba(36,16,10,.76); box-shadow: 4px 4px 0 rgba(36,16,10,.72); }
.meter i { display: block; height: 100%; background: linear-gradient(90deg,var(--brown),var(--gold),var(--burgundy)); transition: width .32s ease; }
.meter b { position: absolute; top: -7px; width: 4px; height: 23px; background: var(--cream); box-shadow: 0 0 8px var(--cream); }

.copy { width: min(750px,49vw); min-height: 100svh; justify-content: center; padding: clamp(5.8rem,10vh,7.4rem) clamp(1rem,3.7vw,4rem) clamp(4rem,6vh,5rem); }
.pos-right .copy { margin-left: auto; align-items: flex-end; text-align: right; }
.pos-centre .copy { width: min(890px,68vw); margin-inline: auto; justify-content: flex-start; align-items: center; padding-top: clamp(6rem,9vh,7rem); text-align: center; }
.copy h1 { max-width: 100%; font-size: clamp(2rem,3.75vw,4.35rem); }
.story { max-width: 670px; margin: .72rem 0; font-size: clamp(.91rem,1.1vw,1.08rem); font-weight: 700; line-height: 1.46; text-shadow: 0 0 .22rem #fff,0 0 .72rem var(--cream); }
.clue { display: flex; flex-direction: column; gap: .22rem; max-width: 100%; margin: .42rem 0; padding: .62rem .78rem; color: var(--ink); background: rgba(255,244,216,.86); border-left: 5px solid var(--burgundy); box-shadow: 4px 4px 0 rgba(36,16,10,.24); backdrop-filter: blur(4px); }
.pos-right .clue { border-left: 0; border-right: 5px solid var(--burgundy); }
.clue > span { color: var(--burgundy); font-size: .62rem; font-weight: 700; letter-spacing: .12em; }
.clue strong { font-size: clamp(.96rem,1.15vw,1.14rem); line-height: 1.34; }
.copy h2 { margin: .34rem 0 .5rem; font-size: clamp(1.04rem,1.32vw,1.28rem); line-height: 1.26; text-shadow: 0 0 .22rem #fff,0 0 .72rem var(--cream); }
.answers, .routes { display: grid; gap: .48rem; width: 100%; max-width: 690px; }
.answers button, .routes button { display: flex; align-items: center; width: 100%; min-height: 52px; padding: .56rem .66rem; color: var(--ink); text-align: left; background: rgba(255,244,216,.97); border: 3px solid var(--ink); box-shadow: 5px 5px 0 rgba(36,16,10,.56); font-size: clamp(.86rem,1.02vw,1rem); font-weight: 700; line-height: 1.3; }
.pos-right .answers button { flex-direction: row-reverse; text-align: right; }
.answers button b { display: grid; flex: 0 0 32px; width: 32px; height: 32px; margin-right: .62rem; place-items: center; color: var(--cream); background: var(--burgundy); border: 2px solid var(--ink); line-height: 1; }
.pos-right .answers button b { margin-right: 0; margin-left: .62rem; }
.routes { grid-template-columns: repeat(2,minmax(0,1fr)); margin-top: .65rem; }
.routes button { flex-direction: column; align-items: flex-start; gap: .34rem; min-height: 92px; padding: .8rem; }
.routes button strong { color: var(--burgundy); font-size: clamp(.8rem,.96vw,.94rem); letter-spacing: .03em; }
.routes button > span { color: var(--brown-dark); font-size: .72rem; letter-spacing: .05em; }
.feedback { width: 100%; max-width: 670px; margin-top: .6rem; padding: .84rem .9rem; color: var(--ink); text-align: left; text-shadow: none; background: rgba(255,244,216,.98); border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(36,16,10,.58); }
.feedback.right { border-color: var(--right); }
.feedback.wrong { border-color: var(--wrong); }
.feedback > strong { display: block; margin-bottom: .28rem; color: var(--burgundy); font-size: .85rem; letter-spacing: .05em; }
.feedback p { margin: 0 0 .62rem; font-size: .9rem; font-weight: 700; line-height: 1.4; }

-train-home-rpg/10_battery.webp","11_no_return.webp":"last-train-home-rpg/11_no_return.webp","12_route_two.webp":"last-train-home-rpg/12_route_two.webp","13_cashless.webp":"last-train-home-rpg/13_cashless.webp","14_food_lab.webp":"last-train-home-rpg/14_food_lab.webp","15_razor.webp":"last-train-home-rpg/15_razor.webp","16_rook.webp":"last-train-home-rpg/16_rook.webp","17_checkpoint.webp":"last-train-home-rpg/17_checkpoint.webp","18_cloud_city.webp":"last-train-home-rpg/18_cloud_city.webp","19_route_three.webp":"last-train-home-rpg/19_route_three.webp","20_patrol_robots.webp":"last-train-home-rpg/20_patrol_robots.webp","21_freight_lift.webp":"last-train-home-rpg/21_freight_lift.webp","22_tower_gate.webp":"last-train-home-rpg/22_tower_gate.webp","23_ending.webp":"last-train-home-rpg/23_ending.webp"}};</script>
<script>(() => {
  const DATA = window.CYBERVOXEL_GAME_DATA;
  const root = document.getElementById("app");
  const maximum = 75;
  const initial = (lang = "off") => ({ started: false, sceneId: DATA.startScene || "breakdown", score: 0, chances: 3, answer: null, route: [], tiles: 0, finalCorrect: null, lang });
  let state = initial();

  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
  const translation = (text) => text ? `<span class="translation" lang="${state.lang}">${esc(text)}</span>` : "";
  const bilingual = (english, local) => `<span>${esc(english)}</span>${state.lang === "off" ? "" : translation(local)}`;
  const image = (name, alt) => `<img class="scene" src="${DATA.images[name]}" alt="${esc(alt)}">`;
  const languageControls = (standalone = false) => `<div class="language-controls ${standalone ? "standalone" : ""}" role="group" aria-label="Translation language">${["off", "es", "de"].map((item) => `<button data-lang="${item}" class="${state.lang === item ? "active" : ""}" aria-pressed="${state.lang === item}">${item.toUpperCase()}</button>`).join("")}</div>`;

  function localUi() { return state.lang === "off" ? null : DATA.ui[state.lang]; }
  function localScene() { return state.lang === "off" ? null : DATA.scenes[state.sceneId]?.local?.[state.lang]; }
  function localAct(scene) { return state.lang === "off" ? null : scene.local?.[state.lang]?.act; }

  function scoreHud() {
    const ui = localUi();
    const progress = Math.min(100, Math.round((state.score / maximum) * 100));
    return `<header class="hud">
      <div class="hud-stat"><span>${bilingual(DATA.pointLabel || "FUTURE POINTS", ui?.points)}</span><strong>${state.score}</strong></div>
      <div class="meter"><i style="width:${progress}%"></i><b style="left:66.6%"></b></div>
      <div class="hud-stat tiles"><span>${bilingual(DATA.tileLabel || "ACCESS SHARDS", ui?.tiles)}</span><strong>${"◆".repeat(state.tiles)}${"◇".repeat(4 - state.tiles)}</strong></div>
      <div class="hud-stat chances"><span>${bilingual("CHANCES", ui?.chances)}</span><strong>${"♥".repeat(state.chances)}${"♡".repeat(3 - state.chances)}</strong></div>
      ${languageControls()}
    </header>`;
  }

  function result() {
    if (state.finalCorrect && state.tiles === 4 && state.score === maximum && state.chances > 0) return DATA.endings.master;
    if (state.finalCorrect && state.tiles === 4 && state.score >= 50 && state.chances > 0) return DATA.endings.complete;
    if (state.finalCorrect && state.tiles < 4) return DATA.endings.missing;
    return DATA.endings.failed;
  }

  function renderCover() {
    const cover = DATA.cover;
    const local = state.lang === "off" ? null : cover.local[state.lang];
    root.innerHTML = `<main class="game cover tone-${cover.tone || "dark"} ${state.lang !== "off" ? "translated" : ""}">
      ${image(cover.image, "Jax looks across the orange megacity toward his home tower")}
      <div class="wash cover-wash"></div>${languageControls(true)}
      <section class="cover-copy">
        <p class="eyebrow">${bilingual(cover.eyebrow, local?.eyebrow)}</p>
        <h1>${bilingual(cover.title, local?.title)}</h1>
        <p class="lead">${bilingual(cover.lead, local?.lead)}</p>
        <div class="rules">${cover.rules.map((rule, index) => `<span>${bilingual(rule, local?.rules[index])}</span>`).join("")}</div>
        <button class="primary bilingual-button" data-action="start">${bilingual(cover.start, local?.start)}</button>
        <small>${bilingual(cover.small, local?.small)}</small>
      </section>
    </main>`;
  }

  function renderEnding() {
    const current = result();
    const ui = localUi();
    const local = state.lang === "off" ? null : current.local[state.lang];
    root.innerHTML = `<main class="game ending tone-light ${current.success ? "success-ending" : "failure-ending"} ${state.lang !== "off" ? "translated" : ""}">
      ${image(current.image, current.title)}<div class="wash ${current.success ? "success-wash" : "failure-wash"}"></div>${scoreHud()}
      <section class="ending-copy">
        <p class="eyebrow">${bilingual(current.label, local?.label)}</p>
        <h1>${bilingual(current.title, local?.title)}</h1>
        <p>${bilingual(current.text, local?.text)}</p>
        <div class="result"><span>${bilingual("FINAL SCORE", ui?.finalScore)}</span><strong>${state.score} / ${maximum}</strong><span>${"◆".repeat(state.tiles)}${"◇".repeat(4 - state.tiles)}</span></div>
        <div class="actions"><button class="primary bilingual-button" data-action="reset">${bilingual("PLAY AGAIN", ui?.playAgain)}</button><button class="secondary bilingual-button" data-action="print">${bilingual("PRINT RESULT", ui?.print)}</button></div>
      </section>
    </main>`;
  }

  function renderPlay() {
    const scene = DATA.scenes[state.sceneId];
    const local = localScene();
    const ui = localUi();
    const answered = state.answer !== null;
    const selected = answered ? scene.answers[state.answer] : null;
    const correctIndex = scene.answers?.findIndex((item) => item.correct) ?? -1;
    const correct = correctIndex >= 0 ? scene.answers[correctIndex].text : "";
    const localCorrect = correctIndex >= 0 ? local?.answers?.[correctIndex] : "";
    const answers = scene.answers && !answered ? `<div class="answers">${scene.answers.map((option, index) => `<button data-answer="${index}"><b>${String.fromCharCode(65 + index)}</b><span class="answer-copy">${bilingual(option.text, local?.answers?.[index])}</span></button>`).join("")}</div>` : "";
    let feedback = "";
    if (answered) {
      const englishMessage = selected.correct ? `+${scene.points ?? 0} points.${scene.relic ? " One orange access shard recovered." : " The night run continues."}` : `No points. Correct answer: ${correct}`;
      const localMessage = !ui ? "" : selected.correct ? `+${scene.points ?? 0}. ${scene.relic ? ui.recovered : ui.correct}` : `${ui.noPoints} ${localCorrect}`;
      feedback = `<div class="feedback ${selected.correct ? "right" : "wrong"}"><strong>${bilingual(selected.correct ? (scene.relic ? "SHARD RECOVERED" : "CORRECT PREDICTION") : "WRONG PREDICTION", selected.correct ? (scene.relic ? ui?.recovered : ui?.correct) : ui?.falseTrail)}</strong><p>${bilingual(englishMessage, localMessage)}</p><button class="primary small bilingual-button" data-action="continue">${bilingual("CONTINUE", ui?.continue)}</button></div>`;
    }
    const routes = scene.choices ? `<div class="routes">${scene.choices.map((choice, index) => `<button data-choice="${index}"><strong>${bilingual(choice.label, local?.choices?.[index]?.label)}</strong><span>${bilingual(choice.note, local?.choices?.[index]?.note)}</span></button>`).join("")}</div>` : "";
    root.innerHTML = `<main class="game play pos-${scene.position} tone-${scene.tone || "dark"} ${state.lang !== "off" ? "translated" : ""}">
      ${image(scene.image, scene.title)}<div class="wash wash-${scene.position}"></div>${scoreHud()}
      <section class="copy" aria-live="polite">
        <p class="eyebrow">${bilingual(scene.act, localAct(scene))}</p>
        <h1>${bilingual(scene.title, local?.title)}</h1>
        <p class="story">${bilingual(scene.story, local?.story)}</p>
        ${scene.clue ? `<div class="clue"><span>${bilingual("VISUAL CLUE", ui?.evidence)}</span><strong>${bilingual(scene.clue, local?.clue)}</strong></div>` : ""}
        ${scene.prompt ? `<h2>${bilingual(scene.prompt, local?.prompt)}</h2>` : ""}
        ${answers}${feedback}${routes}
      </section>
      <button class="restart bilingual-button" data-action="reset">${bilingual("START OVER", ui?.restart)}</button>
    </main>`;
  }

  function render() {
    if (!state.started) renderCover();
    else if (state.sceneId === "ending") renderEnding();
    else renderPlay();
  }

  root.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.lang) { state.lang = button.dataset.lang; render(); return; }
    const action = button.dataset.action;
    if (action === "start") { state.started = true; render(); return; }
    if (action === "reset") { state = initial(state.lang); render(); return; }
    if (action === "print") { window.print(); return; }
    const scene = DATA.scenes[state.sceneId];
    if (button.dataset.answer !== undefined && state.answer === null) {
      const index = Number(button.dataset.answer);
      const option = scene.answers[index];
      state.answer = index;
      if (scene.finalChoice) state.finalCorrect = Boolean(option.correct);
      if (option.correct) {
        state.score += scene.points ?? 0;
        if (scene.relic) state.tiles = Math.min(4, state.tiles + 1);
      } else {
        state.chances = Math.max(0, state.chances - 1);
      }
      render(); return;
    }
    if (action === "continue" && state.answer !== null) {
      const option = scene.answers[state.answer];
      if (!option.correct && state.chances === 0) state.sceneId = "ending";
      else state.sceneId = option.correct ? scene.correctNext : scene.wrongNext;
      state.answer = null; render(); return;
    }
    if (button.dataset.choice !== undefined) {
      const choice = scene.choices[Number(button.dataset.choice)];
      state.route.push(choice.route);
      state.sceneId = choice.next;
      state.answer = null;
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
