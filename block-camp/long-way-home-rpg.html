.hud{position:absolute;z-index:5;inset:0 0 auto;display:grid;grid-template-columns:90px minmax(140px,1fr) 90px 140px 150px auto;align-items:center;gap:clamp(.45rem,1vw,.9rem);width:100%;padding:clamp(.68rem,1.35vw,1rem) clamp(.8rem,3vw,3rem);color:var(--cream);background:linear-gradient(180deg,color-mix(in srgb,var(--dark) 94%,transparent),transparent);text-shadow:2px 2px 0 var(--dark)}.hud-stat{display:flex;flex-direction:column;gap:.12rem}.hud-stat span{color:var(--accent);font-size:.52rem;font-weight:900;letter-spacing:.1em}.hud-stat strong{color:var(--cream);font-size:clamp(.82rem,1.05vw,1rem);letter-spacing:.04em}.centre-stat{text-align:center}.chances{text-align:right}.meter{position:relative;height:14px;border:3px solid var(--cream);background:color-mix(in srgb,var(--dark) 82%,transparent);box-shadow:4px 4px 0 color-mix(in srgb,var(--dark) 75%,transparent)}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--accent),var(--light));transition:width .3s ease}.meter b{position:absolute;top:-7px;width:4px;height:23px;background:var(--cream);box-shadow:0 0 8px var(--cream);transition:left .3s ease}.tools{display:flex;gap:.25rem}.tools button,.restart{color:var(--cream);background:color-mix(in srgb,var(--dark) 82%,transparent);border:2px solid color-mix(in srgb,var(--cream) 76%,transparent);font-size:.55rem;font-weight:900;letter-spacing:.07em;cursor:pointer}.tools button{padding:.4rem .48rem}.tools button:hover,.restart:hover{color:var(--dark);background:var(--accent)}

/* CINEMATIC PER-SLIDE ART DIRECTION */
.game{color:var(--cream)}
.game .scene-art{background-image:linear-gradient(180deg,rgba(4,8,10,.08),rgba(4,8,10,.12)),var(--scene-image);background-position:var(--scene-x) var(--scene-y);background-size:cover;filter:var(--scene-filter);transform:scale(var(--scene-zoom));transform-origin:var(--scene-x) var(--scene-y);transition:transform .7s ease,filter .4s ease}
.game .wash-left{background:linear-gradient(90deg,rgba(5,11,13,.97) 0%,rgba(9,17,20,.92) 31%,rgba(16,25,27,.52) 56%,transparent 79%)}
.game .wash-right{background:linear-gradient(270deg,rgba(5,11,13,.97) 0%,rgba(9,17,20,.92) 31%,rgba(16,25,27,.52) 56%,transparent 79%)}
.game .wash-centre{background:radial-gradient(circle at center,rgba(5,11,13,.94) 0%,rgba(9,17,20,.74) 39%,transparent 77%)}
.game .grain{opacity:.1;mix-blend-mode:soft-light}
.copy{color:var(--cream)}
.copy .eyebrow{color:var(--accent);text-shadow:0 2px 13px #000}
.copy h1{color:var(--cream);text-shadow:0 3px 0 rgba(0,0,0,.75),0 0 1.25rem rgba(0,0,0,.78)}
.copy .story{color:color-mix(in srgb,var(--cream) 91%,var(--light));text-shadow:0 2px 10px #000}
.copy h2{color:var(--cream);text-shadow:0 2px 10px #000}
.scene-stamp{position:absolute;z-index:4;right:clamp(.8rem,2.4vw,2.5rem);bottom:3.25rem;display:flex;align-items:flex-end;gap:.55rem;max-width:min(42vw,560px);color:rgba(255,255,255,.84);text-align:right;text-shadow:0 2px 10px #000}
.scene-stamp span{color:var(--accent);font-size:2.4rem;font-weight:900;line-height:.8}
.scene-stamp b{font-size:.56rem;letter-spacing:.13em;text-transform:uppercase}
.pos-right .scene-stamp{right:auto;left:clamp(.8rem,2.4vw,2.5rem);text-align:left}
.slide{animation:cinematic-enter .34s cubic-bezier(.2,.75,.25,1)}
@keyframes cinematic-enter{from{opacity:.22;transform:translateX(2.1rem) scale(1.008)}to{opacity:1;transform:none}}
@media(max-width:880px){.game .scene-art{background-position:var(--scene-x) center;transform:scale(calc(var(--scene-zoom) + .08))}.game .wash-left,.game .wash-right,.game .wash-centre{background:linear-gradient(180deg,transparent 0%,rgba(5,11,13,.22) 30%,rgba(5,11,13,.94) 67%,rgba(5,11,13,.98) 100%)}}
@media(max-width:560px){.scene-stamp{display:none}}

/* IMAGE-FIRST REVISION: NO FULL-CANVAS DARK GRADIENTS */
.game .scene-art{background-image:var(--scene-image);filter:var(--scene-filter);transform:scale(var(--scene-zoom))}
.game .wash{display:none}
.game .hud{background:rgba(5,11,13,.68);backdrop-filter:blur(7px);text-shadow:1px 2px 5px #000}
.copy .story{padding:.64rem .76rem;background:rgba(5,11,13,.7);border-left:4px solid var(--light);box-shadow:4px 4px 0 rgba(5,11,13,.28)}

/* ROUTE CLARITY */
.clue strong{color:var(--dark);letter-spacing:.04em}

.offline-cover{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;display:flex;align-items:center;color:#fff4d6;background:#211a18}

/* IMAGE-FIRST, PART TWO: COVER AND ENDINGS
   The game slides dropped their full-canvas washes and gave each text element
   its own plate. The cover and the two endings never got the same pass, so
   they still hid the artwork behind a near-opaque gradient. Same treatment. */
.offline-cover::after{display:none}
.offline-brand{text-shadow:0 2px 8px #000,0 0 1rem rgba(0,0,0,.9)}
.cover-sub,.offline-deck{padding:.7rem .9rem;background:rgba(5,11,13,.68);border-left:4px solid #ffc857;box-shadow:5px 5px 0 rgba(5,11,13,.3)}

.ending .wash{display:none}
.ending .grain{opacity:.09;mix-blend-mode:soft-light}
.ending{color:#fff4d6}
.ending-success .scene-art{filter:saturate(.9) contrast(1.03) brightness(.84)}
.ending-failure .scene-art{filter:saturate(.5) sepia(.16) brightness(.5) contrast(1.08)}
.ending-card .eyebrow{display:inline-block;padding:.4rem .55rem;color:#ffc857;background:rgba(5,11,13,.72);box-shadow:3px 3px 0 rgba(5,11,13,.28);text-shadow:0 2px 7px #000}
.ending-card h1{color:#fff4d6;text-shadow:0 3px 0 rgba(0,0,0,.7),0 0 1.15rem rgba(0,0,0,.85)}
.ending-card>p:not(.eyebrow){padding:.72rem .9rem;background:rgba(5,11,13,.70);box-shadow:5px 5px 0 rgba(5,11,13,.3);text-shadow:0 2px 8px #000}
.ending-rule{border-left:4px solid #ffc857}
.ending .final-stats div{color:#4f211f}
.ending .final-stats strong{color:#8f3f2c}

/* EYEBROW: CARRY YOUR OWN CONTRAST
   chapter/location sat in a muted theme accent with only a soft blur shadow,
   so it vanished on sandy or sunlit art (18 of 36 scenes under 4.5:1, the
   worst at 1.06:1). A hard 8-way pixel outline works on any backdrop: the
   gold reads against dark art, the outline reads against bright art. */
.copy .eyebrow{
  color:#ffd166;
  text-shadow:
    -.11em -.11em 0 #050b0d,  0 -.11em 0 #050b0d,  .11em -.11em 0 #050b0d,
    -.11em  0     0 #050b0d,                       .11em  0     0 #050b0d,
    -.11em  .11em 0 #050b0d,  0  .11em 0 #050b0d,  .11em  .11em 0 #050b0d,
     0 .16em .5em rgba(5,11,13,.9);
}

/* DARK TRANSLUCENT BOXES + TRANSLATION LAYER
   Every box over artwork now matches the story and question panels: dark,
   translucent, bright text, so the scene shows through instead of being
   covered by cream cards. */
.answers button{color:#fff4d6;background:rgba(5,11,13,.72);border-color:rgba(255,244,214,.32);text-shadow:0 1px 4px rgba(0,0,0,.85)}
.answers button:hover{background:rgba(5,11,13,.88);border-color:var(--accent)}

.feedback>strong{color:var(--accent)}
.feedback.right{border-color:#7fd6a0}
.feedback.wrong{border-color:#ff909e}
.feedback.choice-feedback{border-color:var(--accent)}
.feedback .route{color:#fff4d6;background:rgba(5,11,13,.55);border-left-color:var(--accent)}

.clue strong{color:#fff4d6}
.clue span{color:var(--accent)}
.ending .final-stats div{color:#fff4d6;background:rgba(5,11,13,.74);border-color:rgba(255,244,214,.32);box-shadow:4px 4px 0 rgba(5,11,13,.32)}
.ending .final-stats strong{color:#ffd166}

  color:#9fe3de;font-style:italic;font-weight:700;line-height:1.4;text-shadow:0 1px 4px rgba(0,0,0,.9)}

.feedback .translation b{margin-right:.42rem;color:var(--accent);font-style:normal;font-size:.72em;letter-spacing:.1em}

.pos-right .gloss{padding-left:0;padding-right:.62rem;border-left:0;border-right:2px solid rgba(159,227,222,.5)}
@media(max-width:880px){
  .pos-right .gloss{padding-left:.62rem;padding-right:0;border-left:2px solid rgba(159,227,222,.5);border-right:0}
  .cover-lang{margin-top:.9rem}
  .cover-lang button{padding:.5rem .6rem;font-size:.58rem}
}

/* the muted theme accent (#c8a963-#d2ab62) only reaches ~3.7:1 on these dark
   plates - same trap as the ending eyebrow. Brighter gold for label text;
   var(--accent) still fills badges and buttons, where it is the background. */
.gloss b,.feedback .translation b,.feedback>strong,.clue span,.langsel i{color:#ffd166}

/* HUD MOVED TO THE FOOT OF THE FRAME
   A 62px bar across the top sat exactly where heads are: the artwork is
   composed with faces high in the frame, so the bar was cropping them. The
   bottom 8% carries more raw detail (59.5 vs 29.8 mean gradient) but it is
   foreground texture - deck, rock, water - which costs nothing to cover. */
.hud{inset:auto 0 0;background:linear-gradient(0deg,color-mix(in srgb,var(--dark) 94%,transparent),transparent)}
.game .hud{background:rgba(5,11,13,.72);backdrop-filter:blur(7px)}

/* START OVER now rides in the bar rather than floating over the picture */
.hud .restart{position:static;z-index:auto;padding:.4rem .48rem;white-space:nowrap}

/* the copy block: reclaim the top, keep clear of the bar at the foot */
.copy{padding-top:clamp(2.4rem,4.5vh,3.4rem);padding-bottom:clamp(6.2rem,9.5vh,7.4rem)}
.pos-centre .copy{padding-top:clamp(2.8rem,5vh,4rem)}
.scene-stamp{bottom:5.4rem}

@media(min-width:881px) and (max-height:790px){
  .copy{padding-top:2rem;padding-bottom:5.8rem}
  .tr-on .copy{padding-top:1.9rem;padding-bottom:5.6rem}
}
@media(max-width:880px){
  .copy,.pos-centre .copy,.pos-right .copy{padding:2.6rem 1rem 7rem}
  .scene-stamp{bottom:6.4rem}
  /* four controls in one row on a phone: buy headroom rather than rely on 7px */
  .hud .tools{gap:.18rem}
  .hud .tools button{padding:.34rem .3rem}
  .tools .langsel button{min-width:24px;padding:.34rem .18rem}
  .hud .restart{padding:.34rem .34rem;font-size:.5rem}
}
@media(max-width:560px){.copy{padding-top:2.4rem}}

    if (perfect) return "PAST PERFECT";

  var c = (chapter, location, title, narrative, prompt, options, art) => ({ chapter, location, title, narrative, prompt, focus: "STORY CHOICE", options, art, kind: "choice" });

    q("PROLOGUE \xB7 III", "BEYOND THE CITY WALLS", "WHAT CAME BEFORE", "Odysseus remembered the wooden horse. The Greeks had hidden inside it before the Trojans pulled it through the gates.", "What does \u2018had hidden\u2019 show?", "Use PAST PERFECT to look further back from a past moment: had + past participle.", [

    q("BOOK VI", "CIRCE\u2019S HALL", "THE ENCHANTED FEAST", "When Eurylochus returned, he was trembling. Circe had welcomed the others, had mixed a potion into their food and had transformed them into pigs.", "Why are three past perfect verbs used?", "Past perfect can summarise a chain of events before the current point in a past story.", [

    q("BOOK XII", "THE PHAEACIAN HALL", "TELL THE WHOLE STORY", "At the king\u2019s feast, a bard sang about Troy. Odysseus began to weep. His tears made the king suspect that the stranger was a hero from the war. Until that moment, nobody had recognised him.", "Which past-simple action triggers the revelation?", "PAST SIMPLE delivers the main event and visible turning point: Odysseus began to weep. The earlier non-recognition only describes what had been true before that moment.", [
      { text: "The bard sang about Troy.", note: "This begins the scene, but the song alone does not reveal the stranger\u2019s identity." },
      { text: "Odysseus began to weep.", correct: true, note: "His crying is the visible clue that makes the king suspect who he is." },
      { text: "Nobody had recognised him.", note: "This looks back at the earlier state of knowledge; it does not create the revelation." }
    ]),
    c("BOOK XIII", "ITHACA \xB7 HIDDEN HARBOUR", "HOME, BUT NOT SAFE", "At last, Odysseus reached Ithaca under cover of mist. Suitors had occupied his palace and were wasting his wealth.", "What do you do first? This decision creates a different ending.", [
      { text: "Enter openly and demand your throne.", effect: { hearts: -2, score: 25 }, ending: "open-assault", route: "ENDING: THE OPEN ASSAULT", note: "The suitors recognise you at once and surround you before your loyal allies can gather." },
      { text: "Accept Athena\u2019s beggar disguise and test who is loyal.", effect: { score: 80, crew: 1 }, next: 33, route: "THE BEGGAR-KING ROUTE", note: "Athena gives you an old face, a long white beard and a hooded beggar\u2019s robe. Patience opens the hidden route through Eumaeus\u2019 hut." },
      { text: "Hide in the hills until the suitors leave.", effect: { supplies: -2, score: 20 }, ending: "hill-exile", route: "ENDING: THE KING WHO WAITED", note: "The suitors do not leave. Seasons pass, your supplies vanish and Ithaca forgets its hidden king." }
    ], "hero"),
    q("BOOK XIII", "THE SWINEHERD\u2019S HUT", "THE LOYAL SERVANT", "Eumaeus welcomed an old beggar in a hooded robe, never guessing that the white-bearded stranger was Odysseus. While they were sharing a meal, he explained that Penelope had resisted the suitors for years.", "Which clause gives the ongoing scene?", "A paragraph can move from event \u2192 scene in progress \u2192 earlier history.", [
      { text: "Eumaeus welcomed the stranger.", note: "This is the completed opening event." },
      { text: "They were sharing a meal.", correct: true, note: "This ongoing activity forms the background." },
      { text: "Penelope had resisted the suitors.", note: "This summarises earlier history." }
    ]),
    q("BOOK XIV \xB7 BOSS", "THE GREAT HALL", "THE BOW TEST", "Penelope brought out Odysseus\u2019 bow. The suitors had already tried and failed when a hooded, white-bearded beggar asked for a turn. They were laughing as the disguised king lifted it.", "Choose the complete tense map.", "Choose a tense to show sequence, background or earlier cause\u2014not only because the story is past.", [
      { text: "brought/asked/lifted = events; had tried = earlier; were laughing = background", correct: true, note: "Every form has a clear narrative function." },
      { text: "brought/asked/lifted = background; had tried = event; were laughing = earlier", note: "The functions are reversed." },
      { text: "All verbs should be past simple because the story is past.", note: "Narrative tenses organise relationships between past events." }
    ], "hero", "boss"),
    q("FINALE", "THE AXEHEADS", "ONE LAST SENTENCE", "Silence filled the hall. Odysseus threw back the beggar\u2019s hood, strung the bow nobody else had been able to bend and revealed himself. While the suitors were staring, he sent an arrow through every axehead.", "Before the reveal, nobody had recognised him because Athena ___ his identity.", "Past perfect explains the earlier action behind a later past result.", [
      { text: "concealed", note: "Grammatical, but it does not emphasise the earlier preparation." },
      { text: "was concealing", note: "This focuses on concealment in progress." },
      { text: "had concealed", correct: true, note: "The disguise was established before they failed to recognise him." }
    ], "hero", "boss")

  var SCENE_TR = {"es":{"0":{"n":"Mientras ardían las últimas torres, Odiseo reunió a doce marineros junto a una nave de casco negro. Les ordenó subir a bordo, y la nave dejó Troya. Ítaca esperaba tras un mar furioso.","p":"¿Qué verbos marcan los hechos principales?","r":"Usa PAST SIMPLE para los hechos terminados que hacen avanzar la historia. La cláusula was/were + -ing crea la escena alrededor.","o":["Estos hechos en PAST SIMPLE forman la secuencia principal.","Es el fondo en progreso, no el hecho principal.","Alejarían las acciones hacia un pasado anterior; aquí hace falta la secuencia principal."],"rt":[null,null,null]},"1":{"n":"La tripulación cargó bronce, vino y grano. Sobre ellos se agrupaban nubes de tormenta. Las cuerdas crujían y un viento frío subía desde el oeste.","p":"¿Por qué se usa PAST CONTINUOUS aquí?","r":"Usa PAST CONTINUOUS para el fondo, las acciones en progreso y las acciones interrumpidas: was/were + verb-ing.","o":["Estos detalles en progreso crean la escena de la acción principal.","Eso suele ser tarea del PAST SIMPLE.","Esa es la tarea central del PAST PERFECT."],"rt":[null,null,null]},"2":{"n":"Odiseo recordó el caballo de madera. Los griegos se habían escondido dentro antes de que los troyanos lo arrastraran por las puertas.","p":"¿Qué muestra ‘had hidden’?","r":"Usa PAST PERFECT para mirar más atrás desde un momento pasado: had + participio.","o":["Esconderse ocurrió primero; arrastrarlo, después.","El fondo simultáneo suele usar PAST CONTINUOUS.","Eso se expresa con PAST SIMPLE o used to."],"rt":[null,null,null]},"3":{"n":"Al amanecer, la flota llegó a Ísmaro. La ciudad parecía indefensa, pero de las torres de vigilancia de las colinas subía humo.","p":"Capitán, ¿qué ordenas?","r":null,"o":["Partes antes de que lleguen los jinetes. Evitas el contraataque y la flota llega a la costa del Loto con tripulación completa.","Llegan refuerzos mientras tus marineros aún cargan la nave. Tienes que abrirte paso luchando hasta la playa.","Evitas Ísmaro y el Loto, pero la tripulación hambrienta navega directa a la niebla del Cíclope."],"rt":["COSTA DEL LOTO — BATALLA EVITADA","CONTRAATAQUE EN ÍSMARO","ISLA DEL CÍCLOPE — COSTA DEL LOTO OMITIDA"]},"4":{"n":"Tus marineros llevaban jarras a la nave cuando jinetes enemigos aparecieron en la cresta. Brillaron escudos. Sonaron cuernos.","p":"Elige la frase que mejor combina fondo e interrupción.","r":"Acción en progreso: was/were carrying. Hecho que interrumpe: appeared.","o":["El fondo y la interrupción están invertidos.","El PAST CONTINUOUS pone el fondo; el PAST SIMPLE lo interrumpe.","El PAST PERFECT sobra en ambos hechos."],"rt":[null,null,null]},"5":{"n":"Tres exploradores volvieron sonriendo de forma extraña. Habían comido el loto y habían olvidado Ítaca.","p":"Olvidaron Ítaca porque ___ el loto antes.","r":"El PAST PERFECT explica un resultado pasado mostrando una causa anterior.","o":["Aquí no marca con claridad la causa anterior.","Describe una acción en progreso.","La causa ocurrió antes del olvido."],"rt":[null,null,null]},"6":{"n":"Mientras los lotófagos cantaban, Odiseo ató a los exploradores hechizados bajo los bancos. La tripulación empujó la nave hacia las olas.","p":"¿Qué acción terminada ocurrió primero?","r":"El PAST CONTINUOUS pinta la escena; el PAST SIMPLE aporta los hechos en orden.","o":["Su canto ya estaba en progreso.","Es la primera acción terminada de la secuencia principal.","Ocurrió después de que Odiseo los atara."],"rt":[null,null,null]},"7":{"n":"Tras días de niebla, apareció una isla montañosa. Cabras vagaban sobre una cueva. No ardía ningún fuego, pero huellas enormes cruzaban el barro.","p":"Elige cómo acercarte.","r":null,"o":["Un grupo pequeño entra mientras los demás cuidan la nave. Polifemo vuelve antes de que puedas salir y cierra la entrada.","La cueva llena no deja dónde esconderse. Pierdes provisiones, pero el vino aún puede ser un arma cuando el gigante sella la entrada.","Tus exploradores aprenden la rutina del gigante y preparan una estaca. Entras al anochecer, pero Polifemo vuelve pronto y tapa la puerta con una roca."],"rt":["CUEVA DE POLIFEMO — RUTA EQUILIBRADA","CUEVA DE POLIFEMO — RUTA DIFÍCIL","CUEVA DE POLIFEMO — RUTA PREPARADA"]},"8":{"n":"Los hombres comían queso cuando Polifemo volvió. Apoyó ambas manos en una roca del tamaño de una puerta, la rodó sobre la entrada y borró la última franja de luz.","p":"¿Qué verbo debe ir en PAST CONTINUOUS?","r":"Usa PAST CONTINUOUS para la acción larga que rodea un hecho breve en PAST SIMPLE.","o":["La comida ya estaba en curso cuando actuó el Cíclope.","Es un hecho terminado que interrumpe la comida.","Es la acción principal terminada que sella la cueva."],"rt":[null,null,null]},"9":{"n":"Odiseo ofreció al gigante vino oscuro. Había afilado una estaca de olivo antes de que Polifemo terminara de beber. Luego el Cíclope exigió su nombre.","p":"Elige la secuencia de tiempos más clara.","r":"El PAST PERFECT deja clara la preparación terminada antes.","o":["Aquí invierte el punto de vista más claro.","La preparación estaba lista antes del momento posterior.","No muestra una preparación terminada."],"rt":[null,null,null]},"10":{"n":"Polifemo se había desplomado tras beber el vino. Mientras dormía, Odiseo y cuatro marineros calentaron la estaca afilada en el fuego. A su señal, la levantaron, la clavaron en el único ojo del Cíclope y lo cegaron. Él rugió y arañó la roca sellada, pero no se movió.","p":"¿Qué verbos hacen avanzar el ataque decisivo?","r":"Usa PAST SIMPLE para los hechos principales terminados. El PAST CONTINUOUS da el fondo; el PAST PERFECT llega a una condición anterior.","o":["El PAST PERFECT fija la condición previa que hace posible el ataque.","Estas formas de PAST CONTINUOUS describen acciones ya en progreso.","Estas acciones terminadas en PAST SIMPLE dan el ataque y su resultado."],"rt":[null,null,null]},"11":{"n":"Cuando la cueva se abrió, los hombres ya se habían atado bajo las ovejas del gigante. Polifemo tocó el lomo de cada animal mientras el rebaño salía.","p":"¿Qué hecho ya estaba terminado al abrirse la cueva?","r":"had tied = antes; opened/touched = hechos; was leaving = fondo.","o":["El PAST PERFECT sitúa el atarse antes de la apertura.","Ocurrió después de abrirse la cueva.","Estaba en progreso durante la revisión."],"rt":[null,null,null]},"12":{"n":"Eolo acogió a la tripulación agotada. Antes de que zarparan, encerró todos los vientos hostiles en una bolsa de cuero y advirtió a Odiseo que no la abriera.","p":"¿Quién debe vigilar la bolsa?","r":null,"o":["La vigila nueve días sin dormir y cae rendido a la vista de Ítaca. Unos marineros desconfiados tocan el nudo.","Los guardias mantienen la bolsa cerrada. El viento del oeste lleva la flota a casa y abre una ruta temprana a Ítaca.","La sospecha se extiende enseguida. La tripulación cree que la bolsa es un tesoro y la desata antes del alba."],"rt":["BOLSA ABIERTA","ÍTACA — SIN EL LARGO RODEO","BOLSA ABIERTA"]},"13":{"n":"Ítaca brillaba en el horizonte cuando Odiseo se quedó dormido. Los marineros abrieron la bolsa porque habían decidido que contenía oro robado.","p":"¿Por qué usamos ‘had decided’?","r":"El PAST PERFECT muestra una idea, un plan o una decisión previa que causó una acción posterior.","o":["Idea anterior, acción posterior.","Eso pediría normalmente PAST CONTINUOUS.","La frase presenta la decisión como anterior."],"rt":[null,null,null]},"14":{"n":"La flota entraba en un puerto estrecho cuando atacaron los lestrigones. Los gigantes alzaban rocas y destrozaban un barco tras otro.","p":"Elige la mejor frase narrativa.","r":"was entering + when + attacked es el patrón clásico de fondo e interrupción.","o":["Debilita la interrupción repentina.","Dos formas de PAST PERFECT ocultan la acción.","Una entrada en curso queda cortada por el ataque."],"rt":[null,null,null]},"15":{"n":"Solo quedaba un barco. La música flotaba entre los árboles. Lobos y leones vigilaban una puerta luminosa sin moverse.","p":"Elige tu plan de exploración.","r":null,"o":["El grupo entra en el salón y desaparece. Solo Euríloco vuelve con noticias de la transformación.","Hermes te encuentra antes y te da protección. Te enfrentas a Circe antes de que transforme a la tripulación.","Descubres que los animales mansos fueron hombres. Avisado a tiempo, obligas a Circe a negociar."],"rt":["FESTÍN HECHIZADO DE CIRCE","TREGUA DE CIRCE","TREGUA DE CIRCE"]},"16":{"n":"Cuando Euríloco volvió, temblaba. Circe había acogido a los demás, había mezclado una poción en su comida y los había convertido en cerdos.","p":"¿Por qué hay tres verbos en PAST PERFECT?","r":"El PAST PERFECT resume una cadena de hechos anteriores al punto actual de un relato en pasado.","o":["Explican lo que ya había pasado.","Eso pediría PAST CONTINUOUS.","La transformación ocurrió antes."],"rt":[null,null,null]},"17":{"n":"Cuando Odiseo venció la magia de Circe, ella acogió a la tripulación. Durante meses banquetearon, cazaron y olvidaron el mar. Una tarde, un marinero preguntó por qué seguían esperando.","p":"¿Qué frase da el fondo en ese momento?","r":"Usa PAST CONTINUOUS para una acción en curso en un momento pasado concreto.","o":["Resume el periodo ya terminado.","Sugiere que la espera ya había acabado.","La espera seguía cuando él habló."],"rt":[null,null,null]},"18":{"n":"Antes de que Odiseo entrara en el Inframundo, Circe le había explicado el ritual. Ahora un agua negra se movía bajo el barco y el sol desapareció tras ellos.","p":"Une cada tiempo con su función.","r":"Controlar el relato es elegir el tiempo por su función, no por la palabra temporal.","o":["Los tres tiempos cumplen funciones distintas.","Las funciones no encajan.","Las funciones no encajan."],"rt":[null,null,null]},"19":{"n":"El profeta advirtió que nadie debía tocar el ganado del dios Sol. Los espectros se agolpaban junto al fuego ritual mientras la tripulación llamaba a Odiseo.","p":"¿Qué te llevas del Inframundo?","r":null,"o":["Te quedas para interrogar a un último guerrero y ves cómo los actos previos causan el desastre posterior.","La copa está maldita. Las sombras persiguen el barco y te empujan a las aguas de las Sirenas.","La tripulación confía en tu prudencia. Dejas atrás a los espectros y te preparas para las Sirenas."],"rt":["EL RELATO DEL ESPECTRO","LAS SIRENAS — RUTA MALDITA","LAS SIRENAS — RETIRADA SEGURA"]},"20":{"n":"Un guerrero dijo: ‘Yo vigilaba la puerta oeste cuando atacaron los troyanos. Habían descubierto nuestra posición antes del alba.’","p":"¿Qué acción ocurrió primero?","r":"El PAST PERFECT llega detrás de una acción de fondo en curso y de un hecho posterior.","o":["Estaba en curso cuando llegó el ataque.","Esto interrumpió la vigilancia.","El PAST PERFECT marca el hecho más antiguo."],"rt":[null,null,null]},"21":{"n":"Circe había descrito a las Sirenas antes de que la tripulación llegara a sus aguas. Los marineros se taparon los oídos con cera y ataron a Odiseo al mástil.","p":"¿Qué plan ocurrió antes de llegar a las Sirenas?","r":"El PAST PERFECT aporta información clave previa a las acciones de la escena.","o":["Su aviso fue antes y causó los preparativos.","Pertenece a la secuencia principal posterior.","Pertenece a la secuencia principal posterior."],"rt":[null,null,null]},"22":{"n":"Las Sirenas cantaban cuando el viento cesó de golpe. Odiseo gritó pidiendo libertad, pero la tripulación apretó las cuerdas y remó más fuerte.","p":"¿Qué frase mantiene el contraste correcto?","r":"El PAST CONTINUOUS sostiene la escena; el PAST SIMPLE la rompe con un hecho súbito.","o":["Invierte la acción en curso y la repentina.","No es una cadena de dos hechos anteriores.","El canto seguía; el cambio del viento fue súbito."],"rt":[null,null,null]},"23":{"n":"Caribdis se tragaba el mar. Al otro lado del canal, Escila, de seis cabezas, esperaba sobre una estrecha repisa de roca.","p":"Elige la ruta. Toda respuesta tiene un precio.","r":null,"o":["El casco resiste, pero Escila atrapa a dos marineros. Escapas del estrecho sin entrar en el remolino.","La corriente atrapa la popa. Debes sobrevivir a la ruta del remolino antes de llegar a la isla del Sol.","La corriente cede, pero el hambre y las rocas te cuestan caro. Aún debes esquivar a Caribdis."],"rt":["ISLA DEL SOL — CARIBDIS EVITADA","CORRIENTE DE CARIBDIS","CARIBDIS EN BAJAMAR"]},"24":{"n":"El timonel dirigía el barco hacia el acantilado cuando la corriente atrapó la popa. La tripulación había asegurado la carga, y casi toda la comida se salvó.","p":"Identifica las tres funciones en orden.","r":"was steering = fondo; seized = evento; had secured = causa anterior.","o":["La secuencia no coincide con las formas.","was steering → seized → had secured.","La primera oración es una acción de fondo en curso."],"rt":[null,null,null]},"25":{"n":"Durante un mes, las tormentas impidieron zarpar al barco. La comida se agotaba. Odiseo había repetido muchas veces el aviso de Tiresias.","p":"¿Por qué es adecuado ‘was running out’?","r":"El PAST CONTINUOUS describe una situación pasada temporal o en desarrollo.","o":["La escasez empeoraba durante todo ese periodo.","Un hecho terminado usaría PAST SIMPLE.","Ese sentido pediría PAST PERFECT."],"rt":[null,null,null]},"26":{"n":"Mientras Odiseo dormía, los marineros hambrientos mataron una vaca sagrada. Habían resistido la tentación durante semanas, pero el hambre los venció.","p":"Elige el relato correcto.","r":"Usa PAST CONTINUOUS para la acción que rodea y PAST SIMPLE para el hecho decisivo.","o":["La muerte de la vaca no fue antes del sueño.","Su sueño estaba en curso cuando ocurrió el acto.","Sugiere que su sueño terminó antes."],"rt":[null,null,null]},"27":{"n":"El barco apenas había dejado la isla cuando el cielo se volvió negro. Un rayo alcanzó el mástil. Una ola arrastró al mar a los marineros que quedaban.","p":"¿Qué verbos hacen avanzar la secuencia?","r":"Una cadena de verbos en PAST SIMPLE acelera la acción.","o":["Marca un momento anterior a la tormenta.","Tres hechos en PAST SIMPLE mueven el desastre.","Aquí no es una forma verbal conjugada."],"rt":[null,null,null]},"28":{"n":"Calipso rescató a Odiseo. Años después, él seguía viviendo en su isla. Cada atardecer miraba el horizonte del oeste.","p":"¿Qué forma presenta su vida como fondo en curso?","r":"Con PAST CONTINUOUS entras en un periodo pasado; con PAST SIMPLE lo ves entero.","o":["Presenta la estancia como un todo terminado.","Sitúa la estancia terminada antes de otro punto pasado.","La estancia seguía en curso en ese momento pasado."],"rt":[null,null,null]},"29":{"n":"El mensajero había ordenado a Calipso liberar a Odiseo antes de que él construyera una balsa. Navegaba al este cuando Poseidón vio la nave.","p":"¿Qué cronología es correcta?","r":"PAST PERFECT mira atrás; PAST CONTINUOUS sostiene la cámara; PAST SIMPLE lleva los hechos posteriores.","o":["Primero la orden, luego la balsa, y Poseidón interrumpió el viaje.","Contradice el sentido y la secuencia de tiempos.","La orden y la construcción fueron antes del viaje."],"rt":[null,null,null]},"30":{"n":"Nausícaa lavaba ropa cuando un extraño cubierto de sal salió de los juncos. Había perdido su balsa durante la noche.","p":"¿Qué le había pasado?","r":"PAST PERFECT revela el pasado tras aparecer un personaje nuevo.","o":["Muestra la pérdida en curso.","No lo conecta claramente como pasado anterior.","La pérdida anterior explica su estado en la escena."],"rt":[null,null,null]},"31":{"n":"En el banquete del rey, un bardo cantó sobre Troya. Odiseo empezó a llorar. Sus lágrimas hicieron sospechar al rey que el extraño era un héroe de la guerra. Hasta ese momento, nadie lo había reconocido.","p":"¿Qué acción en PAST SIMPLE provoca la revelación?","r":"PAST SIMPLE marca el hecho principal y el giro visible: Odiseo empezó a llorar. El no reconocerlo antes solo describe lo que era cierto hasta ese momento.","o":["Abre la escena, pero la canción sola no revela quién es el extraño.","Su llanto es la pista visible que hace sospechar al rey.","Mira atrás a lo que se sabía antes; no crea la revelación."],"rt":[null,null,null]},"32":{"n":"Por fin, Odiseo llegó a Ítaca al amparo de la niebla. Los pretendientes habían ocupado su palacio y derrochaban su riqueza.","p":"¿Qué haces primero? Esta decisión crea un final distinto.","r":null,"o":["Los pretendientes te reconocen enseguida y te rodean antes de que tus aliados se reúnan.","Atenea te da un rostro viejo, una larga barba blanca y un manto de mendigo con capucha. La paciencia abre la ruta oculta por la cabaña de Eumeo.","Los pretendientes no se van. Pasan las estaciones, tus provisiones desaparecen e Ítaca olvida a su rey oculto."],"rt":["FINAL: EL ASALTO ABIERTO","LA RUTA DEL REY MENDIGO","FINAL: EL REY QUE ESPERÓ"]},"33":{"n":"Eumeo acogió a un viejo mendigo con capucha, sin imaginar que el extraño de barba blanca era Odiseo. Mientras compartían la comida, le contó que Penélope había resistido a los pretendientes durante años.","p":"¿Qué oración da la escena en curso?","r":"Un párrafo puede ir de hecho → escena en curso → pasado anterior.","o":["Es el hecho inicial ya terminado.","Esta actividad en curso forma el fondo.","Resume el pasado anterior."],"rt":[null,null,null]},"34":{"n":"Penélope sacó el arco de Odiseo. Los pretendientes ya lo habían intentado y habían fallado cuando un mendigo encapuchado de barba blanca pidió su turno. Reían mientras el rey disfrazado lo levantaba.","p":"Elige el mapa completo de tiempos.","r":"Elige el tiempo para mostrar secuencia, fondo o causa anterior, no solo porque el relato sea pasado.","o":["Cada forma tiene una función narrativa clara.","Las funciones están invertidas.","Los tiempos narrativos organizan relaciones entre hechos pasados."],"rt":[null,null,null]},"35":{"n":"El silencio llenó la sala. Odiseo se echó atrás la capucha de mendigo, tensó el arco que nadie más había podido doblar y se reveló. Mientras los pretendientes miraban, lanzó una flecha por cada hacha.","p":"Antes de revelarse, nadie lo reconoció porque Atenea ___ su identidad.","r":"PAST PERFECT explica la acción anterior detrás de un resultado pasado.","o":["Es correcto, pero no destaca la preparación anterior.","Se centra en el ocultamiento en curso.","El disfraz ya existía antes de que no lo reconocieran."],"rt":[null,null,null]}},"de":{"0":{"n":"Während die letzten Türme brannten, sammelte Odysseus zwölf Seeleute neben einem schwarzen Schiff. Er befahl sie an Bord, und das Schiff verließ Troja. Ithaka wartete hinter einem zornigen Meer.","p":"Welche Verben tragen die abgeschlossene Handlung?","r":"Verwende PAST SIMPLE für abgeschlossene Ereignisse, die die Handlung vorantreiben. Der was/were + -ing-Teil liefert die Szene drumherum.","o":["Diese abgeschlossenen PAST-SIMPLE-Ereignisse bilden die Hauptkette.","Das ist der laufende Hintergrund, nicht das Hauptereignis.","Das würde die Handlungen von einem späteren Punkt aus weiter zurückschieben; hier zählt die Hauptkette."],"rt":[null,null,null]},"1":{"n":"Die Mannschaft lud Bronze, Wein und Getreide. Über ihnen zogen Sturmwolken auf. Die Taue knarrten, und ein kalter Wind kam von Westen auf.","p":"Warum steht hier PAST CONTINUOUS?","r":"Verwende PAST CONTINUOUS für Hintergrund, laufende und unterbrochene Handlungen: was/were + verb-ing.","o":["Diese laufenden Details bauen die Szene um die Haupthandlung.","Das macht normalerweise das PAST SIMPLE.","Das ist die Kernaufgabe des PAST PERFECT."],"rt":[null,null,null]},"2":{"n":"Odysseus erinnerte sich an das hölzerne Pferd. Die Griechen hatten sich darin versteckt, bevor die Trojaner es durch die Tore zogen.","p":"Was zeigt „had hidden“?","r":"Verwende PAST PERFECT, um weiter in die Vergangenheit zurückzublicken: had + Partizip.","o":["Das Verstecken kam zuerst, das Ziehen später.","Für gleichzeitigen Hintergrund nimmt man PAST CONTINUOUS.","Dafür stehen normalerweise PAST SIMPLE oder used to."],"rt":[null,null,null]},"3":{"n":"Im Morgengrauen erreichte die Flotte Ismaros. Die Stadt wirkte schutzlos, doch aus den Wachtürmen in den Hügeln kräuselte sich Rauch.","p":"Kapitän, was befiehlst du?","r":null,"o":["Du fährst ab, bevor die Reiter kommen. Der Gegenangriff bleibt aus, und die Flotte erreicht die Lotos-Küste mit voller Besatzung.","Verstärkung trifft ein, während deine Leute noch beladen. Du musst dich zum Strand zurückkämpfen.","Du meidest Ismaros und den Lotos, doch die hungrige Mannschaft segelt direkt in den Nebel des Zyklopen."],"rt":["LOTOS-KÜSTE — KAMPF VERMIEDEN","GEGENANGRIFF IN ISMAROS","ZYKLOPEN-INSEL — LOTOS-KÜSTE UMGANGEN"]},"4":{"n":"Deine Leute trugen gerade Krüge zum Schiff, als feindliche Reiter auf dem Kamm erschienen. Schilde blitzten. Hörner erklangen.","p":"Wähle den Satz, der Hintergrund und Unterbrechung am besten verbindet.","r":"Laufende Handlung: was/were carrying. Unterbrechung: appeared.","o":["Hintergrund und Unterbrechung sind vertauscht.","PAST CONTINUOUS setzt den Hintergrund, PAST SIMPLE unterbricht ihn.","PAST PERFECT ist für beide Ereignisse unnötig."],"rt":[null,null,null]},"5":{"n":"Drei Kundschafter kehrten seltsam lächelnd zurück. Sie hatten den Lotos gegessen und Ithaka vergessen.","p":"Sie vergaßen Ithaka, weil sie zuerst den Lotos ___.","r":"PAST PERFECT erklärt ein Ergebnis oft durch eine frühere Ursache.","o":["Das markiert die frühere Ursache hier nicht klar.","Das beschreibt eine laufende Handlung.","Die Ursache lag vor dem Vergessen."],"rt":[null,null,null]},"6":{"n":"Während die Lotos-Esser sangen, band Odysseus die verzauberten Kundschafter unter die Bänke. Die Mannschaft schob das Schiff in die Brandung.","p":"Welche abgeschlossene Handlung kam zuerst?","r":"PAST CONTINUOUS malt die Szene, PAST SIMPLE liefert die Reihenfolge.","o":["Ihr Gesang lief schon.","Das ist die erste abgeschlossene Handlung der Kette.","Das geschah nach dem Festbinden der Kundschafter."],"rt":[null,null,null]},"7":{"n":"Nach Tagen im Nebel tauchte eine bergige Insel auf. Ziegen liefen über einer Höhle. Kein Feuer brannte, doch riesige Spuren zogen durch den Schlamm.","p":"Wähle dein Vorgehen.","r":null,"o":["Ein kleiner Trupp geht hinein, die anderen sichern das Schiff. Polyphem kommt zurück, bevor ihr raus könnt, und rollt den Eingang zu.","Die volle Höhle bietet kein Versteck. Ihr verliert Vorräte, doch der Wein kann noch zur Waffe werden, wenn der Riese den Eingang verschließt.","Deine Späher lernen den Rhythmus des Riesen und schärfen einen Pfahl. Ihr geht in der Dämmerung hinein — doch Polyphem kommt früh und rollt einen Felsen vor den Eingang."],"rt":["POLYPHEMS HÖHLE — MITTLERER WEG","POLYPHEMS HÖHLE — HARTER WEG","POLYPHEMS HÖHLE — VORBEREITET"]},"8":{"n":"Die Männer aßen gerade Käse, als Polyphem zurückkam. Er stemmte beide Hände gegen einen torgroßen Felsen, rollte ihn vor den Eingang und sperrte den letzten Streifen Tageslicht aus.","p":"Welches Verb steht im PAST CONTINUOUS?","r":"Verwende PAST CONTINUOUS für die längere Handlung um ein kurzes PAST-SIMPLE-Ereignis.","o":["Das Essen lief schon, als der Zyklop handelte.","Ein abgeschlossenes Ereignis, das das Essen unterbricht.","Die abgeschlossene Haupthandlung, die die Höhle verschließt."],"rt":[null,null,null]},"9":{"n":"Odysseus bot dem Riesen dunklen Wein an. Er hatte einen Olivenpfahl geschärft, bevor Polyphem zu Ende trank. Dann verlangte der Zyklop seinen Namen.","p":"Wähle die klarste Zeitenfolge.","r":"PAST PERFECT macht die frühere Vorbereitung unmissverständlich.","o":["Das dreht die klarste Perspektive um.","Die Vorbereitung war vor dem späteren Moment fertig.","Das zeigt keine abgeschlossene Vorbereitung."],"rt":[null,null,null]},"10":{"n":"Polyphem war nach dem Wein zusammengebrochen. Während er schlief, erhitzten Odysseus und vier Seeleute den geschärften Pfahl im Feuer. Auf sein Zeichen hoben sie ihn, trieben ihn in das einzige Auge des Zyklopen und blendeten ihn. Er brüllte und riss am Felsen, doch der bewegte sich nicht.","p":"Welche Verben tragen den Angriff voran?","r":"Verwende PAST SIMPLE für die abgeschlossenen Hauptereignisse. PAST CONTINUOUS liefert den Hintergrund, PAST PERFECT greift auf eine frühere Lage zurück.","o":["PAST PERFECT zeigt die frühere Lage, die den Angriff möglich macht.","Diese PAST-CONTINUOUS-Formen zeigen schon laufende Handlungen.","Diese abgeschlossenen PAST-SIMPLE-Handlungen tragen Angriff und Folge."],"rt":[null,null,null]},"11":{"n":"Als sich die Höhle öffnete, hatten sich die Männer unter den Schafen des Riesen festgebunden. Polyphem tastete jeden Rücken ab, während die Herde hinauszog.","p":"Was war schon fertig, als sich die Höhle öffnete?","r":"had tied = früher; opened/touched = Ereignisse; was leaving = Hintergrund.","o":["PAST PERFECT setzt das Festbinden vor das Öffnen.","Das geschah nach dem Öffnen der Höhle.","Das lief während der Kontrolle."],"rt":[null,null,null]},"12":{"n":"Aiolos empfing die erschöpfte Mannschaft. Vor der Abfahrt sperrte er jeden feindlichen Wind in einen Ledersack und warnte Odysseus davor, ihn zu öffnen.","p":"Wer soll den Sack bewachen?","r":null,"o":["Er bewacht ihn neun Tage ohne Schlaf und bricht in Sichtweite Ithakas zusammen. Misstrauische Seeleute greifen nach dem Knoten.","Die Wachen halten den Sack verschlossen. Der Westwind trägt die Flotte sicher heim und öffnet einen frühen Ithaka-Weg.","Misstrauen breitet sich sofort aus. Die Mannschaft hält den Sack für Schätze und öffnet ihn vor Morgengrauen."],"rt":["SACK GEÖFFNET","ITHAKA — OHNE LANGEN UMWEG","SACK GEÖFFNET"]},"13":{"n":"Ithaka leuchtete am Horizont, als Odysseus einschlief. Die Seeleute öffneten den Sack, weil sie entschieden hatten, darin sei gestohlenes Gold.","p":"Warum steht hier ‚had decided‘?","r":"PAST PERFECT zeigt frühere Annahmen, Pläne oder Beschlüsse als Auslöser.","o":["Früherer Gedanke, spätere Handlung.","Dafür bräuchte man meist PAST CONTINUOUS.","Der Satz zeigt den Beschluss als früher."],"rt":[null,null,null]},"14":{"n":"Die Flotte fuhr gerade in einen engen Hafen ein, als die Laistrygonen angriffen. Riesen hoben Felsblöcke und zerschmetterten Schiff um Schiff.","p":"Wähle den besten Erzählsatz.","r":"was entering + when + attacked: das klassische Muster aus Hintergrund und Unterbrechung.","o":["Das schwächt die plötzliche Unterbrechung.","Zwei PAST-PERFECT-Formen verdecken die Handlung.","Die laufende Einfahrt wird vom Angriff unterbrochen."],"rt":[null,null,null]},"15":{"n":"Nur ein Schiff blieb. Musik trieb zwischen den Bäumen. Wölfe und Löwen bewachten reglos eine helle Tür.","p":"Wähle deinen Spähplan.","r":null,"o":["Der Spähtrupp betritt die Halle und verschwindet. Nur Eurylochos kehrt zurück und berichtet von der Verwandlung.","Hermes trifft dich zuerst und schützt dich. Du stellst Kirke, bevor sie die Mannschaft verwandeln kann.","Du erkennst: Die zahmen Tiere waren einst Menschen. Rechtzeitig gewarnt, zwingst du Kirke zum Pakt."],"rt":["KIRKES VERZAUBERTES FEST","PAKT MIT KIRKE","PAKT MIT KIRKE"]},"16":{"n":"Als Eurylochos zurückkam, zitterte er. Kirke hatte die anderen empfangen, einen Trank ins Essen gemischt und sie in Schweine verwandelt.","p":"Warum stehen hier drei PAST-PERFECT-Verben?","r":"PAST PERFECT fasst eine Kette von Ereignissen vor dem jetzigen Punkt der Geschichte zusammen.","o":["Sie erklären, was vorher schon geschehen war.","Dafür bräuchte man PAST CONTINUOUS.","Die Verwandlung geschah davor."],"rt":[null,null,null]},"17":{"n":"Nachdem Odysseus Kirkes Zauber gebrochen hatte, empfing sie die Mannschaft. Monatelang feierten und jagten sie und vergaßen das Meer. Eines Abends fragte ein Seemann, worauf sie noch warteten.","p":"Welcher Satz gibt in dem Moment den Hintergrund?","r":"Nutze PAST CONTINUOUS, wenn eine Handlung in einem Moment der Vergangenheit lief.","o":["Fasst die abgeschlossene Zeit zusammen.","Das heißt, das Warten war vorbei.","Das Warten lief noch, als er sprach."],"rt":[null,null,null]},"18":{"n":"Bevor Odysseus die Unterwelt betrat, hatte Kirke das Ritual erklärt. Nun bewegte sich schwarzes Wasser unter dem Schiff, und die Sonne verschwand hinter ihnen.","p":"Ordne Zeitform und Aufgabe zu.","r":"Erzählkontrolle heißt: Zeitform nach Funktion wählen, nicht nach dem Zeitwort.","o":["Alle drei Zeitformen haben andere Aufgaben.","Die Funktionen passen nicht.","Die Funktionen passen nicht."],"rt":[null,null,null]},"19":{"n":"Der Seher warnte: Die Rinder des Sonnengottes bleiben unberührt. Geister drängten sich ums Opferfeuer, als die Mannschaft Odysseus zurückrief.","p":"Was nimmst du aus der Unterwelt mit?","r":null,"o":["Du bleibst lange genug, um einen letzten Krieger zu befragen, und lernst, wie frühere Taten spätere Not formen.","Der Becher ist verflucht. Schatten jagen das Schiff direkt in die Gewässer der Sirenen.","Die Mannschaft vertraut deiner Zurückhaltung. Ihr lasst die Geister zurück und rüstet für die Sirenen."],"rt":["BERICHT DES GEISTES","DIE SIRENEN — VERFLUCHTER WEG","DIE SIRENEN — SICHERER RÜCKZUG"]},"20":{"n":"Ein Krieger sagte: ‚Ich bewachte gerade das Westtor, als die Troer angriffen. Sie hatten unsere Stellung vor dem Morgengrauen entdeckt.‘","p":"Welche Handlung geschah zuerst?","r":"PAST PERFECT greift hinter den laufenden Hintergrund und das spätere Ereignis zurück.","o":["Das lief noch, als der Angriff begann.","Das unterbrach die Wache.","PAST PERFECT markiert das früheste Ereignis."],"rt":[null,null,null]},"21":{"n":"Kirke hatte die Sirenen beschrieben, bevor die Mannschaft ihre Gewässer erreichte. Die Seeleute füllten ihre Ohren mit Wachs und banden Odysseus an den Mast.","p":"Was geschah, bevor das Schiff die Sirenen erreichte?","r":"PAST PERFECT liefert wichtige Infos aus der Zeit vor den Hauptaktionen.","o":["Ihre Warnung kam früher und löste die Vorbereitungen aus.","Das gehört zur späteren Hauptkette.","Das gehört zur späteren Hauptkette."],"rt":[null,null,null]},"22":{"n":"Die Sirenen sangen, als der Wind plötzlich starb. Odysseus schrie nach Freiheit, doch die Mannschaft zog die Seile fester und ruderte härter.","p":"Welcher Satz hält den Kontrast richtig?","r":"PAST CONTINUOUS trägt die Szene; PAST SIMPLE bricht sie mit einem plötzlichen Ereignis.","o":["Das dreht laufende und plötzliche Handlung um.","Hier gibt es keine Kette früherer Ereignisse.","Der Gesang lief; der Windwechsel kam plötzlich."],"rt":[null,null,null]},"23":{"n":"Charybdis verschlang das Meer. Gegenüber wartete die sechsköpfige Skylla über einem schmalen Felsband.","p":"Wähle den Kurs. Jede Antwort hat ihren Preis.","r":null,"o":["Der Rumpf hält, doch Skylla packt zwei Seeleute. Du entkommst der Enge ohne den Strudel.","Die Strömung fasst das Heck. Du musst den Strudelweg überstehen, bevor die Sonneninsel kommt.","Die Strömung lässt nach, doch Hunger und Steinschlag kosten dich. Charybdis musst du trotzdem passieren."],"rt":["SONNENINSEL — CHARYBDIS UMGANGEN","CHARYBDIS-STRÖMUNG","CHARYBDIS BEI EBBE"]},"24":{"n":"Der Steuermann hielt auf die Klippe zu, als die Strömung das Heck packte. Die Crew hatte die Fracht gesichert, so blieb fast alles Essen heil.","p":"Nenne die drei Funktionen der Reihe nach.","r":"was steering = Hintergrund; seized = Ereignis; had secured = frühere Ursache.","o":["Die Reihenfolge passt nicht zu den Formen.","was steering → seized → had secured.","Der erste Satzteil ist laufende Hintergrundhandlung."],"rt":[null,null,null]},"25":{"n":"Einen Monat lang hielten Stürme das Schiff fest. Die Vorräte gingen zur Neige. Odysseus hatte Tiresias’ Warnung viele Male wiederholt.","p":"Warum passt ‚was running out‘ hier?","r":"PAST CONTINUOUS beschreibt eine zeitweilige oder sich entwickelnde Lage.","o":["Der Mangel wurde im ganzen Zeitraum schlimmer.","Ein fertiges Ereignis stünde im PAST SIMPLE.","Dafür bräuchte man das PAST PERFECT."],"rt":[null,null,null]},"26":{"n":"Während Odysseus schlief, töteten die hungernden Seeleute eine heilige Kuh. Wochenlang hatten sie widerstanden, doch der Hunger besiegte sie.","p":"Wähle die richtige Darstellung.","r":"Nimm PAST CONTINUOUS für die Rahmenhandlung, PAST SIMPLE für das entscheidende Ereignis.","o":["Das Töten kam nicht vor dem Schlafen.","Sein Schlaf lief noch, als die Tat geschah.","Das heißt, sein Schlaf endete zuerst."],"rt":[null,null,null]},"27":{"n":"Kaum hatte das Schiff die Insel verlassen, wurde der Himmel schwarz. Ein Blitz traf den Mast. Eine Welle riss jeden übrigen Seemann über Bord.","p":"Welche Verben treiben die Handlung voran?","r":"Eine Kette von PAST-SIMPLE-Verben beschleunigt die Handlung.","o":["Das markiert einen Punkt vor dem Sturm.","Drei PAST-SIMPLE-Ereignisse treiben das Unglück.","Das ist hier keine finite Zeitform."],"rt":[null,null,null]},"28":{"n":"Kalypso rettete Odysseus. Jahre später lebte er noch immer auf ihrer Insel. Jeden Abend blickte er zum westlichen Horizont.","p":"Welche Form zeigt sein Leben als laufenden Hintergrund?","r":"Mit PAST CONTINUOUS zoomst du in einen Zeitraum; mit PAST SIMPLE siehst du ihn als Ganzes.","o":["Das zeigt den Aufenthalt als fertiges Ganzes.","Das setzt den Aufenthalt vor einen anderen Punkt.","Der Aufenthalt lief im gewählten Moment noch."],"rt":[null,null,null]},"29":{"n":"Der Bote hatte Kalypso befohlen, Odysseus freizugeben, bevor er ein Floß baute. Er segelte nach Osten, als Poseidon das Boot bemerkte.","p":"Welche Zeitleiste stimmt?","r":"PAST PERFECT greift zurück; PAST CONTINUOUS hält die Kamera; PAST SIMPLE trägt die Ereignisse.","o":["Erst kam der Befehl, dann das Floß, dann störte Poseidon die Fahrt.","Das passt weder zum Sinn noch zur Zeitenfolge.","Befehl und Bau mussten vor der Fahrt geschehen."],"rt":[null,null,null]},"30":{"n":"Nausikaa wusch gerade Wäsche, als ein salzverkrusteter Fremder aus dem Schilf trat. Er hatte in der Nacht sein Floß verloren.","p":"Was war ihm zugestoßen?","r":"PAST PERFECT liefert Vorgeschichte, wenn jemand Neues auftritt.","o":["Das zeigt den Verlust im Verlauf.","Das zeigt nicht klar die frühere Vorgeschichte.","Der frühere Verlust erklärt seinen Zustand in der Szene."],"rt":[null,null,null]},"31":{"n":"Beim Fest des Königs sang ein Barde von Troja. Odysseus begann zu weinen. Seine Tränen ließen den König ahnen, dass der Fremde ein Held des Krieges war. Bis dahin hatte ihn niemand erkannt.","p":"Welche PAST-SIMPLE-Handlung löst die Enthüllung aus?","r":"PAST SIMPLE liefert das Hauptereignis und den sichtbaren Wendepunkt: Odysseus begann zu weinen. Das frühere Nichterkennen sagt nur, was vorher galt.","o":["Das eröffnet die Szene, doch das Lied allein verrät den Fremden nicht.","Sein Weinen ist der sichtbare Hinweis für den König.","Das blickt auf das frühere Wissen zurück, löst aber nichts aus."],"rt":[null,null,null]},"32":{"n":"Endlich erreichte Odysseus Ithaka im Schutz des Nebels. Freier hatten seinen Palast besetzt und verprassten sein Gut.","p":"Was tust du zuerst? Diese Wahl führt zu einem anderen Ende.","r":null,"o":["Die Freier erkennen dich sofort und umzingeln dich, bevor Verbündete kommen.","Athene gibt dir ein altes Gesicht, langen weißen Bart und Bettlerkutte. Geduld öffnet den Weg über Eumaios’ Hütte.","Die Freier gehen nicht. Jahreszeiten vergehen, deine Vorräte schwinden, Ithaka vergisst seinen König."],"rt":["ENDE: DER OFFENE ANGRIFF","DIE BETTLERKÖNIG-ROUTE","ENDE: DER KÖNIG, DER WARTETE"]},"33":{"n":"Eumaios empfing einen alten Bettler in Kutte, ohne zu ahnen, dass der weißbärtige Fremde Odysseus war. Während sie ein Mahl teilten, erzählte er, dass Penelope den Freiern seit Jahren widerstanden hatte.","p":"Welcher Satzteil zeigt die laufende Szene?","r":"Ein Absatz kann gehen: Ereignis → laufende Szene → Vorgeschichte.","o":["Das ist das fertige Auftaktereignis.","Diese laufende Handlung bildet den Hintergrund.","Das fasst die Vorgeschichte zusammen."],"rt":[null,null,null]},"34":{"n":"Penelope holte Odysseus’ Bogen. Die Freier hatten es schon vergeblich versucht, als ein weißbärtiger Bettler in Kutte um einen Versuch bat. Sie lachten, als der verkleidete König ihn hob.","p":"Wähle die volle Zeitenkarte.","r":"Wähle eine Zeitform für Abfolge, Hintergrund oder frühere Ursache – nicht nur, weil es Vergangenheit ist.","o":["Jede Form hat eine klare Erzählfunktion.","Die Funktionen sind vertauscht.","Erzählzeiten ordnen Beziehungen zwischen Ereignissen."],"rt":[null,null,null]},"35":{"n":"Stille füllte die Halle. Odysseus warf die Bettlerkapuze zurück, spannte den Bogen, den niemand sonst hatte biegen können, und gab sich zu erkennen. Während die Freier starrten, schoss er einen Pfeil durch alle Axtösen.","p":"Vor der Enthüllung erkannte ihn niemand, weil Athene ___ seine Identität.","r":"PAST PERFECT erklärt die frühere Handlung hinter einem späteren Ergebnis.","o":["Korrekt, betont aber die frühere Vorbereitung nicht.","Das betont das Verbergen im Verlauf.","Die Tarnung stand schon, bevor sie ihn nicht erkannten."],"rt":[null,null,null]}}};

  // standalone/game.ts
  var INITIAL = { contentVersion: 3, scene: 0, hearts: 5, crew: 12, supplies: 8, score: 0, answered: false, selected: null, history: [], finished: false, endingKey: null, homeByWind: false };
  var ui = { off: { continue: "SAIL ON", restart: "NEW VOYAGE" }, es: { continue: "SEGUIR NAVEGANDO", restart: "NUEVO VIAJE" }, de: { continue: "WEITERSEGELN", restart: "NEUE REISE" } };
  var app = document.querySelector("#app");
  var clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  var lang = localStorage.getItem("odyssey-tense-lang") || "off";
  if (!["off", "es", "de"].includes(lang)) lang = "off";

  function load() {
    try {
      const raw = localStorage.getItem("odyssey-tense-rpg-v2");
      if (!raw) return { ...INITIAL };
      const p = JSON.parse(raw);
      const storedScene = Number(p.scene) || 0;
      const migratedScene = p.contentVersion === 3 ? storedScene : storedScene >= 10 ? storedScene + 1 : storedScene;
      return { ...INITIAL, ...p, contentVersion: 3, scene: clamp(migratedScene, 0, scenes.length - 1), selected: Number.isInteger(p.selected) ? p.selected : null, answered: Boolean(p.answered), finished: Boolean(p.finished) };
    } catch {
      localStorage.removeItem("odyssey-tense-rpg-v2");
      return { ...INITIAL };
    }
  }
  function save() {
    localStorage.setItem("odyssey-tense-rpg-v2", JSON.stringify({ ...state, started: true }));

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  }
  function ending() {
    if (state.endingKey === "open-assault") return { success: false, rank: "THE RECKLESS KING", title: "THE OPEN ASSAULT", text: "Odysseus entered openly and the suitors recognised him at once. Without allies, disguise or surprise, he was surrounded before he could reach the bow. Ithaca was home\u2014but not yet his." };
    if (state.endingKey === "hill-exile") return { success: false, rank: "THE KING WHO WAITED", title: "A THRONE LOST TO TIME", text: "Odysseus hid in the hills and waited for the suitors to leave. They never did. Supplies vanished, loyal servants lost hope, and the hidden king became another rumour in Ithaca\u2019s mountains." };
    if (state.homeByWind) return { success: true, rank: "KEEPER OF THE SEALED WIND", title: "THE SHORT WAY HOME", text: "The sealed wind carried you safely to Ithaca. At golden dawn, Odysseus crossed the palace threshold, embraced Penelope and Telemachus, and raised the standard of his house once more." };
    if (state.score >= 2100 && state.hearts >= 3 && state.crew >= 6) return { success: true, rank: "MASTER OF THREE TIMES", title: "THE KING RETURNS", text: "Ithaca welcomed its king in golden light. Your loyal crew stood beside you, Penelope and Telemachus met you at the palace doors, and the people raised olive branches as your long voyage became legend." };
    if (state.score >= 1450 && state.hearts > 0) return { success: true, rank: "SEASONED STORYTELLER", title: "HOME THROUGH THE STORM", text: "Battered but victorious, you crossed the palace threshold at dawn. The voyage had cost you dearly, but Ithaca knew its king again\u2014and your command of narrative time had brought the story home." };
    return { success: false, rank: "LOST CHRONICLER", title: "THE SEA KEEPS ITS SECRETS", text: "Ithaca appeared through the mist, but your story had lost too many links. Study the three time runes, then begin again with better choices." };
  }

  var INLINE_SCENES = ["long-way-home-rpg/01_the_beach_below_troy.webp","long-way-home-rpg/02_the_deck_at_midnight.webp","long-way-home-rpg/03_beyond_the_city_walls.webp","long-way-home-rpg/04_the_coast_of_ismarus.webp","long-way-home-rpg/05_ismarus_eastern_gate.webp","long-way-home-rpg/06_the_lotus_eaters.webp","long-way-home-rpg/07_the_lotus_shore.webp","long-way-home-rpg/08_the_cyclops_island.webp","long-way-home-rpg/09_polyphemus_cave.webp","long-way-home-rpg/10_the_back_of_the_cave.webp","long-way-home-rpg/11_the_fire_pit.webp","long-way-home-rpg/12_beneath_the_rams.webp","long-way-home-rpg/13_aeolus_floating_island.webp","long-way-home-rpg/14_one_day_from_ithaca.webp","long-way-home-rpg/15_the_harbour_of_giants.webp","long-way-home-rpg/16_circes_forest.webp","long-way-home-rpg/17_circes_hall.webp","long-way-home-rpg/18_the_feast_of_restoration.webp","long-way-home-rpg/19_the_edge_of_the_underworld.webp","long-way-home-rpg/20_the_field_of_asphodel.webp","long-way-home-rpg/21_the_last_shore_of_night.webp","long-way-home-rpg/22_the_sirens_sea.webp","long-way-home-rpg/23_the_sirens_rocks.webp","long-way-home-rpg/24_the_strait_of_two_monsters.webp","long-way-home-rpg/25_charybdis_current.webp","long-way-home-rpg/26_the_island_of_the_sun.webp","long-way-home-rpg/27_the_sun_gods_pasture.webp","long-way-home-rpg/28_the_open_sea.webp","long-way-home-rpg/29_calypsos_island.webp","long-way-home-rpg/30_poseidons_last_storm.webp","long-way-home-rpg/31_phaeacia.webp","long-way-home-rpg/32_the_phaeacian_hall.webp","long-way-home-rpg/38_ending_lost.webp","long-way-home-rpg/34_the_swineherds_hut.webp","long-way-home-rpg/35_the_great_hall.webp","long-way-home-rpg/36_the_axeheads.webp"];
  var visualPlan = Array.from({ length: 36 }, (_, index) => ({
    key: `scene-${String(index + 1).padStart(2, "0")}`,
    image: INLINE_SCENES[index],
    position: copySidePlan[index] ?? "left",
    vert: copyVertPlan[index] ?? "center",
    x: "center",
    y: "center",
    zoom: 1.002,
    filter: "saturate(.88) contrast(1.035) brightness(.97)"
  }));
  function visualFor(index) {
    return visualPlan[index] || visualPlan[0];
  }
  function trFor(index) {
    if (lang === "off") return null;
    const table = SCENE_TR[lang];
    return table ? table[index] || null : null;
  }
  function gloss(text) {
    return text ? `<span class="gloss"><b>${lang.toUpperCase()}</b>${esc(text)}</span>` : "";
  }
  function render() {
    try {
      if (state.finished) {
        renderEnding();
        return;
      }
      const scene = scenes[state.scene] || scenes[0];
      const progress = Math.round((state.scene + 1) / scenes.length * 100);
      const visual = visualFor(state.scene);
      const tx = trFor(state.scene);
      const position = visual.position;
      const theme = themes[state.scene % themes.length];
      const options = !state.answered ? scene.options.map((o, i) => `<button type="button" data-action="choose" data-index="${i}"><b>${String.fromCharCode(65 + i)}</b><span>${esc(o.text)}</span></button>`).join("") : "";
      let feedback = "";
      if (state.answered && state.selected !== null) {
        const option = scene.options[state.selected];
        const ok = Boolean(option.correct);
        const title = scene.kind === "choice" ? "THE VOYAGE SPLITS" : ok ? "+ GLORY \xB7 CORRECT" : "CHECK THE TIMELINE \xB7 TRY THE RULE";
        const trRule = tx && tx.r ? tx.r : lang !== "off" ? support[lang][scene.focus] : null;
        const translation = trRule ? `<p class="translation"><b>${lang.toUpperCase()}</b>${esc(trRule)}</p>` : "";
        const trRoute = tx && tx.rt ? tx.rt[state.selected] : null;
        const route = scene.kind === "choice" && option.route ? `<p class="route"><b>NEXT ROUTE:</b> ${esc(option.route)}${trRoute ? gloss(trRoute) : ""}</p>` : "";
        feedback = `<div class="feedback ${scene.kind === "choice" ? "choice-feedback" : ok ? "right" : "wrong"}"><strong>${title}</strong><p>${esc(option.note)}${tx && tx.o ? gloss(tx.o[state.selected]) : ""}</p>${route}${scene.rule ? `<p class="rule"><b>RULE:</b> ${esc(scene.rule)}</p>` : ""}${translation}<button type="button" class="primary small" data-action="next">${ui[lang].continue} <span>\u2192</span></button></div>`;
      }
      document.body.className = "";
      document.title = `${state.scene + 1}/${scenes.length} \xB7 ${scene.title} \u2014 The Long Way Home`;
      history.replaceState(null, "", `#slide-${String(state.scene + 1).padStart(2, "0")}`);
      app.innerHTML = `
      <main id="slide-${String(state.scene + 1).padStart(2, "0")}" class="game play slide pos-${position} v-${visual.vert} ${lang === "off" ? "" : "tr-on"} visual-${visual.key}" style="--base:${theme.base};--light:${theme.light};--dark:${theme.dark};--accent:${theme.accent};--hot:${theme.hot};--cream:${theme.cream};--scene-image:url('${visual.image}');--scene-x:${visual.x};--scene-y:${visual.y || "center"};--scene-zoom:${visual.zoom};--scene-filter:${visual.filter}">
        <div class="scene-art" aria-hidden="true"></div><div class="wash wash-${position}" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
        <header class="hud"><div class="hud-stat"><span>GLORY</span><strong>${state.score}</strong></div><div class="meter"><i style="width:${progress}%"></i><b style="left:${progress}%"></b></div><div class="hud-stat centre-stat"><span>SLIDE</span><strong>${state.scene + 1} / ${scenes.length}</strong></div><div class="hud-stat"><span>CREW \xB7 SUPPLIES</span><strong>${state.crew} \xB7 ${state.supplies}</strong></div><div class="hud-stat chances"><span>CHANCES</span><strong>${"\u2665".repeat(state.hearts)}${"\u2661".repeat(5 - state.hearts)}</strong></div><div class="tools"><button data-action="codex">CODEX</button><span class="langsel" role="group" aria-label="Translation language"><i>TRANSLATE</i>${["off","es","de"].map((L) => `<button data-action="lang" data-lang="${L}" class="${lang === L ? "on" : ""}" aria-pressed="${lang === L}">${L.toUpperCase()}</button>`).join("")}</span><button class="restart" data-action="reset">START OVER</button></div></header>
        <section class="copy" aria-live="polite"><p class="eyebrow">${esc(scene.chapter)} \xB7 ${esc(scene.location)}</p><h1>${esc(scene.title)}</h1><p class="story">${esc(scene.narrative)}${tx ? gloss(tx.n) : ""}</p><div class="clue"><strong>${esc(scene.focus)} \xB7 ${scene.kind === "choice" ? "ROUTE DECISION" : scene.kind === "boss" ? "BOSS TEST \xB7 DOUBLE GLORY" : "NARRATIVE TENSE TEST"}</strong></div><h2>${esc(scene.prompt)}${tx ? gloss(tx.p) : ""}</h2>${!state.answered ? `<div class="answers">${options}</div>` : ""}${feedback}</section>
        <div class="scene-stamp" aria-hidden="true"><span>${String(state.scene + 1).padStart(2, "0")}</span><b>${esc(scene.location)}</b></div>
        ${codex ? codexHtml() : ""}
      </main>`;
    } catch (err) {
      console.error(err);
      app.innerHTML = `<main class="fatal"><h1>THE THREAD BROKE</h1><p>The voyage hit a damaged save. Reset it and return to Troy.</p><button data-action="reset">RESET VOYAGE</button><a href="#">RETURN TO COVER</a></main>`;
    }
  }
  function codexHtml() {
    return `<div class="modal"><section class="codex"><button class="close" data-action="close-codex" aria-label="Close">\xD7</button><p class="eyebrow">THE THREE TIME RUNES</p><h2>NARRATIVE TENSES CODEX</h2><div class="runes"><article><span>01</span><h3>PAST SIMPLE</h3><p>Completed main events. The footsteps of the story.</p><code>the storm began</code></article><article><span>02</span><h3>PAST CONTINUOUS</h3><p>Background or an action already in progress.</p><code>the crew was sleeping</code></article><article><span>03</span><h3>PAST PERFECT</h3><p>An earlier action seen from a later past moment.</p><code>they had opened the bag</code></article></div><div class="timeline"><p><b>THE CREW HAD EATEN</b> before <b>THE STORM BEGAN</b>.</p><p><b>THEY WERE SLEEPING</b> when <b>LIGHTNING STRUCK</b>.</p></div><button class="primary" data-action="close-codex">RETURN TO THE SHIP</button></section></div>`;
  }
  function renderEnding() {
    const e = ending();
    const tone = e.success ? "success" : "failure";
    document.body.className = `ending-${tone}`;
    document.title = `${e.title} \u2014 The Long Way Home`;
    history.replaceState(null, "", "#ending");
    app.innerHTML = `<main class="ending ending-${tone}"><div class="scene-art" aria-hidden="true"></div><div class="wash" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><section class="ending-card"><p class="eyebrow">${e.success ? "GLORIOUS RETURN" : "VOYAGE ENDED"} \xB7 ${e.rank}</p><h1>${e.title}</h1><p>${e.text}</p><div class="final-stats"><div><strong>${state.score}</strong><span>GLORY</span></div><div><strong>${state.hearts}/5</strong><span>HEARTS</span></div><div><strong>${state.crew}</strong><span>CREW</span></div><div><strong>${state.supplies}</strong><span>SUPPLIES</span></div></div><p class="ending-rule">Past simple moved your story. Past continuous built its world. Past perfect revealed what had come before.</p><button class="primary" data-action="reset">${ui[lang].restart}</button></section></main>`;
  }
  function choose(index) {
    if (state.answered) return;
    const scene = scenes[state.scene], o = scene.options[index];
    if (!o) return;
    const base = scene.kind === "choice" ? {} : o.correct ? { score: scene.kind === "boss" ? 160 : 100 } : { hearts: -1 };
    const x = { ...base, ...o.effect || {} };
    state = { ...state, hearts: clamp(state.hearts + (x.hearts || 0), 0, 5), crew: clamp(state.crew + (x.crew || 0), 0, 15), supplies: clamp(state.supplies + (x.supplies || 0), 0, 12), score: Math.max(0, state.score + (x.score || 0)), answered: true, selected: index, history: [...state.history, index], homeByWind: state.homeByWind || state.scene === 12 && index === 1 };
    save();
    render();
  }
  function next() {
    if (!state.answered || state.selected === null) return;
    const option = scenes[state.scene].options[state.selected];
    if (option.ending) state = { ...state, finished: true, endingKey: option.ending };
    else if (state.scene >= scenes.length - 1) state = { ...state, finished: true };
    else state = { ...state, scene: option.next ?? state.scene + 1, answered: false, selected: null };
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function reset() {
    localStorage.removeItem("odyssey-tense-rpg-v1");
    localStorage.removeItem("odyssey-tense-rpg-v2");
    state = { ...INITIAL };
    codex = false;
    save();
    render();
  }
  app.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (action === "choose") choose(Number(target.dataset.index));
    else if (action === "next") next();
    else if (action === "reset") reset();
    else if (action === "codex") {
      codex = true;
      render();
    } else if (action === "close-codex") {
      codex = false;
      render();
    } else if (action === "lang") {
      const pick = target.dataset.lang;
      lang = ["off", "es", "de"].includes(pick) ? pick : lang === "off" ? "es" : lang === "es" ? "de" : "off";
      save();
      render();
    }
  });
  addEventListener("keydown", (e) => {
    if (codex) {
      if (e.key === "Escape") {
        codex = false;
        render();
      }
      return;
    }
    if (e.key === "l" || e.key === "L") {
      lang = lang === "off" ? "es" : lang === "es" ? "de" : "off";
      save();
      render();
      return;
    }
    const n = Number(e.key);
    if (!state.answered && n >= 1 && n <= 3) choose(n - 1);
    else if (state.answered && (e.key === "Enter" || e.key === " ")) next();
  });
  render();
})();

}
document.getElementById("begin-voyage").addEventListener("click", launchOdyssey);
(function coverLang(){
  var KEY = "odyssey-tense-lang";
  var btns = Array.prototype.slice.call(document.querySelectorAll("[data-cover-lang]"));
  function current(){
    try { var v = localStorage.getItem(KEY); return ["off","es","de"].indexOf(v) >= 0 ? v : "off"; }
    catch (e) { return "off"; }
  }
  function paint(){
    var now = current();
    btns.forEach(function(b){
      var on = b.dataset.coverLang === now;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    });
  }
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      try { localStorage.setItem(KEY, b.dataset.coverLang); } catch (e) {}
      paint();
    });
  });
  paint();
})();
