:root{--cake-a:rgba(207,52,125,.55);--cake-b:rgba(36,121,173,.55);
--cake-a-ink:#fff0f7;--cake-b-ink:#eef7ff;
--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;
--cake-a-wash:rgba(207,52,125,.22);--cake-b-wash:rgba(36,121,173,.22);
--accent:#e8c04a;--accent-ink:#1a1200;--deep:#120c04;--panel:rgba(16,12,8,.88);--scrim:rgba(16,12,8,.88);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55);
/* The scale unit. Every size below was authored as a fraction of a 16:9
   frame's width, so on a wider window the type outgrew the panel and the
   options fell below the fold. 1vw and 1.7778vh are equal at 16:9, so this
   changes nothing there and only ever caps, never enlarges. The frame is
   the viewport (.game is fixed inset:0), which is why vw/vh and not cqw. */
--u:min(1vw,1.7778vh)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* opt-in, per lesson: show the whole plate, letterboxed in the deep colour */
.fit-contain .scene-img{object-fit:contain}
.fit-contain{background:#120c04}
/* ── HUD ── */
/* z-index 7 puts the HUD over the glowing object (6). Below it, a hotspot near
   the top of a plate lay on the utility buttons and swallowed their taps:
   measured 2026-10-02, the FULLSCREEN and SOUND buttons were dead on up to 13
   scenes a page on a phone and on 3 even on a desktop. The HUD's own box is
   pointer-events:none, so only the buttons themselves sit on top. */
.hud{position:absolute;z-index:7;top:calc(1.3 * var(--u));left:calc(1.5 * var(--u));right:calc(1.5 * var(--u));display:flex;align-items:center;justify-content:space-between;gap:calc(1 * var(--u));pointer-events:none}
.hud-group{display:flex;gap:calc(.55 * var(--u));align-items:center;flex-wrap:wrap}
.badge{background:var(--panel);backdrop-filter:blur(5px);border:1px solid rgba(255,246,217,.34);box-shadow:0 0 calc(1.3 * var(--u)) var(--shadow);padding:calc(.5 * var(--u)) calc(.8 * var(--u));font-size:calc(1.15 * var(--u));letter-spacing:.04em;white-space:nowrap}
.badge b{color:var(--accent);font-weight:700}
.langs{display:flex;gap:calc(.35 * var(--u));pointer-events:auto;position:relative}
.lang-btn,.utility{border:1px solid rgba(255,246,217,.35);color:var(--bone);background:var(--panel);padding:calc(.5 * var(--u)) calc(.75 * var(--u));cursor:pointer;font-size:calc(1.1 * var(--u));pointer-events:auto}
.lang-btn{display:flex;align-items:center;gap:0;white-space:nowrap}
/* The three utilities sit as bare icons and give their words back on hover or
   keyboard focus. Three labelled buttons across the top of a painted frame is
   a lot of furniture over somebody's artwork, and the keys (L, S, F) and the
   corner help line already say what they do. The label is collapsed by width
   rather than removed, so it stays in the accessibility tree and a screen
   reader still reads "SOUND OFF". */
.u-label{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:middle;transition:max-width .2s ease,opacity .18s ease}
.utility:hover .u-label,.utility:focus-visible .u-label,.langs:focus-within .u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}
/* a touch screen has no hover, so there the words are simply always on */
@media(hover:none){.u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}}.lang-btn b{color:var(--accent)}
.utility:hover,.lang-btn:hover{border-color:var(--bone)}
.utility.fs{display:flex;align-items:center;gap:calc(.35 * var(--u));color:var(--accent-ink);background:linear-gradient(180deg,#fff0b8,var(--accent));border:1px solid #fff8dc;font-weight:700;letter-spacing:.06em;animation:fsglow 2.4s ease-in-out infinite}
.utility.fs:hover{filter:brightness(1.08)}
.lang-menu[hidden]{display:none}
.lang-menu{position:absolute;right:0;top:calc(100% + calc(.4 * var(--u)));z-index:20;display:grid;grid-template-columns:1fr;gap:calc(.25 * var(--u));min-width:calc(18 * var(--u));padding:calc(.45 * var(--u));background:rgba(14,9,2,.97);border:1px solid rgba(255,246,217,.4);box-shadow:0 calc(1 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.7)}
.lang-item{display:grid;grid-template-columns:calc(3 * var(--u)) 1fr;align-items:center;gap:calc(.4 * var(--u));border:1px solid transparent;background:none;color:var(--bone);padding:calc(.45 * var(--u)) calc(.55 * var(--u));text-align:left;cursor:pointer;font-size:calc(1.05 * var(--u))}
.lang-item b{color:var(--accent);font-size:calc(.95 * var(--u))}.lang-item:hover{border-color:rgba(255,246,217,.5);background:rgba(60,40,5,.9)}
.lang-item.active{background:var(--accent);color:var(--accent-ink)}.lang-item.active b{color:var(--accent-ink)}
/* ── the panel ── */
.zone{position:absolute;z-index:4;top:8%;bottom:3.5%;left:2.2%;right:2.2%;display:flex;pointer-events:none}

/* A cover is a strip at the foot of the frame, with the panel fading up out of
   the picture instead of sitting on it as a box. The plate is the title
   screen; this is the caption under it.

   The foot is forced; the SIDE is not. Forcing both buried the cover marker on
   four of seven adventures — 43% on Frankenstein Part I, 37% on Sherlock —
   because a centred strip is ~64% of the zone and most cover objects sit near
   the middle. `pos` already carries each lesson's answer to that (Part I is
   `left`, Part II is `right`, both chosen against a measurement), so the
   strip honours it and centres only where the scene asks to be centred. */
.is-cover .zone{align-items:flex-end!important;bottom:16%}
.is-cover .content{width:auto!important;max-width:64%;margin:0!important;text-align:center;align-items:center;

     to start fading in at 42%, which put the kicker — accent colour, smallest
     type — on bare artwork: unreadable over snow on Part I and ice on Part II.
     The bottom padding clears the corner help bar, which the spec line used to
     sit on top of by 5-14px depending on how long that line is. */

/* ── `band`: a wide, shallow strip across the foot of the frame ──
   A side panel assumes the picture has an empty side. Wonderland's plates are
   crowd scenes — Alice stands in the middle and the supporting cast fills both
   edges — so 46% of the width buried a named character on eighteen of thirty-
   five screens, and on the pink/blue contrast plates it covered half of the
   very thing the question compares. A band reads across instead of down: the
   prose in one column, the options in the other, so it is roughly a third of
   the height a stacked panel needs and the upper two thirds of the picture
   stay visible. Innes asked for it on the first fork on 2026-09-16 ("bottom
   central and more streamlined or in two parts") and it answers the occlusion
   everywhere else too.

   It comes after the .v-* rules on purpose: same specificity, so the foot wins
   whatever `v` the scene carries. A band scene's hotspot must sit above ~60%
   of the picture — check-rpg-panels.js measures that. */

/* The even split above is for a question, where the prompt and three options
   weigh about what the story does. The other kinds are lopsided.

   A story screen is prose and one button, so the button column shrinks to the
   button and the prose takes the whole strip: the same paragraph in a 64% column
   runs seven lines and in an 88% one runs five, and a band is only worth having
   while it stays shallow. The cap stops a long button label ("HELP ALICE STOP

<script>
/* Block Camp save file.
   One localStorage record shared by every camp page: the RPGs write a result
   at each ending, the tense decks write how far the learner paged, and the
   overworld (block-camp/quest.html) reads all of it back as a game.

   The engine (lesson-template/build/rpg/rpg.py) inlines this file into every
   RPG it builds, so a page stays one self-contained file; the hand-built
   adventures and the decks load it with <script src>. Either way the API is
   window.CampSave and every call is guarded — a browser with storage blocked
   just plays the lesson as before.

   Page ids are the file name without .html, so an RPG is 'lost-yellow-road-rpg'
   and a deck is 'blockcamp-past-simple'. The overworld maps those ids onto
   camps with the same tables the hub builder uses.

   Format (v1):
     { v:1, name:'', created, updated, last:{id,href,title,kind,at},
       rpg:  { id: { plays, last, parts: { chapter: {best,max,tiles,tilesMax,cleared,master,endings:{id:n}} } } },
       deck: { id: { plays, seen, total, done, last } } }
   'parts' is keyed by chapter index for a page that holds several games
   (the Kraken saga); every other RPG has one part, keyed '0'. */
(function () {
  var KEY = 'forbes-camp-save', V = 1, MAGIC = 'BLOCKCAMP1:';

  function pageId() {
    var p = (location.pathname || '').split('/').pop() || '';
    try { p = decodeURIComponent(p); } catch (_) {}
    return p.replace(/\.html?$/i, '') || 'index';
  }
  function blank() { return { v: V, name: '', created: Date.now(), updated: Date.now(), last: null, rpg: {}, deck: {} }; }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === V && s.rpg && s.deck) return s; } catch (_) {}
    return blank();
  }
  function store(s) {
    s.updated = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (_) {}
    try { window.dispatchEvent(new CustomEvent('campsave', { detail: s })); } catch (_) {}
    return s;
  }
  function touch(s, kind) {
    s.last = { id: pageId(), href: location.pathname.split('/').pop() || location.href, dir: /\/block-camp\//.test(location.pathname) ? 'block-camp' : '',
               title: (document.title || '').replace(/\s*\|.*$/, ''), kind: kind, at: Date.now() };
  }

  var CampSave = {
    KEY: KEY, id: pageId, load: load,

    /* every camp page calls this once on load: it is what "Continue" points at */
    visit: function (kind) { var s = load(); touch(s, kind || 'page'); return store(s); },

    /* an RPG calls this from its ending scene */
    rpgEnd: function (r) {
      var s = load(), id = pageId(), e = s.rpg[id] || (s.rpg[id] = { plays: 0, parts: {} });
      var k = String(r.chapter == null ? 0 : r.chapter), p = e.parts[k] || (e.parts[k] = { best: 0, max: 0, tiles: 0, tilesMax: 0, cleared: false, master: false, endings: {} });
      e.plays += 1; e.last = Date.now();
      p.max = Math.max(p.max, r.max || 0); p.tilesMax = Math.max(p.tilesMax, r.tilesMax || 0);
      if ((r.score || 0) >= p.best) { p.best = r.score || 0; p.tiles = Math.max(p.tiles, r.tiles || 0); }
      p.tiles = Math.max(p.tiles, r.tiles || 0);
      if (r.cleared) p.cleared = true;
      if (r.master) p.master = true;
      if (r.ending) p.endings[r.ending] = (p.endings[r.ending] || 0) + 1;
      touch(s, 'rpg');
      return store(s);
    },

    /* a deck calls this from show(): how far the learner has paged */
    deck: function (idx, total) {
      var s = load(), id = pageId(), e = s.deck[id] || (s.deck[id] = { plays: 0, seen: 0, total: 0 });
      if (idx === 0 && e.seen === 0) e.plays += 1;
      e.seen = Math.max(e.seen, (idx | 0) + 1); e.total = total | 0; e.done = e.total > 0 && e.seen >= e.total; e.last = Date.now();
      touch(s, 'deck');
      return store(s);
    },

    /* a page with state of its own (the village's rangers met) keeps it
       under its own key, so the record grows without a format bump */
    get: function (key) { var s = load(); return s[key] == null ? null : s[key]; },
    put: function (key, val) { var s = load(); s[key] = val; return store(s); },

    setName: function (name) { var s = load(); s.name = String(name || '').slice(0, 24); return store(s); },
    reset: function () { try { localStorage.removeItem(KEY); } catch (_) {} return store(blank()); },

    /* a save moves between browsers as one line of text */
    exportText: function () { try { return MAGIC + btoa(unescape(encodeURIComponent(JSON.stringify(load())))); } catch (_) { return ''; } },
    importText: function (t) {
      t = String(t || '').trim(); if (t.indexOf(MAGIC) !== 0) return null;
      try { var s = JSON.parse(decodeURIComponent(escape(atob(t.slice(MAGIC.length))))); if (s && s.v === V && s.rpg && s.deck) return store(s); } catch (_) {}
      return null;
    },

    /* scores every RPG on a common scale, whatever its own point ladder:
       0–100 for the best run, 25 a tile, 50 for clearing it, 50 more for the
       master ending. A deck is 50 read to the end, pro rata before that. */
    rpgXp: function (e) {
      var xp = 0; if (!e) return 0;
      Object.keys(e.parts).forEach(function (k) { var p = e.parts[k];
        xp += p.max ? Math.round(100 * p.best / p.max) : 0; xp += 25 * (p.tiles || 0); if (p.cleared) xp += 50; if (p.master) xp += 50; });
      return xp;
    },
    deckXp: function (e) { if (!e || !e.total) return 0; return e.done ? 50 : Math.round(50 * e.seen / e.total); },
    xp: function (s) {
      s = s || load(); var t = 0, self = this;
      Object.keys(s.rpg).forEach(function (k) { t += self.rpgXp(s.rpg[k]); });
      Object.keys(s.deck).forEach(function (k) { t += self.deckXp(s.deck[k]); });
      return t;
    }
  };
  window.CampSave = CampSave;
})();

HOTEL","fr":"LA DERNIÈRE NUIT AU GRAND HOTEL","it":"L'ULTIMA NOTTE AL GRAND HOTEL","ja":"グランドホテル最後の夜","pt":"A ÚLTIMA NOITE NO GRAND HOTEL","ru":"ПОСЛЕДНЯЯ НОЧЬ В ГРАНД-ОТЕЛЕ","zh":"大饭店的最后一夜"},"story":{"en":"One hotel. One last party. One guest too many. You are the Grand Hotel’s new night manager. Tomorrow it closes forever. Tonight, every room is full, the mountain road is disappearing under snow, and the owner has promised a surprise at midnight.","ar":"فندق واحد. حفلة أخيرة. ضيف زائد عن العدد. أنت مدير الليل الجديد في الفندق الكبير. غدًا يُغلق إلى الأبد. الليلة كل الغرف ممتلئة، وطريق الجبل يختفي تحت الثلج، وقد وعد المالك بمفاجأة عند منتصف الليل.","de":"Ein Hotel. Eine letzte Party. Ein Gast zu viel. Du bist der neue Nachtmanager des Grand Hotels. Morgen schließt es für immer. Heute Nacht ist jedes Zimmer belegt, die Bergstraße verschwindet unter dem Schnee, und der Besitzer hat für Mitternacht eine Überraschung versprochen.","es":"Un hotel. Una última fiesta. Un huésped de más. Eres el nuevo gerente de noche del Grand Hotel. Mañana cierra para siempre. Esta noche todas las habitaciones están llenas, la carretera de montaña desaparece bajo la nieve y el dueño ha prometido una sorpresa a medianoche.","fr":"Un hôtel. Une dernière fête. Un invité de trop. Tu es le nouveau gérant de nuit du Grand Hotel. Demain, il ferme pour toujours. Ce soir, toutes les chambres sont occupées, la route de montagne disparaît sous la neige, et le propriétaire a promis une surprise à minuit.","it":"Un hotel. Un'ultima festa. Un ospite di troppo. Sei il nuovo direttore di notte del Grand Hotel. Domani chiude per sempre. Stanotte tutte le camere sono piene, la strada di montagna sta sparendo sotto la neve e il proprietario ha promesso una sorpresa a mezzanotte.","ja":"ひとつのホテル。最後のパーティー。ひとり多い客。あなたはグランドホテルの新しい夜間支配人だ。ホテルは明日、永遠に閉まる。今夜は全室満室で、山道は雪に消えかけ、オーナーは真夜中にサプライズがあると約束している。","pt":"Um hotel. Uma última festa. Um hóspede a mais. Você é o novo gerente da noite do Grand Hotel. Amanhã ele fecha para sempre. Esta noite todos os quartos estão ocupados, a estrada da montanha está a desaparecer sob a neve e o dono prometeu uma surpresa à meia-noite.","ru":"Один отель. Одна последняя вечеринка. Один лишний гость. Ты новый ночной управляющий Гранд-отеля. Завтра он закрывается навсегда. Сегодня все номера заняты, горную дорогу заметает снегом, а владелец обещал сюрприз в полночь.","zh":"一家酒店。最后一场派对。多出来的一位客人。你是大饭店新来的夜班经理。明天它将永远关门。今晚所有房间都住满了，山路正消失在雪下，老板承诺午夜时分有一个惊喜。"},"rules":[{"en":"MIXED TENSES","ar":"أزمنة مختلطة","de":"GEMISCHTE ZEITFORMEN","es":"TIEMPOS MIXTOS","fr":"TEMPS MÉLANGÉS","it":"TEMPI MISTI","ja":"ミックス時制","pt":"TEMPOS MISTOS","ru":"СМЕШАННЫЕ ВРЕМЕНА","zh":"混合时态"},{"en":"28 TIME CHECKS","ar":"28 فحصًا للزمن","de":"28 ZEITCHECKS","es":"28 CONTROLES DE TIEMPO","fr":"28 CONTRÔLES DU TEMPS","it":"28 CONTROLLI DEL TEMPO","ja":"28 の時間チェック","pt":"28 VERIFICAÇÕES DE TEMPO","ru":"28 ПРОВЕРОК ВРЕМЕНИ","zh":"28 次时间检查"},{"en":"5 CLUES","ar":"5 أدلة","de":"5 HINWEISE","es":"5 PISTAS","fr":"5 INDICES","it":"5 INDIZI","ja":"5 つの手がかり","pt":"5 PISTAS","ru":"5 УЛИК","zh":"5 条线索"},{"en":"3 ENDINGS","ar":"3 نهايات","de":"3 ENDEN","es":"3 FINALES","fr":"3 FINS","it":"3 FINALI","ja":"3 つのエンディング","pt":"3 FINAIS","ru":"3 КОНЦОВКИ","zh":"3 种结局"}],"start":{"en":"Start the night shift","ar":"ابدأ نوبة الليل","de":"Nachtschicht beginnen","es":"Empieza el turno de noche","fr":"Commencer le service de nuit","it":"Inizia il turno di notte","ja":"夜勤を始める","pt":"Começar o turno da noite","ru":"Начать ночную смену","zh":"开始夜班"},"small":{"en":"5 points for a right first answer · a wrong answer explains, and the story goes on","ar":"5 نقاط للإجابة الصحيحة من أول محاولة · الإجابة الخاطئة تُشرح، والقصة تستمر","de":"5 Punkte für eine richtige erste Antwort · eine falsche Antwort wird erklärt, und die Geschichte geht weiter","es":"5 puntos por acertar a la primera · una respuesta incorrecta se explica y la historia continúa","fr":"5 points pour une bonne première réponse · une mauvaise réponse est expliquée, et l'histoire continue","it":"5 punti per una risposta giusta al primo tentativo · una risposta sbagliata viene spiegata e la storia continua","ja":"1回目で正解すると5ポイント · 間違えると解説が出て、物語は続く","pt":"5 pontos por acertar à primeira · uma resposta errada é explicada e a história continua","ru":"5 очков за верный ответ с первой попытки · неверный ответ объясняется, и история продолжается","zh":"第一次就答对得 5 分 · 答错会有讲解，故事继续"},"next":"arrival","img":"01_arrival.webp","hot":[12,62,16,30],"pos":"right","v":"center"},"arrival":{"kind":"story","k":{"en":"ACT I · 19:30 · THE MOUNTAIN ROAD","ar":"الفصل الأول · 19:30 · طريق الجبل","de":"AKT I · 19:30 · DIE BERGSTRASSE","es":"ACTO I · 19:30 · LA CARRETERA DE MONTAÑA","fr":"ACTE I · 19:30 · LA ROUTE DE MONTAGNE","it":"ATTO I · 19:30 · LA STRADA DI MONTAGNA","ja":"第1幕 · 19:30 · 山道","pt":"ATO I · 19:30 · A ESTRADA DA MONTANHA","ru":"АКТ I · 19:30 · ГОРНАЯ ДОРОГА","zh":"第一幕 · 19:30 · 山路"},"title":{"en":"Who to trust","ar":"بمن تثق","de":"Wem man vertrauen kann","es":"En quién confiar","fr":"À qui se fier","it":"Di chi fidarsi","ja":"誰を信じるか","pt":"Em quem confiar","ru":"Кому доверять","zh":"该信任谁"},"story":{"en":"Sherpa Tensing takes your bag. “A hotel is like a mountain,” he says. “The difficult part is knowing who to trust.” Behind him, someone is watching from a window on a floor that does not exist.","ar":"يأخذ شيربا تنسينغ حقيبتك. يقول: «الفندق مثل الجبل. الصعب هو أن تعرف بمن تثق». خلفه، شخص ما يراقب من نافذة في طابق لا وجود له.","de":"Sherpa Tensing nimmt deine Tasche. „Ein Hotel ist wie ein Berg“, sagt er. „Das Schwierige ist zu wissen, wem man vertrauen kann.“ Hinter ihm schaut jemand aus einem Fenster in einem Stockwerk, das es nicht gibt.","es":"Sherpa Tensing coge tu maleta. «Un hotel es como una montaña», dice. «Lo difícil es saber en quién confiar». Detrás de él, alguien mira desde una ventana de una planta que no existe.","fr":"Sherpa Tensing prend ton sac. « Un hôtel, c'est comme une montagne, dit-il. Le plus difficile, c'est de savoir à qui se fier. » Derrière lui, quelqu'un regarde par la fenêtre d'un étage qui n'existe pas.","it":"Sherpa Tensing prende la tua borsa. «Un hotel è come una montagna», dice. «La parte difficile è sapere di chi fidarsi». Dietro di lui, qualcuno guarda da una finestra di un piano che non esiste.","ja":"シェルパ・テンジンがあなたのかばんを持つ。「ホテルは山に似ている」と彼は言う。「難しいのは、誰を信じるかを知ることだ」。彼の背後で、存在しない階の窓から誰かがこちらを見ている。","pt":"Sherpa Tensing pega na sua mala. «Um hotel é como uma montanha», diz ele. «O difícil é saber em quem confiar.» Atrás dele, alguém observa de uma janela num andar que não existe.","ru":"Шерпа Тенсинг берёт твою сумку. «Отель похож на гору, — говорит он. — Самое трудное — знать, кому доверять». За его спиной кто-то смотрит из окна на этаже, которого не существует.","zh":"夏尔巴人丹增接过你的包。\"酒店就像一座山，\"他说，\"难的是知道该信任谁。\"在他身后，有人正从一层并不存在的楼的窗户里往外看。"},"button":{"en":"Check in","ar":"سجّل الدخول","de":"Einchecken","es":"Registrarse","fr":"S'enregistrer","it":"Fai il check-in","ja":"チェックインする","pt":"Fazer o check-in","ru":"Заселиться","zh":"办理入住"},"next":"rules","img":"01_arrival.webp","hot":[27,32,10,24],"pos":"right","v":"center"},"rules":{"kind":"rules","k":{"en":"BEFORE THE NIGHT SHIFT · HOW THE TENSES WORK","ar":"قبل نوبة الليل · كيف تعمل الأزمنة","de":"VOR DER NACHTSCHICHT · SO FUNKTIONIEREN DIE ZEITFORMEN","es":"ANTES DEL TURNO DE NOCHE · CÓMO FUNCIONAN LOS TIEMPOS","fr":"AVANT LE SERVICE DE NUIT · COMMENT MARCHENT LES TEMPS","it":"PRIMA DEL TURNO DI NOTTE · COME FUNZIONANO I TEMPI","ja":"夜勤の前に · 時制のしくみ","pt":"ANTES DO TURNO DA NOITE · COMO FUNCIONAM OS TEMPOS","ru":"ПЕРЕД НОЧНОЙ СМЕНОЙ · КАК УСТРОЕНЫ ВРЕМЕНА","zh":"夜班之前 · 时态如何运作"},"title":{"en":"SHERPA TENSING'S TENSE GUIDE","ar":"دليل الأزمنة من شيربا تنسينغ","de":"SHERPA TENSINGS ZEITFORMEN-GUIDE","es":"LA GUÍA DE TIEMPOS DE SHERPA TENSING","fr":"LE GUIDE DES TEMPS DE SHERPA TENSING","it":"LA GUIDA AI TEMPI DI SHERPA TENSING","ja":"シェルパ・テンジンの時制ガイド","pt":"O GUIA DE TEMPOS DE SHERPA TENSING","ru":"ПУТЕВОДИТЕЛЬ ПО ВРЕМЕНАМ ШЕРПЫ ТЕНСИНГА","zh":"夏尔巴人丹增的时态指南"},"rules":[{"name":{"en":"PRESENT · NOW, AND UP TO NOW","ar":"المضارع · الآن، وحتى الآن","de":"GEGENWART · JETZT UND BIS JETZT","es":"PRESENTE · AHORA, Y HASTA AHORA","fr":"PRÉSENT · MAINTENANT, ET JUSQU'À MAINTENANT","it":"PRESENTE · ORA, E FINO A ORA","ja":"現在 · 今、そして今まで","pt":"PRESENTE · AGORA, E ATÉ AGORA","ru":"НАСТОЯЩЕЕ · СЕЙЧАС И ДО СИХ ПОР","zh":"现在 · 此刻，以及直到此刻"},"form":{"en":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","ar":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","de":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","es":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","fr":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","it":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","ja":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","pt":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","ru":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING","zh":"CHECKS · IS CHECKING · HAS CHECKED · HAS BEEN CHECKING"}},{"name":{"en":"PAST · LOOKING BACK","ar":"الماضي · النظر إلى الوراء","de":"VERGANGENHEIT · DER BLICK ZURÜCK","es":"PASADO · MIRANDO ATRÁS","fr":"PASSÉ · LE REGARD EN ARRIÈRE","it":"PASSATO · GUARDARE INDIETRO","ja":"過去 · 振り返る","pt":"PASSADO · OLHAR PARA TRÁS","ru":"ПРОШЕДШЕЕ · ВЗГЛЯД НАЗАД","zh":"过去 · 回头看"},"form":{"en":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","ar":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","de":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","es":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","fr":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","it":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","ja":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","pt":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","ru":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING","zh":"CHECKED · WAS CHECKING · HAD CHECKED · HAD BEEN CHECKING"}},{"name":{"en":"FUTURE · LOOKING AHEAD","ar":"المستقبل · النظر إلى الأمام","de":"ZUKUNFT · DER BLICK NACH VORN","es":"FUTURO · MIRANDO ADELANTE","fr":"FUTUR · LE REGARD EN AVANT","it":"FUTURO · GUARDARE AVANTI","ja":"未来 · 先を見る","pt":"FUTURO · OLHAR PARA A FRENTE","ru":"БУДУЩЕЕ · ВЗГЛЯД ВПЕРЁД","zh":"将来 · 向前看"},"form":{"en":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","ar":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","de":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","es":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","fr":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","it":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","ja":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","pt":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","ru":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING","zh":"WILL CHECK · WILL BE CHECKING · WILL HAVE CHECKED · WILL HAVE BEEN CHECKING"}},{"name":{"en":"PLANS, HABITS AND THE PASSIVE","ar":"الخطط والعادات والمبني للمجهول","de":"PLÄNE, GEWOHNHEITEN UND DAS PASSIV","es":"PLANES, HÁBITOS Y LA VOZ PASIVA","fr":"PROJETS, HABITUDES ET PASSIF","it":"PIANI, ABITUDINI E PASSIVO","ja":"予定・習慣・受け身","pt":"PLANOS, HÁBITOS E A VOZ PASSIVA","ru":"ПЛАНЫ, ПРИВЫЧКИ И ПАССИВ","zh":"计划、习惯和被动语态"},"form":{"en":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","ar":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","de":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","es":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","fr":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","it":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","ja":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","pt":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","ru":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED","zh":"IS GOING TO CHECK · USED TO CHECK · IS USED TO CHECKING · IS BEING CHECKED · HAS BEEN CHECKED"}}],"note":{"en":"SIMPLE: the whole event. CONTINUOUS, BE + -ING: in progress. PERFECT, HAVE + PAST PARTICIPLE: looking back from a point in time. In every question, read the time word first — \"yesterday\", \"since seven\", \"by midnight\".","ar":"SIMPLE: الحدث كاملًا. CONTINUOUS، أي BE + -ING: حدث جارٍ. PERFECT، أي HAVE + التصريف الثالث: النظر إلى الوراء من لحظة ما. في كل سؤال، اقرأ كلمة الزمن أولًا: \"yesterday\"، \"since seven\"، \"by midnight\".","de":"SIMPLE: das ganze Ereignis. CONTINUOUS, BE + -ING: im Gange. PERFECT, HAVE + PARTIZIP: der Blick zurück von einem Zeitpunkt aus. Lies bei jeder Frage zuerst die Zeitangabe: \"yesterday\", \"since seven\", \"by midnight\".","es":"SIMPLE: el hecho completo. CONTINUOUS, BE + -ING: en curso. PERFECT, HAVE + PARTICIPIO: mirar atrás desde un momento. En cada pregunta, lee primero la expresión de tiempo: \"yesterday\", \"since seven\", \"by midnight\".","fr":"SIMPLE : l'événement entier. CONTINUOUS, BE + -ING : en cours. PERFECT, HAVE + PARTICIPE PASSÉ : regarder en arrière depuis un moment. À chaque question, lis d'abord l'indication de temps : \"yesterday\", \"since seven\", \"by midnight\".","it":"SIMPLE: l'evento intero. CONTINUOUS, BE + -ING: in corso. PERFECT, HAVE + PARTICIPIO PASSATO: guardare indietro da un momento. In ogni domanda, leggi prima l'espressione di tempo: \"yesterday\", \"since seven\", \"by midnight\".","ja":"SIMPLE：出来事全体。CONTINUOUS（BE + -ING）：進行中。PERFECT（HAVE + 過去分詞）：ある時点から振り返る。どの問題も、まず時を表す語を読もう：\"yesterday\"、\"since seven\"、\"by midnight\"。","pt":"SIMPLE: o acontecimento inteiro. CONTINUOUS, BE + -ING: em curso. PERFECT, HAVE + PARTICÍPIO PASSADO: olhar para trás a partir de um momento. Em cada pergunta, leia primeiro a expressão de tempo: \"yesterday\", \"since seven\", \"by midnight\".","ru":"SIMPLE: событие целиком. CONTINUOUS, BE + -ING: в процессе. PERFECT, HAVE + ПРИЧАСТИЕ: взгляд назад из какого-то момента. В каждом вопросе сначала прочитай указатель времени: \"yesterday\", \"since seven\", \"by midnight\".","zh":"SIMPLE：整个事件。CONTINUOUS，即 BE + -ING：正在进行。PERFECT，即 HAVE + 过去分词：从某个时间点回头看。每道题先读时间词：\"yesterday\"、\"since seven\"、\"by midnight\"。"},"button":{"en":"Go to reception","ar":"اذهب إلى الاستقبال","de":"Zur Rezeption","es":"Ir a recepción","fr":"Aller à la réception","it":"Vai alla reception","ja":"フロントへ行く","pt":"Ir à receção","ru":"К стойке регистрации","zh":"去前台"},"next":"p2","img":"18_plans.webp","hot":[80,80,16,12],"pos":"left","v":"center","width":56},"p2":{"kind":"question","k":{"en":"ACT I · 19:40 · RECEPTION","ar":"الفصل الأول · 19:40 · الاستقبال","de":"AKT I · 19:40 · REZEPTION","es":"ACTO I · 19:40 · RECEPCIÓN","fr":"ACTE I · 19:40 · RÉCEPTION","it":"ATTO I · 19:40 · RECEPTION","ja":"第1幕 · 19:40 · フロント","pt":"ATO I · 19:40 · RECEÇÃO","ru":"АКТ I · 19:40 · РЕГИСТРАЦИЯ","zh":"第一幕 · 19:40 · 前台"},"title":{"en":"Something outside the routine","ar":"شيء خارج الروتين","de":"Etwas außerhalb der Routine","es":"Algo fuera de la rutina","fr":"Quelque chose hors de la routine","it":"Qualcosa fuori dalla routine","ja":"いつもと違うこと","pt":"Algo fora da rotina","ru":"Что-то вне распорядка","zh":"日常之外的事"},"story":[{"en":"Alice is teaching you the evening routine. Mrs Hudson checks the guest book. Holmes and Watson, who run the village investigation office, are here for dinner, not work. “The owner rings the desk every evening,” Alice says. “But look at his light. Someone is calling from his office right now.”","ar":"تعلّمك أليس روتين المساء. تراجع السيدة هدسون دفتر الضيوف. هولمز وواطسون، اللذان يديران مكتب التحقيقات في القرية، هنا للعشاء لا للعمل. تقول أليس: «المالك يتصل بالاستقبال كل مساء. لكن انظر إلى ضوئه. أحدهم يتصل من مكتبه الآن».","de":"Alice zeigt dir die Abendroutine. Mrs Hudson prüft das Gästebuch. Holmes und Watson, die das Ermittlungsbüro im Dorf führen, sind zum Abendessen hier, nicht zur Arbeit. „Der Besitzer ruft jeden Abend an der Rezeption an“, sagt Alice. „Aber sieh dir sein Lämpchen an. Gerade ruft jemand aus seinem Büro an.“","es":"Alice te enseña la rutina de la tarde. La señora Hudson revisa el libro de huéspedes. Holmes y Watson, que dirigen la oficina de investigación del pueblo, han venido a cenar, no a trabajar. «El dueño llama a recepción todas las tardes», dice Alice. «Pero mira su luz. Alguien está llamando desde su despacho ahora mismo».","fr":"Alice t'apprend la routine du soir. Mrs Hudson vérifie le registre des clients. Holmes et Watson, qui dirigent le bureau d'enquête du village, sont là pour dîner, pas pour travailler. « Le propriétaire appelle la réception tous les soirs, dit Alice. Mais regarde son voyant. Quelqu'un appelle de son bureau en ce moment même. »","it":"Alice ti insegna la routine della sera. La signora Hudson controlla il registro degli ospiti. Holmes e Watson, che gestiscono l'ufficio investigativo del paese, sono qui per cena, non per lavoro. «Il proprietario chiama la reception ogni sera», dice Alice. «Ma guarda la sua spia. Qualcuno sta chiamando dal suo ufficio proprio adesso».","ja":"アリスが夜の決まった仕事を教えてくれる。ハドソン夫人は宿泊者名簿を確認している。村の探偵事務所を営むホームズとワトソンは、仕事ではなく夕食に来ている。「オーナーは毎晩フロントに電話してくるの」とアリスが言う。「でも、彼のランプを見て。今まさに誰かが彼の部屋から電話している」。","pt":"A Alice ensina-lhe a rotina da noite. A Sra. Hudson verifica o livro de hóspedes. Holmes e Watson, que dirigem o gabinete de investigação da aldeia, estão aqui para jantar, não para trabalhar. «O dono liga para a receção todas as noites», diz a Alice. «Mas olhe para a luz dele. Alguém está a ligar do escritório dele neste momento.»","ru":"Алиса объясняет тебе вечерний распорядок. Миссис Хадсон проверяет книгу гостей. Холмс и Ватсон, которые руководят сыскным бюро в деревне, пришли поужинать, а не работать. «Владелец звонит на стойку каждый вечер, — говорит Алиса. — Но посмотри на его лампочку. Кто-то звонит из его кабинета прямо сейчас».","zh":"爱丽丝在教你晚间的工作流程。哈德森太太在核对住客登记簿。福尔摩斯和华生在村里经营侦探事务所，他们今晚是来吃饭的，不是来工作的。\"老板每天晚上都给前台打电话，\"爱丽丝说，\"可你看他的指示灯。现在有人正从他的办公室打电话。\""},{"en":"You answer. A voice whispers, “Don’t let them sell the hotel.” Then the line dies.","ar":"ترد على الهاتف. يهمس صوت: «لا تدعهم يبيعون الفندق». ثم ينقطع الخط.","de":"Du nimmst ab. Eine Stimme flüstert: „Lass sie das Hotel nicht verkaufen.“ Dann ist die Leitung tot.","es":"Contestas. Una voz susurra: «No dejes que vendan el hotel». Luego la línea se corta.","fr":"Tu décroches. Une voix chuchote : « Ne les laisse pas vendre l'hôtel. » Puis la ligne coupe.","it":"Rispondi. Una voce sussurra: «Non lasciare che vendano l'hotel». Poi la linea cade.","ja":"あなたは電話に出る。声がささやく。「ホテルを売らせないで」。そして電話が切れる。","pt":"Você atende. Uma voz sussurra: «Não deixe que vendam o hotel.» Depois a linha cai.","ru":"Ты отвечаешь. Голос шепчет: «Не дай им продать отель». Потом связь обрывается.","zh":"你接起电话。一个声音低声说：\"别让他们把酒店卖掉。\"然后电话断了。"}],"prompt":{"en":"Describe the routine, then the action happening now: “The owner ___ every evening. Someone ___ from his office right now.”","ar":"صف الروتين، ثم الفعل الذي يحدث الآن: “The owner ___ every evening. Someone ___ from his office right now.”","de":"Beschreibe die Routine, dann die Handlung, die gerade passiert: “The owner ___ every evening. Someone ___ from his office right now.”","es":"Describe la rutina y luego la acción que ocurre ahora: “The owner ___ every evening. Someone ___ from his office right now.”","fr":"Décris la routine, puis l'action en cours maintenant : “The owner ___ every evening. Someone ___ from his office right now.”","it":"Descrivi la routine, poi l'azione che succede ora: “The owner ___ every evening. Someone ___ from his office right now.”","ja":"決まった習慣と、今起きている動作を表そう：“The owner ___ every evening. Someone ___ from his office right now.”","pt":"Descreva a rotina e depois a ação que acontece agora: “The owner ___ every evening. Someone ___ from his office right now.”","ru":"Опиши распорядок, а затем действие, которое происходит сейчас: “The owner ___ every evening. Someone ___ from his office right now.”","zh":"先描述日常，再描述此刻正在发生的动作：“The owner ___ every evening. Someone ___ from his office right now.”"},"opts":[{"en":"called / had called"},{"en":"has called / called"},{"en":"is calling / calls"},{"en":"calls / is calling"}],"answer":3,"points":5,"fb":[{"en":"Both forms are past. The sentence is about a routine and about this moment, so it needs present forms.","ar":"الصيغتان في الماضي. الجملة تتحدث عن روتين وعن هذه اللحظة، لذلك تحتاج إلى صيغ المضارع.","de":"Beide Formen sind Vergangenheit. Der Satz handelt von einer Routine und von diesem Moment, also braucht er Gegenwartsformen.","es":"Las dos formas son pasadas. La frase habla de una rutina y de este momento, así que necesita formas de presente.","fr":"Les deux formes sont au passé. La phrase parle d'une routine et de ce moment-ci, elle a donc besoin de formes du présent.","it":"Entrambe le forme sono passate. La frase parla di una routine e di questo momento, quindi servono forme del presente.","ja":"どちらも過去の形だ。この文は習慣とこの瞬間についてなので、現在の形が必要だ。","pt":"As duas formas são do passado. A frase fala de uma rotina e deste momento, por isso precisa de formas do presente.","ru":"Обе формы прошедшие. Предложение говорит о распорядке и об этом моменте, значит, нужны формы настоящего.","zh":"两个形式都是过去时。这句话讲的是日常和此刻，所以需要现在时的形式。"},{"en":"HAS CALLED is a result and CALLED is a finished past event. Neither says \"every evening\" or \"right now\".","ar":"HAS CALLED نتيجة، وCALLED حدث ماضٍ منتهٍ. لا أحد منهما يعبّر عن \"every evening\" أو \"right now\".","de":"HAS CALLED ist ein Ergebnis und CALLED ein abgeschlossenes Ereignis in der Vergangenheit. Keine von beiden sagt \"every evening\" oder \"right now\".","es":"HAS CALLED es un resultado y CALLED es un hecho pasado terminado. Ninguna dice \"every evening\" ni \"right now\".","fr":"HAS CALLED est un résultat et CALLED un événement passé terminé. Aucune des deux ne dit \"every evening\" ni \"right now\".","it":"HAS CALLED è un risultato e CALLED un evento passato concluso. Nessuna delle due dice \"every evening\" o \"right now\".","ja":"HAS CALLED は結果で、CALLED は終わった過去の出来事。どちらも \"every evening\" や \"right now\" を表さない。","pt":"HAS CALLED é um resultado e CALLED é um acontecimento passado terminado. Nenhuma diz \"every evening\" ou \"right now\".","ru":"HAS CALLED — это результат, а CALLED — законченное прошлое событие. Ни одна не говорит \"every evening\" или \"right now\".","zh":"HAS CALLED 是结果，CALLED 是已结束的过去事件。两者都表达不了 \"every evening\" 或 \"right now\"。"},{"en":"This swaps the meanings. A routine takes the simple form, THE OWNER + CALLS; an action in progress takes the continuous.","ar":"هذا يقلب المعنيين. الروتين يأخذ الصيغة البسيطة، THE OWNER + CALLS، والفعل الجاري يأخذ الصيغة المستمرة.","de":"Das vertauscht die Bedeutungen. Eine Routine nimmt die einfache Form, THE OWNER + CALLS; eine laufende Handlung die Verlaufsform.","es":"Esto invierte los significados. Una rutina lleva la forma simple, THE OWNER + CALLS; una acción en curso lleva la continua.","fr":"Cela inverse les sens. Une routine prend la forme simple, THE OWNER + CALLS ; une action en cours prend la forme continue.","it":"Così si scambiano i significati. Una routine prende la forma semplice, THE OWNER + CALLS; un'azione in corso prende la forma progressiva.","ja":"これは意味が逆になっている。習慣は単純形 THE OWNER + CALLS、進行中の動作は進行形だ。","pt":"Isto troca os significados. Uma rotina leva a forma simples, THE OWNER + CALLS; uma ação em curso leva a forma contínua.","ru":"Здесь значения перепутаны. Распорядок требует простой формы, THE OWNER + CALLS; действие в процессе — длительной.","zh":"这把两个意思弄反了。日常用一般式，THE OWNER + CALLS；正在进行的动作用进行式。"},{"en":"\"Every evening\" is a routine: THE OWNER + CALLS. \"Right now\" is an action in progress: SOMEONE + IS CALLING.","ar":"\"Every evening\" روتين: THE OWNER + CALLS. و\"Right now\" فعل جارٍ: SOMEONE + IS CALLING.","de":"\"Every evening\" ist eine Routine: THE OWNER + CALLS. \"Right now\" ist eine laufende Handlung: SOMEONE + IS CALLING.","es":"\"Every evening\" es una rutina: THE OWNER + CALLS. \"Right now\" es una acción en curso: SOMEONE + IS CALLING.","fr":"\"Every evening\" est une routine : THE OWNER + CALLS. \"Right now\" est une action en cours : SOMEONE + IS CALLING.","it":"\"Every evening\" è una routine: THE OWNER + CALLS. \"Right now\" è un'azione in corso: SOMEONE + IS CALLING.","ja":"\"Every evening\" は習慣：THE OWNER + CALLS。\"Right now\" は進行中の動作：SOMEONE + IS CALLING。","pt":"\"Every evening\" é uma rotina: THE OWNER + CALLS. \"Right now\" é uma ação em curso: SOMEONE + IS CALLING.","ru":"\"Every evening\" — распорядок: THE OWNER + CALLS. \"Right now\" — действие в процессе: SOMEONE + IS CALLING.","zh":"\"Every evening\" 是日常：THE OWNER + CALLS。\"Right now\" 是正在进行的动作：SOMEONE + IS CALLING。"}],"next":"p3","img":"02_lobby.webp","hot":[35,71,6,10],"pos":"right","v":"center"},"p3":{"kind":"question","k":{"en":"ACT I · 19:50 · THE KEY DESK","ar":"الفصل الأول · 19:50 · مكتب المفاتيح","de":"AKT I · 19:50 · DIE SCHLÜSSELTHEKE","es":"ACTO I · 19:50 · EL MOSTRADOR DE LLAVES","fr":"ACTE I · 19:50 · LE COMPTOIR DES CLÉS","it":"ATTO I · 19:50 · IL BANCO DELLE CHIAVI","ja":"第1幕 · 19:50 · 鍵のカウンター","pt":"ATO I · 19:50 · O BALCÃO DAS CHAVES","ru":"АКТ I · 19:50 · СТОЙКА С КЛЮЧАМИ","zh":"第一幕 · 19:50 · 钥匙柜台"},"title":{"en":"A key without a room","ar":"مفتاح بلا غرفة","de":"Ein Schlüssel ohne Zimmer","es":"Una llave sin habitación","fr":"Une clé sans chambre","it":"Una chiave senza stanza","ja":"部屋のない鍵","pt":"Uma chave sem quarto","ru":"Ключ без комнаты","zh":"没有房间的钥匙"},"story":[{"en":"Count Blocula, the hotel’s owner, arrives in an ivory dinner jacket. He gives you a brass key marked 309. “Keep this safe until I return.” Rabbit, the fast-moving bellhop, insists there are only two guest floors. Mouse, the smallest porter, nods. Security chief Lestrade checks the printed plan. No room 309.","ar":"يصل الكونت بلوكولا، مالك الفندق، ببدلة سهرة عاجية اللون. يعطيك مفتاحًا نحاسيًا عليه الرقم 309. «احفظه جيدًا حتى أعود». يصرّ رابيت، عامل الحقائب السريع، على أن للضيوف طابقين فقط. يومئ ماوس، أصغر الحمّالين. يراجع رئيس الأمن ليستريد المخطط المطبوع. لا توجد غرفة 309.","de":"Graf Blocula, der Besitzer des Hotels, kommt in einem elfenbeinfarbenen Dinnerjackett. Er gibt dir einen Messingschlüssel mit der Nummer 309. „Bewahr ihn gut auf, bis ich zurückkomme.“ Rabbit, der flinke Page, besteht darauf, dass es nur zwei Gästeetagen gibt. Mouse, der kleinste Gepäckträger, nickt. Sicherheitschef Lestrade prüft den gedruckten Plan. Kein Zimmer 309.","es":"El conde Blocula, dueño del hotel, llega con un esmoquin color marfil. Te da una llave de latón marcada con el 309. «Guárdala bien hasta que vuelva». Rabbit, el botones veloz, insiste en que solo hay dos plantas de huéspedes. Mouse, el mozo más pequeño, asiente. El jefe de seguridad Lestrade revisa el plano impreso. No hay habitación 309.","fr":"Le comte Blocula, propriétaire de l'hôtel, arrive en smoking ivoire. Il te donne une clé en laiton marquée 309. « Garde-la bien jusqu'à mon retour. » Rabbit, le groom rapide, insiste : il n'y a que deux étages de chambres. Mouse, le plus petit porteur, acquiesce. Le chef de la sécurité Lestrade vérifie le plan imprimé. Pas de chambre 309.","it":"Il conte Blocula, proprietario dell'hotel, arriva in uno smoking color avorio. Ti dà una chiave d'ottone con il numero 309. «Tienila al sicuro finché non torno». Rabbit, il fattorino velocissimo, insiste che ci sono solo due piani per gli ospiti. Mouse, il facchino più piccolo, annuisce. Il capo della sicurezza Lestrade controlla la pianta stampata. Nessuna stanza 309.","ja":"ホテルのオーナー、ブロキュラ伯爵がアイボリーのディナージャケットで現れる。彼は 309 と刻まれた真鍮の鍵をあなたに渡す。「私が戻るまで大事に持っていてくれ」。足の速いベルボーイのラビットは、客室は二フロアしかないと言い張る。いちばん小さなポーターのマウスがうなずく。警備主任のレストレードが印刷された見取り図を確かめる。309 号室はない。","pt":"O conde Blocula, dono do hotel, chega com um smoking cor de marfim. Dá-lhe uma chave de latão com o número 309. «Guarde-a bem até eu voltar.» Rabbit, o paquete rapidíssimo, insiste que só há dois andares de hóspedes. Mouse, o carregador mais pequeno, acena que sim. O chefe de segurança Lestrade verifica a planta impressa. Não há quarto 309.","ru":"Граф Блокула, владелец отеля, приходит в смокинге цвета слоновой кости. Он даёт тебе латунный ключ с номером 309. «Сбереги его, пока я не вернусь». Рэббит, быстроногий посыльный, настаивает, что гостевых этажей только два. Маус, самый маленький носильщик, кивает. Начальник охраны Лестрейд проверяет печатный план. Номера 309 нет.","zh":"酒店老板布洛库拉伯爵穿着象牙色晚礼服到来。他给你一把刻着 309 的黄铜钥匙。\"我回来之前替我保管好。\"跑得飞快的行李员兔子坚持说只有两层客房。最小的搬运工老鼠点点头。保安主管雷斯垂德查看印好的平面图。没有 309 号房。"},{"en":"“I saw that key yesterday,” Lestrade says. “But this is the first time the Count has given it to anyone.”","ar":"يقول ليستريد: «رأيت هذا المفتاح أمس. لكنها أول مرة يعطيه الكونت لأحد».","de":"„Ich habe diesen Schlüssel gestern gesehen“, sagt Lestrade. „Aber das ist das erste Mal, dass der Graf ihn jemandem gibt.“","es":"«Vi esa llave ayer», dice Lestrade. «Pero es la primera vez que el conde se la da a alguien».","fr":"« J'ai vu cette clé hier, dit Lestrade. Mais c'est la première fois que le comte la donne à quelqu'un. »","it":"«Ho visto quella chiave ieri», dice Lestrade. «Ma è la prima volta che il conte la dà a qualcuno».","ja":"「昨日その鍵を見た」とレストレードは言う。「だが伯爵が誰かにそれを渡したのは初めてだ」。","pt":"«Vi essa chave ontem», diz Lestrade. «Mas é a primeira vez que o conde a dá a alguém.»","ru":"«Я видел этот ключ вчера, — говорит Лестрейд. — Но граф впервые отдаёт его кому-то».","zh":"\"我昨天见过这把钥匙，\"雷斯垂德说，\"但这是伯爵第一次把它交给别人。\""}],"prompt":{"en":"One event has a finished time; the other matters now: “Lestrade ___ the key yesterday. The
