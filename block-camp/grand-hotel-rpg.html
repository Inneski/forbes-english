i un punto passato precedente, e HAS BEEN GIVING è un'attività continua, non una sola consegna.","ja":"HAD SEEN にはもっと前の過去の時点が必要で、HAS BEEN GIVING は続いている活動で、一回の受け渡しではない。","pt":"HAD SEEN precisa de um ponto passado anterior, e HAS BEEN GIVING é uma atividade contínua, não uma única entrega.","ru":"HAD SEEN требует более ранней точки в прошлом, а HAS BEEN GIVING — длительное действие, а не одна передача.","zh":"HAD SEEN 需要一个更早的过去时间点，HAS BEEN GIVING 是持续的活动，而不是一次交付。"},{"en":"One sighting is SAW, not WAS SEEING. GIVES is a routine, not one new handover.","ar":"الرؤية مرة واحدة هي SAW لا WAS SEEING. وGIVES روتين لا تسليم جديد.","de":"Etwas einmal sehen ist SAW, nicht WAS SEEING. GIVES ist eine Routine, keine neue Übergabe.","es":"Ver algo una vez es SAW, no WAS SEEING. GIVES es una rutina, no una entrega nueva.","fr":"Voir une fois, c'est SAW, pas WAS SEEING. GIVES est une routine, pas une nouvelle remise.","it":"Vedere una volta è SAW, non WAS SEEING. GIVES è una routine, non una nuova consegna.","ja":"一度見たことは SAW で、WAS SEEING ではない。GIVES は習慣で、新しい一回の受け渡しではない。","pt":"Ver uma vez é SAW, não WAS SEEING. GIVES é uma rotina, não uma nova entrega.","ru":"Увидеть один раз — это SAW, а не WAS SEEING. GIVES — привычное действие, а не новая передача.","zh":"看见一次是 SAW，不是 WAS SEEING。GIVES 是日常，不是一次新的交付。"},{"en":"\"Yesterday\" is a finished time, so SAW, not HAS SEEN. GAVE loses the link to now: we have the key.","ar":"\"Yesterday\" وقت منتهٍ، لذلك SAW لا HAS SEEN. وGAVE تفقد الصلة بالآن: المفتاح معنا.","de":"\"Yesterday\" ist eine abgeschlossene Zeit, also SAW, nicht HAS SEEN. GAVE verliert die Verbindung zum Jetzt: Wir haben den Schlüssel.","es":"\"Yesterday\" es un tiempo terminado, así que SAW, no HAS SEEN. GAVE pierde la relación con el ahora: tenemos la llave.","fr":"\"Yesterday\" est un temps terminé, donc SAW, pas HAS SEEN. GAVE perd le lien avec maintenant : nous avons la clé.","it":"\"Yesterday\" è un tempo concluso, quindi SAW, non HAS SEEN. GAVE perde il legame con il presente: abbiamo la chiave.","ja":"\"Yesterday\" は終わった時なので SAW で、HAS SEEN ではない。GAVE では今とのつながりが消える：鍵は今ここにある。","pt":"\"Yesterday\" é um tempo terminado, por isso SAW, não HAS SEEN. GAVE perde a ligação ao agora: nós temos a chave.","ru":"\"Yesterday\" — законченное время, поэтому SAW, а не HAS SEEN. GAVE теряет связь с настоящим: ключ у нас.","zh":"\"Yesterday\" 是已结束的时间，所以用 SAW，不用 HAS SEEN。GAVE 失去了与现在的联系：钥匙在我们手里。"},{"en":"\"Yesterday\" is a finished time: LESTRADE + SAW. A recent action with a result now: THE COUNT + HAS JUST GIVEN.","ar":"\"Yesterday\" وقت منتهٍ: LESTRADE + SAW. فعل قريب له نتيجة الآن: THE COUNT + HAS JUST GIVEN.","de":"\"Yesterday\" ist eine abgeschlossene Zeit: LESTRADE + SAW. Eine neue Handlung mit Ergebnis jetzt: THE COUNT + HAS JUST GIVEN.","es":"\"Yesterday\" es un tiempo terminado: LESTRADE + SAW. Una acción reciente con resultado ahora: THE COUNT + HAS JUST GIVEN.","fr":"\"Yesterday\" est un temps terminé : LESTRADE + SAW. Une action récente avec un résultat maintenant : THE COUNT + HAS JUST GIVEN.","it":"\"Yesterday\" è un tempo concluso: LESTRADE + SAW. Un'azione recente con un risultato ora: THE COUNT + HAS JUST GIVEN.","ja":"\"Yesterday\" は終わった時：LESTRADE + SAW。今に結果がある最近の動作：THE COUNT + HAS JUST GIVEN。","pt":"\"Yesterday\" é um tempo terminado: LESTRADE + SAW. Uma ação recente com resultado agora: THE COUNT + HAS JUST GIVEN.","ru":"\"Yesterday\" — законченное время: LESTRADE + SAW. Недавнее действие с результатом сейчас: THE COUNT + HAS JUST GIVEN.","zh":"\"Yesterday\" 是已结束的时间：LESTRADE + SAW。刚发生、结果在现在的动作：THE COUNT + HAS JUST GIVEN。"}],"next":"p4","img":"13_key.webp","hot":[42,60,10,22],"pos":"right","v":"center"},"p4":{"kind":"question","k":{"en":"ACT I · 20:05 · THE FAREWELL BALLROOM","ar":"الفصل الأول · 20:05 · قاعة الرقص للوداع","de":"AKT I · 20:05 · DER ABSCHIEDSBALLSAAL","es":"ACTO I · 20:05 · EL SALÓN DE BAILE DE DESPEDIDA","fr":"ACTE I · 20:05 · LA SALLE DE BAL DES ADIEUX","it":"ATTO I · 20:05 · LA SALA DA BALLO DELL'ADDIO","ja":"第1幕 · 20:05 · お別れの舞踏室","pt":"ATO I · 20:05 · O SALÃO DE BAILE DA DESPEDIDA","ru":"АКТ I · 20:05 · ПРОЩАЛЬНЫЙ БАЛЬНЫЙ ЗАЛ","zh":"第一幕 · 20:05 · 告别舞厅"},"title":{"en":"Eleven seconds of darkness","ar":"إحدى عشرة ثانية من الظلام","de":"Elf Sekunden Dunkelheit","es":"Once segundos de oscuridad","fr":"Onze secondes d'obscurité","it":"Undici secondi di buio","ja":"11秒間の暗闇","pt":"Onze segundos de escuridão","ru":"Одиннадцать секунд темноты","zh":"十一秒的黑暗"},"story":[{"en":"Zombiella reaches the last note of her song. Tito is at the piano. Blane, the night porter, carries a tray of glasses. Andreas, the hotel’s buyer, watches the owner instead of the stage. The lights go out. A tray crashes. Eleven seconds later, light returns.","ar":"تصل زومبيلا إلى آخر نغمة في أغنيتها. تيتو على البيانو. بلين، حارس الليل، يحمل صينية كؤوس. أندرياس، مشتري الفندق، يراقب المالك بدل المسرح. تنطفئ الأضواء. تسقط صينية بقوة. بعد إحدى عشرة ثانية يعود الضوء.","de":"Zombiella erreicht den letzten Ton ihres Liedes. Tito sitzt am Klavier. Blane, der Nachtportier, trägt ein Tablett mit Gläsern. Andreas, der Käufer des Hotels, beobachtet den Besitzer statt der Bühne. Die Lichter gehen aus. Ein Tablett kracht zu Boden. Elf Sekunden später ist das Licht wieder da.","es":"Zombiella llega a la última nota de su canción. Tito está al piano. Blane, el mozo de noche, lleva una bandeja de copas. Andreas, el comprador del hotel, mira al dueño en vez de al escenario. Las luces se apagan. Una bandeja se estrella. Once segundos después, vuelve la luz.","fr":"Zombiella atteint la dernière note de sa chanson. Tito est au piano. Blane, le portier de nuit, porte un plateau de verres. Andreas, l'acheteur de l'hôtel, regarde le propriétaire plutôt que la scène. Les lumières s'éteignent. Un plateau s'écrase. Onze secondes plus tard, la lumière revient.","it":"Zombiella arriva all'ultima nota della sua canzone. Tito è al pianoforte. Blane, il portiere di notte, porta un vassoio di bicchieri. Andreas, l'acquirente dell'hotel, guarda il proprietario invece del palco. Le luci si spengono. Un vassoio si schianta. Undici secondi dopo, la luce torna.","ja":"ゾンビエラが歌の最後の音にたどり着く。ティトはピアノの前にいる。夜勤のポーター、ブレインがグラスをのせたトレーを運んでいる。ホテルの買い手アンドレアスは、舞台ではなくオーナーを見ている。明かりが消える。トレーが落ちて砕ける。11秒後、明かりが戻る。","pt":"Zombiella chega à última nota da sua canção. Tito está ao piano. Blane, o porteiro da noite, leva uma bandeja de copos. Andreas, o comprador do hotel, observa o dono em vez do palco. As luzes apagam-se. Uma bandeja cai com estrondo. Onze segundos depois, a luz volta.","ru":"Зомбиэлла берёт последнюю ноту своей песни. Тито сидит за роялем. Блейн, ночной портье, несёт поднос с бокалами. Андреас, покупатель отеля, смотрит не на сцену, а на владельца. Свет гаснет. Поднос с грохотом падает. Через одиннадцать секунд свет возвращается.","zh":"僵尸艾拉唱到歌曲的最后一个音。蒂托在弹钢琴。夜班门房布莱恩端着一托盘酒杯。酒店的买家安德烈亚斯不看舞台，而是盯着老板。灯灭了。托盘摔落。十一秒后，灯又亮了。"},{"en":"Blocula’s chair is empty. An ivory envelope lies on the floor. Inside it you find a note: “At midnight, tell them what this building is really worth.”","ar":"كرسي بلوكولا فارغ. ظرف عاجي اللون على الأرض. تجد في داخله ورقة: «عند منتصف الليل، أخبرهم كم يساوي هذا المبنى حقًا».","de":"Bloculas Stuhl ist leer. Ein elfenbeinfarbener Umschlag liegt auf dem Boden. Darin findest du eine Notiz: „Sag ihnen um Mitternacht, was dieses Gebäude wirklich wert ist.“","es":"La silla de Blocula está vacía. Un sobre color marfil está en el suelo. Dentro encuentras una nota: «A medianoche, diles lo que vale de verdad este edificio».","fr":"La chaise de Blocula est vide. Une enveloppe ivoire est par terre. Dedans, tu trouves un mot : « À minuit, dis-leur ce que vaut vraiment ce bâtiment. »","it":"La sedia di Blocula è vuota. Una busta color avorio è sul pavimento. Dentro trovi un biglietto: «A mezzanotte, di' loro quanto vale davvero questo edificio».","ja":"ブロキュラの椅子は空だ。床にアイボリーの封筒が落ちている。中にはメモが入っている。「真夜中に、この建物の本当の価値をみんなに伝えて」。","pt":"A cadeira de Blocula está vazia. Um envelope cor de marfim está no chão. Lá dentro encontra um bilhete: «À meia-noite, diga-lhes quanto vale realmente este edifício.»","ru":"Кресло Блокулы пусто. На полу лежит конверт цвета слоновой кости. Внутри ты находишь записку: «В полночь скажи им, сколько на самом деле стоит это здание».","zh":"布洛库拉的椅子空了。地上有一个象牙色信封。你在里面找到一张字条：\"午夜时，告诉他们这座建筑真正的价值。\""}],"prompt":{"en":"Set the background, then name the interruption: “Zombiella ___ when the lights suddenly ___ out.”","ar":"ضع الخلفية، ثم سمِّ ما قطعها: “Zombiella ___ when the lights suddenly ___ out.”","de":"Setze den Hintergrund und nenne dann die Unterbrechung: “Zombiella ___ when the lights suddenly ___ out.”","es":"Pon el fondo y luego nombra la interrupción: “Zombiella ___ when the lights suddenly ___ out.”","fr":"Pose le décor, puis nomme l'interruption : “Zombiella ___ when the lights suddenly ___ out.”","it":"Imposta lo sfondo, poi indica l'interruzione: “Zombiella ___ when the lights suddenly ___ out.”","ja":"背景を示してから、それをさえぎった出来事を言おう：“Zombiella ___ when the lights suddenly ___ out.”","pt":"Ponha o fundo e depois nomeie a interrupção: “Zombiella ___ when the lights suddenly ___ out.”","ru":"Задай фон, а затем назови то, что его прервало: “Zombiella ___ when the lights suddenly ___ out.”","zh":"先交代背景，再说出打断它的事：“Zombiella ___ when the lights suddenly ___ out.”"},"opts":[{"en":"was singing / went"},{"en":"had sung / have gone"},{"en":"sang / were going"},{"en":"has sung / go"}],"answer":0,"points":5,"fb":[{"en":"The song was in progress: ZOMBIELLA + WAS SINGING. The blackout interrupted it: THE LIGHTS + WENT out.","ar":"الأغنية كانت جارية: ZOMBIELLA + WAS SINGING. وانقطاع الكهرباء قطعها: THE LIGHTS + WENT out.","de":"Das Lied war im Gange: ZOMBIELLA + WAS SINGING. Der Stromausfall unterbrach es: THE LIGHTS + WENT out.","es":"La canción estaba en curso: ZOMBIELLA + WAS SINGING. El apagón la interrumpió: THE LIGHTS + WENT out.","fr":"La chanson était en cours : ZOMBIELLA + WAS SINGING. La panne l'a interrompue : THE LIGHTS + WENT out.","it":"La canzone era in corso: ZOMBIELLA + WAS SINGING. Il blackout l'ha interrotta: THE LIGHTS + WENT out.","ja":"歌は続いていた：ZOMBIELLA + WAS SINGING。停電がそれをさえぎった：THE LIGHTS + WENT out。","pt":"A canção estava em curso: ZOMBIELLA + WAS SINGING. O apagão interrompeu-a: THE LIGHTS + WENT out.","ru":"Песня шла: ZOMBIELLA + WAS SINGING. Отключение света её прервало: THE LIGHTS + WENT out.","zh":"歌正在唱：ZOMBIELLA + WAS SINGING。停电打断了它：THE LIGHTS + WENT out。"},{"en":"HAD SUNG means the song was already over, but she was still singing. HAVE GONE links to now.","ar":"HAD SUNG تعني أن الأغنية انتهت، لكنها كانت لا تزال تغني. وHAVE GONE ترتبط بالآن.","de":"HAD SUNG heißt, das Lied war schon vorbei, aber sie sang noch. HAVE GONE verbindet mit dem Jetzt.","es":"HAD SUNG significa que la canción ya había terminado, pero ella seguía cantando. HAVE GONE conecta con el ahora.","fr":"HAD SUNG veut dire que la chanson était déjà finie, mais elle chantait encore. HAVE GONE renvoie à maintenant.","it":"HAD SUNG significa che la canzone era già finita, ma lei stava ancora cantando. HAVE GONE si collega al presente.","ja":"HAD SUNG だと歌はもう終わっていたことになるが、彼女はまだ歌っていた。HAVE GONE は今とつながる。","pt":"HAD SUNG significa que a canção já tinha acabado, mas ela ainda estava a cantar. HAVE GONE liga-se ao agora.","ru":"HAD SUNG значит, что песня уже закончилась, а она ещё пела. HAVE GONE связано с настоящим.","zh":"HAD SUNG 表示歌已经唱完了，但她还在唱。HAVE GONE 与现在相连。"},{"en":"SANG makes the whole song one event, and WERE GOING makes the sudden blackout a long background action.","ar":"SANG تجعل الأغنية كلها حدثًا واحدًا، وWERE GOING تجعل الانقطاع المفاجئ فعلًا طويلًا في الخلفية.","de":"SANG macht das ganze Lied zu einem Ereignis, und WERE GOING macht den plötzlichen Stromausfall zu einer langen Hintergrundhandlung.","es":"SANG convierte toda la canción en un solo hecho, y WERE GOING convierte el apagón repentino en una larga acción de fondo.","fr":"SANG fait de toute la chanson un seul événement, et WERE GOING fait de la panne soudaine une longue action de fond.","it":"SANG fa di tutta la canzone un solo evento, e WERE GOING fa del blackout improvviso una lunga azione di sfondo.","ja":"SANG だと歌全体がひとつの出来事になり、WERE GOING だと突然の停電が長い背景の動作になる。","pt":"SANG faz da canção inteira um só acontecimento, e WERE GOING faz do apagão repentino uma longa ação de fundo.","ru":"SANG делает всю песню одним событием, а WERE GOING превращает внезапное отключение в долгое фоновое действие.","zh":"SANG 把整首歌变成一个事件，WERE GOING 把突然的停电变成漫长的背景动作。"},{"en":"HAS SUNG and GO are present forms. The story is at 20:05, in the past.","ar":"HAS SUNG وGO صيغتان للمضارع. القصة عند 20:05، في الماضي.","de":"HAS SUNG und GO sind Gegenwartsformen. Die Geschichte spielt um 20:05, in der Vergangenheit.","es":"HAS SUNG y GO son formas de presente. La historia ocurre a las 20:05, en el pasado.","fr":"HAS SUNG et GO sont des formes du présent. L'histoire se passe à 20:05, dans le passé.","it":"HAS SUNG e GO sono forme del presente. La storia è alle 20:05, nel passato.","ja":"HAS SUNG と GO は現在の形だ。物語は 20:05、過去の話だ。","pt":"HAS SUNG e GO são formas do presente. A história passa-se às 20:05, no passado.","ru":"HAS SUNG и GO — формы настоящего. История происходит в 20:05, в прошлом.","zh":"HAS SUNG 和 GO 是现在时形式。故事发生在 20:05，在过去。"}],"next":"p5","img":"03_ballroom.webp","hot":[55,87,9,10],"pos":"left","v":"center","width":42},"p5":{"kind":"question","k":{"en":"ACT I · 20:12 · BEHIND THE STAGE","ar":"الفصل الأول · 20:12 · خلف المسرح","de":"AKT I · 20:12 · HINTER DER BÜHNE","es":"ACTO I · 20:12 · DETRÁS DEL ESCENARIO","fr":"ACTE I · 20:12 · DERRIÈRE LA SCÈNE","it":"ATTO I · 20:12 · DIETRO IL PALCO","ja":"第1幕 · 20:12 · 舞台裏","pt":"ATO I · 20:12 · ATRÁS DO PALCO","ru":"АКТ I · 20:12 · ЗА СЦЕНОЙ","zh":"第一幕 · 20:12 · 舞台后面"},"title":{"en":"The first impossible alibi","ar":"أول حجة غياب مستحيلة","de":"Das erste unmögliche Alibi","es":"La primera coartada imposible","fr":"Le premier alibi impossible","it":"Il primo alibi impossibile","ja":"最初のありえないアリバイ","pt":"O primeiro álibi impossível","ru":"Первое невозможное алиби","zh":"第一个不可能的不在场证明"},"story":[{"en":"Andreas says he left the ballroom at 20:10, after the blackout, and went directly to the terrace. He claims he has never used the service lift. Zombiella shows you a photo Rabbit took at 20:03. Andreas’s chair is empty. His coat is already gone. Tito remembers opening the service door for him before the lights failed.","ar":"يقول أندرياس إنه غادر القاعة عند 20:10، بعد الانقطاع، وذهب مباشرة إلى الشرفة. ويدّعي أنه لم يستخدم مصعد الخدمة قط. تريك زومبيلا صورة التقطها رابيت عند 20:03. كرسي أندرياس فارغ. معطفه اختفى بالفعل. يتذكر تيتو أنه فتح له باب الخدمة قبل أن تنطفئ الأضواء.","de":"Andreas sagt, er habe den Ballsaal um 20:10 verlassen, nach dem Stromausfall, und sei direkt auf die Terrasse gegangen. Er behauptet, er habe den Dienstaufzug nie benutzt. Zombiella zeigt dir ein Foto, das Rabbit um 20:03 gemacht hat. Andreas' Stuhl ist leer. Sein Mantel ist schon weg. Tito erinnert sich, dass er ihm die Diensttür geöffnet hat, bevor das Licht ausfiel.","es":"Andreas dice que salió del salón a las 20:10, después del apagón, y fue directamente a la terraza. Afirma que nunca ha usado el ascensor de servicio. Zombiella te enseña una foto que Rabbit hizo a las 20:03. La silla de Andreas está vacía. Su abrigo ya no está. Tito recuerda que le abrió la puerta de servicio antes de que fallaran las luces.","fr":"Andreas dit qu'il a quitté la salle de bal à 20:10, après la panne, et qu'il est allé directement sur la terrasse. Il affirme n'avoir jamais pris l'ascenseur de service. Zombiella te montre une photo que Rabbit a prise à 20:03. La chaise d'Andreas est vide. Son manteau a déjà disparu. Tito se souvient de lui avoir ouvert la porte de service avant la coupure.","it":"Andreas dice di aver lasciato la sala alle 20:10, dopo il blackout, e di essere andato dritto in terrazza. Sostiene di non aver mai usato l'ascensore di servizio. Zombiella ti mostra una foto che Rabbit ha scattato alle 20:03. La sedia di Andreas è vuota. Il suo cappotto non c'è già più. Tito ricorda di avergli aperto la porta di servizio prima che le luci saltassero.","ja":"アンドレアスは、停電の後の 20:10 に舞踏室を出て、まっすぐテラスへ行ったと言う。業務用エレベーターは一度も使ったことがないと主張する。ゾンビエラが、ラビットが 20:03 に撮った写真を見せる。アンドレアスの椅子は空だ。彼のコートはもうない。ティトは、明かりが消える前に彼のために業務用のドアを開けたことを覚えている。","pt":"Andreas diz que saiu do salão às 20:10, depois do apagão, e foi diretamente para o terraço. Afirma que nunca usou o elevador de serviço. Zombiella mostra-lhe uma foto que Rabbit tirou às 20:03. A cadeira de Andreas está vazia. O casaco dele já não está lá. Tito lembra-se de lhe ter aberto a porta de serviço antes de as luzes falharem.","ru":"Андреас говорит, что вышел из зала в 20:10, после отключения света, и сразу пошёл на террасу. Он утверждает, что никогда не пользовался служебным лифтом. Зомбиэлла показывает тебе фото, которое Рэббит сделал в 20:03. Кресло Андреаса пусто. Его пальто уже нет. Тито вспоминает, что открыл ему служебную дверь до того, как погас свет.","zh":"安德烈亚斯说他在 20:10 停电之后离开舞厅，直接去了露台。他声称自己从没用过员工电梯。僵尸艾拉给你看兔子在 20:03 拍的照片。安德烈亚斯的椅子是空的。他的大衣已经不见了。蒂托记得在灯灭之前为他打开过员工通道的门。"},{"en":"“A confident voice is not a clock,” Holmes says. “Put the events in order.”","ar":"يقول هولمز: «الصوت الواثق ليس ساعة. رتّب الأحداث».","de":"„Eine selbstsichere Stimme ist keine Uhr“, sagt Holmes. „Bring die Ereignisse in die richtige Reihenfolge.“","es":"«Una voz segura no es un reloj», dice Holmes. «Pon los hechos en orden».","fr":"« Une voix sûre d'elle n'est pas une horloge, dit Holmes. Mets les événements dans l'ordre. »","it":"«Una voce sicura non è un orologio», dice Holmes. «Metti gli eventi in ordine».","ja":"「自信のある声は時計ではない」とホームズは言う。「出来事を順番に並べなさい」。","pt":"«Uma voz confiante não é um relógio», diz Holmes. «Ponha os acontecimentos por ordem.»","ru":"«Уверенный голос — ещё не часы, — говорит Холмс. — Расставь события по порядку».","zh":"\"自信的声音不是钟表，\"福尔摩斯说，\"把事件按顺序排好。\""}],"prompt":{"en":"The photo is at 20:03; the blackout is at 20:05: “Andreas ___ the ballroom before the lights ___ out.”","ar":"الصورة عند 20:03، والانقطاع عند 20:05: “Andreas ___ the ballroom before the lights ___ out.”","de":"Das Foto ist von 20:03, der Stromausfall um 20:05: “Andreas ___ the ballroom before the lights ___ out.”","es":"La foto es de las 20:03; el apagón es a las 20:05: “Andreas ___ the ballroom before the lights ___ out.”","fr":"La photo date de 20:03 ; la panne est à 20:05 : “Andreas ___ the ballroom before the lights ___ out.”","it":"La foto è delle 20:03; il blackout è alle 20:05: “Andreas ___ the ballroom before the lights ___ out.”","ja":"写真は 20:03、停電は 20:05：“Andreas ___ the ballroom before the lights ___ out.”","pt":"A foto é das 20:03; o apagão é às 20:05: “Andreas ___ the ballroom before the lights ___ out.”","ru":"Фото сделано в 20:03, свет погас в 20:05: “Andreas ___ the ballroom before the lights ___ out.”","zh":"照片拍于 20:03，停电在 20:05：“Andreas ___ the ballroom before the lights ___ out.”"},"opts":[{"en":"was leaving / have gone"},{"en":"has left / went"},{"en":"had already left / went"},{"en":"leaves / were going"}],"answer":2,"points":5,"fb":[{"en":"WAS LEAVING puts him in the middle of leaving, and HAVE GONE links to now, not to 20:05.","ar":"WAS LEAVING تضعه في منتصف المغادرة، وHAVE GONE ترتبط بالآن لا بـ20:05.","de":"WAS LEAVING setzt ihn mitten ins Weggehen, und HAVE GONE verbindet mit dem Jetzt, nicht mit 20:05.","es":"WAS LEAVING lo pone en medio de la salida, y HAVE GONE conecta con el ahora, no con las 20:05.","fr":"WAS LEAVING le place en train de partir, et HAVE GONE renvoie à maintenant, pas à 20:05.","it":"WAS LEAVING lo mette nel mezzo dell'uscita, e HAVE GONE si collega al presente, non alle 20:05.","ja":"WAS LEAVING だと彼は出ていく途中になり、HAVE GONE は 20:05 ではなく今とつながる。","pt":"WAS LEAVING põe-no a meio da saída, e HAVE GONE liga-se ao agora, não às 20:05.","ru":"WAS LEAVING ставит его в середину ухода, а HAVE GONE связано с настоящим, а не с 20:05.","zh":"WAS LEAVING 把他放在离开的过程中，HAVE GONE 与现在相连，而不是与 20:05 相连。"},{"en":"HAS LEFT looks from now. Here we look back from 20:05, a finished past point.","ar":"HAS LEFT تنظر من الآن. هنا ننظر إلى الوراء من 20:05، وهي نقطة منتهية في الماضي.","de":"HAS LEFT schaut vom Jetzt aus. Hier schauen wir von 20:05 zurück, einem abgeschlossenen Punkt in der Vergangenheit.","es":"HAS LEFT mira desde el ahora. Aquí miramos atrás desde las 20:05, un punto pasado terminado.","fr":"HAS LEFT regarde depuis maintenant. Ici, on regarde en arrière depuis 20:05, un point passé terminé.","it":"HAS LEFT guarda dal presente. Qui guardiamo indietro dalle 20:05, un punto passato concluso.","ja":"HAS LEFT は今から見ている。ここでは終わった過去の時点 20:05 から振り返る。","pt":"HAS LEFT olha a partir do agora. Aqui olhamos para trás a partir das 20:05, um ponto passado terminado.","ru":"HAS LEFT смотрит из настоящего. Здесь мы смотрим назад из 20:05 — законченной точки в прошлом.","zh":"HAS LEFT 从现在看。这里我们从 20:05 这个已结束的过去时间点回头看。"},{"en":"The earlier event: ANDREAS + HAD ALREADY LEFT. The later event: THE LIGHTS + WENT out. His 20:10 story is false.","ar":"الحدث الأسبق: ANDREAS + HAD ALREADY LEFT. الحدث اللاحق: THE LIGHTS + WENT out. روايته عن 20:10 كاذبة.","de":"Das frühere Ereignis: ANDREAS + HAD ALREADY LEFT. Das spätere Ereignis: THE LIGHTS + WENT out. Seine Geschichte mit 20:10 ist falsch.","es":"El hecho anterior: ANDREAS + HAD ALREADY LEFT. El hecho posterior: THE LIGHTS + WENT out. Su versión de las 20:10 es falsa.","fr":"L'événement antérieur : ANDREAS + HAD ALREADY LEFT. L'événement suivant : THE LIGHTS + WENT out. Sa version de 20:10 est fausse.","it":"L'evento precedente: ANDREAS + HAD ALREADY LEFT. L'evento successivo: THE LIGHTS + WENT out. La sua versione delle 20:10 è falsa.","ja":"先の出来事：ANDREAS + HAD ALREADY LEFT。後の出来事：THE LIGHTS + WENT out。20:10 という彼の話はうそだ。","pt":"O acontecimento anterior: ANDREAS + HAD ALREADY LEFT. O acontecimento seguinte: THE LIGHTS + WENT out. A versão dele das 20:10 é falsa.","ru":"Более раннее событие: ANDREAS + HAD ALREADY LEFT. Более позднее: THE LIGHTS + WENT out. Его версия про 20:10 ложна.","zh":"较早的事件：ANDREAS + HAD ALREADY LEFT。较晚的事件：THE LIGHTS + WENT out。他说的 20:10 是假的。"},{"en":"LEAVES is a present routine. We are putting two finished past events in order.","ar":"LEAVES روتين في المضارع. نحن نرتّب حدثين منتهيين في الماضي.","de":"LEAVES ist eine Routine in der Gegenwart. Wir bringen zwei abgeschlossene Ereignisse der Vergangenheit in Reihenfolge.","es":"LEAVES es una rutina de presente. Estamos ordenando dos hechos pasados terminados.","fr":"LEAVES est une routine au présent. Nous mettons en ordre deux événements passés terminés.","it":"LEAVES è una routine al presente. Stiamo mettendo in ordine due eventi passati conclusi.","ja":"LEAVES は現在の習慣だ。私たちは終わった過去の出来事を二つ並べている。","pt":"LEAVES é uma rotina no presente. Estamos a pôr por ordem dois acontecimentos passados terminados.","ru":"LEAVES — привычное действие в настоящем. А мы расставляем по порядку два законченных прошлых события.","zh":"LEAVES 是现在的日常。我们是在给两个已结束的过去事件排序。"}],"next":"p6","relic":true,"fbRight":{"en":"NOTEBOOK · THE 20:03 PHOTOGRAPH. Andreas had already left before the 20:05 blackout. His claimed 20:10 departure is false.","ar":"الدفتر · صورة 20:03. كان أندرياس قد غادر قبل انقطاع 20:05. مغادرته المزعومة عند 20:10 كاذبة.","de":"NOTIZBUCH · DAS FOTO VON 20:03. Andreas war schon vor dem Stromausfall um 20:05 gegangen. Sein angeblicher Aufbruch um 20:10 ist falsch.","es":"CUADERNO · LA FOTOGRAFÍA DE LAS 20:03. Andreas ya se había ido antes del apagón de las 20:05. Su supuesta salida a las 20:10 es falsa.","fr":"CARNET · LA PHOTO DE 20:03. Andreas était déjà parti avant la panne de 20:05. Son prétendu départ à 20:10 est faux.","it":"TACCUINO · LA FOTO DELLE 20:03. Andreas se n'era già andato prima del blackout delle 20:05. La sua presunta uscita alle 20:10 è falsa.","ja":"手帳 · 20:03 の写真。アンドレアスは 20:05 の停電より前にもう出ていた。20:10 に出たという主張はうそだ。","pt":"CADERNO · A FOTOGRAFIA DAS 20:03. Andreas já tinha saído antes do apagão das 20:05. A sua suposta saída às 20:10 é falsa.","ru":"БЛОКНОТ · ФОТО В 20:03. Андреас ушёл ещё до отключения света в 20:05. Его заявленный уход в 20:10 — ложь.","zh":"笔记本 · 20:03 的照片。安德烈亚斯在 20:05 停电之前就已经离开了。他声称 20:10 离开是假话。"},"fbWrong":{"en":"NOTEBOOK · THE 20:03 PHOTOGRAPH. Andreas had already left before the 20:05 blackout. His claimed 20:10 departure is false.","ar":"الدفتر · صورة 20:03. كان أندرياس قد غادر قبل انقطاع 20:05. مغادرته المزعومة عند 20:10 كاذبة.","de":"NOTIZBUCH · DAS FOTO VON 20:03. Andreas war schon vor dem Stromausfall um 20:05 gegangen. Sein angeblicher Aufbruch um 20:10 ist falsch.","es":"CUADERNO · LA FOTOGRAFÍA DE LAS 20:03. Andreas ya se había ido antes del apagón de las 20:05. Su supuesta salida a las 20:10 es falsa.","fr":"CARNET · LA PHOTO DE 20:03. Andreas était déjà parti avant la panne de 20:05. Son prétendu départ à 20:10 est faux.","it":"TACCUINO · LA FOTO DELLE 20:03. Andreas se n'era già andato prima del blackout delle 20:05. La sua presunta uscita alle 20:10 è falsa.","ja":"手帳 · 20:03 の写真。アンドレアスは 20:05 の停電より前にもう出ていた。20:10 に出たという主張はうそだ。","pt":"CADERNO · A FOTOGRAFIA DAS 20:03. Andreas já tinha saído antes do apagão das 20:05. A sua suposta saída às 20:10 é falsa.","ru":"БЛОКНОТ · ФОТО В 20:03. Андреас ушёл ещё до отключения света в 20:05. Его заявленный уход в 20:10 — ложь.","zh":"笔记本 · 20:03 的照片。安德烈亚斯在 20:05 停电之前就已经离开了。他声称 20:10 离开是假话。"},"img":"14_photo.webp","hot":[53,55,9,18],"pos":"left","v":"center","width":40},"p6":{"kind":"question","k":{"en":"ACT I · 20:20 · SERVICE LIFT WORKSHOP","ar":"الفصل الأول · 20:20 · ورشة مصعد الخدمة","de":"AKT I · 20:20 · WERKSTATT DES DIENSTAUFZUGS","es":"ACTO I · 20:20 · TALLER DEL ASCENSOR DE SERVICIO","fr":"ACTE I · 20:20 · ATELIER DE L'ASCENSEUR DE SERVICE","it":"ATTO I · 20:20 · OFFICINA DELL'ASCENSORE DI SERVIZIO","ja":"第1幕 · 20:20 · 業務用エレベーター作業場","pt":"ATO I · 20:20 · OFICINA DO ELEVADOR DE SERVIÇO","ru":"АКТ I · 20:20 · МАСТЕРСКАЯ СЛУЖЕБНОГО ЛИФТА","zh":"第一幕 · 20:20 · 员工电梯维修间"},"title":{"en":"The man inside the lift","ar":"الرجل داخل المصعد","de":"Der Mann im Aufzug","es":"El hombre dentro del ascensor","fr":"L'homme dans l'ascenseur","it":"L'uomo nell'ascensore","ja":"エレベーターの中の男","pt":"O homem dentro do elevador","ru":"Человек в лифте","zh":"电梯里的人"},"story":[{"en":"You find Zombito waist-deep in an open control cabinet. Jax holds a lamp. The Creature, the hotel’s enormous maintenance assistant, is supporting the lift door with one hand. Zombito looks alarming and sounds exhausted. “I started at seven. I’m still fixing this thing. I’ve replaced three fuses, but the door sensor keeps failing.”","ar":"تجد زومبيتو غارقًا حتى خصره في خزانة تحكم مفتوحة. جاكس يحمل مصباحًا. المخلوق، مساعد الصيانة الضخم في الفندق، يسند باب المصعد بيد واحدة. يبدو زومبيتو مخيفًا وصوته منهك. «بدأت عند السابعة. ما زلت أصلح هذا الشيء. استبدلت ثلاثة مصاهر، لكن حساس الباب يتعطل باستمرار».","de":"Du findest Zombito hüfttief in einem offenen Schaltschrank. Jax hält eine Lampe. Die Kreatur, der riesige Wartungshelfer des Hotels, stützt die Aufzugstür mit einer Hand. Zombito sieht beunruhigend aus und klingt erschöpft. „Ich habe um sieben angefangen. Ich repariere das Ding immer noch. Ich habe drei Sicherungen ausgetauscht, aber der Türsensor fällt immer wieder aus.“","es":"Encuentras a Zombito metido hasta la cintura en un armario de control abierto. Jax sostiene una lámpara. La Criatura, el enorme ayudante de mantenimiento del hotel, sujeta la puerta del ascensor con una mano. Zombito tiene un aspecto alarmante y suena agotado. «Empecé a las siete. Sigo arreglando este trasto. He cambiado tres fusibles, pero el sensor de la puerta sigue fallando».","fr":"Tu trouves Zombito plongé jusqu'à la taille dans une armoire de commande ouverte. Jax tient une lampe. La Créature, l'énorme assistant de maintenance de l'hôtel, retient la porte de l'ascenseur d'une main. Zombito a l'air inquiétant et la voix épuisée. « J'ai commencé à sept heures. Je répare encore ce machin. J'ai changé trois fusibles, mais le capteur de porte continue de lâcher. »","it":"Trovi Zombito immerso fino alla vita in un armadio di controllo aperto. Jax regge una lampada. La Creatura, l'enorme assistente alla manutenzione dell'hotel, tiene la porta dell'ascensore con una mano. Zombito ha un aspetto allarmante e una voce sfinita. «Ho cominciato alle sette. Sto ancora aggiustando questo affare. Ho cambiato tre fusibili, ma il sensore della porta continua a guastarsi».","ja":"ゾンビトが開いた制御盤に腰まで潜り込んでいる。ジャックスがランプを持っている。ホテルの巨大な整備助手のクリーチャーが、片手でエレベーターのドアを支えている。ゾンビトは見た目は恐ろしいが、声はくたくただ。「7時に始めたんだ。まだこいつを直している。ヒューズを3本替えたけど、ドアのセンサーが何度も故障するんだ」。","pt":"Encontra Zombito metido até à cintura num armário de controlo aberto. Jax segura uma lâmpada. A Criatura, o enorme ajudante de manutenção do hotel, segura a porta do elevador com uma mão. Zombito tem um ar assustador e uma voz exausta. «Comecei às sete. Ainda estou a arranjar esta coisa. Já troquei três fusíveis, mas o sensor da porta continua a falhar.»","ru":"Ты находишь Зомбито, по пояс залезшего в открытый шкаф управления. Джакс держит лампу. Существо, огромный помощник по ремонту, одной рукой держит дверь лифта. Зомбито выглядит пугающе и звучит измученно. «Я начал в семь. И всё ещё чиню эту штуку. Я заменил три предохранителя, но датчик двери всё время отказывает».","zh":"你发现僵尸托半个身子钻进一个打开的控制柜。贾克斯举着灯。怪物，酒店里那位巨大的维修助手，用一只手撑着电梯门。僵尸托样子吓人，声音疲惫。\"我七点开始的。我还在修这玩意儿。我已经换了三根保险丝，可门的感应器还是一直出故障。\""},{"en":"There is a second fault: someone has removed a page from the lift’s paper log.","ar":"هناك عطل ثانٍ: أحدهم نزع صفحة من سجل المصعد الورقي.","de":"Es gibt einen zweiten Fehler: Jemand hat eine Seite aus dem Papierlogbuch des Aufzugs entfernt.","es":"Hay un segundo problema: alguien ha arrancado una página del registro en papel del ascensor.","fr":"Il y a une deuxième panne : quelqu'un a arraché une page du registre papier de l'ascenseur.","it":"C'è un secondo guasto: qualcuno ha strappato una pagina dal registro cartaceo dell'ascensore.","ja":"二つ目の問題がある。誰かがエレベーターの紙の記録簿から1ページ破り取っている。","pt":"Há uma segunda avaria: alguém arrancou uma página do registo em papel do elevador.","ru":"Есть и вторая неисправность: кто-то вырвал страницу из бумажного журнала лифта.","zh":"还有第二个问题：有人从电梯的纸质日志上撕走了一页。"}],"prompt":{"en":"Focus first on ongoing effort, then completed results: “Zombito ___ since seven. He ___ three fuses so far.”","ar":"ركّز أولًا على الجهد المستمر، ثم على النتائج المنتهية: “Zombito ___ since seven. He ___ three fuses so far.”","de":"Achte zuerst auf andauernde Mühe, dann auf fertige Ergebnisse: “Zombito ___ since seven. He ___ three fuses so far.”","es":"Céntrate primero en el esfuerzo continuo y luego en los resultados terminados: “Zombito ___ since seven. He ___ three fuses so far.”","fr":"Concentre-toi d'abord sur l'effort qui dure, puis sur les résultats terminés : “Zombito ___ since seven. He ___ three fuses so far.”","it":"Concentrati prima sullo sforzo continuo, poi sui risultati conclusi: “Zombito ___ since seven. He ___ three fuses so far.”","ja":"まず続いている努力に、次に完了した結果に注目しよう：“Zombito ___ since seven. He ___ three fuses so far.”","pt":"Concentre-se primeiro no esforço contínuo e depois nos resultados terminados: “Zombito ___ since seven. He ___ three fuses so far.”","ru":"Сначала сосредоточься на длительном усилии, потом на законченных результатах: “Zombito ___ since seven. He ___ three fuses so far.”","zh":"先关注持续的努力，再关注已完成的结果：“Zombito ___ since seven. He ___ three fuses so far.”"},"opts":[{"en":"worked / was replacing"},{"en":"has worked / has been replacing"},{"en":"has been working / has replaced"},{"en":"is working / replaced"}],"answer":2,"points":5,"fb":[{"en":"WORKED makes the work finished, and WAS REPLACING does not count three finished fuses.","ar":"WORKED تجعل العمل منتهيًا، وWAS REPLACING لا تعدّ ثلاثة مصاهر منتهية.","de":"WORKED macht die Arbeit abgeschlossen, und WAS REPLACING zählt keine drei fertigen Sicherungen.","es":"WORKED da el trabajo por terminado, y WAS REPLACING no cuenta tres fusibles terminados.","fr":"WORKED rend le travail terminé, et WAS REPLACING ne compte pas trois fusibles terminés.","it":"WORKED rende il lavoro concluso, e WAS REPLACING non conta tre fusibili finiti.","ja":"WORKED だと仕事は終わったことになり、WAS REPLACING では替え終えた3本を数えられない。","pt":"WORKED dá o trabalho como terminado, e WAS REPLACING não conta três fusíveis terminados.","ru":"WORKED делает работу законченной, а WAS REPLACING не считает три готовых предохранителя.","zh":"WORKED 让工作变成已结束，WAS REPLACING 数不出三根已换好的保险丝。"},{"en":"HAS WORKED is possible, but HAS BEEN REPLACING is activity, not three finished results.","ar":"HAS WORKED ممكنة، لكن HAS BEEN REPLACING نشاط، لا ثلاث نتائج منتهية.","de":"HAS WORKED ist möglich, aber HAS BEEN REPLACING ist Tätigkeit, keine drei fertigen Ergebnisse.","es":"HAS WORKED es posible, pero HAS BEEN REPLACING es actividad, no tres resultados terminados.","fr":"HAS WORKED est possible, mais HAS BEEN REPLACING est une activité, pas trois résultats terminés.","it":"HAS WORKED è possibile, ma HAS BEEN REPLACING è attività, non tre risultati conclusi.","ja":"HAS WORKED は使えるが、HAS BEEN REPLACING は活動であって、完了した3つの結果ではない。","pt":"HAS WORKED é possível, mas HAS BEEN REPLACING é atividade, não três resultados terminados.","ru":"HAS WORKED возможно, но HAS BEEN REPLACING — это процесс, а не три законченных результата.","zh":"HAS WORKED 可以，但 HAS BEEN REPLACING 是活动，不是三个已完成的结果。"},{"en":"\"Since seven\" and still working: ZOMBITO + HAS BEEN WORKING. Three finished results: HE + HAS REPLACED.","ar":"\"Since seven\" وما زال يعمل: ZOMBITO + HAS BEEN WORKING. ثلاث نتائج منتهية: HE + HAS REPLACED.","de":"\"Since seven\" und arbeitet noch: ZOMBITO + HAS BEEN WORKING. Drei fertige Ergebnisse: HE + HAS REPLACED.","es":"\"Since seven\" y sigue trabajando: ZOMBITO + HAS BEEN WORKING. Tres resultados terminados: HE + HAS REPLACED.","fr":"\"Since seven\" et il travaille encore : ZOMBITO + HAS BEEN WORKING. Trois résultats terminés : HE + HAS REPLACED.","it":"\"Since seven\" e sta ancora lavorando: ZOMBITO + HAS BEEN WORKING. Tre risultati conclusi: HE + HAS REPLACED.","ja":"\"Since seven\" で今も作業中：ZOMBITO + HAS BEEN WORKING。完了した3つの結果：HE + HAS REPLACED。","pt":"\"Since seven\" e ainda a trabalhar: ZOMBITO + HAS BEEN WORKING. Três resultados terminados: HE + HAS REPLACED.","ru":"\"Since seven\" и всё ещё работает: ZOMBITO + HAS BEEN WORKING. Три законченных результата: HE + HAS REPLACED.","zh":"\"Since seven\" 而且还在干：ZOMBITO + HAS BEEN WORKING。三个已完成的结果：HE + HAS REPLACED。"},{"en":"IS WORKING cannot take \"since seven\", and REPLACED loses the link to now in \"so far\".","ar":"IS WORKING لا تقبل \"since seven\"، وREPLACED تفقد الصلة بالآن في \"so far\".","de":"IS WORKING passt nicht zu \"since seven\", und REPLACED verliert die Verbindung zum Jetzt in \"so far\".","es":"IS WORKING no admite \"since seven\", y REPLACED pierde la relación con el ahora de \"so far\".","fr":"IS WORKING ne va pas avec \"since seven\", et REPLACED perd le lien avec maintenant dans \"so far\".","it":"IS WORKING non regge \"since seven\", e REPLACED perde il legame con il presente in \"so far\".","ja":"IS WORKING は \"since seven\" と一緒に使えず、REPLACED では \"so far\" の今とのつながりが消える。","pt":"IS WORKING não combina com \"since seven\", e REPLACED perde a ligação ao agora de \"so far\".","ru":"IS WORKING не сочетается с \"since seven\", а REPLACED теряет связь с настоящим в \"so far\".","zh":"IS WORKING 不能搭配 \"since seven\"，REPLACED 失去了 \"so far\" 与现在的联系。"}],"next":"p7","img":"04_workshop.webp","hot":[29,81,12,12],"pos":"right","v":"center"},"p7":{"kind":"question","k":{"en":"ACT I · 20:30 · THE COPPER KITCHEN","ar":"الفصل الأول · 20:30 · المطبخ النحاسي","de":"AKT I · 20:30 · DIE KUPFERKÜCHE","es":"ACTO I · 20:30 · LA COCINA DE COBRE","fr":"ACTE I · 20:30 · LA CUISINE EN CUIVRE","it":"ATTO I · 20:30 · LA CUCINA DI RAME","ja":"第1幕 · 20:30 · 銅のキッチン","pt":"ATO I · 20:30 · A COZINHA DE COBRE","ru":"АКТ I · 20:30 · МЕДНАЯ КУХНЯ","zh":"第一幕 · 20:30 · 铜制厨房"},"title":{"en":"The kitchen knows everyone","ar":"المطبخ يعرف الجميع","de":"Die Küche kennt jeden","es":"La cocina conoce a todo el mundo","fr":"La cuisine connaît tout le monde","it":"La cucina conosce tutti","ja":"キッチンは誰でも知っている","pt":"A cozinha conhece toda a gente","ru":"Кухня знает всех","zh":"厨房认识每一个人"},"story":[{"en":"Chef Mrs Hudson has sent Rafa, Silver and Jack to feed the frightened guests. Kit is checking meal deliveries. Henry Clerval, the hotel doctor’s assistant, makes tea for anyone who looks ready to faint. “I’ve known Andreas for ten years,” Hudson says. “He smiles like a man selling you your own shoes.”","ar":"أرسلت الطاهية السيدة هدسون رافا وسيلفر وجاك لإطعام الضيوف الخائفين. كيت تراجع توصيلات الوجبات. هنري كليرفال، مساعد طبيب الفندق، يعدّ الشاي لكل من يبدو على وشك الإغماء. تقول هدسون: «أعرف أندرياس منذ عشر سنوات. يبتسم مثل رجل يبيعك حذاءك».","de":"Köchin Mrs Hudson hat Rafa, Silver und Jack losgeschickt, um die verängstigten Gäste zu versorgen. Kit prüft die Essenslieferungen. Henry Clerval, der Assistent des Hotelarztes, kocht Tee für jeden, der aussieht, als würde er gleich ohnmächtig. „Ich kenne Andreas seit zehn Jahren“, sagt Hudson. „Er lächelt wie ein Mann, der dir deine eigenen Schuhe verkauft.“","es":"La cocinera, la señora Hudson, ha mandado a Rafa, Silver y Jack a dar de comer a los huéspedes asustados. Kit está revisando las entregas de comida. Henry Clerval, el ayudante del médico del hotel, prepara té para cualquiera que parezca a punto de desmayarse. «Conozco a Andreas desde hace diez años», dice Hudson. «Sonríe como un hombre que te vende tus propios zapatos».","fr":"La cheffe, Mrs Hudson, a envoyé Rafa, Silver et Jack nourrir les clients effrayés. Kit vérifie les livraisons de repas. Henry Clerval, l'assistant du médecin de l'hôtel, fait du thé pour tous ceux qui semblent prêts à s'évanouir. « Je connais Andreas depuis dix ans, dit Hudson. Il sourit comme un homme qui te vend tes propres chaussures. »","it":"La cuoca, la signora Hudson, ha mandato Rafa, Silver e Jack a sfamare gli ospiti spaventati. Kit sta controllando le consegne dei pasti. Henry Clerval, l'assistente del medico dell'hotel, prepara il tè per chiunque sembri sul punto di svenire. «Conosco Andreas da dieci anni», dice Hudson. «Sorride come uno che ti vende le tue stesse scarpe».","ja":"料理長のハドソン夫人は、怖がる客に食事を出すためにラファ、シルバー、ジャックを送り出した。キットは食事の配達を確認している。ホテルの医師の助手ヘンリー・クラーヴァルは、気を失いそうな人みんなに紅茶をいれている。「アンドレアスとは10年来の知り合いよ」とハドソンは言う。「あの人は、あなたの靴をあなたに売りつけるような顔で笑うの」。","pt":"A cozinheira, a Sra. Hudson, mandou Rafa, Silver e Jack dar de comer aos hóspedes assustados. Kit está a verificar as entregas de refeições. Henry Clerval, o assistente do médico do hotel, faz chá para quem parece prestes a desmaiar. «Conheço o Andreas há dez anos», diz Hudson. «Sorri como um homem que lhe vende os seus próprios sapatos.»","ru":"Повар миссис Хадсон отправила Рафу, Сильвера и Джека накормить напуганных гостей. Кит проверяет доставку еды. Генри Клерваль, помощник врача отеля, заваривает чай всем, кто выглядит так, будто вот-вот упадёт в обморок. «Я знаю Андреаса десять лет, — говорит Хадсон. — Он улыбается как человек, который продаёт тебе твои же ботинки».","zh":"厨师哈德森太太派拉法、西尔弗和杰克去给受惊的客人送吃的。基特在核对送餐。酒店医生的助手亨利·克莱瓦尔给每个看起来快要晕倒的人泡茶。\"我认识安德烈亚斯十年了，\"哈德森说，\"他笑起来就像一个把你自己的鞋卖给你的人。\""},{"en":"Kit has counted every dinner tray. One extra meal went to the old east annex. Nobody has booked a room there. The Queen, the retired chairwoman, has sent her untouched pudding back. The Time Warden wants the staff to finish on schedule. Mrs Hudson ignores them both.","ar":"عدّت كيت كل صواني العشاء. ذهبت وجبة زائدة إلى الملحق الشرقي القديم. لم يحجز أحد غرفة هناك. أعادت الملكة، الرئيسة المتقاعدة، حلواها دون أن تلمسها. حارس الزمن يريد أن ينهي الموظفون في الموعد. السيدة هدسون تتجاهل الاثنين.","de":"Kit hat jedes Abendtablett gezählt. Ein Essen zu viel ging in den alten Ostanbau. Dort hat niemand ein Zimmer gebucht. Die Queen, die pensionierte Vorsitzende, hat ihren unberührten Nachtisch zurückgeschickt. Der Zeitwächter will, dass das Personal pünktlich fertig wird. Mrs Hudson ignoriert beide.","es":"Kit ha contado todas las bandejas de la cena. Una comida de más fue al viejo anexo este. Nadie ha reservado allí una habitación. La Reina, la presidenta jubilada, ha devuelto su postre sin tocar. El Guardián del Tiempo quiere que el personal termine a su hora. La señora Hudson no hace caso a ninguno de los dos.","fr":"Kit a compté chaque plateau du dîner. Un repas en trop est parti vers la vieille annexe est. Personne n'y a réservé de chambre. La Reine, la présidente à la retraite, a renvoyé son dessert sans y toucher. Le Gardien du Temps veut que le personnel finisse à l'heure. Mrs Hudson les ignore tous les deux.","it":"Kit ha contato ogni vassoio della cena. Un pasto in più è andato al vecchio annesso est. Nessuno ha prenotato una stanza lì. La Regina, la presidente in pensione, ha rimandato indietro il dolce senza toccarlo. Il Guardiano del Tempo vuole che il personale finisca in orario. La signora Hudson li ignora entrambi.","ja":"キットは夕食のトレーをすべて数えた。余分な一食が古い東の別館に運ばれた。そこには誰も部屋を予約していない。引退した会長の「女王」は、手をつけていないプディングを返してきた。時の番人は、スタッフに予定どおり終わらせたがっている。ハドソン夫人はどちらも相手にしない。","pt":"Kit contou todas as bandejas do jantar. Uma refeição a mais foi para o velho anexo leste. Ninguém reservou lá um quarto. A Rainha, a presidente reformada, devolveu a sobremesa sem lhe tocar. O Guardião do Tempo quer que o pessoal acabe a horas. A Sra. Hudson ignora os dois.","ru":"Кит пересчитала все подносы с ужином. Одна лишняя порция ушла в старый восточный флигель. Там никто не бронировал номер. Королева, председатель на пенсии, вернула свой десерт нетронутым. Хранитель Времени хочет, чтобы персонал закончил по графику. Миссис Хадсон не обращает внимания ни на кого из них.","zh":"基特数过每一个晚餐托盘。多出来的一份餐送去了旧的东侧附楼。没有人在那里订过房间。退休的女主席\"女王\"把没动过的甜点退了回来。时间看守者要员工按时完工。哈德森太太对他们俩都不理。"}],"prompt":{"en":"Choose a lasting state and an ongoing activity: “Hudson ___ Andreas for ten years. Kit ___ the deliveries all evening and is still checking.”","ar":"اختر حالة دائمة ونشاطًا جاريًا: “Hudson ___ Andreas for ten KNOWING. CHECKED dit que la vérification est finie.","it":"\"Know\" è un verbo di stato, quindi non HAS BEEN KNOWING. CHECKED dice che il controllo è finito.","ja":"\"Know\" は状態動詞なので HAS BEEN KNOWING ではない。CHECKED は確認が終わったことを表す。","pt":"\"Know\" é um verbo de estado, por isso não HAS BEEN KNOWING. CHECKED diz que a verificação acabou.","ru":"\"Know\" — глагол состояния, поэтому не HAS BEEN KNOWING. CHECKED говорит, что проверка закончена.","zh":"\"Know\" 是状态动词，所以不用 HAS BEEN KNOWING。CHECKED 表示核对已经结束。"},{"en":"\"Know\" is a state verb, so not IS KNOWING. CHECKS is a routine, not tonight's activity.","ar":"\"Know\" فعل حالة، لذلك ليس IS KNOWING. وCHECKS روتين، لا نشاط هذه الليلة.","de":"\"Know\" ist ein Zustandsverb, also nicht IS KNOWING. CHECKS ist eine Routine, nicht die Tätigkeit heute Abend.","es":"\"Know\" es un verbo de estado, así que no IS KNOWING. CHECKS es una rutina, no la actividad de esta noche.","fr":"\"Know\" est un verbe d'état, donc pas IS KNOWING. CHECKS est une routine, pas l'activité de ce soir.","it":"\"Know\" è un verbo di stato, quindi non IS KNOWING. CHECKS è una routine, non l'attività di stasera.","ja":"\"Know\" は状態動詞なので IS KNOWING ではない。CHECKS は習慣で、今夜の活動ではない。","pt":"\"Know\" é um verbo de estado, por isso não IS KNOWING. CHECKS é uma rotina, não a atividade desta noite.","ru":"\"Know\" — глагол состояния, поэтому не IS KNOWING. CHECKS — привычное действие, а не сегодняшнее.","zh":"\"Know\" 是状态动词，所以不用 IS KNOWING。CHECKS 是日常，不是今晚的活动。"}],"next":"p8","img":"05_kitchen.webp","hot":[90,76,10,16],"pos":"left","v":"center"},"p8":{"kind":"question","k":{"en":"ACT I · 20:40 · THE SECURITY CORRIDOR","ar":"الفصل الأول · 20:40 · ممر الأمن","de":"AKT I · 20:40 · DER SICHERHEITSKORRIDOR","es":"ACTO I · 20:40 · EL PASILLO DE SEGURIDAD","fr":"ACTE I · 20:40 · LE COULOIR DE SÉCURITÉ","it":"ATTO I · 20:40 · IL CORRIDOIO DELLA SICUREZZA","ja":"第1幕 · 20:40 · 警備の廊下","pt":"ATO I · 20:40 · O CORREDOR DE SEGURANÇA","ru":"АКТ I · 20:40 · КОРИДОР ОХРАНЫ","zh":"第一幕 · 20:40 · 安保走廊"},"title":{"en":"The recording that arrived late","ar":"التسجيل الذي وصل متأخرًا","de":"Die Aufnahme, die zu spät kam","es":"La grabación que llegó tarde","fr":"L'enregistrement arrivé en retard","it":"La registrazione arrivata in ritardo","ja":"遅れて届いた録画","pt":"A gravação que chegou tarde","ru":"Запись, которая пришла поздно","zh":"迟到的录像"},"story":[{"en":"Lestrade’s camera uploads clips slowly in the storm. At 20:18, a recording finally arrived. It shows Blocula walking into the service lift at 20:04, carrying a folder. Blane insists he saw Andreas enter the same lift at 20:02. The camera confirms it. Andreas was already inside when the Count arrived.","ar":"كاميرا ليستريد ترفع المقاطع ببطء بسبب العاصفة. عند 20:18 وصل أخيرًا تسجيل. يظهر فيه بلوكولا وهو يدخل مصعد الخدمة عند 20:04 حاملًا ملفًا. يصرّ بلين على أنه رأى أندرياس يدخل المصعد نفسه عند 20:02. الكاميرا تؤكد ذلك. كان أندرياس في الداخل بالفعل عندما وصل الكونت.","de":"Lestrades Kamera lädt im Sturm die Clips nur langsam hoch. Um 20:18 kam endlich eine Aufnahme an. Sie zeigt Blocula, wie er um 20:04 mit einer Mappe in den Dienstaufzug geht. Blane besteht darauf, dass er Andreas um 20:02 in denselben Aufzug steigen sah. Die Kamera bestätigt es. Andreas war schon drin, als der Graf kam.","es":"La cámara de Lestrade sube los vídeos despacio por la tormenta. A las 20:18 por fin llegó una grabación. Muestra a Blocula entrando en el ascensor de servicio a las 20:04 con una carpeta. Blane insiste en que vio a Andreas entrar en el mismo ascensor a las 20:02. La cámara lo confirma. Andreas ya estaba dentro cuando llegó el conde.","fr":"À cause de la tempête, la caméra de Lestrade envoie ses vidéos lentement. À 20:18, un enregistrement est enfin arrivé. On y voit Blocula entrer dans l'ascenseur de service à 20:04, un dossier à la main. Blane affirme avoir vu Andreas entrer dans le même ascenseur à 20:02. La caméra le confirme. Andreas était déjà à l'intérieur quand le comte est arrivé.","it":"Con la tempesta, la telecamera di Lestrade carica i video lentamente. Alle 20:18 è finalmente arrivata una registrazione. Mostra Blocula che entra nell'ascensore di servizio alle 20:04 con una cartella. Blane insiste di aver visto Andreas entrare nello stesso ascensore alle 20:02. La telecamera lo conferma. Andreas era già dentro quando è arrivato il conte.","ja":"嵐のせいで、レストレードのカメラは映像をゆっくりとしかアップロードできない。20:18 にようやく録画が届いた。そこには 20:04 にフォルダーを持って業務用エレベーターに入るブロキュラが映っている。ブレインは、20:02 にアンドレアスが同じエレベーターに入るのを見たと言い張る。カメラがそれを裏づける。伯爵が来たとき、アンドレアスはもう中にいた。","pt":"Com a tempestade, a câmara de Lestrade envia os vídeos devagar. Às 20:18 chegou finalmente uma gravação. Mostra Blocula a entrar no elevador de serviço às 20:04, com uma pasta. Blane insiste que viu Andreas entrar no mesmo elevador às 20:02. A câmara confirma. Andreas já estava lá dentro quando o conde chegou.","ru":"Из-за бури камера Лестрейда медленно загружает ролики. В 20:18 наконец пришла запись. На ней Блокула с папкой входит в служебный лифт в 20:04. Блейн настаивает, что видел, как Андреас вошёл в тот же лифт в 20:02. Камера это подтверждает. Андреас был уже внутри, когда пришёл граф.","zh":"暴风雪中，雷斯垂德的摄像头上传视频很慢。20:18，一段录像终于传到了。画面显示布洛库拉在 20:04 拿着一个文件夹走进员工电梯。布莱恩坚持说他看见安德烈亚斯在 20:02 进了同一部电梯。摄像头证实了这一点。伯爵到的时候，安德烈亚斯已经在里面了。"},{"en":"Watson notices something else: the Count is smiling. He expected a meeting, not a kidnapping.","ar":"يلاحظ واطسون شيئًا آخر: الكونت يبتسم. كان يتوقع اجتماعًا، لا اختطافًا.","de":"Watson bemerkt noch etwas: Der Graf lächelt. Er erwartete ein Treffen, keine Entführung.","es":"Watson se fija en otra cosa: el conde sonríe. Esperaba una reunión, no un secuestro.","fr":"Watson remarque autre chose : le comte sourit. Il s'attendait à une réunion, pas à un enlèvement.","it":"Watson nota un'altra cosa: il conte sorride. Si aspettava una riunione, non un rapimento.","ja":"ワトソンは別のことに気づく。伯爵が笑っている。彼が予想していたのは会合で、誘拐ではなかった。","pt":"Watson repara noutra coisa: o conde está a sorrir. Esperava uma reunião, não um sequestro.","ru":"Ватсон замечает ещё кое-что: граф улыбается. Он ждал встречи, а не похищения.","zh":"华生注意到另一件事：伯爵在微笑。他以为是去开会，而不是被绑架。"}],"prompt":{"en":"Report the order from a later past viewpoint: “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","ar":"اروِ الترتيب من نقطة لاحقة في الماضي: “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","de":"Erzähle die Reihenfolge von einem späteren Punkt in der Vergangenheit aus: “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","es":"Cuenta el orden desde un punto de vista pasado posterior: “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","fr":"Raconte l'ordre depuis un point de vue passé plus tardif : “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","it":"Racconta l'ordine da un punto di vista passato successivo: “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","ja":"もっと後の過去の時点から順序を伝えよう：“By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","pt":"Conte a ordem a partir de um ponto de vista passado posterior: “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","ru":"Изложи порядок с более поздней точки в прошлом: “By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”","zh":"从一个更晚的过去视角讲清顺序：“By the time the Count ___ at 20:04, Andreas ___ the lift at 20:02.”"},"opts":[{"en":"arrived / had entered"},{"en":"was arriving / enters"},{"en":"has arrived / has entered"},{"en":"had arrived / entered"}],"answer":0,"points":5,"fb":[{"en":"The later point: THE COUNT + ARRIVED. The earlier event: ANDREAS + HAD ENTERED.","ar":"النقطة اللاحقة: THE COUNT + ARRIVED. الحدث الأسبق: ANDREAS + HAD ENTERED.","de":"Der spätere Punkt: THE COUNT + ARRIVED. Das frühere Ereignis: ANDREAS + HAD ENTERED.","es":"El punto posterior: THE COUNT + ARRIVED. El hecho anterior: ANDREAS + HAD ENTERED.","fr":"Le point plus tardif : THE COUNT + ARRIVED. L'événement antérieur : ANDREAS + HAD ENTERED.","it":"Il punto successivo: THE COUNT + ARRIVED. L'evento precedente: ANDREAS + HAD ENTERED.","ja":"後の時点：THE COUNT + ARRIVED。先の出来事：ANDREAS + HAD ENTERED。","pt":"O ponto posterior: THE COUNT + ARRIVED. O acontecimento anterior: ANDREAS + HAD ENTERED.","ru":"Более поздняя точка: THE COUNT + ARRIVED. Более раннее событие: ANDREAS + HAD ENTERED.","zh":"较晚的时间点：THE COUNT + ARRIVED。较早的事件：ANDREAS + HAD ENTERED。"},{"en":"ENTERS is present. We are telling the whole sequence in the past.","ar":"ENTERS مضارع. نحن نروي التسلسل كله في الماضي.","de":"ENTERS ist Gegenwart. Wir erzählen die ganze Abfolge in der Vergangenheit.","es":"ENTERS es presente. Contamos toda la secuencia en pasado.","fr":"ENTERS est au présent. Nous racontons toute la séquence au passé.","it":"ENTERS è presente. Raccontiamo tutta la sequenza al passato.","ja":"ENTERS は現在形だ。私たちは一連の流れ全体を過去で語っている。","pt":"ENTERS é presente. Estamos a contar toda a sequência no passado.","ru":"ENTERS — настоящее время. Мы рассказываем всю последовательность в прошлом.","zh":"ENTERS 是现在时。我们在用过去时讲整个过程。"},{"en":"Both events have finished clock times, 20:02 and 20:04, so not HAS + past participle.","ar":"للحدثين وقتان منتهيان على الساعة، 20:02 و20:04، لذلك ليس HAS + التصريف الثالث.","de":"Beide Ereignisse haben abgeschlossene Uhrzeiten, 20:02 und 20:04, also nicht HAS + Partizip.","es":"Los dos hechos tienen horas pasadas terminadas, 20:02 y 20:04, así que no HAS + participio.","fr":"Les deux événements ont des heures passées terminées, 20:02 et 20:04, donc pas HAS + participe passé.","it":"Entrambi gli eventi hanno orari passati conclusi, 20:02 e 20:04, quindi non HAS + participio passato.","ja":"どちらの出来事にも終わった時刻 20:02 と 20:04 があるので、HAS + 過去分詞ではない。","pt":"Os dois acontecimentos têm horas passadas terminadas, 20:02 e 20:04, por isso não HAS + particípio.","ru":"У обоих событий законченное время по часам, 20:02 и 20:04, поэтому не HAS + причастие.","zh":"两个事件都有已结束的钟点，20:02 和 20:04，所以不用 HAS + 过去分词。"},{"en":"This puts HAD on the later event. The earlier one, the entry at 20:02, takes HAD ENTERED.","ar":"هذا يضع HAD على الحدث اللاحق. أما الأسبق، الدخول عند 20:02، فيأخذ HAD ENTERED.","de":"Das setzt HAD auf das spätere Ereignis. Das frühere, das Einsteigen um 20:02, bekommt HAD ENTERED.","es":"Esto pone HAD en el hecho posterior. El anterior, la entrada a las 20:02, lleva HAD ENTERED.","fr":"Cela met HAD sur l'événement plus tardif. Le premier, l'entrée à 20:02, prend HAD ENTERED.","it":"Così HAD va sull'evento successivo. Quello precedente, l'ingresso alle 20:02, prende HAD ENTERED.","ja":"これは HAD を後の出来事につけている。先の出来事、20:02 の乗り込みに HAD ENTERED を使う。","pt":"Isto põe HAD no acontecimento posterior. O anterior, a entrada às 20:02, leva HAD ENTERED.","ru":"Здесь HAD стоит на более позднем событии. Более раннее, вход в 20:02, требует HAD ENTERED.","zh":"这把 HAD 放在了较晚的事件上。较早的那个，20:02 进电梯，才用 HAD ENTERED。"}],"next":"p9","img":"06_corridor.webp","hot":[17,62,12,22],"pos":"right","v":"center"},"p9":{"kind":"question","k":{"en":"ACT I · 20:50 · THE WORKSHOP BENCH","ar":"الفصل الأول · 20:50 · طاولة الورشة","de":"AKT I · 20:50 · DIE WERKBANK","es":"ACTO I · 20:50 · EL BANCO DEL TALLER","fr":"ACTE I · 20:50 · L'ÉTABLI DE L'ATELIER","it":"ATTO I · 20:50 · IL BANCO DELL'OFFICINA","ja":"第1幕 · 20:50 · 作業台","pt":"ATO I · 20:50 · A BANCADA DA OFICINA","ru":"АКТ I · 20:50 · ВЕРСТАК В МАСТЕРСКОЙ","zh":"第一幕 · 20:50 · 工作台"},"title":{"en":"A page in the rubbish","ar":"صفحة في القمامة","de":"Eine Seite im Müll","es":"Una página en la basura","fr":"Une page à la poubelle","it":"Una pagina nella spazzatura","ja":"ゴミの中の1ページ","pt":"Uma página no lixo","ru":"Страница в мусоре","zh":"垃圾里的一页"},"story":[{"en":"Victor Frankenstein, the hotel doctor, arrives with retired engineer Professor Waldman. Neither likes the smell of hot wires. The Creature finds the missing log page under a bin. The lift travelled to “E-309” at 20:06. The passenger doors opened, then someone locked the annex door from outside.","ar":"يصل فيكتور فرانكنشتاين، طبيب الفندق، مع المهندس المتقاعد البروفيسور فالدمان. لا يحب أي منهما رائحة الأسلاك الساخنة. يجد المخلوق صفحة السجل المفقودة تحت سلة قمامة. ذهب المصعد إلى «E-309» عند 20:06. انفتحت الأبواب، ثم أقفل أحدهم باب الملحق من الخارج.","de":"Victor Frankenstein, der Hotelarzt, kommt mit dem pensionierten Ingenieur Professor Waldman. Keiner von beiden mag den Geruch heißer Kabel. Die Kreatur findet die fehlende Logbuchseite unter einem Mülleimer. Der Aufzug fuhr um 20:06 nach „E-309“. Die Türen gingen auf, dann schloss jemand die Tür des Anbaus von außen ab.","es":"Victor Frankenstein, el médico del hotel, llega con el ingeniero jubilado, el profesor Waldman. A ninguno le gusta el olor a cables calientes. La Criatura encuentra la página que faltaba del registro debajo de un cubo. El ascensor fue a «E-309» a las 20:06. Se abrieron las puertas de pasajeros y luego alguien cerró con llave la puerta del anexo desde fuera.","fr":"Victor Frankenstein, le médecin de l'hôtel, arrive avec l'ingénieur retraité, le professeur Waldman. Aucun des deux n'aime l'odeur des fils chauds. La Créature trouve la page manquante du registre sous une poubelle. L'ascenseur est allé à « E-309 » à 20:06. Les portes se sont ouvertes, puis quelqu'un a fermé à clé la porte de l'annexe de l'extérieur.","it":"Victor Frankenstein, il medico dell'hotel, arriva con l'ingegnere in pensione, il professor Waldman. A nessuno dei due piace l'odore dei fili caldi. La Creatura trova sotto un bidone la pagina mancante del registro. L'ascensore è andato a «E-309» alle 20:06. Le porte si sono aperte, poi qualcuno ha chiuso a chiave la porta dell'annesso dall'esterno.","ja":"ホテルの医師ヴィクター・フランケンシュタインが、引退した技師のヴァルトマン教授と一緒に来る。二人とも熱い電線のにおいが嫌いだ。クリーチャーがゴミ箱の下から記録簿のなくなったページを見つける。エレベーターは 20:06 に「E-309」へ行った。乗客用のドアが開き、それから誰かが別館のドアを外から施錠した。","pt":"Victor Frankenstein, o médico do hotel, chega com o engenheiro reformado, o professor Waldman. Nenhum dos dois gosta do cheiro a fios quentes. A Criatura encontra debaixo de um caixote a página que faltava do registo. O elevador foi para «E-309» às 20:06. As portas abriram-se e depois alguém trancou a porta do anexo por fora.","ru":"Виктор Франкенштейн, врач отеля, приходит с инженером на пенсии профессором Вальдманом. Обоим не нравится запах горячих проводов. Существо находит пропавшую страницу журнала под мусорным баком. Лифт поехал на «E-309» в 20:06. Двери открылись, а потом кто-то запер дверь флигеля снаружи.","zh":"酒店医生维克多·弗兰肯斯坦和退休工程师瓦尔德曼教授一起来了。两人都不喜欢热电线的气味。怪物在一个垃圾桶下面找到了日志缺失的那一页。电梯在 20:06 去了\"E-309\"。乘客门开了，然后有人从外面锁上了附楼的门。"},{"en":"Zombito explains his own movements: he started repairing the panel at 19:00 and was still working there when the alarm rang at 20:05. Jax and the Creature were with him.","ar":"يشرح زومبيتو تحركاته: بدأ إصلاح اللوحة عند 19:00 وكان لا يزال يعمل هناك عندما رنّ الإنذار عند 20:05. كان جاكس والمخلوق معه.","de":"Zombito erklärt, was er selbst gemacht hat: Er begann um 19:00, die Schalttafel zu reparieren, und arbeitete dort immer noch, als um 20:05 der Alarm losging. Jax und die Kreatur waren bei ihm.","es":"Zombito explica sus propios movimientos: empezó a reparar el panel a las 19:00 y seguía trabajando allí cuando sonó la alarma a las 20:05. Jax y la Criatura estaban con él.","fr":"Zombito explique ce qu'il faisait : il a commencé à réparer le panneau à 19:00 et y travaillait encore quand l'alarme a sonné à 20:05. Jax et la Créature étaient avec lui.","it":"Zombito spiega i propri movimenti: ha iniziato a riparare il pannello alle 19:00 e ci stava ancora lavorando quando l'allarme è suonato alle 20:05. Jax e la Creatura erano con lui.","ja":"ゾンビトは自分の行動を説明する。19:00 にパネルの修理を始め、20:05 に警報が鳴ったときもまだそこで作業していた。ジャックスとクリーチャーも一緒にいた。","pt":"Zombito explica os seus próprios movimentos: começou a reparar o painel às 19:00 e ainda estava lá a trabalhar quando o alarme tocou às 20:05. Jax e a Criatura estavam com ele.","ru":"Зомбито рассказывает, что делал сам: он начал чинить панель в 19:00 и всё ещё работал там, когда в 20:05 прозвучала тревога. Джакс и Существо были с ним.","zh":"僵尸托说明了自己的行踪：他 19:00 开始修理控制面板，20:05 警报响起时还在那里干活。贾克斯和怪物都和他在一起。"}],"prompt":{"en":"Look back from the alarm, then describe what was in progress: “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","ar":"انظر إلى الوراء من لحظة الإنذار، ثم صف ما كان جاريًا: “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","de":"Schau vom Alarm aus zurück und beschreibe dann, was gerade im Gange war: “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","es":"Mira atrás desde la alarma y luego describe lo que estaba en curso: “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","fr":"Regarde en arrière depuis l'alarme, puis décris ce qui était en cours : “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","it":"Guarda indietro dall'allarme, poi descrivi cosa era in corso: “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","ja":"警報の時点から振り返り、そのとき進行中だったことを表そう：“Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","pt":"Olhe para trás a partir do alarme e depois descreva o que estava em curso: “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","ru":"Посмотри назад от момента тревоги, а потом опиши, что происходило: “Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”","zh":"从警报响起的时刻回头看，再描述当时正在进行的事：“Zombito ___ for over an hour when the alarm rang. At that moment, he ___ the panel.”"},"opts":[{"en":"repaired / has checked"},{"en":"had been repairing / was checking"},{"en":"has been repairing / is checking"},{"en":"was repairing / had checked"}],"answer":1,"points":5,"fb":[{"en":"REPAIRED does not measure \"for over an hour\", and HAS CHECKED links to now, not to the alarm.","ar":"REPAIRED لا تقيس \"for over an hour\"، وHAS CHECKED ترتبط بالآن لا بالإنذار.","de":"REPAIRED misst nicht \"for over an hour\", und HAS CHECKED verbindet mit dem Jetzt, nicht mit dem Alarm.","es":"REPAIRED no mide \"for over an hour\", y HAS CHECKED conecta con el ahora, no con la alarma.","fr":"REPAIRED ne mesure pas \"for over an hour\", et HAS CHECKED renvoie à maintenant, pas à l'alarme.","it":"REPAIRED non misura \"for over an hour\", e HAS CHECKED si collega al presente, non all'allarme.","ja":"REPAIRED では \"for over an hour\" を測れず、HAS CHECKED は警報ではなく今とつながる。","pt":"REPAIRED não mede \"for over an hour\", e HAS CHECKED liga-se ao agora, não ao alarme.","ru":"REPAIRED не измеряет \"for over an hour\", а HAS CHECKED связано с настоящим, а не с тревогой.","zh":"REPAIRED 衡量不了 \"for over an hour\"，HAS CHECKED 与现在相连，而不是与警报相连。"},{"en":"Activity up to a past event: ZOMBITO + HAD BEEN REPAIRING. In progress at that moment: HE + WAS CHECKING.","ar":"نشاط حتى حدث في الماضي: ZOMBITO + HAD BEEN REPAIRING. جارٍ في تلك اللحظة: HE + WAS CHECKING.","de":"Tätigkeit bis zu einem Ereignis in der Vergangenheit: ZOMBITO + HAD BEEN REPAIRING. In diesem Moment im Gange: HE + WAS CHECKING.","es":"Actividad hasta un hecho pasado: ZOMBITO + HAD BEEN REPAIRING. En curso en ese momento: HE + WAS CHECKING.","fr":"Activité jusqu'à un événement passé : ZOMBITO + HAD BEEN REPAIRING. En cours à ce moment-là : HE + WAS CHECKING.","it":"Attività fino a un evento passato: ZOMBITO + HAD BEEN REPAIRING. In corso in quel momento: HE + WAS CHECKING.","ja":"過去の出来事まで続いた活動：ZOMBITO + HAD BEEN REPAIRING。その瞬間に進行中：HE + WAS CHECKING。","pt":"Atividade até um acontecimento passado: ZOMBITO + HAD BEEN REPAIRING. Em curso nesse momento: HE + WAS CHECKING.","ru":"Действие до прошлого события: ZOMBITO + HAD BEEN REPAIRING. В процессе в тот момент: HE + WAS CHECKING.","zh":"持续到一个过去事件的活动：ZOMBITO + HAD BEEN REPAIRING。那一刻正在进行：HE + WAS CHECKING。"},{"en":"These forms look from now. Our point of view is the alarm at 20:05, in the past.","ar":"هذه الصيغ تنظر من الآن. نقطة نظرنا هي إنذار 20:05، في الماضي.","de":"Diese Formen schauen vom Jetzt aus. Unser Blickpunkt ist der Alarm um 20:05, in der Vergangenheit.","es":"Estas formas miran desde el ahora. Nuestro punto de vista es la alarma de las 20:05, en el pasado.","fr":"Ces formes regardent depuis maintenant. Notre point de vue est l'alarme de 20:05, dans le passé.","it":"Queste forme guardano dal presente. Il nostro punto di vista è l'allarme delle 20:05, nel passato.","ja":"これらの形は今から見ている。私たちの視点は、過去の 20:05 の警報だ。","pt":"Estas formas olham a partir do agora. O nosso ponto de vista é o alarme das 20:05, no passado.","ru":"Эти формы смотрят из настоящего. Наша точка обзора — тревога в 20:05, в прошлом.","zh":"这些形式是从现在看。我们的视角是过去 20:05 的警报。"},{"en":"HAD CHECKED says the checking was already finished, but he was still doing it.","ar":"HAD CHECKED تقول إن الفحص كان قد انتهى، لكنه كان لا يزال يقوم به.","de":"HAD CHECKED sagt, dass das Prüfen schon fertig war, aber er war noch dabei.","es":"HAD CHECKED dice que la revisión ya había terminado, pero él seguía haciéndola.","fr":"HAD CHECKED dit que la vérification était déjà finie, mais il était encore en train de la faire.","it":"HAD CHECKED dice che il controllo era già finito, ma lui lo stava ancora facendo.","ja":"HAD CHECKED だと点検はもう終わっていたことになるが、彼はまだ点検していた。","pt":"HAD CHECKED diz que a verificação já tinha acabado, mas ele ainda a estava a fazer.","ru":"HAD CHECKED говорит, что проверка уже закончилась, а он всё ещё её вёл.","zh":"HAD CHECKED 表示检查已经结束了，但他当时还在检查。"}],"next":"p10","relic":true,"fbRight":{"en":"NOTEBOOK · THE TORN LIFT LOG. The lift reached E-309 at 20:06. Zombito was repairing the panel with two witnesses when the alarm rang.","ar":"الدفتر · سجل المصعد الممزق. وصل المصعد إلى E-309 عند 20:06. كان زومبيتو يصلح اللوحة أمام شاهدين عندما رنّ الإنذار.","de":"NOTIZBUCH · DAS ZERRISSENE AUFZUGSLOGBUCH. Der Aufzug erreichte E-309 um 20:06. Zombito reparierte mit zwei Zeugen die Schalttafel, als der Alarm losging.","es":"CUADERNO · EL REGISTRO ROTO DEL ASCENSOR. El ascensor llegó a ou a E-309 às 20:06. Zombito estava a reparar o painel com duas testemunhas quando o alarme tocou.","ru":"БЛОКНОТ · ВЫРВАННАЯ СТРАНИЦА ЖУРНАЛА ЛИФТА. Лифт прибыл на E-309 в 20:06. Зомбито чинил панель при двух свидетелях, когда прозвучала тревога.","zh":"笔记本 · 被撕掉的电梯日志。电梯在 20:06 到达 E-309。警报响起时，僵尸托正当着两名证人的面修理面板。"},"img":"15_log.webp","hot":[51,85,14,10],"pos":"right","v":"center","width":34},"p10":{"kind":"question","k":{"en":"ACT I · 21:00 · THE STAFF STAIR","ar":"الفصل الأول · 21:00 · درج الموظفين","de":"AKT I · 21:00 · DIE PERSONALTREPPE","es":"ACTO I · 21:00 · LA ESCALERA DEL PERSONAL","fr":"ACTE I · 21:00 · L'ESCALIER DU PERSONNEL","it":"ATTO I · 21:00 · LA SCALA DEL PERSONALE","ja":"第1幕 · 21:00 · スタッフ用階段","pt":"ATO I · 21:00 · A ESCADA DO PESSOAL","ru":"АКТ I · 21:00 · ЛЕСТНИЦА ДЛЯ ПЕРСОНАЛА","zh":"第一幕 · 21:00 · 员工楼梯"},"title":{"en":"Which witness gets your trust?","ar":"أي شاهدة تكسب ثقتك؟","de":"Welche Zeugin bekommt dein Vertrauen?","es":"¿Qué testigo se gana tu confianza?","fr":"Quel témoin gagne ta confiance ?","it":"Quale testimone si guadagna la tua fiducia?","ja":"どちらの証人を信じる？","pt":"Que testemunha ganha a sua confiança?","ru":"Какой свидетельнице ты доверишься?","zh":"哪位证人能赢得你的信任？"},"story":[{"en":"Zombiella says Andreas paid her to keep singing until 20:15, even if the lights failed. She thought it was a strange joke. Alice admits she copied an old annex key for him yesterday because he claimed the Count had asked for it. Both are frightened of losing their jobs. Both could help you.","ar":"تقول زومبيلا إن أندرياس دفع لها لتواصل الغناء حتى 20:15، حتى لو انطفأت الأضواء. ظنّت أنها مزحة غريبة. تعترف أليس بأنها نسخت له أمس مفتاحًا قديمًا للملحق، لأنه ادّعى أن الكونت طلبه. كلتاهما تخاف من فقدان عملها. كلتاهما تستطيع مساعدتك.","de":"Zombiella sagt, Andreas habe sie bezahlt, damit sie bis 20:15 weitersingt, auch wenn das Licht ausfällt. Sie hielt es für einen seltsamen Scherz. Alice gibt zu, dass sie ihm gestern einen alten Schlüssel zum Anbau nachgemacht hat, weil er behauptete, der Graf habe darum gebeten. Beide haben Angst, ihre Stelle zu verlieren. Beide könnten dir helfen.","es":"Zombiella dice que Andreas le pagó para seguir cantando hasta las 20:15, aunque fallaran las luces. Ella creyó que era una broma rara. Alice admite que ayer le copió una vieja llave del anexo porque él dijo que el conde se la había pedido. Las dos temen perder su trabajo. Las dos podrían ayudarte.","fr":"Zombiella dit qu'Andreas l'a payée pour continuer à chanter jusqu'à 20:15, même si les lumières s'éteignaient. Elle a cru à une drôle de plaisanterie. Alice avoue lui avoir copié hier une vieille clé de l'annexe, parce qu'il prétendait que le comte l'avait demandée. Toutes les deux ont peur de perdre leur emploi. Toutes les deux pourraient t'aider.","it":"Zombiella dice che Andreas l'ha pagata per continuare a cantare fino alle 20:15, anche se le luci si fossero spente. Lei ha pensato a uno strano scherzo. Alice ammette di avergli copiato ieri una vecchia chiave dell'annesso, perché lui diceva che gliel'aveva chiesta il conte. Entrambe hanno paura di perdere il lavoro. Entrambe potrebbero aiutarti.","ja":"ゾンビエラは、明かりが消えても 20:15 まで歌い続けるようアンドレアスにお金をもらったと言う。彼女は変な冗談だと思っていた。アリスは、伯爵に頼まれたと彼が言ったので、昨日別館の古い鍵を彼のために複製したと認める。二人とも仕事を失うのを恐れている。二人ともあなたの助けになりうる。","pt":"Zombiella diz que Andreas lhe pagou para continuar a cantar até às 20:15, mesmo que as luzes falhassem. Ela achou que era uma brincadeira estranha. Alice admite que ontem lhe copiou uma velha chave do anexo, porque ele disse que o conde a tinha pedido. As duas têm medo de perder o emprego. As duas podem ajudá-lo.","ru":"Зомбиэлла говорит, что Андреас заплатил ей, чтобы она пела до 20:15, даже если погаснет свет. Она решила, что это странная шутка. Алиса признаётся, что вчера сделала для него копию старого ключа от флигеля, потому что он сказал, что об этом попросил граф. Обе боятся потерять работу. Обе могут тебе помочь.","zh":"僵尸艾拉说安德烈亚斯付钱让她一直唱到 20:15，就算灯灭了也要唱。她以为那是个奇怪的玩笑。爱丽丝承认她昨天替他复制了一把旧的附楼钥匙，因为他说是伯爵要的。两人都害怕丢掉工作。两人都可能帮到你。"},{"en":"You can ask Zombiella to search for the payment receipt, or ask Alice to trace the copied key. Your partner will bring a different piece of supporting evidence later.","ar":"يمكنك أن تطلب من زومبيلا البحث عن إيصال الدفع، أو من أليس تتبّع المفتاح المنسوخ. ستحضر شريكتك لاحقًا دليلًا آخر.","de":"Du kannst Zombiella bitten, die Quittung der Zahlung zu suchen, oder Alice, den nachgemachten Schlüssel zurückzuverfolgen. Deine Partnerin bringt später ein anderes Beweisstück.","es":"Puedes pedir a Zombiella que busque el recibo del pago, o a Alice que siga la pista de la llave copiada. Tu compañera traerá más tarde otra prueba de apoyo.","fr":"Tu peux demander à Zombiella de chercher le reçu du paiement, ou à Alice de retrouver la trace de la clé copiée. Ta partenaire apportera plus tard une autre preuve.","it":"Puoi chiedere a Zombiella di cercare la ricevuta del pagamento, oppure ad Alice di rintracciare la chiave copiata. La tua compagna porterà più tardi un'altra prova.","ja":"ゾンビエラに支払いの領収書を探してもらうか、アリスに複製した鍵をたどってもらうかを選べる。パートナーは後で別の証拠を持ってくる。","pt":"Pode pedir a Zombiella que procure o recibo do pagamento, ou a Alice que siga o rasto da chave copiada. A sua parceira trará mais tarde outra prova.","ru":"Можешь попросить Зомбиэллу найти квитанцию об оплате или Алису — проследить скопированный ключ. Твоя напарница позже принесёт другую улику.","zh":"你可以请僵尸艾拉去找付款收据，或者请爱丽丝去追查那把复制的钥匙。你的搭档稍后会带来另一份证据。"}],"prompt":{"en":"Contrast a finished mistake with a problem that remains: “Alice ___ the key yesterday. Since then, she ___ unable to stop worrying.”","ar":"قارن بين خطأ منتهٍ ومشكلة باقية: “Alice ___ the key yesterday. Since then, she ___ unable to stop worrying.”","de":"Stelle einen abgeschlossenen Fehler einem Problem gegenüber, das bleibt: “Alice ___ the key yesterday. Since then, she ___ unable to stop worrying.”","es":"Contrasta un error terminado con un problema que sigue: “Alice ___ the key yesterday. Since then, she ___ unable to s
