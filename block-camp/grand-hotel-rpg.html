da y con fecha: THEY + WENT.","fr":"Expérience jusqu'à maintenant : THE SISTERS + HAVE VISITED. Une visite terminée et datée : THEY + WENT.","it":"Esperienza fino a ora: THE SISTERS + HAVE VISITED. Una visita conclusa e datata: THEY + WENT.","ja":"今までの経験：THE SISTERS + HAVE VISITED。日付のある一回の完了した訪問：THEY + WENT。","pt":"Experiência até agora: THE SISTERS + HAVE VISITED. Uma visita terminada e com data: THEY + WENT.","ru":"Опыт до настоящего момента: THE SISTERS + HAVE VISITED. Один законченный визит с датой: THEY + WENT.","zh":"到现在为止的经历：THE SISTERS + HAVE VISITED。一次已结束、有日期的拜访：THEY + WENT。"},{"en":"HAVE GONE does not go with the finished time \"last Tuesday\".","ar":"HAVE GONE لا تأتي مع الوقت المنتهي \"last Tuesday\".","de":"HAVE GONE passt nicht zur abgeschlossenen Zeit \"last Tuesday\".","es":"HAVE GONE no va con el tiempo terminado \"last Tuesday\".","fr":"HAVE GONE ne va pas avec le temps terminé \"last Tuesday\".","it":"HAVE GONE non va con il tempo concluso \"last Tuesday\".","ja":"HAVE GONE は終わった時 \"last Tuesday\" と一緒に使えない。","pt":"HAVE GONE não combina com o tempo terminado \"last Tuesday\".","ru":"HAVE GONE не сочетается с законченным временем \"last Tuesday\".","zh":"HAVE GONE 不能和已结束的时间 \"last Tuesday\" 连用。"}],"next":"p12","img":"07_garden.webp","hot":[93,76,8,16],"pos":"left","v":"center"},"p12":{"kind":"question","k":{"en":"ACT II · 21:20 · THE LAKESIDE BOATHOUSE","ar":"الفصل الثاني · 21:20 · مرفأ القوارب على البحيرة","de":"AKT II · 21:20 · DAS BOOTSHAUS AM SEE","es":"ACTO II · 21:20 · EL COBERTIZO DE BARCOS DEL LAGO","fr":"ACTE II · 21:20 · LE HANGAR À BATEAUX DU LAC","it":"ATTO II · 21:20 · LA RIMESSA DELLE BARCHE SUL LAGO","ja":"第2幕 · 21:20 · 湖畔のボートハウス","pt":"ATO II · 21:20 · O ABRIGO DE BARCOS DO LAGO","ru":"АКТ II · 21:20 · ЛОДОЧНЫЙ САРАЙ НА ОЗЕРЕ","zh":"第二幕 · 21:20 · 湖边船屋"},"title":{"en":"A light below the waterline","ar":"ضوء تحت خط الماء","de":"Ein Licht unter der Wasserlinie","es":"Una luz bajo la línea del agua","fr":"Une lumière sous la ligne de flottaison","it":"Una luce sotto la linea dell'acqua","ja":"水面下の光","pt":"Uma luz abaixo da linha de água","ru":"Свет под ватерлинией","zh":"水线下的光"},"story":[{"en":"Nemo runs the hotel’s lake boats. Professor Aronnax is studying the water; Nadia, Mara and Lia maintain his instruments. Nadia’s sensor shows the annex heating has stopped. Someone could be trapped in a room that is getting colder every minute. Mara has repaired the emergency boat engine. Lia is still searching for its spare battery.","ar":"يدير نيمو قوارب البحيرة في الفندق. البروفيسور أروناكس يدرس الماء، ونادية ومارا وليا تعتني بأجهزته. يُظهر حساس نادية أن تدفئة الملحق توقفت. قد يكون أحدهم محبوسًا في غرفة تزداد برودة كل دقيقة. أصلحت مارا محرك قارب الطوارئ. ليا ما زالت تبحث عن بطاريته الاحتياطية.","de":"Nemo betreibt die Seeboote des Hotels. Professor Aronnax untersucht das Wasser; Nadia, Mara und Lia warten seine Instrumente. Nadias Sensor zeigt, dass die Heizung im Anbau ausgefallen ist. Jemand könnte in einem Raum eingeschlossen sein, der jede Minute kälter wird. Mara hat den Motor des Notboots repariert. Lia sucht immer noch nach seiner Ersatzbatterie.","es":"Nemo lleva las barcas del lago del hotel. El profesor Aronnax estudia el agua; Nadia, Mara y Lia mantienen sus instrumentos. El sensor de Nadia muestra que la calefacción del anexo se ha parado. Alguien podría estar atrapado en una habitación que se enfría cada minuto. Mara ha reparado el motor de la barca de emergencia. Lia sigue buscando su batería de repuesto.","fr":"Nemo s'occupe des bateaux du lac de l'hôtel. Le professeur Aronnax étudie l'eau ; Nadia, Mara et Lia entretiennent ses instruments. Le capteur de Nadia montre que le chauffage de l'annexe s'est arrêté. Quelqu'un pourrait être enfermé dans une pièce qui refroidit de minute en minute. Mara a réparé le moteur du bateau de secours. Lia cherche encore sa batterie de rechange.","it":"Nemo gestisce le barche del lago dell'hotel. Il professor Aronnax studia l'acqua; Nadia, Mara e Lia curano i suoi strumenti. Il sensore di Nadia mostra che il riscaldamento dell'annesso si è fermato. Qualcuno potrebbe essere intrappolato in una stanza che diventa più fredda ogni minuto. Mara ha riparato il motore della barca di emergenza. Lia sta ancora cercando la sua batteria di riserva.","ja":"ネモはホテルの湖のボートを管理している。アロナックス教授は湖の水を研究し、ナディア、マーラ、リアがその機器の手入れをしている。ナディアのセンサーは、別館の暖房が止まったことを示している。一分ごとに寒くなっていく部屋に、誰かが閉じ込められているかもしれない。マーラは救命ボートのエンジンを修理した。リアはまだ予備のバッテリーを探している。","pt":"Nemo trata dos barcos do lago do hotel. O professor Aronnax estuda a água; Nadia, Mara e Lia mantêm os seus instrumentos. O sensor de Nadia mostra que o aquecimento do anexo parou. Alguém pode estar preso num quarto que arrefece a cada minuto. Mara reparou o motor do barco de emergência. Lia ainda está à procura da bateria de reserva.","ru":"Немо заведует лодками отеля на озере. Профессор Аронакс изучает воду; Надя, Мара и Лия обслуживают его приборы. Датчик Нади показывает, что отопление во флигеле отключилось. Кто-то может быть заперт в комнате, которая с каждой минутой остывает. Мара починила мотор спасательной лодки. Лия всё ещё ищет для него запасной аккумулятор.","zh":"尼莫负责酒店的湖上船只。阿龙纳斯教授在研究湖水；娜迪娅、玛拉和莉亚维护他的仪器。娜迪娅的传感器显示附楼的暖气停了。也许有人被困在一个每分钟都在变冷的房间里。玛拉已经修好了救生艇的发动机。莉亚还在找它的备用电池。"},{"en":"Through the rain, you see three flashes from a low window. Then three more. Someone is asking for help.","ar":"عبر المطر ترى ثلاث ومضات من نافذة منخفضة. ثم ثلاثًا أخرى. أحدهم يطلب النجدة.","de":"Durch den Regen siehst du drei Lichtblitze aus einem tiefen Fenster. Dann noch drei. Jemand bittet um Hilfe.","es":"A través de la lluvia ves tres destellos desde una ventana baja. Luego tres más. Alguien está pidiendo ayuda.","fr":"À travers la pluie, tu vois trois éclairs venant d'une fenêtre basse. Puis trois autres. Quelqu'un appelle à l'aide.","it":"Attraverso la pioggia vedi tre lampi da una finestra bassa. Poi altri tre. Qualcuno sta chiedendo aiuto.","ja":"雨の向こうに、低い窓から三回の光が見える。そしてもう三回。誰かが助けを求めている。","pt":"Através da chuva, vê três clarões de uma janela baixa. Depois mais três. Alguém está a pedir ajuda.","ru":"Сквозь дождь ты видишь три вспышки в низком окне. Потом ещё три. Кто-то зовёт на помощь.","zh":"透过雨幕，你看见一扇低处的窗户闪了三下。又闪了三下。有人在求救。"}],"prompt":{"en":"Choose the completed repair and the unfinished search: “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","ar":"اختر الإصلاح المنتهي والبحث غير المنتهي: “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","de":"Wähle die fertige Reparatur und die unfertige Suche: “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","es":"Elige la reparación terminada y la búsqueda sin terminar: “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","fr":"Choisis la réparation terminée et la recherche inachevée : “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","it":"Scegli la riparazione conclusa e la ricerca non finita: “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","ja":"完了した修理と、まだ終わっていない捜索を選ぼう：“Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","pt":"Escolha a reparação terminada e a busca por terminar: “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","ru":"Выбери законченный ремонт и незаконченный поиск: “Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”","zh":"选出已完成的修理和尚未结束的寻找：“Mara ___ the engine; it works now. Lia ___ for the battery for twenty minutes and is still looking.”"},"opts":[{"en":"has been repairing / has found"},{"en":"was repairing / had searched"},{"en":"has repaired / has been searching"},{"en":"repairs / searched"}],"answer":2,"points":5,"fb":[{"en":"HAS BEEN REPAIRING does not say the repair is done, and HAS FOUND says the search succeeded.","ar":"HAS BEEN REPAIRING لا تقول إن الإصلاح تمّ، وHAS FOUND تقول إن البحث نجح.","de":"HAS BEEN REPAIRING sagt nicht, dass die Reparatur fertig ist, und HAS FOUND sagt, dass die Suche Erfolg hatte.","es":"HAS BEEN REPAIRING no dice que la reparación esté hecha, y HAS FOUND dice que la búsqueda tuvo éxito.","fr":"HAS BEEN REPAIRING ne dit pas que la réparation est faite, et HAS FOUND dit que la recherche a réussi.","it":"HAS BEEN REPAIRING non dice che la riparazione è fatta, e HAS FOUND dice che la ricerca è riuscita.","ja":"HAS BEEN REPAIRING では修理が済んだことにならず、HAS FOUND だと捜索が成功したことになる。","pt":"HAS BEEN REPAIRING não diz que a reparação está feita, e HAS FOUND diz que a busca teve êxito.","ru":"HAS BEEN REPAIRING не говорит, что ремонт закончен, а HAS FOUND говорит, что поиск удался.","zh":"HAS BEEN REPAIRING 没说修理已经完成，HAS FOUND 表示已经找到了。"},{"en":"WAS REPAIRING leaves the repair in the past and unfinished, but the search is still going on now.","ar":"WAS REPAIRING تترك الإصلاح غير منتهٍ في الماضي، لكن البحث ما زال مستمرًا الآن.","de":"WAS REPAIRING lässt die Reparatur unfertig in der Vergangenheit, aber die Suche läuft jetzt noch.","es":"WAS REPAIRING deja la reparación en el pasado y sin terminar, pero la búsqueda sigue ahora.","fr":"WAS REPAIRING laisse la réparation inachevée dans le passé, mais la recherche continue maintenant.","it":"WAS REPAIRING lascia la riparazione nel passato e non finita, ma la ricerca continua ancora ora.","ja":"WAS REPAIRING だと修理は過去の未完了のままだが、捜索は今も続いている。","pt":"WAS REPAIRING deixa a reparação no passado e por terminar, mas a busca ainda continua agora.","ru":"WAS REPAIRING оставляет ремонт незаконченным в прошлом, а поиск продолжается и сейчас.","zh":"WAS REPAIRING 把修理留在过去而且没完成，但寻找现在还在继续。"},{"en":"A finished result: MARA + HAS REPAIRED. Effort that goes on to now: LIA + HAS BEEN SEARCHING.","ar":"نتيجة منتهية: MARA + HAS REPAIRED. جهد مستمر حتى الآن: LIA + HAS BEEN SEARCHING.","de":"Ein fertiges Ergebnis: MARA + HAS REPAIRED. Mühe, die bis jetzt andauert: LIA + HAS BEEN SEARCHING.","es":"Un resultado terminado: MARA + HAS REPAIRED. Un esfuerzo que llega hasta ahora: LIA + HAS BEEN SEARCHING.","fr":"Un résultat terminé : MARA + HAS REPAIRED. Un effort qui dure jusqu'à maintenant : LIA + HAS BEEN SEARCHING.","it":"Un risultato concluso: MARA + HAS REPAIRED. Uno sforzo che continua fino a ora: LIA + HAS BEEN SEARCHING.","ja":"完了した結果：MARA + HAS REPAIRED。今まで続く努力：LIA + HAS BEEN SEARCHING。","pt":"Um resultado terminado: MARA + HAS REPAIRED. Um esforço que continua até agora: LIA + HAS BEEN SEARCHING.","ru":"Законченный результат: MARA + HAS REPAIRED. Усилие, которое длится до сих пор: LIA + HAS BEEN SEARCHING.","zh":"已完成的结果：MARA + HAS REPAIRED。持续到现在的努力：LIA + HAS BEEN SEARCHING。"},{"en":"REPAIRS is a routine, and SEARCHED says the search is over.","ar":"REPAIRS روتين، وSEARCHED تقول إن البحث انتهى.","de":"REPAIRS ist eine Routine, und SEARCHED sagt, dass die Suche vorbei ist.","es":"REPAIRS es una rutina, y SEARCHED dice que la búsqueda ha terminado.","fr":"REPAIRS est une routine, et SEARCHED dit que la recherche est finie.","it":"REPAIRS è una routine, e SEARCHED dice che la ricerca è finita.","ja":"REPAIRS は習慣で、SEARCHED だと捜索は終わったことになる。","pt":"REPAIRS é uma rotina, e SEARCHED diz que a busca acabou.","ru":"REPAIRS — привычное действие, а SEARCHED говорит, что поиск окончен.","zh":"REPAIRS 是日常，SEARCHED 表示寻找已经结束。"}],"next":"p13","img":"08_boathouse.webp","hot":[50,67,14,14],"pos":"right","v":"center","width":34},"p13":{"kind":"question","k":{"en":"ACT II · 21:30 · THE OLD BOATHOUSE LANDING","ar":"الفصل الثاني · 21:30 · رصيف القوارب القديم","de":"AKT II · 21:30 · DER ALTE BOOTSSTEG","es":"ACTO II · 21:30 · EL VIEJO EMBARCADERO","fr":"ACTE II · 21:30 · LE VIEUX PONTON","it":"ATTO II · 21:30 · IL VECCHIO PONTILE","ja":"第2幕 · 21:30 · 古いボート桟橋","pt":"ATO II · 21:30 · O VELHO CAIS","ru":"АКТ II · 21:30 · СТАРАЯ ПРИСТАНЬ","zh":"第二幕 · 21:30 · 旧船坞码头"},"title":{"en":"The hotel’s “ghosts”","ar":"«أشباح» الفندق","de":"Die „Gespenster“ des Hotels","es":"Los «fantasmas» del hotel","fr":"Les « fantômes » de l'hôtel","it":"I «fantasmi» dell'hotel","ja":"ホテルの「幽霊」","pt":"Os «fantasmas» do hotel","ru":"«Призраки» отеля","zh":"酒店里的\"鬼\""},"story":[{"en":"Angus Tulloch, the boatman, and Dr Vass, the lake biologist, have brought guests in from the storm. Harbour officer Brannan is checking their names. Kirsty and Ewan Sinclair carry blankets while Sandy Weir ties up the boats. “White shapes in the annex!” Sinclair says. “Ghosts!”","ar":"أحضر أنغوس تالوك، صاحب القارب، والدكتورة فاس، عالمة أحياء البحيرة، الضيوف من العاصفة. ضابط الميناء براننان يراجع أسماءهم. كيرستي وإيوان سنكلير يحملان البطانيات بينما يربط ساندي وير القوارب. يقول سنكلير: «أشكال بيضاء في الملحق! أشباح!»","de":"Angus Tulloch, der Bootsmann, und Dr. Vass, die Seebiologin, haben Gäste aus dem Sturm hereingeholt. Hafenmeister Brannan prüft ihre Namen. Kirsty und Ewan Sinclair tragen Decken, während Sandy Weir die Boote festmacht. „Weiße Gestalten im Anbau!“, sagt Sinclair. „Gespenster!“","es":"Angus Tulloch, el barquero, y la doctora Vass, la bióloga del lago, han traído a los huéspedes de la tormenta. El oficial del puerto Brannan comprueba sus nombres. Kirsty y Ewan Sinclair llevan mantas mientras Sandy Weir amarra las barcas. «¡Formas blancas en el anexo!», dice Sinclair. «¡Fantasmas!».","fr":"Angus Tulloch, le batelier, et la docteure Vass, la biologiste du lac, ont fait rentrer des clients sous la tempête. L'officier de port Brannan vérifie leurs noms. Kirsty et Ewan Sinclair portent des couvertures pendant que Sandy Weir amarre les bateaux. « Des formes blanches dans l'annexe ! dit Sinclair. Des fantômes ! »","it":"Angus Tulloch, il barcaiolo, e la dottoressa Vass, la biologa del lago, hanno portato dentro gli ospiti dalla tempesta. L'ufficiale del porto Brannan controlla i loro nomi. Kirsty ed Ewan Sinclair portano coperte mentre Sandy Weir ormeggia le barche. «Forme bianche nell'annesso!», dice Sinclair. «Fantasmi!».","ja":"船頭のアンガス・タロックと湖の生物学者ヴァス博士が、嵐の中から客を連れて入ってきた。港湾職員のブラナンが名前を確認している。カースティとユアン・シンクレアが毛布を運び、サンディ・ウィアがボートをつないでいる。「別館に白い影が！」とシンクレアが言う。「幽霊だ！」","pt":"Angus Tulloch, o barqueiro, e a Dra. Vass, a bióloga do lago, trouxeram hóspedes da tempestade. O oficial do porto Brannan verifica os nomes deles. Kirsty e Ewan Sinclair levam cobertores enquanto Sandy Weir amarra os barcos. «Formas brancas no anexo!», diz Sinclair. «Fantasmas!»","ru":"Ангус Таллох, лодочник, и доктор Васс, биолог озера, привели гостей с бури. Портовый офицер Браннан проверяет их имена. Кирсти и Юэн Синклер несут одеяла, а Сэнди Уир швартует лодки. «Белые фигуры во флигеле! — говорит Синклер. — Призраки!»","zh":"船夫安格斯·塔洛克和湖泊生物学家瓦斯博士把客人从暴风雪中接了进来。港务官布兰南在核对他们的名字。柯丝蒂和尤恩·辛克莱抱着毯子，桑迪·韦尔在系船。\"附楼里有白影！\"辛克莱说，\"是鬼！\""},{"en":"Vass holds up a bedsheet. Staff have been moving old linen through the tunnel. Tulloch heard someone knocking behind the archive door, but the music upstairs drowned it out. The Docherty brothers secure the landing. Davie counts arrivals with the visiting sergeant. The Lennox family confirm the annex heating failed.","ar":"ترفع فاس ملاءة سرير. كان الموظفون ينقلون البياضات القديمة عبر النفق. سمع تالوك أحدهم يطرق خلف باب الأرشيف، لكن الموسيقى في الأعلى غطّت الصوت. الأخوان دوهرتي يؤمّنان الرصيف. ديفي يعدّ القادمين مع الرقيب الزائر. وتؤكد عائلة لينوكس أن تدفئة الملحق تعطلت.","de":"Vass hält ein Bettlaken hoch. Das Personal hat alte Wäsche durch den Tunnel gebracht. Tulloch hörte jemanden hinter der Archivtür klopfen, aber die Musik oben übertönte es. Die Brüder Docherty sichern den Steg. Davie zählt mit dem Gastfeldwebel die Ankommenden. Die Familie Lennox bestätigt, dass die Heizung im Anbau ausgefallen ist.","es":"Vass levanta una sábana. El personal ha estado llevando ropa de cama vieja por el túnel. Tulloch oyó a alguien golpear detrás de la puerta del archivo, pero la música de arriba lo tapó. Los hermanos Docherty aseguran el embarcadero. Davie cuenta a los que llegan con el sargento visitante. La familia Lennox confirma que falló la calefacción del anexo.","fr":"Vass brandit un drap. Le personnel transporte du vieux linge par le tunnel. Tulloch a entendu quelqu'un frapper derrière la porte des archives, mais la musique d'en haut a tout couvert. Les frères Docherty sécurisent le ponton. Davie compte les arrivants avec le sergent de passage. La famille Lennox confirme que le chauffage de l'annexe est tombé en panne.","it":"Vass solleva un lenzuolo. Il personale ha portato vecchia biancheria attraverso il tunnel. Tulloch ha sentito qualcuno bussare dietro la porta dell'archivio, ma la musica al piano di sopra lo ha coperto. I fratelli Docherty mettono in sicurezza il pontile. Davie conta gli arrivi con il sergente in visita. La famiglia Lennox conferma che il riscaldamento dell'annesso si è guastato.","ja":"ヴァスがシーツを掲げる。スタッフがトンネルを通って古いリネンを運んでいたのだ。タロックは記録室のドアの向こうで誰かがノックする音を聞いたが、上の階の音楽にかき消された。ドハティ兄弟が桟橋を固める。デイヴィーは訪れていた巡査部長と一緒に到着した人を数える。レノックス一家は、別館の暖房が故障したと証言する。","pt":"Vass levanta um lençol. O pessoal tem andado a levar roupa de cama velha pelo túnel. Tulloch ouviu alguém bater atrás da porta do arquivo, mas a música lá em cima abafou o som. Os irmãos Docherty protegem o cais. Davie conta as chegadas com o sargento de visita. A família Lennox confirma que o aquecimento do anexo avariou.","ru":"Васс поднимает простыню. Персонал носил старое бельё через туннель. Таллох слышал, как кто-то стучит за дверью архива, но музыка наверху всё заглушила. Братья Догерти охраняют пристань. Дейви вместе с приезжим сержантом считает прибывших. Семья Леннокс подтверждает, что отопление во флигеле отказало.","zh":"瓦斯举起一条床单。员工们一直在通过隧道搬运旧床品。塔洛克听到档案室门后有人敲门，但楼上的音乐盖过了声音。多尔蒂兄弟守住码头。戴维和来访的警长一起清点到达的人。伦诺克斯一家证实附楼的暖气坏了。"}],"prompt":{"en":"Explain the apparently empty landing: “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","ar":"اشرح لماذا بدا الرصيف فارغًا: “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","de":"Erkläre den scheinbar leeren Steg: “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","es":"Explica por qué el embarcadero parecía vacío: “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","fr":"Explique pourquoi le ponton semblait vide : “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","it":"Spiega perché il pontile sembrava vuoto: “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","ja":"桟橋が空っぽに見えた理由を説明しよう：“When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","pt":"Explique porque é que o cais parecia vazio: “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","ru":"Объясни, почему пристань казалась пустой: “When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”","zh":"解释码头为什么看起来空无一人：“When Brannan reached the landing, Tulloch ___ the guests inside. While Brannan checked their names, Vass ___ blankets.”"},"opts":[{"en":"has taken / gives"},{"en":"was taking / had given"},{"en":"takes / has given"},{"en":"had taken / was giving"}],"answer":3,"points":5,"fb":[{"en":"HAS TAKEN looks from now, not from the moment Brannan arrived.","ar":"HAS TAKEN تنظر من الآن، لا من لحظة وصول براننان.","de":"HAS TAKEN schaut vom Jetzt aus, nicht von dem Moment, als Brannan ankam.","es":"HAS TAKEN mira desde el ahora, no desde el momento en que llegó Brannan.","fr":"HAS TAKEN regarde depuis maintenant, pas depuis le moment où Brannan est arrivé.","it":"HAS TAKEN guarda dal presente, non dal momento in cui è arrivato Brannan.","ja":"HAS TAKEN は今から見ていて、ブラナンが着いた瞬間からではない。","pt":"HAS TAKEN olha a partir do agora, não do momento em que Brannan chegou.","ru":"HAS TAKEN смотрит из настоящего, а не из момента, когда пришёл Браннан.","zh":"HAS TAKEN 是从现在看，而不是从布兰南到达的那一刻看。"},{"en":"The guests were already inside, so not WAS TAKING. Vass was in the middle of giving, so not HAD GIVEN.","ar":"كان الضيوف في الداخل بالفعل، لذلك ليس WAS TAKING. وكانت فاس في منتصف التوزيع، لذلك ليس HAD GIVEN.","de":"Die Gäste waren schon drinnen, also nicht WAS TAKING. Vass war mitten im Verteilen, also nicht HAD GIVEN.","es":"Los huéspedes ya estaban dentro, así que no WAS TAKING. Vass estaba repartiendo en ese momento, así que no HAD GIVEN.","fr":"Les clients étaient déjà à l'intérieur, donc pas WAS TAKING. Vass était en train de distribuer, donc pas HAD GIVEN.","it":"Gli ospiti erano già dentro, quindi non WAS TAKING. Vass stava distribuendo, quindi non HAD GIVEN.","ja":"客はもう中にいたので WAS TAKING ではない。ヴァスは配っている途中だったので HAD GIVEN ではない。","pt":"Os hóspedes já estavam lá dentro, por isso não WAS TAKING. Vass estava a meio de distribuir, por isso não HAD GIVEN.","ru":"Гости уже были внутри, поэтому не WAS TAKING. Васс как раз раздавала одеяла, поэтому не HAD GIVEN.","zh":"客人已经在里面了，所以不是 WAS TAKING。瓦斯正在分发，所以不是 HAD GIVEN。"},{"en":"Present forms cannot tell this past sequence.","ar":"صيغ المضارع لا تستطيع رواية هذا التسلسل الماضي.","de":"Gegenwartsformen können diese Abfolge in der Vergangenheit nicht erzählen.","es":"Las formas de presente no pueden contar esta secuencia pasada.","fr":"Les formes du présent ne peuvent pas raconter cette séquence passée.","it":"Le forme del presente non possono raccontare questa sequenza passata.","ja":"現在の形では、この過去の流れを語れない。","pt":"As formas do presente não conseguem contar esta sequência passada.","ru":"Формы настоящего не могут рассказать эту прошлую последовательность.","zh":"现在时的形式讲不了这个过去的顺序。"},{"en":"Before Brannan arrived: TULLOCH + HAD TAKEN. In progress while he checked: VASS + WAS GIVING.","ar":"قبل وصول براننان: TULLOCH + HAD TAKEN. جارٍ بينما كان يراجع: VASS + WAS GIVING.","de":"Bevor Brannan ankam: TULLOCH + HAD TAKEN. Im Gange, während er prüfte: VASS + WAS GIVING.","es":"Antes de que llegara Brannan: TULLOCH + HAD TAKEN. En curso mientras él comprobaba: VASS + WAS GIVING.","fr":"Avant l'arrivée de Brannan : TULLOCH + HAD TAKEN. En cours pendant qu'il vérifiait : VASS + WAS GIVING.","it":"Prima che arrivasse Brannan: TULLOCH + HAD TAKEN. In corso mentre lui controllava: VASS + WAS GIVING.","ja":"ブラナンが着く前：TULLOCH + HAD TAKEN。彼が確認している間に進行中：VASS + WAS GIVING。","pt":"Antes de Brannan chegar: TULLOCH + HAD TAKEN. Em curso enquanto ele verificava: VASS + WAS GIVING.","ru":"До прихода Браннана: TULLOCH + HAD TAKEN. В процессе, пока он проверял: VASS + WAS GIVING.","zh":"布兰南到达之前：TULLOCH + HAD TAKEN。他核对时正在进行：VASS + WAS GIVING。"}],"next":"p14","img":"17_landing.webp","hot":[92,74,8,16],"pos":"left","v":"center"},"p14":{"kind":"question","k":{"en":"ACT II · 21:40 · THE OLD PLAN CABINET","ar":"الفصل الثاني · 21:40 · خزانة المخططات القديمة","de":"AKT II · 21:40 · DER ALTE PLANSCHRANK","es":"ACTO II · 21:40 · EL VIEJO ARMARIO DE PLANOS","fr":"ACTE II · 21:40 · LA VIEILLE ARMOIRE À PLANS","it":"ATTO II · 21:40 · IL VECCHIO ARMADIO DEI PROGETTI","ja":"第2幕 · 21:40 · 古い図面棚","pt":"ATO II · 21:40 · O VELHO ARMÁRIO DAS PLANTAS","ru":"АКТ II · 21:40 · СТАРЫЙ ШКАФ С ЧЕРТЕЖАМИ","zh":"第二幕 · 21:40 · 旧图纸柜"},"title":{"en":"The floor that never vanished","ar":"الطابق الذي لم يختفِ أبدًا","de":"Das Stockwerk, das nie verschwand","es":"La planta que nunca desapareció","fr":"L'étage qui n'a jamais disparu","it":"Il piano che non è mai sparito","ja":"消えていなかった階","pt":"O andar que nunca desapareceu","ru":"Этаж, который никуда не исчезал","zh":"从未消失的楼层"},"story":[{"en":"Tensing opens a cabinet of old plans. Walton, the hotel’s retired transport captain, remembers the numbering. The annex once had three levels of its own. Its bottom room was 309. Renovations joined that level to the main hotel’s basement. The Clockmaker, who maintains the lobby clock, knows the tunnel. Mouse can reach its narrow latch.","ar":"يفتح تنسينغ خزانة مخططات قديمة. يتذكر والتون، قبطان النقل المتقاعد في الفندق، الترقيم. كان للملحق ذات يوم ثلاثة مستويات خاصة به. غرفته السفلى كانت 309. وصلت أعمال التجديد ذلك المستوى بقبو الفندق الرئيسي. صانع الساعات، الذي يعتني بساعة الردهة، يعرف النفق. ويستطيع ماوس الوصول إلى مزلاجه الضيق.","de":"Tensing öffnet einen Schrank mit alten Plänen. Walton, der pensionierte Transportkapitän des Hotels, erinnert sich an die Nummerierung. Der Anbau hatte einmal drei eigene Ebenen. Sein unterstes Zimmer war 309. Bei einem Umbau wurde diese Ebene mit dem Keller des Haupthauses verbunden. Der Uhrmacher, der die Uhr in der Lobby pflegt, kennt den Tunnel. Mouse kommt an den schmalen Riegel heran.","es":"Tensing abre un armario de planos viejos. Walton, el capitán de transporte jubilado del hotel, recuerda la numeración. El anexo tuvo una vez tres niveles propios. Su habitación de abajo era la 309. Unas reformas unieron ese nivel al sótano del hotel principal. El Relojero, que cuida el reloj del vestíbulo, conoce el túnel. Mouse alcanza su estrecho pestillo.","fr":"Tensing ouvre une armoire de vieux plans. Walton, l'ancien capitaine des transports de l'hôtel, se souvient de la numérotation. L'annexe avait autrefois trois niveaux à elle. Sa chambre du bas était la 309. Des travaux ont relié ce niveau au sous-sol de l'hôtel principal. L'Horloger, qui entretient l'horloge du hall, connaît le tunnel. Mouse peut atteindre son loquet étroit.","it":"Tensing apre un armadio di vecchi progetti. Walton, l'ex capitano dei trasporti dell'hotel, ricorda la numerazione. Un tempo l'annesso aveva tre livelli suoi. La sua stanza più in basso era la 309. Una ristrutturazione ha unito quel livello al seminterrato dell'hotel principale. L'Orologiaio, che cura l'orologio della hall, conosce il tunnel. Mouse riesce a raggiungere il suo stretto chiavistello.","ja":"テンジンが古い図面の棚を開ける。ホテルの元輸送隊長ウォルトンは部屋番号のつけ方を覚えている。別館にはかつて独自の三つの階があった。いちばん下の部屋が 309 だった。改装でその階は本館の地下とつながった。ロビーの時計の手入れをしている時計職人はトンネルを知っている。マウスならその細いかんぬきに手が届く。","pt":"Tensing abre um armário de plantas antigas. Walton, o antigo capitão de transportes do hotel, lembra-se da numeração. O anexo tinha antigamente três pisos próprios. O quarto mais em baixo era o 309. Umas obras ligaram esse piso à cave do hotel principal. O Relojoeiro, que cuida do relógio do átrio, conhece o túnel. Mouse consegue chegar ao seu trinco estreito.","ru":"Тенсинг открывает шкаф со старыми чертежами. Уолтон, бывший транспортный капитан отеля, помнит нумерацию. Когда-то у флигеля было три собственных уровня. Его нижний номер был 309. При перестройке этот уровень соединили с подвалом главного здания. Часовщик, который следит за часами в холле, знает туннель. Маус может дотянуться до его узкой задвижки.","zh":"丹增打开一个装着旧图纸的柜子。酒店退休的运输队长沃尔顿记得编号。附楼曾经有自己的三层。它最下面的房间就是 309。一次翻修把那一层和主楼的地下室连在了一起。负责大堂时钟的钟表匠认识那条隧道。老鼠够得着它那个窄窄的门闩。"},{"en":"“I used to deliver bags there,” Tensing says. “Dark tunnels don’t worry me. I’m used to working in them.”","ar":"يقول تنسينغ: «كنت أوصل الحقائب إلى هناك. الأنفاق المظلمة لا تقلقني. أنا معتاد على العمل فيها».","de":"„Früher habe ich dort Gepäck hingebracht“, sagt Tensing. „Dunkle Tunnel machen mir keine Sorgen. Ich bin es gewohnt, in ihnen zu arbeiten.“","es":"«Yo antes llevaba maletas allí», dice Tensing. «Los túneles oscuros no me preocupan. Estoy acostumbrado a trabajar en ellos».","fr":"« Avant, je livrais des bagages là-bas, dit Tensing. Les tunnels sombres ne m'inquiètent pas. J'ai l'habitude d'y travailler. »","it":"«Una volta portavo i bagagli laggiù», dice Tensing. «I tunnel bui non mi preoccupano. Sono abituato a lavorarci».","ja":"「昔はよくあそこへ荷物を運んだものだ」とテンジンは言う。「暗いトンネルは平気だ。中で働くのには慣れている」。","pt":"«Eu costumava levar malas para lá», diz Tensing. «Os túneis escuros não me preocupam. Estou habituado a trabalhar neles.»","ru":"«Раньше я носил туда багаж, — говорит Тенсинг. — Тёмные туннели меня не пугают. Я привык в них работать».","zh":"\"我以前常往那里送行李，\"丹增说，\"黑暗的隧道吓不倒我。我习惯在里面干活。\""}],"prompt":{"en":"Choose a past habit that ended, then something familiar now: “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","ar":"اختر عادة ماضية انتهت، ثم شيئًا مألوفًا الآن: “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","de":"Wähle eine vergangene Gewohnheit, die vorbei ist, und dann etwas, das jetzt vertraut ist: “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","es":"Elige un hábito pasado que terminó y luego algo familiar ahora: “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","fr":"Choisis une habitude passée qui a cessé, puis quelque chose de familier maintenant : “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","it":"Scegli un'abitudine passata che è finita, poi qualcosa di familiare ora: “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","ja":"もう終わった過去の習慣と、今は慣れていることを選ぼう：“Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","pt":"Escolha um hábito passado que acabou e depois algo familiar agora: “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","ru":"Выбери прошлую привычку, которая закончилась, а затем то, что привычно сейчас: “Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”","zh":"选一个已经结束的过去习惯，再选一个现在已熟悉的事：“Tensing ___ deliver bags to the annex. He ___ working in dark tunnels.”"},"opts":[{"en":"used to / is used to"},{"en":"would / has used to"},{"en":"was using to / uses to"},{"en":"is used to / used to"}],"answer":0,"points":5,"fb":[{"en":"A past habit that has ended: USED TO + verb. Something familiar now: BE USED TO + -ING.","ar":"عادة ماضية انتهت: USED TO + فعل. شيء مألوف الآن: BE USED TO + -ING.","de":"Eine vergangene Gewohnheit, die vorbei ist: USED TO + Verb. Etwas, das jetzt vertraut ist: BE USED TO + -ING.","es":"Un hábito pasado que ya terminó: USED TO + verbo. Algo familiar ahora: BE USED TO + -ING.","fr":"Une habitude passée qui a cessé : USED TO + verbe. Quelque chose de familier maintenant : BE USED TO + -ING.","it":"Un'abitudine passata che è finita: USED TO + verbo. Qualcosa di familiare ora: BE USED TO + -ING.","ja":"もう終わった過去の習慣：USED TO + 動詞。今は慣れていること：BE USED TO + -ING。","pt":"Um hábito passado que já acabou: USED TO + verbo. Algo familiar agora: BE USED TO + -ING.","ru":"Прошлая привычка, которой больше нет: USED TO + глагол. То, что привычно сейчас: BE USED TO + -ING.","zh":"已经结束的过去习惯：USED TO + 动词。现在已熟悉的事：BE USED TO + -ING。"},{"en":"WOULD can describe a past habit, but HAS USED TO is not English.","ar":"WOULD قد تصف عادة ماضية، لكن HAS USED TO غير موجودة في الإنجليزية.","de":"WOULD kann eine vergangene Gewohnheit beschreiben, aber HAS USED TO gibt es im Englischen nicht.","es":"WOULD puede describir un hábito pasado, pero HAS USED TO no existe en inglés.","fr":"WOULD peut décrire une habitude passée, mais HAS USED TO n'existe pas en anglais.","it":"WOULD può descrivere un'abitudine passata, ma HAS USED TO non esiste in inglese.","ja":"WOULD は過去の習慣を表せるが、HAS USED TO という英語はない。","pt":"WOULD pode descrever um hábito passado, mas HAS USED TO não existe em inglês.","ru":"WOULD может описывать прошлую привычку, но HAS USED TO в английском не существует.","zh":"WOULD 可以描述过去的习惯，但英语里没有 HAS USED TO。"},{"en":"WAS USING TO and USES TO are not English forms.","ar":"WAS USING TO وUSES TO ليستا صيغتين إنجليزيتين.","de":"WAS USING TO und USES TO sind keine englischen Formen.","es":"WAS USING TO y USES TO no son formas del inglés.","fr":"WAS USING TO et USES TO ne sont pas des formes anglaises.","it":"WAS USING TO e USES TO non sono forme inglesi.","ja":"WAS USING TO と USES TO は英語の形ではない。","pt":"WAS USING TO e USES TO não são formas do inglês.","ru":"WAS USING TO и USES TO — не английские формы.","zh":"WAS USING TO 和 USES TO 都不是英语形式。"},{"en":"This swaps them. IS USED TO needs a noun or -ING, and \"used to working\" is not the past-habit pattern.","ar":"هذا يقلبهما. IS USED TO تحتاج إلى اسم أو -ING، و\"used to working\" ليست نمط العادة الماضية.","de":"Das vertauscht sie. IS USED TO braucht ein Nomen oder -ING, und \"used to working\" ist nicht das Muster für vergangene Gewohnheiten.","es":"Esto los intercambia. IS USED TO necesita un sustantivo o -ING, y \"used to working\" no es el patrón del hábito pasado.","fr":"Cela les inverse. IS USED TO demande un nom ou -ING, et \"used to working\" n'est pas le modèle de l'habitude passée.","it":"Così si scambiano. IS USED TO vuole un nome o -ING, e \"used to working\" non è lo schema dell'abitudine passata.","ja":"これは逆になっている。IS USED TO の後には名詞か -ING が必要で、\"used to working\" は過去の習慣の形ではない。","pt":"Isto troca-os. IS USED TO precisa de um nome ou de -ING, e \"used to working\" não é o padrão do hábito passado.","ru":"Здесь они перепутаны. IS USED TO требует существительного или -ING, а \"used to working\" — не схема прошлой привычки.","zh":"这把两者弄反了。IS USED TO 后面要接名词或 -ING，\"used to working\" 不是过去习惯的结构。"}],"next":"p15","img":"18_plans.webp","hot":[56,76,22,14],"pos":"left","v":"center","width":40},"p15":{"kind":"question","k":{"en":"ACT II · 21:50 · THE ARCHIVE THRESHOLD","ar":"الفصل الثاني · 21:50 · عتبة الأرشيف","de":"AKT II · 21:50 · DIE SCHWELLE ZUM ARCHIV","es":"ACTO II · 21:50 · EL UMBRAL DEL ARCHIVO","fr":"ACTE II · 21:50 · LE SEUIL DES ARCHIVES","it":"ATTO II · 21:50 · LA SOGLIA DELL'ARCHIVIO","ja":"第2幕 · 21:50 · 記録室の入口","pt":"ATO II · 21:50 · A ENTRADA DO ARQUIVO","ru":"АКТ II · 21:50 · ПОРОГ АРХИВА","zh":"第二幕 · 21:50 · 档案室门口"},"title":{"en":"Room 309","ar":"الغرفة 309","de":"Zimmer 309","es":"Habitación 309","fr":"Chambre 309","it":"Stanza 309","ja":"309 号室","pt":"Quarto 309","ru":"Номер 309","zh":"309 号房"},"story":[{"en":"Cat, the hotel’s silent night cleaner, emerges from behind a shelf and nearly gives Watson a heart attack. “The door’s been locked since eight,” she says. “I heard the Count call for help.”","ar":"تخرج كات، عاملة التنظيف الليلية الصامتة، من خلف رفّ وتكاد تصيب واطسون بنوبة قلبية. تقول: «الباب مقفل منذ الثامنة. سمعت الكونت يطلب النجدة».","de":"Cat, die schweigsame Nachtreinigungskraft des Hotels, kommt hinter einem Regal hervor und erschreckt Watson fast zu Tode. „Die Tür ist seit acht abgeschlossen“, sagt sie. „Ich habe den Grafen um Hilfe rufen hören.“","es":"Cat, la silenciosa limpiadora de noche del hotel, sale de detrás de una estantería y casi le provoca un infarto a Watson. «La puerta está cerrada con llave desde las ocho», dice. «Oí al conde pedir ayuda».","fr":"Cat, la silencieuse agente de nettoyage de nuit de l'hôtel, surgit de derrière une étagère et manque de donner une crise cardiaque à Watson. « La porte est fermée à clé depuis huit heures, dit-elle. J'ai entendu le comte appeler à l'aide. »","it":"Cat, la silenziosa addetta alle pulizie notturne dell'hotel, spunta da dietro uno scaffale e quasi fa venire un infarto a Watson. «La porta è chiusa a chiave dalle otto», dice. «Ho sentito il conte chiedere aiuto».","ja":"ホテルの無口な夜間清掃員キャットが棚の陰から現れ、ワトソンは心臓が止まりそうになる。「あのドアは8時からずっと鍵がかかっている」と彼女は言う。「伯爵が助けを呼ぶ声を聞いたの」。","pt":"Cat, a silenciosa empregada de limpeza da noite, sai de trás de uma prateleira e quase provoca um ataque cardíaco a Watson. «A porta está trancada desde as oito», diz ela. «Ouvi o conde pedir ajuda.»","ru":"Кэт, молчаливая ночная уборщица отеля, появляется из-за стеллажа и чуть не доводит Ватсона до сердечного приступа. «Дверь заперта с восьми, — говорит она. — Я слышала, как граф звал на помощь».","zh":"酒店里沉默寡言的夜班清洁工凯特从书架后面冒出来，差点把华生吓出心脏病。\"这扇门从八点起就锁着，\"她说，\"我听见伯爵在呼救。\""},{"en":"You slide your key into the outer door. It opens onto a passage. A second door has an electronic lock. Through its small window, Blocula holds up a folder: STAFF OWNERSHIP. He did not plan to sell everyone’s jobs. He planned to give the staff control of the hotel.","ar":"تُدخل مفتاحك في الباب الخارجي. يفتح على ممر. على الباب الثاني قفل إلكتروني. من نافذته الصغيرة يرفع بلوكولا ملفًا: ملكية الموظفين. لم يكن ينوي بيع وظائف الجميع. كان ينوي أن يعطي الموظفين إدارة الفندق.","de":"Du steckst deinen Schlüssel in die äußere Tür. Sie öffnet sich zu einem Gang. Eine zweite Tür hat ein elektronisches Schloss. Durch ihr kleines Fenster hält Blocula eine Mappe hoch: PERSONALEIGENTUM. Er wollte nicht die Stellen aller verkaufen. Er wollte dem Personal die Kontrolle über das Hotel geben.","es":"Metes tu llave en la puerta exterior. Se abre a un pasillo. Una segunda puerta tiene una cerradura electrónica. Por su pequeña ventana, Blocula levanta una carpeta: PROPIEDAD DEL PERSONAL. No pensaba vender los trabajos de todos. Pensaba dar al personal el control del hotel.","fr":"Tu glisses ta clé dans la porte extérieure. Elle donne sur un passage. Une deuxième porte a une serrure électronique. Par sa petite vitre, Blocula brandit un dossier : PROPRIÉTÉ DU PERSONNEL. Il ne voulait pas vendre les emplois de tout le monde. Il voulait donner au personnel le contrôle de l'hôtel.","it":"Infili la chiave nella porta esterna. Si apre su un corridoio. Una seconda porta ha una serratura elettronica. Dalla sua piccola finestra, Blocula alza una cartella: PROPRIETÀ DEL PERSONALE. Non voleva vendere il lavoro di tutti. Voleva dare al personale il controllo dell'hotel.","ja":"あなたは外側のドアに鍵を差し込む。ドアは通路に通じている。二つ目のドアには電子錠がついている。その小さな窓越しに、ブロキュラがフォルダーを掲げる。「スタッフによる所有」。彼はみんなの仕事を売るつもりではなかった。スタッフにホテルの経営を任せるつもりだったのだ。","pt":"Mete a sua chave na porta exterior. Ela dá para um corredor. Uma segunda porta tem uma fechadura eletrónica. Pela pequena janela, Blocula levanta uma pasta: PROPRIEDADE DO PESSOAL. Ele não planeava vender os empregos de todos. Planeava dar ao pessoal o controlo do hotel.","ru":"Ты вставляешь свой ключ во внешнюю дверь. Она открывается в коридор. На второй двери электронный замок. В её маленьком окне Блокула поднимает папку: СОБСТВЕННОСТЬ ПЕРСОНАЛА. Он не собирался продавать чужую работу. Он собирался отдать персоналу управление отелем.","zh":"你把钥匙插进外门。门后是一条通道。第二扇门装着电子锁。透过它的小窗，布洛库拉举起一个文件夹：员工所有权。他并没打算卖掉所有人的饭碗。他打算把酒店的控制权交给员工。"}],"prompt":{"en":"Describe a state continuing to now, then the earlier locking: “The door ___ locked since eight. Someone ___ it before Cat came down.”","ar":"صف حالة مستمرة حتى الآن، ثم الإقفال الأسبق: “The door ___ locked since eight. Someone ___ it before Cat came down.”","de":"Beschreibe einen Zustand, der bis jetzt andauert, dann das frühere Abschließen: “The door ___ locked since eight. Someone ___ it before Cat came down.”","es":"Describe un estado que sigue hasta ahora y luego el cierre anterior: “The door ___ locked since eight. Someone ___ it before Cat came down.”","fr":"Décris un état qui dure jusqu'à maintenant, puis le verrouillage antérieur : “The door ___ locked since eight. Someone ___ it before Cat came down.”","it":"Descrivi uno stato che continua fino a ora, poi la chiusura precedente: “The door ___ locked since eight. Someone ___ it before Cat came down.”","ja":"今まで続いている状態と、それより前の施錠を表そう：“The door ___ locked since eight. Someone ___ it before Cat came down.”","pt":"Descreva um estado que continua até agora e depois o trancar anterior: “The door ___ locked since eight. Someone ___ it before Cat came down.”","ru":"Опиши состояние, которое длится до сих пор, а затем более раннее запирание: “The door ___ locked since eight. Someone ___ it before Cat came down.”","zh":"描述一个持续到现在的状态，再描述更早的上锁：“The door ___ locked since eight. Someone ___ it before Cat came down.”"},"opts":[{"en":"was / locks"},{"en":"is / has locked"},{"en":"had been / is locking"},{"en":"has been / had locked"}],"answer":3,"points":5,"fb":[{"en":"WAS does not carry the locked state up to now, and LOCKS is a routine.","ar":"WAS لا تحمل حالة الإقفال حتى الآن، وLOCKS روتين.","de":"WAS trägt den abgeschlossenen Zustand nicht bis jetzt, und LOCKS ist eine Routine.","es":"WAS no lleva el estado de cerrado hasta ahora, y LOCKS es una rutina.","fr":"WAS ne porte pas l'état verrouillé tly offers to carry the folder when you get it out.","ar":"يضرب غصن السقف الزجاجي. في الخارج، ينحني جسر المشاة القديم تحت الثلج الرطب. يأمر برام الجميع بالابتعاد عنه. تقول لينا: «انظر إلى تلك العارضة. ستسقط». تمسك إيرا حقيبة الإسعافات. ينظر تنسينغ إلى يديك المرتجفتين ويعرض بهدوء أن يحمل الملف حين تخرجه.","de":"Ein Ast schlägt gegen das Glasdach. Draußen biegt sich die alte Fußgängerbrücke unter nassem Schnee. Bram schickt alle von ihr weg. „Sieh dir den Balken an“, sagt Lina. „Der fällt gleich.“ Eira schnappt sich die Erste-Hilfe-Tasche. Tensing sieht deine zitternden Hände und bietet leise an, die Mappe zu tragen, wenn du sie herausholst.","es":"Una rama golpea el techo de cristal. Fuera, la vieja pasarela se dobla bajo la nieve húmeda. Bram ordena a todos que se alejen. «Mira esa viga», dice Lina. «Se va a caer». Eira coge el botiquín. Tensing mira tus manos temblorosas y se ofrece en voz baja a llevar la carpeta cuando la saques.","fr":"Une branche frappe le toit de verre. Dehors, la vieille passerelle plie sous la neige mouillée. Bram ordonne à tout le monde de s'en éloigner. « Regarde cette poutre, dit Lina. Elle va tomber. » Eira attrape la trousse de secours. Tensing voit tes mains qui tremblent et propose doucement de porter le dossier quand tu l'auras sorti.","it":"Un ramo colpisce il tetto di vetro. Fuori, la vecchia passerella si piega sotto la neve bagnata. Bram ordina a tutti di allontanarsi. «Guarda quella trave», dice Lina. «Sta per cadere». Eira afferra la borsa del pronto soccorso. Tensing guarda le tue mani che tremano e si offre a bassa voce di portare la cartella quando la tirerai fuori.","ja":"枝がガラスの屋根に当たる。外では、古い歩道橋が湿った雪の重みでたわんでいる。ブラムは皆に橋から離れるよう命じる。「あの梁を見て」とリナが言う。「落ちるわ」。エイラが救急バッグをつかむ。テンジンはあなたの震える手を見て、フォルダーを取り出したら自分が運ぼうと静かに申し出る。","pt":"Um ramo bate no telhado de vidro. Lá fora, a velha ponte pedonal dobra-se sob a neve molhada. Bram manda todos afastarem-se. «Olhe para aquela viga», diz Lina. «Vai cair.» Eira agarra a mala de primeiros socorros. Tensing olha para as suas mãos a tremer e oferece-se baixinho para levar a pasta quando a tirar.","ru":"Ветка бьёт по стеклянной крыше. Снаружи старый пешеходный мостик прогибается под мокрым снегом. Брам велит всем отойти от него. «Посмотри на ту балку, — говорит Лина. — Она сейчас рухнет». Эйра хватает аптечку. Тенсинг смотрит на твои дрожащие руки и тихо предлагает понести папку, когда ты её достанешь.","zh":"一根树枝砸在玻璃屋顶上。外面，旧人行桥在湿雪下弯曲。布拉姆让所有人离它远点。\"看那根梁，\"莉娜说，\"它要塌了。\"艾拉抓起急救包。丹增看到你颤抖的双手，轻声提出等你把文件夹取出来后由他来拿。"},{"en":"An expected event and a decision made now can both point to the future. They tell us different things about the speaker’s evidence and intention.","ar":"الحدث المتوقع والقرار المتخذ الآن قد يشيران كلاهما إلى المستقبل. لكنهما يقولان أشياء مختلفة عن أدلة المتكلم ونيّته.","de":"Ein erwartetes Ereignis und eine Entscheidung im Moment können beide in die Zukunft zeigen. Sie sagen Verschiedenes über die Beweise und die Absicht des Sprechers.","es":"Un hecho esperado y una decisión tomada ahora pueden apuntar al futuro. Nos dicen cosas distintas sobre las pruebas y la intención de quien habla.","fr":"Un événement attendu et une décision prise sur le moment peuvent tous deux viser le futur. Ils disent des choses différentes sur les indices et l'intention de celui qui parle.","it":"Un evento previsto e una decisione presa ora possono entrambi indicare il futuro. Dicono cose diverse sulle prove e sull'intenzione di chi parla.","ja":"予想される出来事も、今決めたことも、どちらも未来を指せる。ただ、話し手の根拠や意図について伝えることが違う。","pt":"Um acontecimento esperado e uma decisão tomada agora podem ambos apontar para o futuro. Dizem coisas diferentes sobre as provas e a intenção de quem fala.","ru":"Ожидаемое событие и решение, принятое прямо сейчас, могут указывать на будущее. Они по-разному говорят о том, на что опирается говорящий и чего он хочет.","zh":"预期的事件和当下做的决定都可以指向将来。它们说明的是说话人掌握的证据和意图的不同。"}],"prompt":{"en":"Use the usual evidence-based prediction and immediate-offer forms: “Look at the bending beam! r snow. Jax has arranged to meet the registrar’s assistant at the lower station at 23:50. He shows you the confirmation on his phone.","ar":"يراجع والتون جدول النقل في الطوارئ. آخر عربة نازلة تغادر عند 23:40، ما دامت الرياح تحت الحد المسموح. بعد ذلك، سيكون الطريق الوحيد تحت الثلج. رتّب جاكس لقاء مساعدة أمين السجل في المحطة السفلى عند 23:50. يريك التأكيد على هاتفه.","de":"Walton prüft den Notfahrplan. Die letzte Seilbahn ins Tal fährt um 23:40, solange der Wind unter dem Grenzwert bleibt. Danach liegt die einzige Straße unter Schnee. Jax hat sich um 23:50 an der Talstation mit der Assistentin des Registerbeamten verabredet. Er zeigt dir die Bestätigung auf seinem Telefon.","es":"Walton revisa el horario de transporte de emergencia. El último teleférico de bajada sale a las 23:40, siempre que el viento siga por debajo del límite. Después, la única carretera estará bajo la nieve. Jax ha quedado con la ayudante del registrador en la estación de abajo a las 23:50. Te enseña la confirmación en su teléfono.","fr":"Walton vérifie l'horaire des transports d'urgence. Le dernier téléphérique descend à 23:40, à condition que le vent reste sous la limite. Après, la seule route sera sous la neige. Jax a rendez-vous avec l'assistante du greffier à la station du bas à 23:50. Il te montre la confirmation sur son téléphone.","it":"Walton controlla l'orario dei trasporti di emergenza. L'ultima funivia in discesa parte alle 23:40, purché il vento resti sotto il limite. Dopo, l'unica strada sarà sotto la neve. Jax ha un appuntamento con l'assistente dell'ufficiale del registro alla stazione a valle alle 23:50. Ti mostra la conferma sul telefono.","ja":"ウォルトンが緊急時の運行表を確かめる。下りの最終ロープウェイは、風が制限値を下回っていれば 23:40 に出る。その後は、唯一の道が雪の下になる。ジャックスは 23:50 に下の駅で登記官の助手と会う約束をしている。彼は電話の確認画面を見せてくれる。","pt":"Walton verifica o horário dos transportes de emergência. O último teleférico a descer parte às 23:40, desde que o vento fique abaixo do limite. Depois disso, a única estrada estará sob a neve. Jax combinou encontrar-se com a assistente do conservador na estação de baixo às 23:50. Mostra-lhe a confirmação no telefone.","ru":"Уолтон проверяет аварийное расписание. Последняя кабина вниз отходит в 23:40, если ветер останется ниже предела. После этого единственная дорога будет под снегом. Джакс договорился встретиться с помощницей регистратора на нижней станции в 23:50. Он показывает тебе подтверждение на телефоне.","zh":"沃尔顿查看紧急交通时刻表。最后一班下山缆车 23:40 出发，前提是风力保持在限值以下。之后，唯一的道路将被雪埋住。贾克斯已经约好 23:50 在山下站和登记官的助手见面。他给你看手机上的确认信息。"},{"en":"The plan is tight, but possible. The real problem is getting Blocula and the original agreement out of the archive.","ar":"الخطة ضيقة، لكنها ممكنة. المشكلة الحقيقية هي إخراج بلوكولا والاتفاقية الأصلية من الأرشيف.","de":"Der Plan ist knapp, aber machbar. Das eigentliche Problem ist, Blocula und die Originalvereinbarung aus dem Archiv zu holen.","es":"El plan es justo, pero posible. El verdadero problema es sacar a Blocula y el acuerdo original del archivo.","fr":"Le plan est serré, mais possible. Le vrai problème, c'est de sortir Blocula et l'accord original des archives.","it":"Il piano è stretto, ma possibile. Il vero problema è far uscire dall'archivio Blocula e l'accordo originale.","ja":"計画はぎりぎりだが、不可能ではない。本当の問題は、ブロキュラと合意書の原本を記録室から出すことだ。","pt":"O plano é apertado, mas possível. O verdadeiro problema é tirar Blocula e o acordo original do arquivo.","ru":"План жёсткий, но выполнимый. Настоящая проблема — вытащить Блокулу и оригинал соглашения из архива.","zh":"计划很紧，但可行。真正的问题是把布洛库拉和协议原件从档案室里弄出来。"}],"prompt":{"en":"Choose the timetable form and the personal arrangement: “The last car ___ at 23:40. Jax ___ the assistant at 23:50; they have confirmed it.”","ar":"اختر صيغة الجدول وصيغة الموعد الشخصي: “The last car ___ at 23:40. Jax ___ the assistant at 23:50; they have confirmed it.”","de":"Wähle die Fahrplanform und die persönliche Verabredung: “The last car ___ at 23:40. Jax ___ the assistant at 23:50; they have confirmed it.”","es":"Elige la forma de  WILL HAVE MET guarda indietro da un momento successivo.","ja":"LEFT は過去形で、WILL HAVE MET はもっと後の時点から振り返っている。","pt":"LEFT é passado, e WILL HAVE MET olha para trás a partir de um momento posterior.","ru":"LEFT — прошедшее, а WILL HAVE MET смотрит назад из более позднего момента.","zh":"LEFT 是过去时，WILL HAVE MET 是从更晚的时间回头看。"},{"en":"HAS LEFT is a result now, not tonight's timetable.","ar":"HAS LEFT نتيجة الآن، لا جدول هذه الليلة.","de":"HAS LEFT ist ein Ergebnis jetzt, nicht der Fahrplan für heute Nacht.","es":"HAS LEFT es un resultado ahora, no el horario de esta noche.","fr":"HAS LEFT est un résultat maintenant, pas l'horaire de ce soir.","it":"HAS LEFT è un risultato ora, non l'orario di stasera.","ja":"HAS LEFT は今の結果で、今夜の時刻表ではない。","pt":"HAS LEFT é um resultado agora, não o horário desta noite.","ru":"HAS LEFT — результат сейчас, а не сегодняшнее расписание.","zh":"HAS LEFT 是现在的结果，不是今晚的时刻表。"},{"en":"A timetable: THE LAST CAR + LEAVES. A confirmed arrangement: JAX + IS MEETING.","ar":"جدول مواعيد: THE LAST CAR + LEAVES. موعد مؤكد: JAX + IS MEETING.","de":"Ein Fahrplan: THE LAST CAR + LEAVES. Eine bestätigte Verabredung: JAX + IS MEETING.","es":"Un horario: THE LAST CAR + LEAVES. Un plan confirmado: JAX + IS MEETING.","fr":"Un horaire : THE LAST CAR + LEAVES. Un rendez-vous confirmé : JAX + IS MEETING.","it":"Un orario: THE LAST CAR + LEAVES. Un appuntamento confermato: JAX + IS MEETING.","ja":"時刻表：THE LAST CAR + LEAVES。確定した約束：JAX + IS MEETING。","pt":"Um horário: THE LAST CAR + LEAVES. Um combinado confirmado: JAX + IS MEETING.","ru":"Расписание: THE LAST CAR + LEAVES. Подтверждённая договорённость: JAX + IS MEETING.","zh":"时刻表：THE LAST CAR + LEAVES。已确认的安排：JAX + IS MEETING。"}],"next":"p19","img":"10_cablecar.webp","hot":[17,70,16,26],"pos":"right","v":"center"},"p19":{"kind":"question","k":{"en":"ACT II · 22:30 · THE MAINTENANCE BAY","ar":"الفصل الثاني · 22:30 · قسم الصيانة","de":"AKT II · 22:30 · DIE WARTUNGSHALLE","es":"ACTO II · 22:30 · LA SALA DE MANTENIMIENTO","fr":"ACTE II · 22:30 · L'ATELIER DE MAINTENANCE","it":"ATTO II · 22:30 · IL REPARTO MANUTENZIONE","ja":"第2幕 · 22:30 · 整備室","pt":"ATO II · 22:30 · A SALA DE MANUTENÇÃO","ru":"АКТ II · 22:30 · РЕМОНТНЫЙ ОТСЕК","zh":"第二幕 · 22:30 · 维修间"},"title":{"en":"Two things worth saving","ar":"شيئان يستحقان الإنقاذ","de":"Zwei Dinge, die es wert sind","es":"Dos cosas que vale la pena salvar","fr":"Deux choses à sauver","it":"Due cose da salvare","ja":"救う価値のある二つのもの","pt":"Duas coisas que vale a pena salvar","ru":"Две вещи, которые стоит спасти","zh":"两样值得救的东西"},"story":[{"en":"Nadia finds a backup socket. Zombito can power the archive lock from the workshop, but the damaged circuit cannot run the lock and the document scanner together. Victor checks the temperature behind the glass. Blocula is shivering. Clerval prepares warm blankets. The Creature offers to hold the power cable in place.","ar":"تجد نادية مقبسًا احتياطيًا. يستطيع زومبيتو تشغيل قفل الأرشيف من الورشة، لكن الدائرة التالفة لا تستطيع تشغيل القفل وماسح الوثائق معًا. يفحص فيكتور الحرارة خلف الزجاج. بلوكولا يرتجف. يجهّز كليرفال بطانيات دافئة. ويعرض المخلوق أن يمسك كابل الكهرباء في مكانه.","de":"Nadia findet eine Reservesteckdose. Zombito kann das Archivschloss von der Werkstatt aus mit Strom versorgen, aber der beschädigte Stromkreis kann Schloss und Dokumentenscanner nicht gleichzeitig betreiben. Victor prüft die Temperatur hinter der Scheibe. Blocula zittert. Clerval legt warme Decken bereit. Die Kreatur bietet an, das Stromkabel festzuhalten.","es":"Nadia encuentra un enchufe de reserva. Zombito puede alimentar la cerradura del archivo desde el taller, pero el circuito dañado no puede hacer funcionar a la vez la cerradura y el escáner de documentos. Victor comprueba la temperatura detrás del cristal. Blocula tiembla. Clerval prepara mantas calientes. La Criatura se ofrece a sujetar el cable.","fr":"Nadia trouve une prise de secours. Zombito peut alimenter la serrure des archives depuis l'atelier, mais le circuit endommagé ne peut pas faire marcher en même temps la serrure et le scanner de documents. Victor vérifie la température derrière la vitre. Blocula grelotte. Clerval prépare des couvertures chaudes. La Créature propose de tenir le câble en place.","it":"Nadia trova una presa di riserva. Zombito può alimentare la serratura dell'archivio dall'officina, ma il circuito danneggiato non regge insieme la serratura e lo scanner dei documenti. Victor controlla la temperatura dietro il vetro. Blocula trema. Clerval prepara coperte calde. La Creatura si offre di tenere fermo il cavo.","ja":"ナディアが予備のコンセントを見つける。ゾンビトは作業場から記録室の錠に電気を送れるが、傷んだ回路では錠と書類スキャナーを同時に動かせない。ヴィクターがガラスの向こうの温度を確かめる。ブロキュラは震えている。クラーヴァルが温かい毛布を用意する。クリーチャーは電源ケーブルを押さえていると申し出る。","pt":"Nadia encontra uma tomada de reserva. Zombito pode alimentar a fechadura do arquivo a partir da oficina, mas o circuito danificado não consegue pôr a funcionar ao mesmo tempo a fechadura e o scanner de documentos. Victor verifica a temperatura atrás do vidro. Blocula está a tremer. Clerval prepara cobertores quentes. A Criatura oferece-se para segurar o cabo no lugar.","ru":"Надя находит запасную розетку. Зомбито может запитать замок архива из мастерской, но повреждённая цепь не потянет одновременно замок и сканер документов. Виктор проверяет температуру за стеклом. Блокулу трясёт. Клерваль готовит тёплые одеяла. Существо предлагает держать кабель на месте.","zh":"娜迪娅找到一个备用插座。僵尸托可以从维修间给档案室的锁供电，但受损的电路不能同时带动门锁和文件扫描仪。维克多检查玻璃后面的温度。布洛库拉在发抖。克莱瓦尔准备好暖和的毯子。怪物主动提出把电缆按在原处。"},{"en":"Choose your priority: free the Count first, or scan the agreement first. Both can be done, but the first decision changes the rescue and the ending.","ar":"اختر أولويتك: تحرير الكونت أولًا، أو مسح الاتفاقية أولًا. يمكن القيام بالأمرين، لكن القرار الأول يغيّر الإنقاذ والنهاية.","de":"Wähle deine Priorität: zuerst den Grafen befreien oder zuerst die Vereinbarung scannen. Beides geht, aber die erste Entscheidung verändert die Rettung und das Ende.","es":"Elige tu prioridad: liberar primero al conde o escanear primero el acuerdo. Se pueden hacer las dos cosas, pero la primera decisión cambia el rescate y el final.","fr":"Choisis ta priorité : libérer d'abord le comte, ou scanner d'abord l'accord. Les deux sont possibles, mais le premier choix change le sauvetage et la fin.","it":"Scegli la tua priorità: liberare prima il conte, o scansionare prima l'accordo. Si possono fare entrambe le cose, ma la prima decisione cambia il salvataggio e il finale.","ja":"優先順位を選ぼう。先に伯爵を助け出すか、先に合意書をスキャンするか。どちらもできるが、最初の判断で救出と結末が変わる。","pt":"Escolha a sua prioridade: libertar primeiro o conde, ou digitalizar primeiro o acordo. As duas coisas podem ser feitas, mas a primeira decisão muda o resgate e o final.","ru":"Выбери приоритет: сначала освободить графа или сначала отсканировать соглашение. Можно сделать и то и другое, но первое решение меняет спасение и концовку.","zh":"选择你的优先顺序：先救出伯爵，还是先扫描协议。两件事都能做，但第一个决定会改变营救过程和结局。"}],"prompt":{"en":"Choose an activity under way at a future moment, then an existing plan: “At eleven, Zombito ___ the circuit. He ___ use the backup socket; that is his plan.”","ar":"اختر نشاطًا جاريًا في لحظة مستقبلية، ثم خطة موجودة: “At eleven, Zombito ___ the circuit. He ___ use the backup socket; that is his plan.”","de":"Wähle eine Tätigkeit, die zu einem zukünftigen Moment läuft, dann einen bestehenden Plan: “At eleven, Zombito ___ the circuit. He ___ use the backup socket; that is his plan.”","es":"Elige una actividad en marcha en un momento futuro y luego un plan ya hecho: “At eleven, Zombito ___ the circuit. He ___ use the backup socket; that is his plan.”","fr":"Choisis une activité en cours à un moment futur, puis un projet déjà décidé : “At eleven, Zombito ___ the circuit. He ___ use the backup socket; that is his plan.”","it":"Scegli un'attività in corso in un momento futuro, poi un piano già fatto: “At eleven, Zombito ___ the circuit. He ___ use the backup socket; that is his plan.”","ja":"未来のある時点で進行中の活動と、すでにある計画を選ぼう：“At eleven, Zombito _
