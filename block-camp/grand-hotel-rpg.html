,"pt":"ATO III · 23:30 · A PLATAFORMA DO TELEFÉRICO","ru":"АКТ III · 23:30 · ПЛАТФОРМА КАНАТНОЙ ДОРОГИ","zh":"第三幕 · 23:30 · 缆车站台"},"title":{"en":"The deadline is a place in time","ar":"الموعد النهائي مكان في الزمن","de":"Die Frist ist ein Ort in der Zeit","es":"El plazo es un lugar en el tiempo","fr":"L'échéance est un lieu dans le temps","it":"La scadenza è un luogo nel tempo","ja":"期限は時間の中の場所","pt":"O prazo é um lugar no tempo","ru":"Срок — это место во времени","zh":"截止时间是时间里的一个地点"},"story":[{"en":"Jax has the sealed agreement. Rabbit brings the final envelope from reception. Bram checks the wind meter; Walton keeps the cable car at the platform while Tensing checks every fastening.","ar":"الاتفاقية المختومة مع جاكس. يحضر رابيت الظرف الأخير من الاستقبال. يفحص برام مقياس الرياح، ويُبقي والتون العربة عند الرصيف بينما يفحص تنسينغ كل مثبّت.","de":"Jax hat die versiegelte Vereinbarung. Rabbit bringt den letzten Umschlag von der Rezeption. Bram prüft den Windmesser; Walton hält die Seilbahn am Bahnsteig, während Tensing jede Befestigung kontrolliert.","es":"Jax tiene el acuerdo sellado. Rabbit trae el último sobre de recepción. Bram comprueba el medidor de viento; Walton retiene el teleférico en el andén mientras Tensing revisa cada sujeción.","fr":"Jax a l'accord scellé. Rabbit apporte la dernière enveloppe de la réception. Bram vérifie l'anémomètre ; Walton retient le téléphérique au quai pendant que Tensing contrôle chaque attache.","it":"Jax ha l'accordo sigillato. Rabbit porta l'ultima busta dalla reception. Bram controlla l'anemometro; Walton trattiene la funivia alla banchina mentre Tensing controlla ogni aggancio.","ja":"ジャックスが封をした合意書を持っている。ラビットがフロントから最後の封筒を持ってくる。ブラムが風速計を確かめ、テンジンが留め具を一つずつ点検する間、ウォルトンがロープウェイをホームに留めている。","pt":"Jax tem o acordo selado. Rabbit traz o último envelope da receção. Bram verifica o medidor de vento; Walton segura o teleférico na plataforma enquanto Tensing verifica cada fixação.","ru":"У Джакса запечатанное соглашение. Рэббит приносит последний конверт со стойки регистрации. Брам проверяет ветромер; Уолтон держит кабину у платформы, пока Тенсинг проверяет каждое крепление.","zh":"贾克斯拿着封好的协议。兔子从前台拿来最后一个信封。布拉姆检查风速计；沃尔顿把缆车留在站台，丹增检查每一个固定扣。"},{"en":"The registrar’s assistant began waiting at 22:50. By 23:50, she will have been waiting for an hour. Your job is to make sure she is waiting for people who actually arrive. The car’s doors close in ten minutes. Jax looks back. “One last check. Have we got the right document?”","ar":"بدأت مساعدة أمين السجل الانتظار عند 22:50. بحلول 23:50 ستكون قد انتظرت ساعة كاملة. مهمتك أن تتأكد أنها تنتظر أناسًا سيصلون فعلًا. تُغلق أبواب العربة بعد عشر دقائق. يلتفت جاكس. «فحص أخير. هل معنا الوثيقة الصحيحة؟»","de":"Die Assistentin des Registerbeamten hat um 22:50 angefangen zu warten. Um 23:50 wird sie eine Stunde gewartet haben. Deine Aufgabe ist dafür zu sorgen, dass sie auf Leute wartet, die wirklich ankommen. Die Türen der Kabine schließen in zehn Minuten. Jax schaut zurück. „Ein letzter Check. Haben wir das richtige Dokument?“","es":"La ayudante del registrador empezó a esperar a las 22:50. A las 23:50 llevará una hora esperando. Tu trabajo es asegurarte de que espera a gente que de verdad llega. Las puertas de la cabina se cierran en diez minutos. Jax mira atrás. «Una última comprobación. ¿Tenemos el documento correcto?»","fr":"L'assistante du greffier a commencé à attendre à 22:50. À 23:50, ça fera une heure qu'elle attend. Ton travail est de faire en sorte qu'elle attende des gens qui arrivent vraiment. Les portes de la cabine se ferment dans dix minutes. Jax se retourne. « Une dernière vérification. On a le bon document ? »","it":"L'assistente dell'ufficiale del registro ha cominciato ad aspettare alle 22:50. Alle 23:50 avrà aspettato per un'ora. Il tuo compito è fare in modo che aspetti persone che arrivano davvero. Le porte della cabina si chiudono fra dieci minuti. Jax si volta. «Un ultimo controllo. Abbiamo il documento giusto?».","ja":"登記官の助手は 22:50 から待っている。23:50 には、1時間待ったことになる。あなたの仕事は、彼女が本当に着く人たちを待っているようにすることだ。ゴンドラの扉はあと10分で閉まる。ジャックスが振り返る。「最後の確認だ。書類は合ってるか？」","pt":"A assistente do conservador começou a esperar às 22:50. Às 23:50 vai estar à espera há uma hora. O seu trabalho é garantir que ela espera por pessoas que chegam mesmo. As portas da cabina fecham dentro de dez minutos. Jax olha para trás. «Uma última verificação. Temos o documento certo?»","ru":"Помощница регистратора начала ждать в 22:50. К 23:50 она будет ждать уже час. Твоя задача — сделать так, чтобы она ждала людей, которые действительно приедут. Двери кабины закроются через десять минут. Джакс оглядывается. «Последняя проверка. У нас точно тот документ?»","zh":"登记官的助手 22:50 开始等。到 23:50，她就已经等了一个小时。你的任务是确保她等的人真的会到。缆车门十分钟后关闭。贾克斯回头看。\"最后检查一次。我们拿的文件对吗？\""}],"prompt":{"en":"Express accumulated waiting and a completed future handover: “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","ar":"عبّر عن انتظار متراكم وتسليم مستقبلي منتهٍ: “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","de":"Drücke angesammeltes Warten und eine fertige Übergabe in der Zukunft aus: “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","es":"Expresa la espera acumulada y una entrega futura terminada: “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","fr":"Exprime l'attente accumulée et une remise future terminée : “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","it":"Esprimi l'attesa accumulata e una consegna futura conclusa: “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","ja":"積み重なった待ち時間と、未来に完了する受け渡しを表そう：“By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","pt":"Exprima a espera acumulada e uma entrega futura terminada: “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","ru":"Вырази накопленное ожидание и законченную передачу в будущем: “By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”","zh":"表达累计的等待和将来已完成的交接：“By 23:50, the assistant ___ for an hour. By 23:55, Jax ___ the agreement to her.”"},"opts":[{"en":"will have been waiting / will have given"},{"en":"will wait / will be giving"},{"en":"will have been waiting / will be giving"},{"en":"has waited / gave"}],"answer":0,"points":5,"fb":[{"en":"Duration up to 23:50: THE ASSISTANT + WILL HAVE BEEN WAITING. Complete by 23:55: JAX + WILL HAVE GIVEN.","ar":"مدة حتى 23:50: THE ASSISTANT + WILL HAVE BEEN WAITING. منتهٍ بحلول 23:55: JAX + WILL HAVE GIVEN.","de":"Dauer bis 23:50: THE ASSISTANT + WILL HAVE BEEN WAITING. Fertig bis 23:55: JAX + WILL HAVE GIVEN.","es":"Duración hasta las 23:50: THE ASSISTANT + WILL HAVE BEEN WAITING. Terminado antes de las 23:55: JAX + WILL HAVE GIVEN.","fr":"Durée jusqu'à 23:50 : THE ASSISTANT + WILL HAVE BEEN WAITING. Terminé avant 23:55 : JAX + WILL HAVE GIVEN.","it":"Durata fino alle 23:50: THE ASSISTANT + WILL HAVE BEEN WAITING. Concluso entro le 23:55: JAX + WILL HAVE GIVEN.","ja":"23:50 までの継続時間：THE ASSISTANT + WILL HAVE BEEN WAITING。23:55 までに完了：JAX + WILL HAVE GIVEN。","pt":"Duração até às 23:50: THE ASSISTANT + WILL HAVE BEEN WAITING. Terminado até às 23:55: JAX + WILL HAVE GIVEN.","ru":"Длительность до 23:50: THE ASSISTANT + WILL HAVE BEEN WAITING. Завершено к 23:55: JAX + WILL HAVE GIVEN.","zh":"到 23:50 的时长：THE ASSISTANT + WILL HAVE BEEN WAITING。在 23:55 之前完成：JAX + WILL HAVE GIVEN。"},{"en":"WILL WAIT does not measure the hour, and WILL BE GIVING leaves the handover in progress.","ar":"WILL WAIT لا تقيس الساعة، وWILL BE GIVING تترك التسليم جاريًا.","de":"WILL WAIT misst die Stunde nicht, und WILL BE GIVING lässt die Übergabe im Gange.","es":"WILL WAIT no mide la hora, y WILL BE GIVING deja la entrega en curso.","fr":"WILL WAIT ne mesure pas l'heure, et WILL BE GIVING laisse la remise en cours.","it":"WILL WAIT non misura l'ora, e WILL BE GIVING lascia la consegna in corso.","ja":"WILL WAIT では1時間を測れず、WILL BE GIVING では受け渡しが進行中のままだ。","pt":"WILL WAIT não mede a hora, e WILL BE GIVING deixa a entrega em curso.","ru":"WILL WAIT не измеряет час, а WILL BE GIVING оставляет передачу в процессе.","zh":"WILL WAIT 衡量不了那一个小时，WILL BE GIVING 让交接停留在进行中。"},{"en":"The first half is right, but WILL BE GIVING leaves the handover in progress at 23:55, not complete.","ar":"النصف الأول صحيح، لكن WILL BE GIVING تترك التسليم جاريًا عند 23:55، لا منتهيًا.","de":"Die erste Hälfte stimmt, aber WILL BE GIVING lässt die Übergabe um 23:55 im Gange, nicht fertig.","es":"La primera mitad es correcta, pero WILL BE GIVING deja la entrega en curso a las 23:55, no terminada.","fr":"La première moitié est juste, mais WILL BE GIVING laisse la remise en cours à 23:55, pas terminée.","it":"La prima metà è giusta, ma WILL BE GIVING lascia la consegna in corso alle 23:55, non conclusa.","ja":"前半は正しいが、WILL BE GIVING だと 23:55 の受け渡しは完了ではなく進行中になる。","pt":"A primeira metade está certa, mas WILL BE GIVING deixa a entrega em curso às 23:55, não terminada.","ru":"Первая половина верна, но WILL BE GIVING оставляет передачу в 23:55 в процессе, а не завершённой.","zh":"前半部分是对的，但 WILL BE GIVING 让 23:55 的交接仍在进行，而不是已完成。"},{"en":"HAS WAITED and GAVE look from now and from the past, not from the future deadlines.","ar":"HAS WAITED وGAVE تنظران من الآن ومن الماضي، لا من المواعيد المستقبلية.","de":"HAS WAITED und GAVE schauen vom Jetzt und von der Vergangenheit aus, nicht von den Fristen in der Zukunft.","es":"HAS WAITED y GAVE miran desde el ahora y desde el pasado, no desde los plazos futuros.","fr":"HAS WAITED et GAVE regardent depuis maintenant et depuis le passé, pas depuis les échéances futures.","it":"HAS WAITED e GAVE guardano dal presente e dal passato, non dalle scadenze future.","ja":"HAS WAITED と GAVE は今や過去から見ていて、未来の期限からではない。","pt":"HAS WAITED e GAVE olham a partir do agora e do passado, não dos prazos futuros.","ru":"HAS WAITED и GAVE смотрят из настоящего и из прошлого, а не из будущих сроков.","zh":"HAS WAITED 和 GAVE 是从现在和从过去看，而不是从将来的截止时间看。"}],"next":"p28","img":"28_platform.webp","hot":[36,63,8,12],"pos":"right","v":"center","width":42},"p28":{"kind":"question","k":{"en":"ACT III · 23:40 · WATCHING THE DESCENT","ar":"الفصل الثالث · 23:40 · مشاهدة النزول","de":"AKT III · 23:40 · BLICK AUF DIE TALFAHRT","es":"ACTO III · 23:40 · VIENDO EL DESCENSO","fr":"ACTE III · 23:40 · EN REGARDANT LA DESCENTE","it":"ATTO III · 23:40 · GUARDANDO LA DISCESA","ja":"第3幕 · 23:40 · 下っていくのを見守る","pt":"ATO III · 23:40 · A VER A DESCIDA","ru":"АКТ III · 23:40 · ГЛЯДЯ НА СПУСК","zh":"第三幕 · 23:40 · 目送缆车下山"},"title":{"en":"A condition worth understanding","ar":"شرط يستحق الفهم","de":"Eine Bedingung, die man verstehen sollte","es":"Una condición que conviene entender","fr":"Une condition à bien comprendre","it":"Una condizione da capire bene","ja":"理解しておくべき条件","pt":"Uma condição que vale a pena entender","ru":"Условие, которое стоит понять","zh":"一个值得弄懂的条件"},"story":[{"en":"The cable car pulls away. Eira and Lina watch its lights shrink against the mountain. Nobody speaks until Jax’s radio crackles: “Wind steady. We’re moving.”","ar":"تبتعد عربة التلفريك. تراقب إيرا ولينا أضواءها وهي تصغر أمام الجبل. لا يتكلم أحد حتى يطقطق جهاز جاكس اللاسلكي: «الرياح ثابتة. نحن نتحرك».","de":"Die Seilbahn fährt ab. Eira und Lina sehen ihre Lichter vor dem Berg kleiner werden. Niemand spricht, bis Jax' Funkgerät knistert: „Wind stabil. Wir fahren.“","es":"El teleférico se aleja. Eira y Lina ven cómo sus luces se encogen contra la montaña. Nadie habla hasta que la radio de Jax chisporrotea: «Viento estable. Nos movemos».","fr":"Le téléphérique s'éloigne. Eira et Lina regardent ses lumières rapetisser contre la montagne. Personne ne parle jusqu'à ce que la radio de Jax grésille : « Vent stable. On avance. »","it":"La funivia si allontana. Eira e Lina guardano le sue luci rimpicciolire contro la montagna. Nessuno parla finché la radio di Jax gracchia: «Vento stabile. Ci muoviamo».","ja":"ロープウェイが離れていく。エイラとリナは、その明かりが山を背に小さくなっていくのを見つめる。ジャックスの無線がガリガリと鳴るまで、誰も口をきかない。「風は安定。動いている」。","pt":"O teleférico afasta-se. Eira e Lina veem as suas luzes encolher contra a montanha. Ninguém fala até o rádio de Jax crepitar: «Vento estável. Estamos a andar.»","ru":"Кабина отходит. Эйра и Лина смотрят, как её огни уменьшаются на фоне горы. Никто не говорит, пока не трещит рация Джакса: «Ветер ровный. Едем».","zh":"缆车开走了。艾拉和莉娜看着它的灯光在山影前越来越小。没有人说话，直到贾克斯的对讲机沙沙作响：\"风力平稳。我们在走。\""},{"en":"Tensing explains the last condition. If the agreement reaches the registrar before midnight, the sale stops. If it arrives late, the staff will still have evidence of the crime, but the ownership dispute will take longer to settle. This is a real possibility tonight, not an imaginary future.","ar":"يشرح تنسينغ الشرط الأخير. إذا وصلت الاتفاقية إلى أمين السجل قبل منتصف الليل، يتوقف البيع. وإذا وصلت متأخرة، فسيظل لدى الموظفين دليل على الجريمة، لكن نزاع الملكية سيستغرق وقتًا أطول. هذا احتمال حقيقي الليلة، لا مستقبل متخيَّل.","de":"Tensing erklärt die letzte Bedingung. Wenn die Vereinbarung vor Mitternacht beim Registerbeamten ist, ist der Verkauf gestoppt. Kommt sie zu spät, hat das Personal immer noch Beweise für das Verbrechen, aber der Streit um das Eigentum dauert länger. Das ist heute Nacht eine echte Möglichkeit, keine ausgedachte Zukunft.","es":"Tensing explica la última condición. Si el acuerdo llega al registrador antes de medianoche, la venta se detiene. Si llega tarde, el personal seguirá teniendo pruebas del delito, pero la disputa por la propiedad tardará más en resolverse. Es una posibilidad real esta noche, no un futuro imaginario.","fr":"Tensing explique la dernière condition. Si l'accord arrive chez le greffier avant minuit, la vente s'arrête. S'il arrive en retard, le personnel aura toujours des preuves du crime, mais le litige sur la propriété prendra plus de temps. C'est une vraie possibilité ce soir, pas un futur imaginaire.","it":"Tensing spiega l'ultima condizione. Se l'accordo arriva all'ufficiale del registro prima di mezzanotte, la vendita si ferma. Se arriva tardi, il personale avrà comunque le prove del crimine, ma la disputa sulla proprietà richiederà più tempo. È una possibilità reale stanotte, non un futuro immaginario.","ja":"テンジンが最後の条件を説明する。合意書が真夜中までに登記官に届けば、売却は止まる。遅れて届いても、スタッフには犯罪の証拠が残るが、所有をめぐる争いの解決には時間がかかる。これは今夜の現実の可能性で、想像上の未来ではない。","pt":"Tensing explica a última condição. Se o acordo chegar ao conservador antes da meia-noite, a venda para. Se chegar tarde, o pessoal continuará a ter provas do crime, mas a disputa pela propriedade vai demorar mais a resolver. É uma possibilidade real esta noite, não um futuro imaginário.","ru":"Тенсинг объясняет последнее условие. Если соглашение попадёт к регистратору до полуночи, продажа остановится. Если оно опоздает, у персонала всё равно будут доказательства преступления, но спор о собственности займёт больше времени. Это реальная возможность сегодня ночью, а не воображаемое будущее.","zh":"丹增解释最后一个条件。如果协议在午夜前送到登记官那里，买卖就会停止。如果送晚了，员工仍然有犯罪的证据，但所有权纠纷要更久才能解决。这是今晚真实的可能，而不是想象中的将来。"}],"prompt":{"en":"State the real condition and its expected result: “If Jax ___ in time, the registrar ___ the agreement tonight.”","ar":"اذكر الشرط الحقيقي ونتيجته المتوقعة: “If Jax ___ in time, the registrar ___ the agreement tonight.”","de":"Nenne die echte Bedingung und ihr erwartetes Ergebnis: “If Jax ___ in time, the registrar ___ the agreement tonight.”","es":"Di la condición real y su resultado esperado: “If Jax ___ in time, the registrar ___ the agreement tonight.”","fr":"Énonce la vraie condition et son résultat attendu : “If Jax ___ in time, the registrar ___ the agreement tonight.”","it":"Indica la condizione reale e il suo risultato previsto: “If Jax ___ in time, the registrar ___ the agreement tonight.”","ja":"現実の条件と、予想される結果を言おう：“If Jax ___ in time, the registrar ___ the agreement tonight.”","pt":"Diga a condição real e o resultado esperado: “If Jax ___ in time, the registrar ___ the agreement tonight.”","ru":"Назови реальное условие и ожидаемый результат: “If Jax ___ in time, the registrar ___ the agreement tonight.”","zh":"说出真实的条件和预期的结果：“If Jax ___ in time, the registrar ___ the agreement tonight.”"},"opts":[{"en":"arrives / will register"},{"en":"arrived / would register"},{"en":"had arrived / would have registered"},{"en":"will arrive / registers"}],"answer":0,"points":5,"fb":[{"en":"A real future possibility: IF + JAX + ARRIVES, then THE REGISTRAR + WILL REGISTER.","ar":"احتمال مستقبلي حقيقي: IF + JAX + ARRIVES، ثم THE REGISTRAR + WILL REGISTER.","de":"Eine echte Möglichkeit in der Zukunft: IF + JAX + ARRIVES, dann THE REGISTRAR + WILL REGISTER.","es":"Una posibilidad real en el futuro: IF + JAX + ARRIVES, y luego THE REGISTRAR + WILL REGISTER.","fr":"Une vraie possibilité future : IF + JAX + ARRIVES, puis THE REGISTRAR + WILL REGISTER.","it":"Una possibilità futura reale: IF + JAX + ARRIVES, poi THE REGISTRAR + WILL REGISTER.","ja":"現実の未来の可能性：IF + JAX + ARRIVES、そして THE REGISTRAR + WILL REGISTER。","pt":"Uma possibilidade futura real: IF + JAX + ARRIVES, depois THE REGISTRAR + WILL REGISTER.","ru":"Реальная возможность в будущем: IF + JAX + ARRIVES, затем THE REGISTRAR + WILL REGISTER.","zh":"真实的将来可能：IF + JAX + ARRIVES，然后 THE REGISTRAR + WILL REGISTER。"},{"en":"ARRIVED / WOULD REGISTER makes the situation imaginary. Tonight it is a real possibility.","ar":"ARRIVED / WOULD REGISTER تجعل الموقف متخيَّلًا. الليلة هو احتمال حقيقي.","de":"ARRIVED / WOULD REGISTER macht die Situation ausgedacht. Heute Nacht ist sie eine echte Möglichkeit.","es":"ARRIVED / WOULD REGISTER hace la situación imaginaria. Esta noche es una posibilidad real.","fr":"ARRIVED / WOULD REGISTER rend la situation imaginaire. Ce soir, c'est une vraie possibilité.","it":"ARRIVED / WOULD REGISTER rende la situazione immaginaria. Stanotte è una possibilità reale.","ja":"ARRIVED / WOULD REGISTER だと状況が仮想になる。今夜のこれは現実の可能性だ。","pt":"ARRIVED / WOULD REGISTER torna a situação imaginária. Esta noite é uma possibilidade real.","ru":"ARRIVED / WOULD REGISTER делает ситуацию воображаемой. А сегодня это реальная возможность.","zh":"ARRIVED / WOULD REGISTER 让情况变成想象的。今晚这是真实的可能。"},{"en":"HAD ARRIVED / WOULD HAVE REGISTERED is about an unreal past, but the journey is still happening.","ar":"HAD ARRIVED / WOULD HAVE REGISTERED عن ماضٍ غير حقيقي، لكن الرحلة ما زالت جارية.","de":"HAD ARRIVED / WOULD HAVE REGISTERED handelt von einer irrealen Vergangenheit, aber die Fahrt läuft noch.","es":"HAD ARRIVED / WOULD HAVE REGISTERED habla de un pasado irreal, pero el viaje todavía está ocurriendo.","fr":"HAD ARRIVED / WOULD HAVE REGISTERED parle d'un passé irréel, mais le voyage est encore en cours.","it":"HAD ARRIVED / WOULD HAVE REGISTERED parla di un passato irreale, ma il viaggio è ancora in corso.","ja":"HAD ARRIVED / WOULD HAVE REGISTERED は事実に反する過去の話だが、移動はまだ続いている。","pt":"HAD ARRIVED / WOULD HAVE REGISTERED fala de um passado irreal, mas a viagem ainda está a acontecer.","ru":"HAD ARRIVED / WOULD HAVE REGISTERED говорит о нереальном прошлом, а поездка ещё идёт.","zh":"HAD ARRIVED / WOULD HAVE REGISTERED 讲的是不真实的过去，但这趟行程还在进行。"},{"en":"After IF, for the future, use the present simple, not WILL ARRIVE.","ar":"بعد IF، للمستقبل، استخدم present simple لا WILL ARRIVE.","de":"Nach IF nimmt man für die Zukunft das Present Simple, nicht WILL ARRIVE.","es":"Después de IF, para el futuro, usa el presente simple, no WILL ARRIVE.","fr":"Après IF, pour le futur, on utilise le present simple, pas WILL ARRIVE.","it":"Dopo IF, per il futuro, si usa il present simple, non WILL ARRIVE.","ja":"IF の後で未来を表すときは現在形を使い、WILL ARRIVE は使わない。","pt":"Depois de IF, para o futuro, use o present simple, não WILL ARRIVE.","ru":"После IF для будущего используется present simple, а не WILL ARRIVE.","zh":"在 IF 后面表示将来，用一般现在时，不用 WILL ARRIVE。"}],"next":"p29","img":"29_descent.webp","hot":[82,63,8,14],"pos":"left","v":"center"},"p29":{"kind":"question","k":{"en":"ACT III · 23:55 · THE LOBBY CLOCK","ar":"الفصل الثالث · 23:55 · ساعة الردهة","de":"AKT III · 23:55 · DIE UHR IN DER LOBBY","es":"ACTO III · 23:55 · EL RELOJ DEL VESTÍBULO","fr":"ACTE III · 23:55 · L'HORLOGE DU HALL","it":"ATTO III · 23:55 · L'OROLOGIO DELLA HALL","ja":"第3幕 · 23:55 · ロビーの時計","pt":"ATO III · 23:55 · O RELÓGIO DO ÁTRIO","ru":"АКТ III · 23:55 · ЧАСЫ В ХОЛЛЕ","zh":"第三幕 · 23:55 · 大堂时钟"},"title":{"en":"Who gets to tell the story?","ar":"من يحق له أن يروي القصة؟","de":"Wer darf die Geschichte erzählen?","es":"¿Quién puede contar la historia?","fr":"Qui a le droit de raconter l'histoire ?","it":"Chi può raccontare la storia?","ja":"物語を語るのは誰？","pt":"Quem pode contar a história?","ru":"Кто расскажет эту историю?","zh":"谁来讲这个故事？"},"story":[{"en":"Jax calls from the lower station. The assistant has the sealed agreement. Whether your evidence was strong enough for immediate registration will be clear in a moment.","ar":"يتصل جاكس من المحطة السفلى. الاتفاقية المختومة مع المساعدة. بعد لحظة سيتضح إن كانت أدلتك قوية بما يكفي للتسجيل الفوري.","de":"Jax ruft von der Talstation an. Die Assistentin hat die versiegelte Vereinbarung. Ob deine Beweise für eine sofortige Eintragung reichten, wird sich gleich zeigen.","es":"Jax llama desde la estación de abajo. La ayudante tiene el acuerdo sellado. En un momento se sabrá si tus pruebas eran lo bastante sólidas para registrarlo de inmediato.","fr":"Jax appelle de la station du bas. L'assistante a l'accord scellé. On saura dans un instant si tes preuves étaient assez solides pour un enregistrement immédiat.","it":"Jax chiama dalla stazione a valle. L'assistente ha l'accordo sigillato. Fra un momento si saprà se le tue prove erano abbastanza solide per una registrazione immediata.","ja":"ジャックスが下の駅から電話してくる。助手は封をした合意書を受け取った。あなたの証拠がすぐに登記できるほど確かだったかどうかは、まもなくわかる。","pt":"Jax liga da estação de baixo. A assistente tem o acordo selado. Daqui a um momento vai saber-se se as suas provas eram fortes o suficiente para um registo imediato.","ru":"Джакс звонит с нижней станции. У помощницы запечатанное соглашение. Через мгновение станет ясно, хватило ли твоих улик для немедленной регистрации.","zh":"贾克斯从山下站打来电话。助手已经拿到了封好的协议。你的证据是否足以立即登记，马上就会揭晓。"},{"en":"Menzies asks you to handle everything quietly. Elizabeth wants the staff to hear the full truth. Blocula, wrapped in a blanket, says the choice should be theirs—but you must decide what to announce first. Zombiella takes the microphone. For once, the whole hotel is silent.","ar":"يطلب منك منزيس أن تتولى كل شيء بهدوء. إليزابيث تريد أن يسمع الموظفون الحقيقة كاملة. بلوكولا، الملتف ببطانية، يقول إن القرار يجب أن يكون لهم، لكن عليك أنت أن تقرر ما تعلنه أولًا. تمسك زومبيلا الميكروفون. للمرة الأولى، الفندق كله صامت.","de":"Menzies bittet dich, alles im Stillen zu regeln. Elizabeth will, dass das Personal die ganze Wahrheit hört. Blocula, in eine Decke gehüllt, sagt, die Wahl sollte bei ihnen liegen, aber du musst entscheiden, was du zuerst verkündest. Zombiella nimmt das Mikrofon. Ausnahmsweise ist das ganze Hotel still.","es":"Menzies te pide que lo lleves todo en silencio. Elizabeth quiere que el personal oiga toda la verdad. Blocula, envuelto en una manta, dice que la decisión debería ser suya, pero tú debes decidir qué anunciar primero. Zombiella coge el micrófono. Por una vez, todo el hotel está en silencio.","fr":"Menzies te demande de tout régler discrètement. Elizabeth veut que le personnel entende toute la vérité. Blocula, enveloppé dans une couverture, dit que le choix devrait leur revenir, mais c'est à toi de décider quoi annoncer d'abord. Zombiella prend le micro. Pour une fois, tout l'hôtel se tait.","it":"Menzies ti chiede di gestire tutto in silenzio. Elizabeth vuole che il personale senta tutta la verità. Blocula, avvolto in una coperta, dice che la scelta dovrebbe spettare a loro, ma sei tu a dover decidere cosa annunciare per primo. Zombiella prende il microfono. Per una volta, tutto l'hotel tace.","ja":"メンジーズは、すべて内々に済ませてほしいと頼む。エリザベスは、スタッフに真実をすべて聞かせたいと言う。毛布にくるまったブロキュラは、選ぶのはスタッフであるべきだと言うが、最初に何を発表するかはあなたが決めなければならない。ゾンビエラがマイクを手に取る。このときばかりは、ホテル中が静まり返っている。","pt":"Menzies pede-lhe que trate de tudo em silêncio. Elizabeth quer que o pessoal ouça a verdade toda. Blocula, embrulhado num cobertor, diz que a escolha devia ser deles, mas é você quem tem de decidir o que anunciar primeiro. Zombiella pega no microfone. Pela primeira vez, o hotel inteiro está em silêncio.","ru":"Мензис просит тебя уладить всё тихо. Элизабет хочет, чтобы персонал услышал всю правду. Блокула, закутанный в одеяло, говорит, что выбор должен быть за ними, но решать, что объявить первым, тебе. Зомбиэлла берёт микрофон. Впервые весь отель молчит.","zh":"孟席斯请你悄悄处理好一切。伊丽莎白希望员工听到全部真相。裹着毯子的布洛库拉说，应该由他们来选择，但先宣布什么得由你决定。僵尸艾拉拿起麦克风。这一次，整个酒店鸦雀无声。"}],"prompt":{"en":"Contrast a completed result now with work still in progress: “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","ar":"قارن بين نتيجة منتهية الآن وعمل لا يزال جاريًا: “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","de":"Stelle ein fertiges Ergebnis jetzt einer Arbeit gegenüber, die noch läuft: “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","es":"Contrasta un resultado terminado ahora con un trabajo todavía en curso: “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","fr":"Oppose un résultat terminé maintenant à un travail encore en cours : “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","it":"Metti a confronto un risultato concluso ora e un lavoro ancora in corso: “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","ja":"今ある完了した結果と、まだ進行中の作業を対比しよう：“Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","pt":"Contraste um resultado terminado agora com um trabalho ainda em curso: “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","ru":"Сопоставь законченный результат сейчас и работу, которая ещё идёт: “Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”","zh":"对比现在已完成的结果和仍在进行的工作：“Jax ___ the agreement to the assistant. The registrar ___ it at this moment.”"},"opts":[{"en":"was giving / had checked"},{"en":"has been giving / checks"},{"en":"has given / is checking"},{"en":"gives / checked"}],"answer":2,"points":5,"fb":[{"en":"Both forms are past. We need a result now and a check happening now.","ar":"الصيغتان في الماضي. نحتاج إلى نتيجة الآن وفحص يحدث الآن.","de":"Beide Formen sind Vergangenheit. Wir brauchen ein Ergebnis jetzt und eine Prüfung, die jetzt passiert.","es":"Las dos formas son pasadas. Necesitamos un resultado ahora y una revisión que ocurre ahora.","fr":"Les deux formes sont au passé. Il nous faut un résultat maintenant et une vérification qui se passe maintenant.","it":"Entrambe le forme sono passate. Ci servono un risultato ora e un controllo che succede ora.","ja":"どちらも過去の形だ。必要なのは、今の結果と今行われている確認だ。","pt":"As duas formas são do passado. Precisamos de um resultado agora e de uma verificação que acontece agora.","ru":"Обе формы прошедшие. Нам нужен результат сейчас и проверка, которая идёт сейчас.","zh":"两个形式都是过去时。我们需要一个现在的结果和一个此刻正在进行的核查。"},{"en":"HAS BEEN GIVING is a long activity, not one handover, and CHECKS is a routine.","ar":"HAS BEEN GIVING نشاط طويل لا تسليم واحد، وCHECKS روتين.","de":"HAS BEEN GIVING ist eine lange Tätigkeit, keine einzelne Übergabe, und CHECKS ist eine Routine.","es":"HAS BEEN GIVING es una actividad larga, no una sola entrega, y CHECKS es una rutina.","fr":"HAS BEEN GIVING est une longue activité, pas une seule remise, et CHECKS est une routine.","it":"HAS BEEN GIVING è un'attività lunga, non una sola consegna, e CHECKS è una routine.","ja":"HAS BEEN GIVING は長い活動で一回の受け渡しではなく、CHECKS は習慣だ。","pt":"HAS BEEN GIVING é uma atividade longa, não uma única entrega, e CHECKS é uma rotina.","ru":"HAS BEEN GIVING — долгое действие, а не одна передача, а CHECKS — привычное действие.","zh":"HAS BEEN GIVING 是一段长时间的活动，不是一次交接，CHECKS 是日常。"},{"en":"A finished handover with a result now: JAX + HAS GIVEN. In progress now: THE REGISTRAR + IS CHECKING.","ar":"تسليم منتهٍ له نتيجة الآن: JAX + HAS GIVEN. جارٍ الآن: THE REGISTRAR + IS CHECKING.","de":"Eine fertige Übergabe mit Ergebnis jetzt: JAX + HAS GIVEN. Jetzt im Gange: THE REGISTRAR + IS CHECKING.","es":"Una entrega terminada con resultado ahora: JAX + HAS GIVEN. En curso ahora: THE REGISTRAR + IS CHECKING.","fr":"Une remise terminée avec un résultat maintenant : JAX + HAS GIVEN. En cours maintenant : THE REGISTRAR + IS CHECKING.","it":"Una consegna conclusa con un risultato ora: JAX + HAS GIVEN. In corso ora: THE REGISTRAR + IS CHECKING.","ja":"今に結果がある完了した受け渡し：JAX + HAS GIVEN。今進行中：THE REGISTRAR + IS CHECKING。","pt":"Uma entrega terminada com resultado agora: JAX + HAS GIVEN. Em curso agora: THE REGISTRAR + IS CHECKING.","ru":"Законченная передача с результатом сейчас: JAX + HAS GIVEN. В процессе сейчас: THE REGISTRAR + IS CHECKING.","zh":"已完成、结果在现在的交接：JAX + HAS GIVEN。现在正在进行：THE REGISTRAR + IS CHECKING。"},{"en":"GIVES is a routine, and CHECKED makes the check finished and past.","ar":"GIVES روتين، وCHECKED تجعل الفحص منتهيًا وماضيًا.","de":"GIVES ist eine Routine, und CHECKED macht die Prüfung fertig und vergangen.","es":"GIVES es una rutina, y CHECKED da la revisión por terminada y pasada.","fr":"GIVES est une routine, et CHECKED rend la vérification terminée et passée.","it":"GIVES è una routine, e CHECKED rende il controllo concluso e passato.","ja":"GIVES は習慣で、CHECKED だと確認が終わった過去のことになる。","pt":"GIVES é uma rotina, e CHECKED dá a verificação como terminada e passada.","ru":"GIVES — привычное действие, а CHECKED делает проверку законченной и прошлой.","zh":"GIVES 是日常，CHECKED 让核查变成已结束的过去。"}],"next":"announce","img":"30_announcement.webp","hot":[81,50,6,14],"pos":"left","v":"center"},"announce":{"kind":"choice","k":{"en":"STORY DECISION · NO POINTS","ar":"قرار في القصة · لا نقاط","de":"ENTSCHEIDUNG IN DER GESCHICHTE · KEINE PUNKTE","es":"DECISIÓN DE LA HISTORIA · SIN PUNTOS","fr":"CHOIX DANS L'HISTOIRE · AUCUN POINT","it":"SCELTA NELLA STORIA · NESSUN PUNTO","ja":"物語の選択 · ポイントなし","pt":"DECISÃO NA HISTÓRIA · SEM PONTOS","ru":"ВЫБОР В ИСТОРИИ · БЕЗ ОЧКОВ","zh":"故事抉择 · 不计分"},"title":{"en":"How will you handle the truth?","ar":"كيف ستتعامل مع الحقيقة؟","de":"Wie gehst du mit der Wahrheit um?","es":"¿Cómo vas a manejar la verdad?","fr":"Comment vas-tu gérer la vérité ?","it":"Come gestirai la verità?","ja":"真実をどう扱う？","pt":"Como vai lidar com a verdade?","ru":"Как ты поступишь с правдой?","zh":"你将如何处理真相？"},"story":{"en":"The registrar is reading. The whole hotel is waiting for you to speak.","ar":"أمين السجل يقرأ. الفندق كله ينتظر أن تتكلم.","de":"Der Registerbeamte liest. Das ganze Hotel wartet darauf, dass du sprichst.","es":"El registrador está leyendo. Todo el hotel espera a que hables.","fr":"Le greffier lit. Tout l'hôtel attend que tu parles.","it":"L'ufficiale del registro sta leggendo. Tutto l'hotel aspetta che tu parli.","ja":"登記官が読んでいる。ホテル中が、あなたが話すのを待っている。","pt":"O conservador está a ler. O hotel inteiro espera que você fale.","ru":"Регистратор читает. Весь отель ждёт, когда ты заговоришь.","zh":"登记官正在阅读。整个酒店都在等你开口。"},"routes":[{"name":{"en":"Tell the whole staff · share the evidence","ar":"أخبر كل الموظفين · شارك الأدلة","de":"Sag es dem ganzen Personal · teile die Beweise","es":"Díselo a todo el personal · comparte las pruebas","fr":"Tout dire au personnel · partager les preuves","it":"Dillo a tutto il personale · condividi le prove","ja":"スタッフ全員に伝える · 証拠を共有する","pt":"Contar a todo o pessoal · partilhar as provas","ru":"Сказать всему персоналу · поделиться уликами","zh":"告诉全体员工 · 公开证据"},"desc":{"en":"Give everyone the facts and a voice in the hotel's future.","ar":"أعطِ الجميع الحقائق وصوتًا في مستقبل الفندق.","de":"Gib allen die Fakten und eine Stimme in der Zukunft des Hotels.","es":"Da a todos los hechos y voz en el futuro del hotel.","fr":"Donner à chacun les faits et une voix dans l'avenir de l'hôtel.","it":"Dai a tutti i fatti e una voce nel futuro dell'hotel.","ja":"全員に事実と、ホテルの未来への発言権を与える。","pt":"Dê a todos os factos e uma voz no futuro do hotel.","ru":"Дай всем факты и право голоса в будущем отеля.","zh":"让每个人都了解事实，并在酒店的未来中拥有发言权。"},"route":"PUBLIC","target":"p30"},{"name":{"en":"Arrange a private settlement first","ar":"رتّب تسوية خاصة أولًا","de":"Zuerst eine private Einigung suchen","es":"Busca primero un acuerdo privado","fr":"Chercher d'abord un arrangement privé","it":"Cerca prima un accordo privato","ja":"まず内々の和解を図る","pt":"Procurar primeiro um acordo privado","ru":"Сначала договориться в частном порядке","zh":"先安排私下和解"},"desc":{"en":"Seek a quieter deal with management before making an announcement.","ar":"ابحث عن صفقة أهدأ مع الإدارة قبل أي إعلان.","de":"Suche einen stilleren Deal mit der Leitung, bevor du etwas verkündest.","es":"Busca un trato más discreto con la dirección antes de hacer un anuncio.","fr":"Chercher un accord plus discret avec la direction avant toute annonce.","it":"Cerca un'intesa più discreta con la direzione prima di fare un annuncio.","ja":"発表する前に、経営陣ともっと穏便な取引を探る。","pt":"Procure um entendimento mais discreto com a direção antes de fazer um anúncio.","ru":"Попробуй тихо договориться с руководством, прежде чем что-то объявлять.","zh":"在宣布任何事之前，先和管理层谈一笔更低调的交易。"},"route":"PRIVATE","target":"p30"}],"img":"30_announcement.webp","hot":[81,50,6,14],"pos":"left","v":"center"},"p30":{"kind":"story","k":{"en":"00:01 → DAWN · THE GRAND HOTEL","ar":"00:01 → الفجر · الفندق الكبير","de":"00:01 → MORGENGRAUEN · DAS GRAND HOTEL","es":"00:01 → AMANECER · EL GRAND HOTEL","fr":"00:01 → AUBE · LE GRAND HOTEL","it":"00:01 → ALBA · IL GRAND HOTEL","ja":"00:01 → 夜明け · グランドホテル","pt":"00:01 → AMANHECER · O GRAND HOTEL","ru":"00:01 → РАССВЕТ · ГРАНД-ОТЕЛЬ","zh":"00:01 → 黎明 · 大饭店"},"title":{"en":"The first morning","ar":"الصباح الأول","de":"Der erste Morgen","es":"La primera mañana","fr":"Le premier matin","it":"Il primo mattino","ja":"最初の朝","pt":"A primeira manhã","ru":"Первое утро","zh":"第一个早晨"},"story":{"en":"The lobby clock passes midnight. Somewhere below the mountain, a stamp meets paper. Somewhere upstairs, a kettle begins to boil. The night is over. What happens to the Grand Hotel depends on the evidence you verified, the people you protected and the truth you chose to share.","ar":"تتجاوز ساعة الردهة منتصف الليل. في مكان ما أسفل الجبل، يلامس ختم الورق. وفي مكان ما في الأعلى، يبدأ إبريق بالغليان. انتهت الليلة. ما سيحدث للفندق الكبير يعتمد على الأدلة التي تحققت منها، والناس الذين حميتهم، والحقيقة التي اخترت أن تشاركها.","de":"Die Uhr in der Lobby überschreitet Mitternacht. Irgendwo unten am Berg trifft ein Stempel auf Papier. Irgendwo oben beginnt ein Wasserkessel zu kochen. Die Nacht ist vorbei. Was mit dem Grand Hotel geschieht, hängt von den Beweisen ab, die du bestätigt hast, von den Menschen, die du geschützt hast, und von der Wahrheit, die du geteilt hast.","es":"El reloj del vestíbulo pasa de la medianoche. En algún lugar al pie de la montaña, un sello toca el papel. En algún lugar arriba, una tetera empieza a hervir. La noche ha terminado. Lo que pase con el Grand Hotel depende de las pruebas que verificaste, de las personas que protegiste y de la verdad que decidiste compartir.","fr":"L'horloge du hall dépasse minuit. Quelque part au pied de la montagne, un tampon touche le papier. Quelque part à l'étage, une bouilloire commence à chauffer. La nuit est finie. Ce qui arrive au Grand Hotel dépend des preuves que tu as vérifiées, des personnes que tu as protégées et de la vérité que tu as choisi de partager.","it":"L'orologio della hall supera la mezzanotte. Da qualche parte ai piedi della montagna, un timbro tocca la carta. Da qualche parte al piano di sopra, un bollitore comincia a bollire. La notte è finita. Quello che succede al Grand Hotel dipende dalle prove che hai verificato, dalle persone che hai protetto e dalla verità che hai scelto di condividere.","ja":"ロビーの時計が真夜中を過ぎる。山のふもとのどこかで、判が紙に押される。上の階のどこかで、やかんが沸き始める。夜は終わった。グランドホテルがどうなるかは、あなたが確かめた証拠、守った人々、そして伝えることを選んだ真実にかかっている。","pt":"O relógio do átrio passa da meia-noite. Algures ao pé da montanha, um carimbo toca no papel. Algures lá em cima, uma chaleira começa a ferver. A noite acabou. O que acontece ao Grand Hotel depende das provas que verificou, das pessoas que protegeu e da verdade que escolheu partilhar.","ru":"Часы в холле переходят за полночь. Где-то у подножия горы штамп касается бумаги. Где-то наверху начинает закипать чайник. Ночь закончилась. Что будет с Гранд-отелем, зависит от улик, которые ты подтвердил, от людей, которых ты защитил, и от правды, которой ты решил поделиться.","zh":"大堂的时钟走过了午夜。山脚下某处，一枚印章落在纸上。楼上某处，一只水壶开始烧开。夜晚结束了。大饭店的命运取决于你核实的证据、你保护的人，以及你选择分享的真相。"},"button":{"en":"Hear the midnight result","ar":"اسمع نتيجة منتصف الليل","de":"Das Ergebnis um Mitternacht hören","es":"Escucha el resultado de medianoche","fr":"Écouter le résultat de minuit","it":"Ascolta il risultato di mezzanotte","ja":"真夜中の結果を聞く","pt":"Ouvir o resultado da meia-noite","ru":"Узнать результат полуночи","zh":"听午夜的结果"},"next":"resolve","img":"12_dawn.webp","hot":[45,73,10,12],"pos":"right","v":"center","width":40},"best":{"kind":"ending","k":{"en":"THE FIRST MORNING · ENDING","ar":"الصباح الأول · النهاية","de":"DER ERSTE MORGEN · ENDE","es":"LA PRIMERA MAÑANA · FINAL","fr":"LE PREMIER MATIN · FIN","it":"IL PRIMO MATTINO · FINALE","ja":"最初の朝 · エンディング","pt":"A PRIMEIRA MANHÃ · FINAL","ru":"ПЕРВОЕ УТРО · КОНЦОВКА","zh":"第一个早晨 · 结局"},"title":{"en":"The hotel belongs to everyone","ar":"الفندق للجميع","de":"Das Hotel gehört allen","es":"El hotel es de todos","fr":"L'hôtel appartient à tout le monde","it":"L'hotel è di tutti","ja":"ホテルはみんなのもの","pt":"O hotel é de todos","ru":"Отель принадлежит всем","zh":"酒店属于每一个人"},"story":[{"en":"The registrar confirms the agreement before midnight. Your timeline and your documents leave no gap for Andreas to use. Lestrade takes him down the mountain under guard.","ar":"يؤكد أمين السجل الاتفاقية قبل منتصف الليل. تسلسلك الزمني ووثائقك لا تتركان لأندرياس أي ثغرة. يقتاده ليستريد إلى أسفل الجبل تحت الحراسة.","de":"Der Registerbeamte bestätigt die Vereinbarung vor Mitternacht. Deine Zeitleiste und deine Dokumente lassen Andreas keine Lücke. Lestrade bringt ihn unter Bewachung den Berg hinunter.","es":"El registrador confirma el acuerdo antes de medianoche. Tu cronología y tus documentos no dejan ningún hueco que Andreas pueda usar. Lestrade se lo lleva montaña abajo bajo custodia.","fr":"Le greffier confirme l'accord avant minuit. Ta chronologie et tes documents ne laissent aucune faille à Andreas. Lestrade l'emmène au bas de la montagne sous escorte.","it":"L'ufficiale del registro conferma l'accordo prima di mezzanotte. La tua cronologia e i tuoi documenti non lasciano ad Andreas nessuno spiraglio. Lestrade lo porta giù dalla montagna sotto scorta.","ja":"登記官は真夜中前に合意書を確認する。あなたの時系列と書類は、アンドレアスにつけ入るすきを与えない。レストレードは彼を護送して山を下りる。","pt":"O conservador confirma o acordo antes da meia-noite. A sua cronologia e os seus documentos não deixam nenhuma brecha a Andreas. Lestrade leva-o montanha abaixo sob escolta.","ru":"Регистратор подтверждает соглашение до полуночи. Твоя хронология и документы не оставляют Андреасу ни одной лазейки. Лестрейд под охраной увозит его с горы.","zh":"登记官在午夜前确认了协议。你的时间线和文件没给安德烈亚斯留下任何漏洞。雷斯垂德把他押送下山。"},{"en":"At dawn, Elizabeth reads the staff's names from the ownership register. Mrs Hudson says shareholders can still wash dishes. Zombiella starts a song; this time, nobody has paid her to keep singing.","ar":"عند الفجر تقرأ إليزابيث أسماء الموظفين من سجل الملكية. تقول السيدة هدسون إن المساهمين يستطيعون غسل الصحون أيضًا. تبدأ زومبيلا أغنية، وهذه المرة لم يدفع لها أحد لتواصل الغناء.","de":"Im Morgengrauen liest Elizabeth die Namen des Personals aus dem Eigentumsregister vor. Mrs Hudson sagt, auch Anteilseigner können Geschirr spülen. Zombiella stimmt ein Lied an; diesmal hat sie niemand dafür bezahlt, weiterzusingen.","es":"Al amanecer, Elizabeth lee los nombres del personal en el registro de propiedad. La señora Hudson dice que los accionistas también pueden fregar platos. Zombiella empieza una canción; esta vez nadie le ha pagado para que siga cantando.","fr":"À l'aube, Elizabeth lit les noms du personnel dans le registre de propriété. Mrs Hudson déclare que les actionnaires peuvent toujours faire la vaisselle. Zombiella commence une chanson ; cette fois, personne ne l'a payée pour continuer à chanter.","it":"All'alba, Elizabeth legge i nomi del personale dal registro della proprietà. La signora Hudson dice che anche gli azionisti possono lavare i piatti. Zombiella attacca una canzone; questa volta nessuno l'ha pagata per continuare a cantare.","ja":"夜明けに、エリザベスが所有者名簿からスタッフの名前を読み上げる。ハドソン夫人は、株主だって皿洗いはできると言う。ゾンビエラが歌い出す。今度は、歌い続けるよう誰にもお金をもらっていない。","pt":"Ao amanhecer, Elizabeth lê os nomes do pessoal no registo de propriedade. A Sra. Hudson diz que os acionistas também podem lavar a loiça. Zombiella começa uma canção; desta vez, ninguém lhe pagou para continuar a cantar.","ru":"На рассвете Элизабет зачитывает имена сотрудников из реестра собственников. Миссис Хадсон заявляет, что акционеры тоже могут мыть посуду. Зомбиэлла начинает песню; на этот раз никто не платил ей, чтобы она продолжала петь.","zh":"黎明时，伊丽莎白从所有权登记簿上念出员工的名字。哈德森太太说股东也照样可以洗碗。僵尸艾拉唱起一首歌；这一次，没有人付钱让她一直唱下去。"},{"en":"You protected Blocula first and gave the whole staff a voice. The hotel reopens as a staff-run business.","ar":"حميت بلوكولا أولًا وأعطيت كل الموظفين صوتًا. يعيد الفندق فتح أبوابه مشروعًا يديره موظفوه.","de":"Du hast zuerst Blocula geschützt und dem ganzen Personal eine Stimme gegeben. Das Hotel öffnet wieder, als Betrieb in den Händen seines Personals.","es":"Protegiste primero a Blocula y diste voz a todo el personal. El hotel vuelve a abrir como un negocio dirigido por su personal.","fr":"Tu as d'abord protégé Blocula et donné une voix à tout le personnel. L'hôtel rouvre comme une entreprise gérée par son personnel.","it":"Hai protetto prima Blocula e hai dato voce a tutto il personale. L'hotel riapre come un'impresa gestita dal suo personale.","ja":"あなたはまずブロキュラを守り、スタッフ全員に発言権を与えた。ホテルはスタッフが経営する会社として再開する。","pt":"Protegeu primeiro Blocula e deu voz a todo o pessoal. O hotel reabre como um negócio gerido pelo seu pessoal.","ru":"Ты сначала защитил Блокулу и дал голос всему персоналу. Отель снова открывается как предприятие, которым управляют его сотрудники.","zh":"你先保护了布洛库拉，并让全体员工都有了发言权。酒店重新开业，成为一家由员工经营的企业。"}],"img":"25_agreement.webp","hot":[55,78,14,10],"pos":"left","v":"center","width":36},"middle":{"kind":"ending","k":{"en":"THE FIRST MORNING · ENDING","ar":"الصباح الأول · النهاية","de":"DER ERSTE MORGEN · ENDE","es":"LA PRIMERA MAÑANA · FINAL","fr":"LE PREMIER MATIN · FIN","it":"IL PRIMO MATTINO · FINALE","ja":"最初の朝 · エンディング","pt":"A PRIMEIRA MANHÃ · FINAL","ru":"ПЕРВОЕ УТРО · КОНЦОВКА","zh":"第一个早晨 · 结局"},"title":{"en":"A future under negotiation","ar":"مستقبل قيد التفاوض","de":"Eine Zukunft in Verhandlung","es":"Un futuro en negociación","fr":"Un avenir en négociation","it":"Un futuro da negoziare","ja":"交渉中の未来","pt":"Um futuro em negociação","ru":"Будущее под переговорами","zh":"谈判中的未来"},"story":[{"en":"The agreement reaches the registrar, and your evidence is strong enough to stop a quiet takeover. Some details need a second check, but the sale is suspended. Andreas must answer to Lestrade.","ar":"تصل الاتفاقية إلى أمين السجل، وأدلتك قوية بما يكفي لإيقاف استحواذ صامت. بعض التفاصيل تحتاج إلى مراجعة ثانية، لكن البيع معلّق. سيُحاسَب أندرياس أمام ليستريد.","de":"Die Vereinbarung erreicht den Registerbeamten, und deine Beweise reichen, um eine stille Übernahme zu stoppen. Einige Details müssen noch einmal geprüft werden, aber der Verkauf ist ausgesetzt. Andreas muss sich vor Lestrade verantworten.","es":"El acuerdo llega al registrador, y tus pruebas son lo bastante sólidas para frenar una compra silenciosa. Algunos detalles necesitan una segunda revisión, pero la venta queda suspendida. Andreas tendrá que responder ante Lestrade.","fr":"L'accord arrive chez le greffier, et tes preuves sont assez solides pour arrêter un rachat discret. Certains détails doivent être revérifiés, mais la vente est suspendue. Andreas devra répondre devant Lestrade.","it":"L'accordo arriva all'ufficiale del registro, e le tue prove sono abbastanza solide da fermare un'acquisizione silenziosa. Alcuni dettagli vanno ricontrollati, ma la vendita è sospesa. Andreas dovrà rispondere a Lestrade.","ja":"合意書は登記官に届き、あなたの証拠は静かな乗っ取りを止めるのに十分だった。いくつかの点は再確認が必要だが、売却は保留になる。アンドレアスはレストレードに対して責任を問われる。","pt":"O acordo chega ao conservador, e as suas provas são fortes o suficiente para travar uma compra silenciosa. Alguns pormenores precisam de ser revistos, mas a venda fica suspensa. Andreas terá de responder perante Lestrade.","ru":"Соглашение доходит до регистратора, и твоих улик хватает, чтобы остановить тихий захват. Некоторые детали нужно перепроверить, но продажа приостановлена. Андреасу придётся отвечать перед Лестрейдом.","zh":"协议送到了登记官那里，你的证据足以阻止一次悄无声息的收购。有些细节需要再核查，但买卖已被暂停。安德烈亚斯必须向雷斯垂德交代。"},{"en":"The staff keep their jobs while Elizabeth and the Count work through the remaining questions. By breakfast, a handwritten notice replaces the closing sign: OPEN — PLEASE BE PATIENT.","ar":"يحتفظ الموظفون بوظائفهم بينما تعالج إليزابيث والكونت المسائل المتبقية. عند الفطور تحلّ لافتة مكتوبة باليد محل لافتة الإغلاق: مفتوح — نرجو الصبر.","de":"Das Personal behält seine Stellen, während Elizabeth und der Graf die offenen Fragen klären. Beim Frühstück ersetzt ein handgeschriebener Zettel das Schließungsschild: GEÖFFNET — BITTE HABEN SIE GEDULD.","es":"El personal conserva su trabajo mientras Elizabeth y el conde resuelven las preguntas pendientes. A la hora del desayuno, un cartel escrito a mano sustituye al de cierre: ABIERTO — TENGAN PACIENCIA.","fr":"Le personnel garde ses emplois pendant qu'Elizabeth et le comte règlent les questions restantes. Au petit-déjeuner, un mot écrit à la main remplace le panneau de fermeture : OUVERT — MERCI DE VOTRE PATIENCE.","it":"Il personale mantiene il lavoro mentre Elizabeth e il conte risolvono le questioni rimaste. All'ora di colazione, un cartello scritto a mano sostituisce quello della chiusura: APERTO — PORTATE PAZIENZA.","ja":"エリザベスと伯爵が残りの問題に取り組む間、スタッフは仕事を続けられる。朝食の時間には、閉館の看板の代わりに手書きの張り紙が出ている。「営業中 — しばらくお待ちください」。","pt":"O pessoal mantém os empregos enquanto Elizabeth e o conde resolvem as questões pendentes. À hora do pequeno-almoço, um aviso escrito à mão substitui o letreiro de encerramento: ABERTO — PEDIMOS PACIÊNCIA.","ru":"Персонал сохраняет работу, пока Элизабет и граф разбираются с оставшимися вопросами. К завтраку рукописная записка заменяет табличку о закрытии: ОТКРЫТО — ПРОСИМ ТЕРПЕНИЯ.","zh":"员工保住了工作，伊丽莎白和伯爵则继续处理剩下的问题。到早餐时，一张手写的告示取代了停业的牌子：照常营业——敬请耐心。"}],"routeStory":{"SCANNER":{"en":"The early scan helped, but leaving Blocula in the cold cost trust. Victor reminds you that the best plan protects people as well as papers.","ar":"ساعد المسح المبكر، لكن ترك بلوكولا في البرد كلّف ثقة. يذكّرك فيكتور بأن أفضل خطة تحمي الناس كما تحمي الأوراق.","de":"Der frühe Scan hat geholfen, aber Blocula in der Kälte zu lassen, hat Vertrauen gekostet. Victor erinnert dich daran, dass der beste Plan Menschen genauso schützt wie Papiere.","es":"El escaneo temprano ayudó, pero dejar a Blocula con frío costó confianza. Victor te recuerda que el mejor plan protege a las personas además de los papeles.","fr":"Le scan anticipé a aidé, mais laisser Blocula dans le froid a coûté de la confiance. Victor te rappelle que le meilleur plan protège les gens autant que les papiers.","it":"La scansione anticipata ha aiutato, ma lasciare Blocula al freddo è costato fiducia. Victor ti ricorda che il piano migliore protegge le persone oltre che le carte.","ja":"早めのスキャンは役に立ったが、ブロキュラを寒さの中に残したことで信頼を失った。ヴィクターは、最良の計画は書類だけでなく人も守るものだとあなたに思い出させる。","pt":"A digitalização antecipada ajudou, mas deixar Blocula ao frio custou confiança. Victor lembra-lhe que o melhor plano protege as pessoas tanto quanto os papéis.","ru":"Раннее сканирование помогло, но то, что Блокулу оставили на холоде, стоило доверия. Виктор напоминает тебе, что лучший план защищает людей так же, как бумаги.","zh":"提前扫描起了作用，但把布洛库拉留在寒冷中让你失去了一些信任。维克多提醒你，最好的计划既要保护文件，也要保护人。"},"PRIVATE":{"en":"Your private settlement keeps the hotel open, but the staff want a full meeting before they trust the new arrangement.","ar":"تسويتك الخاصة تبقي الفندق مفتوحًا، لكن الموظفين يريدون اجتماعًا كاملًا قبل أن يثقوا بالترتيب الجديد.","de":"Deine private Einigung hält das Hotel offen, aber das Personal will eine vollständige Versammlung, bevor es der neuen Regelung vertraut.","es":"Tu acuerdo privado mantiene abierto el hotel, pero el personal quiere una reunión completa antes de confiar en el nuevo arreglo.","fr":"Ton arrangement privé garde l'hôtel ouvert, mais le personnel veut une réunion complète avant de faire confiance au nouvel accord.","it":"Il tuo accordo privato tiene aperto l'hotel, ma il personale vuole un'assemblea completa prima di fidarsi della nuova intesa.","ja":"内々の和解でホテルは営業を続けるが、スタッフは新しい取り決めを信じる前に全体会議を開きたがっている。","pt":"O seu acordo privado mantém o hotel aberto, mas o pessoal quer uma reunião completa antes de confiar no novo arranjo.","ru":"Твоя частная договорённость сохраняет отель открытым, но персонал хочет общего собрания, прежде чем доверять новому порядку.","zh":"你的私下和解让酒店继续营业，但员工希望先开一次全体会议，再决定是否信任新的安排。"},"PUBLIC":{"en":"The central case is sound. A clearer timeline would have made the transfer immediate.","ar":"جوهر القضية سليم. لو كان التسلسل الزمني أوضح لتمّ النقل فورًا.","de":"Der Kern des Falls ist solide. Eine klarere Zeitleiste hätte die Übertragung sofort möglich gemacht.","es":"El caso central es sólido. Una cronología más clara habría hecho inmediata la transferencia.","fr":"Le cœur de l'affaire est solide. Une chronologie plus claire aurait rendu le transfert immédiat.","it":"Il cuore del caso è solido. Una cronologia più chiara avrebbe reso immediato il trasferimento.","ja":"事件の核心は確かだ。時系列がもっとはっきりしていれば、所有の移転はすぐに済んでいただろう。","pt":"O centro do caso é sólido. Uma cronologia mais clara teria tornado a transferência imediata.","ru":"Основа дела надёжна. Более ясная хронология сделала бы передачу немедленной.","zh":"案件的核心是可靠的。如果时间线更清楚，所有权本可以立刻转移。"}},"img":"26_confrontation.webp","hot":[62,77,8,14],"pos":"left","v":"center","width":44},"practice":{"kind":"ending","k":{"en":"THE FIRST MORNING · ENDING","ar":"الصباح الأول · النهاية","de":"DER ERSTE MORGEN · ENDE","es":"LA PRIMERA MAÑANA · FINAL","fr":"LE PREMIER MATIN · FIN","it":"IL PRIMO MATTINO · FINALE","ja":"最初の朝 · エンディング","pt":"A PRIMEIRA MANHÃ · FINAL","ru":"ПЕРВОЕ УТРО · КОНЦОВКА","zh":"第一个早晨 · 结局"},"title":{"en":"One more night","ar":"ليلة أخرى","de":"Noch eine Nacht","es":"Una noche más","fr":"Une nuit de plus","it":"Un'altra notte","ja":"もう一晩","pt":"Mais uma noite","ru":"Ещё одна ночь","zh":"再多一夜"},"story":[{"en":"Blocula is safe, Andreas is detained, and the agreement has reached the village. But the evidence has too many uncertain details for registration tonight. The registrar orders a review of the sale. The hotel stays open for now.","ar":"بلوكولا في أمان، وأندرياس محتجز، والاتفاقية وصلت إلى القرية. لكن في الأدلة تفاصيل غير مؤكدة كثيرة تمنع التسجيل الليلة. يأمر أمين السجل بمراجعة البيع. يبقى الفندق مفتوحًا في الوقت الحالي.","de":"Blocula ist in Sicherheit, Andreas ist festgenommen, und die Vereinbarung hat das Dorf erreicht. Aber die Beweise enthalten zu viele unsichere Details für eine Eintragung heute Nacht. Der Registerbeamte ordnet eine Prüfung des Verkaufs an. Das Hotel bleibt vorerst geöffnet.","es":"Blocula está a salvo, Andreas está detenido y el acuerdo ha llegado al pueblo. Pero las pruebas tienen demasiados detalles dudosos para registrarlo esta noche. El registrador ordena revisar la venta. Por ahora, el hotel sigue abierto.","fr":"Blocula est sain et sauf, Andreas est arrêté, et l'accord est arrivé au village. Mais les preuves contiennent trop de détails incertains pour un enregistrement ce soir. Le greffier ordonne un réexamen de la vente. L'hôtel reste ouvert pour l'instant.","it":"Blocula è salvo, Andreas è in stato di fermo e l'accordo è arrivato in paese. Ma le prove contengono troppi dettagli incerti per una registrazione stanotte. L'ufficiale del registro ordina una revisione della vendita. Per ora l'hotel resta aperto.","ja":"ブロキュラは無事で、アンドレアスは拘束され、合意書は村に届いた。だが証拠には不確かな点が多すぎて、今夜の登記はできない。登記官は売却の見直しを命じる。ホテルはひとまず営業を続ける。","pt":"Blocula está a salvo, Andreas está detido e o acordo chegou à aldeia. Mas as provas têm demasiados pormenores incertos para um registo esta noite. O conservador manda rever a venda. Por agora, o hotel continua aberto.","ru":"Блокула в безопасности, Андреас задержан, а соглашение добралось до деревни. Но в уликах слишком много неясных деталей для регистрации этой ночью. Регистратор назначает проверку сделки. Пока что отель остаётся открытым.","zh":"布洛库拉平安无事，安德烈亚斯被拘留，协议也送到了村里。但证据中有太多不确定的细节，今晚无法登记。登记官下令复查这笔买卖。酒店暂时继续营业。"},{"en":"Holmes asks you to sit beside the fire. \"We know what happened. Now we must learn to explain when.\" You completed the rescue. Review the tense contrasts and come back to secure the staff's future.","ar":"يطلب منك هولمز أن تجلس قرب النار. «نعرف ما حدث. الآن علينا أن نتعلم كيف نشرح متى». لقد أتممت الإنقاذ. راجع تقابلات الأزمنة وعُد لتضمن مستقبل الموظفين.","de":"Holmes bittet dich, dich ans Feuer zu setzen. „Wir wissen, was passiert ist. Jetzt müssen wir lernen zu erklären, wann.“ Du hast die Rettung geschafft. Wiederhole die Zeitformen-Kontraste und komm zurück, um die Zukunft des Personals zu sichern.","es":"Holmes te pide que te sientes junto al fuego. «Sabemos lo que pasó. Ahora tenemos que aprender a explicar cuándo». Completaste el rescate. Repasa los contrastes de tiempos y vuelve para asegurar el futuro del personal.","fr":"Holmes te demande de t'asseoir près du feu. « Nous savons ce qui s'est passé. Maintenant, nous devons apprendre à expliquer quand. » Tu as réussi le sauvetage. Revois les contrastes de temps et reviens assurer l'avenir du personnel.","it":"Holmes ti chiede di sederti accanto al fuoco. «Sappiamo che cosa è successo. Ora dobbiamo imparare a spiegare quando». Hai completato il salvataggio. Ripassa i contrasti tra i tempi e torna ad assicurare il futuro del personale.","ja":"ホームズが暖炉のそばに座るよう勧める。「何が起きたかはわかっている。次は、それがいつだったかを説明できるようにならなければ」。あなたは救出をやり遂げた。時制の対比を復習して、スタッフの未来を守りにまた来よう。","pt":"Holmes pede-lhe que se sente junto à lareira. «Sabemos o que aconteceu. Agora temos de aprender a explicar quando.» Concluiu o resgate. Reveja os contrastes de tempos e volte para garantir o futuro do pessoal.","ru":"Холмс просит тебя сесть у огня. «Мы знаем, что произошло. Теперь нужно научиться объяснять, когда». Ты завершил спасение. Повтори контрасты времён и возвращайся, чтобы обеспечить будущее персонала.","zh":"福尔摩斯请你在炉火旁坐下。\"我们知道发生了什么。现在我们必须学会解释是什么时候。\"你完成了营救。复习一下时态对比，再回来保住员工们的未来。"}],"img":"29_descent.webp","hot":[82,63,8,14],"pos":"left","v":"center"}},"endings":{"master":"best","complete":"middle","missing":"practice","failed":"practice"},"max":140,"points":5,"tiles":5,"chances":0,"completeScore":85,"repair":false,"total":28,"bands":[],"ladder":[{"min":115,"tiles":4,"route":["RESCUE","PUBLIC"],"ending":"best"},{"min":85,"tiles":3,"ending":"middle"},{"ending":"practice"}],"chapters":null,"fit":"cover","pageClues":true,"tags":{"a":{"en":"NOW"},"b":{"en":"USUALLY"}}};

   tile/chance ladder and score-only `bands`: a pass mark, then the collection,
   then a perfect score. The Kraken export's own rule, verbatim —
   `chances<=0 || n<60 ? failed : items<4 ? missing : n===70 ? master : complete`
   — and it deliberately does not consult the final question, which the ladder
   below does. A 60/70 run with one collectible missing is `missing`; the
   ladder called it `failed` because the last answer was wrong, which is a
   different game from the one the export shipped. */
/* `ladder` is the fourth way: rungs of {min, tiles, route, ending}, best first,
   the first rung whose score floor, tile floor and required routes the run
   meets. The Grand Hotel's best ending needs a score, four verified clues AND
   two particular story choices; no other rule can say that. Consulted first;
   a lesson without one is unchanged. */
function resolve(){const c=CH();if(c.ladder&&c.ladder.length){const r=c.ladder.find(r=>state.score>=(r.min||0)&&state.tiles>=(r.tiles||0)&&(r.route||[]).every(x=>state.route.includes(x)));if(r)return r.ending}
  if(c.passScore!=null){const live=!c.chances||state.chances>0;if(!live||state.score<c.passScore)return c.endings.failed;if(state.tiles<c.tiles)return c.endings.missing;if(state.score>=c.max)return c.endings.master;return c.endings.complete}
  if(c.bands&&c.bands.length){const b=c.bands.find(b=>state.score>=b[0]);if(b)return b[1]}
  const alive=!c.chances||state.chances>0;const full=state.tiles>=c.tiles&&alive;const flawless=state.finalCorrect&&full&&state.score>=c.max;if(flawless&&(!state.endingPick||state.endingMaster))return c.endings.master;if(state.endingPick&&alive&&c.endings[state.endingPick]&&!(state.endingMin&&state.score<state.endingMin))return c.endings[state.endingPick];if(state.finalCorrect&&full&&state.score>=c.completeScore)return c.endings.complete;if(state.finalCorrect&&state.tiles<c.tiles)return c.endings.missing;return c.endings.failed}
/* `G.chances &&` is the same guard resolve() carries: a lesson with no chance
   counter at all (G.chances is 0 by design) has state.chances<=0 from the
   first frame, so the old test threw the learner to the failed ending on their
   first wrong answer. With chances in play this is exactly the old test. */
function advance(){const s=G.scenes[state.scene];const c=CH();if(c.chances&&state.chances<=0&&state.results[state.scene]!==s.answer){go(c.endings.failed);return}if(s.next==='resolve'){go(resolve());return}go(s.next)}
/* `endingMin` is a score floor on a route's own ending: the route decides WHICH
   reward ending you get, the floor decides whether you have earned one at all.
   Without it a route ending applies at any score. Frankenstein sets none, so its
   behaviour is unchanged. */
/* `points` on a route is the export kind whose story choices score (Frostbound:
   the careful road pays 4, the shortcut 2, and the ending bands read the
   total). A route without `points` scores nothing, as every route did before. */
function chooseRoute(i){const r=G.scenes[state.scene].routes[i];if(r.route)state.route.push(r.route);if(r.points)state.score+=r.points;if(r.ending){state.endingPick=r.ending;state.endingMaster=!!r.master;state.endingMin=r.endingMin||0}go(r.min!=null&&state.score<r.min?r.else:r.target)}
function restart(){state=fresh(state.lang,state.chapter);render()}
/* the hub and the chapters it starts. `toHub` resets to no chapter at all, so
   the HUD badges go quiet until one is picked. */
function startChapter(i){state=fresh(state.lang,i);render()}
function toHub(){state=fresh(state.lang,null);render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?`<b>OFF</b><span>${esc(G.labels.off.en)}</span>`:`<b>${l.toUpperCase()}</b><span>${esc(G.names[l])}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('sound').addEventListener('click',()=>{setSound(!sound);beep(true)});
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
/* In Block Camp, block-camp/camp-full.js takes this button over (an iPhone has no
   Fullscreen API, so there it explains the Home Screen instead of doing nothing),
   and the first START on a phone pops the game out to full screen. */
document.addEventListener('click',e=>{if(window.CampFull&&e.target.closest&&e.target.closest('.start'))CampFull.popOut()},true);
document.addEventListener('keydown',e=>{const k=e.key;if(k.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(k==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(k.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(k.toLowerCase()==='s'){document.getElementById('sound').click();return}if(!state.open&&(k==='Enter'||NUM.includes(k))){openPanel();return}const s=G.scenes[state.scene];if(NUM.includes(k)){const i=Number(k)-1;if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click();return}if(k==='Enter')document.querySelector('.continue:not([hidden]),.start,.restart')?.click()});
setSound(sound);render();
</script>
<script src="camp-full.js" defer></script>
<script src="camp-music.js" data-track="music/grand-hotel.m4a" data-loop="0.5 68.766667" defer></script>
