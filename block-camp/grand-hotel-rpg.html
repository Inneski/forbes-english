 · get Blocula out first","ar":"القفل · أخرج بلوكولا أولًا","de":"Das Schloss · zuerst Blocula herausholen","es":"La cerradura · saca primero a Blocula","fr":"La serrure · sortir Blocula d'abord","it":"La serratura · prima tira fuori Blocula","ja":"錠 · 先にブロキュラを出す","pt":"A fechadura · tirar Blocula primeiro","ru":"Замок · сначала вытащить Блокулу","zh":"门锁 · 先把布洛库拉救出来"},"desc":{"en":"Protect the owner. The document can be scanned after the rescue.","ar":"احمِ المالك. يمكن مسح الوثيقة بعد الإنقاذ.","de":"Schütze den Besitzer. Das Dokument kann nach der Rettung gescannt werden.","es":"Protege al dueño. El documento se puede escanear después del rescate.","fr":"Protéger le propriétaire. Le document pourra être scanné après le sauvetage.","it":"Proteggi il proprietario. Il documento si può scansionare dopo il salvataggio.","ja":"オーナーを守る。書類のスキャンは救出の後でもできる。","pt":"Proteja o dono. O documento pode ser digitalizado depois do resgate.","ru":"Защити владельца. Документ можно отсканировать после спасения.","zh":"保护老板。救人之后再扫描文件也不迟。"},"route":"RESCUE","target":"p20"},{"name":{"en":"The scanner · protect the agreement first","ar":"الماسح · احمِ الاتفاقية أولًا","de":"Der Scanner · zuerst die Vereinbarung sichern","es":"El escáner · protege primero el acuerdo","fr":"Le scanner · protéger l'accord d'abord","it":"Lo scanner · prima proteggi l'accordo","ja":"スキャナー · 先に合意書を守る","pt":"O scanner · proteger o acordo primeiro","ru":"Сканер · сначала сохранить соглашение","zh":"扫描仪 · 先保住协议"},"desc":{"en":"Secure an early copy, but leave Blocula in the cold for longer.","ar":"احصل على نسخة مبكرة، لكن اترك بلوكولا في البرد مدة أطول.","de":"Sichere früh eine Kopie, aber lass Blocula länger in der Kälte.","es":"Consigue una copia pronto, pero deja a Blocula más tiempo con frío.","fr":"Obtenir tôt une copie, mais laisser Blocula plus longtemps dans le froid.","it":"Ottieni subito una copia, ma lascia Blocula più a lungo al freddo.","ja":"早めに写しを確保するが、ブロキュラを寒さの中に長く残すことになる。","pt":"Garanta já uma cópia, mas deixe Blocula mais tempo ao frio.","ru":"Получи копию пораньше, но оставь Блокулу дольше на холоде.","zh":"尽早拿到副本，但让布洛库拉在寒冷中多待一会儿。"},"route":"SCANNER","target":"p20"}],"img":"21_priority.webp","hot":[30,70,13,24],"pos":"right","v":"center"},"p20":{"kind":"question","k":{"en":"ACT II · 22:40 · THE ENGINE ROOM","ar":"الفصل الثاني · 22:40 · غرفة المحركات","de":"AKT II · 22:40 · DER MASCHINENRAUM","es":"ACTO II · 22:40 · LA SALA DE MÁQUINAS","fr":"ACTE II · 22:40 · LA SALLE DES MACHINES","it":"ATTO II · 22:40 · LA SALA MACCHINE","ja":"第2幕 · 22:40 · 機関室","pt":"ATO II · 22:40 · A CASA DAS MÁQUINAS","ru":"АКТ II · 22:40 · МАШИННОЕ ОТДЕЛЕНИЕ","zh":"第二幕 · 22:40 · 机房"},"title":{"en":"The longest shift","ar":"أطول نوبة","de":"Die längste Schicht","es":"El turno más largo","fr":"Le service le plus long","it":"Il turno più lungo","ja":"いちばん長いシフト","pt":"O turno mais longo","ru":"Самая длинная смена","zh":"最漫长的一班"},"story":[{"en":"Nemo brings a boat battery to keep the lights alive. Mara and Lia run a cable through the service tunnel. Nadia checks the current while Zombito talks them through every connection. “I started at seven,” he says. “At midnight I’ll have been working for five hours. Remind me never to accept an ‘easy’ evening shift again.”","ar":"يحضر نيمو بطارية قارب لإبقاء الأضواء مشتعلة. تمدّ مارا وليا كابلًا عبر نفق الخدمة. تفحص نادية التيار بينما يرشدهم زومبيتو في كل توصيلة. يقول: «بدأت عند السابعة. عند منتصف الليل سأكون قد عملت خمس ساعات متواصلة. ذكّروني ألا أقبل نوبة مسائية \"سهلة\" مرة أخرى».","de":"Nemo bringt eine Bootsbatterie, damit das Licht anbleibt. Mara und Lia ziehen ein Kabel durch den Diensttunnel. Nadia prüft den Strom, während Zombito sie durch jede Verbindung lotst. „Ich habe um sieben angefangen“, sagt er. „Um Mitternacht werde ich fünf Stunden gearbeitet haben. Erinnert mich daran, nie wieder eine ‚leichte‘ Abendschicht anzunehmen.“","es":"Nemo trae una batería de barca para mantener las luces encendidas. Mara y Lia pasan un cable por el túnel de servicio. Nadia comprueba la corriente mientras Zombito les explica cada conexión. «Empecé a las siete», dice. «A medianoche llevaré cinco horas trabajando. Recordadme que nunca vuelva a aceptar un turno de tarde \"fácil\"».","fr":"Nemo apporte une batterie de bateau pour garder la lumière. Mara et Lia font passer un câble par le tunnel de service. Nadia vérifie le courant pendant que Zombito les guide à chaque branchement. « J'ai commencé à sept heures, dit-il. À minuit, ça fera cinq heures que je travaille. Rappelez-moi de ne plus jamais accepter un service du soir \"facile\". »","it":"Nemo porta una batteria da barca per tenere accese le luci. Mara e Lia fanno passare un cavo nel tunnel di servizio. Nadia controlla la corrente mentre Zombito li guida in ogni collegamento. «Ho cominciato alle sette», dice. «A mezzanotte avrò lavorato per cinque ore. Ricordatemi di non accettare mai più un turno serale \"facile\"».","ja":"ネモが明かりを保つためにボートのバッテリーを持ってくる。マーラとリアが業務用トンネルにケーブルを通す。ナディアが電流を確かめ、ゾンビトが一つひとつの接続を指示する。「7時に始めたんだ」と彼は言う。「真夜中には5時間働き続けていることになる。もう二度と『楽な』夜のシフトなんか引き受けるなと言ってくれ」。","pt":"Nemo traz uma bateria de barco para manter as luzes acesas. Mara e Lia passam um cabo pelo túnel de serviço. Nadia verifica a corrente enquanto Zombito as orienta em cada ligação. «Comecei às sete», diz ele. «À meia-noite vou ter estado a trabalhar durante cinco horas. Lembrem-me de nunca mais aceitar um turno da noite \"fácil\".»","ru":"Немо приносит лодочный аккумулятор, чтобы свет не погас. Мара и Лия тянут кабель через служебный туннель. Надя проверяет ток, пока Зомбито подсказывает им каждое соединение. «Я начал в семь, — говорит он. — К полуночи я буду работать уже пять часов. Напомните мне больше никогда не соглашаться на \"лёгкую\" вечернюю смену».","zh":"尼莫拿来一块船用电池，让灯一直亮着。玛拉和莉亚把电缆穿过员工隧道。娜迪娅检查电流，僵尸托一步步指导她们接好每一个接头。\"我七点开始的，\"他说，\"到午夜我就已经连续干了五个小时了。提醒我以后再也别接什么'轻松'的晚班。\""},{"en":"You need a completed repair before the cable car leaves, not just five hours of effort.","ar":"تحتاج إلى إصلاح منتهٍ قبل أن يغادر التلفريك، لا إلى خمس ساعات من الجهد فقط.","de":"Du brauchst eine fertige Reparatur, bevor die Seilbahn fährt, nicht nur fünf Stunden Mühe.","es":"Necesitas una reparación terminada antes de que salga el teleférico, no solo cinco horas de esfuerzo.","fr":"Il te faut une réparation terminée avant le départ du téléphérique, pas seulement cinq heures d'effort.","it":"Ti serve una riparazione conclusa prima che parta la funivia, non solo cinque ore di sforzo.","ja":"必要なのは、ロープウェイが出る前に完了した修理であって、5時間の努力だけではない。","pt":"Precisa de uma reparação terminada antes de o teleférico partir, não apenas de cinco horas de esforço.","ru":"Тебе нужен законченный ремонт до отхода кабины, а не просто пять часов усилий.","zh":"你需要在缆车出发前完成修理，而不只是五个小时的努力。"}],"prompt":{"en":"Contrast duration up to a future time with completion before a deadline: “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","ar":"قارن بين مدة تمتد حتى وقت مستقبلي وإنجاز قبل موعد نهائي: “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","de":"Stelle Dauer bis zu einem zukünftigen Zeitpunkt und Abschluss vor einer Frist gegenüber: “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","es":"Contrasta la duración hasta un momento futuro con algo terminado antes de un plazo: “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","fr":"Oppose la durée jusqu'à un moment futur et l'achèvement avant une échéance : “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","it":"Metti a confronto la durata fino a un momento futuro e il completamento prima di una scadenza: “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","ja":"未来のある時点までの継続時間と、期限までの完了を対比しよう：“At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","pt":"Contraste a duração até um momento futuro com algo terminado antes de um prazo: “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","ru":"Сопоставь длительность до момента в будущем и завершение к сроку: “At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”","zh":"对比持续到将来某个时间的时长和在截止时间前的完成：“At midnight, Zombito ___ for five hours. By 23:20, he ___ the lock circuit.”"},"opts":[{"en":"will have been working / will have repaired"},{"en":"will have been working / will have been repairing"},{"en":"will be working / has repaired"},{"en":"will work / is repairing"}],"answer":0,"points":5,"fb":[{"en":"Duration up to a future time: ZOMBITO + WILL HAVE BEEN WORKING. Complete by a deadline: HE + WILL HAVE REPAIRED.","ar":"مدة حتى وقت مستقبلي: ZOMBITO + WILL HAVE BEEN WORKING. منتهٍ قبل موعد: HE + WILL HAVE REPAIRED.","de":"Dauer bis zu einem zukünftigen Zeitpunkt: ZOMBITO + WILL HAVE BEEN WORKING. Fertig bis zu einer Frist: HE + WILL HAVE REPAIRED.","es":"Duración hasta un momento futuro: ZOMBITO + WILL HAVE BEEN WORKING. Terminado antes de un plazo: HE + WILL HAVE REPAIRED.","fr":"Durée jusqu'à un moment futur : ZOMBITO + WILL HAVE BEEN WORKING. Terminé avant une échéance : HE + WILL HAVE REPAIRED.","it":"Durata fino a un momento futuro: ZOMBITO + WILL HAVE BEEN WORKING. Concluso entro una scadenza: HE + WILL HAVE REPAIRED.","ja":"未来のある時点までの継続時間：ZOMBITO + WILL HAVE BEEN WORKING。期限までに完了：HE + WILL HAVE REPAIRED。","pt":"Duração até um momento futuro: ZOMBITO + WILL HAVE BEEN WORKING. Terminado até um prazo: HE + WILL HAVE REPAIRED.","ru":"Длительность до момента в будущем: ZOMBITO + WILL HAVE BEEN WORKING. Завершено к сроку: HE + WILL HAVE REPAIRED.","zh":"持续到将来某个时间的时长：ZOMBITO + WILL HAVE BEEN WORKING。在截止时间前完成：HE + WILL HAVE REPAIRED。"},{"en":"The first half is right, but WILL HAVE BEEN REPAIRING measures effort. It does not say the repair is finished.","ar":"النصف الأول صحيح، لكن WILL HAVE BEEN REPAIRING تقيس الجهد. لا تقول إن الإصلاح انتهى.","de":"Die erste Hälfte stimmt, aber WILL HAVE BEEN REPAIRING misst die Mühe. Es sagt nicht, dass die Reparatur fertig ist.","es":"La primera mitad es correcta, pero WILL HAVE BEEN REPAIRING mide el esfuerzo. No dice que la reparación esté terminada.","fr":"La première moitié est juste, mais WILL HAVE BEEN REPAIRING mesure l'effort. Elle ne dit pas que la réparation est finie.","it":"La prima metà è giusta, ma WILL HAVE BEEN REPAIRING misura lo sforzo. Non dice che la riparazione è finita.","ja":"前半は正しいが、WILL HAVE BEEN REPAIRING は努力を測っている。修理が終わったとは言っていない。","pt":"A primeira metade está certa, mas WILL HAVE BEEN REPAIRING mede o esforço. Não diz que a reparação está terminada.","ru":"Первая половина верна, но WILL HAVE BEEN REPAIRING измеряет усилие. Она не говорит, что ремонт закончен.","zh":"前半部分是对的，但 WILL HAVE BEEN REPAIRING 衡量的是努力，并没有说修理已经完成。"},{"en":"WILL BE WORKING does not measure the five hours, and HAS REPAIRED looks from now.","ar":"WILL BE WORKING لا تقيس الساعات الخمس، وHAS REPAIRED تنظر من الآن.","de":"WILL BE WORKING misst die fünf Stunden nicht, und HAS REPAIRED schaut vom Jetzt aus.","es":"WILL BE WORKING no mide las cinco horas, y HAS REPAIRED mira desde el ahora.","fr":"WILL BE WORKING ne mesure pas les cinq heures, et HAS REPAIRED regarde depuis maintenant.","it":"WILL BE WORKING non misura le cinque ore, e HAS REPAIRED guarda dal presente.","ja":"WILL BE WORKING では5時間を測れず、HAS REPAIRED は今から見ている。","pt":"WILL BE WORKING não mede as cinco horas, e HAS REPAIRED olha a partir do agora.","ru":"WILL BE WORKING не измеряет пять часов, а HAS REPAIRED смотрит из настоящего.","zh":"WILL BE WORKING 衡量不了那五个小时，HAS REPAIRED 是从现在看。"},{"en":"WILL WORK does not add up five hours by midnight, and IS REPAIRING is happening now.","ar":"WILL WORK لا تجمع خمس ساعات بحلول منتصف الليل، وIS REPAIRING تحدث الآن.","de":"WILL WORK zählt bis Mitternacht keine fünf Stunden zusammen, und IS REPAIRING passiert jetzt.","es":"WILL WORK no suma cinco horas a medianoche, e IS REPAIRING ocurre ahora.","fr":"WILL WORK n'additionne pas cinq heures à minuit, et IS REPAIRING se passe maintenant.","it":"WILL WORK non somma cinque ore entro mezzanotte, e IS REPAIRING succede ora.","ja":"WILL WORK では真夜中までの5時間を合計できず、IS REPAIRING は今起きていることだ。","pt":"WILL WORK não soma cinco horas até à meia-noite, e IS REPAIRING acontece agora.","ru":"WILL WORK не складывает пять часов к полуночи, а IS REPAIRING происходит сейчас.","zh":"WILL WORK 不能表示到午夜累计五小时，IS REPAIRING 是现在正在发生。"}],"next":"p21","img":"11_engine.webp","hot":[9,26,8,16],"pos":"right","v":"center"},"p21":{"kind":"question","k":{"en":"ACT III · 22:50 · THE PLAN CABINET","ar":"الفصل الثالث · 22:50 · خزانة المخططات","de":"AKT III · 22:50 · DER PLANSCHRANK","es":"ACTO III · 22:50 · EL ARMARIO DE PLANOS","fr":"ACTE III · 22:50 · L'ARMOIRE À PLANS","it":"ATTO III · 22:50 · L'ARMADIO DEI PROGETTI","ja":"第3幕 · 22:50 · 図面棚","pt":"ATO III · 22:50 · O ARMÁRIO DAS PLANTAS","ru":"АКТ III · 22:50 · ШКАФ С ЧЕРТЕЖАМИ","zh":"第三幕 · 22:50 · 图纸柜"},"title":{"en":"The buyer’s real plan","ar":"خطة المشتري الحقيقية","de":"Der wahre Plan des Käufers","es":"El verdadero plan del comprador","fr":"Le vrai plan de l'acheteur","it":"Il vero piano dell'acquirente","ja":"買い手の本当の計画","pt":"O verdadeiro plano do comprador","ru":"Настоящий план покупателя","zh":"买家的真正计划"},"story":[{"en":"Waldman and Aronnax compare the survey with the building plans. Andreas measured a storage wall as if it supported the whole hotel. Kit finds a second set of plans: luxury apartments, with no staff rooms.","ar":"يقارن فالدمان وأروناكس التقرير بمخططات المبنى. قاس أندرياس جدار مخزن كأنه يحمل الفندق كله. تجد كيت مجموعة ثانية من المخططات: شقق فاخرة بلا غرف للموظفين.","de":"Waldman und Aronnax vergleichen das Gutachten mit den Bauplänen. Andreas hat eine Lagerwand vermessen, als würde sie das ganze Hotel tragen. Kit findet einen zweiten Satz Pläne: Luxuswohnungen, ohne Zimmer für das Personal.","es":"Waldman y Aronnax comparan el informe con los planos del edificio. Andreas midió una pared de almacén como si sostuviera todo el hotel. Kit encuentra otro juego de planos: apartamentos de lujo, sin habitaciones para el personal.","fr":"Waldman et Aronnax comparent l'expertise avec les plans du bâtiment. Andreas a mesuré un mur de réserve comme s'il soutenait tout l'hôtel. Kit trouve un deuxième jeu de plans : des appartements de luxe, sans chambres pour le personnel.","it":"Waldman e Aronnax confrontano la perizia con i progetti dell'edificio. Andreas ha misurato un muro di magazzino come se reggesse tutto l'hotel. Kit trova un secondo gruppo di progetti: appartamenti di lusso, senza stanze per il personale.","ja":"ヴァルトマンとアロナックスが調査書と建物の図面を見比べる。アンドレアスは物置の壁を、ホテル全体を支えている壁のように測っていた。キットはもう一組の図面を見つける。高級マンションで、スタッフの部屋はない。","pt":"Waldman e Aronnax comparam a vistoria com as plantas do edifício. Andreas mediu uma parede de arrecadação como se ela sustentasse o hotel inteiro. Kit encontra outro conjunto de plantas: apartamentos de luxo, sem quartos para o pessoal.","ru":"Вальдман и Аронакс сравнивают заключение с чертежами здания. Андреас измерял стену кладовой так, будто она держит весь отель. Кит находит второй комплект чертежей: роскошные апартаменты, без комнат для персонала.","zh":"瓦尔德曼和阿龙纳斯把勘察报告和建筑图纸作对比。安德烈亚斯把一堵储藏室的墙当作支撑整座酒店的墙来测量。基特找到第二套图纸：豪华公寓，没有员工宿舍。"},{"en":"Before anyone noticed the mistake, Andreas was going to use the “unsafe” report to close the hotel cheaply. He had already arranged tomorrow’s meeting with a developer. The missing owner, the false report and the midnight deadline are parts of one scheme.","ar":"قبل أن يلاحظ أحد الخطأ، كان أندرياس ينوي استخدام تقرير «غير آمن» لإغلاق الفندق بثمن بخس. وكان قد رتّب بالفعل اجتماع الغد مع مطوّر عقاري. المالك المفقود والتقرير المزيف وموعد منتصف الليل أجزاء من خطة واحدة.","de":"Bevor jemand den Fehler bemerkte, wollte Andreas den Bericht über die „Unsicherheit“ nutzen, um das Hotel billig zu schließen. Er hatte für morgen schon ein Treffen mit einem Bauträger vereinbart. Der verschwundene Besitzer, der falsche Bericht und die Frist um Mitternacht sind Teile eines einzigen Plans.","es":"Antes de que nadie notara el error, Andreas iba a usar el informe de «inseguro» para cerrar el hotel barato. Ya había organizado para mañana una reunión con un promotor. El dueño desaparecido, el informe falso y el plazo de medianoche son partes de un mismo plan.","fr":"Avant que quiconque remarque l'erreur, Andreas allait utiliser le rapport « dangereux » pour fermer l'hôtel à bas prix. Il avait déjà organisé pour demain une réunion avec un promoteur. Le propriétaire disparu, le faux rapport et l'échéance de minuit font partie d'un même plan.","it":"Prima che qualcuno notasse l'errore, Andreas stava per usare il rapporto di «pericolo» per chiudere l'hotel a poco prezzo. Aveva già organizzato per domani un incontro con un costruttore. Il proprietario scomparso, il falso rapporto e la scadenza di mezzanotte sono parti di un unico piano.","ja":"誰かが誤りに気づく前、アンドレアスは「危険」という報告書を使ってホテルを安く閉めるつもりだった。彼はもう明日の開発業者との会合を手配していた。消えたオーナー、偽の報告書、真夜中の期限は、ひとつの計画の一部だ。","pt":"Antes de alguém reparar no erro, Andreas ia usar o relatório de «inseguro» para fechar o hotel por pouco dinheiro. Já tinha marcado para amanhã uma reunião com um promotor imobiliário. O dono desaparecido, o relatório falso e o prazo da meia-noite fazem parte de um só plano.","ru":"Пока никто не заметил ошибку, Андреас собирался использовать заключение об «опасности», чтобы дёшево закрыть отель. Он уже договорился о завтрашней встрече с застройщиком. Пропавший владелец, ложное заключение и полуночный срок — части одного плана.","zh":"在有人发现这个错误之前，安德烈亚斯本打算用这份\"不安全\"报告低价关闭酒店。他已经安排好明天和一位开发商见面。失踪的老板、伪造的报告和午夜的截止时间都是同一个阴谋的一部分。"}],"prompt":{"en":"Describe an intention held in the past, then an arrangement completed before discovery: “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","ar":"صف نية كانت في الماضي، ثم ترتيبًا اكتمل قبل الاكتشاف: “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","de":"Beschreibe eine Absicht in der Vergangenheit, dann eine Vereinbarung, die vor der Entdeckung fertig war: “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","es":"Describe una intención que se tenía en el pasado y luego algo organizado antes del descubrimiento: “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","fr":"Décris une intention passée, puis un arrangement terminé avant la découverte : “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","it":"Descrivi un'intenzione che si aveva nel passato, poi un accordo concluso prima della scoperta: “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","ja":"過去に持っていた意図と、発覚の前に済んでいた手配を表そう：“Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","pt":"Descreva uma intenção que se tinha no passado e depois algo combinado antes da descoberta: “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","ru":"Опиши намерение в прошлом, а затем договорённость, завершённую до открытия: “Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”","zh":"描述一个过去持有的打算，再描述一个在被发现之前已完成的安排：“Andreas ___ close the hotel. He ___ the developer’s meeting before Waldman found the error.”"},"opts":[{"en":"will / arranges"},{"en":"was going to / had arranged"},{"en":"is going to / has arranged"},{"en":"has been going to / was arranging"}],"answer":1,"points":5,"fb":[{"en":"WILL and ARRANGES look forward from now, not back to his plan.","ar":"WILL وARRANGES تنظران إلى الأمام من الآن، لا إلى الوراء نحو خطته.","de":"WILL und ARRANGES schauen vom Jetzt nach vorn, nicht zurück auf seinen Plan.","es":"WILL y ARRANGES miran hacia delante desde el ahora, no hacia atrás a su plan.","fr":"WILL et ARRANGES regardent vers l'avant depuis maintenant, pas en arrière vers son plan.","it":"WILL e ARRANGES guardano avanti dal presente, non indietro verso il suo piano.","ja":"WILL と ARRANGES は今から先を見ていて、彼の計画を振り返ってはいない。","pt":"WILL e ARRANGES olham para a frente a partir do agora, não para trás, para o plano dele.","ru":"WILL и ARRANGES смотрят вперёд из настоящего, а не назад на его план.","zh":"WILL 和 ARRANGES 是从现在向前看，而不是回头看他的计划。"},{"en":"A plan in the past: ANDREAS + WAS GOING TO close. Finished before the discovery: HE + HAD ARRANGED.","ar":"خطة في الماضي: ANDREAS + WAS GOING TO close. اكتمل قبل الاكتشاف: HE + HAD ARRANGED.","de":"Ein Plan in der Vergangenheit: ANDREAS + WAS GOING TO close. Vor der Entdeckung fertig: HE + HAD ARRANGED.","es":"Un plan en el pasado: ANDREAS + WAS GOING TO close. Terminado antes del descubrimiento: HE + HAD ARRANGED.","fr":"Un projet dans le passé : ANDREAS + WAS GOING TO close. Terminé avant la découverte : HE + HAD ARRANGED.","it":"Un piano nel passato: ANDREAS + WAS GOING TO close. Concluso prima della scoperta: HE + HAD ARRANGED.","ja":"過去の計画：ANDREAS + WAS GOING TO close。発覚の前に完了：HE + HAD ARRANGED。","pt":"Um plano no passado: ANDREAS + WAS GOING TO close. Terminado antes da descoberta: HE + HAD ARRANGED.","ru":"План в прошлом: ANDREAS + WAS GOING TO close. Завершено до открытия: HE + HAD ARRANGED.","zh":"过去的计划：ANDREAS + WAS GOING TO close。在被发现之前完成：HE + HAD ARRANGED。"},{"en":"IS GOING TO and HAS ARRANGED look from now. We are looking back from the past.","ar":"IS GOING TO وHAS ARRANGED تنظران من الآن. نحن ننظر إلى الوراء من الماضي.","de":"IS GOING TO und HAS ARRANGED schauen vom Jetzt aus. Wir schauen aus der Vergangenheit zurück.","es":"IS GOING TO y HAS ARRANGED miran desde el ahora. Estamos mirando atrás desde el pasado.","fr":"IS GOING TO et HAS ARRANGED regardent depuis maintenant. Nous regardons en arrière depuis le passé.","it":"IS GOING TO e HAS ARRANGED guardano dal presente. Noi guardiamo indietro dal passato.","ja":"IS GOING TO と HAS ARRANGED は今から見ている。私たちは過去から振り返っている。","pt":"IS GOING TO e HAS ARRANGED olham a partir do agora. Estamos a olhar para trás a partir do passado.","ru":"IS GOING TO и HAS ARRANGED смотрят из настоящего. А мы смотрим назад из прошлого.","zh":"IS GOING TO 和 HAS ARRANGED 是从现在看。我们是在从过去回头看。"},{"en":"HAS BEEN GOING TO is not English, and WAS ARRANGING leaves the arrangement unfinished.","ar":"HAS BEEN GOING TO غير موجودة في الإنجليزية، وWAS ARRANGING تترك الترتيب غير مكتمل.","de":"HAS BEEN GOING TO gibt es im Englischen nicht, und WAS ARRANGING lässt die Vereinbarung unfertig.","es":"HAS BEEN GOING TO no existe en inglés, y WAS ARRANGING deja la organización sin terminar.","fr":"HAS BEEN GOING TO n'existe pas en anglais, et WAS ARRANGING laisse l'arrangement inachevé.","it":"HAS BEEN GOING TO non esiste in inglese, e WAS ARRANGING lascia l'accordo non concluso.","ja":"HAS BEEN GOING TO という英語はなく、WAS ARRANGING だと手配が終わっていないことになる。","pt":"HAS BEEN GOING TO não existe em inglês, e WAS ARRANGING deixa o combinado por terminar.","ru":"HAS BEEN GOING TO в английском не существует, а WAS ARRANGING оставляет договорённость незавершённой.","zh":"英语里没有 HAS BEEN GOING TO，WAS ARRANGING 让安排停留在未完成。"}],"next":"p22","img":"22_survey.webp","hot":[60,78,18,12],"pos":"left","v":"center","width":40},"p22":{"kind":"question","k":{"en":"ACT III · 23:00 · THE SIDE PASSAGE","ar":"الفصل الثالث · 23:00 · الممر الجانبي","de":"AKT III · 23:00 · DER SEITENGANG","es":"ACTO III · 23:00 · EL PASADIZO LATERAL","fr":"ACTE III · 23:00 · LE PASSAGE LATÉRAL","it":"ATTO III · 23:00 · IL PASSAGGIO LATERALE","ja":"第3幕 · 23:00 · 脇の通路","pt":"ATO III · 23:00 · A PASSAGEM LATERAL","ru":"АКТ III · 23:00 · БОКОВОЙ ПРОХОД","zh":"第三幕 · 23:00 · 侧廊"},"title":{"en":"Evidence from your partner","ar":"أدلة شريكتك","de":"Beweise von deiner Partnerin","es":"Las pruebas de tu compañera","fr":"Les preuves de ta partenaire","it":"Le prove della tua compagna","ja":"パートナーが持ってきた証拠","pt":"As provas da sua parceira","ru":"Улики от напарницы","zh":"搭档带来的证据"},"story":[{"en":"Your chosen partner returns, wet and breathless. The other has stayed with the worried guests, keeping Andreas from slipping away. Holmes asks you to read the document aloud. “Evidence only helps if we say exactly what it proves.” The archive lock is still being repaired. The false survey has already been copied and sent to Lestrade’s secure phone.","ar":"تعود شريكتك مبللة ولاهثة. بقيت الأخرى مع الضيوف القلقين حتى لا يتسلل أندرياس. يطلب منك هولمز قراءة الوثيقة بصوت عالٍ. «الأدلة لا تفيد إلا إذا قلنا بالضبط ما تثبته». ما زال قفل الأرشيف قيد الإصلاح. أما التقرير المزيف فقد نُسخ بالفعل وأُرسل إلى هاتف ليستريد الآمن.","de":"Deine Partnerin kommt zurück, nass und außer Atem. Die andere ist bei den besorgten Gästen geblieben und passt auf, dass Andreas nicht verschwindet. Holmes bittet dich, das Dokument laut vorzulesen. „Beweise helfen nur, wenn wir genau sagen, was sie beweisen.“ Das Archivschloss wird noch repariert. Das falsche Gutachten ist schon kopiert und an Lestrades sicheres Telefon geschickt worden.","es":"Tu compañera vuelve, mojada y sin aliento. La otra se ha quedado con los huéspedes preocupados, para que Andreas no se escape. Holmes te pide que leas el documento en voz alta. «Las pruebas solo sirven si decimos exactamente lo que demuestran». Todavía están reparando la cerradura del archivo. El informe falso ya se ha copiado y enviado al teléfono seguro de Lestrade.","fr":"Ta partenaire revient, trempée et essoufflée. L'autre est restée avec les clients inquiets, pour empêcher Andreas de s'éclipser. Holmes te demande de lire le document à voix haute. « Les preuves ne servent que si nous disons exactement ce qu'elles prouvent. » La serrure des archives est encore en réparation. La fausse expertise a déjà été copiée et envoyée sur le téléphone sécurisé de Lestrade.","it":"La tua compagna torna, bagnata e senza fiato. L'altra è rimasta con gli ospiti preoccupati, perché Andreas non sgattaioli via. Holmes ti chiede di leggere il documento ad alta voce. «Le prove servono solo se diciamo esattamente che cosa dimostrano». La serratura dell'archivio è ancora in riparazione. La falsa perizia è già stata copiata e inviata al telefono sicuro di Lestrade.","ja":"あなたが選んだパートナーが、びしょぬれで息を切らして戻ってくる。もう一人は、アンドレアスが抜け出さないよう不安がる客のそばに残っている。ホームズは書類を声に出して読むよう頼む。「証拠は、それが何を証明するかを正確に言えて初めて役に立つ」。記録室の錠はまだ修理中だ。偽の調査書はもう複写され、レストレードの安全な電話に送られている。","pt":"A sua parceira volta, molhada e sem fôlego. A outra ficou com os hóspedes preocupados, para impedir que Andreas fuja. Holmes pede-lhe que leia o documento em voz alta. «As provas só ajudam se dissermos exatamente o que provam.» A fechadura do arquivo ainda está a ser reparada. A vistoria falsa já foi copiada e enviada para o telefone seguro de Lestrade.","ru":"Твоя напарница возвращается, мокрая и запыхавшаяся. Другая осталась с встревоженными гостями, чтобы Андреас не ускользнул. Холмс просит тебя прочитать документ вслух. «Улики помогают, только если мы точно говорим, что они доказывают». Замок архива всё ещё ремонтируют. Ложное заключение уже скопировано и отправлено на защищённый телефон Лестрейда.","zh":"你选的搭档回来了，浑身湿透，气喘吁吁。另一位留下来陪着担心的客人，免得安德烈亚斯溜走。福尔摩斯请你把文件大声读出来。\"证据只有在我们准确说出它证明了什么的时候才有用。\"档案室的锁还在修理中。那份伪造的报告已经被复制并发到了雷斯垂德的安全手机上。"}],"prompt":{"en":"Contrast an ongoing passive action and a completed passive result: “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","ar":"قارن بين فعل مبني للمجهول جارٍ ونتيجة مبنية للمجهول منتهية: “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","de":"Stelle eine laufende Passivhandlung und ein fertiges Passivergebnis gegenüber: “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","es":"Contrasta una acción pasiva en curso y un resultado pasivo terminado: “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","fr":"Oppose une action passive en cours et un résultat passif terminé : “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","it":"Metti a confronto un'azione passiva in corso e un risultato passivo concluso: “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","ja":"進行中の受け身の動作と、完了した受け身の結果を対比しよう：“The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","pt":"Contraste uma ação passiva em curso e um resultado passivo terminado: “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","ru":"Сопоставь пассивное действие в процессе и законченный пассивный результат: “The lock ___ now. The false survey ___ already, so Lestrade has a copy.”","zh":"对比一个正在进行的被动动作和一个已完成的被动结果：“The lock ___ now. The false survey ___ already, so Lestrade has a copy.”"},"opts":[{"en":"was repaired / is being copied"},{"en":"is being repaired / has been copied"},{"en":"is repaired / was being copied"},{"en":"has been repairing / has been copying"}],"answer":1,"points":5,"fb":[{"en":"WAS REPAIRED is finished and past, and IS BEING COPIED says the copy is not finished.","ar":"WAS REPAIRED منتهٍ وماضٍ، وIS BEING COPIED تقول إن النسخ لم ينتهِ.","de":"WAS REPAIRED ist fertig und vergangen, und IS BEING COPIED sagt, dass die Kopie nicht fertig ist.","es":"WAS REPAIRED está terminado y es pasado, e IS BEING COPIED dice que la copia no está terminada.","fr":"WAS REPAIRED est terminé et passé, et IS BEING COPIED dit que la copie n'est pas finie.","it":"WAS REPAIRED è concluso e passato, e IS BEING COPIED dice che la copia non è finita.","ja":"WAS REPAIRED は終わった過去のことで、IS BEING COPIED だと複写はまだ終わっていない。","pt":"WAS REPAIRED está terminado e é passado, e IS BEING COPIED diz que a cópia não está terminada.","ru":"WAS REPAIRED — законченное прошлое, а IS BEING COPIED говорит, что копия не готова.","zh":"WAS REPAIRED 已结束而且是过去的，IS BEING COPIED 表示复制还没完成。"},{"en":"Work going on now: THE LOCK + IS BEING REPAIRED. A finished result now: THE SURVEY + HAS BEEN COPIED.","ar":"عمل جارٍ الآن: THE LOCK + IS BEING REPAIRED. نتيجة منتهية الآن: THE SURVEY + HAS BEEN COPIED.","de":"Arbeit, die jetzt läuft: THE LOCK + IS BEING REPAIRED. Ein fertiges Ergebnis jetzt: THE SURVEY + HAS BEEN COPIED.","es":"Trabajo en curso ahora: THE LOCK + IS BEING REPAIRED. Un resultado terminado ahora: THE SURVEY + HAS BEEN COPIED.","fr":"Un travail en cours maintenant : THE LOCK + IS BEING REPAIRED. Un résultat terminé maintenant : THE SURVEY + HAS BEEN COPIED.","it":"Lavoro in corso ora: THE LOCK + IS BEING REPAIRED. Un risultato concluso ora: THE SURVEY + HAS BEEN COPIED.","ja":"今進行中の作業：THE LOCK + IS BEING REPAIRED。今ある完了した結果：THE SURVEY + HAS BEEN COPIED。","pt":"Trabalho em curso agora: THE LOCK + IS BEING REPAIRED. Um resultado terminado agora: THE SURVEY + HAS BEEN COPIED.","ru":"Работа идёт сейчас: THE LOCK + IS BEING REPAIRED. Законченный результат сейчас: THE SURVEY + HAS BEEN COPIED.","zh":"现在正在进行的工作：THE LOCK + IS BEING REPAIRED。现在已完成的结果：THE SURVEY + HAS BEEN COPIED。"},{"en":"IS REPAIRED is a state or a routine, and WAS BEING COPIED does not say the copy is finished.","ar":"IS REPAIRED حالة أو روتين، وWAS BEING COPIED لا تقول إن النسخ انتهى.","de":"IS REPAIRED ist ein Zustand oder eine Routine, und WAS BEING COPIED sagt nicht, dass die Kopie fertig ist.","es":"IS REPAIRED es un estado o una rutina, y WAS BEING COPIED no dice que la copia esté terminada.","fr":"IS REPAIRED est un état ou une routine, et WAS BEING COPIED ne dit pas que la copie est finie.","it":"IS REPAIRED è uno stato o una routine, e WAS BEING COPIED non dice che la copia è finita.","ja":"IS REPAIRED は状態か習慣で、WAS BEING COPIED では複写が終わったことにならない。","pt":"IS REPAIRED é um estado ou uma rotina, e WAS BEING COPIED não diz que a cópia está terminada.","ru":"IS REPAIRED — состояние или привычное действие, а WAS BEING COPIED не говорит, что копия готова.","zh":"IS REPAIRED 是状态或日常，WAS BEING COPIED 没说复制已经完成。"},{"en":"These are active forms: they make the lock and the survey do the repairing and the copying.","ar":"هذه صيغ مبنية للمعلوم: تجعل القفل والتقرير هما من يصلح وينسخ.","de":"Das sind Aktivformen: Sie lassen das Schloss und das Gutachten selbst reparieren und kopieren.","es":"Son formas activas: hacen que la cerradura y el informe sean los que reparan y copian.","fr":"Ce sont des formes actives : elles font de la serrure et de l'expertise celles qui réparent et qui copient.","it":"Sono forme attive: fanno sì che la serratura e la perizia siano quelle che riparano e copiano.","ja":"これは能動の形だ。錠と調査書が自分で修理したり複写したりすることになってしまう。","pt":"São formas ativas: fazem com que a fechadura e a vistoria sejam quem repara e copia.","ru":"Это активные формы: они делают замок и заключение теми, кто сам чинит и копирует.","zh":"这些是主动形式：它们让门锁和报告自己去修理、去复制。"}],"next":"p23","routeStory":{"ZOMBIELLA":{"en":"Zombiella unfolds a signed receipt. Andreas paid for a song to continue until 20:15, leaving himself time to reach the annex unnoticed. The receipt proves a planned distraction; the camera and lift log connect it to his movements.","ar":"تفتح زومبيلا إيصالًا موقّعًا. دفع أندرياس لكي تستمر أغنية حتى 20:15، فكسب وقتًا للوصول إلى الملحق دون أن يراه أحد. الإيصال يثبت إلهاءً مخططًا له، والكاميرا وسجل المصعد يربطانه بتحركاته.","de":"Zombiella faltet eine unterschriebene Quittung auf. Andreas bezahlte dafür, dass ein Lied bis 20:15 weiterlief, damit er unbemerkt in den Anbau kam. Die Quittung beweist eine geplante Ablenkung; Kamera und Aufzugslogbuch verbinden sie mit seinen Bewegungen.","es":"Zombiella despliega un recibo firmado. Andreas pagó para que la canción siguiera hasta las 20:15 y así tener tiempo de llegar al anexo sin ser visto. El recibo demuestra una distracción planeada; la cámara y el registro del ascensor la relacionan con sus movimientos.","fr":"Zombiella déplie un reçu signé. Andreas a payé pour qu'une chanson continue jusqu'à 20:15, ce qui lui laissait le temps d'atteindre l'annexe sans être vu. Le reçu prouve une diversion préparée ; la caméra et le registre de l'ascenseur la relient à ses déplacements.","it":"Zombiella spiega una ricevuta firmata. Andreas ha pagato perché una canzone continuasse fino alle 20:15, così da avere il tempo di raggiungere l'annesso senza essere visto. La ricevuta dimostra una distrazione pianificata; la telecamera e il registro dell'ascensore la collegano ai suoi movimenti.","ja":"ゾンビエラが署名入りの領収書を広げる。アンドレアスは歌を 20:15 まで続けさせるためにお金を払い、誰にも見られずに別館へ行く時間を作った。領収書は計画的な注意そらしを証明し、カメラとエレベーターの記録がそれを彼の動きと結びつける。","pt":"Zombiella desdobra um recibo assinado. Andreas pagou para que uma canção continuasse até às 20:15, ganhando tempo para chegar ao anexo sem ser visto. O recibo prova uma distração planeada; a câmara e o registo do elevador ligam-na aos movimentos dele.","ru":"Зомбиэлла разворачивает подписанную квитанцию. Андреас заплатил, чтобы песня продолжалась до 20:15, и так выиграл время, чтобы незаметно добраться до флигеля. Квитанция доказывает спланированный отвлекающий манёвр; камера и журнал лифта связывают его с перемещениями Андреаса.","zh":"僵尸艾拉展开一张签了名的收据。安德烈亚斯付钱让一首歌一直唱到 20:15，好让自己有时间神不知鬼不觉地到达附楼。收据证明了这是预先策划的转移注意力；摄像头和电梯日志把它和他的行踪联系起来。"},"ALICE":{"en":"Alice brings the signed key request. Andreas asked for access to E-309 at 19:55, although he later claimed never to have used the service lift. The signature connects him to the copied annex key.","ar":"تحضر أليس طلب المفتاح الموقّع. طلب أندرياس دخول E-309 عند 19:55، مع أنه ادّعى لاحقًا أنه لم يستخدم مصعد الخدمة قط. التوقيع يربطه بالمفتاح المنسوخ للملحق.","de":"Alice bringt den unterschriebenen Schlüsselantrag. Andreas verlangte um 19:55 Zugang zu E-309, obwohl er später behauptete, den Dienstaufzug nie benutzt zu haben. Die Unterschrift verbindet ihn mit dem nachgemachten Schlüssel zum Anbau.","es":"Alice trae la solicitud de llave firmada. Andreas pidió acceso a E-309 a las 19:55, aunque después afirmó que nunca había usado el ascensor de servicio. La firma lo relaciona con la llave copiada del anexo.","fr":"Alice apporte la demande de clé signée. Andreas a demandé l'accès à E-309 à 19:55, alors qu'il a ensuite affirmé n'avoir jamais pris l'ascenseur de service. La signature le relie à la clé copiée de l'annexe.","it":"Alice porta la richiesta di chiave firmata. Andreas ha chiesto l'accesso a E-309 alle 19:55, anche se poi ha sostenuto di non aver mai usato l'ascensore di servizio. La firma lo collega alla chiave copiata dell'annesso.","ja":"アリスが署名入りの鍵の申請書を持ってくる。アンドレアスは 19:55 に E-309 への立ち入りを求めていたのに、後で業務用エレベーターは一度も使っていないと主張した。この署名が、彼を別館の複製した鍵と結びつける。","pt":"Alice traz o pedido de chave assinado. Andreas pediu acesso a E-309 às 19:55, embora depois tenha afirmado que nunca usou o elevador de serviço. A assinatura liga-o à chave copiada do anexo.","ru":"Алиса приносит подписанный запрос на ключ. Андреас просил доступ к E-309 в 19:55, хотя потом утверждал, что никогда не пользовался служебным лифтом. Подпись связывает его со скопированным ключом от флигеля.","zh":"爱丽丝带来了签名的钥匙申请单。安德烈亚斯在 19:55 申请进入 E-309，尽管他后来声称从没用过员工电梯。这个签名把他和那把复制的附楼钥匙联系起来。"}},"img":"23_partner.webp","hot":[44,63,8,14],"pos":"right","v":"center","width":40},"p23":{"kind":"question","k":{"en":"ACT III · 23:10 · THE ARCHIVE LOCK","ar":"الفصل الثالث · 23:10 · قفل الأرشيف","de":"AKT III · 23:10 · DAS ARCHIVSCHLOSS","es":"ACTO III · 23:10 · LA CERRADURA DEL ARCHIVO","fr":"ACTE III · 23:10 · LA SERRURE DES ARCHIVES","it":"ATTO III · 23:10 · LA SERRATURA DELL'ARCHIVIO","ja":"第3幕 · 23:10 · 記録室の錠","pt":"ATO III · 23:10 · A FECHADURA DO ARQUIVO","ru":"АКТ III · 23:10 · ЗАМОК АРХИВА","zh":"第三幕 · 23:10 · 档案室的锁"},"title":{"en":"When the green light comes on","ar":"عندما يضيء الضوء الأخضر","de":"Wenn das grüne Licht angeht","es":"Cuando se encienda la luz verde","fr":"Quand le voyant passe au vert","it":"Quando si accende la luce verde","ja":"緑のランプがついたら","pt":"Quando a luz verde acender","ru":"Когда загорится зелёный","zh":"绿灯亮起的时候"},"story":[{"en":"The circuit hums. Zombito raises one hand: nobody touches the door until its light turns green. The Creature braces the frame. Victor waits with blankets. Your earlier decision sets the order of events, but you still need a safe, clear instruction. A wrong tense could make the command sound as if the rescue has already happened.","ar":"تطنّ الدائرة. يرفع زومبيتو يدًا: لا أحد يلمس الباب حتى يصبح ضوؤه أخضر. يسند المخلوق الإطار. ينتظر فيكتور بالبطانيات. قرارك السابق يحدد ترتيب الأحداث، لكنك ما زلت تحتاج إلى تعليمات آمنة وواضحة. الزمن الخاطئ قد يجعل الأمر يبدو كأن الإنقاذ حدث بالفعل.","de":"Der Stromkreis summt. Zombito hebt eine Hand: Niemand berührt die Tür, bis ihr Licht grün wird. Die Kreatur stemmt sich gegen den Rahmen. Victor wartet mit Decken. Deine frühere Entscheidung legt die Reihenfolge fest, aber du brauchst noch eine sichere, klare Anweisung. Eine falsche Zeitform könnte den Befehl so klingen lassen, als sei die Rettung schon passiert.","es":"El circuito zumba. Zombito levanta una mano: nadie toca la puerta hasta que su luz se ponga verde. La Criatura sujeta el marco. Victor espera con mantas. Tu decisión anterior fija el orden de los hechos, pero aún necesitas una instrucción segura y clara. Un tiempo verbal equivocado podría hacer que la orden sonara como si el rescate ya hubiera ocurrido.","fr":"Le circuit bourdonne. Zombito lève la main : personne ne touche la porte avant que son voyant passe au vert. La Créature cale le cadre. Victor attend avec des couvertures. Ton choix précédent fixe l'ordre des événements, mais il te faut encore une consigne sûre et claire. Un mauvais temps pourrait donner l'impression que le sauvetage a déjà eu lieu.","it":"Il circuito ronza. Zombito alza una mano: nessuno tocca la porta finché la sua luce non diventa verde. La Creatura puntella il telaio. Victor aspetta con le coperte. La tua decisione di prima stabilisce l'ordine degli eventi, ma ti serve ancora un'istruzione sicura e chiara. Un tempo verbale sbagliato potrebbe far sembrare l'ordine come se il salvataggio fosse già avvenuto.","ja":"回路がうなる。ゾンビトが片手を上げる。ランプが緑になるまで、誰もドアに触れてはいけない。クリーチャーが枠を支える。ヴィクターは毛布を持って待っている。さっきの判断で出来事の順番は決まったが、安全で明確な指示はまだ必要だ。時制を間違えると、救出がもう済んだかのように聞こえてしまう。","pt":"O circuito zumbe. Zombito levanta uma mão: ninguém toca na porta até a luz ficar verde. A Criatura escora a moldura. Victor espera com cobertores. A sua decisão anterior define a ordem dos acontecimentos, mas ainda precisa de uma instrução segura e clara. Um tempo verbal errado podia fazer a ordem soar como se o resgate já tivesse acontecido.","ru":"Цепь гудит. Зомбито поднимает руку: никто не трогает дверь, пока её лампочка не станет зелёной. Существо упирается в раму. Виктор ждёт с одеялами. Твоё прежнее решение задаёт порядок событий, но тебе всё равно нужна безопасная и ясная команда. Неверное время может сделать так, будто спасение уже произошло.","zh":"电路嗡嗡作响。僵尸托举起一只手：在门上的灯变绿之前谁也不许碰门。怪物撑住门框。维克多拿着毯子等着。你先前的决定确定了事情的顺序，但你仍需要一个安全、清楚的指令。用错时态可能会让命令听起来像是营救已经完成了。"},{"en":"Beyond the glass, Blocula stands back. He trusts you to get this right.","ar":"خلف الزجاج يتراجع بلوكولا. إنه يثق بأنك ستفعل ذلك بشكل صحيح.","de":"Hinter der Scheibe tritt Blocula zurück. Er vertraut darauf, dass du es richtig machst.","es":"Al otro lado del cristal, Blocula se aparta. Confía en que lo hagas bien.","fr":"Derrière la vitre, Blocula recule. Il compte sur toi pour ne pas te tromper.","it":"Oltre il vetro, Blocula si fa indietro. Si fida di te perché tu faccia la cosa giusta.","ja":"ガラスの向こうで、ブロキュラが後ろに下がる。彼はあなたがうまくやると信じている。","pt":"Do outro lado do vidro, Blocula afasta-se. Confia que você vai acertar.","ru":"За стеклом Блокула отступает назад. Он верит, что ты всё сделаешь правильно.","zh":"玻璃后面，布洛库拉往后退。他相信你会做对。"}],"prompt":{"en":"Give the real future instruction: “When the light ___ green, we ___ the door.”","ar":"أعطِ التعليمات الحقيقية للمستقبل: “When the light ___ green, we ___ the door.”","de":"Gib die echte Anweisung für die Zukunft: “When the light ___ green, we ___ the door.”","es":"Da la instrucción real para el futuro: “When the light ___ green, we ___ the door.”","fr":"Donne la vraie consigne pour le futur : “When the light ___ green, we ___ the door.”","it":"Da' la vera istruzione per il futuro: “When the light ___ green, we ___ the door.”","ja":"未来に向けた本当の指示を出そう：“When the light ___ green, we ___ the door.”","pt":"Dê a verdadeira instrução para o futuro: “When the light ___ green, we ___ the door.”","ru":"Дай настоящую команду на будущее: “When the light ___ green, we ___ the door.”","zh":"给出真正针对将来的指令：“When the light ___ green, we ___ the door.”"},"opts":[{"en":"has turned / opened"},{"en":"will turn / open"},{"en":"turns / will open"},{"en":"turned / have opened"}],"answer":2,"points":5,"fb":[{"en":"OPENED is past, so it is no longer an instruction about what we will do.","ar":"OPENED ماضٍ، لذلك لم تعد تعليمات عما سنفعله.","de":"OPENED ist Vergangenheit, also keine Anweisung mehr, was wir tun werden.","es":"OPENED es pasado, así que ya no es una instrucción sobre lo que vamos a hacer.","fr":"OPENED est au passé, ce n'est donc plus une consigne sur ce que nous allons faire.","it":"OPENED è passato, quindi non è più un'istruzione su ciò che faremo.","ja":"OPENED は過去形なので、これから私たちがすることの指示ではなくなる。","pt":"OPENED é passado, por isso já não é uma instrução sobre o que vamos fazer.","ru":"OPENED — прошедшее время, так что это уже не команда о том, что мы сделаем.","zh":"OPENED 是过去时，所以已经不是关于我们将要做什么的指令了。"},{"en":"After WHEN, for the future, use the present simple: WHEN THE LIGHT + TURNS, not WILL TURN.","ar":"بعد WHEN، للمستقبل، استخدم present simple: WHEN THE LIGHT + TURNS، لا WILL TURN.","de":"Nach WHEN nimmt man für die Zukunft das Present Simple: WHEN THE LIGHT + TURNS, nicht WILL TURN.","es":"Después de WHEN, para el futuro, usa el presente simple: WHEN THE LIGHT + TURNS, no WILL TURN.","fr":"Après WHEN, pour le futur, on utilise le present simple : WHEN THE LIGHT + TURNS, pas WILL TURN.","it":"Dopo WHEN, per il futuro, si usa il present simple: WHEN THE LIGHT + TURNS, non WILL TURN.","ja":"WHEN の後で未来を表すときは現在形を使う：WHEN THE LIGHT + TURNS で、WILL TURN ではない。","pt":"Depois de WHEN, para o futuro, use o present simple: WHEN THE LIGHT + TURNS, não WILL TURN.","ru":"После WHEN для будущего используется present simple: WHEN THE LIGHT + TURNS, а не WILL TURN.","zh":"在 WHEN 后面表示将来，用一般现在时：WHEN THE LIGHT + TURNS，不用 WILL TURN。"},{"en":"After WHEN, the present simple: THE LIGHT + TURNS. The main clause: WE + WILL OPEN.","ar":"بعد WHEN يأتي present simple: THE LIGHT + TURNS. والجملة الرئيسية: WE + WILL OPEN.","de":"Nach WHEN das Present Simple: THE LIGHT + TURNS. Der Hauptsatz: WE + WILL OPEN.","es":"Después de WHEN, el presente simple: THE LIGHT + TURNS. La oración principal: WE + WILL OPEN.","fr":"Après WHEN, le present simple : THE LIGHT + TURNS. La proposition principale : WE + WILL OPEN.","it":"Dopo WHEN, il present simple: THE LIGHT + TURNS. La frase principale: WE + WILL OPEN.","ja":"WHEN の後は現在形：THE LIGHT + TURNS。主節：WE + WILL OPEN。","pt":"Depois de WHEN, o present simple: THE LIGHT + TURNS. A oração principal: WE + WILL OPEN.","ru":"После WHEN — present simple: THE LIGHT + TURNS. Главное предложение: WE + WILL OPEN.","zh":"WHEN 后面用一般现在时：THE LIGHT + TURNS。主句：WE + WILL OPEN。"},{"en":"TURNED and HAVE OPENED are past and present perfect. Neither gives a future instruction.","ar":"TURNED وHAVE OPENED ماضٍ وpresent perfect. لا تعطي أي منهما تعليمات للمستقبل.","de":"TURNED und HAVE OPENED sind Vergangenheit und Present Perfect. Keine gibt eine Anweisung für die Zukunft.","es":"TURNED y HAVE OPENED son pasado y presente perfecto. Ninguno da una instrucción para el futuro.","fr":"TURNED et HAVE OPENED sont au passé et au present perfect. Aucun ne donne une consigne pour le futur.","it":"TURNED e HAVE OPENED sono passato e present perfect. Nessuno dei due dà un'istruzione per il futuro.","ja":"TURNED と HAVE OPENED は過去形と現在完了だ。どちらも未来の指示にならない。","pt":"TURNED e HAVE OPENED são passado e present perfect. Nenhum dá uma instrução para o futuro.","ru":"TURNED и HAVE OPENED — прошедшее и present perfect. Ни одна форма не даёт команду на будущее.","zh":"TURNED 和 HAVE OPENED 是过去时和现在完成时。两者都给不出针对将来的指令。"}],"next":"p24","routeStory":{"RESCUE":{"en":"You sent the first burst of power to the lock. Blocula will be brought out before you turn on the scanner. Victor approves. “A document can wait five minutes. A person should not have to.”","ar":"أرسلت أول دفعة كهرباء إلى القفل. سيُخرج بلوكولا قبل أن تشغّل الماسح. يوافق فيكتور. «الوثيقة تستطيع الانتظار خمس دقائق. أما الإنسان فلا ينبغي أن ينتظر».","de":"Du hast den ersten Stromstoß an das Schloss geschickt. Blocula wird herausgeholt, bevor du den Scanner einschaltest. Victor ist einverstanden. „Ein Dokument kann fünf Minuten warten. Ein Mensch sollte das nicht müssen.“","es":"Mandaste la primera descarga de corriente a la cerradura. Sacarán a Blocula antes de que enciendas el escáner. Victor lo aprueba. «Un documento puede esperar cinco minutos. Una persona no debería tener que hacerlo».","fr":"Tu as envoyé la première décharge de courant à la serrure. Blocula sera sorti avant que tu allumes le scanner. Victor approuve. « Un document peut attendre cinq minutes. Une personne ne devrait pas avoir à le faire. »","it":"Hai mandato la prima scarica di corrente alla serratura. Blocula verrà portato fuori prima che accendi lo scanner. Victor approva. «Un documento può aspettare cinque minuti. Una persona non dovrebbe doverlo fare».","ja":"あなたは最初の電流を錠に送った。スキャナーをつける前にブロキュラを外へ出す。ヴィクターはうなずく。「書類は5分待てる。人を待たせるべきではない」。","pt":"Mandou a primeira descarga de corrente para a fechadura. Blocula vai ser tirado de lá antes de ligar o scanner. Victor aprova. «Um documento pode esperar cinco minutos. Uma pessoa não devia ter de esperar.»","ru":"Ты отправил первый импульс тока на замок. Блокулу выведут до того, как ты включишь сканер. Виктор одобряет. «Документ может подождать пять минут. Человек не должен».","zh":"你把第一股电流送到了门锁。会先把布洛库拉救出来，再打开扫描仪。维克多表示赞同。\"文件可以等五分钟。人不应该等。\""},"SCANNER":{"en":"You sent the first burst of power to the scanner. The agreement is safe, but Blocula has spent longer in the cold. Victor prepares to treat him as soon as the lock releases.","ar":"أرسلت أول دفعة كهرباء إلى الماسح. الاتفاقية في أمان، لكن بلوكولا قضى وقتًا أطول في البرد. يستعد فيكتور لعلاجه ما إن ينفتح القفل.","de":"Du hast den ersten Stromstoß an den Scanner geschickt. Die Vereinbarung ist sicher, aber Blocula war länger in der Kälte. Victor bereitet sich darauf vor, ihn zu versorgen, sobald das Schloss aufgeht.","es":"Mandaste la primera descarga de corriente al escáner. El acuerdo está a salvo, pero Blocula ha pasado más tiempo con frío. Victor se prepara para atenderlo en cuanto se abra la cerradura.","fr":"Tu as envoyé la première décharge de courant au scanner. L'accord est en sécurité, mais Blocula est resté plus longtemps dans le froid. Victor se prépare à le soigner dès que la serrure cédera.","it":"Hai mandato la prima scarica di corrente allo scanner. L'accordo è al sicuro, ma Blocula è rimasto più a lungo al freddo. Victor si prepara a curarlo appena la serratura si sblocca.","ja":"あなたは最初の電流をスキャナーに送った。合意書は無事だが、ブロキュラは寒さの中に長くいた。ヴィクターは錠が開いたらすぐ手当てできるよう準備する。","pt":"Mandou a primeira descarga de corrente para o scanner. O acordo está seguro, mas Blocula passou mais tempo ao frio. Victor prepara-se para o tratar assim que a fechadura abrir.","ru":"Ты отправил первый импульс тока на сканер. Соглашение в безопасности, но Блокула дольше пробыл на холоде. Виктор готовится заняться им, как только замок откроется.","zh":"你把第一股电流送到了扫描仪。协议保住了，但布洛库拉在寒冷中多待了更久。维克多准备好一开锁就给他治疗。"}},"img":"24_rescue.webp","hot":[75,64,6,10],"pos":"left","v":"center"},"p24":{"kind":"question","k":{"en":"ACT III · 23:18 · THE OPEN ARCHIVE","ar":"الفصل الثالث · 23:18 · الأرشيف المفتوح","de":"AKT III · 23:18 · DAS OFFENE ARCHIV","es":"ACTO III · 23:18 · EL ARCHIVO ABIERTO","fr":"ACTE III · 23:18 · LES ARCHIVES OUVERTES","it":"ATTO III · 23:18 · L'ARCHIVIO APERTO","ja":"第3幕 · 23:18 · 開いた記録室","pt":"ATO III · 23:18 · O ARQUIVO ABERTO","ru":"АКТ III · 23:18 · ОТКРЫТЫЙ АРХИВ","zh":"第三幕 · 23:18 · 打开的档案室"},"title":{"en":"The signature under the dust","ar":"التوقيع تحت الغبار","de":"Die Unterschrift unter dem Staub","es":"La firma bajo el polvo","fr":"La signature sous la poussière","it":"La firma sotto la polvere","ja":"ほこりの下の署名","pt":"A assinatura debaixo do pó","ru":"Подпись под пылью","zh":"灰尘下的签名"},"story":[{"en":"The lock clicks. Blocula steps out, shaking but alive. Elizabeth, the staff representative, and Justine, head housekeeper, meet him with a coat. Watson checks the original agreement.","ar":"يطقطق القفل. يخرج بلوكولا مرتجفًا لكنه حيّ. تستقبله إليزابيث، ممثلة الموظفين، وجوستين، رئيسة التدبير المنزلي، بمعطف. يراجع واطسون الاتفاقية الأصلية.","de":"Das Schloss klickt. Blocula tritt heraus, zitternd, aber lebendig. Elizabeth, die Personalvertreterin, und Justine, die Hausdame, empfangen ihn mit einem Mantel. Watson prüft die Originalvereinbarung.","es":"La cerradura hace clic. Blocula sale, temblando pero vivo. Elizabeth, la representante del personal, y Justine, la gobernanta, lo reciben con un abrigo. Watson revisa el acuerdo original.","fr":"La serrure cliquette. Blocula sort, tremblant mais vivant. Elizabeth, la représentante du personnel, et Justine, la gouvernante, l'accueillent avec un manteau. Watson vérifie l'accord original.","it":"La serratura scatta. Blocula esce, tremante ma vivo. Elizabeth, la rappresentante del personale, e Justine, la governante, lo accolgono con un cappotto. Watson controlla l'accordo originale.","ja":"錠がカチッと鳴る。ブロキュラが震えながらも生きて出てくる。スタッフ代表のエリザベスとハウスキーパー長のジュスティーヌがコートを持って迎える。ワトソンが合意書の原本を確かめる。","pt":"A fechadura dá um estalido. Blocula sai, a tremer mas vivo. Elizabeth, a representante do pessoal, e Justine, a governanta, recebem-no com um casaco. Watson verifica o acordo original.","ru":"Замок щёлкает. Блокула выходит, дрожащий, но живой. Элизабет, представитель персонала, и Жюстина, старшая горничная, встречают его с пальто. Ватсон проверяет оригинал соглашения.","zh":"锁咔嗒一声开了。布洛库拉走出来，浑身发抖，但还活着。员工代表伊丽莎白和客房主管贾斯汀拿着一件外套迎上去。华生核对协议原件。"},{"en":"It was signed last month, before Andreas offered to buy the hotel. The sale contract only applies if no earlier staff agreement is registered by midnight. That is why Andreas needed the Count silent tonight. Under the dust is the final page: every permanent member of staff owns a share.","ar":"وُقّعت الشهر الماضي، قبل أن يعرض أندرياس شراء الفندق. عقد البيع لا يسري إلا إذا لم تُسجّل اتفاقية سابقة للموظفين قبل منتصف الليل. لهذا احتاج أندرياس إلى إسكات الكونت الليلة. تحت الغبار الصفحة الأخيرة: كل موظف دائم يملك حصة.","de":"Sie wurde letzten Monat unterschrieben, bevor Andreas anbot, das Hotel zu kaufen. Der Kaufvertrag gilt nur, wenn bis Mitternacht keine frühere Vereinbarung des Personals eingetragen ist. Deshalb musste der Graf heute Nacht schweigen. Unter dem Staub liegt die letzte Seite: Jedes feste Mitglied des Personals besitzt einen Anteil.","es":"Se firmó el mes pasado, antes de que Andreas ofreciera comprar el hotel. El contrato de venta solo vale si no se registra antes de medianoche un acuerdo anterior del personal. Por eso Andreas necesitaba al conde callado esta noche. Bajo el polvo está la última página: cada miembro fijo del personal es dueño de una parte.","fr":"Il a été signé le mois dernier, avant qu'Andreas propose d'acheter l'hôtel. Le contrat de vente ne s'applique que si aucun accord antérieur du personnel n'est enregistré avant minuit. Voilà pourquoi Andreas avait besoin que le comte se taise ce soir. Sous la poussière, il y a la dernière page : chaque membre permanent du personnel possède une part.","it":"È stato firmato il mese scorso, prima che Andreas offrisse di comprare l'hotel. Il contratto di vendita vale solo se entro mezzanotte non viene registrato un accordo precedente del personale. Ecco perché Andreas aveva bisogno che il conte stesse zitto stanotte. Sotto la polvere c'è l'ultima pagina: ogni membro fisso del personale possiede una quota.","ja":"それは先月、アンドレアスがホテルの買収を申し出る前に署名されていた。売買契約は、真夜中までにそれより前のスタッフの合意が登記されなかった場合にのみ有効になる。だからアンドレアスは、今夜伯爵を黙らせておく必要があったのだ。ほこりの下に最後のページがある。正規スタッフ全員が持ち分を所有する、と。","pt":"Foi assinado no mês passado, antes de Andreas oferecer comprar o hotel. O contrato de venda só vale se nenhum acordo anterior do pessoal for registado até à meia-noite. É por isso que Andreas precisava do conde calado esta noite. Debaixo do pó está a última página: cada membro permanente do pessoal é dono de uma parte.","ru":"Оно было подписано в прошлом месяце, до того как Андреас предложил купить отель. Договор продажи действует, только если до полуночи не зарегистрировано более раннее соглашение персонала. Вот почему Андреасу было нужно, чтобы граф молчал этой ночью. Под пылью — последняя страница: каждый постоянный сотрудник владеет долей.","zh":"它是上个月签的，那时安德烈亚斯还没提出要买酒店。买卖合同只有在午夜前没有登记更早的员工协议时才生效。这就是为什么安德烈亚斯今晚需要伯爵闭嘴。灰尘下面是最后一页：每一位正式员工都拥有一份股份。"},{"en":"William brings his sister Elizabeth a mug of tea and asks whether she will still have a job tomorrow. “That is exactly what we’re deciding,” she says.","ar":"يحضر ويليام لأخته إليزابيث كوب شاي ويسألها إن كانت ستظل في عملها غدًا. تقول: «هذا بالضبط ما نقرره الآن».","de":"William bringt seiner Schwester Elizabeth einen Becher Tee und fragt, ob sie morgen noch eine Stelle hat. „Genau das entscheiden wir gerade“, sagt sie.","es":"William le lleva a su hermana Elizabeth una taza de té y le pregunta si mañana todavía tendrá trabajo. «Eso es exactamente lo que estamos decidiendo», dice ella.","fr":"William apporte une tasse de thé à sa sœur Elizabeth et lui demande si elle aura encore un emploi demain. « C'est exactement ce que nous sommes en train de décider », répond-elle.","it":"William porta a sua sorella Elizabeth una tazza di tè e le chiede se domani avrà ancora un lavoro. «È proprio quello che stiamo decidendo», risponde lei.","ja":"ウィリアムが姉のエリザベスに紅茶のマグを持ってきて、明日も仕事があるのかと尋ねる。「それをまさに今決めているのよ」と彼女は言う。","pt":"William leva à irmã Elizabeth uma caneca de chá e pergunta-lhe se amanhã ainda vai ter emprego. «É exatamente isso que estamos a decidir», diz ela.","ru":"Уильям приносит сестре Элизабет кружку чая и спрашивает, будет ли у неё завтра работа. «Именно это мы сейчас и решаем», — отвечает она.","zh":"威廉给姐姐伊丽莎白端来一杯茶，问她明天还有没有工作。\"我们现在正在决定的就是这件事，\"她说。"}],"prompt":{"en":"Put the legal documents in order without changing their timing: “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","ar":"رتّب الوثائق القانونية دون تغيير أزمنتها: “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","de":"Bring die rechtlichen Dokumente in Reihenfolge, ohne ihre Zeiten zu ändern: “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","es":"Ordena los documentos legales sin cambiar sus tiempos: “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","fr":"Mets les documents juridiques dans l'ordre sans changer leurs temps : “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","it":"Metti in ordine i documenti legali senza cambiare i loro tempi: “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","ja":"時の関係を変えずに、法的な書類を順番に並べよう：“The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","pt":"Ponha os documentos legais por ordem sem mudar os seus tempos: “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","ru":"Расставь юридические документы по порядку, не меняя их времени: “The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”","zh":"在不改变时间的前提下给法律文件排序：“The staff ___ the agreement last month. By the time Andreas made his offer, Blocula ___ it too.”"},"opts":[{"en":"were signing / has signed"},{"en":"had signed / is signing"},{"en":"signed / had signed"},{"en":"have signed / signs"}],"answer":2,"points":5,"fb":[{"en":"WERE SIGNING leaves the signing unfinished, and HAS SIGNED looks from now.","ar":"WERE SIGNING تترك التوقيع غير منتهٍ، وHAS SIGNED تنظر من الآن.","de":"WERE SIGNING lässt das Unterschreiben unfertig, und HAS SIGNED schaut vom Jetzt aus.","es":"WERE SIGNING deja la firma sin terminar, y HAS SIGNED mira desde el ahora.","fr":"WERE SIGNING laisse la signature inachevée, et HAS SIGNED regarde depuis maintenant.","it":"WERE SIGNING lascia la firma non conclusa, e HAS SIGNED guarda dal presente.","ja":"WERE SIGNING だと署名が終わっておらず、HAS SIGNED は今から見ている。","pt":"WERE SIGNING deixa a assinatura por terminar, e HAS SIGNED olha a partir do agora.","ru":"WERE SIGNING оставляет подписание незаконченным, а HAS SIGNED смотрит из настоящего.","zh":"WERE SIGNING 让签字停留在未完成，HAS SIGNED 是从现在看。"},{"en":"IS SIGNING puts Blocula's signature in progress now, but the document is old.","ar":"IS SIGNING تجعل توقيع بلوكولا جاريًا الآن، لكن الوثيقة قديمة.","de":"IS SIGNING setzt Bloculas Unterschrift in den Moment jetzt, aber das Dokument ist alt.","es":"IS SIGNING pone la firma de Blocula en curso ahora, pero el documento es antiguo.","fr":"IS SIGNING met la signature de Blocula en cours maintenant, mais le document est ancien.","it":"IS SIGNING mette la firma di Blocula in corso ora, ma il documento è vecchio.","ja":"IS SIGNING だとブロキュラの署名が今進行中になるが、書類は古い。","pt":"IS SIGNING põe a assinatura de Blocula em curso agora, mas o documento é antigo.","ru":"IS SIGNING ставит подпись Блокулы в процесс сейчас, а документ старый.","zh":"IS SIGNING 让布洛库拉的签名变成现在正在进行，但这份文件是旧的。"},{"en":"\"Last month\" is a finished time: THE STAFF + SIGNED. Before the later offer: BLOCULA + HAD SIGNED.","ar":"\"Last month\" وقت منتهٍ: THE STAFF + SIGNED. قبل العرض اللاحق: BLOCULA + HAD SIGNED.","de":"\"Last month\" ist eine abgeschlossene Zeit: THE STAFF + SIGNED. Vor dem späteren Angebot: BLOCULA + HAD SIGNED.","es":"\"Last month\" es un tiempo terminado: THE STAFF + SIGNED. Antes de la oferta posterior: BLOCULA + HAD SIGNED.","fr":"\"Last month\" est un temps terminé : THE STAFF + SIGNED. Avant l'offre plus tardive : BLOCULA + HAD SIGNED.","it":"\"Last month\" è un tempo concluso: THE STAFF + SIGNED. Prima dell'offerta successiva: BLOCULA + HAD SIGNED.","ja"  del anexo. A las 20:07 se ve a Andreas girando la cerradura exterior y cogiendo el teléfono del conde de la estantería. La negación general no resiste un hecho grabado con claridad. El documento de tu compañera apoya a la cámara; no la sustituye.","fr":"Andreas change de version. « Je n'ai jamais enfermé personne dans une pièce. » Lestrade passe la vidéo récupérée de l'annexe. À 20:07, on voit Andreas tourner la serrure extérieure et prendre le téléphone du comte sur l'étagère. Le démenti général ne résiste pas à un événement clairement enregistré. Le document de ta partenaire appuie la caméra ; il ne la remplace pas.","it":"Andreas cambia versione. «Non ho mai chiuso nessuno in una stanza». Lestrade fa partire il video recuperato dell'annesso. Alle 20:07 si vede Andreas girare la serratura esterna e prendere il telefono del conte dallo scaffale. La smentita generale non regge davanti a un evento registrato chiaramente. Il documento della tua compagna sostiene la telecamera; non la sostituisce.","ja":"アンドレアスは話を変える。「私は誰かを部屋に閉じ込めたことなど一度もない」。レストレードが回収した別館の映像を再生する。20:07、外側の錠を回し、棚から伯爵の電話を取るアンドレアスが映っている。大まかな否定は、はっきり記録された一つの出来事には勝てない。パートナーの書類はカメラを裏づけるが、その代わりにはならない。","pt":"Andreas muda de versão. «Nunca tranquei ninguém num quarto.» Lestrade põe o vídeo recuperado do anexo. Às 20:07, vê-se Andreas a rodar a fechadura exterior e a tirar o telefone do conde da prateleira. A negação geral não resiste a um acontecimento claramente gravado. O documento da sua parceira apoia a câmara; não a substitui.","ru":"Андреас меняет показания. «Я никогда никого не запирал в комнате». Лестрейд включает восстановленную запись из флигеля. В 20:07 видно, как Андреас поворачивает внешний замок и берёт телефон графа с полки. Общее отрицание не выдерживает одного чётко записанного события. Документ твоей напарницы подкрепляет запись камеры; он её не заменяет.","zh":"安德烈亚斯改口了。\"我从来没把任何人锁在房间里。\"雷斯垂德播放了从附楼找回的视频。20:07，可以看到安德烈亚斯转动外面的锁，并从架子上拿走伯爵的手机。笼统的否认经不起一个被清楚记录下来的事件。你搭档的文件支持摄像头的证据，但不能取代它。"},{"en":"
