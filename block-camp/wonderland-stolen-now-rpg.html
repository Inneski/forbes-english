:root{--cake-a:rgba(207,52,125,.55);--cake-b:rgba(36,121,173,.55);
--cake-a-ink:#fff0f7;--cake-b-ink:#eef7ff;
--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;
--cake-a-wash:rgba(207,52,125,.22);--cake-b-wash:rgba(36,121,173,.22);
--accent:#E66085;--accent-ink:#1f0716;--deep:#2d1024;--panel:rgba(30,9,26,.9);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* ── HUD ── */
.hud{position:absolute;z-index:5;top:1.3cqw;left:1.5cqw;right:1.5cqw;display:flex;align-items:center;justify-content:space-between;gap:1cqw;pointer-events:none}
.hud-group{display:flex;gap:.55cqw;align-items:center;flex-wrap:wrap}

a":"英語のぼうけん · やさしい英語 · 16問","pt":"AVENTURA EM INGLÊS · INGLÊS FÁCIL · 16 PERGUNTAS","ru":"ПРИКЛЮЧЕНИЕ НА АНГЛИЙСКОМ · ПРОСТОЙ АНГЛИЙСКИЙ · 16 ВОПРОСОВ","zh":"英语冒险 · 简易英语 · 16 个问题"},"title":{"en":"THE STOLEN NOW","es":"EL AHORA ROBADO","de":"DAS GESTOHLENE JETZT","ar":"الحاضر المسروق","fr":"LE PRÉSENT VOLÉ","it":"IL PRESENTE RUBATO","ja":"ぬすまれた今","pt":"O AGORA ROUBADO","ru":"УКРАДЕННОЕ НАСТОЯЩЕЕ","zh":"被偷走的此刻"},"story":{"en":"Time is going wrong in Wonderland. The same afternoon keeps starting again. Soon, everyone will stop moving. Help Alice fix the palace clock and save her friends.","es":"En el País de las Maravillas, la misma tarde empieza una y otra vez. Pronto nadie podrá moverse. Ayuda a Alice a reparar el reloj del palacio y a salvar a sus amigos.","de":"In Wunderland beginnt derselbe Nachmittag immer wieder. Bald können sich alle nicht mehr bewegen. Hilf Alice, die Palastuhr zu reparieren und ihre Freunde zu retten.","ar":"الزمن يسير على نحو خاطئ في بلاد العجائب. الظهيرة نفسها تبدأ من جديد مرة بعد مرة. وقريباً سيتوقف الجميع عن الحركة. ساعد أليس على إصلاح ساعة القصر وإنقاذ أصدقائها.","fr":"Le temps ne va pas bien au Pays des Merveilles. Le même après-midi recommence sans arrêt. Bientôt, tout le monde va s'arrêter de bouger. Aide Alice à réparer l'horloge du palais et à sauver ses amis.","it":"Il tempo non funziona più nel Paese delle Meraviglie. Lo stesso pomeriggio ricomincia in continuazione. Presto tutti smetteranno di muoversi. Aiuta Alice a riparare l'orologio del palazzo e a salvare i suoi amici.","ja":"ワンダーランドの時間がおかしくなっている。同じ午後が何度も始まってしまう。このままでは、もうすぐみんな動けなくなる。アリスが宮殿の時計を直して友だちを助けるのを手伝おう。","pt":"O tempo está a correr mal no País das Maravilhas. A mesma tarde começa outra vez e outra vez. Em breve, toda a gente vai deixar de se mexer. Ajuda a Alice a reparar o relógio do palácio e a salvar os amigos.","ru":"В Стране чудес что-то случилось со временем. Один и тот же день начинается снова и снова. Скоро все перестанут двигаться. Помоги Алисе починить дворцовые часы и спасти её друзей.","zh":"仙境的时间出问题了。同一个下午一次又一次地重新开始。很快，所有人都会停下来不能动。帮爱丽丝修好宫殿的大钟，救她的朋友。"},"rules":[{"en":"+10 FIRST TRY","es":"+10 A LA PRIMERA","de":"+10 BEIM ERSTEN VERSUCH","ar":"+10 من المحاولة الأولى","fr":"+10 DU PREMIER COUP","it":"+10 AL PRIMO TENTATIVO","ja":"一発正解 +10","pt":"+10 À PRIMEIRA","ru":"+10 С ПЕРВОЙ ПОПЫТКИ","zh":"一次答对 +10"},{"en":"3 MAGIC OBJECTS","es":"3 OBJETOS MÁGICOS","de":"3 ZAUBERGEGENSTÄNDE","ar":"٣ أشياء سحرية","fr":"3 OBJETS MAGIQUES","it":"3 OGGETTI MAGICI","ja":"魔法のアイテム3つ","pt":"3 OBJETOS MÁGICOS","ru":"3 ВОЛШЕБНЫХ ПРЕДМЕТА","zh":"3 件魔法物品"},{"en":"16 QUESTIONS","es":"16 PREGUNTAS","de":"16 FRAGEN","ar":"١٦ سؤالاً","fr":"16 QUESTIONS","it":"16 DOMANDE","ja":"16問","pt":"16 PERGUNTAS","ru":"16 ВОПРОСОВ","zh":"16 个问题"}],"start":{"en":"START THE ADVENTURE","es":"EMPEZAR LA AVENTURA","de":"DAS ABENTEUER STARTEN","ar":"ابدأ المغامرة","fr":"COMMENCER L'AVENTURE","it":"INIZIA L'AVVENTURA","ja":"ぼうけんを始める","pt":"COMEÇAR A AVENTURA","ru":"НАЧАТЬ ПРИКЛЮЧЕНИЕ","zh":"开始冒险"},"small":{"en":"One player · easy English · two paths to choose · three endings","es":"Un jugador · inglés fácil · dos caminos a elegir · tres finales","de":"Ein Spieler · einfaches Englisch · zwei Wege zur Wahl · drei Enden","ar":"لاعب واحد · إنجليزية مبسّطة · طريقان للاختيار · ثلاث نهايات","fr":"Un joueur · anglais facile · deux chemins au choix · trois fins","it":"Un giocatore · inglese facile · due percorsi da scegliere · tre finali","ja":"1人プレイ · やさしい英語 · 選べる2つの道 · 3つの結末","pt":"Um jogador · inglês fácil · dois caminhos à escolha · três finais","ru":"Один игрок · простой английский · два пути на выбор · три концовки","zh":"单人 · 简易英语 · 两条路线可选 · 三种结局"},"next":"prologue","hot":[65,22,12,22],"pos":"left","v":"center"},"prologue":{"kind":"story","img":"01_prologue.webp","k":{"en":"THE STORY · TIME IS IN DANGER","es":"LA HISTORIA · EL TIEMPO ESTÁ EN PELIGRO","de":"DIE GESCHICHTE · DIE ZEIT IST IN GEFAHR","ar":"القصة · الزمن في خطر","fr":"L'HISTOIRE · LE TEMPS EST EN DANGER","it":"LA STORIA · IL TEMPO È IN PERICOLO","ja":"物語 · 時間があぶない","pt":"A HISTÓRIA · O TEMPO ESTÁ EM PERIGO","ru":"ИСТОРИЯ · ВРЕМЯ В ОПАСНОСТИ","zh":"故事 · 时间有危险"},"title":{"en":"SOMEONE STOLE THE MAGIC CRYSTAL!","es":"¡ALGUIEN ROBÓ EL CRISTAL MÁGICO!","de":"JEMAND HAT DEN ZAUBERKRISTALL GESTOHLEN!","ar":"سرق أحدهم البلورة السحرية!","fr":"QUELQU'UN A VOLÉ LE CRISTAL MAGIQUE !","it":"QUALCUNO HA RUBATO IL CRISTALLO MAGICO!","ja":"魔法のクリスタルが盗まれた！","pt":"ALGUÉM ROUBOU O CRISTAL MÁGICO!","ru":"КТО-ТО УКРАЛ ВОЛШЕБНЫЙ КРИСТАЛЛ!","zh":"有人偷走了魔法水晶！"},"story":{"en":"The Time Warden, a dangerous shadow, steals the crystal from the palace clock. The crystal makes time work. Now people are stopping in the street. Even the rain is stopping in the air! Alice can still move. The Rabbit tells her what to do: find two magic objects to power the clock, open the magic gate, then go to the Queen’s palace and stop the Warden.","es":"El Guardián del Tiempo, una sombra peligrosa, roba el cristal del reloj del palacio. El cristal hace funcionar el tiempo. Ahora las personas se quedan inmóviles en la calle. ¡Incluso la lluvia se queda parada en el aire! Alice todavía puede moverse. El Conejo le dice qué hacer: encuentra dos objetos mágicos para el reloj, abre la puerta mágica y llega hasta la Reina para detener al Guardián.","de":"Der Zeitwächter, ein gefährlicher Schatten, stiehlt den Kristall aus der Palastuhr. Der Kristall lässt die Zeit laufen. Jetzt bleiben die Menschen auf der Straße stehen. Sogar der Regen bleibt in der Luft stehen! Alice kann sich noch bewegen. Das Kaninchen sagt ihr, was zu tun ist: Finde zwei magische Gegenstände für die Uhr, öffne das Zaubertor und erreiche die Königin, um den Wächter zu stoppen.","ar":"حارس الزمن، وهو ظلٌّ خطير، يسرق البلورة من ساعة القصر. البلورة هي التي تجعل الزمن يعمل. الآن يتوقف الناس في الشارع، وحتى المطر يتوقف في الهواء! أليس ما زالت تستطيع الحركة. يخبرها الأرنب بما عليها فعله: أن تجد شيئين سحريين لتشغيل الساعة، وتفتح البوابة السحرية، ثم تذهب إلى قصر الملكة وتوقف الحارس.","fr":"Le Gardien du Temps, une ombre dangereuse, vole le cristal de l'horloge du palais. C'est le cristal qui fait marcher le temps. Maintenant, les gens s'arrêtent dans la rue. Même la pluie s'arrête en l'air ! Alice peut encore bouger. Le Lapin lui dit quoi faire : trouver deux objets magiques pour alimenter l'horloge, ouvrir la porte magique, puis aller au palais de la Reine et arrêter le Gardien.","it":"Il Guardiano del Tempo, un'ombra pericolosa, ruba il cristallo dall'orologio del palazzo. È il cristallo che fa funzionare il tempo. Adesso le persone si fermano per strada. Perfino la pioggia si ferma a mezz'aria! Alice può ancora muoversi. Il Coniglio le dice cosa fare: trovare due oggetti magici per alimentare l'orologio, aprire il cancello magico, poi andare al palazzo della Regina e fermare il Guardiano.","ja":"時の番人という危険な影が、宮殿の時計から魔法のクリスタルを盗む。時間を動かしているのはこのクリスタルだ。いま通りの人たちは止まっていき、雨まで空中で止まっている！ 動けるのはアリスだけ。ウサギがやるべきことを教える――時計を動かす魔法のアイテムを2つ見つけ、魔法の門を開け、それから女王の宮殿へ行って番人を止めるのだ。","pt":"O Guardião do Tempo, uma sombra perigosa, rouba o cristal do relógio do palácio. É o cristal que faz o tempo funcionar. Agora as pessoas ficam paradas na rua. Até a chuva fica parada no ar! A Alice ainda se pode mexer. O Coelho diz-lhe o que fazer: encontrar dois objetos mágicos para dar força ao relógio, abrir o portão mágico e depois ir ao palácio da Rainha e parar o Guardião.","ru":"Страж Времени, опасная тень, крадёт кристалл из дворцовых часов. Именно кристалл заставляет время идти. Теперь люди на улице замирают. Даже дождь остановился в воздухе! Алиса ещё может двигаться. Кролик говорит ей, что делать: найти два волшебных предмета для часов, открыть волшебные ворота, а потом дойти до дворца Королевы и остановить Стража.","zh":"时间守卫是一道危险的黑影，它从宫殿大钟里偷走了水晶。水晶让时间运转。现在街上的人一个个停住了，连雨都停在半空中！只有爱丽丝还能动。兔子告诉她该怎么做：找到两件魔法物品给大钟供能，打开魔法之门，然后去女王的宫殿阻止守卫。"},"next":"rules","hot":[82,10,12,16],"pos":"left","v":"center"},"rules":{"kind":"rules","img":"01_prologue.webp","k":{"en":"GRAMMAR HELP · BEFORE YOU START","es":"AYUDA DE GRAMÁTICA · ANTES DE EMPEZAR","de":"GRAMMATIKHILFE · BEVOR DU STARTEST","ar":"مساعدة في القواعد · قبل أن تبدأ","fr":"AIDE GRAMMAIRE · AVANT DE COMMENCER","it":"AIUTO GRAMMATICA · PRIMA DI INIZIARE","ja":"文法ヘルプ · 始める前に","pt":"AJUDA DE GRAMÁTICA · ANTES DE COMEÇAR","ru":"ПОМОЩЬ ПО ГРАММАТИКЕ · ПЕРЕД НАЧАЛОМ","zh":"语法帮助 · 开始之前"},"title":{"en":"NOW OR EVERY DAY?","es":"¿AHORA O CADA DÍA?","de":"JETZT ODER JEDEN TAG?","ar":"الآن أم كل يوم؟","fr":"MAINTENANT OU CHAQUE JOUR ?","it":"ADESSO O OGNI GIORNO?","ja":"いま？ それとも毎日？","pt":"AGORA OU TODOS OS DIAS?","ru":"СЕЙЧАС ИЛИ КАЖДЫЙ ДЕНЬ?","zh":"现在，还是每天？"},"story":{"en":"Use the present continuous for an action happening now: “Alice is running.” Use the present simple for things we do regularly and for facts: “I play every day.” “A rabbit has long ears.”","es":"Usa el presente continuo para una acción que ocurre ahora: «Alice is running». Usa el presente simple para lo que hacemos con regularidad y para los hechos: «I play every day». «A rabbit has long ears».","de":"Benutze das Present Continuous für eine Handlung, die gerade passiert: „Alice is running.“ Benutze das Present Simple für Regelmäßiges und für Fakten: „I play every day.“ „A rabbit has long ears.“","ar":"استخدم المضارع المستمر لفعل يحدث الآن: «Alice is running.» واستخدم المضارع البسيط لما نفعله بانتظام وللحقائق: «I play every day.» «A rabbit has long ears.»","fr":"Utilise le présent continu pour une action qui se passe maintenant : « Alice is running. » Utilise le présent simple pour ce qu'on fait régulièrement et pour les faits : « I play every day. » « A rabbit has long ears. »","it":"Usa il present continuous per un'azione che sta succedendo adesso: «Alice is running.» Usa il present simple per le cose che facciamo regolarmente e per i fatti: «I play every day.» «A rabbit has long ears.»","ja":"いま起きている動作には現在進行形を使う：「Alice is running.」 ふだんくり返すことや事実には現在形を使う：「I play every day.」「A rabbit has long ears.」","pt":"Usa o presente contínuo para uma ação que está a acontecer agora: «Alice is running.» Usa o presente simples para as coisas que fazemos com regularidade e para factos: «I play every day.» «A rabbit has long ears.»","ru":"Present Continuous — для действия, которое происходит сейчас: «Alice is running.» Present Simple — для того, что мы делаем регулярно, и для фактов: «I play every day.» «A rabbit has long ears.»","zh":"现在进行时用于此刻正在发生的动作：“Alice is running.” 一般现在时用于我们经常做的事和事实：“I play every day.” “A rabbit has long ears.”"},"rules":[{"tone":"a","name":{"en":"FORM · AM / IS / ARE + VERB-ING","es":"FORMA · AM / IS / ARE + VERBO-ING","de":"FORM · AM / IS / ARE + VERB-ING","ar":"الصيغة · AM / IS / ARE + الفعل مع ING","fr":"FORME · AM / IS / ARE + VERBE-ING","it":"FORMA · AM / IS / ARE + VERBO-ING","ja":"形 · AM / IS / ARE + 動詞-ing","pt":"FORMA · AM / IS / ARE + VERBO-ING","ru":"ФОРМА · AM / IS / ARE + ГЛАГОЛ-ING","zh":"结构 · AM / IS / ARE + 动词-ing"},"form":{"en":"I am playing · He / She / It is playing · You / We / They are playing","es":"I am playing · He / She / It is playing · You / We / They are playing","de":"I am playing · He / She / It is playing · You / We / They are playing","ar":"I am playing · He / She / It is playing · You / We / They are playing","fr":"I am playing · He / She / It is playing · You / We / They are playing","it":"I am playing · He / She / It is playing · You / We / They are playing","ja":"I am playing · He / She / It is playing · You / We / They are playing","pt":"I am playing · He / She / It is playing · You / We / They are playing","ru":"I am playing · He / She / It is playing · You / We / They are playing","zh":"I am playing · He / She / It is playing · You / We / They are playing"}},{"name":{"en":"NEGATIVE AND QUESTION","es":"NEGACIÓN Y PREGUNTA","de":"VERNEINUNG UND FRAGE","ar":"النفي والسؤال","fr":"NÉGATION ET QUESTION","it":"NEGAZIONE E DOMANDA","ja":"否定文と疑問文","pt":"NEGATIVA E PERGUNTA","ru":"ОТРИЦАНИЕ И ВОПРОС","zh":"否定句和疑问句"},"form":{"en":"Alice is not sleeping. · Is Alice sleeping? Yes, she is. / No, she isn’t.","es":"Alice no está durmiendo. · ¿Está durmiendo Alice? Sí. / No.","de":"Alice schläft nicht. · Schläft Alice gerade? Ja. / Nein.","ar":"أليس لا تنام الآن. · هل أليس نائمة؟ نعم. / لا.","fr":"Alice ne dort pas. · Est-ce qu'Alice dort ? Oui. / Non.","it":"Alice non sta dormendo. · Alice sta dormendo? Sì. / No.","ja":"アリスは眠っていません。· アリスは眠っていますか？ はい。/ いいえ。","pt":"A Alice não está a dormir. · A Alice está a dormir? Sim. / Não.","ru":"Алиса не спит. · Алиса спит? Да. / Нет.","zh":"爱丽丝没有在睡觉。· 爱丽丝在睡觉吗？是的。/ 不是。"}},{"name":{"en":"SPELLING","es":"ORTOGRAFÍA","de":"SCHREIBWEISE","ar":"الإملاء","fr":"ORTHOGRAPHE","it":"ORTOGRAFIA","ja":"つづり","pt":"ORTOGRAFIA","ru":"ПРАВОПИСАНИЕ","zh":"拼写"},"form":{"en":"look → looking · make → making · run → running · lie → lying","es":"look → looking · make → making · run → running · lie → lying","de":"look → looking · make → making · run → running · lie → lying","ar":"look → looking · make → making · run → running · lie → lying","fr":"look → looking · make → making · run → running · lie → lying","it":"look → looking · make → making · run → running · lie → lying","ja":"look → looking · make → making · run → running · lie → lying","pt":"look → looking · make → making · run → running · lie → lying","ru":"look → looking · make → making · run → running · lie → lying","zh":"look → looking · make → making · run → running · lie → lying"}},{"name":{"en":"NOW CLUES","es":"PISTAS DE «AHORA»","de":"JETZT-SIGNALE","ar":"إشارات \"الآن\"","fr":"INDICES DU « MAINTENANT »","it":"INDIZI DI \"ADESSO\"","ja":"「今」の合図","pt":"PISTAS DO \"AGORA\"","ru":"СИГНАЛЫ «СЕЙЧАС»","zh":"\"现在\"的信号词"},"form":{"en":"now · right now · at the moment · Look! · Listen!","es":"now · right now · at the moment · Look! · Listen!","de":"now · right now · at the moment · Look! · Listen!","ar":"now · right now · at the moment · Look! · Listen!","fr":"now · right now · at the moment · Look! · Listen!","it":"now · right now · at the moment · Look! · Listen!","ja":"now · right now · at the moment · Look! · Listen!","pt":"now · right now · at the moment · Look! · Listen!","ru":"now · right now · at the moment · Look! · Listen!","zh":"now · right now · at the moment · Look! · Listen!"}},{"tone":"b","name":{"en":"PRESENT SIMPLE · EVERY DAY AND FACTS","es":"PRESENTE SIMPLE · CADA DÍA Y HECHOS","de":"PRESENT SIMPLE · JEDEN TAG UND FAKTEN","ar":"المضارع البسيط · كل يوم والحقائق","fr":"PRÉSENT SIMPLE · CHAQUE JOUR ET FAITS","it":"PRESENT SIMPLE · OGNI GIORNO E FATTI","ja":"現在形 · 毎日のことと事実","pt":"PRESENTE SIMPLES · TODOS OS DIAS E FACTOS","ru":"PRESENT SIMPLE · КАЖДЫЙ ДЕНЬ И ФАКТЫ","zh":"一般现在时 · 每天与事实"},"form":{"en":"I play every day. · She plays every day. · I know the answer.","es":"I play every day. · She plays every day. · I know the answer. (con he/she/it se añade -s)","de":"I play every day. · She plays every day. · I know the answer. (bei he/she/it kommt -s dazu)","ar":"ألعب كل يوم. · هي تلعب كل يوم. · أعرف الإجابة.","fr":"Je joue chaque jour. · Elle joue chaque jour. · Je connais la réponse.","it":"Gioco ogni giorno. · Lei gioca ogni giorno. · So la risposta.","ja":"私は毎日遊びます。· 彼女は毎日遊びます。· 私は答えを知っています。","pt":"Eu jogo todos os dias. · Ela joga todos os dias. · Eu sei a resposta.","ru":"Я играю каждый день. · Она играет каждый день. · Я знаю ответ.","zh":"我每天都玩。· 她每天都玩。· 我知道答案。"}}],"note":{"en":"Read the story, then choose an answer. A correct first answer gives you 10 points. If you make a mistake, read the help and try again — you can still finish the game. There are 16 questions and 160 possible points.","es":"Lee la historia y elige una respuesta. Una primera respuesta correcta vale 10 puntos. Si te equivocas, lee la ayuda e inténtalo otra vez: puedes terminar el juego igualmente. Hay 16 preguntas y 160 puntos posibles.","de":"Lies die Geschichte und wähle eine Antwort. Eine erste richtige Antwort gibt 10 Punkte. Bei einem Fehler liest du die Hilfe und versuchst es noch einmal – du kannst das Spiel trotzdem beenden. Es gibt 16 Fragen und 160 mögliche Punkte.","ar":"اقرأ القصة ثم اختر إجابة. الإجابة الصحيحة من المحاولة الأولى تمنحك ١٠ نقاط. وإذا أخطأت، اقرأ المساعدة وحاول مرة أخرى — ما زال بإمكانك إنهاء اللعبة. هناك ١٦ سؤالاً و١٦٠ نقطة ممكنة.","fr":"Lis l'histoire, puis choisis une réponse. Une première réponse juste te donne 10 points. Si tu te trompes, lis l'aide et essaie encore — tu peux quand même finir le jeu. Il y a 16 questions et 160 points possibles.","it":"Leggi la storia, poi scegli una risposta. Una prima risposta giusta ti dà 10 punti. Se sbagli, leggi l'aiuto e riprova — puoi comunque finire il gioco. Ci sono 16 domande e 160 punti possibili.","ja":"物語を読んでから答えを選ぼう。1回目で正解すると10ポイント。まちがえたらヘルプを読んでもう一度――それでも最後までクリアできる。全部で16問、160ポイント満点だ。","pt":"Lê a história e depois escolhe uma resposta. Uma primeira resposta certa dá-te 10 pontos. Se errares, lê a ajuda e tenta outra vez — mesmo assim podes acabar o jogo. Há 16 perguntas e 160 pontos possíveis.","ru":"Прочитай историю, потом выбери ответ. Первый правильный ответ даёт 10 очков. Если ошибёшься, прочитай подсказку и попробуй ещё раз — игру всё равно можно пройти. Всего 16 вопросов и 160 очков.","zh":"先读故事，再选答案。第一次就答对得 10 分。答错了就读一读帮助再试一次——你仍然可以完成游戏。一共 16 个问题，满分 160 分。"},"button":{"en":"CHOOSE A PATH","es":"ELIGE UN CAMINO","de":"WÄHLE EINEN WEG","ar":"اختر طريقاً","fr":"CHOISIS UN CHEMIN","it":"SCEGLI UN PERCORSO","ja":"道を選ぼう","pt":"ESCOLHE UM CAMINHO","ru":"ВЫБЕРИ ПУТЬ","zh":"选一条路"},"next":"choice1","hot":[66,9,8,14],"pos":"left","v":"center","width":56},"03_rabbit_run":{"kind":"question","img":"03_rabbit_run.webp","k":{"en":"PART 1 · FIND THE FIRST MAGIC OBJECT","es":"PARTE 1 · ENCUENTRA EL PRIMER OBJETO MÁGICO","de":"TEIL 1 · FINDE DEN ERSTEN ZAUBERGEGENSTAND","ar":"الجزء ١ · جد الشيء السحري الأول","fr":"PARTIE 1 · TROUVE LE PREMIER OBJET MAGIQUE","it":"PARTE 1 · TROVA IL PRIMO OGGETTO MAGICO","ja":"パート1 · 最初の魔法のアイテムを見つけよう","pt":"PARTE 1 · ENCONTRA O PRIMEIRO OBJETO MÁGICO","ru":"ЧАСТЬ 1 ·  Mouse.","es":"Alice encuentra un taladro, una herramienta para hacer agujeros. No funciona. Alice y el guardia deben girar la rueda a mano para liberar a la Ratona.","de":"Alice findet eine Bohrmaschine, ein Werkzeug für Löcher. Sie funktioniert nicht. Alice und die Wache müssen das Rad von Hand drehen, um die Maus zu befreien.","ar":"تجد أليس مثقاباً، وهو أداة لعمل الثقوب. لكنه لا يعمل. على أليس والحارس أن يديرا العجلة باليد لتحرير الفأرة.","fr":"Alice trouve une perceuse, un outil pour faire des trous. Elle ne marche pas. Alice et le garde doivent tourner la roue à la main pour libérer la Souris.","it":"Alice trova un trapano, un attrezzo per fare buchi. Non funziona. Alice e la guardia devono girare la ruota a mano per liberare la Topina.","ja":"アリスはドリルを見つける。穴をあけるための道具だ。でも動かない。アリスと兵士は手で車輪を回してネズミを助けなければならない。","pt":"A Alice encontra um berbequim, uma ferramenta para fazer buracos. Não está a funcionar. A Alice e o guarda têm de rodar a roda à mão para libertar a Rata.","ru":"Алиса находит дрель — инструмент, которым делают дырки. Она не работает. Алисе и стражнику придётся крутить колесо руками, чтобы освободить Мышку.","zh":"爱丽丝找到一把电钻，那是用来打洞的工具。可是它不转了。爱丽丝和卫兵只能用手转动轮子，把钟表鼠救出来。"},"prompt":{"en":"Choose the correct sentence with “not”.","es":"Elige la oración correcta con «not».","de":"Wähle den richtigen Satz mit „not“.","ar":"اختر الجملة الصحيحة مع «not».","fr":"Choisis la phrase correcte avec « not ».","it":"Scegli la frase corretta con «not».","ja":"「not」を使った正しい文を選ぼう。","pt":"Escolhe a frase correta com «not».","ru":"Выбери правильное предложение с «not».","zh":"选出带 “not” 的正确句子。"},"opts":[{"en":"The drill doesn't working."},{"en":"The drill not working."},{"en":"The drill isn't working."}],"answer":2,"fb":{"en":"The drill = it. Use is not + working. Is not can become isn’t: The drill isn’t working.","es":"The drill = it. Usa is not + working. Is not puede acortarse a isn’t: The drill isn’t working.","de":"The drill = it. Benutze is not + working. Is not kann zu isn’t werden: The drill isn’t working.","ar":"The drill = it. استخدم is not + working. ويمكن اختصار is not إلى isn’t: The drill isn’t working.","fr":"The drill = it. Utilise is not + working. Is not peut devenir isn’t : The drill isn’t working.","it":"The drill = it. Usa is not + working. Is not può diventare isn’t: The drill isn’t working.","ja":"The drill = it。is not + working を使う。is not は isn’t と短くできる：The drill isn’t working。","pt":"The drill = it. Usa is not + working. Is not pode ficar isn’t: The drill isn’t working.","ru":"The drill = it. Используй is not + working. Is not можно сократить до isn’t: The drill isn’t working.","zh":"The drill = it，用 is not + working。is not 可以缩写成 isn’t：The drill isn’t working。"},"points":10,"next":"24_heart_gear","hot":[60,35,18,20],"pos":"left","v":"center"},"24_heart_gear":{"kind":"question","img":"24_heart_gear.webp","k":{"en":"PART 3 · FIND THE SECOND MAGIC OBJECT","es":"PARTE 3 · ENCUENTRA EL SEGUNDO OBJETO MÁGICO","de":"TEIL 3 · FINDE DEN ZWEITEN ZAUBERGEGENSTAND","ar":"الجزء ٣ · جد الشيء السحري الثاني","fr":"PARTIE 3 · TROUVE LE DEUXIÈME OBJET MAGIQUE","it":"PARTE 3 · TROVA IL SECONDO OGGETTO MAGICO","ja":"パート3 · 2つ目の魔法のアイテムを見つけよう","pt":"PARTE 3 · ENCONTRA O SEGUNDO OBJETO MÁGICO","ru":"ЧАСТЬ 3 · НАЙДИ ВТОРОЙ ВОЛШЕБНЫЙ ПРЕДМЕТ","zh":"第 3 部分 · 找到第二件魔法物品"},"title":{"en":"A GIFT FROM THE MOUSE","es":"UN REGALO DE LA RATONA","de":"EIN GESCHENK VON DER MAUS","ar":"هدية من الفأرة","fr":"UN CADEAU DE LA SOURIS","it":"UN REGALO DALLA TOPINA","ja":"ネズミからの贈りもの","pt":"UM PRESENTE DA RATA","ru":"ПОДАРОК ОТ МЫШКИ","zh":"钟表鼠的礼物"},"story":{"en":"The Mouse is free! She gives Alice a magic wheel called the Heart Gear. It can help fix the Queen’s time machine.","es":"¡La Ratona está libre! Le da a Alice una rueda mágica llamada Engranaje del Corazón. Puede ayudar a reparar la máquina del tiempo de la Reina.","de":"Die Maus ist frei! Sie gibt Alice ein magisches Rad, das Herzrad. Es kann helfen, die Zeitmaschine der Königin zu reparieren.","ar":"الفأرة حرة! تعطي أليس عجلة سحرية اسمها ترس القلب. يمكنها أن تساعد في إصلاح آلة الزمن الخاصة بالملكة.","fr":"La Souris est libre ! Elle donne à Alice une roue magique qui s'appelle l'Engrenage du Cœur. Elle peut aider à réparer la machine à remonter le temps de la Reine.","it":"La Topina è libera! Dà ad Alice una ruota magica che si chiama Ingranaggio del Cuore. Può aiutare a riparare la macchina del tempo della Regina.","ja":"ネズミは自由になった！ お礼に「心臓の歯車」という魔法の車輪をアリスに渡す。女王のタイムマシンを直すのに役立つはずだ。","pt":"A Rata está livre! Dá à Alice uma roda mágica chamada Engrenagem do Coração. Pode ajudar a reparar a máquina do tempo da Rainha.","ru":"Мышка свободна! Она даёт Алисе волшебное колесо — Сердечную шестерёнку. Оно поможет починить машину времени Королевы.","zh":"钟表鼠自由了！她送给爱丽丝一个叫“心齿轮”的魔法轮子。它能帮忙修好女王的时间机器。"},"prompt":{"en":"Alice and the Mouse ___ the magic wheel together.","es":"Alice y la Ratona ___ juntas la rueda mágica.","de":"Alice und die Maus ___ das Zauberrad gemeinsam.","ar":"أليس والفأرة ___ العجلة السحرية معاً.","fr":"Alice et la Souris ___ la roue magique ensemble.","it":"Alice e la Topina ___ insieme la ruota magica.","ja":"アリスとネズミがいっしょに魔法の車輪を___。","pt":"A Alice e a Rata ___ a roda mágica juntas.","ru":"Алиса и Мышка ___ волшебное колесо вместе.","zh":"爱丽丝和钟表鼠正一起___这个魔法轮子。"},"opts":[{"en":"am carrying"},{"en":"is carrying"},{"en":"are carrying"}],"answer":2,"fb":{"en":"Alice and the Mouse = they. Use they + are + carrying.","es":"Alice and the Mouse = they. Usa they + are + carrying.","de":"Alice and the Mouse = they. Benutze they + are + carrying.","ar":"Alice and the Mouse = they. استخدم they + are + carrying.","fr":"Alice and the Mouse = they. Utilise they + are + carrying.","it":"Alice and the Mouse = they. Usa they + are + carrying.","ja":"Alice and the Mouse = they。they + are + carrying を使う。","pt":"Alice and the Mouse = they. Usa they + are + carrying.","ru":"Alice and the Mouse = they. Используй they + are + carrying.","zh":"Alice and the Mouse = they，用 they + a magica di metallo. Tutti e due gli oggetti vanno bene.","ja":"魔法のアイテムがもう1つ必要だ。帽子屋とボートに乗ってコンパスを見つけるか、ネズミの脱獄を助けて魔法の金属の車輪をもらおう。どちらでも役に立つ。","pt":"Precisas de mais um objeto mágico. Vai de barco com o Chapeleiro para encontrar uma bússola, ou ajuda a Rata a fugir da prisão para ficares com uma roda mágica de metal. Qualquer um dos objetos ajuda.","ru":"Тебе нужен ещё один волшебный предмет. Плыви на лодке со Шляпником за компасом или помоги Мышке сбежать из тюрьмы и забери волшебное металлическое колесо. Любой предмет подойдёт.","zh":"你还需要一件魔法物品。和帽匠坐船去找罗盘，或者帮钟表鼠逃出监狱、拿到一个魔法金属轮子。两件物品都可以。"},"routes":[{"name":{"en":"TAKE THE TEACUP BOAT","es":"TOMA EL BARCO-TAZA","de":"NIMM DAS TEETASSENBOOT","ar":"اركب قارب فنجان الشاي","fr":"PRENDRE LE BATEAU-TASSE","it":"PRENDI LA BARCA-TAZZA","ja":"ティーカップの船に乗る","pt":"APANHAR O BARCO-CHÁVENA","ru":"СЕСТЬ В ЛОДКУ-ЧАШКУ","zh":"乘茶杯船"},"desc":{"en":"Travel by boat with the Hatter. Find a magic compass.","es":"Viaja en barco con el Sombrerero. Encuentra una brújula mágica.","de":"Fahre mit dem Hutmacher im Boot. Finde einen magischen Kompass.","ar":"سافر بالقارب مع القبّعاتي. وجد بوصلة سحرية.","fr":"Voyage en bateau avec le Chapelier. Trouve une boussole magique.","it":"Viaggia in barca con il Cappellaio. Trova una bussola magica.","ja":"帽子屋とボートで進もう。魔法のコンパスを見つけよう。","pt":"Viaja de barco com o Chapeleiro. Encontra uma bússola mágica.","ru":"Плыви на лодке со Шляпником. Найди волшебный компас.","zh":"和帽匠一起坐船。找到一个魔法罗盘。"},"route":"Teacup Compass","target":"17_boat_engine"},{"name":{"en":"RESCUE THE MOUSE","es":"RESCATA A LA RATONA","de":"RETTE DIE MAUS","ar":"أنقذ الفأرة","fr":"SAUVE LA SOURIS","it":"SALVA LA TOPINA","ja":"ネズミを救出しよう","pt":"SALVA A RATA","ru":"СПАСИ МЫШКУ","zh":"营救钟表鼠"},"desc":{"en":"Help the Mouse escape from prison. Find a magic metal wheel.","es":"Ayuda a la Ratona a escapar de la prisión. Encuentra una rueda de metal mágica.","de":"Hilf der Maus aus dem Gefängnis. Finde ein magisches Metallrad.","ar":"ساعد الفأرة على الهرب من السجن. وجد عجلة معدنية سحرية.","fr":"Aide la Souris à s'échapper de prison. Trouve une roue magique en métal.","it":"Aiuta la Topina a scappare di prigione. Trova una ruota magica di metallo.","ja":"ネズミが牢屋から逃げるのを助けよう。魔法の金属の車輪を見つけよう。","pt":"Ajuda a Rata a fugir da prisão. Encontra uma roda mágica de metal.","ru":"Помоги Мышке сбежать из тюрьмы. Найди волшебное металлическое колесо.","zh":"帮钟表鼠逃出监狱。找到一个魔法金属轮子。"},"route":"Heart Gear","target":"21_prison_gears"}],"hot":[50,60,10,26],"pos":"center","v":"top"},"boss_intro":{"kind":"story","img":"25_boss_reveal.webp","k":{"en":"THE SECRET · WHY TIME IS STOPPING","es":"EL SECRETO · POR QUÉ SE DETIENE EL TIEMPO","de":"DAS GEHEIMNIS · WARUM DIE ZEIT STEHEN BLEIBT","ar":"السر · لماذا يتوقف الزمن","fr":"LE SECRET · POURQUOI LE TEMPS S'ARRÊTE","it":"IL SEGRETO · PERCHÉ IL TEMPO SI FERMA","ja":"秘密 · なぜ時間が止まるのか","pt":"O SEGREDO · PORQUE É QUE O TEMPO ESTÁ A PARAR","ru":"СЕКРЕТ · ПОЧЕМУ ВРЕМЯ ОСТАНАВЛИВАЕТСЯ","zh":"秘密 · 时间为什么会停下"},"title":{"en":"THE QUEEN WANTS TO SAVE HER DAUGHTER","es":"LA REINA QUIERE SALVAR A SU HIJA","de":"DIE KÖNIGIN WILL IHRE TOCHTER RETTEN","ar":"الملكة تريد إنقاذ ابنتها","fr":"LA REINE VEUT SAUVER SA FILLE","it":"LA REGINA VUOLE SALVARE SUA FIGLIA","ja":"女王は娘を救いたかった","pt":"A RAINHA QUER SALVAR A FILHA","ru":"КОРОЛЕВА ХОЧЕТ СПАСТИ СВОЮ ДОЧЬ","zh":"女王想救她的女儿"},"story":{"en":"Rose is the Queen’s daughter. The Queen is afraid that something bad will happen to her. She asks the Mouse to build a machine that stops time. It is called the Crown. But the magic goes wrong: Rose becomes trapped behind a magic wall. The Queen’s fear creates the Time Warden. Alice holds up her two magic objects. They help her keep moving. Answer four more questions to stop the Warden and free Rose.","es":"Rose es la hija de la Reina. La Reina teme que le pase algo malo. Le pide a la Ratona que construya una máquina que detenga el tiempo. Se llama la Corona. Pero la magia sale mal: Rose queda atrapada detrás de una pared mágica. El miedo de la Reina crea al Guardián del Tiempo. Alice levanta sus dos objetos mágicos: la ayudan a seguir moviéndose. Responde cuatro preguntas más para detener al Guardián y liberar a Rose.","de":"Rose ist die Tochter der Königin. Die Königin hat Angst, dass ihr etwas zustößt. Sie bittet die Maus, eine Maschine zu bauen, die die Zeit anhält. Sie heißt die Krone. Aber die Magie geht schief: Rose ist hinter einer magischen Wand gefangen. Die Angst der Königin erschafft den Zeitwächter. Alice hebt ihre zwei Zaubergegenstände hoch: Sie halten sie in Bewegung. Beantworte vier weitere Fragen, um den Wächter zu stoppen und Rose zu befreien.","ar":"روز ابنة الملكة. تخاف الملكة أن يصيبها مكروه، فتطلب من الفأرة أن تبني آلة توقف الزمن، واسمها التاج. لكن السحر يفسد: تصبح روز محبوسة خلف جدار سحري، ويخلق خوف الملكة حارس الزمن. ترفع أليس شيئيها السحريين، وهما يساعدانها على مواصلة الحركة. أجب عن أربعة أسئلة أخرى لإيقاف الحارس وتحرير روز.","fr":"Rose est la fille de la Reine. La Reine a peur qu'il lui arrive quelque chose de mal. Elle demande à la Souris de construire une machine qui arrête le temps. On l'appelle la Couronne. Mais la magie tourne mal : Rose se retrouve prisonnière derrière un mur magique. La peur de la Reine crée le Gardien du Temps. Alice lève ses deux objets magiques. Ils l'aident à continuer de bouger. Réponds à quatre questions de plus pour arrêter le Gardien et libérer Rose.","it":"Rose è la figlia della Regina. La Regina ha paura che le succeda qualcosa di brutto. Chiede alla Topina di costruire una macchina che ferma il tempo. Si chiama la Corona. Ma la magia va storta: Rose resta intrappolata dietro un muro magico. La paura della Regina crea il Guardiano del Tempo. Alice alza i suoi due oggetti magici. La aiutano a continuare a muoversi. Rispondi ad altre quattro domande per fermare il Guardiano e liberare Rose.","ja":"ローズは女王の娘だ。女王は娘に悪いことが起きるのをおそれ、時間を止める機械を作ってほしいとネズミに頼んだ。その機械が「王冠」だ。ところが魔法は失敗し、ローズは魔法の壁の向こうに閉じこめられてしまう。女王の恐れが時の番人を生んだのだ。アリスは2つの魔法のアイテムをかかげる。おかげで彼女は動き続けられる。あと4問答えて、番人を止めローズを助け出そう。","pt":"A Rose é filha da Rainha. A Rainha tem medo que lhe aconteça alguma coisa má. Pede à Rata para construir uma máquina que pare o tempo. Chama-se a Coroa. Mas a magia corre mal: a Rose fica presa atrás de uma parede mágica. O medo da Rainha cria o Guardião do Tempo. A Alice levanta os seus dois objetos mágicos. Eles ajudam-na a continuar a mexer-se. Responde a mais quatro perguntas para parar o Guardião e libertar a Rose.","ru":"Роза — дочь Королевы. Королева боится, что с ней случится что-то плохое. Она просит Мышку построить машину, которая остановит время. Её называют Короной. Но магия идёт не так: Роза оказывается заперта за волшебной стеной. Страх Королевы создаёт Стража Времени. Алиса поднимает два волшебных предмета. Они помогают ей двигаться дальше. Ответь ещё на четыре вопроса, чтобы остановить Стража и освободить Розу.","zh":"萝丝是女王的女儿。女王害怕她会出事，就请钟表鼠造一台能让时间停下的机器，那台机器叫王冠。可是魔法出了差错：萝丝被困在了一堵魔法墙后面，女王的恐惧变成了时间守卫。爱丽丝举起她的两件魔法物品，它们让她还能继续行动。再答对四个问题，就能阻止守卫、救出萝丝。"},"button":{"en":"HELP ALICE STOP THE WARDEN","es":"AYUDA A ALICE A DETENER AL GUARDIÁN","de":"HILF ALICE, DEN WÄCHTER ZU STOPPEN","ar":"ساعد أليس على إيقاف الحارس","fr":"AIDE ALICE À ARRÊTER LE GARDIEN","it":"AIUTA ALICE A FERMARE IL GUARDIANO","ja":"アリスが番人を止めるのを手伝う","pt":"AJUDA A ALICE A PARAR O GUARDIÃO","ru":"ПОМОГИ АЛИСЕ ОСТАНОВИТЬ СТРАЖА","zh":"帮爱丽丝阻止守卫"},"next":"26_freeze_attack","hot":[60,30,12,24],"pos":"left","v":"center"},"26_freeze_attack":{"kind":"question","img":"26_freeze_attack.webp","k":{"en":"PART 4 · STOP THE WARDEN","es":"PARTE 4 · DETÉN AL GUARDIÁN","de":"TEIL 4 · STOPPE DEN WÄCHTER","ar":"الجزء ٤ · أوقف الحارس","fr":"PARTIE 4 · ARRÊTE LE GARDIEN","it":"PARTE 4 · FERMA IL GUARDIANO","ja":"パート4 · 番人を止めよう","pt":"PARTE 4 · PARA O GUARDIÃO","ru":"ЧАСТЬ 4 · ОСТАНОВИ СТРАЖА","zh":"第 4 部分 · 阻止守卫"},"title":{"en":"STOP THE WARDEN!","es":"¡DETÉN AL GUARDIÁN!","de":"STOPPE DEN WÄCHTER!","ar":"أوقف الحارس!","fr":"ARRÊTE LE GARDIEN !","it":"FERMA IL GUARDIANO!","ja":"番人 e.","it":"Scegli la domanda corretta.","ja":"正しい疑問文を選ぼう。","pt":"Escolhe a pergunta correta.","ru":"Выбери правильный вопрос.","zh":"选出正确的疑问句。"},"opts":[{"en":"Why the Warden is breaking apart?"},{"en":"Why does the Warden breaking apart?"},{"en":"Why is the Warden breaking apart?"}],"answer":2,"fb":{"en":"Start with Why, then is, then the Warden: Why is the Warden breaking apart? Breaking apart means breaking into pieces.","es":"Empieza con Why, luego is y luego the Warden: Why is the Warden breaking apart? Breaking apart significa romperse en pedazos.","de":"Beginne mit Why, dann is, dann the Warden: Why is the Warden breaking apart? Breaking apart heißt in Stücke zerbrechen.","ar":"ابدأ بـ Why ثم is ثم the Warden: Why is the Warden breaking apart? وBreaking apart تعني التفتّت إلى قطع.","fr":"Commence par Why, puis is, puis the Warden : Why is the Warden breaking apart ? Breaking apart veut dire se casser en morceaux.","it":"Inizia con Why, poi is, poi the Warden: Why is the Warden breaking apart? Breaking apart vuol dire rompersi in pezzi.","ja":"Why で始め、次に is、そして the Warden：Why is the Warden breaking apart? breaking apart は「ばらばらに砕ける」という意味。","pt":"Começa com Why, depois is, depois the Warden: Why is the Warden breaking apart? Breaking apart quer dizer partir-se aos bocados.","ru":"Начни с Why, потом is, потом the Warden: Why is the Warden breaking apart? Breaking apart значит разлетаться на куски.","zh":"先用 Why，再用 is，然后是 the Warden：Why is the Warden breaking apart? breaking apart 的意思是碎成一块块。"},"points":10,"next":"decision","hot":[72,25,18,26],"pos":"left","v":"center"},"decision":{"kind":"choice","img":"30_final_choice.webp","k":{"en":"YOUR LAST CHOICE · THREE POSSIBLE ENDINGS","es":"TU ÚLTIMA ELECCIÓN · TRES FINALES POSIBLES","de":"DEINE LETZTE WAHL · DREI MÖGLICHE ENDEN","ar":"اختيارك الأخير · ثلاث نهايات ممكنة","fr":"TON DERNIER CHOIX · TROIS FINS POSSIBLES","it":"LA TUA ULTIMA SCELTA · TRE FINALI POSSIBILI","ja":"最後の選択 · 3つの結末","pt":"A TUA ÚLTIMA ESCOLHA · TRÊS могут остаться в Стране чудес. Если сломает — всем придётся уйти в новый дом.","zh":"守卫消失了，但萝丝还需要出来。如果爱丽丝修好时间机器，大家就能留在仙境；如果她把机器打碎，大家就得逃到一个新家去。"},"routes":[{"name":{"en":"FIX THE TIME MACHINE","es":"REPARAR LA MÁQUINA DEL TIEMPO","de":"DIE ZEITMASCHINE REPARIEREN","ar":"أصلح آلة الزمن","fr":"RÉPARER LA MACHINE À REMONTER LE TEMPS","it":"RIPARA LA MACCHINA DEL TEMPO","ja":"タイムマシンを直す","pt":"REPARAR A MÁQUINA DO TEMPO","ru":"ПОЧИНИТЬ МАШИНУ ВРЕМЕНИ","zh":"修好时间机器"},"desc":{"en":"120 points or more: fix it completely. Below 120: save Rose, but the machine still needs work.","es":"Con 120 puntos o más la reparas del todo. Con menos de 120 salvas a Rose, pero la máquina aún necesita trabajo.","de":"Mit 120 Punkten oder mehr reparierst du sie ganz. Unter 120 rettest du Rose, aber die Maschine braucht noch Arbeit.","ar":"١٢٠ نقطة أو أكثر: تُصلحها تماماً. أقل من ١٢٠: تُنقذ روز، لكن الآلة ما زالت بحاجة إلى عمل.","fr":"120 points ou plus : tu la répares complètement. Moins de 120 : tu sauves Rose, mais la machine a encore besoin de travail.","it":"120 punti o più: la ripari del tutto. Sotto 120: salvi Rose, ma la macchina ha ancora bisogno di lavoro.","ja":"120ポイント以上なら完全に直せる。120未満だとローズは助かるが、機械にはまだ手直しが必要だ。","pt":"120 pontos ou mais: reparas a máquina por completo. Menos de 120: salvas a Rose, mas a máquina ainda precisa de trabalho.","ru":"120 очков и больше: ты чинишь её полностью. Меньше 120: ты спасаешь Розу, но машину ещё надо доделать.","zh":"120 分或以上：完全修好。不到 120 分：救出萝丝，但机器还需要继续修。"},"target":"end_restore","min":120,"else":"end_flicker"},{"name":{"en":"BREAK THE TIME MACHINE","es":"ROMPER LA MÁQUINA DEL TIEMPO","de":"DIE ZEITMASCHINE ZERSTÖREN","ar":"حطّم آلة الزمن","fr":"BRISER LA MACHINE À TEMPS","it":"ROMPI LA MACCHINA DEL TEMPO","ja":"時間の機械をこわす","pt":"PARTIR A MÁQUINA DO TEMPO","ru":"СЛОМАТЬ МАШИНУ ВРЕМЕНИ","zh":"砸碎时间机器"},"desc":{"en":"Everyone escapes to a new home. You can choose this with any score.","es":"Todos escapan a un nuevo hogar. Puedes elegirlo con cualquier puntuación.","de":"Alle fliehen in ein neues Zuhause. Das kannst du mit jeder Punktzahl wählen.","ar":"يرحل الجميع إلى بيت جديد. ويمكنك اختيار هذا بأي عدد من النقاط.","fr":"Tout le monde part vers une nouvelle maison. Tu peux choisir ça avec n'importe quel score.","it":"Tutti scappano verso una nuova casa. Puoi scegliere questo con qualsiasi punteggio.","ja":"みんな新しい家へ逃げる。何点でもこれを選べる。","pt":"Todos fogem para uma casa nova. Podes escolher isto com qualquer pontuação.","ru":"Все уходят в новый дом. Это можно выбрать с любым счётом.","zh":"所有人逃到一个新家。无论多少分都可以选这个。"},"target":"end_escape"}],"hot":[48,60,10,24],"pos":"right","v":"center","width":40},"end_restore":{"kind":"ending","img":"31_restore_ending.webp","success":true,"k":{"en":"WONDERLAND SAVED · GAME COMPLETE","es":"PAÍS DE LAS MARAVILLAS A SALVO · JUEGO COMPLETO","de":"WUNDERLAND GERETTET · SPIEL BEENDET","ar":"أُنقذت بلاد العجائب · انتهت اللعبة","fr":"PAYS DES MERVEILLES SAUVÉ · JEU TERMINÉ","it":"PAESE DELLE MERAVIGLIE SALVO · GIOCO FINITO","ja":"ワンダーランドを救った · ゲームクリア","pt":"PAÍS DAS MARAVILHAS SALVO · JOGO COMPLETO","ru":"СТРАНА ЧУДЕС СПАСЕНА · ИГРА ПРОЙДЕНА","zh":"仙境获救 · 游戏完成"},"title":{"en":"WONDERLAND IS SAFE!","es":"¡EL PAÍS DE LAS MARAVILLAS ESTÁ A SALVO!","de":"WUNDERLAND IST SICHER!","ar":"بلاد العجائب في أمان!","fr":"LE PAYS DES MERVEILLES EST SAUVÉ !","it":"IL PAESE DELLE MERAVIGLIE È SALVO!","ja":"ワンダーランドは無事！","pt":"O PAÍS DAS MARAVILHAS ESTÁ SALVO!","ru":"СТРАНА ЧУДЕС В БЕЗОПАСНОСТИ!","zh":"仙境安全了！"},"story":{"en":"Alice fixes the time machine. All the clocks start again. Rose is free, and the Queen hugs her. The Queen gives Alice a crown to say thank you. Wonderland is safe!","es":"Alice repara la máquina del tiempo. Todos los relojes funcionan otra vez. Rose está libre y la Reina la abraza. La Reina da a Alice una corona para agradecerle su ayuda. ¡El País de las Maravillas está a salvo!","de":"Alice repariert die Zeitmaschine. Alle Uhren laufen wieder. Rose ist frei, und die Königin umarmt sie. Die Königin schenkt Alice zum Dank eine Krone. Wunderland ist sicher!","ar":"تُصلح أليس آلة الزمن. تعود كل الساعات إلى العمل. روز حرة، وتحتضنها الملكة. وتمنح الملكة أليس تاجاً شكراً لها. بلاد العجائب في أمان!","fr":"Alice répare la machine à remonter le temps. Toutes les horloges repartent. Rose est libre, et la Reine la serre dans ses bras. La Reine donne une couronne à Alice pour la remercier. Le Pays des Merveilles est sauvé !","it":"Alice ripara la macchina del tempo. Tutti gli orologi ripartono. Rose è libera e la Regina la abbraccia. La Regina dà ad Alice una corona per ringraziarla. Il Paese delle Meraviglie è salvo!","ja":"アリスはタイムマシンを直す。すべての時計がまた動きだす。ローズは自由になり、女王が抱きしめる。女王はお礼にアリスへ王冠を贈る。ワンダーランドは無事だ！","pt":"A Alice repara a máquina do tempo. Todos os relógios voltam a andar. A Rose está livre e a Rainha abraça-a. A Rainha dá à Alice uma coroa para lhe agradecer. O País das Maravilhas está salvo!","ru":"Алиса чинит машину времени. Все часы снова идут. Роза свободна, и Королева обнимает её. Королева дарит Алисе корону в благодарность. Страна чудес в безопасности!","zh":"爱丽丝修好了时间机器。所有的钟又开始走了。萝丝自由了，女王抱住了她。女王送给爱丽丝一顶王冠表示感谢。仙境安全了！"},"hot":[32,30,8,12],"pos":"right","v":"center"},"end_escape":{"kind":"ending","img":"32_escape_ending.webp","success":true,"k":{"en":"A NEW HOME · GAME COMPLETE","es":"UN NUEVO HOGAR · JUEGO COMPLETO","de":"EIN NEUES ZUHAUSE · SPIEL BEENDET","ar":"بيت جديد · انتهت اللعبة","fr":"UNE NOUVELLE MAISON · JEU TERMINÉ","it":"UNA NUOVA CASA · GIOCO FINITO","ja":"新しい家 · ゲームクリア","pt":"UMA CASA NOVA · JOGO COMPLETO","ru":"НОВЫЙ ДОМ · ИГРА ПРОЙДЕНА","zh":"新的家 · 游戏完成"},"title":{"en":"A NEW HOME","es":"UN NUEVO HOGAR","de":"EIN NEUES ZUHAUSE","ar":"بيت جديد","fr":"UNE NOUVELLE MAISON","it":"UNA NUOVA CASA","ja":"新しい家","pt":"UMA CASA NOVA","ru":"НОВЫЙ ДОМ","zh":"新的家"},"story":{"en":"Alice breaks the time machine. The palace begins to fall apart. Alice, Rose, the Queen and everyone else escape into a new forest. They are safe. Now they can build a new home.","es":"Alice rompe la máquina del tiempo. El palacio empieza a caerse. Alice, Rose, la Reina y todos los demás escapan a un bosque nuevo. Están a salvo. Ahora pueden construir un nuevo hogar.","de":"Alice zerstört die Zeitmaschine. Der Palast beginnt auseinanderzufallen. Alice, Rose, die Königin und alle anderen fliehen in einen neuen Wald. Sie sind sicher. Jetzt können sie ein neues Zuhause bauen.","ar":"تكسر أليس آلة الزمن. يبدأ القصر بالتهاوي. تهرب أليس وروز والملكة والجميع إلى غابة جديدة. إنهم في أمان، ويستطيعون الآن بناء بيت جديد.","fr":"Alice casse la machine à remonter le temps. Le palais commence à tomber en morceaux. Alice, Rose, la Reine et tous les autres s'échappent dans une nouvelle forêt. Ils sont en sécurité. Maintenant, ils peuvent construire une nouvelle maison.","it":"Alice rompe la macchina del tempo. Il palazzo comincia a cadere a pezzi. Alice, Rose, la Regina e tutti gli altri scappano in un bosco nuovo. Sono al sicuro. Adesso possono costruire una nuova casa.","ja":"アリスはタイムマシンを壊す。宮殿は崩れはじめる。アリスもローズも女王もみんな、新しい森へ逃げこむ。彼らは無事だ。これから新しい家を作ることができる。","pt":"A Alice parte a máquina do tempo. O palácio começa a desfazer-se. A Alice, a Rose, a Rainha e toda a gente fogem para uma floresta nova. Estão em segurança. Agora podem construir uma casa nova.","ru":"Алиса ломает машину времени. Дворец начинает разрушаться. Алиса, Роза, Королева и все остальные убегают в новый лес. Они в безопасности. Теперь можно построить новый дом.","zh":"爱丽丝打碎了时间机器。宫殿开始塌下来。爱丽丝、萝丝、女王和所有人一起逃进了一片新的森林。他们平安无事，现在可以建一个新家了。"},"hot":[20,30,16,26],"pos":"right","v":"center"},"end_flicker":{"kind":"ending","img":"33_flicker_ending.webp","success":false,"k":{"en":"MORE WORK TO DO · GAME COMPLETE","es":"QUEDA TRABAJO POR HACER · JUEGO COMPLETO","de":"ES BLEIBT ARBEIT · SPIEL BEENDET","ar":"ما زال هناك عمل · انتهت اللعبة","fr":"IL RESTE DU TRAVAIL · JEU TERMINÉ","it":"C'È ANCORA DA FARE · GIOCO FINITO","ja":"まだやることがある · ゲームクリア","pt":"AINDA HÁ TRABALHO · JOGO COMPLETO","ru":"ЕЩЁ ЕСТЬ РАБОТА · ИГРА ПРОЙДЕНА","zh":"还有事要做 · 游戏完成"},"title":{"en":"ONE MORE ADVENTURE","es":"UNA AVENTURA MÁS","de":"NOCH EIN ABENTEUER","ar":"مغامرة أخرى","fr":"ENCORE UNE AVENTURE","it":"UN'ALTRA AVVENTURA","ja":"もう一つの冒険","pt":"MAIS UMA AVENTURA","ru":"ЕЩЁ ОДНО ПРИКЛЮЧЕНИЕ","zh":"再来一次冒险"},"story":{"en":"The time machine starts, but it is still weak. Rose is free, and the Warden is gone. The Hatter keeps the machine working. Alice must find one more magic piece to finish the repair.","es":"La máquina del tiempo funciona, pero sigue débil. Rose está libre y el Guardián ha desaparecido. El Sombrerero mantiene la máquina en marcha. Alice debe encontrar una pieza mágica más para terminar la reparación.","de":"Die Zeitmaschine läuft, aber sie ist noch schwach. Rose ist frei, und der Wächter ist weg. Der Hutmacher hält die Maschine am Laufen. Alice muss noch ein magisches Teil finden, um die Reparatur zu beenden.","ar":"تعمل آلة الزمن، لكنها ما زالت ضعيفة. روز حرة والحارس اختفى. يُبقي القبّعاتي الآلة تعمل، وعلى أليس أن تجد قطعة سحرية أخيرة لإتمام الإصلاح.","fr":"La machine à remonter le temps démarre, mais elle est encore faible. Rose est libre, et le Gardien a disparu. Le Chapelier fait marcher la machine. Alice doit trouver une dernière pièce magique pour finir la réparation.","it":"La macchina del tempo riparte, ma è ancora debole. Rose è libera e il Guardiano è sparito. Il Cappellaio tiene la macchina in funzione. Alice deve trovare un ultimo pezzo magico per finire la riparazione.","ja":"タイムマシンは動きだしたが、まだ力が弱い。ローズは自由になり、番人も消えた。帽子屋が機械を動かし続けているあいだに、アリスは修理を仕上げる最後の魔法の部品をさがさなければならない。","pt":"A máquina do tempo arranca, mas ainda está fraca. A Rose está livre e o Guardião desapareceu. O Chapeleiro mantém a máquina a funcionar. A Alice tem de encontrar mais uma peça mágica para acabar a reparação.","ru":"Машина времени заработала, но она ещё слабая. Роза свободна, Страж исчез. Шляпник не даёт машине остановиться. Алисе нужно найти ещё одну волшебную деталь, чтобы закончить починку.","zh":"时间机器启动了，但还很虚弱。萝丝自由了，守卫也消失了。帽匠让机器继续运转，爱丽丝得再找到一块魔法零件才能修好它。"},"hot":[58,12,12,18],"pos":"left","v":"center"}},"endings":{"master":"end_restore","complete":"end_restore","missing":"end_flicker","failed":"end_escape"},"max":160,"points":10,"tiles":3,"chances":0,"completeScore":160,"repair":true,"total":16,"tags":{"a":{"en":"PINK · NOW","es":"ROSA · AHORA","de":"ROSA · JETZT","ar":"وردي · الآن","fr":"ROSE · MAINTENANT","it":"ROSA · ADESSO","ja":"ピンク · 今","pt":"ROSA · AGORA","ru":"РОЗОВЫЙ · СЕЙЧАС","zh":"粉 · 现在"},"b":{"en":"BLUE · EVERY DAY","es":"AZUL · CADA DÍA","de":"BLAU · JEDEN TAG","ar":"الأزرق · كل يوم","fr":"BLEU · CHAQUE JOUR","it":"BLU · OGNI GIORNO","ja":"青 · 毎日","pt":"AZUL · TODOS OS DIAS","ru":"СИНИЙ · КАЖДЫЙ ДЕНЬ","zh":"蓝色 · 每天"}}};
const LANGS = G.langs, RTL = ['ar'];
let state = fresh('off');
let sound=false;try{sound=localStorage.getItem('rpg-sound')==='1'}catch(_){}
/* two short tones, right and wrong — the Wonderland export's, kept */
function beep(ok){if(!sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.type=ok?'square':'sawtooth';o.frequency.value=ok?620:180;g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.stop(c.currentTime+.18);o.onended=()=>c.close()}catch(_){}}
function setSound(on){sound=!!on;try{localStorage.setItem('rpg-sound',sound?'1':'0')}catch(_){}const b=document.getElementById('sound');b.setAttribute('aria-pressed',String(sound));b.firstChild.textContent=(sound?'🔊':'🔈')+' ';document.getElementById('soundLabel').textContent=ui(sound?'soundOn':'soundOff')}
function fresh(lang){return {scene:G.start,score:0,chances:G.chances,tiles:0,lang,open:false,route:[],results:{},attempts:{},mistakes:[],answered:0,finalCorrect:null,endingPick:null,endingMaster:false}}
const frame=document.getElementById('frame'), content=document.getElementById('content'), sceneImage=document.getElementById('sceneImage');
const hot=document.getElementById('hot'), hotLabel=document.getElementById('hotLabel'), zone=document.getElementById('zone');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MARK=/\[\[(\/?)([ab])\]\]/g;
const bare=s=>String(s??'').replace(MARK,'');          /* plain text: alt, review, answer read-back */
const esct=s=>esc(s).replace(MARK,(_,c,k)=>c?'</span>':'<span class="tone-'+k+'">');
const tx=(o,l)=>o?(l&&o[l]?o[l]:o.en):'';
function ui(key,vars){let s=tx(G.labels[key],state.lang==='off'?null:state.lang);if(vars)for(const k in vars)s=s.replace('{'+k+'}',vars[k]);return s}
/* a gloss identical to the English (a formula, a name) is not shown — it would only repeat the line */
const gloss=obj=>state.lang!=='off'&&obj[state.lang]&&obj[state.lang]!==obj.en?obj[state.lang]:'';
function line(obj,cls=''){if(!obj)return '';const en=esct(obj.en),g=gloss(obj);return g?`<span class="${cls}">${en}<span class="translation">${esct(g)}</span></span>`:`<span class="${cls}">${en}</span>`}
function label(obj){if(!obj)return '';const g=gloss(obj);return g?`${esct(obj.en)}<span class="translation">${esct(g)}</span>`:esct(obj.en)}
/* an option is {en,…} or, for a two-blank item, {parts:[a,b], kinds:['a'|'b',…], tags:[{en,…},{en,…}]} — two coloured halves */
function optText(o){return bare(o.parts?o.parts.join(' / '):o.en)}
function optMarkup(o){if(!o.parts)return `<span>${label(o)}</span>`;return o.parts.map((p,i)=>`<span class="half ${o.kinds[i]}"><small>${label(G.tags[o.kinds[i]])}</small><b>${esc(p)}</b></span>`).join('')}
function updateHUD(){document.getElementById('score').textContent=state.score;document.getElementById('tiles').textContent='◆'.repeat(state.tiles)+'◇'.repeat(Math.max(0,G.tiles-state.tiles));document.getElementById('chances').textContent='♥'.repeat(state.chances)+'♡'.repeat(Math.max(0,G.chances-state.chances));document.getElementById('lblPoints').textContent=ui('points');document.getElementById('lblTiles').textContent=ui('tiles');document.getElementById('lblChances').textContent=ui('chances');document.getElementById('chancesBadge').hidden=!G.chances;document.getElementById('progressBadge').hidden=!G.total;if(G.total){document.getElementById('lblProgress').textContent=ui('progress');document.getElementById('progress').textContent=`${state.answered}/${G.total}`}document.getElementById('help').textContent=ui('help')}
function head(s){const t=s.kind==='intro'?`<span class="big">${label(s.title)}</span>`:label(s.title);return `${line(s.k,'kicker')}<h1 class="title ${s.kind==='intro'?'cover-title':''}">${t}</h1>${line(s.story,'story')}`}
/* HOT = [cx, cy, w, h] as % of the PICTURE (3:2). The picture is object-fit:cover in the frame, so convert picture space to frame pixels; a phone shows a narrow central slice and the object stays on it. */
function placeHot(h){const W=frame.clientWidth,H=frame.clientHeight,sc=Math.max(W/G.imgW,H/G.imgH),dw=G.imgW*sc,dh=G.imgH*sc;
  /* cover crops the picture; slide it so the object stays on screen (a portrait phone shows a third of the width) */
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const ox=dw>W?clamp(W/2-h[0]/100*dw,W-dw,0):(W-dw)/2,oy=dh>H?clamp(H/2-h[1]/100*dh,H-dh,0):(H-dh)/2;
  sceneImage.style.objectPosition=`${dw>W?ox/(W-dw)*100:50}% ${dh>H?oy/(H-dh)*100:50}%`;
  const cx=ox+h[0]/100*dw,cy=oy+h[1]/100*dh,w=h[2]/100*dw,hh=h[3]/100*dh;hot.style.left=cx+'px';hot.style.top=cy+'px';hot.style.width=w+'px';hot.style.height=hh+'px';hot.classList.toggle('above',cy+hh/2>H*.84);hotLabel.textContent=ui('read');
  document.getElementById('fsLabel').textContent=ui('fullscreen');document.getElementById('soundLabel').textContent=ui(sound?'soundOn':'soundOff');document.getElementById('langWord').textContent=ui('translate');document.getElementById('langCur').textContent=state.lang==='off'?'OFF':G.names[state.lang];
  document.querySelectorAll('.lang-item').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function setOpen(on){state.open=!!on;if(on){const hr=hot.getBoundingClientRect(),zr=zone.getBoundingClientRect();const cl=zr.left+content.offsetLeft,ct=zr.top+content.offsetTop;content.style.transformOrigin=`${hr.left+hr.width/2-cl}px ${hr.top+hr.height/2-ct}px`}frame.classList.toggle('open',state.open)}
function openPanel(){if(!state.open)setOpen(true)}
function closePanel(){if(state.open)setOpen(false)}
function render(){const s=G.scenes[state.scene];frame.className=`frame ${s.pos||'left'} v-${s.v||'center'}${RTL.includes(state.lang)?' rtl':''}`;sceneImage.src=G.dir+s.img;sceneImage.alt=bare(s.title.en);placeHot(s.hot);const tr=state.lang!=='off';frame.classList.toggle('tr-on',tr);content.style.width=((s.width||(s.pos==='center'?64:46))+(tr?8:0))+'%';content.style.marginLeft=s.pos==='left'&&s.inset?s.inset+'%':'';content.style.marginRight=s.pos==='right'&&s.inset?s.inset+'%':'';
  let html=`<button class="hide-btn" onclick="closePanel()" title="Esc">✕ ${ui('hide')}</button>`+head(s);
  if(s.kind==='intro'){html+=`${s.rules?`<div class="rules-chips">${s.rules.map(r=>`<span>${label(r)}</span>`).join('')}</div>`:''}<button class="start" onclick="go('${s.next}')">${label(s.start)}</button>${s.small?`<div class="small">${label(s.small)}</div>`:''}`}
  else if(s.kind==='rules'){html+=`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('begin')}</button>`}
  else if(s.kind==='story'){html+=`${s.rules?`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>`:''}${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('continue')}</button>`}
  else if(s.kind==='question'){html+=`${s.clue?`<div class="clue"><b>${ui('visual')}</b><br>${label(s.clue)}</div>`:''}<div class="prompt">${label(s.prompt)}</div><div class="options">${s.opts.map((o,i)=>`<button class="option${o.parts?' split':''}" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span>${optMarkup(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="continue" class="continue" hidden onclick="advance()">${ui('continue')}</button>`}
  else if(s.kind==='choice'){html+=`<div class="route-options">${s.routes.map((r,i)=>`<button class="route" onclick="chooseRoute(${i})"><b>${i+1} · ${label(r.name)}</b>${label(r.desc)}</button>`).join('')}</div>`}
  else if(s.kind==='ending'){/* an ending may close with a paragraph that depends on the route taken (routeStory) */const rt=s.routeStory?(Object.entries(s.routeStory).find(([k])=>state.route.includes(k))||[])[1]:null;const rev=G.repair?(state.mistakes.length?`<div class="review">${state.mistakes.map(id=>{const m=G.scenes[id];return `<div>${esct(m.prompt.en)}<br><b>${esc(optText(m.opts[m.answer]))}</b> — ${label(m.fb)}</div>`}).join('')}</div>`:`<div class="small">${ui('perfect')}</div>`):'';const ft=G.repair?` · ${state.score/(G.points||1)}/${G.total} ${ui('firstTry')}`:'';html+=`${rt?line(rt,'story'):''}<div class="final-score">${ui('finalScore')} ${state.score}/${G.max}${ft} · ${'◆'.repeat(state.tiles)}${'◇'.repeat(Math.max(0,G.tiles-state.tiles))}</div>${rev}${state.route.length?`<div class="small">${ui('route')}: ${esc(state.route.join(' · ').toUpperCase())}</div>`:''}<button class="restart" onclick="restart()">${ui('restart')}</button>`}
  content.innerHTML=html;content.scrollTop=0;updateHUD();setOpen(s.kind==='intro'||s.kind==='ending');
  if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene))setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}
hot.addEventListener('click',e=>{e.stopPropagation();openPanel()});
sceneImage.addEventListener('click',()=>{closeMenu();closePanel()});
window.addEventListener('resize',()=>placeHot(G.scenes[state.scene].hot));
const langMenu=document.getElementById('langMenu'), langBtn=document.getElementById('langBtn');
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
function toggleMenu(){langMenu.hidden=!langMenu.hidden;langBtn.setAttribute('aria-expanded',String(!langMenu.hidden))}
function go(id){state.scene=id;render()}
function displayAnswer(i,apply){const s=G.scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];const ok=i===s.answer;const p=s.points||G.points;const fb=document.getElementById('feedback');const expl=s.fb?`<br>${label(s.fb)}`:'';
  if(apply)beep(ok);
  if(G.repair&&!ok){/* repair mode: mark it, explain, let them try again */buttons[i].classList.add('wrong');buttons[i].disabled=true;fb.innerHTML=`<strong>${ui('tryAgain')}</strong>${expl}`;fb.className='feedback show bad';if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}));return}
  buttons.forEach(b=>b.disabled=true);buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');
  const retried=G.repair&&(state.attempts[state.scene]||0)>0;
  if(apply){if(ok&&!retried){state.score+=p}if(ok&&s.relic)state.tiles=Math.min(G.tiles,state.tiles+1);if(!ok)state.chances=Math.max(0,state.chances-1);if(s.final)state.finalCorrect=ok;if(G.repair)state.answered++}
  const head=ok?(retried?ui('repaired'):ui(s.relic?'relic':'correct',{p})):ui('wrong');const was=ok?'':`<br>${ui('answerWas')} ${esc(optText(s.opts[s.answer]))}`;
  fb.innerHTML=`<strong>${head}</strong>${was}${expl}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD();if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}))}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;const s=G.scenes[state.scene];if(G.repair&&i!==s.answer){if(!(state.attempts[state.scene]||0))state.mistakes.push(state.scene);state.attempts[state.scene]=(state.attempts[state.scene]||0)+1;displayAnswer(i,true);return}state.results[state.scene]=i;displayAnswer(i,true)}
function resolve(){const full=state.tiles>=G.tiles&&state.chances>0;const flawless=state.finalCorrect&&full&&state.score>=G.max;if(flawless&&(!state.endingPick||state.endingMaster))return G.endings.master;if(state.endingPick&&state.chances>0&&G.endings[state.endingPick])return G.endings[state.endingPick];if(state.finalCorrect&&full&&state.score>=G.completeScore)return G.endings.complete;if(state.finalCorrect&&state.tiles<G.tiles)return G.endings.missing;return G.endings.failed}
function advance(){const s=G.scenes[state.scene];if(state.chances<=0&&state.results[state.scene]!==s.answer){go(G.endings.failed);return}if(s.next==='resolve'){go(resolve());return}go(s.next)}
function chooseRoute(i){const r=G.scenes[state.scene].routes[i];if(r.route)state.route.push(r.route);if(r.ending){state.endingPick=r.ending;state.endingMaster=!!r.master}go(r.min!=null&&state.score<r.min?r.else:r.target)}
function restart(){state=fresh(state.lang);render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?`<b>OFF</b><span>${esc(G.labels.off.en)}</span>`:`<b>${l.toUpperCase()}</b><span>${esc(G.names[l])}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('sound').addEventListener('click',()=>{setSound(!sound);beep(true)});
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{const k=e.key;if(k.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(k==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(k.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(k.toLowerCase()==='s'){document.getElementById('sound').click();return}if(!state.open&&(k==='Enter'||['1','2','3'].includes(k))){openPanel();return}const s=G.scenes[state.scene];if(['1','2','3'].includes(k)){const i=Number(k)-1;if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click();return}if(k==='Enter')document.querySelector('.continue:not([hidden]),.start,.restart')?.click()});
setSound(sound);render();
</script>
