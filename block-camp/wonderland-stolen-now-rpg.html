:root{--cake-a:rgba(207,52,125,.55);--cake-b:rgba(36,121,173,.55);
--cake-a-ink:#fff0f7;--cake-b-ink:#eef7ff;
--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;
--cake-a-wash:rgba(207,52,125,.22);--cake-b-wash:rgba(36,121,173,.22);
--accent:#E66085;--accent-ink:#1f0716;--deep:#2d1024;--panel:rgba(30,9,26,.9);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* ── HUD ── */
.hud{position:absolute;z-index:5;top:1.3cqw;left:1.5cqw;right:1.5cqw;display:flex;align-items:center;justify-content:space-between;gap:1cqw;pointer-events:none}
.hud-group{display:flex;gap:.55cqw;align-items:center;flex-wrap:wrap}

,"pt":"PAÍS DAS MARAVILHAS · RPG DO PRESENT CONTINUOUS","ru":"СТРАНА ЧУДЕС · RPG PRESENT CONTINUOUS","zh":"仙境 · 现在进行时 RPG"},"title":{"en":"THE STOLEN NOW","es":"EL AHORA ROBADO","de":"DAS GESTOHLENE JETZT","ar":"الحاضر المسروق","fr":"LE PRÉSENT VOLÉ","it":"IL PRESENTE RUBATO","ja":"ぬすまれた今","pt":"O AGORA ROUBADO","ru":"УКРАДЕННОЕ НАСТОЯЩЕЕ","zh":"被偷走的此刻"},"story":{"en":"Time is going wrong in Wonderland. The same afternoon keeps starting again. Soon, everyone will stop moving. Help Alice fix the palace clock and save her friends.","es":"En el País de las Maravillas, la misma tarde empieza una y otra vez. Pronto nadie podrá moverse. Ayuda a Alice a reparar el reloj del palacio y a salvar a sus amigos.","de":"In Wunderland beginnt derselbe Nachmittag immer wieder. Bald können sich alle nicht mehr bewegen. Hilf Alice, die Palastuhr zu reparieren und ihre Freunde zu retten.","ar":"هناك خطأ ما في الزمن في بلاد العجائب. تبدأ الظهيرة نفسها مرة بعد مرة، وفي كل مرة تصبح أقصر. وعندما تتوقف ساعة القصر، سيتوقف كل من في بلاد العجائب أيضاً.","fr":"Quelque chose ne va pas avec le temps au Pays des Merveilles. Le même après-midi recommence encore et encore, et à chaque fois il est plus court. Quand l'horloge du palais s'arrêtera, tout le monde au Pays des Merveilles s'arrêtera aussi.","it":"Qualcosa non va con il tempo nel Paese delle Meraviglie. Lo stesso pomeriggio ricomincia ancora e ancora, e ogni volta è più corto. Quando l'orologio del palazzo si fermerà, si fermeranno tutti anche loro.","ja":"ワンダーランドの時間がおかしくなっている。同じ午後が何度も始まり、そのたびに短くなる。宮殿の時計が止まると、ワンダーランドのみんなも止まってしまう。","pt":"Alguma coisa está errada com o tempo no País das Maravilhas. A mesma tarde começa outra vez e outra vez, e de cada vez é mais curta. Quando o relógio do palácio parar, todos no País das Maravilhas param também.","ru":"Со временем в Стране чудес что-то не так. Один и тот же день начинается снова и снова, и каждый раз он короче. Когда дворцовые часы остановятся, остановятся и все в Стране чудес.","zh":"仙境的时间出问题了。同一个下午一次又一次地重新开始，而且一次比一次短。宫殿的大钟一停，仙境里的每个人也会停下来。"},"rules":[{"en":"+10 FIRST TRY","es":"+10 A LA PRIMERA","de":"+10 BEIM ERSTEN VERSUCH","ar":"+10 من المحاولة الأولى","fr":"+10 DU PREMIER COUP","it":"+10 AL PRIMO TENTATIVO","ja":"一発正解 +10","pt":"+10 À PRIMEIRA","ru":"+10 С ПЕРВОЙ ПОПЫТКИ","zh":"一次答对 +10"},{"en":"3 MAGIC OBJECTS","es":"3 OBJETOS MÁGICOS","de":"3 ZAUBERGEGENSTÄNDE","ar":"٣ أشياء سحرية","fr":"3 OBJETS MAGIQUES","it":"3 OGGETTI MAGICI","ja":"魔法のアイテム3つ","pt":"3 OBJETOS MÁGICOS","ru":"3 ВОЛШЕБНЫХ ПРЕДМЕТА","zh":"3 件魔法物品"},{"en":"16 QUESTIONS","es":"16 PREGUNTAS","de":"16 FRAGEN","ar":"16 تعويذة","fr":"16 SORTS","it":"16 INCANTESIMI","ja":"呪文 16 個","pt":"16 FEITIÇOS","ru":"16 ЗАКЛИНАНИЙ","zh":"16 个咒语"}],"start":{"en":"START THE ADVENTURE","es":"EMPEZAR LA AVENTURA","de":"DAS ABENTEUER STARTEN","ar":"ابدأ المهمة","fr":"COMMENCER LA QUÊTE","it":"INIZIA LA MISSIONE","ja":"クエストを始める","pt":"COMEÇAR A MISSÃO","ru":"НАЧАТЬ ЗАДАНИЕ","zh":"开始任务"},"small":{"en":"One player · easy English · two paths to choose · three endings","es":"Un jugador · inglés fácil · dos caminos a elegir · tres finales","de":"Ein Spieler · einfaches Englisch · zwei Wege zur Wahl · drei Enden","ar":"لاعب واحد · A1–A2 · طريقان للاختيار · ثلاث نهايات","fr":"Un joueur · A1–A2 · deux chemins au choix · trois fins","it":"Un giocatore · A1–A2 · due percorsi da scegliere · tre finali","ja":"1人プレイ · A1–A2 · 選べる2つの道 · 3つの結末","pt":"Um jogador · A1–A2 · dois caminhos à escolha · três finais","ru":"Один игрок · A1–A2 · два пути на выбор · три концовки","zh":"单人 · A1–A2 · 两条路线可选 · 三种结局"},"next":"prologue","hot":[65,22,12,22],"pos":"left","v":"center"},"prologue":{"kind":"story","img":"01_prologue.webp","k":{"en":"THE STORY · TIME IS IN DANGER","es":"LA HISTORIA · EL TIEMPO ESTÁ EN PELIGRO","de":"DIE GESCHICHTE · DIE ZEIT IST IN GEFAHR","ar":"المقدمة · الزمن يتوقف","fr":"PROLOGUE · LE TEMPS S'ARRÊTE","it":"PROLOGO · IL TEMPO SI STA FERMANDO","ja":"プロローグ · 時間が止まりかけている","pt":"PRÓLOGO · O TEMPO ESTÁ A PARAR","ru":"ПРОЛОГ · ВРЕМЯ ОСТАНАВЛИВАЕТСЯ","zh":"序章 · 时间正在停止"},"title":{"en":"SOMEONE STOLE THE MAGIC CRYSTAL!","es":"¡ALGUIEN ROBÓ EL CRISTAL MÁGICO!","de":"JEMAND HAT DEN ZAUBERKRISTALL GESTOHLEN!","ar":"قلب الساعة اختفى","fr":"LE CŒUR DE L'HORLOGE A DISPARU","it":"IL CUORE DELL'OROLOGIO È SPARITO","ja":"時計の心臓が消えた","pt":"O CORAÇÃO DO RELÓGIO DESAPARECEU","ru":"СЕРДЦЕ ЧАСОВ ИСЧЕЗЛО","zh":"大钟的心脏不见了"},"story":{"en":"The Time Warden, a dangerous shadow, steals the crystal from the palace clock. The crystal makes time work. Now people are stopping in the street. Even the rain is stopping in the air! Alice can still move. The Rabbit tells her what to do: find two magic objects to power the clock, open the magic gate, then go to the Queen’s palace and stop the Warden.","es":"El Guardián del Tiempo, una sombra peligrosa, roba el cristal del reloj del palacio. El cristal hace funcionar el tiempo. Ahora las personas se quedan inmóviles en la calle. ¡Incluso la lluvia se queda parada en el aire! Alice todavía puede moverse. El Conejo le dice qué hacer: encuentra dos objetos mágicos para el reloj, abre la puerta mágica y llega hasta la Reina para detener al Guardián.","de":"Der Zeitwächter, ein gefährlicher Schatten, stiehlt den Kristall aus der Palastuhr. Der Kristall lässt die Zeit laufen. Jetzt bleiben die Menschen auf der Straße stehen. Sogar der Regen bleibt in der Luft stehen! Alice kann sich noch bewegen. Das Kaninchen sagt ihr, was zu tun ist: Finde zwei magische Gegenstände für die Uhr, öffne das Zaubertor und erreiche die Königin, um den Wächter zu stoppen.","ar":"حارس الزمن ظلٌّ مظلم. إنه يسحب القلب المتوهّج من ساعة القصر. انظر: الناس في الشارع لا يتحركون، والمطر لا يسقط. وحدهم أليس والأرنب والقط ما زالوا قادرين على الحركة. يقول الأرنب إن القلب صار الآن شيئين سحريين. جدهما معاً، وافتح البوابة الكبيرة، وصِل إلى الملكة قبل أن تتوقف الساعة.","fr":"Le Gardien du Temps est une ombre sombre. Il est en train de retirer le Cœur brillant de l'horloge du palais. Regarde : les gens dans la rue ne bougent pas, et la pluie ne tombe pas. Seuls Alice, le Lapin et le Chat peuvent encore bouger. Le Lapin dit que le Cœur est maintenant deux objets magiques. Trouve-les tous les deux, ouvre la grande porte et rejoins la Reine avant que l'horloge s'arrête.","it":"Il Guardiano del Tempo è un'ombra scura. Sta togliendo il Cuore luminoso dall'orologio del palazzo. Guarda: le persone per strada non si muovono e la pioggia non cade. Solo Alice, il Coniglio e il Gatto possono ancora muoversi. Il Coniglio dice che il Cuore adesso sono due oggetti magici. Trovali tutti e due, apri il grande cancello e raggiungi la Regina prima che l'orologio si fermi.","ja":"時の番人は黒い影だ。宮殿の時計から光る心臓を取り出している。見て――通りの人は動いていないし、雨も降っていない。動けるのはアリスとウサギとネコだけ。ウサギが言う、心臓はいま2つの魔法のアイテムになった、と。両方を見つけ、大きな門を開け、時計が止まる前に女王のところへ行こう。","pt":"O Guardião do Tempo é uma sombra escura. Está a tirar o Coração brilhante do relógio do palácio. Olha: as pessoas na rua não se movem e a chuva não cai. Só a Alice, o Coelho e o Gato ainda se podem mover. O Coelho diz que o Coração agora são dois objetos mágicos. Encontra os dois, abre o grande portão e chega à Rainha antes de o relógio parar.","ru":"Страж Времени — тёмная тень. Он вынимает светящееся Сердце из дворцовых часов. Смотри: люди на улице не двигаются, и дождь не падает. Только Алиса, Кролик и Кот ещё могут двигаться. Кролик говорит, что Сердце теперь — два волшебных предмета. Найди оба, открой большие ворота и доберись до Королевы, пока часы не остановились.","zh":"时间守卫是一道黑影。它正在把发光的心脏从宫殿大钟里取出来。你看：街上的人不动了，雨也不落了。只有爱丽丝、兔子和猫还能动。兔子说，心脏现在变成了两件魔法物品。把两件都找到，打开大门，在大钟停下之前见到女王。"},"next":"rules","hot":[82,10,12,16],"pos":"left","v":"center"},"rules":{"kind":"rules","img":"01_prologue.webp","k":{"en":"GRAMMAR HELP · BEFORE YOU START","es":"AYUDA DE GRAMÁTICA · ANTES DE EMPEZAR","de":"GRAMMATIKHILFE · BEVOR DU STARTEST","ar":"قبل المهمة · كتاب تعويذاتك النحوي","fr":"AVANT LA QUÊTE · TON GRIMOIRE DE GRAMMAIRE","it":"PRIMA DELLA MISSIONE · IL TUO LIBRO DEGLI INCANTESIMI","ja":"クエストの前に · 文法の呪文書","pt":"ANTES DA MISSÃO · O TEU LIVRO DE FEITIÇOS","ru":"ПЕРЕД ЗАДАНИЕМ · ТВОЯ КНИГА ЗАКЛИНАНИЙ","zh":"任务之前 · 你的语法咒语书"},"title":{"en":"NOW OR EVERY DAY?","es":"¿AHORA O CADA DÍA?","de":"JETZT ODER JEDEN TAG?","ar":"الآن أم دائمًا؟","fr":"MAINTENANT OU TOUJOURS ?","it":"ADESSO O SEMPRE?","ja":"今か、いつもか？","pt":"AGORA OU SEMPRE?","ru":"СЕЙЧАС ИЛИ ВСЕГДА?","zh":"现在还是一向？"},"story":{"en":"Use the present continuous for an action happening now: “Alice is running.” Use the present simple for things we do regularly and for facts: “I play every day.” “A rabbit has long ears.”","es":"Usa el presente continuo para una acción que ocurre ahora: «Alice is running». Usa el presente simple para lo que hacemos con regularidad y para los hechos: «I play every day». «A rabbit has long ears».","de":"Benutze das Present Continuous für eine Handlung, die gerade passiert: „Alice is running.“ Benutze das Present Simple für Regelmäßiges und für Fakten: „I play every day.“ „A rabbit has long ears.“","ar":"استخدم المضارع المستمر لفعل يحدث الآن: Alice is running. واستخدم المضارع البسيط لما نفعله مرة بعد مرة وللحقائق: Alice runs every day.","fr":"Utilise le présent continu pour une action qui se passe maintenant : Alice is running. Utilise le présent simple pour ce qu'on fait encore et encore, et pour les faits : Alice runs every day.","it":"Usa il present continuous per un'azione che sta succedendo adesso: Alice is running. Usa il present simple per le cose che facciamo di continuo e per i fatti: Alice runs every day.","ja":"いま起きている動作には現在進行形を使う：Alice is running。くり返しすることや事実には現在形を使う：Alice runs every day。","pt":"Usa o presente contínuo para uma ação que está a acontecer agora: Alice is running. Usa o presente simples para as coisas que fazemos vezes sem conta e para factos: Alice runs every day.","ru":"Present Continuous — для действия, которое происходит сейчас: Alice is running. Present Simple — для того, что мы делаем снова и снова, и для фактов: Alice runs every day.","zh":"现在进行时用于此刻正在发生的动作：Alice is running。一般现在时用于反复做的事和事实：Alice runs every day。"},"rules":[{"tone":"a","name":{"en":"FORM · AM / IS / ARE + VERB-ING","es":"FORMA · AM / IS / ARE + VERBO-ING","de":"FORM · AM / IS / ARE + VERB-ING","ar":"الصيغة · AM / IS / ARE + صيغة ING","fr":"FORME · AM / IS / ARE + FORME ING","it":"FORMA · AM / IS / ARE + FORMA ING","ja":"形 · AM / IS / ARE + ING 形","pt":"FORMA · AM / IS / ARE + FORMA ING","ru":"ФОРМА · AM / IS / ARE + ФОРМА НА ING","zh":"形式 · AM / IS / ARE + ING 形式"},"form":{"en":"I am playing · He / She / It is playing · You / We / They are playing","es":"I am playing · He / She / It is playing · You / We / They are playing","de":"I am playing · He / She / It is playing · You / We / They are playing","ar":"I am running · he / she / it is running · you / we / they are running","fr":"I am running · he / she / it is running · you / we / they are running","it":"I am running · he / she / it is running · you / we / they are running","ja":"I am running · he / she / it is running · you / we / they are running","pt":"I am running · he / she / it is running · you / we / they are running","ru":"I am running · he / she / it is running · you / we / they are running","zh":"I am running · he / she / it is running · you / we / they are running"}},{"name":{"en":"NEGATIVE AND QUESTION","es":"NEGACIÓN Y PREGUNTA","de":"VERNEINUNG UND FRAGE","ar":"النفي والسؤال","fr":"NÉGATION ET QUESTION","it":"NEGAZIONE E DOMANDA","ja":"否定文と疑問文","pt":"NEGATIVA E PERGUNTA","ru":"ОТРИЦАНИЕ И ВОПРОС","zh":"否定句和疑问句"},"form":{"en":"Alice is not sleeping. · Is Alice sleeping? Yes, she is. / No, she isn’t.","es":"Alice no está durmiendo. · ¿Está durmiendo Alice? Sí. / No.","de":"Alice schläft nicht. · Schläft Alice gerade? Ja. / Nein.","ar":"أليس ليست نائمة. · هل أليس نائمة؟ نعم. / لا.","fr":"Alice ne dort pas. · Alice dort-elle ? Oui. / Non.","it":"Alice non sta dormendo. · Alice sta dormendo? Sì. / No.","ja":"アリスは眠っていない。· アリスは眠っている？ はい。/ いいえ。","pt":"A Alice não está a d unti.","ja":"最初の正解で10ポイント。まちがえたらルールを読んで呪文を直そう。どの道にも呪文は16個、160ポイントだ。","pt":"A tua primeira resposta certa dá-te 10 pontos. Se errares, lê a regra e repara o feitiço. Há 16 feitiços em cada caminho e 160 pontos.","ru":"Первый правильный ответ даёт 10 очков. Если ошибся, прочитай правило и почини заклинание. На каждом пути 16 заклинаний и 160 очков.","zh":"第一次答对得 10 分。答错了就读一读规则，再修复咒语。每条路线有 16 个咒语，一共 160 分。"},"button":{"en":"CHOOSE A PATH","es":"ELIGE UN CAMINO","de":"WÄHLE EINEN WEG","ar":"اختر المسار الأول","fr":"CHOISIR LA PREMIÈRE PISTE","it":"SCEGLI IL PRIMO SENTIERO","ja":"最初の道を選ぶ","pt":"ESCOLHER O PRIMEIRO TRILHO","ru":"ВЫБРАТЬ ПЕРВУЮ ТРОПУ","zh":"选择第一条路"},"next":"choice1","hot":[66,9,8,14],"pos":"left","v":"center","width":56},"03_rabbit_run":{"kind":"question","img":"03_rabbit_run.webp","k":{"en":"PART 1 · FIND THE FIRST MAGIC OBJECT","es":"PARTE 1 · ENCUENTRA EL PRIMER OBJETO MÁGICO","de":"TEIL 1 · FINDE DEN ERSTEN ZAUBERGEGENSTAND","ar":"الفصل الأول · الأثر الأول","fr":"ACTE I · LA PREMIÈRE RELIQUE","it":"ATTO I · LA PRIMA RELIQUIA","ja":"第1幕 · 最初の遺物","pt":"ATO I · A PRIMEIRA RELÍQUIA","ru":"АКТ I · ПЕРВАЯ РЕЛИКВИЯ","zh":"第一幕 · 第一件圣物"},"title":{"en":"FOLLOW THE RABBIT!","es":"¡SIGUE AL CONEJO!","de":"FOLGE DEM KANINCHEN!","ar":"تبدأ المطاردة","fr":"LA POURSUITE COMMENCE","it":"INIZIA L'INSEGUIMENTO","ja":"追跡が始まる","pt":"COMEÇA A PERSEGUIÇÃO","ru":"ПОГОНЯ НАЧИНАЕТСЯ","zh":"追逐开始"},"story":{"en":"The Rabbit is running to a deep valley. The Time Warden’s guards are chasing him. Help him escape!","es":"El Conejo corre hacia un valle profundo. Los guardias del Guardián del Tiempo lo persiguen. ¡Ayúdalo a escapar!","de":"Das Kaninchen rennt zu einem tiefen Tal. Die Wachen des Zeitwächters verfolgen es. Hilf ihm zu entkommen!","ar":"رأى الأرنب الحارس. إنه يندفع نحو وادي الورود بينما يمزّق الحرّاس الآليون الطريق خلفه.","fr":"Le Lapin a vu le Gardien. Il file vers le Canyon des Roses pendant que des gardes mécaniques détruisent le chemin derrière lui.","it":"Il Coniglio ît une rivière qui mène à la Boussole-Tasse. Un garde-carte gentil peut emmener Alice jusqu'à la Souris Horlogère en prison, et jusqu'à son Engrenage du Cœur.","it":"Il Cappellaio conosce un fiume che porta alla Bussola-Tazza. Una guardia di carte gentile può portare Alice dalla Topina Orologiaia in prigione e al suo Ingranaggio del Cuore.","ja":"帽子屋は、ティーカップ・コンパスへ続く川を知っている。親切なトランプの兵士は、牢屋にいる時計ネズミと、その心臓の歯車のところへアリスを連れて行ける。","pt":"O Chapeleiro conhece um rio que vai dar à Bússola-Chávena. Um guarda de cartas simpático pode levar a Alice até à Rata Relojoeira na prisão e até à Engrenagem do Coração.","ru":"Шляпник знает реку, которая ведёт к Чашечному компасу. Добрый стражник-карта может отвести Алису к Мыши-часовщице в тюрьме и к её Сердечной шестерёнке.","zh":"帽匠知道一条通往茶杯罗盘的河。一位友善的纸牌卫兵能带爱丽丝去牢里找钟表鼠，还有她的心齿轮。"},"routes":[{"name":{"en":"TAKE THE TEACUP BOAT","es":"TOMA EL BARCO-TAZA","de":"NIMM DAS TEETASSENBOOT","ar":"اركب قارب فنجان الشاي","fr":"PRENDRE LE BATEAU-TASSE","it":"PRENDI LA BARCA-TAZZA","ja":"ティーカップの船に乗る","pt":"APANHAR O BARCO-CHÁVENA","ru":"СЕСТЬ В ЛОДКУ-ЧАШКУ","zh":"乘茶杯船"},"desc":{"en":"Travel by boat with the Hatter. Find a magic compass.","es":"Viaja en barco con el Sombrerero. Encuentra una brújula mágica.","de":"Fahre mit dem Hutmacher im Boot. Finde einen magischen Kompass.","ar":"سافر مع القبّعاتي على النهر الذي يجري إلى الوراء وخذ بوصلة الفنجان.","fr":"Voyage sur la rivière à l'envers avec le Chapelier et prends la Boussole-Tasse.","it":"Viaggia sul fiume che va all'indietro con il Cappellaio e prendi la Bussola-Tazza.","ja":"帽子屋といっしょに逆に流れる川を進み、ティーカップ・コンパスを手に入れよう。","pt":"Viaja no rio ao contrário com o Chapeleiro e apanha a Bússola-Chávena.","ru":"Плыви со Шляпником по реке, текущей назад, и возьми Чашечный компас.","zh":"和帽匠一起在倒流的河上航行，拿到茶杯罗盘。"},"route":"Teacup Compass","target":"17_boat_engine"},{"name":{"en":"RESCUE THE MOUSE","es":"RESCATA A LA RATONA","de":"RETTE DIE MAUS","ar":"ادخل سجن التروس","fr":"ENTRER DANS LA PRISON D'ENGRENAGES","it":"ENTRA NELLA PRIGIONE DEGLI INGRANAGGI","ja":"歯車の牢獄に入る","pt":"ENTRAR NA PRISÃO DE ENGRENAGENS","ru":"ВОЙТИ В ТЮРЬМУ ШЕСТЕРЁН","zh":"进入齿轮监狱"},"desc":{"en":"Help the Mouse escape from prison. Find a magic metal wheel.","es":"Ayuda a la Ratona a escapar de la prisión. Encuentra una rueda de metal mágica.","de":"Hilf der Maus aus dem Gefängnis. Finde ein magisches Metallrad.","ar":"ساعد الفأرة الساعاتية على الهرب وخذ ترس القلب.","fr":"Aide la Souris Horlogère à s'échapper et prends l'Engrenage du Cœur.","it":"Aiuta la Topina Orologiaia a scappare e prendi l'Ingranaggio del Cuore.","ja":"時計ネズミの脱出を助けて、心臓の歯車を手に入れよう。","pt":"Ajuda a Rata Relojoeira a fugir e apanha a Engrenagem do Coração.","ru":"Помоги Мыши-часовщице сбежать и возьми Сердечную шестерёнку.","zh":"帮钟表鼠逃出去，拿到心齿轮。"},"route":"Heart Gear","target":"21_prison_gears"}],"hot":[50,60,10,26],"pos":"center","v":"top"},"boss_intro":{"kind":"story","img":"25_boss_reveal.webp","k":{"en":"THE SECRET · WHY TIME IS STOPPING","es":"EL SECRETO · POR QUÉ SE DETIENE EL TIEMPO","de":"DAS GEHEIMNIS · WARUM DIE ZEIT STEHEN BLEIBT","ar":"السر · الساعة تتوقف","fr":"LE SECRET · L'HORLOGE S'ARRÊTE","it":"IL SEGRETO · L'OROLOGIO SI STA FERMANDO","ja":"秘密 · 時計が止まりかけている","pt":"O SEGREDO · O RELÓGIO ESTÁ A PARAR","ru":"СЕКРЕТ · ЧАСЫ ОСТАНАВЛИВАЮТСЯ","zh":"秘密 · 大钟正在停下"},"title":{"en":"THE QUEEN WANTS TO SAVE HER DAUGHTER","es":"LA REINA QUIERE SALVAR A SU HIJA","de":"DIE KÖNIGIN WILL IHRE TOCHTER RETTEN","ar":"الحارس هو خوف الملكة","fr":"LE GARDIEN EST LA PEUR DE LA REINE","it":"IL GUARDIANO È LA PAURA DELLA REGINA","ja":"番人は女王の恐れ","pt":"O GUARDIÃO É O MEDO DA RAINHA","ru":"СТРАЖ — ЭТО СТРАХ КОРОЛЕВЫ","zh":"守卫者是王后的恐惧"},"story":{"en":"Rose is the Queen’s daughter. The Queen is afraid that something bad will happen to her. She asks the Mouse to build a machine that stops time. It is called the Crown. But the magic goes wrong: Rose becomes trapped behind a magic wall. The Queen’s fear creates the Time Warden. Alice holds up her two magic objects. They help her keep moving. Answer four more questions to stop the Warden and free Rose.","es":"Rose es la hija de la Reina. La Reina teme que le pase algo malo. Le pide a la Ratona que construya una máquina que detenga el tiempo. Se llama la Corona. Pero la magia sale mal: Rose queda atrapada detrás de una pared mágica. El miedo de la Reina crea al Guardián del Tiempo. Alice levanta sus dos objetos mágicos: la ayudan a seguir moviéndose. Responde cuatro preguntas más para detener al Guardián y liberar a Rose.","de":"Rose ist die Tochter der Königin. Die Königin hat Angst, dass ihr etwas zustößt. Sie bittet die Maus, eine Maschine zu bauen, die die Zeit anhält. Sie heißt die Krone. Aber die Magie geht schief: Rose ist hinter einer magischen Wand gefangen. Die Angst der Königin erschafft den Zeitwächter. Alice hebt ihre zwei Zaubergegenstände hoch: Sie halten sie in Bewegung. Beantworte vier weitere Fragen, um den Wächter zu stoppen und Rose zu befreien.","ar":"روز ابنة الملكة، وهي محبوسة ثانية واحدة خلف الساعة. كانت الملكة خائفة، فطلبت من الفأرة الساعاتية أن توقف الغد. وصار خوف الملكة هو الحارس، وأخذ الحارس «الآن» من الجميع. أليس تمسك شيئيها السحريين، وهما يبقيان أصدقاءها يتحركون، لكن أربع تعويذات أخرى فقط تستطيع إيقاف الحارس.","fr":"Rose est la fille de la Reine, et elle est prisonnière une seconde derrière l'horloge. La Reine avait peur, alors elle a demandé à la Souris Horlogère d'arrêter demain. La peur de la Reine est devenue le Gardien, et le Gardien a pris le « maintenant » à tout le monde. Alice tient ses deux objets magiques. Ils gardent ses amis en mouvement, mais seuls quatre sorts de plus peuvent arrêter le Gardien.","it":"Rose è la figlia della Regina ed è intrappolata un secondo dietro l'orologio. La Regina aveva paura, così ha chiesto alla Topina Orologiaia di fermare il domani. La paura della Regina è diventata il Guardiano, e il Guardiano ha tolto l'«adesso» a tutti. Alice sta tenendo i suoi due oggetti magici. Tengono in movimento i suoi amici, ma solo altri quattro incantesimi possono fermare il Guardiano.","ja":"ローズは女王の娘で、時計より1秒うしろに閉じこめられている。女王はこわくなり、時計ネズミに明日を止めてほしいと頼んだ。女王の恐れが番人になり、番人はみんなから「いま」を奪った。アリスは2つの魔法のアイテムを持っている。それが友だちを動かし続けているが、番人を止められるのはあと4つの呪文だけだ。","pt":"A Rose é filha da Rainha e está presa um segundo atrás do relógio. A Rainha tinha medo, por isso pediu à Rata Relojoeira para parar o amanhã. O medo da Rainha tornou-se o Guardião, e o Guardião tirou o «agora» a toda a gente. A Alice está a segurar os seus dois objetos mágicos. Eles mantêm os amigos em movimento, mas só mais quatro feitiços podem parar o Guardião.","ru":"Роза — дочь Королевы, и она заперта на секунду позади часов. Королева боялась и попросила Мышь-часовщицу остановить завтра. Страх Королевы стал Стражем, и Страж забрал «сейчас» у всех. Алиса держит два волшебных предмета. Они не дают её друзьям застыть, но остановить Стража могут только ещё четыре заклинания.","zh":"萝丝是女王的女儿，她被困在大钟后面的一秒里。女王很害怕，就请钟表鼠停住明天。女王的恐惧变成了守卫，守卫从每个人手里夺走了“现在”。爱丽丝正握着她的两件魔法物品，它们让朋友们还能动，但只有再来四个咒语才能阻止守卫。"},"button":{"en":"HELP ALICE STOP THE WARDEN","es":"AYUDA A ALICE A DETENER AL GUARDIÁN","de":"HILF ALICE, DEN WÄCHTER ZU STOPPEN","ar":"قاتل من أجل الثانية التالية","fr":"SE BATTRE POUR LA PROCHAINE SECONDE","it":"COMBATTI PER IL PROSSIMO SECONDO","ja":"次の一秒のために戦う","pt":"LUTAR PELO PRÓXIMO SEGUNDO","ru":"СРАЖАТЬСЯ ЗА СЛЕДУЮЩУЮ СЕКУНДУ","zh":"为下一秒而战"},"next":"26_freeze_attack","hot":[60,30,12,24],"pos":"left","v":"center"},"26_freeze_attack":{"kind":"question","img":"26_freeze_attack.webp","k":{"en":"PART 4 · STOP THE WARDEN","es":"PARTE 4 · DETÉN AL GUARDIÁN","de":"TEIL 4 · STOPPE DEN WÄCHTER","ar":"الفصل الرابع · آخر ثانية متحركة","fr":"ACTE IV · LA DERNIÈRE SECONDE EN MOUVEMENT","it":"ATTO IV · L'ULTIMO SECONDO IN MOVIMENTO","ja":"第4幕 · 最後に動く一秒","pt":"ATO IV · O ÚLTIMO SEGUNDO EM MOVIMENTO","ru":"АКТ IV · ПОСЛЕДНЯЯ ДВИЖУЩАЯСЯ СЕКУНДА","zh":"第四幕 · 最后一秒的转动"},"title":{"en":"STOP THE WARDEN!","es":"¡DETÉN AL GUARDIÁN!","de":"STOPPE DEN WÄCHTER!","ar":"تبدأ المعركة ال :"粉 · 现在"},"b":{"en":"BLUE · EVERY DAY","es":"AZUL · CADA DÍA","de":"BLAU · JEDEN TAG","ar":"أزرق · عادةً","fr":"BLEU · HABITUDE","it":"BLU · ABITUDINE","ja":"青 · いつも","pt":"AZUL · HÁBITO","ru":"СИНИЙ · ОБЫЧНО","zh":"蓝 · 平时"}}};
const LANGS = G.langs, RTL = ['ar'];
let state = fresh('off');
let sound=false;try{sound=localStorage.getItem('rpg-sound')==='1'}catch(_){}
/* two short tones, right and wrong — the Wonderland export's, kept */
function beep(ok){if(!sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.type=ok?'square':'sawtooth';o.frequency.value=ok?620:180;g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.stop(c.currentTime+.18);o.onended=()=>c.close()}catch(_){}}
function setSound(on){sound=!!on;try{localStorage.setItem('rpg-sound',sound?'1':'0')}catch(_){}const b=document.getElementById('sound');b.setAttribute('aria-pressed',String(sound));b.firstChild.textContent=(sound?'🔊':'🔈')+' ';document.getElementById('soundLabel').textContent=ui(sound?'soundOn':'soundOff')}
function fresh(lang){return {scene:G.start,score:0,chances:G.chances,tiles:0,lang,open:false,route:[],results:{},attempts:{},mistakes:[],answered:0,finalCorrect:null,endingPick:null,endingMaster:false}}
const frame=document.getElementById('frame'), content=document.getElementById('content'), sceneImage=document.getElementById('sceneImage');
const hot=document.getElementById('hot'), hotLabel=document.getElementById('hotLabel'), zone=document.getElementById('zone');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MARK=/\[\[(\/?)([ab])\]\]/g;
const bare=s=>String(s??'').replace(MARK,'');          /* plain text: alt, review, answer read-back */
const esct=s=>esc(s).replace(MARK,(_,c,k)=>c?'</span>':'<span class="tone-'+k+'">');
const tx=(o,l)=>o?(l&&o[l]?o[l]:o.en):'';
function ui(key,vars){let s=tx(G.labels[key],state.lang==='off'?null:state.lang);if(vars)for(const k in vars)s=s.replace('{'+k+'}',vars[k]);return s}
/* a gloss identical to the English (a formula, a name) is not shown — it would only repeat the line */
const gloss=obj=>state.lang!=='off'&&obj[state.lang]&&obj[state.lang]!==obj.en?obj[state.lang]:'';
function line(obj,cls=''){if(!obj)return '';const en=esct(obj.en),g=gloss(obj);return g?`<span class="${cls}">${en}<span class="translation">${esct(g)}</span></span>`:`<span class="${cls}">${en}</span>`}
function label(obj){if(!obj)return '';const g=gloss(obj);return g?`${esct(obj.en)}<span class="translation">${esct(g)}</span>`:esct(obj.en)}
/* an option is {en,…} or, for a two-blank item, {parts:[a,b], kinds:['a'|'b',…], tags:[{en,…},{en,…}]} — two coloured halves */
function optText(o){return bare(o.parts?o.parts.join(' / '):o.en)}
function optMarkup(o){if(!o.parts)return `<span>${label(o)}</span>`;return o.parts.map((p,i)=>`<span class="half ${o.kinds[i]}"><small>${label(G.tags[o.kinds[i]])}</small><b>${esc(p)}</b></span>`).join('')}
function updateHUD(){document.getElementById('score').textContent=state.score;document.getElementById('tiles').textContent='◆'.repeat(state.tiles)+'◇'.repeat(Math.max(0,G.tiles-state.tiles));document.getElementById('chances').textContent='♥'.repeat(state.chances)+'♡'.repeat(Math.max(0,G.chances-state.chances));document.getElementById('lblPoints').textContent=ui('points');document.getElementById('lblTiles').textContent=ui('tiles');document.getElementById('lblChances').textContent=ui('chances');document.getElementById('chancesBadge').hidden=!G.chances;document.getElementById('progressBadge').hidden=!G.total;if(G.total){document.getElementById('lblProgress').textContent=ui('progress');document.getElementById('progress').textContent=`${state.answered}/${G.total}`}document.getElementById('help').textContent=ui('help')}
function head(s){const t=s.kind==='intro'?`<span class="big">${label(s.title)}</span>`:label(s.title);return `${line(s.k,'kicker')}<h1 class="title ${s.kind==='intro'?'cover-title':''}">${t}</h1>${line(s.story,'story')}`}
/* HOT = [cx, cy, w, h] as % of the PICTURE (3:2). The picture is object-fit:cover in the frame, so convert picture space to frame pixels; a phone shows a narrow central slice and the object stays on it. */
function placeHot(h){const W=frame.clientWidth,H=frame.clientHeight,sc=Math.max(W/G.imgW,H/G.imgH),dw=G.imgW*sc,dh=G.imgH*sc;
  /* cover crops the picture; slide it so the object stays on screen (a portrait phone shows a third of the width) */
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const ox=dw>W?clamp(W/2-h[0]/100*dw,W-dw,0):(W-dw)/2,oy=dh>H?clamp(H/2-h[1]/100*dh,H-dh,0):(H-dh)/2;
  sceneImage.style.objectPosition=`${dw>W?ox/(W-dw)*100:50}% ${dh>H?oy/(H-dh)*100:50}%`;
  const cx=ox+h[0]/100*dw,cy=oy+h[1]/100*dh,w=h[2]/100*dw,hh=h[3]/100*dh;hot.style.left=cx+'px';hot.style.top=cy+'px';hot.style.width=w+'px';hot.style.height=hh+'px';hot.classList.toggle('above',cy+hh/2>H*.84);hotLabel.textContent=ui('read');
  document.getElementById('fsLabel').textContent=ui('fullscreen');document.getElementById('soundLabel').textContent=ui(sound?'soundOn':'soundOff');document.getElementById('langWord').textContent=ui('translate');document.getElementById('langCur').textContent=state.lang==='off'?'OFF':G.names[state.lang];
  document.querySelectorAll('.lang-item').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function setOpen(on){state.open=!!on;if(on){const hr=hot.getBoundingClientRect(),zr=zone.getBoundingClientRect();const cl=zr.left+content.offsetLeft,ct=zr.top+content.offsetTop;content.style.transformOrigin=`${hr.left+hr.width/2-cl}px ${hr.top+hr.height/2-ct}px`}frame.classList.toggle('open',state.open)}
function openPanel(){if(!state.open)setOpen(true)}
function closePanel(){if(state.open)setOpen(false)}
function render(){const s=G.scenes[state.scene];frame.className=`frame ${s.pos||'left'} v-${s.v||'center'}${RTL.includes(state.lang)?' rtl':''}`;sceneImage.src=G.dir+s.img;sceneImage.alt=bare(s.title.en);placeHot(s.hot);const tr=state.lang!=='off';frame.classList.toggle('tr-on',tr);content.style.width=((s.width||(s.pos==='center'?64:46))+(tr?8:0))+'%';content.style.marginLeft=s.pos==='left'&&s.inset?s.inset+'%':'';content.style.marginRight=s.pos==='right'&&s.inset?s.inset+'%':'';
  let html=`<button class="hide-btn" onclick="closePanel()" title="Esc">✕ ${ui('hide')}</button>`+head(s);
  if(s.kind==='intro'){html+=`${s.rules?`<div class="rules-chips">${s.rules.map(r=>`<span>${label(r)}</span>`).join('')}</div>`:''}<button class="start" onclick="go('${s.next}')">${label(s.start)}</button>${s.small?`<div class="small">${label(s.small)}</div>`:''}`}
  else if(s.kind==='rules'){html+=`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('begin')}</button>`}
  else if(s.kind==='story'){html+=`${s.rules?`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>`:''}${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('continue')}</button>`}
  else if(s.kind==='question'){html+=`${s.clue?`<div class="clue"><b>${ui('visual')}</b><br>${label(s.clue)}</div>`:''}<div class="prompt">${label(s.prompt)}</div><div class="options">${s.opts.map((o,i)=>`<button class="option${o.parts?' split':''}" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span>${optMarkup(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="continue" class="continue" hidden onclick="advance()">${ui('continue')}</button>`}
  else if(s.kind==='choice'){html+=`<div class="route-options">${s.routes.map((r,i)=>`<button class="route" onclick="chooseRoute(${i})"><b>${i+1} · ${label(r.name)}</b>${label(r.desc)}</button>`).join('')}</div>`}
  else if(s.kind==='ending'){const rev=G.repair?(state.mistakes.length?`<div class="review">${state.mistakes.map(id=>{const m=G.scenes[id];return `<div>${esct(m.prompt.en)}<br><b>${esc(optText(m.opts[m.answer]))}</b> — ${label(m.fb)}</div>`}).join('')}</div>`:`<div class="small">${ui('perfect')}</div>`):'';const ft=G.repair?` · ${state.score/(G.points||1)}/${G.total} ${ui('firstTry')}`:'';html+=`<div class="final-score">${ui('finalScore')} ${state.score}/${G.max}${ft} · ${'◆'.repeat(state.tiles)}${'◇'.repeat(Math.max(0,G.tiles-state.tiles))}</div>${rev}${state.route.length?`<div class="small">${ui('route')}: ${esc(state.route.join(' · ').toUpperCase())}</div>`:''}<button class="restart" onclick="restart()">${ui('restart')}</button>`}
  content.innerHTML=html;content.scrollTop=0;updateHUD();setOpen(s.kind==='intro'||s.kind==='ending');
  if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene))setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}

sceneImage.addEventListener('click',()=>{closeMenu();closePanel()});
window.addEventListener('resize',()=>placeHot(G.scenes[state.scene].hot));
const langMenu=document.getElementById('langMenu'), langBtn=document.getElementById('langBtn');
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
function toggleMenu(){langMenu.hidden=!langMenu.hidden;langBtn.setAttribute('aria-expanded',String(!langMenu.hidden))}
function go(id){state.scene=id;render()}
function displayAnswer(i,apply){const s=G.scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];const ok=i===s.answer;const p=s.points||G.points;const fb=document.getElementById('feedback');const expl=s.fb?`<br>${label(s.fb)}`:'';
  if(apply)beep(ok);
  if(G.repair&&!ok){/* repair mode: mark it, explain, let them try again */buttons[i].classList.add('wrong');buttons[i].disabled=true;fb.innerHTML=`<strong>${ui('tryAgain')}</strong>${expl}`;fb.className='feedback show bad';if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}));return}
  buttons.forEach(b=>b.disabled=true);buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');
  const retried=G.repair&&(state.attempts[state.scene]||0)>0;
  if(apply){if(ok&&!retried){state.score+=p}if(ok&&s.relic)state.tiles=Math.min(G.tiles,state.tiles+1);if(!ok)state.chances=Math.max(0,state.chances-1);if(s.final)state.finalCorrect=ok;if(G.repair)state.answered++}
  const head=ok?(retried?ui('repaired'):ui(s.relic?'relic':'correct',{p})):ui('wrong');const was=ok?'':`<br>${ui('answerWas')} ${esc(optText(s.opts[s.answer]))}`;
  fb.innerHTML=`<strong>${head}</strong>${was}${expl}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD();if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}))}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;const s=G.scenes[state.scene];if(G.repair&&i!==s.answer){if(!(state.attempts[state.scene]||0))state.mistakes.push(state.scene);state.attempts[state.scene]=(state.attempts[state.scene]||0)+1;displayAnswer(i,true);return}state.results[state.scene]=i;displayAnswer(i,true)}
function resolve(){const full=state.tiles>=G.tiles&&state.chances>0;const flawless=state.finalCorrect&&full&&state.score>=G.max;if(flawless&&(!state.endingPick||state.endingMaster))return G.endings.master;if(state.endingPick&&state.chances>0&&G.endings[state.endingPick])return G.endings[state.endingPick];if(state.finalCorrect&&full&&state.score>=G.completeScore)return G.endings.complete;if(state.finalCorrect&&state.tiles<G.tiles)return G.endings.missing;return G.endings.failed}
function advance(){const s=G.scenes[state.scene];if(state.chances<=0&&state.results[state.scene]!==s.answer){go(G.endings.failed);return}if(s.next==='resolve'){go(resolve());return}go(s.next)}
function chooseRoute(i){const r=G.scenes[state.scene].routes[i];if(r.route)state.route.push(r.route);if(r.ending){state.endingPick=r.ending;state.endingMaster=!!r.master}go(r.min!=null&&state.score<r.min?r.else:r.target)}
function restart(){state=fresh(state.lang);render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?`<b>OFF</b><span>${esc(G.labels.off.en)}</span>`:`<b>${l.toUpperCase()}</b><span>${esc(G.names[l])}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('sound').addEventListener('click',()=>{setSound(!sound);beep(true)});
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{const k=e.key;if(k.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(k==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(k.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(k.toLowerCase()==='s'){document.getElementById('sound').click();return}if(!state.open&&(k==='Enter'||['1','2','3'].includes(k))){openPanel();return}const s=G.scenes[state.scene];if(['1','2','3'].includes(k)){const i=Number(k)-1;if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click();return}if(k==='Enter')document.querySelector('.continue:not([hidden]),.start,.restart')?.click()});
setSound(sound);render();
</script>
</body>
</html>
