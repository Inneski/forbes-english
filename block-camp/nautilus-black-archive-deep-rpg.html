--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;

--accent:#46B0AB;--accent-ink:#0b1a12;--deep:#06181f;--panel:rgba(6,20,27,.88);--scrim:rgba(6,20,27,.88);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55);
/* The scale unit. Every size below was authored as a fraction of a 16:9
   frame's width, so on a wider window the type outgrew the panel and the
   options fell below the fold. 1vw and 1.7778vh are equal at 16:9, so this
   changes nothing there and only ever caps, never enlarges. The frame is
   the viewport (.game is fixed inset:0), which is why vw/vh and not cqw. */
--u:min(1vw,1.7778vh)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* opt-in, per lesson: show the whole plate, letterboxed in the deep colour */
.fit-contain .scene-img{object-fit:contain}

/* The three utilities sit as bare icons and give their words back on hover or
   keyboard focus. Three labelled buttons across the top of a painted frame is
   a lot of furniture over somebody's artwork, and the keys (L, S, F) and the
   corner help line already say what they do. The label is collapsed by width
   rather than removed, so it stays in the accessibility tree and a screen
   reader still reads "SOUND OFF". */

@media(hover:none){.u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}}.lang-btn b{color:var(--accent)}
.utility:hover,.lang-btn:hover{border-color:var(--bone)}

.content{pointer-events:auto;display:flex;flex-direction:column;gap:calc(.8 * var(--u));width:46%;max-height:100%;overflow:auto;scrollbar-width:thin;padding:calc(1.2 * var(--u)) calc(1.4 * var(--u));background:var(--panel);border:1px solid rgba(255,246,217,.22);box-shadow:0 calc(1.4 * var(--u)) calc(4 * var(--u)) var(--shadow);backdrop-filter:blur(6px);transition:transform .38s cubic-bezier(.2,.9,.3,1.15),opacity .22s ease;transform-origin:50% 50%}

/* A cover is a strip at the foot of the frame, with the panel fading up out of
   the picture instead of sitting on it as a box. The plate is the title
   screen; this is the caption under it.

   The foot is forced; the SIDE is not. Forcing both buried the cover marker on
   four of seven adventures — 43% on Frankenstein Part I, 37% on Sherlock —
   because a centred strip is ~64% of the zone and most cover objects sit near
   the middle. `pos` already carries each lesson's answer to that (Part I is
   `left`, Part II is `right`, both chosen against a measurement), so the
   strip honours it and centres only where the scene asks to be centred. */
.is-cover .zone{align-items:flex-end!important;bottom:16%}
.is-cover .content{width:auto!important;max-width:64%;margin:0!important;text-align:center;align-items:center;
  /* The scrim reaches full strength well above the first line of text. It used
     to start fading in at 42%, which put the kicker — accent colour, smallest
     type — on bare artwork: unreadable over snow on Part I and ice on Part II.
     The bottom padding clears the corner help bar, which the spec line used to
     sit on top of by 5-14px depending on how long that line is. */

  padding:calc(3.4 * var(--u)) calc(2.4 * var(--u)) calc(1.2 * var(--u));gap:calc(.5 * var(--u))}

.v-top .zone{align-items:flex-start}.v-center .zone{align-items:center}.v-bottom .zone{align-items:flex-end}
/* ── `band`: a wide, shallow strip across the foot of the frame ──
   A side panel assumes the picture has an empty side. Wonderland's plates are
   crowd scenes — Alice stands in the middle and the supporting cast fills both
   edges — so 46% of the width buried a named character on eighteen of thirty-
   five screens, and on the pink/blue contrast plates it covered half of the
   very thing the question compares. A band reads across instead of down: the
   prose in one column, the options in the other, so it is roughly a third of
   the height a stacked panel needs and the upper two thirds of the picture
   stay visible. Innes asked for it on the first fork on 2026-09-16 ("bottom
   central and more streamlined or in two parts") and it answers the occlusion
   everywhere else too.

   It comes after the .v-* rules on purpose: same specificity, so the foot wins
   whatever `v` the scene carries. A band scene's hotspot must sit above ~60%
   of the picture — check-rpg-panels.js measures that. */
.band .zone{justify-content:center;align-items:flex-end}
.band .content{text-align:left;display:grid;grid-template-columns:1.12fr 1fr;align-items:end;
  column-gap:calc(2 * var(--u));row-gap:calc(.3 * var(--u));margin-bottom:calc(1.6 * var(--u));
  padding:calc(1 * var(--u)) calc(1.3 * var(--u))}

.band-text,.band-act{display:flex;flex-direction:column;gap:calc(.6 * var(--u));min-width:0}
.band .continue,.band .start,.band .restart{align-self:flex-start}
/* The even split above is for a question, where the prompt and three options
   weigh about what the story does. The other kinds are lopsided.

   A story screen is prose and one button, so the button column shrinks to the
   button and the prose takes the whole strip: the same paragraph in a 64% column
   runs seven lines and in an 88% one runs five, and a band is only worth having
   while it stays shallow. The cap stops a long button label ("HELP ALICE STOP
   THE WARDEN") from taking a third of the strip back. */
.band.k-story:not(.has-rules) .content{grid-template-columns:1fr auto}.band.k-story:not(.has-rules) .band-act{max-width:calc(17 * var(--u))}
/* has-rules comes last: a story screen that carries a grammar table (the cake
   briefing) is a rules screen in everything but name, and the prose ratio
   squeezed the table into a column too narrow to read. */
.band.k-rules .content{grid-template-columns:1fr 2.4fr}
.band.has-rules:not(.k-rules) .content{grid-template-columns:1fr 1.6fr}
.band.k-choice .content{grid-template-columns:1.3fr 1fr}

<script>
/* Block Camp save file.
   One localStorage record shared by every camp page: the RPGs write a result
   at each ending, the tense decks write how far the learner paged, and the
   overworld (block-camp/quest.html) reads all of it back as a game.

   The engine (lesson-template/build/rpg/rpg.py) inlines this file into every
   RPG it builds, so a page stays one self-contained file; the hand-built
   adventures and the decks load it with <script src>. Either way the API is
   window.CampSave and every call is guarded — a browser with storage blocked
   just plays the lesson as before.

   Page ids are the file name without .html, so an RPG is 'lost-yellow-road-rpg'
   and a deck is 'blockcamp-past-simple'. The overworld maps those ids onto
   camps with the same tables the hub builder uses.

   Format (v1):
     { v:1, name:'', created, updated, last:{id,href,title,kind,at},
       rpg:  { id: { plays, last, parts: { chapter: {best,max,tiles,tilesMax,cleared,master,endings:{id:n}} } } },
       deck: { id: { plays, seen, total, done, last } } }
   'parts' is keyed by chapter index for a page that holds several games
   (the Kraken saga); every other RPG has one part, keyed '0'. */
(function () {
  var KEY = 'forbes-camp-save', V = 1, MAGIC = 'BLOCKCAMP1:';

  function pageId() {
    var p = (location.pathname || '').split('/').pop() || '';
    try { p = decodeURIComponent(p); } catch (_) {}
    return p.replace(/\.html?$/i, '') || 'index';
  }
  function blank() { return { v: V, name: '', created: Date.now(), updated: Date.now(), last: null, rpg: {}, deck: {} }; }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === V && s.rpg && s.deck) return s; } catch (_) {}
    return blank();
  }
  function store(s) {
    s.updated = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (_) {}
    try { window.dispatchEvent(new CustomEvent('campsave', { detail: s })); } catch (_) {}
    return s;
  }
  function touch(s, kind) {
    s.last = { id: pageId(), href: location.pathname.split('/').pop() || location.href, dir: /\/block-camp\//.test(location.pathname) ? 'block-camp' : '',
               title: (document.title || '').replace(/\s*\|.*$/, ''), kind: kind, at: Date.now() };
  }

  var CampSave = {
    KEY: KEY, id: pageId, load: load,

    /* every camp page calls this once on load: it is what "Continue" points at */
    visit: function (kind) { var s = load(); touch(s, kind || 'page'); return store(s); },

    /* an RPG calls this from its ending scene */
    rpgEnd: function (r) {
      var s = load(), id = pageId(), e = s.rpg[id] || (s.rpg[id] = { plays: 0, parts: {} });
      var k = String(r.chapter == null ? 0 : r.chapter), p = e.parts[k] || (e.parts[k] = { best: 0, max: 0, tiles: 0, tilesMax: 0, cleared: false, master: false, endings: {} });
      e.plays += 1; e.last = Date.now();
      p.max = Math.max(p.max, r.max || 0); p.tilesMax = Math.max(p.tilesMax, r.tilesMax || 0);
      if ((r.score || 0) >= p.best) { p.best = r.score || 0; p.tiles = Math.max(p.tiles, r.tiles || 0); }
      p.tiles = Math.max(p.tiles, r.tiles || 0);
      if (r.cleared) p.cleared = true;
      if (r.master) p.master = true;
      if (r.ending) p.endings[r.ending] = (p.endings[r.ending] || 0) + 1;
      touch(s, 'rpg');
      return store(s);
    },

    /* a deck calls this from show(): how far the learner has paged */
    deck: function (idx, total) {
      var s = load(), id = pageId(), e = s.deck[id] || (s.deck[id] = { plays: 0, seen: 0, total: 0 });
      if (idx === 0 && e.seen === 0) e.plays += 1;
      e.seen = Math.max(e.seen, (idx | 0) + 1); e.total = total | 0; e.done = e.total > 0 && e.seen >= e.total; e.last = Date.now();
      touch(s, 'deck');
      return store(s);
    },

    setName: function (name) { var s = load(); s.name = String(name || '').slice(0, 24); return store(s); },
    reset: function () { try { localStorage.removeItem(KEY); } catch (_) {} return store(blank()); },

    /* a save moves between browsers as one line of text */
    exportText: function () { try { return MAGIC + btoa(unescape(encodeURIComponent(JSON.stringify(load())))); } catch (_) { return ''; } },
    importText: function (t) {
      t = String(t || '').trim(); if (t.indexOf(MAGIC) !== 0) return null;
      try { var s = JSON.parse(decodeURIComponent(escape(atob(t.slice(MAGIC.length))))); if (s && s.v === V && s.rpg && s.deck) return store(s); } catch (_) {}
      return null;
    },

    /* scores every RPG on a common scale, whatever its own point ladder:
       0–100 for the best run, 25 a tile, 50 for clearing it, 50 more for the
       master ending. A deck is 50 read to the end, pro rata before that. */
    rpgXp: function (e) {
      var xp = 0; if (!e) return 0;
      Object.keys(e.parts).forEach(function (k) { var p = e.parts[k];
        xp += p.max ? Math.round(100 * p.best / p.max) : 0; xp += 25 * (p.tiles || 0); if (p.cleared) xp += 50; if (p.master) xp += 50; });
      return xp;
    },
    deckXp: function (e) { if (!e || !e.total) return 0; return e.done ? 50 : Math.round(50 * e.seen / e.total); },
    xp: function (s) {
      s = s || load(); var t = 0, self = this;
      Object.keys(s.rpg).forEach(function (k) { t += self.rpgXp(s.rpg[k]); });
      Object.keys(s.deck).forEach(function (k) { t += self.deckXp(s.deck[k]); });
      return t;
    }
  };
  window.CampSave = CampSave;
})();

м. Нечто огромное просыпается во тьме. Поднимись на «Наутилус» капитана Немо, возглавь экспедицию и верни Чёрный Архив целым.","zh":"一个不可能的信号。一座海床之下的城市。黑暗中有庞然大物正在苏醒。登上尼摩船长的鹦鹉螺号，指挥这次远征，把黑色档案完整带回。"},"title":{"en":"THE BLACK ARCHIVE","ar":"الأرشيف الأسود","de":"DAS SCHWARZE ARCHIV","es":"EL ARCHIVO NEGRO","fr":"L’ARCHIVE NOIRE","it":"L’ARCHIVIO NERO","ja":"黒の書庫","pt":"O ARQUIVO NEGRO","ru":"ЧЁРНЫЙ АРХИВ","zh":"黑色档案"},"kind":"intro","rules":[{"en":"40 STORY SCREENS · 15 GRAMMAR CHALLENGES · MULTIPLE ROUTES","ar":"٤٠ مشهدًا · ١٥ تحدّيًا نحويًّا · مسارات متعدّدة","de":"40 SZENEN · 15 GRAMMATIKAUFGABEN · MEHRERE ROUTEN","es":"40 PANTALLAS · 15 RETOS DE GRAMÁTICA · VARIAS RUTAS","fr":"40 SCÈNES · 15 DÉFIS DE GRAMMAIRE · PLUSIEURS ROUTES","it":"40 SCENE · 15 SFIDE DI GRAMMATICA · PIÙ PERCORSI","ja":"40の場面 · 15の文法問題 · 複数のルート","pt":"40 CENAS · 15 DESAFIOS DE GRAMÁTICA · VÁRIAS ROTAS","ru":"40 СЦЕН · 15 ГРАММАТИЧЕСКИХ ЗАДАНИЙ · НЕСКОЛЬКО МАРШРУТОВ","zh":"40 个场景 · 15 道语法挑战 · 多条路线"}],"start":{"en":"BOARD THE NAUTILUS","ar":"اصعد إلى نوتيلوس","de":"AN BORD DER NAUTILUS","es":"SUBE AL NAUTILUS","fr":"MONTER À BORD DU NAUTILUS","it":"SALI SUL NAUTILUS","ja":"ノーチラス号に乗り込む","pt":"EMBARCAR NO NAUTILUS","ru":"НА БОРТ «НАУТИЛУСА»","zh":"登上鹦鹉螺号"},"small":{"en":"Present perfect simple and continuous, B1","ar":"Present perfect simple و continuous، B1","de":"Present perfect simple und continuous, B1","es":"Present perfect simple y continuous, B1","fr":"Present perfect simple et continuous, B1","it":"Present perfect simple e continuous, B1","ja":"Present perfect simple と continuous、B1","pt":"Present perfect simple e continuous, B1","ru":"Present perfect simple и continuous, B1","zh":"Present perfect simple 与 continuous，B1"},"next":"brief","hot":[63,18,36,22],"pos":"left","v":"center"},"brief":{"img":"02_brief.webp","k":{"en":"MISSION BRIEFING","ar":"إحاطة المهمّة","de":"EINSATZBESPRECHUNG","es":"INSTRUCCIONES DE MISIÓN","fr":"BRIEFING DE MISSION","it":"BRIEFING DI MISSIONE","ja":"任務説明","pt":"BRIEFING DA MISSÃO","ru":"ИНСТРУКТАЖ","zh":"任务简报"},"story":{"en":"Send the right commands to keep the Nautilus alive. Choose the best tense for the meaning: a completed result, or an activity continuing up to now. Every expedition has 15 challenges and three chances; your choices shape the route.","ar":"أرسِل الأوامر الصحيحة لتبقى نوتيلوس سالمة. اختر الزمن المناسب للمعنى: نتيجة مكتملة أو نشاط مستمرّ حتّى الآن. كلّ بعثة فيها 15 تحديًا وثلاث فرص؛ واختياراتك هي التي ترسم المسار.","de":"Gib die richtigen Befehle, damit die Nautilus überlebt. Wähle die Zeitform, die zur Bedeutung passt: ein abgeschlossenes Ergebnis oder eine Tätigkeit, die bis jetzt andauert. Jede Expedition hat 15 Aufgaben und drei Versuche; deine Entscheidungen bestimmen die Route.","es":"Envía las órdenes correctas para mantener vivo al Nautilus. Elige el tiempo verbal que corresponde al significado: un resultado terminado o una actividad que continúa hasta ahora. Cada expedición tiene 15 retos y tres oportunidades; tus decisiones definen la ruta.","fr":"Donne les bons ordres pour garder le Nautilus en vie. Choisis le temps qui correspond au sens : un résultat achevé ou une activité qui continue jusqu’à maintenant. Chaque expédition compte 15 défis et trois chances ; tes choix décident de la route.","it":"Manda i comandi giusti per tenere in vita il Nautilus. Scegli il tempo verbale adatto al significato: un risultato concluso o un’attività che continua fino a ora. Ogni spedizione ha 15 sfide e tre possibilità; le tue scelte decidono la rotta.","ja":"正しい指示を出してノーチラス号を守れ。意味に合う時制を選ぶこと——完了した結果か、今まで続いている活動か。探検には課題が 15、チャンスが 3 回。選択がルートを決める。","pt":"Envia as ordens certas para manter o Nautilus vivo. Escolhe o tempo verbal que corresponde ao significado: um resultado terminado ou uma atividade que continua até agora. Cada expedição tem 15 desafios e três oportunidades; as tuas escolhas definem a rota.","ru":"Отдавай верные команды, чтобы «Наутилус» уцелел. Выбирай время по смыслу: завершённый результат или действие, которое длится до сих пор. В каждой экспедиции 15 заданий и три попытки; твой выбор определяет маршрут.","zh":"发出正确的指令，让鹦鹉螺号平安无事。根据意思选对时态：已经完成的结果，还是持续到现在的活动。每次远征有 15 道挑战和三次机会；你的选择决定路线。"},"title":{"en":"SIMPLE OR CONTINUOUS?","ar":"SIMPLE أم CONTINUOUS؟","de":"SIMPLE ODER CONTINUOUS?","es":"¿SIMPLE O CONTINUOUS?","fr":"SIMPLE OU CONTINUOUS ?","it":"SIMPLE O CONTINUOUS?","ja":"SIMPLE か CONTINUOUS か？","pt":"SIMPLE OU CONTINUOUS?","ru":"SIMPLE ИЛИ CONTINUOUS?","zh":"SIMPLE 还是 CONTINUOUS？"},"kind":"rules","rules":[{"name":{"en":"PRESENT PERFECT SIMPLE","ar":"PRESENT PERFECT SIMPLE","de":"PRESENT PERFECT SIMPLE","es":"PRESENT PERFECT SIMPLE","fr":"PRESENT PERFECT SIMPLE","it":"PRESENT PERFECT SIMPLE","ja":"PRESENT PERFECT SIMPLE","pt":"PRESENT PERFECT SIMPLE","ru":"PRESENT PERFECT SIMPLE","zh":"PRESENT PERFECT SIMPLE"},"form":{"en":"result · number · completed achievement\nhave/has + past participle","ar":"نتيجة · عدد · إنجاز مكتمل\nhave/has + past participle","de":"Ergebnis · Anzahl · abgeschlossene Leistung\nhave/has + past participle","es":"resultado · número · logro terminado\nhave/has + past participle","fr":"résultat · nombre · exploit achevé\nhave/has + past participle","it":"risultato · numero · impresa conclusa\nhave/has + past participle","ja":"結果 · 数 · 完了した達成\nhave/has + past participle","pt":"resultado · número · feito concluído\nhave/has + past participle","ru":"результат · количество · завершённое достижение\nhave/has + past participle","zh":"结果 · 数量 · 已完成的成就\nhave/has + past participle"}},{"name":{"en":"PRESENT PERFECT CONTINUOUS","ar":"PRESENT PERFECT CONTINUOUS","de":"PRESENT PERFECT CONTINUOUS","es":"PRESENT PERFECT CONTINUOUS","fr":"PRESENT PERFECT CONTINUOUS","it":"PRESENT PERFECT CONTINUOUS","ja":"PRESENT PERFECT CONTINUOUS","pt":"PRESENT PERFECT CONTINUOUS","ru":"PRESENT PERFECT CONTINUOUS","zh":"PRESENT PERFECT CONTINUOUS"},"form":{"en":"duration · ongoing or recent activity\nhave/has been + -ing","ar":"مدّة · نشاط جارٍ أو حديث\nhave/has been + -ing","de":"Dauer · laufende oder kürzliche Tätigkeit\nhave/has been + -ing","es":"duración · actividad en curso o reciente\nhave/has been + -ing","fr":"durée · activité en cours ou récente\nhave/has been + -ing","it":"durata · attività in corso o recente\nhave/has been + -ing","ja":"継続期間 · 進行中または最近の動作\nhave/has been + -ing","pt":"duração · atividade em curso ou recente\nhave/has been + -ing","ru":"длительность · действие в процессе или недавнее\nhave/has been + -ing","zh":"持续时间 · 正在进行或刚刚发生的动作\nhave/has been + -ing"}}],"note":{"en":"Read the meaning, not the words. A finished result takes the simple; an activity still running takes the continuous.","ar":"اقرأ المعنى لا الكلمات. النتيجة المكتملة تأخذ الـ simple؛ والنشاط الذي ما زال جاريًا يأخذ الـ continuous.","de":"Lies die Bedeutung, nicht die Wörter. Ein abgeschlossenes Ergebnis verlangt das simple; eine noch laufende Tätigkeit verlangt das continuous.","es":"Lee el significado, no las palabras. Un resultado terminado pide el simple; una actividad que sigue pide el continuous.","fr":"Lis le sens, pas les mots. Un résultat achevé demande le simple ; une activité encore en cours demande le continuous.","it":"Leggi il significato, non le parole. Un risultato concluso vuole il simple; un’attività ancora in corso vuole il continuous.","ja":"言葉ではなく意味を読むこと。完了した結果には simple を、まだ続いている動作には continuous を使う。","pt":"Leia o sentido, não as palavras. Um resultado concluído pede o simple; uma atividade ainda em curso pede o continuous.","ru":"Читай смысл, а не слова. Завершённый результат требует simple; действие, которое ещё идёт, требует continuous.","zh":"读意思，不要只读词。完成的结果用 simple；仍在进行的动作用 continuous。"},"button":{"en":"START THE DESCENT","ar":"ابدأ الهبوط","de":"ABSTIEG BEGINNEN","es":"COMENZAR EL DESCENSO","fr":"COMMENCER LA DESCENTE","it":"INIZIA LA DISCESA","ja":"潜降を開始する","pt":"INICIAR A DESCIDA","ru":"НАЧАТЬ ПОГРУЖЕНИЕ","zh":"开始下潜"},"next":"q0","hot":[74,72,18,18],"pos":"left","v":"center","width":60},"q0":{"img":"03_q0.web olo.","ru":"Внизу два маршрута. Надя видит кристальный жёлоб, пульсирующий в такт сигналу. Мара, картограф, видит разрушенный храм, на воротах которого тот же символ.","zh":"下方有两条路线。娜迪亚看见一道随信号搏动的水晶海沟。制图师玛拉看见一座废弃神庙，庙门上带着同样的符号。"},"kind":"choice","prompt":{"en":"Where do you take the Nautilus?","ar":"إلى أين تقود نوتيلوس؟","de":"Wohin steuerst du die Nautilus?","es":"¿Adónde llevas el Nautilus?","fr":"Où emmènes-tu le Nautilus ?","it":"Dove porti il Nautilus?","ja":"ノーチラス号をどこへ向ける？","pt":"Para onde você leva o Nautilus?","ru":"Куда ты поведёшь «Наутилус»?","zh":"你要把鹦鹉螺号开向哪里？"},"routes":[{"name":{"en":"Crystal Trench","ar":"خندق البلّور","de":"Kristallgraben","es":"Fosa de Cristal","fr":"Fosse de Cristal","it":"Fossa di Cristallo","ja":"クリスタル海溝","pt":"Fossa de Cristal","ru":"Кристальный жёлоб","zh":"水晶海沟"},"desc":{"en":"Straight at the signal, through the crystal.","ar":"مباشرةً نحو الإشارة، عبر البلّور.","de":"Geradewegs zum Signal, durch das Kristall.","es":"Directos a la señal, a través del cristal.","fr":"Droit sur le signal, à travers le cristal.","it":"Dritti al segnale, attraverso il cristallo.","ja":"クリスタルを抜けて、まっすぐ信号へ。","pt":"Direto ao sinal, através do cristal.","ru":"Прямо на сигнал, сквозь кристалл.","zh":"笔直冲向信号，穿过水晶。"},"route":"CRYSTAL TRENCH","target":"c1"},{"name":{"en":"Ruined Temple","ar":"المعبد المهدَّم","de":"Tempelruine","es":"Templo en Ruinas","fr":"Temple en Ruine","it":"Tempio in Rovina","ja":"廃墟の神殿","pt":"Templo em Ruínas","ru":"Разрушенный храм","zh":"废弃神庙"},"desc":{"en":"The long way, past a gate that carries the same mark.","ar":"الطريق الطويل، مرورًا ببوابة تحمل العلامة نفسها.","de":"Der lange Weg, vorbei an einem Tor mit demselben Zeichen.","es":"El camino largo, pasando por una puerta con la misma marca.","fr":"Le long chemin, par une porte qui porte la même marque.","it":"La via lunga, oltre un portale che porta lo stesso segno.","ja":"遠回りの道、同じ印を持つ門を通って。","pt":"O caminho longo, passando por um portão com a mesma marca.","ru":"Долгий путь,        ending, whichever ending it is; a run is "cleared" when it reached any
       ending but the failed one, "master" on the master ending. */
    if(window.CampSave)try{CampSave.rpgEnd({score:state.score,max:c.max,tiles:state.tiles,tilesMax:c.tiles||0,cleared:state.scene!==c.endings.failed,master:state.scene===c.endings.master,ending:state.scene,chapter:state.chapter})}catch(_){}
    const camp=`<a class="restart" href="quest.html">${ui('camp')}</a>`;
    act+=`${rt?line(rt,'story'):''}<div class="final-score">${ui('finalScore')} ${state.score}/${c.max}${ft} · ${'◆'.repeat(state.tiles)}${'◇'.repeat(Math.max(0,c.tiles-state.tiles))}</div>${rev}${state.route.length?`<div class="small">${ui('route')}: ${esc(state.route.join(' · ').toUpperCase())}</div>`:''}${s.link?`<a class="start" href="${s.link}">${label(s.linkLabel)}</a>`:''}${nx}<button class="restart" onclick="restart()">${ui('restart')}</button>${hub}${camp}`}
  /* a band lays the two halves side by side; every other position stacks them */
  content.innerHTML=s.pos==='band'?`${hide}<div class="band-text">${html}</div><div class="band-act">${act}</div>`:hide+html+act;
  content.scrollTop=0;updateHUD();setOpen(false);
  if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene))setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}
hot.addEventListener('click',e=>{e.stopPropagation();openPanel()});
sceneImage.addEventListener('click',()=>{closeMenu();closePanel()});
window.addEventListener('resize',()=>placeHot(G.scenes[state.scene]));
const langMenu=document.getElementById('langMenu'), langBtn=document.getElementById('langBtn');
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
function toggleMenu(){langMenu.hidden=!langMenu.hidden;langBtn.setAttribute('aria-expanded',String(!langMenu.hidden))}
function go(id){state.scene=id;state.page=0;render()}
/* paging keeps the panel up — the reader is mid-sentence, and folding it away
   on every tap would mean re-opening the object three times to read one scene */
function nextPage(){state.page=(state.page||0)+1;render();setOpen(true)}
function displayAnswer(i,apply){const s=G.scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];const ok=i===s.answer;const p=s.points||G.points;const fb=document.getElementById('feedback');const expl=s.fb?`<br>${label(s.fb)}`:'';
  if(apply)beep(ok);
  if(G.repair&&!ok){/* repair mode: mark it, explain, let them try again */buttons[i].classList.add('wrong');buttons[i].disabled=true;fb.innerHTML=`<strong>${ui('tryAgain')}</strong>${expl}`;fb.className='feedback show bad';if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}));return}
  buttons.forEach(b=>b.disabled=true);buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');
  const retried=G.repair&&(state.attempts[state.scene]||0)>0;
  if(apply){if(ok&&!retried){state.score+=p}if(ok&&s.relic)state.tiles=Math.min(CH().tiles,state.tiles+1);if(!ok)state.chances=Math.max(0,state.chances-1);if(s.final)state.finalCorrect=ok;state.answered++}
  const head=ok?(retried?ui('repaired'):ui(s.relic?'relic':'correct',{p})):ui('wrong');const was=ok?'':`<br>${ui('answerWas')} ${esc(optText(s.opts[s.answer]))}`;
  fb.innerHTML=`<strong>${head}</strong>${was}${expl}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD();if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}))}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;const s=G.scenes[state.scene];if(G.repair&&i!==s.answer){if(!(state.attempts[state.scene]||0))state.mistakes.push(state.scene);state.attempts[state.scene]=(state.attempts[state.scene]||0)+1;displayAnswer(i,true);return}state.results[state.scene]=i;displayAnswer(i,true)}
/* `alive` is "the player has not run out of chances". A repair-mode lesson has
   no chance counter at all (G.chances is 0 by design), so testing state.chances>0
   there is always false and silently kills every ending but `missing`/`failed` —
   a flawless Wonderland run scored 160/160 and was sent to the escape ending.
   With chances in play this is exactly the old test. */
/* `bands` is an ending chosen by score alone: [[min, sceneId], …] highest
   first, the first band the score reaches wins. An export whose endings are
   pure score thresholds (Frostbound: 64+ / 40-63 / below 40) has no tiles and
   no chances to reason about, and the tile/chance ladder below would send a
   64-point run to `missing` because G.tiles is 0. Lessons without `bands` are
   unchanged. */
/* `passScore` is the third way an export can decide an ending, after the
   tile/chance ladder and score-only `bands`: a pass mark, then the collection,
   then a perfect score. The Kraken export's own rule, verbatim —
   `chances<=0 || n<60 ? failed : items<4 ? missing : n===70 ? master : complete`
   — and it deliberately does not consult the final question, which the ladder
   below does. A 60/70 run with one collectible missing is `missing`; the
   ladder called it `failed` because the last answer was wrong, which is a
   different game from the one the export shipped. */
function resolve(){const c=CH();if(c.passScore!=null){const live=!c.chances||state.chances>0;if(!live||state.score<c.passScore)return c.endings.failed;if(state.tiles<c.tiles)return c.endings.missing;if(state.score>=c.max)return c.endings.master;return c.endings.complete}
  if(c.bands&&c.bands.length){const b=c.bands.find(b=>state.score>=b[0]);if(b)return b[1]}
  const alive=!c.chances||state.chances>0;const full=state.tiles>=c.tiles&&alive;const flawless=state.finalCorrect&&full&&state.score>=c.max;if(flawless&&(!state.endingPick||state.endingMaster))return c.endings.master;if(state.endingPick&&alive&&c.endings[state.endingPick]&&!(state.endingMin&&state.score<state.endingMin))return c.endings[state.endingPick];if(state.finalCorrect&&full&&state.score>=c.completeScore)return c.endings.complete;if(state.finalCorrect&&state.tiles<c.tiles)return c.endings.missing;return c.endings.failed}
/* `G.chances &&` is the same guard resolve() carries: a lesson with no chance
   counter at all (G.chances is 0 by design) has state.chances<=0 from the
   first frame, so the old test threw the learner to the failed ending on their
   first wrong answer. With chances in play this is exactly the old test. */
function advance(){const s=G.scenes[state.scene];const c=CH();if(c.chances&&state.chances<=0&&state.results[state.scene]!==s.answer){go(c.endings.failed);return}if(s.next==='resolve'){go(resolve());return}go(s.next)}
/* `endingMin` is a score floor on a route's own ending: the route decides WHICH
   reward ending you get, the floor decides whether you have earned one at all.
   Without it a route ending applies at any score. Frankenstein sets none, so its
   behaviour is unchanged. */
/* `points` on a route is the export kind whose story choices score (Frostbound:
   the careful road pays 4, the shortcut 2, and the ending bands read the
   total). A route without `points` scores nothing, as every route did before. */
function chooseRoute(i){const r=G.scenes[state.scene].routes[i];if(r.route)state.route.push(r.route);if(r.points)state.score+=r.points;if(r.ending){state.endingPick=r.ending;state.endingMaster=!!r.master;state.endingMin=r.endingMin||0}go(r.min!=null&&state.score<r.min?r.else:r.target)}
function restart(){state=fresh(state.lang,state.chapter);render()}
/* the hub and the chapters it starts. `toHub` resets to no chapter at all, so
   the HUD badges go quiet until one is picked. */
function startChapter(i){state=fresh(state.lang,i);render()}
function toHub(){state=fresh(state.lang,null);render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?`<b>OFF</b><span>${esc(G.labels.off.en)}</span>`:`<b>${l.toUpperCase()}</b><span>${esc(G.names[l])}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('sound').addEventListener('click',()=>{setSound(!sound);beep(true)});
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{const k=e.key;if(k.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(k==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(k.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(k.toLowerCase()==='s'){document.getElementById('sound').click();return}if(!state.open&&(k==='Enter'||NUM.includes(k))){openPanel();return}const s=G.scenes[state.scene];if(NUM.includes(k)){const i=Number(k)-1;if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click();return}if(k==='Enter')document.querySelector('.continue:not([hidden]),.start,.restart')?.click()});
setSound(sound);render();
</script>
</body>
