:root{--cake-a:rgba(207,52,125,.55);--cake-b:rgba(36,121,173,.55);
--cake-a-ink:#fff0f7;--cake-b-ink:#eef7ff;
--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;
--cake-a-wash:rgba(207,52,125,.22);--cake-b-wash:rgba(36,121,173,.22);
--accent:#B08968;--accent-ink:#0b1a12;--deep:#241a10;--panel:rgba(22,15,3,.88);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* ── HUD ── */
.hud{position:absolute;z-index:5;top:1.3cqw;left:1.5cqw;right:1.5cqw;display:flex;align-items:center;justify-content:space-between;gap:1cqw;pointer-events:none}
.hud-group{display:flex;gap:.55cqw;align-items:center;flex-wrap:wrap}
.badge{background:var(--panel);border:1px solid rgba(255,246,217,.34);box-shadow:0 0 1.3cqw var(--shadow);padding:.5cqw .8cqw;font-size:1.15cqw;letter-spacing:.04em;white-space:nowrap}
.badge b{color:var(--accent);font-weight:700}
.langs{display:flex;gap:.35cqw;pointer-events:auto;position:relative}
.lang-btn,.utility{border:1px solid rgba(255,246,217,.35);color:var(--bone);background:var(--panel);padding:.5cqw .75cqw;cursor:pointer;font-size:1.1cqw;pointer-events:auto}
.lang-btn{display:flex;align-items:center;gap:.3cqw;white-space:nowrap}.lang-btn b{color:var(--accent)}
.utility:hover,.lang-btn:hover{border-color:var(--bone)}
.utility.fs{display:flex;align-items:center;gap:.35cqw;color:var(--accent-ink);background:linear-gradient(180deg,#fff0b8,var(--accent));border:1px solid #fff8dc;font-weight:700;letter-spacing:.06em;animation:fsglow 2.4s ease-in-out infinite}
.utility.fs:hover{filter:brightness(1.08)}
.lang-menu[hidden]{display:none}
.lang-menu{position:absolute;right:0;top:calc(100% + .4cqw);z-index:20;display:grid;grid-template-columns:1fr;gap:.25cqw;min-width:18cqw;padding:.45cqw;background:rgba(14,9,2,.97);border:1px solid rgba(255,246,217,.4);box-shadow:0 1cqw 3cqw rgba(0,0,0,.7)}
.lang-item{display:grid;grid-template-columns:3cqw 1fr;align-items:center;gap:.4cqw;border:1px solid transparent;background:none;color:var(--bone);padding:.45cqw .55cqw;text-align:left;cursor:pointer;font-size:1.05cqw}
.lang-item b{color:var(--accent);font-size:.95cqw}.lang-item:hover{border-color:rgba(255,246,217,.5);background:rgba(60,40,5,.9)}
.lang-item.active{background:var(--accent);color:var(--accent-ink)}.lang-item.active b{color:var(--accent-ink)}
/* ── the panel ── */
.zone{position:absolute;z-index:4;top:8%;bottom:3.5%;left:2.2%;right:2.2%;display:flex;pointer-events:none}
.content{pointer-events:auto;display:flex;flex-direction:column;gap:.8cqw;width:46%;max-height:100%;overflow:auto;scrollbar-width:thin;padding:1.2cqw 1.4cqw;background:var(--panel);border:1px solid rgba(255,246,217,.22);box-shadow:0 1.4cqw 4cqw var(--shadow);backdrop-filter:blur(6px);transition:transform .38s cubic-bezier(.2,.9,.3,1.15),opacity .22s ease;transform-origin:50% 50%}
.frame:not(.open) .content{opacity:0;transform:scale(.12);pointer-events:none;transition:transform .26s ease-in,opacity .18s ease-in}
.left .zone{justify-content:flex-start}.left .content{text-align:left}
.right .zone{justify-content:flex-end}.right .content{text-align:right}
.center .zone{justify-content:center}.center .content{width:64%;text-align:center}
.v-top .zone{align-items:flex-start}.v-center .zone{align-items:center}.v-bottom .zone{align-items:flex-end}
.hide-btn{align-self:flex-end;order:-1;margin:-.4cqw -.5cqw -.3cqw 0;border:0;background:none;color:var(--soft);font-size:.95cqw;letter-spacing:.08em;cursor:pointer;padding:.25cqw .4cqw}
.hide-btn:hover{color:#fff}.right .hide-btn{align-self:flex-start}
/* ── the glowing object ── */
.hot{position:absolute;z-index:6;left:50%;top:50%;width:10%;height:14%;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;transition:opacity .25s;min-width:3.6cqw;min-height:3.6cqw}
.hot i{position:absolute;inset:-.4cqw;border-radius:38%;background:linear-gradient(115deg,transparent 28%,rgba(255,250,220,.3) 42%,rgba(255,255,240,.7) 50%,rgba(255,250,220,.3) 58%,transparent 72%);background-size:260% 260%;mix-blend-mode:screen;box-shadow:0 0 0 .16cqw #fff,0 0 0 .36cqw rgba(70,45,0,.55),0 0 1.6cqw .4cqw rgba(255,240,170,.85),inset 0 0 1.4cqw rgba(255,255,220,.45);animation:shimmer 2.2s linear infinite,pulse 1.8s ease-in-out infinite}
.hot::before{content:"";position:absolute;inset:-.4cqw;border-radius:38%;border:.18cqw solid #fff;opacity:0;animation:ring 1.8s ease-out infinite}

ed-dollar outlaw. You found the man who killed your brother. Now a town stands between you and revenge.","es":"Eres Blane. Viniste por un fugitivo de quinientos dólares. Encontraste al asesino de tu hermano. Ahora un pueblo se interpone entre tú y la venganza.","de":"Du bist Blane. Du kamst wegen eines Gesetzlosen und fünfhundert Dollar. Du fandest den Mörder deines Bruders. Nun steht eine Stadt zwischen dir und deiner Rache.","fr":"Tu es Blane. Tu venais chercher un fugitif pour cinq cents dollars. Tu as trouvé l’assassin de ton frère. Maintenant, une ville se trouve entre toi et la vengeance.","it":"Sei Blane. Cercavi un fuorilegge da cinquecento dollari. Hai trovato l’assassino di tuo fratello. Ora una città si trova tra te e la vendetta.","pt":"És Blane. Vieste por um fora da lei de quinhentos dólares. Encontraste o assassino do teu irmão. Agora uma cidade está entre ti e a vingança.","ru":"Ты — Блейн. Ты пришёл за преступником и пятьюстами долларами. Ты нашёл убийцу своего брата. Теперь целый город стоит между тобой и местью.","ar":"أنت بلين. جئت من أجل خارج عن القانون ومكافأة خمسمئة دولار. وجدت قاتل أخيك. الآن تقف بلدة بينك وبين الانتقام.","zh":"你是布莱恩。你来抓一个赏金五百美元的逃犯，却找到了杀害哥哥的人。现在，一座小镇挡在你与复仇之间。","ja":"あなたはブレイン。五百ドルの賞金首を追って来ました。でも、兄を殺した男を見つけました。今、一つの町があなたと復讐の間にあります。"},"rules":[{"en":"15 QUESTIONS","es":"15 PREGUNTAS","de":"15 FRAGEN","fr":"15 QUESTIONS","it":"15 DOMANDE","pt":"15 PERGUNTAS","ru":"15 ВОПРОСОВ","ar":"15 سؤالاً","zh":"15道题","ja":"15問"},{"en":"2 STORY CHOICES","es":"2 DECISIONES","de":"2 ENTSCHEIDUNGEN","fr":"2 DÉCISIONS","it":"2 SCELTE","pt":"2 ESCOLHAS","ru":"2 РЕШЕНИЯ","ar":"قراران للقصة","zh":"2个故事选择","ja":"物語の選択2回"},{"en":"3 ENDINGS","es":"3 FINALES","de":"3 ENDEN","fr":"3 FINS","it":"3 FINALI","pt":"3 FINAIS","ru":"3 КОНЦОВКИ","ar":"3 نهايات","zh":"3种结局","ja":"3つの結末"}],"start":{"en":"PUSH OPEN THE DOORS","es":"ABRE LAS PUERTAS","de":"STOSS DIE TÜREN AUF","fr":"POUSSE LES PORTES","it":"SPINGI LE PORTE","pt":"EMPURRA AS PORTAS","ru":"ТОЛКНИ ДВЕР водит взгляд с наручников на твоё лицо.","ar":"يراقب أندرياس مسدسك. «أخوك لم يكن ليفعلها». ينطق تيتو اسمك. صمت طويل. ثم تخفض السلاح وتخرج الأصفاد. ينظر أندرياس من الأصفاد إلى وجهك.","zh":"安德烈亚斯盯着你的枪。“你哥哥不会这么做。”蒂托叫出你的名字。漫长的沉默后，你放低枪口，拿出手铐。安德烈亚斯看看手铐，又看看你的脸。","ja":"アンドレアスはあなたの銃を見ます。「兄さんなら撃たない」。ティトがあなたの名を呼びます。長い沈黙。あなたは銃口を下げ、手錠を出します。アンドレアスは手錠からあなたの顔へ視線を移します。"},"kind":"question","clue":{"en":"ANDREAS: “He wanted to take me alive.”","es":"ANDREAS: «Quería llevarme vivo».","de":"ANDREAS: „Er wollte mich lebend festnehmen.“","fr":"ANDREAS : « Il voulait me prendre vivant. »","it":"ANDREAS: «Voleva prendermi vivo».","pt":"ANDREAS: «Queria levar-me vivo».","ru":"АНДРЕАС: «Он хотел взять меня живым».","ar":"أندرياس: «أراد اعتقالي حياً».","zh":"安德烈亚斯：“他想活捉我。”","ja":"アンドレアス：「生け捕りにしたがった」。"},"prompt":{"en":"Choose Blane’s reply.","es":"Elige la respuesta de Blane.","de":"Wähle Blanes Antwort.","fr":"Choisis la réponse de Blane.","it":"Scegli la risposta di Blane.","pt":"Escolhe a resposta de Blane.","ru":"Выбери ответ Блейна.","ar":"اختر رد بلين.","zh":"选择布莱恩的回答。","ja":"ブレインの返事を選んでください。"},"opts":[{"en":"He was right. You’re going to face a judge."},{"en":"He were right. You’re going to face a judge."},{"en":"He did was right. You’re going to face a judge."}],"answer":0,"points":5,"fb":{"en":"Use was with he in the past: He was right.","es":"Usa was con he en pasado: He was right.","de":"Bei he steht in der Vergangenheit was: He was right.","fr":"Au passé, utilise was avec he : He was right.","it":"Al passato usa was con he: He was right.","pt":"No passado, usa was com he: He was right.","ru":"С he в прошедшем времени используй was: He was right.","ar":"استخدم was مع he في الماضي: He was right.","zh":"过去时中 he 与 was 搭配：He was right.","ja":"過去の he には was を使います：He was right."},"final":true,"next":"resolve","hot":[54,46,9,25],"pos":"left","v":"center","width":38},"end_rescue":{"kind":"ending","img":"rescueend.webp","success":true,"k":{"en":"YOU CHOSE THE PEOPLE","es":"ELEGISTE A LA GENTE","de":"DU HAST DIE MENSCHEN GEWÄHLT","fr":"TU AS CHOISI LES GENS","it":"HAI SCELTO LA GENTE","pt":"ESCOLHESTE AS PESSOAS","ru":"ТЫ ВЫБРАЛ ЛЮДЕЙ","ar":"اخترت الناس","zh":"你选择了救人","ja":"人々を選んだ"},"title":{"en":"MORE THAN A REWARD","es":"MÁS QUE UNA RECOMPENSA","de":"MEHR ALS EINE BELOHNUNG","fr":"PLUS QU’UNE PRIME","it":"PIÙ DI UNA TAGLIA","pt":"MAIS QUE UMA RECOMPENSA","ru":"БОЛЬШЕ ЧЕМ НАГРАДА","ar":"أكثر من مكافأة","zh":"不只是赏金","ja":"賞金より大切なもの"},"story":{"en":"You entered the fire when revenge was within reach. Tito chose to help you. At dawn, Andreas leaves in a prison wagon. You give Tito his poster with the bank manager’s statement on the back: he helped save everyone. “Will there be breakfast?” he asks. “At the jail,” you say. This time, he rides beside you.","es":"Entraste en el fuego cuando podías vengarte. Tito decidió ayudarte. Al amanecer, Andreas parte en un carro de presos. Le das a Tito su cartel con la declaración del gerente detrás: ayudó a salvarlos a todos. «¿Habrá desayuno?», pregunta. «En la cárcel». Esta vez cabalga a tu lado.","de":"Du gingst ins Feuer, obwohl deine Rache greifbar war. Tito entschied sich zu helfen. Bei Tagesanbruch fährt Andreas im Gefangenenwagen fort. Du gibst Tito seinen Steckbrief mit der Aussage des Bankdirektors auf der Rückseite: Er half, alle zu retten. „Gibt es Frühstück?“, fragt er. „Im Gefängnis.“ Diesmal reitet er neben dir.","fr":"Tu es entré dans le feu alors que la vengeance était proche. Tito a choisi de t’aider. À l’aube, Andreas part dans un fourgon de prisonniers. Tu donnes son affiche à Tito, avec le témoignage du directeur au dos : il a aidé à sauver tout le monde. « On aura un petit-déjeuner ? » demande-t-il. « En prison. » Cette fois, il chevauche à tes côtés.","it":"Sei entrato nel fuoco quando potevi vendicarti. Tito ha scelto di aiutarti. All’alba Andreas parte su un carro di prigionieri. Dai a Tito il suo manifesto con la dichiarazione del direttore sul retro: ha aiutato a salvare tutti. «Ci sarà colazione?», chiede. «In prigione». Questa volta cavalca al tuo fianco.","pt":"Entraste no fogo quando podias vingar-te. Tito escolheu ajudar. Ao amanhecer, Andreas parte num carro de prisioneiros. Dás a Tito o cartaz com a declaração do gerente atrás: ajudou a salvar todos. «Haverá pequeno-almoço?», pergunta. «Na prisão». Desta vez cavalga ao teu lado.","ru":"Ты вошёл в огонь, когда месть была близка. Тито решил помочь. На рассвете Андреаса увозят в тюремной повозке. Ты отдаёшь Тито его плакат с показаниями управляющего на обороте: он помог спасти всех. «Завтрак будет?» — спрашивает он. «В тюрьме». На этот раз он едет рядом.","ar":"دخلت النار والانتقام قريب. اختار تيتو مساعدتك. عند الفجر يغادر أندرياس في عربة السجناء. تعطي تيتو ملصقه وعليه شهادة مدير البنك: ساعد في إنقاذ الجميع. يسأل: «هل يوجد فطور؟» تجيب: «في السجن». هذه المرة يركب إلى جانبك.","zh":"复仇就在眼前，你却冲进了火场。蒂托选择帮助你。黎明时，安德烈亚斯坐着囚车离开。你把蒂托的通缉令交给他，背面有银行经理的证词：他帮助救了所有人。“有早餐吗？”他问。“监狱里有。”这次，他骑马走在你身边。","ja":"復讐が目の前にある時、あなたは火の中へ入りました。ティトは助けることを選びました。夜明け、アンドレアスは囚人馬車で去ります。ティトに手配書を渡します。裏には銀行長の証言。「全員の救出を助けた」。「朝食はある？」と彼。「牢屋にな」。今度はあなたの隣を進みます。"},"hot":[55,57,15,22],"pos":"left","v":"center"},"end_pursuit":{"kind":"ending","img":"pursuitend.webp","success":true,"k":{"en":"YOU TRUSTED TITO","es":"CONFIASTE EN TITO","de":"DU HAST TITO VERTRAUT","fr":"TU AS FAIT CONFIANCE À TITO","it":"TI SEI FIDATO DI TITO","pt":"CONFIASTE EM TITO","ru":"ТЫ ДОВЕРИЛСЯ ТИТО","ar":"وثقت بتيتو","zh":"你信任了蒂托","ja":"ティトを信じた"},"title":{"en":"A COWARD FOUND COURAGE","es":"UN COBARDE ENCONTRÓ VALOR","de":"EIN FEIGLING FAND MUT","fr":"UN LÂCHE DEVIENT COURAGEUX","it":"UN CODARDO TROVÒ CORAGGIO","pt":"UM COBARDE ENCONTROU CORAGEM","ru":"ТРУС НАШЁЛ СМЕЛОСТЬ","ar":"جبان وجد الشجاعة","zh":"胆小的人找到了勇气","ja":"臆病者が勇気を見つけた"},"story":{"en":"You stopped Andreas and trusted a frightened man with the rescue. Tito could have run. He went into the fire instead. At dawn, the child waves as you ride towards the jail together. You will tell the judge what Tito did. “You trusted me?” he asks. “I gave you a chance.” He rides a little straighter.","es":"Detuviste a Andreas y confiaste el rescate a un hombre asustado. Tito pudo huir. Entró en el fuego. Al amanecer, la niña os saluda mientras cabalgáis hacia la cárcel. Contarás al juez lo que hizo. «¿Confiaste en mí?», pregunta. «Te di una oportunidad». Se sienta un poco más erguido.","de":"Du hast Andreas gestoppt und einem verängstigten Mann die Rettung anvertraut. Tito hätte fliehen können. Er ging ins Feuer. Bei Tagesanbruch winkt das Kind, während ihr zum Gefängnis reitet. Du wirst dem Richter von seiner Tat erzählen. „Du hast mir vertraut?“, fragt er. „Ich gab dir eine Chance.“ Er sitzt etwas aufrechter.","fr":"Tu as arrêté Andreas et confié le sauvetage à un homme effrayé. Tito aurait pu fuir. Il est entré dans le feu. À l’aube, l’enfant vous salue pendant votre départ vers la prison. Tu diras au juge ce qu’il a fait. « Tu m’as fait confiance ? » demande-t-il. « Je t’ai donné une chance. » Il se redresse sur sa selle.","it":"Hai fermato Andreas e affidato il salvataggio a un uomo impaurito. Tito poteva scappare. È entrato nel fuoco. All’alba la bambina vi saluta mentre andate verso la prigione. Racconterai al giudice che cosa ha fatto. «Ti sei fidato di me?», chiede. «Ti ho dato una possibilità». Si raddrizza un poco sulla sella.","pt":"Travaste Andreas e confiaste o salvamento a um homem assustado. Tito podia fugir. Entrou no fogo. Ao amanhecer, a menina acena quando partem para a prisão. Contarás ao juiz o que ele fez. «Confiaste em mim?», pergunta. «Dei-te uma oportunidade». Endireita-se um pouco na sela.","ru":"Ты остановил Андреаса и доверил спасение испуганному человеку. Тито мог сбежать. Он вошёл в огонь. На рассвете девочка машет вам, пока вы едете к тюрьме. Ты расскажешь судье о поступке Тито. «Ты мне доверял?» — спрашивает он. «Я дал тебе шанс». Он выпрямляется в седле.","ar":"أوقفت أندرياس ووثقت برجل خائف لإنقاذ الناس. كان يمكن لتيتو الهرب. لكنه دخل النار. عند الفجر تلوح الطفلة وأنتما تتجهان إلى السجن. ستخبر القاضي بما فعله تيتو. يسأل: «وثقت بي؟» تجيب: «أعطيتك فرصة». يعتدل قليلاً في سرجه.","zh":"你拦住了安德烈亚斯，把救援交给一个害怕的人。蒂托本可以逃跑，却走进了火场。黎明时，你们一起骑向监狱，女孩向你们挥手。你会告诉法官蒂托做了什么。“你信任我？”他问。“我给了你一次机会。”他在马背上坐直了一点。","ja":"あなたはアンドレアスを止め、怖がる男に救出を任せました。ティトは逃げられました。でも火に入りました。夜明け、牢屋へ向かう二人に少女が手を振ります。裁判官にティトの行動を伝えるつもりです。「俺を信じた？」「機会をやったんだ」。彼は少し背筋を伸ばします。"},"hot":[92,20,16,29],"pos":"left","v":"center"},"end_lost":{"kind":"ending","img":"reportend.webp","success":false,"k":{"en":"THE STORY IS NOT OVER","es":"LA HISTORIA NO HA TERMINADO","de":"DIE GESCHICHTE GEHT WEITER","fr":"L’HISTOIRE CONTINUE","it":"LA STORIA NON È FINITA","pt":"A HISTÓRIA NÃO ACABOU","ru":"ИСТОРИЯ НЕ ЗАКОНЧЕНА","ar":"لم تنته القصة","zh":"故事还没有结束","ja":"物語はまだ続く"},"title":{"en":"ONE MORE CHANCE","es":"UNA OPORTUNIDAD MÁS","de":"NOCH EINE CHANCE","fr":"UNE NOUVELLE CHANCE","it":"UN’ALTRA POSSIBILITÀ","pt":"MAIS UMA OPORTUNIDADE","ru":"ЕЩЁ ОДИН ШАНС","ar":"فرصة أخرى","zh":"再一次机会","ja":"もう一度の機会"},"story":{"en":"The people are safe and Andreas faces a judge. Your report needs more work before the reward can be paid. Read the explanations below, then try another route. Tito looks at the paperwork. “I preferred the gunmen.” You give him a pencil.","es":"La gente está a salvo y Andreas irá ante un juez. Tu informe necesita mejoras antes de cobrar la recompensa. Lee las explicaciones y prueba otra ruta. Tito mira los papeles. «Prefería a los pistoleros». Le das un lápiz.","de":"Die Menschen sind gerettet und Andreas kommt vor Gericht. Dein Bericht braucht noch Arbeit, bevor das Kopfgeld ausgezahlt wird. Lies die Erklärungen und versuche einen anderen Weg. Tito sieht die Papiere an. „Die Schützen waren mir lieber.“ Du gibst ihm einen Bleistift.","fr":"Les gens sont sauvés et Andreas sera jugé. Ton rapport doit être amélioré avant le paiement de la prime. Lis les explications et essaie une autre route. Tito regarde les papiers. « Je préférais les tireurs. » Tu lui donnes un crayon.","it":"La gente è salva e Andreas sarà giudicato. Il tuo rapporto va migliorato prima del pagamento della taglia. Leggi le spiegazioni e prova un’altra strada. Tito guarda i fogli. «Preferivo i pistoleri». Gli dai una matita.","pt":"As pessoas estão seguras e Andreas vai enfrentar um juiz. O teu relatório precisa de melhorias antes do pagamento. Lê as explicações e tenta outro caminho. Tito olha para os papéis. «Preferia os pistoleiros». Dás-lhe um lápis.","ru":"Люди спасены, Андреас предстанет перед судьёй. Твой отчёт нужно исправить, прежде чем выплатят награду. Прочитай объяснения и попробуй другой путь. Тито смотрит на бумаги. «Стрелки мне нравились больше». Ты даёшь ему карандаш.","ar":"الناس آمنون وأندرياس سيواجه قاضياً. يحتاج تقريرك إلى تحسين قبل دفع المكافأة. اقرأ الشروح وجرب طريقاً آخر. ينظر تيتو إلى الأوراق. «كنت أفضل المسلحين». تعطيه قلماً.","zh":"人们安全了，安德烈亚斯将接受审判。你的报告还需要修改，才能领取赏金。读读解释，再试另一条路。蒂托看着文件。“我还是更喜欢那些枪手。”你递给他一支铅笔。","ja":"人々は安全で、アンドレアスは裁判を受けます。賞金の支払いには、報告を直す必要があります。説明を読んで別の道を試しましょう。ティトは書類を見ます。「銃を持つ連中の方がましだ」。あなたは鉛筆を渡します。"},"hot":[73,77,25,16],"pos":"left","v":"center"}},"endings":{"rescue":"end_rescue","pursuit":"end_pursuit","failed":"end_lost"},"max":75,"points":5,"tiles":0,"chances":0,"completeScore":50,"repair":false,"total":0,"tags":{"a":{"en":"NOW"},"b":{"en":"USUALLY"}}};
const LANGS = G.langs, RTL = ['ar'];
let state = fresh('off');
let sound=false;try{sound=localStorage.getItem('rpg-sound')==='1'}catch(_){}
/* two short tones, right and wrong — the Wonderland export's, kept */
function beep(ok){if(!sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.type=ok?'square':'sawtooth';o.frequency.value=ok?620:180;g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.stop(c.currentTime+.18);o.onended=()=>c.close()}catch(_){}}
function setSound(on){sound=!!on;try{localStorage.setItem('rpg-sound',sound?'1':'0')}catch(_){}const b=document.getElementById('sound');b.setAttribute('aria-pressed',String(sound));b.firstChild.textContent=(sound?'🔊':'🔈')+' ';document.getElementById('soundLabel').textContent=ui(sound?'soundOn':'soundOff')}
function fresh(lang){return {scene:G.start,score:0,chances:G.chances,tiles:0,lang,open:false,route:[],results:{},attempts:{},mistakes:[],answered:0,finalCorrect:null,endingPick:null,endingMaster:false}}
const frame=document.getElementById('frame'), content=document.getElementById('content'), sceneImage=document.getElementById('sceneImage');
const hot=document.getElementById('hot'), hotLabel=document.getElementById('hotLabel'), zone=document.getElementById('zone');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MARK=/\[\[(\/?)([ab])\]\]/g;
const bare=s=>String(s??'').replace(MARK,'');          /* plain text: alt, review, answer read-back */
const esct=s=>esc(s).replace(MARK,(_,c,k)=>c?'</span>':'<span class="tone-'+k+'">');
const tx=(o,l)=>o?(l&&o[l]?o[l]:o.en):'';
function ui(key,vars){let s=tx(G.labels[key],state.lang==='off'?null:state.lang);if(vars)for(const k in vars)s=s.replace('{'+k+'}',vars[k]);return s}
/* a gloss identical to the English (a formula, a name) is not shown — it would only repeat the line */
const gloss=obj=>state.lang!=='off'&&obj[state.lang]&&obj[state.lang]!==obj.en?obj[state.lang]:'';
function line(obj,cls=''){if(!obj)return '';const en=esct(obj.en),g=gloss(obj);return g?`<span class="${cls}">${en}<span class="translation">${esct(g)}</span></span>`:`<span class="${cls}">${en}</span>`}
function label(obj){if(!obj)return '';const g=gloss(obj);return g?`${esct(obj.en)}<span class="translation">${esct(g)}</span>`:esct(obj.en)}
/* an option is {en,…} or, for a two-blank item, {parts:[a,b], kinds:['a'|'b',…], tags:[{en,…},{en,…}]} — two coloured halves */
function optText(o){return bare(o.parts?o.parts.join(' / '):o.en)}
function optMarkup(o){if(!o.parts)return `<span>${label(o)}</span>`;return o.parts.map((p,i)=>`<span class="half ${o.kinds[i]}"><small>${label(G.tags[o.kinds[i]])}</small><b>${esc(p)}</b></span>`).join('')}
function updateHUD(){document.getElementById('score').textContent=state.score;document.getElementById('tiles').textContent='◆'.repeat(state.tiles)+'◇'.repeat(Math.max(0,G.tiles-state.tiles));document.getElementById('chances').textContent='♥'.repeat(state.chances)+'♡'.repeat(Math.max(0,G.chances-state.chances));document.getElementById('lblPoints').textContent=ui('points');document.getElementById('lblTiles').textContent=ui('tiles');document.getElementById('lblChances').textContent=ui('chances');document.getElementById('chancesBadge').hidden=!G.chances;document.getElementById('tilesBadge').hidden=!G.tiles;document.getElementById('progressBadge').hidden=!G.total;if(G.total){document.getElementById('lblProgress').textContent=ui('progress');document.getElementById('progress').textContent=`${state.answered}/${G.total}`}document.getElementById('help').textContent=ui('help')}
function head(s){const t=s.kind==='intro'?`<span class="big">${label(s.title)}</span>`:label(s.title);return `${line(s.k,'kicker')}<h1 class="title ${s.kind==='intro'?'cover-title':''}">${t}</h1>${line(s.story,'story')}`}
/* HOT = [cx, cy, w, h] as % of the PICTURE (3:2). The picture is object-fit:cover in the frame, so convert picture space to frame pixels; a phone shows a narrow central slice and the object stays on it. */
function placeHot(h){const W=frame.clientWidth,H=frame.clientHeight,sc=Math.max(W/G.imgW,H/G.imgH),dw=G.imgW*sc,dh=G.imgH*sc;
  /* cover crops the picture; slide it so the object stays on screen (a portrait phone shows a third of the width) */
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const ox=dw>W?clamp(W/2-h[0]/100*dw,W-dw,0):(W-dw)/2,oy=dh>H?clamp(H/2-h[1]/100*dh,H-dh,0):(H-dh)/2;
  sceneImage.style.objectPosition=`${dw>W?ox/(W-dw)*100:50}% ${dh>H?oy/(H-dh)*100:50}%`;
  const cx=ox+h[0]/100*dw,cy=oy+h[1]/100*dh,w=h[2]/100*dw,hh=h[3]/100*dh;hot.style.left=cx+'px';hot.style.top=cy+'px';hot.style.width=w+'px';hot.style.height=hh+'px';hot.classList.toggle('above',cy+hh/2>H*.84);hotLabel.textContent=ui('read');
  document.getElementById('fsLabel').textContent=ui('fullscreen');document.getElementById('soundLabel').textContent=ui(sound?'soundOn':'soundOff');document.getElementById('langWord').textContent=ui('translate');document.getElementById('langCur').textContent=state.lang==='off'?'OFF':G.names[state.lang];
  document.querySelectorAll('.lang-item').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function setOpen(on){state.open=!!on;if(on){const hr=hot.getBoundingClientRect(),zr=zone.getBoundingClientRect();const cl=zr.left+content.offsetLeft,ct=zr.top+content.offsetTop;content.style.transformOrigin=`${hr.left+hr.width/2-cl}px ${hr.top+hr.height/2-ct}px`}frame.classList.toggle('open',state.open)}
function openPanel(){if(!state.open)setOpen(true)}
function closePanel(){if(state.open)setOpen(false)}
function render(){const s=G.scenes[state.scene];frame.className=`frame ${s.pos||'left'} v-${s.v||'center'}${RTL.includes(state.lang)?' rtl':''}`;sceneImage.src=G.dir+s.img;sceneImage.alt=bare(s.title.en);placeHot(s.hot);const tr=state.lang!=='off';frame.classList.toggle('tr-on',tr);content.style.width=((s.width||(s.pos==='center'?64:46))+(tr?8:0))+'%';content.style.marginLeft=s.pos==='left'&&s.inset?s.inset+'%':'';content.style.marginRight=s.pos==='right'&&s.inset?s.inset+'%':'';
  let html=`<button class="hide-btn" onclick="closePanel()" title="Esc">✕ ${ui('hide')}</button>`+head(s);
  if(s.kind==='intro'){html+=`${s.rules?`<div class="rules-chips">${s.rules.map(r=>`<span>${label(r)}</span>`).join('')}</div>`:''}<button class="start" onclick="go('${s.next}')">${label(s.start)}</button>${s.small?`<div class="small">${label(s.small)}</div>`:''}`}
  else if(s.kind==='rules'){html+=`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('begin')}</button>`}
  else if(s.kind==='story'){html+=`${s.rules?`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>`:''}${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('continue')}</button>`}
  else if(s.kind==='question'){html+=`${s.clue?`<div class="clue"><b>${ui('visual')}</b><br>${label(s.clue)}</div>`:''}<div class="prompt">${label(s.prompt)}</div><div class="options">${s.opts.map((o,i)=>`<button class="option${o.parts?' split':''}" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span>${optMarkup(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="continue" class="continue" hidden onclick="advance()">${ui('continue')}</button>`}
  else if(s.kind==='choice'){html+=`<div class="route-options">${s.routes.map((r,i)=>`<button class="route" onclick="chooseRoute(${i})"><b>${i+1} · ${label(r.name)}</b>${label(r.desc)}</button>`).join('')}</div>`}
  else if(s.kind==='ending'){const rev=G.repair?(state.mistakes.length?`<div class="review">${state.mistakes.map(id=>{const m=G.scenes[id];return `<div>${esct(m.prompt.en)}<br><b>${esc(optText(m.opts[m.answer]))}</b> — ${label(m.fb)}</div>`}).join('')}</div>`:`<div class="small">${ui('perfect')}</div>`):'';const ft=G.repair?` · ${state.score/(G.points||1)}/${G.total} ${ui('firstTry')}`:'';html+=`<div class="final-score">${ui('finalScore')} ${state.score}/${G.max}${ft} · ${'◆'.repeat(state.tiles)}${'◇'.repeat(Math.max(0,G.tiles-state.tiles))}</div>${rev}${state.route.length?`<div class="small">${ui('route')}: ${esc(state.route.join(' · ').toUpperCase())}</div>`:''}<button class="restart" onclick="restart()">${ui('restart')}</button>`}
  content.innerHTML=html;content.scrollTop=0;updateHUD();setOpen(s.kind==='intro'||s.kind==='ending');
  if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene))setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}
hot.addEventListener('click',e=>{e.stopPropagation();openPanel()});
sceneImage.addEventListener('click',()=>{closeMenu();closePanel()});
window.addEventListener('resize',()=>placeHot(G.scenes[state.scene].hot));
const langMenu=document.getElementById('langMenu'), langBtn=document.getElementById('langBtn');
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
function toggleMenu(){langMenu.hidden=!langMenu.hidden;langBtn.setAttribute('aria-expanded',String(!langMenu.hidden))}
function go(id){state.scene=id;render()}
function displayAnswer(i,apply){const s=G.scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];const ok=i===s.answer;const p=s.points||G.points;const fb=document.getElementById('feedback');const expl=s.fb?`<br>${label(s.fb)}`:'';
  if(apply)beep(ok);
  if(G.repair&&!ok){/* repair mode: mark it, explain, let them try again */buttons[i].classList.add('wrong');buttons[i].disabled=true;fb.innerHTML=`<strong>${ui('tryAgain')}</strong>${expl}`;fb.className='feedback show bad';if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}));return}
  buttons.forEach(b=>b.disabled=true);buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');
  const retried=G.repair&&(state.attempts[state.scene]||0)>0;
  if(apply){if(ok&&!retried){state.score+=p}if(ok&&s.relic)state.tiles=Math.min(G.tiles,state.tiles+1);if(!ok)state.chances=Math.max(0,state.chances-1);if(s.final)state.finalCorrect=ok;if(G.repair)state.answered++}
  const head=ok?(retried?ui('repaired'):ui(s.relic?'relic':'correct',{p})):ui(G.chances?'wrong':'wrongPoints');const was=ok?'':`<br>${ui('answerWas')} ${esc(optText(s.opts[s.answer]))}`;
  fb.innerHTML=`<strong>${head}</strong>${was}${expl}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD();if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}))}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;const s=G.scenes[state.scene];if(G.repair&&i!==s.answer){if(!(state.attempts[state.scene]||0))state.mistakes.push(state.scene);state.attempts[state.scene]=(state.attempts[state.scene]||0)+1;displayAnswer(i,true);return}state.results[state.scene]=i;displayAnswer(i,true)}
function resolve(){/* a game with no chances mechanic (G.chances:0, e.g. a points-only "you always finish" RPG) treats the score threshold as the good-standing test instead of a life count, so a route-picked ending (chooseRoute's r.ending) and the complete/master branches still resolve instead of always falling to failed */const okState=G.chances?state.chances>0:state.score>=G.completeScore;const full=state.tiles>=G.tiles&&okState;const flawless=state.finalCorrect&&full&&state.score>=G.max;if(flawless&&(!state.endingPick||state.endingMaster))return G.endings.master;if(state.endingPick&&okState&&G.endings[state.endingPick])return G.endings[state.endingPick];if(state.finalCorrect&&full&&state.score>=G.completeScore)return G.endings.complete;if(state.finalCorrect&&state.tiles<G.tiles)return G.endings.missing;return G.endings.failed}
function advance(){const s=G.scenes[state.scene];if(G.chances&&state.chances<=0&&state.results[state.scene]!==s.answer){go(G.endings.failed);return}if(s.next==='resolve'){go(resolve());return}go(s.next)}
function chooseRoute(i){const r=G.scenes[state.scene].routes[i];if(r.route)state.route.push(r.route);if(r.ending){state.endingPick=r.ending;state.endingMaster=!!r.master}go(r.min!=null&&state.score<r.min?r.else:r.target)}
function restart(){state=fresh(state.lang);render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?`<b>OFF</b><span>${esc(G.labels.off.en)}</span>`:`<b>${l.toUpperCase()}</b><span>${esc(G.names[l])}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('sound').addEventListener('click',()=>{setSound(!sound);beep(true)});
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{const k=e.key;if(k.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(k==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(k.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(k.toLowerCase()==='s'){document.getElementById('sound').click();return}if(!state.open&&(k==='Enter'||['1','2','3'].includes(k))){openPanel();return}const s=G.scenes[state.scene];if(['1','2','3'].includes(k)){const i=Number(k)-1;if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click();return}if(k==='Enter')document.querySelector('.continue:not([hidden]),.start,.restart')?.click()});
setSound(sound);render();
</script>
</body>
</html>
