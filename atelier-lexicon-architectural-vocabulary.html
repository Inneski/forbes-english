  <script>(function () {
  var DATA = {"ar":{"Spatial continuity":"الاستمرارية المكانية","Removing the partition wall restored spatial continuity between the kitchen and terrace.":"أعادت إزالة الجدار الفاصل الاستمرارية المكانية بين المطبخ والتراس.","Delineate":"يُحدِّد، يفصل بين المناطق","A sunken floor and textured rug delineate the lounge from the dining area.":"تفصل أرضية منخفضة وسجادة بارزة الملمس منطقة الجلوس عن منطقة الطعام.","Cantilevered":"ناتئ (كابولي)","The cantilevered concrete balcony appears to hover effortlessly over the cliffside.":"تبدو الشرفة الخرسانية الناتئة وكأنها تحلّق بلا عناء فوق الجرف.","Rectilinear":"مستقيم الخطوط","The building's rectilinear geometry contrasts sharply with the organic landscape.":"تتناقض الهندسة المستقيمة للمبنى تناقضًا حادًا مع المشهد الطبيعي العضوي.","Ergonomic":"إرغونومي، مريح للاستخدام","The ergonomic kitchen triangle minimizes unnecessary movement while cooking.":"يقلّل مثلث العمل الإرغونومي في المطبخ الحركة غير الضرورية أثناء الطهي.","Threshold":"عتبة، منطقة انتقالية","The deep timber porch acts as a welcoming threshold between the street and the foyer.":"يعمل الرواق الخشبي العميق كعتبة ترحيبية بين الشارع وبهو المدخل.","Patina":"الباتينا (طبقة التعتيق الطبيعي)","Unlacquered brass fixtures were chosen so they would develop a rich patina.":"اختيرت تجهيزات من النحاس الأصفر غير المطلي لتكتسب مع الوقت باتينا غنية.","Tactile":"غني بالملمس، لمسي","Raw linen, limewash plaster, and travertine create a deeply tactile interior.":"يخلق الكتان الخام وجصّ الجير والترافرتين تصميمًا داخليًا غنيًا بالملمس.","Bespoke":"مُفصَّل حسب الطلب","The library's floor-to-ceiling walnut joinery is bespoke: every shelf was made to measure for the room.":"خزائن خشب الجوز الممتدة من الأرض حتى السقف في المكتبة مُفصَّلة حسب الطلب: فكل رف صُنع خصيصًا لهذه الغرفة.","Monolithic":"مونوليثي (ككتلة واحدة)","A monolithic stone island serves as the visual anchor of the room.":"تشكّل جزيرة حجرية مونوليثية نقطة الارتكاز البصري في الغرفة.","Fenestration":"توزيع النوافذ والأبواب (الفتحات)","Asymmetrical fenestration gives the modernist facade its distinct rhythm.":"يمنح التوزيع غير المتماثل للنوافذ الواجهة الحداثية إيقاعها المميز.","Unadorned":"خالٍ من الزخرفة","The unadorned concrete walls let the art collection take center stage.":"تفسح الجدران الخرسانية الخالية من الزخرفة المجال لمجموعة الأعمال الفنية كي تتصدر المشهد.","Ambient lighting":"الإضاءة المحيطة (العامة)","Concealed LED coves provide soft ambient lighting without harsh glare.":"توفر إضاءة LED المخفية في تجاويف السقف إضاءة محيطة ناعمة من دون وهج مزعج.","Chiaroscuro":"تباين الضوء والظل (كياروسكورو)","Narrow clerestory windows cast a striking chiaroscuro across the stone corridor.":"تُلقي النوافذ العلوية الضيقة تباينًا لافتًا بين الضوء والظل على امتداد الممر الحجري.","Dappled light":"ضوء مرقّط (بقع من الضوء والظل)","A slatted timber pergola filters dappled light onto the courtyard floor.":"تُرشِّح عريشة من الشرائح الخشبية ضوءًا مرقّطًا على أرضية الفناء.","Diffuse":"يُشتِّت الضوء ويُلطِّفه","Sheer linen drapery helps diffuse the intense afternoon sun.":"تساعد ستائر الكتان الشفافة على تشتيت أشعة شمس العصر القوية.","Stark":"عارٍ، صارم، بارد","Warm oak flooring softens what would otherwise be a stark white gallery.":"تُلطّف أرضية البلوط الدافئة ما كان سيبدو لولاها معرضًا أبيض عاريًا وباردًا.","Evocative":"مُوحٍ، يستحضر الصور والذكريات","The dim, timber-lined bar is evocative of a mid-century Japanese listening room.":"يستحضر البار الخافت الإضاءة والمكسوّ بالخشب غرفة استماع يابانية من منتصف القرن العشرين.","Juxtaposition":"التجاور المتباين","The juxtaposition of exposed brick with sleek blackened steel defines the loft.":"يُحدِّد تجاور الطوب المكشوف مع الفولاذ المسوَّد الأملس طابع اللوفت.","Vernacular":"محلي تقليدي (عمارة محلية)","The villa reinterprets Mediterranean vernacular forms using contemporary engineering.":"تعيد الفيلا تفسير الأشكال المعمارية المتوسطية المحلية باستخدام هندسة معاصرة.","Austere":"متقشف، صارم","The monastery's austere beauty relies entirely on proportion and natural ligh  serves as the visual anchor of the room.":"Un'isola monolitica in pietra fa da fulcro visivo della stanza.","Fenestration":"disposizione delle aperture (fenestrazione)","Asymmetrical fenestration gives the modernist facade its distinct rhythm.":"La disposizione asimmetrica delle finestre conferisce alla facciata modernista il suo ritmo inconfondibile.","Unadorned":"disadorno, privo di ornamenti","The unadorned concrete walls let the art collection take center stage.":"Le pareti in cemento prive di ornamenti lasciano il ruolo di protagonista alla collezione d'arte.","Ambient lighting":"illuminazione d'ambiente","Concealed LED coves provide soft ambient lighting without harsh glare.":"Gole luminose a LED nascoste offrono una morbida illuminazione d'ambiente, senza abbagliamento.","Chiaroscuro":"chiaroscuro","Narrow clerestory windows cast a striking chiaroscuro across the stone corridor.":"Strette finestre alte proiettano un suggestivo chiaroscuro lungo il corridoio di pietra.","Dappled light":"luce screziata (chiazze di luce e ombra)","A slatted timber pergola filters dappled light onto the courtyard floor.":"Una pergola a listelli di legno filtra una luce screziata sul pavimento del cortile.","Diffuse":"diffondere (la luce)","Sheer linen drapery helps diffuse the intense afternoon sun.":"Le tende di lino trasparente aiutano a diffondere l'intenso sole pomeridiano.","Stark":"freddo, spoglio, severo","Warm oak flooring softens what would otherwise be a stark white gallery.":"Il caldo parquet di rovere ammorbidisce quella che altrimenti sarebbe una galleria bianca fredda e spoglia.","Evocative":"evocativo","The dim, timber-lined bar is evocative of a mid-century Japanese listening room.":"Il bar in penombra, rivestito in legno, evoca una sala d'ascolto giapponese di metà Novecento.","Juxtaposition":"giustapposizione","The juxtaposition of exposed brick with sleek blackened steel defines the loft.":"La giustapposizione del mattone a vista con l'acciaio brunito e liscio て引き立てている。","Ambient lighting":"アンビエント照明（全体照明）","Concealed LED coves provide soft ambient lighting without harsh glare.":"隠されたLEDのコーブ照明が、まぶしさのない柔らかなアンビエント照明をもたらす。","Chiaroscuro":"キアロスクーロ（明暗の強い対比）","Narrow clerestory windows cast a striking chiaroscuro across the stone corridor.":"細いハイサイドライトが、石造りの廊下に印象的な明暗のコントラストを落としている。","Dappled light":"木漏れ日のようなまだらな光","A slatted timber pergola filters dappled light onto the courtyard floor.":"木製ルーバーのパーゴラが、中庭の床に木漏れ日のようなまだらな光を落としている。","Diffuse":"（光を）拡散させる、和らげる","Sheer linen drapery helps diffuse the intense afternoon sun.":"薄手のリネンのカーテンが、強い午後の日差しを拡散させて和らげる。","Stark":"殺風景な、冷たく厳しい","Warm oak flooring softens what would otherwise be a stark white gallery.":"温かみのあるオークの床が、本来なら殺風景になりかねない白いギャラリーを和らげている。","Evocative":"想起させる、喚起する","The dim, timber-lined bar is evocative of a mid-century Japanese listening room.":"薄暗い木張りのバーは、ミッドセンチュリーの日本のリスニングルームを想起させる。","Juxtaposition":"並置（対照的なものを並べること）","The juxtaposition of exposed brick with sleek blackened steel defines the loft.":"むき出しのレンガと滑らかな黒染めスチールの並置が、このロフトを特徴づけている。","Vernacular":"ヴァナキュラーな（土着的な）","The villa reinterprets Mediterranean vernacular forms using contemporary engineering.":"このヴィラは、地中海の土着的な建築様式を現代のエンジニアリングで再解釈している。","Austere":"簡素で厳格な、禁欲的な","The monastery's austere beauty relies entirely on proportion and natural light.":"修道院の簡素で厳格な美しさは、もっぱらプロポーションと自然光によって成り立っている。","Utilitarian":"実用本位の、機能一辺倒の","Industrial shelving brings a utilitarian edge to the studio.":"工業用の棚が、スタジオに実用本位のテイストを添えている。","Cohesive":"統一感のある、まとまりのある","Repeating the same bronze hardware throughout keeps the apartment cohesive.":"同じブロンズの金具を全体で繰り返し使うことで、部屋に統一感が生まれている。","Visual weight":"視覚的な重さ（ビジュアルウェイト）","A dark velvet sofa carries significant visual weight, balancing the tall windows.":"濃い色のベルベットのソファは大きな視覚的重さをもち、背の高い窓とのバランスを取っている。","Anchor a space":"空間を引き締める（視覚的な重心をつくる）","The oversized Persian rug anchors the seating area.":"大判のペルシャ絨毯が、くつろぎスペースを視覚的に引き締めている。","Maximize the ingress of natural light":"自然光の取り込みを最大限にする","Skylights were added to maximize the ingress of natural light.":"自然光の取り込みを最大限にするため、天窓が追加された。","Soften the acoustics":"音響を和らげる（反響を抑える）","Upholstered wall panels were installed to soften the acoustics.":"音の響きを和らげるため、布張りの壁パネルが設置された。","Pay homage to":"〜に敬意を表する、オマージュを捧げる","The curved staircase pays homage to Art Deco elegance.":"その曲線を描く階段は、アール・デコの優雅さへのオマージュとなっている。","Blur the boundary between":"〜の境界を曖昧にする","Pocket glass doors blur the boundary between the living room and garden.":"壁に引き込めるガラスの引き戸が、リビングと庭の境界を曖昧にしている。","Strike a balance between":"〜のバランスを取る","The renovation strikes a balance between heritage preservation and modern livability.":"この改修は、歴史的遺産の保存と現代的な住みやすさのバランスを取っている。"},"pt":{"Spatial continuity":"continuidade espacial","Removing the partition wall restored spatial continuity between the kitchen and terrace.":"A remoção da parede divisória restaurou a continuidade espacial entre a cozinha e o terraço.","Delineate":"delimitar","A sunken floor and textured rug delineate the lounge from the dining area.":"Um piso rebaixado e um tapete texturizado delimitam a área de estar, separando-a da área de jantar.","Cantilevered":"em balanço","The cantilevered concrete balcony appears to hover effortlessly over the cliffside.":"A sacada de concreto em balanço parece flutuar sem esforço sobre o penhasco.","Rectilinear":"retilíneo","The building's rectilinear geometry contrasts sharply with the organic landscape.":"A geometria retilínea do edifício contrasta fortemente com a paisagem orgânica.","Ergonomic":"ergonômico","The ergonomic kitchen triangle minimizes unnecessary movement while cooking.":"O triângulo de trabalho ergonômico da cozinha minimiza deslocamentos desnecessários na hora de cozinhar.","Threshold":"limiar, zona de transição","The deep timber porch acts as a welcoming threshold between the street and the foyer.":"O profundo alpendre de madeira funciona como um limiar acolhedor entre a rua e o hall de entrada.","Patina":"pátina","Unlacquered brass fixtures were chosen so they woul ves the modernist facade its distinct rhythm.":"不对称的开窗布局赋予这座现代主义立面独特的节奏感。","Unadorned":"毫无装饰的、素净的","The unadorned concrete walls let the art collection take center stage.":"毫无装饰的混凝土墙让艺术藏品成为全场焦点。","Ambient lighting":"环境照明（基础照明）","Concealed LED coves provide soft ambient lighting without harsh glare.":"隐藏式LED灯槽提供柔和的环境照明，没有刺眼的眩光。","Chiaroscuro":"明暗对比（明暗法）","Narrow clerestory windows cast a striking chiaroscuro across the stone corridor.":"狭窄的高侧窗在石砌走廊上投下强烈而引人注目的明暗对比。","Dappled light":"斑驳的光影","A slatted timber pergola filters dappled light onto the courtyard floor.":"木条格栅凉棚将斑驳的光影洒落在庭院地面上。","Diffuse":"漫射、柔化（光线）","Sheer linen drapery helps diffuse the intense afternoon sun.":"轻薄的亚麻窗帘有助于柔化午后强烈的阳光。","Stark":"冷峻的、单调空旷的","Warm oak flooring softens what would otherwise be a stark white gallery.":"温暖的橡木地板柔化了这个原本会显得冷峻单调的白色画廊。","Evocative":"唤起联想的、引人遐想的","The dim, timber-lined bar is evocative of a mid-century Japanese listening room.":"这间昏暗的木饰面酒吧让人联想到二十世纪中叶的日本音乐鉴赏室。","Juxtaposition":"并置（对比鲜明的元素并排放置）","The juxtaposition of exposed brick with sleek blackened steel defines the loft.":"裸露砖墙与光滑的发黑钢材并置，奠定了这间Loft的风格。","Vernacular":"乡土的、地域性的（建筑）","The villa reinterprets Mediterranean vernacular forms using contemporary engineering.":"这座别墅运用当代工程技术，重新诠释了地中海乡土建筑形式。","Austere":"简朴克制的、朴素的","The monastery's austere beauty relies entirely on proportion and natural light.":"修道院简朴的美完全依靠比例与自然光。","Utilitarian":"实用主义的、功能至上的","Industrial shelving brings a utilitarian edge to the studio.":"工业风置物架为工作室增添了一份实用主义气息。","Cohesive":"协调统一的","Repeating the same bronze hardware throughout keeps the apartment cohesive.":"整个公寓重复使用同样的青铜五金件，使空间保持协调统一。","Visual weight":"视觉重量","A dark velvet sofa carries significant visual weight, balancing the tall windows.":"一张深色天鹅绒沙发具有相当的视觉重量，与高大的窗户形成平衡。","Anchor a space":"锚定空间（使空间在视觉上稳定）","The oversized Persian rug anchors the seating area.":"这块超大的波斯地毯在视觉上锚定了会客区。","Maximize the ingress of natural light":"最大限度地引入自然光","Skylights were added to maximize the ingress of natural light.":"     // ----------------------------------------------------------------------------
    // 4. UTILITY HELPERS
    // ----------------------------------------------------------------------------
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /**
     * Replaces the target term/phrase in the example sentence with a clean editorial blank.
     */
    function createFillInBlankSentence(item) {
      const target = item.highlightText || item.term;
      const regex = new RegExp(escapeRegex(target), 'i');
      if (regex.test(item.example)) {
        return item.example.replace(
          regex,
          '<span class="inline-block border-b-2 border-terracotta px-2 mx-0.5 text-terracotta font-semibold tracking-wider">______</span>'
        );
      }
      return item.example;
    }

    /**
     * Highlights the target term/phrase inside the example sentence for the Design Note.
     */
    function highlightExampleSentence(item) {
      const target = item.highlightText || item.term;
      const regex = new RegExp(`(${escapeRegex(target)})`, 'i');
      return item.example.replace(
        regex,
        '<mark class="bg-terracotta-soft text-terracotta-dark font-medium px-1.5 py-0.5 rounded">$1</mark>'
      );
    }

    /**
     * Builds smart multiple-choice options: selects 3 distractors from the SAME category
     * so choices share architectural nuance and grammatical structure.
     */
    function generateOptionsForItem(targetItem) {
      const sameCategoryPool = VOCAB_DATA.filter(
        (v) => v.categoryId === targetItem.categoryId && v.id !== targetItem.id &&
          !(targetItem.notWith || []).includes(v.id)
      );
      const distractors = shuffleArray(sameCategoryPool).slice(0, 3);
      return shuffleArray([targetItem, ...distractors]);
    }

    /**
     * Determines the architectural rank badge based on quiz accuracy percentage.
     */
    function getArchitecturalRank(pct) {
      if (pct >= 90) {
        return {
          title: 'Principal Architect',
          subtitle: 'Masterful command of spatial theory, materiality, and architectural critique.',
          badgeBg: 'bg-sage-soft text-sage border-sage/30',
        };
      }
      if (pct >= 75) {
        return {
          title: 'Senior Designer',
          subtitle: 'Strong editorial fluency across architectural form, light, and composition.',
          badgeBg: 'bg-terracotta-soft text-terracotta-dark border-terracotta/30',
        };
      }
      if (pct >= 55) {
        return {
          title: 'Studio Associate',
          subtitle: 'Solid conceptual foundation—review missed design notes to sharpen precision.',
          badgeBg: 'bg-parchment text-charcoal border-hairline',
        };
      }
      return {
        title: 'Design Apprentice',
        subtitle: 'A promising start. Explore the Illustrated Study Deck to internalize each term.',
        badgeBg: 'bg-parchment text-graphite border-hairline',
      };
    }

    // ----------------------------------------------------------------------------
    // 5. QUIZ ENGINE ACTIONS
    // ----------------------------------------------------------------------------
    function startQuiz(customItems = null) {
      let pool = [];
      if (Array.isArray(customItems) && customItems.length > 0) {
        pool = shuffleArray(customItems);
      } else if (state.selectedCategory === 'all') {
        pool = shuffleArray(VOCAB_DATA);
      } else if (state.selectedCategory === 'quick10') {
        // Balanced 2 terms from each of the 5 categories = 10 terms
        CATEGORIES.forEach((cat) => {
          const catItems = shuffleArray(VOCAB_DATA.filter((v) => v.categoryId === cat.id));
          pool.push(...catItems.slice(0, 2));
        });
        pool = shuffleArray(pool);
      } else {
        pool = shuffleArray(VOCAB_DATA.filter((v) => v.categoryId === state.selectedCategory));
      }

      state.questions = pool.map((item, idx) => {
        let qType = state.questionStyle;
        if (qType === 'mixed') {
          qType = idx % 2 === 0 ? 'definition' : 'context';
        }
        return {
          item,
          questionType: qType,
          options: generateOptionsForItem(item),
        };
      });

      state.view = 'quiz';
      state.currentIndex = 0;
      state.score = 0;
      state.streak = 0;
      state.bestStreak = 0;
      state.answered = false;
      state.selectedOptionId = null;
      state.history = [];
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectAnswer(optionId) {
      if (state.answered) return;
      const currentQ = state.questions[state.currentIndex];
      const isCorrect = optionId === currentQ.item.id;

      state.answered = true;
      state.selectedOptionId = optionId;

      if (isCorrect) {
        state.score += 1;
        state.streak += 1;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      } else {
        state.streak = 0;
      }

      state.history.push({
        item: currentQ.item,
        isCorrect,
        questionType: currentQ.questionType,
      });

      render();
    }

    function nextQuestion() {
      if (!state.answered) return;
      if (state.currentIndex + 1 < state.questions.length) {
        state.currentIndex += 1;
        state.answered = false;
        state.selectedOptionId = null;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        state.view = 'results';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function goHome() {
      state.view = 'home';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

            </div>

            <!-- Study Category Pills -->
            <div class="flex flex-wrap gap-2">
              <button
                type="button"
                onclick="setStudyCategory('all')"
                class="px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors ${
                  state.studyCategory === 'all'
                    ? 'bg-charcoal text-alabaster border-charcoal'
                    : 'bg-alabaster text-graphite border-hairline hover:border-charcoal/40'
                }"
              >
                All 30
              </button>
              ${CATEGORIES.map((c) => {
                const active = state.studyCategory === c.id;
                return `
                  <button
                    type="button"
                    onclick="setStudyCategory('${c.id}')"
                    class="px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors ${
                      active
                        ? 'bg-charcoal text-alabaster border-charcoal'
                        : 'bg-alabaster text-graphite border-hairline hover:border-charcoal/40'
                    }"
                  >
                    ${c.num} &middot; ${c.short}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Illustrated Card Grid -->
          ${
            filtered.length === 0
              ? `
                <div class="bg-paper border border-hairline rounded-2xl p-12 text-center text-graphite">
                  <p class="font-serif text-2xl text-charcoal mb-1">No matching terms found</p>
                  <p class="text-sm">Try clearing your search or switching categories.</p>
                </div>
              `
              : `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${filtered
                    .map((item) => {
                      const isOpen = state.revealedIds.has(item.id);
                      return `
                        <article
                          onclick="toggleStudyCard(${item.id})"
                          role="button"
                          tabindex="0"
                          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleStudyCard(${item.id});}"
                          class="group cursor-pointer bg-paper border ${
                            isOpen ? 'border-terracotta/60 ring-1 ring-terracotta/20' : 'border-hairline hover:border-charcoal/40'
                          } rounded-2xl overflow-hidden shadow-editorial hover:shadow-card transition-all flex flex-col focus:outline-none focus:ring-2 focus:ring-terracotta/40"
                        >
                          <!-- Illustration Frame -->
                          <div class="p-3 pb-0">
                            <div class="aspect-[16/10] w-full rounded-xl overflow-hidden border border-hairline/80 bg-alabaster">
                              ${item.svg}
                            </div>
                          </div>

                          <!-- Card Body -->
                          <div class="p-4 flex-1 flex flex-col">
                            <div class="flex items-center justify-between gap-2 mb-1.5">
                              <span class="text-[10px] uppercase tracking-[0.16em] text-terracotta font-semibold truncate">
                                ${item.category}
                              </span>
                              <span class="text-[11px] font-mono text-stone">#${String(item.id).padStart(2, '0')}</span>
                            </div>

                            <h3 class="font-serif text-2xl font-semibold text-charcoal group-hover:text-terracotta transition-colors leading-snug">
                              ${item.term}
                            </h3>

                            ${
                              isOpen
                                ? `
                                  <div class="mt-3 pt-3 border-t border-hairline space-y-2.5 animate-fade-up">
                                    <p class="text-xs sm:text-sm text-charcoal leading-relaxed">
                                      ${item.meaning}
                                    </p>
                                    <p class="text-xs text-graphite italic leading-relaxed bg-alabaster p-2.5 rounded-lg border border-hairline/70">
                                      &ldquo;${highlightExampleSentence(item)}&rdquo;
                                    </p>
                                    ${feGloss(item)}
                                  </div>
                                `
                                : `
                                  <div class="mt-auto pt-4 flex items-center justify-between text-xs text-stone">
                                    <span>Tap to reveal definition &amp; example</span>
                                    <svg class="w-4 h-4 text-stone group-hover:text-terracotta group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                                    </svg>
                                  </div>
                                `
                            }
                          </div>
                        </article>
                      `;
                    })
                    .join('')}
                </div>
              `
          }
        </div>
      `;
    }

    // ---------------- VIEW 2: INTERACTIVE QUIZ SCREEN ----------------
    function renderQuizView() {
      const total = state.questions.length;
      const currentQ = state.questions[state.currentIndex];
      const { item, questionType, options } = currentQ;
      const progressPct = Math.round(((state.currentIndex + (state.answered ? 1 : 0)) / total) * 100);
      const isLast = state.currentIndex + 1 === total;
      const wasCorrect = state.answered && state.selectedOptionId === item.id;

      appRoot.innerHTML = `
        <section class="max-w-3xl mx-auto space-y-6 animate-fade-up">
          <!-- Top Status Strip: Counter, Progress Bar, Score & Streak -->
          <div class="bg-paper border border-hairline rounded-2xl p-4 sm:px-6 shadow-editorial space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3 text-xs sm:text-sm">
              <div class="flex items-center gap-3">
                <span class="font-mono font-medium text-charcoal bg-parchment px-2.5 py-1 rounded-md">
                  ${String(state.currentIndex + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}
                </span>
                <span class="text-graphite hidden sm:inline">${item.category}</span>
              </div>

              <div class="flex items-center gap-3 sm:gap-4">
                <span class="inline-flex items-center gap-1.5 text-charcoal font-medium">
                  <span class="text-stone font-normal">Score</span>
                  <span class="font-mono">${state.score}</span>
                </span>
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ${
                  state.streak >= 2
                    ? 'bg-terracotta-soft text-terracotta-dark border border-terracotta/25'
                    : 'bg-alabaster text-graphite border border-hairline'
                }">
                  <span>Streak</span>
                  <span class="font-mono font-semibold">${state.streak}</span>
                </span>
              </div>
            </div>

            <!-- Thin Architectural Progress Bar -->
            <div class="w-full h-1.5 bg-parchment rounded-full overflow-hidden">
              <div
                class="h-full bg-terracotta rounded-full transition-all duration-500 ease-out"
                style="width: ${progressPct}%"
              ></div>
            </div>
          </div>

          <!-- Main Illustrated Question Card -->
          <div class="bg-paper border border-hairline rounded-2xl shadow-card overflow-hidden">
            <!-- Prominent Architectural Illustration Frame -->
            <div class="p-4 sm:p-6 pb-0">
              <div class="relative rounded-xl overflow-hidden border border-hairline bg-alabaster max-w-xl mx-auto aspect-[16/10]">
                ${item.svg}
                <span class="fe-cat absolute top-2.5 left-2.5 px-2.5 py-1 rounded-md bg-paper/90 backdrop-blur-sm border border-hairline text-[10px] uppercase tracking-[0.16em] text-charcoal font-semibold">
                  <span class="sm:hidden">${(CATEGORIES.find((c) => c.id === item.categoryId) || {}).short || item.category}</span><span class="hidden sm:inline">${item.category}</span>
                </span>
                <span class="absolute top-2.5 right-2.5 px-2.5 py-1 rounded-md bg-charcoal/85 text-alabaster text-[10px] uppercase tracking-[0.14em] font-medium">
                  ${questionType === 'definition' ? 'Definition' : 'In Context'}
                </span>
              </div>
            </div>

            <!-- Prompt Area -->
            <div class="p-5 sm:p-8 space-y-6">
              <div class="text-center max-w-2xl mx-auto space-y-2">
                <p class="text-[11px] uppercase tracking-[0.2em] text-stone font-medium">
                  ${
                    questionType === 'definition'
                      ? 'Which architectural term matches this meaning &amp; drawing?'
                      : 'Select the term or phrase that completes this editorial critique:'
                  }
                </p>
                <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-charcoal leading-snug">
                  ${
                    questionType === 'definition'
                      ? item.meaning
                      : `&ldquo;${createFillInBlankSentence(item)}&rdquo;`
                  }
                </h2>
              </div>

              <!-- 4 Clickable Answer Cards -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                ${options
                  .map((opt, idx) => {
                    const isSelected = state.selectedOptionId === opt.id;
                    const isCorrectOpt = opt.id === item.id;

                    let cardClasses =
                      'bg-alabaster border-hairline text-charcoal hover:border-terracotta hover:bg-paper cursor-pointer active:scale-[0.99]';
                    let badgeClasses = 'bg-paper border-hairline text-graphite';
                    let statusIcon = '';

                    if (state.answered) {
                      if (isCorrectOpt) {
                        cardClasses =
                          'bg-sage-soft border-sage text-charcoal ring-1 ring-sage/40 animate-soft-pop cursor-default';
                        badgeClasses = 'bg-sage border-sage text-alabaster';
                        statusIcon = `
                          <svg class="w-5 h-5 text-sage shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                          </svg>
                        `;
                      } else if (isSelected && !isCorrectOpt) {
                        cardClasses =
                          'bg-terracotta-soft border-terracotta text-charcoal animate-subtle-shake cursor-default';
                        badgeClasses = 'bg-terracotta border-terracotta text-alabaster';
                        statusIcon = `
                          <svg class="w-5 h-5 text-terracotta shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                          </svg>
                        `;
                      } else {
                        cardClasses = 'bg-alabaster/50 border-hairline/70 text-stone opacity-65 cursor-default';
                        badgeClasses = 'bg-parchment border-hairline text-stone';
                      }
                    }

                    return `
                      <button
                        type="button"
                        onclick="selectAnswer(${opt.id})"
                        ${state.answered ? 'disabled' : ''}
                        class="w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-terracotta/40 ${cardClasses}"
                      >
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-7 h-7 rounded-lg border text-xs font-mono font-semibold flex items-center justify-center shrink-0 transition-colors ${badgeClasses}">
                            ${idx + 1}
                          </span>
                          <span class="font-medium text-sm sm:text-base leading-snug">
                            ${opt.term}
                          </span>
                        </div>
                        ${statusIcon}
                      </button>
                    `;
                  })
                  .join('')}
              </div>

              <!-- Expanded Design Note Feedback Panel -->
              ${
                state.answered
                  ? `
                    <div class="mt-6 rounded-xl border ${
                      wasCorrect ? 'border-sage/40 bg-sage-soft/50' : 'border-terracotta/40 bg-terracotta-soft/45'
                    } p-5 space-y-4 animate-fade-up">
                      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span class="inline-flex items-center gap-1.5 text-xs uppercase tracking-[0.16em] font-semibold ${
                            wasCorrect ? 'text-sage' : 'text-terracotta-dark'
                          }">
                            ${wasCorrect ? 'Correct Identification' : 'Design Note Correction'}
                          </span>
                          <span class="text-stone">&middot;</span>
                          <span class="font-serif text-xl font-semibold text-charcoal">${item.term}</span>
                        </div>
                      </div>

                      <div class="space-y-2 text-sm">
                        <p class="text-charcoal leading-relaxed">
                          <span class="font-semibold text-graphite">Meaning:</span> ${item.meaning}
                        </p>
                        <p class="text-graphite italic leading-relaxed bg-paper/90 p-3 rounded-lg border border-hairline">
                          &ldquo;${highlightExampleSentence(item)}&rdquo;
                        </p>
                        ${feGloss(item)}
                      </div>

                      <div class="flex justify-end pt-1">
                        <button
                          type="button"
                          onclick="nextQuestion()"
                          class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-charcoal hover:bg-terracotta text-alabaster text-sm font-medium transition-all shadow-sm"
                        >
                          <span>${isLast ? 'View Studio Results' : 'Next Question'}</span>
                          <span aria-hidden="true">&rarr;</span>
                        </button>
                      </div>
                    </div>
                  `
                  : ''
              }
            </div>
          </div>
        </section>
      `;
    }

    // ---------------- VIEW 3: RESULTS & CATEGORY ANALYTICS ----------------
    function renderResultsView() {
      const total = state.history.length;
      const correctCount = state.history.filter((h) => h.isCorrect).length;
      const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      const rank = getArchitecturalRank(pct);
      const missedItems = state.history.filter((h) => !h.isCorrect).map((h) => h.item);

      // Compute category performance breakdown for tested categories
      const categoryBreakdown = CATEGORIES.map((cat) => {
        const entries = state.history.filter((h) => h.item.categoryId === cat.id);
        if (entries.length === 0) return null;
        const catCorrect = entries.filter((h) => h.isCorrect).length;
        const catPct = Math.round((catCorrect / entries.length) * 100);
        return {
          ...cat,
          correct: catCorrect,
          total: entries.length,
          pct: catPct,
        };
      }).filter(Boolean);

      appRoot.innerHTML = `
        <section class="max-w-3xl mx-auto space-y-6 animate-fade-up">
          <!-- Main Score & Rank Summary Card -->
          <div class="bg-paper border border-hairline rounded-2xl p-6 sm:p-10 shadow-card text-center space-y-6">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border text-xs uppercase tracking-[0.16em] font-semibold ${rank.badgeBg}">
              <span>Architectural Rank</span>
              <span>&middot;</span>
              <span>${rank.title}</span>
            </div>

            <div class="space-y-2">
              <h1 class="font-serif text-5xl sm:text-6xl font-semibold text-charcoal tracking-tight">
                ${pct}%
              </h1>
              <p class="text-sm sm:text-base text-graphite max-w-md mx-auto">
                ${rank.subtitle}
              </p>
            </div>

            <!-- Key Metrics Strip -->
            <div class="grid grid-cols-3 gap-3 max-w-md mx-auto pt-2">
              <div class="p-3.5 rounded-xl bg-alabaster border border-hairline">
                <div class="font-serif text-2xl font-semibold text-charcoal">${correctCount} / ${total}</div>
                <div class="text-[11px] uppercase tracking-[0.14em] text-stone mt-0.5">Correct</div>
              </div>
              <div class="p-3.5 rounded-xl bg-alabaster border border-hairline">
                <div class="font-serif text-2xl font-semibold text-terracotta">${state.bestStreak}</div>
                <div class="text-[11px] uppercase tracking-[0.14em] text-stone mt-0.5">Best Streak</div>
              </div>
              <div class="p-3.5 rounded-xl bg-alabaster border border-hairline">
                <div class="font-serif text-2xl font-semibold text-sage">${missedItems.length}</div>
                <div class="text-[11px] uppercase tracking-[0.14em] text-stone mt-0.5">To Review</div>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-3">
              ${
                missedItems.length > 0
                  ? `
                    <button
                      type="button"
                      onclick="retryMissedQuestions()"
                      class="w-full sm:w-auto px-6 py-3 rounded-xl bg-terracotta hover:bg-terracotta-dark text-alabaster text-sm font-medium transition-all shadow-sm"
                    >
                      Retry Missed Questions (${missedItems.length})
                    </button>
                  `
                  : ''
              }
              <button
                type="button"
                onclick="startQuiz()"
                class="w-full sm:w-auto px-6 py-3 rounded-xl bg-charcoal hover:bg-charcoal/90 text-alabaster text-sm font-medium transition-all"
              >
                Play Again
              </button>
              <button
                type="button"
                onclick="goHome()"
                class="w-full sm:w-auto px-6 py-3 rounded-xl border border-hairline bg-alabaster hover:border-charcoal/40 text-charcoal text-sm font-medium transition-all"
              >
                Return to Menu
              </button>
            </div>
          </div>

          <!-- Category Performance Breakdown -->
          <div class="bg-paper border border-hairline rounded-2xl p-6 sm:p-8 shadow-editorial space-y-5">
            <div class="flex items-baseline justify-between">
              <h2 class="font-serif text-2xl font-semibold text-charcoal">Category Performance</h2>
              <span class="text-xs uppercase tracking-[0.14em] text-stone">Accuracy Breakdown</span>
            </div>

            <div class="space-y-4">
              ${categoryBreakdown
                .map(
                  (cat) => `
                  <div class="space-y-1.5">
                    <div class="flex items-center justify-between text-sm">
                      <span class="font-medium text-charcoal">
                        <span class="text-stone font-mono text-xs mr-1.5">${cat.num}</span>
                        ${cat.name}
                      </span>
                      <span class="font-mono text-xs text-graphite">
                        ${cat.correct}/${cat.total} (${cat.pct}%)
                      </span>
                    </div>
                    <div class="w-full h-2 bg-parchment rounded-full overflow-hidden">
                      <div
                        class="h-full rounded-full transition-all duration-700 ${
                          cat.pct >= 75 ? 'bg-sage' : cat.pct >= 50 ? 'bg-terracotta' : 'bg-charcoal/60'
                        }"
                        style="width: ${cat.pct}%"
                      ></div>
                    </div>
                  </div>
                `
                )
                .join('')}
            </div>
          </div>

          <!-- Missed Terms Illustrated Review List (if any) -->
          ${
            missedItems.length > 0
              ? `
                <div class="bg-paper border border-hairline rounded-2xl p-6 sm:p-8 shadow-editorial space-y-5">
                  <div class="flex items-baseline justify-between">
                    <h2 class="font-serif text-2xl font-semibold text-charcoal">Design Notes to Revisit</h2>
                    <span class="text-xs uppercase tracking-[0.14em] text-terracotta">${missedItems.length} Missed</span>
                  </div>

                  <div class="space-y-4">
                    ${missedItems
                      .map(
                        (item) => `
                        <div class="p-4 rounded-xl bg-alabaster border border-hairline flex flex-col sm:flex-row gap-4 items-start">
                          <div class="w-full sm:w-36 shrink-0 aspect-[16/10] rounded-lg overflow-hidden border border-hairline bg-paper">
                            ${item.svg}
                          </div>
                          <div class="space-y-1.5">
                            <div class="flex items-center gap-2 flex-wrap">
                              <h3 class="font-serif text-xl font-semibold text-charcoal">${item.term}</h3>
                              <span class="text-[10px] uppercase tracking-[0.14em] text-stone">${item.category}</span>
                            </div>
                            <p class="text-xs sm:text-sm text-charcoal">${item.meaning}</p>
                            <p class="text-xs text-graphite italic">&ldquo;${highlightExampleSentence(item)}&rdquo;</p>
                            ${feGloss(item)}
                          </div>
                        </div>
                      `
                      )
                      .join('')}
                  </div>
                </div>
              `
              : ''
          }
        </section>
      `;
    }

    // ----------------------------------------------------------------------------
    // 7. INTERACTIVE UI HANDLERS (EXPOSED GLOBALLY FOR INLINE ONCLICK)
    // ----------------------------------------------------------------------------
    window.setHomeMode = function (mode) {
      state.mode = mode;
      render();
    };

    window.setSelectedCategory = function (catId) {
      state.selectedCategory = catId;
      render();
    };

    window.setQuestionStyle = function (styleId) {
      state.questionStyle = styleId;
      render();
    };

    window.setStudyCategory = function (catId) {
      state.studyCategory = catId;
      render();
    };

    window.handleStudySearch = function (val) {
      state.studySearch = val;
      render();
      // Preserve focus and cursor at end of search input
      const input = document.getElementById('studySearchInput');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    };

    window.toggleStudyCard = function (id) {
      if (state.revealedIds.has(id)) {
        state.revealedIds.delete(id);
      } else {
        state.revealedIds.add(id);
      }
      render();
    };

    window.toggleRevealAllStudy = function (reveal) {
      const filtered = VOCAB_DATA.filter((item) => {
        const matchesCat = state.studyCategory === 'all' || item.categoryId === state.studyCategory;
        const q = state.studySearch.trim().toLowerCase();
        const matchesSearch =
          !q ||
          item.term.toLowerCase().includes(q) ||
          item.meaning.toLowerCase().includes(q) ||
          item.example.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });
      if (reveal) {
        filtered.forEach((i) => state.revealedIds.add(i.id));
      } else {
        filtered.forEach((i) => state.revealedIds.delete(i.id));
      }
      render();
    };

    window.startQuizFromStudy = function () {
      const filtered = VOCAB_DATA.filter((item) => {
        const matchesCat = state.studyCategory === 'all' || item.categoryId === state.studyCategory;
        const q = state.studySearch.trim().toLowerCase();
        const matchesSearch =
          !q ||
          item.term.toLowerCase().includes(q) ||
          item.meaning.toLowerCase().includes(q) ||
          item.example.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });
      if (filtered.length > 0) {
        startQuiz(filtered);
      }
    };

    window.retryMissedQuestions = function () {
      const missed = state.history.filter((h) => !h.isCorrect).map((h) => h.item);
      if (missed.length > 0) {
        startQuiz(missed);
      }
    };

    window.startQuiz = startQuiz;
    window.selectAnswer = selectAnswer;
    window.nextQuestion = nextQuestion;
    window.goHome = goHome;

    // ----------------------------------------------------------------------------
    // 8. KEYBOARD SHORTCUTS (1-4 FOR ANSWERS, ENTER / RIGHT ARROW FOR NEXT)
    // ----------------------------------------------------------------------------
    document.addEventListener('keydown', (e) => {
      if (state.view !== 'quiz') return;
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

      const currentQ = state.questions[state.currentIndex];
      if (!currentQ) return;

      if (!state.answered && ['1', '2', '3', '4'].includes(e.key)) {
        const idx = parseInt(e.key, 10) - 1;
        if (currentQ.options[idx]) {
          e.preventDefault();
          selectAnswer(currentQ.options[idx].id);
        }
      } else if (state.answered && (e.key === 'Enter' || e.key === 'ArrowRight')) {
        e.preventDefault();
        nextQuestion();
      }
    });

    brandHomeBtn.addEventListener('click', goHome);

    // ----------------------------------------------------------------------------
    // 9. MASTER RENDER DISPATCHER
    // ----------------------------------------------------------------------------
    function render() {
      renderHeaderControls();
      try {
        if (state.view === 'home') {
          renderHomeView();
        } else if (state.view === 'quiz') {
          renderQuizView();
        } else if (state.view === 'results') {
          renderResultsView();
        }
      } catch (err) {
        appRoot.innerHTML = `
          <div class="bg-paper border border-terracotta/40 rounded-2xl p-8 text-center space-y-3">
            <h2 class="font-serif text-2xl text-charcoal">Something went wrong</h2>
            <p class="text-sm text-graphite">${err.message}</p>
            <button type="button" onclick="goHome()" class="px-5 py-2.5 rounded-xl bg-charcoal text-alabaster text-sm">
              Return to Menu
            </button>
          </div>
        `;
      }
    }

    // Initial Boot
    render();
  </script>
</body>
</html>
