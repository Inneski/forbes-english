<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forbes English | Decision-Making Under Uncertainty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,500;9..144,1,300&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d1a0f;
    --bg-mid:    #121f14;
    --green-900: #162019;
    --green-800: #1e2e20;
    --green-700: #264d2a;
    --green-500: #3a7a40;
    --sage:      #6dab74;
    --mist:      #a8c4aa;
    --amber:     #c9922a;
    --amber-lt:  #e0b05a;
    --paper:     #f0ede4;
    --paper-dim: #c8c3b4;
    --ok:        #5fae8a;
    --ok-bg:     #0f2820;
    --bad:       #b85c52;
    --bad-bg:    #2a1210;
    --shadow:    0 20px 50px -16px rgba(0,0,0,0.7);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(ellipse at 20% 5%, rgba(58,122,64,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 85%, rgba(201,146,42,0.07) 0%, transparent 45%),
      linear-gradient(170deg, var(--bg) 0%, var(--bg-mid) 60%, #0a1a0c 100%);
    color: var(--paper);
    min-height: 100vh;
    line-height: 1.55;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 38px 22px 80px; }

  /* ---- LOGO ---- */
  .logo-row { display: flex; justify-content: center; margin-bottom: 32px; }

  /* ---- LESSON HEADER ---- */
  .lesson-head { text-align: center; margin-bottom: 36px; }
  .lesson-head .eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber-lt);
    border: 1px solid rgba(201,146,42,0.35);
    border-radius: 30px;
    padding: 5px 16px;
    margin-bottom: 16px;
    background: rgba(201,146,42,0.06);
  }
  .lesson-head h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 2.3rem;
    margin: 0 0 8px;
    color: var(--paper);
    line-height: 1.2;
  }
  .lesson-head h1 em {
    font-style: italic;
    color: var(--amber-lt);
  }
  .lesson-head p {
    color: var(--mist);
    font-size: 0.97rem;
    max-width: 560px;
    margin: 0 auto;
  }

  /* ---- TABS ---- */
  .mode-tabs {
    display: flex; gap: 10px; justify-content: center;
    margin-bottom: 30px; flex-wrap: wrap;
  }
  .mode-tab {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(168,196,170,0.16);
    color: var(--mist);
    padding: 10px 22px; border-radius: 10px;
    font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: .18s;
    font-family: 'Inter', sans-serif;
  }
  .mode-tab:hover { border-color: var(--sage); color: var(--paper); }
  .mode-tab.active {
    background: linear-gradient(135deg, var(--green-700), var(--green-500));
    color: #fff; border-color: transparent;
    box-shadow: 0 8px 20px -6px rgba(58,122,64,0.5);
  }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- CARD ---- */
  .card {
    background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    border: 1px solid rgba(168,196,170,0.12);
    border-radius: 18px;
    padding: 30px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }

  /* ---- QUIZ STATUS ---- */
  .status-bar {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
  }
  .progress-wrap { flex: 1; min-width: 180px; }
  .progress-label { font-size: 0.78rem; color: var(--mist); margin-bottom: 6px; }
  .progress-track { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--sage), var(--amber-lt)); border-radius: 4px; transition: width .4s ease; }
  .score-chip {
    background: rgba(201,146,42,0.1);
    border: 1px solid rgba(201,146,42,0.3);
    color: var(--amber-lt);
    padding: 8px 18px; border-radius: 10px;
    font-weight: 700; font-size: 0.9rem; white-space: nowrap;
  }

  /* ---- QUESTION ---- */
  .q-illustration { display: flex; justify-content: center; margin-bottom: 20px; }
  .q-illustration svg { width: 100%; max-width: 400px; height: auto; }
  .q-context {
    font-size: 0.88rem; color: var(--mist);
    background: rgba(255,255,255,0.03);
    border-left: 3px solid var(--green-500);
    border-radius: 6px;
    padding: 10px 14px; margin-bottom: 16px;
    font-style: italic;
    line-height: 1.6;
  }
  .q-text {
    font-size: 1.14rem; font-weight: 600;
    color: var(--paper); margin-bottom: 20px; line-height: 1.45;
  }

  .options { display: grid; gap: 11px; margin-bottom: 20px; }
  .option {
    display: flex; align-items: flex-start; gap: 13px;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid rgba(168,196,170,0.15);
    border-radius: 11px; padding: 14px 17px;
    cursor: pointer; transition: .15s; text-align: left;
    font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--paper);
  }
  .option:hover:not(.locked) { border-color: var(--sage); background: rgba(109,171,116,0.07); }
  .option .letter {
    flex-shrink: 0; width: 28px; height: 28px;
    border-radius: 7px; background: rgba(168,196,170,0.1);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.83rem; color: var(--mist);
  }
  .option.selected { border-color: var(--sage); background: rgba(109,171,116,0.1); }
  .option.correct { border-color: var(--ok); background: var(--ok-bg); }
  .option.correct .letter { background: var(--ok); color: #0a1e14; }
  .option.incorrect { border-color: var(--bad); background: var(--bad-bg); }
  .option.incorrect .letter { background: var(--bad); color: #1a0a09; }
  .option.locked { cursor: default; }

  .fill-input {
    width: 100%; padding: 12px 16px;
    border-radius: 10px; border: 1.5px solid rgba(168,196,170,0.22);
    background: rgba(255,255,255,0.04); color: var(--paper);
    font-size: 1rem; font-family: 'Inter', sans-serif; margin-bottom: 16px;
  }
  .fill-input:focus { outline: none; border-color: var(--sage); }
  .fill-input.correct { border-color: var(--ok); background: var(--ok-bg); }
  .fill-input.incorrect { border-color: var(--bad); background: var(--bad-bg); }

  .feedback {
    border-radius: 11px; padding: 15px 17px;
    font-size: 0.92rem; line-height: 1.55;
    margin-bottom: 18px; display: none;
  }
  .feedback.show { display: block; animation: fadeIn .3s ease; }
  .feedback.ok { background: var(--ok-bg); border: 1px solid rgba(95,174,138,0.35); color: #b8e0ce; }
  .feedback.bad { background: var(--bad-bg); border: 1px solid rgba(184,92,82,0.35); color: #f0c4bf; }
  .feedback strong { color: var(--paper); }

  .phrase-box {
    background: rgba(201,146,42,0.07);
    border: 1px solid rgba(201,146,42,0.22);
    border-radius: 10px;
    padding: 11px 15px;
    margin-top: 10px;
    font-size: 0.86rem;
    color: var(--amber-lt);
  }
  .phrase-box strong { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 5px; color: var(--amber); }

  .btn-row { display: flex; justify-content: flex-end; gap: 10px; }
  .btn {
    padding: 11px 24px; border-radius: 10px; border: none;
    font-weight: 700; font-size: 0.93rem;
    cursor: pointer; font-family: 'Inter', sans-serif; transition: .16s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--amber), var(--amber-lt));
    color: #1a1000; box-shadow: 0 8px 18px -6px rgba(201,146,42,0.4);
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: rgba(255,255,255,0.05); color: var(--paper);
    border: 1px solid rgba(168,196,170,0.2);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.09); }
  .btn-check {
    background: linear-gradient(135deg, var(--green-700), var(--green-500));
    color: #fff;
  }
  .btn-check:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- RESULTS ---- */
  .results { text-align: center; padding: 16px 10px; }
  .results .ring { width: 136px; height: 136px; margin: 0 auto 20px; }
  .results h2 { font-family: 'Fraunces', serif; font-weight: 300; font-size: 1.8rem; color: var(--paper); margin: 0 0 10px; }
  .results p { color: var(--mist); font-size: 0.97rem; max-width: 420px; margin: 0 auto 26px; }

  /* ---- SPEAKING / PART 2 ---- */
  .station-nav { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
  .station-pill {
    flex-shrink: 0;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(168,196,170,0.15);
    color: var(--mist); padding: 9px 16px;
    border-radius: 9px; font-size: 0.83rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: .15s;
    font-family: 'Inter', sans-serif;
  }
  .station-pill.active { background: linear-gradient(135deg, var(--amber), var(--amber-lt)); color: #1a1000; border-color: transparent; }
  .station-pill:hover:not(.active) { border-color: var(--sage); }

  .station-title { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .station-icon { width: 34px; height: 34px; flex-shrink: 0; }
  .station-title h3 { font-family: 'Fraunces', serif; font-weight: 300; font-size: 1.4rem; margin: 0; color: var(--paper); }
  .station-meta { color: var(--mist); font-size: 0.85rem; margin-bottom: 22px; }

  .prompt-card {
    background: rgba(109,171,116,0.06);
    border-left: 3px solid var(--green-500);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 14px;
    font-size: 0.96rem; line-height: 1.65;
  }
  .prompt-card.amber {
    background: rgba(201,146,42,0.07);
    border-left-color: var(--amber);
  }
  .prompt-card.solo {
    font-size: 1.08rem; font-family: 'Fraunces', serif;
    font-weight: 300; font-style: italic; color: var(--amber-lt);
    border-left: none; border: 1px solid rgba(201,146,42,0.2);
    text-align: center; padding: 24px 26px;
    background: rgba(201,146,42,0.05);
  }
  .thread-label {
    font-size: 0.73rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--mist); opacity: 0.55;
    margin: 3px 0 10px 4px;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .vocab-chip {
    background: rgba(168,196,170,0.08);
    border: 1px solid rgba(168,196,170,0.2);
    border-radius: 20px; padding: 5px 13px;
    font-size: 0.82rem; color: var(--mist);
  }
  .station-footer-nav { display: flex; justify-content: space-between; margin-top: 26px; }

  /* ---- ROLEPLAY ---- */
  .rp-shell { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: start; }
  @media(max-width:640px) { .rp-shell { grid-template-columns: 1fr; } }
  .rp-sidebar { display: flex; flex-direction: column; gap: 8px; }
  .rp-thumb {
    background: rgba(255,255,255,0.03);
    border: 1.5px solid rgba(168,196,170,0.13);
    border-radius: 12px; padding: 14px 16px;
    cursor: pointer; transition: .15s;
  }
  .rp-thumb:hover { border-color: var(--sage); background: rgba(109,171,116,0.06); }
  .rp-thumb.active { border-color: var(--amber); background: rgba(201,146,42,0.07); }
  .rp-thumb-num { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mist); opacity: 0.6; margin-bottom: 4px; }
  .rp-thumb-title { font-size: 0.88rem; font-weight: 600; color: var(--paper); line-height: 1.35; }
  .rp-thumb-tag { display: inline-block; margin-top: 6px; font-size: 0.71rem; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .tag-strategic { background: rgba(58,122,64,0.2); color: #a0d4a6; }
  .tag-pressure  { background: rgba(184,92,82,0.18); color: #f0c4bf; }
  .tag-internal  { background: rgba(109,171,116,0.18); color: #9ad4a0; }
  .tag-external  { background: rgba(201,146,42,0.18); color: var(--amber-lt); }

  .rp-card {
    background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border: 1px solid rgba(168,196,170,0.13);
    border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
  }
  .rp-card-top { padding: 28px 28px 22px; }
  .rp-role-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(201,146,42,0.1);
    border: 1px solid rgba(201,146,42,0.28);
    border-radius: 30px; padding: 7px 16px;
    font-size: 0.79rem; font-weight: 700;
    color: var(--amber-lt); letter-spacing: 0.04em;
    text-transform: uppercase; margin-bottom: 18px;
  }
  .rp-scenario-title {
    font-family: 'Fraunces', serif; font-weight: 300;
    font-size: 1.5rem; color: var(--paper); margin: 0 0 8px; line-height: 1.3;
  }
  .rp-context { font-size: 0.95rem; color: var(--paper-dim); line-height: 1.65; margin-top: 16px; }
  .rp-divider { height: 1px; background: rgba(168,196,170,0.09); margin: 0 28px; }
  .rp-objectives { padding: 22px 28px; }
  .rp-objectives-label {
    font-size: 0.71rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--sage); font-weight: 700; margin-bottom: 14px;
  }
  .rp-obj-list { display: flex; flex-direction: column; gap: 10px; }
  .rp-obj { display: flex; gap: 12px; align-items: flex-start; font-size: 0.92rem; color: var(--paper-dim); line-height: 1.5; }
  .rp-obj-dot { flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); margin-top: 7px; }
  .rp-divider2 { height: 1px; background: rgba(168,196,170,0.07); margin: 0 28px; }
  .rp-listen { padding: 18px 28px 24px; background: rgba(0,0,0,0.15); }
  .rp-listen-label { font-size: 0.69rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mist); opacity: 0.5; font-weight: 700; margin-bottom: 10px; }
  .rp-listen-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .rp-listen-chip { font-size: 0.81rem; color: var(--mist); opacity: 0.7; background: rgba(168,196,170,0.05); border: 1px solid rgba(168,196,170,0.12); border-radius: 20px; padding: 5px 13px; font-style: italic; }

  footer { text-align: center; color: rgba(168,196,170,0.35); font-size: 0.77rem; margin-top: 44px; }
</style>
</head>

<div class="wrap">

  <!-- LOGO -->
  <div class="logo-row">
    <svg viewBox="0 0 230 90" width="220" xmlns="http://www.w3.org/2000/svg">
      <text x="115" y="40" text-anchor="middle" font-family="Fraunces, serif" font-size="36" font-weight="300" fill="#f0ede4" letter-spacing="1">Forbes</text>
      <line x1="35" y1="54" x2="195" y2="54" stroke="#c9922a" stroke-width="1.4"/>
      <text x="115" y="78" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#c9922a" letter-spacing="4">ENGLISH</text>
    </svg>
  </div>

  <!-- HEADER -->
  <div class="lesson-head">
    <span class="eyebrow">C1 · Decision-Making Under Uncertainty</span>
    <h1>When You Don't Have<br><em>Enough Information</em></h1>
    <p>Vocabulary, discussion, and roleplay for product managers who need to make calls, defend decisions, and navigate incomplete data — in English.</p>
  </div>

  <!-- TABS -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="quiz">📋 Part 1 — Vocabulary in Context</button>
    <button class="mode-tab" data-mode="speak">🎙️ Part 2 — Discussion Questions</button>
    <button class="mode-tab" data-mode="roleplay">🎭 Part 3 — Roleplay Scenarios</button>
  </div>

  <!-- ===== PART 1: QUIZ ===== -->
  <div class="panel active" id="panel-quiz">
    <div class="card" id="quizCard">
      <div class="status-bar">
        <div class="progress-wrap">
          <div class="progress-label" id="progLabel">Question 1 of 9</div>
          <div class="progress-track"><div class="progress-fill" id="progFill" style="width:11%"></div></div>
        </div>
        <div class="score-chip" id="scoreChip">Score: 0 / 9</div>
      </div>
      <div id="questionArea"></div>
    </div>
    <div class="card results" id="resultsCard" style="display:none;">
      <div class="ring" id="resultsRing"></div>
      <h2 id="resultsTitle"></h2>
      <p id="resultsMsg"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-secondary" onclick="restartQuiz()">↻ Restart</button>
      </div>
    </div>
  </div>

  <!-- ===== PART 2: DISCUSSION ===== -->
  <div class="panel" id="panel-speak">
    <div class="card">
      <div class="station-nav" id="stationNav"></div>
      <div id="stationContent"></div>
    </div>
  </div>

  <!-- ===== PART 3: ROLEPLAY ===== -->
  <div class="panel" id="panel-roleplay">
    <div class="rp-shell">
      <div class="rp-sidebar" id="rpSidebar"></div>
      <div class="rp-main" id="rpMain"></div>
    </div>
  </div>

  <footer>Forbes English — Decision-Making Series</footer>
</div>

<script>
/* =====================================================================
   SHARED UTILITIES
===================================================================== */
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.mode).classList.add('active');
  });
});

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =====================================================================
   PART 1 — VOCABULARY IN CONTEXT
   Each question embeds the target word in a realistic PM scenario.
===================================================================== */
const QUIZ_DATA = [
  {
    type: 'mc',
    scene: 'In a product review meeting, your CFO says:',
    quote: '"We need to weigh up the ______ here — we can invest in the new line or protect cash reserves, but not both."',
    question: 'Which word completes what the CFO said?',
    options: ['trade-off', 'shortfall', 'milestone', 'feedback'],
    correct: 0,
    explanation: 'A trade-off is a situation where gaining one thing requires giving up another. The CFO is describing a classic resource decision: investing versus protecting cash. The other words describe different concepts — a shortfall is a deficit, a milestone is a target point, and feedback is information received.',
    phrase: 'Try it: "The trade-off between speed and quality is something we face on every launch."'
  },
  {
    type: 'mc',
    scene: 'You are explaining a risky product decision to your director:',
    quote: '"I know the data is thin, but my ______ tells me this segment is underserved — I have seen this pattern before in Germany."',
    question: 'Which phrase fits the gap?',
    options: ['gut feeling', 'risk appetite', 'contingency plan', 'confidence level'],
    correct: 0,
    explanation: 'Gut feeling means an instinctive sense not based on explicit data — exactly what the speaker is describing. Risk appetite is how much risk an organisation is willing to accept. A contingency plan is a backup plan. Confidence level is a statistical term. Only gut feeling fits the context of personal experience-based instinct.',
    phrase: 'Try it: "My gut feeling is that the Irish market is ready, but I want one more round of interviews before we commit."'
  },
  {
    type: 'mc',
    scene: 'Your team is discussing how much uncertainty to accept before launching:',
    quote: '"The question is whether our ______ as a business allows us to move forward with only 60% of the data we normally want."',
    question: 'Which term fits?',
    options: ['risk appetite', 'opportunity cost', 'root cause', 'trade-off'],
    correct: 0,
    explanation: 'Risk appetite describes how much risk an organisation is willing to tolerate. The sentence is asking whether the company is culturally and strategically comfortable acting on incomplete information — a question about appetite, not cost, cause, or trade-off.',
    phrase: 'Try it: "Our risk appetite is low right now, so we need stronger evidence before we green-light this."'
  },
  {
    type: 'fill',
    scene: 'You are preparing a report for your Swiss head office. You write:',
    quote: '"If the pilot trial fails, our ______ plan is to pause the UK launch and redirect the budget to the German market."',
    question: 'What is the missing word?',
    accepted: ['contingency'],
    explanation: 'A contingency plan is a pre-prepared response to a possible failure or problem. It is a key concept in risk management — having a plan B before you need it. "Backup plan" is an informal equivalent, but contingency is the C1 business term expected here.',
    phrase: 'Try it: "What is our contingency if the retailer pulls out at the last minute?"'
  },
  {
    type: 'mc',
    scene: 'A colleague argues for launching immediately. You push back:',
    quote: '"Rushing now has a real ______ — every month we spend in the wrong segment is a month we are not building share in the right one."',
    question: 'Which phrase fits the gap?',
    options: ['opportunity cost', 'margin for error', 'unintended consequence', 'threshold'],
    correct: 0,
    explanation: 'Opportunity cost is the value of what you give up when you choose one option over another. The speaker is pointing out that time spent in the wrong segment has a cost — not financial, but strategic. Margin for error, threshold, and unintended consequence are all related concepts but do not fit this meaning.',
    phrase: 'Try it: "The opportunity cost of waiting another quarter is significant — the window may not be there next year."'
  },
  {
    type: 'mc',

function renderQuestion() {
  const q = quizOrder[currentQ];
  answered = false;
  document.getElementById('progLabel').textContent = `Question ${currentQ + 1} of ${TOTAL}`;
  document.getElementById('progFill').style.width = `${((currentQ + 1) / TOTAL) * 100}%`;
  document.getElementById('scoreChip').textContent = `Score: ${score} / ${TOTAL}`;
  const area = document.getElementById('questionArea');

  if (q.type === 'mc') {
    const labels = ['A', 'B', 'C', 'D'];
    const indices = shuffle([0, 1, 2, 3]);

    area.innerHTML = buildScene(q) + `
      <div class="options">
        ${indices.map((origIdx, pos) => `
          <button class="option" data-pos="${pos}" data-correct="${origIdx === q.correct}">
            <span class="letter">${labels[pos]}</span>
            <span>${q.options[origIdx]}</span>
          </button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="btn-row"><button class="btn btn-primary" id="quizNextBtn" disabled>Next →</button></div>
    `;

    area.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        const isCorrect = btn.dataset.correct === 'true';
        area.querySelectorAll('.option').forEach(b => {
          b.classList.add('locked');
          if (b.dataset.correct === 'true') b.classList.add('correct');
          else if (b === btn) b.classList.add('incorrect');
        });
        if (isCorrect) score++;
        const fb = document.getElementById('fb');
        fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'bad');
        fb.innerHTML = `<strong>${isCorrect ? 'Correct.' : 'Not quite.'}</strong> ${q.explanation}
          <div class="phrase-box"><strong>C1 phrase to practise</strong>${q.phrase}</div>`;
        area.querySelector('#quizNextBtn').disabled = false;
        document.getElementById('scoreChip').textContent = `Score: ${score} / ${TOTAL}`;
      });
    });

  } else {
    area.innerHTML = buildScene(q) + `
      <input type="text" class="fill-input" id="fillIn" placeholder="Type your answer..." autocomplete="off">
      <div class="feedback" id="fb"></div>
      <div class="btn-row">
        <button class="btn btn-check" id="checkBtn">Check</button>
        <button class="btn btn-primary" id="quizNextBtn" disabled>Next →</button>
      </div>
    `;
    const input = document.getElementById('fillIn');
    const checkBtn = document.getElementById('checkBtn');
    function doCheck() {
      if (answered) return;
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      answered = true;
      const isCorrect = q.accepted.some(a => a.toLowerCase() === val);
      input.classList.add(isCorrect ? 'correct' : 'incorrect');
      input.disabled = true;
      checkBtn.disabled = true;
      if (isCorrect) score++;
      const fb = document.getElementById('fb');
      fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'bad');
      fb.innerHTML = `<strong>${isCorrect ? 'Correct.' : `The word was "${q.accepted[0]}".`}</strong> ${q.explanation}
        <div class="phrase-box"><strong>C1 phrase to practise</strong>${q.phrase}</div>`;
      area.querySelector('#quizNextBtn').disabled = false;
      document.getElementById('scoreChip').textContent = `Score: ${score} / ${TOTAL}`;
    }
    checkBtn.addEventListener('click', doCheck);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') doCheck(); });
  }

  area.querySelector('#quizNextBtn').addEventListener('click', () => {
    if (currentQ < TOTAL - 1) { currentQ++; renderQuestion(); }
    else showResults();
  });
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('resultsCard').style.display = 'block';
  const pct = Math.round((score / TOTAL) * 100);
  const circ = 2 * Math.PI * 54;
  const offset = circ - (pct / 100) * circ;
  document.getElementById('resultsRing').innerHTML = `<svg viewBox="0 0 136 136">
    <circle cx="68" cy="68" r="54" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="11"/>
    <circle cx="68" cy="68" r="54" fill="none" stroke="#c9922a" stroke-width="11"
      stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
      stroke-linecap="round" transform="rotate(-90 68 68)"/>
    <text x="68" y="75" text-anchor="middle" font-family="Fraunces,serif" font-size="28" font-weight="300" fill="#f0ede4">${pct}%</text>
  </svg>`;
  const msgs = [
    [85, 'Strong command', `${score}/${TOTAL}. You handled the vocabulary precisely — now take it into the speaking and roleplay sections.`],
    [60, 'Solid foundation', `${score}/${TOTAL}. Good grasp of the core terms. A few need more precision — check the explanations and retry.`],
    [0,  'Keep going', `${score}/${TOTAL}. This is dense vocabulary. Read through the explanations carefully and have another go.`]
  ];
  const [, title, msg] = msgs.find(([t]) => pct >= t);
  document.getElementById('resultsTitle').textContent = title;
  document.getElementById('resultsMsg').textContent = msg;
}

function restartQuiz() {
  currentQ = 0; score = 0;
  quizOrder = shuffle(QUIZ_DATA);
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('resultsCard').style.display = 'none';
  renderQuestion();
}

    context: `You are presenting your product strategy for the next eighteen months to a small group that includes your CEO, who has joined unexpectedly. Halfway through, she stops you and asks: "What is the single biggest assumption this strategy depends on — and what happens to the plan if that assumption is wrong?" You were not prepared for this question. You need to answer it clearly, calmly, and honestly.`,
    objectives: [
      'Identify the core assumption without hedging or deflecting',
      'Describe the downside scenario plainly — what actually breaks if the assumption fails',
      'Show that you have thought about contingency, even if it is not fully formed'
    ],
    listen: [
      'thinking on your feet in a high-stakes moment',
      'answering the question that was asked rather than a safer version of it',
      'showing strategic depth without over-preparing'
    ]
  },
  {
    num: '06',
    title: 'The Supplier Who Wants Certainty',
    tag: 'external',
    tagLabel: 'Supplier Negotiation',
    context: `You want a supplier to begin developing a custom polymer compound for a new membrane product. It is a significant investment on their side. They are willing to do it, but they want a volume commitment from you before they start. You cannot give them that commitment — you do not have approval yet and the product is still in early development. You need them to begin the work anyway, on the strength of the relationship and the potential.`,
    objectives: [
      'Be clear about what you cannot offer without making the relationship feel fragile',
      'Give them enough confidence to begin — without making promises you cannot keep',
      'Find something you can commit to that reduces their risk'
    ],
    listen: [
      'building trust without making commitments',
      'giving confidence without giving guarantees',
      'understanding what the other side actually needs to say yes'
    ]
  }
];

let currentRP = 0;

function tagClass(tag) { return 'tag-' + tag; }

function renderRPSidebar() {
  const sb = document.getElementById('rpSidebar');
  sb.innerHTML = ROLEPLAYS.map((r, i) => `
    <div class="rp-thumb ${i === currentRP ? 'active' : ''}" data-i="${i}">
      <div class="rp-thumb-num">Scenario ${r.num}</div>
      <div class="rp-thumb-title">${r.title}</div>
      <span class="rp-thumb-tag ${tagClass(r.tag)}">${r.tagLabel}</span>
    </div>
  `).join('');
  sb.querySelectorAll('.rp-thumb').forEach(el => {
    el.addEventListener('click', () => {
      currentRP = parseInt(el.dataset.i);
      renderRPSidebar();
      renderRPMain();
    });
  });
}

function renderRPMain() {
  const r = ROLEPLAYS[currentRP];
  document.getElementById('rpMain').innerHTML = `
    <div class="rp-card">
      <div class="rp-card-top">
        <div class="rp-role-badge">
          <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 13c0-4 2.5-5 5-5s5 1 5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          Your role
        </div>
        <div class="rp-scenario-title">${r.title}</div>
        <span class="rp-thumb-tag ${tagClass(r.tag)}" style="margin-bottom:0">${r.tagLabel}</span>
        <div class="rp-context">${r.context}</div>
      </div>
      <div class="rp-divider"></div>
      <div class="rp-objectives">
        <div class="rp-objectives-label">Your objectives for this conversation</div>
        <div class="rp-obj-list">
          ${r.objectives.map(o => `<div class="rp-obj"><div class="rp-obj-dot"></div><span>${o}</span></div>`).join('')}
        </div>
      </div>
      <div class="rp-divider2"></div>
      <div class="rp-listen">
        <div class="rp-listen-label">Worth noticing</div>
        <div class="rp-listen-list">
          ${r.listen.map(l => `<span class="rp-listen-chip">${l}</span>`).join('')}
        </div>
      </div>
    </div>
  `;
}

renderRPSidebar();
renderRPMain();
</script>
</body>
</html>
