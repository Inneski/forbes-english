627\u0644\u064A\u064B\u0627 \u062C\u062F\u064B\u0627. \u0644\u0630\u0644\u0643 \u0630\u0647\u0628\u0646\u0627 \u0625\u0644\u0649 \u062D\u0627\u0646\u0629 \u0623\u0631\u062E\u0635.","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"\u0641\u064A \u0645\u064A\u0627\u0645\u064A \u0634\u0648\u0627\u0637\u0626 \u062C\u0645\u064A\u0644\u0629. \u0628\u0627\u0644\u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0630\u0644\u0643\u060C \u0641\u064A\u0647\u0627 \u062D\u064A\u0627\u0629 \u0644\u064A\u0644\u064A\u0629 \u0631\u0627\u0626\u0639\u0629.","En lugar de tomar un taxi, alquilamos un bote.":"\u0628\u062F\u0644\u064B\u0627 \u0645\u0646 \u0623\u062E\u0630 \u0633\u064A\u0627\u0631\u0629 \u0623\u062C\u0631\u0629\u060C \u0627\u0633\u062A\u0623\u062C\u0631\u0646\u0627 \u0642\u0627\u0631\u0628\u064B\u0627.","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"\u0623\u064F\u0644\u063A\u064A\u062A \u0627\u0644\u0631\u062D\u0644\u0629 \u0628\u0633\u0628\u0628 \u0627\u0644\u0625\u0639\u0635\u0627\u0631 \u0627\u0644\u0642\u0627\u062F\u0645.","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"\u0627\u0634\u062A\u0631\u062A \u0645\u0644\u0627\u0628\u0633 \u0643\u062B\u064A\u0631\u0629 \u0645\u0639 \u0623\u0646\u0647\u0627 \u0643\u0627\u0646\u062A \u063A\u0627\u0644\u064A\u0629 \u062C\u062F\u064B\u0627.","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"\u0634\u0631\u0628\u0646\u0627 \u062B\u0644\u0627\u062B\u0629 \u0641\u0646\u0627\u062C\u064A\u0646 \u0645\u0646 \u0627\u0644\u0642\u0647\u0648\u0629 \u0627\u0644\u0643\u0648\u0628\u064A\u0629\u061B \u0648\u0645\u0639 \u0630\u0644\u0643 \u0643\u0646\u0627 \u0644\u0627 \u0646\u0632\u0627\u0644 \u0645\u062A\u0639\u0628\u064A\u0646 \u0645\u0646 \u0627\u0644\u0631\u062D\u0644\u0629.","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"\u0628\u0645\u0627 \u0623\u0646\u0646\u0627 \u0641\u064A \u0645\u064A\u0627\u0645\u064A \u0628\u0627\u0644\u0641\u0639\u0644\u060C \u0644\u0646\u0630\u0647\u0628 \u0644\u0644\u0633\u0628\u0627\u062D\u0629 \u0641\u064A \u062D\u062F\u064A\u0642\u0629 \u0633\u0627\u0648\u062B \u0628\u0648\u064A\u0646\u062A.","No iremos al festival a menos que compres las entradas VIP.":"\u0644\u0646 \u0646\u0630\u0647\u0628 \u0625\u0644\u0649 \u0627\u0644\u0645\u0647\u0631\u062C\u0627\u0646 \u0625\u0644\u0627 \u0625\u0630\u0627 \u0627\u0634\u062A\u0631\u064A\u062A \u062A\u0630\u0627\u0643\u0631 \u0643\u0628\u0627\u0631 \u0627\u0644\u0634\u062E\u0635\u064A\u0627\u062A.","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"\u0623\u0648\u0634\u0646 \u062F\u0631\u0627\u064A\u0641 \u0635\u0627\u062E\u0628 \u062C\u062F\u064B\u0627\u060C \u0628\u064A\u0646\u0645\u0627 \u0643\u0648\u0631\u0627\u0644 \u063A\u064A\u0628\u0644\u0632 \u0647\u0627\u062F\u0626\u0629 \u0646\u0648\u0639\u064B\u0627 \u0645\u0627.","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"\u0628\u064A\u0646\u0645\u0627 \u0643\u0646\u062A \u0623\u0642\u0648\u062F \u0627\u0644\u062F\u0631\u0627\u062C\u0629 \u0627\u0644\u0645\u0627\u0626\u064A\u0629\u060C \u0631\u0623\u064A\u062A \u062F\u0644\u0641\u064A\u0646\u064B\u0627 \u062C\u0645\u064A\u0644\u064B\u0627.","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"\u0645\u064A\u0627\u0645\u064A \u0645\u0634\u0647\u0648\u0631\u0629 \u0628\u062D\u064A\u0627\u062A\u0647\u0627 \u0627\u0644\u0644\u064A\u0644\u064A\u0629 \u0648\u0643\u0630\u0644\u0643 \u0628\u0645\u0637\u0628\u062E\u0647\u0627 \u0627\u0644\u0645\u0630\u0647\u0644.","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"\u0644\u0627 \u0623\u0631\u064A\u062F \u0627\u0644\u0630\u0647\u0627\u0628 \u0625\u0644\u0649 \u0627\u0644\u0646\u0627\u062F\u064A\u061B \u062B\u0645 \u0625\u0646\u0646\u064A \u0644\u0627 \u0623\u0645\u0644\u0643 \u0645\u0627\u0644\u064B\u0627 \u0643\u0627\u0641\u064A\u064B\u0627.","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"\u0644\u0644\u0639\u0645\u0627\u0631\u0629 \u0623\u0647\u0645\u064A\u0629 \u062A\u0627\u0631\u064A\u062E\u064A\u0629. \u0639\u0644\u0627\u0648\u0629 \u0639\u0644\u0649 \u0630\u0644\u0643\u060C \u0641\u0647\u064A \u062E\u0644\u0641\u064A\u0629 \u062C\u0645\u064A\u0644\u0629 \u0644\u0644\u0635\u0648\u0631.","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"\u0643\u0627\u0646 \u0627\u0644\u062C\u0648 \u062D\u0627\u0631\u064B\u0627 \u062C\u062F\u064B\u0627\u060C \u0641\u062A\u0648\u0642\u0641\u0646\u0627 \u0644\u0634\u0631\u0627\u0621 \u0627\u0644\u0622\u064A\u0633 \u0643\u0631\u064A\u0645.","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"\u0642\u0636\u064A\u0646\u0627 \u0648\u0642\u062A\u064B\u0627 \u0631\u0627\u0626\u0639\u064B\u0627 \u0639\u0644\u0649 \u0627\u0644\u0634\u0627\u0637\u0626 \u0631\u063A\u0645 \u0627\u0644\u0639\u0627\u0635\u0641\u0629 \u0627\u0644\u0631\u0639\u062F\u064A\u0629 \u0627\u0644\u0645\u0641\u0627\u062C\u0626\u0629.","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"\u0645\u0639 \u0623\u0646\u0647 \u064A\u062D\u0628 \u0623\u0633\u0644\u0648\u0628 \u0627\u0644\u062D\u064A\u0627\u0629 \u0641\u064A \u0645\u064A\u0627\u0645\u064A\u060C \u0641\u0625\u0646\u0647 \u064A\u0643\u0631\u0647 \u0631\u0637\u0648\u0628\u0629 \u0627\u0644\u0635\u064A\u0641.","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"\u0631\u063A\u0645 \u062A\u0639\u0628\u0647\u0627 \u0645\u0646 \u0627\u0644\u0631\u062D\u0644\u0629\u060C \u0631\u0642\u0635\u062A \u0627\u0644\u0633\u0627\u0644\u0633\u0627 \u0637\u0648\u0627\u0644 \u0627\u0644\u0644\u064A\u0644.","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"\u0643\u0627\u0646 \u0641\u064A \u0627\u0644\u0641\u0646\u062F\u0642 \u0645\u0633\u0628\u062D \u0631\u0627\u0626\u0639. \u0644\u0643\u0646 \u0627\u0644\u062E\u062F\u0645\u0629 \u0643\u0627\u0646\u062A \u0628\u0637\u064A\u0626\u0629 \u062C\u062F\u064B\u0627.","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"\u0623\u0632\u0648\u0631 \u0634\u0627\u0631\u0639 \u0643\u0627\u064A\u064A \u0623\u0648\u062A\u0634\u0648 \u062F\u0627\u0626\u0645\u064B\u0627 \u0644\u0623\u0646\u0647\u0645 \u064A\u0642\u062F\u0645\u0648\u0646 \u0623\u0641\u0636\u0644 \u0642\u0647\u0648\u0629 \u0643\u0648\u0631\u062A\u0627\u062F\u064A\u062A\u0648.","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"\u062A\u0623\u062E\u0631\u062A \u0631\u062D\u0644\u062A\u0646\u0627\u061B \u0644\u0630\u0644\u0643 \u0641\u0627\u062A\u0646\u0627 \u062D\u062C\u0632 \u0627\u0644\u0639\u0634\u0627\u0621.","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"\u062D\u064A \u0627\u0644\u062A\u0635\u0645\u064A\u0645 \u0645\u0639\u0631\u0648\u0641 \u0628\u0627\u0644\u0623\u0632\u064A\u0627\u0621. \u0628\u0627\u0644\u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0630\u0644\u0643\u060C \u0641\u064A\u0647 \u0623\u0639\u0645\u0627\u0644 \u0641\u0646\u064A\u0629 \u0645\u0630\u0647\u0644\u0629.","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"\u0628\u0645\u0627 \u0623\u0646 \u0634\u0645\u0633 \u0641\u0644\u0648\u0631\u064A\u062F\u0627 \u0642\u0648\u064A\u0629 \u062C\u062F\u064B\u0627\u060C \u064A\u062C\u0628 \u0623\u0646 \u062A\u0633\u062A\u062E\u062F\u0645 \u0648\u0627\u0642\u064A \u0627\u0644\u0634\u0645\u0633.","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"\u0644\u0627 \u062A\u0631\u0643\u0646 \u0633\u064A\u0627\u0631\u062A\u0643 \u0641\u064A \u0623\u0648\u0634\u0646 \u062F\u0631\u0627\u064A\u0641 \u0625\u0644\u0627 \u0625\u0630\u0627 \u0623\u0631\u062F\u062A \u0645\u062E\u0627\u0644\u0641\u0629 \u0628\u0642\u064A\u0645\u0629 100 \u062F\u0648\u0644\u0627\u0631.","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"\u0646\u0648\u0631\u062B \u0628\u064A\u062A\u0634 \u0647\u0627\u062F\u0626 \u062C\u062F\u064B\u0627\u060C \u0628\u064A\u0646\u0645\u0627 \u0633\u0627\u0648\u062B \u0628\u064A\u062A\u0634 \u0645\u0644\u064A\u0621 \u0628\u0627\u0644\u062D\u064A\u0648\u064A\u0629.","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"\u0628\u064A\u0646\u0645\u0627 \u0643\u0646\u0627 \u0646\u0645\u0634\u064A \u0639\u0644\u0649 \u0627\u0644\u062C\u0633\u0631\u060C \u0631\u0623\u064A\u0646\u0627 \u0628\u0628\u063A\u0627\u0648\u0627\u062A \u0628\u0631\u064A\u0629.","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"\u0644\u0644\u0639\u0645\u0644 \u0641\u064A \u0627\u0644\u0645\u062A\u0627\u062C\u0631\u060C \u0645\u0646 \u0627\u0644\u0645\u0641\u064A\u062F \u0623\u0646 \u062A\u062A\u062D\u062F\u062B \u0627\u0644\u0625\u0646\u062C\u0644\u064A\u0632\u064A\u0629 \u0648\u0643\u0630\u0644\u0643 \u0627\u0644\u0625\u0633\u0628\u0627\u0646\u064A\u0629 \u0628\u0637\u0644\u0627\u0642\u0629.","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"\u0644\u0627 \u0623\u0631\u063A\u0628 \u0641\u064A \u0627\u0644\u062E\u0631\u0648\u062C\u061B \u062B\u0645 \u0625\u0646\u0646\u064A \u064A\u062C\u0628 \u0623\u0646 \u0623\u0633\u062A\u064A\u0642\u0638 \u0645\u0628\u0643\u0631\u064B\u0627 \u063A\u062F\u064B\u0627.","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"\u0643\u0627\u0646\u062A \u0627\u0644\u062C\u0648\u0644\u0629 \u0631\u062E\u064A\u0635\u0629. \u0639\u0644\u0627\u0648\u0629 \u0639\u0644\u0649 \u0630\u0644\u0643\u060C \u0643\u0627\u0646 \u0627\u0644\u0645\u0631\u0634\u062F \u0645\u0636\u062D\u0643\u064B\u0627 \u0648\u0645\u0641\u064A\u062F\u064B\u0627.","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"\u0623\u0631\u062F\u0646\u0627 \u062A\u0635\u0648\u064A\u0631 \u0627\u0644\u062A\u0645\u0627\u0633\u064A\u062D\u060C \u0641\u0630\u0647\u0628\u0646\u0627 \u0628\u0627\u0644\u0633\u064A\u0627\u0631\u0629 \u0625\u0644\u0649 \u0625\u064A\u0641\u0631\u063A\u0644\u064A\u062F\u0632.","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"\u0631\u063A\u0645 \u0627\u0644\u0637\u0627\u0628\u0648\u0631 \u0627\u0644\u0637\u0648\u064A\u0644 \u0641\u064A \u0627\u0644\u062E\u0627\u0631\u062C\u060C \u0642\u0631\u0631\u0646\u0627 \u0627\u0644\u0627\u0646\u062A\u0638\u0627\u0631 \u0644\u062F\u062E\u0648\u0644 \u0627\u0644\u0646\u0627\u062F\u064A.","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"\u0623\u064F\u0644\u063A\u064A\u062A \u0643\u0644 \u0627\u0644\u0631\u062D\u0644\u0627\u062A \u0628\u0633\u0628\u0628 \u062A\u062D\u0630\u064A\u0631\u0627\u062A \u0627\u0644\u0639\u0627\u0635\u0641\u0629.","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0643\u0627\u0646 \u0627\u0644\u0646\u0627\u062F\u064A \u0645\u0641\u062A\u0648\u062D\u064B\u0627\u061B \u0644\u0643\u0646\u0647 \u0643\u0627\u0646 \u0641\u0627\u0631\u063A\u064B\u0627.","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0645\u0639 \u0623\u0646 \u0627\u0644\u062C\u0648 \u0643\u0627\u0646 \u062D\u0627\u0631\u064B\u0627 \u062C\u062F\u064B\u0627\u060C \u062A\u062C\u0648\u0644\u0646\u0627 \u0641\u064A \u0648\u064A\u0646\u0648\u0648\u062F.","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0631\u063A\u0645 \u0627\u0644\u0645\u0637\u0631\u060C \u0627\u0633\u062A\u0645\u0631\u062A \u0627\u0644\u062D\u0641\u0644\u0629 \u0639\u0646\u062F \u0627\u0644\u0645\u0633\u0628\u062D.","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0627\u0634\u062A\u0631\u062A \u0627\u0644\u0641\u0633\u062A\u0627\u0646 \u0631\u063A\u0645 \u0633\u0639\u0631\u0647 \u0627\u0644\u0645\u0631\u062A\u0641\u0639.","Significado: Entramos porque el aire acondicionado estaba encendido.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u062F\u062E\u0644\u0646\u0627 \u0644\u0623\u0646 \u0627\u0644\u0645\u0643\u064A\u0641 \u0643\u0627\u0646 \u064A\u0639\u0645\u0644.","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0646\u0633\u064A\u062A \u0645\u062D\u0641\u0638\u062A\u064A\u061B \u0644\u0630\u0644\u0643 \u0644\u0645 \u0623\u0633\u062A\u0637\u0639 \u0634\u0631\u0627\u0621 \u0627\u0644\u0645\u0648\u0647\u064A\u062A\u0648.","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0643\u0627\u0646 \u0627\u0644\u0634\u0627\u0637\u0626 \u0645\u0632\u062F\u062D\u0645\u064B\u0627\u060C \u0641\u0630\u0647\u0628\u0646\u0627 \u0625\u0644\u0649 \u0645\u0633\u0628\u062D \u0627\u0644\u0641\u0646\u062F\u0642.","Significado: Pidieron empanadas as\xED como croquetas.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0637\u0644\u0628\u0648\u0627 \u0627\u0644\u0625\u0645\u0628\u0627\u0646\u0627\u062F\u0627 \u0648\u0643\u0630\u0644\u0643 \u0627\u0644\u0643\u0631\u0648\u0643\u064A\u062A.","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0627\u0644\u0648\u0642\u062A \u0645\u062A\u0623\u062E\u0631 \u062C\u062F\u064B\u0627 \u0644\u0644\u062E\u0631\u0648\u062C\u061B \u062B\u0645 \u0625\u0646\u0647\u0627 \u062A\u0645\u0637\u0631.","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0627\u0644\u0645\u0637\u0639\u0645 \u0645\u0634\u0647\u0648\u0631. \u0639\u0644\u0627\u0648\u0629 \u0639\u0644\u0649 \u0630\u0644\u0643\u060C \u0644\u062F\u064A\u0647 \u0646\u062C\u0645\u0629 \u0645\u064A\u0634\u0644\u0627\u0646.","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0645\u064A\u0627\u0645\u064A \u0645\u0631\u0643\u0632 \u0645\u0627\u0644\u064A. \u0628\u0627\u0644\u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0630\u0644\u0643\u060C \u0647\u064A \u0645\u0631\u0643\u0632 \u062B\u0642\u0627\u0641\u064A.","Significado: Ya que tenemos un auto, podemos conducir hasta Key West.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0628\u0645\u0627 \u0623\u0646 \u0644\u062F\u064A\u0646\u0627 \u0633\u064A\u0627\u0631\u0629\u060C \u064A\u0645\u0643\u0646\u0646\u0627 \u0627\u0644\u0642\u064A\u0627\u062F\u0629 \u0625\u0644\u0649 \u0643\u064A \u0648\u064A\u0633\u062A.","Significado: No puedes entrar al \xE1rea VIP a menos que est\xE9s en la lista.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0644\u0627 \u064A\u0645\u0643\u0646\u0643 \u062F\u062E\u0648\u0644 \u0645\u0646\u0637\u0642\u0629 \u0643\u0628\u0627\u0631 \u0627\u0644\u0634\u062E\u0635\u064A\u0627\u062A \u0625\u0644\u0627 \u0625\u0630\u0627 \u0643\u0627\u0646 \u0627\u0633\u0645\u0643 \u0641\u064A \u0627\u0644\u0642\u0627\u0626\u0645\u0629.","Significado: El invierno aqu\xED es c\xE1lido, mientras que el verano es caluroso.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0627\u0644\u0634\u062A\u0627\u0621 \u0647\u0646\u0627 \u062F\u0627\u0641\u0626\u060C \u0628\u064A\u0646\u0645\u0627 \u0627\u0644\u0635\u064A\u0641 \u062D\u0627\u0631 \u062C\u062F\u064B\u0627.","Significado: Mientras conduc\xEDa por la I-95, vio un accidente.":"\u0627\u0644\u0645\u0639\u0646\u0649: \u0628\u064A\u0646\u0645\u0627 \u0643\u0627\u0646 \u064A\u0642\u0648\u062F \u0639\u0644\u0649 \u0627\u0644\u0637\u0631\u064A\u0642 I-95\u060C \u0631\u0623\u0649 \u062D\u0627\u062F\u062B\u064B\u0627.","\xA1Correcto! \u{1F60E}":"\u0635\u062D\u064A\u062D! \u{1F60E}","Incorrecto \u{1F6AB}":"\u062E\u0637\u0623 \u{1F6AB}"},de:{"Aunque llueve mucho en el verano, Miami siempre est\xE1 llena de turistas.":"Obwohl es im Sommer stark regnet, ist Miami immer voller Touristen.","Decidimos ir a South Beach a pesar del tr\xE1fico pesado.":"Wir beschlossen, trotz des starken Verkehrs nach South Beach zu fahren.","Las Wynwood Walls son famosas en todo el mundo por su incre\xEDble arte callejero.":"Die Wynwood Walls sind wegen ihrer unglaublichen Street Art weltweit ber\xFChmt.","Quer\xEDa comer un s\xE1ndwich cubano; sin embargo, el restaurante estaba cerrado.":"Ich wollte in Little Havana ein kubanisches Sandwich essen; das Restaurant war jedoch geschlossen.","El club era extremadamente caro. Por lo tanto, fuimos a un bar m\xE1s barato.":"Der Club war extrem teuer. Deshalb gingen wir in eine g\xFCnstigere Bar.","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"Miami hat wundersch\xF6ne Str\xE4nde. Au\xDFerdem bietet es ein ausgezeichnetes Nachtleben.","En lugar de tomar un taxi, alquilamos un bote.":"Statt ein Taxi zu nehmen, mieteten wir ein Boot.","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"Die Fahrt wurde wegen des herannahenden Hurrikans abgesagt.","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"Sie kaufte viele Kleider, obwohl sie sehr teuer waren.","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"Wir tranken drei kubanische Kaffees; trotzdem waren wir noch m\xFCde vom Flug.","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"Da wir schon in Miami sind, lass uns im South Pointe Park schwimmen gehen.","No iremos al festival a menos que compres las entradas VIP.":"Wir gehen nicht zum Festival, es sei denn, du kaufst die VIP-Tickets.","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"Ocean Drive ist sehr laut, w\xE4hrend Coral Gables ziemlich ruhig ist.","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"W\xE4hrend ich Jetski fuhr, sah ich einen wundersch\xF6nen Delfin.","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"Miami ist f\xFCr sein Nachtleben sowie f\xFCr seine unglaubliche K\xFCche ber\xFChmt.","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"Ich will nicht in den Club; au\xDFerdem habe ich nicht genug Geld.","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"Die Architektur ist historisch bedeutend. Au\xDFerdem bietet sie eine sch\xF6ne Fotokulisse.","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"Es war unglaublich hei\xDF, also hielten wir an, um Eis zu kaufen.","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"Wir hatten trotz des unerwarteten Gewitters eine tolle Zeit am Strand.","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"Obwohl er den Lebensstil in Miami liebt, hasst er die Luftfeuchtigkeit im Sommer.","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"Trotz ihrer Ersch\xF6pfung vom Flug tanzte sie die ganze Nacht Salsa.","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"Das Hotel hatte einen tollen Pool. Der Service war jedoch sehr langsam.","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"Ich besuche immer die Calle Ocho, weil es dort die besten Cortaditos gibt.","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"Unser Flug hatte Versp\xE4tung; deshalb verpassten wir unsere Reservierung.","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"Der Design District ist f\xFCr Mode bekannt. Au\xDFerdem gibt es dort unglaubliche Kunstinstallationen.","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"Da die Sonne in Florida sehr stark ist, musst du Sonnencreme tragen.","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"Park nicht am Ocean Drive, es sei denn, du willst einen Strafzettel \xFCber 100 $.","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"North Beach ist sehr ruhig, w\xE4hrend South Beach voller Energie ist.","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"W\xE4hrend wir \xFCber den Damm gingen, sahen wir wilde Papageien.","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"F\xFCr die Arbeit im Einzelhandel hilft es, Englisch sowie flie\xDFend Spanisch zu sprechen.","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"Ich habe keine Lust auszugehen; au\xDFerdem muss ich morgen fr\xFCh aufstehen.","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"Die Tour war g\xFCnstig. Au\xDFerdem war der Guide sehr lustig und informativ.","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"Wir wollten Alligatoren fotografieren, also fuhren wir in die Everglades.","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"Trotz der riesigen Schlange drau\xDFen beschlossen wir, auf den Einlass in den Club zu warten.","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"Alle Fl\xFCge wurden wegen der Unwetterwarnungen gestrichen.","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"Bedeutung: Der Club war offen; er war jedoch leer.","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"Bedeutung: Obwohl es sehr hei\xDF war, liefen wir durch Wynwood.","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"Bedeutung: Trotz des Regens ging die Poolparty weiter.","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"Bedeutung: Sie kaufte das Kleid trotz des hohen Preises.","Significado: Entramos porque el aire acondicionado estaba encendido.":"Bedeutung: Wir gingen hinein, weil die Klimaanlage an war.","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"Bedeutung: Ich hatte mein Portemonnaie vergessen; deshalb konnte ich den Mojito nicht kaufen.","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"Bedeutung: Der Strand war voll, also gingen wir zum Hotelpool.","Significado: Pidieron empanadas as\xED como croquetas.":"Bedeutung: Sie
