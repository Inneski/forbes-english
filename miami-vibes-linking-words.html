n bar moins cher.","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"Miami a de magnifiques plages. De plus, elle offre une excellente vie nocturne.","En lugar de tomar un taxi, alquilamos un bote.":"Au lieu de prendre un taxi, nous avons lou\xE9 un bateau.","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"La sortie a \xE9t\xE9 annul\xE9e \xE0 cause de l\u2019ouragan qui approchait.","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"Elle a achet\xE9 beaucoup de v\xEAtements, m\xEAme s\u2019ils \xE9taient tr\xE8s chers.","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"Nous avons bu trois caf\xE9s cubains ; n\xE9anmoins, nous \xE9tions encore fatigu\xE9s du vol.","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"Puisque nous sommes d\xE9j\xE0 \xE0 Miami, allons nager \xE0 South Pointe Park.","No iremos al festival a menos que compres las entradas VIP.":"Nous n\u2019irons pas au festival, \xE0 moins que tu n\u2019ach\xE8tes les billets VIP.","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"Ocean Drive est tr\xE8s bruyant, tandis que Coral Gables est plut\xF4t calme.","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"Pendant que je faisais du jet-ski, j\u2019ai vu un magnifique dauphin.","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"Miami est c\xE9l\xE8bre pour sa vie nocturne ainsi que pour son incroyable cuisine.","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"Je ne veux pas aller en bo\xEEte ; d\u2019ailleurs, je n\u2019ai pas assez d\u2019argent.","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"L\u2019architecture a une grande importance historique. En outre, elle offre un beau d\xE9cor pour les photos.","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"Il faisait incroyablement chaud, alors nous nous sommes arr\xEAt\xE9s pour acheter une glace.","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"Nous nous sommes bien amus\xE9s \xE0 la plage malgr\xE9 l\u2019orage inattendu.","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"Bien qu\u2019il adore le style de vie de Miami, il d\xE9teste l\u2019humidit\xE9 de l\u2019\xE9t\xE9.","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"Malgr\xE9 la fatigue du vol, elle a dans\xE9 la salsa toute la nuit.","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"L\u2019h\xF4tel avait une superbe piscine. Cependant, le service \xE9tait tr\xE8s lent.","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"Je vais toujours \xE0 Calle Ocho parce qu\u2019on y sert les meilleurs cortaditos.","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"Notre vol a \xE9t\xE9 retard\xE9 ; par cons\xE9quent, nous avons rat\xE9 notre r\xE9servation.","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"Le Design District est connu pour la mode. De plus, il pr\xE9sente d\u2019incroyables installations d\u2019art.","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"Puisque le soleil de Floride est tr\xE8s fort, tu dois mettre de la cr\xE8me solaire.","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"Ne te gare pas sur Ocean Drive, \xE0 moins de vouloir une amende de 100 $.","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"North Beach est tr\xE8s calme, tandis que South Beach est pleine d\u2019\xE9nergie.","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"Pendant que nous marchions sur la chauss\xE9e, nous avons vu des perroquets sauvages.","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"Pour travailler dans le commerce, il est utile de parler anglais ainsi qu\u2019espagnol couramment.","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"Je n\u2019ai pas envie de sortir ; d\u2019ailleurs, je dois me lever t\xF4t demain.","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"L\u2019excursion \xE9tait abordable. En outre, le guide \xE9tait tr\xE8s dr\xF4le et instructif.","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"Nous voulions photographier des alligators, alors nous sommes all\xE9s dans les Everglades.","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"Malgr\xE9 l\u2019\xE9norme file d\u2019attente dehors, nous avons d\xE9cid\xE9 d\u2019attendre pour entrer dans le club.","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"Tous les vols ont \xE9t\xE9 annul\xE9s \xE0 cause des alertes de temp\xEAte.","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"Sens : Le club \xE9tait ouvert ; cependant, il \xE9tait vide.","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"Sens : Bien qu\u2019il fasse tr\xE8s chaud, nous nous sommes promen\xE9s dans Wynwood.","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"Sens : Malgr\xE9 la pluie, la f\xEAte \xE0 la piscine a continu\xE9.","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"Sens : Elle a achet\xE9 la robe malgr\xE9 son prix \xE9lev\xE9.","Significado: Entramos porque el aire acondicionado estaba encendido.":"Sens : Nous sommes entr\xE9s parce que la climatisation \xE9tait allum\xE9e.","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"Sens : J\u2019avais oubli\xE9 mon portefeuille ; par cons\xE9quent, je n\u2019ai pas pu acheter le mojito.","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"Sens : La plage \xE9tait bond\xE9e, alors nous sommes all\xE9s \xE0 la piscine de l\u2019h\xF4tel.","Significado: Pidieron empanadas as\xED como croquetas.":"Sens : Ils ont command\xE9 des empanadas ainsi que des croquetas.","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"Sens : Il est trop tard pour sortir ; d\u2019ailleurs, il pleut.","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"Sens : Le restaurant est c\xE9l\xE8bre. De plus, il a une \xE9toile Michelin.","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"Sens : Miami est un centre financier. En outre, c\u2019est un centre culturel.","Significado: Ya que tenemos un auto, podemos conducir hasta Key West.":"Sens : Puisque nous avons une voiture, nous pouvons aller jusqu\u2019\xE0 Key West.","Significado: No puedes entrar al \xE1rea VIP a menos que est\xE9s en la lista.":"Sens : Tu ne peux pas entrer dans l\u2019espace VIP, \xE0 moins d\u2019\xEAtre sur la liste.","Significado: El invierno aqu\xED es c\xE1lido, mientras que el verano es caluroso.":"Sens : Ici, l\u2019hiver est doux, tandis que l\u2019\xE9t\xE9 est tr\xE8s chaud.","Significado: Mientras conduc\xEDa por la I-95, vio un accidente.":"Sens : Pendant qu\u2019il roulait sur la I-95, il a vu un accident.","\xA1Correcto! \u{1F60E}":"Correct ! \u{1F60E}","Incorrecto \u{1F6AB}":"Incorrect \u{1F6AB}"},hr:{"Aunque llueve mucho en el verano, Miami siempre est\xE1 llena de turistas.":"Iako ljeti jako pada ki\u0161a, Miami je uvijek pun turista.","Decidimos ir a South Beach a pesar del tr\xE1fico pesado.":"Odlu\u010Dili smo oti\u0107i na South Beach unato\u010D gustom prometu.","Las Wynwood Walls son famosas en todo el mundo por su incre\xEDble arte callejero.":"Wynwood Walls poznati su u cijelom svijetu po nevjerojatnoj uli\u010Dnoj umjetnosti.","Quer\xEDa comer un s\xE1ndwich cubano; sin embargo, el restaurante estaba cerrado.":"Htio sam pojesti kubanski sendvi\u010D u Little Havani; me\u0111utim, restoran je bio zatvoren.","El club era extremadamente caro. Por lo tanto, fuimos a un bar m\xE1s barato.":"Klub je bio jako skup. Stoga smo oti\u0161li u jeftiniji bar.","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"Miami ima prekrasne pla\u017Ee. Osim toga, nudi izvrstan no\u0107ni \u017Eivot.","En lugar de tomar un taxi, alquilamos un bote.":"Umjesto da uzmemo taksi, iznajmili smo brod.","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"Izlet je otkazan zbog uragana koji se pribli\u017Eavao.","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"Kupila je puno odje\u0107e iako je bila jako skupa.","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"Popili smo tri kubanske kave; ipak smo i dalje bili umorni od leta.","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"Budu\u0107i da smo ve\u0107 u Miamiju, idemo plivati u South Pointe Park.","No iremos al festival a menos que compres las entradas VIP.":"Ne\u0107emo i\u0107i na festival, osim ako ne kupi\u0161 VIP ulaznice.","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"Ocean Drive je jako bu\u010Dan, dok je Coral Gables prili\u010Dno miran.","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"Dok sam vozio jet ski, vidio sam prekrasnog dupina.","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"Miami je poznat po no\u0107nom \u017Eivotu, kao i po nevjerojatnoj kuhinji.","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"Ne \u017Eelim i\u0107i u klub; osim toga, nemam dovoljno novca.","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"Arhitektura je povijesno va\u017Ena. Osim toga, prekrasna je pozadina za fotografije.","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"Bilo je nevjerojatno vru\u0107e, pa smo stali kupiti sladoled.","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"Odli\u010Dno smo se proveli na pla\u017Ei unato\u010D neo\u010Dekivanom nevremenu.","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"Iako voli na\u010Din \u017Eivota u Miamiju, mrzi ljetnu vlagu.","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"Unato\u010D umoru od leta, cijelu je no\u0107 plesala salsu.","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"Hotel je imao sjajan bazen. Me\u0111utim, usluga je bila jako spora.","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"Uvijek posjetim Calle Ocho jer tamo slu\u017Ee najbolje cortadite.","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"Let nam je kasnio; stoga smo propustili rezervaciju.","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"Design District poznat je po modi. Osim toga, ima nevjerojatne umjetni\u010Dke instalacije.","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"Budu\u0107i da je sunce na Floridi vrlo sna\u017Eno, mora\u0161 staviti kremu za sun\u010Danje.","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"Ne parkiraj na Ocean Driveu, osim ako \u017Eeli\u0161 kaznu od 100 dolara.","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"North Beach je jako miran, dok je South Beach pun energije.","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"Dok smo hodali nasipom, vidjeli smo divlje papige.","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"Za rad u trgovini poma\u017Ee govoriti engleski kao i te\u010Dno \u0161panjolski.","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"Ne da mi se izlaziti; osim toga, sutra moram rano ustati.","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"Tura je bila povoljna. Osim toga, vodi\u010D je bio jako zabavan i informativan.","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"Htjeli smo fotografirati aligatore, pa smo se odvezli u Everglades.","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"Unato\u010D ogromnom redu vani, odlu\u010Dili smo pri\u010Dekati da u\u0111emo u klub.","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"Svi letovi su otkazani zbog upozorenja na oluju.","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"Zna\u010Denje: Klub je bio otvoren; me\u0111utim, bio je prazan.","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"Zna\u010Denje: Iako je bilo jako vru\u0107e, \u0161etali smo Wynwoodom.","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"Zna\u010Denje: Unato\u010D ki\u0161i, zabava uz bazen se nastavila.","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"Zna\u010Denje: Kupila je haljinu unato\u010D visokoj cijeni.","Significado: Entramos porque el aire acondicionado estaba encendido.":"Zna\u010Denje: U\u0161li smo jer je klima bila uklju\u010Dena.","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"Zna\u010Denje: Zaboravio sam nov\u010Danik; stoga nisam mogao kupiti mojito.","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"Zna\u010Denje: Pla\u017Ea je bila puna, pa smo oti\u0161li na hotelski bazen.","Significado: Pidieron empanadas as\xED como croquetas.":"Zna\u010Denje: Naru\u010Dili su empanade kao i krokete.","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"Zna\u010Denje: Prekasno je za izlazak; osim toga, pada ki\u0161a.","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"Zna\u010Denje: Restoran je poznat. Osim toga, ima Michelinovu zvjezdicu.","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"Zna\u010Denje: Miami je financijsko sredi\u0161te. Osim toga, kulturno je sredi\u0161te.","Significado: Ya que tenemos un auto, podemos conducir hasta Key West.":"Zna\u010Denje: Budu\u0107i da imamo auto, mo\u017Eemo se odvesti do Key Westa.","Significado: No puedes entrar al \xE1rea VIP a menos que est\xE9s en la lista.":"Zna\u010Denje: Ne mo\u017Ee\u0161 u\u0107i u VIP prostor, osim ako si na popisu.","Significado: El invierno aqu\xED es c\xE1lido, mientras que el verano es caluroso.":"Zna\u010Denje: Zima je ovdje topla, dok je ljeto jako vru\u0107e.","Significado: Mientras conduc\xEDa por la I-95, vio un accidente.":"Zna\u010Denje: Dok je vozio autocestom I-95, vidio je nesre\u0107u.","\xA1Correcto! \u{1F60E}":"To\u010Dno! \u{1F60E}","Incorrecto \u{1F6AB}":"Neto\u010Dno \u{1F6AB}"},it:{"Aunque llueve mucho en el verano, Miami siempre est\xE1 llena de turistas.":"Anche se d\u2019estate piove molto, Miami \xE8 sempre piena di turisti.","Decidimos ir a South Beach a pesar del tr\xE1fico pesado.":"Abbiamo deciso di andare a South Beach nonostante il traffico intenso.","Las Wynwood Walls son famosas en todo el mundo por su incre\xEDble arte callejero.":"I Wynwood Walls sono famosi in tutto il mondo per la loro incredibile street art.","Quer\xEDa comer un s\xE1ndwich cubano; sin embargo, el restaurante estaba cerrado.":"Volevo mangiare un panino cubano a Little Havana; tuttavia, il ristorante era chiuso.","El club era extremadamente caro. Por lo tanto, fuimos a un bar m\xE1s barato.":"Il club era carissimo. Perci\xF2 siamo andati in un bar pi\xF9 economico.","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"Miami ha spiagge bellissime. Inoltre, offre un\u2019ottima vita notturna.","En lugar de tomar un taxi, alquilamos un bote.":"Invece di prendere un taxi, abbiamo noleggiato una barca.","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"L\u2019escursione \xE8 stata annullata a causa dell\u2019uragano in arrivo.","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"Ha comprato molti vestiti, anche se erano molto cari.","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"Abbiamo bevuto tre caff\xE8 cubani; ciononostante, eravamo ancora stanchi per il volo.","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"Visto che siamo gi\xE0 a Miami, andiamo a nuotare a South Pointe Park.","No iremos al festival a menos que compres las entradas VIP.":"Non andremo al festival, a meno che tu non compri i biglietti VIP.","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"Ocean Drive \xE8 molto rumorosa, mentre Coral Gables \xE8 piuttosto tranquilla.","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"Mentre andavo in moto d\u2019acqua, ho visto un bellissimo delfino.","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"Miami \xE8 famosa per la sua vita notturna e anche per la sua incredibile cucina.","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"Non voglio andare in discoteca; e poi non ho abbastanza soldi.","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"L\u2019architettura \xE8 storicamente importante. Inoltre, fa da splendido sfondo per le foto.","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"Faceva un caldo incredibile, cos\xEC ci siamo fermati a comprare un gelato.","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"Ci siamo divertiti tantissimo in spiaggia nonostante il temporale inaspettato.","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"Anche se ama lo stile di vita di Miami, odia l\u2019umidit\xE0 estiva.","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"Nonostante fosse stanchissima per il volo, ha ballato salsa tutta la notte.","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"L\u2019hotel aveva una piscina fantastica. Tuttavia, il servizio era lentissimo.","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"Vado sempre in Calle Ocho perch\xE9 servono i migliori cortaditos.","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"Il nostro volo era in ritardo; perci\xF2 abbiamo perso la prenotazione.","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"Il Design District \xE8 noto per la moda. Inoltre, ospita incredibili installazioni artistiche.","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"Dato che il sole della Florida \xE8 fortissimo, devi mettere la crema solare.","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"Non parcheggiare su Ocean Drive, a meno che tu non voglia una multa da 100 $.","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"North Beach \xE8 molto tranquilla, mentre South Beach \xE8 piena di energia.","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"Mentre camminavamo sulla strada rialzata, abbiamo visto dei pappagalli selvatici.","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"Per lavorare nei negozi, aiuta parlare inglese e anche spagnolo fluentemente.","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"Non ho voglia di uscire; e poi domani devo alzarmi presto.","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"Il tour era economico. Inoltre, la guida era molto divertente e preparata.","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"Volevamo fotografare gli alligatori, cos\xEC siamo andati nelle Everglades.","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"Nonostante l\u2019enorme fila fuori, abbiamo deciso di aspettare per entrare nel club.","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"Tutti i voli sono stati cancellati a causa delle allerte meteo.","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"Significato: Il club era aperto; tuttavia, era vuoto.","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"Significato: Anche se faceva molto caldo, abbiamo passeggiato per Wynwood.","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"Significato: Nonostante la pioggia, la festa in piscina \xE8 continuata.","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"Significato: Ha comprato il vestito nonostante il prezzo alto.","Significado: Entramos porque el aire acondicionado estaba encendido.":"Significato: Siamo entrati perch\xE9 l\u2019aria condizionata era accesa.","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"Significato: Avevo dimenticato il portafoglio; perci\xF2 non ho potuto comprare il mojito.","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"Significato: La spiaggia era affollata, cos\xEC siamo andati alla piscina dell\u2019hotel.","Significado: Pidieron empanadas as\xED como croquetas.":"Significato: Hanno ordinato empanadas e anche croquetas.","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"Significato: \xC8 troppo tardi per uscire; e poi sta piovendo.","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"Significato: Il ristorante \xE8 famoso. Inoltre, ha una stella Michelin.","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"Significato: Miami \xE8 un centro finanziario. Inoltre, \xE8 un centro culturale.","Significado: Ya que tenemos un auto, podemos conducir hasta Key West.":"Significato: Visto che abbiamo la macchina, possiamo andare fino a Key West.","Significado: No puedes entrar al \xE1rea VIP a menos que est\xE9s en la lista.":"Significato: Non puoi entrare nell\u2019area VIP, a meno che tu non sia in lista.","Significado: El invierno aqu\xED es c\xE1lido, mientras que el verano es caluroso.":"Significato: Qui l\u2019inverno \xE8 mite, mentre l\u2019estate \xE8 caldissima.","Significado: Mientras conduc\xEDa por la I-95, vio un accidente.":"Significato: Mentre guidava sulla I-95, ha visto un incidente.","\xA1Correcto! \u{1F60E}":"Giusto! \u{1F60E}","Incorrecto \u{1F6AB}":"Sbagliato \u{1F6AB}"},ja:{"Aunque llueve mucho en el verano, Miami siempre est\xE1 llena de turistas.":"\u590F\u306F\u5927\u96E8\u304C\u591A\u3044\u3051\u308C\u3069\u3001\u30DE\u30A4\u30A2\u30DF\u306F\u3044\u3064\u3082\u89B3\u5149\u5BA2\u3067\u3044\u3063\u3071\u3044\u3060\u3002","Decidimos ir a South Beach a pesar del tr\xE1fico pesado.":"\u3072\u3069\u3044\u6E0B\u6EDE\u306B\u3082\u304B\u304B\u308F\u3089\u305A\u3001\u79C1\u305F\u3061\u306F\u30B5\u30A6\u30B9\u30D3\u30FC\u30C1\u3078\u884C\u304F\u3053\u3068\u306B\u3057\u305F\u3002","Las Wynwood Walls son famosas en todo el mundo por su incre\xEDble arte callejero.":"\u30A6\u30A3\u30F3\u30A6\u30C3\u30C9\u30FB\u30A6\u30A9\u30FC\u30EB\u30BA\u306F\u3001\u3059\u3070\u3089\u3057\u3044\u30B9\u30C8\u30EA\u30FC\u30C8\u30A2\u30FC\u30C8\u3067\u4E16\u754C\u7684\u306B\u6709\u540D\u3060\u3002","Quer\xEDa comer un s\xE1ndwich cubano; sin embargo, el restaurante estaba cerrado.":"\u30EA\u30C8\u30EB\u30FB\u30CF\u30D0\u30CA\u3067\u30AD\u30E5\u30FC\u30D0\u30B5\u30F3\u30C9\u30A4\u30C3\u30C1\u3092\u98DF\u3079\u305F\u304B\u3063\u305F\u3002\u3057\u304B\u3057\u3001\u5E97\u306F\u9589\u307E\u3063\u3066\u3044\u305F\u3002","El club era extremadamente caro. Por lo tanto, fuimos a un bar m\xE1s barato.":"\u305D\u306E\u30AF\u30E9\u30D6\u306F\u3068\u3066\u3082\u9AD8\u304B\u3063\u305F\u3002\u3060\u304B\u3089\u3001\u79C1\u305F\u3061\u306F\u3082\u3063\u3068\u5B89\u3044\u30D0\u30FC\u3078\u884C\u3063\u305F\u3002","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"\u30DE\u30A4\u30A2\u30DF\u306B\u306F\u7F8E\u3057\u3044\u30D3\u30FC\u30C1\u304C\u3042\u308B\u3002\u3055\u3089\u306B\u3001\u30CA\u30A4\u30C8\u30E9\u30A4\u30D5\u3082\u3059\u3070\u3089\u3057\u3044\u3002","En lugar de tomar un taxi, alquilamos un bote.":"\u30BF\u30AF\u30B7\u30FC\u306B\u4E57\u308B\u4EE3\u308F\u308A\u306B\u3001\u79C1\u305F\u3061\u306F\u30DC\u30FC\u30C8\u3092\u501F\u308A\u305F\u3002","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"\u8FD1\u3065\u3044\u3066\u304F\u308B\u30CF\u30EA\u30B1\u30FC\u30F3\u306E\u305B\u3044\u3067\u3001\u30C4\u30A2\u30FC\u306F\u4E2D\u6B62\u306B\u306A\u3063\u305F\u3002","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"\u3068\u3066\u3082\u9AD8\u304B\u3063\u305F\u306B\u3082\u304B\u304B\u308F\u3089\u305A\u3001\u5F7C\u5973\u306F\u670D\u3092\u305F\u304F\u3055\u3093\u8CB7\u3063\u305F\u3002","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"\u30AD\u30E5\u30FC\u30D0\u30B3\u30FC\u30D2\u30FC\u30923\u676F\u98F2\u3093\u3060\u3002\u305D\u308C\u3067\u3082\u3001\u79C1\u305F\u3061\u306F\u307E\u3060\u98DB\u884C\u6A5F\u306E\u75B2\u308C\u304C\u6B8B\u3063\u3066\u3044\u305F\u3002","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"\u305B\u3063\u304B\u304F\u30DE\u30A4\u30A2\u30DF\u306B\u3044\u308B\u306E\u3060\u304B\u3089\u3001\u30B5\u30A6\u30B9\u30DD\u30A4\u30F3\u30C8\u516C\u5712\u3078\u6CF3\u304E\u306B\u884C\u3053\u3046\u3002","No iremos al festival a menos que compres las entradas VIP.":"\u541B\u304CVIP\u30C1\u30B1\u30C3\u30C8\u3092\u8CB7\u308F\u306A\u3044\u9650\u308A\u3001\u30D5\u30A7\u30B9\u30C6\u30A3\u30D0\u30EB\u306B\u306F\u884C\u304B\u306A\u3044\u3002","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"\u30AA\u30FC\u30B7\u30E3\u30F3\u30FB\u30C9\u30E9\u30A4\u30D6\u306F\u3068\u3066\u3082\u3046\u308B\u3055\u3044\u304C\u3001\u4E00\u65B9\u30B3\u30FC\u30E9\u30EB\u30FB\u30B2\u30FC\u30D6\u30EB\u30BA\u306F\u304B\u306A\u308A\u9759\u304B\u3060\u3002","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"\u6C34\u4E0A\u30D0\u30A4\u30AF\u306B\u4E57\u3063\u3066\u3044\u308B\u9593\u306B\u3001\u304D\u308C\u3044\u306A\u30A4\u30EB\u30AB\u3092\u898B\u305F\u3002","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"\u30DE\u30A4\u30A2\u30DF\u306F\u30CA\u30A4\u30C8\u30E9\u30A4\u30D5\u3060\u3051\u3067\u306A\u304F\u3001\u3059\u3070\u3089\u3057\u3044\u6599\u7406\u3067\u3082\u6709\u540D\u3060\u3002","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"\u30AF\u30E9\u30D6\u306B\u306F\u884C\u304D\u305F\u304F\u306A\u3044\u3002\u305D\u308C\u306B\u3001\u304A\u91D1\u3082\u8DB3\u308A\u306A\u3044\u3002","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"\u305D\u306E\u5EFA\u7BC9\u306F\u6B74\u53F2\u7684\u306B\u91CD\u8981\u3060\u3002\u3055\u3089\u306B\u3001\u5199\u771F\u306E\u7F8E\u3057\u3044\u80CC\u666F\u306B\u3082\u306A\u308B\u3002","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"\u4FE1\u3058\u3089\u308C\u306A\u3044\u307B\u3069\u6691\u304B\u3063\u305F\u306E\u3067\u3001\u79C1\u305F\u3061\u306F\u30B8\u30A7\u30E9\u30FC\u30C8\u3092\u8CB7\u3044\u306B\u7ACB\u3061\u5BC4\u3063\u305F\u3002","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"\u7A81\u7136\u306E\u96F7\u96E8\u306B\u3082\u304B\u304B\u308F\u3089\u305A\u3001\u30D3\u30FC\u30C1\u3067\u3068\u3066\u3082\u697D\u3057\u304F\u904E\u3054\u3057\u305F\u3002","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"\u5F7C\u306F\u30DE\u30A4\u30A2\u30DF\u306E\u66AE\u3089\u3057\u304C\u5927\u597D\u304D\u3060\u3051\u308C\u3069\u3001\u590F\u306E\u6E7F\u6C17\u306F\u5927\u5ACC\u3044\u3060\u3002","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"\u98DB\u884C\u6A5F\u306E\u75B2\u308C\u306B\u3082\u304B\u304B\u308F\u3089\u305A\u3001\u5F7C\u5973\u306F\u4E00\u6669\u4E2D\u30B5\u30EB\u30B5\u3092\u8E0A\u3063\u305F\u3002","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"\u30DB\u30C6\u30EB\u306E\u30D7\u30FC\u30EB\u306F\u3059\u3070\u3089\u3057\u304B\u3063\u305F\u3002\u3057\u304B\u3057\u3001\u30B5\u30FC\u30D3\u30B9\u306F\u3068\u3066\u3082\u9045\u304B\u3063\u305F\u3002","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"\u6700\u9AD8\u306E\u30B3\u30EB\u30BF\u30C7\u30A3\u30FC\u30C8\u304C\u98F2\u3081\u308B\u306E\u3067\u3001\u79C1\u306F\u3044\u3064\u3082\u30AB\u30B8\u30A7\u30FB\u30AA\u30C1\u30E7\u3078\u884C\u304F\u3002","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"\u98DB\u884C\u6A5F\u304C\u9045\u308C\u305F\u3002\u305D\u306E\u305F\u3081\u3001\u30C7\u30A3\u30CA\u30FC\u306E\u4E88\u7D04\u306B\u9593\u306B\u5408\u308F\u306A\u304B\u3063\u305F\u3002","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"\u30C7\u30B6\u30A4\u30F3\u30FB\u30C7\u30A3\u30B9\u30C8\u30EA\u30AF\u30C8\u306F\u30D5\u30A1\u30C3\u30B7\u30E7\u30F3\u3067\u77E5\u3089\u308C\u3066\u3044\u308B\u3002\u3055\u3089\u306B\u3001\u3059\u3070\u3089\u3057\u3044\u30A2\u30FC\u30C8\u4F5C\u54C1\u3082\u3042\u308B\u3002","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"\u30D5\u30ED\u30EA\u30C0\u306E\u65E5\u5DEE\u3057\u306F\u3068\u3066\u3082\u5F37\u3044\u306E\u3067\u3001\u65E5\u713C\u3051\u6B62\u3081\u3092\u5857\u3089\u306A\u3051\u308C\u3070\u306A\u3089\u306A\u3044\u3002","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"100\u30C9\u30EB\u306E\u7F70\u91D1\u3092\u6255\u3044\u305F\u304F\u306A\u3044\u306A\u3089\u3001\u30AA\u30FC\u30B7\u30E3\u30F3\u30FB\u30C9\u30E9\u30A4\u30D6\u306B\u306F\u99D0\u8ECA\u3059\u308B\u306A\u3002","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"\u30CE\u30FC\u30B9\u30D3\u30FC\u30C1\u306F\u3068\u3066\u3082\u9759\u304B\u3060\u304C\u3001\u4E00\u65B9\u30B5\u30A6\u30B9\u30D3\u30FC\u30C1\u306F\u30A8\u30CD\u30EB\u30AE\u30FC\u306B\u3042\u3075\u308C\u3066\u3044\u308B\u3002","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"\u571F\u624B\u9053\u3092\u6B69\u3044\u3066\u3044\u308B\u9593\u306B\u3001\u91CE\u751F\u306E\u30AA\u30A6\u30E0\u306E\u7FA4\u308C\u3092\u898B\u305F\u3002","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"\u5C0F\u58F2\u696D\u3067\u50CD\u304F\u306B\u306F\u3001\u82F1\u8A9E\u306B\u52A0\u3048\u3066\u30B9\u30DA\u30A4\u30F3\u8A9E\u3082\u6D41\u66A2\u306B\u8A71\u305B\u308B\u3068\u5F79\u306B\u7ACB\u3064\u3002","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"\u51FA\u304B\u3051\u308B\u6C17\u5206\u3058\u3083\u306A\u3044\u3002\u305D\u308C\u306B\u3001\u660E\u65E5\u306F\u65E9\u8D77\u304D\u3057\u306A\u3051\u308C\u3070\u306A\u3089\u306A\u3044\u3002","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"\u305D\u306E\u30C4\u30A2\u30FC\u306F\u5B89\u304B\u3063\u305F\u3002\u3055\u3089\u306B\u3001\u30AC\u30A4\u30C9\u306F\u3068\u3066\u3082\u9762\u767D\u304F\u3066\u8A73\u3057\u304B\u3063\u305F\u3002","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"\u30EF\u30CB\u306E\u5199\u771F\u3092\u64AE\u308A\u305F\u304B\u3063\u305F\u306E\u3067\u3001\u30A8\u30D0\u30FC\u30B0\u30EC\u30FC\u30BA\u307E\u3067\u8ECA\u3067\u884C\u3063\u305F\u3002","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"\u5916\u306E\u9577\u3044\u884C\u5217\u306B\u3082\u304B\u304B\u308F\u3089\u305A\u3001\u79C1\u305F\u3061\u306F\u30AF\u30E9\u30D6\u306B\u5165\u308B\u305F\u3081\u306B\u5F85\u3064\u3053\u3068\u306B\u3057\u305F\u3002","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"\u66B4\u98A8\u96E8\u306E\u8B66\u5831\u306E\u305F\u3081\u3001\u3059\u3079\u3066\u306E\u4FBF\u304C\u6B20\u822A\u306B\u306A\u3063\u305F\u3002","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"\u610F\u5473\uFF1A\u30AF\u30E9\u30D6\u306F\u958B\u3044\u3066\u3044\u305F\u3002\u3057\u304B\u3057\u3001\u4E2D\u306F\u7A7A\u3063\u307D\u3060\u3063\u305F\u3002","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"\u610F\u5473\uFF1A\u3068\u3066\u3082\u6691\u304B\u3063\u305F\u3051\u308C\u3069\u3001\u79C1\u305F\u3061\u306F\u30A6\u30A3\u30F3\u30A6\u30C3\u30C9\u3092\u6B69\u304D\u56DE\u3063\u305F\u3002","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"\u610F\u5473\uFF1A\u96E8\u306B\u3082\u304B\u304B\u308F\u3089\u305A\u3001\u30D7\u30FC\u30EB\u30D1\u30FC\u30C6\u30A3\u30FC\u306F\u7D9A\u3044\u305F\u3002","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"\u610F\u5473\uFF1A\u9AD8\u3044\u5024\u6BB5\u306B\u3082\u304B\u304B\u308F\u3089\u305A\u3001\u5F7C\u5973\u306F\u305D\u306E\u30C9\u30EC\u30B9\u3092\u8CB7\u3063\u305F\u3002","Significado: Entramos porque el aire acondicionado estaba encendido.":"\u610F\u5473\uFF1A\u30A8\u30A2\u30B3\u30F3\u304C\u3064\u3044\u3066\u3044\u305F\u306E\u3067\u3001\u79C1\u305F\u3061\u306F\u4E2D\u306B\u5165\u3063\u305F\u3002","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"\u610F\u5473\uFF1A\u8CA1\u5E03\u3092\u5FD8\u308C\u305F\u3002\u305D\u306E\u305F\u3081\u3001\u30E2\u30D2\u30FC\u30C8\u304C\u8CB7\u3048\u306A\u304B\u3063\u305F\u3002","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"\u610F\u5473\uFF1A\u30D3\u30FC\u30C1\u304C\u6DF7\u3093\u3067\u3044\u305F\u306E\u3067\u3001\u30DB\u30C6\u30EB\u306E\u30D7\u30FC\u30EB\u3078\u884C\u3063\u305F\u3002","Significado: Pidieron empanadas as\xED como croquetas.":"\u610F\u5473\uFF1A\u5F7C\u3089\u306F\u30A8\u30F3\u30D1\u30CA\u30FC\u30C0\u306B\u52A0\u3048\u3066\u30B3\u30ED\u30C3\u30B1\u3082\u6CE8\u6587\u3057\u305F\u3002","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"\u610F\u5473\uFF1A\u51FA\u304B\u3051\u308B\u306B\u306F\u3082\u3046\u9045\u3059\u304E\u308B\u3002\u305D\u308C\u306B\u3001\u96E8\u3082\u964D\u3063\u3066\u3044\u308B\u3002","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"\u610F\u5473\uFF1A\u305D\u306E\u30EC\u30B9\u30C8\u30E9\u30F3\u306F\u6709\u540D\u3060\u3002\u3055\u3089\u306B\u3001\u30DF\u30B7\u30E5\u30E9\u30F3\u306E\u661F\u3082\u6301\u3063\u3066\u3044\u308B\u3002","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"\u610F\u5473\uFF1A\u30DE\u30A4\u30A2\u30DF\u306F\u91D1\u878D\u306E\u4E2D\u5FC3\u5730\u3060\u3002\u3055\u3089\u306B\u3001\u6587\u5316\u306E\u4E2D\u5FC3\u5730\u3067\u3082\u3042\u308B\u3002","Significado: Ya que tenemos un auto, podemos conducir hasta Key West.":"\u610F\u5473\uFF1A\u8ECA\u304C\u3042\u308B\u306E\u3060\u304B\u3089\u3001\u30AD\u30FC\u30A6\u30A7\u30B9\u30C8\u307E\u3067\u904B\u8EE2\u3057\u3066\u884C\u3051\u308B\u3002","Significado: No puedes entrar al \xE1rea VIP a menos que est\xE9s en la lista.":"\u610F\u5473\uFF1A\u30EA\u30B9\u30C8\u306B\u8F09\u3063\u3066\u3044\u306A\u3044\u9650\u308A\u3001VIP\u30A8\u30EA\u30A2\u306B\u306F\u5165\u308C\u306A\u3044\u3002","Significado: El invierno aqu\xED es c\xE1lido, mientras que el verano es caluroso.":"\u610F\u5473\uFF1A\u3053\u3053\u306E\u51AC\u306F\u6696\u304B\u3044\u304C\u3001\u4E00\u65B9\u590F\u306F\u975E\u5E38\u306B\u6691\u3044\u3002","Significado: Mientras conduc\xEDa por la I-95, vio un accidente.":"\u610F\u5473\uFF1AI-95\u3092\u904B\u8EE2\u3057\u3066\u3044\u308B\u9593\u306B\u3001\u5F7C\u306F\u4E8B\u6545\u3092\u898B\u305F\u3002","\xA1Correcto! \u{1F60E}":"\u6B63\u89E3\uFF01\u{1F60E}","Incorrecto \u{1F6AB}":"\u4E0D\u6B63\u89E3 \u{1F6AB}"},pt:{"Aunque llueve mucho en el verano, Miami siempre est\xE1 llena de turistas.":"Embora chova muito no ver\xE3o, Miami est\xE1 sempre cheia de turistas.","Decidimos ir a South Beach a pesar del tr\xE1fico pesado.":"Decidimos ir a South Beach apesar do tr\xE2nsito intenso.","Las Wynwood Walls son famosas en todo el mundo por su incre\xEDble arte callejero.":"Os Wynwood Walls s\xE3o famosos no mundo inteiro pela sua incr\xEDvel arte de rua.","Quer\xEDa comer un s\xE1ndwich cubano; sin embargo, el restaurante estaba cerrado.":"Eu queria comer um sandu\xEDche cubano em Little Havana; no entanto, o restaurante estava fechado.","El club era extremadamente caro. Por lo tanto, fuimos a un bar m\xE1s barato.":"A balada era car\xEDssima. Portanto, fomos a um bar mais barato.","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"Miami tem praias lindas. Al\xE9m disso, oferece uma excelente vida noturna.","En lugar de tomar un taxi, alquilamos un bote.":"Em vez de pegar um t\xE1xi, alugamos um barco.","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"O passeio foi cancelado por causa do furac\xE3o que se aproximava.","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"Ela comprou muitas roupas, mesmo sendo muito caras.","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"Tomamos tr\xEAs caf\xE9s cubanos; mesmo assim, ainda est\xE1vamos cansados do voo.","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"J\xE1 que estamos em Miami, vamos nadar no South Pointe Park.","No iremos al festival a menos que compres las entradas VIP.":"N\xE3o vamos ao festival, a menos que voc\xEA compre os ingressos VIP.","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"A Ocean Drive \xE9 muito barulhenta, enquanto Coral Gables \xE9 bem tranquila.","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"Enquanto eu andava de jet ski, vi um golfinho lindo.","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"Miami \xE9 famosa pela vida noturna, assim como pela sua incr\xEDvel culin\xE1ria.","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"N\xE3o quero ir \xE0 balada; al\xE9m disso, n\xE3o tenho dinheiro suficiente.","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"A arquitetura tem grande import\xE2ncia hist\xF3rica. Al\xE9m disso, \xE9 um lindo cen\xE1rio para fotos.","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"Estava um calor incr\xEDvel, ent\xE3o paramos para comprar sorvete.","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"N\xF3s nos divertimos muito na praia apesar da tempestade inesperada.","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"Embora ame o estilo de vida de Miami, ele odeia a umidade do ver\xE3o.","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"Apesar de estar exausta do voo, ela dan\xE7ou salsa a noite toda.","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"O hotel tinha uma \xF3tima piscina. No entanto, o atendimento era muito lento.","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"Sempre vou \xE0 Calle Ocho porque l\xE1 servem os melhores cortaditos.","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"Nosso voo atrasou; portanto, perdemos a nossa reserva.","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"O Design District \xE9 conhecido pela moda. Al\xE9m disso, tem instala\xE7\xF5es de arte incr\xEDveis.","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"Como o sol da Fl\xF3rida \xE9 muito forte, voc\xEA precisa usar protetor solar.","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"N\xE3o estacione na Ocean Drive, a menos que queira uma multa de 100 d\xF3lares.","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"North Beach \xE9 muito tranquila, enquanto South Beach \xE9 cheia de energia.","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"Enquanto caminh\xE1vamos pela ponte, vimos papagaios selvagens.","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"Para trabalhar no com\xE9rcio, ajuda falar ingl\xEAs assim como espanhol fluentemente.","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"N\xE3o estou com vontade de sair; al\xE9m disso, tenho que acordar cedo amanh\xE3.","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"O passeio foi barato. Al\xE9m disso, o guia era muito engra\xE7ado e informativo.","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"Quer\xEDamos fotografar jacar\xE9s, ent\xE3o fomos de carro at\xE9 os Everglades.","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"Apesar da fila enorme l\xE1 fora, decidimos esperar para entrar na balada.","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"Todos os voos foram cancelados por causa dos alertas de tempestade.","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"Significado: A balada estava aberta; no entanto, estava vazia.","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"Significado: Embora estivesse muito calor, passeamos por Wynwood.","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"Significado: Apesar da chuva, a festa na piscina continuou.","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"Significado: Ela comprou o vestido apesar do pre\xE7o alto.","Significado: Entramos porque el aire acondicionado estaba encendido.":"Significado: Entramos porque o ar-condicionado estava ligado.","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"Significado: Esqueci a carteira; portanto, n\xE3o pude comprar o mojito.","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"Significado: A praia estava lotada, ent\xE3o fomos \xE0 piscina do hotel.","Significado: Pidieron empanadas as\xED como croquetas.":"Significado: Eles pediram empanadas, assim como croquetes.","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"Significado: \xC9 tarde demais para sair; al\xE9m disso, est\xE1 chovendo.","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"Significado: O restaurante \xE9 famoso. Al\xE9m disso, tem uma estrela Michelin.","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"Significado: Miami \xE9 um centro financeiro. Al\xE9m disso, \xE9 um centro cultural.","Significado: Ya que tenemos un auto, podemos conducir hasta Key West.":"Significado: J\xE1 que temos carro, podemos ir at\xE9 Key West.","Significado: No puedes entrar al \xE1rea VIP a menos que est\xE9s en la lista.":"Significado: Voc\xEA n\xE3o pode entrar na \xE1rea VIP, a menos que esteja na lista.","Significado: El invierno aqu\xED es c\xE1lido, mientras que el verano es caluroso.":"Significado: O inverno aqui \xE9 ameno, enquanto o ver\xE3o \xE9 muito quente.","Significado: Mientras conduc\xEDa por la I-95, vio un accidente.":"Significado: Enquanto dirigia pela I-95, ele viu um acidente.","\xA1Correcto! \u{1F60E}":"Correto! \u{1F60E}","Incorrecto \u{1F6AB}":"Errado \u{1F6AB}"},ru:{"Aunque llueve mucho en el verano, Miami siempre est\xE1 llena de turistas.":"\u0425\u043E\u0442\u044F \u043B\u0435\u0442\u043E\u043C \u0438\u0434\u0443\u0442 \u0441\u0438\u043B\u044C\u043D\u044B\u0435 \u0434\u043E\u0436\u0434\u0438, \u0432 \u041C\u0430\u0439\u0430\u043C\u0438 \u0432\u0441\u0435\u0433\u0434\u0430 \u043F\u043E\u043B\u043D\u043E \u0442\u0443\u0440\u0438\u0441\u0442\u043E\u0432.","Decidimos ir a South Beach a pesar del tr\xE1fico pesado.":"\u041C\u044B \u0440\u0435\u0448\u0438\u043B\u0438 \u043F\u043E\u0435\u0445\u0430\u0442\u044C \u043D\u0430 \u0421\u0430\u0443\u0442-\u0411\u0438\u0447, \u043D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u043F\u043B\u043E\u0442\u043D\u043E\u0435 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435.","Las Wynwood Walls son famosas en todo el mundo por su incre\xEDble arte callejero.":"Wynwood Walls \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u044B \u043D\u0430 \u0432\u0435\u0441\u044C \u043C\u0438\u0440 \u0431\u043B\u0430\u0433\u043E\u0434\u0430\u0440\u044F \u043F\u043E\u0442\u0440\u044F\u0441\u0430\u044E\u0449\u0435\u043C\u0443 \u0443\u043B\u0438\u0447\u043D\u043E\u043C\u0443 \u0438\u0441\u043A\u0443\u0441\u0441\u0442\u0432\u0443.","Quer\xEDa comer un s\xE1ndwich cubano; sin embargo, el restaurante estaba cerrado.":"\u042F \u0445\u043E\u0442\u0435\u043B \u0441\u044A\u0435\u0441\u0442\u044C \u043A\u0443\u0431\u0438\u043D\u0441\u043A\u0438\u0439 \u0441\u044D\u043D\u0434\u0432\u0438\u0447 \u0432 \u041C\u0430\u043B\u0435\u043D\u044C\u043A\u043E\u0439 \u0413\u0430\u0432\u0430\u043D\u0435; \u043E\u0434\u043D\u0430\u043A\u043E \u0440\u0435\u0441\u0442\u043E\u0440\u0430\u043D \u0431\u044B\u043B \u0437\u0430\u043A\u0440\u044B\u0442.","El club era extremadamente caro. Por lo tanto, fuimos a un bar m\xE1s barato.":"\u041A\u043B\u0443\u0431 \u0431\u044B\u043B \u043E\u0447\u0435\u043D\u044C \u0434\u043E\u0440\u043E\u0433\u0438\u043C. \u041F\u043E\u044D\u0442\u043E\u043C\u0443 \u043C\u044B \u043F\u043E\u0448\u043B\u0438 \u0432 \u0431\u0430\u0440 \u043F\u043E\u0434\u0435\u0448\u0435\u0432\u043B\u0435.","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"\u0412 \u041C\u0430\u0439\u0430\u043C\u0438 \u043F\u0440\u0435\u043A\u0440\u0430\u0441\u043D\u044B\u0435 \u043F\u043B\u044F\u0436\u0438. \u041A\u0440\u043E\u043C\u0435 \u0442\u043E\u0433\u043E, \u0442\u0430\u043C \u043E\u0442\u043B\u0438\u0447\u043D\u0430\u044F \u043D\u043E\u0447\u043D\u0430\u044F \u0436\u0438\u0437\u043D\u044C.","En lugar de tomar un taxi, alquilamos un bote.":"\u0412\u043C\u0435\u0441\u0442\u043E \u0442\u043E\u0433\u043E \u0447\u0442\u043E\u0431\u044B \u0432\u0437\u044F\u0442\u044C \u0442\u0430\u043A\u0441\u0438, \u043C\u044B \u0430\u0440\u0435\u043D\u0434\u043E\u0432\u0430\u043B\u0438 \u043B\u043E\u0434\u043A\u0443.","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"\u042D\u043A\u0441\u043A\u0443\u0440\u0441\u0438\u044E \u043E\u0442\u043C\u0435\u043D\u0438\u043B\u0438 \u0438\u0437-\u0437\u0430 \u043F\u0440\u0438\u0431\u043B\u0438\u0436\u0430\u044E\u0449\u0435\u0433\u043E\u0441\u044F \u0443\u0440\u0430\u0433\u0430\u043D\u0430.","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"\u041E\u043D\u0430 \u043A\u0443\u043F\u0438\u043B\u0430 \u043C\u043D\u043E\u0433\u043E \u043E\u0434\u0435\u0436\u0434\u044B, \u0445\u043E\u0442\u044F \u043E\u043D\u0430 \u0431\u044B\u043B\u0430 \u043E\u0447\u0435\u043D\u044C \u0434\u043E\u0440\u043E\u0433\u043E\u0439.","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"\u041C\u044B \u0432\u044B\u043F\u0438\u043B\u0438 \u0442\u0440\u0438 \u0447\u0430\u0448\u043A\u0438 \u043A\u0443\u0431\u0438\u043D\u0441\u043A\u043E\u0433\u043E \u043A\u043E\u0444\u0435; \u0442\u0435\u043C \u043D\u0435 \u043C\u0435\u043D\u0435\u0435 \u043C\u044B \u0432\u0441\u0451 \u0435\u0449\u0451 \u0431\u044B\u043B\u0438 \u0443\u0441\u0442\u0430\u0432\u0448\u0438\u043C\u0438 \u043F\u043E\u0441\u043B\u0435 \u043F\u0435\u0440\u0435\u043B\u0451\u0442\u0430.","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"\u0420\u0430\u0437 \u0443\u0436 \u043C\u044B \u0432 \u041C\u0430\u0439\u0430\u043C\u0438, \u043F\u043E\u0439\u0434\u0451\u043C \u043F\u043E\u043F\u043B\u0430\u0432\u0430\u0435\u043C \u0432 \u043F\u0430\u0440\u043A\u0435 \u0421\u0430\u0443\u0442-\u041F\u043E\u0439\u043D\u0442.","No iremos al festival a menos que compres las entradas VIP.":"\u041C\u044B \u043D\u0435 \u043F\u043E\u0439\u0434\u0451\u043C \u043D\u0430 \u0444\u0435\u0441\u0442\u0438\u0432\u0430\u043B\u044C, \u0435\u0441\u043B\u0438 \u0442\u044B \u043D\u0435 \u043A\u0443\u043F\u0438\u0448\u044C VIP-\u0431\u0438\u043B\u0435\u0442\u044B.","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"\u041D\u0430 \u041E\u0443\u0448\u0435\u043D-\u0434\u0440\u0430\u0439\u0432 \u043E\u0447\u0435\u043D\u044C \u0448\u0443\u043C\u043D\u043E, \u0442\u043E\u0433\u0434\u0430 \u043A\u0430\u043A \u0432 \u041A\u043E\u0440\u0430\u043B-\u0413\u0435\u0439\u0431\u043B\u0441 \u0434\u043E\u0432\u043E\u043B\u044C\u043D\u043E \u0442\u0438\u0445\u043E.","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"\u041F\u043E\u043A\u0430 \u044F \u043A\u0430\u0442\u0430\u043B\u0441\u044F \u043D\u0430 \u0433\u0438\u0434\u0440\u043E\u0446\u0438\u043A\u043B\u0435, \u044F \u0443\u0432\u0438\u0434\u0435\u043B \u043A\u0440\u0430\u0441\u0438\u0432\u043E\u0433\u043E \u0434\u0435\u043B\u044C\u0444\u0438\u043D\u0430.","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"\u041C\u0430\u0439\u0430\u043C\u0438 \u0441\u043B\u0430\u0432\u0438\u0442\u0441\u044F \u043D\u043E\u0447\u043D\u043E\u0439 \u0436\u0438\u0437\u043D\u044C\u044E, \u0430 \u0442\u0430\u043A\u0436\u0435 \u043F\u043E\u0442\u0440\u044F\u0441\u0430\u044E\u0449\u0435\u0439 \u043A\u0443\u0445\u043D\u0435\u0439.","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"\u042F \u043D\u0435 \u0445\u043E\u0447\u0443 \u0438\u0434\u0442\u0438 \u0432 \u043A\u043B\u0443\u0431; \u043A \u0442\u043E\u043C\u0443 \u0436\u0435 \u0443 \u043C\u0435\u043D\u044F \u043C\u0430\u043B\u043E \u0434\u0435\u043D\u0435\u0433.","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"\u042D\u0442\u0430 \u0430\u0440\u0445\u0438\u0442\u0435\u043A\u0442\u0443\u0440\u0430 \u0438\u043C\u0435\u0435\u0442 \u0438\u0441\u0442\u043E\u0440\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435. \u041A\u0440\u043E\u043C\u0435 \u0442\u043E\u0433\u043E, \u044D\u0442\u043E \u043A\u0440\u0430\u0441\u0438\u0432\u044B\u0439 \u0444\u043E\u043D \u0434\u043B\u044F \u0444\u043E\u0442\u043E\u0433\u0440\u0430\u0444\u0438\u0439.","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"\u0411\u044B\u043B\u043E \u043D\u0435\u0432\u0435\u0440\u043E\u044F\u0442\u043D\u043E \u0436\u0430\u0440\u043A\u043E, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043C\u044B \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u043B\u0438\u0441\u044C \u043A\u0443\u043F\u0438\u0442\u044C \u043C\u043E\u0440\u043E\u0436\u0435\u043D\u043E\u0435.","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"\u041C\u044B \u043E\u0442\u043B\u0438\u0447\u043D\u043E \u043F\u0440\u043E\u0432\u0435\u043B\u0438 \u0432\u0440\u0435\u043C\u044F \u043D\u0430 \u043F\u043B\u044F\u0436\u0435, \u043D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u043D\u0435\u043E\u0436\u0438\u0434\u0430\u043D\u043D\u0443\u044E \u0433\u0440\u043E\u0437\u0443.","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"\u0425\u043E\u0442\u044F \u043E\u043D \u043E\u0431\u043E\u0436\u0430\u0435\u0442 \u043E\u0431\u0440\u0430\u0437 \u0436\u0438\u0437\u043D\u0438 \u041C\u0430\u0439\u0430\u043C\u0438, \u043E\u043D \u043D\u0435\u043D\u0430\u0432\u0438\u0434\u0438\u0442 \u043B\u0435\u0442\u043D\u044E\u044E \u0432\u043B\u0430\u0436\u043D\u043E\u0441\u0442\u044C.","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"\u041D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u0443\u0441\u0442\u0430\u043B\u043E\u0441\u0442\u044C \u043F\u043E\u0441\u043B\u0435 \u043F\u0435\u0440\u0435\u043B\u0451\u0442\u0430, \u043E\u043D\u0430 \u0432\u0441\u044E \u043D\u043E\u0447\u044C \u0442\u0430\u043D\u0446\u0435\u0432\u0430\u043B\u0430 \u0441\u0430\u043B\u044C\u0441\u0443.","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"\u0412 \u043E\u0442\u0435\u043B\u0435 \u0431\u044B\u043B \u043E\u0442\u043B\u0438\u0447\u043D\u044B\u0439 \u0431\u0430\u0441\u0441\u0435\u0439\u043D. \u041E\u0434\u043D\u0430\u043A\u043E \u043E\u0431\u0441\u043B\u0443\u0436\u0438\u0432\u0430\u043D\u0438\u0435 \u0431\u044B\u043B\u043E \u043E\u0447\u0435\u043D\u044C \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u044B\u043C.","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"\u042F \u0432\u0441\u0435\u0433\u0434\u0430 \u0445\u043E\u0436\u0443 \u043D\u0430 \u041A\u0430\u043B\u043B\u0435-\u041E\u0447\u043E, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0442\u0430\u043C \u043F\u043E\u0434\u0430\u044E\u0442 \u043B\u0443\u0447\u0448\u0438\u0435 \u043A\u043E\u0440\u0442\u0430\u0434\u0438\u0442\u043E\u0441.","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"\u041D\u0430\u0448 \u0440\u0435\u0439\u0441 \u0437\u0430\u0434\u0435\u0440\u0436\u0430\u043B\u0438; \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043C\u044B \u043F\u0440\u043E\u043F\u0443\u0441\u0442\u0438\u043B\u0438 \u0431\u0440\u043E\u043D\u044C \u0432 \u0440\u0435\u0441\u0442\u043E\u0440\u0430\u043D\u0435.","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"\u0414\u0438\u0437\u0430\u0439\u043D-\u0434\u0438\u0441\u0442\u0440\u0438\u043A\u0442 \u0438\u0437\u0432\u0435\u0441\u0442\u0435\u043D \u043C\u043E\u0434\u043E\u0439. \u041A\u0440\u043E\u043C\u0435 \u0442\u043E\u0433\u043E, \u0442\u0430\u043C \u0435\u0441\u0442\u044C \u043F\u043E\u0442\u0440\u044F\u0441\u0430\u044E\u0449\u0438\u0435 \u0430\u0440\u0442-\u0438\u043D\u0441\u0442\u0430\u043B\u043B\u044F\u0446\u0438\u0438.","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"\u041F\u043E\u0441\u043A\u043E\u043B\u044C\u043A\u0443 \u0441\u043E\u043B\u043D\u0446\u0435 \u0432\u043E \u0424\u043B\u043E\u0440\u0438\u0434\u0435 \u043E\u0447\u0435\u043D\u044C \u0441\u0438\u043B\u044C\u043D\u043E\u0435, \u043D\u0443\u0436\u043D\u043E \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u0441\u043E\u043B\u043D\u0446\u0435\u0437\u0430\u0449\u0438\u0442\u043D\u044B\u043C \u043A\u0440\u0435\u043C\u043E\u043C.","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"\u041D\u0435 \u043F\u0430\u0440\u043A\u0443\u0439\u0441\u044F \u043D\u0430 \u041E\u0443\u0448\u0435\u043D-\u0434\u0440\u0430\u0439\u0432, \u0435\u0441\u043B\u0438 \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0435 \u0445\u043E\u0447\u0435\u0448\u044C \u0448\u0442\u0440\u0430\u0444 \u0432 100 \u0434\u043E\u043B\u043B\u0430\u0440\u043E\u0432.","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"\u041D\u043E\u0440\u0442-\u0411\u0438\u0447 \u043E\u0447\u0435\u043D\u044C \u0441\u043F\u043E\u043A\u043E\u0439\u043D\u044B\u0439, \u0442\u043E\u0433\u0434\u0430 \u043A\u0430\u043A \u0421\u0430\u0443\u0442-\u0411\u0438\u0447 \u043F\u043E\u043B\u043E\u043D \u044D\u043D\u0435\u0440\u0433\u0438\u0438.","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"\u041F\u043E\u043A\u0430 \u043C\u044B \u0448\u043B\u0438 \u043F\u043E \u0434\u0430\u043C\u0431\u0435, \u043C\u044B \u0443\u0432\u0438\u0434\u0435\u043B\u0438 \u0434\u0438\u043A\u0438\u0445 \u043F\u043E\u043F\u0443\u0433\u0430\u0435\u0432.","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"\u0414\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u044B \u0432 \u043C\u0430\u0433\u0430\u0437\u0438\u043D\u0435 \u043F\u043E\u043B\u0435\u0437\u043D\u043E \u0433\u043E\u0432\u043E\u0440\u0438\u0442\u044C \u043F\u043E-\u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u0438, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u043E \u043F\u043E-\u0438\u0441\u043F\u0430\u043D\u0441\u043A\u0438.","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"\u041C\u043D\u0435 \u043D\u0435 \u0445\u043E\u0447\u0435\u0442\u0441\u044F \u043D\u0438\u043A\u0443\u0434\u0430 \u0438\u0434\u0442\u0438; \u043A \u0442\u043E\u043C\u0443 \u0436\u0435 \u0437\u0430\u0432\u0442\u0440\u0430 \u043C\u043D\u0435 \u0440\u0430\u043D\u043E \u0432\u0441\u0442\u0430\u0432\u0430\u0442\u044C.","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"\u042D\u043A\u0441\u043A\u0443\u0440\u0441\u0438\u044F \u0431\u044B\u043B\u0430 \u043D\u0435\u0434\u043E\u0440\u043E\u0433\u043E\u0439. \u041A\u0440\u043E\u043C\u0435 \u0442\u043E\u0433\u043E, \u0433\u0438\u0434 \u0431\u044B\u043B \u043E\u0447\u0435\u043D\u044C \u0432\u0435\u0441\u0451\u043B\u044B\u043C \u0438 \u0437\u043D\u0430\u044E\u0449\u0438\u043C.","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"\u041C\u044B \u0445\u043E\u0442\u0435\u043B\u0438 \u0441\u0444\u043E\u0442\u043E\u0433\u0440\u0430\u0444\u0438\u0440\u043E\u0432\u0430\u0442\u044C \u0430\u043B\u043B\u0438\u0433\u0430\u0442\u043E\u0440\u043E\u0432, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043F\u043E\u0435\u0445\u0430\u043B\u0438 \u0432 \u042D\u0432\u0435\u0440\u0433\u043B\u0435\u0439\u0434\u0441.","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"\u041D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u043E\u0433\u0440\u043E\u043C\u043D\u0443\u044E \u043E\u0447\u0435\u0440\u0435\u0434\u044C, \u043C\u044B \u0440\u0435\u0448\u0438\u043B\u0438 \u043F\u043E\u0434\u043E\u0436\u0434\u0430\u0442\u044C, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u043F\u0430\u0441\u0442\u044C \u0432 \u043A\u043B\u0443\u0431.","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"\u0412\u0441\u0435 \u0440\u0435\u0439\u0441\u044B \u043E\u0442\u043C\u0435\u043D\u0438\u043B\u0438 \u0438\u0437-\u0437\u0430 \u0448\u0442\u043E\u0440\u043C\u043E\u0432\u044B\u0445 \u043F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0436\u0434\u0435\u043D\u0438\u0439.","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"\u0421\u043C\u044B\u0441\u043B: \u041A\u043B\u0443\u0431 \u0431\u044B\u043B \u043E\u0442\u043A\u0440\u044B\u0442; \u043E\u0434\u043D\u0430\u043A\u043E \u043E\u043D \u0431\u044B\u043B \u043F\u0443\u0441\u0442.","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"\u0421\u043C\u044B\u0441\u043B: \u0425\u043E\u0442\u044F \u0431\u044B\u043B\u043E \u043E\u0447\u0435\u043D\u044C \u0436\u0430\u0440\u043A\u043E, \u043C\u044B \u0433\u0443\u043B\u044F\u043B\u0438 \u043F\u043E \u0412\u0438\u043D\u0432\u0443\u0434\u0443.","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"\u0421\u043C\u044B\u0441\u043B: \u041D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u0434\u043E\u0436\u0434\u044C, \u0432\u0435\u0447\u0435\u0440\u0438\u043D\u043A\u0430 \u0443 \u0431\u0430\u0441\u0441\u0435\u0439\u043D\u0430 \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0430\u043B\u0430\u0441\u044C.","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"\u0421\u043C\u044B\u0441\u043B: \u041E\u043D\u0430 \u043A\u0443\u043F\u0438\u043B\u0430 \u043F\u043B\u0430\u0442\u044C\u0435, \u043D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u0432\u044B\u0441\u043E\u043A\u0443\u044E \u0446\u0435\u043D\u0443.","Significado: Entramos porque el aire acondicionado estaba encendido.":"\u0421\u043C\u044B\u0441\u043B: \u041C\u044B \u0437\u0430\u0448\u043B\u0438 \u0432\u043D\u0443\u0442\u0440\u044C, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0440\u0430\u0431\u043E\u0442\u0430\u043B \u043A\u043E\u043D\u0434\u0438\u0446\u0438\u043E\u043D\u0435\u0440.","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"\u0421\u043C\u044B\u0441\u043B: \u042F \u0437\u0430\u0431\u044B\u043B \u043A\u043E\u0448\u0435\u043B\u0451\u043A; \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043D\u0435 \u0441\u043C\u043E\u0433 \u043A\u0443\u043F\u0438\u0442\u044C \u043C\u043E\u0445\u0438\u0442\u043E.","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"\u0421\u043C\u044B\u0441\u043B: \u041D\u0430 \u043F\u043B\u044F\u0436\u0435 \u0431\u044B\u043B\u043E \u043C\u043D\u043E\u0433\u043E \u043B\u044E\u0434\u0435\u0439, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043C\u044B \u043F\u043E\u0448\u043B\u0438 \u043A \u0431\u0430\u0441\u0441\u0435\u0439\u043D\u0443 \u043E\u0442\u0435\u043B\u044F.","Significado: Pidieron empanadas as\xED como croquetas.":"\u0421\u043C\u044B\u0441\u043B: \u041E\u043D\u0438 \u0437\u0430\u043A\u0430\u0437\u0430\u043B\u0438 \u044D\u043C\u043F\u0430\u043D\u0430\u0434\u0430\u0441, \u0430 \u0442\u0430\u043A\u0436\u0435 \u043A\u0440\u043E\u043A\u0435\u0442\u044B.","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"\u0421\u043C\u044B\u0441\u043B: \u0423\u0436\u0435 \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u043F\u043E\u0437\u0434\u043D\u043E \u043A\u0443\u0434\u0430-\u0442\u043E \u0438\u0434\u0442\u0438; \u043A \u0442\u043E\u043C\u0443 \u0436\u0435 \u0438\u0434\u0451\u0442 \u0434\u043E\u0436\u0434\u044C.","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"\u0421\u043C\u044B\u0441\u043B: \u0420\u0435\u0441\u0442\u043E\u0440\u0430\u043D \u0437\u043D\u0430\u043C\u0435\u043D\u0438\u0442. \u041A\u0440\u043E\u043C\u0435 \u0442\u043E\u0433\u043E, \u0443 \u043D\u0435\u0433\u043E \u0435\u0441\u0442\u044C \u0437\u0432\u0435\u0437\u0434\u0430 \u041C\u0438\u0448\u043B\u0435\u043D.","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"\u0421\u043C\u044B\u0441\u043B: \u041C\u0430\u0439\u0430\u043C\u0438 \u2014 \u0444\u0438\u043D\u0430\u043D\u0441\u043E\u0432\u044B\u0439 \u0446\u0435\u043D\u0442\u0440. \u041A\u0440\u043E\u043C\u0435 \u0442\u043E\u0433\u043E, \u044D\u0442\u043E \u043A\u0443\u043B\u044C\u0442\u0443\u0440\u043D\u044B\u0439 \u0446\u0435\u043D\u0442\u0440.","Significado: Ya que tenemos un auto, podemos conducir hasta Key West.":"\u0421\u043C\u044B\u0441\u043B: \u0420\u0430\u0437 \u0443 \u043D\u0430\u0441 \u0435\u0441\u0442\u044C \u043C\u0430\u0448\u0438\u043D\u0430, \u043C\u044B \u043C\u043E\u0436\u0435\u043C \u0434\u043E\u0435\u0445\u0430\u0442\u044C \u0434\u043E \u041A\u0438-\u0423\u044D\u0441\u0442\u0430.","Significado: No puedes entrar al \xE1rea VIP a menos que est\xE9s en la lista.":"\u0421\u043C\u044B\u0441\u043B: \u0422\u044B \u043D\u0435 \u043F\u043E\u043F\u0430\u0434\u0451\u0448\u044C \u0432 VIP-\u0437\u043E\u043D\u0443, \u0435\u0441\u043B\u0438 \u0442\u0435\u0431\u044F \u043D\u0435\u0442 \u0432 \u0441\u043F\u0438\u0441\u043A\u0435.","Significado: El invierno aqu\xED es c\xE1lido, mientras que el verano es caluroso.":"\u0421\u043C\u044B\u0441\u043B: \u0417\u0438\u043C\u0430 \u0437\u0434\u0435\u0441\u044C \u0442\u0451\u043F\u043B\u0430\u044F, \u0442\u043E\u0433\u0434\u0430 \u043A\u0430\u043A \u043B\u0435\u0442\u043E \u043E\u0447\u0435\u043D\u044C \u0436\u0430\u0440\u043A\u043E\u0435.","Significado: Mientras conduc\xEDa por la I-95, vio un accidente.":"\u0421\u043C\u044B\u0441\u043B: \u041A\u043E\u0433\u0434\u0430 \u043E\u043D \u0435\u0445\u0430\u043B \u043F\u043E \u0442\u0440\u0430\u0441\u0441\u0435 I-95, \u043E\u043D \u0443\u0432\u0438\u0434\u0435\u043B \u0430\u0432\u0430\u0440\u0438\u044E.","\xA1Correcto! \u{1F60E}":"\u041F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u043E! \u{1F60E}","Incorrecto \u{1F6AB}":"\u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u043E \u{1F6AB}"},zh:{"Aunque llueve mucho en el verano, Miami siempre est\xE1 llena de turistas.":"\u867D\u7136\u590F\u5929\u7ECF\u5E38\u4E0B\u5927\u96E8\uFF0C\u8FC8\u963F\u5BC6\u603B\u662F\u6324\u6EE1\u4E86\u6E38\u5BA2\u3002","Decidimos ir a South Beach a pesar del tr\xE1fico pesado.":"\u5C3D\u7BA1\u4EA4\u901A\u5F88\u5835\uFF0C\u6211\u4EEC\u8FD8\u662F\u51B3\u5B9A\u53BB\u5357\u6D77\u6EE9\u3002","Las Wynwood Walls son famosas en todo el mundo por su incre\xEDble arte callejero.":"\u6E29\u4F0D\u5FB7\u5899\u56E0\u5176\u7CBE\u5F69\u7684\u8857\u5934\u827A\u672F\u800C\u95FB\u540D\u4E16\u754C\u3002","Quer\xEDa comer un s\xE1ndwich cubano; sin embargo, el restaurante estaba cerrado.":"\u6211\u60F3\u5728\u5C0F\u54C8\u74E6\u90A3\u5403\u4E00\u4E2A\u53E4\u5DF4\u4E09\u660E\u6CBB\uFF1B\u7136\u800C\uFF0C\u9910\u5385\u5173\u95E8\u4E86\u3002","El club era extremadamente caro. Por lo tanto, fuimos a un bar m\xE1s barato.":"\u90A3\u5BB6\u4FF1\u4E50\u90E8\u592A\u8D35\u4E86\u3002\u56E0\u6B64\uFF0C\u6211\u4EEC\u53BB\u4E86\u4E00\u5BB6\u4FBF\u5B9C\u70B9\u7684\u9152\u5427\u3002","Miami tiene hermosas playas. Adem\xE1s, ofrece una excelente vida nocturna.":"\u8FC8\u963F\u5BC6\u6709\u7F8E\u4E3D\u7684\u6D77\u6EE9\u3002\u6B64\u5916\uFF0C\u90A3\u91CC\u7684\u591C\u751F\u6D3B\u4E5F\u5F88\u68D2\u3002","En lugar de tomar un taxi, alquilamos un bote.":"\u6211\u4EEC\u6CA1\u6709\u6253\u8F66\uFF0C\u800C\u662F\u79DF\u4E86\u4E00\u6761\u8239\u3002","El paseo fue cancelado debido al hurac\xE1n que se aproximaba.":"\u7531\u4E8E\u98D3\u98CE\u903C\u8FD1\uFF0C\u6E38\u89C8\u88AB\u53D6\u6D88\u4E86\u3002","Compr\xF3 mucha ropa a pesar de que (aunque) era muy cara.":"\u5C3D\u7BA1\u8863\u670D\u5F88\u8D35\uFF0C\u5979\u8FD8\u662F\u4E70\u4E86\u5F88\u591A\u3002","Tomamos tres tragos de caf\xE9; aun as\xED, todav\xEDa est\xE1bamos cansados.":"\u6211\u4EEC\u559D\u4E86\u4E09\u676F\u53E4\u5DF4\u5496\u5561\uFF1B\u5C3D\u7BA1\u5982\u6B64\uFF0C\u6211\u4EEC\u8FD8\u662F\u56E0\u4E3A\u5750\u98DE\u673A\u800C\u5F88\u7D2F\u3002","Ya que estamos en Miami, vamos a nadar a South Pointe Park.":"\u65E2\u7136\u6211\u4EEC\u5DF2\u7ECF\u5728\u8FC8\u963F\u5BC6\u4E86\uFF0C\u5C31\u53BB\u5357\u89D2\u516C\u56ED\u6E38\u6CF3\u5427\u3002","No iremos al festival a menos que compres las entradas VIP.":"\u9664\u975E\u4F60\u4E70VIP\u95E8\u7968\uFF0C\u5426\u5219\u6211\u4EEC\u4E0D\u53BB\u97F3\u4E50\u8282\u3002","Ocean Drive es muy ruidoso, mientras que Coral Gables es bastante tranquilo.":"\u6D77\u6D0B\u5927\u9053\u975E\u5E38\u5435\u95F9\uFF0C\u800C\u73CA\u745A\u9601\u5219\u76F8\u5F53\u5B89\u9759\u3002","Mientras conduc\xEDa la moto acu\xE1tica, vi un hermoso delf\xEDn.":"\u6211\u9A91\u6C34\u4E0A\u6469\u6258\u7684\u65F6\u5019\uFF0C\u770B\u5230\u4E86\u4E00\u53EA\u6F02\u4EAE\u7684\u6D77\u8C5A\u3002","Miami es famosa por su vida nocturna as\xED como por su incre\xEDble cocina.":"\u8FC8\u963F\u5BC6\u4EE5\u591C\u751F\u6D3B\u4EE5\u53CA\u7F8E\u5473\u7684\u7F8E\u98DF\u800C\u95FB\u540D\u3002","No quiero ir al club; adem\xE1s, no tengo suficiente dinero.":"\u6211\u4E0D\u60F3\u53BB\u4FF1\u4E50\u90E8\uFF1B\u518D\u8BF4\uFF0C\u6211\u7684\u94B1\u4E5F\u4E0D\u591F\u3002","La arquitectura es hist\xF3ricamente significativa. Adem\xE1s, proporciona un hermoso fondo.":"\u8FD9\u79CD\u5EFA\u7B51\u5177\u6709\u5386\u53F2\u610F\u4E49\u3002\u6B64\u5916\uFF0C\u5B83\u8FD8\u662F\u62CD\u7167\u7684\u6F02\u4EAE\u80CC\u666F\u3002","Hac\xEDa un calor incre\xEDble, as\xED que nos detuvimos a comprar helado.":"\u5929\u6C14\u70ED\u5F97\u4E0D\u5F97\u4E86\uFF0C\u6240\u4EE5\u6211\u4EEC\u505C\u4E0B\u6765\u4E70\u51B0\u6DC7\u6DCB\u3002","Nos lo pasamos genial en la playa a pesar de la inesperada tormenta.":"\u5C3D\u7BA1\u4E0B\u5348\u7A81\u7136\u4E0B\u8D77\u96F7\u96E8\uFF0C\u6211\u4EEC\u5728\u6D77\u6EE9\u4E0A\u8FD8\u662F\u73A9\u5F97\u5F88\u5F00\u5FC3\u3002","Aunque ama el estilo de vida de Miami, odia la humedad del verano.":"\u867D\u7136\u4ED6\u559C\u6B22\u8FC8\u963F\u5BC6\u7684\u751F\u6D3B\u65B9\u5F0F\uFF0C\u4F46\u4ED6\u8BA8\u538C\u590F\u5929\u7684\u6F6E\u6E7F\u3002","A pesar de estar exhausta por el vuelo, bail\xF3 salsa toda la noche.":"\u5C3D\u7BA1\u5750\u98DE\u673A\u5F88\u7D2F\uFF0C\u5979\u8FD8\u662F\u8DF3\u4E86\u4E00\u6574\u665A\u8428\u5C14\u8428\u821E\u3002","El hotel ten\xEDa una gran piscina. Sin embargo, el servicio fue lento.":"\u9152\u5E97\u7684\u6CF3\u6C60\u5F88\u68D2\u3002\u7136\u800C\uFF0C\u670D\u52A1\u975E\u5E38\u6162\u3002","Siempre visito la Calle Ocho porque sirven los mejores cortaditos.":"\u6211\u603B\u662F\u53BB\u7B2C\u516B\u8857\uFF0C\u56E0\u4E3A\u90A3\u91CC\u6709\u6700\u597D\u7684\u53E4\u5DF4\u5496\u5561\u3002","Nuestro vuelo se retras\xF3; por lo tanto, perdimos nuestra reserva.":"\u6211\u4EEC\u7684\u822A\u73ED\u5EF6\u8BEF\u4E86\uFF1B\u56E0\u6B64\uFF0C\u6211\u4EEC\u9519\u8FC7\u4E86\u665A\u9910\u9884\u8BA2\u3002","El Design District es conocido por la moda. Adem\xE1s, presenta incre\xEDbles instalaciones de arte.":"\u8BBE\u8BA1\u533A\u4EE5\u65F6\u5C1A\u95FB\u540D\u3002\u6B64\u5916\uFF0C\u90A3\u91CC\u8FD8\u6709\u7CBE\u5F69\u7684\u827A\u672F\u88C5\u7F6E\u3002","Dado que el sol de Florida es muy fuerte, debes usar protector solar.":"\u7531\u4E8E\u4F5B\u7F57\u91CC\u8FBE\u7684\u9633\u5149\u975E\u5E38\u5F3A\u70C8\uFF0C\u4F60\u5FC5\u987B\u6D82\u9632\u6652\u971C\u3002","No estaciones en Ocean Drive a menos que quieras una multa de $100.":"\u9664\u975E\u4F60\u60F3\u6536\u5230100\u7F8E\u5143\u7684\u7F5A\u5355\uFF0C\u5426\u5219\u522B\u5728\u6D77\u6D0B\u5927\u9053\u505C\u8F66\u3002","North Beach es muy tranquila, mientras que South Beach es en\xE9rgica.":"\u5317\u6D77\u6EE9\u5F88\u5B89\u9759\uFF0C\u800C\u5357\u6D77\u6EE9\u5219\u5145\u6EE1\u6D3B\u529B\u3002","Mientras camin\xE1bamos por la calzada, vimos loros salvajes.":"\u6211\u4EEC\u6CBF\u7740\u5824\u9053\u6563\u6B65\u7684\u65F6\u5019\uFF0C\u770B\u5230\u4E86\u4E00\u7FA4\u91CE\u751F\u9E66\u9E49\u3002","Para trabajar en tiendas, ayuda hablar ingl\xE9s as\xED como espa\xF1ol fluidamente.":"\u5728\u8FC8\u963F\u5BC6\u505A\u96F6\u552E\u5DE5\u4F5C\uFF0C\u4F1A\u8BF4\u82F1\u8BED\u4EE5\u53CA\u6D41\u5229\u7684\u897F\u73ED\u7259\u8BED\u5F88\u6709\u5E2E\u52A9\u3002","No tengo ganas de salir; adem\xE1s, tengo que despertarme temprano ma\xF1ana.":"\u6211\u4E0D\u60F3\u51FA\u53BB\uFF1B\u518D\u8BF4\uFF0C\u6211\u660E\u5929\u8FD8\u5F97\u65E9\u8D77\u3002","El tour fue asequible. Adem\xE1s, el gu\xEDa fue muy divertido e informativo.":"\u8FD9\u6B21\u6E38\u89C8\u5F88\u4FBF\u5B9C\u3002\u6B64\u5916\uFF0C\u5BFC\u6E38\u65E2\u5E7D\u9ED8\u53C8\u4E13\u4E1A\u3002","Quer\xEDamos tomar fotos de caimanes, as\xED que condujimos a los Everglades.":"\u6211\u4EEC\u60F3\u62CD\u77ED\u543B\u9CC4\uFF0C\u6240\u4EE5\u5F00\u8F66\u53BB\u4E86\u5927\u6CBC\u6CFD\u5730\u3002","A pesar de la enorme fila afuera, decidimos esperar para entrar al club.":"\u5C3D\u7BA1\u5916\u9762\u6392\u7740\u957F\u961F\uFF0C\u6211\u4EEC\u8FD8\u662F\u51B3\u5B9A\u7B49\u7740\u8FDB\u4FF1\u4E50\u90E8\u3002","Todos los vuelos fueron cancelados debido a las advertencias de tormenta.":"\u7531\u4E8E\u66B4\u98CE\u96E8\u8B66\u62A5\uFF0C\u6240\u6709\u822A\u73ED\u90FD\u88AB\u53D6\u6D88\u4E86\u3002","Significado: El club estaba abierto; sin embargo, estaba vac\xEDo.":"\u610F\u601D\uFF1A\u4FF1\u4E50\u90E8\u5F00\u7740\uFF1B\u7136\u800C\uFF0C\u91CC\u9762\u6CA1\u6709\u4EBA\u3002","Significado: Aunque hac\xEDa mucho calor, caminamos por Wynwood.":"\u610F\u601D\uFF1A\u867D\u7136\u5929\u6C14\u5F88\u70ED\uFF0C\u6211\u4EEC\u8FD8\u662F\u5728\u6E29\u4F0D\u5FB7\u901B\u4E86\u901B\u3002","Significado: A pesar de la lluvia, la fiesta en la piscina continu\xF3.":"\u610F\u601D\uFF1A\u5C3D\u7BA1\u4E0B\u96E8\uFF0C\u6CF3\u6C60\u6D3E\u5BF9\u8FD8\u5728\u7EE7\u7EED\u3002","Significado: Ella compr\xF3 el vestido a pesar del alto precio.":"\u610F\u601D\uFF1A\u5C3D\u7BA1\u4EF7\u683C\u5F88\u9AD8\uFF0C\u5979\u8FD8\u662F\u4E70\u4E86\u90A3\u6761\u88D9\u5B50\u3002","Significado: Entramos porque el aire acondicionado estaba encendido.":"\u610F\u601D\uFF1A\u6211\u4EEC\u8FDB\u53BB\u4E86\uFF0C\u56E0\u4E3A\u7A7A\u8C03\u5F00\u7740\u3002","Significado: Olvid\xE9 mi billetera; por lo tanto, no pude comprar el mojito.":"\u610F\u601D\uFF1A\u6211\u5FD8\u4E86\u5E26\u94B1\u5305\uFF1B\u56E0\u6B64\uFF0C\u6211\u4E70\u4E0D\u4E86\u83AB\u5409\u6258\u3002","Significado: La playa estaba llena, as\xED que fuimos a la piscina del hotel.":"\u610F\u601D\uFF1A\u6D77\u6EE9\u4E0A\u4EBA\u592A\u591A\uFF0C\u6240\u4EE5\u6211\u4EEC\u53BB\u4E86\u9152\u5E97\u7684\u6CF3\u6C60\u3002","Significado: Pidieron empanadas as\xED como croquetas.":"\u610F\u601D\uFF1A\u4ED6\u4EEC\u70B9\u4E86\u6069\u6F58\u7EB3\u8FBE\u4EE5\u53CA\u70B8\u4E38\u5B50\u3002","Significado: Es demasiado tarde para salir; adem\xE1s, est\xE1 lloviendo.":"\u610F\u601D\uFF1A\u73B0\u5728\u51FA\u53BB\u592A\u665A\u4E86\uFF1B\u518D\u8BF4\uFF0C\u8FD8\u5728\u4E0B\u96E8\u3002","Significado: El restaurante es famoso. Adem\xE1s, tiene una estrella Michelin.":"\u610F\u601D\uFF1A\u8FD9\u5BB6\u9910\u5385\u5F88\u6709\u540D\u3002\u6B64\u5916\uFF0C\u5B83\u8FD8\u6709\u7C73\u5176\u6797\u661F\u7EA7\u3002","Significado: Miami es un centro financiero. Adem\xE1s, es un centro cultural.":"\u610F\u601D\uFF1A\u8FC8\u963F\u5BC6\u662F\u91D1\u878D\u4E2D\u5FC3\u3002\u6B64\u5916\uFF0C\u5B83\u4E5F\u662F\u6587\u5316\u4E2D\u5FC3\u3002","Significado: Ya
