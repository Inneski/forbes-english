<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C1 Lesson</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&family=Inconsolata:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f5f0e8;
  --surface:  #fffdf8;
  --surface2: #ede8de;
  --ink:      #1a1610;
  --ink2:     #4a4035;
  --ink3:     #8a7d6a;
  --accent:   #b5451b;
  --accent2:  #d4622e;
  --accent-light: rgba(181,69,27,0.08);
  --accent-border: rgba(181,69,27,0.25);
  --correct:  #2a6e3f;
  --correct-bg: rgba(42,110,63,0.09);
  --wrong:    #b5451b;
  --wrong-bg: rgba(181,69,27,0.09);
  --tab-done: rgba(42,110,63,0.15);
  --border:   #d8d0c2;
  --shadow:   0 2px 24px rgba(26,22,16,0.08);
  --radius:   10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  line-height: 1.65;
  min-height: 100vh;
}

/* grain texture overlay */
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  opacity: 0.4;
}

/* ── PAGE LAYOUT ── */
.page { max-width: 860px; margin: 0 auto; padding: 40px 24px 100px; }

/* ── LOGO ── */
.logo-wrap {
  text-align: center;
  padding: 36px 0 28px;
  animation: fadeDown .6s ease both;
}

/* ── LESSON INTRO ── */
.lesson-intro {
  text-align: center;
  margin-bottom: 36px;
  animation: fadeDown .6s .08s ease both;
}

.level-chip {
  display: inline-block;
  font-family: 'Inconsolata', monospace;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-border);
  background: var(--accent-light);
  padding: 4px 14px;
  border-radius: 99px;
  margin-bottom: 14px;
}

.lesson-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(28px,5vw,44px);
  font-weight: 700;
  line-height: 1.15;
  color: var(--ink);
  margin-bottom: 10px;
}

.lesson-sub {
  font-size: 14px;
  color: var(--ink3);
  font-weight: 300;
  max-width: 520px;
  margin: 0 auto;
}

/* ── SCORE STRIP ── */
.score-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 20px;
  margin-bottom: 28px;
  box-shadow: var(--shadow);
}

.score-strip-label {
  font-family: 'Inconsolata', monospace;
  font-size: 11px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink3);
}

.score-strip-val {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}

.score-strip-total { font-size: 13px; color: var(--ink3); }

/* ── TABS ── */
.tabs-wrap {
  margin-bottom: 32px;
  animation: fadeDown .5s .15s ease both;
}

.tabs-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.tab-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 10px 12px;
  cursor: pointer;
  text-align: center;
  transition: border-color .2s, background .2s, transform .15s, box-shadow .2s;
  position: relative;
  font-family: 'Outfit', sans-serif;
}

.tab-btn:hover:not(.tab-locked) {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-border);
  transform: translateY(-2px);
}

.tab-btn.tab-active {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--accent-border), var(--shadow);
}

.tab-btn.tab-done {
  border-color: var(--correct);
  background: var(--correct-bg);
}

.tab-btn.tab-locked {
  opacity: .45;
  cursor: not-allowed;
}

.tab-num {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--ink3);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.tab-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
}

.tab-detail {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 3px;
  font-weight: 300;
}

.tab-status {
  position: absolute;
  top: 8px; right: 10px;
  font-size: 12px;
}

.tab-active-bar {
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 99px;
}

/* ── ACTIVITY PANELS ── */
.activity-panel { display: none; animation: fadeUp .4s ease both; }
.activity-panel.panel-active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.card-label {
  font-family: 'Inconsolata', monospace;
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}

.q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  font-weight: 600;
  font-style: italic;
  line-height: 1.45;
  color: var(--ink);
  margin-bottom: 22px;
}

.context-block {
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  font-size: 13.5px;
  color: var(--ink2);
  font-style: italic;
  margin-bottom: 22px;
  line-height: 1.6;
}

/* ── CHOICES ── */
.choices { display: flex; flex-direction: column; gap: 9px; }

.choice-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 13px 16px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 13px;
  text-align: left;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.5;
  transition: border-color .18s, background .18s, transform .12s;
}

.choice-btn:hover:not(:disabled) {
  border-color: var(--accent2);
  background: var(--accent-light);
  transform: translateX(3px);
}

.choice-btn:disabled { cursor: default; }
.choice-btn.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
.choice-btn.wrong   { border-color: var(--wrong);   background: var(--wrong-bg);   color: var(--wrong); }

.choice-key {
  font-family: 'Inconsolata', monospace;
  font-size: 11px;
  min-width: 22px; height: 22px;
  border: 1px solid currentColor;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  opacity: .65; flex-shrink: 0; margin-top: 1px;
  font-weight: 500;
}

/* ── FEEDBACK ── */
.fb {
  margin-top: 14px;
  padding: 14px 18px;
  border-radius: 8px;
  font-size: 13.5px;
  line-height: 1.6;
  display: none;
}
.fb.show { display: block; animation: fadeUp .3s ease; }
.fb.fb-ok  { background: var(--correct-bg); border: 1px solid rgba(42,110,63,.2); color: var(--correct); }
.fb.fb-err { background: var(--wrong-bg);   border: 1px solid rgba(181,69,27,.2); color: var(--wrong); }
.fb-head { font-weight: 600; margin-bottom: 3px; }
.fb-body { color: var(--ink3); font-size: 13px; }

/* ── BUTTONS ── */
.btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

.btn-check {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
  border-radius: 7px;
  padding: 11px 26px;
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: background .18s, transform .12s;
}
.btn-check:hover:not(:disabled) { background: var(--accent-light); transform: translateY(-1px); }
.btn-check:disabled { opacity: .3; cursor: default; transform: none; }

.btn-next {
  background: var(--accent);
  color: #fffdf8;
  border: none;
  border-radius: 7px;
  padding: 11px 26px;
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  display: none;
  transition: background .18s, transform .12s;
}
.btn-next.show { display: inline-flex; align-items: center; gap: 6px; }
.btn-next:hover { background: var(--accent2); transform: translateY(-1px); }

/* ── ACTIVITY COMPLETE BAR ── */
.activity-complete {
  background: var(--correct-bg);
  border: 1px solid rgba(42,110,63,.2);
  border-radius: var(--radius);
  padding: 16px 22px;
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 16px;
  display: none;
}
.activity-complete.show { display: flex; animation: fadeUp .4s ease; }
.activity-complete-text { font-size: 14px; color: var(--correct); font-weight: 500; }
.btn-goto-next {
  background: var(--correct);
  color: #fff;
  border: none; border-radius: 7px;
  padding: 10px 22px;
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: opacity .18s;
}
.btn-goto-next:hover { opacity: .85; }

/* ── MATCHING ── */
.match-instructions {
  font-size: 13.5px; color: var(--ink3); margin-bottom: 18px;
  font-style: italic;
}
.match-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col-head {
  font-family: 'Inconsolata', monospace;
  font-size: 10px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink3);
  margin-bottom: 6px;
}
.match-pill {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 13px; cursor: pointer;
  transition: border-color .18s, background .18s;
  margin-bottom: 7px;
  line-height: 1.4;
}
.match-pill:hover:not(.mpaired):not(.mlocked) { border-color: var(--accent); background: var(--accent-light); }
.match-pill.mselected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.match-pill.mpaired   { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); cursor: default; }
.match-pill.mbad      { border-color: var(--wrong); background: var(--wrong-bg); }
.match-pill.mlocked   { pointer-events: none; opacity: .5; }

/* ── ORDERING ── */
.order-instr { font-size: 13.5px; color: var(--ink3); font-style: italic; margin-bottom: 16px; }
.order-list  { display: flex; flex-direction: column; gap: 8px; }
.order-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 13px 16px;
  cursor: grab;
  display: flex; align-items: flex-start; gap: 12px;
  font-size: 13.5px; line-height: 1.5;
  transition: border-color .18s, transform .12s;
  user-select: none;
}
.order-item:active { cursor: grabbing; }
.order-item.dragging  { opacity: .35; transform: scale(.98); }
.order-item.drag-over { border-color: var(--accent); background: var(--accent-light); }
.order-item.ok-order  { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
.order-item.bad-order { border-color: var(--wrong);   background: var(--wrong-bg);   color: var(--wrong); }
.order-grip {
  font-family: 'Inconsolata', monospace;
  font-size: 11px; color: var(--ink3);
  min-width: 20px; padding-top: 1px;
}

/* ── FINAL ── */
.final-wrap {
  display: none; text-align: center;
  padding: 60px 32px;
  animation: fadeUp .6s ease both;
}
.final-wrap.show { display: block; }

.ring-svg { display: block; margin: 0 auto 28px; }

.final-score-big {
  font-family: 'Cormorant Garamond', serif;
  font-size: 56px; font-weight: 700;
  color: var(--accent); line-height: 1;
  margin-bottom: 4px;
}
.final-score-sub { font-size: 13px; color: var(--ink3); margin-bottom: 24px; }
.final-heading {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px; font-weight: 700;
  margin-bottom: 12px;
}
.final-msg {
  font-size: 15px; color: var(--ink2); line-height: 1.75;
  max-width: 480px; margin: 0 auto 32px;
  font-weight: 300;
}
.btn-restart {
  background: var(--accent); color: #fffdf8;
  border: none; border-radius: 8px;
  padding: 14px 40px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background .18s, transform .15s;
}
.btn-restart:hover { background: var(--accent2); transform: translateY(-2px); }

/* ── ANIMATIONS ── */
@keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeUp   { from { opacity:0; transform:translateY(12px);  } to { opacity:1; transform:translateY(0); } }

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .tabs-row { grid-template-columns: repeat(2,1fr); }
  .match-cols { grid-template-columns: 1fr; }
  .card { padding: 22px 18px; }
}
</style>
</head>

  <div class="lesson-intro">

let score = 0;

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function updateScore(){ document.getElementById('scoreVal').textContent=score; document.getElementById('scoreTot').textContent='/ '+totalPts+' pts'; }
function updateProgressLabel(t){ document.getElementById('progressLabel').textContent='Part '+(t+1)+' active'; }

// TABS
// ═══════════════════════════════════════════════════
function switchTab(i){
  if(!tabUnlocked[i]) return;
  currentTab = i;
  for(let t=0;t<4;t++){
    const btn=document.getElementById('tab-'+t);
    const bar=document.getElementById('tabbar-'+t);
    btn.classList.remove('tab-active');
    bar.style.display='none';
    document.getElementById('panel-'+t).classList.remove('panel-active');
  }
  document.getElementById('tab-'+i).classList.add('tab-active');
  document.getElementById('tabbar-'+i).style.display='block';
  document.getElementById('panel-'+i).classList.add('panel-active');
  updateProgressLabel(i);
  if(i===0 && !mcRendered){ mcRendered=true; renderMCQuestion(); }
  if(i===1 && !vocRendered){ vocRendered=true; renderVocabQuestion(); }
  if(i===2 && !matchRendered){ matchRendered=true; renderMatching(); }
  if(i===3 && !orderRendered){ orderRendered=true; renderOrdering(); }
}

function unlockTab(i){
  tabUnlocked[i]=true;
  const btn=document.getElementById('tab-'+i);
  btn.classList.remove('tab-locked');
  document.getElementById('tabst-'+i).textContent='';
}

function markTabDone(i){
  tabDone[i]=true;
  const btn=document.getElementById('tab-'+i);
  btn.classList.add('tab-done');
  document.getElementById('tabst-'+i).textContent='✓';
}

function completeTab(i){
  markTabDone(i);
  unlockTab(i+1);
  switchTab(i+1);
}

// ═══════════════════════════════════════════════════
// PART 1 — MC COMPREHENSION
// ═══════════════════════════════════════════════════
function renderMCQuestion(){
  const container = document.getElementById('mc-container');
  container.innerHTML='';
  if(mcIdx >= mcData.length){ showMCDone(); return; }
  const q = mcData[mcIdx];
  const card = document.createElement('div'); card.className='card';

  const idxArr = shuffle([0,1,2,3]);
  const correctShuffled = idxArr.indexOf(q.ans);
  const letters = ['A','B','C','D'];

  card.innerHTML=`
    <div class="card-label">Question ${mcIdx+1} of ${mcData.length} — Comprehension</div>
    <div class="q-text">${q.q}</div>
    <div class="context-block">${q.ctx}</div>
    <div class="choices" id="mc-choices"></div>
    <div class="fb" id="mc-fb"></div>
    <div class="btn-row">
      <button class="btn-next" id="mc-next">${mcIdx<mcData.length-1?'Next question →':'See Part 1 results →'}</button>
    </div>`;
  container.appendChild(card);

  const choicesEl = card.querySelector('#mc-choices');
  idxArr.forEach((origIdx,pos)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-key">${letters[pos]}</span><span>${q.opts[origIdx]}</span>`;
    btn.addEventListener('click',()=>checkMC(btn, pos===correctShuffled, q.why, card));
    choicesEl.appendChild(btn);
  });

  card.querySelector('#mc-next').addEventListener('click',()=>{ mcIdx++; renderMCQuestion(); });
}

function checkMC(btn, isCorrect, why, card){
  card.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const fb=card.querySelector('#mc-fb');
  if(isCorrect){ btn.classList.add('correct'); score++; mcScore++; fb.className='fb fb-ok show'; fb.innerHTML=`<div class="fb-head">Correct</div><div class="fb-body">${why}</div>`; }
  else{ btn.classList.add('wrong'); fb.className='fb fb-err show'; fb.innerHTML=`<div class="fb-head">Not quite.</div><div class="fb-body">${why}</div>`; }
  updateScore();
  card.querySelector('#mc-next').classList.add('show');
}

function showMCDone(){
  document.getElementById('mc-done-text').textContent=`Part 1 complete — you scored ${mcScore} out of ${mcData.length}`;
  document.getElementById('mc-done').classList.add('show');
}

    <div class="context-block">${q.ctx}</div>
    <div class="choices" id="voc-choices"></div>

      <button class="btn-next" id="voc-next">${vocIdx<vocabData.length-1?'Next question →':'See Part 2 results →'}</button>

  const choicesEl=card.querySelector('#voc-choices');

function checkVoc(btn,isCorrect,why,card){
  card.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const fb=card.querySelector('#voc-fb');

  else{ btn.classList.add('wrong'); fb.className='fb fb-err show'; fb.innerHTML=`<div class="fb-head">Not quite.</div><div class="fb-body">${why}</div>`; }

}

function showVocabDone(){

// ═══════════════════════════════════════════════════
// PART 3 — MATCHING
// ═══════════════════════════════════════════════════
function renderMatching(){
  const container=document.getElementById('match-container');
  const card=document.createElement('div'); card.className='card';
  const shuffledDefs=shuffle(matchData.map((m,i)=>({...m,origIdx:i})));

  card.innerHTML=`
    <div class="card-label">Part 3 — Matching (6 pairs)</div>
    <div class="q-text" style="font-size:18px;font-style:normal">Match each term to its precise definition.</div>
    <p class="match-instructions">Select a <strong>term</strong> on the left, then click its matching definition on the right. All terms are drawn directly from the TED Talk.</p>
    <div class="match-cols">
      <div>
        <div class="match-col-head">Terms</div>
        <div id="terms-col"></div>
      </div>
      <div>
        <div class="match-col-head">Definitions</div>
        <div id="defs-col"></div>
      </div>
    </div>
    <div class="fb" id="match-fb"></div>`;
  container.appendChild(card);

  const termsCol=card.querySelector('#terms-col');
  const defsCol=card.querySelector('#defs-col');

  matchData.forEach((m,i)=>{
    const t=document.createElement('div');
    t.className='match-pill'; t.textContent=m.term;
    t.dataset.termIdx=i;
    t.addEventListener('click',()=>selectTerm(t,i));
    termsCol.appendChild(t);
  });

  shuffledDefs.forEach(m=>{
    const d=document.createElement('div');
    d.className='match-pill'; d.textContent=m.def;
    d.dataset.origIdx=m.origIdx;
    d.addEventListener('click',()=>selectDef(d));
    defsCol.appendChild(d);
  });
}

function selectTerm(el,idx){
  if(el.classList.contains('mpaired')) return;
  document.querySelectorAll('#terms-col .match-pill').forEach(e=>e.classList.remove('mselected'));
  el.classList.add('mselected'); matchSel=idx;
}

function selectDef(el){
  if(el.classList.contains('mpaired')||matchSel===null) return;
  const origIdx=parseInt(el.dataset.origIdx);
  const termEl=document.querySelector(`#terms-col .match-pill[data-term-idx="${matchSel}"]`);
  if(origIdx===matchSel){
    el.classList.add('mpaired'); termEl.classList.remove('mselected'); termEl.classList.add('mpaired');
    matchCorrectCount++; matchPaired++;
  } else {
    el.classList.add('mbad'); termEl.classList.add('mbad');
    matchPaired++;
    setTimeout(()=>{ el.classList.remove('mbad'); termEl.classList.remove('mbad','mselected'); },700);
  }
  matchSel=null;
  if(matchCorrectCount===matchData.length){
    score+=matchData.length; updateScore();
    const fb=document.getElementById('match-fb');
    fb.className='fb fb-ok show';
    fb.innerHTML=`<div class="fb-head">All matched correctly.</div><div class="fb-body">These six terms capture the conceptual framework of the talk. Well done at C1 level — the distinctions between them are precise.</div>`;
    document.querySelectorAll('#match-container .match-pill').forEach(e=>e.classList.add('mlocked'));
    document.getElementById('match-done-text').textContent=`Part 3 complete — all 6 pairs matched correctly`;
    document.getElementById('match-done').classList.add('show');
  }
}

function renderOrdering(){

    <div class="q-text" style="font-size:18px;font-style:normal">Reconstruct the argument.</div>
    <p class="order-instr">Drag the six statements below into the order in which they appear in the talk, from first to last.</p>
    <div class="order-list" id="order-list"></div>
    <div class="fb" id="order-fb"></div>
    <div class="btn-row">
      <button class="btn-check" id="order-check">Check order</button>
      <button class="btn-next" id="order-next">See final results →</button>
    </div>`;
  container.appendChild(card);
  buildOrderList(shuffled);

  card.querySelector('#order-check').addEventListener('click',()=>checkOrder(card));
  card.querySelector('#order-next').addEventListener('click',()=>{
    document.getElementById('order-done-text').textContent='Part 4 complete — sequence checked';
    document.getElementById('order-done').classList.add('show');
  });
}

function buildOrderList(items){
  const list=document.getElementById('order-list');
  list.innerHTML='';
  items.forEach((item,i)=>{
    const el=document.createElement('div');
    el.className='order-item'; el.draggable=true; el.dataset.id=item.id;
    el.innerHTML=`<span class="order-grip">${i+1}</span><span>${item.text}</span>`;
    el.addEventListener('dragstart',e=>{ dragSrc=el; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend',()=>el.classList.remove('dragging','drag-over'));
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('drag-over');
      if(dragSrc&&dragSrc!==el){
        const all=[...list.querySelectorAll('.order-item')];
        const si=all.indexOf(dragSrc), ti=all.indexOf(el);
        if(si<ti) list.insertBefore(dragSrc,el.nextSibling); else list.insertBefore(dragSrc,el);
        list.querySelectorAll('.order-grip').forEach((g,n)=>g.textContent=n+1);
      }
    });
    list.appendChild(el);
  });
}

function checkOrder(card){
  const items=[...document.getElementById('order-list').querySelectorAll('.order-item')];
  const userOrder=items.map(el=>parseInt(el.dataset.id));
  const correct=orderData.map(s=>s.id);
  let pts=0;
  items.forEach((el,i)=>{ el.draggable=false; if(parseInt(el.dataset.id)===correct[i]){el.classList.add('ok-order');pts++;}else{el.classList.add('bad-order');} });
  const bonus=pts>=5?1:0; score+=bonus; updateScore();
  const fb=document.getElementById('order-fb');
  fb.className='fb '+(pts>=4?'fb-ok':'fb-err')+' show';
  fb.innerHTML=`<div class="fb-head">You placed ${pts} of ${correct.length} items correctly.</div><div class="fb-body">The talk moves from personal motivation, through diagnosis of systemic problems, to evidence-based solutions, and ends with a call to intentional use of AI. Green items are correctly positioned.</div>`;
  card.querySelector('#order-check').disabled=true;
  card.querySelector('#order-next').classList.add('show');
}

// ═══════════════════════════════════════════════════
// FINAL
// ═══════════════════════════════════════════════════
function showFinal(){
  markTabDone(3);
  ['panel-0','panel-1','panel-2','panel-3'].forEach(id=>document.getElementById(id).classList.remove('panel-active'));
  document.getElementById('finalWrap').classList.add('show');

  const pct=Math.round((score/totalPts)*100);
  document.getElementById('finalBig').textContent=score;
  document.getElementById('finalSub').textContent='out of '+totalPts+' points ('+pct+'%)';

  let head,msg;
  if(pct>=85){ head='Exceptional performance.'; msg='You demonstrated C1-level precision throughout — reading between the lines of the argument, engaging with nuanced vocabulary in context, and reconstructing the logic of the talk with accuracy. That is exactly the productive struggle the speaker was advocating.'; }
  else if(pct>=65){ head='Strong work.'; msg='You showed solid C1 competency with some areas to revisit. Focus particularly on the vocabulary-in-context section — at this level, distinguishing connotation and register is where comprehension deepens. Return and try the questions you found hardest.'; }
  else{ head='Keep working.'; msg='This is genuinely challenging C1 material. The speaker\'s argument about retrieval practice applies here too — return to the talk, attempt the questions again from memory, and notice where your understanding shifts. The struggle is the point.'; }

  document.getElementById('finalHead').textContent=head;
  document.getElementById('finalMsg').textContent=msg;

  setTimeout(()=>{
    const circ=339.3;
    document.getElementById('ringCircle').style.strokeDashoffset=circ-(pct/100)*circ;
  },400);
}

function restart(){
  score=0; mcIdx=0; mcScore=0; vocIdx=0; vocScore=0;
  matchSel=null; matchPaired=0; matchCorrectCount=0;
  mcRendered=false; vocRendered=false; matchRendered=false; orderRendered=false;
  tabUnlocked=[true,false,false,false]; tabDone=[false,false,false,false];

  document.getElementById('finalWrap').classList.remove('show');
  for(let i=0;i<4;i++){
    const btn=document.getElementById('tab-'+i);
    btn.classList.remove('tab-active','tab-done');
    if(i>0) btn.classList.add('tab-locked');
    document.getElementById('tabst-'+i).textContent=i>0?'🔒':'';
    document.getElementById('tabbar-'+i).style.display='none';
    document.getElementById('panel-'+i).classList.remove('panel-active');
    document.getElementById('mc-done').classList.remove('show');
    document.getElementById('vocab-done').classList.remove('show');
    document.getElementById('match-done').classList.remove('show');
    document.getElementById('order-done').classList.remove('show');
  }
  document.getElementById('mc-container').innerHTML='';
  document.getElementById('vocab-container').innerHTML='';
  document.getElementById('match-container').innerHTML='';
  document.getElementById('order-container').innerHTML='';
  updateScore();
  switchTab(0);
}
