<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Labelled profile of the head and neck">
<title>Face and neck</title>
<style>
  .bg   { fill: #f4eee2; }
  .body { fill: #1b2340; }
  .cut  { fill: #ef4b6b; }
  .soft { fill: #ef4b6b; opacity: .42; }
  .mute { fill: #3c4a72; }
  .lead { fill: none; stroke: #1b2340; stroke-width: 1.6; opacity: .7; }
  .dot  { fill: #ef4b6b; stroke: #f4eee2; stroke-width: 1.5; }
  .lbl  { font-family: 'DM Sans', system-ui, sans-serif; font-size: 21px;
           font-weight: 600; fill: #1b2340; }
  .ttl  { font-family: 'Playfair Display', Georgia, serif; font-size: 34px;
           font-weight: 700; fill: #1b2340; }
  .sub  { font-family: 'DM Mono', ui-monospace, monospace; font-size: 12.5px;
           letter-spacing: .14em; fill: #ef4b6b; }
</style>
<rect class="bg" x="0" y="0" width="1280" height="720"/>
<text class="sub" x="64" y="64">FORBES ENGLISH · C1 BODY PARTS</text>
<text class="ttl" x="64" y="104">Face &amp; neck</text>

<!-- ── head and neck, profile, facing right ─────────────────────── -->
<path class="body" d="
  M 452 470
  C 414 430 400 372 402 316
  C 404 240 452 132 528 132
  C 578 132 606 176 610 226
  L 611 288
  C 612 296 616 300 622 304
  L 646 372
  C 650 380 646 386 638 388
  L 616 392
  C 612 400 614 406 620 410
  C 610 414 600 416 596 420
  C 604 424 612 428 616 434
  C 606 442 596 446 592 452
  L 596 462
  C 600 470 596 476 588 476
  L 566 480
  C 552 496 528 504 496 500
  L 500 566
  C 500 606 524 628 566 644
  L 640 668
  L 640 720 L 360 720 L 360 668
  L 424 646
  C 458 630 472 606 472 566
  L 472 496
  C 472 490 460 482 452 470 Z"/>

<!-- ear: spans eye line to nose base, set behind the jaw hinge -->
<ellipse class="mute" cx="458" cy="332" rx="18" ry="32"/>
<path class="bg" d="M 452 316 q 13 5 10 22 q -3 15 -13 17 l 0 -7 q 8 -3 10 -13 q 2 -12 -10 -13 Z" opacity=".35"/>

<!-- brow ridge and eyebrow -->
<path class="cut" d="M 552 281 q 32 -10 52 3 l -3 10 q -22 -10 -47 -2 Z"/>
<!-- eye + lid -->
<ellipse class="mute" cx="572" cy="307" rx="22" ry="12"/>
<!-- eyelashes fringe the lid, angled forward -->
<g class="cut">
  <rect x="556" y="299" width="3" height="11" transform="rotate(-42 556 299)"/>
  <rect x="568" y="296" width="3" height="12" transform="rotate(-30 568 296)"/>
  <rect x="580" y="295" width="3" height="12" transform="rotate(-18 580 295)"/>
  <rect x="592" y="297" width="3" height="11" transform="rotate(-6 592 297)"/>
</g>
<!-- temple: the flat area behind the eye, in front of the ear -->
<circle class="soft" cx="512" cy="291" r="19"/>
<!-- nostril, on the underside of the nose -->
<path class="cut" d="M 620 384 q 16 -4 20 6 q -14 6 -20 -6 Z"/>
<!-- lips -->
<path class="cut" d="M 590 406 q 22 -6 32 -2 l -2 7 q -12 -3 -30 3 Z"/>
<path class="cut" d="M 590 418 q 20 6 30 0 l -4 9 q -12 4 -26 -2 Z"/>
<!-- throat: the internal passage down the front of the neck -->
<path class="cut" d="M 516 510 q 20 8 24 32 l 0 82 l -26 -9 l 0 -74 q -2 -19 2 -31 Z" opacity=".8"/>

  <polyline class="lead" points="500,210 300,190"/>
  <circle class="dot" cx="500" cy="210" r="4.5"/>
  <text class="lbl" x="288" y="196" text-anchor="end">forehead</text>
  <polyline class="lead" points="512,291 300,268"/>
  <circle class="dot" cx="512" cy="291" r="4.5"/>
  <text class="lbl" x="288" y="274" text-anchor="end">temple</text>
  <polyline class="lead" points="578,287 300,346"/>
  <circle class="dot" cx="578" cy="287" r="4.5"/>
  <text class="lbl" x="288" y="352" text-anchor="end">eyebrow</text>
  <polyline class="lead" points="578,306 300,424"/>
  <circle class="dot" cx="578" cy="306" r="4.5"/>
  <text class="lbl" x="288" y="430" text-anchor="end">eyelash</text>
  <polyline class="lead" points="630,388 900,356"/>
  <circle class="dot" cx="630" cy="388" r="4.5"/>
  <text class="lbl" x="916" y="362" text-anchor="start">nostril</text>
  <polyline class="lead" points="612,424 900,440"/>
  <circle class="dot" cx="612" cy="424" r="4.5"/>
  <text class="lbl" x="916" y="446" text-anchor="start">lip</text>
  <polyline class="lead" points="594,464 900,524"/>
  <circle class="dot" cx="594" cy="464" r="4.5"/>
  <text class="lbl" x="916" y="530" text-anchor="start">chin</text>
  <polyline class="lead" points="528,582 900,608"/>
  <circle class="dot" cx="528" cy="582" r="4.5"/>
  <text class="lbl" x="916" y="614" text-anchor="start">throat</text>
  <polyline class="lead" points="452,600 300,600"/>
  <circle class="dot" cx="452" cy="600" r="4.5"/>
  <text class="lbl" x="288" y="606" text-anchor="end">neck</text>
</svg>
