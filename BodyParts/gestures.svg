<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Four hands, each making a different gesture">
<title>Verbs of contact — four hands</title>
<!-- The hero of the idioms and verbs deck, and the background of its verb
     section. Wordless on purpose: it sits behind question slides where a
     labelled plate would be an answer key, and under the cover logo, which
     needs the top third empty. Same flat vocabulary as the anatomy plates —
     navy mass, coral where the lesson is pointing. -->
<style>
  .bg   { fill: #f4eee2; }
  .limb { fill: #1b2340; }
  .cut  { fill: #ef4b6b; }
  .soft { fill: #ef4b6b; opacity: .45; }
  .band { fill: #46557f; opacity: .45; }
</style>
<rect class="bg" x="0" y="0" width="1600" height="900"/>

<!-- ══ 1. the pointing hand — nudge, point, thumb a lift ══════════ -->
<g transform="translate(250,846)">
  <!-- thumb, folded in across the palm -->
  <g class="limb">
    <rect x="-94" y="-292" width="40" height="152" rx="20"
          transform="rotate(-42 -74 -140)"/>
    <circle cx="-74" cy="-142" r="24"/>
  </g>
  <rect class="cut" x="-62" y="-36" width="124" height="36" rx="14"/>
  <path class="limb" d="M -74 -36 L 74 -36 L 74 -214 C 74 -240 56 -254 26 -254
    L -42 -254 C -62 -254 -74 -240 -74 -214 Z"/>
  <ellipse class="soft" cx="0" cy="-126" rx="52" ry="46"/>
  <!-- index finger, extended -->
  <rect class="limb" x="-42" y="-416" width="36" height="184" rx="18"/>
  <!-- the rest, curled down -->
  <rect class="limb" x="0" y="-300" width="34" height="68" rx="17"/>
  <rect class="limb" x="38" y="-292" width="32" height="62" rx="16"/>
  <g class="cut">
    <circle cx="-24" cy="-244" r="13"/><circle cx="17" cy="-240" r="13"/>
    <circle cx="54" cy="-236" r="12"/>
  </g>
</g>

<!-- ══ 2. the open hand — slap, pat, stroke ═══════════════════════ -->
<g transform="translate(660,846)">
  <g class="limb">
    <rect x="-100" y="-306" width="42" height="164" rx="21"
          transform="rotate(-44 -78 -142)"/>
    <circle cx="-78" cy="-144" r="25"/>
  </g>
  <rect class="cut" x="-66" y="-36" width="132" height="36" rx="14"/>
  <path class="limb" d="M -78 -36 L 78 -36 L 78 -222 C 78 -248 60 -262 30 -262
    L -46 -262 C -66 -262 -78 -248 -78 -222 Z"/>
  <ellipse class="soft" cx="0" cy="-130" rx="56" ry="50"/>
  <g class="limb">
    <rect x="-74" y="-392" width="35" height="158" rx="17"/>
    <rect x="-33" y="-414" width="35" height="180" rx="17"/>
    <rect x="8" y="-402" width="35" height="168" rx="17"/>
    <rect x="49" y="-372" width="32" height="140" rx="16"/>
  </g>
  <g class="cut">
    <circle cx="-56" cy="-250" r="14"/><circle cx="-15" cy="-254" r="14"/>
    <circle cx="26" cy="-250" r="14"/><circle cx="65" cy="-242" r="13"/>
  </g>
</g>

<!-- ══ 3. the fist — smack, knock, and the knuckles themselves ════ -->
<g transform="translate(1060,846)">
  <rect class="cut" x="-64" y="-36" width="128" height="36" rx="14"/>
  <path class="limb" d="M -78 -36 L 78 -36 L 78 -252 C 78 -288 56 -308 18 -308
    L -40 -308 C -66 -308 -78 -288 -78 -252 Z"/>
  <!-- the folded fingers, read as bands across the front -->
  <g class="band">
    <rect x="-72" y="-238" width="144" height="9" rx="4.5"/>
    <rect x="-72" y="-188" width="144" height="9" rx="4.5"/>
    <rect x="-72" y="-138" width="144" height="9" rx="4.5"/>
  </g>
  <!-- knuckles, along the ridge -->
  <g class="cut">
    <circle cx="-50" cy="-290" r="17"/><circle cx="-12" cy="-300" r="17"/>
    <circle cx="26" cy="-298" r="17"/><circle cx="62" cy="-284" r="15"/>
  </g>
  <!-- thumb, wrapped across the front of the fingers -->
  <g class="limb">
    <rect x="74" y="-236" width="40" height="120" rx="20"
          transform="rotate(24 94 -176)"/>
    <circle cx="86" cy="-130" r="22"/>
  </g>
</g>

<!-- ══ 4. the pinch — pinch, squeeze, take hold of something ══════ -->
<g transform="translate(1440,846)">
  <rect class="cut" x="-60" y="-36" width="120" height="36" rx="14"/>
  <path class="limb" d="M -72 -36 L 72 -36 L 72 -206 C 72 -232 54 -246 24 -246
    L -40 -246 C -60 -246 -72 -232 -72 -206 Z"/>
  <ellipse class="soft" cx="0" cy="-122" rx="50" ry="44"/>
  <!-- curled ring and little fingers, behind -->
  <g fill="#46557f">
    <rect x="16" y="-296" width="32" height="66" rx="16"/>
    <rect x="52" y="-288" width="30" height="60" rx="15"/>
  </g>
  <!-- index finger, curving in to the tip -->
  <path class="limb" d="M -28 -240 C -44 -304 -30 -356 2 -384
    C 16 -396 34 -390 34 -374 C 34 -358 18 -350 6 -338
    C -8 -322 -10 -288 -2 -252 Z"/>
  <!-- thumb, curving up to meet it -->
  <path class="limb" d="M -72 -184 C -110 -226 -108 -288 -76 -330
    C -62 -348 -40 -346 -36 -330 C -32 -314 -44 -300 -46 -284
    C -50 -258 -42 -234 -26 -220 Z"/>
  <!-- what is held between them -->
  <circle class="cut" cx="-14" cy="-372" r="15"/>
</g>
</svg>
