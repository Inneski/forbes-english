<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Two profiles facing each other across two speech ribbons">
<title>Activation — two people, talking</title>
<!-- The results and activation background on both body decks: the point of
     the lesson is that the words leave the page and get said to somebody.
     Wordless, and the centre is deliberately quiet — the activation slide
     puts its target-language chips and two panels straight over it. -->
<style>
  .bg     { fill: #f4eee2; }
  .body   { fill: #1b2340; }
  .body2  { fill: #2b3557; }
  .cut    { fill: #ef4b6b; }
  .mute   { fill: #3c4a72; }
  .ribbon { fill: #ef4b6b; }
</style>
<rect class="bg" x="0" y="0" width="1280" height="720"/>

<defs>
<g id="head">
  <path d="
    M 452 470
    C 414 430 400 372 402 316
    C 404 240 452 132 528 132
    C 578 132 606 176 610 226
    L 611 288
    C 612 296 616 300 622 304
    L 646 372
    C 650 380 646 386 638 388
    L 616 392
    C 612 400 614 406 620 410
    C 610 414 600 416 596 420
    C 604 424 612 428 616 434
    C 606 442 596 446 592 452
    L 596 462
    C 600 470 596 476 588 476
    L 566 480
    C 552 496 528 504 496 500
    L 500 566
    C 500 606 524 628 566 644
    L 640 668
    L 640 720 L 360 720 L 360 668
    L 424 646
    C 458 630 472 606 472 566
    L 472 496
    C 472 490 460 482 452 470 Z"/>
</g>
</defs>

<!-- ── the listener, left, facing in ─────────────────────────────── -->
<g transform="translate(-252,180) scale(0.72)">
  <use href="#head" class="body"/>
  <ellipse class="mute" cx="458" cy="332" rx="18" ry="32"/>
  <path class="cut" d="M 552 281 q 32 -10 52 3 l -3 10 q -22 -10 -47 -2 Z"/>
  <ellipse class="mute" cx="572" cy="307" rx="22" ry="12"/>
  <path class="cut" d="M 590 408 q 22 -6 32 -2 l -2 7 q -12 -3 -30 3 Z"/>
  <path class="cut" d="M 590 420 q 20 6 30 0 l -4 9 q -12 4 -26 -2 Z"/>
</g>

<!-- ── the speaker, right, mirrored ──────────────────────────────── -->
<g transform="translate(1532,180) scale(-0.72,0.72)">
  <use href="#head" class="body2"/>
  <ellipse class="mute" cx="458" cy="332" rx="18" ry="32"/>
  <path class="cut" d="M 552 281 q 32 -10 52 3 l -3 10 q -22 -10 -47 -2 Z"/>
  <ellipse class="mute" cx="572" cy="307" rx="22" ry="12"/>
  <!-- this one is mid-sentence -->
  <path class="cut" d="M 588 404 q 24 -8 34 -2 q 6 4 0 10 q -14 12 -34 10 Z"/>
  <path class="cut" d="M 588 422 q 22 10 34 2 q -8 16 -34 10 Z"/>
</g>

<!-- ── what passes between them ──────────────────────────────────── -->
<path class="ribbon" d="M 470 176 h 308 a 26 26 0 0 1 26 26 v 66
  a 26 26 0 0 1 -26 26 h -228 l -52 36 8 -36 h -36
  a 26 26 0 0 1 -26 -26 v -66 a 26 26 0 0 1 26 -26 Z" opacity=".9"/>
<g fill="#f4eee2" opacity=".8">
  <rect x="502" y="208" width="182" height="14" rx="7"/>
  <rect x="502" y="238" width="240" height="14" rx="7"/>
</g>

<path class="ribbon" d="M 516 372 h 266 a 24 24 0 0 1 24 24 v 60
  a 24 24 0 0 1 -24 24 h -196 l -48 32 8 -32 h -30
  a 24 24 0 0 1 -24 -24 v -60 a 24 24 0 0 1 24 -24 Z" opacity=".42"/>
<g fill="#1b2340" opacity=".5">
  <rect x="546" y="402" width="150" height="13" rx="6.5"/>
  <rect x="546" y="430" width="204" height="13" rx="6.5"/>
</g>
</svg>
