<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Labelled front view of the torso and internal organs">
<title>Torso and organs</title>
<style>
  .bg    { fill: #f4eee2; }
  .skin  { fill: #1b2340; opacity: .10; }
  .bone  { fill: #46557f; }
  .rib   { fill: none; stroke: #46557f; stroke-width: 6; stroke-linecap: round; opacity: .85; }
  .pelv  { fill: none; stroke: #46557f; stroke-width: 8; stroke-linecap: round; }
  .organ { fill: #ef4b6b; stroke: #1b2340; stroke-width: 2.5; stroke-opacity: .5; }
  .lungs { fill: #ef4b6b; opacity: .42; stroke: #1b2340; stroke-width: 2.5; stroke-opacity: .4; }
  .vein  { fill: none; stroke: #2b8f9e; stroke-linecap: round; }
  .lead  { fill: none; stroke: #1b2340; stroke-width: 1.6; opacity: .7; }
  .dot   { fill: #ef4b6b; stroke: #f4eee2; stroke-width: 1.5; }
  .lbl   { font-family: 'DM Sans', system-ui, sans-serif; font-size: 20px;
            font-weight: 600; fill: #1b2340; }
  .ttl   { font-family: 'Playfair Display', Georgia, serif; font-size: 34px;
            font-weight: 700; fill: #1b2340; }
  .sub   { font-family: 'DM Mono', ui-monospace, monospace; font-size: 12.5px;
            letter-spacing: .14em; fill: #ef4b6b; }
  .note  { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px;
            letter-spacing: .1em; fill: #46557f; }
</style>
<rect class="bg" x="0" y="0" width="1280" height="720"/>
<text class="sub" x="64" y="64">FORBES ENGLISH · C1 BODY PARTS</text>
<text class="ttl" x="64" y="104">Torso &amp; organs</text>
<text class="note" x="64" y="132">FROM THE FRONT — THE FIGURE'S RIGHT IS ON YOUR LEFT</text>

<!-- 1. the body -->
<path class="skin" d="
  M 568 146 L 672 146
  C 704 146 754 172 762 218
  C 770 262 762 336 750 378
  C 738 418 724 436 722 462
  C 720 500 742 540 746 584
  L 740 656 L 500 656 L 494 584
  C 498 540 520 500 518 462
  C 516 436 502 418 490 378
  C 478 336 470 262 478 218
  C 486 172 536 146 568 146 Z"/>

<!-- 2. spine, where a front view would show it -->
  <rect class="bone" x="603" y="432" width="34" height="12" rx="4"/>
  <rect class="bone" x="603" y="449" width="34" height="12" rx="4"/>
  <rect class="bone" x="603" y="466" width="34" height="12" rx="4"/>
  <rect class="bone" x="603" y="483" width="34" height="12" rx="4"/>
  <rect class="bone" x="603" y="500" width="34" height="12" rx="4"/>

<!-- 3. kidneys: behind everything. Figure's RIGHT (your left) sits lower. -->
<path class="organ" d="M 564 440 c -20 -3 -33 10 -33 29 c 0 20 14 33 31 29
  c 7 -2 5 -11 -2 -16 c -9 -6 -9 -20 0 -26 c 7 -5 9 -14 4 -16 Z"/>
<path class="organ" d="M 676 420 c 20 -3 33 10 33 29 c 0 20 -14 33 -31 29
  c -7 -2 -5 -11 2 -16 c 9 -6 9 -20 0 -26 c -7 -5 -9 -14 -4 -16 Z"/>

<!-- 4. lungs. The figure's LEFT (your right) is the narrower one — the
     heart takes a bite out of its inner edge. -->
<path class="lungs" d="M 594 212 C 528 220 502 274 508 326
  C 512 358 536 366 566 352 C 588 342 596 306 594 254 Z"/>
<path class="lungs" d="M 646 212 C 712 220 738 274 732 326
  C 728 358 704 366 674 352
  C 658 344 664 322 652 304
  C 664 292 652 266 646 254 Z"/>

<!-- 5. liver on the figure's right, stomach on the figure's left -->
<path class="organ" d="M 512 336 C 556 322 602 332 616 350
  C 618 372 598 388 570 390 C 534 392 514 368 512 336 Z"/>
<path class="organ" d="M 644 340 C 672 330 708 342 716 370
  C 722 400 700 418 676 412 C 658 408 650 392 658 378
  C 670 384 684 382 688 372 C 682 358 662 354 644 356 Z"/>

<!-- 6. gut: colon up the figure's right, across, down the left -->
<g class="vein" style="stroke:#ef4b6b;stroke-width:16;opacity:.95">
  <path d="M 536 574 L 536 512 Q 536 496 554 496
           L 686 496 Q 704 496 704 512 L 704 578"/>
</g>
<g class="vein" style="stroke:#ef4b6b;stroke-width:11;opacity:.6">
  <path d="M 564 528 q 28 15 56 0 q 28 -15 42 6"/>
  <path d="M 562 552 q 32 17 62 0 q 25 -13 38 8"/>
  
</g>

<!-- 7. the cage, over the organs -->
  <path class="rib" d="M 546 208 Q 552 229 605 234"/>
  <path class="rib" d="M 694 208 Q 688 229 635 234"/>
