  <path class="rib" d="M 727 283 Q 718 317 635 325"/>
  <path class="rib" d="M 512 298 Q 521 335 605 343"/>
  <path class="rib" d="M 728 298 Q 719 335 635 343"/>
  <path class="rib" d="M 512 313 Q 521 353 582 361"/>
  <path class="rib" d="M 728 313 Q 719 353 658 361"/>
  <path class="rib" d="M 513 328 Q 522 370 570 380"/>
  <path class="rib" d="M 727 328 Q 718 370 670 380"/>
  <path class="rib" d="M 516 343 Q 524 388 558 398"/>
  <path class="rib" d="M 724 343 Q 716 388 682 398"/>
  <path class="rib" d="M 520 358 Q 528 406 554 416"/>
  <path class="rib" d="M 720 358 Q 712 406 686 416"/>
  <path class="rib" d="M 526 373 Q 533 423 560 434"/>
  <path class="rib" d="M 714 373 Q 707 423 680 434"/>
  <rect class="bone" x="608" y="206" width="24" height="132" rx="9"/>

<!-- 8. pelvis -->
<path class="pelv" d="
  M 520 556 C 512 598 534 622 562 628
  M 720 556 C 728 598 706 622 678 628
  M 520 556 C 558 540 682 540 720 556"/>
<circle class="pelv" cx="524" cy="598" r="16" style="stroke-width:7"/>
<circle class="pelv" cx="716" cy="598" r="16" style="stroke-width:7"/>

<!-- 9. veins: the return line beside the spine, and the neck vessels -->
<path class="vein" style="stroke-width:7" d="M 658 222 C 666 290 654 350 650 412"/>
<path class="vein" style="stroke-width:4.5" d="M 662 250 L 700 240 M 664 284 L 704 276"/>

  <polyline class="lead" points="528,236 300,206"/>
  <circle class="dot" cx="528" cy="236" r="4.5"/>
  <text class="lbl" x="288" y="212" text-anchor="end">chest</text>
  <polyline class="lead" points="532,288 300,254"/>
  <circle class="dot" cx="532" cy="288" r="4.5"/>
  <text class="lbl" x="288" y="260" text-anchor="end">lung</text>
  <polyline class="lead" points="504,322 300,302"/>
  <circle class="dot" cx="504" cy="322" r="4.5"/>
  <text class="lbl" x="288" y="308" text-anchor="end">rib</text>
  <polyline class="lead" points="552,360 300,350"/>
  <circle class="dot" cx="552" cy="360" r="4.5"/>
  <text class="lbl" x="288" y="356" text-anchor="end">liver</text>
  <polyline class="lead" points="544,462 300,404"/>
  <circle class="dot" cx="544" cy="462" r="4.5"/>
  <text class="lbl" x="288" y="410" text-anchor="end">kidney</text>
  <polyline class="lead" points="516,462 300,446"/>
  <circle class="dot" cx="516" cy="462" r="4.5"/>
  <text class="lbl" x="288" y="452" text-anchor="end">waist</text>
  <polyline class="lead" points="524,598 300,494"/>
  <circle class="dot" cx="524" cy="598" r="4.5"/>
  <text class="lbl" x="288" y="500" text-anchor="end">hip</text>
  <polyline class="lead" points="584,616 300,542"/>
  <circle class="dot" cx="584" cy="616" r="4.5"/>
  <text class="lbl" x="288" y="548" text-anchor="end">pelvis</text>
  <polyline class="lead" points="694,376 980,300"/>
  <circle class="dot" cx="694" cy="376" r="4.5"/>
  <text class="lbl" x="996" y="306" text-anchor="start">stomach</text>
  <polyline class="lead" points="620,444 980,348"/>
  <circle class="dot" cx="620" cy="444" r="4.5"/>
  <text class="lbl" x="996" y="354" text-anchor="start">spine</text>
  <polyline class="lead" points="664,268 980,396"/>
  <circle class="dot" cx="664" cy="268" r="4.5"/>
  <text class="lbl" x="996" y="402" text-anchor="start">veins</text>
  <polyline class="lead" points="670,552 980,444"/>
  <circle class="dot" cx="670" cy="552" r="4.5"/>
  <text class="lbl" x="996" y="450" text-anchor="start">intestines</text>
</svg>
