<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="A profile head with three speech ribbons">
<title>Soft: Body idioms — what the body says</title>
<!-- Background for the idiom section. Wordless: the words are the exercise.
     The head is the same profile as face-neck.svg, so the two decks read as
     one family; the ribbons carry abstract bars rather than text, because a
     legible phrase here would be answering the gap fill. -->
<style>
  .bg    { fill: #f4eee2; }
  .body  { fill: #1b2340; }
  .cut   { fill: #ef4b6b; }
  .mute  { fill: #3c4a72; }
  .ribbon{ fill: #ef4b6b; opacity: .9; }
  .bar   { fill: #1b2340; opacity: .55; }
  .bar2  { fill: #f4eee2; opacity: .75; }
</style>
<rect class="bg" x="0" y="0" width="1280" height="720"/>
<g opacity="0.42">

<!-- ── the speaker, profile, facing the ribbons ──────────────────── -->
<g transform="translate(-196,116) scale(0.8)">
  <path class="body" d="
    M 452 470
    C 414 430 400 372 402 316
    C 404 240 452 132 528 132
    C 578 132 606 176 610 226
    L 611 288
    C 612 296 616 300 622 304
    L 646 372
    C 650 380 646 386 638 388
    L 616 392
    C 612 400 614 406 620 410
    C 610 414 600 416 596 420
    C 604 424 612 428 616 434
    C 606 442 596 446 592 452
    L 596 462
    C 600 470 596 476 588 476
    L 566 480
    C 552 496 528 504 496 500
    L 500 566
    C 500 606 524 628 566 644
    L 640 668
    L 640 720 L 360 720 L 360 668
    L 424 646
    C 458 630 472 606 472 566
    L 472 496
    C 472 490 460 482 452 470 Z"/>
  <ellipse class="mute" cx="458" cy="332" rx="18" ry="32"/>
  <path class="cut" d="M 552 281 q 32 -10 52 3 l -3 10 q -22 -10 -47 -2 Z"/>
  <ellipse class="mute" cx="572" cy="307" rx="22" ry="12"/>
  <!-- the mouth, open: this is a plate about what gets said -->
  <path class="cut" d="M 588 404 q 24 -8 34 -2 q 6 4 0 10 q -14 12 -34 10 Z"/>
  <path class="cut" d="M 588 422 q 22 10 34 2 q -8 16 -34 10 Z"/>
</g>

<!-- ── three things the body is used to say ──────────────────────── -->
<g>
  <path class="ribbon" d="M 470 150 h 456 a 28 28 0 0 1 28 28 v 78
    a 28 28 0 0 1 -28 28 h -366 l -62 44 8 -44 h -36
    a 28 28 0 0 1 -28 -28 v -78 a 28 28 0 0 1 28 -28 Z"/>
  <g class="bar2">
    <rect x="506" y="186" width="286" height="15" rx="7.5"/>
    <rect x="506" y="218" width="360" height="15" rx="7.5"/>
  </g>

  <path class="ribbon" d="M 592 328 h 392 a 28 28 0 0 1 28 28 v 74
    a 28 28 0 0 1 -28 28 h -310 l -58 40 8 -40 h -32
    a 28 28 0 0 1 -28 -28 v -74 a 28 28 0 0 1 28 -28 Z" opacity=".62"/>
  <g class="bar">
    <rect x="628" y="362" width="240" height="14" rx="7"/>
    <rect x="628" y="392" width="318" height="14" rx="7"/>
  </g>

  <path class="ribbon" d="M 508 496 h 344 a 26 26 0 0 1 26 26 v 68
    a 26 26 0 0 1 -26 26 h -274 l -54 38 8 -38 h -24
    a 26 26 0 0 1 -26 -26 v -68 a 26 26 0 0 1 26 -26 Z" opacity=".38"/>
  <g class="bar">
    <rect x="542" y="528" width="206" height="13" rx="6.5"/>
    <rect x="542" y="556" width="272" height="13" rx="6.5"/>
  </g>
</g>
</g>
</svg>
