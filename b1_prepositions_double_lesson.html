<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forbes English | Prepositions Double Lesson (B1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fe-navy:#1c2b4a;
    --fe-teal:#1f8a86;
    --fe-orange:#e0703a;
    --fe-purple:#6c5ce0;
    --fe-green:#3a9c5f;
    --fe-cream:#f7f3ec;
    --fe-paper:#ffffff;
    --fe-ink:#20242b;
    --fe-muted:#6b7280;
    --fe-error:#c0392b;
    --fe-border:#e3ded3;
    --cat-color: var(--fe-teal);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--fe-cream);
    color:var(--fe-ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1,h2,h3{font-family:'Fraunces',serif;}
  .app{
    width:100%;
    max-width:760px;
    padding:20px 18px 60px;
  }
  header.top{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0 8px;
  }
  .logo{width:46px;height:46px;flex-shrink:0;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;color:var(--fe-navy);}
  .brand-text .tag{font-size:0.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fe-muted);}

  .scorebar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(247,243,236,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--fe-border);
    padding:10px 0 12px;
    margin-bottom:18px;
  }
  .progress-track{
    height:8px;
    width:100%;
    background:#e8e3d6;
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--cat-color);
    transition:width .4s ease;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-size:0.82rem;
    color:var(--fe-muted);
  }
  .score-pill{
    background:var(--fe-navy);
    color:#fff;
    padding:3px 11px;
    border-radius:999px;
    font-weight:600;
    font-size:0.78rem;
  }

  .card{
    background:var(--fe-paper);
    border:1px solid var(--fe-border);
    border-radius:16px;
    padding:26px 24px;
    box-shadow:0 2px 10px rgba(28,43,74,0.05);
    margin-bottom:20px;
  }

  .section-badge{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--cat-color);
    background:color-mix(in srgb, var(--cat-color) 12%, white);
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:12px;
  }

  .intro-card h2{margin-top:0;color:var(--fe-navy);}
  .intro-card p{line-height:1.55;color:#3a3f4a;}
  .lesson-map{
    list-style:none;
    padding:0;
    margin:18px 0 0;
    display:grid;
    gap:8px;
  }
  .lesson-map li{
    display:flex;
    gap:10px;
    align-items:center;
    font-size:0.92rem;
    padding:8px 10px;
    border-radius:10px;
    background:var(--fe-cream);
  }
  .lesson-map .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    padding:11px 22px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn-primary{background:var(--fe-navy);color:#fff;}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:disabled{background:#c9cdd6;cursor:not-allowed;transform:none;}
  .btn-ghost{background:transparent;color:var(--fe-navy);border:1px solid var(--fe-navy);}

  .q-prompt{font-size:1.08rem;line-height:1.6;margin-bottom:18px;color:var(--fe-ink);}
  .q-prompt .gap{
    display:inline-block;
    min-width:70px;
    border-bottom:2px solid var(--fe-navy);
    text-align:center;
    font-weight:700;
    color:var(--fe-navy);
  }

  .options{
    display:grid;
    gap:10px;
    margin-bottom:6px;
  }
  .option{
    text-align:left;
    background:var(--fe-cream);
    border:1.5px solid var(--fe-border);
    border-radius:12px;
    padding:12px 16px;
    font-size:0.98rem;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .option:hover:not(:disabled){border-color:var(--cat-color);}
  .option:disabled{cursor:default;}
  .option.correct{background:#e6f4ea;border-color:var(--fe-green);color:#1f5c34;font-weight:600;}
  .option.incorrect{background:#fbeceb;border-color:var(--fe-error);color:#8a2c22;font-weight:600;}
  .option.dim{opacity:0.55;}

  .feedback{
    margin-top:14px;
    padding:13px 15px;
    border-radius:10px;
    font-size:0.92rem;
    line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.right{background:#e6f4ea;color:#1f5c34;border:1px solid #bfe2ca;}
  .feedback.wrong{background:#fbeceb;color:#8a2c22;border:1px solid #f1c6c0;}

  .nav-row{
    display:flex;
    justify-content:flex-end;
    margin-top:18px;
  }

  .results-card{text-align:center;}
  .results-score{
    font-family:'Fraunces',serif;
    font-size:3rem;
    color:var(--fe-navy);
    margin:6px 0;
  }
  .results-msg{color:#3a3f4a;line-height:1.55;margin-bottom:20px;}
  .breakdown{
    display:grid;
    gap:8px;
    text-align:left;
    margin:20px 0;
  }
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    padding:9px 12px;
    background:var(--fe-cream);
    border-radius:10px;
    font-size:0.9rem;
  }

  .hidden{display:none !important;}

  footer.foot{
    margin-top:26px;
    text-align:center;
    color:var(--fe-muted);
    font-size:0.78rem;
  }

  @media (max-width:480px){
    .card{padding:20px 16px;}
    .results-score{font-size:2.3rem;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" fill="none" stroke="var(--fe-navy)" stroke-width="3"/>
      <path d="M20 42 L20 22 L40 22" fill="none" stroke="var(--cat-color)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 32 L34 32" fill="none" stroke="var(--cat-color)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="44" cy="42" r="4" fill="var(--fe-orange)"/>
    </svg>
    <div class="brand-text">
      <div class="name">Forbes English</div>
      <div class="tag">Double Lesson · B1 · Prepositions</div>
    </div>
  </header>

  <div class="scorebar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="meta-row">
      <span id="stepLabel">Getting started</span>
      <span class="score-pill">Score: <span id="scoreVal">0</span>/<span id="scoreMax">0</span></span>
    </div>
  </div>

  <main id="main"></main>

  <footer class="foot">Forbes English &middot; Prepositions Double Lesson &middot; B1</footer>
</div>

<script>
(function(){

  // ---------- DATA ----------
  var SECTIONS = [
    {
      id: "place",
      title: "Part 1: Prepositions of Place",
      color: "var(--fe-teal)",
      intro: "In, on, at, and their trickier neighbours: among, between, opposite, behind.",
      questions: [
        {
          type:"gap",
          before:"The keys are",
          after:"the drawer, under the old letters.",
          options:["in","on","at","among"],
          correct:"in",
          explanation:"We use \"in\" for enclosed spaces like drawers, boxes, and rooms."
        },
        {
          type:"gap",
          before:"There is a small crack",
          after:"the wall, just above the light switch.",
          options:["in","on","at","between"],
          correct:"on",
          explanation:"We use \"on\" for surfaces such as walls, floors, and ceilings."
        },
        {
          type:"gap",
          before:"Meet me",
          after:"the entrance to the stadium at six.",
          options:["in","on","at","among"],
          correct:"at",
          explanation:"We use \"at\" for specific points, like an entrance, a desk, or a bus stop."
        },
        {
          type:"gap",
          before:"The bank is",
          after:"the bakery and the pharmacy.",
          options:["between","among","opposite","behind"],
          correct:"between",
          explanation:"\"Between\" is used for a position with exactly two clear points of reference."
        },
        {
          type:"gap",
          before:"She felt nervous, sitting",
          after:"strangers on the crowded train.",
          options:["between","among","opposite","behind"],
          correct:"among",
          explanation:"\"Among\" is used for a position within a larger, less defined group (three or more)."
        },
        {
          type:"gap",
          before:"The cinema is directly",
          after:"the supermarket, so you cannot miss it.",
          options:["between","among","opposite","under"],
          correct:"opposite",
          explanation:"\"Opposite\" describes something facing another thing, usually across a street or room."
        },
        {
          type:"gap",
          before:"The cat is hiding",
          after:"the sofa again.",
          options:["behind","between","at","onto"],
          correct:"behind",
          explanation:"\"Behind\" describes a position at the back of something."
        }
      ]
    },
    {
      id:"time",
      title:"Part 1: Prepositions of Time",
      color:"var(--fe-orange)",
      intro:"In, on, at for time, plus for/since, during, and by/until.",
      questions:[
        {
          type:"gap",
          before:"The meeting starts",
          after:"9 a.m. sharp, so don't be late.",
          options:["in","on","at","during"],
          correct:"at",
          explanation:"We use \"at\" with precise clock times."
        },
        {
          type:"gap",
          before:"We usually visit my grandparents",
          after:"the weekend.",
          options:["in","on","at","for"],
          correct:"on",
          explanation:"We use \"on\" with days and specific dates, including \"the weekend\" in British English."
        },
        {
          type:"gap",
          before:"The factory was closed",
          after:"1998, before the new owners took over.",
          options:["in","on","at","since"],
          correct:"in",
          explanation:"We use \"in\" with years, months, and longer periods like seasons."
        },
        {
          type:"gap",
          before:"I have lived in this city",
          after:"seven years now.",
          options:["for","since","during","by"],
          correct:"for",
          explanation:"\"For\" is used with a length of time (seven years, two hours)."
        },
        {
          type:"gap",
          before:"He has felt much more confident",
          after:"the promotion in March.",
          options:["for","since","during","until"],
          correct:"since",
          explanation:"\"Since\" is used with a starting point in time (a date or event)."
        },
        {
          type:"gap",
          before:"Please stay quiet",
          after:"the presentation.",
          options:["for","since","during","by"],
          correct:"during",
          explanation:"\"During\" is used with a specific event or period, not a length of time."
        },
        {
          type:"gap",
          before:"You need to submit the report",
          after:"Friday at the latest.",
          options:["until","by","during","for"],
          correct:"by",
          explanation:"\"By\" marks a deadline: the action must happen before or at that time."
        }
      ]
    },
    {
      id:"movement",
      title:"Part 2: Prepositions of Movement",
      color:"var(--fe-purple)",
      intro:"To, into, onto, through, across, along - how things move from one place to another.",
      questions:[
        {
          type:"gap",
          before:"She walked straight",
          after:"the office without knocking.",
          options:["into","onto","across","along"],
          correct:"into",
          explanation:"\"Into\" shows movement from outside to inside an enclosed space."
        },
        {
          type:"gap",
          before:"The waiter placed the tray",
          after:"the table carefully.",
          options:["into","onto","through","along"],
          correct:"onto",
          explanation:"\"Onto\" shows movement that ends on top of a surface."
        },
        {
          type:"gap",
          before:"We drove",
          after:"the tunnel and came out near the coast.",
          options:["into","onto","through","across"],
          correct:"through",
          explanation:"\"Through\" describes movement from one side of an enclosed space to the other."
        },
        {
          type:"gap",
          before:"It took twenty minutes to swim",
          after:"the lake.",
          options:["through","along","across","onto"],
          correct:"across",
          explanation:"\"Across\" describes movement from one side of an open area to the other."
        },
        {
          type:"gap",
          before:"They jogged",
          after:"the river every morning before work.",
          options:["along","into","onto","across"],
          correct:"along",
          explanation:"\"Along\" describes movement that follows the length of something, like a river or a road."
        },
        {
          type:"gap",
          before:"He handed the documents",
          after:"his manager before the deadline.",
          options:["to","into","onto","through"],
          correct:"to",
          explanation:"\"To\" shows movement or transfer toward a person or destination."
        }
      ]
    },
    {
      id:"dependent",
      title:"Part 2: Verb & Adjective + Preposition",
      color:"var(--fe-green)",
      intro:"Many verbs and adjectives are followed by a fixed preposition. These combinations must be learned as pairs.",
      questions:[
        {
          type:"gap",
          before:"I'm really looking forward",
          after:"the concert next week.",
          options:["to","for","at","about"],
          correct:"to",
          explanation:"\"Look forward to\" is a fixed phrase, always followed by \"to\"."
        },
        {
          type:"gap",
          before:"He apologised",
          after:"being late to the interview.",
          options:["for","about","of","to"],
          correct:"for",
          explanation:"\"Apologise for\" is used before the reason for the apology."
        },
        {
          type:"gap",
          before:"She's not very interested",
          after:"politics.",
          options:["in","on","at","for"],
          correct:"in",
          explanation:"\"Interested in\" is a fixed adjective + preposition pair."
        },
        {
          type:"gap",
          before:"The results depend entirely",
          after:"how much effort you put in.",
          options:["on","of","for","with"],
          correct:"on",
          explanation:"\"Depend on\" is a fixed verb + preposition pair."
        },
        {
          type:"gap",
          before:"I'm worried",
          after:"the exam results.",
          options:["about","for","of","on"],
          correct:"about",
          explanation:"\"Worried about\" is the standard adjective + preposition pair."
        },
        {
          type:"gap",
          before:"The manager insisted",
          after:"checking every figure herself.",
          options:["on","in","for","about"],
          correct:"on",
          explanation:"\"Insist on\" is a fixed verb + preposition pair meaning to demand something firmly."
        },
        {
          type:"gap",
          before:"He's good",
          after:"solving problems under pressure.",
          options:["at","in","on","for"],
          correct:"at",
          explanation:"\"Good at\" is used before a skill or activity."
        }
      ]
    }
  ];

  // ---------- STATE ----------
  var state = {
    flatQuestions: [],
    currentIndex: -1,
    score: 0,
    answered: false,
    started: false
  };

  SECTIONS.forEach(function(sec){
    sec.questions.forEach(function(q){
      state.flatQuestions.push({sectionId: sec.id, sectionTitle: sec.title, color: sec.color, q: q});
    });
  });

  var totalSteps = state.flatQuestions.length + SECTIONS.length + 2; // intros + questions + welcome + results
  var stepsDone = 0;

  document.getElementById("scoreMax").textContent = state.flatQuestions.length;

  // ---------- HELPERS ----------
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function setCatColor(color){
    document.documentElement.style.setProperty("--cat-color", color);
  }

  function updateProgress(label){
    stepsDone++;
    var pct = Math.min(100, Math.round((stepsDone / totalSteps) * 100));
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("stepLabel").textContent = label;
  }

  function updateScoreDisplay(){
    document.getElementById("scoreVal").textContent = state.score;
  }

  var main = document.getElementById("main");

  // ---------- SCREENS ----------
  function renderWelcome(){
    setCatColor("var(--fe-teal)");
    updateProgress("Welcome");
    main.innerHTML =
      '<section class="card intro-card">' +
        '<span class="section-badge">50-Minute Double Lesson</span>' +
        '<h2>Prepositions in Context (B1)</h2>' +
        '<p>This double lesson covers four groups of prepositions that B1 learners often confuse: place, time, movement, and fixed verb/adjective pairings. Each part has a short explanation followed by practice questions with instant feedback.</p>' +
        '<ul class="lesson-map">' +
          '<li><span class="dot" style="background:var(--fe-teal)"></span> Part 1a &middot; Prepositions of Place</li>' +
          '<li><span class="dot" style="background:var(--fe-orange)"></span> Part 1b &middot; Prepositions of Time</li>' +
          '<li><span class="dot" style="background:var(--fe-purple)"></span> Part 2a &middot; Prepositions of Movement</li>' +
          '<li><span class="dot" style="background:var(--fe-green)"></span> Part 2b &middot; Verb &amp; Adjective + Preposition</li>' +
        '</ul>' +
        '<div class="nav-row"><button class="btn btn-primary" id="startBtn">Start Lesson</button></div>' +
      '</section>';
    document.getElementById("startBtn").addEventListener("click", function(){
      goToNext();
    });
  }

  function renderSectionIntro(sectionIndex){
    var sec = SECTIONS[sectionIndex];
    setCatColor(sec.color);
    updateProgress(sec.title);
    main.innerHTML =
      '<section class="card">' +
        '<span class="section-badge">' + sec.title + '</span>' +
        '<h2 style="margin-top:0;color:var(--fe-navy);">' + sec.title + '</h2>' +
        '<p style="line-height:1.55;color:#3a3f4a;">' + sec.intro + '</p>' +
        '<div class="nav-row"><button class="btn btn-primary" id="continueBtn">Begin Practice</button></div>' +
      '</section>';
    document.getElementById("continueBtn").addEventListener("click", function(){
      goToNext();
    });
  }

  function renderQuestion(flatIndex){
    var item = state.flatQuestions[flatIndex];
    var q = item.q;
    setCatColor(item.color);
    updateProgress(item.sectionTitle + " · Question");
    state.answered = false;

    var shuffledOptions = shuffle(q.options);

    var html = '<section class="card">';
    html += '<span class="section-badge">' + item.sectionTitle + '</span>';
    html += '<div class="q-prompt">' + q.before + ' <span class="gap">______</span> ' + q.after + '</div>';
    html += '<div class="options" id="optionsWrap">';
    shuffledOptions.forEach(function(opt, i){
      html += '<button class="option" data-value="' + escapeAttr(opt) + '" data-index="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="feedback" id="feedbackBox"></div>';
    html += '<div class="nav-row"><button class="btn btn-primary" id="nextBtn" disabled>Next</button></div>';
    html += '</section>';

    main.innerHTML = html;

    var optionButtons = main.querySelectorAll(".option");
    optionButtons.forEach(function(btn){
      btn.addEventListener("click", function(){
        if (state.answered) return;
        state.answered = true;
        var chosen = btn.getAttribute("data-value");
        var isCorrect = (chosen === q.correct);

        optionButtons.forEach(function(b){
          b.disabled = true;
          var v = b.getAttribute("data-value");
          if (v === q.correct){
            b.classList.add("correct");
          } else if (v === chosen && !isCorrect){
            b.classList.add("incorrect");
          } else {
            b.classList.add("dim");
          }
        });

        var fb = document.getElementById("feedbackBox");
        fb.classList.add("show");
        if (isCorrect){
          state.score++;
          updateScoreDisplay();
          fb.classList.add("right");
          fb.textContent = "Correct! " + q.explanation;
        } else {
          fb.classList.add("wrong");
          fb.textContent = "Not quite. The correct answer is \"" + q.correct + "\". " + q.explanation;
        }

        document.getElementById("nextBtn").disabled = false;
      });
    });

    document.getElementById("nextBtn").addEventListener("click", function(){
      goToNext();
    });
  }

  function renderResults(){
    setCatColor("var(--fe-navy)");
    updateProgress("Results");
    var total = state.flatQuestions.length;
    var pct = Math.round((state.score / total) * 100);
    var msg;
    if (pct >= 85){
      msg = "Excellent control of prepositions across place, time, movement, and fixed pairings. You're ready for B2-level texts.";
    } else if (pct >= 65){
      msg = "Solid progress. Review the sections where you lost points, especially any fixed verb or adjective pairings.";
    } else {
      msg = "Good effort. Prepositions take time to master - go back over the explanations and try the lesson again in a few days.";
    }

    var breakdown = "";
    SECTIONS.forEach(function(sec){
      var secScore = 0;
      var secTotal = sec.questions.length;
      state.flatQuestions.forEach(function(item, idx){
        if (item.sectionId === sec.id && item.gotCorrect) secScore++;
      });
      breakdown += '<div class="breakdown-row"><span>' + sec.title + '</span><span>' + secScore + ' / ' + secTotal + '</span></div>';
    });

    main.innerHTML =
      '<section class="card results-card">' +
        '<span class="section-badge">Lesson Complete</span>' +
        '<h2 style="color:var(--fe-navy);margin-bottom:0;">Your Results</h2>' +
        '<div class="results-score">' + state.score + ' / ' + total + '</div>' +
        '<p class="results-msg">' + msg + '</p>' +
        '<div class="breakdown">' + breakdown + '</div>' +
        '<div class="nav-row" style="justify-content:center;gap:12px;">' +
          '<button class="btn btn-ghost" id="restartBtn">Restart Lesson</button>' +
        '</div>' +
      '</section>';

    document.getElementById("restartBtn").addEventListener("click", function(){
      location.reload();
    });
  }

  // ---------- FLOW CONTROL ----------
  // Build a flat sequence of steps: welcome -> [sectionIntro, q, q, ...] per section -> results
  var sequence = [];
  sequence.push({type:"welcome"});
  var flatCursor = 0;
  SECTIONS.forEach(function(sec, sIdx){
    sequence.push({type:"sectionIntro", sectionIndex: sIdx});
    sec.questions.forEach(function(){
      sequence.push({type:"question", flatIndex: flatCursor});
      flatCursor++;
    });
  });
  sequence.push({type:"results"});

  var cursor = -1;

  function goToNext(){
    // record correctness of the just-answered question, if any
    if (cursor >= 0 && sequence[cursor].type === "question"){
      var idx = sequence[cursor].flatIndex;
      var lastOptionsWrap = document.getElementById("optionsWrap");
      if (lastOptionsWrap){
        var correctBtn = lastOptionsWrap.querySelector(".option.correct");
        var incorrectBtn = lastOptionsWrap.querySelector(".option.incorrect");
        state.flatQuestions[idx].gotCorrect = !incorrectBtn;
      }
    }
    cursor++;
    if (cursor >= sequence.length) return;
    var step = sequence[cursor];
    if (step.type === "welcome") renderWelcome();
    else if (step.type === "sectionIntro") renderSectionIntro(step.sectionIndex);
    else if (step.type === "question") renderQuestion(step.flatIndex);
    else if (step.type === "results") renderResults();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function escapeAttr(str){
    return escapeHtml(str).replace(/"/g, "&quot;");
  }

  // init
  goToNext();

})();
</script>
</body>
</html>
