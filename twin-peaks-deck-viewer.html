<title>Twin Peaks Prepositions — Between Two Worlds (Slide Deck, in progress) (C1)</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow:hidden;background:#0f1a13;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    display:flex;flex-direction:column;
    color:#f2ede0;
  }
  header{
    padding:10px 20px;
    display:flex;align-items:center;justify-content:space-between;
    background:#1b3a28;
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
  }
  header h1{font-size:0.95rem;font-weight:700;letter-spacing:.02em;}
  header h1 span{color:#e8c04a;font-weight:400;opacity:.85;margin-left:8px;}
  .back-link{
    color:#cfe9d8;text-decoration:none;font-size:0.82rem;font-weight:600;
    padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;
  }
  .back-link:hover{background:rgba(255,255,255,.08);}
  .stage{
    flex:1;display:flex;align-items:center;justify-content:center;

  }
  .slide-wrap{
    max-width:100%;max-height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .slide-wrap img{
    max-width:100%;max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px);
    border-radius:6px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    display:block;
  }
  .nav-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;font-size:1.4rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s;
  }
  .nav-arrow:hover{background:rgba(255,255,255,.2);}
  .nav-arrow.prev{left:16px;}
  .nav-arrow.next{right:16px;}
  .nav-arrow:disabled{opacity:.25;cursor:default;}
  footer{
    flex-shrink:0;
    padding:12px 20px;
    display:flex;align-items:center;justify-content:center;gap:18px;
    background:#1b3a28;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .counter{font-size:0.85rem;color:#cfe9d8;font-variant-numeric:tabular-nums;min-width:70px;text-align:center;}
  .dots{display:flex;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:background .15s,transform .15s;}
  .dot.active{background:#38c96a;transform:scale(1.3);}
  .download-btn{
    font-size:0.78rem;font-weight:700;letter-spacing:.02em;
    color:#0f1a13;background:#2fae5c;
    padding:8px 16px;border-radius:999px;text-decoration:none;
    box-shadow:0 3px 10px rgba(47,174,92,.4);
  }
  .download-btn:hover{background:#38c96a;}

  /* ── maximise ─────────────────────────────────────────────────────
     vh is the LARGEST viewport — with a mobile address bar showing, a
     100vh box runs off the bottom of the screen and takes the footer
     with it. dvh tracks the bar. The vh line stays first as a fallback
     for browsers without dvh; where dvh is understood it wins. */
  html, body { height: 100vh; height: 100dvh; }
  .maximise-btn{
    font-size:0.78rem;font-weight:700;letter-spacing:.02em;
    color:#cfe9d8;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  .maximise-btn:hover{background:rgba(255,255,255,.18);}
  /* Maximised: the green sandwich goes, the slide takes the whole screen. */
  body.maxed header, body.maxed footer{ display:none; }
  body.maxed .stage{ padding:0; }
  body.maxed .slide-wrap img{
    max-height:100vh; max-height:100dvh;
    border-radius:0; box-shadow:none;
  }
  /* Two shapes in the wild: three viewers cap the <img>, Star Wars sizes the
     wrap and lets the image fill it. Cover both. */
  body.maxed .slide-wrap{
    height:100vh; height:100dvh;
    max-height:100vh; max-height:100dvh;
  }
  .exit-max{
    position:fixed; top:10px; right:10px; z-index:50;
    width:38px; height:38px; border-radius:50%;
    display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3);
    color:#fff; font-size:1rem; cursor:pointer; line-height:1;
  }
  body.maxed .exit-max{ display:flex; }
  /* A landscape phone has almost no vertical room; shrink the furniture. */
  @media (max-height:460px){
    header{ padding:5px 12px; }
    header h1{ font-size:0.8rem; }
    footer{ padding:6px 12px; gap:10px; }
    .slide-wrap img{ max-height:calc(100vh - 84px); max-height:calc(100dvh - 84px); }
    .slide-wrap{ height:calc(100vh - 84px); height:calc(100dvh - 84px); }
  }

<body>

<header>
  <h1>Twin Peaks Prepositions <span>Between Two Worlds</span></h1>
  <a class="back-link" href="index.html">← Back to catalog</a>
</header>

<div class="stage">
  <button class="nav-arrow prev" id="prevBtn" aria-label="Previous slide">‹</button>
  <div class="slide-wrap">
    <img id="slideImg" src="twin-peaks-deck-slides/slide-01.png" alt="Slide 1">
  </div>
  <button class="nav-arrow next" id="nextBtn" aria-label="Next slide">›</button>
</div>

<footer>
  <span class="counter" id="counter">1 / 14</span>
  <div class="dots" id="dots"></div>
  <button class="maximise-btn" id="maxBtn" title="Maximise (F)">⤢ Maximise</button>
  <a class="download-btn" href="Twin%20Peaks/Twin%20Peaks%20Prepositions%20Project/MASTER_DECK_review_and_brand_complete_FIXED.pptx" download>⬇ Download .pptx</a>
</footer>
<button class="exit-max" id="exitMax" aria-label="Exit full screen">✕</button>

<script>
const TOTAL = 14;
let idx = 0;

const img = document.getElementById('slideImg');
const counter = document.getElementById('counter');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

for (let i = 0; i < TOTAL; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}
const dots = dotsEl.querySelectorAll('.dot');

function render() {
  const n = String(idx + 1).padStart(2, '0');
  img.src = `twin-peaks-deck-slides/slide-${n}.png`;
  img.alt = `Slide ${idx + 1}`;
  counter.textContent = `${idx + 1} / ${TOTAL}`;
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === TOTAL - 1;
}
function goTo(i) {
  idx = Math.max(0, Math.min(TOTAL - 1, i));
  render();
}
prevBtn.addEventListener('click', () => goTo(idx - 1));
nextBtn.addEventListener('click', () => goTo(idx + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goTo(idx - 1);
  if (e.key === 'ArrowRight') goTo(idx + 1);
});

render();
</script>
<script>
/* ── maximise ────────────────────────────────────────────────────────
   Fullscreen where it exists, chrome-hiding everywhere. iPhone Safari has
   no Element.requestFullscreen, so the button is still worth having there:
   it reclaims the ~130px of green sandwich, and dvh handles the address
   bar. Everything below is feature-detected. */
(function () {
  const body = document.body;
  const btn = document.getElementById('maxBtn');
  const exit = document.getElementById('exitMax');
  if (!btn) return;
  const root = document.documentElement;
  const canFS = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

  function enter() {
    body.classList.add('maxed');
    if (canFS) {
      const r = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      if (r && r.catch) r.catch(() => {});
    }
    // Only meaningful in fullscreen, and only Android/Chrome implements it.
    if (screen.orientation && screen.orientation.lock) {
      try { const p = screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); }
      catch (e) { /* unsupported: the user turns the phone, as before */ }
    }
  }
  function leave() {
    body.classList.remove('maxed');
    if (isFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    if (screen.orientation && screen.orientation.unlock) {
      try { screen.orientation.unlock(); } catch (e) {}
    }
  }
  btn.addEventListener('click', () => body.classList.contains('maxed') ? leave() : enter());
  if (exit) exit.addEventListener('click', leave);
  // Esc leaves fullscreen without telling us, so follow the browser's state.
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, () => { if (!isFS() && canFS) body.classList.remove('maxed'); }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && body.classList.contains('maxed')) leave();
    if (e.key === 'f' || e.key === 'F') btn.click();
  });
})();
</script>
