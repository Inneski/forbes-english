<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twin Peaks Prepositions — Between Two Worlds | Slide Deck</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0f1a13;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    display:flex;flex-direction:column;
    color:#f2ede0;
  }
  header{
    padding:10px 20px;
    display:flex;align-items:center;justify-content:space-between;
    background:#1b3a28;
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
  }
  header h1{font-size:0.95rem;font-weight:700;letter-spacing:.02em;}
  header h1 span{color:#e8c04a;font-weight:400;opacity:.85;margin-left:8px;}
  .back-link{
    color:#cfe9d8;text-decoration:none;font-size:0.82rem;font-weight:600;
    padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;
  }
  .back-link:hover{background:rgba(255,255,255,.08);}
  .stage{
    flex:1;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;padding:16px;
  }
  .slide-wrap{
    max-width:100%;max-height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .slide-wrap img{
    max-width:100%;max-height:calc(100vh - 130px);
    border-radius:6px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    display:block;
  }
  .nav-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;font-size:1.4rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s;
  }
  .nav-arrow:hover{background:rgba(255,255,255,.2);}
  .nav-arrow.prev{left:16px;}
  .nav-arrow.next{right:16px;}
  .nav-arrow:disabled{opacity:.25;cursor:default;}
  footer{
    flex-shrink:0;
    padding:12px 20px;
    display:flex;align-items:center;justify-content:center;gap:18px;
    background:#1b3a28;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .counter{font-size:0.85rem;color:#cfe9d8;font-variant-numeric:tabular-nums;min-width:70px;text-align:center;}
  .dots{display:flex;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:background .15s,transform .15s;}
  .dot.active{background:#38c96a;transform:scale(1.3);}
  .download-btn{
    font-size:0.78rem;font-weight:700;letter-spacing:.02em;
    color:#0f1a13;background:#2fae5c;
    padding:8px 16px;border-radius:999px;text-decoration:none;
    box-shadow:0 3px 10px rgba(47,174,92,.4);
  }
  .download-btn:hover{background:#38c96a;}
</style>
</head>
<body>

<header>
  <h1>Twin Peaks Prepositions <span>Between Two Worlds</span></h1>
  <a class="back-link" href="index.html">← Back to catalog</a>
</header>

<div class="stage">
  <button class="nav-arrow prev" id="prevBtn" aria-label="Previous slide">‹</button>
  <div class="slide-wrap">
    <img id="slideImg" src="twin-peaks-deck-slides/slide-01.png" alt="Slide 1">
  </div>
  <button class="nav-arrow next" id="nextBtn" aria-label="Next slide">›</button>
</div>

<footer>
  <span class="counter" id="counter">1 / 14</span>
  <div class="dots" id="dots"></div>
  <a class="download-btn" href="Twin%20Peaks/Twin%20Peaks%20Prepositions%20Project/MASTER_DECK_review_and_brand_complete_FIXED.pptx" download>⬇ Download .pptx</a>
</footer>

<script>
const TOTAL = 14;
let idx = 0;

const img = document.getElementById('slideImg');
const counter = document.getElementById('counter');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

for (let i = 0; i < TOTAL; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}
const dots = dotsEl.querySelectorAll('.dot');

function render() {
  const n = String(idx + 1).padStart(2, '0');
  img.src = `twin-peaks-deck-slides/slide-${n}.png`;
  img.alt = `Slide ${idx + 1}`;
  counter.textContent = `${idx + 1} / ${TOTAL}`;
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === TOTAL - 1;
}
function goTo(i) {
  idx = Math.max(0, Math.min(TOTAL - 1, i));
  render();
}
prevBtn.addEventListener('click', () => goTo(idx - 1));
nextBtn.addEventListener('click', () => goTo(idx + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goTo(idx - 1);
  if (e.key === 'ArrowRight') goTo(idx + 1);
});

render();
</script>
</body>
</html>
