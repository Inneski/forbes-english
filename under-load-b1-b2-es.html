<style>
:root{
  --ink:#080a10;
  --panel:#131726;
  --panel-2:#1b2133;
  --line:rgba(246,237,206,.20);
  --coral:#f94263;
  --coral-dk:#c72e4a;
  --slate:#8f9dd4;
  --slate-dk:#4a5b96;
  --cream:#f6edce;
  --cream-dim:rgba(246,237,206,.68);
  --good:#5fbf95;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070a}
body{font-family:"Instrument Sans",system-ui,sans-serif;color:var(--cream);
  display:flex;align-items:center;justify-content:center}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--slate);outline-offset:2px}

#stage{width:1280px;height:720px;flex:0 0 auto;transform-origin:center center;
  background:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(246,237,206,.10) 1px,transparent 1px);background-size:5px 5px}

/* Spanish support is opt-in */
.es,.q-es,.fb-es,.m-es,.p-es,.plan-es,.sub-es,.c-es{display:none}
.es-inline,.label-es,.h2-es,.g-es{display:none}
#stage.es-on .es,#stage.es-on .q-es,#stage.es-on .fb-es,#stage.es-on .m-es,
#stage.es-on .p-es,#stage.es-on .plan-es,#stage.es-on .sub-es{display:block}
#stage.es-on .c-es{display:block}
#stage.es-on .es-inline,#stage.es-on .label-es,#stage.es-on .h2-es{display:inline}
#stage.es-on .g-es{display:table-cell}

.topbar{height:62px;flex:0 0 62px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:20px;padding:0 24px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px}
.brand .bt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;
  letter-spacing:.14em;text-transform:uppercase}
.tabs{display:flex;gap:6px;margin-left:12px}
.tab{background:transparent;border:1px solid var(--line);color:var(--cream-dim);
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;
  padding:7px 13px;cursor:pointer;border-radius:2px;transition:.15s}
.tab:hover{border-color:var(--coral);color:var(--cream)}
.tab.on{background:var(--coral);border-color:var(--coral);color:#080a10;font-weight:700}
.tab .tn{opacity:.6;margin-right:6px}
.spacer{flex:1}
.pill{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;
  border:1px solid var(--line);padding:6px 11px;border-radius:2px}
.pill.score{background:var(--coral);border-color:var(--coral);color:#080a10;font-weight:700}
.pill.lvl{color:var(--slate)}
.estog{background:transparent;border:1px solid var(--line);color:var(--cream-dim);
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;padding:7px 11px;
  cursor:pointer;border-radius:2px;transition:.15s}
.estog:hover{border-color:var(--slate);color:var(--cream)}
.estog.on{background:var(--slate-dk);border-color:var(--slate-dk);color:#fff}

#content{flex:1 1 auto;position:relative;z-index:1;padding:26px 44px 8px;overflow:hidden}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:56px;line-height:.94;
  margin:0 0 10px;letter-spacing:-.02em}
h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:29px;margin:0 0 6px;letter-spacing:-.01em}
.h2-es{font-family:"Instrument Sans",sans-serif;font-weight:400;font-size:16px;color:var(--slate);font-style:italic}
p{margin:0}
.lead{font-size:17px;line-height:1.45;color:var(--cream-dim);margin-top:6px}
.es{color:var(--slate);font-style:italic;font-size:15.5px;line-height:1.45;margin-top:4px}
.es.big{font-size:19px;margin-bottom:10px}
.es.small{font-size:13px}
.es-inline{color:var(--slate);font-style:italic}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;
  color:var(--coral);margin-bottom:12px}

.hero{height:100%;display:flex;flex-direction:column;gap:16px}
.hero-band{height:232px;flex:0 0 232px;overflow:hidden;border:1px solid var(--line);position:relative}
.hero-band img{width:100%;display:block;margin-top:-4%}
.hero-txt{position:relative}
.sub{font-size:18px;color:var(--cream-dim);margin-top:2px;max-width:940px}
.sub-es{color:var(--slate);font-style:italic;font-size:15px;margin-top:3px;max-width:940px}
.hero-meta{display:flex;gap:10px;margin-top:12px}
.hero-meta span{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;
  border:1px solid var(--line);padding:5px 10px;color:var(--cream-dim)}
.credit{position:absolute;right:0;bottom:0;font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.1em;color:var(--slate-dk)}

.para-slide{height:100%;display:flex;flex-direction:column}
.para-head{display:flex;gap:18px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}
.para-head .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:48px;
  line-height:.8;color:var(--coral)}
.label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;margin-top:6px;color:var(--cream-dim)}
.label-es{color:var(--slate);text-transform:none;letter-spacing:.06em}
.para-body{margin-top:20px;max-width:1010px}
.para-body .en{font-size:21px;line-height:1.5}
.para-body .es{font-size:16px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--slate-dk)}

.gloss{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.gloss th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);border-bottom:1px solid var(--line);padding:0 10px 7px}
.gloss td{padding:9px 10px;border-bottom:1px solid rgba(246,237,206,.09);vertical-align:top}
.g-en{font-weight:600;width:22%}
.g-def{color:var(--cream-dim);width:46%}
.g-es{color:var(--slate);font-style:italic;width:32%}

.intro-slide{height:100%;display:flex;flex-direction:column;justify-content:center;max-width:880px}
.intro-num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;
  color:var(--coral);line-height:.8;margin-bottom:14px}
.res-slide{height:100%;display:flex;flex-direction:column;justify-content:center;max-width:780px}
.res-tag{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;color:var(--slate);margin-bottom:8px}
.res-score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:74px;line-height:1;margin:10px 0 12px}
.res-score span{font-size:25px;color:var(--slate);margin-left:8px}
.res-bar{height:10px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:16px}
.res-bar i{display:block;height:100%;background:var(--coral)}

.q-slide{height:100%;display:flex;flex-direction:column}
.q-head{display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);padding-bottom:8px}
.q-tag{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--coral)}
.q-count{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--slate)}
.q-stem{margin:14px 0 12px}
.q-en{font-size:21px;font-weight:600;line-height:1.3}
.q-es{color:var(--slate);font-style:italic;font-size:15px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{display:flex;align-items:center;gap:11px;text-align:left;background:var(--panel);
  border:1px solid var(--line);padding:11px 13px;font-size:15.5px;line-height:1.28;cursor:pointer;
  color:var(--cream);transition:.12s;border-radius:2px;min-height:52px}
.opt:hover:not(:disabled){background:var(--panel-2);border-color:var(--coral)}
.opt:disabled{cursor:default}
.letter{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;
  background:var(--panel-2);color:var(--cream);width:22px;height:22px;flex:0 0 22px;
  display:flex;align-items:center;justify-content:center;border-radius:2px;border:1px solid var(--line)}
.opt.is-correct{border-color:var(--good);background:rgba(95,191,149,.12)}
.opt.is-correct .letter{background:var(--good);color:#080a10;border-color:var(--good)}
.opt.is-wrong{border-color:var(--coral);background:rgba(249,66,99,.12)}
.opt.is-wrong .letter{background:var(--coral);color:#080a10;border-color:var(--coral)}

/* spot the error */
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;padding:16px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:2px}
.tok{background:transparent;border:1px solid transparent;color:var(--cream);
  font-size:22px;line-height:1.3;padding:5px 7px;cursor:pointer;border-radius:2px;transition:.12s}
.tok:hover:not(:disabled){background:var(--panel-2);border-color:var(--slate)}
.tok:disabled{cursor:default}
.tok.is-correct{background:rgba(95,191,149,.18);border-color:var(--good);color:var(--good);font-weight:600}
.tok.is-wrong{background:rgba(249,66,99,.16);border-color:var(--coral);color:var(--coral);
  text-decoration:line-through}
.fb-fix{font-size:16px;font-weight:600;color:var(--good);margin-bottom:5px}

.fb{margin-top:12px;display:none}
.fb.show{display:block;border-left:4px solid var(--slate-dk);padding:10px 14px;background:var(--panel)}
.fb.good{border-left-color:var(--good)}
.fb.bad{border-left-color:var(--coral)}
.fb-tag{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);margin-bottom:3px}
.fb-en{font-size:15px;line-height:1.4;color:var(--cream-dim)}
.fb-es{font-size:14px;color:var(--slate);font-style:italic;margin-top:3px}

.plan-slide{height:100%;display:flex;flex-direction:column}
.plan-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.plan-row{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid rgba(246,237,206,.09);padding-bottom:8px}
.plan-n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:25px;color:var(--coral);
  width:28px;flex:0 0 28px;line-height:1.1}
.plan-what{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);margin-bottom:2px}
.plan-en{font-size:17px;font-weight:500;line-height:1.3}
.plan-es{font-size:14px;color:var(--slate);font-style:italic}
.phrase-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin-top:12px}
.phrase{border-left:3px solid var(--coral);padding-left:12px}
.p-en{font-size:16px;font-weight:500;line-height:1.3}
.p-es{font-size:13.5px;color:var(--slate);font-style:italic}

.speak-slide,.write-slide{height:100%;display:flex;flex-direction:column}
.speak-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-top:6px;flex:1}
.timer{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.tval{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:27px;
  background:var(--panel-2);color:var(--cream);padding:4px 12px;border-radius:2px;border:1px solid var(--line)}
.mini{background:var(--panel);border:1px solid var(--line);padding:8px 12px;font-size:13px;font-weight:600;
  cursor:pointer;border-radius:2px;color:var(--cream)}
.mini:hover:not(:disabled){background:var(--coral);color:#080a10;border-color:var(--coral)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.mini.wide{width:100%;margin-bottom:9px}
textarea{width:100%;height:146px;border:1px solid var(--line);background:var(--panel);padding:11px;
  font-family:"Instrument Sans",sans-serif;font-size:15px;line-height:1.4;resize:none;border-radius:2px;
  color:var(--cream)}
textarea::placeholder,.nameIn::placeholder{color:rgba(246,237,206,.34)}
.model{background:var(--panel);border:1px dashed var(--slate-dk);padding:11px 13px;border-radius:2px}
.m-en{font-size:14.5px;line-height:1.42}
.m-es{font-size:13px;color:var(--slate);font-style:italic;margin-top:6px}
.write-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:12px;flex:1}
.checks{margin:10px 0 12px;padding-left:18px}
.checks li{margin-bottom:5px;font-size:14px;color:var(--cream-dim)}
.c-en{display:block;font-weight:500}
.c-es{display:block;color:var(--slate);font-style:italic;font-size:12.5px}
.write-left.showing .checks,
.write-left.showing .q-en,
.write-left.showing .q-es{display:none}
.nameIn{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--cream);
  padding:8px 11px;font-family:"Instrument Sans",sans-serif;font-size:14px;margin-bottom:8px;border-radius:2px}
.write-right textarea{height:180px}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.wc{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--coral)}
.wc.ok{color:var(--good);font-weight:700}

.final-slide{height:100%;display:flex;flex-direction:column}
.final-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:30px;margin-top:12px;align-items:start}
.final-table{width:100%;border-collapse:collapse;font-size:14.5px}
.final-table td{padding:7px 8px;border-bottom:1px solid rgba(246,237,206,.09)}
.final-table .n{font-family:"JetBrains Mono",monospace;white-space:nowrap;width:70px;color:var(--slate)}
.barcell{width:120px}
.minibar{display:block;height:8px;background:var(--panel-2);border:1px solid var(--line)}
.minibar i{display:block;height:100%;background:var(--coral)}
.final-score{text-align:center;border:1px solid var(--line);padding:18px 16px;background:var(--panel)}
.fs-num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:58px;line-height:1}
.fs-num span{font-size:20px;color:var(--slate);margin-left:6px}
.fs-band{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.12em;
  color:var(--coral);margin:6px 0 14px}

.footer{flex:0 0 96px;background:var(--panel);border-top:1px solid var(--line);padding:0 24px;
  display:flex;align-items:center;gap:26px;position:relative;z-index:2}
.rail{display:flex;align-items:center;flex:1}
.rail-node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;flex:1}
.rail-node .dot{width:12px;height:12px;border:1px solid rgba(246,237,206,.4);border-radius:50%;
  background:var(--panel);transition:.3s}
.rail-node .rl{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;
  color:rgba(246,237,206,.38);transition:.3s}
.rail-node.lit .dot{background:var(--coral);border-color:var(--coral)}
.rail-node.lit .rl{color:var(--cream)}
.railwrap{flex:1;position:relative;display:flex;align-items:center}
.railwrap::before{content:"";position:absolute;top:6px;left:8%;right:8%;height:1px;background:rgba(246,237,206,.18)}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(246,237,206,.12)}
.progress i{display:block;height:100%;background:var(--coral);transition:width .25s}
.navbtns{display:flex;align-items:center;gap:9px}
.nav{background:transparent;border:1px solid var(--cream);color:var(--cream);padding:10px 18px;
  font-size:14px;font-weight:600;cursor:pointer;border-radius:2px;transition:.15s}
.nav:hover:not(:disabled){background:var(--coral);border-color:var(--coral);color:#080a10}
.nav:disabled{opacity:.3;cursor:not-allowed}
.nav.primary{background:var(--coral);border-color:var(--coral);color:#080a10}
.pos{font-family:"JetBrains Mono",monospace;font-size:11px;color:rgba(246,237,206,.5);min-width:56px;text-align:right}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage">

  <div class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" fill="none" stroke="#f6edce" stroke-width="1.5"/>
        <path d="M9 22V8h11v3.4h-7.2v2.7h6.2v3.3h-6.2V22z" fill="#f6edce"/>
        <circle cx="23" cy="20.5" r="3" fill="#f94263"/>
      </svg>
      <span class="bt">Forbes English</span>
    </div>
    <div class="tabs">
      <button type="button" class="tab" data-m="0"><span class="tn">01</span>CLINIC</button>
      <button type="button" class="tab" data-m="1"><span class="tn">02</span>FORM</button>
      <button type="button" class="tab" data-m="2"><span class="tn">03</span>PRESENT</button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="estog" id="estoggle">ES off</button>
    <span class="pill lvl">B1-B2</span>
    <span class="pill score" id="score">0 / 48</span>
  </div>

  <div id="content"></div>

  <div class="footer">
    <div class="railwrap"><div class="rail" id="rail"></div></div>
    <div class="navbtns">
      <button type="button" class="nav" id="back">Back</button>
      <button type="button" class="nav primary" id="next">Next</button>
      <span class="pos" id="pos">1 / 1</span>
    </div>
    <div class="progress"><i id="bar" style="width:0%"></i></div>
  </div>

<script>
/* Forbes English - deck engine. Logic only. */

var MODULES = [
  { key: "read", n: "01", label: "READ", labelEs: "LEER" },
  { key: "test", n: "02", label: "TEST", labelEs: "TEST" },
  { key: "present", n: "03", label: "PRESENT", labelEs: "PRESENTAR" }
];

var S = {
  i: 0,
  slides: [],
  answers: {},
  notes: {},
  writing: "",
  name: "",
  timer: { t: 0, on: false, h: null }
};

function shuffle(a) {
  var i, j, t;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Correct answer goes to slot (k mod 4); the other options are Fisher-Yates shuffled. */
function layout(item, k) {
  var correct = item.o[item.a];
  var rest = [];
  for (var i = 0; i < item.o.length; i++) { if (i !== item.a) { rest.push(item.o[i]); } }
  shuffle(rest);
  var slot = k % item.o.length;
  var out = [];
  var r = 0;
  for (var p = 0; p < item.o.length; p++) {
    if (p === slot) { out.push(correct); } else { out.push(rest[r]); r++; }
  }
  return { options: out, correct: slot };
}

function buildDeck() {
  var slides = [];
  var k = 0;
  var L = LESSON;

  slides.push({ m: 0, type: "hero" });
  for (var p = 0; p < L.article.paras.length; p++) {
    slides.push({ m: 0, type: "para", p: p });
  }
  slides.push({ m: 0, type: "glossary", from: 0, to: 8 });
  slides.push({ m: 0, type: "glossary", from: 8, to: 16 });

  for (var s = 0; s < L.sections.length; s++) {
    var sec = L.sections[s];
    if (sec.module === 2 && !slides.some(function (x) { return x.type === "planIntro"; })) {
      slides.push({ m: 2, type: "planIntro" });
      slides.push({ m: 2, type: "plan" });
      slides.push({ m: 2, type: "meeting" });
    }
    slides.push({ m: sec.module, type: "secIntro", sec: s });
    for (var q = 0; q < sec.items.length; q++) {
      var it = sec.items[q];
      if (it.type === "spot") {
        slides.push({ m: sec.module, type: "q", sec: s, q: q, lay: null });
      } else {
        slides.push({ m: sec.module, type: "q", sec: s, q: q, lay: layout(it, k) });
        k++;
      }
    }
    slides.push({ m: sec.module, type: "secResult", sec: s });
  }

  slides.push({ m: 2, type: "speakIntro" });
  for (var sp = 0; sp < L.speaking.length; sp++) {
    slides.push({ m: 2, type: "speak", sp: sp });
  }
  slides.push({ m: 2, type: "write" });
  slides.push({ m: 2, type: "final" });

  return slides;
}

function scored() {
  var n = 0;
  for (var s = 0; s < LESSON.sections.length; s++) { n += LESSON.sections[s].items.length; }
  return n;
}

function correctCount(secIdx) {
  var n = 0;
  for (var key in S.answers) {
    if (!S.answers.hasOwnProperty(key)) { continue; }
    var parts = key.split(":");
    if (secIdx !== undefined && Number(parts[0]) !== secIdx) { continue; }
    if (S.answers[key].ok) { n++; }
  }
  return n;
}

function answeredCount(secIdx) {
  var n = 0;
  for (var key in S.answers) {
    if (!S.answers.hasOwnProperty(key)) { continue; }
    if (secIdx !== undefined && Number(key.split(":")[0]) !== secIdx) { continue; }
    n++;
  }
  return n;
}

function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (html !== undefined) { e.innerHTML = html; }
  return e;
}

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function download(name, text) {
  var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function words(t) {
  var s = String(t).trim();
  if (!s) { return 0; }
  return s.split(/\s+/).length;
}

/* ---------- slide renderers ---------- */

function slideHero() {
  var w = el("div", "hero");
  w.innerHTML =
    '<div class="hero-band"><img alt="Two robotic arms facing each other across a workbench, a red component suspended between them" src="' + IMG_BENCH + '"></div>' +
    '<div class="hero-txt">' +
    '<div class="eyebrow">FORBES ENGLISH &middot; ' + LESSON.level + ' &middot; ACCURACY UNDER PRESSURE</div>' +
    '<h1>' + LESSON.title + '</h1>' +
    '<p class="sub">' + LESSON.subtitle + '</p>' +
    '<p class="sub-es">' + LESSON.subtitleEs + '</p>' +
    '<div class="hero-meta"><span>3 modules</span><span>' + scored() + ' items</span><span>Speaking + writing</span></div>' +
    '<div class="credit">Illustration: Black Isler</div>' +
    '</div>';
  return w;
}

function slidePara(n) {
  var p = LESSON.article.paras[n];
  var w = el("div", "para-slide");
  w.innerHTML =
    '<div class="para-head"><span class="num">' + p.n + '</span>' +
    '<div><h2>' + LESSON.article.heading + '</h2>' +
    '<div class="label">' + p.label + ' <span class="label-es">/ ' + p.labelEs + '</span></div></div></div>' +
    '<div class="para-body"><p class="en">' + p.en + '</p><p class="es">' + p.es + '</p></div>';
  return w;
}

function slideGlossary(from, to) {
  var w = el("div", "gloss-slide");
  var rows = "";
  for (var i = from; i < to && i < LESSON.glossary.length; i++) {
    var g = LESSON.glossary[i];
    rows += '<tr><td class="g-en">' + g[0] + '</td><td class="g-def">' + g[1] + '</td><td class="g-es">' + g[2] + '</td></tr>';
  }
  w.innerHTML =
    '<h2>Glossary <span class="h2-es">/ Glosario</span></h2>' +
    '<p class="lead">The words you need for the test. <span class="es-inline">Las palabras que necesitas para el test.</span></p>' +
    '<table class="gloss"><thead><tr><th>English</th><th>Meaning</th><th>Espanol</th></tr></thead><tbody>' + rows + '</tbody></table>';
  return w;
}

function slideSecIntro(s) {
  var sec = LESSON.sections[s];
  var w = el("div", "intro-slide");
  w.innerHTML =
    '<div class="intro-num">' + (s + 1 < 10 ? "0" : "") + (s + 1) + '</div>' +
    '<h2>' + sec.title + '</h2>' +
    '<p class="es big">' + sec.titleEs + '</p>' +
    '<p class="lead">' + (sec.intro || (sec.items.length + " questions. Choose one answer, read the feedback, then continue.")) + '</p>' +
    '<p class="es">' + (sec.introEs || (sec.items.length + " preguntas. Elige una respuesta, lee el comentario y continua.")) + '</p>';
  return w;
}

function slideSpot(sIdx, qIdx) {
  var sec = LESSON.sections[sIdx];
  var item = sec.items[qIdx];
  var key = sIdx + ":" + qIdx;
  var w = el("div", "q-slide spot-slide");

  var head = el("div", "q-head");
  head.innerHTML = '<span class="q-tag">' + sec.title + '</span>' +
    '<span class="q-count">Sentence ' + (qIdx + 1) + ' / ' + sec.items.length + '</span>';
  w.appendChild(head);

  var stem = el("div", "q-stem");
  stem.innerHTML = '<p class="q-en">' + item.q + '</p><p class="q-es">' + item.es + '</p>';
  w.appendChild(stem);

  var line = el("div", "tokens");
  for (var i = 0; i < item.tokens.length; i++) {
    (function (idx) {
      var b = el("button", "tok");
      b.type = "button";
      b.textContent = item.tokens[idx];
      b.onclick = function () { pickSpot(key, idx, item, w); };
      line.appendChild(b);
    })(i);
  }
  w.appendChild(line);

  var fb = el("div", "fb");
  w.appendChild(fb);

  if (S.answers[key]) { paintSpot(w, key, item); }
  return w;
}

function pickSpot(key, idx, item, w) {
  if (S.answers[key]) { return; }
  S.answers[key] = { pick: idx, ok: idx === item.a };
  paintSpot(w, key, item);
  chrome();
}

function paintSpot(w, key, item) {
  var a = S.answers[key];
  var toks = w.querySelectorAll(".tok");
  for (var i = 0; i < toks.length; i++) {
    toks[i].disabled = true;
    if (i === item.a) { toks[i].classList.add("is-correct"); }
    if (i === a.pick && !a.ok) { toks[i].classList.add("is-wrong"); }
  }
  var fb = w.querySelector(".fb");
  fb.className = "fb show " + (a.ok ? "good" : "bad");
  fb.innerHTML = '<div class="fb-tag">' + (a.ok ? "Found it / Lo encontraste" : "Not that word / Esa palabra no") + '</div>' +
    '<p class="fb-fix">' + item.fix + '</p>' +
    '<p class="fb-en">' + item.x + '</p><p class="fb-es">' + item.xEs + '</p>';
}

function slideQuestion(sIdx, qIdx, lay) {
  var sec = LESSON.sections[sIdx];
  var item = sec.items[qIdx];
  var key = sIdx + ":" + qIdx;
  var w = el("div", "q-slide");

  var head = el("div", "q-head");
  head.innerHTML = '<span class="q-tag">' + sec.title + '</span>' +
    '<span class="q-count">Question ' + (qIdx + 1) + ' / ' + sec.items.length + '</span>';
  w.appendChild(head);

  var stem = el("div", "q-stem");
  stem.innerHTML = '<p class="q-en">' + item.q + '</p><p class="q-es">' + item.es + '</p>';
  w.appendChild(stem);

  var opts = el("div", "opts");
  var letters = ["A", "B", "C", "D"];
  for (var i = 0; i < lay.options.length; i++) {
    (function (idx) {
      var b = el("button", "opt");
      b.type = "button";
      b.innerHTML = '<span class="letter">' + letters[idx] + '</span><span class="otext">' + lay.options[idx] + '</span>';
      b.onclick = function () { pick(key, idx, lay.correct, item, w); };
      opts.appendChild(b);
    })(i);
  }
  w.appendChild(opts);

  var fb = el("div", "fb");
  w.appendChild(fb);

  if (S.answers[key]) { paint(w, key, lay.correct, item); }
  return w;
}

function pick(key, idx, correct, item, w) {
  if (S.answers[key]) { return; }
  S.answers[key] = { pick: idx, ok: idx === correct };
  paint(w, key, correct, item);
  chrome();
}

function paint(w, key, correct, item) {
  var a = S.answers[key];
  var btns = w.querySelectorAll(".opt");
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    if (i === correct) { btns[i].classList.add("is-correct"); }
    if (i === a.pick && !a.ok) { btns[i].classList.add("is-wrong"); }
  }
  var fb = w.querySelector(".fb");
  fb.className = "fb show " + (a.ok ? "good" : "bad");
  fb.innerHTML = '<div class="fb-tag">' + (a.ok ? "Correct / Correcto" : "Not this time / Esta vez no") + '</div>' +
    '<p class="fb-en">' + item.x + '</p><p class="fb-es">' + item.xEs + '</p>';
}

function slideSecResult(s) {
  var sec = LESSON.sections[s];
  var c = correctCount(s);
  var t = sec.items.length;
  var pct = Math.round(100 * c / t);
  var w = el("div", "res-slide");
  w.innerHTML =
    '<div class="res-tag">Section result / Resultado de la seccion</div>' +
    '<h2>' + sec.title + '</h2>' +
    '<div class="res-score">' + c + '<span>/ ' + t + '</span></div>' +
    '<div class="res-bar"><i style="width:' + pct + '%"></i></div>' +
    '<p class="lead">' + (pct >= 80 ? "Strong. Move on." : pct >= 50 ? "Good. Look at the glossary again before the next part." : "Go back and read the text once more, then try again.") + '</p>' +
    '<p class="es">' + (pct >= 80 ? "Muy bien. Continua." : pct >= 50 ? "Bien. Repasa el glosario antes de la siguiente parte." : "Vuelve a leer el texto y prueba otra vez.") + '</p>';
  return w;
}

function slidePlanIntro() {

    '<div class="eyebrow">MODULE 03 &middot; PRESENT</div>' +
    '<h1>The twenty minutes afterwards</h1>' +
    '<p class="sub">The talk is rehearsed. The questions are not. This module is about the part you cannot script.</p>' +
    '<p class="sub-es">La charla se ensaya. Las preguntas no. Este modulo trata de la parte que no puedes guionizar.</p>' +
    '<div class="credit">Illustration: Black Isler</div>' +
    '</div>';
  return w;
}

function slidePlan() {
  var w = el("div", "plan-slide");
  var rows = "";
  for (var i = 0; i < LESSON.presentation.plan.length; i++) {
    var r = LESSON.presentation.plan[i];
    rows += '<div class="plan-row"><span class="plan-n">' + r[0] + '</span>' +
      '<div class="plan-body"><div class="plan-what">' + r[1] + '</div>' +
      '<div class="plan-en">' + r[2] + '</div><div class="plan-es">' + r[3] + '</div></div></div>';
  }
  w.innerHTML = '<h2>Five moves in a research talk <span class="h2-es">/ Cinco movimientos en una charla</span></h2>' + '<div class="plan-list">' + rows + '</div>';
  return w;
}

function slideMeeting() {
  var w = el("div", "plan-slide");
  var rows = "";
  for (var i = 0; i < LESSON.presentation.meeting.length; i++) {
    var r = LESSON.presentation.meeting[i];
    rows += '<div class="phrase"><div class="p-en">' + r[0] + '</div><div class="p-es">' + r[1] + '</div></div>';
  }
  w.innerHTML = '<h2>Six lines for the questions <span class="h2-es">/ Seis frases para las preguntas</span></h2>' +
    '<p class="lead">Buy time, check what was asked, admit a gap, and leave with a contact. <span class="es-inline">Gana tiempo, comprueba que te han preguntado, reconoce un vacio y sal con un contacto.</span></p>' +
    '<div class="phrase-grid">' + rows + '</div>';
  return w;
}

function slideSpeakIntro() {
  var w = el("div", "intro-slide");
  w.innerHTML =
    '<div class="intro-num">04</div>' +
    '<h2>Speaking under pressure</h2>' +
    '<p class="es big">Hablar bajo presion</p>' +
    '<p class="lead">Five prompts, including one question you were not expecting. Nothing is scored here. Time yourself, take notes, then compare with a model answer.</p>' +
    '<p class="es">Cinco consignas, incluida una pregunta que no esperabas. Aqui no se puntua nada. Cronometrate, toma notas y luego compara con una respuesta modelo.</p>';
  return w;
}

function fmt(t) {
  var m = Math.floor(t / 60), s = t % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

function slideSpeak(n) {
  var sp = LESSON.speaking[n];
  var w = el("div", "speak-slide");
  w.innerHTML =
    '<div class="q-head"><span class="q-tag">Speaking</span><span class="q-count">Prompt ' + (n + 1) + ' / ' + LESSON.speaking.length + '</span></div>' +
    '<div class="q-stem"><p class="q-en">' + sp.q + '</p><p class="q-es">' + sp.es + '</p></div>' +
    '<div class="speak-grid">' +
    '<div class="speak-left">' +
    '<div class="timer"><span class="tval" id="tval">' + fmt(S.timer.t) + '</span>' +
    '<button type="button" class="mini" id="tstart">Start</button>' +
    '<button type="button" class="mini" id="tpause">Pause</button>' +
    '<button type="button" class="mini" id="treset">Reset</button></div>' +
    '<textarea id="notes" placeholder="Your notes / Tus notas"></textarea>' +
    '</div>' +
    '<div class="speak-right">' +
    '<button type="button" class="mini wide" id="modelBtn">Show a model answer / Ver respuesta modelo</button>' +
    '<div class="model" id="model" hidden><p class="m-en">' + sp.model + '</p><p class="m-es">' + sp.modelEs + '</p></div>' +
    '</div></div>';

  var ta = w.querySelector("#notes");
  ta.value = S.notes[n] || "";
  ta.oninput = function () { S.notes[n] = ta.value; };

  var tv = w.querySelector("#tval");
  w.querySelector("#tstart").onclick = function () {
    if (S.timer.on) { return; }
    S.timer.on = true;
    S.timer.h = setInterval(function () {
      S.timer.t++;
      if (tv && tv.parentNode) { tv.textContent = fmt(S.timer.t); } else { stopTimer(); }
    }, 1000);
  };
  w.querySelector("#tpause").onclick = stopTimer;
  w.querySelector("#treset").onclick = function () { stopTimer(); S.timer.t = 0; tv.textContent = fmt(0); };

  var mb = w.querySelector("#modelBtn");
  var mo = w.querySelector("#model");
  mb.onclick = function () {
    mo.hidden = !mo.hidden;
    mb.textContent = mo.hidden ? "Show a model answer / Ver respuesta modelo" : "Hide the model answer / Ocultar la respuesta";
  };
  return w;
}

function stopTimer() {
  S.timer.on = false;
  if (S.timer.h) { clearInterval(S.timer.h); S.timer.h = null; }
}

function slideWrite() {
  var W = LESSON.writing;
  var w = el("div", "write-slide");
  var checks = "";
  for (var i = 0; i < W.checklist.length; i++) {
    checks += '<li><span class="c-en">' + W.checklist[i][0] + '</span><span class="c-es">' + W.checklist[i][1] + '</span></li>';
  }
  w.innerHTML =
    '<div class="q-head"><span class="q-tag">Writing / Escritura</span><span class="q-count">Minimum ' + W.minWords + ' words</span></div>' +
    '<div class="write-grid">' +
    '<div class="write-left"><p class="q-en">' + W.prompt + '</p><p class="q-es">' + W.promptEs + '</p>' +
    '<ul class="checks">' + checks + '</ul>' +
    '<button type="button" class="mini wide" id="wmodel" disabled>Model paragraph unlocks at ' + W.minWords + ' words</button>' +
    '<div class="model" id="wm" hidden><p class="m-en">' + W.model + '</p><p class="m-es">' + W.modelEs + '</p></div>' +
    '</div>' +
    '<div class="write-right">' +
    '<input class="nameIn" id="wname" type="text" placeholder="Your name / Tu nombre">' +
    '<textarea id="wtext" placeholder="Write here... / Escribe aqui..."></textarea>' +
    '<div class="wfoot"><span class="wc" id="wc">0 words</span>' +
    '<button type="button" class="mini" id="wdl">Download for your teacher</button></div>' +
    '</div></div>';

  var ta = w.querySelector("#wtext");
  var nm = w.querySelector("#wname");
  var wc = w.querySelector("#wc");
  var mb = w.querySelector("#wmodel");
  var mo = w.querySelector("#wm");
  ta.value = S.writing;
  nm.value = S.name;
  nm.oninput = function () { S.name = nm.value; };

  function tick() {
    var n = words(ta.value);
    wc.textContent = n + (n === 1 ? " word" : " words");
    wc.className = "wc" + (n >= LESSON.writing.minWords ? " ok" : "");
    if (n >= LESSON.writing.minWords) {
      mb.disabled = false;
      if (mo.hidden) { mb.textContent = "Show the model paragraph / Ver el parrafo modelo"; }
    } else {
      mb.disabled = true;
      mo.hidden = true;
      w.querySelector(".write-left").classList.remove("showing");
      mb.textContent = "Model paragraph unlocks at " + LESSON.writing.minWords + " words";
    }
  }
  ta.oninput = function () { S.writing = ta.value; tick(); };
  var left = w.querySelector(".write-left");
  mb.onclick = function () {
    mo.hidden = !mo.hidden;
    left.classList.toggle("showing", !mo.hidden);
    mb.textContent = mo.hidden ? "Show the model paragraph / Ver el parrafo modelo" : "Hide the model paragraph / Ocultar el parrafo";
  };
  w.querySelector("#wdl").onclick = function () { download("forbes-english-under-load.txt", buildTxt()); };
  tick();
  return w;
}

function buildTxt() {
  var out = [];
  out.push("FORBES ENGLISH - Under Load (B1-B2)");
  out.push("Name: " + (S.name || "-"));
  out.push("Date: " + new Date().toISOString().slice(0, 10));
  out.push("Score: " + correctCount() + " / " + scored());
  out.push("");
  for (var s = 0; s < LESSON.sections.length; s++) {
    out.push(LESSON.sections[s].title + ": " + correctCount(s) + " / " + LESSON.sections[s].items.length);
  }
  out.push("");
  out.push("SPEAKING NOTES");
  for (var i = 0; i < LESSON.speaking.length; i++) {
    out.push((i + 1) + ". " + LESSON.speaking[i].q);
    out.push("   " + (S.notes[i] ? S.notes[i].replace(/\n/g, "\n   ") : "(no notes)"));
  }
  out.push("");
  out.push("WRITING - " + LESSON.writing.prompt);
  out.push("Words: " + words(S.writing));
  out.push("");
  out.push(S.writing || "(empty)");
  out.push("");
  out.push("--- Teacher notes ---");
  return out.join("\n");
}

function slideFinal() {
  var w = el("div", "final-slide");
  var rows = "";
  for (var s = 0; s < LESSON.sections.length; s++) {
    var sec = LESSON.sections[s];
    var c = correctCount(s);
    var t = sec.items.length;
    rows += '<tr><td>' + sec.title + '</td><td class="n">' + c + ' / ' + t + '</td>' +
      '<td class="barcell"><span class="minibar"><i style="width:' + Math.round(100 * c / t) + '%"></i></span></td></tr>';
  }
  var total = correctCount();
  var max = scored();
  var pct = Math.round(100 * total / max);
  var band = pct >= 85 ? "Excellent / Excelente" : pct >= 65 ? "Good / Bien" : pct >= 45 ? "Keep going / Sigue asi" : "Review the lesson / Repasa la leccion";
  w.innerHTML =
    '<h2>Your results <span class="h2-es">/ Tus resultados</span></h2>' +
    '<div class="final-grid">' +
    '<div><table class="final-table"><tbody>' + rows + '</tbody></table></div>' +
    '<div class="final-score"><div class="fs-num">' + total + '<span>/ ' + max + '</span></div>' +
    '<div class="fs-band">' + band + '</div>' +
    '<button type="button" class="mini wide" id="fdl">Download everything for your teacher</button>' +
    '<p class="es small">Descarga tus notas, tu texto y tu puntuacion en un archivo .txt</p></div>' +
    '</div>';
  w.querySelector("#fdl").onclick = function () { download("forbes-english-under-load.txt", buildTxt()); };
  return w;
}

/* ---------- shell ---------- */

function renderSlide() {
  var sl = S.slides[S.i];
  var host = document.getElementById("content");
  host.innerHTML = "";
  var node;
  if (sl.type === "hero") { node = slideHero(); }
  else if (sl.type === "para") { node = slidePara(sl.p); }
  else if (sl.type === "glossary") { node = slideGlossary(sl.from, sl.to); }
  else if (sl.type === "secIntro") { node = slideSecIntro(sl.sec); }
  else if (sl.type === "q") {
    node = sl.lay ? slideQuestion(sl.sec, sl.q, sl.lay) : slideSpot(sl.sec, sl.q);
  }
  else if (sl.type === "secResult") { node = slideSecResult(sl.sec); }
  else if (sl.type === "planIntro") { node = slidePlanIntro(); }
  else if (sl.type === "plan") { node = slidePlan(); }
  else if (sl.type === "meeting") { node = slideMeeting(); }
  else if (sl.type === "speakIntro") { node = slideSpeakIntro(); }
  else if (sl.type === "speak") { node = slideSpeak(sl.sp); }
  else if (sl.type === "write") { node = slideWrite(); }
  else { node = slideFinal(); }
  host.appendChild(node);
  chrome();
}

function chrome() {
  var sl = S.slides[S.i];
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle("on", Number(tabs[i].getAttribute("data-m")) === sl.m);
  }
  document.getElementById("score").textContent = correctCount() + " / " + scored();
  var pct = Math.round(100 * S.i / (S.slides.length - 1));
  document.getElementById("bar").style.width = pct + "%";

  var stepEls = document.querySelectorAll(".rail-node");
  var active = Math.min(LESSON.steps.length - 1, Math.floor(S.i / (S.slides.length / LESSON.steps.length)));
  for (var j = 0; j < stepEls.length; j++) {
    stepEls[j].classList.toggle("lit", j <= active);
  }

  var next = document.getElementById("next");
  var back = document.getElementById("back");
  back.disabled = S.i === 0;
  var locked = sl.type === "q" && !S.answers[sl.sec + ":" + sl.q];
  next.disabled = locked || S.i === S.slides.length - 1;
  next.textContent = locked ? "Choose an answer" : (S.i === S.slides.length - 1 ? "End of lesson" : "Next");
  document.getElementById("pos").textContent = (S.i + 1) + " / " + S.slides.length;
}

function go(d) {
  var n = S.i + d;
  if (n < 0 || n >= S.slides.length) { return; }
  var sl = S.slides[S.i];
  if (d > 0 && sl.type === "q" && !S.answers[sl.sec + ":" + sl.q]) { return; }
  stopTimer();
  S.i = n;
  renderSlide();
}

function jump(m) {
  for (var i = 0; i < S.slides.length; i++) {
    if (S.slides[i].m === m) { stopTimer(); S.i = i; renderSlide(); return; }
  }
}

function fit() {
  var st = document.getElementById("stage");
  var k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  st.style.transform = "scale(" + k + ")";
}

function buildRail() {
  var rail = document.getElementById("rail");
  rail.innerHTML = "";
  for (var i = 0; i < LESSON.steps.length; i++) {
    var n = el("div", "rail-node");
    n.innerHTML = '<span class="dot"></span><span class="rl">' + LESSON.steps[i] + '</span>';
    rail.appendChild(n);
  }
}

function toggleEs() {
  var st = document.getElementById("stage");
  var on = st.classList.toggle("es-on");
  var b = document.getElementById("estoggle");
  b.textContent = on ? "ES on" : "ES off";
  b.classList.toggle("on", on);
}

function boot() {
  S.slides = buildDeck();
  buildRail();
  document.getElementById("estoggle").onclick = toggleEs;
  document.getElementById("next").onclick = function () { go(1); };
  document.getElementById("back").onclick = function () { go(-1); };
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    (function (t) { t.onclick = function () { jump(Number(t.getAttribute("data-m"))); }; })(tabs[i]);
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { go(1); }
    if (e.key === "ArrowLeft") { go(-1); }
  });
  window.addEventListener("resize", fit);
  fit();
  renderSlide();
}

if (typeof module !== "undefined") {
  module.exports = { buildDeck: buildDeck, layout: layout, shuffle: shuffle, S: S };
}

boot();
</script>
</body>
</html>
