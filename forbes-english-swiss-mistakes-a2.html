<script>
(function () {
  "use strict";

  /* ---------------- Data ---------------- */

  var ACT1 = {
    type: "mc",
    label: "Activity 1",
    title: "Choose the Correct Word",
    instructions: "Do, make, take... German uses 'machen' for many of these, but English does not! Choose the correct word for each sentence.",
    questions: [
      {
        prompt: "I ___ lessons with an English teacher every week.",
        options: ["take", "make", "do", "work"],
        answer: "take",
        explain: "In English we 'take lessons' (or 'have lessons'). 'Make lessons' is a direct translation of 'Unterricht machen' and is incorrect.",
        de: "DE: take lessons = Unterricht nehmen"
      },
      {
        prompt: "I ___ a lot of travelling for my job.",
        options: ["do", "make", "take", "go"],
        answer: "do",
        explain: "We 'do' activities like travelling, sport and work. 'Make' is for creating or producing something.",
        de: "DE: do a lot of travelling = viel reisen"
      },
      {
        prompt: "She works ___ a Swiss company in Zurich.",
        options: ["for", "to", "at", "by"],
        answer: "for",
        explain: "You work FOR a company (your employer). 'Work to' comes from German 'bei/zu' but is wrong in English. ('Work at' is only for the place, e.g. 'at the Zurich office'.)",
        de: "DE: work for a company = fuer eine Firma arbeiten"
      },
      {
        prompt: "We ___ business with companies in Germany and Austria.",
        options: ["do", "make", "take", "have"],
        answer: "do",
        explain: "The fixed collocation is 'do business with someone' - even though German says 'Geschaefte machen'.",
        de: "DE: do business = Geschaefte machen"
      },
      {
        prompt: "He wants to ___ a course in marketing.",
        options: ["take", "make", "work", "do"],
        answer: "take",
        explain: "We 'take a course' (also possible: 'do a course'). The best and most common answer here is 'take'. 'Make a course' is a German-style mistake.",
        de: "DE: take a course = einen Kurs machen"
      },
      {
        prompt: "I don't ___ much sport, but I walk every day.",
        options: ["do", "make", "take", "play"],
        answer: "do",
        explain: "We 'do sport' in general. ('Play' only works with named games: play tennis, play football.) 'Make sport' is incorrect.",
        de: "DE: do sport = Sport treiben"
      },
      {
        prompt: "My company ___ services for international clients.",
        options: ["provides", "makes", "produces", "gives"],
        answer: "provides",
        explain: "Companies 'provide services' but 'produce goods'. Services are not physical, so we don't 'produce' or 'make' them.",
        de: "DE: provide services = Dienstleistungen anbieten"
      },
      {
        prompt: "Volkswagen ___ cars and other vehicles.",
        options: ["produces", "provides", "works", "serves"],
        answer: "produces",
        explain: "Physical products like cars are 'produced' (or 'made'). 'Provide' is for services, not goods.",
        de: "DE: produce goods = Waren herstellen"
      }
    ]
  };

  var ACT2 = {
    type: "fix",
    label: "Activity 2",
    title: "Fix the Mistake",
    instructions: "Each sentence below contains a typical German-speaker mistake. Choose the version that is fully correct.",
    questions: [
      {
        wrong: "I make English lessons every Tuesday.",
        options: [
          "I take English lessons every Tuesday.",
          "I take English lessons in every Tuesday.",
          "I am take English lessons every Tuesday.",
          "I take English lesson every Tuesday."
        ],
        answer: "I take English lessons every Tuesday.",
        explain: "'Take lessons' is the correct collocation, 'lessons' must be plural here, and 'every Tuesday' needs no preposition."
      },
      {
        wrong: "I work to a company in Basel.",
        options: [
          "I work for a company in Basel.",
          "I work by a company in Basel.",
          "I work for a company at Basel.",
          "I am work for a company in Basel."
        ],
        answer: "I work for a company in Basel.",
        explain: "Work FOR a company, and IN a city. 'I am work' mixes two verb forms and is never correct."
      },
      {
        wrong: "A long time before, people travelled by horse.",
        options: [
          "A long time ago, people travelled by horse.",
          "A long time since, people travelled by horse.",
          "A long time ago, people travelled by the horse.",
          "Long time ago, people travelled by horse."
        ],
        answer: "A long time ago, people travelled by horse.",
        explain: "Use 'ago' to look back from now ('vor langer Zeit'). We also keep 'A' at the start, and 'by horse' takes no article."
      },
      {
        wrong: "That's mean the hotel is expensive.",
        options: [
          "That means the hotel is expensive.",
          "That mean the hotel is expensive.",
          "That is means the hotel is expensive.",
          "That's meaning the hotel is expensive."
        ],
        answer: "That means the hotel is expensive.",
        explain: "'That' is third person singular, so the verb is 'means'. 'That's mean' = 'that is mean', which says the hotel is unkind!"
      },
      {
        wrong: "The eat must be good.",
        options: [
          "The food must be good.",
          "The eating must be good.",
          "The food must to be good.",
          "The meal must be well."
        ],
        answer: "The food must be good.",
        explain: "'Eat' is a verb; the noun is 'food'. After 'must' we use the verb without 'to', and 'good' (adjective) is correct, not 'well'."
      },
      {
        wrong: "Yesterday I made a train to Zurich.",
        options: [
          "Yesterday I took a train to Zurich.",
          "Yesterday I taked a train to Zurich.",
          "Yesterday I took a train at Zurich.",
          "Yesterday I have took a train to Zurich."
        ],
        answer: "Yesterday I took a train to Zurich.",
        explain: "We TAKE a train (past: took). With 'yesterday' we use past simple, and movement towards a place needs 'to'."
      },
      {
        wrong: "We made fishing at the weekend.",
        options: [
          "We went fishing at the weekend.",
          "We did fishing at the weekend.",
          "We went to fishing at the weekend.",
          "We went fishing in the weekend."
        ],
        answer: "We went fishing at the weekend.",
        explain: "Outdoor activities use 'go + -ing': go fishing, go skiing, go hiking. No 'to' before the activity, and British English says 'at the weekend'."
      },
      {
        wrong: "Switzerland has much sun in summer.",
        options: [
          "Switzerland has a lot of sun in summer.",
          "Switzerland has many sun in summer.",
          "Switzerland has lot of sun in summer.",
          "Switzerland has a lot sun in summer."
        ],
        answer: "Switzerland has a lot of sun in summer.",
        explain: "In positive sentences we prefer 'a lot of', not 'much'. The full phrase needs both 'a' and 'of': a lot of sun."
      }
    ]
  };

  var ACT3 = {
    type: "gap",
    label: "Activity 3",
    title: "Complete the Sentence",
    instructions: "Choose the missing word. Watch out - German prepositions are false friends here!",
    questions: [
      {
        prompt: "I work ___ a company that produces medical equipment.",
        options: ["for", "to", "at", "by"],
        answer: "for",
        explain: "Work FOR an employer. German 'bei' often becomes 'for' in English, not 'by' or 'to'."
      },
      {
        prompt: "I don't ___ lessons on Friday because I'm busy.",
        options: ["take", "make", "give", "hold"],
        answer: "take",
        explain: "Students 'take lessons'; teachers 'give lessons'. 'Make lessons' is the classic German-speaker mistake."
      },
      {
        prompt: "A long time ___, people used horses instead of cars.",
        options: ["ago", "before", "since", "then"],
        answer: "ago",
        explain: "'Ago' counts back from NOW: a long time ago, two years ago. 'Before' needs a past reference point, not the present."
      },
      {
        prompt: "It depends ___ the type of customer.",
        options: ["on", "of", "from", "at"],
        answer: "on",
        explain: "The verb is always 'depend ON'. German says 'abhaengen VON', so 'of' and 'from' are tempting - but wrong."
      },
      {
        prompt: "I would like compensation ___ the cancelled flight.",
        options: ["for", "about", "of", "by"],
        answer: "for",
        explain: "We get compensation FOR a problem: compensation for the delay, for the damage, for the cancelled flight."
      },
      {
        prompt: "The company has a subsidiary ___ Germany.",
        options: ["in", "at", "on", "by"],
        answer: "in",
        explain: "Countries and cities take 'in': in Germany, in Berlin, in Switzerland."
      },
      {
        prompt: "We travelled two miles ___ foot.",
        options: ["on", "by", "with", "per"],
        answer: "on",
        explain: "It's 'by car, by train, by bus' - but always 'ON foot'. This one is an exception you must memorise."
      },
      {
        prompt: "The company provides services ___ Europe.",
        options: ["across", "between", "along", "among"],
        answer: "across",
        explain: "'Across Europe' (or 'throughout Europe') means in many places over the whole area."
      }
    ]
  };

  var ACT4 = {
    type: "match",
    label: "Activity 4",
    title: "Business Vocabulary Match",
    instructions: "Click a word, then click its meaning. Match all eight pairs. Only your first try for each word counts towards your score!",
    pairs: [
      { term: "employees", def: "the people who work for a company" },
      { term: "revenue", def: "money a company receives from sales" },
      { term: "subsidiary", def: "a company controlled by a larger company" },
      { term: "expertise", def: "special knowledge and skill in one area" },
      { term: "well-known", def: "famous or familiar to many people" },
      { term: "vehicle", def: "a car, bus or other transport machine" },
      { term: "region", def: "an area of a country or continent" },
      { term: "transferable skills", def: "skills you can use in many different jobs" }
    ]
  };

  var ACTIVITIES = [ACT1, ACT2, ACT3, ACT4];

  var TOTAL_QUESTIONS = 0;
  ACTIVITIES.forEach(function (a) {
    TOTAL_QUESTIONS += (a.type === "match") ? a.pairs.length : a.questions.length;
  });

  /* ---------------- State ---------------- */

  var state = {
    actIndex: 0,
    qIndex: 0,
    score: 0,
    answered: 0,
    perActivity: []
  };

  var stage = document.getElementById("stage");
  var scorebar = document.getElementById("scorebar");

  /* ---------------- Helpers ---------------- */

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function updateScorebar() {
    document.getElementById("sb-score-val").textContent = state.score;
    document.getElementById("sb-total").textContent = TOTAL_QUESTIONS;
    document.getElementById("sb-answered").textContent = state.answered;
    var label = (state.actIndex < ACTIVITIES.length)
      ? (state.actIndex + 1) + " of " + ACTIVITIES.length
      : "Done";
    document.getElementById("sb-activity").textContent = label;
  }

  /* ---------------- Intro ---------------- */

  function renderIntro() {
    scorebar.classList.remove("visible");
    var itemsHtml = ACTIVITIES.map(function (a, i) {
      var count = (a.type === "match") ? a.pairs.length : a.questions.length;
      return '<div class="intro-item">' +
        '<div class="intro-num">' + (i + 1) + '</div>' +
        '<div><h3>' + esc(a.title) + '</h3>' +
        '<p>' + count + ' questions</p></div>' +
        '</div>';
    }).join("");

    stage.innerHTML =
      '<div class="card">' +
      '<p class="act-eyebrow">Welcome</p>' +
      '<h2 class="act-title">Goodbye, Denglisch!</h2>' +
      '<p class="act-instructions">German is a wonderful language - but when it sneaks into your English, mistakes happen. ' +
      'In this lesson you will fix the most common errors made by German speakers: do vs. make vs. take, ' +
      'tricky prepositions, and business vocabulary. There are ' + TOTAL_QUESTIONS + ' questions in 4 activities.</p>' +
      '<div class="intro-list">' + itemsHtml + '</div>' +
      '<div class="intro-start"><button class="btn" id="start-btn">Start the lesson</button></div>' +
      '</div>';

    document.getElementById("start-btn").addEventListener("click", function () {
      state.actIndex = 0;
      state.qIndex = 0;
      renderCurrent();
    });
  }

  /* ---------------- Routing ---------------- */

  function renderCurrent() {
    if (state.actIndex >= ACTIVITIES.length) {
      renderResults();
      return;
    }
    scorebar.classList.add("visible");
    updateScorebar();
    var act = ACTIVITIES[state.actIndex];
    if (act.type === "match") {
      renderMatch(act);
    } else {
      renderQuestion(act);
    }
  }

  function goNext() {
    var act = ACTIVITIES[state.actIndex];
    var count = (act.type === "match") ? 1 : act.questions.length;
    if (act.type === "match" || state.qIndex + 1 >= count) {
      state.actIndex += 1;
      state.qIndex = 0;
    } else {
      state.qIndex += 1;
    }
    renderCurrent();
    window.scrollTo({ top: scorebar.offsetTop - 12, behavior: "smooth" });
  }

  function nextLabel(act, isLastQuestion) {
    if (!isLastQuestion) { return "Next question"; }
    return (state.actIndex + 1 >= ACTIVITIES.length) ? "See my results" : "Next activity";
  }

  /* ---------------- Question activities (mc / fix / gap) ---------------- */

  function renderQuestion(act) {
    var q = act.questions[state.qIndex];
    var total = act.questions.length;
    var isLast = (state.qIndex + 1 === total);
    var shuffled = shuffle(q.options);
    var pct = Math.round((state.qIndex / total) * 100);

    var promptHtml = "";
    if (act.type === "fix") {
      promptHtml =
        '<div class="wrong-sentence"><span class="tag">Find the mistake</span>' + esc(q.wrong) + '</div>' +
        '<p class="q-prompt" style="font-size:17px; color: var(--slate); font-weight:500;">Which version is correct?</p>';
    } else {
      promptHtml = '<p class="q-prompt">' + esc(q.prompt).replace("___", '<span class="gap">&nbsp;</span>') + '</p>';
    }

    var optsHtml = shuffled.map(function (opt) {
      return '<button type="button" class="opt" data-value="' + esc(opt) + '">' + esc(opt) + '</button>';
    }).join("");

    stage.innerHTML =
      '<div class="card">' +
      '<p class="act-eyebrow">' + esc(act.label) + '</p>' +
      '<h2 class="act-title">' + esc(act.title) + '</h2>' +
      '<p class="act-instructions">' + esc(act.instructions) + '</p>' +
      '<div class="progress-line">' +
      '<span class="progress-text">Question ' + (state.qIndex + 1) + ' of ' + total + '</span>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      promptHtml +
      '<div class="options' + (act.type === "gap" ? " chips" : "") + '" id="opts">' + optsHtml + '</div>' +
      '<div class="feedback" id="feedback" aria-live="polite"></div>' +
      '<div class="next-row" id="next-row"></div>' +
      '</div>';

    var buttons = Array.prototype.slice.call(document.querySelectorAll("#opts .opt"));
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var chosen = btn.getAttribute("data-value");
        var isCorrect = (chosen === q.answer);

        buttons.forEach(function (b) {
          b.disabled = true;
          var val = b.getAttribute("data-value");
          if (val === q.answer) {
            b.classList.add("correct");
          } else if (b === btn && !isCorrect) {
            b.classList.add("incorrect");
          } else {
            b.classList.add("dim");
          }
        });

        state.answered += 1;
        if (isCorrect) { state.score += 1; }
        updateScorebar();

        var fb = document.getElementById("feedback");
        fb.classList.add("show", isCorrect ? "good" : "bad");
        var verdict = isCorrect ? "Correct!" : "Not quite. The answer is: " + esc(q.answer);
        var deHtml = q.de ? '<span class="de">' + esc(q.de) + '</span>' : "";
        fb.innerHTML = '<span class="verdict">' + verdict + '</span>' + esc(q.explain) + deHtml;

        var nextRow = document.getElementById("next-row");
        nextRow.innerHTML = '<button class="btn" id="next-btn">' + nextLabel(act, isLast) + '</button>';
        document.getElementById("next-btn").addEventListener("click", goNext);
        document.getElementById("next-btn").focus();
      });
    });
  }

  /* ---------------- Matching activity ---------------- */

  function renderMatch(act) {
    var terms = shuffle(act.pairs.map(function (p) { return p.term; }));
    var defs = shuffle(act.pairs.map(function (p) { return p.def; }));
    var defByTerm = {};
    act.pairs.forEach(function (p) { defByTerm[p.term] = p.def; });

    var matchedCount = 0;
    var attempted = {};
    var selectedTermBtn = null;

    var termsHtml = terms.map(function (t) {
      return '<button type="button" class="match-item term" data-term="' + esc(t) + '">' + esc(t) + '</button>';
    }).join("");
    var defsHtml = defs.map(function (d) {
      return '<button type="button" class="match-item def" data-def="' + esc(d) + '">' + esc(d) + '</button>';
    }).join("");

    stage.innerHTML =
      '<div class="card">' +
      '<p class="act-eyebrow">' + esc(act.label) + '</p>' +
      '<h2 class="act-title">' + esc(act.title) + '</h2>' +
      '<p class="act-instructions">' + esc(act.instructions) + '</p>' +
      '<div class="progress-line">' +
      '<span class="progress-text" id="match-progress">Matched 0 of ' + act.pairs.length + '</span>' +
      '<div class="progress-track"><div class="progress-fill" id="match-fill" style="width:0%"></div></div>' +
      '</div>' +
      '<div class="match-grid">' +
      '<div class="match-col"><span class="match-col-label">Word</span>' + termsHtml + '</div>' +
      '<div class="match-col"><span class="match-col-label">Meaning</span>' + defsHtml + '</div>' +
      '</div>' +
      '<div class="feedback" id="feedback" aria-live="polite"></div>' +
      '<div class="next-row" id="next-row"></div>' +
      '</div>';

    var termBtns = Array.prototype.slice.call(document.querySelectorAll(".match-item.term"));
    var defBtns = Array.prototype.slice.call(document.querySelectorAll(".match-item.def"));

    function refreshProgress() {
      document.getElementById("match-progress").textContent = "Matched " + matchedCount + " of " + act.pairs.length;
      document.getElementById("match-fill").style.width = Math.round((matchedCount / act.pairs.length) * 100) + "%";
    }

    function registerAttempt(term, wasCorrect) {
      if (attempted[term]) { return; }
      attempted[term] = true;
      state.answered += 1;
      if (wasCorrect) { state.score += 1; }
      updateScorebar();
    }

    termBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.classList.contains("matched")) { return; }
        if (selectedTermBtn) { selectedTermBtn.classList.remove("selected"); }
        if (selectedTermBtn === btn) { selectedTermBtn = null; return; }
        selectedTermBtn = btn;
        btn.classList.add("selected");
      });
    });

    defBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.classList.contains("matched") || !selectedTermBtn) { return; }
        var term = selectedTermBtn.getAttribute("data-term");
        var def = btn.getAttribute("data-def");
        var isCorrect = (defByTerm[term] === def);

        registerAttempt(term, isCorrect);

        if (isCorrect) {
          selectedTermBtn.classList.remove("selected");
          selectedTermBtn.classList.add("matched");
          selectedTermBtn.disabled = true;
          btn.classList.add("matched");
          btn.disabled = true;
          selectedTermBtn = null;
          matchedCount += 1;
          refreshProgress();
          if (matchedCount === act.pairs.length) {
            var fb = document.getElementById("feedback");
            fb.classList.add("show", "good");
            fb.innerHTML = '<span class="verdict">All pairs matched!</span>You have finished the vocabulary matching.';
            var nextRow = document.getElementById("next-row");
            var isLastAct = (state.actIndex + 1 >= ACTIVITIES.length);
            nextRow.innerHTML = '<button class="btn" id="next-btn">' + (isLastAct ? "See my results" : "Next activity") + '</button>';
            document.getElementById("next-btn").addEventListener("click", goNext);
            document.getElementById("next-btn").focus();
          }
        } else {
          btn.classList.add("shake");
          selectedTermBtn.classList.add("shake");
          var sel = selectedTermBtn;
          window.setTimeout(function () {
            btn.classList.remove("shake");
            sel.classList.remove("shake");
          }, 380);
        }
      });
    });
  }

  /* ---------------- Results ---------------- */

  function renderResults() {
    scorebar.classList.remove("visible");
    var pct = Math.round((state.score / TOTAL_QUESTIONS) * 100);

    var heading, msg;
    if (pct >= 90) {
      heading = "Ausgezeichnet - outstanding!";
      msg = "Swiss precision indeed. Your collocations and prepositions are excellent. You are ready for the next level.";
    } else if (pct >= 75) {
      heading = "Great work!";
      msg = "A strong result. Review the few questions you missed - especially do/make/take - and you will master them quickly.";
    } else if (pct >= 50) {
      heading = "Good progress!";
      msg = "You are on the right track. Focus on the collocations (take lessons, do business, work for) and try the lesson again.";
    } else {
      heading = "Keep practising!";
      msg = "These mistakes are very common - that is exactly why we practise them. Read the explanations carefully and try again. You will improve fast!";
    }

    var circumference = 2 * Math.PI * 70;
    var dash = circumference * pct / 100;

    stage.innerHTML =
      '<div class="card results">' +
      '<p class="act-eyebrow">Lesson Complete</p>' +
      '<div class="ring-wrap">' +
      '<svg width="170" height="170" viewBox="0 0 170 170">' +
      '<circle cx="85" cy="85" r="70" fill="none" stroke="#E4DFD6" stroke-width="14"></circle>' +
      '<circle cx="85" cy="85" r="70" fill="none" stroke="#C8102E" stroke-width="14" stroke-linecap="round" ' +
      'stroke-dasharray="' + dash.toFixed(1) + ' ' + circumference.toFixed(1) + '" transform="rotate(-90 85 85)"></circle>' +
      '</svg>' +
      '<div class="ring-score"><strong>' + pct + '%</strong><span>' + state.score + ' / ' + TOTAL_QUESTIONS + '</span></div>' +
      '</div>' +
      '<h2>' + heading + '</h2>' +
      '<p class="msg">' + msg + '</p>' +
      '<div class="breakdown">' +
      '<div class="bd-row"><span>Total questions</span><span>' + TOTAL_QUESTIONS + '</span></div>' +
      '<div class="bd-row"><span>Correct answers</span><span>' + state.score + '</span></div>' +
      '<div class="bd-row"><span>Final score</span><span>' + pct + '%</span></div>' +
      '</div>' +
      '<button class="btn" id="restart-btn">Restart the lesson</button>' +
      '</div>';

    document.getElementById("restart-btn").addEventListener("click", function () {
      state.actIndex = 0;
      state.qIndex = 0;
      state.score = 0;
      state.answered = 0;
      updateScorebar();
      renderIntro();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  /* ---------------- Init ---------------- */

  renderIntro();
})();
</script>
</body>
</html>
