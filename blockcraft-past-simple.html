int:"Sinn: Unsere Klasse plante letzte Woche eine riesige Mittelalterstadt auf dem Server.",options:["Our class planed a huge medieval city on the server last week.","Our class plannd a huge medieval city on the server last week.","Our class planned a huge medieval city on the server last week.","Our class planning a huge medieval city on the server last week."],correctIndex:2,explanation:"\u201EPlan\u201C hat einen kurzen betonten Vokal vor einem einzelnen Konsonanten \u2192 das \u201En\u201C wird verdoppelt: planned (\u201Eplaned\u201C w\xE4re \u201Ehobelte\u201C)."},{id:10,type:"four_sentences",category:"regular",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Evisit\u201C & \u201Estay\u201C)",germanHint:"Sinn: Wir besuchten das W\xFCstendorf und blieben bis zum Sonnenaufgang.",options:["We visitted the desert village and staied until sunrise.","We visited the desert village and stayed until sunrise.","We visited the desert village and stayd until sunrise.","We visit the desert village and stayed until sunrise."],correctIndex:1,explanation:"\u201EVisit\u201C wird auf der ersten Silbe betont (kein Doppel-t \u2192 visited) und bei \u201Estay\u201C steht ein Vokal vor dem \u201Ey\u201C (\u2192 stayed)."},{id:11,type:"fill",category:"irregular",prompt:"Last weekend, my friends and I _____ an underground Redstone bunker.",germanHint:"Letztes Wochenende bauten meine Freunde und ich einen unterirdischen Redstone-Bunker. (build)",options:["builded","built","bild","building"],correctIndex:1,explanation:"\u201EBuild\u201C ist unregelm\xE4\xDFig: build \u2013 built \u2013 built. Niemals \u201Ebuilded\u201C!"},{id:12,type:"fill",category:"irregular",prompt:"Tim _____ a staircase all the way down to level -58 to look for diamonds.",germanHint:"Tim grub eine Treppe ganz hinunter bis H\xF6he -58, um Diamanten zu suchen. (dig)",options:["digged","dag","dug","dog"],correctIndex:2,explanation:"Die 2. Form von \u201Edig\u201C (graben) ist \u201Edug\u201C (dig \u2013 dug \u2013 dug)."},{id:13,type:"fill",category:"irregular",prompt:"Guess what! I _____ a chest with two enchanted golden apples in the ancient city!",germanHint:"Rate mal! Ich fand eine Truhe mit zwei verzauberten goldenen \xC4pfeln! (find)",options:["finded","fand","found","founded"],correctIndex:2,explanation:"\u201EFind\u201C wird im Past Simple zu \u201Efound\u201C (find \u2013 found \u2013 found). \u201EFounded\u201C bedeutet \u201Egr\xFCndete\u201C (z. B. eine Firma)."},{id:14,type:"fill",category:"irregular",prompt:"We _____ through the purple portal and landed right next to a Bastion.",germanHint:"Wir gingen durch das lila Portal und landeten direkt neben einer Bastion. (go)",options:["goed","went","gone","going"],correctIndex:1,explanation:"Eines der wichtigsten unregelm\xE4\xDFigen Verben: go \u2013 went \u2013 gone. Im Past Simple immer \u201Ewent\u201C!"},{id:15,type:"fill",category:"irregular",prompt:"Together, our squad _____ the Ender Dragon and saved the End island.",germanHint:"Zusammen bek\xE4mpfte unser Squad den Enderdrachen und rettete die End-Insel. (fight)",options:["fighted","faught","fought","fight"],correctIndex:2,explanation:"\u201EFight\u201C hat die unregelm\xE4\xDFige 2. Form \u201Efought\u201C (mit \u201Eou\u201C, genau wie bought und thought)."},{id:16,type:"fill",category:"irregular",prompt:"Oh no! My iron pickaxe _____ just when I reached the obsidian wall.",germanHint:"Oh nein! Meine Eisenspitzhacke zerbrach genau dann, als ich die Obsidianwand erreichte. (break)",options:["breaked","broken","broke","brake"],correctIndex:2,explanation:"break \u2013 broke \u2013 broken. F\xFCr das Past Simple brauchst du die 2. Form: \u201Ebroke\u201C."},{id:17,type:"fill",category:"irregular",prompt:"At the village market, Jonas _____ a Mending book from the librarian for 14 emeralds.",germanHint:"Auf dem Dorfmarkt kaufte Jonas ein Reparatur-Buch f\xFCr 14 Smaragde. (buy)",options:["buyed","bought","brought","baught"],correctIndex:1,explanation:"buy \u2013 bought \u2013 bought (kaufen). Nicht verwechseln mit \u201Ebrought\u201C (= brachte, von bring)!"},{id:18,type:"four_sentences",category:"irregular",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Efall\u201C & \u201Elose\u201C)",germanHint:"Sinn: Ich fiel in eine tiefe Schlucht und verlor alle meine Fackeln.",options:["I falled into a deep ravine and losed all my torches.","I fell into a deep ravine and lost all my torches.","I fallen into a deep ravine and lost all my torches.","I felt into a deep ravine and lose all my torches."],correctIndex:1,explanation:"fall \u2013 fell \u2013 fallen (fiel) und lose \u2013 lost \u2013 lost (verlor). \u201EFelt\u201C kommt von \u201Efeel\u201C (f\xFChlen), nicht von \u201Efall\u201C!"},{id:19,type:"four_sentences",category:"irregular",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Esee\u201C & \u201Eswim\u201C)",germanHint:"Sinn: Wir sahen ein Ozeanmonument und schwammen schnell zur Oberfl\xE4che zur\xFCck.",options:["We seed an ocean monument and swimmed back to the surface fast.","We seen an ocean monument and swum back to the surface fast.","We saw an ocean monument and swam back to the surface fast.","We saw an ocean monument and swimmed back to the surface fast."],correctIndex:2,explanation:"Beide Verben sind unregelm\xE4\xDFig: see \u2192 saw (2. Form) und swim \u2192 swam (2. Form)."},{id:20,type:"four_sentences",category:"irregular",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewrite\u201C & \u201Ewin\u201C)",germanHint:"Sinn: Ben schrieb eine gute Englischarbeit und gewann abends das Minecraft-Turnier.",options:["Ben writed a great English test and winned the Minecraft tournament in the evening.","Ben written a great English test and won the Minecraft tournament in the evening.","Ben wrote a great English test and winned the Minecraft tournament in the evening.","Ben wrote a great English test and won the Minecraft tournament in the evening."],correctIndex:3,explanation:"write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!"},{id:21,type:"fill",category:"neg_quest",prompt:"I _____ into the Deep Dark cave because I didn\u2019t have any wool blocks.",germanHint:"Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)",options:["didn't went","didn't go","wasn't go","don't went"],correctIndex:1,explanation:"Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!)."},{id:22,type:"fill",category:"neg_quest",prompt:"_____ you _____ any Netherite scraps during your mining trip yesterday?",germanHint:"Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)",options:["Did / found","Were / find","Did / find","Do / found"],correctIndex:2,explanation:"Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?"},{id:23,type:"fill",category:"neg_quest",prompt:"What _____ Steve _____ with all that Redstone dust?",germanHint:"Was hat Steve mit all dem Redstone-Staub gebaut? (build)",options:["did / built","did / build","was / build","does / built"],correctIndex:1,explanation:"Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?"},{id:24,type:"fill",category:"neg_quest",prompt:"\u201CDid your brother defeat the Wither alone?\u201D \u2014 \u201CNo, he _____.\u201D",germanHint:"Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C",options:["wasn't","didn't","don't","didn't defeated"],correctIndex:1,explanation:"Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C."},{id:25,type:"fill",category:"neg_quest",prompt:"Why _____ Lukas _____ a water bucket before jumping off the tower?",germanHint:"Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)",options:["didn't / took","wasn't / take","didn't / take","don't / take"],correctIndex:2,explanation:"Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?"},{id:26,type:"fill",category:"neg_quest",prompt:"The Creeper _____ our house because my wolf scared it away\u2014wait, cats scare Creepers!",germanHint:"Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)",options:["didn't destroyed","not destroyed","didn't destroy","wasn't destroy"],correctIndex:2,explanation:"F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy."},{id:27,type:"fill",category:"neg_quest",prompt:"\u201CDid you and Mia finish your biology poster before gaming?\u201D \u2014 \u201CYes, we _____!\u201D",germanHint:"Kurzantwort: \u201EJa, das haben wir!\u201C",options:["did","were","finished","do"],correctIndex:0,explanation:"Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen)."},{id:28,type:"four_sentences",category:"neg_quest",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)",germanHint:"Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen.",options:["I didn't forgot my homework last night.","I not forgot my homework last night.","I didn't forget my homework last night.","I wasn't forget my homework last night."],correctIndex:2,explanation:"Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!"},{id:29,type:"four_sentences",category:"neg_quest",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)",germanHint:"Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?",options:["Where did you downloaded that cool Minecraft map yesterday?","Where you downloaded that cool Minecraft map yesterday?","Where did you download that cool Minecraft map yesterday?","Where were you download that cool Minecraft map yesterday?"],correctIndex:2,explanation:"Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!"},{id:30,type:"four_sentences",category:"neg_quest",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)",germanHint:"Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab.",options:["We didn't saw any diamonds, so we mined iron instead.","We didn't see any diamonds, so we mined iron instead.","We didn't seen any diamonds, so we mined iron instead.","We don't saw any diamonds, so we mined iron instead."],correctIndex:1,explanation:"Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined)."},{id:31,type:"fill",category:"was_were",prompt:"I _____ super nervous when I heard the Warden\u2019s heartbeat in the dark.",germanHint:"Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)",options:["were","was","did be","am"],correctIndex:1,explanation:"Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C."},{id:32,type:"fill",category:"was_were",prompt:"My friends and I _____ at the top of the mountain base when the storm started.",germanHint:"Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)",options:["was","were","did","are"],correctIndex:1,explanation:"\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!"},{id:33,type:"fill",category:"was_were",prompt:"_____ you online on our school SMP server last night?",germanHint:"Warst du gestern Abend auf unserem Schul-SMP-Server online?",options:["Did","Was","Were","Are"],correctIndex:2,explanation:"Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!"},{id:34,type:"fill",category:"was_were",prompt:"Look at that screenshot! There _____ three baby pandas in the bamboo jungle.",germanHint:"Es gab drei Baby-Pandas im Bambusdschungel. (There be)",options:["was","were","had","did"],correctIndex:1,explanation:"\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C."},{id:35,type:"fill",category:"was_were",prompt:"The maths test _____ as hard as I feared, so I finished ten minutes early.",germanHint:"Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)",options:["didn't be","weren't","wasn't","not was"],correctIndex:2,explanation:"\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!)."},{id:36,type:"fill",category:"was_were",prompt:"Because of the Elytra wings, I _____ glide all the way across the huge ocean.",germanHint:"Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)",options:["can","could","did can","was can"],correctIndex:1,explanation:"Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich."},{id:37,type:"fill",category:"was_were",prompt:"There _____ a hidden trapdoor right under the carpet in the woodland mansion!",germanHint:"Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!",options:["were","was","did","are"],correctIndex:1,explanation:"\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C."},{id:38,type:"four_sentences",category:"was_were",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)",germanHint:"Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?",options:["Did you were tired after the long boss fight?","Was you tired after the long boss fight?","Were you tired after the long boss fight?","Did you be tired after the long boss fight?"],correctIndex:2,explanation:"\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?"},{id:39,type:"four_sentences",category:"was_were",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)",germanHint:"Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war.",options:["The villagers didn't be in their houses because it was still daytime.","The villagers wasn't in their houses because it was still daytime.","The villagers weren't in their houses because it was still daytime.","The villagers not were in their houses because it was still daytime."],correctIndex:2,explanation:"\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C."},{id:40,type:"four_sentences",category:"was_were",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)",germanHint:"Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte.",options:["I didn't could light the portal last night because I had no flint.","I couldn't lit the portal last night because I had no flint.","I couldn't light the portal last night because I had no flint.","I wasn't could light the portal last night because I had no flint."],correctIndex:2,explanation:"\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C)."},{id:41,type:"fill",category:"traps",prompt:"I _____ a massive treehouse on our server yesterday.",germanHint:"Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!",options:["have built","built","am building","have build"],correctIndex:1,explanation:"Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!"},{id:42,type:"fill",category:"traps",prompt:"Our class started this Minecraft world three months _____.",germanHint:"Unsere Klasse startete diese Minecraft-Welt vor drei Monaten.",options:["before","since","ago","last"],correctIndex:2,explanation:"\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!)."},{id:43,type:"fill",category:"traps",prompt:"We _____ our first Nether fortress last night after dinner.",germanHint:"Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)",options:["have found","found","did found","finding"],correctIndex:1,explanation:"\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C."},{id:44,type:"fill",category:"traps",prompt:"When I _____ ten years old, I built my very first dirt house.",germanHint:"Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus.",options:["have been","was","were","am"],correctIndex:1,explanation:"\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C)."},{id:45,type:"fill",category:"traps",prompt:"Mojang _____ the Trial Chambers update in 2024.",germanHint:"Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)",options:["has released","released","was release","releasing"],correctIndex:1,explanation:"Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!)."},{id:46,type:"fill",category:"traps",prompt:"_____ week, our English teacher gave us a super fun gaming quiz.",germanHint:"Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz.",options:["Ago","Last","Yesterday","Before"],correctIndex:1,explanation:"\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!)."},{id:47,type:"fill",category:"traps",prompt:"\u201CWhen _____ you _____ playing Minecraft?\u201D \u2014 \u201CTwo years ago!\u201D",germanHint:"Wann hast du angefangen, Minecraft zu spielen? (start)",options:["have / started","did / start","did / started","were / start"],correctIndex:1,explanation:"Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!"},{id:48,type:"four_sentences",category:"traps",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)",germanHint:"Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt.",options:["I have played Minecraft for two hours yesterday.","I played Minecraft for two hours yesterday.","I did played Minecraft for two hours yesterday.","Yesterday have I played Minecraft for two hours."],correctIndex:1,explanation:"Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit."},{id:49,type:"four_sentences",category:"traps",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)",germanHint:"Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen.",options:["My friend has seen a rare pink sheep ago two days.","My friend saw a rare pink sheep two days before.","My friend saw a rare pink sheep two days ago.","My friend saw ago two days a rare pink sheep."],correctIndex:2,explanation:"Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C)."},{id:50,type:"four_sentences",category:"traps",prompt:"Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)",germanHint:"Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut.",options:["We built last night in Survival mode a new base.","We have built a new base in Survival mode last night.","We built a new base in Survival mode last night.","Last night built we a new base in Survival mode."],correctIndex:2,explanation:"Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!"}],ju=[{id:"reg-ed",category:"regular",title:"Regelm\xE4\xDFige Verben (-ed)",subtitle:"mine \u2192 mined \xB7 craft \u2192 crafted",badge:"Basis-Rezept",whenToUseDE:"Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.",formula:"Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)",formulaNoteDE:"Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.",signalsDiffDE:"Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).",mistakesDE:[{wrong:"He playeds Minecraft yesterday.",right:"He played Minecraft yesterday.",note:"Kein \u201E-s\u201C bei he/she/it im Past Simple!"},{wrong:"I mineed iron in the cave.",right:"I mined iron in the cave.",note:"Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu."}],examples:[{en:"I mined sixty blocks of iron yesterday.",de:"Ich baute gestern sechzig Bl\xF6cke Eisen ab."},{en:"She crafted a new shield before the raid.",de:"Sie craftete vor dem Raid einen neuen Schild."}]},{id:"spelling-ed",category:"regular",title:"Rechtschreib-Regeln (-ed)",subtitle:"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",badge:"Rechtschreibung",whenToUseDE:"Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!",formula:"Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed",formulaNoteDE:"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.",signalsDiffDE:"Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).",mistakesDE:[{wrong:"I tryed to escape and droped my sword.",right:"I tried to escape and dropped my sword.",note:"Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!"},{wrong:"We plaied BedWars all afternoon.",right:"We played BedWars all afternoon.",note:"Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!"}],examples:[{en:"Max studied his English words, then played Minecraft.",de:"Max lernte seine Englischw\xF6rter und spielte dann Minecraft."},{en:"The skeleton stopped right outside our wall.",de:"Das Skelett blieb direkt vor unserer Mauer stehen."}]},{id:"irregular-v2",category:"irregular",title:"Unregelm\xE4\xDFige Verben (2. Form)",subtitle:"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found",badge:"Amboss-Wissen",whenToUseDE:"Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich
