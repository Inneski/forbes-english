mine)":"Ieri pomeriggio ho estratto quaranta blocchi di carbone in una grotta enorme. (mine)","Bei regelm\xE4\xDFigen Verben, die schon auf \u201E-e\u201C enden (mine \u2192 mined), h\xE4ngt man einfach nur ein \u201E-d\u201C an.":"Ai verbi regolari che finiscono gi\xE0 in \u201C-e\u201D (mine \u2192 mined) si aggiunge solo una \u201C-d\u201D.","Nach der Schule craftete Leon eine komplette Eisenr\xFCstung. (craft)":"Dopo la scuola, Leon ha creato un'armatura di ferro completa. (craft)","\u201ECraft\u201C ist ein normales regelm\xE4\xDFiges Verb: einfach \u201E-ed\u201C anh\xE4ngen \u2192 crafted.":"\u201CCraft\u201D \xE8 un normale verbo regolare: basta aggiungere \u201C-ed\u201D \u2192 crafted.","Ich versuchte, \xFCber den Lavafluss zu springen, und schaffte es gerade so! (try)":"Ho provato a saltare oltre il fiume di lava e ce l'ho fatta per un pelo! (try)","Rechtschreib-Regel: Endet ein Verb auf Konsonant + y (try), wird das \u201Ey\u201C zu \u201Eied\u201C \u2192 tried.":"Regola di ortografia: se un verbo finisce in consonante + y (try), la \u201Cy\u201D diventa \u201Cied\u201D \u2192 tried.","Pl\xF6tzlich blieb der laute Zombie direkt vor unserer Eichent\xFCr stehen. (stop)":"All'improvviso, lo zombie rumoroso si \xE8 fermato proprio davanti alla nostra porta di quercia. (stop)","Bei kurzen Verben mit kurzem Vokal + einfachem Konsonanten am Ende (stop) wird der letzte Konsonant verdoppelt \u2192 stopped.":"Nei verbi brevi con vocale breve + una sola consonante finale (stop), l'ultima consonante raddoppia \u2192 stopped.","Letzten Samstag spielten mein bester Freund und ich zwei Stunden lang BedWars. (play)":"Sabato scorso io e il mio migliore amico abbiamo giocato a BedWars per due ore. (play)","Achtung! Steht vor dem \u201Ey\u201C ein Vokal (a, e, o, u wie in \u201Eplay\u201C), bleibt das \u201Ey\u201C einfach stehen \u2192 played (NICHT plaied!).":"Attenzione! Se prima della \u201Cy\u201D c'\xE8 una vocale (a, e, o, u come in \u201Cplay\u201D), la \u201Cy\u201D resta \u2192 played (NON plaied!).","Ups! Ich lie\xDF mein verzaubertes Diamantschwert versehentlich in den Kaktus fallen! (drop)":"Ops! Ho fatto cadere per sbaglio la mia spada di diamante incantata nel cactus! (drop)","\u201EDrop\u201C ist kurz und endet auf Vokal + Konsonant (o + p) \u2192 das \u201Ep\u201C wird verdoppelt: dropped.":"\u201CDrop\u201D \xE8 breve e finisce in vocale + consonante (o + p) \u2192 la \u201Cp\u201D raddoppia: dropped.","Vor dem Zocken am Freitag lernte Max 30 Minuten lang seine Englischvokabeln. (study)":"Prima di giocare venerd\xEC, Max ha studiato il vocabolario d'inglese per 30 minuti. (study)","Bei \u201Estudy\u201C steht ein Konsonant (d) vor dem \u201Ey\u201C \u2192 aus \u201Ey\u201C wird \u201Eied\u201C: studied.":"In \u201Cstudy\u201D c'\xE8 una consonante (d) prima della \u201Cy\u201D \u2192 la \u201Cy\u201D diventa \u201Cied\u201D: studied.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: -ed-Rechtschreibung mit \u201Ecarry\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: ortografia in -ed con \u201Ccarry\u201D)","Sinn: Wir trugen zwei volle Shulker-Boxen zur\xFCck zu unserer Base.":"Senso: Abbiamo riportato due scatole di Shulker piene alla nostra base.","Bei \u201Ecarry\u201C steht der Konsonant \u201Er\u201C vor dem \u201Ey\u201C, deshalb wird das \u201Ey\u201C zu \u201Ei\u201C + \u201E-ed\u201C \u2192 carried.":"In \u201Ccarry\u201D la consonante \u201Cr\u201D viene prima della \u201Cy\u201D, quindi la \u201Cy\u201D diventa \u201Ci\u201D + \u201C-ed\u201D \u2192 carried.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verdopplung bei \u201Eplan\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: doppia consonante con \u201Cplan\u201D)","Sinn: Unsere Klasse plante letzte Woche eine riesige Mittelalterstadt auf dem Server.":"Senso: La settimana scorsa la nostra classe ha progettato un'enorme citt\xE0 medievale sul server.","\u201EPlan\u201C hat einen kurzen betonten Vokal vor einem einzelnen Konsonanten \u2192 das \u201En\u201C wird verdoppelt: planned (\u201Eplaned\u201C w\xE4re \u201Ehobelte\u201C).":"\u201CPlan\u201D ha una vocale breve accentata prima di una sola consonante \u2192 la \u201Cn\u201D raddoppia: planned (\u201Cplaned\u201D vorrebbe dire \u201Cha piallato\u201D).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Evisit\u201C & \u201Estay\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: \u201Cvisit\u201D e \u201Cstay\u201D)","Sinn: Wir besuchten das W\xFCstendorf und blieben bis zum Sonnenaufgang.":"Senso: Abbiamo visitato il villaggio del deserto e siamo rimasti fino all'alba.","\u201EVisit\u201C wird auf der ersten Silbe betont (kein Doppel-t \u2192 visited) und bei \u201Estay\u201C steht ein Vokal vor dem \u201Ey\u201C (\u2192 stayed).":"\u201CVisit\u201D ha l'accento sulla prima sillaba (niente doppia t \u2192 visited) e in \u201Cstay\u201D c'\xE8 una vocale prima della \u201Cy\u201D (\u2192 stayed).","Letztes Wochenende bauten meine Freunde und ich einen unterirdischen Redstone-Bunker. (build)":"Lo scorso fine settimana io e i miei amici abbiamo costruito un bunker sotterraneo di redstone. (build)","\u201EBuild\u201C ist unregelm\xE4\xDFig: build \u2013 built \u2013 built. Niemals \u201Ebuilded\u201C!":"\u201CBuild\u201D \xE8 irregolare: build \u2013 built \u2013 built. Mai \u201Cbuilded\u201D!","Tim grub eine Treppe ganz hinunter bis H\xF6he -58, um Diamanten zu suchen. (dig)":"Tim ha scavato una scala fino al livello -58 per cercare diamanti. (dig)","Die 2. Form von \u201Edig\u201C (graben) ist \u201Edug\u201C (dig \u2013 dug \u2013 dug).":"La 2\xAA forma di \u201Cdig\u201D (scavare) \xE8 \u201Cdug\u201D (dig \u2013 dug \u2013 dug).","Rate mal! Ich fand eine Truhe mit zwei verzauberten goldenen \xC4pfeln! (find)":"Indovina! Ho trovato un baule con due mele d'oro incantate! (find)","\u201EFind\u201C wird im Past Simple zu \u201Efound\u201C (find \u2013 found \u2013 found). \u201EFounded\u201C bedeutet \u201Egr\xFCndete\u201C (z. B. eine Firma).":"\u201CFind\u201D al Past Simple diventa \u201Cfound\u201D (find \u2013 found \u2013 found). \u201CFounded\u201D significa \u201Cha fondato\u201D (per esempio un'azienda).","Wir gingen durch das lila Portal und landeten direkt neben einer Bastion. (go)":"Siamo passati attraverso il portale viola e siamo atterrati proprio accanto a un bastione. (go)","Eines der wichtigsten unregelm\xE4\xDFigen Verben: go \u2013 went \u2013 gone. Im Past Simple immer \u201Ewent\u201C!":"Uno dei verbi irregolari pi\xF9 importanti: go \u2013 went \u2013 gone. Al Past Simple sempre \u201Cwent\u201D!","Zusammen bek\xE4mpfte unser Squad den Enderdrachen und rettete die End-Insel. (fight)":"Insieme, la nostra squadra ha combattuto contro l'Ender Dragon e ha salvato l'isola dell'End. (fight)","\u201EFight\u201C hat die unregelm\xE4\xDFige 2. Form \u201Efought\u201C (mit \u201Eou\u201C, genau wie bought und thought).":"\u201CFight\u201D ha la 2\xAA forma irregolare \u201Cfought\u201D (con \u201Cou\u201D, proprio come bought e thought).","Oh nein! Meine Eisenspitzhacke zerbrach genau dann, als ich die Obsidianwand erreichte. (break)":"Oh no! Il mio piccone di ferro si \xE8 rotto proprio quando ho raggiunto il muro di ossidiana. (break)","break \u2013 broke \u2013 broken. F\xFCr das Past Simple brauchst du die 2. Form: \u201Ebroke\u201C.":"break \u2013 broke \u2013 broken. Per il Past Simple ti serve la 2\xAA forma: \u201Cbroke\u201D.","Auf dem Dorfmarkt kaufte Jonas ein Reparatur-Buch f\xFCr 14 Smaragde. (buy)":"Al mercato del villaggio, Jonas ha comprato un libro Riparazione per 14 smeraldi. (buy)","buy \u2013 bought \u2013 bought (kaufen). Nicht verwechseln mit \u201Ebrought\u201C (= brachte, von bring)!":"buy \u2013 bought \u2013 bought (comprare). Non confonderlo con \u201Cbrought\u201D (= ha portato, da bring)!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Efall\u201C & \u201Elose\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: \u201Cfall\u201D e \u201Close\u201D)","Sinn: Ich fiel in eine tiefe Schlucht und verlor alle meine Fackeln.":"Senso: Sono caduto in un burrone profondo e ho perso tutte le mie torce.","fall \u2013 fell \u2013 fallen (fiel) und lose \u2013 lost \u2013 lost (verlor). \u201EFelt\u201C kommt von \u201Efeel\u201C (f\xFChlen), nicht von \u201Efall\u201C!":"fall \u2013 fell \u2013 fallen (\xE8 caduto) e lose \u2013 lost \u2013 lost (ha perso). \u201CFelt\u201D viene da \u201Cfeel\u201D (sentire), non da \u201Cfall\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Esee\u201C & \u201Eswim\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: \u201Csee\u201D e \u201Cswim\u201D)","Sinn: Wir sahen ein Ozeanmonument und schwammen schnell zur Oberfl\xE4che zur\xFCck.":"Senso: Abbiamo visto un monumento oceanico e siamo tornati in fretta in superficie a nuoto.","Beide Verben sind unregelm\xE4\xDFig: see \u2192 saw (2. Form) und swim \u2192 swam (2. Form).":"Entrambi i verbi sono irregolari: see \u2192 saw (2\xAA forma) e swim \u2192 swam (2\xAA forma).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewrite\u201C & \u201Ewin\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: \u201Cwrite\u201D e \u201Cwin\u201D)","Sinn: Ben schrieb eine gute Englischarbeit und gewann abends das Minecraft-Turnier.":"Senso: Ben ha scritto un bel compito d'inglese e la sera ha vinto il torneo di Minecraft.","write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!":"write \u2013 wrote \u2013 written (ha scritto) e win \u2013 won \u2013 won (ha vinto). Entrambi sono alla 2\xAA forma!","Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)":"Non sono entrato nella grotta del Deep Dark perch\xE9 non avevo blocchi di lana. (not go)","Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!).":"Regola d'oro: dopo \u201Cdidn\u2019t\u201D c'\xE8 SEMPRE la forma base (infinito) del verbo \u2192 didn\u2019t go (MAI didn\u2019t went!).","Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)":"Hai trovato dei frammenti di netherite ieri durante la tua spedizione in miniera? (find)","Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?":"Le domande al Past Simple si formano con \u201CDid + soggetto + forma base\u201D \u2192 Did you find...?","Was hat Steve mit all dem Redstone-Staub gebaut? (build)":"Che cosa ha costruito Steve con tutta quella polvere di redstone? (build)","Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?":"Anche nelle domande con What / Where / Why: \u201Cdid\u201D porta gi\xE0 il passato, il verbo resta alla forma base \u2192 What did Steve build?","Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C":"Risposta breve in inglese: \u201CNo, non l'ha fatto.\u201D","Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C.":"Se la domanda inizia con \u201CDid\u2026?\u201D, si risponde brevemente con \u201CYes, \u2026 did\u201D o \u201CNo, \u2026 didn\u2019t\u201D.","Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)":"Perch\xE9 Lukas non ha preso un secchio d'acqua prima di saltare dalla torre? (not take)","Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?":"Domanda negativa con Why al Past Simple: \u201CWhy didn\u2019t + soggetto + forma base\u201D \u2192 Why didn\u2019t Lukas take...?","Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)":"Il Creeper non ha distrutto la nostra casa! (not destroy)","F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy.":"Per la negazione dei verbi normali al Past Simple ti serve sempre \u201Cdidn\u2019t\u201D + forma base \u2192 didn\u2019t destroy.","Kurzantwort: \u201EJa, das haben wir!\u201C":"Risposta breve: \u201CS\xEC, l'abbiamo fatto!\u201D","Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen).":"A \u201CDid you and Mia\u2026?\u201D la risposta breve corretta in inglese \xE8 semplicemente \u201CYes, we did!\u201D (senza ripetere il verbo principale).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: negazione con \u201Cdidn\u2019t\u201D)","Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen.":"Senso: Ieri sera non ho dimenticato i compiti.","Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!":"Dopo \u201Cdidn\u2019t\u201D il verbo torna alla 1\xAA forma (forma base): \u201Cdidn\u2019t forget\u201D \u2013 mai \u201Cdidn\u2019t forgot\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: domande con \u201CDid\u201D)","Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?":"Senso: Dove hai scaricato ieri quella mappa di Minecraft cos\xEC bella?","Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!":"Formula della domanda: parola interrogativa (Where) + did + soggetto (you) + forma base (download) \u2192 niente \u201C-ed\u201D sul verbo!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: \u201Cdidn\u2019t\u201D con i verbi irregolari)","Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab.":"Senso: Non abbiamo visto diamanti, quindi abbiamo estratto ferro.","Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).":"Nella prima parte c'\xE8 \u201Cdidn\u2019t + forma base\u201D (didn\u2019t see), nella seconda una normale frase affermativa al Past Simple (mined).","Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)":"Ero nervosissimo quando ho sentito il battito del Warden. (be)","Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.":"Con I / he / she / it al Past Simple si usa sempre \u201Cwas\u201D.","Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)":"Io e i miei amici eravamo in cima alla base sulla montagna quando \xE8 iniziato il temporale. (be)","\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!":"\u201CMy friends and I\u201D = we (plurale) \u2192 per questo qui ci va \u201Cwere\u201D!","Warst du gestern Abend auf unserem Schul-SMP-Server online?":"Eri online ieri sera sul server SMP della scuola?","Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!":"Con \u201Cyou\u201D si usa sempre \u201Cwere\u201D \u2013 e con was/were non si usa MAI \u201Cdid\u201D!","Es gab drei Baby-Pandas im Bambusdschungel. (There be)":"C'erano tre cuccioli di panda nella giungla di bamb\xF9. (There be)","\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.":"\u201CThree baby pandas\u201D \xE8 plurale \u2192 \u201CThere were\u201D (c'erano). Per il singolare si usa \u201CThere was\u201D.","Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)":"Il compito di matematica non \xE8 stato cos\xEC difficile come temevo. (not be)","\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).":"\u201CThe maths test\u201D = it \u2192 la negazione di \u201Cwas\u201D \xE8 semplicemente \u201Cwasn\u2019t\u201D (senza \u201Cdidn\u2019t\u201D!).","Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)":"Grazie alle elitre ho potuto planare sopra tutto l'immenso oceano. (can \u2192 Past Simple)","Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.":"Il passato di \u201Ccan\u201D \xE8 \u201Ccould\u201D (potevo/ho potuto). Non serve \u201Cdid\u201D ed \xE8 uguale per tutte le persone.","Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!":"C'era una botola nascosta proprio sotto il tappeto nella villa del bosco!","\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.":"\u201CA hidden trapdoor\u201D \xE8 singolare \u2192 quindi \u201CThere was\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: domanda con \u201Cwere\u201D)","Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?":"Senso: Eravate stanchi dopo la lunga battaglia contro il boss?","\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?":"\u201Cwas\u201D e \u201Cwere\u201D sono verbi forti: NON hanno bisogno di \u201Cdid\u201D! Basta invertire soggetto e \u201Cwere\u201D \u2192 Were you tired?","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: \u201Cwasn\u2019t / weren\u2019t\u201D)","Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war.":"Senso: Gli abitanti del villaggio non erano nelle loro case perch\xE9 era ancora giorno.","\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.":"\u201CThe villagers\u201D = they (plurale) \u2192 \u201Cweren\u2019t\u201D. Con \u201Cbe\u201D al Past Simple non si usa mai \u201Cdidn\u2019t\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: \u201Ccouldn\u2019t\u201D)","Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte.":"Senso: Ieri sera non sono riuscito ad accendere il portale perch\xE9 mi mancava la selce.","\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).":"\u201CCouldn\u2019t\u201D non ha bisogno di \u201Cdid\u201D e va sempre con la forma base del verbo (\u201Ccouldn\u2019t light\u201D).","Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!":"Attenzione, trappola dell'italiano! In italiano si dice \u201CHo costruito ieri\u201D, ma in inglese con \u201Cyesterday\u201D ci vuole il Past Simple!","Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!":"La trappola n. 1 dell'italiano! Con indicatori come \u201Cyesterday\u201D (passato concluso) non si usa MAI il Present Perfect (\u201Chave built\u201D) \u2013 sempre il Past Simple: \u201Cbuilt\u201D!","Unsere Klasse startete diese Minecraft-Welt vor drei Monaten.":"La nostra classe ha iniziato questo mondo di Minecraft tre mesi fa.","\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).":"\u201CTre mesi fa\u201D in inglese \xE8 \u201Cthree months ago\u201D \u2013 e \u201Cago\u201D, come \u201Cfa\u201D, va sempre ALLA FINE dell'espressione di tempo!","Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)":"Ieri sera abbiamo trovato la nostra prima fortezza del Nether. (find)","\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.":"\u201CLast night\u201D \xE8 un chiaro indicatore del Past Simple! Quindi \u201Cfound\u201D e non \u201Chave found\u201D.","Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus.":"Quando avevo dieci anni, ho costruito la mia primissima casa di terra.","\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).":"\u201CWhen I was ten years old\u201D descrive un momento concluso del passato \u2192 sempre Past Simple (\u201Cwas\u201D).","Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)":"Mojang ha pubblicato l'aggiornamento Trial Chambers nel 2024. (release)","Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).":"Con anni passati come \u201Cin 2024\u201D, in inglese si usa sempre il Past Simple \u2192 \u201Creleased\u201D (niente Present Perfect!).","Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz.":"La settimana scorsa il nostro prof d'inglese ci ha fatto un quiz sui videogiochi fantastico.","\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).":"\u201CLa settimana scorsa / il mese scorso / l'anno scorso\u201D in inglese \xE8 \u201Clast week / last month / last year\u201D (senza \u201Cthe\u201D!).","Wann hast du angefangen, Minecraft zu spielen? (start)":"Quando hai iniziato a giocare a Minecraft? (start)","Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!":"Le domande con \u201CWhen\u2026?\u201D chiedono un momento preciso del passato \u2192 SEMPRE Past Simple (\u201CWhen did you start\u2026?\u201D), mai Present Perfect!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: la trappola del passato prossimo con \u201Cyesterday\u201D)","Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt.":"Senso: Ieri ho giocato a Minecraft per due ore.","Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.":"Appena c'\xE8 \u201Cyesterday\u201D nella frase, \u201Chave played\u201D \xE8 vietato! E l'ordine delle parole in inglese \xE8 soggetto \u2013 verbo \u2013 oggetto \u2013 tempo.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: ordine delle parole con \u201Cago\u201D)","Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen.":"Senso: Due giorni fa il mio amico ha visto un raro gregge di pecore rosa.","Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).":"Le espressioni con \u201Cago\u201D vanno alla fine della frase (o proprio all'inizio), e \u201Cago\u201D viene DOPO il periodo di tempo: \u201Ctwo days ago\u201D + Past Simple (\u201Csaw\u201D).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)":"Quale frase al Past Simple \xE8 grammaticalmente CORRETTA? (Focus: posizione delle espressioni di tempo)","Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut.":"Senso: Ieri sera abbiamo costruito una nuova base in modalit\xE0 Sopravvivenza.","Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!":"Regola S-V-O dell'inglese: soggetto (We) + verbo (built) + oggetto (a new base) + luogo (in Survival mode) + tempo (last night). Niente inversioni come in \u201CLast night built we\u201D!","mine \u2192 mined \xB7 craft \u2192 crafted":"mine \u2192 mined \xB7 craft \u2192 crafted","Basis-Rezept":"Ricetta base","Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.":"Il Past Simple si usa per azioni completamente concluse nel passato (per es. ieri, la settimana scorsa, durante le vacanze). Alla maggior parte dei verbi inglesi basta aggiungere \u201C-ed\u201D.","Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)":"Soggetto + forma base + -ed  (uguale per TUTTE le persone!)","Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.":"Semplicissimo: al Past Simple NON c'\xE8 la \u201C-s\u201D con he/she/it! I played, he played, we played \u2013 la stessa forma ovunque.","Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).":"Indicatori tipici: yesterday, last week, in 2024, two days ago. Se un verbo finisce in \u201C-e\u201D (mine, live, love), aggiungi solo \u201C-d\u201D (mined, lived).","Kein \u201E-s\u201C bei he/she/it im Past Simple!":"Niente \u201C-s\u201D con he/she/it al Past Simple!","Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.":"Con la \u201C-e\u201D muta finale si aggiunge solo \u201C-d\u201D.","Ich baute gestern sechzig Bl\xF6cke Eisen ab.":"Ieri ho estratto sessanta blocchi di ferro.","Sie craftete vor dem Raid einen neuen Schild.":"Ha creato un nuovo scudo prima del raid.","Rechtschreib-Regeln (-ed)":"Regole di ortografia (-ed)","try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played":"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",Rechtschreibung:"Ortografia","Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!":"In alcuni verbi regolari l'ortografia cambia un po' quando si aggiunge \u201C-ed\u201D. Queste 3 regole escono in quasi tutte le verifiche d'inglese!","Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed":"consonante + y \u2192 -ied  |  vocale + y \u2192 -yed  |  vocale breve + consonante \u2192 doppia consonante + -ed","1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"Attenzione ai verbi di due sillabe come \u201Cvisit\u201D o \u201Copen\u201D: poich\xE9 \xE8 accentata la PRIMA sillaba, l'ultima lettera NON raddoppia (visited, opened).","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"Consonante + y diventa -ied; il breve \u201Cdrop\u201D raddoppia la p!","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"Prima della y c'\xE8 una vocale (a) \u2192 la y resta!","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"Max ha studiato le parole d'inglese e poi ha giocato a Minecraft.","Das Skelett blieb direkt vor unserer Mauer stehen.":"Lo scheletro si \xE8 fermato proprio davanti al nostro muro.","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"Sapere dell'incudine","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"Molti dei verbi inglesi pi\xF9 comuni (andare, costruire, trovare, combattere, vedere) non seguono la regola del \u201C-ed\u201D. Hanno una 2\xAA forma propria, da imparare a memoria.","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"Soggetto + 2\xAA forma del verbo (Past Simple)  \u2014 per es. go \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"Importante: la 2\xAA forma si usa SOLO nelle frasi affermative! Appena entrano in gioco \u201Cdid\u201D o \u201Cdidn\u2019t\u201D, il verbo torna alla 1\xAA forma.","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"Non confondere la 2\xAA forma (Past Simple: broke, saw, went) con la 3\xAA forma (participio passato: broken, seen, gone). La 3\xAA forma serve solo per il Present Perfect o il passivo.","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"Mai aggiungere \u201C-ed\u201D ai verbi irregolari!","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\u201Cseen\u201D \xE8 la 3\xAA forma \u2013 al Past Simple sempre la 2\xAA forma \u201Csaw\u201D!","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"Abbiamo scavato fino al livello -58 e abbiamo trovato otto diamanti.","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"Leo ha combattuto contro l'Ender Dragon e ha vinto la partita.","Verneinung mit didn't":"Negazione con didn't","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"La regola pi\xF9 importante!","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"Se vuoi dire che qualcosa NON \xE8 successo nel passato, con tutti i verbi normali (tranne be e could) ti serve l'ausiliare \u201Cdidn\u2019t\u201D (= did not).","Subjekt + didn't + Grundform (1. Form des Verbs)":"Soggetto + didn't + forma base (1\xAA forma del verbo)","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"Trucco per ricordarlo: \u201CDid ha gi\xE0 il passato nell'inventario!\u201D Per questo il verbo principale resta SEMPRE alla forma base (senza -ed e senza 2\xAA forma).","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"Vale allo stesso modo per i verbi regolari E irregolari: \u201Cdidn\u2019t play\u201D, \u201Cdidn\u2019t go\u201D, \u201Cdidn\u2019t build\u201D. Uniche eccezioni: was/were (\u2192 wasn\u2019t/weren\u2019t) e could (\u2192 couldn\u2019t).","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"L'errore pi\xF9 frequente nelle verifiche: mai la 2\xAA forma dopo \u201Cdidn\u2019t\u201D!","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"In inglese \u201Cnot\u201D non pu\xF2 mai stare da solo davanti al verbo principale.","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"Non ho perso la mia spada perch\xE9 l'avevo messa nella mia cassa dell'Ender.","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"Non abbiamo finito il tetto prima del tramonto.","Entscheidungsfragen (Did you...?)":"Domande s\xEC/no (Did you...?)","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"Domande s\xEC/no","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"Per fare una domanda s\xEC/no sul passato (\u201CHai\u2026?\u201D / \u201CHai costruito\u2026?\u201D), basta mettere \u201CDid\u201D all'inizio della frase.","Did + Subjekt + Grundform (1. Form) + ...?":"Did + soggetto + forma base (1\xAA forma) + ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"Anche qui \u201CDid\u201D ruba al verbo la desinenza del passato! Quindi \u201CDid you mine?\u201D (NON \u201CDid you mined?\u201D).","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"In italiano si chiede \u201CHai giocato ieri?\u201D \u2013 ma per un passato concluso l'inglese dice \u201CDid you play yesterday?\u201D!","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"Dopo \u201CDid\u201D c'\xE8 sempre la forma base \u201Cfind\u201D!","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"In inglese non si spostano semplicemente i verbi principali in avanti \u2013 serve \u201CDid\u201D.","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"Hai portato abbastanza torce per la grotta?","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"Tom ha finito i compiti di matematica prima di Discord?","W-Fragen (What / Where / Why did...?)":"Domande con W (What / Where / Why did...?)","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"Domande con W","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"Se vuoi informazioni pi\xF9 precise (Cosa? Dove? Quando? Perch\xE9? Come?), metti la parola interrogativa inglese subito prima di \u201Cdid\u201D.","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"Parola interrogativa (What/Where/When/Why/How) + did + soggetto + forma base?","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"Attenzione a \u201CWho\u201D come domanda sul soggetto (\u201CChi l'ha costruito?\u201D): l\xEC \u201Cdid\u201D sparisce \u2192 \u201CWho built this castle?\u201D (2\xAA forma!).","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"In inglese le domande con \u201CWhen\u2026?\u201D sono quasi sempre al Past Simple (\u201CWhen did you start?\u201D), perch\xE9 chiedono un momento preciso.","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"Forma base \u201Cgo\u201D dopo \u201Cdid\u201D!","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"Non dimenticare l'ausiliare \u201Cdid\u201D!","Wo hast du die Diamanttruhe versteckt?":"Dove hai nascosto il baule dei diamanti?","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"Perch\xE9 il Creeper \xE8 esploso vicino alla nostra fattoria?","Kurzantworten (Yes, I did)":"Risposte brevi (Yes, I did)","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"Cortese e corretto","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"In inglese un semplice \u201CYes.\u201D o \u201CNo.\u201D suona spesso troppo secco o scortese. Per questo nelle domande s\xEC/no si aggiunge il pronome + l'ausiliare.","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + pronome + did.  |  No, + pronome + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"Alle domande con \u201CWas/Were\u2026?\u201D si risponde naturalmente con was/were (\u201CYes, I was.\u201D / \u201CNo, they weren\u2019t.\u201D), non con did!","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"Nelle risposte brevi non si ripete MAI il verbo principale (quindi NON \u201CYes, I did played\u201D).","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"Breve, chiara e perfetta: semplicemente \u201CYes, I did.\u201D","Das Hilfsverb in der Antwort passt immer zur Frage!":"L'ausiliare della risposta corrisponde sempre alla domanda!","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\u201CAvete sconfitto l'Ender Dragon?\u201D \u2014 \u201CS\xEC!\u201D","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\u201CMia ha perso il suo cavallo?\u201D \u2014 \u201CNo.\u201D","was & were (Aussage)":"was e were (affermazione)","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"Il verbo \u201Cto be\u201D","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\u201Cwas\u201D e \u201Cwere\u201D sono le forme del passato di \u201Cbe\u201D (essere \u2192 ero, era / erano). Con loro descrivi stati, sentimenti, luoghi e caratteristiche nel passato.","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"Pensa a \u201Cyou\u201D: anche se parli con UN solo amico, in inglese si dice SEMPRE \u201Cyou were\u201D (mai \u201Cyou was\u201D!).","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\u201Ccould\u201D (potevo) si comporta forte come was/were: anche lui non ha bisogno di \u201Cdid\u201D.","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"Con \u201Cyou\u201D, nell'inglese standard si usa sempre \u201Cwere\u201D.","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\u201CMy friends\u201D \xE8 plurale (= they) \u2192 \u201Cwere\u201D!","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"Ero esausto dopo aver costruito quell'enorme ponte.","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"I nostri compagni di classe erano entusiasti dell'ascensore di redstone.","wasn't / weren't & Fragen":"wasn't / weren't e domande","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"Niente \u201Cdid\u201D!","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"Per negare \u201Cwas\u201D e \u201Cwere\u201D o fare domande con loro, NON ti serve \u201Cdid\u201D! Sono abbastanza forti da cavarsela da soli.","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"Soggetto + wasn't / weren't   |   Was / Were + soggetto + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"Per le domande, \u201CWas\u201D o \u201CWere\u201D si sposta semplicemente davanti al soggetto: \u201CYou were online.\u201D \u2192 \u201CWere you online?\u201D","Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C).":"Lo stesso vale per \u201Ccould\u201D: negazione \u201Ccouldn\u2019t\u201D (non \u201Cdidn\u2019t could\u201D) e domanda \u201CCould you\u2026?\u201D (non \u201CDid you could\u2026?\u201D).","Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!":"Mai mescolare \u201Cdid\u201D con \u201Cwas/were\u201D!","Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.":"La negazione di \u201Cbe\u201D \xE8 sempre \u201Cwasn\u2019t\u201D o \u201Cweren\u2019t\u201D.","Hattest du Angst, als das H\xF6hlenger\xE4usch lief?":"Hai avuto paura quando \xE8 partito il suono della grotta?","Der Server war w\xE4hrend der Wartung nicht online.":"Il server non era online durante la manutenzione.","There was / There were":"There was / There were","Es gab (Einzahl & Mehrzahl)":"C'era / c'erano (singolare e plurale)",Beschreiben:"Descrivere","Perfekt, um deine Minecraft-Welt oder ein Erlebnis zu beschreiben: \u201EEs gab eine H\xF6hle\u2026\u201C oder \u201EEs waren drei Zombies da\u2026\u201C.":"Perfetto per descrivere il tuo mondo di Minecraft o un'avventura: \u201CC'era una grotta\u2026\u201D o \u201CC'erano tre zombie\u2026\u201D.","There was + Einzahl (a/an/one)   |   There were + Mehrzahl (two, many, some...)":"There was + singolare (a/an/one)   |   There were + plurale (two, many, some...)","Verneinung: \u201EThere wasn\u2019t any lava.\u201C / \u201EThere weren\u2019t any Creepers.\u201C Frage: \u201EWas there a chest?\u201C / \u201EWere there any villagers?\u201C":"Negazione: \u201CThere wasn\u2019t any lava.\u201D / \u201CThere weren\u2019t any Creepers.\u201D Domanda: \u201CWas there a chest?\u201D / \u201CWere there any villagers?\u201D","Im Deutschen sagt man immer \u201EEs gab\u2026\u201C (egal ob ein Creeper oder zehn). Im Englischen musst du genau auf Einzahl (was) vs. Mehrzahl (were) achten!":"Anche in italiano si distingue \u201Cc'era\u201D e \u201Cc'erano\u201D: in inglese \xE8 uguale, singolare (was) o plurale (were). Fai bene attenzione!","F\xFCnf Zombies = Plural \u2192 \u201EThere were\u201C!":"Cinque zombie = plurale \u2192 \u201CThere were\u201D!","\u201EEs gab\u201C hei\xDFt NIEMALS \u201Eit gave\u201C, sondern immer \u201EThere was / There were\u201C!":"\u201CC'era\u201D non si dice MAI \u201Cit had\u201D, ma sempre \u201CThere was / There were\u201D!","Es gab einen Schmied mit Diamantstiefeln im Dorf.":"C'era un fabbro con stivali di diamante nel villaggio.","Es gab zwanzig Fackeln, die den Tunnel beleuchteten.":"C'erano venti torce che illuminavano il tunnel.","Signalw\xF6rter (yesterday, ago, last...)":"Indicatori di tempo (yesterday, ago, last...)","Die Zeitportal-Marker des Past Simple":"I segnali del portale del tempo del Past Simple","Zeit-Kompass":"Bussola del tempo","Signalw\xF6rter verraten dir in Tests sofort, dass du das Past Simple benutzen musst. Sie zeigen an, dass ein Zeitpunkt komplett in der Vergangenheit liegt.":"Nelle verifiche, gli indicatori di tempo ti dicono subito che devi usare il Past Simple. Mostrano che un momento \xE8 completamente nel passato.","yesterday \xB7 last night/week/year \xB7 [Zeit] + ago \xB7 in 2023 \xB7 when I was...":"yesterday \xB7 last night/week/year \xB7 [tempo] + ago \xB7 in 2023 \xB7 when I was...","Wortstellung im Englischen: Zeitangaben stehen am SATZENDE (oder ganz am Satzanfang) \u2013 niemals zwischen Verb und Objekt!":"Ordine delle parole in inglese: le espressioni di tempo vanno alla FINE della frase (o proprio all'inizio) \u2013 mai tra verbo e oggetto!","\u201Evor zwei Tagen\u201C = \u201Etwo days ago\u201C (ago steht HINTER der Zahl). \u201Eletzte Woche\u201C = \u201Elast week\u201C (OHNE \u201Ethe\u201C!).":"\u201Cdue giorni fa\u201D = \u201Ctwo days ago\u201D (ago va DOPO il numero, come \u201Cfa\u201D). \u201Cla settimana scorsa\u201D = \u201Clast week\u201D (SENZA \u201Cthe\u201D!).","\u201Eago\u201C steht hinter der Zeitspanne und die Zeitangabe am Satzende.":"\u201Cago\u201D va dopo il periodo di tempo e l'espressione di tempo a fine frase.","Im Englischen bleibt immer Subjekt vor Verb (we played)!":"In inglese il soggetto resta sempre prima del verbo (we played)!","Wir haben den Enderdrachen vor zwei Wochen besiegt.":"Abbiamo sconfitto l'Ender Dragon due settimane fa.","Gestern Abend habe ich eine automatische Bambusfarm gebaut.":"Ieri sera ho costruito una fattoria di bamb\xF9 automatica.","Die Perfekt-Falle f\xFCr Deutsche":"La trappola del passato prossimo","Past Simple vs. Present Perfect":"Past Simple vs. Present Perfect","Creeper-Falle #1":"Trappola Creeper n. 1","Im Deutschen erz\xE4hlen wir fast alles im Perfekt: \u201EIch HABE gestern gespielt.\u201C Wenn du das w\xF6rtlich ins Englische \xFCbersetzt (\u201EI have played yesterday\u201C), explodiert der Satz wie ein Creeper!":"In italiano raccontiamo quasi tutto al passato prossimo: \u201CHO giocato ieri.\u201D Se lo traduci parola per parola in inglese (\u201CI have played yesterday\u201D), la frase esplode come un Creeper!","Fester Zeitpunkt in der Vergangenheit (yesterday, last, ago, When...?) \u2192 IMMER Past Simple!":"Momento preciso nel passato (yesterday, last, ago, When...?) \u2192 SEMPRE Past Simple!","Das Present Perfect (\u201EI have played\u201C) nutzt man im Englischen nur ohne festen Vergangenheitszeitpunkt (z. B. Erfahrungen im Leben: \u201EHave you ever played Minecraft?\u201C).":"In inglese il Present Perfect (\u201CI have played\u201D) si usa solo senza un momento preciso nel passato (per es. esperienze di vita: \u201CHave you ever played Minecraft?\u201D).","Faustregel f\xFCr die Schule: Siehst du yesterday, last\u2026, \u2026ago, in 2022 oder When\u2026? \u2192 Finger weg von have/has! Nimm Past Simple!":"Regola pratica per la scuola: se vedi yesterday, last\u2026, \u2026ago, in 2022 o When\u2026? \u2192 gi\xF9 le mani da have/has! Usa il Past Simple!","\u201Eyesterday\u201C + Present Perfect ist im Englischen immer falsch!":"\u201Cyesterday\u201D + Present Perfect \xE8 sempre sbagliato in inglese!","\u201EWhen\u2026?\u201C fragt nach einem genauen Zeitpunkt \u2192 Past Simple!":"\u201CWhen\u2026?\u201D chiede un momento preciso \u2192 Past Simple!","Ich habe letzten Sonntag meine Oma besucht.":"Domenica scorsa sono andato a trovare mia nonna.","Wir haben vor zehn Minuten ein cooles Minecraft-Tutorial geschaut.":"Dieci minuti fa abbiamo guardato un bellissimo tutorial di Minecraft.",sein:"essere",bauen:"costruire",graben:"scavare",finden:"trovare",gehen:"andare",k\u00E4mpfen:"combattere","machen / herstellen":"fare / fabbricare",sehen:"vedere",bekommen:"ottenere / ricevere",haben:"avere",nehmen:"prendere",geben:"dare","zerbrechen / abbauen":"rompere / scavare",fallen:"cadere",kaufen:"comprare",fangen:"prendere / pescare",schwimmen:"nuotare",rennen:"correre",essen:"mangiare",trinken:"bere",schreiben:"scrivere",lesen:"leggere",verlieren:"perdere",gewinnen:"vincere",kommen:"venire","tun / machen":"fare","wissen / kennen":"sapere / conoscere",denken:"pensare",h\u00F6ren:"sentire","verlassen / zur\xFCcklassen":"partire / lasciare","Holz-Spitzhacke":"Piccone di legno","Guter Start im Overworld! Schau kurz in den Craft  \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"\u300Cvisit\u300D\u3084\u300Copen\u300D\u306E\u3088\u3046\u306A2\u97F3\u7BC0\u306E\u52D5\u8A5E\u306B\u6CE8\u610F\uFF1A\u7B2C1\u97F3\u7BC0\u306B\u30A2\u30AF\u30BB\u30F3\u30C8\u304C\u3042\u308B\u306E\u3067\u3001\u6700\u5F8C\u306E\u6587\u5B57\u306F\u91CD\u306D\u306A\u3044\uFF08visited, opened\uFF09\u3002","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"\u5B50\u97F3 + y \u306F -ied \u306B\uFF1B\u77ED\u3044\u300Cdrop\u300D\u306F p \u3092\u91CD\u306D\u308B\uFF01","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"y \u306E\u524D\u304C\u6BCD\u97F3\uFF08a\uFF09\u2192 y \u306F\u305D\u306E\u307E\u307E\uFF01","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"\u30DE\u30C3\u30AF\u30B9\u306F\u82F1\u5358\u8A9E\u3092\u52C9\u5F37\u3057\u3066\u3001\u305D\u308C\u304B\u3089 Minecraft \u3092\u3057\u305F\u3002","Das Skelett blieb direkt vor unserer Mauer stehen.":"\u30B9\u30B1\u30EB\u30C8\u30F3\u306F\u3046\u3061\u306E\u58C1\u306E\u771F\u3093\u524D\u3067\u6B62\u307E\u3063\u305F\u3002","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"\u91D1\u5E8A\u306E\u77E5\u8B58","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"\u82F1\u8A9E\u3067\u3044\u3061\u3070\u3093\u3088\u304F\u4F7F\u3046\u52D5\u8A5E\u306E\u591A\u304F\uFF08\u884C\u304F\u3001\u5EFA\u3066\u308B\u3001\u898B\u3064\u3051\u308B\u3001\u6226\u3046\u3001\u898B\u308B\uFF09\u306F\u300C-ed\u300D\u30EB\u30FC\u30EB\u306B\u5F93\u3044\u307E\u305B\u3093\u3002\u72EC\u81EA\u306E\u904E\u53BB\u5F62\u304C\u3042\u308A\u3001\u899A\u3048\u308B\u3057\u304B\u3042\u308A\u307E\u305B\u3093\u3002","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"\u4E3B\u8A9E + \u52D5\u8A5E\u306E\u904E\u53BB\u5F62\uFF08Past Simple\uFF09\u3000\u2014 \u4F8B\uFF1Ago \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"\u5927\u4E8B\uFF1A\u904E\u53BB\u5F62\u3092\u4F7F\u3046\u306E\u306F\u80AF\u5B9A\u6587\u3060\u3051\uFF01\u300Cdid\u300D\u3084\u300Cdidn\u2019t\u300D\u304C\u51FA\u3066\u304D\u305F\u3089\u3001\u52D5\u8A5E\u306F\u539F\u5F62\u306B\u623B\u308A\u307E\u3059\u3002","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"\u904E\u53BB\u5F62\uFF08broke, saw, went\uFF09\u3068\u904E\u53BB\u5206\u8A5E\uFF08broken, seen, gone\uFF09\u3092\u6DF7\u540C\u3057\u306A\u3044\u3067\u3002\u904E\u53BB\u5206\u8A5E\u306F\u73FE\u5728\u5B8C\u4E86\u3084\u53D7\u3051\u8EAB\u306E\u3068\u304D\u306B\u4F7F\u3044\u307E\u3059\u3002","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"\u4E0D\u898F\u5247\u52D5\u8A5E\u306B\u300C-ed\u300D\u306F\u7D76\u5BFE\u306B\u4ED8\u3051\u306A\u3044\uFF01","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\u300Cseen\u300D\u306F\u904E\u53BB\u5206\u8A5E\u2015\u2015\u904E\u53BB\u5F62\u306F\u3044\u3064\u3082\u300Csaw\u300D\uFF01","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"\u9AD8\u3055 -58 \u307E\u3067\u6398\u3063\u3066\u3001\u30C0\u30A4\u30E4\u30928\u500B\u898B\u3064\u3051\u305F\u3002","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"\u30EC\u30AA\u306F\u30A8\u30F3\u30C0\u30FC\u30C9\u30E9\u30B4\u30F3\u3068\u6226\u3063\u3066\u30B2\u30FC\u30E0\u306B\u52DD\u3063\u305F\u3002","Verneinung mit didn't":"didn't \u3067\u5426\u5B9A","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"\u3044\u3061\u3070\u3093\u5927\u4E8B\u306A\u30EB\u30FC\u30EB\uFF01","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"\u904E\u53BB\u306B\u4F55\u304B\u304C\u8D77\u304D\u306A\u304B\u3063\u305F\u3068\u8A00\u3044\u305F\u3044\u3068\u304D\u3001\u3075\u3064\u3046\u306E\u52D5\u8A5E\uFF08be \u3068 could \u4EE5\u5916\uFF09\u306B\u306F\u3059\u3079\u3066\u52A9\u52D5\u8A5E\u300Cdidn\u2019t\u300D\uFF08= did not\uFF09\u304C\u5FC5\u8981\u3067\u3059\u3002","Subjekt + didn't + Grundform (1. Form des Verbs)":"\u4E3B\u8A9E + didn't + \u539F\u5F62\uFF08\u52D5\u8A5E\u306E\u7B2C1\u5F62\uFF09","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"\u899A\u3048\u65B9\uFF1A\u300Cdid \u306F\u3082\u3046\u904E\u53BB\u3092\u30A4\u30F3\u30D9\u30F3\u30C8\u30EA\u306B\u6301\u3063\u3066\u3044\u308B\uFF01\u300D\u3060\u304B\u3089\u5F8C\u308D\u306E\u52D5\u8A5E\u306F\u3044\u3064\u3082\u539F\u5F62\uFF08-ed \u3082\u904E\u53BB\u5F62\u3082\u306A\u3057\uFF09\u3002","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"\u898F\u5247\u52D5\u8A5E\u3082\u4E0D\u898F\u5247\u52D5\u8A5E\u3082\u540C\u3058\uFF1A\u300Cdidn\u2019t play\u300D\u300Cdidn\u2019t go\u300D\u300Cdidn\u2019t build\u300D\u3002\u4F8B\u5916\u306F was/were\uFF08\u2192 wasn\u2019t/weren\u2019t\uFF09\u3068 could\uFF08\u2192 couldn\u2019t\uFF09\u3060\u3051\u3002","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"\u30C6\u30B9\u30C8\u3067\u3044\u3061\u3070\u3093\u591A\u3044\u30DF\u30B9\uFF1A\u300Cdidn\u2019t\u300D\u306E\u5F8C\u306B\u904E\u53BB\u5F62\u306F\u7D76\u5BFE\u30C0\u30E1\uFF01","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"\u82F1\u8A9E\u3067\u306F\u300Cnot\u300D\u3060\u3051\u3092\u52D5\u8A5E\u306E\u524D\u306B\u7F6E\u304F\u3053\u3068\u306F\u3067\u304D\u306A\u3044\u3002","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"\u30A8\u30F3\u30C0\u30FC\u30C1\u30A7\u30B9\u30C8\u306B\u3057\u307E\u3063\u3066\u3044\u305F\u306E\u3067\u3001\u5263\u306F\u306A\u304F\u3055\u306A\u304B\u3063\u305F\u3002","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"\u65E5\u304C\u6C88\u3080\u524D\u306B\u5C4B\u6839\u3092\u5B8C\u6210\u3067\u304D\u306A\u304B\u3063\u305F\u3002","Entscheidungsfragen (Did you...?)":"Yes/No \u7591\u554F\u6587\uFF08Did you...?\uFF09","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"Yes/No \u7591\u554F\u6587","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"\u904E\u53BB\u306B\u3064\u3044\u3066\u306E Yes/No \u306E\u8CEA\u554F\uFF08\u300C\u301C\u3092\u898B\u3064\u3051\u305F\uFF1F\u300D\u300C\u301C\u3092\u5EFA\u3066\u305F\uFF1F\u300D\uFF09\u306F\u3001\u6587\u306E\u3044\u3061\u3070\u3093\u521D\u3081\u306B\u300CDid\u300D\u3092\u7F6E\u304F\u3060\u3051\u3002","Did + Subjekt + Grundform (1. Form) + ...?":"Did + \u4E3B\u8A9E + \u539F\u5F62\uFF08\u7B2C1\u5F62\uFF09+ ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"\u3053\u3053\u3067\u3082\u300CDid\u300D\u304C\u52D5\u8A5E\u304B\u3089\u904E\u53BB\u306E\u8A9E\u5C3E\u3092\u3046\u3070\u3046\uFF01\u3060\u304B\u3089\u300CDid you mine?\u300D\uFF08\u300CDid you mined?\u300D\u3067\u306F\u306A\u3044\uFF09\u3002","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"\u300CHave you played yesterday?\u300D\u3068\u805E\u304F\u5B66\u7FD2\u8005\u306F\u591A\u3044\u3051\u3069\u3001\u7D42\u308F\u3063\u305F\u904E\u53BB\u306A\u3089\u82F1\u8A9E\u306F\u300CDid you play yesterday?\u300D\uFF01","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"\u300CDid\u300D\u306E\u5F8C\u306F\u3044\u3064\u3082\u539F\u5F62\u300Cfind\u300D\uFF01","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"\u82F1\u8A9E\u3067\u306F\u52D5\u8A5E\u3092\u305D\u306E\u307E\u307E\u524D\u306B\u51FA\u3059\u3053\u3068\u306F\u3067\u304D\u306A\u3044\u2015\u2015\u300CDid\u300D\u304C\u5FC5\u8981\u3002","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"\u6D1E\u7A9F\u7528\u306E\u305F\u3044\u307E\u3064\u3001\u5341\u5206\u306B\u6301\u3063\u3066\u304D\u305F\uFF1F","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"\u30C8\u30E0\u306F Discord \u306E\u524D\u306B\u6570\u5B66\u306E\u5BBF\u984C\u3092\u7D42\u308F\u3089\u305B\u305F\uFF1F","W-Fragen (What / Where / Why did...?)":"Wh \u7591\u554F\u6587\uFF08What / Where / Why did...?\uFF09","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"Wh \u7591\u554F\u6587","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"\u3082\u3063\u3068\u8A73\u3057\u3044\u60C5\u5831\uFF08\u4F55\uFF1F\u3069\u3053\uFF1F\u3044\u3064\uFF1F\u306A\u305C\uFF1F\u3069\u3046\u3084\u3063\u3066\uFF1F\uFF09\u3092\u77E5\u308A\u305F\u3044\u3068\u304D\u306F\u3001\u82F1\u8A9E\u306E\u7591\u554F\u8A5E\u3092\u300Cdid\u300D\u306E\u76F4\u524D\u306B\u7F6E\u304F\u3060\u3051\u3002","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"\u7591\u554F\u8A5E\uFF08What/Where/When/Why/How\uFF09+ did + \u4E3B\u8A9E + \u539F\u5F62\uFF1F","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"\u300CWho\u300D\u304C\u4E3B\u8A9E\u306E\u8CEA\u554F\uFF08\u300C\u8AB0\u304C\u305D\u308C\u3092\u5EFA\u3066\u305F\u306E\uFF1F\u300D\uFF09\u306B\u6CE8\u610F\uFF1A\u300Cdid\u300D\u306F\u306A\u304F\u306A\u308B \u2192\u300CWho built this castle?\u300D\uFF08\u904E\u53BB\u5F62\uFF01\uFF09\u3002","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"\u82F1\u8A9E\u3067\u300CWhen\u2026?\u300D\u306E\u8CEA\u554F\u306F\u307B\u3068\u3093\u3069\u3044\u3064\u3082\u904E\u53BB\u5F62\uFF08\u300CWhen did you start?\u300D\uFF09\u3002\u6C7A\u307E\u3063\u305F\u6642\u70B9\u3092\u805E\u3044\u3066\u3044\u308B\u304B\u3089\u3002","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"\u300Cdid\u300D\u306E\u5F8C\u306F\u539F\u5F62\u300Cgo\u300D\uFF01","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"\u52A9\u52D5\u8A5E\u300Cdid\u300D\u3092\u5FD8\u308C\u306A\u3044\u3067\uFF01","Wo hast du die Diamanttruhe versteckt?":"\u30C0\u30A4\u30E4\u306E\u30C1\u30A7\u30B9\u30C8\u3092\u3069\u3053\u306B\u96A0\u3057\u305F\u306E\uFF1F","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"\u3069\u3046\u3057\u3066\u30AF\u30EA\u30FC\u30D1\u30FC\u306F\u3046\u3061\u306E\u7551\u306E\u8FD1\u304F\u3067\u7206\u767A\u3057\u305F\u306E\uFF1F","Kurzantworten (Yes, I did)":"\u77ED\u3044\u7B54\u3048\uFF08Yes, I did\uFF09","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"\u3066\u3044\u306D\u3044\u3067\u6B63\u3057\u304F","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"\u82F1\u8A9E\u3067\u306F\u300CYes.\u300D\u3084\u300CNo.\u300D\u3060\u3051\u3060\u3068\u3001\u305D\u3063\u3051\u306A\u304F\u5931\u793C\u306B\u805E\u3053\u3048\u308B\u3053\u3068\u304C\u3088\u304F\u3042\u308A\u307E\u3059\u3002\u3060\u304B\u3089 Yes/No \u7591\u554F\u6587\u306B\u306F\u4EE3\u540D\u8A5E + \u52A9\u52D5\u8A5E\u3092\u4ED8\u3051\u3066\u7B54\u3048\u307E\u3059\u3002","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + \u4EE3\u540D\u8A5E + did.  |  No, + \u4EE3\u540D\u8A5E + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"\u300CWas/Were\u2026?\u300D\u306E\u8CEA\u554F\u306B\u306F\u3001\u3082\u3061\u308D\u3093 was/were \u3067\u7B54\u3048\u307E\u3059\uFF08\u300CYes, I was.\u300D/\u300CNo, they weren\u2019t.\u300D\uFF09\u3002did \u3067\u306F\u306A\u3044\uFF01","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"\u77ED\u3044\u7B54\u3048\u3067\u306F\u52D5\u8A5E\u3092\u7D76\u5BFE\u306B\u304F\u308A\u8FD4\u3055\u306A\u3044\uFF08\u300CYes, I did played\u300D\u306F\u30C0\u30E1\uFF09\u3002","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"\u77ED\u304F\u3001\u304D\u3063\u3071\u308A\u3001\u5B8C\u307A\u304D\uFF1A\u300CYes, I did.\u300D\u3060\u3051\u3002","Das Hilfsverb in der Antwort passt immer zur Frage!":"\u7B54\u3048\u306E\u52A9\u52D5\u8A5E\u306F\u3044\u3064\u3082\u8CEA\u554F\u3068\u540C\u3058\uFF01","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\u300C\u30A8\u30F3\u30C0\u30FC\u30C9\u30E9\u30B4\u30F3\u3092\u5012\u3057\u305F\uFF1F\u300D\u2015\u2015\u300C\u3046\u3093\u3001\u5012\u3057\u305F\u3088\uFF01\u300D","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\u300C\u30DF\u30A2\u306F\u99AC\u3092\u306A\u304F\u3057\u305F\u306E\uFF1F\u300D\u2015\u2015\u300C\u3046\u3046\u3093\u3001\u306A\u304F\u3057\u3066\u306A\u3044\u3088\u3002\u300D","was & were (Aussage)":"was \u3068 were\uFF08\u80AF\u5B9A\u6587\uFF09","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"\u52D5\u8A5E\u300Cto be\u300D","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\u300Cwas\u300D\u3068\u300Cwere\u300D\u306F\u300Cbe\u300D\u306E\u904E\u53BB\u5F62\uFF08\u301C\u3060\u3063\u305F\uFF0F\u301C\u306B\u3044\u305F\uFF09\u3002\u904E\u53BB\u306E\u72B6\u614B\u30FB\u6C17\u6301\u3061\u30FB\u5834\u6240\u30FB\u6027\u8CEA\u3092\u8868\u3057\u307E\u3059\u3002","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"\u300Cyou\u300D\u306B\u6CE8\u610F\uFF1A\u53CB\u3060\u30611\u4EBA\u306B\u8A71\u3057\u304B\u3051\u308B\u3068\u304D\u3067\u3082\u3001\u82F1\u8A9E\u306F\u3044\u3064\u3082\u300Cyou were\u300D\uFF08\u300Cyou was\u300D\u306F\u7D76\u5BFE\u30C0\u30E1\uFF01\uFF09\u3002","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\u300Ccould\u300D\uFF08\u3067\u304D\u305F\uFF09\u3082 was/were \u3068\u540C\u3058\u304F\u5F37\u3044\u52D5\u8A5E\uFF1A\u300Cdid\u300D\u306F\u3044\u3089\u306A\u3044\u3002","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"\u6A19\u6E96\u82F1\u8A9E\u3067\u306F\u300Cyou\u300D\u306B\u306F\u3044\u3064\u3082\u300Cwere\u300D\u3002","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\u300CMy friends\u300D\u306F\u8907\u6570\uFF08= they\uFF09\u2192\u300Cwere\u300D\uFF01","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"\u3042\u306E\u5DE8\u5927\u306A\u6A4B\u3092\u5EFA\u3066\u305F\u3042\u3068\u3001\u304F\u305F\u304F\u305F\u3060\u3063\u305F\u3002","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"\u30AF\u30E9\u30B9\u30E1\u30FC\u30C8\u306F\u30EC\u30C3\u30C9\u30B9\u30C8\u30FC\u30F3\u306E\u30A8\u30EC\u30D9\u30FC\u30BF\u30FC\u306B\u5927\u8208\u596E\u3060\u3063\u305F\u3002","wasn't / weren't & Fragen":"wasn't / weren't \u3068\u7591\u554F\u6587","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"\u300Cdid\u300D\u306F\u3044\u3089\u306A\u3044\uFF01","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"\u300Cwas\u300D\u3068\u300Cwere\u300D\u3092\u5426\u5B9A\u3057\u305F\u308A\u7591\u554F\u6587\u306B\u3057\u305F\u308A\u3059\u308B\u306E\u306B\u3001\u300Cdid\u300D\u306F\u3044\u3089\u306A\u3044\uFF01\u81EA\u5206\u3060\u3051\u3067\u3067\u304D\u308B\u307B\u3069\u5F37\u3044\u52D5\u8A5E\u3067\u3059\u3002","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"\u4E3B\u8A9E + wasn't / weren't   |   Was / Were + \u4E3B\u8A9E + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"\u7591\u554F\u6587\u3067\u306F\u300CWas\u300D\u304B\u300CWere\u300D\u3092\u4E3B\u8A9E\u306E\u524D\u306B\u51FA\u3059\u3060\u3051\uFF1A\u300CYou were online.\u300D\u2192\u300CWere you online?\u300D","Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C).":"\u300Ccould\u300D\u3082\u540C\u3058\uFF1A\u5426\u5B9A\u306F\u300Ccouldn\u2019t\u300D\uFF08\u300Cdidn\u2019t could\u300D\u3067\u306F\u306A\u3044\uFF09\u3001\u7591\u554F\u306F\u300CCould you\u2026?\u300D\uFF08\u300CDid you could\u2026?\u300D\u3067\u306F\u306A\u3044\uFF09\u3002","Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!":"\u300Cdid\u300D\u3068\u300Cwas/were\u300D\u3092\u7D76\u5BFE\u306B\u6DF7\u305C\u306A\u3044\uFF01","Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.":"\u300Cbe\u300D\u306E\u5426\u5B9A\u306F\u3044\u3064\u3082\u300Cwasn\u2019t\u300D\u304B\u300Cweren\u2019t\u300D\u3002","Hattest du Angst, als das H\xF6hlenger\xE4usch lief?":"\u6D1E\u7A9F\u306E\u97F3\u304C\u9CF4\u3063\u305F\u3068\u304D\u3001\u3053\u308F\u304B\u3063\u305F\uFF1F","Der Server war w\xE4hrend der Wartung nicht online.":"\u30E1\u30F3\u30C6\u30CA\u30F3\u30B9\u4E2D\u3001\u30B5\u30FC\u30D0\u30FC\u306F\u30AA\u30F3\u30E9\u30A4\u30F3\u3067\u306F\u306A\u304B\u3063\u305F\u3002","There was / There were":"There was / There were","Es gab (Einzahl & Mehrzahl)":"\u301C\u304C\u3042\u3063\u305F\u30FB\u3044\u305F\uFF08\u5358\u6570\u3068\u8907\u6570\uFF09",Beschreiben:"\u63CF\u5199","Perfekt, um deine Minecraft-Welt oder ein Erlebnis zu beschreiben: \u201EEs gab eine H\xF6hle\u2026\u201C oder \u201EEs waren drei Zombies da\u2026\u201C.":"Minecraft \u306E\u30EF\u30FC\u30EB\u30C9\u3084\u5192\u967A\u3092\u8AAC\u660E\u3059\u308B\u306E\u306B\u3074\u3063\u305F\u308A\uFF1A\u300C\u6D1E\u7A9F\u304C\u3042\u3063\u305F\u2026\u300D\u3084\u300C\u30BE\u30F3\u30D3\u304C3\u4F53\u3044\u305F\u2026\u300D\u3002","There was + Einzahl (a/an/one)   |   There were + Mehrzahl (two, many, some...)":"There was + \u5358\u6570\uFF08a/an/one\uFF09   |   There were + \u8907\u6570\uFF08two, many, some...\uFF09","Verneinung: \u201EThere wasn\u2019t any lava.\u201C / \u201EThere weren\u2019t any Creepers.\u201C Frage: \u201EWas there a chest?\u201C / \u201EWere there any villagers?\u201C":"\u5426\u5B9A\uFF1A\u300CThere wasn\u2019t 1C-ed\u201D \u2192 crafted.","Ich versuchte, \xFCber den Lavafluss zu springen, und schaffte es gerade so! (try)":"Tentei saltar por cima do rio de lava e consegui por um triz! (try)","Rechtschreib-Regel: Endet ein Verb auf Konsonant + y (try), wird das \u201Ey\u201C zu \u201Eied\u201C \u2192 tried.":"Regra de ortografia: se um verbo termina em consoante + y (try), o \u201Cy\u201D passa a \u201Cied\u201D \u2192 tried.","Pl\xF6tzlich blieb der laute Zombie direkt vor unserer Eichent\xFCr stehen. (stop)":"De repente, o zombie barulhento parou mesmo em frente \xE0 nossa porta de carvalho. (stop)","Bei kurzen Verben mit kurzem Vokal + einfachem Konsonanten am Ende (stop) wird der letzte Konsonant verdoppelt \u2192 stopped.":"Nos verbos curtos com vogal curta + uma s\xF3 consoante final (stop), a \xFAltima consoante dobra \u2192 stopped.","Letzten Samstag spielten mein bester Freund und ich zwei Stunden lang BedWars. (play)":"No s\xE1bado passado, eu e o meu melhor amigo jog\xE1mos BedWars durante duas horas. (play)","Achtung! Steht vor dem \u201Ey\u201C ein Vokal (a, e, o, u wie in \u201Eplay\u201C), bleibt das \u201Ey\u201C einfach stehen \u2192 played (NICHT plaied!).":"Aten\xE7\xE3o! Se antes do \u201Cy\u201D houver uma vogal (a, e, o, u, como em \u201Cplay\u201D), o \u201Cy\u201D fica \u2192 played (N\xC3O plaied!).","Ups! Ich lie\xDF mein verzaubertes Diamantschwert versehentlich in den Kaktus fallen! (drop)":"Ups! Deixei cair sem querer a minha espada de diamante encantada no cato! (drop)","\u201EDrop\u201C ist kurz und endet auf Vokal + Konsonant (o + p) \u2192 das \u201Ep\u201C wird verdoppelt: dropped.":"\u201CDrop\u201D \xE9 curto e termina em vogal + consoante (o + p) \u2192 o \u201Cp\u201D dobra: dropped.","Vor dem Zocken am Freitag lernte Max 30 Minuten lang seine Englischvokabeln. (study)":"Antes de jogar na sexta, o Max estudou o vocabul\xE1rio de ingl\xEAs durante 30 minutos. (study)","Bei \u201Estudy\u201C steht ein Konsonant (d) vor dem \u201Ey\u201C \  auf der ersten Silbe betont (kein Doppel-t \u2192 visited) und bei \u201Estay\u201C steht ein Vokal vor dem \u201Ey\u201C (\u2192 stayed).":"\u201CVisit\u201D tem o acento na primeira s\xEDlaba (sem t dobrado \u2192 visited) e em \u201Cstay\u201D h\xE1 uma vogal antes do \u201Cy\u201D (\u2192 stayed).","Letztes Wochenende bauten meine Freunde und ich einen unterirdischen Redstone-Bunker. (build)":"No fim de semana passado, eu e os meus amigos constru\xEDmos um bunker subterr\xE2neo de redstone. (build)","\u201EBuild\u201C ist unregelm\xE4\xDFig: build \u2013 built \u2013 built. Niemals \u201Ebuilded\u201C!":"\u201CBuild\u201D \xE9 irregular: build \u2013 built \u2013 built. Nunca \u201Cbuilded\u201D!","Tim grub eine Treppe ganz hinunter bis H\xF6he -58, um Diamanten zu suchen. (dig)":"O Tim escavou uma escada at\xE9 ao n\xEDvel -58 para procurar diamantes. (dig)","Die 2. Form von \u201Edig\u201C (graben) ist \u201Edug\u201C (dig \u2013 dug \u2013 dug).":"A 2.\xAA forma de \u201Cdig\u201D (escavar) \xE9 \u201Cdug\u201D (dig \u2013 dug \u2013 dug).","Rate mal! Ich fand eine Truhe mit zwei verzauberten goldenen \xC4pfeln! (find)":"Adivinha! Encontrei um ba\xFA com duas ma\xE7\xE3s douradas encantadas! (find)","\u201EFind\u201C wird im Past Simple zu \u201Efound\u201C (find \u2013 found \u2013 found). \u201EFounded\u201C bedeutet \u201Egr\xFCndete\u201C (z. B. eine Firma).":"\u201CFind\u201D no Past Simple fica \u201Cfound\u201D (find \u2013 found \u2013 found). \u201CFounded\u201D significa \u201Cfundou\u201D (por exemplo, uma empresa).","Wir gingen durch das lila Portal und landeten direkt neben einer Bastion. (go)":"Atravess\xE1mos o portal roxo e aterr\xE1mos mesmo ao lado de um basti\xE3o. (go)","Eines der wichtigsten unregelm\xE4\xDFigen Verben: go \u2013 went \u2013 gone. Im Past Simple immer \u201Ewent\u201C!":"Um dos verbos irregulares mais importantes: go \u2013 went \u2013 gone. No Past Simple \xE9 sempre \u201Cwent\u201D!","Zusammen bek\xE4mpfte unser Squad
