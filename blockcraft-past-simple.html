 winned the Minecraft tournament in the evening.","Ben wrote a great English test and won the Minecraft tournament in the evening."],correctIndex:3,explanation:l("write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!")},{id:21,type:"fill",category:"neg_quest",prompt:"I _____ into the Deep Dark cave because I didn\u2019t have any wool blocks.",germanHint:l("Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)"),options:["didn't went","didn't go","wasn't go","don't went"],correctIndex:1,explanation:l("Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!).")},{id:22,type:"fill",category:"neg_quest",prompt:"_____ you _____ any Netherite scraps during your mining trip yesterday?",germanHint:l("Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)"),options:["Did / found","Were / find","Did / find","Do / found"],correctIndex:2,explanation:l("Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?")},{id:23,type:"fill",category:"neg_quest",prompt:"What _____ Steve _____ with all that Redstone dust?",germanHint:l("Was hat Steve mit all dem Redstone-Staub gebaut? (build)"),options:["did / built","did / build","was / build","does / built"],correctIndex:1,explanation:l("Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?")},{id:24,type:"fill",category:"neg_quest",prompt:"\u201CDid your brother defeat the Wither alone?\u201D \u2014 \u201CNo, he _____.\u201D",germanHint:l("Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C"),options:["wasn't","didn't","don't","didn't defeated"],correctIndex:1,explanation:l("Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C.")},{id:25,type:"fill",category:"neg_quest",prompt:"Why _____ Lukas _____ a water bucket before jumping off the tower?",germanHint:l("Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)"),options:["didn't / took","wasn't / take","didn't / take","don't / take"],correctIndex:2,explanation:l("Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?")},{id:26,type:"fill",category:"neg_quest",prompt:"The Creeper _____ our house because my wolf scared it away\u2014wait, cats scare Creepers!",germanHint:l("Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)"),options:["didn't destroyed","not destroyed","didn't destroy","wasn't destroy"],correctIndex:2,explanation:l("F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy.")},{id:27,type:"fill",category:"neg_quest",prompt:"\u201CDid you and Mia finish your biology poster before gaming?\u201D \u2014 \u201CYes, we _____!\u201D",germanHint:l("Kurzantwort: \u201EJa, das haben wir!\u201C"),options:["did","were","finished","do"],correctIndex:0,explanation:l("Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen).")},{id:28,type:"four_sentences",category:"neg_quest",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)"),germanHint:l("Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen."),options:["I didn't forgot my homework last night.","I not forgot my homework last night.","I didn't forget my homework last night.","I wasn't forget my homework last night."],correctIndex:2,explanation:l("Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!")},{id:29,type:"four_sentences",category:"neg_quest",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)"),germanHint:l("Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?"),options:["Where did you downloaded that cool Minecraft map yesterday?","Where you downloaded that cool Minecraft map yesterday?","Where did you download that cool Minecraft map yesterday?","Where were you download that cool Minecraft map yesterday?"],correctIndex:2,explanation:l("Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!")},{id:30,type:"four_sentences",category:"neg_quest",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)"),germanHint:l("Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab."),options:["We didn't saw any diamonds, so we mined iron instead.","We didn't see any diamonds, so we mined iron instead.","We didn't seen any diamonds, so we mined iron instead.","We don't saw any diamonds, so we mined iron instead."],correctIndex:1,explanation:l("Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).")},{id:31,type:"fill",category:"was_were",prompt:"I _____ super nervous when I heard the Warden\u2019s heartbeat in the dark.",germanHint:l("Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)"),options:["were","was","did be","am"],correctIndex:1,explanation:l("Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.")},{id:32,type:"fill",category:"was_were",prompt:"My friends and I _____ at the top of the mountain base when the storm started.",germanHint:l("Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)"),options:["was","were","did","are"],correctIndex:1,explanation:l("\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!")},{id:33,type:"fill",category:"was_were",prompt:"_____ you online on our school SMP server last night?",germanHint:l("Warst du gestern Abend auf unserem Schul-SMP-Server online?"),options:["Did","Was","Were","Are"],correctIndex:2,explanation:l("Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!")},{id:34,type:"fill",category:"was_were",prompt:"Look at that screenshot! There _____ three baby pandas in the bamboo jungle.",germanHint:l("Es gab drei Baby-Pandas im Bambusdschungel. (There be)"),options:["was","were","had","did"],correctIndex:1,explanation:l("\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.")},{id:35,type:"fill",category:"was_were",prompt:"The maths test _____ as hard as I feared, so I finished ten minutes early.",germanHint:l("Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)"),options:["didn't be","weren't","wasn't","not was"],correctIndex:2,explanation:l("\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).")},{id:36,type:"fill",category:"was_were",prompt:"Because of the Elytra wings, I _____ glide all the way across the huge ocean.",germanHint:l("Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)"),options:["can","could","did can","was can"],correctIndex:1,explanation:l("Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.")},{id:37,type:"fill",category:"was_were",prompt:"There _____ a hidden trapdoor right under the carpet in the woodland mansion!",germanHint:l("Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!"),options:["were","was","did","are"],correctIndex:1,explanation:l("\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.")},{id:38,type:"four_sentences",category:"was_were",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)"),germanHint:l("Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?"),options:["Did you were tired after the long boss fight?","Was you tired after the long boss fight?","Were you tired after the long boss fight?","Did you be tired after the long boss fight?"],correctIndex:2,explanation:l("\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?")},{id:39,type:"four_sentences",category:"was_were",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)"),germanHint:l("Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war."),options:["The villagers didn't be in their houses because it was still daytime.","The villagers wasn't in their houses because it was still daytime.","The villagers weren't in their houses because it was still daytime.","The villagers not were in their houses because it was still daytime."],correctIndex:2,explanation:l("\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.")},{id:40,type:"four_sentences",category:"was_were",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)"),germanHint:l("Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte."),options:["I didn't could light the portal last night because I had no flint.","I couldn't lit the portal last night because I had no flint.","I couldn't light the portal last night because I had no flint.","I wasn't could light the portal last night because I had no flint."],correctIndex:2,explanation:l("\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).")},{id:41,type:"fill",category:"traps",prompt:"I _____ a massive treehouse on our server yesterday.",germanHint:l("Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!"),options:["have built","built","am building","have build"],correctIndex:1,explanation:l("Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!")},{id:42,type:"fill",category:"traps",prompt:"Our class started this Minecraft world three months _____.",germanHint:l("Unsere Klasse startete diese Minecraft-Welt vor drei Monaten."),options:["before","since","ago","last"],correctIndex:2,explanation:l("\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).")},{id:43,type:"fill",category:"traps",prompt:"We _____ our first Nether fortress last night after dinner.",germanHint:l("Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)"),options:["have found","found","did found","finding"],correctIndex:1,explanation:l("\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.")},{id:44,type:"fill",category:"traps",prompt:"When I _____ ten years old, I built my very first dirt house.",germanHint:l("Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus."),options:["have been","was","were","am"],correctIndex:1,explanation:l("\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).")},{id:45,type:"fill",category:"traps",prompt:"Mojang _____ the Trial Chambers update in 2024.",germanHint:l("Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)"),options:["has released","released","was release","releasing"],correctIndex:1,explanation:l("Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).")},{id:46,type:"fill",category:"traps",prompt:"_____ week, our English teacher gave us a super fun gaming quiz.",germanHint:l("Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz."),options:["Ago","Last","Yesterday","Before"],correctIndex:1,explanation:l("\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).")},{id:47,type:"fill",category:"traps",prompt:"\u201CWhen _____ you _____ playing Minecraft?\u201D \u2014 \u201CTwo years ago!\u201D",germanHint:l("Wann hast du angefangen, Minecraft zu spielen? (start)"),options:["have / started","did / start","did / started","were / start"],correctIndex:1,explanation:l("Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!")},{id:48,type:"four_sentences",category:"traps",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)"),germanHint:l("Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt."),options:["I have played Minecraft for two hours yesterday.","I played Minecraft for two hours yesterday.","I did played Minecraft for two hours yesterday.","Yesterday have I played Minecraft for two hours."],correctIndex:1,explanation:l("Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.")},{id:49,type:"four_sentences",category:"traps",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)"),germanHint:l("Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen."),options:["My friend has seen a rare pink sheep ago two days.","My friend saw a rare pink sheep two days before.","My friend saw a rare pink sheep two days ago.","My friend saw ago two days a rare pink sheep."],correctIndex:2,explanation:l("Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).")},{id:50,type:"four_sentences",category:"traps",prompt:l("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)"),germanHint:l("Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut."),options:["We built last night in Survival mode a new base.","We have built a new base in Survival mode last night.","We built a new base in Survival mode last night.","Last night built we a new base in Survival mode."],correctIndex:2,explanation:l("Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!")}],Jo=[{id:"reg-ed",category:"regular",title:l("Regelm\xE4\xDFige Verben (-ed)"),subtitle:l("mine \u2192 mined \xB7 craft \u2192 crafted"),badge:l("Basis-Rezept"),whenToUseDE:l("Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an."),formula:l("Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)"),formulaNoteDE:l("Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form."),signalsDiffDE:l("Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived)."),mistakesDE:[{wrong:"He playeds Minecraft yesterday.",right:"He played Minecraft yesterday.",note:l("Kein \u201E-s\u201C bei he/she/it im Past Simple!")},{wrong:"I mineed iron in the cave.",right:"I mined iron in the cave.",note:l("Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.")}],examples:[{en:"I mined sixty blocks of iron yesterday.",de:l("Ich baute gestern sechzig Bl\xF6cke Eisen ab.")},{en:"She crafted a new shield before the raid.",de:l("Sie craftete vor dem Raid einen neuen Schild.")}]},{id:"spelling-ed",category:"regular",title:l("Rechtschreib-Regeln (-ed)"),subtitle:l("try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played"),badge:l("Rechtschreibung"),whenToUseDE:l("Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!"),formula:l("Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed"),formulaNoteDE:l("1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned."),signalsDiffDE:l("Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened)."),mistakesDE:[{wrong:"I tryed to escape and droped my sword.",right:"I tried to escape and dropped my sword.",note:l("Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!")},{wrong:"We plaied BedWars all afternoon.",right:"We played BedWars all afternoon.",note:l("Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!")}],examples:[{en:"Max studied his English words, then played Minecraft.",de:l("Max lernte seine Englischw\xF6rter und spielte dann Minecraft.")},{en:"The skeleton stopped right outside our wall.",de:l("Das Skelett blieb direkt vor unserer Mauer stehen.")}]},{id:"irregular-v2",category:"irregular",title:l("Unregelm\xE4\xDFige Verben (2. Form)"),subtitle:l("build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found"),badge:l("Amboss-Wissen"),whenToUseDE:l("Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss."),formula:l("Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug"),formulaNoteDE:l("Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form."),signalsDiffDE:l("Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv."),mistakesDE:[{wrong:"We builded a giant castle and finded diamonds.",right:"We built a giant castle and found diamonds.",note:l("Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!")},{wrong:"I seen a Creeper behind the tree.",right:"I saw a Creeper behind the tree.",note:l("\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!")}],examples:[{en:"We dug down to level -58 and found eight diamonds.",de:l("Wir gruben bis H\xF6he -58 und fanden acht Diamanten.")},{en:"Leo fought the Ender Dragon and won the game.",de:l("Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.")}]},{id:"neg-didnt",category:"neg_quest",title:l("Verneinung mit didn't"),subtitle:l("didn't go \xB7 didn't mine \xB7 didn't find"),badge:l("Wichtigste Regel!"),whenToUseDE:l("Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not)."),formula:l("Subjekt + didn't + Grundform (1. Form des Verbs)"),formulaNoteDE:l("Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form)."),signalsDiffDE:l("Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t)."),mistakesDE:[{wrong:"I didn't went to the Nether yesterday.",right:"I didn't go to the Nether yesterday.",note:l("Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!")},{wrong:"He not crafted a pickaxe.",right:"He didn't craft a pickaxe.",note:l("Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.")}],examples:[{en:"I didn't lose my sword because I kept it in my Ender Chest.",de:l("Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.")},{en:"We didn't finish the roof before sunset.",de:l("Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.")}]},{id:"yes-no-did",category:"neg_quest",title:l("Entscheidungsfragen (Did you...?)"),subtitle:l("Did you find...? \xB7 Did he build...?"),badge:l("Ja/Nein-Fragen"),whenToUseDE:l("Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang."),formula:l("Did + Subjekt + Grundform (1. Form) + ...?"),formulaNoteDE:l("Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C)."),signalsDiffDE:l("Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!"),mistakesDE:[{wrong:"Did you found the village?",right:"Did you find the village?",note:l("Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!")},{wrong:"Played you Minecraft last night?",right:"Did you play Minecraft last night?",note:l("Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.")}],examples:[{en:"Did you bring enough torches for the cave?",de:l("Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?")},{en:"Did Tom finish his maths homework before Discord?",de:l("Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?")}]},{id:"wh-questions",category:"neg_quest",title:l("W-Fragen (What / Where / Why did...?)"),subtitle:l("What did you craft? \xB7 Where did they go?"),badge:l("W-Fragen"),whenToUseDE:l("Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C."),formula:l("Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?"),formulaNoteDE:l("Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!)."),signalsDiffDE:l("Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird."),mistakesDE:[{wrong:"Where did you went after school?",right:"Where did you go after school?",note:l("Grundform \u201Ego\u201C nach \u201Edid\u201C!")},{wrong:"What you built yesterday?",right:"What did you build yesterday?",note:l("Vergiss das Hilfsverb \u201Edid\u201C nicht!")}],examples:[{en:"Where did you hide the diamond chest?",de:l("Wo hast du die Diamanttruhe versteckt?")},{en:"Why did the Creeper explode near our farm?",de:l("Warum ist der Creeper in der N\xE4he unserer Farm explodiert?")}]},{id:"short-answers",category:"neg_quest",title:l("Kurzantworten (Yes, I did)"),subtitle:l("Yes, I did. \xB7 No, we didn\u2019t."),badge:l("H\xF6flich & Korrekt"),whenToUseDE:l("Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an."),formula:l("Yes, + Pronomen + did.  |  No, + Pronomen + didn't."),formulaNoteDE:l("Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!"),signalsDiffDE:l("In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C)."),mistakesDE:[{wrong:"\u201CDid you win?\u201D \u2014 \u201CYes, I wonned / Yes, I did win.\u201D",right:"\u201CDid you win?\u201D \u2014 \u201CYes, I did!\u201D",note:l("Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C")},{wrong:"\u201CWere you scared?\u201D \u2014 \u201CNo, I didn\u2019t.\u201D",right:"\u201CWere you scared?\u201D \u2014 \u201CNo, I wasn\u2019t.\u201D",note:l("Das Hilfsverb in der Antwort passt immer zur Frage!")}],examples:[{en:"\u201CDid you beat the Ender Dragon?\u201D \u2014 \u201CYes, we did!\u201D",de:l("\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C")},{en:"\u201CDid Mia lose her horse?\u201D \u2014 \u201CNo, she didn\u2019t.\u201D",de:l("\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C")}]},{id:"was-were-pos",category:"was_were",title:l("was & were (Aussage)"),subtitle:l("I / he / she / it was \xB7 you / we / they were"),badge:l("Verb \u201Eto be\u201C"),whenToUseDE:l("\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit."),formula:l("I / he / she / it + was   |   you / we / they + were"),formulaNoteDE:l("Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!)."),signalsDiffDE:l("\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C."),mistakesDE:[{wrong:"You was super fast in the parkour race!",right:"You were super fast in the parkour race!",note:l("Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.")},{wrong:"My friends was in the Nether.",right:"My friends were in the Nether.",note:l("\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!")}],examples:[{en:"I was exhausted after building that giant bridge.",de:l("Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.")},{en:"Our classmates were amazed by the Redstone elevator.",de:l("Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.")}]},{id:"was-were-neg-q",category:"was_were",title:l("wasn't / weren't & Fragen"),subtitle:l("wasn't \xB7 weren't \xB7 Were you...?"),badge:l("Kein \u201Edid\u201C!"),whenToUseDE:l("Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln."),formula:l("Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?"),formulaNoteDE:l("F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C"),signalsDiffDE:l("Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C)."),mistakesDE:[{wrong:"Did you were at school yesterday?",right:"Were you at school yesterday?",note:l("Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!")},{wrong:"The dungeon didn't be easy.",right:"The dungeon wasn't easy.",note:l("Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.")}],examples:[{en:"Were you scared when the cave noise played?",de:l("Hattest du Angst, als das H\xF6hlenger\xE4usch lief?")},{en:"The server wasn't online during maintenance.",de:l("Der Server war w\xE4hrend der Wartung nicht online.")}]},{id:"there-was-were",category:"was_were",title:l("There was / There were"),subtitle:l("Es gab (Einzahl & Mehrzahl)"),badge:l("Beschreiben"),whenToUseDE:l("Perfekt, um deine Minecraft-Welt oder ein Erlebnis zu beschreiben: \u201EEs gab eine H\xF6hle\u2026\u201C oder \u201EEs waren drei Zombies da\u2026\u201C."),formula:l("There was + Einzahl (a/an/one)   |   There were + Mehrzahl (two, many, some...)"),formulaNoteDE:l("Verneinung: \u201EThere wasn\u2019t any lava.\u201C / \u201EThere weren\u2019t any Creepers.\u201C Frage: \u201EWas there a chest?\u201C / \u201EWere there any villagers?\u201C"),signalsDiffDE:l("Im Deutschen sagt man immer \u201EEs gab\u2026\u201C (egal ob ein Creeper oder zehn). Im Englischen musst du genau auf Einzahl (was) vs. Mehrzahl (were) achten!"),mistakesDE:[{wrong:"There was five zombies outside my door.",right:"There were five zombies outside my door.",note:l("F\xFCnf Zombies = Plural \u2192 \u201EThere were\u201C!")},{wrong:"It gave a big village near spawn.",right:"There was a big village near spawn.",note:l("\u201EEs gab\u201C hei\xDFt NIEMALS \u201Eit gave\u201C, sondern immer \u201EThere was / There were\u201C!")}],examples:[{en:"There was a blacksmith with diamond boots in the village.",de:l("Es gab einen Schmied mit Diamantstiefeln im Dorf.")},{en:"There were twenty torches lighting up the tunnel.",de:l("Es gab zwanzig Fackeln, die den Tunnel beleuchteten.")}]},{id:"signal-words",category:"traps",title:l("Signalw\xF6rter (yesterday, ago, last...)"),subtitle:l("Die Zeitportal-Marker des Past Simple"),badge:l("Zeit-Kompass"),whenToUseDE:l("Signalw\xF6rter verraten dir in Tests sofort, dass du das Past Simple benutzen musst. Sie zeigen an, dass ein Zeitpunkt komplett in der Vergangenheit liegt."),formula:l("yesterday \xB7 last night/week/year \xB7 [Zeit] + ago \xB7 in 2023 \xB7 when I was..."),formulaNoteDE:l("Wortstellung im Englischen: Zeitangaben stehen am SATZENDE (oder ganz am Satzanfang) \u2013 niemals zwischen Verb und Objekt!"),signalsDiffDE:l("\u201Evor zwei Tagen\u201C = \u201Etwo days ago\u201C (ago steht HINTER der Zahl). \u201Eletzte Woche\u201C = \u201Elast week\u201C (OHNE \u201Ethe\u201C!)."),mistakesDE:[{wrong:"I found ago three days a lush cave.",right:"I found a lush cave three days ago.",note:l("\u201Eago\u201C steht hinter der Zeitspanne und die Zeitangabe am Satzende.")},{wrong:"Yesterday played we Minecraft.",right:"Yesterday, we played Minecraft. / We played Minecraft yesterday.",note:l("Im Englischen bleibt immer Subjekt vor Verb (we played)!")}],examples:[{en:"We defeated the Ender Dragon two weeks ago.",de:l("Wir haben den Enderdrachen vor zwei Wochen besiegt.")},{en:"Last night, I built an automatic bamboo farm.",de:l("Gestern Abend habe ich eine automatische Bambusfarm gebaut.")}]},{id:"perfect-trap",category:"traps",title:l("Die Perfekt-Falle f\xFCr Deutsche"),subtitle:l("Past Simple vs. Present Perfect"),badge:l("Creeper-Falle #1"),whenToUseDE:l("Im Deutschen erz\xE4hlen wir fast alles im Perfekt: \u201EIch HABE gestern gespielt.\u201C Wenn du das w\xF6rtlich ins Englische \xFCbersetzt (\u201EI have played yesterday\u201C), explodiert der Satz wie ein Creeper!"),formula:l("Fester Zeitpunkt in der Vergangenheit (yesterday, last, ago, When...?) \u2192 IMMER Past Simple!"),formulaNoteDE:l("Das Present Perfect (\u201EI have played\u201C) nutzt man im Englischen nur ohne festen Vergangenheitszeitpunkt (z. B. Erfahrungen im Leben: \u201EHave you ever played Minecraft?\u201C)."),signalsDiffDE:l("Faustregel f\xFCr die Schule: Siehst du yesterday, last\u2026, \u2026ago, in 2022 oder When\u2026? \u2192 Finger weg von have/has! Nimm Past Simple!"),mistakesDE:[{wrong:"I have built a Redstone door yesterday.",right:"I built a Redstone door yesterday.",note:l("\u201Eyesterday\u201C + Present Perfect ist im Englischen immer falsch!")},{wrong:"When have you bought Minecraft?",right:"Whe
