ngt man einfach nur ein \u201E-d\u201C an.")},{id:2,type:"fill",category:"regular",prompt:"After school, Leon _____ a full set of iron armour before entering the Nether.",germanHint:i("Nach der Schule craftete Leon eine komplette Eisenr\xFCstung. (craft)"),options:["craftet","crafted","craft","croft"],correctIndex:1,explanation:i("\u201ECraft\u201C ist ein normales regelm\xE4\xDFiges Verb: einfach \u201E-ed\u201C anh\xE4ngen \u2192 crafted.")},{id:3,type:"fill",category:"regular",prompt:"I _____ to jump across the lava river, and I barely made it!",germanHint:i("Ich versuchte, \xFCber den Lavafluss zu springen, und schaffte es gerade so! (try)"),options:["tryed","tryd","tried","trying"],correctIndex:2,explanation:i("Rechtschreib-Regel: Endet ein Verb auf Konsonant + y (try), wird das \u201Ey\u201C zu \u201Eied\u201C \u2192 tried.")},{id:4,type:"fill",category:"regular",prompt:"Suddenly, the noisy zombie _____ right in front of our oak door.",germanHint:i("Pl\xF6tzlich blieb der laute Zombie direkt vor unserer Eichent\xFCr stehen. (stop)"),options:["stoped","stoppt","stopped","stoping"],correctIndex:2,explanation:i("Bei kurzen Verben mit kurzem Vokal + einfachem Konsonanten am Ende (stop) wird der letzte Konsonant verdoppelt \u2192 stopped.")},{id:5,type:"fill",category:"regular",prompt:"Last Saturday, my best friend and I _____ BedWars for two hours.",germanHint:i("Letzten Samstag spielten mein bester Freund und ich zwei Stunden lang BedWars. (play)"),options:["plaied","played","playd","plaid"],correctIndex:1,explanation:i("Achtung! Steht vor dem \u201Ey\u201C ein Vokal (a, e, o, u wie in \u201Eplay\u201C), bleibt das \u201Ey\u201C einfach stehen \u2192 played (NICHT plaied!).")},{id:6,type:"fill",category:"regular",prompt:"Oops! I accidentally _____ my enchanted diamond sword into the cactus!",germanHint:i("Ups! Ich lie\xDF mein verzaubertes Diamantschwert versehentlich in den Kaktus fallen! (drop)"),options:["droped","dropped","dropt","droppd"],correctIndex:1,explanation:i("\u201EDrop\u201C ist kurz und endet auf Vokal + Konsonant (o + p) \u2192 das \u201Ep\u201C wird verdoppelt: dropped.")},{id:7,type:"fill",category:"regular",prompt:"Before gaming on Friday, Max _____ his English vocabulary for 30 minutes.",germanHint:i("Vor dem Zocken am Freitag lernte Max 30 Minuten lang seine Englischvokabeln. (study)"),options:["studyed","studid","studied","studying"],correctIndex:2,explanation:i("Bei \u201Estudy\u201C steht ein Konsonant (d) vor dem \u201Ey\u201C \u2192 aus \u201Ey\u201C wird \u201Eied\u201C: studied.")},{id:8,type:"four_sentences",category:"regular",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: -ed-Rechtschreibung mit \u201Ecarry\u201C)"),germanHint:i("Sinn: Wir trugen zwei volle Shulker-Boxen zur\xFCck zu unserer Base."),options:["We carryed two full Shulker boxes back to our base.","We carried two full Shulker boxes back to our base.","We carred two full Shulker boxes back to our base.","We carryd two full Shulker boxes back to our base."],correctIndex:1,explanation:i("Bei \u201Ecarry\u201C steht der Konsonant \u201Er\u201C vor dem \u201Ey\u201C, deshalb wird das \u201Ey\u201C zu \u201Ei\u201C + \u201E-ed\u201C \u2192 carried.")},{id:9,type:"four_sentences",category:"regular",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verdopplung bei \u201Eplan\u201C)"),germanHint:i("Sinn: Unsere Klasse plante letzte Woche eine riesige Mittelalterstadt auf dem Server."),options:["Our class planed a huge medieval city on the server last week.","Our class plannd a huge medieval city on the server last week.","Our class planned a huge medieval city on the server last week.","Our class planning a huge medieval city on the server last week."],correctIndex:2,explanation:i("\u201EPlan\u201C hat einen kurzen betonten Vokal vor einem einzelnen Konsonanten \u2192 das \u201En\u201C wird verdoppelt: planned (\u201Eplaned\u201C w\xE4re \u201Ehobelte\u201C).")},{id:10,type:"four_sentences",category:"regular",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Evisit\u201C & \u201Estay\u201C)"),germanHint:i("Sinn: Wir besuchten das W\xFCstendorf und blieben bis zum Sonnenaufgang."),options:["We visitted the desert village and staied until sunrise.","We visited the desert village and stayed until sunrise.","We visited the desert village and stayd until sunrise.","We visit the desert village and stayed until sunrise."],correctIndex:1,explanation:i("\u201EVisit\u201C wird auf der ersten Silbe betont (kein Doppel-t \u2192 visited) und bei \u201Estay\u201C steht ein Vokal vor dem \u201Ey\u201C (\u2192 stayed).")},{id:11,type:"fill",category:"irregular",prompt:"Last weekend, my friends and I _____ an underground Redstone bunker.",germanHint:i("Letztes Wochenende bauten meine Freunde und ich einen unterirdischen Redstone-Bunker. (build)"),options:["builded","built","bild","building"],correctIndex:1,explanation:i("\u201EBuild\u201C ist unregelm\xE4\xDFig: build \u2013 built \u2013 built. Niemals \u201Ebuilded\u201C!")},{id:12,type:"fill",category:"irregular",prompt:"Tim _____ a staircase all the way down to level -58 to look for diamonds.",germanHint:i("Tim grub eine Treppe ganz hinunter bis H\xF6he -58, um Diamanten zu suchen. (dig)"),options:["digged","dag","dug","dog"],correctIndex:2,explanation:i("Die 2. Form von \u201Edig\u201C (graben) ist \u201Edug\u201C (dig \u2013 dug \u2013 dug).")},{id:13,type:"fill",category:"irregular",prompt:"Guess what! I _____ a chest with two enchanted golden apples in the ancient city!",germanHint:i("Rate mal! Ich fand eine Truhe mit zwei verzauberten goldenen \xC4pfeln! (find)"),options:["finded","fand","found","founded"],correctIndex:2,explanation:i("\u201EFind\u201C wird im Past Simple zu \u201Efound\u201C (find \u2013 found \u2013 found). \u201EFounded\u201C bedeutet \u201Egr\xFCndete\u201C (z. B. eine Firma).")},{id:14,type:"fill",category:"irregular",prompt:"We _____ through the purple portal and landed right next to a Bastion.",germanHint:i("Wir gingen durch das lila Portal und landeten direkt neben einer Bastion. (go)"),options:["goed","went","gone","going"],correctIndex:1,explanation:i("Eines der wichtigsten unregelm\xE4\xDFigen Verben: go \u2013 went \u2013 gone. Im Past Simple immer \u201Ewent\u201C!")},{id:15,type:"fill",category:"irregular",prompt:"Together, our squad _____ the Ender Dragon and saved the End island.",germanHint:i("Zusammen bek\xE4mpfte unser Squad den Enderdrachen und rettete die End-Insel. (fight)"),options:["fighted","faught","fought","fight"],correctIndex:2,explanation:i("\u201EFight\u201C hat die unregelm\xE4\xDFige 2. Form \u201Efought\u201C (mit \u201Eou\u201C, genau wie bought und thought).")},{id:16,type:"fill",category:"irregular",prompt:"Oh no! My iron pickaxe _____ just when I reached the obsidian wall.",germanHint:i("Oh nein! Meine Eisenspitzhacke zerbrach genau dann, als ich die Obsidianwand erreichte. (break)"),options:["breaked","broken","broke","brake"],correctIndex:2,explanation:i("break \u2013 broke \u2013 broken. F\xFCr das Past Simple brauchst du die 2. Form: \u201Ebroke\u201C.")},{id:17,type:"fill",category:"irregular",prompt:"At the village market, Jonas _____ a Mending book from the librarian for 14 emeralds.",germanHint:i("Auf dem Dorfmarkt kaufte Jonas ein Reparatur-Buch f\xFCr 14 Smaragde. (buy)"),options:["buyed","bought","brought","baught"],correctIndex:1,explanation:i("buy \u2013 bought \u2013 bought (kaufen). Nicht verwechseln mit \u201Ebrought\u201C (= brachte, von bring)!")},{id:18,type:"four_sentences",category:"irregular",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Efall\u201C & \u201Elose\u201C)"),germanHint:i("Sinn: Ich fiel in eine tiefe Schlucht und verlor alle meine Fackeln."),options:["I falled into a deep ravine and losed all my torches.","I fell into a deep ravine and lost all my torches.","I fallen into a deep ravine and lost all my torches.","I felt into a deep ravine and lose all my torches."],correctIndex:1,explanation:i("fall \u2013 fell \u2013 fallen (fiel) und lose \u2013 lost \u2013 lost (verlor). \u201EFelt\u201C kommt von \u201Efeel\u201C (f\xFChlen), nicht von \u201Efall\u201C!")},{id:19,type:"four_sentences",category:"irregular",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Esee\u201C & \u201Eswim\u201C)"),germanHint:i("Sinn: Wir sahen ein Ozeanmonument und schwammen schnell zur Oberfl\xE4che zur\xFCck."),options:["We seed an ocean monument and swimmed back to the surface fast.","We seen an ocean monument and swum back to the surface fast.","We saw an ocean monument and swam back to the surface fast.","We saw an ocean monument and swimmed back to the surface fast."],correctIndex:2,explanation:i("Beide Verben sind unregelm\xE4\xDFig: see \u2192 saw (2. Form) und swim \u2192 swam (2. Form).")},{id:20,type:"four_sentences",category:"irregular",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewrite\u201C & \u201Ewin\u201C)"),germanHint:i("Sinn: Ben schrieb eine gute Englischarbeit und gewann abends das Minecraft-Turnier."),options:["Ben writed a great English test and winned the Minecraft tournament in the evening.","Ben written a great English test and won the Minecraft tournament in the evening.","Ben wrote a great English test and winned the Minecraft tournament in the evening.","Ben wrote a great English test and won the Minecraft tournament in the evening."],correctIndex:3,explanation:i("write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!")},{id:21,type:"fill",category:"neg_quest",prompt:"I _____ into the Deep Dark cave because I didn\u2019t have any wool blocks.",germanHint:i("Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)"),options:["didn't went","didn't go","wasn't go","don't went"],correctIndex:1,explanation:i("Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!).")},{id:22,type:"fill",category:"neg_quest",prompt:"_____ you _____ any Netherite scraps during your mining trip yesterday?",germanHint:i("Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)"),options:["Did / found","Were / find","Did / find","Do / found"],correctIndex:2,explanation:i("Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?")},{id:23,type:"fill",category:"neg_quest",prompt:"What _____ Steve _____ with all that Redstone dust?",germanHint:i("Was hat Steve mit all dem Redstone-Staub gebaut? (build)"),options:["did / built","did / build","was / build","does / built"],correctIndex:1,explanation:i("Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?")},{id:24,type:"fill",category:"neg_quest",prompt:"\u201CDid your brother defeat the Wither alone?\u201D \u2014 \u201CNo, he _____.\u201D",germanHint:i("Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C"),options:["wasn't","didn't","don't","didn't defeated"],correctIndex:1,explanation:i("Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C.")},{id:25,type:"fill",category:"neg_quest",prompt:"Why _____ Lukas _____ a water bucket before jumping off the tower?",germanHint:i("Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)"),options:["didn't / took","wasn't / take","didn't / take","don't / take"],correctIndex:2,explanation:i("Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?")},{id:26,type:"fill",category:"neg_quest",prompt:"The Creeper _____ our house because my wolf scared it away\u2014wait, cats scare Creepers!",germanHint:i("Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)"),options:["didn't destroyed","not destroyed","didn't destroy","wasn't destroy"],correctIndex:2,explanation:i("F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy.")},{id:27,type:"fill",category:"neg_quest",prompt:"\u201CDid you and Mia finish your biology poster before gaming?\u201D \u2014 \u201CYes, we _____!\u201D",germanHint:i("Kurzantwort: \u201EJa, das haben wir!\u201C"),options:["did","were","finished","do"],correctIndex:0,explanation:i("Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen).")},{id:28,type:"four_sentences",category:"neg_quest",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)"),germanHint:i("Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen."),options:["I didn't forgot my homework last night.","I not forgot my homework last night.","I didn't forget my homework last night.","I wasn't forget my homework last night."],correctIndex:2,explanation:i("Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!")},{id:29,type:"four_sentences",category:"neg_quest",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)"),germanHint:i("Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?"),options:["Where did you downloaded that cool Minecraft map yesterday?","Where you downloaded that cool Minecraft map yesterday?","Where did you download that cool Minecraft map yesterday?","Where were you download that cool Minecraft map yesterday?"],correctIndex:2,explanation:i("Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!")},{id:30,type:"four_sentences",category:"neg_quest",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)"),germanHint:i("Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab."),options:["We didn't saw any diamonds, so we mined iron instead.","We didn't see any diamonds, so we mined iron instead.","We didn't seen any diamonds, so we mined iron instead.","We don't saw any diamonds, so we mined iron instead."],correctIndex:1,explanation:i("Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).")},{id:31,type:"fill",category:"was_were",prompt:"I _____ super nervous when I heard the Warden\u2019s heartbeat in the dark.",germanHint:i("Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)"),options:["were","was","did be","am"],correctIndex:1,explanation:i("Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.")},{id:32,type:"fill",category:"was_were",prompt:"My friends and I _____ at the top of the mountain base when the storm started.",germanHint:i("Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)"),options:["was","were","did","are"],correctIndex:1,explanation:i("\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!")},{id:33,type:"fill",category:"was_were",prompt:"_____ you online on our school SMP server last night?",germanHint:i("Warst du gestern Abend auf unserem Schul-SMP-Server online?"),options:["Did","Was","Were","Are"],correctIndex:2,explanation:i("Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!")},{id:34,type:"fill",category:"was_were",prompt:"Look at that screenshot! There _____ three baby pandas in the bamboo jungle.",germanHint:i("Es gab drei Baby-Pandas im Bambusdschungel. (There be)"),options:["was","were","had","did"],correctIndex:1,explanation:i("\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.")},{id:35,type:"fill",category:"was_were",prompt:"The maths test _____ as hard as I feared, so I finished ten minutes early.",germanHint:i("Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)"),options:["didn't be","weren't","wasn't","not was"],correctIndex:2,explanation:i("\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).")},{id:36,type:"fill",category:"was_were",prompt:"Because of the Elytra wings, I _____ glide all the way across the huge ocean.",germanHint:i("Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)"),options:["can","could","did can","was can"],correctIndex:1,explanation:i("Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.")},{id:37,type:"fill",category:"was_were",prompt:"There _____ a hidden trapdoor right under the carpet in the woodland mansion!",germanHint:i("Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!"),options:["were","was","did","are"],correctIndex:1,explanation:i("\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.")},{id:38,type:"four_sentences",category:"was_were",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)"),germanHint:i("Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?"),options:["Did you were tired after the long boss fight?","Was you tired after the long boss fight?","Were you tired after the long boss fight?","Did you be tired after the long boss fight?"],correctIndex:2,explanation:i("\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?")},{id:39,type:"four_sentences",category:"was_were",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)"),germanHint:i("Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war."),options:["The villagers didn't be in their houses because it was still daytime.","The villagers wasn't in their houses because it was still daytime.","The villagers weren't in their houses because it was still daytime.","The villagers not were in their houses because it was still daytime."],correctIndex:2,explanation:i("\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.")},{id:40,type:"four_sentences",category:"was_were",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)"),germanHint:i("Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte."),options:["I didn't could light the portal last night because I had no flint.","I couldn't lit the portal last night because I had no flint.","I couldn't light the portal last night because I had no flint.","I wasn't could light the portal last night because I had no flint."],correctIndex:2,explanation:i("\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).")},{id:41,type:"fill",category:"traps",prompt:"I _____ a massive treehouse on our server yesterday.",germanHint:i("Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!"),options:["have built","built","am building","have build"],correctIndex:1,explanation:i("Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!")},{id:42,type:"fill",category:"traps",prompt:"Our class started this Minecraft world three months _____.",germanHint:i("Unsere Klasse startete diese Minecraft-Welt vor drei Monaten."),options:["before","since","ago","last"],correctIndex:2,explanation:i("\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).")},{id:43,type:"fill",category:"traps",prompt:"We _____ our first Nether fortress last night after dinner.",germanHint:i("Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)"),options:["have found","found","did found","finding"],correctIndex:1,explanation:i("\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.")},{id:44,type:"fill",category:"traps",prompt:"When I _____ ten years old, I built my very first dirt house.",germanHint:i("Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus."),options:["have been","was","were","am"],correctIndex:1,explanation:i("\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).")},{id:45,type:"fill",category:"traps",prompt:"Mojang _____ the Trial Chambers update in 2024.",germanHint:i("Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)"),options:["has released","released","was release","releasing"],correctIndex:1,explanation:i("Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).")},{id:46,type:"fill",category:"traps",prompt:"_____ week, our English teacher gave us a super fun gaming quiz.",germanHint:i("Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz."),options:["Ago","Last","Yesterday","Before"],correctIndex:1,explanation:i("\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).")},{id:47,type:"fill",category:"traps",prompt:"\u201CWhen _____ you _____ playing Minecraft?\u201D \u2014 \u201CTwo years ago!\u201D",germanHint:i("Wann hast du angefangen, Minecraft zu spielen? (start)"),options:["have / started","did / start","did / started","were / start"],correctIndex:1,explanation:i("Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!")},{id:48,type:"four_sentences",category:"traps",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)"),germanHint:i("Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt."),options:["I have played Minecraft for two hours yesterday.","I played Minecraft for two hours yesterday.","I did played Minecraft for two hours yesterday.","Yesterday have I played Minecraft for two hours."],correctIndex:1,explanation:i("Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.")},{id:49,type:"four_sentences",category:"traps",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)"),germanHint:i("Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen."),options:["My friend has seen a rare pink sheep ago two days.","My friend saw a rare pink sheep two days before.","My friend saw a rare pink sheep two days ago.","My friend saw ago two days a rare pink sheep."],correctIndex:2,explanation:i("Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).")},{id:50,type:"four_sentences",category:"traps",prompt:i("Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)"),germanHint:i("Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut."),options:["We built last night in Survival mode a new base.","We have built a new base in Survival mode last night.","We built a new base in Survival mode last night.","Last night built we a new base in Survival mode."],correctIndex:2,explanation:i("Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!")}],Ys=[{id:"reg-ed",category:"regular",title:i("Regelm\xE4\xDFige Verben (-ed)"),subtitle:i("mine \u2192 mined \xB7 craft \u2192 crafted"),badge:i("Basis-Rezept"),whenToUseDE:i("Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an."),formula:i("Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)"),formulaNoteDE:i("Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form."),signalsDiffDE:i("Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived)."),mistakesDE:[{wrong:"He playeds Minecraft yesterday.",right:"He played Minecraft yesterday.",note:i("Kein \u201E-s\u201C bei he/she/it im Past Simple!")},{wrong:"I mineed iron in the cave.",right:"I mined iron in the cave.",note:i("Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.")}],examples:[{en:"I mined sixty blocks of iron yesterday.",de:i("Ich baute gestern sechzig Bl\xF6cke Eisen ab.")},{en:"She crafted a new shield before the raid.",de:i("Sie craftete vor dem Raid einen neuen Schild.")}]},{id:"spelling-ed",category:"regular",title:i("Rechtschreib-Regeln (-ed)"),subtitle:i("try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played"),badge:i("Rechtschreibung"),whenToUseDE:i("Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!"),formula:i("Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed"),formulaNoteDE:i("1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned."),signalsDiffDE:i("Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened)."),mistakesDE:[{wrong:"I tryed to escape and droped my sword.",right:"I tried to escape and dropped my sword.",note:i("Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!")},{wrong:"We plaied BedWars all afternoon.",right:"We played BedWars all afternoon.",note:i("Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!")}],examples:[{en:"Max studied his English words, then played Minecraft.",de:i("Max lernte seine Englischw\xF6rter und spielte dann Minecraft.")},{en:"The skeleton stopped right outside our wall.",de:i("Das Skelett blieb direkt vor unserer Mauer stehen.")}]},{id:"irregular-v2",category:"irregular",title:i("Unregelm\xE4\xDFige Verben (2. Form)"),subtitle:i("build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found"),badge:i("Amboss-Wissen"),whenToUseDE:i("Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss."),formula:i("Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug"),formulaNoteDE:i("Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form."),signalsDiffDE:i("Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv."),mistakesDE:[{wrong:"We builded a giant castle and finded diamonds.",right:"We built a giant castle and found diamonds.",note:i("Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!")},{wrong:"I seen a Creeper behind the tree.",right:"I saw a Creeper behind the tree.",note:i("\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!")}],examples:[{en:"We dug down to level -58 and found eight diamonds.",de:i("Wir gruben bis H\xF6he -58 und fanden acht Diamanten.")},{en:"Leo fought the Ender Dragon and won the game.",de:i("Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.")}]},{id:"neg-didnt",category:"neg_quest",title:i("Verneinung mit didn't"),subtitle:i("didn't go \xB7 didn't mine \xB7 didn't find"),badge:i("Wichtigste Regel!"),whenToUseDE:i("Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not)."),formula:i("Subjekt + didn't + Grundform (1. Form des Verbs)"),formulaNoteDE:i("Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form)."),signalsDiffDE:i("Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t)."),mistakesDE:[{wrong:"I didn't went to the Nether yesterday.",right:"I didn't go to the Nether yesterday.",note:i("Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!")},{wrong:"He not crafted a pickaxe.",right:"He didn't craft a pickaxe.",note:i("Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.")}],examples:[{en:"I didn't lose my sword because I kept it in my Ender Chest.",de:i("Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.")},{en:"We didn't finish the roof before sunset.",de:i("Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.")}]},{id:"yes-no-did",category:"neg_quest",title:i("Entscheidungsfragen (Did you...?)"),subtitle:i("Did you find...? \xB7 Did he build...?"),badge:i("Ja/Nein-Fragen"),whenToUseDE:i("Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang."),formula:i("Did + Subjekt + Grundform (1. Form) + ...?"),formulaNoteDE:i("Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C)."),signalsDiffDE:i("Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!"),mistakesDE:[{wrong:"Did you found the village?",right:"Did you find the village?",note:i("Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!")},{wrong:"Played you Minecraft last night?",right:"Did you play Minecraft last night?",note:i("Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.")}],examples:[{en:"Did you bring enough torches for the cave?",de:i("Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?")},{en:"Did Tom finish his maths homework before Discord?",de:i("Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?")}]},{id:"wh-questions",category:"neg_quest",title:i("W-Fragen (What / Where / Why did...?)"),subtitle:i("What did you craft? \xB7 Where did they go?"),badge:i("W-Fragen"),whenToUseDE:i("Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C."),formula:i("Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?"),formulaNoteDE:i("Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!)."),signalsDiffDE:i("Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird."),mistakesDE:[{wrong:"Where did you went after school?",right:"Where did you go after school?",note:i("Grundform \u201Ego\u201C nach \u201Edid\u201C!")},{wrong:"What you built yesterday?",right:"What did you build yesterday?",note:i("Vergiss das Hilfsverb \u201Edid\u201C nicht!")}],examples:[{en:"Where did you hide the diamond chest?",de:i("Wo hast du die Diamanttruhe versteckt?")},{en:"Why did the Creeper explode near our farm?",de:i("Warum ist der Creeper in der N\xE4he unserer Farm explodiert?")}]},{id:"short-answers",category:"neg_quest",title:i("Kurzantworten (Yes, I did)"),subtitle:i("Yes, I did. \xB7 No, we didn\u2019t."),badge:i("H\xF6flich & Korrekt"),whenToUseDE:i("Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an."),formula:i("Yes, + Pronomen + did.  |  No, + Pronomen + didn't."),formulaNoteDE:i("Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!"),signalsDiffDE:i("In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C)."),mistakesDE:[{wrong:"\u201CDid you win?\u201D \u2014 \u201CYes, I wonned / Yes, I did win.\u201D",right:"\u201CDid you win?\u201D \u2014 \u201CYes, I did!\u201D",note:i("Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C")},{wrong:"\u201CWere you scared?\u201D \u2014 \u201CNo, I didn\u2019t.\u201D",right:"\u201CWere you scared?\u201D \u2014 \u201CNo, I wasn\u2019t.\u201D",note:i("Das Hilfsverb in der Antwort passt immer zur Frage!")}],examples:[{en:"\u201CDid you beat the Ender Dragon?\u201D \u2014 \u201CYes, we did!\u201D",de:i("\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C")},{en:"\u201CDid Mia lose her horse?\u201D \u2014 \u201CNo, she didn\u2019t.\u201D",de:i("\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C")}]},{id:"was-were-pos",category:"was_were",title:i("was & were (Aussage)"),subtitle:i("I / he / she / it was \xB7 you / we / they were"),badge:i("Verb \u201Eto be\u201C"),whenToUseDE:i("\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit."),formula:i("I / he / she / it + was   |   you / we / they + were"),formulaNoteDE:i("Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!)."),signalsDiffDE:i("\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C."),mistakesDE:[{wrong:"You was super fast in the parkour race!",right:"You were super fast in the parkour race!",note:i("Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.")},{wrong:"My friends was in the Nether.",right:"My friends were in the Nether.",note:i("\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!")}],examples:[{en:"I was exhausted after building that giant bridge.",de:i("Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.")},{en:"Our classmates were amazed by the Redstone elevator.",de:i
