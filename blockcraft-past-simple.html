mple (find \u2013 found \u2013 found). \xAB Founded \xBB veut dire \xAB a fond\xE9 \xBB (une entreprise, par exemple).","Wir gingen durch das lila Portal und landeten direkt neben einer Bastion. (go)":"Nous avons travers\xE9 le portail violet et nous avons atterri juste \xE0 c\xF4t\xE9 d'un bastion. (go)","Eines der wichtigsten unregelm\xE4\xDFigen Verben: go \u2013 went \u2013 gone. Im Past Simple immer \u201Ewent\u201C!":"L'un des verbes irr\xE9guliers les plus importants : go \u2013 went \u2013 gone. Au Past Simple, toujours \xAB went \xBB !","Zusammen bek\xE4mpfte unser Squad den Enderdrachen und rettete die End-Insel. (fight)":"Ensemble, notre \xE9quipe a combattu l'Ender Dragon et a sauv\xE9 l'\xEEle de l'End. (fight)","\u201EFight\u201C hat die unregelm\xE4\xDFige 2. Form \u201Efought\u201C (mit \u201Eou\u201C, genau wie bought und thought).":"\xAB Fight \xBB a la 2e forme irr\xE9guli\xE8re \xAB fought \xBB (avec \xAB ou \xBB, comme bought et thought).","Oh nein! Meine Eisenspitzhacke zerbrach genau dann, als ich die Obsidianwand erreichte. (break)":"Oh non ! Ma pioche en fer s'est cass\xE9e juste au moment o\xF9 j'atteignais le mur d'obsidienne. (break)","break \u2013 broke \u2013 broken. F\xFCr das Past Simple brauchst du die 2. Form: \u201Ebroke\u201C.":"break \u2013 broke \u2013 broken. Pour le Past Simple, il faut la 2e forme : \xAB broke \xBB.","Auf dem Dorfmarkt kaufte Jonas ein Reparatur-Buch f\xFCr 14 Smaragde. (buy)":"Au march\xE9 du village, Jonas a achet\xE9 un livre Raccommodage pour 14 \xE9meraudes. (buy)","buy \u2013 bought \u2013 bought (kaufen). Nicht verwechseln mit \u201Ebrought\u201C (= brachte, von bring)!":"buy \u2013 bought \u2013 bought (acheter). Ne le confonds pas avec \xAB brought \xBB (= a apport\xE9, de bring) !","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Efall\u201C & \u201Elose\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : \xAB fall \xBB et \xAB lose \xBB)","Sinn: Ich fiel in eine tiefe Schlucht und verlor alle meine Fackeln.":"Sens : Je suis tomb\xE9 dans un ravin profond et j'ai perdu toutes mes torches.","fall \u2013 fell \u2013 fallen (fiel) und lose \u2013 lost \u2013 lost (verlor). \u201EFelt\u201C kommt von \u201Efeel\u201C (f\xFChlen), nicht von \u201Efall\u201C!":"fall \u2013 fell \u2013 fallen (est tomb\xE9) et lose \u2013 lost \u2013 lost (a perdu). \xAB Felt \xBB vient de \xAB feel \xBB (ressentir), pas de \xAB fall \xBB !","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Esee\u201C & \u201Eswim\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : \xAB see \xBB et \xAB swim \xBB)","Sinn: Wir sahen ein Ozeanmonument und schwammen schnell zur Oberfl\xE4che zur\xFCck.":"Sens : Nous avons vu un monument oc\xE9anique et nous sommes vite remont\xE9s \xE0 la surface \xE0 la nage.","Beide Verben sind unregelm\xE4\xDFig: see \u2192 saw (2. Form) und swim \u2192 swam (2. Form).":"Les deux verbes sont irr\xE9guliers : see \u2192 saw (2e forme) et swim \u2192 swam (2e forme).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewrite\u201C & \u201Ewin\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : \xAB write \xBB et \xAB win \xBB)","Sinn: Ben schrieb eine gute Englischarbeit und gewann abends das Minecraft-Turnier.":"Sens : Ben a \xE9crit un bon contr\xF4le d'anglais et le soir, il a gagn\xE9 le tournoi Minecraft.","write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!":"write \u2013 wrote \u2013 written (a \xE9crit) et win \u2013 won \u2013 won (a gagn\xE9). Les deux sont \xE0 la 2e forme !","Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)":"Je ne suis pas all\xE9 dans la grotte du Deep Dark parce que je n'avais pas de blocs de laine. (not go)","Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!).":"R\xE8gle d'or : apr\xE8s \xAB didn\u2019t \xBB, on met TOUJOURS la base verbale (infinitif) \u2192 didn\u2019t go (JAMAIS didn\u2019t went !).","Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)":"Tu as trouv\xE9 des d\xE9bris de netherite hier pendant ton exp\xE9dition mini\xE8re ? (find)","Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?":"Au Past Simple, les questions se forment avec \xAB Did + sujet + base verbale \xBB \u2192 Did you find...?","Was hat Steve mit all dem Redstone-Staub gebaut? (build)":"Qu'est-ce que Steve a construit avec toute cette poudre de redstone ? (build)","Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?":"Avec les questions en What / Where / Why aussi : \xAB did \xBB porte d\xE9j\xE0 le pass\xE9, le verbe reste \xE0 la base verbale \u2192 What did Steve build?","Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C":"R\xE9ponse courte en anglais : \xAB Non, il ne l'a pas fait. \xBB","Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C.":"Quand la question commence par \xAB Did\u2026? \xBB, on r\xE9pond bri\xE8vement avec \xAB Yes, \u2026 did \xBB ou \xAB No, \u2026 didn\u2019t \xBB.","Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)":"Pourquoi Lukas n'a-t-il pas pris de seau d'eau avant de sauter de la tour ? (not take)","Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?":"Question n\xE9gative en Why au Past Simple : \xAB Why didn\u2019t + sujet + base verbale \xBB \u2192 Why didn\u2019t Lukas take...?","Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)":"Le Creeper n'a pas d\xE9truit notre maison ! (not destroy)","F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy.":"Pour mettre les verbes ordinaires \xE0 la forme n\xE9gative au Past Simple, il faut toujours \xAB didn\u2019t \xBB + base verbale \u2192 didn\u2019t destroy.","Kurzantwort: \u201EJa, das haben wir!\u201C":"R\xE9ponse courte : \xAB Oui, on l'a fait ! \xBB","Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen).":"\xC0 \xAB Did you and Mia\u2026? \xBB, la bonne r\xE9ponse courte en anglais est simplement \xAB Yes, we did! \xBB (sans r\xE9p\xE9ter le verbe principal).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : n\xE9gation avec \xAB didn\u2019t \xBB)","Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen.":"Sens : Hier soir, je n'ai pas oubli\xE9 mes devoirs.","Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!":"Apr\xE8s \xAB didn\u2019t \xBB, le verbe revient \xE0 la 1re forme (base verbale) : \xAB didn\u2019t forget \xBB \u2013 jamais \xAB didn\u2019t forgot \xBB !","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : questions avec \xAB Did \xBB)","Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?":"Sens : O\xF9 as-tu t\xE9l\xE9charg\xE9 cette super map Minecraft hier ?","Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!":"Formule de la question : mot interrogatif (Where) + did + sujet (you) + base verbale (download) \u2192 pas de \xAB -ed \xBB sur le verbe !","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : \xAB didn\u2019t \xBB avec les verbes irr\xE9guliers)","Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab.":"Sens : Nous n'avons pas vu de diamants, alors nous avons min\xE9 du fer \xE0 la place.","Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).":"Dans la premi\xE8re partie, il y a \xAB didn\u2019t + base verbale \xBB (didn\u2019t see) ; dans la seconde, une phrase affirmative normale au Past Simple (mined).","Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)":"J'\xE9tais super nerveux quand j'ai entendu les battements de c\u0153ur du Warden. (be)","Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.":"Avec I / he / she / it, on utilise toujours \xAB was \xBB au Past Simple.","Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)":"Mes amis et moi \xE9tions tout en haut de la base de la montagne quand l'orage a commenc\xE9. (be)","\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!":"\xAB My friends and I \xBB = we (pluriel) \u2192 c'est pour \xE7a qu'il faut \xAB were \xBB ici !","Warst du gestern Abend auf unserem Schul-SMP-Server online?":"Tu \xE9tais en ligne hier soir sur le serveur SMP de l'\xE9cole ?","Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!":"Avec \xAB you \xBB, c'est toujours \xAB were \xBB \u2013 et avec was/were, on n'utilise JAMAIS \xAB did \xBB !","Es gab drei Baby-Pandas im Bambusdschungel. (There be)":"Il y avait trois b\xE9b\xE9s pandas dans la jungle de bambous. (There be)","\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.":"\xAB Three baby pandas \xBB est au pluriel \u2192 \xAB There were \xBB (il y avait). Au singulier, on utilise \xAB There was \xBB.","Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)":"Le contr\xF4le de maths n'\xE9tait pas aussi difficile que je le craignais. (not be)","\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).":"\xAB The maths test \xBB = it \u2192 la n\xE9gation de \xAB was \xBB est simplement \xAB wasn\u2019t \xBB (sans \xAB didn\u2019t \xBB !).","Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)":"Gr\xE2ce aux \xE9lytres, j'ai pu planer au-dessus de tout l'immense oc\xE9an. (can \u2192 Past Simple)","Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.":"Le pass\xE9 de \xAB can \xBB est \xAB could \xBB (pouvait / a pu). Il n'a pas besoin de \xAB did \xBB et reste identique \xE0 toutes les personnes.","Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!":"Il y avait une trappe cach\xE9e juste sous le tapis dans le manoir de la for\xEAt !","\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.":"\xAB A hidden trapdoor \xBB est au singulier \u2192 donc \xAB There was \xBB.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : question avec \xAB were \xBB)","Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?":"Sens : Vous \xE9tiez fatigu\xE9s apr\xE8s le long combat contre le boss ?","\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?":"\xAB was \xBB et \xAB were \xBB sont des verbes forts : ils n'ont PAS besoin de \xAB did \xBB ! On inverse simplement le sujet et \xAB were \xBB \u2192 Were you tired?","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : \xAB wasn\u2019t / weren\u2019t \xBB)","Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war.":"Sens : Les villageois n'\xE9taient pas dans leurs maisons parce qu'il faisait encore jour.","\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.":"\xAB The villagers \xBB = they (pluriel) \u2192 \xAB weren\u2019t \xBB. Avec \xAB be \xBB au Past Simple, on n'utilise jamais \xAB didn\u2019t \xBB.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : \xAB couldn\u2019t \xBB)","Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte.":"Sens : Hier soir, je n'ai pas pu allumer le portail parce qu'il me manquait du silex.","\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).":"\xAB Couldn\u2019t \xBB n'a pas besoin de \xAB did \xBB et se construit toujours avec la base verbale (\xAB couldn\u2019t light \xBB).","Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!":"Attention, pi\xE8ge du fran\xE7ais ! En fran\xE7ais on dit \xAB J'ai construit hier \xBB, mais en anglais, avec \xAB yesterday \xBB, on met le Past Simple !","Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!":"Le pi\xE8ge n\xB0 1 du fran\xE7ais ! Avec des marqueurs comme \xAB yesterday \xBB (pass\xE9 termin\xE9), on ne met JAMAIS le Present Perfect (\xAB have built \xBB) \u2013 toujours le Past Simple : \xAB built \xBB !","Unsere Klasse startete diese Minecraft-Welt vor drei Monaten.":"Notre classe a commenc\xE9 ce monde Minecraft il y a trois mois.","\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).":"\xAB Il y a trois mois \xBB se dit \xAB three months ago \xBB en anglais \u2013 et \xAB ago \xBB se place toujours \xC0 LA FIN de l'expression de temps (pas devant comme \xAB il y a \xBB !).","Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)":"Nous avons trouv\xE9 notre premi\xE8re forteresse du Nether hier soir. (find)","\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.":"\xAB Last night \xBB est un marqueur clair du Past Simple ! Donc \xAB found \xBB et pas \xAB have found \xBB.","Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus.":"Quand j'avais dix ans, j'ai construit ma toute premi\xE8re maison en terre.","\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).":"\xAB When I was ten years old \xBB d\xE9crit un moment termin\xE9 du pass\xE9 \u2192 toujours le Past Simple (\xAB was \xBB).","Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)":"Mojang a sorti la mise \xE0 jour Trial Chambers en 2024. (release)","Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).":"Avec des ann\xE9es pass\xE9es comme \xAB in 2024 \xBB, l'anglais utilise toujours le Past Simple \u2192 \xAB released \xBB (pas de Present Perfect !).","Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz.":"La semaine derni\xE8re, notre prof d'anglais nous a fait un super quiz sur les jeux vid\xE9o.","\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).":"\xAB La semaine derni\xE8re / le mois dernier / l'ann\xE9e derni\xE8re \xBB se dit \xAB last week / last month / last year \xBB en anglais (sans \xAB the \xBB !).","Wann hast du angefangen, Minecraft zu spielen? (start)":"Quand as-tu commenc\xE9 \xE0 jouer \xE0 Minecraft ? (start)","Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!":"Les questions en \xAB When\u2026? \xBB portent sur un moment pr\xE9cis du pass\xE9 \u2192 TOUJOURS le Past Simple (\xAB When did you start\u2026? \xBB), jamais le Present Perfect !","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : le pi\xE8ge du pass\xE9 compos\xE9 avec \xAB yesterday \xBB)","Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt.":"Sens : Hier, j'ai jou\xE9 \xE0 Minecraft pendant deux heures.","Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.":"D\xE8s que \xAB yesterday \xBB est dans la phrase, \xAB have played \xBB est interdit ! Et l'ordre des mots en anglais est sujet \u2013 verbe \u2013 compl\xE9ment \u2013 temps.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : ordre des mots avec \xAB ago \xBB)","Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen.":"Sens : Il y a deux jours, mon ami a vu un rare troupeau de moutons roses.","Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).":"Les expressions avec \xAB ago \xBB se placent en fin de phrase (ou tout au d\xE9but), et \xAB ago \xBB vient APR\xC8S la dur\xE9e : \xAB two days ago \xBB + Past Simple (\xAB saw \xBB).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)":"Quelle phrase au Past Simple est grammaticalement CORRECTE ? (Point cl\xE9 : place des expressions de temps)","Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut.":"Sens : Hier soir, nous avons construit une nouvelle base en mode Survie.","Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!":"R\xE8gle S-V-O de l'anglais : sujet (We) + verbe (built) + compl\xE9ment (a new base) + lieu (in Survival mode) + temps (last night). Pas d'inversion comme dans \xAB Last night built we \xBB !","mine \u2192 mined \xB7 craft \u2192 crafted":"mine \u2192 mined \xB7 craft \u2192 crafted","Basis-Rezept":"Recette de base","Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.":"On utilise le Past Simple pour des actions compl\xE8tement termin\xE9es dans le pass\xE9 (par ex. hier, la semaine derni\xE8re, pendant les vacances). Pour la plupart des verbes anglais, on ajoute simplement \xAB -ed \xBB.","Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)":"Sujet + base verbale + -ed  (pareil pour TOUTES les personnes !)","Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.":"G\xE9nialement simple : au Past Simple, il n'y a PAS de \xAB -s \xBB avec he/she/it ! I played, he played, we played \u2013 la m\xEAme forme partout.","Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).":"Marqueurs typiques : yesterday, last week, in 2024, two days ago. Si un verbe finit par \xAB -e \xBB (mine, live, love), on ajoute seulement \xAB -d \xBB (mined, lived).","Kein \u201E-s\u201C bei he/she/it im Past Simple!":"Pas de \xAB -s \xBB avec he/she/it au Past Simple !","Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.":"Avec un \xAB -e \xBB muet \xE0 la fin, on ajoute seulement \xAB -d \xBB.","Ich baute gestern sechzig Bl\xF6cke Eisen ab.":"Hier, j'ai min\xE9 soixante blocs de fer.","Sie craftete vor dem Raid einen neuen Schild.":"Elle a fabriqu\xE9 un nouveau bouclier avant le raid.","Rechtschreib-Regeln (-ed)":"R\xE8gles d'orthographe (-ed)","try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played":"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",Rechtschreibung:"Orthographe","Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!":"Pour certains verbes r\xE9guliers, l'orthographe change un peu quand on ajoute \xAB -ed \xBB. Ces 3 r\xE8gles tombent dans presque tous les contr\xF4les d'anglais !","Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed":"consonne + y \u2192 -ied  |  voyelle + y \u2192 -yed  |  voyelle courte + consonne \u2192 consonne doubl\xE9e + -ed","1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"Attention aux verbes de deux syllabes comme \xAB visit \xBB ou \xAB open \xBB : comme c'est la PREMI\xC8RE syllabe qui est accentu\xE9e, la derni\xE8re lettre n'est PAS doubl\xE9e (visited, opened).","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"Consonne + y devient -ied ; le court \xAB drop \xBB double le p !","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"Il y a une voyelle (a) devant le y \u2192 le y reste !","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"Max a r\xE9vis\xE9 ses mots d'anglais, puis il a jou\xE9 \xE0 Minecraft.","Das Skelett blieb direkt vor unserer Mauer stehen.":"Le squelette s'est arr\xEAt\xE9 juste devant notre mur.","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"Savoir de l'enclume","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"Beaucoup des verbes anglais les plus courants (aller, construire, trouver, combattre, voir) ne suivent pas la r\xE8gle du \xAB -ed \xBB. Ils ont leur propre 2e forme, qu'il faut apprendre par c\u0153ur.","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"Sujet + 2e forme du verbe (Past Simple)  \u2014 par ex. go \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"Important : la 2e forme s'utilise UNIQUEMENT dans les phrases affirmatives ! D\xE8s que \xAB did \xBB ou \xAB didn\u2019t \xBB appara\xEEt, le verbe repasse \xE0 la 1re forme.","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"Ne confonds pas la 2e forme (Past Simple : broke, saw, went) avec la 3e forme (participe pass\xE9 : broken, seen, gone). La 3e forme ne sert que pour le Present Perfect ou le passif.","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"N'ajoute jamais \xAB -ed \xBB aux verbes irr\xE9guliers !","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\xAB seen \xBB est la 3e forme \u2013 au Past Simple, toujours la 2e forme \xAB saw \xBB !","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"Nous avons creus\xE9 jusqu'\xE0 la couche -58 et nous avons trouv\xE9 huit diamants.","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"Leo a combattu l'Ender Dragon et a gagn\xE9 la partie.","Verneinung mit didn't":"N\xE9gation avec didn't","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"La r\xE8gle la plus importante !","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"Pour dire que quelque chose ne s'est PAS pass\xE9, tous les verbes ordinaires (sauf be et could) ont besoin de l'auxiliaire \xAB didn\u2019t \xBB (= did not).","Subjekt + didn't + Grundform (1. Form des Verbs)":"Sujet + didn't + base verbale (1re forme du verbe)","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"Moyen mn\xE9motechnique : \xAB Did a d\xE9j\xE0 le pass\xE9 dans son inventaire ! \xBB C'est pourquoi le verbe principal reste TOUJOURS \xE0 la base verbale (sans -ed et sans 2e forme).","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"C'est pareil pour les verbes r\xE9guliers ET irr\xE9guliers : \xAB didn\u2019t play \xBB, \xAB didn\u2019t go \xBB, \xAB didn\u2019t build \xBB. Seules exceptions : was/were (\u2192 wasn\u2019t/weren\u2019t) et could (\u2192 couldn\u2019t).","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"L'erreur de contr\xF4le la plus fr\xE9quente : jamais la 2e forme apr\xE8s \xAB didn\u2019t \xBB !","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"En anglais, \xAB not \xBB ne peut jamais se placer seul devant le verbe principal.","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"Je n'ai pas perdu mon \xE9p\xE9e parce que je l'avais rang\xE9e dans mon coffre de l'Ender.","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"Nous n'avons pas fini le toit avant le coucher du soleil.","Entscheidungsfragen (Did you...?)":"Questions ferm\xE9es (Did you...?)","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"Questions oui/non","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"Pour poser une question oui/non sur le pass\xE9 (\xAB Tu as\u2026 ? \xBB / \xAB Est-ce que tu as construit\u2026 ? \xBB), on met simplement \xAB Did \xBB au tout d\xE9but de la phrase.","Did + Subjekt + Grundform (1. Form) + ...?":"Did + sujet + base verbale (1re forme) + ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"Ici aussi, \xAB Did \xBB vole la terminaison du pass\xE9 au verbe ! Donc \xAB Did you mine? \xBB (PAS \xAB Did you mined? \xBB).","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"En fran\xE7ais on demande \xAB Tu as jou\xE9 hier ? \xBB \u2013 mais pour un pass\xE9 termin\xE9, l'anglais dit \xAB Did you play yesterday? \xBB !","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"Apr\xE8s \xAB Did \xBB, toujours la base verbale \xAB find \xBB !","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"En anglais, on ne peut pas simplement d\xE9placer le verbe principal en t\xEAte \u2013 il faut \xAB Did \xBB.","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"Tu as apport\xE9 assez de torches pour la grotte ?","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"Est-ce que Tom a fini ses devoirs de maths avant Discord ?","W-Fragen (What / Where / Why did...?)":"Questions ouvertes (What / Where / Why did...?)","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"Questions en W","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"Pour avoir des informations plus pr\xE9cises (Quoi ? O\xF9 ? Quand ? Pourquoi ? Comment ?), on place simplement le mot interrogatif anglais juste devant \xAB did \xBB.","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"Mot interrogatif (What/Where/When/Why/How) + did + sujet + base verbale ?","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"Attention \xE0 \xAB Who \xBB quand c'est le sujet (\xAB Qui a construit \xE7a ? \xBB) : \xAB did \xBB dispara\xEEt \u2192 \xAB Who built this castle? \xBB (2e forme !).","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"En anglais, les questions en \xAB When\u2026? \xBB sont presque toujours au Past Simple (\xAB When did you start? \xBB), car elles portent sur un moment pr\xE9cis.","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"Base verbale \xAB go \xBB apr\xE8s \xAB did \xBB !","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"N'oublie pas l'auxiliaire \xAB did \xBB !","Wo hast du die Diamanttruhe versteckt?":"O\xF9 as-tu cach\xE9 le coffre de diamants ?","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"Pourquoi le Creeper a-t-il explos\xE9 pr\xE8s de notre ferme ?","Kurzantworten (Yes, I did)":"R\xE9ponses courtes (Yes, I did)","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"Poli et correct","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"En anglais, un simple \xAB Yes. \xBB ou \xAB No. \xBB para\xEEt souvent trop sec, voire impoli. C'est pourquoi on ajoute le pronom + l'auxiliaire aux questions oui/non.","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + pronom + did.  |  No, + pronom + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"Aux questions en \xAB Was/Were\u2026? \xBB, on r\xE9pond bien s\xFBr avec was/were (\xAB Yes, I was. \xBB / \xAB No, they weren\u2019t. \xBB), pas avec did !","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"Dans les r\xE9ponses courtes, on ne r\xE9p\xE8te JAMAIS le verbe principal (donc PAS \xAB Yes, I did played \xBB).","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"Court, net et parfait : simplement \xAB Yes, I did. \xBB","Das Hilfsverb in der Antwort passt immer zur Frage!":"L'auxiliaire de la r\xE9ponse correspond toujours \xE0 la question !","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\xAB Vous avez vaincu l'Ender Dragon ? \xBB \u2014 \xAB Oui ! \xBB","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\xAB Mia a perdu son cheval ? \xBB \u2014 \xAB Non. \xBB","was & were (Aussage)":"was et were (affirmation)","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"Le verbe \xAB to be \xBB","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\xAB was \xBB et \xAB were \xBB sont les formes pass\xE9es de \xAB be \xBB (\xEAtre \u2192 \xE9tait / \xE9taient). Avec elles, tu d\xE9cris des \xE9tats, des sentiments, des lieux et des qualit\xE9s dans le pass\xE9.","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"Pense \xE0 \xAB you \xBB : m\xEAme si tu parles \xE0 UN seul ami, en anglais c'est TOUJOURS \xAB you were \xBB (jamais \xAB you was \xBB !).","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\xAB could \xBB (pouvait) se comporte comme was/were : il n'a pas besoin de \xAB did \xBB non plus.","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"Avec \xAB you \xBB, l'anglais standard utilise toujours \xAB were \xBB.","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\xAB My friends \xBB est au pluriel (= they) \u2192 \xAB were \xBB !","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"J'\xE9tais \xE9puis\xE9 apr\xE8s avoir construit cet immense pont.","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"Nos camarades de classe \xE9taient emball\xE9s par l'ascenseur en redstone.","wasn't / weren't & Fragen":"wasn't / weren't et questions","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"Pas de \xAB did \xBB !","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"Pour mettre \xAB was \xBB et \xAB were \xBB \xE0 la forme n\xE9gative ou poser des questions avec eux, tu n'as PAS besoin de \xAB did \xBB ! Ils sont assez forts pour se d\xE9brouiller seuls.","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"Sujet + wasn't / weren't   |   Was / Were + sujet + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"Pour les questions, \xAB Was \xBB ou \xAB Were \xBB passe simplement devant le sujet : \xAB You were online. \xBB \u2192 \xAB Were you online? \xBB","Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C).":"Pareil pour \xAB could \xBB : n\xE9gation \xAB couldn\u2019t \xBB (pas \xAB didn\u2019t could \xBB) et question \xAB Could you\u2026? \xBB (pas \xAB Did you could\u2026? \xBB).","Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!":"Ne m\xE9lange jamais \xAB did \xBB avec \xAB was/were \xBB !","Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.":"La n\xE9gation de \xAB be \xBB est toujours \xAB wasn\u2019t \xBB ou \xAB weren\u2019t \xBB.","Hattest du Angst, als das H\xF6hlenger\xE4usch lief?":"Tu as eu peur quand le bruit de la grotte a retenti ?","Der Server war w\xE4hrend der Wartung nicht online.":"Le serveur n'\xE9tait pas en ligne pendant la maintenance.","There was / There were":"There was / There were","Es gab (Einzahl & Mehrzahl)":"Il y avait (singulier et pluriel)",Beschreiben:"D\xE9crire","Perfekt, um deine Minecraft-Welt oder ein Erlebnis zu beschreiben: \u201EEs gab eine H\xF6hle\u2026\u201C oder \u201EEs waren drei Zombies da\u2026\u201C.":"Parfait pour d\xE9crire ton monde Minecraft ou une aventure : \xAB Il y avait une grotte\u2026 \xBB ou \xAB Il y avait trois zombies\u2026 \xBB.","There was + Einzahl (a/an/one)   |   There were + Mehrzahl (two, many, some...)":"There was + singulier (a/an/one)   |   There were + pluriel (two, many, some...)","Verneinung: \u201EThere wasn\u2019t any lava.\u201C / \u201EThere weren\u2019t any Creepers.\u201C Frage: \u201EWas there a chest?\u201C / \u201EWere there any villagers?\u201C":"N\xE9gation : \xAB There wasn\u2019t any lava. \xBB / \xAB There weren\u2019t any Creepers. \xBB Question : \xAB Was there a chest? \xBB / \xAB Were there any villagers? \xBB","Im Deutschen sagt man immer \u201EEs gab\u2026\u201C (egal ob ein Creeper oder zehn). Im Englischen musst du genau auf Einzahl (was) vs. Mehrzahl (were) achten!":"En fran\xE7ais, on dit toujours \xAB il y avait\u2026 \xBB (qu'il y ait un Creeper ou dix). En anglais, il faut bien faire attention au singulier (was) ou au pluriel (were) !","F\xFCnf Zombies = Plural \u2192 \u201EThere were\u201C!":"Cinq zombies = pluriel \u2192 \xAB There were \xBB !","\u201EEs gab\u201C hei\xDFt NIEMALS \u201Eit gave\u201C, sondern immer \u201EThere was / There were\u201C!":"\xAB Il y avait \xBB ne se dit JAMAIS \xAB it had \xBB, mais toujours \xAB There was / There were \xBB !","Es gab einen Schmied mit Diamantstiefeln im Dorf.":"Il y avait un forgeron avec des bottes en diamant dans le village.","Es gab zwanzig Fackeln, die den Tunnel beleuchteten.":"Il y avait vingt torches qui \xE9clairaient le tunnel.","Signalw\xF6rter (yesterday, ago, last...)":"Marqueurs de temps (yesterday, ago, last...)","Die Zeitportal-Marker des Past Simple":"Les balises du portail temporel du Past Simple","Zeit-Kompass":"Boussole du temps","Signalw\xF6rter verraten dir in Tests sofort, dass du das Past Simple benutzen musst. Sie zeigen an, dass ein Zeitpunkt komplett in der Vergangenheit liegt.":"En contr\xF4le, les marqueurs de temps te disent tout de suite qu'il faut le Past Simple. Ils montrent qu'un moment est compl\xE8tement dans le pass\xE9.","yesterday \xB7 last night/week/year \xB7 [Zeit] + ago \xB7 in 2023 \xB7 when I was...":"yesterday \xB7 last night/week/year \xB7 [dur\xE9e] + ago \xB7 in 2023 \xB7 when I was...","Wortstellung im Englischen: Zeitangaben stehen am SATZENDE (oder ganz am Satzanfang) \u2013 niemals zwischen Verb und Objekt!":"Ordre des mots en anglais : les expressions de temps se placent en FIN de phrase (ou tout au d\xE9but) \u2013 jamais entre le verbe et le compl\xE9ment !","\u201Evor zwei Tagen\u201C = \u201Etwo days ago\u201C (ago steht HINTER der Zahl). \u201Eletzte Woche\u201C = \u201Elast week\u201C (OHNE \u201Ethe\u201C!).":"\xAB il y a deux jours \xBB = \xAB two days ago \xBB (ago vient APR\xC8S le nombre). \xAB la semaine derni\xE8re \xBB = \xAB last week \xBB (SANS \xAB the \xBB !).","\u201Eago\u201C steht hinter der Zeitspanne und die Zeitangabe am Satzende.":"\xAB ago \xBB se place apr\xE8s la dur\xE9e, et l'expression de temps en fin de phrase.","Im Englischen bleibt immer Subjekt vor Verb (we played)!":"En anglais, le sujet reste toujours devant le verbe (we played) !","Wir haben den Enderdrachen vor zwei Wochen besiegt.":"Nous avons vaincu l'Ender Dragon il y a deux semaines.","Gestern Abend habe ich eine automatische Bambusfarm gebaut.":"Hier soir, j'ai construit une ferme \xE0 bambous automatique.","Die Perfekt-Falle f\xFCr Deutsche":"Le pi\xE8ge du pass\xE9 compos\xE9","Past Simple vs. Present Perfect":"Past Simple vs. Present Perfect","Creeper-Falle #1":"Pi\xE8ge Creeper n\xB0 1","Im Deutschen erz\xE4hlen wir fast alles im Perfekt: \u201EIch HABE gestern gespielt.\u201C Wenn du das w\xF6rtlich ins Englische \xFCbersetzt (\u201EI have played yesterday\u201C), explodiert der Satz wie ein Creeper!":"En fran\xE7ais, on raconte presque tout au pass\xE9 compos\xE9 : \xAB J'AI jou\xE9 hier. \xBB Si tu traduis \xE7a mot \xE0 mot en anglais (\xAB I have played yesterday \xBB), la phrase explose comme un Creeper !","Fester Zeitpunkt in der Vergangenheit (yesterday, last, ago, When...?) \u2192 IMMER Past Simple!":"Moment pr\xE9cis dans le pass\xE9 (yesterday, last, ago, When...?) \u2192 TOUJOURS le Past Simple !","Das Present Perfect (\u201EI have played\u201C) nutzt man im Englischen nur ohne festen Vergangenheitszeitpunkt (z. B. Erfahrungen im Leben: \u201EHave you ever played Minecraft?\u201C).":"En anglais, le Present Perfect (\xAB I have played \xBB) ne s'utilise que sans moment pr\xE9cis dans le pass\xE9 (par ex. pour les exp\xE9riences de vie : \xAB Have you ever played Minecraft? \xBB).","Faustregel f\xFCr die Schule: Siehst du yesterday, last\u2026, \u2026ago, in 2022 oder When\u2026? \u2192 Finger weg von have/has! Nimm Past Simple!":"R\xE8gle d'or pour l'\xE9cole : si tu vois yesterday, last\u2026, \u2026ago, in 2022 ou When\u2026? \u2192 pas touche \xE0 have/has ! Prends le Past Simple !","\u201Eyesterday\u201C + Present Perfect ist im Englischen immer falsch!":"\xAB yesterday \xBB + Present Perfect est toujours faux en anglais !","\u201EWhen\u2026?\u201C fragt nach einem genauen Zeitpunkt \u2192 Past Simple!":"\xAB When\u2026? \xBB demande un moment pr\xE9cis \u2192 Past Simple !","Ich habe letzten Sonntag meine Oma besucht.":"J'ai rendu visite \xE0 ma grand-m\xE8re dimanche dernier.","Wir haben vor zehn Minuten ein cooles Minecraft-Tutorial geschaut.":"Nous avons regard\xE9 un super tuto Minec eljeznog oklopa. (craft)","\u201ECraft\u201C ist ein normales regelm\xE4\xDFiges Verb: einfach \u201E-ed\u201C anh\xE4ngen \u2192 crafted.":"\u201ECraft\u201D je obi\u010Dan pravilni glagol: samo dodaj \u201E-ed\u201D \u2192 crafted.","Ich versuchte, \xFCber den Lavafluss zu springen, und schaffte es gerade so! (try)":"Poku\u0161ao sam presko\u010Diti rijeku lave i jedva sam uspio! (try)","Rechtschreib-Regel: Endet ein Verb auf Konsonant + y (try), wird das \u201Ey\u201C zu \u201Eied\u201C \u2192 tried.":"Pravopisno pravilo: ako glagol zavr\u0161ava na suglasnik + y (try), \u201Ey\u201D postaje \u201Eied\u201D \u2192 tried.","Pl\xF6tzlich blieb der laute Zombie direkt vor unserer Eichent\xFCr stehen. (stop)":"Odjednom se bu\u010Dni zombi zaustavio to\u010Dno ispred na\u0161ih hrastovih vrata. (stop)","Bei kurzen Verben mit kurzem Vokal + einfachem Konsonanten am Ende (stop) wird der letzte Konsonant verdoppelt \u2192 stopped.":"Kratki glagoli s kratkim samoglasnikom + jednim suglasnikom na kraju (stop) udvostru\u010Duju zadnji suglasnik \u2192 stopped.","Letzten Samstag spielten mein bester Freund und ich zwei Stunden lang BedWars. (play)":"Pro\u0161le subote moj najbolji prijatelj i ja igrali smo BedWars dva sata. (play)","Achtung! Steht vor dem \u201Ey\u201C ein Vokal (a, e, o, u wie in \u201Eplay\u201C), bleibt das \u201Ey\u201C einfach stehen \u2192 played (NICHT plaied!).":"Pazi! Ako ispred \u201Ey\u201D stoji samoglasnik (a, e, o, u kao u \u201Eplay\u201D), \u201Ey\u201D ostaje \u2192 played (NE plaied!).","Ups! Ich lie\xDF mein verzaubertes Diamantschwert versehentlich in den Kaktus fallen! (drop)":"Ups! Slu\u010Dajno sam ispustio svoj za\u010Darani dijamantni ma\u010D u kaktus! (drop)","\u201EDrop\u201C ist kurz und endet auf Vokal + Konsonant (o + p) \u2192 das \u201Ep\u201C wird verdoppelt: dropped.":"\u201EDrop\u201D je kratak i zavr\u0161ava na samoglasnik + suglasnik (o + p) \u2192 \u201Ep\u201D se udvostru\u010Duje: dropped.","Vor dem Zocken am Freitag a engleskom je jednostavno \u201EYes, we did!\u201D (bez ponavljanja glavnog glagola).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: nije\u010Dnica s \u201Edidn\u2019t\u201D)","Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen.":"Smisao: Sino\u0107 nisam zaboravio doma\u0107u zada\u0107u.","Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!":"Nakon \u201Edidn\u2019t\u201D glagol se vra\u0107a u 1. oblik (osnovni oblik): \u201Edidn\u2019t forget\u201D \u2013 nikad \u201Edidn\u2019t forgot\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: pitanja s \u201EDid\u201D)","Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?":"Smisao: Gdje si ju\u010Der skinuo tu super Minecraft mapu?","Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!":"Formula pitanja: upitna rije\u010D (Where) + did + subjekt (you) + osnovni oblik (download) \u2192 bez \u201E-ed\u201D na glagolu!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: \u201Edidn\u2019t\u201D s nepravilnim glagolima)","Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab.":"Smisao: Nismo vidjeli dijamante, pa smo umjesto toga kopali \u017Eeljezo.","Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).":"U prvom dijelu stoji \u201Edidn\u2019t + osnovni oblik\u201D (didn\u2019t see), a u drugom obi\u010Dna potvrdna re\u010Denica u Past Simpleu (mined).","Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)":"Bio sam jako nervozan kad sam \u010Duo otkucaje srca Wardena. (be)","Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.":"Uz I / he / she / it u Past Simpleu uvijek se koristi \u201Ewas\u201D.","Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)":"Moji prijatelji i ja bili smo na samom vrhu planinske baze kad je po\u010Dela oluja. (be)","\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!":"\u201EMy friends and I\u201D = we (mno\u017Eina) \u2192 zato ovdje ide \u201Ewere\u201D!","Warst du gestern Abend auf unserem Schul-SMP-Server online?":"Jesi li sino\u0107 bio online na na\u0161em \u0161kolskom SMP serveru?","Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!":"Uz \u201Eyou\u201D uvijek stoji \u201Ewere\u201D \u2013 a uz was/were NIKAD se ne koristi \u201Edid\u201D!","Es gab drei Baby-Pandas im Bambusdschungel. (There be)":"U bambusovoj d\u017Eungli bila su tri mladun\u010Deta pande. (There be)","\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.":"\u201EThree baby pandas\u201D je mno\u017Eina \u2192 \u201EThere were\u201D (bilo je). Za jedninu se koristi \u201EThere was\u201D.","Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)":"Test iz matematike nije bio tako te\u017Eak kako sam se bojao. (not be)","\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).":"\u201EThe maths test\u201D = it \u2192 nije\u010Dni oblik od \u201Ewas\u201D je jednostavno \u201Ewasn\u2019t\u201D (bez \u201Edidn\u2019t\u201D!).","Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)":"Zahvaljuju\u0107i elitrama mogao sam kliziti preko cijelog golemog oceana. (can \u2192 Past Simple)","Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.":"Pro\u0161lo vrijeme od \u201Ecan\u201D je \u201Ecould\u201D (mogao sam). Ne treba mu \u201Edid\u201D i isti je za sva lica.","Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!":"To\u010Dno ispod tepiha u \u0161umskoj vili bila su skrivena vrata\u0161ca!","\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.":"\u201EA hidden trapdoor\u201D je jednina \u2192 zato \u201EThere was\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: pitanje s \u201Ewere\u201D)","Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?":"Smisao: Jeste li bili umorni nakon duge borbe s bossom?","\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?":"\u201Ewas\u201D i \u201Ewere\u201D su jaki glagoli: NE trebaju \u201Edid\u201D! Samo zamijeni\u0161 mjesta subjektu i \u201Ewere\u201D \u2192 Were you tired?","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201D)","Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war.":"Smisao: Seljani nisu bili u svojim ku\u0107ama jer je jo\u0161 bio dan.","\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.":"\u201EThe villagers\u201D = they (mno\u017Eina) \u2192 \u201Eweren\u2019t\u201D. Uz \u201Ebe\u201D u Past Simpleu nikad se ne koristi \u201Edidn\u2019t\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: \u201Ecouldn\u2019t\u201D)","Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte.":"Smisao: Sino\u0107 nisam mogao upaliti portal jer mi je nedostajao kremen.","\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).":"\u201ECouldn\u2019t\u201D ne treba \u201Edid\u201D i uvijek stoji s osnovnim oblikom glagola (\u201Ecouldn\u2019t light\u201D).","Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!":"Pazi, hrvatska zamka! Na hrvatskom ka\u017Eemo \u201EJu\u010Der sam gradio\u201D, ali na engleskom uz \u201Eyesterday\u201D ide Past Simple!","Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!":"Hrvatska zamka br. 1! Uz oznake poput \u201Eyesterday\u201D (zavr\u0161ena pro\u0161lost) NIKAD ne smije stajati Present Perfect (\u201Ehave built\u201D) \u2013 uvijek Past Simple: \u201Ebuilt\u201D!","Unsere Klasse startete diese Minecraft-Welt vor drei Monaten.":"Na\u0161 razred zapo\u010Deo je ovaj Minecraft svijet prije tri mjeseca.","\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).":"\u201EPrije tri mjeseca\u201D na engleskom je \u201Ethree months ago\u201D \u2013 a \u201Eago\u201D uvijek stoji NA KRAJU vremenske oznake (ne ispred kao \u201Eprije\u201D!).","Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)":"Sino\u0107 smo prona\u0161li na\u0161u prvu Nether tvr\u0111avu. (find)","\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.":"\u201ELast night\u201D je jasna oznaka za Past Simple! Zato \u201Efound\u201D, a ne \u201Ehave found\u201D.","Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus.":"Kad sam imao deset godina, sagradio sam svoju prvu ku\u0107u od zemlje.","\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).":"\u201EWhen I was ten years old\u201D opisuje zavr\u0161en trenutak u pro\u0161losti \u2192 uvijek Past Simple (\u201Ewas\u201D).","Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)":"Mojang je objavio a\u017Euriranje Trial Chambers 2024. godine. (release)","Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).":"Uz pro\u0161le godine poput \u201Ein 2024\u201D engleski uvijek koristi Past Simple \u2192 \u201Ereleased\u201D (nikakav Present Perfect!).","Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz.":"Pro\u0161log tjedna na\u0161 nam je profesor engleskog dao super zabavan kviz o igrama.","\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).":"\u201EPro\u0161log tjedna / pro\u0161log mjeseca / pro\u0161le godine\u201D na engleskom je \u201Elast week / last month / last year\u201D (bez \u201Ethe\u201D!).","Wann hast du angefangen, Minecraft zu spielen? (start)":"Kada si po\u010Deo igrati Minecraft? (start)","Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!":"Pitanja s \u201EWhen\u2026?\u201D pitaju za odre\u0111eni trenutak u pro\u0161losti \u2192 UVIJEK Past Simple (\u201EWhen did you start\u2026?\u201D), nikad Present Perfect!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: zamka perfekta s \u201Eyesterday\u201D)","Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt.":"Smisao: Ju\u010Der sam dva sata igrao Minecraft.","Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.":"\u010Cim u re\u010Denici stoji \u201Eyesterday\u201D, \u201Ehave played\u201D je zabranjen! A engleski red rije\u010Di je subjekt \u2013 glagol \u2013 objekt \u2013 vrijeme.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: red rije\u010Di s \u201Eago\u201D)","Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen.":"Smisao: Moj je prijatelj prije dva dana vidio rijetko stado ru\u017Ei\u010Dastih ovaca.","Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).":"Vremenske oznake s \u201Eago\u201D stoje na kraju re\u010Denice (ili sasvim na po\u010Detku), a \u201Eago\u201D dolazi IZA vremenskog razdoblja: \u201Etwo days ago\u201D + Past Simple (\u201Esaw\u201D).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)":"Koja je re\u010Denica u Past Simpleu gramati\u010Dki TO\u010CNA? (Fokus: red rije\u010Di kod vremenskih oznaka)","Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut.":"Smisao: Sino\u0107 smo u Survival na\u010Dinu sagradili novu bazu.","Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!":"Englesko pravilo S-V-O: subjekt (We) + glagol (built) + objekt (a new base) + mjesto (in Survival mode) + vrijeme (last night). Bez slobodnog reda rije\u010Di kao na hrvatskom (\u201ESino\u0107 smo sagradili\u2026\u201D)!","mine \u2192 mined \xB7 craft \u2192 crafted":"mine \u2192 mined \xB7 craft \u2192 crafted","Basis-Rezept":"Osnovni recept","Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.":"Past Simple koristi\u0161 za radnje koje su potpuno zavr\u0161ene u pro\u0161losti (npr. ju\u010Der, pro\u0161log tjedna, na praznicima). Ve\u0107ini engleskih glagola samo dodaje\u0161 \u201E-ed\u201D.","Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)":"Subjekt + osnovni oblik + -ed  (isto za SVA lica!)","Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.":"Genijalno jednostavno: u Past Simpleu NEMA \u201E-s\u201D uz he/she/it! I played, he played, we played \u2013 svugdje isti oblik.","Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).":"Tipi\u010Dne oznake: yesterday, last week, in 2024, two days ago. Ako glagol zavr\u0161ava na \u201E-e\u201D (mine, live, love), dodaje\u0161 samo \u201E-d\u201D (mined, lived).","Kein \u201E-s\u201C bei he/she/it im Past Simple!":"Bez \u201E-s\u201D uz he/she/it u Past Simpleu!","Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.":"Uz nijemo \u201E-e\u201D na kraju dodaje se samo \u201E-d\u201D.","Ich baute gestern sechzig Bl\xF6cke Eisen ab.":"Ju\u010Der sam iskopao \u0161ezdeset blokova \u017Eeljeza.","Sie craftete vor dem Raid einen neuen Schild.":"Prije napada izradila je novi \u0161tit.","Rechtschreib-Regeln (-ed)":"Pravopisna pravila (-ed)","try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played":"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",Rechtschreibung:"Pravopis","Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!":"Kod nekih pravilnih glagola pravopis se malo mijenja kad doda\u0161 \u201E-ed\u201D. Ta 3 pravila do\u0111u u gotovo svakom testu iz engleskog!","Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed":"suglasnik + y \u2192 -ied  |  samoglasnik + y \u2192 -yed  |  kratak samoglasnik + suglasnik \u2192 udvostru\u010Deni suglasnik + -ed","1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"Pazi kod dvoslo\u017Enih glagola poput \u201Evisit\u201D ili \u201Eopen\u201D: budu\u0107i da je nagla\u0161en PRVI slog, zadnje se slovo NE udvostru\u010Duje (visited, opened).","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"Suglasnik + y postaje -ied; kratki \u201Edrop\u201D udvostru\u010Duje p!","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"Ispred y stoji samoglasnik (a) \u2192 y ostaje!","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"Max je nau\u010Dio engleske rije\u010Di i onda igrao Minecraft.","Das Skelett blieb direkt vor unserer Mauer stehen.":"Kostur se zaustavio to\u010Dno ispred na\u0161eg zida.","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"Znanje s nakovnja","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"Mnogi od naj\u010De\u0161\u0107ih engleskih glagola (i\u0107i, graditi, na\u0107i, boriti se, vidjeti) ne slijede pravilo \u201E-ed\u201D. Imaju svoj 2. oblik, koji treba nau\u010Diti napamet.","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"Subjekt + 2. oblik glagola (Past Simple)  \u2014 npr. go \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"Va\u017Eno: 2. oblik koristi\u0161 SAMO u potvrdnim re\u010Denicama! \u010Cim se pojavi \u201Edid\u201D ili \u201Edidn\u2019t\u201D, glagol se vra\u0107a u 1. oblik.","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"Ne mije\u0161aj 2. oblik (Past Simple: broke, saw, went) s 3. oblikom (particip: broken, seen, gone). 3. oblik treba\u0161 tek za Present Perfect ili pasiv.","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"Nikad ne dodaji \u201E-ed\u201D nepravilnim glagolima!","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\u201Eseen\u201D je 3. oblik \u2013 u Past Simpleu uvijek 2. oblik \u201Esaw\u201D!","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"Kopali smo do razine -58 i na\u0161li osam dijamanata.","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"Leo se borio protiv Ender Dragona i pobijedio u igri.","Verneinung mit didn't":"Nije\u010Dnica s didn't","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"Najva\u017Enije pravilo!","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"Kad \u017Eeli\u0161 re\u0107i da se ne\u0161to NIJE dogodilo u pro\u0161losti, svi obi\u010Dni glagoli (osim be i could) trebaju pomo\u0107ni glagol \u201Edidn\u2019t\u201D (= did not).","Subjekt + didn't + Grundform (1. Form des Verbs)":"Subjekt + didn't + osnovni oblik (1. oblik glagola)","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"Trik za pam\u0107enje: \u201EDid ve\u0107 ima pro\u0161lost u inventaru!\u201D Zato glavni glagol iza njega UVIJEK ostaje u osnovnom obliku (bez -ed i bez 2. oblika).","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"Vrijedi jednako za pravilne I nepravilne glagole: \u201Edidn\u2019t play\u201D, \u201Edidn\u2019t go\u201D, \u201Edidn\u2019t build\u201D. Jedine iznimke: was/were (\u2192 wasn\u2019t/weren\u2019t) i could (\u2192 couldn\u2019t).","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"Naj\u010De\u0161\u0107a gre\u0161ka u testovima: nakon \u201Edidn\u2019t\u201D nikad 2. oblik!","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"Na engleskom \u201Enot\u201D nikad ne mo\u017Ee stajati sam ispred glavnog glagola.","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"Nisam izgubio ma\u010D jer sam ga \u010Duvao u svojoj Ender \u0161krinji.","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"Nismo dovr\u0161ili krov prije zalaska sunca.","Entscheidungsfragen (Did you...?)":"Da/ne pitanja (Did you...?)","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"Da/ne pitanja","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"Da postavi\u0161 da/ne pitanje o pro\u0161losti (\u201EJesi li na\u0161ao\u2026?\u201D / \u201EJesi li sagradio\u2026?\u201D), samo stavi\u0161 \u201EDid\u201D na sam po\u010Detak re\u010Denice.","Did + Subjekt + Grundform (1. Form) + ...?":"Did + subjekt + osnovni oblik (1. oblik) + ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"I ovdje \u201EDid\u201D glagolu krade nastavak za pro\u0161lost! Dakle \u201EDid you mine?\u201D (NE \u201EDid you mined?\u201D).","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"Na hrvatskom pitamo \u201EJesi li ju\u010Der igrao?\u201D \u2013 ali za zavr\u0161enu pro\u0161lost engleski ka\u017Ee \u201EDid you play yesterday?\u201D!","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"Nakon \u201EDid\u201D uvijek dolazi osnovni oblik \u201Efind\u201D!","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"Na engleskom glavni se glagol ne mo\u017Ee samo premjestiti naprijed \u2013 treba \u201EDid\u201D.","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"Jesi li donio dovoljno baklji za \u0161pilju?","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"Je li Tom dovr\u0161io zada\u0107u iz matematike prije Discorda?","W-Fragen (What / Where / Why did...?)":"Pitanja s W (What / Where / Why did...?)","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"Pitanja s W","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"Ako \u017Eeli\u0161 preciznije informacije (\u0160to? Gdje? Kada? Za\u0161to? Kako?), samo stavi\u0161 englesku upitnu rije\u010D to\u010Dno ispred \u201Edid\u201D.","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"Upitna rije\u010D (What/Where/When/Why/How) + did + subjekt + osnovni oblik?","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"Pazi na \u201EWho\u201D kao pitanje za subjekt (\u201ETko je to sagradio?\u201D): tu \u201Edid\u201D otpada \u2192 \u201EWho built this castle?\u201D (2. oblik!).","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"Pitanja s \u201EWhen\u2026?\u201D na engleskom su gotovo uvijek u Past Simpleu (\u201EWhen did you start?\u201D), jer pitaju za odre\u0111eni trenutak.","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"Osnovni oblik \u201Ego\u201D nakon \u201Edid\u201D!","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"Ne zaboravi pomo\u0107ni glagol \u201Edid\u201D!","Wo hast du die Diamanttruhe versteckt?":"Gdje si sakrio \u0161krinju s dijamantima?","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"Za\u0161to je Creeper eksplodirao blizu na\u0161e farme?","Kurzantworten (Yes, I did)":"Kratki odgovori (Yes, I did)","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"Pristojno i to\u010Dno","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"Na engleskom samo \u201EYes.\u201D ili \u201ENo.\u201D \u010Desto zvu\u010Di prekratko ili nepristojno. Zato se kod da/ne pitanja dodaje zamjenica + pomo\u0107ni glagol.","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + zamjenica + did.  |  No, + zamjenica + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"Na pitanja s \u201EWas/Were\u2026?\u201D odgovara se naravno s was/were (\u201EYes, I was.\u201D / \u201ENo, they weren\u2019t.\u201D), a ne s did!","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"U kratkim odgovorima NIKAD se ne ponavlja glavni glagol (dakle NE \u201EYes, I did played\u201D).","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"Kratko, jasno i savr\u0161eno: samo \u201EYes, I did.\u201D","Das Hilfsverb in der Antwort passt immer zur Frage!":"Pomo\u0107ni glagol u odgovoru uvijek odgovara pitanju!","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\u201EJeste li pobijedili Ender Dragona?\u201D \u2014 \u201EDa, jesmo!\u201D","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\u201EJe li Mia izgubila konja?\u201D \u2014 \u201ENe, nije.\u201D","was & were (Aussage)":"was i were (izjava)","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"Glagol \u201Eto be\u201D","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\u201Ewas\u201D i \u201Ewere\u201D su oblici pro\u0161log vremena od \u201Ebe\u201D (biti \u2192 bio / bili). Njima opisuje\u0161 stanja, osje\u0107aje, mjesta i osobine u pro\u0161losti.","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"Misli na \u201Eyou\u201D: \u010Dak i kad se obra\u0107a\u0161 samo JEDNOM prijatelju, na engleskom je UVIJEK \u201Eyou were\u201D (nikad \u201Eyou was\u201D!).","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\u201Ecould\u201D (mogao sam) pona\u0161a se jednako jako kao was/were: ni njemu ne treba \u201Edid\u201D.","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"Uz \u201Eyou\u201D standardni engleski uvijek koristi \u201Ewere\u201D.","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\u201EMy friends\u201D je mno\u017Eina (= they) \u2192 \u201Ewere\u201D!","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"Bio sam iscrpljen nakon \u0161to sam sagradio onaj golemi most.","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"Na\u0161i su kolege iz razreda bili odu\u0161evljeni redstone dizalom.","wasn't / weren't & Fragen":"wasn't / weren't i pitanja","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"Bez \u201Edid\u201D!","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"Da \u201Ewas\u201D i \u201Ewere\u201D stavi\u0161 u nije\u010Dnicu ili postavi\u0161 pitanje s njima, NE treba\u0161 \u201Edid\u201D! Dovoljno su jaki da to rije\u0161e sami.","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"Subjekt + wasn't / weren't   |   Was / Were + subjekt + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"U pitanjima \u201EWas\u201D ili \u201EWere\u201D samo ide naprijed, ispred subjekta: \u201EYou were online.\u201D \u2192 \u201EWere you online?\u201D","Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C).":"Isto vrijedi za \u201Ecould\u201D: nije\u010Dnica \u201Ecouldn\u2019t\u201D (ne \u201Edidn\u2019t could\u201D) i pitanje \u201ECould you\u2026?\u201D (ne \u201EDid you could\u2026?\u201D).","Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!":"Nikad ne mije\u0161aj \u201Edid\u201D s \u201Ewas/were\u201D!","Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.":"Nije\u010Dni oblik od \u201Ebe\u201D uvijek je \u201Ewasn\u2019t\u201D ili \u201Eweren\u2019t\u201D.","Hattest du Angst, als das H\xF6hlenger\xE4usch lief?":"Jesi li se bojao kad se za\u010Duo zvuk \u0161pilje?","Der Server war w\xE4hrend der Wartung nicht online.":"Server nije bio online tijekom odr\u017Eavanja.","There was / There were":"There was / There were","Es gab (Einzahl & Mehrzahl)":"Bilo je (jednina i mno\u017Eina)",Beschreiben:"Opisivanje","Perfekt, um deine Minecraft-Welt oder ein Erlebnis zu beschreiben: \u201EEs gab eine H\xF6hle\u2026\u201C oder \u201EEs waren drei Zombies da\u2026\u201C.":"Savr\u0161eno za opis tvog Minecraft svijeta ili do\u017Eivljaja: \u201EBila je jedna \u0161pilja\u2026\u201D ili \u201EBila su tri zombija\u2026\u201D.","There was + Einzahl (a/an/one)   |   There were + Mehrzahl (two, many, some...)":"There was + jednina (a/an/one)   |   There were + mno\u017Eina (two, many, some...)","Verneinung: \u201EThere wasn\u2019t any lava.\u201C / \u201EThere weren\u2019t any Creepers.\u201C Frage: \u201EWas there a chest?\u201C / \u201EWere there any villagers?\u201C":"Nije\u010Dnica: \u201EThere wasn\u2019t any lava.\u201D / \u201EThere weren\u2019t any Creepers.\u201D Pitanje: \u201EWas there a chest?\u201D / \u201EWere there any villagers?\u201D","Im Deutschen sagt man immer \u201EEs gab\u2026\u201C (egal ob ein Creeper oder zehn). Im Englischen musst du genau auf Einzahl (was) vs. Mehrzahl (were) achten!":"Na hrvatskom \u010Desto ka\u017Eemo \u201Ebilo je\u2026\u201D bez obzira je li jedan Creeper ili deset. Na engleskom mora\u0161 paziti na jedninu (was) i mno\u017Einu (were)!","F\xFCnf Zombies = Plural \u2192 \u201EThere were\u201C!":"Pet zombija = mno\u017Eina \u2192 \u201EThere were\u201D!","\u201EEs gab\u201C hei\xDFt NIEMALS \u201Eit gave\u201C, sondern immer \u201EThere was / There were\u201C!":"\u201EBilo je\u201D NIKAD nije \u201Eit was\u201D ni \u201Eit had\u201D, nego uvijek \u201EThere was / There were\u201D!","Es gab einen Schmied mit Diamantstiefeln im Dorf.":"U selu je bio kova\u010D s dijamantnim \u010Dizmama.","Es gab zwanzig Fackeln, die den Tunnel beleuchteten.":"Dvadeset baklji osvjetljavalo je tunel.","Signalw\xF6rter (yesterday, ago, last...)":"Vremenske oznake (yesterday, ago, last...)","Die Zeitportal-Marker des Past Simple":"Oznake vremenskog portala za Past Simple","Zeit-Kompass":"Vremenski kompas","Signalw\xF6rter verraten dir in Tests sofort, dass du das Past Simple benutzen musst. Sie zeigen an, dass ein Zeitpunkt komplett in der Vergangenheit liegt.":"U testovima ti vremenske oznake odmah otkrivaju da treba\u0161 Past Simple. Pokazuju da je trenutak potpuno u pro\u0161losti.","yesterday \xB7 last night/week/year \xB7 [Zeit] + ago \xB7 in 2023 \xB7 when I was...":"yesterday \xB7 last night/week/year \xB7 [vrijeme] + ago \xB7 in 2023 \xB7 when I was...","Wortstellung im Englischen: Zeitangaben stehen am SATZENDE (oder ganz am Satzanfang) \u2013 niemals zwischen Verb und Objekt!":"Red rije\u010Di na engleskom: vremenske oznake stoje na KRAJU re\u010Denice (ili sasvim na po\u010Detku) \u2013 nikad izme\u0111u glagola i objekta!","\u201Evor zwei Tagen\u201C = \u201Etwo days ago\u201C (ago steht HINTER der Zahl). \u201Eletzte Woche\u201C = \u201Elast week\u201C (OHNE \u201Ethe\u201C!).":"\u201Eprije dva dana\u201D = \u201Etwo days ago\u201D (ago stoji IZA broja). \u201Epro\u0161log tjedna\u201D = \u201Elast week\u201D (BEZ \u201Ethe\u201D!).","\u201Eago\u201C steht hinter der Zeitspanne und die Zeitangabe am Satzende.":"\u201Eago\u201D stoji iza vremenskog razdoblja, a vremenska oznaka na kraju re\u010Denice.","Im Englischen bleibt immer Subjekt vor Verb (we played)!":"Na engleskom subjekt uvijek ostaje ispred glagola (we played)!","Wir haben den Enderdrachen vor zwei Wochen besiegt.":"Pobijedili smo Ender Dragona prije dva tjedna.","Gestern Abend habe ich eine automatische Bambusfarm gebaut.":"Sino\u0107 sam sagradio automatsku farmu bambusa.","Die Perfekt-Falle f\xFCr Deutsche":"Zamka perfekta za Hrvate","Past Simple vs. Present Perfect":"Past Simple vs. Present Perfect","Creeper-Falle #1":"Creeper-zamka br. 1","Im Deutschen erz\xE4hlen wir fast alles im Perfekt: \u201EIch HABE gestern gespielt.\u201C Wenn du das w\xF6rtlich ins Englische \xFCbersetzt (\u201EI have played yesterday\u201C), explodiert der Satz wie ein Creeper!":"Na hrvatskom gotovo sve pri\u010Damo u perfektu: \u201EJu\u010Der SAM igrao.\u201D Ako to doslovno prevede\u0161 na engleski (\u201EI have played yesterday\u201D), re\u010Denica eksplodira kao Creeper!","Fester Zeitpunkt in der Vergangenheit (yesterday, last, ago, When...?) \u2192 IMMER Past Simple!":"To\u010Dno odre\u0111en trenutak u pro\u0161losti (yesterday, last, ago, When...?) \u2192 UVIJEK Past Simple!","Das Present Perfect (\u201EI have played\u201C) nutzt man im Englischen nur ohne festen Vergangenheitszeitpunkt (z. B. Erfahrungen im Leben: \u201EHave you ever played Minecraft?\u201C).":"Present Perfect (\u201EI have played\u201D) na engleskom se koristi samo bez to\u010Dnog trenutka u pro\u0161losti (npr. \u017Eivotna iskustva: \u201EHave you ever played Minecraft?\u201D).","Faustregel f\xFCr die Schule: Siehst du yesterday, last\u2026, \u2026ago, in 2022 oder When\u2026? \u2192 Finger weg v
