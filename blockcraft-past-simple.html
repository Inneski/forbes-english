ugen zwei volle Shulker-Boxen zur\xFCck zu unserer Base.":"Clue: carry ends in consonant + y.","Bei \u201Ecarry\u201C steht der Konsonant \u201Er\u201C vor dem \u201Ey\u201C, deshalb wird das \u201Ey\u201C zu \u201Ei\u201C + \u201E-ed\u201C \u2192 carried.":"In \u201Ccarry\u201D the consonant \u201Cr\u201D comes before the \u201Cy\u201D, so the \u201Cy\u201D becomes \u201Ci\u201D + \u201C-ed\u201D \u2192 carried.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verdopplung bei \u201Eplan\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: doubling with \u201Cplan\u201D)","Sinn: Unsere Klasse plante letzte Woche eine riesige Mittelalterstadt auf dem Server.":"Clue: plan has a short vowel and ends in one consonant.","\u201EPlan\u201C hat einen kurzen betonten Vokal vor einem einzelnen Konsonanten \u2192 das \u201En\u201C wird verdoppelt: planned (\u201Eplaned\u201C w\xE4re \u201Ehobelte\u201C).":"\u201CPlan\u201D has a short stressed vowel before a single consonant \u2192 the \u201Cn\u201D doubles: planned (\u201Cplaned\u201D means smoothing wood with a plane).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Evisit\u201C & \u201Estay\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: \u201Cvisit\u201D & \u201Cstay\u201D)","Sinn: Wir besuchten das W\xFCstendorf und blieben bis zum Sonnenaufgang.":"Clue: visit is stressed on the first syllable; stay has a vowel before the y.","\u201EVisit\u201C wird auf der ersten Silbe betont (kein Doppel-t \u2192 visited) und bei \u201Estay\u201C steht ein Vokal vor dem \u201Ey\u201C (\u2192 stayed).":"\u201CVisit\u201D is stressed on the first syllable (no double t \u2192 visited), and \u201Cstay\u201D has a vowel before the \u201Cy\u201D (\u2192 stayed).","Letztes Wochenende bauten meine Freunde und ich einen unterirdischen Redstone-Bunker. (build)":"Verb: build \u2013 irregular, no -ed. (build)","\u201EBuild\u201C ist unregelm\xE4\xDFig: build \u2013 built \u2013 built. Niemals \u201Ebuilded\u201C!":"\u201CBuild\u201D is irregular: build \u2013 built \u2013 built. Never \u201Cbuilded\u201D!","Tim grub eine Treppe ganz hinunter bis H\xF6he -58, um Diamanten zu suchen. (dig)":"Verb: dig \u2013 irregular. (dig)","Die 2. Form von \u201Edig\u201C (graben) ist \u201Edug\u201C (dig \u2013 dug \u2013 dug).":"The 2nd form of \u201Cdig\u201D is \u201Cdug\u201D (dig \u2013 dug \u2013 dug).","Rate mal! Ich fand eine Truhe mit zwei verzauberten goldenen \xC4pfeln! (find)":"Verb: find \u2013 irregular. (find)","\u201EFind\u201C wird im Past Simple zu \u201Efound\u201C (find \u2013 found \u2013 found). \u201EFounded\u201C bedeutet \u201Egr\xFCndete\u201C (z. B. eine Firma).":"\u201CFind\u201D becomes \u201Cfound\u201D in the Past Simple (find \u2013 found \u2013 found). \u201CFounded\u201D means started something, e.g. a company.","Wir gingen durch das lila Portal und landeten direkt neben einer Bastion. (go)":"Verb: go \u2013 irregular. (go)","Eines der wichtigsten unregelm\xE4\xDFigen Verben: go \u2013 went \u2013 gone. Im Past Simple immer \u201Ewent\u201C!":"One of the most important irregular verbs: go \u2013 went \u2013 gone. In the Past Simple it is always \u201Cwent\u201D!","Zusammen bek\xE4mpfte unser Squad den Enderdrachen und rettete die End-Insel. (fight)":"Verb: fight \u2013 irregular, spelt with \u201Cou\u201D. (fight)","\u201EFight\u201C hat die unregelm\xE4\xDFige 2. Form \u201Efought\u201C (mit \u201Eou\u201C, genau wie bought und thought).":"\u201CFight\u201D has the irregular 2nd form \u201Cfought\u201D (with \u201Cou\u201D, just like bought and thought).","Oh nein! Meine Eisenspitzhacke zerbrach genau dann, als ich die Obsidianwand erreichte. (break)":"Verb: break \u2013 irregular. (break)","break \u2013 broke \u2013 broken. F\xFCr das Past Simple brauchst du die 2. Form: \u201Ebroke\u201C.":"break \u2013 broke \u2013 broken. For the Past Simple you need the 2nd form: \u201Cbroke\u201D.","Auf dem Dorfmarkt kaufte Jonas ein Reparatur-Buch f\xFCr 14 Smaragde. (buy)":"Verb: buy \u2013 irregular, spelt with \u201Cou\u201D. (buy)","buy \u2013 bought \u2013 bought (kaufen). Nicht verwechseln mit \u201Ebrought\u201C (= brachte, von bring)!":"buy \u2013 bought \u2013 bought. Don't mix it up with \u201Cbrought\u201D (from bring)!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Efall\u201C & \u201Elose\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: \u201Cfall\u201D & \u201Close\u201D)","Sinn: Ich fiel in eine tiefe Schlucht und verlor alle meine Fackeln.":"Clue: you need the past of fall and the past of lose.","fall \u2013 fell \u2013 fallen (fiel) und lose \u2013 lost \u2013 lost (verlor). \u201EFelt\u201C kommt von \u201Efeel\u201C (f\xFChlen), nicht von \u201Efall\u201C!":"fall \u2013 fell \u2013 fallen and lose \u2013 lost \u2013 lost. \u201CFelt\u201D comes from \u201Cfeel\u201D, not from \u201Cfall\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Esee\u201C & \u201Eswim\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: \u201Csee\u201D & \u201Cswim\u201D)","Sinn: Wir sahen ein Ozeanmonument und schwammen schnell zur Oberfl\xE4che zur\xFCck.":"Clue: you need the past of see and the past of swim.","Beide Verben sind unregelm\xE4\xDFig: see \u2192 saw (2. Form) und swim \u2192 swam (2. Form).":"Both verbs are irregular: see \u2192 saw (2nd form) and swim \u2192 swam (2nd form).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewrite\u201C & \u201Ewin\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: \u201Cwrite\u201D & \u201Cwin\u201D)","Sinn: Ben schrieb eine gute Englischarbeit und gewann abends das Minecraft-Turnier.":"Clue: you need the past of write and the past of win.","write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!":"write \u2013 wrote \u2013 written and win \u2013 won \u2013 won. Both are in the 2nd form!","Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)":"Negative of go \u2013 did not. (not go)","Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!).":"Golden rule: after \u201Cdidn\u2019t\u201D you ALWAYS use the base form (infinitive) \u2192 didn\u2019t go (NEVER didn\u2019t went!).","Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)":"A question about yesterday with the verb find. (find)","Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?":"Past Simple questions are made with \u201CDid + subject + base form\u201D \u2192 Did you find...?","Was hat Steve mit all dem Redstone-Staub gebaut? (build)":"A What-question with the verb build. (build)","Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?":"With wh-questions (What / Where / Why) too: \u201Cdid\u201D already carries the past, so the verb stays in the base form \u2192 What did Steve build?","Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C":"Short answer: No + he + the helping verb from the question.","Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C.":"When a question starts with \u201CDid\u2026?\u201D, you give a short answer with \u201CYes, \u2026 did\u201D or \u201CNo, \u2026 didn\u2019t\u201D.","Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)":"A negative Why-question with the verb take. (not take)","Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?":"Negative wh-question in the Past Simple: \u201CWhy didn\u2019t + subject + base form\u201D \u2192 Why didn\u2019t Lukas take...?","Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)":"Negative of destroy \u2013 did not. (not destroy)","F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy.":"To make ordinary verbs negative in the Past Simple you always need \u201Cdidn\u2019t\u201D + base form \u2192 didn\u2019t destroy.","Kurzantwort: \u201EJa, das haben wir!\u201C":"Short answer: Yes + we + the helping verb from the question.","Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen).":"To \u201CDid you and Mia\u2026?\u201D the correct short answer is simply \u201CYes, we did!\u201D (without repeating the main verb).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: negatives with \u201Cdidn\u2019t\u201D)","Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen.":"Clue: a negative with forget.","Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!":"After \u201Cdidn\u2019t\u201D the verb goes back to the 1st form (base form): \u201Cdidn\u2019t forget\u201D \u2013 never \u201Cdidn\u2019t forgot\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: questions with \u201CDid\u201D)","Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?":"Clue: a Where-question with download.","Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!":"Question formula: question word (Where) + did + subject (you) + base form (download) \u2192 no \u201C-ed\u201D on the verb!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)":"Which Past Simple sentence is grammatically CORRECT? (Focus: \u201Cdidn\u2019t\u201D with irregular verbs)","Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab.":"Clue: the first half is negative (see), the second half is positive (mine).","Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).":"The first part has \u201Cdidn\u2019t + base form\u201D (didn\u2019t see); the second part is a normal positive Past Simple statement (mined).","Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)":"Verb: be \u2013 the subject is \u201CI\u201D. (be)","Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.":"With I / he / she / it, the Past Simple always uses \u201Cwas\u201D.","Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)":"Verb: be \u2013 the subject is \u201Cmy friends and I\u201D. (be)","\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!":"\u201CMy friends and I\u201D = we (plural) \u2192 so \u201Cwere\u201D belongs here!","Warst du gestern Abend auf unserem Schul-SMP-Server online?":"Verb: be \u2013 a question with \u201Cyou\u201D.","Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!":"With \u201Cyou\u201D it is always \u201Cwere\u201D \u2013 and with was/were you NEVER use \u201Cdid\u201D!","Es gab drei Baby-Pandas im Bambusdschungel. (There be)":"There + be \u2013 three pandas, plural. (There be)","\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.":"\u201CThree baby pandas\u201D is plural \u2192 \u201CThere were\u201D. For singular you use \u201CThere was\u201D.","Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)":"Negative of be \u2013 the subject is \u201Cthe maths test\u201D. (not be)","\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).":"\u201CThe maths test\u201D = it \u2192 the negative of \u201Cwas\u201D is simply \u201Cwasn\u2019t\u201D (no \u201Cdidn\u2019t\u201D!).","Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)":"The past of can. (can \u2192 Past Simple)","Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.":"The past of \u201Ccan\u201D is \u201Ccould\u201D. It needs no \u201Cdid\u201D and is the same for every person.","Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!":"There + be \u2013 one trapdoor, singular.","\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.":"\u201CA hidden trapdoor\u201D is singular \u2192 so \u201CThere was\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: questions with \u201Cwere\u201D)","Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?":"Clue: a question with be and \u201Cyou\u201D.","\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?":"\u201Cwas\u201D and \u201Cwere\u201D are strong verbs: they need NO \u201Cdid\u201D! You just swap the subject and \u201Cwere\u201D \u2192 Were you tired?","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: \u201Cwasn\u2019t / weren\u2019t\u201D)","Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war.":"Clue: a negative with be and \u201Cthe villagers\u201D.","\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.":"\u201CThe villagers\u201D = they (plural) \u2192 \u201Cweren\u2019t\u201D. With \u201Cbe\u201D in the Past Simple you never use \u201Cdidn\u2019t\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: \u201Ccouldn\u2019t\u201D)","Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte.":"Clue: a negative with can.","\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).":"\u201CCouldn\u2019t\u201D needs no \u201Cdid\u201D and is always followed by the base form of the verb (\u201Ccouldn\u2019t light\u201D).","Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!":"Clue: \u201Cyesterday\u201D is a finished time. (build)","Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!":"The #1 trap! With time words like \u201Cyesterday\u201D (finished past) you must NEVER use the Present Perfect (\u201Chave built\u201D) \u2013 always the Past Simple: \u201Cbuilt\u201D!","Unsere Klasse startete diese Minecraft-Welt vor drei Monaten.":"Clue: a time phrase for \u201Cthree months before now\u201D.","\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).":"In English it is \u201Cthree months ago\u201D \u2013 and \u201Cago\u201D always comes AFTER the length of time (\u201Cthree months ago\u201D, not \u201Cago three months\u201D).","Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)":"Clue: \u201Clast night\u201D is a finished time. (find)","\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.":"\u201CLast night\u201D is a clear Past Simple time word! So \u201Cfound\u201D, not \u201Chave found\u201D.","Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus.":"Verb: be \u2013 the subject is \u201CI\u201D.","\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).":"\u201CWhen I was ten years old\u201D describes a finished point in the past \u2192 always Past Simple (\u201Cwas\u201D).","Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)":"Clue: \u201Cin 2024\u201D is a finished time. (release)","Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).":"With past years like \u201Cin 2024\u201D, English always uses the Past Simple \u2192 \u201Creleased\u201D (no Present Perfect!).","Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz.":"Clue: the week before this one \u2013 no \u201Cthe\u201D.","\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).":"In English it is \u201Clast week / last month / last year\u201D (without \u201Cthe\u201D!).","Wann hast du angefangen, Minecraft zu spielen? (start)":"A When-question with the verb start. (start)","Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!":"Questions with \u201CWhen\u2026?\u201D ask about a specific point in the past \u2192 ALWAYS Past Simple (\u201CWhen did you start\u2026?\u201D), never Present Perfect!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: the perfect trap with \u201Cyesterday\u201D)","Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt.":"Clue: \u201Cyesterday\u201D is a finished time.","Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.":"As soon as \u201Cyesterday\u201D is in the sentence, \u201Chave played\u201D is forbidden! And English word order is subject \u2013 verb \u2013 object \u2013 time.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)":"Which Past Simple sentence is grammatically CORRECT? (Focus: word order with \u201Cago\u201D)","Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen.":"Clue: where does \u201Cago\u201D go?","Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).":"Time phrases with \u201Cago\u201D go at the end of the sentence (or right at the start), and \u201Cago\u201D comes AFTER the length of time: \u201Ctwo days ago\u201D + Past Simple (\u201Csaw\u201D).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)":"Which Past Simple sentence is grammatically CORRECT? (Focus: word order with time phrases)","Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut.":"Clue: subject \u2013 verb \u2013 object \u2013 place \u2013 time.","Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!":"English S-V-O rule: subject (We) + verb (built) + object (a new base) + place (in Survival mode) + time (last night). No inversion like \u201CLast night built we\u201D!","mine \u2192 mined \xB7 craft \u2192 crafted":"mine \u2192 mined \xB7 craft \u2192 crafted","Basis-Rezept":"Basic recipe","Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.":"You use the Past Simple for actions that are completely finished in the past (e.g. yesterday, last week, in the holidays). For most English verbs you simply add \u201C-ed\u201D.","Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)":"Subject + base form + -ed  (the same for ALL persons!)","Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.":"Brilliantly simple: in the Past Simple there is NO \u201C-s\u201D for he/she/it! I played, he played, we played \u2013 the same form everywhere.","Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).":"Typical time words: yesterday, last week, in 2024, two days ago. If a verb ends in \u201C-e\u201D (mine, live, love), you only add \u201C-d\u201D (mined, lived).","Kein \u201E-s\u201C bei he/she/it im Past Simple!":"No \u201C-s\u201D for he/she/it in the Past Simple!","Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.":"With a silent \u201C-e\u201D at the end, you only add \u201C-d\u201D.","Ich baute gestern sechzig Bl\xF6cke Eisen ab.":"I mined sixty blocks of iron yesterday.","Sie craftete vor dem Raid einen neuen Schild.":"She crafted a new shield before the raid.","Rechtschreib-Regeln (-ed)":"Spelling rules (-ed)","try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played":"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",Rechtschreibung:"Spelling","Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!":"With some regular verbs the spelling changes slightly when you add \u201C-ed\u201D. These 3 rules come up in almost every English test!","Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed":"consonant + y \u2192 -ied  |  vowel + y \u2192 -yed  |  short vowel + consonant \u2192 double consonant + -ed","1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"Careful with two-syllable verbs like \u201Cvisit\u201D or \u201Copen\u201D: because the FIRST syllable is stressed, the last letter is NOT doubled (visited, opened).","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"Consonant + y becomes -ied; short \u201Cdrop\u201D doubles the p!","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"There is a vowel (a) before the y \u2192 the y stays!","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"Max studied his English words and then played Minecraft.","Das Skelett blieb direkt vor unserer Mauer stehen.":"The skeleton stopped right in front of our wall.","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"Anvil knowledge","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"Many of the most common English verbs (go, build, find, fight, see) don't follow the \u201C-ed\u201D rule. They have their own 2nd form, which you have to learn by heart.","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"Subject + 2nd verb form (Past Simple)  \u2014 e.g. go \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"Important: you use the 2nd form ONLY in positive statements! As soon as \u201Cdid\u201D or \u201Cdidn\u2019t\u201D comes in, the verb jumps back to the 1st form.","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"Don't confuse the 2nd form (Past Simple: broke, saw, went) with the 3rd form (past participle: broken, seen, gone). You only need the 3rd form for the Present Perfect or the passive.","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"Never add \u201C-ed\u201D to irregular verbs!","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\u201Cseen\u201D is the 3rd form \u2013 the Past Simple always uses the 2nd form \u201Csaw\u201D!","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"We dug down to level -58 and found eight diamonds.","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"Leo fought the Ender Dragon and won the game.","Verneinung mit didn't":"Negatives with didn't","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"Most important rule!","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"When you want to say that something did NOT happen in the past, all ordinary verbs (except be & could) need the helping verb \u201Cdidn\u2019t\u201D (= did not).","Subjekt + didn't + Grundform (1. Form des Verbs)":"Subject + didn't + base form (1st form of the verb)","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"Memory trick: \u201CDid already has the past in its inventory!\u201D So the main verb after it ALWAYS stays in the base form (no -ed and no 2nd form).","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"The same for regular AND irregular verbs: \u201Cdidn\u2019t play\u201D, \u201Cdidn\u2019t go\u201D, \u201Cdidn\u2019t build\u201D. The only exceptions: was/were (\u2192 wasn\u2019t/weren\u2019t) and could (\u2192 couldn\u2019t).","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"The most common test mistake of all: never the 2nd form after \u201Cdidn\u2019t\u201D!","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"In English, \u201Cnot\u201D can never stand alone in front of the main verb.","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"I didn't lose my sword because I kept it in my ender chest.","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"We didn't finish the roof before sunset.","Entscheidungsfragen (Did you...?)":"Yes/no questions (Did you...?)","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"Yes/no questions","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"To ask a yes/no question about the past (\u201CDid you\u2026?\u201D), you simply put \u201CDid\u201D right at the start of the sentence.","Did + Subjekt + Grundform (1. Form) + ...?":"Did + subject + base form (1st form) + ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"Here too, \u201CDid\u201D steals the past ending from the verb! So \u201CDid you mine?\u201D (NOT \u201CDid you mined?\u201D).","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"Many learners ask \u201CHave you played yesterday?\u201D \u2013 but for a finished past, English says \u201CDid you play yesterday?\u201D!","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"After \u201CDid\u201D you always use the base form \u201Cfind\u201D!","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"In English you can't just move main verbs to the front \u2013 you need \u201CDid\u201D.","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"Did you bring enough torches for the cave?","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"Did Tom finish his maths homework before Discord?","W-Fragen (What / Where / Why did...?)":"Wh-questions (What / Where / Why did...?)","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"Wh-questions","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"If you want more detailed information (What? Where? When? Why? How?), you simply put the English question word right before \u201Cdid\u201D.","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"Question word (What/Where/When/Why/How) + did + subject + base form?","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"Careful with \u201CWho\u201D as a subject question (\u201CWho built that?\u201D): there is no \u201Cdid\u201D \u2192 \u201CWho built this castle?\u201D (2nd form!).","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"In English, questions with \u201CWhen\u2026?\u201D are almost always in the Past Simple (\u201CWhen did you start?\u201D), because they ask about a fixed point in time.","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"Base form \u201Cgo\u201D after \u201Cdid\u201D!","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"Don't forget the helping verb \u201Cdid\u201D!","Wo hast du die Diamanttruhe versteckt?":"Where did you hide the diamond chest?","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"Why did the Creeper explode near our farm?","Kurzantworten (Yes, I did)":"Short answers (Yes, I did)","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"Polite & correct","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"In English a single \u201CYes.\u201D or \u201CNo.\u201D often sounds too short or even rude. So with yes/no questions you add the pronoun + helping verb.","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + pronoun + did.  |  No, + pronoun + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"For questions with \u201CWas/Were\u2026?\u201D you answer with was/were, of course (\u201CYes, I was.\u201D / \u201CNo, they weren\u2019t.\u201D), not with did!","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"In short answers you NEVER repeat the main verb (so NOT \u201CYes, I did played\u201D).","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"Short, snappy and perfect: just \u201CYes, I did.\u201D","Das Hilfsverb in der Antwort passt immer zur Frage!":"The helping verb in the answer always matches the question!","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\u201CDid you beat the Ender Dragon?\u201D \u2014 \u201CYes, we did!\u201D","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\u201CDid Mia lose her horse?\u201D \u2014 \u201CNo, she didn't.\u201D","was & were (Aussage)":"was & were (statements)","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"The verb \u201Cto be\u201D","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\u201Cwas\u201D and \u201Cwere\u201D are the past forms of \u201Cbe\u201D. You use them to describe states, feelings, places and qualities in the past.","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"Remember \u201Cyou\u201D: even when you are talking to just ONE friend, English ALWAYS says \u201Cyou were\u201D (never \u201Cyou was\u201D!).","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\u201Ccould\u201D behaves just as strongly as was/were: it doesn't need \u201Cdid\u201D either.","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"With \u201Cyou\u201D, standard English always uses \u201Cwere\u201D.","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\u201CMy friends\u201D is plural (= they) \u2192 \u201Cwere\u201D!","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"I was exhausted after I had built that huge bridge.","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"Our classmates were excited about the redstone lift.","wasn't / weren't & Fragen":"wasn't / weren't & questions","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"No \u201Cdid\u201D!","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"To make \u201Cwas\u201D and \u201Cwere\u201D negative or to ask questions with them, you need NO \u201Cdid\u201D! They are strong enough to do it themselves.","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"Subject + wasn't / weren't   |   Was / Were + subject + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"For questions, \u201CWas\u201D or \u201CWere\u201D simply moves to the front, before the subject: \u201CYou were online.\u201D \u2192 \u201CWere you online?\u201D","Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C).":"The same goes for \u201Ccould\u201D: negative \u201Ccouldn\u2019t\u201D (not \u201Cdidn\u2019t could\u201D) and question \u201CCould you\u2026?\u201D (not \u201CDid you could\u2026?\u201D).","Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!":"Never mix \u201Cdid\u201D with \u201Cwas/were\u201D!","Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.":"The negative of \u201Cbe\u201D is always \u201Cwasn\u2019t\u201D or \u201Cweren\u2019t\u201D.","Hattest du Angst, als das H\xF6hlenger\xE4usch lief?":"Were you scared when the cave sound played?","Der Server war w\xE4hrend der Wartung nicht online.":"The server wasn't online during maintenance.","There was / There were":"There was / There were","Es gab (Einzahl & Mehrzahl)":"There is/are in the past (singular & plural)",Beschreiben:"Describing","Perfekt, um deine Minecraft-Welt oder ein Erlebnis zu beschreiben: \u201EEs gab eine H\xF6hle\u2026\u201C oder \u201EEs waren drei Zombies da\u2026\u201C.":"Perfect for describing your Minecraft world or an adventure: \u201CThere was a cave\u2026\u201D or \u201CThere were three zombies\u2026\u201D.","There was + Einzahl (a/an/one)   |   There were + Mehrzahl (two, many, some...)":"There was + singular (a/an/one)   |   There were + plural (two, many, some...)","Verneinung: \u201EThere wasn\u2019t any lava.\u201C / \u201EThere weren\u2019t any Creepers.\u201C Frage: \u201EWas there a chest?\u201C / \u201EWere there any villagers?\u201C":"Negative: \u201CThere wasn\u2019t any lava.\u201D / \u201CThere weren\u2019t any Creepers.\u201D Question: \u201CWas there a chest?\u201D / \u201CWere there any villagers?\u201D","Im Deutschen sagt man immer \u201EEs gab\u2026\u201C (egal ob ein Creeper oder zehn). Im Englischen musst du genau auf Einzahl (was) vs. Mehrzahl (were) achten!":"Many languages use one form whether there is one Creeper or ten. In English you have to watch for singular (was) vs. plural (were)!","F\xFCnf Zombies = Plural \u2192 \u201EThere were\u201C!":"Five zombies = plural \u2192 \u201CThere were\u201D!","\u201EEs gab\u201C hei\xDFt NIEMALS \u201Eit gave\u201C, sondern immer \u201EThere was / There were\u201C!":"\u201CThere was / There were\u201D \u2013 never \u201CIt gave\u201D or \u201CIt had\u201D!","Es gab einen Schmied mit Diamantstiefeln im Dorf.":"There was a blacksmith with diamond boots in the village.","Es gab zwanzig Fackeln, die den Tunnel beleuchteten.":"There were twenty torches lighting up the tunnel.","Signalw\xF6rter (yesterday, ago, last...)":"Time words (yesterday, ago, last...)","Die Zeitportal-Marker des Past Simple":"The time-portal markers of the Past Simple","Zeit-Kompass":"Time compass","Signalw\xF6rter verraten dir in Tests sofort, dass du das Past Simple benutzen musst. Sie zeigen an, dass ein Zeitpunkt komplett in der Vergangenheit liegt.":"In tests, time words tell you straight away that you need the Past Simple. They show that a point in time is completely in the past.","yesterday \xB7 last night/week/year \xB7 [Zeit] + ago \xB7 in 2023 \xB7 when I was...":"yesterday \xB7 last night/week/year \xB7 [time] + ago \xB7 in 2023 \xB7 when I was...","Wortstellung im Englischen: Zeitangaben stehen am SATZENDE (oder ganz am Satzanfang) \u2013 niemals zwischen Verb und Objekt!":"English word order: time phrases go at the END of the sentence (or right at the start) \u2013 never between the verb and the object!","\u201Evor zwei Tagen\u201C = \u201Etwo days ago\u201C (ago steht HINTER der Zahl). \u201Eletzte Woche\u201C = \u201Elast week\u201C (OHNE \u201Ethe\u201C!).":"\u201Ctwo days ago\u201D (ago comes AFTER the number). \u201Clast week\u201D (WITHOUT \u201Cthe\u201D!).","\u201Eago\u201C steht hinter der Zeitspanne und die Zeitangabe am Satzende.":"\u201Cago\u201D comes after the length of time, and the time phrase goes at the end of the sentence.","Im Englischen bleibt immer Subjekt vor Verb (we played)!":"In English the subject always stays before the verb (we played)!","Wir haben den Enderdrachen vor zwei Wochen besiegt.":"We defeated the Ender Dragon two weeks ago.","Gestern Abend habe ich eine automatische Bambusfarm gebaut.":"Last night I built an automatic bamboo farm.","Die Perfekt-Falle f\xFCr Deutsche":"The present perfect trap","Past Simple vs. Present Perfect":"Past Simple vs. Present Perfect","Creeper-Falle #1":"Creeper trap #1","Im Deutschen erz\xE4hlen wir fast alles im Perfekt: \u201EIch HABE gestern gespielt.\u201C Wenn du das w\xF6rtlich ins Englische \xFCbersetzt (\u201EI have played yesterday\u201C), explodiert der Satz wie ein Creeper!":"Many languages tell stories with a \u201Chave + participle\u201D form. If you carry that over into English (\u201CI have played yesterday\u201D), the sentence explodes like a Creeper!","Fester Zeitpunkt in der Vergangenheit (yesterday, last, ago, When...?) \u2192 IMMER Past Simple!":"Fixed point in the past (yesterday, last, ago, When...?) \u2192 ALWAYS Past Simple!","Das Present Perfect (\u201EI have played\u201C) nutzt man im Englischen nur ohne festen Vergangenheitszeitpunkt (z. B. Erfahrungen im Leben: \u201EHave you ever played Minecraft?\u201C).":"English uses the Present Perfect (\u201CI have played\u201D) only without a fixed time in the past (e.g. life experiences: \u201CHave you ever played Minecraft?\u201D).","Faustregel f\xFCr die Schule: Siehst du yesterday, last\u2026, \u2026ago, in 2022 oder When\u2026? \u2192 Finger weg von have/has! Nimm Past Simple!":"Rule of thumb for school: if you see yesterday, last\u2026, \u2026ago, in 2022 or When\u2026? \u2192 hands off have/has! Use the Past Simple!","\u201Eyesterday\u201C + Present Perfect ist im Englischen immer falsch!":"\u201Cyesterday\u201D + Present Perfect is always wrong in English!","\u201EWhen\u2026?\u201C fragt nach einem genauen Zeitpunkt \u2192 Past Simple!":"\u201CWhen\u2026?\u201D asks about an exact point in time \u2192 Past Simple!","Ich habe letzten Sonntag meine Oma besucht.":"I visited my grandma last Sunday.","Wir haben vor zehn Minuten ein cooles Minecraft-Tutorial geschaut.":"We watched a cool Minecraft tutorial ten minutes ago.",sein:"to be",bauen:"to build",graben:"to dig",finden:"to find",gehen:"to go",k\u00E4mpfen:"to fight","machen / herstellen":"to make",sehen:"to see",bekommen:"to get",haben:"to have",nehmen:"
