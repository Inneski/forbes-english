RETA? (Foco: \u201Csee\u201D e \u201Cswim\u201D)","Sinn: Wir sahen ein Ozeanmonument und schwammen schnell zur Oberfl\xE4che zur\xFCck.":"Sentido: Vimos um monumento oce\xE2nico e nad\xE1mos depressa de volta \xE0 superf\xEDcie.","Beide Verben sind unregelm\xE4\xDFig: see \u2192 saw (2. Form) und swim \u2192 swam (2. Form).":"Os dois verbos s\xE3o irregulares: see \u2192 saw (2.\xAA forma) e swim \u2192 swam (2.\xAA forma).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewrite\u201C & \u201Ewin\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: \u201Cwrite\u201D e \u201Cwin\u201D)","Sinn: Ben schrieb eine gute Englischarbeit und gewann abends das Minecraft-Turnier.":"Sentido: O Ben escreveu um bom teste de ingl\xEAs e \xE0 noite ganhou o torneio de Minecraft.","write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!":"write \u2013 wrote \u2013 written (escreveu) e win \u2013 won \u2013 won (ganhou). Ambos est\xE3o na 2.\xAA forma!","Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)":"N\xE3o entrei na caverna do Deep Dark porque n\xE3o tinha blocos de l\xE3. (not go)","Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!).":"Regra de ouro: depois de \u201Cdidn\u2019t\u201D vem SEMPRE a forma base (infinitivo) do verbo \u2192 didn\u2019t go (NUNCA didn\u2019t went!).","Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)":"Encontraste sucata de netherite ontem na tua expedi\xE7\xE3o de minera\xE7\xE3o? (find)","Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?":"As perguntas no Past Simple fazem-se com \u201CDid + sujeito + forma base\u201D \u2192 Did you find...?","Was hat Steve mit all dem Redstone-Staub gebaut? (build)":"O que \xE9 que o Steve construiu com todo aquele p\xF3 de redstone? (build)","Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?":"Tamb\xE9m nas perguntas com What / Where / Why: o \u201Cdid\u201D j\xE1 leva o passado, por isso o verbo fica na forma base \u2192 What did Steve build?","Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C":"Resposta curta em ingl\xEAs: \u201CN\xE3o, n\xE3o fez.\u201D","Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C.":"Quando a pergunta come\xE7a com \u201CDid\u2026?\u201D, responde-se de forma curta com \u201CYes, \u2026 did\u201D ou \u201CNo, \u2026 didn\u2019t\u201D.","Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)":"Porque \xE9 que o Lukas n\xE3o levou um balde de \xE1gua antes de saltar da torre? (not take)","Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?":"Pergunta negativa com Why no Past Simple: \u201CWhy didn\u2019t + sujeito + forma base\u201D \u2192 Why didn\u2019t Lukas take...?","Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)":"O Creeper n\xE3o destruiu a nossa casa! (not destroy)","F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy.":"Para negar os verbos normais no Past Simple precisas sempre de \u201Cdidn\u2019t\u201D + forma base \u2192 didn\u2019t destroy.","Kurzantwort: \u201EJa, das haben wir!\u201C":"Resposta curta: \u201CSim, fizemos!\u201D","Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen).":"A \u201CDid you and Mia\u2026?\u201D a resposta curta correta em ingl\xEAs \xE9 simplesmente \u201CYes, we did!\u201D (sem repetir o verbo principal).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: nega\xE7\xE3o com \u201Cdidn\u2019t\u201D)","Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen.":"Sentido: Ontem \xE0 noite n\xE3o me esqueci dos trabalhos de casa.","Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!":"Depois de \u201Cdidn\u2019t\u201D o verbo volta \xE0 1.\xAA forma (forma base): \u201Cdidn\u2019t forget\u201D \u2013 nunca \u201Cdidn\u2019t forgot\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: perguntas com \u201CDid\u201D)","Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?":"Sentido: Onde descarregaste ontem aquele mapa de Minecraft t\xE3o fixe?","Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!":"F\xF3rmula da pergunta: palavra interrogativa (Where) + did + sujeito (you) + forma base (download) \u2192 sem \u201C-ed\u201D no verbo!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: \u201Cdidn\u2019t\u201D com verbos irregulares)","Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab.":"Sentido: N\xE3o vimos diamantes, por isso miner\xE1mos ferro em vez disso.","Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).":"Na primeira parte est\xE1 \u201Cdidn\u2019t + forma base\u201D (didn\u2019t see) e na segunda uma afirma\xE7\xE3o normal no Past Simple (mined).","Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)":"Fiquei super nervoso quando ouvi o batimento card\xEDaco do Warden. (be)","Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.":"Com I / he / she / it usa-se sempre \u201Cwas\u201D no Past Simple.","Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)":"Eu e os meus amigos est\xE1vamos no topo da base da montanha quando a tempestade come\xE7ou. (be)","\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!":"\u201CMy friends and I\u201D = we (plural) \u2192 por isso aqui vai \u201Cwere\u201D!","Warst du gestern Abend auf unserem Schul-SMP-Server online?":"Estiveste online ontem \xE0 noite no servidor SMP da escola?","Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!":"Com \u201Cyou\u201D vai sempre \u201Cwere\u201D \u2013 e com was/were NUNCA se usa \u201Cdid\u201D!","Es gab drei Baby-Pandas im Bambusdschungel. (There be)":"Havia tr\xEAs pandas beb\xE9s na selva de bambu. (There be)","\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.":"\u201CThree baby pandas\u201D \xE9 plural \u2192 \u201CThere were\u201D (havia). Para o singular usa-se \u201CThere was\u201D.","Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)":"O teste de matem\xE1tica n\xE3o foi t\xE3o dif\xEDcil como eu temia. (not be)","\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).":"\u201CThe maths test\u201D = it \u2192 a nega\xE7\xE3o de \u201Cwas\u201D \xE9 simplesmente \u201Cwasn\u2019t\u201D (sem \u201Cdidn\u2019t\u201D!).","Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)":"Gra\xE7as aos \xE9litros consegui planar por cima de todo o oceano enorme. (can \u2192 Past Simple)","Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.":"O passado de \u201Ccan\u201D \xE9 \u201Ccould\u201D (consegui/podia). N\xE3o precisa de \u201Cdid\u201D e \xE9 igual para todas as pessoas.","Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!":"Havia um al\xE7ap\xE3o escondido mesmo debaixo do tapete na mans\xE3o da floresta!","\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.":"\u201CA hidden trapdoor\u201D \xE9 singular \u2192 por isso \u201CThere was\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: pergunta com \u201Cwere\u201D)","Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?":"Sentido: Estavam cansados depois da longa luta contra o boss?","\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?":"\u201Cwas\u201D e \u201Cwere\u201D s\xE3o verbos fortes: N\xC3O precisam de \u201Cdid\u201D! Basta trocar o sujeito e \u201Cwere\u201D \u2192 Were you tired?","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: \u201Cwasn\u2019t / weren\u2019t\u201D)","Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war.":"Sentido: Os alde\xF5es n\xE3o estavam nas casas porque ainda era de dia.","\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.":"\u201CThe villagers\u201D = they (plural) \u2192 \u201Cweren\u2019t\u201D. Com \u201Cbe\u201D no Past Simple nunca se usa \u201Cdidn\u2019t\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: \u201Ccouldn\u2019t\u201D)","Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte.":"Sentido: Ontem \xE0 noite n\xE3o consegui acender o portal porque me faltava pederneira.","\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).":"\u201CCouldn\u2019t\u201D n\xE3o precisa de \u201Cdid\u201D e vai sempre com a forma base do verbo (\u201Ccouldn\u2019t light\u201D).","Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!":"Aten\xE7\xE3o, armadilha! Muita gente diz \u201CI have built yesterday\u201D, mas com \u201Cyesterday\u201D o ingl\xEAs pede Past Simple!","Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!":"A armadilha n.\xBA 1! Com marcadores como \u201Cyesterday\u201D (passado terminado) NUNCA pode ir Present Perfect (\u201Chave built\u201D) \u2013 sempre Past Simple: \u201Cbuilt\u201D!","Unsere Klasse startete diese Minecraft-Welt vor drei Monaten.":"A nossa turma come\xE7ou este mundo de Minecraft h\xE1 tr\xEAs meses.","\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).":"\u201CH\xE1 tr\xEAs meses\u201D em ingl\xEAs \xE9 \u201Cthree months ago\u201D \u2013 e o \u201Cago\u201D vai sempre NO FIM da express\xE3o de tempo (n\xE3o antes, como \u201Ch\xE1\u201D)!","Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)":"Ontem \xE0 noite encontr\xE1mos a nossa primeira fortaleza do Nether. (find)","\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.":"\u201CLast night\u201D \xE9 um marcador claro do Past Simple! Por isso \u201Cfound\u201D e n\xE3o \u201Chave found\u201D.","Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus.":"Quando eu tinha dez anos, constru\xED a minha primeir\xEDssima casa de terra.","\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).":"\u201CWhen I was ten years old\u201D descreve um momento terminado do passado \u2192 sempre Past Simple (\u201Cwas\u201D).","Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)":"A Mojang lan\xE7ou a atualiza\xE7\xE3o Trial Chambers em 2024. (release)","Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).":"Com anos passados como \u201Cin 2024\u201D, o ingl\xEAs usa sempre o Past Simple \u2192 \u201Creleased\u201D (nada de Present Perfect!).","Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz.":"Na semana passada o nosso professor de ingl\xEAs deu-nos um quiz de videojogos muito fixe.","\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).":"\u201CA semana passada / o m\xEAs passado / o ano passado\u201D em ingl\xEAs \xE9 \u201Clast week / last month / last year\u201D (sem \u201Cthe\u201D!).","Wann hast du angefangen, Minecraft zu spielen? (start)":"Quando come\xE7aste a jogar Minecraft? (start)","Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!":"As perguntas com \u201CWhen\u2026?\u201D perguntam por um momento concreto do passado \u2192 SEMPRE Past Simple (\u201CWhen did you start\u2026?\u201D), nunca Present Perfect!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: a armadilha do perfect com \u201Cyesterday\u201D)","Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt.":"Sentido: Ontem joguei Minecraft durante duas horas.","Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.":"Assim que aparece \u201Cyesterday\u201D na frase, \u201Chave played\u201D \xE9 proibido! E a ordem das palavras em ingl\xEAs \xE9 sujeito \u2013 verbo \u2013 objeto \u2013 tempo.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: ordem das palavras com \u201Cago\u201D)","Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen.":"Sentido: H\xE1 dois dias o meu amigo viu um raro rebanho de ovelhas cor-de-rosa.","Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).":"As express\xF5es com \u201Cago\u201D v\xE3o no fim da frase (ou mesmo no in\xEDcio), e o \u201Cago\u201D vem DEPOIS do per\xEDodo de tempo: \u201Ctwo days ago\u201D + Past Simple (\u201Csaw\u201D).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)":"Que frase no Past Simple est\xE1 gramaticalmente CORRETA? (Foco: posi\xE7\xE3o das express\xF5es de tempo)","Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut.":"Sentido: Ontem \xE0 noite constru\xEDmos uma base nova no modo Sobreviv\xEAncia.","Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!":"Regra S-V-O do ingl\xEAs: sujeito (We) + verbo (built) + objeto (a new base) + lugar (in Survival mode) + tempo (last night). Sem invers\xE3o como em \u201CLast night built we\u201D!","mine \u2192 mined \xB7 craft \u2192 crafted":"mine \u2192 mined \xB7 craft \u2192 crafted","Basis-Rezept":"Receita b\xE1sica","Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.":"Usas o Past Simple para a\xE7\xF5es completamente terminadas no passado (por exemplo, ontem, na semana passada, nas f\xE9rias). Na maioria dos verbos ingleses basta acrescentar \u201C-ed\u201D.","Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)":"Sujeito + forma base + -ed  (igual para TODAS as pessoas!)","Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.":"Genialmente simples: no Past Simple N\xC3O h\xE1 \u201C-s\u201D com he/she/it! I played, he played, we played \u2013 a mesma forma em todo o lado.","Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).":"Marcadores t\xEDpicos: yesterday, last week, in 2024, two days ago. Se um verbo termina em \u201C-e\u201D (mine, live, love), s\xF3 acrescentas \u201C-d\u201D (mined, lived).","Kein \u201E-s\u201C bei he/she/it im Past Simple!":"Sem \u201C-s\u201D com he/she/it no Past Simple!","Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.":"Com \u201C-e\u201D mudo no fim, s\xF3 se acrescenta \u201C-d\u201D.","Ich baute gestern sechzig Bl\xF6cke Eisen ab.":"Ontem minerei sessenta blocos de ferro.","Sie craftete vor dem Raid einen neuen Schild.":"Ela fabricou um escudo novo antes do raid.","Rechtschreib-Regeln (-ed)":"Regras de ortografia (-ed)","try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played":"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",Rechtschreibung:"Ortografia","Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!":"Em alguns verbos regulares a ortografia muda um pouco quando se acrescenta \u201C-ed\u201D. Estas 3 regras saem em quase todos os testes de ingl\xEAs!","Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed":"consoante + y \u2192 -ied  |  vogal + y \u2192 -yed  |  vogal curta + consoante \u2192 consoante dobrada + -ed","1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"Cuidado com os verbos de duas s\xEDlabas como \u201Cvisit\u201D ou \u201Copen\u201D: como a PRIMEIRA s\xEDlaba \xE9 t\xF3nica, a \xFAltima letra N\xC3O dobra (visited, opened).","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"Consoante + y passa a -ied; o curto \u201Cdrop\u201D dobra o p!","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"Antes do y h\xE1 uma vogal (a) \u2192 o y fica!","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"O Max estudou as palavras de ingl\xEAs e depois jogou Minecraft.","Das Skelett blieb direkt vor unserer Mauer stehen.":"O esqueleto parou mesmo em frente ao nosso muro.","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"Saber da bigorna","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"Muitos dos verbos ingleses mais comuns (ir, construir, encontrar, lutar, ver) n\xE3o seguem a regra do \u201C-ed\u201D. T\xEAm uma 2.\xAA forma pr\xF3pria, que \xE9 preciso decorar.","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"Sujeito + 2.\xAA forma do verbo (Past Simple)  \u2014 p. ex. go \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"Importante: a 2.\xAA forma usa-se S\xD3 em frases afirmativas! Assim que entra \u201Cdid\u201D ou \u201Cdidn\u2019t\u201D, o verbo volta \xE0 1.\xAA forma.","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"N\xE3o confundas a 2.\xAA forma (Past Simple: broke, saw, went) com a 3.\xAA forma (partic\xEDpio passado: broken, seen, gone). A 3.\xAA forma s\xF3 \xE9 precisa para o Present Perfect ou a voz passiva.","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"Nunca acrescentes \u201C-ed\u201D aos verbos irregulares!","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\u201Cseen\u201D \xE9 a 3.\xAA forma \u2013 no Past Simple \xE9 sempre a 2.\xAA forma \u201Csaw\u201D!","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"Escav\xE1mos at\xE9 ao n\xEDvel -58 e encontr\xE1mos oito diamantes.","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"O Leo lutou contra o Ender Dragon e ganhou o jogo.","Verneinung mit didn't":"Nega\xE7\xE3o com didn't","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"A regra mais importante!","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"Se queres dizer que algo N\xC3O aconteceu no passado, todos os verbos normais (exceto be e could) precisam do auxiliar \u201Cdidn\u2019t\u201D (= did not).","Subjekt + didn't + Grundform (1. Form des Verbs)":"Sujeito + didn't + forma base (1.\xAA forma do verbo)","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"Truque para decorar: \u201CO did j\xE1 tem o passado no invent\xE1rio!\u201D Por isso o verbo principal fica SEMPRE na forma base (sem -ed e sem 2.\xAA forma).","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"Vale igual para verbos regulares E irregulares: \u201Cdidn\u2019t play\u201D, \u201Cdidn\u2019t go\u201D, \u201Cdidn\u2019t build\u201D. \xDAnicas exce\xE7\xF5es: was/were (\u2192 wasn\u2019t/weren\u2019t) e could (\u2192 couldn\u2019t).","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"O erro de teste mais frequente de todos: nunca a 2.\xAA forma depois de \u201Cdidn\u2019t\u201D!","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"Em ingl\xEAs, \u201Cnot\u201D nunca pode ficar sozinho antes do verbo principal.","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"N\xE3o perdi a minha espada porque a guardei no meu ba\xFA do Ender.","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"N\xE3o acab\xE1mos o telhado antes do p\xF4r do sol.","Entscheidungsfragen (Did you...?)":"Perguntas de sim/n\xE3o (Did you...?)","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"Perguntas de sim/n\xE3o","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"Para fazer uma pergunta de sim/n\xE3o sobre o passado (\u201CEncontraste\u2026?\u201D / \u201CConstru\xEDste\u2026?\u201D), basta p\xF4r \u201CDid\u201D no in\xEDcio da frase.","Did + Subjekt + Grundform (1. Form) + ...?":"Did + sujeito + forma base (1.\xAA forma) + ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"Aqui tamb\xE9m o \u201CDid\u201D rouba ao verbo a termina\xE7\xE3o do passado! Portanto \u201CDid you mine?\u201D (N\xC3O \u201CDid you mined?\u201D).","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"Muita gente pergunta \u201CHave you played yesterday?\u201D \u2013 mas para um passado terminado o ingl\xEAs diz \u201CDid you play yesterday?\u201D!","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"Depois de \u201CDid\u201D vai sempre a forma base \u201Cfind\u201D!","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"Em ingl\xEAs os verbos principais n\xE3o passam simplesmente para a frente \u2013 \xE9 preciso \u201CDid\u201D.","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"Trouxeste tochas suficientes para a caverna?","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"O Tom acabou os trabalhos de matem\xE1tica antes do Discord?","W-Fragen (What / Where / Why did...?)":"Perguntas com W (What / Where / Why did...?)","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"Perguntas com W","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"Se queres informa\xE7\xF5es mais precisas (O qu\xEA? Onde? Quando? Porqu\xEA? Como?), p\xF5e a palavra interrogativa inglesa mesmo antes de \u201Cdid\u201D.","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"Palavra interrogativa (What/Where/When/Why/How) + did + sujeito + forma base?","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"Cuidado com \u201CWho\u201D como pergunta sobre o sujeito (\u201CQuem construiu isto?\u201D): a\xED o \u201Cdid\u201D desaparece \u2192 \u201CWho built this castle?\u201D (2.\xAA forma!).","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"Em ingl\xEAs as perguntas com \u201CWhen\u2026?\u201D est\xE3o quase sempre no Past Simple (\u201CWhen did you start?\u201D), porque perguntam por um momento concreto.","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"Forma base \u201Cgo\u201D depois de \u201Cdid\u201D!","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"N\xE3o te esque\xE7as do auxiliar \u201Cdid\u201D!","Wo hast du die Diamanttruhe versteckt?":"Onde escondeste o ba\xFA dos diamantes?","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"Porque \xE9 que o Creeper explodiu perto da nossa quinta?","Kurzantworten (Yes, I did)":"Respostas curtas (Yes, I did)","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"Educado e correto","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"Em ingl\xEAs, um simples \u201CYes.\u201D ou \u201CNo.\u201D soa muitas vezes demasiado seco ou mal-educado. Por isso, nas perguntas de sim/n\xE3o acrescenta-se o pronome + o auxiliar.","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + pronome + did.  |  No, + pronome + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"\xC0s perguntas com \u201CWas/Were\u2026?\u201D responde-se, claro, com was/were (\u201CYes, I was.\u201D / \u201CNo, they weren\u2019t.\u201D), n\xE3o com did!","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"Nas respostas curtas NUNCA se repete o verbo principal (portanto N\xC3O \u201CYes, I did played\u201D).","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"Curta, clara e perfeita: simplesmente \u201CYes, I did.\u201D","Das Hilfsverb in der Antwort passt immer zur Frage!":"O auxiliar da resposta corresponde sempre \xE0 pergunta!","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\u201CDerrotaram o Ender Dragon?\u201D \u2014 \u201CSim!\u201D","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\u201CA Mia perdeu o cavalo?\u201D \u2014 \u201CN\xE3o.\u201D","was & were (Aussage)":"was e were (afirma\xE7\xE3o)","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"O verbo \u201Cto be\u201D","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\u201Cwas\u201D e \u201Cwere\u201D s\xE3o as formas do passado de \u201Cbe\u201D (ser/estar \u2192 era, estava / eram, estavam). Com elas descreves estados, sentimentos, lugares e caracter\xEDsticas no passado.","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"Pensa no \u201Cyou\u201D: mesmo que fales s\xF3 com UM amigo, em ingl\xEAs diz-se SEMPRE \u201Cyou were\u201D (nunca \u201Cyou was\u201D!).","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\u201Ccould\u201D (podia/consegui) \xE9 t\xE3o forte como was/were: tamb\xE9m n\xE3o precisa de \u201Cdid\u201D.","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"Com \u201Cyou\u201D, o ingl\xEAs padr\xE3o usa sempre \u201Cwere\u201D.","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\u201CMy friends\u201D \xE9 plural (= they) \u2192 \u201Cwere\u201D!","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"Estava exausto depois de construir aquela ponte enorme.","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"Os nossos colegas de turma estavam entusiasmados com o elevador de redstone.","wasn't / weren't & Fragen":"wasn't / weren't e perguntas","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"Sem \u201Cdid\u201D!","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"Para negar \u201Cwas\u201D e \u201Cwere\u201D ou fazer perguntas com eles, N\xC3O precisas de \u201Cdid\u201D! S\xE3o fortes o suficiente para tratar disso sozinhos.","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"Sujeito + wasn't / weren't   |   Was / Were + sujeito + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"Nas perguntas, \u201CWas\u201D ou \u201CWere\u201D passa simplesmente pa 1D\u0435 \u043F\u0443\u0442\u0430\u0439 2-\u044E \u0444\u043E\u0440\u043C\u0443 (Past Simple: broke, saw, went) \u0441 3-\u0439 \u0444\u043E\u0440\u043C\u043E\u0439 (\u043F\u0440\u0438\u0447\u0430\u0441\u0442\u0438\u0435: broken, seen, gone). 3-\u044F \u0444\u043E\u0440\u043C\u0430 \u043D\u0443\u0436\u043D\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u043B\u044F Present Perfect \u0438\u043B\u0438 \u0441\u0442\u0440\u0430\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u043E\u0433\u043E \u0437\u0430\u043B\u043E\u0433\u0430.","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"\u041D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u0434\u043E\u0431\u0430\u0432\u043B\u044F\u0439 \xAB-ed\xBB \u043A \u043D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u044B\u043C \u0433\u043B\u0430\u0433\u043E\u043B\u0430\u043C!","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\xABseen\xBB \u2014 \u044D\u0442\u043E 3-\u044F \u0444\u043E\u0440\u043C\u0430, \u0430 \u0432 Past Simple \u0432\u0441\u0435\u0433\u0434\u0430 2-\u044F \u0444\u043E\u0440\u043C\u0430 \xABsaw\xBB!","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"\u041C\u044B \u043F\u0440\u043E\u043A\u043E\u043F\u0430\u043B\u0438 \u0434\u043E \u0443\u0440\u043E\u0432\u043D\u044F -58 \u0438 \u043D\u0430\u0448\u043B\u0438 \u0432\u043E\u0441\u0435\u043C\u044C \u0430\u043B\u043C\u0430\u0437\u043E\u0432.","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"\u041B\u0435\u043E \u0441\u0440\u0430\u0437\u0438\u043B\u0441\u044F \u0441 \u0414\u0440\u0430\u043A\u043E\u043D\u043E\u043C \u041A\u0440\u0430\u044F \u0438 \u0432\u044B\u0438\u0433\u0440\u0430\u043B \u0438\u0433\u0440\u0443.","Verneinung mit didn't":"\u041E\u0442\u0440\u0438\u0446\u0430\u043D\u0438\u0435 \u0441 didn't","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"\u0421\u0430\u043C\u043E\u0435 \u0432\u0430\u0436\u043D\u043E\u0435  regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"\u042D\u0442\u043E \u043E\u0434\u0438\u043D\u0430\u043A\u043E\u0432\u043E \u0434\u043B\u044F \u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u044B\u0445 \u0418 \u043D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u044B\u0445 \u0433\u043B\u0430\u0433\u043E\u043B\u043E\u0432: \xABdidn\u2019t play\xBB, \xABdidn\u2019t go\xBB, \xABdidn\u2019t build\xBB. \u0415\u0434\u0438\u043D\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0435 \u0438\u0441\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F: was/were (\u2192 wasn\u2019t/weren\u2019t) \u0438 could (\u2192 couldn\u2019t).","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"\u0421\u0430\u043C\u0430\u044F \u0447\u0430\u0441\u0442\u0430\u044F \u043E\u0448\u0438\u0431\u043A\u0430 \u0432 \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u044C\u043D\u044B\u0445: \u043F\u043E\u0441\u043B\u0435 \xABdidn\u2019t\xBB \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 2-\u044F \u0444\u043E\u0440\u043C\u0430!","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"\u0412 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \xABnot\xBB \u043D\u0435 \u043C\u043E\u0436\u0435\u0442 \u0441\u0442\u043E\u044F\u0442\u044C \u043E\u0434\u0438\u043D \u043F\u0435\u0440\u0435\u0434 \u043E\u0441\u043D\u043E\u0432\u043D\u044B\u043C \u0433\u043B\u0430\u0433\u043E\u043B\u043E\u043C.","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"\u042F \u043D\u0435 \u043F\u043E\u0442\u0435\u0440\u044F\u043B \u043C\u0435\u0447, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0445\u0440\u0430\u043D\u0438\u043B \u0435\u0433\u043E \u0432 \u0441\u0443\u043D\u0434\u0443\u043A\u0435 \u041A\u0440\u0430\u044F.","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"\u041C\u044B \u043D\u0435 \u0443\u0441\u043F\u0435\u043B\u0438 \u0434\u043E\u0434\u0435\u043B\u0430\u0442\u044C \u043A\u0440\u044B\u0448\u0443 \u0434\u043E \u0437\u0430\u043A\u0430\u0442\u0430.","Entscheidungsfragen (Did you...?)":"\u041E\u0431\u0449\u0438\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B (Did you...?)","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"\u0412\u043E\u043F\u0440\u043E\u0441\u044B \xAB\u0434\u0430/\u043D\u0435\u0442\xBB","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"\u0427\u0442\u043E\u0431\u044B \u0437\u0430\u0434\u0430\u0442\u044C \u0432\u043E\u043F\u0440\u043E\u0441 \xAB\u0434\u0430/\u043D\u0435\u0442\xBB \u043E \u043F\u0440\u043E\u0448\u043B\u043E\u043C (\xAB\u0422\u044B \u043D\u0430\u0448\u0451\u043B\u2026?\xBB / \xAB\u0422\u044B \u043F\u043E\u0441\u0442\u0440\u043E\u0438\u043B\u2026?\xBB), \u043F\u0440\u043E\u0441\u0442\u043E \u043F\u043E\u0441\u0442\u0430\u0432\u044C \xABDid\xBB \u0432 \u0441\u0430\u043C\u043E\u0435 \u043D\u0430\u0447\u0430\u043B\u043E \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u044F.","Did + Subjekt + Grundform (1. Form) + ...?":"Did + \u043F\u043E\u0434\u043B\u0435\u0436\u0430\u0449\u0435\u0435 + \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u0430\u044F \u0444\u043E\u0440\u043C\u0430 (1-\u044F \u0444\u043E\u0440\u043C\u0430) + ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"\u0418 \u0437\u0434\u0435\u0441\u044C \xABDid\xBB \u0437\u0430\u0431\u0438\u0440\u0430\u0435\u0442 \u0443 \u0433\u043B\u0430\u0433\u043E\u043B\u0430 \u043E\u043A\u043E\u043D\u0447\u0430\u043D\u0438\u0435 \u043F\u0440\u043E\u0448\u0435\u0434\u0448\u0435\u0433\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438! \u0417\u043D\u0430\u0447\u0438\u0442, \xABDid you mine?\xBB (\u041D\u0415 \xABDid you mined?\xBB).","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"\u041C\u043D\u043E\u0433\u0438\u0435 \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u044E\u0442 \xABHave you played yesterday?\xBB \u2014 \u043D\u043E \u043E \u0437\u0430\u043A\u043E\u043D\u0447\u0435\u043D\u043D\u043E\u043C \u043F\u0440\u043E\u0448\u043B\u043E\u043C \u043F\u043E-\u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u0438 \u0433\u043E\u0432\u043E\u0440\u044F\u0442 \xABDid you play yesterday?\xBB!","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"\u041F\u043E\u0441\u043B\u0435 \xABDid\xBB \u0432\u0441\u0435\u0433\u0434\u0430 \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u0430\u044F \u0444\u043E\u0440\u043C\u0430 \xABfind\xBB!","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"\u0412 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u043E\u0441\u043D\u043E\u0432\u043D\u043E\u0439 \u0433\u043B\u0430\u0433\u043E\u043B \u043D\u0435\u043B\u044C\u0437\u044F \u043F\u0440\u043E\u0441\u0442\u043E \u0432\u044B\u043D\u0435\u0441\u0442\u0438 \u0432\u043F\u0435\u0440\u0451\u0434 \u2014 \u043D\u0443\u0436\u0435\u043D \xABDid\xBB.","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"\u0422\u044B \u0432\u0437\u044F\u043B \u0434\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E \u0444\u0430\u043A\u0435\u043B\u043E\u0432 \u0434\u043B\u044F \u043F\u0435\u0449\u0435\u0440\u044B?","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"\u0422\u043E\u043C \u0434\u043E\u0434\u0435\u043B\u0430\u043B \u0434\u043E\u043C\u0430\u0448\u043A\u0443 \u043F\u043E \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0435 \u0434\u043E Discord?","W-Fragen (What / Where / Why did...?)":"\u0421\u043F\u0435\u0446\u0438\u0430\u043B\u044C\u043D\u044B\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B (What / Where / Why did...?)","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"\u0412\u043E\u043F\u0440\u043E\u0441\u044B \u0441 W","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"\u0415\u0441\u043B\u0438 \u0445\u043E\u0447\u0435\u0448\u044C \u0443\u0437\u043D\u0430\u0442\u044C \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0441\u0442\u0438 (\u0427\u0442\u043E? \u0413\u0434\u0435? \u041A\u043E\u0433\u0434\u0430? \u041F\u043E\u0447\u0435\u043C\u0443? \u041A\u0430\u043A?), \u043F\u0440\u043E\u0441\u0442\u043E \u043F\u043E\u0441\u0442\u0430\u0432\u044C \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0435 \u0441\u043B\u043E\u0432\u043E \u043F\u0440\u044F\u043C\u043E \u043F\u0435\u0440\u0435\u0434 \xABdid\xBB.","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"\u0412\u043E\u043F\u0440\u043E\u0441\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0435 \u0441\u043B\u043E\u0432\u043E (What/Where/When/Why/How) + did + \u043F\u043E\u0434\u043B\u0435\u0436\u0430\u0449\u0435\u0435 + \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u0430\u044F \u0444\u043E\u0440\u043C\u0430?","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"\u041E\u0441\u0442\u043E\u0440\u043E\u0436\u043D\u043E \u0441 \xABWho\xBB \u0432 \u0432\u043E\u043F\u0440\u043E\u0441\u0435 \u043A \u043F\u043E\u0434\u043B\u0435\u0436\u0430\u0449\u0435\u043C\u0443 (\xAB\u041A\u0442\u043E \u044D\u0442\u043E \u043F\u043E\u0441\u0442\u0440\u043E\u0438\u043B?\xBB): \u0442\u0443\u0442 \xABdid\xBB \u0438\u0441\u0447\u0435\u0437\u0430\u0435\u0442 \u2192 \xABWho built this castle?\xBB (2-\u044F \u0444\u043E\u0440\u043C\u0430!).","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"\u0412\u043E\u043F\u0440\u043E\u0441\u044B \u0441 \xABWhen\u2026?\xBB \u0432 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u043F\u043E\u0447\u0442\u0438 \u0432\u0441\u0435\u0433\u0434\u0430 \u0432 Past Simple (\xABWhen did you start?\xBB), \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u044E\u0442 \u043E \u043A\u043E\u043D\u043A\u0440\u0435\u0442\u043D\u043E\u043C \u043C\u043E\u043C\u0435\u043D\u0442\u0435.","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"\u041D\u0430\u0447\u0430\u043B\u044C\u043D\u0430\u044F \u0444\u043E\u0440\u043C\u0430 \xABgo\xBB \u043F\u043E\u0441\u043B\u0435 \xABdid\xBB!","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"\u041D\u0435 \u0437\u0430\u0431\u0443\u0434\u044C \u0432\u0441\u043F\u043E\u043C\u043E\u0433\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0433\u043B\u0430\u0433\u043E\u043B \xABdid\xBB!","Wo hast du die Diamanttruhe versteckt?":"\u0413\u0434\u0435 \u0442\u044B \u0441\u043F\u0440\u044F\u0442\u0430\u043B \u0441\u0443\u043D\u0434\u0443\u043A \u0441 \u0430\u043B\u043C\u0430\u0437\u0430\u043C\u0438?","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"\u041F\u043E\u0447\u0435\u043C\u0443 \u043A\u0440\u0438\u043F\u0435\u0440 \u0432\u0437\u043E\u0440\u0432\u0430\u043B\u0441\u044F \u0432\u043E\u0437\u043B\u0435 \u043D\u0430\u0448\u0435\u0439 \u0444\u0435\u0440\u043C\u044B?","Kurzantworten (Yes, I did)":"\u041A\u0440\u0430\u0442\u043A\u0438\u0435 \u043E\u0442\u0432\u0435\u0442\u044B (Yes, I did)","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"\u0412\u0435\u0436\u043B\u0438\u0432\u043E \u0438 \u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u043E","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"\u0412 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u043E\u0434\u043D\u043E \xABYes.\xBB \u0438\u043B\u0438 \xABNo.\xBB \u0447\u0430\u0441\u0442\u043E \u0437\u0432\u0443\u0447\u0438\u0442 \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u043A\u043E\u0440\u043E\u0442\u043A\u043E \u0438\u043B\u0438 \u0434\u0430\u0436\u0435 \u043D\u0435\u0432\u0435\u0436\u043B\u0438\u0432\u043E. \u041F\u043E\u044D\u0442\u043E\u043C\u0443 \u0432 \u043E\u0442\u0432\u0435\u0442 \u043D\u0430 \u0432\u043E\u043F\u0440\u043E\u0441\u044B \xAB\u0434\u0430/\u043D\u0435\u0442\xBB \u0434\u043E\u0431\u0430\u0432\u043B\u044F\u044E\u0442 \u043C\u0435\u0441\u0442\u043E\u0438\u043C\u0435\u043D\u0438\u0435 + \u0432\u0441\u043F\u043E\u043C\u043E\u0433\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0433\u043B\u0430\u0433\u043E\u043B.","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + \u043C\u0435\u0441\u0442\u043E\u0438\u043C\u0435\u043D\u0438\u0435 + did.  |  No, + \u043C\u0435\u0441\u0442\u043E\u0438\u043C\u0435\u043D\u0438\u0435 + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"\u041D\u0430 \u0432\u043E\u043F\u0440\u043E\u0441\u044B \u0441 \xABWas/Were\u2026?\xBB \u043E\u0442\u0432\u0435\u0447\u0430\u044E\u0442, \u043A\u043E\u043D\u0435\u0447\u043D\u043E, \u0441 was/were (\xABYes, I was.\xBB / \xABNo, they weren\u2019t.\xBB), \u0430 \u043D\u0435 \u0441 did!","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"\u0412 \u043A\u0440\u0430\u0442\u043A\u0438\u0445 \u043E\u0442\u0432\u0435\u0442\u0430\u0445 \u041D\u0418\u041A\u041E\u0413\u0414\u0410 \u043D\u0435 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u044E\u0442 \u043E\u0441\u043D\u043E\u0432\u u5E38\u653E\u5728\u53E5\u672B\uFF01","mine \u2192 mined \xB7 craft \u2192 crafted":"mine \u2192 mined \xB7 craft \u2192 crafted","Basis-Rezept":"\u57FA\u7840\u914D\u65B9","Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.":"\u4E00\u822C\u8FC7\u53BB\u65F6\u7528\u4E8E\u5728\u8FC7\u53BB\u5DF2\u7ECF\u5B8C\u5168\u7ED3\u675F\u7684\u52A8\u4F5C\uFF08\u4F8B\u5982\u6628\u5929\u3001\u4E0A\u5468\u3001\u5047\u671F\u91CC\uFF09\u3002\u5927\u591A\u6570\u82F1\u8BED\u52A8\u8BCD\u53EA\u8981\u52A0\u201C-ed\u201D\u5C31\u884C\u3002","Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)":"\u4E3B\u8BED + \u52A8\u8BCD\u539F\u5F62 + -ed \uFF08\u6240\u6709\u4EBA\u79F0\u90FD\u4E00\u6837\uFF01\uFF09","Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.":"\u8D85\u7EA7\u7B80\u5355\uFF1A\u4E00\u822C\u8FC7\u53BB\u65F6\u4E2D he/she/it \u540E\u9762\u4E0D\u52A0\u201C-s\u201D\uFF01I played, he played, we played\u2014\u2014\u5F62\u5F0F\u5B8C\u5168\u4E00\u6837\u3002","Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).":"\u5178\u578B\u6807\u5FD7\u8BCD\uFF1Ayesterday, last week, in 2024, two days ago\u3002\u5982\u679C\u52A8\u8BCD\u4EE5\u201C-e\u201D\u7ED3\u5C3E\uFF08mine, live, love\uFF09\uFF0C\u53EA\u52A0\u201C-d\u201D\uFF08mined, lived\uFF09\u3002","Kein \u201E-s\u201C bei he/she/it im Past Simple!":"\u4E00\u822C\u8FC7\u53BB\u65F6\u4E2D he/she/it \u4E0D\u52A0\u201C-s\u201D\uFF01","Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.":"\u4EE5\u4E0D\u53D1\u97F3\u7684\u201C-e\u201D\u7ED3\u5C3E\u65F6\uFF0C\u53EA\u52A0\u201C-d\u201D\u3002","Ich baute gestern sechzig Bl\xF6cke Eisen ab.":"\u6211\u6628\u5929\u6316\u4E86\u516D\u5341\u5757\u94C1\u3002","Sie craftete vor dem Raid einen neuen Schild.":"\u5979\u5728\u88AD\u51FB\u4E4B\u524D\u5408\u6210\u4E86\u4E00\u9762\u65B0\u76FE\u724C\u3002","Rechtschreib-Regeln (-ed)":"\u62FC\u5199\u89C4\u5219\uFF08-ed\uFF09","try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played":"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",Rechtschreibung:"\u62FC\u5199","Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!":"\u6709\u4E9B\u89C4\u5219\u52A8\u8BCD\u52A0\u201C-ed\u201D\u65F6\u62FC\u5199\u4F1A\u7A0D\u6709\u53D8\u5316\u3002\u8FD9 3 \u6761\u89C4\u5219\u51E0\u4E4E\u6BCF\u6B21\u82F1\u8BED\u8003\u8BD5\u90FD\u4F1A\u8003\uFF01","Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed":"\u8F85\u97F3 + y \u2192 -ied  |  \u5143\u97F3 + y \u2192 -yed  |  \u77ED\u5143\u97F3 + \u8F85\u97F3 \u2192 \u53CC\u5199\u8F85\u97F3 + -ed","1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"\u6CE8\u610F\u201Cvisit\u201D\u6216\u201Copen\u201D\u8FD9\u7C7B\u53CC\u97F3\u8282\u52A8\u8BCD\uFF1A\u56E0\u4E3A\u91CD\u97F3\u5728\u7B2C\u4E00\u4E2A\u97F3\u8282\uFF0C\u6700\u540E\u4E00\u4E2A\u5B57\u6BCD\u4E0D\u53CC\u5199\uFF08visited, opened\uFF09\u3002","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"\u8F85\u97F3 + y \u53D8\u6210 -ied\uFF1B\u77ED\u7684\u201Cdrop\u201D\u8981\u53CC\u5199 p\uFF01","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"y \u524D\u9762\u662F\u5143\u97F3\uFF08a\uFF09\u2192 y \u4FDD\u6301\u4E0D\u53D8\uFF01","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"Max \u80CC\u5B8C\u82F1\u8BED\u5355\u8BCD\uFF0C\u7136\u540E\u73A9\u4E86 Minecraft\u3002","Das Skelett blieb direkt vor unserer Mauer stehen.":"\u9AB7\u9AC5\u5728\u6211\u4EEC\u7684\u5899\u524D\u505C\u4F4F\u4E86\u3002","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"\u94C1\u7827\u77E5\u8BC6","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"\u8BB8\u591A\u6700\u5E38\u7528\u7684\u82F1\u8BED\u52A8\u8BCD\uFF08\u53BB\u3001\u5EFA\u9020\u3001\u627E\u5230\u3001\u6218\u6597\u3001\u770B\u89C1\uFF09\u4E0D\u9075\u5B88\u201C-ed\u201D\u89C4\u5219\u3002\u5B83\u4EEC\u6709\u81EA\u5DF1\u7684\u7B2C\u4E8C\u5F62\u5F0F\uFF0C\u5FC5\u987B\u80CC\u4E0B\u6765\u3002","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"\u4E3B\u8BED + \u52A8\u8BCD\u7B2C\u4E8C\u5F62\u5F0F\uFF08\u4E00\u822C\u8FC7\u53BB\u65F6\uFF09 \u2014\u2014 \u4F8B\u5982 go \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"\u91CD\u8981\uFF1A\u7B2C\u4E8C\u5F62\u5F0F\u53EA\u7528\u4E8E\u80AF\u5B9A\u53E5\uFF01\u4E00\u65E6\u51FA\u73B0\u201Cdid\u201D\u6216\u201Cdidn\u2019t\u201D\uFF0C\u52A8\u8BCD\u5C31\u56DE\u5230\u7B2C\u4E00\u5F62\u5F0F\u3002","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"\u522B\u628A\u7B2C\u4E8C\u5F62\u5F0F\uFF08\u4E00\u822C\u8FC7\u53BB\u65F6\uFF1Abroke, saw, went\uFF09\u548C\u7B2C\u4E09\u5F62\u5F0F\uFF08\u8FC7\u53BB\u5206\u8BCD\uFF1Abroken, seen, gone\uFF09\u641E\u6DF7\u3002\u7B2C\u4E09\u5F62\u5F0F\u53EA\u5728\u73B0\u5728\u5B8C\u6210\u65F6\u6216\u88AB\u52A8\u8BED\u6001\u4E2D\u624D\u7528\u3002","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"\u6C38\u8FDC\u4E0D\u8981\u7ED9\u4E0D\u89C4\u5219\u52A8\u8BCD\u52A0\u201C-ed\u201D\uFF01","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\u201Cseen\u201D\u662F\u7B2C\u4E09\u5F62\u5F0F\u2014\u2014\u4E00\u822C\u8FC7\u53BB\u65F6\u6C38\u8FDC\u7528\u7B2C\u4E8C\u5F62\u5F0F\u201Csaw\u201D\uFF01","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"\u6211\u4EEC\u6316\u5230 -58 \u5C42\uFF0C\u627E\u5230\u4E86\u516B\u9897\u94BB\u77F3\u3002","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"Leo \u548C\u672B\u5F71\u9F99\u6218\u6597\uFF0C\u8D62\u5F97\u4E86\u6BD4\u8D5B\u3002","Verneinung mit didn't":"\u7528 didn't \u5426\u5B9A","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"\u6700\u91CD\u8981\u7684\u89C4\u5219\uFF01","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"\u60F3\u8BF4\u8FC7\u53BB\u67D0\u4EF6\u4E8B\u6CA1\u6709\u53D1\u751F\u65F6\uFF0C\u6240\u6709\u666E\u901A\u52A8\u8BCD\uFF08be \u548C could \u9664\u5916\uFF09\u90FD\u9700\u8981\u52A9\u52A8\u8BCD\u201Cdidn\u2019t\u201D\uFF08= did not\uFF09\u3002","Subjekt + didn't + Grundform (1. Form des Verbs)":"\u4E3B\u8BED + didn't + \u52A8\u8BCD\u539F\u5F62\uFF08\u52A8\u8BCD\u7B2C\u4E00\u5F62\u5F0F\uFF09","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"\u8BB0\u5FC6\u53E3\u8BC0\uFF1A\u201CDid \u7684\u80CC\u5305\u91CC\u5DF2\u7ECF\u88C5\u7740\u8FC7\u53BB\u65F6\u4E86\uFF01\u201D\u6240\u4EE5\u540E\u9762\u7684\u5B9E\u4E49\u52A8\u8BCD\u6C38\u8FDC\u4FDD\u6301\u539F\u5F62\uFF08\u4E0D\u52A0 -ed\uFF0C\u4E5F\u4E0D\u7528\u7B2C\u4E8C\u5F62\u5F0F\uFF09\u3002","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"\u89C4\u5219\u548C\u4E0D\u89C4\u5219\u52A8\u8BCD\u90FD\u4E00\u6837\uFF1A\u201Cdidn\u2019t play\u201D\u3001\u201Cdidn\u2019t go\u201D\u3001\u201Cdidn\u2019t build\u201D\u3002\u552F\u4E00\u7684\u4F8B\u5916\uFF1Awas/were\uFF08\u2192 wasn\u2019t/weren\u2019t\uFF09\u548C could\uFF08\u2192 couldn\u2019t\uFF09\u3002","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"\u8003\u8BD5\u4E2D\u6700\u5E38\u89C1\u7684\u9519\u8BEF\uFF1A\u201Cdidn\u2019t\u201D\u540E\u9762\u7EDD\u4E0D\u7528\u7B2C\u4E8C\u5F62\u5F0F\uFF01","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"\u82F1\u8BED\u4E2D\u201Cnot\u201D\u4E0D\u80FD\u5355\u72EC\u653E\u5728\u5B9E\u4E49\u52A8\u8BCD\u524D\u9762\u3002","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"\u6211\u6CA1\u4E22\u5251\uFF0C\u56E0\u4E3A\u6211\u628A\u5B83\u653E\u5728\u672B\u5F71\u7BB1\u91CC\u4E86\u3002","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"\u65E5\u843D\u4E4B\u524D\u6211\u4EEC\u6CA1\u6709\u76D6\u5B8C\u5C4B\u9876\u3002","Entscheidungsfragen (Did you...?)":"\u4E00\u822C\u7591\u95EE\u53E5\uFF08Did you...?\uFF09","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"\u662F\u975E\u95EE\u53E5","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"\u8981\u95EE\u4E00\u4E2A\u5173\u4E8E\u8FC7\u53BB\u7684\u662F\u975E\u95EE\u9898\uFF08\u201C\u4F60\u627E\u5230\u2026\u2026\u4E86\u5417\uFF1F\u201D/\u201C\u4F60\u5EFA\u4E86\u2026\u2026\u5417\uFF1F\u201D\uFF09\uFF0C\u53EA\u9700\u628A\u201CDid\u201D\u653E\u5728\u53E5\u9996\u3002","Did + Subjekt + Grundform (1. Form) + ...?":"Did + \u4E3B\u8BED + \u52A8\u8BCD\u539F\u5F62\uFF08\u7B2C\u4E00\u5F62\u5F0F\uFF09+ ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"\u8FD9\u91CC\u201CDid\u201D\u540C\u6837\u628A\u52A8\u8BCD\u7684\u8FC7\u53BB\u65F6\u8BCD\u5C3E\u201C\u62A2\u8D70\u201D\u4E86\uFF01\u6240\u4EE5\u662F\u201CDid you mine?\u201D\uFF08\u4E0D\u662F\u201CDid you mined?\u201D\uFF09\u3002","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"\u5F88\u591A\u5B66\u4E60\u8005\u4F1A\u95EE\u201CHave you played yesterday?\u201D\u2014\u2014\u4F46\u5BF9\u4E8E\u5DF2\u7ED3\u675F\u7684\u8FC7\u53BB\uFF0C\u82F1\u8BED\u8981\u8BF4\u201CDid you play yesterday?\u201D\uFF01","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"\u201CDid\u201D\u540E\u9762\u6C38\u8FDC\u7528\u539F\u5F62\u201Cfind\u201D\uFF01","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"\u82F1\u8BED\u4E2D\u5B9E\u4E49\u52A8\u8BCD\u4E0D\u80FD\u76F4\u63A5\u63D0\u5230\u53E5\u9996\u2014\u2014\u9700\u8981\u201CDid\u201D\u3002","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"\u4F60\u5E26\u591F\u53BB\u6D1E\u7A74\u7528\u7684\u706B\u628A\u4E86\u5417\uFF1F","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"Tom \u5728\u4E0A Discord \u4E4B\u524D\u5199\u5B8C\u6570\u5B66\u4F5C\u4E1A\u4E86\u5417\uFF1F","W-Fragen (What / Where / Why did...?)":"\u7279\u6B8A\u7591\u95EE\u53E5\uFF08What / Where / Why did...?\uFF09","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"\u7279\u6B8A\u7591\u95EE\u53E5","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"\u60F3\u77E5\u9053\u66F4\u5177\u4F53\u7684\u4FE1\u606F\uFF08\u4EC0\u4E48\uFF1F\u54EA\u91CC\uFF1F\u4EC0\u4E48\u65F6\u5019\uFF1F\u4E3A\u4EC0\u4E48\uFF1F\u600E\u4E48\u6837\uFF1F\uFF09\uFF0C\u53EA\u8981\u628A\u82F1\u8BED\u7591\u95EE\u8BCD\u653E\u5728\u201Cdid\u201D\u524D\u9762\u3002","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"\u7591\u95EE\u8BCD\uFF08What/Where/When/Why/How\uFF09+ did + \u4E3B\u8BED + \u52A8\u8BCD\u539F\u5F62\uFF1F","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"\u6CE8\u610F\u201CWho\u201D\u4F5C\u4E3B\u8BED\u63D0\u95EE\u65F6\uFF08\u201C\u8C01\u5EFA\u7684\uFF1F\u201D\uFF09\uFF1A\u4E0D\u7528\u201Cdid\u201D \u2192 \u201CWho built this castle?\u201D\uFF08\u7B2C\u4E8C\u5F62\u5F0F\uFF01\uFF09\u3002","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"\u82F1\u8BED\u4E2D\u7528\u201CWhen\u2026?\u201D\u63D0\u95EE\u51E0\u4E4E\u603B\u662F\u7528\u4E00\u822C\u8FC7\u53BB\u65F6\uFF08\u201CWhen did you start?\u201D\uFF09\uFF0C\u56E0\u4E3A\u95EE\u7684\u662F\u5177\u4F53\u65F6\u95F4\u70B9\u3002","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"\u201Cdid\u201D\u540E\u9762\u7528\u539F\u5F62\u201Cgo\u201D\uFF01","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"\u522B\u5FD8\u4E86\u52A9\u52A8\u8BCD\u201Cdid\u201D\uFF01","Wo hast du die Diamanttruhe versteckt?":"\u4F60\u628A\u94BB\u77F3\u7BB1\u5B50\u85CF\u5728\u54EA\u513F\u4E86\uFF1F","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"\u82E6\u529B\u6015\u4E3A\u4EC0\u4E48\u5728\u6211\u4EEC\u519C\u573A\u9644\u8FD1\u7206\u70B8\u4E86\uFF1F","Kurzantworten (Yes, I did)":"\u7B80\u7565\u56DE\u7B54\uFF08Yes, I did\uFF09","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"\u793C\u8C8C\u53C8\u6B63\u786E","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"\u5728\u82F1\u8BED\u91CC\uFF0C\u53EA\u8BF4\u201CYes.\u201D\u6216\u201CNo.\u201D\u5E38\u5E38\u663E\u5F97\u592A\u751F\u786C\u751A\u81F3\u4E0D\u793C\u8C8C\u3002\u6240\u4EE5\u56DE\u7B54\u662F\u975E\u95EE\u53E5\u65F6\u8981\u52A0\u4E0A\u4EE3\u8BCD + \u52A9\u52A8\u8BCD\u3002","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + \u4EE3\u8BCD + did.  |  No, + \u4EE3\u8BCD + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"\u7528\u201CWas/Were\u2026?\u201D\u63D0\u95EE\u65F6\uFF0C\u5F53\u7136\u7528 was/were \u56DE\u7B54\uFF08\u201CYes, I was.\u201D / \u201CNo, they weren\u2019t.\u201D\uFF09\uFF0C\u800C\u4E0D\u662F did\uFF01","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"\u7B80\u7565\u56DE\u7B54\u4E2D\u7EDD\u4E0D\u91CD\u590D\u5B9E\u4E49\u52A8\u8BCD\uFF08\u6240\u4EE5\u4E0D\u80FD\u8BF4\u201CYes, I did played\u201D\uFF09\u3002","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"\u7B80\u77ED\u3001\u5E72\u8106\u3001\u5B8C\u7F8E\uFF1A\u5C31\u662F\u201CYes, I did.\u201D","Das Hilfsverb in der Antwort passt immer zur Frage!":"\u56DE\u7B54\u4E2D\u7684\u52A9\u52A8\u8BCD\u6C38\u8FDC\u548C\u95EE\u9898\u4E00\u81F4\uFF01","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\u201C\u4F60\u4EEC\u6253\u8D25\u672B\u5F71\u9F99\u4E86\u5417\uFF1F\u201D\u2014\u2014\u201C\u662F\u7684\uFF0C\u6253\u8D25\u4E86\uFF01\u201D","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\u201CMia \u628A\u5979\u7684\u9A6C\u5F04\u4E22\u4E86\u5417\uFF1F\u201D\u2014\u2014\u201C\u4E0D\uFF0C\u6CA1\u6709\u3002\u201D","was & were (Aussage)":"was \u548C were\uFF08\u9648\u8FF0\u53E5\uFF09","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"\u52A8\u8BCD\u201Cto be\u201D","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\u201Cwas\u201D\u548C\u201Cwere\u201D\u662F\u201Cbe\u201D\u7684\u8FC7\u53BB\u5F0F\uFF08\u662F/\u5728 \u2192 \u8FC7\u53BB\u662F/\u8FC7\u53BB\u5728\uFF09\u3002\u7528\u5B83\u4EEC\u63CF\u8FF0\u8FC7\u53BB\u7684\u72B6\u6001\u3001\u611F\u53D7\u3001\u5730\u70B9\u548C\u7279\u70B9\u3002","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"\u8BB0\u4F4F\u201Cyou\u201D\uFF1A\u5373\u4F7F\u4F60\u53EA\u5BF9\u4E00\u4E2A\u670B\u53CB\u8BF4\u8BDD\uFF0C\u82F1\u8BED\u4E5F\u6C38\u8FDC\u8BF4\u201Cyou were\u201D\uFF08\u7EDD\u4E0D\u662F\u201Cyou was\u201D\uFF01\uFF09\u3002","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\u201Ccould\u201D\uFF08\u80FD\u591F\uFF09\u548C was/were \u4E00\u6837\u201C\u5F3A\u201D\uFF1A\u540C\u6837\u4E0D\u9700\u8981\u201Cdid\u201D\u3002","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"\u6807\u51C6\u82F1\u8BED\u4E2D\u201Cyou\u201D\u540E\u9762\u6C38\u8FDC\u7528\u201Cwere\u201D\u3002","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\u201CMy friends\u201D\u662F\u590D\u6570\uFF08= they\uFF09\u2192 \u201Cwere\u201D\uFF01","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"\u5EFA\u5B8C\u90A3\u5EA7\u5DE8\u5927\u7684\u6865\u4E4B\u540E\uFF0C\u6211\u7D2F\u574F\u4E86\u3002","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"\u540C\u5B66\u4EEC\u5BF9\u7EA2\u77F3\u7535\u68AF\u5174\u594B\u6781\u4E86\u3002","wasn't / weren't & Fragen":"wasn't / weren't \u4E0E\u7591\u95EE\u53E5","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"\u4E0D\u7528\u201Cdid\u201D\uFF01","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"\u201Cwas\u201D\u548C\u201Cwere\u201D\u53D8\u5426\u5B9A\u6216\u63D0\u95EE\u65F6\uFF0C\u4E0D\u9700\u8981\u201Cdid\u201D\uFF01\u5B83\u4EEC\u81EA\u5DF1\u5C31\u80FD\u641E\u5B9A\u3002","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"\u4E3B\u8BED + wasn't / weren't   |   Was / Were + \u4E3B\u8BED + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"\u63D0\u95EE\u65F6\uFF0C\u201CWas\u201D\u6216\u201CWere\u201D\u76F4\u63A5\u79FB\u5230\u4E3B\u8BED\u524D\u9762\uFF1A\u201CYou were online.\u201D \u2192 \u201CWere you online?\u201D","Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C).":"\u201Ccould\u201D\u4E5F\u4E00\u6837\uFF1A\u5426\u5B9A\u662F\u201Ccouldn\u2019t\u201D\uFF08\u4E0D\u662F\u201Cdidn\u2019t could\u201D\uFF09\uFF0C\u63D0\u95EE\u662F\u201CCould you\u2026?\u201D\uFF08\u4E0D\u662F\u201CDid you could\u2026?\u201D\uFF09\u3002","Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!":"\u7EDD\u4E0D\u8981\u628A\u201Cdid\u201D\u548C\u201Cwas/were\u201D\u6DF7\u7528\uFF01","Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.":"\
