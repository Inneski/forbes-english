ught...","Fragen & didn't":"Preguntas y didn't","Verneinung & Fragen (did / didn't)":"Negaci\xF3n y preguntas (did / didn't)","didn't + Grundform, Did you...?":"didn't + forma base, Did you...?","was / were":"was / were","was / were & could":"was / were y could","I was, you were, There was/were":"I was, you were, There was/were","Deutsch-Fallen":"Trampas t\xEDpicas","Signalw\xF6rter & Deutsch-Fallen":"Marcadores de tiempo y trampas t\xEDpicas","yesterday, ago & keine Perfekt-Falle":"yesterday, ago y la trampa del present perfect","Gestern Nachmittag baute ich vierzig Bl\xF6cke Kohle in einer riesigen H\xF6hle ab. (mine)":"Ayer por la tarde extraje cuarenta bloques de carb\xF3n en una cueva enorme. (mine)","Bei regelm\xE4\xDFigen Verben, die schon auf \u201E-e\u201C enden (mine \u2192 mined), h\xE4ngt man einfach nur ein \u201E-d\u201C an.":"En los verbos regulares que ya terminan en \u201C-e\u201D (mine \u2192 mined), solo se a\xF1ade una \u201C-d\u201D.","Nach der Schule craftete Leon eine komplette Eisenr\xFCstung. (craft)":"Despu\xE9s del colegio, Leon fabric\xF3 una armadura de hierro completa. (craft)","\u201ECraft\u201C ist ein normales regelm\xE4\xDFiges Verb: einfach \u201E-ed\u201C anh\xE4ngen \u2192 crafted.":"\u201CCraft\u201D es un verbo regular normal: solo hay que a\xF1adir \u201C-ed\u201D \u2192 crafted.","Ich versuchte, \xFCber den Lavafluss zu springen, und schaffte es gerade so! (try)":"\xA1Intent\xE9 saltar por encima del r\xEDo de lava y lo logr\xE9 por los pelos! (try)","Rechtschreib-Regel: Endet ein Verb auf Konsonant + y (try), wird das \u201Ey\u201C zu \u201Eied\u201C \u2192 tried.":"Regla ortogr\xE1fica: si un verbo termina en consonante + y (try), la \u201Cy\u201D se convierte en \u201Cied\u201D \u2192 tried.","Pl\xF6tzlich blieb der laute Zombie direkt vor unserer Eichent\xFCr stehen. (stop)":"De repente, el zombi ruidoso se par\xF3 justo delante de nuestra puerta de roble. (stop)","Bei kurzen Verben mit kurzem Vokal + einfachem Konsonanten am Ende (stop) wird der letzte Konsonant verdoppelt \u2192 stopped.":"En los verbos cortos con vocal corta + una sola consonante al final (stop), la \xFAltima consonante se duplica \u2192 stopped.","Letzten Samstag spielten mein bester Freund und ich zwei Stunden lang BedWars. (play)":"El s\xE1bado pasado, mi mejor amigo y yo jugamos a BedWars durante dos horas. (play)","Achtung! Steht vor dem \u201Ey\u201C ein Vokal (a, e, o, u wie in \u201Eplay\u201C), bleibt das \u201Ey\u201C einfach stehen \u2192 played (NICHT plaied!).":"\xA1Cuidado! Si delante de la \u201Cy\u201D hay una vocal (a, e, o, u, como en \u201Cplay\u201D), la \u201Cy\u201D se queda \u2192 played (\xA1NO plaied!).","Ups! Ich lie\xDF mein verzaubertes Diamantschwert versehentlich in den Kaktus fallen! (drop)":"\xA1Uy! \xA1Se me cay\xF3 sin querer mi espada de diamante encantada en el cactus! (drop)","\u201EDrop\u201C ist kurz und endet auf Vokal + Konsonant (o + p) \u2192 das \u201Ep\u201C wird verdoppelt: dropped.":"\u201CDrop\u201D es corto y termina en vocal + consonante (o + p) \u2192 la \u201Cp\u201D se duplica: dropped.","Vor dem Zocken am Freitag lernte Max 30 Minuten lang seine Englischvokabeln. (study)":"Antes de jugar el viernes, Max estudi\xF3 su vocabulario de ingl\xE9s durante 30 minutos. (study)","Bei \u201Estudy\u201C steht ein Konsonant (d) vor dem \u201Ey\u201C \u2192 aus \u201Ey\u201C wird \u201Eied\u201C: studied.":"En \u201Cstudy\u201D hay una consonante (d) delante de la \u201Cy\u201D \u2192 la \u201Cy\u201D se convierte en \u201Cied\u201D: studied.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: -ed-Rechtschreibung mit \u201Ecarry\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: ortograf\xEDa -ed con \u201Ccarry\u201D)","Sinn: Wir trugen zwei volle Shulker-Boxen zur\xFCck zu unserer Base.":"Sentido: Llevamos dos cajas de shulker llenas de vuelta a nuestra base.","Bei \u201Ecarry\u201C steht der Konsonant \u201Er\u201C vor dem \u201Ey\u201C, deshalb wird das \u201Ey\u201C zu \u201Ei\u201C + \u201E-ed\u201C \u2192 carried.":"En \u201Ccarry\u201D la consonante \u201Cr\u201D va delante de la \u201Cy\u201D, por eso la \u201Cy\u201D se convierte en \u201Ci\u201D + \u201C-ed\u201D \u2192 carried.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verdopplung bei \u201Eplan\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: consonante doble en \u201Cplan\u201D)","Sinn: Unsere Klasse plante letzte Woche eine riesige Mittelalterstadt auf dem Server.":"Sentido: La semana pasada nuestra clase plane\xF3 una enorme ciudad medieval en el servidor.","\u201EPlan\u201C hat einen kurzen betonten Vokal vor einem einzelnen Konsonanten \u2192 das \u201En\u201C wird verdoppelt: planned (\u201Eplaned\u201C w\xE4re \u201Ehobelte\u201C).":"\u201CPlan\u201D tiene una vocal corta acentuada delante de una sola consonante \u2192 la \u201Cn\u201D se duplica: planned (\u201Cplaned\u201D significa \u201Ccepill\xF3\u201D madera).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Evisit\u201C & \u201Estay\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: \u201Cvisit\u201D y \u201Cstay\u201D)","Sinn: Wir besuchten das W\xFCstendorf und blieben bis zum Sonnenaufgang.":"Sentido: Visitamos la aldea del desierto y nos quedamos hasta el amanecer.","\u201EVisit\u201C wird auf der ersten Silbe betont (kein Doppel-t \u2192 visited) und bei \u201Estay\u201C steht ein Vokal vor dem \u201Ey\u201C (\u2192 stayed).":"\u201CVisit\u201D lleva el acento en la primera s\xEDlaba (sin doble t \u2192 visited) y en \u201Cstay\u201D hay una vocal delante de la \u201Cy\u201D (\u2192 stayed).","Letztes Wochenende bauten meine Freunde und ich einen unterirdischen Redstone-Bunker. (build)":"El fin de semana pasado, mis amigos y yo construimos un b\xFAnker subterr\xE1neo de redstone. (build)","\u201EBuild\u201C ist unregelm\xE4\xDFig: build \u2013 built \u2013 built. Niemals \u201Ebuilded\u201C!":"\u201CBuild\u201D es irregular: build \u2013 built \u2013 built. \xA1Nunca \u201Cbuilded\u201D!","Tim grub eine Treppe ganz hinunter bis H\xF6he -58, um Diamanten zu suchen. (dig)":"Tim excav\xF3 una escalera hasta el nivel -58 para buscar diamantes. (dig)","Die 2. Form von \u201Edig\u201C (graben) ist \u201Edug\u201C (dig \u2013 dug \u2013 dug).":"La 2.\xAA forma de \u201Cdig\u201D (excavar) es \u201Cdug\u201D (dig \u2013 dug \u2013 dug).","Rate mal! Ich fand eine Truhe mit zwei verzauberten goldenen \xC4pfeln! (find)":"\xA1Adivina! \xA1Encontr\xE9 un cofre con dos manzanas doradas encantadas! (find)","\u201EFind\u201C wird im Past Simple zu \u201Efound\u201C (find \u2013 found \u2013 found). \u201EFounded\u201C bedeutet \u201Egr\xFCndete\u201C (z. B. eine Firma).":"\u201CFind\u201D en Past Simple es \u201Cfound\u201D (find \u2013 found \u2013 found). \u201CFounded\u201D significa \u201Cfund\xF3\u201D (por ejemplo, una empresa).","Wir gingen durch das lila Portal und landeten direkt neben einer Bastion. (go)":"Atravesamos el portal morado y aparecimos justo al lado de un basti\xF3n. (go)","Eines der wichtigsten unregelm\xE4\xDFigen Verben: go \u2013 went \u2013 gone. Im Past Simple immer \u201Ewent\u201C!":"Uno de los verbos irregulares m\xE1s importantes: go \u2013 went \u2013 gone. \xA1En Past Simple siempre \u201Cwent\u201D!","Zusammen bek\xE4mpfte unser Squad den Enderdrachen und rettete die End-Insel. (fight)":"Juntos, nuestro equipo luch\xF3 contra el Ender Dragon y salv\xF3 la isla del End. (fight)","\u201EFight\u201C hat die unregelm\xE4\xDFige 2. Form \u201Efought\u201C (mit \u201Eou\u201C, genau wie bought und thought).":"\u201CFight\u201D tiene la 2.\xAA forma irregular \u201Cfought\u201D (con \u201Cou\u201D, igual que bought y thought).","Oh nein! Meine Eisenspitzhacke zerbrach genau dann, als ich die Obsidianwand erreichte. (break)":"\xA1Oh, no! Mi pico de hierro se rompi\xF3 justo cuando llegu\xE9 al muro de obsidiana. (break)","break \u2013 broke \u2013 broken. F\xFCr das Past Simple brauchst du die 2. Form: \u201Ebroke\u201C.":"break \u2013 broke \u2013 broken. Para el Past Simple necesitas la 2.\xAA forma: \u201Cbroke\u201D.","Auf dem Dorfmarkt kaufte Jonas ein Reparatur-Buch f\xFCr 14 Smaragde. (buy)":"En el mercado de la aldea, Jonas compr\xF3 un libro de Reparaci\xF3n por 14 esmeraldas. (buy)","buy \u2013 bought \u2013 bought (kaufen). Nicht verwechseln mit \u201Ebrought\u201C (= brachte, von bring)!":"buy \u2013 bought \u2013 bought (comprar). \xA1No lo confundas con \u201Cbrought\u201D (= trajo, de bring)!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Efall\u201C & \u201Elose\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: \u201Cfall\u201D y \u201Close\u201D)","Sinn: Ich fiel in eine tiefe Schlucht und verlor alle meine Fackeln.":"Sentido: Me ca\xED en un barranco profundo y perd\xED todas mis antorchas.","fall \u2013 fell \u2013 fallen (fiel) und lose \u2013 lost \u2013 lost (verlor). \u201EFelt\u201C kommt von \u201Efeel\u201C (f\xFChlen), nicht von \u201Efall\u201C!":"fall \u2013 fell \u2013 fallen (cay\xF3) y lose \u2013 lost \u2013 lost (perdi\xF3). \xA1\u201CFelt\u201D viene de \u201Cfeel\u201D (sentir), no de \u201Cfall\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Esee\u201C & \u201Eswim\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: \u201Csee\u201D y \u201Cswim\u201D)","Sinn: Wir sahen ein Ozeanmonument und schwammen schnell zur Oberfl\xE4che zur\xFCck.":"Sentido: Vimos un monumento oce\xE1nico y nadamos r\xE1pido de vuelta a la superficie.","Beide Verben sind unregelm\xE4\xDFig: see \u2192 saw (2. Form) und swim \u2192 swam (2. Form).":"Los dos verbos son irregulares: see \u2192 saw (2.\xAA forma) y swim \u2192 swam (2.\xAA forma).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewrite\u201C & \u201Ewin\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: \u201Cwrite\u201D y \u201Cwin\u201D)","Sinn: Ben schrieb eine gute Englischarbeit und gewann abends das Minecraft-Turnier.":"Sentido: Ben escribi\xF3 un buen examen de ingl\xE9s y por la tarde gan\xF3 el torneo de Minecraft.","write \u2013 wrote \u2013 written (schrieb) und win \u2013 won \u2013 won (gewann). Beide stehen in der 2. Form!":"write \u2013 wrote \u2013 written (escribi\xF3) y win \u2013 won \u2013 won (gan\xF3). \xA1Los dos van en la 2.\xAA forma!","Ich ging nicht in die Deep-Dark-H\xF6hle, weil ich keine Wollbl\xF6cke hatte. (not go)":"No entr\xE9 en la cueva del Deep Dark porque no ten\xEDa bloques de lana. (not go)","Goldene Regel: Nach \u201Edidn\u2019t\u201C steht IMMER die Grundform (Infinitiv) des Verbs \u2192 didn\u2019t go (NIEMALS didn\u2019t went!).":"Regla de oro: despu\xE9s de \u201Cdidn\u2019t\u201D va SIEMPRE la forma base (infinitivo) del verbo \u2192 didn\u2019t go (\xA1NUNCA didn\u2019t went!).","Hast du gestern bei deiner Mining-Tour Netheritschrott gefunden? (find)":"\xBFEncontraste chatarra de netherita ayer en tu expedici\xF3n minera? (find)","Fragen im Past Simple bildet man mit \u201EDid + Subjekt + Grundform\u201C \u2192 Did you find...?":"Las preguntas en Past Simple se forman con \u201CDid + sujeto + forma base\u201D \u2192 Did you find...?","Was hat Steve mit all dem Redstone-Staub gebaut? (build)":"\xBFQu\xE9 construy\xF3 Steve con todo ese polvo de redstone? (build)","Auch bei W-Fragen (What / Where / Why) gilt: \u201Edid\u201C tr\xE4gt schon die Vergangenheit, das Verb bleibt in der Grundform \u2192 What did Steve build?":"Tambi\xE9n en las preguntas con What / Where / Why: \u201Cdid\u201D ya lleva el pasado y el verbo se queda en forma base \u2192 What did Steve build?","Kurzantwort auf Englisch: \u201ENein, das hat er nicht.\u201C":"Respuesta corta en ingl\xE9s: \u201CNo, no lo hizo.\u201D","Wenn die Frage mit \u201EDid\u2026?\u201C beginnt, antwortet man kurz mit \u201EYes, \u2026 did\u201C oder \u201ENo, \u2026 didn\u2019t\u201C.":"Si la pregunta empieza con \u201CDid\u2026?\u201D, se responde de forma corta con \u201CYes, \u2026 did\u201D o \u201CNo, \u2026 didn\u2019t\u201D.","Warum hat Lukas keinen Wassereimer mitgenommen, bevor er vom Turm sprang? (not take)":"\xBFPor qu\xE9 Lukas no cogi\xF3 un cubo de agua antes de saltar de la torre? (not take)","Verneinte W-Frage im Past Simple: \u201EWhy didn\u2019t + Subjekt + Grundform\u201C \u2192 Why didn\u2019t Lukas take...?":"Pregunta negativa con Why en Past Simple: \u201CWhy didn\u2019t + sujeto + forma base\u201D \u2192 Why didn\u2019t Lukas take...?","Der Creeper hat unser Haus nicht zerst\xF6rt! (not destroy)":"\xA1El Creeper no destruy\xF3 nuestra casa! (not destroy)","F\xFCr die Verneinung normaler Verben im Past Simple brauchst du immer \u201Edidn\u2019t\u201C + Grundform \u2192 didn\u2019t destroy.":"Para negar los verbos normales en Past Simple siempre necesitas \u201Cdidn\u2019t\u201D + forma base \u2192 didn\u2019t destroy.","Kurzantwort: \u201EJa, das haben wir!\u201C":"Respuesta corta: \u201C\xA1S\xED, lo hicimos!\u201D","Auf \u201EDid you and Mia\u2026?\u201C lautet die korrekte englische Kurzantwort einfach \u201EYes, we did!\u201C (ohne das Vollverb zu wiederholen).":"A \u201CDid you and Mia\u2026?\u201D la respuesta corta correcta en ingl\xE9s es simplemente \u201CYes, we did!\u201D (sin repetir el verbo principal).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Verneinung mit \u201Edidn\u2019t\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: negaci\xF3n con \u201Cdidn\u2019t\u201D)","Sinn: Ich habe gestern Abend meine Hausaufgaben nicht vergessen.":"Sentido: Anoche no me olvid\xE9 los deberes.","Nach \u201Edidn\u2019t\u201C schaltet das Verb zur\xFCck in die 1. Form (Grundform): \u201Edidn\u2019t forget\u201C \u2013 niemals \u201Edidn\u2019t forgot\u201C!":"Despu\xE9s de \u201Cdidn\u2019t\u201D el verbo vuelve a la 1.\xAA forma (forma base): \u201Cdidn\u2019t forget\u201D \u2013 \xA1nunca \u201Cdidn\u2019t forgot\u201D!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Fragen mit \u201EDid\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: preguntas con \u201CDid\u201D)","Sinn: Wo hast du gestern diese coole Minecraft-Map heruntergeladen?":"Sentido: \xBFD\xF3nde descargaste ayer ese mapa tan chulo de Minecraft?","Frageformel: Fragewort (Where) + did + Subjekt (you) + Grundform (download) \u2192 kein \u201E-ed\u201C am Verb!":"F\xF3rmula de la pregunta: palabra interrogativa (Where) + did + sujeto (you) + forma base (download) \u2192 \xA1sin \u201C-ed\u201D en el verbo!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Edidn\u2019t\u201C bei unregelm\xE4\xDFigen Verben)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: \u201Cdidn\u2019t\u201D con verbos irregulares)","Sinn: Wir sahen keine Diamanten, deshalb bauten wir stattdessen Eisen ab.":"Sentido: No vimos diamantes, as\xED que extrajimos hierro en su lugar.","Im ersten Teil steht \u201Edidn\u2019t + Grundform\u201C (didn\u2019t see), im zweiten Teil eine normale positive Aussage im Past Simple (mined).":"En la primera parte va \u201Cdidn\u2019t + forma base\u201D (didn\u2019t see) y en la segunda una afirmaci\xF3n normal en Past Simple (mined).","Ich war super nerv\xF6s, als ich den Herzschlag des Wardens h\xF6rte. (be)":"Estaba nervios\xEDsimo cuando o\xED el latido del Warden. (be)","Bei I / he / she / it verwendet man im Past Simple immer \u201Ewas\u201C.":"Con I / he / she / it, en Past Simple siempre se usa \u201Cwas\u201D.","Meine Freunde und ich waren ganz oben in der Berg-Base, als der Sturm begann. (be)":"Mis amigos y yo est\xE1bamos en lo m\xE1s alto de la base de la monta\xF1a cuando empez\xF3 la tormenta. (be)","\u201EMy friends and I\u201C = we (Mehrzahl) \u2192 deshalb geh\xF6rt hier \u201Ewere\u201C hin!":"\u201CMy friends and I\u201D = we (plural) \u2192 \xA1por eso aqu\xED va \u201Cwere\u201D!","Warst du gestern Abend auf unserem Schul-SMP-Server online?":"\xBFEstuviste conectado anoche en el servidor SMP del colegio?","Bei \u201Eyou\u201C steht immer \u201Ewere\u201C \u2013 und bei was/were benutzt man NIEMALS \u201Edid\u201C!":"Con \u201Cyou\u201D siempre va \u201Cwere\u201D \u2013 \xA1y con was/were NUNCA se usa \u201Cdid\u201D!","Es gab drei Baby-Pandas im Bambusdschungel. (There be)":"Hab\xEDa tres pandas beb\xE9 en la jungla de bamb\xFA. (There be)","\u201EThree baby pandas\u201C ist Plural (Mehrzahl) \u2192 \u201EThere were\u201C (es gab). F\xFCr Einzahl nimmt man \u201EThere was\u201C.":"\u201CThree baby pandas\u201D es plural \u2192 \u201CThere were\u201D (hab\xEDa). Para el singular se usa \u201CThere was\u201D.","Der Mathetest war nicht so schwer, wie ich bef\xFCrchtet hatte. (not be)":"El examen de matem\xE1ticas no fue tan dif\xEDcil como me tem\xEDa. (not be)","\u201EThe maths test\u201C = it \u2192 die Verneinung von \u201Ewas\u201C ist einfach \u201Ewasn\u2019t\u201C (ohne \u201Edidn\u2019t\u201C!).":"\u201CThe maths test\u201D = it \u2192 la negaci\xF3n de \u201Cwas\u201D es simplemente \u201Cwasn\u2019t\u201D (\xA1sin \u201Cdidn\u2019t\u201D!).","Dank der Elytra-Fl\xFCgel konnte ich \xFCber den ganzen riesigen Ozean gleiten. (can \u2192 Past Simple)":"Gracias a los \xE9litros pude planear sobre todo el inmenso oc\xE9ano. (can \u2192 Past Simple)","Die Vergangenheit von \u201Ecan\u201C ist \u201Ecould\u201C (konnte). Es braucht kein \u201Edid\u201C und bleibt f\xFCr alle Personen gleich.":"El pasado de \u201Ccan\u201D es \u201Ccould\u201D (pude/pod\xEDa). No necesita \u201Cdid\u201D y es igual para todas las personas.","Es gab eine versteckte Fallt\xFCr direkt unter dem Teppich in der Waldvilla!":"\xA1Hab\xEDa una trampilla escondida justo debajo de la alfombra en la mansi\xF3n del bosque!","\u201EA hidden trapdoor\u201C ist Singular (Einzahl) \u2192 deshalb \u201EThere was\u201C.":"\u201CA hidden trapdoor\u201D es singular \u2192 por eso \u201CThere was\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Frage mit \u201Ewere\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: pregunta con \u201Cwere\u201D)","Sinn: Wart ihr nach dem langen Bosskampf m\xFCde?":"Sentido: \xBFEstabais cansados despu\xE9s de la larga pelea contra el jefe?","\u201Ewas\u201C und \u201Ewere\u201C sind starke Verben: Sie brauchen KEIN \u201Edid\u201C! Man tauscht einfach Subjekt und \u201Ewere\u201C \u2192 Were you tired?":"\u201Cwas\u201D y \u201Cwere\u201D son verbos fuertes: \xA1NO necesitan \u201Cdid\u201D! Basta con invertir el sujeto y \u201Cwere\u201D \u2192 Were you tired?","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ewasn\u2019t / weren\u2019t\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: \u201Cwasn\u2019t / weren\u2019t\u201D)","Sinn: Die Dorfbewohner waren nicht in ihren H\xE4usern, weil es noch Tag war.":"Sentido: Los aldeanos no estaban en sus casas porque todav\xEDa era de d\xEDa.","\u201EThe villagers\u201C = they (Plural) \u2192 \u201Eweren\u2019t\u201C. Bei \u201Ebe\u201C im Past Simple benutzt man niemals \u201Edidn\u2019t\u201C.":"\u201CThe villagers\u201D = they (plural) \u2192 \u201Cweren\u2019t\u201D. Con \u201Cbe\u201D en Past Simple nunca se usa \u201Cdidn\u2019t\u201D.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: \u201Ecouldn\u2019t\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: \u201Ccouldn\u2019t\u201D)","Sinn: Ich konnte das Portal gestern Abend nicht anz\xFCnden, weil mir Feuerstein fehlte.":"Sentido: Anoche no pude encender el portal porque no ten\xEDa pedernal.","\u201ECouldn\u2019t\u201C braucht kein \u201Edid\u201C und steht immer mit der Grundform des Verbs (\u201Ecouldn\u2019t light\u201C).":"\u201CCouldn\u2019t\u201D no necesita \u201Cdid\u201D y siempre va con la forma base del verbo (\u201Ccouldn\u2019t light\u201D).","Achtung Deutsch-Falle! Im Deutschen sagt man \u201EIch habe gestern gebaut\u201C, im Englischen steht bei \u201Eyesterday\u201C aber Past Simple!":"\xA1Cuidado, trampa! Mucha gente dice \u201CI have built yesterday\u201D, pero con \u201Cyesterday\u201D el ingl\xE9s pide Past Simple.","Die #1 Deutsch-Falle! Bei Signalw\xF6rtern wie \u201Eyesterday\u201C (abgeschlossene Vergangenheit) darf NIEMALS Present Perfect (\u201Ehave built\u201C) stehen \u2013 immer Past Simple: \u201Ebuilt\u201C!":"\xA1La trampa n.\xBA 1! Con marcadores como \u201Cyesterday\u201D (pasado terminado) NUNCA puede ir Present Perfect (\u201Chave built\u201D) \u2013 siempre Past Simple: \u201Cbuilt\u201D.","Unsere Klasse startete diese Minecraft-Welt vor drei Monaten.":"Nuestra clase empez\xF3 este mundo de Minecraft hace tres meses.","\u201EVor drei Monaten\u201C hei\xDFt auf Englisch \u201Ethree months ago\u201C \u2013 und \u201Eago\u201C steht immer AM ENDE der Zeitangabe (nicht davor wie \u201Evor\u201C im Deutschen!).":"\u201CHace tres meses\u201D en ingl\xE9s es \u201Cthree months ago\u201D \u2013 y \u201Cago\u201D va siempre AL FINAL de la expresi\xF3n de tiempo (no delante como \u201Chace\u201D).","Wir haben gestern Abend unsere erste Nether-Festung gefunden. (find)":"Anoche encontramos nuestra primera fortaleza del Nether. (find)","\u201ELast night\u201C ist ein klares Past-Simple-Signalwort! Deshalb \u201Efound\u201C statt \u201Ehave found\u201C.":"\u201CLast night\u201D es un marcador claro de Past Simple. Por eso \u201Cfound\u201D y no \u201Chave found\u201D.","Als ich zehn Jahre alt war, baute ich mein allererstes Erdhaus.":"Cuando ten\xEDa diez a\xF1os, constru\xED mi primer\xEDsima casa de tierra.","\u201EWhen I was ten years old\u201C beschreibt einen abgeschlossenen Zeitpunkt in der Vergangenheit \u2192 immer Past Simple (\u201Ewas\u201C).":"\u201CWhen I was ten years old\u201D describe un momento terminado del pasado \u2192 siempre Past Simple (\u201Cwas\u201D).","Mojang ver\xF6ffentlichte das Trial-Chambers-Update im Jahr 2024. (release)":"Mojang public\xF3 la actualizaci\xF3n de las Trial Chambers en 2024. (release)","Bei vergangenen Jahreszahlen wie \u201Ein 2024\u201C steht im Englischen immer Past Simple \u2192 \u201Ereleased\u201C (kein Present Perfect!).":"Con a\xF1os pasados como \u201Cin 2024\u201D, en ingl\xE9s siempre va Past Simple \u2192 \u201Creleased\u201D (\xA1nada de Present Perfect!).","Letzte Woche gab uns unser Englischlehrer ein super cooles Gaming-Quiz.":"La semana pasada nuestro profesor de ingl\xE9s nos puso un quiz de videojuegos genial.","\u201ELetzte Woche / letzten Monat / letztes Jahr\u201C hei\xDFt im Englischen \u201Elast week / last month / last year\u201C (ohne \u201Ethe\u201C!).":"\u201CLa semana pasada / el mes pasado / el a\xF1o pasado\u201D en ingl\xE9s es \u201Clast week / last month / last year\u201D (\xA1sin \u201Cthe\u201D!).","Wann hast du angefangen, Minecraft zu spielen? (start)":"\xBFCu\xE1ndo empezaste a jugar a Minecraft? (start)","Fragen mit \u201EWhen\u2026?\u201C fragen nach einem bestimmten Zeitpunkt in der Vergangenheit \u2192 IMMER Past Simple (\u201EWhen did you start\u2026?\u201C), niemals Present Perfect!":"Las preguntas con \u201CWhen\u2026?\u201D preguntan por un momento concreto del pasado \u2192 SIEMPRE Past Simple (\u201CWhen did you start\u2026?\u201D), \xA1nunca Present Perfect!","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Perfekt-Falle mit \u201Eyesterday\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: la trampa del perfecto con \u201Cyesterday\u201D)","Sinn: Ich habe gestern zwei Stunden lang Minecraft gespielt.":"Sentido: Ayer jugu\xE9 a Minecraft durante dos horas.","Sobald \u201Eyesterday\u201C im Satz steht, ist \u201Ehave played\u201C verboten! Und die englische Wortstellung lautet Subjekt \u2013 Verb \u2013 Objekt \u2013 Zeit.":"En cuanto aparece \u201Cyesterday\u201D en la frase, \u201Chave played\u201D est\xE1 prohibido. Y el orden en ingl\xE9s es sujeto \u2013 verbo \u2013 objeto \u2013 tiempo.","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung mit \u201Eago\u201C)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: orden de palabras con \u201Cago\u201D)","Sinn: Mein Freund hat vor zwei Tagen eine seltene rosa Schaf-Herde gesehen.":"Sentido: Hace dos d\xEDas mi amigo vio un raro reba\xF1o de ovejas rosas.","Zeitangaben mit \u201Eago\u201C stehen am Satzende (oder ganz am Anfang) und \u201Eago\u201C kommt NACH der Zeitspanne: \u201Etwo days ago\u201C + Past Simple (\u201Esaw\u201C).":"Las expresiones con \u201Cago\u201D van al final de la frase (o al principio del todo), y \u201Cago\u201D va DETR\xC1S del periodo de tiempo: \u201Ctwo days ago\u201D + Past Simple (\u201Csaw\u201D).","Welcher Satz im Past Simple ist grammatisch RICHTIG? (Fokus: Wortstellung bei Zeitangaben)":"\xBFQu\xE9 frase en Past Simple es gramaticalmente CORRECTA? (Enfoque: orden de las expresiones de tiempo)","Sinn: Wir haben gestern Abend im Survival-Modus eine neue Base gebaut.":"Sentido: Anoche construimos una base nueva en el modo Supervivencia.","Englische S-V-O-Regel: Subjekt (We) + Verb (built) + Objekt (a new base) + Ort (in Survival mode) + Zeit (last night). Keine Inversion wie im Deutschen (\u201EGestern bauten wir\u201C)!":"Regla S-V-O del ingl\xE9s: sujeto (We) + verbo (built) + objeto (a new base) + lugar (in Survival mode) + tiempo (last night). \xA1Sin inversi\xF3n como en \u201CLast night built we\u201D!","mine \u2192 mined \xB7 craft \u2192 crafted":"mine \u2192 mined \xB7 craft \u2192 crafted","Basis-Rezept":"Receta b\xE1sica","Das Past Simple benutzt du f\xFCr Handlungen, die in der Vergangenheit komplett abgeschlossen sind (z. B. gestern, letzte Woche, in den Ferien). Bei den meisten englischen Verben h\xE4ngst du einfach \u201E-ed\u201C an.":"El Past Simple se usa para acciones completamente terminadas en el pasado (por ejemplo, ayer, la semana pasada, en las vacaciones). En la mayor\xEDa de los verbos ingleses basta con a\xF1adir \u201C-ed\u201D.","Subjekt + Verb-Grundform + -ed  (f\xFCr ALLE Personen gleich!)":"Sujeto + forma base + -ed  (\xA1igual para TODAS las personas!)","Genial einfach: Im Past Simple gibt es KEIN \u201E-s\u201C bei he/she/it! I played, he played, we played \u2013 \xFCberall dieselbe Form.":"Genialmente f\xE1cil: en Past Simple NO hay \u201C-s\u201D con he/she/it. I played, he played, we played \u2013 la misma forma en todas partes.","Typische Signalw\xF6rter: yesterday, last week, in 2024, two days ago. Wenn ein Verb auf \u201E-e\u201C endet (mine, live, love), h\xE4ngst du nur \u201E-d\u201C an (mined, lived).":"Marcadores t\xEDpicos: yesterday, last week, in 2024, two days ago. Si un verbo termina en \u201C-e\u201D (mine, live, love), solo a\xF1ades \u201C-d\u201D (mined, lived).","Kein \u201E-s\u201C bei he/she/it im Past Simple!":"\xA1Sin \u201C-s\u201D con he/she/it en Past Simple!","Bei stummem \u201E-e\u201C am Ende kommt nur ein \u201E-d\u201C dazu.":"Si termina en \u201C-e\u201D muda, solo se a\xF1ade \u201C-d\u201D.","Ich baute gestern sechzig Bl\xF6cke Eisen ab.":"Ayer extraje sesenta bloques de hierro.","Sie craftete vor dem Raid einen neuen Schild.":"Fabric\xF3 un escudo nuevo antes del asalto.","Rechtschreib-Regeln (-ed)":"Reglas ortogr\xE1ficas (-ed)","try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played":"try \u2192 tried \xB7 stop \u2192 stopped \xB7 play \u2192 played",Rechtschreibung:"Ortograf\xEDa","Bei manchen regelm\xE4\xDFigen Verben \xE4ndert sich die Schreibweise leicht, wenn \u201E-ed\u201C angeh\xE4ngt wird. Diese 3 Regeln kommen in fast jeder Englisch-Klassenarbeit dran!":"En algunos verbos regulares la ortograf\xEDa cambia un poco al a\xF1adir \u201C-ed\u201D. \xA1Estas 3 reglas salen en casi todos los ex\xE1menes de ingl\xE9s!","Konsonant + y \u2192 -ied  |  Vokal + y \u2192 -yed  |  kurzer Vokal + Konsonant \u2192 Doppelkonsonant + -ed":"consonante + y \u2192 -ied  |  vocal + y \u2192 -yed  |  vocal corta + consonante \u2192 consonante doble + -ed","1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.":"1) try \u2192 tried, study \u2192 studied, carry \u2192 carried. 2) play \u2192 played, stay \u2192 stayed. 3) stop \u2192 stopped, drop \u2192 dropped, plan \u2192 planned.","Vorsicht bei zweisilbigen Verben wie \u201Evisit\u201C oder \u201Eopen\u201C: Weil die ERSTE Silbe betont wird, wird der letzte Buchstabe NICHT verdoppelt (visited, opened).":"Cuidado con los verbos de dos s\xEDlabas como \u201Cvisit\u201D u \u201Copen\u201D: como se acent\xFAa la PRIMERA s\xEDlaba, la \xFAltima letra NO se duplica (visited, opened).","Konsonant+y wird zu -ied; kurzes \u201Edrop\u201C verdoppelt das p!":"Consonante + y pasa a -ied; \xA1el corto \u201Cdrop\u201D duplica la p!","Vor dem y steht ein Vokal (a) \u2192 das y bleibt stehen!":"Delante de la y hay una vocal (a) \u2192 \xA1la y se queda!","Max lernte seine Englischw\xF6rter und spielte dann Minecraft.":"Max estudi\xF3 sus palabras de ingl\xE9s y luego jug\xF3 a Minecraft.","Das Skelett blieb direkt vor unserer Mauer stehen.":"El esqueleto se par\xF3 justo delante de nuestro muro.","build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found":"build \u2192 built \xB7 go \u2192 went \xB7 find \u2192 found","Amboss-Wissen":"Saber del yunque","Viele der h\xE4ufigsten englischen Verben (gehen, bauen, finden, k\xE4mpfen, sehen) halten sich nicht an die \u201E-ed\u201C-Regel. Sie haben eine eigene 2. Verbform, die man auswendig lernen muss.":"Muchos de los verbos m\xE1s frecuentes del ingl\xE9s (ir, construir, encontrar, luchar, ver) no siguen la regla de \u201C-ed\u201D. Tienen su propia 2.\xAA forma, que hay que aprender de memoria.","Subjekt + 2. Verbform (Past Simple)  \u2014 z. B. go \u2192 went, dig \u2192 dug":"Sujeto + 2.\xAA forma del verbo (Past Simple)  \u2014 p. ej. go \u2192 went, dig \u2192 dug","Wichtig: Die 2. Form benutzt du NUR in positiven Aussages\xE4tzen! Sobald \u201Edid\u201C oder \u201Edidn\u2019t\u201C ins Spiel kommt, springt das Verb zur\xFCck in die 1. Form.":"Importante: la 2.\xAA forma se usa SOLO en frases afirmativas. En cuanto aparece \u201Cdid\u201D o \u201Cdidn\u2019t\u201D, el verbo vuelve a la 1.\xAA forma.","Verwechsle die 2. Form (Past Simple: broke, saw, went) nicht mit der 3. Form (Past Participle: broken, seen, gone). Die 3. Form braucht man erst f\xFCr Present Perfect oder Passiv.":"No confundas la 2.\xAA forma (Past Simple: broke, saw, went) con la 3.\xAA forma (participio: broken, seen, gone). La 3.\xAA forma solo se necesita para el Present Perfect o la pasiva.","Niemals \u201E-ed\u201C an unregelm\xE4\xDFige Verben anh\xE4ngen!":"\xA1Nunca a\xF1adas \u201C-ed\u201D a los verbos irregulares!","\u201Eseen\u201C ist die 3. Form \u2013 im Past Simple immer die 2. Form \u201Esaw\u201C!":"\u201Cseen\u201D es la 3.\xAA forma \u2013 \xA1en Past Simple siempre la 2.\xAA forma \u201Csaw\u201D!","Wir gruben bis H\xF6he -58 und fanden acht Diamanten.":"Excavamos hasta el nivel -58 y encontramos ocho diamantes.","Leo k\xE4mpfte gegen den Enderdrachen und gewann das Spiel.":"Leo luch\xF3 contra el Ender Dragon y gan\xF3 la partida.","Verneinung mit didn't":"Negaci\xF3n con didn't","didn't go \xB7 didn't mine \xB7 didn't find":"didn't go \xB7 didn't mine \xB7 didn't find","Wichtigste Regel!":"\xA1La regla m\xE1s importante!","Wenn du sagen willst, dass etwas in der Vergangenheit NICHT passiert ist, brauchst du bei allen normalen Verben (au\xDFer be & could) das Hilfsverb \u201Edidn\u2019t\u201C (= did not).":"Si quieres decir que algo NO pas\xF3 en el pasado, con todos los verbos normales (menos be y could) necesitas el auxiliar \u201Cdidn\u2019t\u201D (= did not).","Subjekt + didn't + Grundform (1. Form des Verbs)":"Sujeto + didn't + forma base (1.\xAA forma del verbo)","Merkspruch: \u201EDid hat die Vergangenheit schon im Inventar!\u201C Deshalb bleibt das Hauptverb danach IMMER in der Grundform (ohne -ed und ohne 2. Form).":"Truco para recordarlo: \u201C\xA1Did ya lleva el pasado en el inventario!\u201D Por eso el verbo principal se queda SIEMPRE en forma base (sin -ed y sin 2.\xAA forma).","Gilt f\xFCr regelm\xE4\xDFige UND unregelm\xE4\xDFige Verben gleich: \u201Edidn\u2019t play\u201C, \u201Edidn\u2019t go\u201C, \u201Edidn\u2019t build\u201C. Einzige Ausnahmen: was/were (\u2192 wasn\u2019t/weren\u2019t) und could (\u2192 couldn\u2019t).":"Vale igual para verbos regulares E irregulares: \u201Cdidn\u2019t play\u201D, \u201Cdidn\u2019t go\u201D, \u201Cdidn\u2019t build\u201D. \xDAnicas excepciones: was/were (\u2192 wasn\u2019t/weren\u2019t) y could (\u2192 couldn\u2019t).","Der h\xE4ufigste Klassenarbeits-Fehler \xFCberhaupt: Nach \u201Edidn\u2019t\u201C nie die 2. Form!":"El error de examen m\xE1s frecuente: \xA1nunca la 2.\xAA forma despu\xE9s de \u201Cdidn\u2019t\u201D!","Im Englischen kann \u201Enot\u201C nie alleine vor dem Vollverb stehen.":"En ingl\xE9s \u201Cnot\u201D nunca puede ir solo delante del verbo principal.","Ich habe mein Schwert nicht verloren, weil ich es in meiner Endertruhe aufbewahrte.":"No perd\xED mi espada porque la guard\xE9 en mi cofre de ender.","Wir wurden vor Sonnenuntergang nicht mit dem Dach fertig.":"No terminamos el tejado antes de la puesta de sol.","Entscheidungsfragen (Did you...?)":"Preguntas de s\xED/no (Did you...?)","Did you find...? \xB7 Did he build...?":"Did you find...? \xB7 Did he build...?","Ja/Nein-Fragen":"Preguntas de s\xED/no","Um eine Ja/Nein-Frage \xFCber die Vergangenheit zu stellen (\u201EHast du\u2026?\u201C / \u201EBautest du\u2026?\u201C), stellst du einfach \u201EDid\u201C ganz an den Satzanfang.":"Para hacer una pregunta de s\xED/no sobre el pasado (\u201C\xBFEncontraste\u2026?\u201D / \u201C\xBFConstruiste\u2026?\u201D), basta con poner \u201CDid\u201D al principio de la frase.","Did + Subjekt + Grundform (1. Form) + ...?":"Did + sujeto + forma base (1.\xAA forma) + ...?","Auch hier klaut \u201EDid\u201C dem Verb die Vergangenheitsendung! Also \u201EDid you mine?\u201C (NICHT \u201EDid you mined?\u201C).":"\xA1Aqu\xED tambi\xE9n \u201CDid\u201D le roba al verbo la terminaci\xF3n de pasado! As\xED que \u201CDid you mine?\u201D (NO \u201CDid you mined?\u201D).","Im Deutschen fragt man oft mit \u201EHast du gestern gespielt?\u201C \u2013 im Englischen \xFCbersetzt man das bei abgeschlossener Vergangenheit aber mit \u201EDid you play yesterday?\u201C!":"Mucha gente pregunta \u201CHave you played yesterday?\u201D \u2013 pero para un pasado terminado el ingl\xE9s dice \u201CDid you play yesterday?\u201D.","Nach \u201EDid\u201C steht immer die Grundform \u201Efind\u201C!":"\xA1Despu\xE9s de \u201CDid\u201D siempre va la forma base \u201Cfind\u201D!","Im Englischen tauscht man Vollverben nicht einfach nach vorne \u2013 man braucht \u201EDid\u201C.":"En ingl\xE9s los verbos principales no se pasan delante sin m\xE1s \u2013 hace falta \u201CDid\u201D.","Hast du genug Fackeln f\xFCr die H\xF6hle mitgebracht?":"\xBFTrajiste suficientes antorchas para la cueva?","Hat Tom seine Mathe-Hausaufgaben vor Discord fertig gemacht?":"\xBFTermin\xF3 Tom los deberes de matem\xE1ticas antes de Discord?","W-Fragen (What / Where / Why did...?)":"Preguntas con W (What / Where / Why did...?)","What did you craft? \xB7 Where did they go?":"What did you craft? \xB7 Where did they go?","W-Fragen":"Preguntas con W","Wenn du genauere Infos wissen willst (Was? Wo? Wann? Warum? Wie?), setzt du einfach das englische Fragewort direkt vor \u201Edid\u201C.":"Si quieres informaci\xF3n m\xE1s concreta (\xBFQu\xE9? \xBFD\xF3nde? \xBFCu\xE1ndo? \xBFPor qu\xE9? \xBFC\xF3mo?), pon la palabra interrogativa inglesa justo delante de \u201Cdid\u201D.","Fragewort (What/Where/When/Why/How) + did + Subjekt + Grundform?":"Palabra interrogativa (What/Where/When/Why/How) + did + sujeto + forma base?","Achtung bei \u201EWho\u201C als Subjektfrage (\u201EWer hat das gebaut?\u201C): Da f\xE4llt \u201Edid\u201C weg \u2192 \u201EWho built this castle?\u201C (2. Form!).":"Cuidado con \u201CWho\u201D como pregunta de sujeto (\u201C\xBFQui\xE9n construy\xF3 esto?\u201D): ah\xED desaparece \u201Cdid\u201D \u2192 \u201CWho built this castle?\u201D (\xA12.\xAA forma!).","Fragen mit \u201EWhen\u2026?\u201C stehen im Englischen fast immer im Past Simple (\u201EWhen did you start?\u201C), weil nach einem festen Zeitpunkt gefragt wird.":"En ingl\xE9s las preguntas con \u201CWhen\u2026?\u201D van casi siempre en Past Simple (\u201CWhen did you start?\u201D), porque preguntan por un momento concreto.","Grundform \u201Ego\u201C nach \u201Edid\u201C!":"\xA1Forma base \u201Cgo\u201D despu\xE9s de \u201Cdid\u201D!","Vergiss das Hilfsverb \u201Edid\u201C nicht!":"\xA1No olvides el auxiliar \u201Cdid\u201D!","Wo hast du die Diamanttruhe versteckt?":"\xBFD\xF3nde escondiste el cofre de diamantes?","Warum ist der Creeper in der N\xE4he unserer Farm explodiert?":"\xBFPor qu\xE9 explot\xF3 el Creeper cerca de nuestra granja?","Kurzantworten (Yes, I did)":"Respuestas cortas (Yes, I did)","Yes, I did. \xB7 No, we didn\u2019t.":"Yes, I did. \xB7 No, we didn\u2019t.","H\xF6flich & Korrekt":"Educado y correcto","Im Englischen klingt ein einzelnes \u201EYes.\u201C oder \u201ENo.\u201C oft zu knapp oder unh\xF6flich. Deshalb h\xE4ngt man bei Ja/Nein-Fragen das Pronomen + Hilfsverb an.":"En ingl\xE9s un simple \u201CYes.\u201D o \u201CNo.\u201D suele sonar demasiado seco o maleducado. Por eso en las preguntas de s\xED/no se a\xF1ade el pronombre + auxiliar.","Yes, + Pronomen + did.  |  No, + Pronomen + didn't.":"Yes, + pronombre + did.  |  No, + pronombre + didn't.","Bei Fragen mit \u201EWas/Were\u2026?\u201C antwortet man nat\xFCrlich mit was/were (\u201EYes, I was.\u201C / \u201ENo, they weren\u2019t.\u201C), nicht mit did!":"A las preguntas con \u201CWas/Were\u2026?\u201D se responde, claro, con was/were (\u201CYes, I was.\u201D / \u201CNo, they weren\u2019t.\u201D), \xA1no con did!","In Kurzantworten wiederholt man NIEMALS das Vollverb (also NICHT \u201EYes, I did played\u201C).":"En las respuestas cortas NUNCA se repite el verbo principal (o sea, NO \u201CYes, I did played\u201D).","Kurz, knackig und perfekt: einfach \u201EYes, I did.\u201C":"Corta, clara y perfecta: simplemente \u201CYes, I did.\u201D","Das Hilfsverb in der Antwort passt immer zur Frage!":"\xA1El auxiliar de la respuesta siempre coincide con el de la pregunta!","\u201EHabt ihr den Enderdrachen besiegt?\u201C \u2014 \u201EJa, haben wir!\u201C":"\u201C\xBFDerrotasteis al Ender Dragon?\u201D \u2014 \u201C\xA1S\xED!\u201D","\u201EHat Mia ihr Pferd verloren?\u201C \u2014 \u201ENein, hat sie nicht.\u201C":"\u201C\xBFPerdi\xF3 Mia su caballo?\u201D \u2014 \u201CNo.\u201D","was & were (Aussage)":"was y were (afirmaci\xF3n)","I / he / she / it was \xB7 you / we / they were":"I / he / she / it was \xB7 you / we / they were","Verb \u201Eto be\u201C":"El verbo \u201Cto be\u201D","\u201Ewas\u201C und \u201Ewere\u201C sind die Vergangenheitsformen von \u201Ebe\u201C (sein \u2192 war / waren). Damit beschreibst du Zust\xE4nde, Gef\xFChle, Orte und Eigenschaften in der Vergangenheit.":"\u201Cwas\u201D y \u201Cwere\u201D son las formas de pasado de \u201Cbe\u201D (ser/estar \u2192 era, estaba / eran, estaban). Con ellas describes estados, sentimientos, lugares y caracter\xEDsticas en el pasado.","I / he / she / it + was   |   you / we / they + were":"I / he / she / it + was   |   you / we / they + were","Denk an \u201Eyou\u201C: Auch wenn du nur EINEN Freund ansprichst, hei\xDFt es im Englischen IMMER \u201Eyou were\u201C (niemals \u201Eyou was\u201C!).":"Ojo con \u201Cyou\u201D: aunque hables con UN solo amigo, en ingl\xE9s SIEMPRE es \u201Cyou were\u201D (\xA1nunca \u201Cyou was\u201D!).","\u201Ecould\u201C (konnte) verh\xE4lt sich \xE4hnlich stark wie was/were: Es braucht ebenfalls kein \u201Edid\u201C.":"\u201Ccould\u201D (pod\xEDa/pude) es igual de fuerte que was/were: tampoco necesita \u201Cdid\u201D.","Bei \u201Eyou\u201C steht im Standard-Englisch immer \u201Ewere\u201C.":"Con \u201Cyou\u201D, en ingl\xE9s est\xE1ndar siempre va \u201Cwere\u201D.","\u201EMy friends\u201C ist Plural (= they) \u2192 \u201Ewere\u201C!":"\u201CMy friends\u201D es plural (= they) \u2192 \xA1\u201Cwere\u201D!","Ich war ersch\xF6pft, nachdem ich diese riesige Br\xFCcke gebaut hatte.":"Estaba agotado despu\xE9s de construir ese puente enorme.","Unsere Klassenkameraden waren begeistert vom Redstone-Aufzug.":"Nuestros compa\xF1eros de clase estaban entusiasmados con el ascensor de redstone.","wasn't / weren't & Fragen":"wasn't / weren't y preguntas","wasn't \xB7 weren't \xB7 Were you...?":"wasn't \xB7 weren't \xB7 Were you...?","Kein \u201Edid\u201C!":"\xA1Sin \u201Cdid\u201D!","Um \u201Ewas\u201C und \u201Ewere\u201C zu verneinen oder Fragen damit zu stellen, brauchst du KEIN \u201Edid\u201C! Sie sind stark genug, das selbst zu regeln.":"Para negar \u201Cwas\u201D y \u201Cwere\u201D o hacer preguntas con ellos, \xA1NO necesitas \u201Cdid\u201D! Son lo bastante fuertes para hacerlo solos.","Subjekt + wasn't / weren't   |   Was / Were + Subjekt + ...?":"Sujeto + wasn't / weren't   |   Was / Were + sujeto + ...?","F\xFCr Fragen wandert \u201EWas\u201C oder \u201EWere\u201C einfach ganz nach vorne vor das Subjekt: \u201EYou were online.\u201C \u2192 \u201EWere you online?\u201C":"Para preguntar, \u201CWas\u201D o \u201CWere\u201D pasa delante del sujeto: \u201CYou were online.\u201D \u2192 \u201CWere you online?\u201D","Dasselbe gilt f\xFCr \u201Ecould\u201C: Verneinung \u201Ecouldn\u2019t\u201C (nicht \u201Edidn\u2019t could\u201C) und Frage \u201ECould you\u2026?\u201C (nicht \u201EDid you could\u2026?\u201C).":"Lo mismo vale para \u201Ccould\u201D: negaci\xF3n \u201Ccouldn\u2019t\u201D (no \u201Cdidn\u2019t could\u201D) y pregunta \u201CCould you\u2026?\u201D (no \u201CDid you could\u2026?\u201D).","Niemals \u201Edid\u201C mit \u201Ewas/were\u201C mischen!":"\xA1Nunca mezcles \u201Cdid\u201D con \u201Cwas/were\u201D!","Verneinung von \u201Ebe\u201C ist immer \u201Ewasn\u2019t\u201C oder \u201Eweren\u2019t\u201C.":"La negaci\xF3n de \u201Cbe\u201D siempre es \u201Cwasn\u2019t\u201D o \u201Cweren\u2019t\u201D.","Hattest du Angst, als das H\xF6hlenger\xE4usch lief?":"\xBFTuviste miedo cuando son\xF3 el ruido de la cueva?","Der Server war w\xE4hrend der Wartung nicht online.":"El servidor no estuvo en l\xEDnea durante el mantenimiento.","There was / There were":"There was / There were","Es gab (Einzahl & Mehrzahl)":"Hab\xEDa / hubo (singular y plural)",Beschreiben:"Describir","Perfekt, um deine Minecraft-Welt oder ein Erlebnis zu beschreiben: \u201EEs gab eine H\xF6hle\u2026\u201C oder \u201EEs waren drei Zombies da\u2026\u201C.":"Perfecto para describir tu mundo de Minecraft o una aventura: \u201CHab\xEDa una cueva\u2026\u201D o \u201CHab\xEDa tres zombis\u2026\u201D.","There was + Einzahl (a/an/one)   |   There were + Mehrzahl (two, many, some...)":"There was + singular (a/an/one)   |   There were + plural (two, many, some...)","Verneinung: \u201EThere wasn\u2019t any lava.\u201C / \u201EThere weren\u2019t any Creepers.\u201C Frage: \u201EWas there a chest?\u201C / \u201EWere there any villagers?\u201C":"Negaci\xF3n: \u201CThere wasn\u2019t any lava.\u201D / \u201CThere weren\u2019t any Creepers.\u201D Pregunta: \u201CWas there a chest?\u201D / \u201CWere there any villagers?\u201D","Im Deutschen sagt man immer \u201EEs gab\u2026\u201C (egal ob ein Creeper oder zehn). Im Englischen musst du genau auf Einzahl (was) vs. Mehrzahl (were) achten!":"En espa\xF1ol \u201Chab\xEDa\u201D sirve igual para un Creeper que para diez. En ingl\xE9s tienes que fijarte en singular (was) o plural (were).","F\xFCnf Zombies = Plural \u2192 \u201EThere were\u201C!":"Cinco zombis = plural \u2192 \xA1\u201CThere were\u201D!","\u201EEs gab\u201C hei\xDFt NIEMALS \u201Eit gave\u201C, sondern immer \u201EThere was / There were\u201C!":"\u201CHab\xEDa/hubo\u201D NUNCA es \u201Cit had\u201D, sino siempre \u201CThere was / There were\u201D.","Es gab einen Schmied mit Diamantstiefeln im Dorf.":"Hab\xEDa un herrero con botas de diamante en la aldea.","Es gab zwanzig Fackeln, die den Tunnel beleuchteten.":"Hab\xEDa veinte antorchas iluminando el t\xFAnel.","Signalw\xF6rter (yesterday, ago, last...)":"Marcadores de tiempo (yesterday, ago, last...)","Die Zeitportal-Marker des Past Simple":"Los marcadores del portal del tiempo del Past Simple","Zeit-Kompass":"Br\xFAjula del tiempo","Signalw\xF6rter verraten dir in Tests sofort, dass du das Past Simple benutzen musst. Sie zeigen an, dass ein Zeitpunkt komplett in der Vergangenheit liegt.":"En los ex\xE1menes, los marcadores de tiempo te dicen enseguida que tienes que usar el Past Simple. Indican que un momento est\xE1 completamente en el pasado.","yesterday \xB7 last night/week/year \xB7 [Zeit] + ago \xB7 in 2023 \xB7 when I was...":"yesterday \xB7 last night/week/year \xB7 [tiempo] + ago \xB7 in 2023 \xB7 when I was...","Wortstellung im Englischen: Zeitangaben stehen am SATZENDE (oder ganz am Satzanfang) \u2013 niemals zwischen Verb und Objekt!":"Orden de palabras en ingl\xE9s: las expresiones de tiempo van al FINAL de la frase (o al principio) \u2013 \xA1nunca entre el verbo y el objeto!","\u201Evor zwei Tagen\u201C = \u201Etwo days ago\u201C (ago steht HINTER der Zahl). \u201Eletzte Woche\u201C = \u201Elast week\u201C (OHNE \u201Ethe\u201C!).":"\u201Chace dos d\xEDas\u201D = \u201Ctwo days ago\u201D (ago va DETR\xC1S del n\xFAmero). \u201Cla semana pasada\u201D = \u201Clast week\u201D (\xA1SIN \u201Cthe\u201D!).","\u201Eago\u201C steht hinter der Zeitspanne und die Zeitangabe am Satzende.":"\u201Cago\u201D va detr\xE1s del periodo de tiempo y la expresi\xF3n de tiempo al final de la frase.","Im Englischen bleibt immer Subjekt vor Verb (we played)!":"\xA1En ingl\xE9s el sujeto va siempre delante del verbo (we played)!","Wir haben den Enderdrachen vor zwei Wochen besiegt.":"Derrotamos al Ender Dragon hace dos semanas.","Gestern Abend habe ich eine automatische Bambusfarm gebaut.":"Anoche constru\xED una granja de bamb\xFA autom\xE1tica.","Die Perfekt-Falle f\xFCr Deutsche":"La trampa del present perfect","Past Simple vs. Present Perfect":"Past Simple vs. Present Perfect","Creeper-Falle #1":"Trampa Creeper n.\xBA 1","Im Deutschen erz\xE4hlen wir fast alles im Perfekt: \u201EIch HABE gestern gespielt.\u201C Wenn du das w\xF6rtlich ins Englische \xFCbersetzt (\u201EI have played yesterday\u201C), explodiert der Satz wie ein Creeper!":"Muchos idiomas cuentan el pasado con \u201Chaber + participio\u201D (\u201Che jugado\u201D). Si lo pasas al ingl\xE9s junto a \u201Cyesterday\u201D (\u201CI have played yesterday\u201D), \xA1la frase explota como un Creeper!","Fester Zeitpunkt in der Vergangenheit (yesterday, last, ago, When...?) \u2192 IMMER Past Simple!":"Momento fijo en el pasado (yesterday, last, ago, When...?) \u2192 \xA1SIEMPRE Past Simple!","Das Present Perfect (\u201EI have played\u201C) nutzt man im Englischen nur ohne festen Vergangenheitszeitpunkt (z. B. Erfahrungen im Leben: \u201EHave you ever played Minecraft?\u201C).":"El Present Perfect (\u201CI have played\u201D) solo se usa en ingl\xE9s sin un momento fijo del pasado (p. ej. experiencias vitales: \u201CHave you ever played Minecraft?\u201D).","Faustregel f\xFCr die Schule: Siehst du yesterday, last\u2026, \u2026ago, in 2022 oder When\u2026? \u2192 Finger weg von have/has! Nimm Past Simple!":"Regla pr\xE1ctica para el cole: si ves yesterday, last\u2026, \u2026ago, in 2022 o When\u2026? \u2192 \xA1nada de have/has! \xA1Usa el Past Simple!","\u201Eyesterday\u201C + Present Perfect ist im Englischen immer falsch!":"\xA1\u201Cyesterday\u201D + Present Perfect siempre est\xE1 mal en ingl\xE9s!","\u201EWhen\u2026?\u201C
