<style>
  :root {
    --forest: #1B2A3E;
    --forest-mid: #24384F;
    --forest-light: #4A6E93;
    --sage: #6E93B0;
    --sage-pale: #B9CEE0;
    --parchment: #F5EAD0;
    --parchment-dark: #E8D9B8;
    --amber: #A64E64;
    --amber-light: #C97088;
    --bone: #EFE6D2;
    --text-dark: #1B2230;
    --text-mid: #3A4A5C;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(26,58,42,0.13);
    --shadow-lg: 0 12px 48px rgba(26,58,42,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background-color: var(--forest);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(110,147,176,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(166,78,100,0.08) 0%, transparent 60%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236e93b0' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    min-height: 100vh;
    padding: 32px 16px 64px;
    color: var(--text-dark);
  }

  .page-wrap { max-width: 820px; margin: 0 auto; }

  /* ── LOGO ── */
  .logo-block {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.7s ease both;
  }
  .logo-block svg { width: 200px; height: auto; display: inline-block; }

  /* ── LESSON HEADER ── */
  .lesson-header {
    background: linear-gradient(135deg, var(--forest-mid) 0%, var(--forest) 100%);
    border: 1px solid rgba(122,171,142,0.25);
    border-radius: 16px;
    padding: 32px 36px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
    animation: fadeDown 0.7s 0.1s ease both;
  }
  .lesson-header::before {
    content: '🦕';
    position: absolute; right: 28px; top: 50%; transform: translateY(-50%);
    font-size: 72px; opacity: 0.12; pointer-events: none;
  }
  .lesson-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.85rem; font-weight: 900;
    color: var(--parchment); line-height: 1.2; margin-bottom: 8px;
  }
  .lesson-header p { font-size: 0.95rem; color: var(--sage-pale); font-weight: 300; letter-spacing: 0.03em; }
  .badge {
    display: inline-block; background: var(--amber); color: var(--white);
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 12px;
  }

  /* ── HERO ── */
  .hero-wrap { max-width: 720px; margin: 0 auto 24px; animation: fadeDown 0.7s 0.15s ease both; }
  .hero-frame { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-lg); }
  .hero-frame img { width: 100%; height: auto; display: block; }
  .hero-cap { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13.5px; color: var(--sage-pale); text-align: center; margin-top: 8px; }

  /* ── SCORE BAR ── */
  .score-bar {
    background: var(--forest-mid);
    border: 1px solid rgba(122,171,142,0.2);
    border-radius: 12px; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; animation: fadeDown 0.7s 0.2s ease both;
  }
  .score-label { font-size: 0.82rem; color: var(--sage-pale); letter-spacing: 0.05em; text-transform: uppercase; }
  .score-value { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--amber-light); font-weight: 700; }
  .activity-tag { font-size: 0.78rem; color: var(--sage); text-transform: uppercase; letter-spacing: 0.08em; }

  /* ── CARD ── */
  .card {
    background: var(--parchment); border-radius: 16px;
    padding: 36px; box-shadow: var(--shadow-lg);
    animation: fadeUp 0.5s ease both; position: relative;
  }

  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .progress-label { font-size: 0.8rem; color: var(--text-mid); letter-spacing: 0.06em; text-transform: uppercase; }
  .progress-bar-wrap { flex: 1; margin: 0 16px; height: 6px; background: var(--parchment-dark); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--forest-light), var(--amber)); border-radius: 99px; transition: width 0.5s ease; }

  .question-type-label {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--forest-light);
    margin-bottom: 10px; display: block;
  }
  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.18rem; color: var(--text-dark);
    line-height: 1.6; margin-bottom: 26px; font-weight: 400;
  }
  .question-text em { font-style: italic; color: var(--forest-mid); }

  /* ── MCQ OPTIONS ── */
  .options-grid { display: flex; flex-direction: column; gap: 12px; }
  .option-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; background: var(--white);
    border: 2px solid var(--parchment-dark); border-radius: 10px;
    cursor: pointer; font-family: 'Lato', sans-serif;
    font-size: 0.97rem; color: var(--text-dark);
    text-align: left; transition: border-color 0.2s, background 0.2s, transform 0.1s;
    line-height: 1.45; width: 100%;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--sage); background: #f0f8f4; transform: translateX(3px); }
  .option-letter {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--parchment-dark); display: flex; align-items: center; justify-content: center;
    font-size: 0.82rem; font-weight: 700; flex-shrink: 0;
    color: var(--forest-mid); transition: background 0.2s, color 0.2s;
  }
  .option-btn.correct { border-color: #2e8b57 !important; background: #eaf6ee !important; }
  .option-btn.correct .option-letter { background: #2e8b57; color: white; }
  .option-btn.wrong { border-color: #b84040 !important; background: #fdf0f0 !important; }
  .option-btn.wrong .option-letter { background: #b84040; color: white; }
  .option-btn.selected-mcq { border-color: var(--amber); background: #fdf5eb; }
  .option-btn:disabled { cursor: default; }

  /* ── FILL IN THE BLANK ── */
  .fitb-sentence {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.28rem; line-height: 2.2;
    color: var(--text-dark); margin-bottom: 20px;
  }
  .blank-input {
    border: none; border-bottom: 2.5px solid var(--amber);
    background: transparent; font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; color: var(--forest-mid);
    width: 180px; outline: none; padding: 2px 4px;
    text-align: center; transition: border-color 0.2s;
  }
  .blank-input.correct { border-color: #2e8b57; color: #2e8b57; }
  .blank-input.wrong { border-color: #b84040; color: #b84040; }

  .word-bank {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 24px; padding: 16px;
    background: var(--white); border-radius: 10px;
    border: 1px solid var(--parchment-dark);
  }
  .word-chip {
    padding: 7px 16px; background: var(--forest);
    color: var(--parchment); border-radius: 999px;
    font-size: 0.9rem; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    font-weight: 400; letter-spacing: 0.02em; user-select: none;
  }
  .word-chip:hover:not(.used) { background: var(--forest-light); transform: translateY(-2px); }
  .word-chip.used { opacity: 0.35; pointer-events: none; }
  .word-chip.chip-selected { outline: 2.5px solid var(--amber); background: var(--forest-light); }

  /* ── MATCHING ── */
  .match-col-header {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--forest-mid);
    margin-bottom: 6px; text-align: center;
  }
  .match-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .match-col { display: flex; flex-direction: column; gap: 10px; }
  .match-item {
    padding: 12px 16px; background: var(--white);
    border: 2px solid var(--parchment-dark); border-radius: 10px;
    font-size: 0.93rem; color: var(--text-dark);
    cursor: pointer; text-align: center;
    transition: border-color 0.2s, background 0.2s;
    line-height: 1.4; min-height: 54px;
    display: flex; align-items: center; justify-content: center;
  }
  .match-item.selected { border-color: var(--amber); background: #fdf5eb; }
  .match-item.matched { border-color: #2e8b57; background: #eaf6ee; pointer-events: none; cursor: default; }
  .match-item.wrong-match { border-color: #b84040; background: #fdf0f0; }

  /* ── REORDER ── */
  .reorder-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .reorder-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; background: var(--white);
    border: 2px solid var(--parchment-dark); border-radius: 10px;
    cursor: grab; font-size: 0.93rem; color: var(--text-dark);
    transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
    user-select: none; line-height: 1.45;
  }
  .reorder-item:active { cursor: grabbing; }
  .reorder-item.dragging { opacity: 0.35; border-style: dashed; }
  .reorder-item.drag-over { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(200,133,58,0.2); }
  .reorder-item.correct-order { border-color: #2e8b57; background: #eaf6ee; }
  .reorder-item.wrong-order { border-color: #b84040; background: #fdf0f0; }
  .drag-handle { color: var(--sage); font-size: 1.1rem; flex-shrink: 0; }

  /* ── FEEDBACK ── */
  .feedback-box {
    margin-top: 20px; padding: 16px 20px; border-radius: 10px;
    font-size: 0.95rem; line-height: 1.6; display: none;
    animation: fadeUp 0.3s ease both;
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { background: #eaf6ee; border-left: 4px solid #2e8b57; color: #1a4a2a; }
  .feedback-box.wrong-fb { background: #fdf0f0; border-left: 4px solid #b84040; color: #4a1a1a; }
  .feedback-box.partial-fb { background: #fdf5eb; border-left: 4px solid var(--amber); color: #4a3010; }
  .feedback-title { font-weight: 700; margin-bottom: 4px; }
  .feedback-explanation { font-size: 0.88rem; margin-top: 6px; opacity: 0.9; }

  /* ── BUTTONS ── */
  .btn-row { display: flex; justify-content: flex-end; margin-top: 24px; gap: 12px; }
  .btn-submit, .btn-next {
    padding: 13px 32px; border: none; border-radius: 10px;
    font-family: 'Lato', sans-serif; font-size: 0.95rem;
    font-weight: 700; cursor: pointer; letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-submit { background: var(--forest); color: var(--parchment); }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,58,42,0.3); }
  .btn-next { background: var(--amber); color: var(--white); display: none; }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,133,58,0.4); }

  /* ── ACTIVITY INTRO ── */
  .activity-intro {
    background: var(--forest-mid); border-radius: 12px;
    padding: 20px 24px; margin-bottom: 22px;
    display: flex; gap: 16px; align-items: flex-start;
    border-left: 4px solid var(--amber);
  }
  .activity-intro-icon { font-size: 1.8rem; flex-shrink: 0; }
  .activity-intro-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--parchment); font-weight: 700; margin-bottom: 4px; }
  .activity-intro-desc { font-size: 0.88rem; color: var(--sage-pale); line-height: 1.5; }

  /* ── FINAL SCREEN ── */
  .final-screen { display: none; text-align: center; padding: 20px 0; }
  .final-screen.show { display: block; animation: fadeUp 0.6s ease both; }
  .final-dino { font-size: 80px; margin-bottom: 16px; }
  .final-score-big { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--forest-mid); font-weight: 900; margin-bottom: 8px; }
  .final-label { font-size: 1rem; color: var(--text-mid); margin-bottom: 20px; }
  .final-message {
    font-family: 'Cormorant Garamond', serif; font-size: 1.35rem;
    font-style: italic; color: var(--forest-mid);
    max-width: 480px; margin: 0 auto 32px; line-height: 1.7;
  }
  .btn-restart {
    padding: 14px 40px; background: var(--forest); color: var(--parchment);
    border: none; border-radius: 10px; font-family: 'Lato', sans-serif;
    font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,58,42,0.3); }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown { from { opacity:0; transform:translateY(-18px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(18px);  } to { opacity:1; transform:translateY(0); } }

  @media (max-width: 560px) {
    .card { padding: 20px 16px; }
    .match-cols { grid-template-columns: 1fr; }
    .question-text { font-size: 1.05rem; }
    .lesson-header { padding: 24px 20px; }
  }
</style>

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let S = {
  actIdx: 0,
  qIdx: 0,
  totalCorrect: 0,
  totalAnswered: 0,
  answered: false,
  // MCQ
  mcqSelected: null,
  // FITB
  filledWord: null,
  // Matching
  matchPhase: true, // true = matching, false = reorder
  matchLeft: null,
  matchRight: null,
  leftMatches: {},    // leftIdx -> rightIdx
  rightShuffle: [],   // shuffled right indices
  matchSubmitted: false,
  // Reorder
  reorderItems: [],
  reorderSubmitted: false
};

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
const el = id => document.getElementById(id);
const qs = sel => document.querySelector(sel);
const qsa = sel => document.querySelectorAll(sel);

function updateScoreBar() {
  el('scoreDisplay').textContent = S.totalCorrect + ' / ' + S.totalAnswered;
  el('activityTagDisplay').textContent = 'Activity ' + (S.actIdx + 1) + ' of ' + DATA.activities.length;
}

function updateProgress(cur, total) {
  el('progressLabel').textContent = 'Question ' + cur + ' of ' + total;
  el('progressFill').style.width = (((cur - 1) / total) * 100) + '%';
}

function showFeedback(cls, title, exp) {
  const fb = el('feedbackBox');
  fb.className = 'feedback-box show ' + cls;
  el('feedbackTitle').textContent = title;
  el('feedbackExplanation').textContent = exp;
  el('btnNext').style.display = 'inline-block';
  el('btnSubmit').style.display = 'none';
}

function clearFeedback() {
  el('feedbackBox').className = 'feedback-box';
  el('feedbackTitle').textContent = '';
  el('feedbackExplanation').textContent = '';
  el('btnNext').style.display = 'none';
  el('btnSubmit').style.display = 'inline-block';
  el('btnSubmit').textContent = 'Check Answer';
}

// ═══════════════════════════════════════════
// MCQ
// ═══════════════════════════════════════════
function renderMCQ() {
  const act = DATA.activities[S.actIdx];
  const q = act.questions[S.qIdx];
  const total = act.questions.length;
  updateProgress(S.qIdx + 1, total);

  const letters = ['A','B','C','D'];
  const optsHTML = q.opts.map((o, i) =>
    `<button class="option-btn" id="opt${i}" onclick="clickMCQ(${i})">
       <span class="option-letter">${letters[i]}</span>${o}
     </button>`
  ).join('');

  el('activityArea').innerHTML = `
    <div class="activity-intro">
      <div class="activity-intro-icon">${act.icon}</div>
      <div>
        <div class="activity-intro-title">${act.title}</div>
        <div class="activity-intro-desc">${act.desc}</div>
      </div>
    </div>
    <span class="question-type-label">Multiple Choice</span>
    <div class="question-text">${q.text}</div>
    <div class="options-grid">${optsHTML}</div>`;

  S.mcqSelected = null;
  S.answered = false;
  el('btnSubmit').onclick = submitMCQ;
  el('btnSubmit').textContent = 'Check Answer';
}

function clickMCQ(i) {
  if (S.answered) return;
  S.mcqSelected = i;
  qsa('.option-btn').forEach((b, idx) => {
    b.className = 'option-btn' + (idx === i ? ' selected-mcq' : '');
  });
}

function submitMCQ() {
  if (S.mcqSelected === null) { alert('Please select an answer first.'); return; }
  S.answered = true;
  S.totalAnswered++;
  const q = DATA.activities[S.actIdx].questions[S.qIdx];
  qsa('.option-btn').forEach(b => b.disabled = true);
  if (S.mcqSelected === q.correct) {
    S.totalCorrect++;
    el('opt' + S.mcqSelected).className = 'option-btn correct';
    showFeedback('correct-fb', '✓ Correct!', q.exp);
  } else {
    el('opt' + S.mcqSelected).className = 'option-btn wrong';
    el('opt' + q.correct).className = 'option-btn correct';
    showFeedback('wrong-fb', '✗ Not quite.', q.exp);
  }
  updateScoreBar();
}

// ═══════════════════════════════════════════
// FITB
// ═══════════════════════════════════════════
function renderFITB() {
  const act = DATA.activities[S.actIdx];
  const q = act.questions[S.qIdx];
  const total = act.questions.length;
  updateProgress(S.qIdx + 1, total);

  const shuffled = [...q.bank].map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

  const sentHTML = q.parts[0]
    + `<input class="blank-input" id="blankInput" placeholder="__________" readonly>`
    + q.parts[2];

  const bankHTML = shuffled.map(w =>
    `<span class="word-chip" id="chip_${w}" onclick="clickChip('${w}')">${w}</span>`
  ).join('');

  el('activityArea').innerHTML = `
    <div class="activity-intro">
      <div class="activity-intro-icon">${act.icon}</div>
      <div>
        <div class="activity-intro-title">${act.title}</div>
        <div class="activity-intro-desc">${act.desc}</div>
      </div>
    </div>
    <span class="question-type-label">Fill in the Blank</span>
    <div class="fitb-sentence">${sentHTML}</div>
    <div style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-mid);margin-bottom:8px;">Word Bank</div>
    <div class="word-bank">${bankHTML}</div>`;

  S.filledWord = null;
  S.answered = false;
  el('btnSubmit').onclick = submitFITB;
  el('btnSubmit').textContent = 'Check Answer';
}

function clickChip(word) {
  if (S.answered) return;
  // Deselect all
  qsa('.word-chip').forEach(c => { c.classList.remove('chip-selected'); });
  // Fill blank with this word
  const inp = el('blankInput');
  if (inp) {
    // If same word clicked again, clear
    if (S.filledWord === word) {
      inp.value = '';
      S.filledWord = null;
      qsa('.word-chip').forEach(c => c.classList.remove('used'));
      return;
    }
    // Restore previously used chip
    if (S.filledWord) {
      const prev = el('chip_' + S.filledWord);
      if (prev) prev.classList.remove('used');
    }
    inp.value = word;
    S.filledWord = word;
    el('chip_' + word).classList.add('used');
  }
}

function submitFITB() {
  const inp = el('blankInput');
  if (!inp || !S.filledWord) { alert('Please select a word from the bank first.'); return; }
  S.answered = true;
  S.totalAnswered++;
  const q = DATA.activities[S.actIdx].questions[S.qIdx];
  if (S.filledWord.toLowerCase() === q.answer.toLowerCase()) {
    S.totalCorrect++;
    inp.className = 'blank-input correct';
    showFeedback('correct-fb', '✓ Correct!', q.exp);
  } else {
    inp.className = 'blank-input wrong';
    showFeedback('wrong-fb', '✗ Not quite. The correct answer is: ' + q.answer, q.exp);
  }
  updateScoreBar();
}

// ═══════════════════════════════════════════
// MATCHING
// ═══════════════════════════════════════════
function renderMatching() {
  const act = DATA.activities[S.actIdx];
  const mq = act.matchQ;
  updateProgress(1, 2);

  // Shuffle right column
  S.rightShuffle = mq.pairs.map((_,i)=>i).map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
  S.matchLeft = null; S.matchRight = null;
  S.leftMatches = {}; S.matchSubmitted = false; S.answered = false;

  const leftCols = mq.pairs.map((p,i)=>
    `<div class="match-item" id="ML${i}" onclick="clickMatchLeft(${i})">${p.L}</div>`
  ).join('');

  const rightCols = S.rightShuffle.map((origIdx,dispIdx)=>
    `<div class="match-item" id="MR${origIdx}" onclick="clickMatchRight(${origIdx})">${mq.pairs[origIdx].R}</div>`
  ).join('');

  el('activityArea').innerHTML = `
    <div class="activity-intro">
      <div class="activity-intro-icon">${act.icon}</div>
      <div>
        <div class="activity-intro-title">${act.title} (1/2)</div>
        <div class="activity-intro-desc">${act.desc}</div>
      </div>
    </div>
    <span class="question-type-label">Matching</span>
    <div class="question-text">${mq.text}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:6px;">
      <div class="match-col-header">Dinosaur / Concept</div>
      <div class="match-col-header">Description</div>
    </div>
    <div class="match-cols">
      <div class="match-col" id="matchLeft">${leftCols}</div>
      <div class="match-col" id="matchRight">${rightCols}</div>
    </div>
    <div style="margin-top:10px;font-size:0.82rem;color:var(--text-mid);">Select a term on the left, then its matching description on the right.</div>`;

  el('btnSubmit').onclick = submitMatching;
  el('btnSubmit').textContent = 'Check Matches';
}

function clickMatchLeft(i) {
  if (S.matchSubmitted) return;
  if (el('ML'+i).classList.contains('matched')) return;
  // Deselect any other left
  DATA.activities[S.actIdx].matchQ.pairs.forEach((_,idx) => {
    const e = el('ML'+idx);
    if (e && !e.classList.contains('matched')) e.classList.remove('selected');
  });
  S.matchLeft = i;
  el('ML'+i).classList.add('selected');
  tryPair();
}

function clickMatchRight(origIdx) {
  if (S.matchSubmitted) return;
  if (el('MR'+origIdx).classList.contains('matched')) return;
  // Deselect any other right
  DATA.activities[S.actIdx].matchQ.pairs.forEach((_,idx) => {
    const e = el('MR'+idx);
    if (e && !e.classList.contains('matched')) e.classList.remove('selected');
  });
  S.matchRight = origIdx;
  el('MR'+origIdx).classList.add('selected');
  tryPair();
}

function tryPair() {
  if (S.matchLeft !== null && S.matchRight !== null) {
    S.leftMatches[S.matchLeft] = S.matchRight;
    el('ML'+S.matchLeft).classList.remove('selected');
    el('MR'+S.matchRight).classList.remove('selected');
    // Subtle indication that pair is recorded
    el('ML'+S.matchLeft).style.borderColor = 'var(--sage)';
    el('MR'+S.matchRight).style.borderColor = 'var(--sage)';
    S.matchLeft = null; S.matchRight = null;
  }
}

function submitMatching() {
  const mq = DATA.activities[S.actIdx].matchQ;
  if (Object.keys(S.leftMatches).length < mq.pairs.length) {
    alert('Please match all ' + mq.pairs.length + ' items before checking.'); return;
  }
  S.matchSubmitted = true;
  S.totalAnswered++;
  let correct = 0;
  mq.pairs.forEach((_,i) => {
    const lEl = el('ML'+i), rEl = el('MR'+i);
    lEl.style.borderColor = ''; rEl.style.borderColor = '';
    if (S.leftMatches[i] === i) {
      correct++;
      lEl.className = 'match-item matched';
      rEl.className = 'match-item matched';
    } else {
      lEl.className = 'match-item wrong-match';
      // Show what the correct right was
      if (rEl) rEl.className = 'match-item matched';
      // Mark the wrong right selection
      const wrongRight = S.leftMatches[i];
      if (wrongRight !== undefined) {
        const wEl = el('MR'+wrongRight);
        if (wEl && !wEl.classList.contains('matched')) wEl.className = 'match-item wrong-match';
      }
    }
  });
  if (correct === mq.pairs.length) {
    S.totalCorrect++;
    showFeedback('correct-fb', '✓ All ' + correct + ' pairs correct!', mq.exp);
  } else {
    showFeedback(correct >= 3 ? 'partial-fb' : 'wrong-fb',
      correct + ' of ' + mq.pairs.length + ' pairs correct.', mq.exp);
  }
  S.answered = true;
  updateScoreBar();
}

// ═══════════════════════════════════════════
// REORDER (drag-and-drop)
// ═══════════════════════════════════════════
let dragIdx = null;

function renderReorder() {
  const act = DATA.activities[S.actIdx];
  const rq = act.reorderQ;
  updateProgress(2, 2);

  S.reorderItems = [...rq.items].map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
  S.reorderSubmitted = false; S.answered = false;

  el('activityArea').innerHTML = `
    <span class="question-type-label">Reordering</span>
    <div class="question-text">${rq.text}</div>
    <div class="reorder-list" id="reorderList">${buildReorderHTML()}</div>
    <div style="font-size:0.82rem;color:var(--text-mid);">Drag the items into the correct order — earliest first.</div>`;

  el('btnSubmit').onclick = submitReorder;
  el('btnSubmit').textContent = 'Check Order';
}

function buildReorderHTML() {
  return S.reorderItems.map((item, i) =>
    `<div class="reorder-item" draggable="true" id="ri${i}"
      ondragstart="onDragStart(event,${i})"
      ondragover="onDragOver(event,${i})"
      ondrop="onDrop(event,${i})"
      ondragleave="onDragLeave(event,${i})">
      <span class="drag-handle">⠿</span>
      <span>${item.text}</span>
    </div>`
  ).join('');
}

function refreshReorderList() {
  el('reorderList').innerHTML = buildReorderHTML();
}

function onDragStart(e, i) {
  dragIdx = i;
  setTimeout(()=>{ const el2 = el('ri'+i); if(el2) el2.classList.add('dragging'); }, 0);
}
function onDragOver(e, i) {
  e.preventDefault();
  qsa('.reorder-item').forEach(el2=>el2.classList.remove('drag-over'));
  const t = el('ri'+i); if(t) t.classList.add('drag-over');
}
function onDragLeave(e, i) {
  const t = el('ri'+i); if(t) t.classList.remove('drag-over');
}
function onDrop(e, i) {
  e.preventDefault();
  qsa('.reorder-item').forEach(el2=>{ el2.classList.remove('drag-over'); el2.classList.remove('dragging'); });
  if (dragIdx === null || dragIdx === i) { dragIdx = null; return; }
  const tmp = S.reorderItems[dragIdx];
  S.reorderItems[dragIdx] = S.reorderItems[i];
  S.reorderItems[i] = tmp;
  dragIdx = null;
  refreshReorderList();
}

function submitReorder() {
  if (S.reorderSubmitted) return;
  const rq = DATA.activities[S.actIdx].reorderQ;
  S.reorderSubmitted = true;
  S.totalAnswered++;
  let allOk = true;
  const elems = qsa('.reorder-item');
  S.reorderItems.forEach((item, i) => {
    const ok = item.id === rq.correctOrder[i];
    if (!ok) allOk = false;
    elems[i].classList.add(ok ? 'correct-order' : 'wrong-order');
    elems[i].draggable = false;
  });
  if (allOk) {
    S.totalCorrect++;
    showFeedback('correct-fb', '✓ Perfect sequence!', rq.exp);
  } else {
    const correctNames = rq.correctOrder.map((id,i)=>(i+1)+'. '+rq.items.find(x=>x.id===id).text.split('—')[0].trim()).join(' → ');
    showFeedback('wrong-fb', '✗ Incorrect order.', rq.exp);
  }
  S.answered = true;
  updateScoreBar();
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function nextQuestion() {
  clearFeedback();
  const act = DATA.activities[S.actIdx];

  if (act.type === 'mcq') {
    if (S.qIdx < act.questions.length - 1) {
      S.qIdx++;
      renderMCQ();
    } else {
      advanceActivity();
    }
  } else if (act.type === 'fitb') {
    if (S.qIdx < act.questions.length - 1) {
      S.qIdx++;
      renderFITB();
    } else {
      advanceActivity();
    }
  } else if (act.type === 'mixed') {
    if (S.matchPhase) {
      S.matchPhase = false;
      renderReorder();
    } else {
      advanceActivity();
    }
  }
}

function advanceActivity() {
  if (S.actIdx < DATA.activities.length - 1) {
    S.actIdx++;
    S.qIdx = 0;
    S.matchPhase = true;
    renderCurrent();
  } else {
    showFinal();
  }
}

function renderCurrent() {
  const act = DATA.activities[S.actIdx];
  clearFeedback();
  if (act.type === 'mcq')    renderMCQ();
  else if (act.type === 'fitb')  renderFITB();
  else if (act.type === 'mixed') { S.matchPhase = true; renderMatching(); }
  updateScoreBar();
}

// ═══════════════════════════════════════════
// FINAL
// ═══════════════════════════════════════════
function showFinal() {
  el('activityArea').innerHTML = '';
  el('feedbackBox').className = 'feedback-box';
  el('btnSubmit').style.display = 'none';
  el('btnNext').style.display = 'none';
  el('progressFill').style.width = '100%';
  el('progressLabel').textContent = 'Lesson complete!';

  const pct = S.totalAnswered > 0 ? Math.round(S.totalCorrect / S.totalAnswered * 100) : 0;
  el('finalScoreNum').textContent = S.totalCorrect + ' / ' + S.totalAnswered;

  let grade, msg, dino;
  if (pct >= 90) {
    grade = 'Exceptional — ' + pct + '%';
    msg = '"Palaeontology is not a rearview mirror — it is a window into deep time. You\'ve looked through it with extraordinary clarity."';
    dino = '🏆';
  } else if (pct >= 75) {
    grade = 'Excellent — ' + pct + '%';
    msg = '"Every fossil tells a story. You\'ve learned to read them well. Return to the questions you missed — therein lies mastery."';
    dino = '🦖';
  } else if (pct >= 55) {
    grade = 'Good effort — ' + pct + '%';
    msg = '"The greatest scientific discoveries begin with curiosity. Review the explanations, return with fresh eyes, and the fossils will yield their secrets."';
    dino = '🦕';
  } else {
    grade = 'Keep practising — ' + pct + '%';
    msg = '"Even palaeontologists spend decades in the field before making breakthrough discoveries. Persistence is the most important tool in the kit."';
    dino = '🥚';
  }

  el('finalDino').textContent = dino;
  el('finalScoreLabel').textContent = grade;
  el('finalMessage').textContent = msg;
  el('finalScreen').className = 'final-screen show';
}

function restartLesson() {
  S = {
    actIdx: 0, qIdx: 0,
    totalCorrect: 0, totalAnswered: 0,
    answered: false, mcqSelected: null,
    filledWord: null, matchPhase: true,
    matchLeft: null, matchRight: null,
    leftMatches: {}, rightShuffle: [],
    matchSubmitted: false, reorderItems: [], reorderSubmitted: false
  };
  el('finalScreen').className = 'final-screen';
  renderCurrent();
  updateScoreBar();
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
window.onload = function() {
  updateScoreBar();
  renderCurrent();
};
</script>
</body>
</html>
