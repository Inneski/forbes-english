<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forbes English – C1 Negotiation Language</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Instrument+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --surface: #faf7f2;
  --card: #ffffff;
  --border: #ddd5c4;
  --accent: #1a4a2e;
  --accent-mid: #2d6b45;
  --accent-light: rgba(26,74,46,0.08);
  --accent-lighter: rgba(26,74,46,0.04);
  --gold: #b8860b;
  --gold-bg: rgba(184,134,11,0.08);
  --text: #1c1a17;
  --muted: #7a7060;
  --correct: #1a4a2e;
  --correct-bg: rgba(26,74,46,0.09);
  --wrong: #8b2020;
  --wrong-bg: rgba(139,32,32,0.08);
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  background-image: 
    radial-gradient(ellipse at 20% 10%, rgba(26,74,46,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(184,134,11,0.05) 0%, transparent 50%);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ─── HEADER ─────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 32px 24px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%);
}

.header-rule {
  width: 60px;
  height: 1px;
  background: var(--border);
  margin: 14px auto 10px;
}

.lesson-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--accent);
  color: #f5f0e8;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 2px;
  margin-top: 12px;
}

.lesson-tag::before {
  content: '◆';
  font-size: 7px;
  color: var(--gold);
}

/* ─── SCORE BAR ───────────────────────── */
.score-bar {
  background: var(--accent);
  padding: 11px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.score-pill {
  color: #f5f0e8;
  font-family: 'Courier Prime', monospace;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.score-pill span {
  color: #f0d060;
}

.progress-wrap { flex: 1; }

.progress-label {
  color: rgba(245,240,232,0.6);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.progress-bar {
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  height: 3px;
  overflow: hidden;
}

.progress-fill {
  background: #f0d060;
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}

.q-global {
  color: rgba(245,240,232,0.55);
  font-family: 'Courier Prime', monospace;
  font-size: 12px;
  white-space: nowrap;
}

/* ─── MAIN ────────────────────────────── */
.main {
  max-width: 780px;
  margin: 0 auto;
  padding: 40px 20px 0;
}

/* ─── ACTIVITY HEADER ─────────────────── */
.act-header {
  margin-bottom: 32px;
  animation: riseIn 0.5s ease both;
  border-left: 3px solid var(--accent);
  padding-left: 18px;
}

.act-eyebrow {
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent-mid);
  margin-bottom: 8px;
}

.act-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 8px;
}

.act-sub {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  max-width: 600px;
}

/* ─── ILLUSTRATION ────────────────────── */
.illus-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  animation: riseIn 0.5s 0.05s ease both;
}

/* ─── QUESTION CARD ───────────────────── */
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  animation: riseIn 0.4s ease both;
}

.q-counter {
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.q-counter::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  line-height: 1.65;
  color: var(--text);
  margin-bottom: 22px;
}

.q-text em {
  font-style: italic;
  color: var(--accent);
  font-weight: 600;
}

.q-context {
  background: var(--accent-lighter);
  border-left: 3px solid var(--accent);
  padding: 14px 16px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 22px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  font-style: italic;
}

/* ─── OPTIONS ─────────────────────────── */
.options { display: flex; flex-direction: column; gap: 9px; }

.opt {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 13px 16px;
  cursor: pointer;
  font-size: 14.5px;
  color: var(--text);
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  line-height: 1.55;
  text-align: left;
}

.opt:hover:not(.disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: translateX(2px);
}

.opt.selected { border-color: var(--accent); background: var(--accent-light); }
.opt.correct { border-color: var(--correct); background: var(--correct-bg); }
.opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.opt.disabled { cursor: default; }

.opt-lbl {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 1.5px solid var(--border);
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
  transition: all 0.2s;
}

.opt.selected .opt-lbl { border-color: var(--accent); background: var(--accent); color: #fff; }
.opt.correct .opt-lbl { border-color: var(--correct); background: var(--correct); color: #fff; }
.opt.wrong .opt-lbl { border-color: var(--wrong); background: var(--wrong); color: #fff; }

/* ─── FEEDBACK ────────────────────────── */
.feedback {
  border-radius: 8px;
  padding: 15px 18px;
  margin-top: 16px;
  font-size: 14px;
  line-height: 1.65;
  display: none;
}

.feedback.show { display: block; animation: riseIn 0.3s ease; }

.feedback.correct-fb {
  background: var(--correct-bg);
  border: 1px solid rgba(26,74,46,0.2);
  color: var(--correct);
}

.feedback.wrong-fb {
  background: var(--wrong-bg);
  border: 1px solid rgba(139,32,32,0.2);
  color: var(--wrong);
}

.fb-label {
  font-family: 'Courier Prime', monospace;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 6px;
}

/* ─── BUTTONS ─────────────────────────── */
.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  background: var(--accent);
  color: #f5f0e8;
  border: none;
  border-radius: 6px;
  padding: 13px 26px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Instrument Sans', sans-serif;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  letter-spacing: 0.3px;
}

.btn:hover { background: var(--accent-mid); transform: translateY(-1px); }
.btn:active { transform: none; }

.btn.secondary {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--muted);
}

.btn.secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* ─── FILL-IN ACTIVITY ────────────────── */
.sentence-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 30px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  animation: riseIn 0.4s ease both;
}

.sent-num {
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.sent-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 14px;
}

.sent-text .blank-inline {
  display: inline-block;
  border-bottom: 2px solid var(--accent);
  min-width: 160px;
  margin: 0 4px;
  vertical-align: bottom;
}

.blank-input {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 9px 14px;
  font-size: 14px;
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
  width: 100%;
  max-width: 340px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

.blank-input:focus { border-color: var(--accent); background: #fff; }
.blank-input.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
.blank-input.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }
.blank-input:disabled { opacity: 0.85; }

.sent-fb {
  font-size: 13px;
  line-height: 1.6;
  margin-top: 10px;
  display: none;
  padding: 10px 14px;
  border-radius: 6px;
}

.sent-fb.show { display: block; }
.sent-fb.correct-fb { background: var(--correct-bg); color: var(--correct); border: 1px solid rgba(26,74,46,0.15); }
.sent-fb.wrong-fb { background: var(--wrong-bg); color: var(--wrong); border: 1px solid rgba(139,32,32,0.15); }

/* ─── WORD BANK ───────────────────────── */
.word-bank-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.wb-label {
  font-family: 'Courier Prime', monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.wb-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wb-chip {
  background: var(--accent-lighter);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  padding: 6px 13px;
  font-size: 13px;
  font-family: 'Courier Prime', monospace;
  color: var(--accent);
  font-weight: 700;
}

/* ─── REGISTER REWRITE ────────────────── */
.rewrite-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px 28px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  animation: riseIn 0.4s ease both;
}

.rw-from {
  background: var(--gold-bg);
  border-left: 3px solid var(--gold);
  padding: 12px 16px;
  border-radius: 0 6px 6px 0;
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-style: italic;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.6;
}

.rw-label-from {
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.rw-label-to {
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.rw-options { display: flex; flex-direction: column; gap: 8px; }

/* ─── FINAL SCREEN ────────────────────── */
.final {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 36px;
  text-align: center;
  box-shadow: var(--shadow);
  animation: riseIn 0.6s ease;
}

.final-ornament {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 4px;
}

.final-score-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 80px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

.final-denom {
  font-size: 18px;
  color: var(--muted);
  font-family: 'Courier Prime', monospace;
  margin-bottom: 24px;
}

.final-msg {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-style: italic;
  color: var(--text);
  line-height: 1.7;
  max-width: 500px;
  margin: 0 auto 32px;
}

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 32px 0;
}

/* ─── REVIEW TABLE ────────────────────── */
.review-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

.review-row {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.rr-phrase {
  background: var(--accent);
  color: #f5f0e8;
  padding: 13px 16px;
  font-family: 'Courier Prime', monospace;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
}

.rr-use {
  background: var(--surface);
  padding: 13px 16px;
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.55;
  display: flex;
  align-items: center;
}

@media (max-width: 580px) {
  .review-row { grid-template-columns: 1fr; }
  .act-title { font-size: 24px; }
  .q-text { font-size: 17px; }
}

/* ─── ANIMATIONS ──────────────────────── */
@keyframes riseIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

select option { background: #fff; color: #1c1a17; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <svg width="210" height="64" viewBox="0 0 210 64" xmlns="http://www.w3.org/2000/svg">
    <text x="105" y="30" text-anchor="middle"
          font-family="'Cormorant Garamond', Georgia, serif"
          font-size="30" font-weight="700" fill="#1a4a2e" letter-spacing="6">FORBES</text>
    <line x1="18" y1="39" x2="192" y2="39" stroke="#1a4a2e" stroke-width="0.7" opacity="0.4"/>
    <text x="105" y="57" text-anchor="middle"
          font-family="'Instrument Sans', Arial, sans-serif"
          font-size="12" font-weight="600" fill="#b8860b" letter-spacing="9">ENGLISH</text>
  </svg>
  <div class="header-rule"></div>
  <div class="lesson-tag">Negotiation Language · C1</div>
</div>

<!-- SCORE BAR -->
<div class="score-bar" id="scoreBar">
  <div class="score-pill">Score: <span id="scoreDisplay">0</span></div>
  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">Activity 1 of 3</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="q-global" id="qGlobal">0 / 18</div>
</div>

<div class="main" id="main"></div>

<script>
// ═══════════════════════════════════════════════════════
// C1 CONTENT DATA
// ═══════════════════════════════════════════════════════

/*
  ACTIVITY 1 — Multiple Choice: C1 negotiation register & nuance
  ACTIVITY 2 — Fill-in-the-blank: sophisticated procurement phrases
  ACTIVITY 3 — Register rewrite: plain → formal/diplomatic
*/

const ACT1 = {
  type: 'mc',
  eyebrow: 'Activity 1 — Critical Reading',
  title: 'Register, Nuance & Precision',
  sub: 'Each question presents a negotiation scenario. Choose the response that best reflects C1-level diplomatic and professional language.',
  questions: [
    {
      ctx: 'During a contract negotiation, the client wants to push the contractor to reduce their fee without causing offence.',
      q: 'Which phrasing most effectively <em>signals financial pressure while maintaining diplomatic tone</em>?',
      opts: [
        'We think your fee is too high and we want you to reduce it significantly.',
        'We are not in a position to proceed at the current fee structure and would welcome a revised proposal.',
        'Your price is honestly quite a problem for us and we really need something better.',
        'We would prefer to pay less and hope that you can find a way to accommodate this.'
      ],
      correct: 1,
      exp: '"We are not in a position to proceed at the current fee structure" is diplomatically firm — it signals a clear constraint without accusation. The phrase "welcome a revised proposal" keeps the dialogue open while placing the onus on the contractor to move.'
    },
    {
      ctx: 'A contractor says: "We can complete the project by October, subject to receiving the structural drawings by 15 June."',
      q: 'What does <em>subject to</em> signal in this contractual context?',
      opts: [
        'The contractor is uncertain about whether they can complete the project at all.',
        'The October deadline is contingent on a specific condition being met by the client.',
        'The contractor is requesting permission to begin work on the structural drawings.',
        'The contractor is proposing October as a preferred date rather than a firm commitment.'
      ],
      correct: 1,
      exp: '"Subject to" introduces a conditional clause — the commitment to the October deadline is only valid if the stated condition (drawings by 15 June) is fulfilled. At C1, recognising this conditional structure is essential for reading contracts precisely.'
    },
    {
      ctx: 'A government client is reviewing three procurement bids. The evaluation team says: "Bid B represents the most advantageous offer in terms of whole-life cost."',
      q: 'What does <em>whole-life cost</em> most likely refer to in this context?',
      opts: [
        'The total amount the contractor will earn across the duration of the project.',
        'The initial construction cost plus ongoing maintenance and operational expenses over time.',
        'A financial penalty applied if the contractor\'s costs exceed the agreed budget.',
        'The client\'s full annual infrastructure budget across all current contracts.'
      ],
      correct: 1,
      exp: 'Whole-life cost (also called lifecycle cost) refers to the total cost of a built asset from construction through operation, maintenance, and eventual decommissioning — not just the upfront price. It is a key concept in public procurement evaluation.'
    },
    {
      ctx: 'A project director writes in a meeting summary: "Both parties acknowledged the ambiguity in Clause 14 and agreed to seek a mutually acceptable interpretation before the next milestone review."',
      q: 'What does this sentence imply about Clause 14?',
      opts: [
        'Both parties have agreed that Clause 14 is incorrect and must be legally amended.',
        'The clause contains language open to more than one reading, and this has not yet been resolved.',
        'The project director has drafted a revised version of Clause 14 for approval.',
        'Both parties have already agreed on an interpretation but need time to document it.'
      ],
      correct: 1,
      exp: '"Ambiguity" means the clause is unclear or can be interpreted in more than one way. The parties have not yet resolved this — they have only agreed to try to find a shared interpretation before the next review. No revision has been made.'
    },
    {
      ctx: 'A procurement consultant advises: "The client would be well-served by retaining some risk rather than seeking to transfer all project uncertainty to the contractor."',
      q: 'Which of the following best paraphrases this advice in formal contract language?',
      opts: [
        'The client should refuse to sign any contract that allocates risk to the contractor.',
        'An appropriate balance of risk allocation, rather than wholesale risk transfer, is likely to produce better project outcomes.',
        'The consultant recommends that all project risk be shared equally between both parties.',
        'The client should avoid engaging contractors who are unwilling to accept full project risk.'
      ],
      correct: 1,
      exp: 'The consultant is recommending balanced risk allocation, not full transfer. Option B captures this nuance precisely. "Wholesale risk transfer" echoes the original meaning of "seeking to transfer all project uncertainty", while "better project outcomes" reflects the phrase "well-served".'
    },
    {
      ctx: 'In a negotiation, one party says: "We would not wish to be prescriptive about methodology — we\'re more interested in outcomes."',
      q: 'What does <em>prescriptive</em> mean in this negotiation context?',
      opts: [
        'Dictating in detail exactly how the work should be carried out.',
        'Offering a recommendation about the preferred sequence of activities.',
        'Requesting written documentation of all project methodologies.',
        'Imposing financial penalties for deviating from an agreed method.'
      ],
      correct: 0,
      exp: '"Prescriptive" in this context means specifying exactly how something must be done. By saying they do not wish to be prescriptive, the speaker signals they are willing to give the contractor freedom in methodology as long as the desired outcomes are achieved.'
    },
  ]
};

const ACT2 = {
  type: 'fitb',
  eyebrow: 'Activity 2 — Lexical Precision',
  title: 'High-Stakes Vocabulary in Context',
  sub: 'Complete each sentence with the correct term from the word bank. Each term is used once. Consider register, collocations, and contractual meaning carefully.',
  bank: [
    'pain/gain share', 'force majeure', 'novation', 'liquidated damages',
    'invitation to tender', 'due diligence', 'mitigation', 'retention'
  ],
  sentences: [
    {
      before: 'The contractor was required to carry out full',
      after: 'on all subcontractors before appointing them, verifying their financial stability and track record.',
      answer: 'due diligence',

function updateBar() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('progressLabel').textContent = `Activity ${actIdx + 1} of ${activities.length}`;
  document.getElementById('progressFill').style.width = (answered / totalQ * 100) + '%';
  document.getElementById('qGlobal').textContent = `${answered} / ${totalQ}`;
}

function render() {
  updateBar();
  const m = document.getElementById('main');
  m.innerHTML = '';
  if (actIdx >= activities.length) { renderFinal(m); return; }
  const act = activities[actIdx];
  if (act.type === 'mc') renderMC(m, act);
  else if (act.type === 'fitb') renderFITB(m, act);
  else if (act.type === 'rewrite') renderRewrite(m, act);
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  return e;
}

function renderMC(m, act) {
  mcDone = false;
  const q = act.questions[mcIdx];

  if (mcIdx === 0) {
    const h = el('div', 'act-header');
    h.innerHTML = `<div class="act-eyebrow">${act.eyebrow}</div><div class="act-title">${act.title}</div><div class="act-sub">${act.sub}</div>`;
    m.appendChild(h);
    const il = el('div', 'illus-wrap'); il.innerHTML = svgNegotiation(); m.appendChild(il);
  } else {
    const h = el('div', 'act-header', `<div class="act-eyebrow">${act.eyebrow}</div>`);
    m.appendChild(h);
  }

  const card = el('div', 'q-card');
  card.innerHTML = `
    <div class="q-counter">Question ${mcIdx + 1} of ${act.questions.length}</div>
    ${q.ctx ? `<div class="q-context">${q.ctx}</div>` : ''}
    <div class="q-text">${q.q}</div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>`;
  m.appendChild(card);

  const opts = card.querySelector('#opts');
  const labels = ['A','B','C','D'];
  q.opts.forEach((txt, i) => {
    const o = el('div', 'opt');
    o.innerHTML = `<span class="opt-lbl">${labels[i]}</span><span>${txt}</span>`;
    o.addEventListener('click', () => {
      if (mcDone) return;
      mcDone = true;
      answered++;
      const isC = i === q.correct;
      if (isC) score++;
      opts.querySelectorAll('.opt').forEach((oo, ii) => {
        oo.classList.add('disabled');
        if (ii === q.correct) oo.classList.add('correct');
        else if (ii === i) oo.classList.add('wrong');
      });
      const fb = card.querySelector('#fb');
      fb.className = `feedback ${isC ? 'correct-fb' : 'wrong-fb'} show`;
      fb.innerHTML = `<span class="fb-label">${isC ? '✓ Correct' : '✗ Incorrect'}</span>${q.exp}`;
      document.getElementById('nextBtn').style.display = 'inline-block';
      updateBar();
    });
    opts.appendChild(o);
  });

  const br = el('div', 'btn-row');
  br.innerHTML = `<button class="btn" id="nextBtn" style="display:none" onclick="advanceMC(${act.questions.length})">Next →</button>`;
  m.appendChild(br);
}

function advanceMC(total) {
  mcIdx++;
  if (mcIdx >= total) { actIdx++; mcIdx = 0; }
  render();
}

function renderFITB(m, act) {
  fitbChecked = false;

  const h = el('div', 'act-header');
  h.innerHTML = `<div class="act-eyebrow">${act.eyebrow}</div><div class="act-title">${act.title}</div><div class="act-sub">${act.sub}</div>`;
  m.appendChild(h);

  const il = el('div', 'illus-wrap'); il.innerHTML = svgLexicon(); m.appendChild(il);

  // Word bank
  const wb = el('div', 'word-bank-wrap');
  const shuffled = [...act.bank].sort(() => Math.random() - 0.5);
  wb.innerHTML = `<div class="wb-label">◆ Word Bank</div><div class="wb-chips">${shuffled.map(w => `<div class="wb-chip">${w}</div>`).join('')}</div>`;
  m.appendChild(wb);

  // Sentences
  act.sentences.forEach((s, i) => {
    const block = el('div', 'sentence-block');
    block.innerHTML = `
      <div class="sent-num">Sentence ${i + 1} of ${act.sentences.length}</div>
      <div class="sent-text" style="font-size:16px; line-height:1.8;">
        <span style="font-family:'Cormorant Garamond',serif; font-size:18px;">${s.before} </span>
        <input class="blank-input" id="fitb-${i}" placeholder="type your answer…" style="display:inline-block; width:200px; vertical-align:baseline; padding:5px 10px; font-size:14px;"
          onkeydown="if(event.key==='Enter')checkFITB()">
        <span style="font-family:'Cormorant Garamond',serif; font-size:18px;"> ${s.after}</span>
      </div>
      <div class="sent-fb" id="sfb-${i}"></div>`;
    m.appendChild(block);
  });

  const br = el('div', 'btn-row');
  br.innerHTML = `<button class="btn" id="checkFitbBtn" onclick="checkFITB()">Check All Answers</button>`;
  m.appendChild(br);
}

function normalise(str) {
  return str.trim().toLowerCase().replace(/[^a-z0-9/ ]/g, '').replace(/\s+/g, ' ');
}

function checkFITB() {
  if (fitbChecked) return;
  fitbChecked = true;
  const act = ACT2;
  let correct = 0;

  act.sentences.forEach((s, i) => {
    const input = document.getElementById(`fitb-${i}`);
    const val = normalise(input.value);
    const expected = normalise(s.answer);
    const isC = val === expected;
    if (isC) { correct++; score++; }
    input.classList.add(isC ? 'correct' : 'wrong');
    input.disabled = true;
    if (!isC) input.value = s.answer;
    const fb = document.getElementById(`sfb-${i}`);
    fb.className = `sent-fb ${isC ? 'correct-fb' : 'wrong-fb'} show`;
    fb.innerHTML = `<strong>${isC ? '✓' : '✗ Answer: ' + s.answer + ' —'}</strong> ${s.exp}`;
    answered++;
  });

  score = score; // already incremented in loop
  updateBar();

  const btn = document.getElementById('checkFitbBtn');
  if (btn) btn.outerHTML = `<button class="btn" onclick="nextAct()">Next Activity →</button>`;
}

function nextAct() { actIdx++; render(); }

    h.innerHTML = `<div class="act-eyebrow">${act.eyebrow}</div><div class="act-title">${act.title}</div><div class="act-sub">${act.sub}</div>`;
    m.appendChild(h);
    const il = el('div', 'illus-wrap'); il.innerHTML = svgDiplomacy(); m.appendChild(il);
  } else {
    m.appendChild(el('div', 'act-header', `<div class="act-eyebrow">${act.eyebrow}</div>`));
  }

  const card = el('div', 'rewrite-block');
  const labels = ['A','B','C','D'];
  card.innerHTML = `
    <div class="q-counter">Item ${rwIdx + 1} of ${act.items.length}</div>
    <div class="rw-label-from">Informal / Imprecise</div>
    <div class="rw-from">${item.from}</div>
    <div class="rw-label-to">Select the C1-level equivalent ↓</div>
    <div class="q-text" style="font-size:16px; margin-bottom:16px;">${item.q}</div>
    <div class="rw-options" id="rwopts"></div>
    <div class="feedback" id="rwfb"></div>`;
  m.appendChild(card);

  const opts = card.querySelector('#rwopts');
  item.opts.forEach((txt, i) => {
    const o = el('div', 'opt');
    o.innerHTML = `<span class="opt-lbl">${labels[i]}</span><span>${txt}</span>`;
    o.addEventListener('click', () => {
      if (rwDone) return;
      rwDone = true;
      answered++;
      const isC = i === item.correct;
      if (isC) score++;
      opts.querySelectorAll('.opt').forEach((oo, ii) => {
        oo.classList.add('disabled');
        if (ii === item.correct) oo.classList.add('correct');
        else if (ii === i) oo.classList.add('wrong');
      });
      const fb = card.querySelector('#rwfb');
      fb.className = `feedback ${isC ? 'correct-fb' : 'wrong-fb'} show`;
      fb.innerHTML = `<span class="fb-label">${isC ? '✓ Correct' : '✗ Incorrect'}</span>${item.exp}`;
      document.getElementById('rwNextBtn').style.display = 'inline-block';
      updateBar();
    });
    opts.appendChild(o);
  });

  const br = el('div', 'btn-row');
  const isLast = rwIdx === act.items.length - 1;
  br.innerHTML = `<button class="btn" id="rwNextBtn" style="display:none" onclick="${isLast ? 'finishRewrite()' : 'advanceRewrite()'}">
    ${isLast ? 'See Results →' : 'Next Item →'}
  </button>`;
  m.appendChild(br);
}

function advanceRewrite() { rwIdx++; render(); }
function finishRewrite() { actIdx++; render(); }

// ═══════════════════════════════════════════════════════
// FINAL
// ═══════════════════════════════════════════════════════

function renderFinal(m) {
  const pct = Math.round(score / totalQ * 100);
  let msg = '';
  if (pct >= 85) msg = 'Exceptional command of professional negotiation language. You are operating comfortably at C1 level.';
  else if (pct >= 65) msg = 'A strong performance. Some terminology to consolidate — but your register awareness is evident.';
  else msg = 'A solid foundation. Focus on the legal and diplomatic phrases in the review below — they are high-value at C1.';

  m.innerHTML = `<div class="final">
    <div class="final-ornament">✦</div>
    <div class="final-score-num">${pct}%</div>
    <div class="final-denom">${score} correct out of ${totalQ}</div>
    <div class="final-msg">"${msg}"</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn" onclick="restartAll()">↺ Start Again</button>
      <button class="btn secondary" onclick="toggleReview()">Review Key Phrases</button>
    </div>
    <div id="reviewPanel" style="display:none">
      <hr class="divider">
      <div style="font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:700; margin-bottom:20px; color:var(--accent);">C1 Negotiation Phrase Bank</div>
      <div class="review-grid">
        ${[
          ['subject to', 'Introduces a condition: "Delivery by October, subject to receipt of drawings by June."'],
          ['we are not in a position to…', 'Diplomatically signals a constraint without confrontation.'],
          ['whole-life cost', 'Total cost of an asset across its entire lifespan, including maintenance and operation.'],
          ['force majeure', 'Contract clause excusing performance when extraordinary external events occur.'],
          ['liquidated damages', 'Pre-agreed financial penalties for specific breaches — most often late completion.'],
          ['novation', 'Legal transfer of all contractual rights and obligations to a new party.'],
          ['pain/gain share', 'Mechanism splitting cost savings and overruns between client and contractor.'],
          ['retention', 'Percentage withheld from payments as security against defects; released after the defects period.'],
          ['due diligence', 'Thorough investigation of a party or proposal before entering a commitment.'],
          ['mitigation', 'Duty to take reasonable steps to minimise loss following a breach or adverse event.'],
          ['we hereby reserve our right to claim…', 'Formal language preserving a legal position without immediately escalating.'],
          ['prescriptive', 'Specifying in detail exactly how something must be done — contrasted with outcome-based.'],
          ['inequitable allocation of risk', 'Formal way to describe an unfair distribution of financial risk in a contract.'],
          ['proportionate risk allocation', 'The principle that risk should sit with the party best placed to manage it.'],
        ].map(([phrase, use]) => `
          <div class="review-row">
            <div class="rr-phrase">${phrase}</div>
            <div class="rr-use">${use}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function toggleReview() {
  const p = document.getElementById('reviewPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

function restartAll() {
  score = 0; answered = 0; actIdx = 0;
  mcIdx = 0; mcDone = false;
  fitbChecked = false;
  rwIdx = 0; rwDone = false;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// boot
render();
</script>
</body>
</html>
