SUPABASE_URL = "https://tusioporxpjtegjlqkkb.supabase.co"
# The anon key is safe in client-visible config by design — Row Level
# Security is what protects the data. The Worker uses it to read the
# public lesson catalogue and to validate a caller's own session.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1c2lvcG9yeHBqdGVnamxxa2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMjk2NjksImV4cCI6MjEwMTcwNTY2OX0.9jPi4_Y6IfcUdzqfPzPJ8XsBCSXPuLvtCN8wWFMiLe4"
STRIPE_PRICE_ID_MONTHLY = "price_1U2FAJ1GUnxEGcbLWRhUIOwA"
STRIPE_PRICE_ID_SEMIANNUAL = "price_1U2FDR1GUnxEGcbLTndCE6bM"
STRIPE_PRICE_ID_ANNUAL = "price_1U2FEt1GUnxEGcbL3N8P0ls0"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
# Without this, Workers Static Assets serves any file that EXISTS straight
# from the edge and never invokes the Worker — so the paywall in
# src/index.js was being skipped for exactly the requests it exists to
# check. /api/* worked only because no asset matches those paths, which is
# why the health endpoint reported a healthy gate while lessons served 200.
# With it, every request enters the Worker; anything it does not gate falls
# through to env.ASSETS.fetch() at ~0.6ms.
run_worker_first = true
