  .pill.ps { background: var(--ps-color); }

  .opt-btn.correct {

  .score-bar {

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .sentence { font-size: 1.1rem; }
    .title-block h1 { font-size: 1.25rem; }
  }

    <div class="title-block">
      <h1>Present Simple vs Continuous</h1>
      <p>Supereasy &middot; mit deutscher Unterstuetzung</p>
    </div>
  </header>

  <div class="legend">
    <span class="pill ps">Present Simple</span>
    <span class="pill pc">Present Continuous</span>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="card" id="quizCard">
    <div class="q-count" id="qCount">Question 1 / 10</div>
    <div class="signal" id="signalTag">now</div>
    <div class="sentence" id="sentenceText"></div>
    <div class="translation" id="translationText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedbackBox">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbText"></div>
      <div class="fb-de" id="fbTextDe"></div>
    </div>
    <button class="next-btn" id="nextBtn">Next &rarr;</button>
  </div>

  <div class="card results hidden" id="resultsCard">
    <h2>Well done!</h2>
    <div class="big-score" id="finalScore">0 / 10</div>
    <p class="msg" id="resultMsg"></p>
    <p class="msg-de" id="resultMsgDe"></p>
    <button class="restart-btn" id="restartBtn">Try again &middot; Nochmal versuchen</button>
  </div>

<div class="score-bar">
  <span class="score-dot"></span>
  <span id="scoreDisplay">Score: 0 / 10</span>
</div>

<script>
  var questionData = [
    {
      sentence: "Look! She ____ (write) a letter right now.",
      translation: "Schau! Sie schreibt gerade einen Brief.",
      signal: "right now",
      correct: { text: "is writing", type: "pc" },
      wrong: { text: "writes", type: "ps" },
      explain: "We use present continuous because the action is happening at the moment of speaking (right now).",
      explainDe: "Wir benutzen present continuous, weil die Handlung genau jetzt passiert (right now)."
    },
    {
      sentence: "I always ____ (drink) coffee in the morning.",
      translation: "Ich trinke immer morgens Kaffee.",
      signal: "always",
      correct: { text: "drink", type: "ps" },
      wrong: { text: "am drinking", type: "pc" },
      explain: "This is a habit that happens regularly, so we use present simple with always.",
      explainDe: "Das ist eine Gewohnheit, die regelmaessig passiert, deshalb present simple mit always."
    },
    {
      sentence: "My mum ____ (cook) dinner every day.",
      translation: "Meine Mutter kocht jeden Tag Abendessen.",
      signal: "every day",
      correct: { text: "cooks", type: "ps" },
      wrong: { text: "is cooking", type: "pc" },
      explain: "Every day tells us this is a routine, so we use present simple.",
      explainDe: "Every day zeigt eine Routine, deshalb present simple."
    },
    {
      sentence: "Listen! The baby ____ (cry) in the next room.",
      translation: "Hoer mal! Das Baby weint im naechsten Zimmer.",
      signal: "listen!",
      correct: { text: "is crying", type: "pc" },
      wrong: { text: "cries", type: "ps" },
      explain: "Listen! shows the action is happening now, so we use present continuous.",
      explainDe: "Listen! zeigt, dass die Handlung jetzt passiert, deshalb present continuous."
    },
    {
      sentence: "We ____ (study) English at the moment.",
      translation: "Wir lernen gerade Englisch.",
      signal: "at the moment",
      correct: { text: "are studying", type: "pc" },
      wrong: { text: "study", type: "ps" },
      explain: "At the moment signals a temporary action happening now, so we use present continuous.",
      explainDe: "At the moment zeigt eine voruebergehende Handlung, deshalb present continuous."
    },
    {
      sentence: "He usually ____ (play) football on Saturdays.",
      translation: "Er spielt samstags normalerweise Fussball.",
      signal: "usually",
      correct: { text: "plays", type: "ps" },
      wrong: { text: "is playing", type: "pc" },
      explain: "Usually shows a repeated habit, so we use present simple.",
      explainDe: "Usually zeigt eine wiederholte Gewohnheit, deshalb present simple."
    },
    {
      sentence: "Right now, they ____ (watch) a movie together.",
      translation: "Gerade jetzt schauen sie zusammen einen Film.",
      signal: "right now",
      correct: { text: "are watching", type: "pc" },
      wrong: { text: "watch", type: "ps" },
      explain: "Right now tells us the action is in progress at this exact moment.",
      explainDe: "Right now zeigt, dass die Handlung gerade in diesem Moment passiert."
    },
    {
      sentence: "She ____ (like) chocolate very much.",
      translation: "Sie mag Schokolade sehr gerne.",
      signal: "stative verb",
      correct: { text: "likes", type: "ps" },
      wrong: { text: "is liking", type: "pc" },
      explain: "Like is a stative verb, so we never use it in the continuous form.",
      explainDe: "Like ist ein stative verb, deshalb nie im continuous form."
    },
    {
      sentence: "Look! The dog ____ (run) in the garden.",
      translation: "Schau! Der Hund rennt im Garten.",
      signal: "look!",
      correct: { text: "is running", type: "pc" },
      wrong: { text: "runs", type: "ps" },
      explain: "Look! shows the action is visible and happening now, so present continuous.",
      explainDe: "Look! zeigt, dass die Handlung jetzt sichtbar passiert, deshalb present continuous."
    },
    {
      sentence: "I ____ (go) to school every day.",
      translation: "Ich gehe jeden Tag zur Schule.",
      signal: "every day",
      correct: { text: "go", type: "ps" },
      wrong: { text: "am going", type: "pc" },
      explain: "This is a daily routine, so we use present simple with every day.",
      explainDe: "Das ist eine taegliche Routine, deshalb present simple mit every day."
    }
  ];

  var order = [];
  var currentIndex = 0;
  var score = 0;
  var answered = false;

  function shuffle(array) {
    var arr = array.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;
    }
    return arr;
  }

  function initQuiz() {
    order = shuffle(questionData.map(function (item, idx) { return idx; }));
    currentIndex = 0;
    score = 0;
    updateScoreDisplay();
    document.getElementById("resultsCard").classList.add("hidden");
    document.getElementById("quizCard").classList.remove("hidden");
    renderQuestion();
  }

  function updateScoreDisplay() {
    document.getElementById("scoreDisplay").textContent = "Score: " + score + " / " + questionData.length;
  }

  function updateProgress() {
    var pct = (currentIndex / questionData.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
  }

  function renderQuestion() {
    answered = false;
    updateProgress();

    var qIndex = order[currentIndex];
    var q = questionData[qIndex];

    document.getElementById("qCount").textContent = "Question " + (currentIndex + 1) + " / " + questionData.length;
    document.getElementById("signalTag").textContent = q.signal;
    document.getElementById("sentenceText").textContent = q.sentence;
    document.getElementById("translationText").textContent = q.translation;

    var options = shuffle([q.correct, q.wrong]);
    var optionsBox = document.getElementById("optionsBox");
    optionsBox.innerHTML = "";

    options.forEach(function (opt) {
      var btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.textContent = opt.text;
      btn.addEventListener("click", function () {
        handleAnswer(btn, opt, q, optionsBox);
      });
      optionsBox.appendChild(btn);
    });

    var feedbackBox = document.getElementById("feedbackBox");
    feedbackBox.classList.remove("show");

    var nextBtn = document.getElementById("nextBtn");
    nextBtn.classList.remove("active");
    nextBtn.textContent = (currentIndex === questionData.length - 1) ? "See results \u2192" : "Next \u2192";
  }

  function handleAnswer(btn, opt, q, optionsBox) {
    if (answered) return;
    answered = true;

    var allBtns = optionsBox.querySelectorAll(".opt-btn");
    allBtns.forEach(function (b) { b.disabled = true; });

    var isCorrect = opt === q.correct;

    if (isCorrect) {
      btn.classList.add("correct");
      score++;
    } else {
      btn.classList.add("incorrect");
      allBtns.forEach(function (b) {
        if (b.textContent === q.correct.text) {
          b.classList.add("correct");
        }
      });
    }

    updateScoreDisplay();

    var fbTitle = document.getElementById("fbTitle");
    var fbText = document.getElementById("fbText");
    var fbTextDe = document.getElementById("fbTextDe");
    var feedbackBox = document.getElementById("feedbackBox");

    fbTitle.className = "fb-title " + (isCorrect ? "good" : "bad");
    fbTitle.textContent = isCorrect ? "Correct! Richtig!" : "Not quite. Nicht ganz.";
    fbText.textContent = q.explain;
    fbTextDe.textContent = q.explainDe;
    feedbackBox.classList.add("show");

    document.getElementById("nextBtn").classList.add("active");
  }

  document.getElementById("nextBtn").addEventListener("click", function () {
    if (!answered) return;
    currentIndex++;
    if (currentIndex >= questionData.length) {
      showResults();
    } else {
      renderQuestion();
    }
  });

  function showResults() {
    updateProgress();
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("quizCard").classList.add("hidden");
    document.getElementById("resultsCard").classList.remove("hidden");
    document.getElementById("finalScore").textContent = score + " / " + questionData.length;

    var msg, msgDe;
    if (score === questionData.length) {
      msg = "Perfect score! You really understand present simple and continuous.";
      msgDe = "Perfekte Punktzahl! Du verstehst present simple und continuous wirklich gut.";
    } else if (score >= questionData.length * 0.7) {
      msg = "Great job! Just a little more practice with the signal words.";
      msgDe = "Gut gemacht! Uebe noch ein bisschen mit den Signalwoertern.";
    } else {
      msg = "Good try! Look at the signal words like always, now, and every day again.";
      msgDe = "Guter Versuch! Schau dir die Signalwoerter wie always, now und every day nochmal an.";
    }
    document.getElementById("resultMsg").textContent = msg;
    document.getElementById("resultMsgDe").textContent = msgDe;
  }

  document.getElementById("restartBtn").addEventListener("click", initQuiz);

  initQuiz();
</script>

</body>
</html>
