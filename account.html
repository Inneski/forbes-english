<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Barlow+Condensed:wght@700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<!-- Served from our own origin, not a CDN: a blocked cdn.jsdelivr.net
     (content blockers, in-app browsers, filtered Wi-Fi) used to leave this
     page as a spinner and nothing else. See vendor/README.md. -->
<script src="vendor/supabase-js-2.116.0.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-deep: #1b3a28;
    --green-mid: #2d6044;
    --green-light: #4a8f61;
    --green-pale: #e8f2ec;
    --gold: #b8962e;
    --gold-light: #f0d080;
    --gold-bright: #e8c04a;
    --cream: #faf8f3;
    --ink: #111;
    --ink-soft: #333;
    --muted: #6b7a6b;
    --border: #c8d4c8;
    --white: #ffffff;
    --radius: 10px;
  }
  body {
    font-family: 'Lato', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--green-deep);
    padding: 18px 24px;
  }
  header a {
    color: var(--cream);
    text-decoration: none;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.3rem;
  }
  header a span { color: var(--gold-bright); }
  .fe-logo-lockup { display: block; line-height: 0; }
  .fe-logo-svg { width: 88px; height: auto; display: block; color: var(--cream); }
  .fe-logo-en { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 261px; fill: var(--gold-bright); }
  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 1.8rem;
    color: var(--green-deep);
    margin-bottom: 8px;
  }
  p.lead { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px;
  }
  label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--green-mid); }
  .btn {
    display: block;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 999px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.4px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn-primary { background: var(--green-deep); color: var(--cream); }
  .btn-primary:hover { background: var(--green-mid); }
  .btn-gold { background: var(--gold-bright); color: var(--ink); margin-top: 10px; }
  .btn-gold:hover { background: var(--gold-light); }
  .switch-mode {
    text-align: center;
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .switch-mode a { color: var(--green-mid); font-weight: 700; cursor: pointer; }
  .error-msg {
    background: #fbeaea;
    border: 1px solid #e0b8b8;
    color: #8a2e2e;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .status-row:last-of-type { border-bottom: none; margin-bottom: 18px; }
  .status-label { color: var(--muted); font-size: 0.85rem; }
  .status-value { font-weight: 700; }
  .badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .badge.active { background: var(--green-pale); color: var(--green-mid); }
  .badge.inactive { background: #f0e0e0; color: #8a4a4a; }
  #loading { text-align: center; color: var(--muted); padding: 40px 0; }
  [hidden] { display: none !important; }
</style>
</head>

<main>
  <div id="loading">Loading&hellip;</div>

  <!-- Logged out: login/signup form -->
  <section id="auth-section" hidden>
    <h1 id="auth-title">Welcome back</h1>
    <p class="lead" id="auth-lead">Log in to manage your subscription.</p>
    <div class="card">
      <div class="error-msg" id="auth-error"></div>
      <form id="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
        <button type="submit" class="btn btn-primary" id="auth-submit">Log in</button>
      </form>
      <div class="switch-mode">
        <span id="switch-text">Don't have an account?</span>
        <a id="switch-link">Sign up</a>
        <span id="forgot-wrap"> &middot; <a id="forgot-link">Forgot your password?</a></span>
      </div>
    </div>
  </section>

  <!-- Shown only when the visitor arrives from a password-reset email. -->
  <section id="recover-section" hidden>
    <h1>Choose a new password</h1>
    <p class="lead">You followed a reset link. Set a new password to finish.</p>
    <div class="card">
      <div class="error-msg" id="recover-error"></div>
      <form id="recover-form">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" required autocomplete="new-password" minlength="6">
        <button type="submit" class="btn btn-primary">Save new password</button>
      </form>
    </div>
  </section>

  <!-- Logged in: account + subscription status -->
  <section id="account-section" hidden>
    <h1>My account</h1>
    <p class="lead" id="account-email"></p>
    <div class="card">
      <div class="status-row">
        <span class="status-label">Subscription</span>
        <span class="status-value"><span class="badge" id="sub-badge">&mdash;</span></span>
      </div>
      <div class="status-row">
        <span class="status-label">Renews / expires</span>
        <span class="status-value" id="sub-period">&mdash;</span>
      </div>
      <button class="btn btn-gold" id="subscribe-btn" hidden onclick="window.location.href='pricing.html'">View plans &amp; subscribe</button>
      <button class="btn btn-primary" id="logout-btn" style="margin-top:10px;background:transparent;color:var(--green-deep);border:1.5px solid var(--border);">Log out</button>
    </div>
  </section>
</main>

<script src="sb-client.js"></script>
<script>
// Everything below is arranged around one rule: the visitor must always end
// up looking at something they can act on. Every path finishes at showAuth()
// or showAccount(), and a deadline calls showAuth() if nothing else has.
//
// The bug this replaces: the first paint waited on `getUser()`, a network
// call with no timeout, and the whole script sat below an unguarded
// `window.sb.auth.onAuthStateChange(...)`. If the Supabase library had not
// loaded, that line threw and took renderAccount() with it. Either way the
// page showed "Loading&hellip;" for ever — no form, no error, nothing to tap.
// On a phone that is not exotic: a content blocker, an in-app browser, or one
// bar of signal was enough.

let mode = "login"; // or "signup"

const loading = document.getElementById("loading");
const authSection = document.getElementById("auth-section");
const accountSection = document.getElementById("account-section");
const authForm = document.getElementById("auth-form");
const authError = document.getElementById("auth-error");
const authTitle = document.getElementById("auth-title");
const authLead = document.getElementById("auth-lead");
const authSubmit = document.getElementById("auth-submit");
const switchText = document.getElementById("switch-text");
const switchLink = document.getElementById("switch-link");

function showError(msg) {
  authError.textContent = msg;
  authError.classList.add("show");
}
function clearError() {
  authError.classList.remove("show");
}

function showAuth() {
  loading.hidden = true;
  accountSection.hidden = true;
  document.getElementById("recover-section").hidden = true;
  authSection.hidden = false;
}
function showAccount() {
  loading.hidden = true;
  authSection.hidden = true;
  document.getElementById("recover-section").hidden = true;
  accountSection.hidden = false;
}

// The backstop. If the checks below have not decided anything by now,
// something is wrong that the visitor cannot see and cannot fix — so give
// them the login form, which at least goes somewhere.
let painted = false;
function paint(show) {
  painted = true;
  show();
}
setTimeout(() => {
  if (!painted) {
    paint(showAuth);
    showError("That took longer than it should have. Try logging in, or reload the page.");
  }
}, 4000);

// Split out of the toggle handler so the submit path can send someone back to
// the login form without also wiping the message explaining why.
function applyMode(next) {
  mode = next;
  if (mode === "signup") {
    authTitle.textContent = "Create your account";
    authLead.textContent = "Sign up to subscribe and unlock every lesson.";
    authSubmit.textContent = "Sign up";
    switchText.textContent = "Already have an account?";
    switchLink.textContent = "Log in";
    document.getElementById("forgot-wrap").hidden = true;
  } else {
    authTitle.textContent = "Welcome back";
    authLead.textContent = "Log in to manage your subscription.";
    authSubmit.textContent = "Log in";
    switchText.textContent = "Don't have an account?";
    switchLink.textContent = "Sign up";
    document.getElementById("forgot-wrap").hidden = false;
  }
}

switchLink.addEventListener("click", () => {
  clearError();
  applyMode(mode === "login" ? "signup" : "login");
});

// Someone who cannot get in is someone who cannot pay, so the reset path
// matters as much as the login one. There was no way back in before this.
document.getElementById("forgot-link").addEventListener("click", async () => {
  clearError();
  const email = document.getElementById("email").value.trim();
  if (!email) { showError("Enter your email address above first."); return; }
  const { error } = await sbSendPasswordReset(email);
  showError(error ? error.message
    : "If that address has an account, a reset link is on its way. Check your inbox.");
});

// Supabase returns from the reset email with a recovery session in the URL
// fragment; supabase-js picks it up and fires this event. Guarded, because
// there may be no client at all — and an exception on this line used to stop
// the rest of this script from ever running.
if (window.sb) {
  try {
    window.sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        painted = true;
        loading.hidden = true;
        authSection.hidden = true;
        accountSection.hidden = true;
        document.getElementById("recover-section").hidden = false;
      }
    });
  } catch (err) {
    console.error("Could not listen for the password-recovery event:", err);
  }
}

document.getElementById("recover-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("recover-error");
  const { error } = await sbUpdatePassword(document.getElementById("new-password").value);
  if (error) { err.textContent = error.message; err.classList.add("show"); return; }
  document.getElementById("recover-section").hidden = true;
  await renderAccount();
});

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  authSubmit.disabled = true;
  authSubmit.textContent = mode === "signup" ? "Signing up\u2026" : "Logging in\u2026";

  let data = null;
  let error = null;
  try {
    ({ data, error } = mode === "signup"
      ? await sbSignUp(email, password)
      : await sbSignIn(email, password));
  } catch (err) {
    // A rejected request must not leave the button spinning with no
    // explanation; that is indistinguishable from the page being broken.
    console.error("Sign-in request failed:", err);
    error = { message: "Could not reach the server. Check your connection and try again." };
  }

  authSubmit.disabled = false;
  applyMode(mode);
  if (error) {
    showError(error.message);
    return;
  }
  if (mode === "signup") {
    // Signing up with an address that already has a confirmed account is not
    // an error: Supabase returns 200 and an obfuscated user, deliberately, so
    // this endpoint cannot be used to test which addresses are registered.
    // The tell is an empty identities array -- a genuinely new signup comes
    // back with one identity. Without this branch the form says "check your
    // email", no email ever arrives, and the visitor signs up again.
    const identities = data && data.user && data.user.identities;
    if (Array.isArray(identities) && identities.length === 0) {
      showError(
        "That email already has an account. Log in below, or use " +
        "\u201CForgot password?\u201D if you cannot remember it."
      );
      applyMode("login");
      return;
    }
    showError("Check your email to confirm your account, then log in.");
    return;
  }
  const params = new URLSearchParams(window.location.search);
  if (params.get("redirect") === "pricing") {
    window.location.href = "pricing.html";
    return;
  }
  // The sign-in reply already carries the user, so show the panel from that
  // rather than asking the server again -- one fewer round trip on the exact
  // connection that just proved itself slow.
  const signedIn = data && data.user;
  if (signedIn) {
    paint(showAccount);
    await fillSubscription(signedIn);
    return;
  }
  await renderAccount();
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await sbSignOut();
  location.reload();
});

// Subscribe button now just links to pricing.html (see markup above),
// where the visitor picks a plan before checkout begins.

// Fills in the subscription panel. Runs after the panel is already on screen,
// so a slow or failed profile read leaves a usable page rather than a blank
// one -- the two rows just keep their em-dashes.
async function fillSubscription(user) {
  document.getElementById("account-email").textContent = user.email || "";

  let profile = null;
  try {
    profile = await sbGetProfile(user.id);
  } catch (err) {
    console.error("Could not read the profile:", err);
  }

  const badge = document.getElementById("sub-badge");
  if (!profile) {
    badge.textContent = "Could not check";
    badge.className = "badge inactive";
    document.getElementById("subscribe-btn").hidden = false;
    return;
  }

  const status = profile.subscription_status || "inactive";
  const isActive = status === "active" || status === "trialing";
  // An owner has full access without paying. Reporting only the billing
  // status made a working account look like a broken one.
  const isOwner = profile.owner === true;
  const hasAccess = isOwner || isActive;

  badge.textContent = isOwner
    ? "Owner \u2014 full access"
    : isActive ? status[0].toUpperCase() + status.slice(1)
               : "Not subscribed";
  badge.className = "badge " + (hasAccess ? "active" : "inactive");

  document.getElementById("sub-period").textContent = isOwner
    ? "Never expires"
    : profile.current_period_end
      ? new Date(profile.current_period_end).toLocaleDateString()
      : "\u2014";

  document.getElementById("subscribe-btn").hidden = hasAccess;
}

async function renderAccount() {
  const user = await sbGetUser();
  if (!user) { paint(showAuth); return; }
  paint(showAccount);
  await fillSubscription(user);
}

// --- first paint ---------------------------------------------------------
//
// Decided from the session already stored in this browser, not from a network
// round trip, so an unreachable server can no longer hold the page hostage.
// The slower checks run afterwards, against a page that is already usable.
async function start() {
  if (window.sbUnavailable) {
    // No client at all. Say so in words the visitor can act on, rather than
    // showing a spinner that will never stop.
    paint(showAuth);
    authSubmit.disabled = true;
    showError(
      "Sign-in could not load. Reload the page \u2014 and if it keeps happening, " +
      "turn off any ad or content blocker for this site, or open it in Safari " +
      "or Chrome rather than inside another app."
    );
    return;
  }

  let session = null;
  try {
    session = await sbGetSession();
  } catch (err) {
    console.error("Could not read the stored session:", err);
  }

  if (!session) { paint(showAuth); return; }

  // Signed in as far as this browser knows. Show the panel straight away,
  // then confirm with the server and fill in the details.
  paint(showAccount);
  const user = await sbGetUser();
  if (!user) { showAuth(); return; }
  await fillSubscription(user);
}

start().catch((err) => {
  // The last line of defence. Whatever went wrong, the visitor gets a form.
  console.error("Account page failed to start:", err);
  paint(showAuth);
});
</script>

</body>
</html>
