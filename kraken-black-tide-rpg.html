:root{--cake-a:rgba(207,52,125,.55);--cake-b:rgba(36,121,173,.55);
--cake-a-ink:#fff0f7;--cake-b-ink:#eef7ff;
--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;
--cake-a-wash:rgba(207,52,125,.22);--cake-b-wash:rgba(36,121,173,.22);
--accent:#efbb64;--accent-ink:#10222c;--deep:#08131c;--panel:rgba(8,19,28,.88);--scrim:rgba(8,19,28,.88);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55);
/* The scale unit. Every size below was authored as a fraction of a 16:9
   frame's width, so on a wider window the type outgrew the panel and the
   options fell below the fold. 1vw and 1.7778vh are equal at 16:9, so this
   changes nothing there and only ever caps, never enlarges. The frame is
   the viewport (.game is fixed inset:0), which is why vw/vh and not cqw. */
--u:min(1vw,1.7778vh)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* opt-in, per lesson: show the whole plate, letterboxed in the deep colour */
.fit-contain .scene-img{object-fit:contain}
.fit-contain{background:#08131c}
/* ── HUD ── */
.hud{position:absolute;z-index:5;top:calc(1.3 * var(--u));left:calc(1.5 * var(--u));right:calc(1.5 * var(--u));display:flex;align-items:center;justify-content:space-between;gap:calc(1 * var(--u));pointer-events:none}
.hud-group{display:flex;gap:calc(.55 * var(--u));align-items:center;flex-wrap:wrap}
.badge{background:var(--panel);backdrop-filter:blur(5px);border:1px solid rgba(255,246,217,.34);box-shadow:0 0 calc(1.3 * var(--u)) var(--shadow);padding:calc(.5 * var(--u)) calc(.8 * var(--u));font-size:calc(1.15 * var(--u));letter-spacing:.04em;white-space:nowrap}
.badge b{color:var(--accent);font-weight:700}
.langs{display:flex;gap:calc(.35 * var(--u));pointer-events:auto;position:relative}
.lang-btn,.utility{border:1px solid rgba(255,246,217,.35);color:var(--bone);background:var(--panel);padding:calc(.5 * var(--u)) calc(.75 * var(--u));cursor:pointer;font-size:calc(1.1 * var(--u));pointer-events:auto}
.lang-btn{display:flex;align-items:center;gap:0;white-space:nowrap}
/* The three utilities sit as bare icons and give their words back on hover or
   keyboard focus. Three labelled buttons across the top of a painted frame is
   a lot of furniture over somebody's artwork, and the keys (L, S, F) and the
   corner help line already say what they do. The label is collapsed by width
   rather than removed, so it stays in the accessibility tree and a screen
   reader still reads "SOUND OFF". */
.u-label{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:middle;transition:max-width .2s ease,opacity .18s ease}
.utility:hover .u-label,.utility:focus-visible .u-label,.langs:focus-within .u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}
/* a touch screen has no hover, so there the words are simply always on */
@media(hover:none){.u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}}.lang-btn b{color:var(--accent)}
.utility:hover,.lang-btn:hover{border-color:var(--bone)}
.utility.fs{display:flex;align-items:center;gap:calc(.35 * var(--u));color:var(--accent-ink);background:linear-gradient(180deg,#fff0b8,var(--accent));border:1px solid #fff8dc;font-weight:700;letter-spacing:.06em;animation:fsglow 2.4s ease-in-out infinite}
.utility.fs:hover{filter:brightness(1.08)}
.lang-menu[hidden]{display:none}
.lang-menu{position:absolute;right:0;top:calc(100% + calc(.4 * var(--u)));z-index:20;display:grid;grid-template-columns:1fr;gap:calc(.25 * var(--u));min-width:calc(18 * var(--u));padding:calc(.45 * var(--u));background:rgba(14,9,2,.97);border:1px solid rgba(255,246,217,.4);box-shadow:0 calc(1 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.7)}
.lang-item{display:grid;grid-template-columns:calc(3 * var(--u)) 1fr;align-items:center;gap:calc(.4 * var(--u));border:1px solid transparent;background:none;color:var(--bone);padding:calc(.45 * var(--u)) calc(.55 * var(--u));text-align:left;cursor:pointer;font-size:calc(1.05 * var(--u))}
.lang-item b{color:var(--accent);font-size:calc(.95 * var(--u))}.lang-item:hover{border-color:rgba(255,246,217,.5);background:rgba(60,40,5,.9)}
.lang-item.active{background:var(--accent);color:var(--accent-ink)}.lang-item.active b{color:var(--accent-ink)}
/* ── the panel ── */
.zone{position:absolute;z-index:4;top:8%;bottom:3.5%;left:2.2%;right:2.2%;display:flex;pointer-events:none}
.content{pointer-events:auto;display:flex;flex-direction:column;gap:calc(.8 * var(--u));width:46%;max-height:100%;overflow:auto;scrollbar-width:thin;padding:calc(1.2 * var(--u)) calc(1.4 * var(--u));background:var(--panel);border:1px solid rgba(255,246,217,.22);box-shadow:0 calc(1.4 * var(--u)) calc(4 * var(--u)) var(--shadow);backdrop-filter:blur(6px);transition:transform .38s cubic-bezier(.2,.9,.3,1.15),opacity .22s ease;transform-origin:50% 50%}

<body class="paywalled">
<main class="game" aria-live="polite">
  <section id="frame" class="frame left v-center">
    <img id="sceneImage" class="scene-img" alt="">
    <button id="hot" class="hot" aria-label="Show the text"><i></i><span id="hotLabel" class="hot-label">CLICK TO READ</span></button>

        <div class="badge" id="tilesBadge"><span id="lblTiles">TILES</span> <b id="tiles"></b></div>
        <div class="badge" id="chancesBadge"><span id="lblChances">CHANCES</span> <b id="chances"></b></div>
        <div class="badge" id="progressBadge" hidden><span id="lblProgress">SPELLS</span> <b id="progress"></b></div>
      </div>
      <div class="hud-group">
        <div class="langs">

els at the mouth of the Narrows, where the deep water starts.","de":"Zehn Uhr, und das Licht ist fast weg. Davie Lennox und sein Neffe Tam holen Reusen ein an der Mündung der Engen, wo das tiefe Wasser beginnt.","es":"Las diez, y casi no queda luz. Davie Lennox y su sobrino Tam recogen nasas en la boca de los Estrechos, donde empieza el agua profunda.","fr":"Dix heures, et la lumière a presque disparu. Davie Lennox et son neveu Tam relèvent des casiers à l'entrée des Étroits, là où commence l'eau profonde.","it":"Le dieci, e la luce se n'è quasi andata. Davie Lennox e suo nipote Tam stanno salpando le nasse all'imboccatura degli Stretti, dove comincia l'acqua profonda."},{"en":"Tam has been fishing with his uncle for three summers and he knows the sounds of the boat by heart: the winch, the creel on the rail, the gulls. Tonight there are no gulls. \"Davie. Where have the birds gone?\"","de":"Tam fischt seit drei Sommern mit seinem Onkel und kennt die Geräusche des Boots auswendig: die Winde, die Reuse an der Reling, die Möwen. Heute Nacht gibt es keine Möwen. „Davie. Wo sind die Vögel hin?“","es":"Tam lleva tres veranos pescando con su tío y se sabe de memoria los sonidos del barco: el torno, la nasa en la barandilla, las gaviotas. Esta noche no hay gaviotas. “Davie. ¿Adónde se han ido los pájaros?”","fr":"Tam pêche avec son oncle depuis trois étés et il connaît par cœur les bruits du bateau : le treuil, le casier sur le plat-bord, les mouettes. Ce soir il n'y a pas de mouettes. « Davie. Où sont passés les oiseaux ? »","it":"Tam pesca con lo zio da tre estati e conosce a memoria i rumori della barca: il verricello, la nassa sulla battagliola, i gabbiani. Stanotte non ci sono gabbiani. «Davie. Dove sono finiti gli uccelli?»"},{"en":"Davie doesn't answer. The rope on the winch has gone tight. Not creel-tight. Tight like something has taken hold of it and is pulling it down, slowly, with all the time in the world. The stern dips.","de":"Davie antwortet nicht. Das Seil an der Winde ist stramm geworden. Nicht reusenstramm. Stramm, als hätte etwas es gepackt und zöge es nach unten, langsam, mit aller Zeit der Welt. Das Heck taucht ein.","es":"Davie no contesta. El cabo del torno se ha tensado. No tenso como una nasa. Tenso como si algo lo hubiera agarrado y tirara de él hacia abajo, despacio, con todo el tiempo del mundo. La popa se hunde.","fr":"Davie ne répond pas. Le câble du treuil s'est tendu. Pas tendu comme un casier. Tendu comme si quelque chose l'avait saisi et le tirait vers le fond, lentement, avec tout le temps du monde. La poupe s'enfonce.","it":"Davie non risponde. Il cavo del verricello si è teso. Non teso come una nassa. Teso come se qualcosa lo avesse afferrato e lo tirasse giù, lentamente, con tutto il tempo del mondo. La poppa si abbassa."},{"en":"The yellow marker barrel rolls across the deck. \"Cut it,\" says Davie. \"Cut the rope.\" Tam has the knife in his hand when the water beside the boat goes white.","de":"Die gelbe Markierungstonne rollt über das Deck. „Kapp es“, sagt Davie. „Kapp das Seil.“ Tam hat das Messer in der Hand, als das Wasser neben dem Boot weiß wird.","es":"El bidón amarillo de marca rueda por la cubierta. “Córtalo”, dice Davie. “Corta el cabo.” Tam tiene el cuchillo en la mano cuando el agua junto al barco se vuelve blanca.","fr":"Le baril jaune de balisage roule sur le pont. « Coupe », dit Davie. « Coupe le câble. » Tam a le couteau à la main quand l'eau à côté du bateau devient blanche.","it":"Il bidone giallo di segnalazione rotola sul ponte. «Taglialo», dice Davie. «Taglia il cavo.» Tam ha il coltello in mano quando l'acqua accanto alla barca diventa bianca."}],"k":{"en":"WEDNESDAY NIGHT","de":"MITTWOCHNACHT","es":"MIÉRCOLES POR LA NOCHE","fr":"MERCREDI SOIR","it":"MERCOLEDÌ NOTTE"},"kind":"story","next":"1.1"},"1.1":{"img":"03_q1_drift.webp","hot":[77.5,60.0,12.0,16.0],"title":{"en":"THE DRIFTING BOAT","de":"DAS TREIBENDE BOOT","es":"EL BARCO A LA DERIVA","fr":"LE BATEAU À LA DÉRIVE","it":"LA BARCA ALLA DERIVA"},"story":[{"en":"First light. You have been in Inverbrae six days and you have not yet seen the harbour empty. It is empty now.","de":"Erstes Licht. Du bist seit sechs Tagen in Inverbrae und hast den Hafen noch nie leer gesehen. Jetzt ist er leer.","es":"Primera luz. Llevas seis días en Inverbrae y todavía no has visto el puerto vacío. Ahora está vacío.","fr":"Première lueur. Tu es à Inverbrae depuis six jours et tu n'as pas encore vu le port vide. Il est vide maintenant.","it":"Prima luce. Sei a Inverbrae da sei giorni e non hai ancora visto il porto vuoto. Adesso è vuoto."},{"en":"The Lennox boat has drifted in against the pier on its own, the mooring rope trailing in the water, the wheelhouse door open. Nobody aboard.","de":"Das Boot der Lennox ist von allein gegen die Pier getrieben, die Festmacherleine schleift im Wasser, die Tür des Steuerhauses steht offen. Niemand an Bord.","es":"El barco de los Lennox ha llegado solo a la deriva contra el muelle, con el cabo de amarre arrastrando en el agua y la puerta del puente abierta. No hay nadie a bordo.","fr":"Le bateau des Lennox est venu tout seul à la dérive contre la jetée, l'amarre traînant dans l'eau, la porte de la timonerie ouverte. Personne à bord.","it":"La barca dei Lennox è arrivata da sola alla deriva contro il molo, la cima d'ormeggio che striscia in acqua, la porta della timoneria aperta. Nessuno a bordo."},{"en":"In the stern, one yellow marker barrel lies on its side, chewed and split, as if a dog the size of a bus had worried it and let it go.","de":"Im Heck liegt eine gelbe Markierungstonne auf der Seite, zerbissen und aufgeplatzt, als hätte ein Hund von der Größe eines Busses sie geschüttelt und wieder losgelassen.","es":"En la popa, un bidón amarillo de marca yace de lado, mordido y partido, como si un perro del tamaño de un autobús lo hubiera zarandeado y lo hubiera soltado.","fr":"À la poupe, un baril jaune de balisage gît sur le flanc, mâchonné et fendu, comme si un chien de la taille d'un autobus l'avait secoué puis relâché.","it":"A poppa, un bidone giallo di segnalazione giace su un fianco, morsicato e spaccato, come se un cane grande quanto un autobus lo avesse scrollato e poi lasciato andare."},{"en":"Fergus Brannan, the harbourmaster, is waiting for you with the night log open in his hands. He has not slept.","de":"Fergus Brannan, der Hafenmeister, wartet auf dich, das Nachtbuch offen in den Händen. Er hat nicht geschlafen.","es":"Fergus Brannan, el capitán del puerto, te espera con el libro de guardia abierto en las manos. No ha dormido.","fr":"Fergus Brannan, le capitaine du port, t'attend avec le registre de nuit ouvert entre les mains. Il n'a pas dormi.","it":"Fergus Brannan, il capitano del porto, ti aspetta con il registro notturno aperto tra le mani. Non ha dormito."}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ"},"kind":"question","next":"1.2","prompt":{"en":"Brannan: \"I tried the radio when they were overdue. Read me the log, sergeant. How long had they been overdue when I tried?\"","de":"Brannan: „Ich habe über Funk gerufen, als sie überfällig waren. Lesen Sie mir das Buch vor, Sergeant. Wie lange waren sie überfällig, als ich gerufen habe?“","es":"Brannan: “Llamé por radio cuando se retrasaron. Léeme el libro, sargento. ¿Cuánto retraso llevaban cuando llamé?”","fr":"Brannan : « J'ai appelé à la radio quand ils étaient en retard. Lisez-moi le registre, sergent. Depuis combien de temps étaient-ils en retard quand j'ai appelé ? »","it":"Brannan: «Ho chiamato via radio quando erano in ritardo. Mi legga il registro, sergente. Da quanto erano in ritardo quando ho chiamato?»"},"opts":[{"en":"Forty-five minutes"},{"en":"Six hours and twenty minutes"},{"en":"About fifteen minutes"}],"answer":0,"fb":{"en":"The boat was due at 23:30. The first radio call was at 00:15: FORTY-FIVE MINUTES later. Six hours and twenty minutes is the delay from 23:30 until the boat drifted in at 05:50.","de":"Das Boot sollte um 23:30 zurück sein. Der erste Funkruf war um 00:15: FÜNFUNDVIERZIG MINUTEN später. Sechs Stunden und zwanzig Minuten sind die Zeit von 23:30 bis das Boot um 05:50 hereintrieb.","es":"El barco tenía que volver a las 23:30. La primera llamada por radio fue a las 00:15: CUARENTA Y CINCO MINUTOS después. Seis horas y veinte minutos es el tiempo desde las 23:30 hasta que el barco llegó a la deriva a las 05:50.","fr":"Le bateau devait rentrer à 23h30. Le premier appel radio a eu lieu à 00h15 : QUARANTE-CINQ MINUTES plus tard. Six heures et vingt minutes, c'est le délai entre 23h30 et l'arrivée du bateau à la dérive à 05h50.","it":"La barca doveva rientrare alle 23:30. La prima chiamata radio è stata alle 00:15: QUARANTACINQUE MINUTI dopo. Sei ore e venti minuti è il tempo dalle 23:30 a quando la barca è arrivata alla deriva alle 05:50."},"clue":[{"en":"You read — the harbour log, Wednesday night: 20:40 — Lennox, creel boat, two crew, out to the Narrows. Due back 23:30. · 23:30 — Not back. · 00:15 — No answer on VHF. Tried three times.","de":"Du liest — das Hafenbuch, Mittwochnacht: 20:40 — Lennox, Reusenboot, zwei Mann, raus zu den Engen. Rückkehr 23:30. · 23:30 — Nicht zurück. · 00:15 — Keine Antwort auf UKW. Dreimal versucht.","es":"Lees — el libro de guardia del puerto, miércoles por la noche: 20:40 — Lennox, barco de nasas, dos tripulantes, salida a los Estrechos. Regreso previsto 23:30. · 23:30 — No ha vuelto. · 00:15 — Sin respuesta por VHF. Tres intentos.","fr":"Tu lis — le registre du port, mercredi soir : 20h40 — Lennox, caseyeur, deux hommes, sortie vers les Étroits. Retour prévu 23h30. · 23h30 — Pas rentré. · 00h15 — Pas de réponse en VHF. Trois tentatives.","it":"Leggi — il registro del porto, mercoledì notte: 20:40 — Lennox, barca da nasse, due uomini, uscita verso gli Stretti. Rientro previsto 23:30. · 23:30 — Non rientrata. · 00:15 — Nessuna risposta in VHF. Tre tentativi."},{"en":"05:50 — Boat drifted in against the pier. Empty.","de":"05:50 — Boot treibt gegen die Pier. Leer.","es":"05:50 — El barco llega a la deriva contra el muelle. Vacío.","fr":"05h50 — Bateau venu à la dérive contre la jetée. Vide.","it":"05:50 — Barca arrivata alla deriva contro il molo. Vuota."}],"relic":true},"1.2":{"img":"04_q2_bell.webp","hot":[89.0,17.6,12.0,16.0],"title":{"en":"THE HARBOUR BELL","de":"DIE HAFENGLOCKE","es":"LA CAMPANA DEL PUERTO","fr":"LA CLOCHE DU PORT","it":"LA CAMPANA DEL PORTO"},"story":[{"en":"There is a brass bell on a stone post at the head of the pier. It is rung when a boat is lost.","de":"Auf einem Steinpfosten am Kopf der Pier hängt eine Messingglocke. Sie wird geläutet, wenn ein Boot verloren geht.","es":"Hay una campana de latón sobre un poste de piedra en la punta del muelle. Se toca cuando se pierde un barco.","fr":"Il y a une cloche en laiton sur un poteau de pierre au bout de la jetée. On la sonne quand un bateau est perdu.","it":"C'è una campana di ottone su un palo di pietra in cima al molo. La si suona quando una barca va perduta."},{"en":"Old Mrs Rennie, who has lived above the harbour for eighty years, tells you it has not been rung since the Ossian went down, and that was when you were a child.","de":"Die alte Mrs Rennie, die seit achtzig Jahren über dem Hafen wohnt, sagt dir, sie sei nicht mehr geläutet worden, seit die Ossian unterging, und das war, als du ein Kind warst.","es":"La señora Rennie, que lleva ochenta años viviendo encima del puerto, te dice que no se toca desde que se hundió el Ossian, y eso fue cuando tú eras niña.","fr":"La vieille Mrs Rennie, qui habite au-dessus du port depuis quatre-vingts ans, te dit qu'on ne l'a plus sonnée depuis le naufrage de l'Ossian, et c'était quand tu étais enfant.","it":"La vecchia signora Rennie, che abita sopra il porto da ottant'anni, ti dice che non la suonano più da quando è affondata l'Ossian, e quello è stato quando eri bambina."},{"en":"Brannan has the rope in his hand and he is looking at you, because you are the police and it is your call. Behind him the village has started to come down the hill. Nobody has said the word yet.","de":"Du: „Läute sie. Zwei Männer ___ zurück.“","es":"Brannan tiene la cuerda en la mano y te está mirando, porque tú eres la policía y la decisión es tuya. Detrás de él el pueblo ha empezado a bajar la cuesta. Todavía nadie ha dicho la palabra.","fr":"Toi : « Sonnez-la. Deux hommes ___ . »","it":"Tu: «Suonatela. Due uomini ___ .»"}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ"},"kind":"question","next":"1.3","prompt":{"en":"You: \"Ring it. Two men ___ back.\"","de":"das verneinte Present Perfect ist HAVEN'T + PAST PARTICIPLE. COME ist das Partizip; CAME ist das Past Simple und steht nie nach HAVE.","es":"Tú: “Tócala. Dos hombres ___ .”","fr":"le Present Perfect négatif est HAVEN'T + PAST PARTICIPLE. COME est le participe ; CAME est le Past Simple et ne suit jamais HAVE.","it":"il Present Perfect negativo è HAVEN'T + PAST PARTICIPLE. COME è il participio; CAME è il Past Simple e non segue mai HAVE."},"opts":[{"en":"didn't came"},{"en":"haven't come"},{"en":"haven't came"}],"answer":1,"fb":{"en":"the negative Present Perfect is HAVEN'T + PAST PARTICIPLE. COME is the participle; CAME is the Past Simple and never follows HAVE.","de":"Brannan hat das Seil in der Hand und sieht dich an, denn du bist die Polizei und es ist deine Entscheidung. Hinter ihm hat das Dorf angefangen, den Hügel herunterzukommen. Noch hat niemand das Wort ausgesprochen.","es":"el Present Perfect negativo es HAVEN'T + PAST PARTICIPLE. COME es el participio; CAME es el Past Simple y nunca va detrás de HAVE.","fr":"Brannan a la corde à la main et il te regarde, parce que c'est toi la police et que c'est à toi de décider. Derrière lui le village a commencé à descendre la colline. Personne n'a encore dit le mot.","it":"Brannan ha la corda in mano e ti guarda, perché la polizia sei tu e la decisione è tua. Dietro di lui il paese ha cominciato a scendere dalla collina. Nessuno ha ancora detto la parola."},"clue":[{"en":"You hear: Brannan: \"Say it, sergeant, and I'll ring it.\"","de":"Du hörst: Brannan: „Sagen Sie es, Sergeant, und ich läute.“","es":"Oyes: Brannan: “Dílo, sargento, y la toco.”","fr":"Tu entends : Brannan : « Dites-le, sergent, et je sonne. »","it":"Senti: Brannan: «Lo dica, sergente, e io suono.»"}]},"1.3":{"img":"05_q3_provost.webp","hot":[76.0,70.0,12.0,16.0],"title":{"en":"THE PROVOST","de":"DER BÜRGERMEISTER","es":"EL ALCALDE","fr":"LE MAIRE","it":"IL SINDACO"},"story":[{"en":"Provost Menzies finds you on the quay at nine, where the bunting has been going up all week for Regatta Week. Menzies has been Provost for eleven years and has never lost a vote.","de":"Bürgermeister Menzies findet dich um neun am Kai, wo die ganze Woche Wimpel für die Regattawoche aufgehängt werden. Menzies ist seit elf Jahren Bürgermeister und hat noch nie eine Abstimmung verloren.","es":"El alcalde Menzies te encuentra en el muelle a las nueve, donde llevan toda la semana colgando banderines para la Semana de la Regata. Menzies lleva once años de alcalde y nunca ha perdido una votación.","fr":"Le maire Menzies te trouve sur le quai à neuf heures, là où l'on accroche des fanions toute la semaine pour la Semaine de la Régate. Menzies est maire depuis onze ans et n'a jamais perdu un vote.","it":"Il sindaco Menzies ti trova sulla banchina alle nove, dove per tutta la settimana stanno appendendo le bandierine per la Settimana della Regata. Menzies è sindaco da undici anni e non ha mai perso un voto."},{"en":"He stands beside a big red mooring buoy that has just been painted for the visitors, and he does not look at the Lennox boat once.","de":"Er steht neben einer großen roten Festmachertonne, die gerade erst für die Besucher gestrichen wurde, und sieht das Boot der Lennox kein einziges Mal an.","es":"Está de pie junto a una gran boya roja de amarre recién pintada para los visitantes, y no mira ni una sola vez el barco de los Lennox.","fr":"Il se tient à côté d'une grosse bouée d'amarrage rouge qu'on vient de repeindre pour les visiteurs, et il ne regarde pas une seule fois le bateau des Lennox.","it":"Sta accanto a una grossa boa d'ormeggio rossa appena ridipinta per i visitatori, e non guarda la barca dei Lennox nemmeno una volta."}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ"},"kind":"question","next":"1.4","prompt":{"en":"Menzies: \"Two men had an accident. It happens on a coast. Tell me, in your career, ___ a harbour in August? No. Because nobody has.\"","de":"Menzies: „Zwei Männer hatten einen Unfall. Das passiert an einer Küste. Sagen Sie mir, in Ihrer Laufbahn, ___ einen Hafen im August? Nein. Weil es niemand getan hat.“","es":"Menzies: “Dos hombres tuvieron un accidente. Pasa en la costa. Dígame, en su carrera, ¿___ un puerto en agosto? No. Porque nadie lo ha hecho.”","fr":"Menzies : « Deux hommes ont eu un accident. Ça arrive sur une côte. Dites-moi, dans votre carrière, ___ un port en août ? Non. Parce que personne ne l'a fait. »","it":"Menzies: «Due uomini hanno avuto un incidente. Succede su una costa. Mi dica, nella sua carriera, ___ un porto in agosto? No. Perché nessuno lo ha fatto.»"},"opts":[{"en":"did you ever closed"},{"en":"have you ever closing"},{"en":"have you ever closed"}],"answer":2,"fb":{"en":"An experience up to now can use HAVE + subject + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? DID takes CLOSE, not CLOSED. HAVE takes CLOSED, not CLOSING.","de":"Eine Erfahrung bis jetzt kann HAVE + Subjekt + EVER + PAST PARTICIPLE verwenden: HAVE YOU EVER CLOSED? DID nimmt CLOSE, nicht CLOSED. HAVE nimmt CLOSED, nicht CLOSING.","es":"Una experiencia hasta ahora puede usar HAVE + sujeto + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? DID lleva CLOSE, no CLOSED. HAVE lleva CLOSED, no CLOSING.","fr":"Une expérience jusqu'à maintenant peut utiliser HAVE + sujet + EVER + PAST PARTICIPLE : HAVE YOU EVER CLOSED ? DID prend CLOSE, pas CLOSED. HAVE prend CLOSED, pas CLOSING.","it":"Un'esperienza fino a ora può usare HAVE + soggetto + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? DID prende CLOSE, non CLOSED. HAVE prende CLOSED, non CLOSING."},"clue":[{"en":"You hear: Menzies: \"This town has had three bad winters, sergeant. It has not had a bad August, and it will not start now. Regatta Week is four hundred visitors and every bed in the village.\" · You: \"Two men haven't come home.\"","de":"Du hörst: Menzies: „Diese Stadt hatte drei schlechte Winter, Sergeant. Sie hatte keinen schlechten August, und damit fängt sie jetzt nicht an. Die Regattawoche sind vierhundert Besucher und jedes Bett im Dorf.“ · Du: „Zwei Männer sind nicht nach Hause gekommen.“","es":"Oyes: Menzies: “Este pueblo ha tenido tres inviernos malos, sargento. No ha tenido un agosto malo, y no va a empezar ahora. La Semana de la Regata son cuatrocientos visitantes y todas las camas del pueblo.” · Tú: “Dos hombres no han vuelto a casa.”","fr":"Tu entends : Menzies : « Cette ville a eu trois mauvais hivers, sergent. Elle n'a pas eu de mauvais mois d'août, et ça ne va pas commencer maintenant. La Semaine de la Régate, c'est quatre cents visiteurs et tous les lits du village. » · Toi : « Deux hommes ne sont pas rentrés. »","it":"Senti: Menzies: «Questo paese ha avuto tre brutti inverni, sergente. Non ha avuto un brutto agosto, e non comincerà adesso. La Settimana della Regata sono quattrocento visitatori e ogni letto del paese.» · Tu: «Due uomini non sono tornati a casa.»"}]},"1.4":{"img":"06_q4_forecast.webp","hot":[78.0,62.0,12.0,16.0],"title":{"en":"THE FORECAST","de":"DER WETTERBERICHT","es":"EL PARTE METEOROLÓGICO","fr":"LE BULLETIN MÉTÉO","it":"IL BOLLETTINO"},"story":[{"en":"Brannan's office is a wooden hut at the end of the pier with a kettle, a barometer and a radio that has been on since 1987. At five past five he turns it up.","de":"Brannans Büro ist eine Holzhütte am Ende der Pier mit einem Wasserkocher, einem Barometer und einem Radio, das seit 1987 läuft. Um fünf nach fünf dreht er es lauter.","es":"La oficina de Brannan es una caseta de madera al final del muelle con un hervidor, un barómetro y una radio encendida desde 1987. A las cinco y cinco sube el volumen.","fr":"Le bureau de Brannan est une cabane en bois au bout de la jetée, avec une bouilloire, un baromètre et une radio allumée depuis 1987. À dix-sept heures cinq il monte le son.","it":"L'ufficio di Brannan è una baracca di legno in fondo al molo con un bollitore, un barometro e una radio accesa dal 1987. Alle cinque e cinque alza il volume."},{"en":"He tells you the rules before it starts: IMMINENT means inside six hours, SOON means six to twelve, LATER means more than twelve, and the clock starts from the time the forecast is issued.","de":"Er erklärt dir die Regeln, bevor es losgeht: IMMINENT heißt innerhalb von sechs Stunden, SOON heißt sechs bis zwölf, LATER heißt mehr als zwölf, und die Uhr läuft ab dem Zeitpunkt, zu dem der Bericht herausgegeben wird.","es":"Te explica las reglas antes de que empiece: IMMINENT significa dentro de seis horas, SOON significa de seis a doce, LATER significa más de doce, y el reloj empieza a contar desde la hora en que se emite el parte.","fr":"Il t'explique les règles avant que ça commence : IMMINENT veut dire dans les six heures, SOON veut dire de six à douze, LATER veut dire plus de douze, et l'horloge part de l'heure d'émission du bulletin.","it":"Ti spiega le regole prima che cominci: IMMINENT vuol dire entro sei ore, SOON vuol dire da sei a dodici, LATER vuol dire più di dodici, e l'orologio parte dall'ora in cui il bollettino viene emesso."}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ"},"kind":"question","next":"1.5","prompt":{"en":"Brannan: \"The regatta starts at ten tomorrow morning. If the forecast is right about LATER, what's the earliest the wind can get up to force 7?\"","de":"Brannan: „Die Regatta beginnt morgen früh um zehn. Wenn der Bericht mit LATER recht hat, wann kann der Wind frühestens Stärke 7 erreichen?“","es":"Brannan: “La regata empieza mañana a las diez de la mañana. Si el parte acierta con LATER, ¿cuándo es lo más pronto que el viento puede llegar a fuerza 7?”","fr":"Brannan : « La régate commence demain à dix heures du matin. Si le bulletin dit vrai avec LATER, au plus tôt, quand le vent peut-il atteindre force 7 ? »","it":"Brannan: «La regata comincia domani mattina alle dieci. Se il bollettino ha ragione su LATER, al più presto quando può il vento arrivare a forza 7?»"},"opts":[{"en":"After 05:05 tomorrow morning"},{"en":"At ten tomorrow, when the racing starts"},{"en":"Before midnight tonight"}],"answer":0,"fb":{"en":"LATER means more than twelve hours after the time of issue. Twelve hours after 17:05 is 05:05 on Friday. It can come after that; nothing in the forecast says it will wait for the racing.","de":"LATER bedeutet mehr als zwölf Stunden nach der Ausgabezeit. Zwölf Stunden nach 17:05 ist 05:05 am Freitag. Danach kann er kommen; nichts im Bericht sagt, dass er auf die Rennen wartet.","es":"LATER significa más de doce horas después de la hora de emisión. Doce horas después de las 17:05 son las 05:05 del viernes. Puede llegar después de eso; nada en el parte dice que vaya a esperar a las regatas.","fr":"LATER veut dire plus de douze heures après l'heure d'émission. Douze heures après 17h05, cela fait 05h05 vendredi. Il peut venir après ; rien dans le bulletin ne dit qu'il attendra les courses.","it":"LAT iaio lungo il termosifone, e la sala ammutolisce."}],"k":{"en":"CHAPTER 1 · INVERBRAE · FRIDAY NIGHT","de":"KAPITEL 1 · INVERBRAE · FREITAGNACHT","es":"CAPÍTULO 1 · INVERBRAE · VIERNES POR LA NOCHE","fr":"CHAPITRE 1 · INVERBRAE · VENDREDI SOIR","it":"CAPITOLO 1 · INVERBRAE · VENERDÌ SERA"},"kind":"question","next":"1.9","prompt":{"en":"Vass: \"So what does he actually promise for thirty thousand?\"","de":"Vass: „Und was genau verspricht er für dreißigtausend?“","es":"Vass: “¿Y qué promete exactamente por treinta mil?”","fr":"Vass : « Et qu'est-ce qu'il promet exactement pour trente mille ? »","it":"Vass: «E cosa promette esattamente per trentamila?»"},"opts":[{"en":"To have it caught before Sunday"},{"en":"The beak, and the animal gone"},{"en":"A photograph and the ten thousand"}],"answer":1,"fb":{"en":"Tulloch names a price, a method and a result: the beak and the animal gone from the coast. He says nothing about when. The photograph is what he says ten thousand buys.","de":"Tulloch nennt einen Preis, eine Methode und ein Ergebnis: den Schnabel und das Tier weg von dieser Küste. Über das Wann sagt er nichts. Das Foto ist das, was zehntausend seiner Aussage nach kaufen.","es":"Tulloch da un precio, un método y un resultado: el pico y el animal fuera de esta costa. No dice nada sobre cuándo. La fotografía es lo que, según él, se compra con diez mil.","fr":"Tulloch donne un prix, une méthode et un résultat : le bec et l'animal partis de cette côte. Il ne dit rien sur le quand. La photographie, c'est ce que dix mille achètent, d'après lui.","it":"Tulloch indica un prezzo, un metodo e un risultato: il becco e l'animale via da questa costa. Sul quando non dice niente. La fotografia è quello che, secondo lui, si compra con diecimila."},"clue":[{"en":"You hear: Menzies: \"The council has put up ten thousand pounds for whoever brings it in. Ten thousand. There are boats in this harbour that could use it.\"","de":"Du hörst: Menzies: „Der Gemeinderat hat zehntausend Pfund ausgesetzt für den, der es hereinbringt. Zehntausend. In diesem Hafen gibt es Boote, die das brauchen könnten.“","es":"Oyes: Menzies: “El ayuntamiento ha puesto diez mil libras para quien lo traiga. Diez mil. Hay barcos en este puerto a los que les vendrían bien.”","fr":"Tu entends : Menzies : « Le conseil a mis dix mille livres pour celui qui le ramènera. Dix mille. Il y a des bateaux dans ce port qui en auraient besoin. »","it":"Senti: Menzies: «Il consiglio ha messo diecimila sterline per chi lo porta dentro. Diecimila. Ci sono barche in questo porto a cui farebbero comodo.»"},{"en":"Tulloch: \"Ten thousand won't buy you the beak, Provost. Ten will buy you a photograph and a funeral. Thirty thousand, my boat, my crew, my way. For thirty I'll bring you the beak and you'll never see it on this coast again. I've been after this thing since 1998. I'll not rush it for ten.\"","de":"Tulloch: „Zehntausend kaufen Ihnen nicht den Schnabel, Herr Bürgermeister. Zehn kaufen Ihnen ein Foto und eine Beerdigung. Dreißigtausend, mein Boot, meine Leute, meine Art. Für dreißig bringe ich Ihnen den Schnabel, und Sie werden es an dieser Küste nie wiedersehen. Ich bin seit 1998 hinter diesem Ding her. Für zehn überstürze ich nichts.“","es":"Tulloch: “Diez mil no le compran el pico, alcalde. Diez le compran una fotografía y un funeral. Treinta mil, mi barco, mi tripulación, a mi manera. Por treinta le traigo el pico y no volverá a verlo en esta costa. Llevo detrás de esta cosa desde 1998. No voy a darme prisa por diez.”","fr":"Tulloch : « Dix mille ne vous achètent pas le bec, monsieur le maire. Dix vous achètent une photo et un enterrement. Trente mille, mon bateau, mon équipage, à ma façon. Pour trente je vous rapporte le bec et vous ne le reverrez jamais sur cette côte. Je suis après cette chose depuis 1998. Je ne vais pas me presser pour dix. »","it":"Tulloch: «Diecimila non le comprano il becco, signor sindaco. Dieci le comprano una fotografia e un funerale. Trentamila, la mia barca, il mio equipaggio, a modo mio. Per trenta le porto il becco e non lo rivedrà mai più su questa costa. Sto dietro a questa cosa dal 1998. Non vado di fretta per dieci.»"},{"en":"Dr Rhona Vass has been standing beside you since the radiator. She arrived off the Oban road an hour ago with a silver instrument case, and she has not stopped writing.","de":"Dr. Rhona Vass steht seit der Sache mit der Heizung neben dir. Sie kam vor einer Stunde über die Straße von Oban, mit einem silbernen Instrumentenkoffer, und sie hat nicht aufgehört zu schreiben.","es":"La doctora Rhona Vass lleva a tu lado desde lo del radiador. Llegó por la carretera de Oban hace una hora con un maletín plateado de instrumentos, y no ha parado de escribir.","fr":"La docteure Rhona Vass se tient à côté de toi depuis l'épisode du radiateur. Elle est arrivée par la route d'Oban il y a une heure avec une mallette d'instruments argentée, et elle n'a pas cessé d'écrire.","it":"La dottoressa Rhona Vass è accanto a te dalla scena del termosifone. È arrivata dalla strada di Oban un'ora fa con una valigetta d'argento di strumenti, e non ha smesso di scrivere."}]},"1.9":{"img":"11_q9_jar.webp","hot":[80.0,59.0,12.0,16.0],"title":{"en":"THE JAR","de":"DAS GLAS","es":"EL TARRO","fr":"LE BOCAL","it":"IL BARATTOLO"},"story":[{"en":"The village hall kitchen, Saturday morning, cold light through the window. On the table is a wide glass jar of clear fluid and inside it, turning slowly, is a black curved ring the size of your fist.","de":"Die Küche des Gemeindehauses, Samstagmorgen, kaltes Licht durch das Fenster. Auf dem Tisch steht ein breites Glas mit klarer Flüssigkeit, und darin dreht sich langsam ein schwarzer gebogener Ring von der Größe deiner Faust.","es":"La cocina del salón del pueblo, sábado por la mañana, luz fría por la ventana. Sobre la mesa hay un tarro ancho de cristal con líquido transparente y dentro, girando despacio, un anillo negro curvado del tamaño de tu puño.","fr":"La cuisine de la salle des fêtes, samedi matin, lumière froide par la fenêtre. Sur la table il y a un large bocal en verre rempli de liquide clair et, à l'intérieur, tournant lentement, un anneau noir incurvé de la taille de ton poing.","it":"La cucina della sala del paese, sabato mattina, luce fredda dalla finestra. Sul tavolo c'è un largo barattolo di vetro con dentro un liquido trasparente e, dentro, che gira lentamente, un anello nero ricurvo grande quanto il tuo pugno."},{"en":"Vass found it jammed in the splintered gunwale of the Lennox boat. She has studied squid for nine years, in Baja, in Norway, in the Sea of Cortez, and she has been looking at this jar for two hours.","de":"Vass hat ihn in der zersplitterten Reling des Lennox-Boots eingeklemmt gefunden. Sie erforscht Kalmare seit neun Jahren, in Baja, in Norwegen, im Golf von Kalifornien, und sie sieht dieses Glas seit zwei Stunden an.","es":"Vass lo encontró encajado en la regala astillada del barco de los Lennox. Lleva nueve años estudiando calamares, en Baja California, en Noruega, en el mar de Cortés, y lleva dos horas mirando este tarro.","fr":"Vass l'a trouvé coincé dans le plat-bord éclaté du bateau des Lennox. Elle étudie les calmars depuis neuf ans, en Basse-Californie, en Norvège, dans la mer de Cortès, et elle regarde ce bocal depuis deux heures.","it":"Vass lo ha trovato incastrato nella battagliola scheggiata della barca dei Lennox. Studia i calamari da nove anni, in Bassa California, in Norvegia, nel Mare di Cortez, e guarda questo barattolo da due ore."}],"k":{"en":"CHAPTER 1 · INVERBRAE · SATURDAY","de":"KAPITEL 1 · INVERBRAE · SAMSTAG","es":"CAPÍTULO 1 · INVERBRAE · SÁBADO","fr":"CHAPITRE 1 · INVERBRAE · SAMEDI","it":"CAPITOLO 1 · INVERBRAE · SABATO"},"kind":"question","next":"1.10","prompt":{"en":"Vass: \"Here's the test, sergeant. If somebody hauls up a four-metre squid this afternoon and hangs it on the crane, what size of beak should it have?\"","de":"Vass: „Hier ist der Test, Sergeant. Wenn heute Nachmittag jemand einen vier Meter langen Kalmar heraufholt und ihn an den Kran hängt, wie groß müsste dann sein Schnabel sein?“","es":"Vass: “Aquí está la prueba, sargento. Si alguien saca esta tarde un calamar de cuatro metros y lo cuelga de la grúa, ¿de qué tamaño debería ser su pico?”","fr":"Vass : « Voilà le test, sergent. Si quelqu'un remonte cet après-midi un calmar de quatre mètres et le pend à la grue, quelle taille devrait faire son bec ? »","it":"Vass: «Ecco la prova, sergente. Se questo pomeriggio qualcuno tira su un calamaro di quattro metri e lo appende alla gru, quanto dovrebbe essere grande il suo becco?»"},"opts":[{"en":"About the size of a fist"},{"en":"About fourteen centimetres"},{"en":"About the size of a thumb"}],"answer":2,"fb":{"en":"Vass gives the scale: four metres, a thumb-sized beak; fourteen metres or more, a fist-sized beak. Fourteen is the animal's length, not the beak's.","de":"Vass gibt den Maßstab: vier Meter, ein daumengroßer Schnabel; vierzehn Meter oder mehr, ein faustgroßer Schnabel. Vierzehn ist die Länge des Tieres, nicht die des Schnabels.","es":"Vass da la escala: cuatro metros, un pico del tamaño de un pulgar; catorce metros o más, un pico del tamaño de un puño. Catorce es la longitud del animal, no la del pico.","fr":"Vass donne l'échelle : quatre mètres, un bec de la taille d'un pouce ; quatorze mètres ou plus, un bec de la taille d'un poing. Quatorze, c'est la longueur de l'animal, pas celle du bec.","it":"Vass dà la scala: quattro metri, un becco grande come un pollice; quattordici metri o più, un becco grande come un pugno. Quattordici è la lunghezza dell'animale, non del becco."},"clue":[{"en":"You hear:","de":"Du hörst:","es":"Oyes:","fr":"Tu entends :","it":"Senti:"},{"en":"Vass: \"A squid's beak grows with the animal. A four-metre squid has a beak about the size of my thumb. This ring is the size of my fist. The animal that left it is fourteen metres at least. Maybe twenty. Nothing that size has ever been recorded alive in these waters. Not once.\"","de":"Vass: „Der Schnabel eines Kalmars wächst mit dem Tier. Ein vier Meter langer Kalmar hat einen Schnabel etwa so groß wie mein Daumen. Dieser Ring ist so groß wie meine Faust. Das Tier, das ihn hinterlassen hat, ist mindestens vierzehn Meter lang. Vielleicht zwanzig. Nichts in dieser Größe wurde in diesen Gewässern je lebend nachgewiesen. Kein einziges Mal.“","es":"Vass: “El pico de un calamar crece con el animal. Un calamar de cuatro metros tiene un pico del tamaño de mi pulgar. Este anillo es del tamaño de mi puño. El animal que lo dejó mide catorce metros por lo menos. Puede que veinte. Nunca se ha registrado nada de ese tamaño vivo en estas aguas. Ni una sola vez.”","fr":"Vass : « Le bec d'un calmar grandit avec l'animal. Un calmar de quatre mètres a un bec de la taille de mon pouce environ. Cet anneau fait la taille de mon poing. L'animal qui l'a laissé fait quatorze mètres au moins. Peut-être vingt. Rien de cette taille n'a jamais été observé vivant dans ces eaux. Pas une seule fois. »","it":"Vass: «Il becco di un calamaro cresce con l'animale. Un calamaro di quattro metri ha un becco grande all'incirca come il mio pollice. Questo anello è grande come il mio pugno. L'animale che lo ha lasciato è lungo almeno quattordici metri. Forse venti. Niente di quelle dimensioni è mai stato registrato vivo in queste acque. Nemmeno una volta.»"},{"en":"You: \"You've seen a lot of squid.\" · Vass: \"I have. I've never seen this.\"","de":"Du: „Sie haben viele Kalmare gesehen.“ · Vass: „Habe ich. Das hier habe ich noch nie gesehen.“","es":"Tú: “Has visto muchos calamares.” · Vass: “Sí. Pero este no lo he visto nunca.”","fr":"Toi : « Vous avez vu beaucoup de calmars. » · Vass : « Oui. Mais ça, je ne l'ai jamais vu. »","it":"Tu: «Ha visto tanti calamari.» · Vass: «Sì. Ma questo non l'ho mai visto.»"}],"relic":true},"1.10":{"img":"12_q10_crane.webp","hot":[75.0,46.0,12.0,16.0],"title":{"en":"THE WRONG CATCH","de":"DER FALSCHE FANG","es":"LA CAPTURA EQUIVOCADA","fr":"LA MAUVAISE PRISE","it":"LA CATTURA SBAGLIATA"},"story":[{"en":"Midday, and the harbour is full of people again.","de":"Mittag, und der Hafen ist wieder voller Menschen.","es":"Mediodía, y el puerto vuelve a estar lleno de gente.","fr":"Midi, et le port est de nouveau plein de monde.","it":"Mezzogiorno, e il porto è di nuovo pieno di gente."},{"en":"Two brothers from Glasgow called Docherty have come up the coast in an orange RIB with a rifle and a net, and hanging from the harbour crane, grey and dripping, is a squid four metres long.","de":"Zwei Brüder aus Glasgow namens Docherty sind in einem orangefarbenen Schlauchboot mit Gewehr und Netz die Küste heraufgekommen, und am Hafenkran hängt, grau und tropfend, ein vier Meter langer Kalmar.","es":"Dos hermanos de Glasgow apellidados Docherty han subido por la costa en una lancha naranja con un rifle y una red, y colgando de la grúa del puerto, gris y chorreando, hay un calamar de cuatro metros.","fr":"Deux frères de Glasgow nommés Docherty sont remontés le long de la côte dans un semi-rigide orange avec une carabine et un filet, et à la grue du port pend, gris et dégoulinant, un calmar de quatre mètres.","it":"Due fratelli di Glasgow di cognome Docherty sono risaliti lungo la costa con un gommone arancione, un fucile e una rete, e appeso alla gru del porto, grigio e gocciolante, c'è un calamaro lungo quattro metri."},{"en":"Menzies is standing beside it in his best coat. Photographers. A cheer.","de":"Menzies steht daneben in seinem besten Mantel. Fotografen. Ein Jubelruf.","es":"Menzies está a su lado con su mejor abrigo. Fotógrafos. Un vítor.","fr":"Menzies est à côté dans son plus beau manteau. Des photographes. Une ovation.","it":"Menzies gli sta accanto con il cappotto buono. Fotografi. Un applauso."},{"en":"Vass walks under it with a tape measure and measures the beak. It is the size of her thumb. She comes back to you white with anger and speaks very quietly.","de":"Vass geht mit einem Maßband darunter durch und misst den Schnabel. Er ist so groß wie ihr Daumen. Sie kommt weiß vor Wut zu dir zurück und spricht sehr leise.","es":"Vass pasa por debajo con una cinta métrica y mide el pico. Es del tamaño de su pulgar. Vuelve hacia ti blanca de rabia y habla muy bajo.","fr":"Vass passe dessous avec un mètre ruban et mesure le bec. Il fait la taille de son pouce. Elle revient vers toi blanche de colère et parle très bas.","it":"Vass ci passa sotto con un metro e misura il becco. È grande come il suo pollice. Torna da te bianca di rabbia e parla pianissimo."}],"k":{"en":"CHAPTER 1 · INVERBRAE · SATURDAY","de":"KAPITEL 1 · INVERBRAE · SAMSTAG","es":"CAPÍTULO 1 · INVERBRAE · SÁBADO","fr":"CHAPITRE 1 · INVERBRAE · SAMEDI","it":"CAPITOLO 1 · INVERBRAE · SABATO"},"kind":"question","next":"choice1","prompt":{"en":"Vass, to you: \"That's not it. Look at the colour. It ___ for a week, sergeant. It's been dead longer than the Lennox boat's been missing. They found it. They didn't catch it.\"","de":"Vass, zu dir: „Das ist es nicht. Sieh dir die Farbe an. Es ___ seit einer Woche, Sergeant. Es ist länger tot, als das Lennox-Boot vermisst wird. Sie haben es gefunden. Sie haben es nicht gefangen.“","es":"Vass, a ti: “Ese no es. Mira el color. ___ una semana, sargento. Lleva muerto más tiempo del que lleva desaparecido el barco de los Lennox. Lo encontraron. No lo pescaron.”","fr":"Vass, à toi : « Ce n'est pas lui. Regarde la couleur. Il ___ depuis une semaine, sergent. Il est mort depuis plus longtemps que le bateau des Lennox n'a disparu. Ils l'ont trouvé. Ils ne l'ont pas pêché. »","it":"Vass, a te: «Non è lui. Guarda il colore. ___ da una settimana, sergente. È morto da più tempo di quanto la barca dei Lennox sia scomparsa. Lo hanno trovato. Non lo hanno preso.»"},"opts":[{"en":"has been dead"},{"en":"is dead since"},{"en":"has dead"}],"answer":0,"fb":{"en":"a state that has lasted up to now takes HAS + BEEN + adjective + FOR a period. IS ... SINCE is a learner error for duration, and BEEN cannot be dropped after HAS.","de":"ein Zustand, der bis jetzt angedauert hat, nimmt HAS + BEEN + Adjektiv + FOR und einen Zeitraum. IS ... SINCE ist ein typischer Lernerfehler für Dauer, und BEEN darf nach HAS nicht wegfallen.","es":"un estado que dura hasta ahora lleva HAS + BEEN + adjetivo + FOR y un periodo. IS ... SINCE es un error típico para la duración, y BEEN no se puede quitar detrás de HAS.","fr":"un état qui dure jusqu'à maintenant prend HAS + BEEN + adjectif + FOR et une durée. IS ... SINCE est une erreur courante pour la durée, et BEEN ne peut pas tomber après HAS.","it":"uno stato che dura fino a ora prende HAS + BEEN + aggettivo + FOR e un periodo. IS ... SINCE è un errore tipico per la durata, e BEEN non può cadere dopo HAS."},"clue":[{"en":"You hear: Menzies, to the crowd: \"Inverbrae has caught its monster!\"","de":"Du hörst: Menzies, zur Menge: „Inverbrae hat sein Ungeheuer gefangen!“","es":"Oyes: Menzies, a la multitud: “¡Inverbrae ha capturado a su monstruo!”","fr":"Tu entends : Menzies, à la foule : « Inverbrae a capturé son monstre ! »","it":"Senti: Menzies, alla folla: «Inverbrae ha catturato il suo mostro!»"}]},"choice1":{"img":"13_choice1_crane.webp","hot":[80.0,57.0,12.0,16.0],"title":{"en":"THE CRANE","de":"DER KRAN","es":"LA GRÚA","fr":"LA GRUE","it":"LA GRU"},"story":[{"en":"Menzies has gone to the hotel. Vass has a filleting knife. The light is going.","de":"Menzies ist ins Hotel gegangen. Vass hat ein Filetiermesser. Das Licht geht.","es":"Menzies se ha ido al hotel. Vass tiene un cuchillo de filetear. Se va la luz.","fr":"Menzies est parti à l'hôtel. Vass a un couteau à filets. La lumière tombe.","it":"Menzies è andato in albergo. Vass ha un coltello da filetti. La luce sta andando via."}],"kind":"choice","routes":[{"name":{"en":"THE KNIFE","de":"DAS MESSER","es":"EL CUCHILLO","fr":"LE COUTEAU","it":"IL COLTELLO"},"desc":{"en":"Cut the squid open tonight, on the quay, and find out what it has eaten.","de":"Den Kalmar heute Nacht am Kai aufschneiden und herausfinden, was er gefressen hat.","es":"Abrir el calamar esta noche, en el muelle, y averiguar qué ha comido.","fr":"Ouvrir le calmar ce soir, sur le quai, et découvrir ce qu'il a mangé.","it":"Aprire il calamaro stanotte, sulla banchina, e scoprire cosa ha mangiato."},"target":"1.11a","route":"THE KNIFE"},{"name":{"en":"THE KESTREL","de":"DIE KESTREL","es":"EL KESTREL","fr":"LE KESTREL","it":"IL KESTREL"},"desc":{"en":"Dougie Ferrier's boat has not been seen since Thursday. Take the police RIB out into the dark and look for it.","de":"Dougie Ferriers Boot ist seit Donnerstag nicht gesehen worden. Mit dem Polizeischlauchboot in die Dunkelheit hinausfahren und danach suchen.","es":"El barco de Dougie Ferrier no se ve desde el jueves. Sacar la lancha de la policía a la oscuridad y buscarlo.","fr":"On n'a pas vu le bateau de Dougie Ferrier depuis jeudi. Sortir le semi-rigide de la police dans le noir et le chercher.","it":"La barca di Dougie Ferrier non si vede da giovedì. Uscire con il gommone della polizia nel buio e cercarla."},"target":"1.11b","route":"THE KESTREL"}]},"1.11a":{"img":"14_q11a_knife.webp","hot":[92.0,59.0,12.0,16.0],"title":{"en":"THE KNIFE","de":"DAS MESSER","es":"EL CUCHILLO","fr":"LE COUTEAU","it":"IL COLTELLO"},"story":[{"en":"Eleven o'clock on the quay. The crowd has gone and the squid hangs in the light of one harbour lamp, turning. Vass has rolled her sleeves up.","de":"Elf Uhr am Kai. Die Menge ist weg, und der Kalmar hängt drehend im Licht einer einzigen Hafenlampe. Vass hat die Ärmel hochgekrempelt.","es":"Las once en el muelle. La gente se ha ido y el calamar cuelga a la luz de una sola farola del puerto, girando. Vass se ha remangado.","fr":"Onze heures sur le quai. La foule est partie et le calmar pend dans la lumière d'une seule lampe du port, en tournant. Vass a remonté ses manches.","it":"Le undici sulla banchina. La folla se n'è andata e il calamaro pende girando nella luce di una sola lampada del porto. Vass si è tirata su le maniche."},{"en":"You are holding a bucket and a torch and you have not asked what the bucket is for.","de":"Du hältst einen Eimer und eine Taschenlampe und hast nicht gefragt, wofür der Eimer ist.","es":"Tú sostienes un cubo y una linterna y no has preguntado para qué es el cubo.","fr":"Tu tiens un seau et une lampe torche et tu n'as pas demandé à quoi sert le seau.","it":"Tu reggi un secchio e una torcia e non hai chiesto a cosa serva il secchio."}],"k":{"en":"CHAPTER 2 · THE KNIFE · SATURDAY NIGHT","de":"KAPITEL 2 · DAS MESSER · SAMSTAGNACHT","es":"CAPÍTULO 2 · EL CUCHILLO · SÁBADO POR LA NOCHE","fr":"CHAPITRE 2 · LE COUTEAU · SAMEDI SOIR","it":"CAPITOLO 2 · IL COLTELLO · SABATO NOTTE"},"kind":"question","next":"1.12a","prompt":{"en":"Vass: \"Hold the torch steady. I've done this to a hundred of these and never one that smelled like this. Pass me the bucket. I ___ my dinner yet and I'd like to keep it that way.\"","de":"Vass: „Halt die Lampe ruhig. Ich habe das bei hundert von denen gemacht und keiner hat je so gerochen. Gib mir den Eimer. Ich ___ noch nicht, und das möchte ich gern so lassen.“","es":"Vass: “Aguanta la linterna quieta. Le he hecho esto a cien de estos y ninguno olía así. Pásame el cubo. ___ todavía y me gustaría que siguiera siendo así.”","fr":"Vass : « Tiens la lampe bien droite. J'ai fait ça à une centaine de ces bêtes et aucune n'a jamais senti comme ça. Passe-moi le seau. Je ___ encore et j'aimerais que ça reste comme ça. »","it":"Vass: «Tieni ferma la torcia. L'ho fatto a un centinaio di questi e nessuno ha mai avuto questo odore. Passami il secchio. ___ ancora e mi piacerebbe che restasse così.»"},"opts":[{"en":"didn't had"},{"en":"haven't had"},{"en":"haven't have"}],"answer":1,"fb":{"en":"HAVEN'T + PAST PARTICIPLE describes something that has not happened up to now. HAVE becomes HAD: HAVEN'T HAD. DIDN'T takes HAVE, not HAD. YET goes at the end of this sentence.","de":"HAVEN'T + PAST PARTICIPLE beschreibt etwas, das bis jetzt nicht passiert ist. HAVE wird zu HAD: HAVEN'T HAD. DIDN'T nimmt HAVE, nicht HAD. YET steht am Ende dieses Satzes.","es":"HAVEN'T + PAST PARTICIPLE describe algo que no ha ocurrido hasta ahora. HAVE se convierte en HAD: HAVEN'T HAD. DIDN'T lleva HAVE, no HAD. YET va al final de esta frase.","fr":"HAVEN'T + PAST PARTICIPLE décrit une chose qui n'a pas eu lieu jusqu'à maintenant. HAVE devient HAD : HAVEN'T HAD. DIDN'T prend HAVE, pas HAD. YET se place à la fin de cette phrase.","it":"HAVEN'T + PAST PARTICIPLE descrive qualcosa che non è successo fino a ora. HAVE diventa HAD: HAVEN'T HAD. DIDN'T prende HAVE, non HAD. YET va alla fine di questa frase."},"clue":[{"en":"You hear:","de":"Du hörst:","es":"Oyes:","fr":"Tu entends :","it":"Senti:"}]},"1.12a":{"img":"15_q12a_stomach.webp","hot":[82.0,50.0,12.0,16.0],"title":{"en":"THE STOMACH","de":"DER MAGEN","es":"EL ESTÓMAGO","fr":"L'ESTOMAC","it":"LO STOMACO"},"story":[{"en":"What comes out is mackerel, half of a plastic bottle and a lot of water. No rope. No paint. No cloth. Vass lays it all in a steel tray under the lamp and looks at it for a long time.","de":"Heraus kommen Makrelen, eine halbe Plastikflasche und viel Wasser. Kein Seil. Keine Farbe. Kein Stoff. Vass legt alles in eine Stahlschale unter die Lampe und sieht es lange an.","es":"Lo que sale es caballa, media botella de plástico y mucha agua. Ni cabo. Ni pintura. Ni tela. Vass lo coloca todo en una bandeja de acero bajo la lámpara y lo mira durante un buen rato.","fr":"Ce qui en sort, c'est du maquereau, la moitié d'une bouteille en plastique et beaucoup d'eau. Pas de cordage. Pas de peinture. Pas de tissu. Vass étale le tout dans un plateau en acier sous la lampe et le regarde longuement.","it":"Quello che esce è sgombro, metà bottiglia di plastica e molta acqua. Niente cavo. Niente vernice. Niente stoffa. Vass dispone tutto su un vassoio d'acciaio sotto la lampada e lo guarda a lungo."}],"k":{"en":"CHAPTER 2 · THE KNIFE · SATURDAY NIGHT","de":"KAPITEL 2 · DAS MESSER · SAMSTAGNACHT","es":"CAPÍTULO 2 · EL CUCHILLO · SÁBADO POR LA NOCHE","fr":"CHAPITRE 2 · LE COUTEAU · SAMEDI SOIR","it":"CAPITOLO 2 · IL COLTELLO · SABATO NOTTE"},"kind":"question","next":"1.13","prompt":{"en":"You: \"So what does its stomach prove?\"","de":"Du: „Und was beweist sein Magen?“","es":"Tú: “¿Y qué demuestra su estómago?”","fr":"Toi : « Et qu'est-ce que son estomac prouve ? »","it":"Tu: «E cosa dimostra il suo stomaco?»"},"opts":[{"en":"It ate the Lennox men"},{"en":"It took the red kayak"},{"en":"It's not our animal"}],"answer":2,"fb":{"en":"no rope, no red paint, and it has been dead since before Wednesday. It could not have taken the boat or the kayak.","de":"kein Seil, keine rote Farbe, und es ist seit vor Mittwoch tot. Es kann weder das Boot noch das Kajak geholt haben.","es":"ni cabo, ni pintura roja, y lleva muerto desde antes del miércoles. No pudo llevarse el barco ni el kayak.","fr":"pas de cordage, pas de peinture rouge, et il est mort depuis avant mercredi. Il n'a pas pu prendre le bateau ni le kayak.","it":"niente cavo, niente vernice rossa, ed è morto da prima di mercoledì. Non può aver preso né la barca né il kayak."},"clue":[{"en":"You hear:","de":"Du hörst:","es":"Oyes:","fr":"Tu entends :","it":"Senti:"},{"en":"Vass: \"Its last meal was mackerel and a bottle. The Lennox boat was taken on Wednesday night. Ewan's kayak was red, and there isn't a flake of red in here. This animal has been dead since before any of it happened.\"","de":"Vass: „Seine letzte Mahlzeit waren Makrelen und eine Flasche. Das Lennox-Boot wurde Mittwochnacht geholt. Ewans Kajak war rot, und hier drin ist keine Schuppe Rot. Dieses Tier ist tot, seit bevor irgendetwas davon passiert ist.“","es":"Vass: “Su última comida fue caballa y una botella. El barco de los Lennox se lo llevaron el miércoles por la noche. El kayak de Ewan era rojo, y aquí no hay ni una escama de rojo. Este animal lleva muerto desde antes de que pasara nada de esto.”", tion","next":"choice2","prompt":{"en":"Vass, to you: \"You heard the numbers. How much longer is it than the boat?\"","de":"Vass, zu dir: „Du hast die Zahlen gehört. Wie viel länger ist es als das Boot?“","es":"Vass, a ti: “Has oído los números. ¿Cuánto más largo es que el barco?”","fr":"Vass, à toi : « Tu as entendu les chiffres. De combien est-il plus long que le bateau ? »","it":"Vass, a te: «Hai sentito i numeri. Di quanto è più lungo della barca?»"},"opts":[{"en":"Forty metres"},{"en":"Eight metres"},{"en":"Twenty metres"}],"answer":1,"fb":{"en":"twenty metres of animal, twelve metres of boat: eight metres longer. Forty is the depth.","de":"zwanzig Meter Tier, zwölf Meter Boot: acht Meter länger. Vierzig ist die Tiefe.","es":"veinte metros de animal, doce metros de barco: ocho metros más largo. Cuarenta es la profundidad.","fr":"vingt mètres d'animal, douze mètres de bateau : huit mètres de plus. Quarante, c'est la profondeur.","it":"venti metri di animale, dodici metri di barca: otto metri più lungo. Quaranta è la profondità."},"clue":[{"en":"You hear: Vass: \"Contact. Forty metres down, directly under us. It's twenty metres long. It's been under us for ten minutes and it hasn't moved.\" · Tulloch: \"Then it's not hunting. It's waiting.\" · Vass: \"This boat is twelve metres, Tulloch.\"","de":"Du hörst: Vass: „Kontakt. Vierzig Meter tief, direkt unter uns. Es ist zwanzig Meter lang. Es ist seit zehn Minuten unter uns und hat sich nicht bewegt.“ · Tulloch: „Dann jagt es nicht. Es wartet.“ · Vass: „Dieses Boot ist zwölf Meter lang, Tulloch.“","es":"Oyes: Vass: “Contacto. Cuarenta metros abajo, justo debajo de nosotros. Mide veinte metros. Lleva diez minutos debajo y no se ha movido.” · Tulloch: “Entonces no está cazando. Está esperando.” · Vass: “Este barco mide doce metros, Tulloch.”","fr":"Tu entends : Vass : « Contact. Quarante mètres de fond, juste sous nous. Il fait vingt mètres de long. Il est sous nous depuis dix minutes et il n'a pas bougé. » · Tulloch : « Alors il ne chasse pas. Il attend. » · Vass : « Ce bateau fait douze mètres, Tulloch. »","it":"Senti: Vass: «Contatto. Quaranta metri di profondità, proprio sotto di noi. È lungo venti metri. È sotto di noi da dieci minuti e non si è mosso.» · Tulloch: «Allora non sta cacciando. Sta aspettando.» · Vass: «Questa barca è lunga dodici metri, Tulloch.»"},{"en":"Tulloch: \"I know what my boat is.\"","de":"Tulloch: „Ich weiß, wie lang mein Boot ist.“","es":"Tulloch: “Sé lo que mide mi barco.”","fr":"Tulloch : « Je sais ce que fait mon bateau. »","it":"Tulloch: «So quanto è lunga la mia barca.»"}]},"choice2":{"img":"25_choice2_narrows.webp","hot":[74.5,42.0,12.0,16.0],"title":{"en":"THE NARROWS","de":"DIE ENGEN","es":"LOS ESTRECHOS","fr":"LES ÉTROITS","it":"GLI STRETTI"},"story":[{"en":"Tulloch: \"It has two doors. The reef, where it feeds. The caves, where it sleeps. Pick one, sergeant. It's your money.\"","de":"Tulloch: „Es hat zwei Türen. Das Riff, wo es frisst. Die Höhlen, wo es schläft. Wählen Sie eine, Sergeant. Es ist Ihr Geld.“","es":"Tulloch: “Tiene dos puertas. El arrecife, donde come. Las cuevas, donde duerme. Elija una, sargento. Es su dinero.”","fr":"Tulloch : « Il a deux portes. Le récif, où il mange. Les grottes, où il dort. Choisissez, sergent. C'est votre argent. »","it":"Tulloch: «Ha due porte. La scogliera, dove mangia. Le grotte, dove dorme. Ne scelga una, sergente. Sono soldi suoi.»"}],"kind":"choice","routes":[{"name":{"en":"THE SKERRY","de":"DIE SCHÄRE","es":"EL ISLOTE","fr":"LE RÉCIF","it":"LO SCOGLIO"},"desc":{"en":"Follow the broken reef where the seals used to haul out.","de":"Dem zerbrochenen Riff folgen, wo die Robben früher an Land gingen.","es":"Seguir el arrecife roto donde las focas solían salir del agua.","fr":"Suivre le récif brisé où les phoques venaient autrefois se hisser.","it":"Seguire la scogliera rotta dove una volta le foche salivano a riva."},"target":"2.5a","route":"THE SKERRY"},{"name":{"en":"THE CAVES","de":"DIE HÖHLEN","es ubject in a question; the Present Continuous cannot ask about a duration up to now.","de":"HOW LONG + HAVE + Subjekt + BEEN + -ING. In einer Frage steht das Hilfsverb vor dem Subjekt; das Present Continuous kann nicht nach einer Dauer bis jetzt fragen.","es":"HOW LONG + HAVE + sujeto + BEEN + -ING. En una pregunta el auxiliar va delante del sujeto; el Present Continuous no puede preguntar por una duración hasta ahora.","fr":"HOW LONG + HAVE + sujet + BEEN + -ING. Dans une question l'auxiliaire précède le sujet ; le Present Continuous ne peut pas interroger sur une durée jusqu'à maintenant.","it":"HOW LONG + HAVE + soggetto + BEEN + -ING. In una domanda l'ausiliare va prima del soggetto; il Present Continuous non può chiedere di una durata fino a ora."},"clue":[{"en":"You hear: Vass: \"Humboldt squid. Sea of Cortez. It had my wrist for four seconds.\" · Tulloch: \"Twenty-eight years I've had this.\" · You: \"I've got an appendix scar and I'm keeping it to myself.\" · Tulloch, to Vass: \"___ chasing squid, doctor?\"","de":"Du hörst: Vass: „Humboldt-Kalmar. Golf von Kalifornien. Er hatte mein Handgelenk vier Sekunden lang.“ · Tulloch: „Achtundzwanzig Jahre habe ich das hier.“ · Du: „Ich habe eine Blinddarmnarbe und behalte sie für mich.“ · Tulloch, zu Vass: „___ hinter Kalmaren her, Frau Doktor?“","es":"Oyes: Vass: “Calamar de Humboldt. Mar de Cortés. Me tuvo la muñeca cuatro segundos.” · Tulloch: “Veintiocho años llevo con esta.” · Tú: “Yo tengo una cicatriz de apendicitis y me la voy a guardar para mí.” · Tulloch, a Vass: “¿___ persiguiendo calamares, doctora?”","fr":"Tu entends : Vass : « Calmar de Humboldt. Mer de Cortès. Il a tenu mon poignet quatre secondes. » · Tulloch : « Vingt-huit ans que j'ai celle-là. » · Toi : « Moi j'ai une cicatrice d'appendicite et je la garde pour moi. » · Tulloch, à Vass : « ___ après les calmars, docteure ? »","it":"Senti: Vass: «Calamaro di Humboldt. Mare di Cortez. Mi ha tenuto il polso per quattro secondi.» · Tulloch: «Ventotto anni che ho questa.» · Tu: «Io ho una cicatrice da appendicite e me la tengo per me.» · Tulloch, a Vass: «___ dietro ai calamari, dottoressa?»"},{"en":"Vass: \"Nine years.\" · Tulloch: \"Nine years. And you thought you'd seen one.\"","de":"Vass: „Neun Jahre.“ · Tulloch: „Neun Jahre. Und Sie dachten, Sie hätten einen gesehen.“","es":"Vass: “Nueve años.” · Tulloch: “Nueve años. Y creía que había visto uno.”","fr":"Vass : « Neuf ans. » · Tulloch : « Neuf ans. Et vous pensiez en avoir vu un. »","it":"Vass: «Nove anni.» · Tulloch: «Nove anni. E pensava di averne visto uno.»"}]},"2.11":{"img":"36_q11_1998.webp","hot":[75.9,16.5,12.0,16.0],"title":{"en":"THE OSSIAN, 1998","de":"DIE OSSIAN, 1998","es":"EL OSSIAN, 1998","fr":"L'OSSIAN, 1998","it":"L'OSSIAN, 1998"},"story":[{"en":"Tulloch talks to the lamp, not to you. It is the longest anyone in Inverbrae has ever heard him speak.","de":"Tulloch spricht zur Lampe, nicht zu euch. Es ist das Längste, was irgendjemand in Inverbrae ihn je hat sprechen hören.","es":"Tulloch le habla a la lámpara, no a vosotros. Es lo más largo que nadie en Inverbrae le ha oído hablar nunca.","fr":"Tulloch parle à la lampe, pas à vous. C'est le plus longtemps que quiconque à Inverbrae l'ait jamais entendu parler.","it":"Tulloch parla alla lampada, non a voi. È la volta più lunga che qualcuno a Inverbrae lo abbia mai sentito parlare."}],"k":{"en":"CHAPTER 3 · THE WRECK · MONDAY NIGHT","de":"KAPITEL 3 · DAS WRACK · MONTAGNACHT","es":"CAPÍTULO 3 · EL PECIO · LUNES POR LA NOCHE","fr":"CHAPITRE 3 · L'ÉPAVE · LUNDI SOIR","it":"CAPITOLO 3 · IL RELITTO · LUNEDÌ NOTTE"},"kind":"question","next":"2.12","prompt":{"en":"Vass, after a long silence: \"Eleven men went in. How many came out, and how long were they in the water?\"","de":"Vass, nach langem Schweigen: „Elf Männer sind ins Wasser gegangen. Wie viele kamen heraus, und wie lange waren sie im Wasser?“","es":"Vass, tras un largo silencio: “Once hombres cayeron al agua. ¿Cuántos salieron, y cuánto tiempo estuvieron en el agua?”","fr":"Vass, après un long silence : « Onze hommes sont tombés à l'eau. Combien en sont ressortis, et combien de temps sont-ils restés dans l'eau ? »","it":"Vass, dopo un lungo silenzio: «Undici uomini sono finiti in acqua. Quanti ne sono usciti, e quanto tempo sono rimasti in acqua?»"},"opts":[{"en":"Four, after nine hours"},{"en":"Four, after nineteen hours"},{"en":"Seven, after nine hours"}],"answer":0,"fb":{"en":"four out of eleven, found at first light after nine hours. Seven is the number who did not come out.","de":"vier von elf, bei erstem Licht nach neun Stunden gefunden. Sieben ist die Zahl derer, die nicht herauskamen.","es":"cuatro de once, encontrados a primera luz tras nueve horas. Siete es el número de los que no salieron.","fr":"quatre sur onze, retrouvés à la première lueur après neuf heures. Sept est le nombre de ceux qui ne sont pas ressortis.","it":"quattro su undici, trovati alla prima luce dopo nove ore. Sette è il numero di quelli che non sono usciti."},"clue":[{"en":"You hear:","de":"Du hörst:","es":"Oyes:","fr":"Tu entends :","it":"Senti:"},{"en":"Tulloch: \"The Ossian went down on the ninth of March 1998. That's a finished thing. I can say it in the past. Eleven of us. Trawler, out of Inverbrae, running home through the Cauldron at night because the skipper wanted his bed. Something took the net, and then it took the stern, and she went down in four minutes. Eleven of us went in the water. It was March. The water was six degrees.","de":"Tulloch: „Die Ossian ist am neunten März 1998 untergegangen. Das ist eine abgeschlossene Sache. Ich kann es in der Vergangenheit sagen. Elf von uns. Trawler, aus Inverbrae, nachts durch den Kessel nach Hause, weil der Skipper in sein Bett wollte. Etwas nahm das Netz, und dann nahm es das Heck, und sie ging in vier Minuten unter. Elf von uns gingen ins Wasser. Es war März. Das Wasser hatte sechs Grad.","es":"Tulloch: “El Ossian se hundió el nueve de marzo de 1998. Eso es una cosa terminada. Puedo decirlo en pasado. Éramos once. Arrastrero, de Inverbrae, volviendo a casa por el Caldero de noche porque el patrón quería su cama. Algo se llevó la red, y luego se llevó la popa, y se hundió en cuatro minutos. Once caímos al agua. Era marzo. El agua estaba a seis grados.","fr":"Tulloch : « L'Ossian a coulé le neuf mars 1998. C'est une chose terminée. Je peux le dire au passé. Onze d'entre nous. Un chalutier, sorti d'Inverbrae, qui rentrait par le Chaudron de nuit parce que le patron voulait son lit. Quelque chose a pris le filet, puis ça a pris la poupe, et elle a coulé en quatre minutes. Onze d'entre nous sont tombés à l'eau. C'était en mars. L'eau était à six degrés.","it":"Tulloch: «L'Ossian è affondato il nove marzo 1998. Quella è una cosa finita. Posso dirla al passato. Eravamo in undici. Peschereccio, di Inverbrae, che tornava a casa per il Calderone di notte perché lo skipper voleva il suo letto. Qualcosa prese la rete, e poi prese la poppa, e affondò in quattro minuti. Undici di noi finimmo in acqua. Era marzo. L'acqua era a sei gradi."},{"en":"\"It didn't come for us all at once. It came every hour or so, like it was choosing. You'd hear a man shout and then you'd not hear him. We held on to each other. We held on to a hatch cover. Nine hours we were in that water. Nine. The lifeboat found four of us at first light. Four out of eleven.","de":"„Es kam nicht auf einmal zu uns allen. Es kam etwa jede Stunde, als wähle es aus. Man hörte einen Mann schreien, und dann hörte man ihn nicht mehr. Wir hielten uns aneinander fest. Wir hielten uns an einem Lukendeckel fest. Neun Stunden waren wir in diesem Wasser. Neun. Das Rettungsboot fand vier von uns bei erstem Licht. Vier von elf.","es":"“No vino a por todos a la vez. Venía cada hora más o menos, como si eligiera. Oías gritar a un hombre y luego ya no lo oías. Nos agarrábamos unos a otros. Nos agarrábamos a una tapa de escotilla. Nueve horas estuvimos en esa agua. Nueve. El bote salvavidas encontró a cuatro a primera luz. Cuatro de once.","fr":"« Ça n'est pas venu nous chercher tous d'un coup. Ça venait toutes les heures environ, comme si ça choisissait. On entendait un homme crier et puis on ne l'entendait plus. On s'accrochait les uns aux autres. On s'accrochait à un panneau de cale. Neuf heures dans cette eau. Neuf. Le canot de sauvetage en a trouvé quatre à la première lueur. Quatre sur onze.","it":"«Non venne a prenderci tutti insieme. Veniva più o meno ogni ora, come se scegliesse. Sentivi un uomo gridare e poi non lo sentivi più. Ci tenevamo l'uno all'altro. Ci tenevamo a un boccaporto. Nove ore siamo stati in quell'acqua. Nove. La scialuppa ne trovò quattro alla prima luce. Quattro su undici."},{"en":"\"I've never told the papers that. I've never told the Provost. I've been telling it to the sea for twenty-eight years, and the sea has never once answered.","de":"„Das habe ich den Zeitungen nie erzählt. Dem Bürgermeister habe ich es nie erzählt. Ich erzähle es seit achtundzwanzig Jahren dem Meer, und das Meer hat kein einziges Mal geantwortet.","es":"“Nunca se lo he contado a los periódicos. Nunca se lo he contado al alcalde. Llevo veintiocho años contándoselo al mar, y el mar no me ha contestado ni una vez.","fr":"« Je n'ai jamais raconté ça aux journaux. Je ne l'ai jamais raconté au maire. Ça fait vingt-huit ans que je le raconte à la mer, et la mer n'a jamais répondu une seule fois.","it":"«Questo ai giornali non l'ho mai detto. Al sindaco non l'ho mai detto. Sono ventotto anni che lo racconto al mare, e il mare non ha risposto neanche una volta."},{"en":"\"That's why I'll not rush it for ten thousand, sergeant. I've been waiting a long time. I can wait a night.\"","de":"„Deshalb überstürze ich nichts für zehntausend, Sergeant. Ich warte seit langer Zeit. Ich kann eine Nacht warten.“","es":"“Por eso no voy a darme prisa por diez mil, sargento. Llevo mucho tiempo esperando. Puedo esperar una noche.”","fr":"« C'est pour ça que je ne vais pas me presser pour dix mille, sergent. J'attends depuis longtemps. Je peux attendre une nuit. »","it":"«È per questo che non vado di fretta per diecimila, sergente. Aspetto da molto tempo. Posso aspettare una notte.»"}]},"2.12":{"img":"37_q12_secondbarrel.webp","hot":[82.0,61.0,12.0,16.0],"title":{"en":"THE SECOND BARREL","de":"DIE ZWEITE TONNE","es":"EL SEGUNDO BIDÓN","fr":"LE DEUXIÈME BARIL","it":"IL SECONDO BIDONE"},"story":[{"en":"It hits the boat in the middle of the third verse. The whole Kittiwake lifts a foot out of the water and drops. The lamp goes over.","de":"Es trifft das Boot mitten in der dritten Strophe. Die ganze Kittiwake hebt sich einen Fuß aus dem Wasser und fällt zurück. Die Lampe kippt um.","es":"Golpea el barco en mitad de la tercera estrofa. El Kittiwake entero se levanta un palmo del agua y cae. La lámpara se vuelca.","fr":"Ça frappe le bateau au milieu du troisième couplet. Le Kittiwake tout entier se soulève d'un pied hors de l'eau et retombe. La lampe bascule.","it":"Colpisce la barca a metà della terza strofa. Tutto il Kittiwake si solleva di un piede dall'acqua e ricade. La lampada si rovescia."},{"en":"A black arm comes across the stern rail, feeling, and Tulloch is at the harpoon gun before the lamp has stopped rolling.","de":"Ein schwarzer Arm kommt über die Heckreling, tastend, und Tulloch ist an der Harpunenkanone, bevor die Lampe aufgehört hat zu rollen.","es":"Un brazo negro pasa por encima de la barandilla de popa, palpando, y Tulloch está en el arpón antes de que la lámpara haya dejado de rodar.","fr":"Un bras noir passe par-dessus le bastingage arrière, en tâtonnant, et Tulloch est au canon à harpon avant que la lampe ait fini de rouler.","it":"Un braccio nero passa sopra la battagliola di poppa, tastando, e Tulloch è al fucile ad arpione prima che la lampada abbia smesso di rotolare."}],"k":{"en":"CHAPTER 3 · THE WRECK · MONDAY NIGHT","de":"KAPITEL 3 · DAS WRACK · MONTAGNACHT","es":"CAPÍTULO 3 · EL PECIO · LUNES POR LA NOCHE","fr":"CHAPITRE 3 lloch: “¡Cabo! ¡Bidón! ¡Ya!” El segundo bidón cae por la borda. El cabo se va soltando y el brazo se va con él.","fr":"Tu entends : Tulloch : « Ligne ! Baril ! Maintenant ! » Le deuxième baril passe par-dessus bord. La ligne se déroule et le bras part avec elle.","it":"Senti: Tulloch: «Cima! Bidone! Subito!» Il secondo bidone va fuori bordo. La cima si svolge e il braccio se ne va con lei."}],"relic":true},"2.13":{"img":"38_q13_radio.webp","hot":[79.5,30.5,12.0,16.0],"title":{"en":"THE RADIO","de":"DAS FUNKGERÄT","es":"LA RADIO","fr":"LA RADIO","it":"LA RADIO"},"story":[{"en":"Two barrels on it, the engine coughing, a gale possible at any time and the shore fifteen miles away.","de":"Zwei Tonnen darauf, der Motor hustet, jederzeit möglicher Sturm und die Küste fünfzehn Meilen entfernt.","es":"Dos bidones puestos, el motor tosiendo, un temporal posible en cualquier momento y la costa a quince millas.","fr":"Deux barils dessus, le moteur qui tousse, un coup de vent possible à tout moment et la côte à quinze milles.","it":"Due bidoni addosso, il motore che tossisce, una burrasca possibile da un momento all'altro e la costa a quindici miglia."},{"en":"You go into the wheelhouse and pick up the VHF to call the coastguard for a bigger boat, and Tulloch comes in behind you and takes the handset out of your hand.","de":"Du gehst ins Steuerhaus und nimmst das UKW-Funkgerät, um die Küstenwache um ein größeres Boot zu bitten, und Tulloch kommt hinter dir herein und nimmt dir das Mikrofon aus der Hand.","es":"Entras en el puente y coges el VHF para llamar a salvamento y pedir un barco más grande, y Tulloch entra detrás de ti y te quita el micrófono de la mano.","fr":"Tu entres dans la timonerie et tu prends la VHF pour appeler les gardes-côtes et demander un plus gros bateau, et Tulloch entre derrière toi et te prend le combiné des mains.","it":"Entri in timoneria e prendi il VHF per chiamare la guardia costiera e chiedere una barca più grande, e Tulloch entra dietro di te e ti toglie il microfono di mano."}],"k":{"en":"CHAPTER 3 · THE WRECK · MONDAY NIGHT","de":"KAPITEL 3 · DAS WRACK · MONTAGNACHT","es":"CAPÍTULO 3 · EL PECIO · LUNES POR LA NOCHE","fr":"CHAPITRE 3 · L'ÉPAVE · LUNDI SOIR","it":"CAPITOLO 3 · IL RELITTO · LUNEDÌ NOTTE"},"kind":"question","next":"2.14","prompt":{"en":"You: \"This is the first time I ___ a boat this small this far out, and I'm calling it in.\"","de":"Du: „Das ist das erste Mal, dass ich in einem so kleinen Boot so weit draußen ___, und ich melde es.“","es":"Tú: “Es la primera vez que ___ en un barco tan pequeño tan lejos de la costa, y voy a dar aviso.”","fr":"Toi : « C'est la première fois que je ___ sur un bateau aussi petit aussi loin au large, et je le signale. »","it":"Tu: «È la prima volta che ___ su una barca così piccola così al largo, e lo segnalo.»"},"opts":[{"en":"have being on"},{"en":"was been on"},{"en":"have been on"}],"answer":2,"fb":{"en":"IT'S THE FIRST TIME takes the Present Perfect: HAVE BEEN. The Present Continuous cannot follow THE FIRST TIME; WAS never takes BEEN.","de":"IT'S THE FIRST TIME nimmt das Present Perfect: HAVE BEEN. Das Present Continuous kann nicht nach THE FIRST TIME stehen; WAS nimmt nie BEEN.","es":"IT'S THE FIRST TIME lleva Present Perfect: HAVE BEEN. El Present Continuous no puede ir detrás de THE FIRST TIME; WAS nunca lleva BEEN.","fr":"IT'S THE FIRST TIME prend le Present Perfect : HAVE BEEN. Le Present Continuous ne peut pas suivre THE FIRST TIME ; WAS ne prend jamais BEEN.","it":"IT'S THE FIRST TIME prende il Present Perfect: HAVE BEEN. Il Present Continuous non può seguire THE FIRST TIME; WAS non prende mai BEEN."},"clue":[{"en":"You hear: You: \"This is the first time I ___ a boat this small this far out, and I'm calling it in.\" · Tulloch: \"You've had your radio, sergeant.\" He smashes the handset on the edge of the chart table. Twice.","de":"Du hörst: Du: „Das ist das erste Mal, dass ich in einem so kleinen Boot so weit draußen ___, und ich melde es.“ · Tulloch: „Sie hatten Ihr Funkgerät, Sergeant.“ Er schlägt das Mikrofon auf die Kante des Kartentischs. Zweimal.","es":"Oyes: Tú: “Es la primera vez que ___ en un barco tan pequeño tan lejos de la costa, y voy a dar aviso.” · Tulloch: “Ya ha tenido su radio, sargento.” Estrella el micrófono contra el canto de la mesa de cartas. Dos veces.","fr":"Tu entends : Toi : « C'est la première fois que je ___ sur un bateau aussi petit aussi loin au large, et je le signale. » · Tulloch : « Vous avez eu votre radio, sergent. » Il fracasse le combiné sur le bord de la table à cartes. Deux fois.","it":"Senti: Tu: «È la prima volta che ___ su una barca così piccola così al largo, e lo segnalo.» · Tulloch: «La sua radio l'ha avuta, sergente.» Sbatte il microfono sul bordo del tavolo da carteggio. Due volte."},{"en":"Tulloch: \"Now you've had it.\" · You: \"You've just cut us off from the shore.\" · Tulloch: \"The shore's been no use to me for twenty-eight years.\"","de":"Tulloch: „Jetzt hatten Sie es.“ · Du: „Sie haben uns gerade von der Küste abgeschnitten.“ · Tulloch: „Die Küste hat mir seit achtundzwanzig Jahren nichts genützt.“","es":"Tulloch: “Ahora ya la ha tenido.” · Tú: “Acaba de dejarnos incomunicados de la costa.” · Tulloch: “La costa no me ha servido de nada en veintiocho años.”","fr":"Tulloch : « Maintenant vous l'avez eue. » · Toi : « Vous venez de nous couper de la côte. » · Tulloch : « La côte ne m'a servi à rien depuis vingt-huit ans. »","it":"Tulloch: «Adesso l'ha avuta.» · Tu: «Ci ha appena tagliato fuori dalla costa.» · Tulloch: «La costa non mi è servita a niente per ventotto anni.»"}]},"2.14":{"img":"39_q14_engine.webp","hot":[82.0,66.0,12.0,16.0],"title":{"en":"THE NIGHT","de":"DIE NACHT","es":"LA NOCHE","fr":"LA NUIT","it":"LA NOTTE"},"story":[{"en":"Nobody sleeps. Twice in the night the barrels come up close to the boat and once, at three, something runs along the keel from bow to stern like a hand along a wall. At four, another arm appears.","de":"Niemand schläft.
