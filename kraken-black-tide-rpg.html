аллох: «Да. Оно так умеет.»","zh":"你听到：瓦丝：“那根缆是钢的。它___那根缆。它不是咬断的。它是切断的。”· 塔洛克：“是啊。它就会这样。”"}]},"2.6a":{"img":"27_q6a_net.webp","hot":[77.0,68.0,12.0,16.0],"title":{"en":"THE NET","ar":"الشبكة","de":"DAS NETZ","es":"LA RED","fr":"LE FILET","it":"LA RETE","ja":"網","pt":"A REDE","ru":"СЕТЬ","zh":"渔网"},"story":[{"en":"Half a creel net comes up on the winch, cut clean along one edge as if with scissors. Tulloch turns it over in his hands. It is a Lennox net; he knows the knots.","ar":"يصعد نصف شبكة قفص على الرافعة، مقطوعًا بدقّة على طول إحدى حوافه كأنه بمقصّ. يقلّبه تولوخ بين يديه. إنها شبكة لينوكس؛ يعرف العُقد.","de":"Ein halbes Reusennetz kommt an der Winde hoch, an einer Kante glatt durchtrennt wie mit einer Schere. Tulloch dreht es in den Händen. Es ist ein Lennox-Netz; er kennt die Knoten.","es":"Media red de nasas sube por el torno, cortada limpiamente por un lado como con tijeras. Tulloch le da vueltas en las manos. Es una red de los Lennox; conoce los nudos.","fr":"La moitié d'un filet à casiers remonte au treuil, coupée net sur un bord comme aux ciseaux. Tulloch le retourne dans ses mains. C'est un filet des Lennox ; il en connaît les nœuds.","it":"Mezza rete da nasse sale al verricello, tagliata netta su un lato come con le forbici. Tulloch la rigira tra le mani. È una rete dei Lennox; conosce i nodi.","ja":"巻き上げ機で、かごの網が半分だけ上がってきます。片方の縁がはさみで切ったようにきれいに切れています。タロックはそれを手の中で裏返します。レノックスの網です。結び目でわかるのです。","pt":"Meia rede de covos sobe no guincho, cortada a direito num dos lados como à tesoura. Tulloch vira-a nas mãos. É uma rede dos Lennox; conhece os nós.","ru":"Половина сети от ловушки поднимается на лебёдке, ровно обрезанная по краю, будто ножницами. Таллох вертит её в руках. Это сеть Ленноксов; он знает узлы.","zh":"绞盘拉上来半张蟹笼网，一边切得整整齐齐，像是用剪刀剪的。塔洛克拿在手里翻看。是伦诺克斯家的网；他认得那些结。"}],"k":{"en":"CHAPTER 2 · THE SKERRY · MONDAY","ar":"الفصل 2 · الصخرة البحرية · الاثنين","de":"KAPITEL 2 · DIE SCHÄRE · MONTAG","es":"CAPÍTULO 2 · EL ISLOTE · LUNES","fr":"CHAPITRE 2 · LE RÉCIF · LUNDI","it":"CAPITOLO 2 · LO SCOGLIO · LUNEDÌ","ja":"第2章 · 岩礁 · 月曜日","pt":"CAPÍTULO 2 · O ILHÉU · SEGUNDA-FEIRA","ru":"ГЛАВА 2 · ШХЕРА · ПОНЕДЕЛЬНИК","zh":"第2章 · 礁石 · 星期一"},"kind":"question","next":"2.7a","prompt":{"en":"Tulloch: \"___ the rest of it in yet?\"","ar":"تولوخ: \"___ بقيّتها بعد؟\"","de":"Tulloch: „___ den Rest schon eingeholt?“","es":"Tulloch: “¿___ el resto todavía?”","fr":"Tulloch : « ___ déjà remonté le reste ? »","it":"Tulloch: «___ il resto?»","ja":"タロック：「残りはもう___？」","pt":"Tulloch: «___ o resto?»","ru":"Таллох: «___ остальное?»","zh":"塔洛克：“剩下的你___了吗？”"},"opts":[{"en":"Have you hauled"},{"en":"Did you hauled in"},{"en":"Have you hauling"}],"answer":0,"fb":{"en":"YET goes with a Present Perfect question: HAVE + subject + PAST PARTICIPLE. DID takes the base verb; HAVE never takes -ING on its own.","ar":"YET تأتي مع سؤال في Present Perfect: HAVE + الفاعل + PAST PARTICIPLE. تأخذ DID الفعل في صيغته الأصلية؛ ولا تأخذ HAVE أبدًا -ING وحدها.","de":"YET gehört zu einer Frage im Present Perfect: HAVE + Subjekt + PAST PARTICIPLE. DID nimmt die Grundform; HAVE nimmt nie allein -ING.","es":"YET acompaña a una pregunta en Present Perfect: HAVE + sujeto + PAST PARTICIPLE. DID lleva el verbo en su forma base; HAVE nunca lleva -ING por sí solo.","fr":"YET accompagne une question au Present Perfect : HAVE + sujet + PAST PARTICIPLE. DID prend la forme de base ; HAVE ne prend jamais -ING tout seul.","it":"YET accompagna una domanda al Present Perfect: HAVE + soggetto + PAST PARTICIPLE. DID prende la forma base; HAVE non prende mai -ING da solo.","ja":"YET は Present Perfect の疑問文に使います：HAVE + 主語 + PAST PARTICIPLE。DID は動詞の原形を取り、HAVE が単独で -ING を取ることは決してありません。","pt":"YET acompanha uma pergunta no Present Perfect: HAVE + sujeito + PAST PARTICIPLE. DID leva a forma base; HAVE nunca leva -ING sozinho.","ru":"YET идёт с вопросом в Present Perfect: HAVE + подлежащее + PAST PARTICIPLE. После DID идёт начальная форма; HAVE никогда не берёт -ING само по себе.","zh":"YET 用于 Present Perfect 疑问句：HAVE + 主语 + PAST PARTICIPLE。DID 后面接动词原形；HAVE 从不单独接 -ING。"},"fbRight":{"en":"You do not lean over the rail.","ar":"لا تنحنين فوق الحافة.","de":"Du beugst dich nicht über die Reling.","es":"No te asomas por la borda.","fr":"Tu ne te penches pas par-dessus le bastingage.","it":"Non ti sporgi dalla battagliola.","ja":"あなたは舷から身を乗り出しません。","pt":"Não te debruças pela amurada.","ru":"Ты не перегибаешься через борт.","zh":"你没有探身到船舷外。"},"fbWrong":{"en":"Tulloch pulls you back by the collar.","ar":"يسحبكِ تولوخ إلى الخلف من ياقتكِ.","de":"Tulloch zieht dich am Kragen zurück.","es":"Tulloch te echa hacia atrás tirándote del cuello.","fr":"Tulloch te tire en arrière par le col.","it":"Tulloch ti tira indietro per il colletto.","ja":"タロックがあなたの襟をつかんで引き戻します。","pt":"Tulloch puxa-te para trás pela gola.","ru":"Таллох оттаскивает тебя назад за воротник.","zh":"塔洛克抓着你的衣领把你拽了回来。"},"clue":[{"en":"You hear: Tulloch: \"___ the rest of it in yet?\" · You: \"No.\" · Tulloch: \"Then leave it. It's been down there since Wednesday and it wants us to lean over the rail for it.\"","ar":"تسمعين: تولوخ: \"___ بقيّتها بعد؟\" · أنتِ: \"لا.\" · تولوخ: \"إذن اتركيها. إنها هناك في الأسفل منذ الأربعاء، وهو يريدنا أن ننحني فوق الحافة من أجلها.\"","de":"Du hörst: Tulloch: „___ den Rest schon eingeholt?“ · Du: „Nein.“ · Tulloch: „Dann lassen Sie es. Es liegt seit Mittwoch da unten und will, dass wir uns dafür über die Reling beugen.“","es":"Oyes: Tulloch: “¿___ el resto todavía?” · Tú: “No.” · Tulloch: “Pues déjelo. Lleva ahí abajo desde el miércoles y quiere que nos asomemos por la borda a por ello.”","fr":"Tu entends : Tulloch : « ___ déjà remonté le reste ? » · Toi : « Non. » · Tulloch : « Alors laissez-le. Il est là-dessous depuis mercredi et il veut qu'on se penche par-dessus le bastingage pour aller le chercher. »","it":"Senti: Tulloch: «___ il resto?» · Tu: «No.» · Tulloch: «Allora lo lasci. È là sotto da mercoledì e vuole che ci sporgiamo oltre la battagliola per andarlo a prendere.»","ja":"聞こえる：タロック：「残りはもう___？」· あなた：「いいえ」· タロック：「なら放っておけ。水曜日からあそこにあるんだ。あいつは、俺たちがそのために舷から身を乗り出すのを待っている」","pt":"Ouves: Tulloch: «___ o resto?» · Tu: «Não.» · Tulloch: «Então deixe estar. Está lá em baixo desde quarta-feira e quer que nos debrucemos por cima da amurada para ir buscá-la.»","ru":"Ты слышишь: Таллох: «___ остальное?» · Ты: «Нет.» · Таллох: «Тогда оставьте. Она там внизу со среды, а оно хочет, чтобы мы ради неё перегнулись через борт.»","zh":"你听到：塔洛克：“剩下的你___了吗？”· 你：“没有。”· 塔洛克：“那就别管了。它从星期三起就在下面，它就是想让我们为了它探身到船舷外。”"}]},"2.7a":{"img":"28_q7a_sealrock.webp","hot":[79.0,30.0,12.0,16.0],"title":{"en":"THE SEAL ROCK","ar":"صخرة الفقمات","de":"DER ROBBENFELSEN","es":"LA ROCA DE LAS FOCAS","fr":"LE ROCHER AUX PHOQUES","it":"LO SCOGLIO DELLE FOCHE","ja":"アザラシ岩","pt":"A ROCHA DAS FOCAS","ru":"ТЮЛЕНИЙ КАМЕНЬ","zh":"海豹岩"},"story":[{"en":"The seal rock at the end of the reef. In July, Tulloch says, there were sixty seals on it. Now there is one, an old bull on the highest point, and it does not look at the boat.","ar":"صخرة الفقمات عند طرف الشِّعب. في يوليو، يقول تولوخ، كان عليها ستون فقمة. الآن هناك واحدة، ذكر عجوز على أعلى نقطة، ولا ينظر إلى القارب.","de":"Der Robbenfelsen am Ende des Riffs. Im Juli, sagt Tulloch, waren sechzig Robben darauf. Jetzt ist nur noch eine da, ein alter Bulle auf dem höchsten Punkt, und er sieht das Boot nicht an.","es":"La roca de las focas al final del arrecife. En julio, dice Tulloch, había sesenta focas encima. Ahora hay una, un macho viejo en el punto más alto, y no mira al barco.","fr":"Le rocher aux phoques au bout du récif. En juillet, dit Tulloch, il y avait soixante phoques dessus. Maintenant il y en a un, un vieux mâle sur le point le plus haut, et il ne regarde pas le bateau.","it":"Lo scoglio delle foche in fondo alla scogliera. A luglio, dice Tulloch, c'erano sessanta foche sopra. Adesso ce n'è una, un vecchio maschio sul punto più alto, e non guarda la barca.","ja":"岩礁の端にあるアザラシ岩。七月には六十頭のアザラシがいたとタロックは言います。今は一頭だけ、いちばん高いところに年老いた雄がいて、船を見ようとしません。","pt":"A rocha das focas no fim do recife. Em julho, diz Tulloch, havia sessenta focas em cima. Agora há uma, um macho velho no ponto mais alto, e não olha para o barco.","ru":"Тюлений камень в конце рифа. В июле, говорит Таллох, на нём было шестьдесят тюленей. Теперь один, старый самец на самой высокой точке, и он не смотрит на лодку.","zh":"礁盘尽头的海豹岩。塔洛克说，七月时上面有六十只海豹。现在只剩一只，一头老公海豹待在最高处，它不看船。"},{"en":"It looks at the water.","ar":"إنه ينظر إلى الماء.","de":"Er sieht das Wasser an.","es":"Mira al agua.","fr":"Il regarde l'eau.","it":"Guarda l'acqua.","ja":"水を見ています。","pt":"Olha para a água.","ru":"Он смотрит на воду.","zh":"它看着水。"}],"k":{"en":"CHAPTER 2 · THE SKERRY · MONDAY","ar":"الفصل 2 · الصخرة البحرية · الاثنين","de":"KAPITEL 2 · DIE SCHÄRE · MONTAG","es":"CAPÍTULO 2 · EL ISLOTE · LUNES","fr":"CHAPITRE 2 · LE RÉCIF · LUNDI","it":"CAPITOLO 2 · LO SCOGLIO · LUNEDÌ","ja":"第2章 · 岩礁 · 月曜日","pt":"CAPÍTULO 2 · O ILHÉU · SEGUNDA-FEIRA","ru":"ГЛАВА 2 · ШХЕРА · ПОНЕДЕЛЬНИК","zh":"第2章 · 礁石 · 星期一"},"kind":"question","next":"2.8a","prompt":{"en":"Vass: \"So why have the seals gone, according to him?\"","ar":"فاس: \"إذن لماذا رحلت الفقمات، بحسب ما يقول؟\"","de":"Vass: „Und warum sind die Robben weg, seiner Meinung nach?“","es":"Vass: “¿Y por qué se han ido las focas, según él?”","fr":"Vass : « Et pourquoi les phoques sont-ils partis, d'après lui ? »","it":"Vass: «E perché se ne sono andate le foche, secondo lui?»","ja":"ヴァス：「それで、彼によればアザラシはなぜいなくなったの？」","pt":"Vass: «E porque é que as focas se foram embora, segundo ele?»","ru":"Васс: «И почему же тюлени ушли, по его словам?»","zh":"瓦丝：“那照他的说法，海豹为什么走了？”"},"opts":[{"en":"The regatta boats have scared them away"},{"en":"Something has been hunting them"},{"en":"The bad weather has driven them off"}],"answer":1,"fb":{"en":"Tulloch rules out shooting, sickness, weather and boats, and names one thing: something coming up on the rock at night.","ar":"يستبعد تولوخ إطلاق النار والمرض والطقس والقوارب، ويسمّي شيئًا واحدًا: شيء يصعد على الصخرة ليلًا.","de":"Tulloch schließt Abschuss, Krankheit, Wetter und Boote aus und nennt eine Sache: etwas, das nachts auf den Felsen kommt.","es":"Tulloch descarta los disparos, la enfermedad, el tiempo y los barcos, y señala una sola cosa: algo que sube a la roca por la noche.","fr":"Tulloch écarte les tirs, la maladie, le temps et les bateaux, et désigne une seule chose : quelque chose qui monte sur le rocher la nuit.","it":"Tulloch esclude gli spari, la malattia, il tempo e le barche, e indica una cosa sola: qualcosa che di notte sale sullo scoglio.","ja":"タロックは銃撃、病気、天候、船を否定し、一つのことを挙げます。夜にあの岩に上がってくる何かです。","pt":"Tulloch exclui os tiros, a doença, o tempo e os barcos, e aponta uma coisa só: alguma coisa que sobe à rocha à noite.","ru":"Таллох исключает отстрел, болезнь, погоду и лодки и называет одно: нечто, что ночью выбирается на камень.","zh":"塔洛克排除了枪击、疾病、天气和船只，只说出一个原因：有东西夜里爬上那块岩石。"},"fbRight":{"en":"The old bull slides off the rock and does not come up.","ar":"ينزلق الذكر العجوز عن الصخرة ولا يطفو من جديد.","de":"Der alte Bulle gleitet vom Felsen und taucht nicht wieder auf.","es":"El viejo macho se desliza de la roca y no vuelve a salir.","fr":"Le vieux mâle glisse du rocher et ne remonte pas.","it":"Il vecchio maschio scivola giù dallo scoglio e non riemerge.","ja":"年老いた雄は岩から滑り落ち、浮かんできません。","pt":"O velho macho escorrega da rocha e não volta a aparecer.","ru":"Старый самец соскальзывает со скалы и больше не показывается.","zh":"老公海豹从岩石上滑下去，再没有浮上来。"},"fbWrong":{"en":"Tulloch: \"You've not been listening. He has.\"","ar":"تولوخ: \"لم تكوني تصغين. أما هو فكان يصغي.\"","de":"Tulloch: „Sie haben nicht zugehört. Er schon.“","es":"Tulloch: “Usted no ha estado escuchando. Él sí.”","fr":"Tulloch : « Vous n'avez pas écouté. Lui, si. »","it":"Tulloch: «Lei non ha ascoltato. Lui sì.»","ja":"タロック：「あんたは聞いていなかった。あいつは聞いていた」","pt":"Tulloch: «A senhora não esteve a ouvir. Ele esteve.»","ru":"Таллох: «Вы не слушали. А он слушал.»","zh":"塔洛克：“你一直没在听。它在听。”"},"clue":[{"en":"You hear: Tulloch: \"They've not been shot and they've not been sick. Seals don't leave a rock in August, not for weather, not for boats. Something has been coming up on that rock at night.\"","ar":"تسمعين: تولوخ: \"لم يُطلق عليها النار ولم تمرض. الفقمات لا تترك صخرة في أغسطس، لا بسبب الطقس ولا بسبب القوارب. شيء ما يصعد على تلك الصخرة ليلًا.\"","de":"Du hörst: Tulloch: „Sie sind nicht abgeschossen worden und sie waren nicht krank. Robben verlassen im August keinen Felsen, nicht wegen Wetter, nicht wegen Booten. Irgendetwas kommt nachts immer wieder auf diesen Felsen.“","es":"Oyes: Tulloch: “No les han disparado y no han estado enfermas. Las focas no dejan una roca en agosto, ni por el tiempo ni por los barcos. Algo lleva subiendo a esa roca por la noche.”","fr":"Tu entends : Tulloch : « On ne leur a pas tiré dessus et ils n'ont pas été malades. Les phoques ne quittent pas un rocher en août, ni pour le temps, ni pour les bateaux. Quelque chose monte sur ce rocher la nuit. »","it":"Senti: Tulloch: «Nessuno gli ha sparato e non si sono ammalate. Le foche non lasciano uno scoglio ad agosto, né per il tempo né per le barche. Qualcosa sale su quello scoglio di notte.»","ja":"聞こえる：タロック：「撃たれてもいないし、病気でもない。アザラシは八月に岩を離れたりしない。天気のせいでも、船のせいでもな。何かが夜ごとあの岩に上がってきているんだ」","pt":"Ouves: Tulloch: «Não levaram tiros e não estiveram doentes. As focas não deixam uma rocha em agosto, nem por causa do tempo, nem por causa dos barcos. Alguma coisa anda a subir àquela rocha à noite.»","ru":"Ты слышишь: Таллох: «Их не отстреливали и они не болели. Тюлени не уходят с камня в августе ни из-за погоды, ни из-за лодок. Что-то ночами выбирается на этот камень.»","zh":"你听到：塔洛克：“它们没被枪打，也没生病。海豹八月份不会离开一块岩石，天气不会让它们走，船也不会。有东西一直在夜里爬上那块岩石。”"}]},"2.8a":{"img":"29_q8a_hull.webp","hot":[79.0,68.0,12.0,16.0],"title":{"en":"THE HULL","ar":"الهيكل","de":"DER RUMPF","es":"EL CASCO","fr":"LA COQUE","it":"LO SCAFO","ja":"船体","pt":"O CASCO","ru":"КОРПУС","zh":"船壳"},"story":[{"en":"The boat stops moving the way a boat moves and starts moving the way a cradle moves. Something is under it.","ar":"يكفّ القارب عن التحرّك كما يتحرّك القارب ويبدأ يتحرّك كما يتحرّك المهد. شيء ما تحته.","de":"Das Boot hört auf, sich zu bewegen, wie ein Boot sich bewegt, und beginnt, sich zu bewegen, wie eine Wiege sich bewegt. Etwas ist darunter.","es":"El barco deja de moverse como se mueve un barco y empieza a moverse como se mueve una cuna. Hay algo debajo.","fr":"Le bateau cesse de bouger comme bouge un bateau et commence à bouger comme bouge un berceau. Il y a quelque chose dessous.","it":"La barca smette di muoversi come si muove una barca e comincia a muoversi come si muove una culla. C'è qualcosa sotto.","ja":"船は船らしい揺れ方をやめ、揺りかごのように揺れ始めます。何かが下にいます。","pt":"O barco deixa de se mexer como se mexe um barco e começa a mexer-se como se mexe um berço. Está alguma coisa por baixo.","ru":"Лодка перестаёт двигаться так, как двигается лодка, и начинает двигаться так, как движется колыбель. Что-то есть под ней.","zh":"船不再像船那样摇晃，而开始像摇篮那样摇晃。下面有东西。"},{"en":"Tulloch lies flat on the deck with his ear to the planks and his hand on the harpoon gun, and stays there.","ar":"يستلقي تولوخ مسطّحًا على السطح وأذنه على الألواح ويده على مدفع الحربة، ويبقى هكذا.","de":"Tulloch legt sich flach auf das Deck, das Ohr an den Planken und die Hand an der Harpunenkanone, und bleibt so liegen.","es":"Tulloch se tumba boca abajo en la cubierta con la oreja pegada a las tablas y la mano en el arpón, y ahí se queda.","fr":"Tulloch s'allonge à plat sur le pont, l'oreille contre les bordages et la main sur le canon à harpon, et il reste là.","it":"Tulloch si stende sul ponte con l'orecchio contro le tavole e la mano sul fucile ad arpione, e resta lì.","ja":"タロックは甲板に腹ばいになり、耳を板に当て、手を銛打ち砲に置いたまま、じっとしています。","pt":"Tulloch deita-se de barriga para baixo no convés com o ouvido nas tábuas e a mão no arpão, e fica ali.","ru":"Таллох ложится плашмя на палубу, ухом к доскам и рукой на гарпунной пушке, и так и остаётся.","zh":"塔洛克平趴在甲板上，耳朵贴着船板，手放在鱼叉炮上，一动不动。"}],"k":{"en":"CHAPTER 2 · THE SKERRY · MONDAY","ar":"الفصل 2 · الصخرة البحرية · الاثنين","de":"KAPITEL 2 · DIE SCHÄRE · MONTAG","es":"CAPÍTULO 2 · EL ISLOTE · LUNES","fr":"CHAPITRE 2 · LE RÉCIF · LUNDI","it":"CAPITOLO 2 · LO SCOGLIO · LUNEDÌ","ja":"第2章 · 岩礁 · 月曜日","pt":"CAPÍTULO 2 · O ILHÉU · SEGUNDA-FEIRA","ru":"ГЛАВА 2 · ШХЕРА · ПОНЕДЕЛЬНИК","zh":"第2章 · 礁石 · 星期一"},"kind":"question","next":"2.9","prompt":{"en":"Tulloch: \"It ___ the hull for twenty minutes. Feeling it. Learning it. When it's learned it, it'll come up.\"","ar":"تولوخ: \"إنه ___ الهيكل منذ عشرين دقيقة. يتحسّسه. يتعلّمه. حين يتعلّمه، سيصعد.\"","de":"Tulloch: „Es ___ den Rumpf seit zwanzig Minuten. Betastet ihn. Lernt ihn. Wenn es ihn gelernt hat, kommt es hoch.“","es":"Tulloch: “___ el casco veinte minutos. Palpándolo. Aprendiéndoselo. Cuando se lo haya aprendido, subirá.”","fr":"Tulloch : « Il ___ la coque depuis vingt minutes. Il la tâte. Il l'apprend. Quand il l'aura apprise, il montera. »","it":"Tulloch: «___ lo scafo da venti minuti. Lo tasta. Lo impara. Quando lo avrà imparato, salirà.»","ja":"タロック：「あいつは二十分、船体を___。探っている。覚えている。覚えたら、上がってくる」","pt":"Tulloch: «___ o casco há vinte minutos. A apalpá-lo. A aprendê-lo. Quando o tiver aprendido, sobe.»","ru":"Таллох: «Оно ___ корпус уже двадцать минут. Ощупывает. Изучает. Когда изучит, поднимется.»","zh":"塔洛克：“它___船壳二十分钟了。在摸它。在熟悉它。等它熟悉了，就会上来。”"},"opts":[{"en":"has touched since"},{"en":"is touching for"},{"en":"has been touching"}],"answer":2,"fb":{"en":"an activity running FOR a period up to now takes HAS + BEEN + -ING. SINCE takes a point in time, not twenty minutes; the Present Continuous cannot carry FOR.","ar":"النشاط المستمر FOR مدة حتى الآن يأخذ HAS + BEEN + -ING. تأخذ SINCE نقطة زمنية، لا عشرين دقيقة؛ وPresent Continuous لا يمكنه أن يحمل FOR.","de":"eine Tätigkeit, die FOR einen Zeitraum bis jetzt läuft, nimmt HAS + BEEN + -ING. SINCE nimmt einen Zeitpunkt, nicht zwanzig Minuten; das Present Continuous kann FOR nicht tragen.","es":"una actividad que dura FOR y un periodo hasta ahora lleva HAS + BEEN + -ING. SINCE lleva un momento concreto, no veinte minutos; el Present Continuous no puede llevar FOR.","fr":"une activité qui dure FOR une période jusqu'à maintenant prend HAS + BEEN + -ING. SINCE prend un point dans le temps, pas vingt minutes ; le Present Continuous ne peut pas porter FOR.","it":"un'attività che dura FOR un periodo fino a ora prende HAS + BEEN + -ING. SINCE prende un momento preciso, non venti minuti; il Present Continuous non può reggere FOR.","ja":"FOR + 期間で今まで続いている動作は HAS + BEEN + -ING を取ります。SINCE は時点を取り、二十分は取りません。Present Continuous は FOR を取れません。","pt":"uma atividade que dura FOR um período até agora leva HAS + BEEN + -ING. SINCE leva um momento no tempo, não vinte minutos; o Present Continuous não pode levar FOR.","ru":"действие, длящееся FOR период до настоящего момента, требует HAS + BEEN + -ING. SINCE требует точки во времени, а не двадцати минут; Present Continuous не может нести FOR.","zh":"持续一段时间（FOR）直到现在的动作用 HAS + BEEN + -ING。SINCE 接一个时间点，不接二十分钟；Present Continuous 不能表达 FOR。"},"fbRight":{"en":"A black arm comes over the stern and Tulloch fires. The line runs out, the barrel goes over, and it goes under without slowing.","ar":"ذراع سوداء تأتي من فوق المؤخرة فيطلق تولوخ. يندفع الحبل، ويسقط البرميل من فوق الحافة، ويغوص دون أن يبطئ.","de":"Ein schwarzer Arm kommt über das Heck, und Tulloch feuert. Die Leine läuft aus, die Tonne geht über Bord, und sie geht unter, ohne langsamer zu werden.","es":"Un brazo negro asoma por la popa y Tulloch dispara. El cabo corre, el bidón cae por la borda y se hunde sin frenar.","fr":"Un bras noir passe par-dessus la poupe et Tulloch tire. La ligne file, le baril passe par-dessus bord, et il s'enfonce sans ralentir.","it":"Un braccio nero arriva sopra la poppa e Tulloch spara. La cima corre, il bidone va fuori bordo, e va sotto senza rallentare.","ja":"黒い腕が船尾を越えてきて、タロックが撃ちます。ロープが走り、樽が舷の外へ落ち、速度を落とさずに沈んでいきます。","pt":"Um braço preto passa por cima da popa e Tulloch dispara. O cabo corre, o bidão vai pela borda fora e afunda sem abrandar.","ru":"Чёрная рука переваливается через корму, и Таллох стреляет. Линь уходит, бочка летит за борт и уходит под воду, не замедляясь.","zh":"一条黑色的臂从船尾伸过来，塔洛克开火。缆绳飞快放出，浮桶翻出船外，沉下去时一点也没减速。"},"fbWrong":{"en":"The barrel goes over anyway; you were slow with the line.","ar":"يسقط البرميل من فوق الحافة رغم ذلك؛ كنتِ بطيئة مع الحبل.","de":"Die Tonne geht trotzdem über Bord; du warst zu langsam mit der Leine.","es":"El bidón cae por la borda de todos modos; fuiste lenta con el cabo.","fr":"Le baril passe quand même par-dessus bord ; tu as été trop lente avec la ligne.","it":"Il bidone va fuori bordo lo stesso; sei stata lenta con la cima.","ja":"それでも樽は舷の外へ落ちます。あなたのロープさばきが遅かったのです。","pt":"O bidão vai pela borda fora na mesma; foste lenta com o cabo.","ru":"Бочка всё равно уходит за борт; ты не успела с линем.","zh":"浮桶还是翻出了船外；你放缆绳慢了。"},"clue":[{"en":"You hear: Tulloch: \"It ___ the hull for twenty minutes. Feeling it. Learning it. When it's learned it, it'll come up.\" · Vass: \"How do you know?\" · Tulloch: \"Because I've been learning it for twenty-eight years.\"","ar":"تسمعين: تولوخ: \"إنه ___ الهيكل منذ عشرين دقيقة. يتحسّسه. يتعلّمه. حين يتعلّمه، سيصعد.\" · فاس: \"كيف تعرف؟\" · تولوخ: \"لأنني أتعلّمه منذ ثمانية وعشرين عامًا.\"","de":"Du hörst: Tulloch: „Es ___ den Rumpf seit zwanzig Minuten. Betastet ihn. Lernt ihn. Wenn es ihn gelernt hat, kommt es hoch.“ · Vass: „Woher wissen Sie das?“ · Tulloch: „Weil ich es seit achtundzwanzig Jahren lerne.“","es":"Oyes: Tulloch: “___ el casco veinte minutos. Palpándolo. Aprendiéndoselo. Cuando se lo haya aprendido, subirá.” · Vass: “¿Cómo lo sabe?” · Tulloch: “Porque yo llevo veintiocho años aprendiéndomelo a él.”","fr":"Tu entends : Tulloch : « Il ___ la coque depuis vingt minutes. Il la tâte. Il l'apprend. Quand il l'aura apprise, il montera. » · Vass : « Comment le savez-vous ? » · Tulloch : « Parce que moi je l'apprends depuis vingt-huit ans. »","it":"Senti: Tulloch: «___ lo scafo da venti minuti. Lo tasta. Lo impara. Quando lo avrà imparato, salirà.» · Vass: «Come fa a saperlo?» · Tulloch: «Perché io lo sto imparando da ventotto anni.»","ja":"聞こえる：タロック：「あいつは二十分、船体を___。探っている。覚えている。覚えたら、上がってくる」· ヴァス：「どうしてわかるの？」· タロック：「俺は二十八年、あいつを覚えてきたからだ」","pt":"Ouves: Tulloch: «___ o casco há vinte minutos. A apalpá-lo. A aprendê-lo. Quando o tiver aprendido, sobe.» · Vass: «Como é que sabe?» · Tulloch: «Porque eu ando a aprendê-lo há vinte e oito anos.»","ru":"Ты слышишь: Таллох: «Оно ___ корпус уже двадцать минут. Ощупывает. Изучает. Когда изучит, поднимется.» · Васс: «Откуда вы знаете?» · Таллох: «Потому что я изучаю его двадцать восемь лет.»","zh":"你听到：塔洛克：“它___船壳二十分钟了。在摸它。在熟悉它。等它熟悉了，就会上来。”· 瓦丝：“你怎么知道？”· 塔洛克：“因为我熟悉它已经二十八年了。”"}],"relic":true},"2.5b":{"img":"30_q5b_lantern.webp","hot":[82.0,72.0,12.0,16.0],"title":{"en":"THE LANTERN","ar":"الفانوس","de":"DIE LATERNE","es":"EL FAROL","fr":"LA LANTERNE","it":"LA LANTERNA","ja":"ランタン","pt":"A LANTERNA DE TEMPESTADE","ru":"ШТОРМОВОЙ ФОНАРЬ","zh":"风灯"},"story":[{"en":"The Kittiwake anchors under the cliff at low water and Tulloch rows his punt into the cave mouth ahead of you. You and Vass follow in the inflatable with a storm lantern.","ar":"يرسو كيتيويك تحت الجرف عند الجزر، ويجدّف تولوخ بقاربه الصغير إلى مدخل الكهف أمامكما. تتبعينه أنتِ وفاس في القارب المطاطي ومعكما فانوس عواصف.","de":"Die Kittiwake ankert bei Niedrigwasser unter der Klippe, und Tulloch rudert sein Beiboot vor euch in den Höhleneingang. Du und Vass folgt im Schlauchboot mit einer Sturmlaterne.","es":"El Kittiwake fondea bajo el acantilado con la marea baja y Tulloch mete su bote de remos en la boca de la cueva por delante de vosotros. Vass y tú le seguís en la neumática con un farol de tormenta.","fr":"Le Kittiwake mouille sous la falaise à marée basse et Tulloch avance à la rame dans l'entrée de la grotte devant vous. Vass et toi suivez dans le pneumatique avec une lanterne-tempête.","it":"Il Kittiwake dà fondo sotto la falesia con la bassa marea e Tulloch entra a remi con il suo sandolino nell'imboccatura della grotta, davanti a voi. Tu e Vass seguite sul gommone con una lanterna antivento.","ja":"干潮時、キティウェイク号は崖の下に錨を下ろし、タロックは小舟を漕いであなたたちより先に洞窟の入り口へ入ります。あなたとヴァスは嵐用ランタンを持ってゴムボートで続きます。","pt":"O Kittiwake fundeia por baixo da falésia na maré baixa e Tulloch entra a remos com o bote na boca da gruta à vossa frente. Tu e Vass seguem no insuflável com uma lanterna de tempestade.","ru":"«Киттивейк» встаёт на якорь под утёсом в малую воду, и Таллох на вёслах входит в устье пещеры впереди вас. Вы с Васс идёте следом на надувной со штормовым фонарём.","zh":"低潮时，基蒂韦克号在悬崖下抛锚，塔洛克划着他的小平底船先你们一步进了洞口。你和瓦丝提着一盏风灯，坐橡皮艇跟在后面。"},{"en":"Inside, the cave is bigger than the village hall and the water is black and still and it smells of something you do not have a word for.","ar":"في الداخل، الكهف أكبر من قاعة القرية، والماء أسود وساكن، وتفوح منه رائحة شيء لا تجدين له اسمًا.","de":"Drinnen ist die Höhle größer als das Gemeindehaus, und das Wasser ist schwarz und still und riecht nach etwas, wofür du kein Wort hast.","es":"Dentro, la cueva es más grande que el salón del pueblo y el agua está negra y quieta y huele a algo para lo que no tienes palabra.","fr":"À l'intérieur, la grotte est plus grande que la salle des fêtes et l'eau est noire et immobile et ça sent quelque chose que tu ne sais pas nommer.","it":"Dentro, la grotta è più grande della sala del paese e l'acqua è nera e immobile e odora di qualcosa per cui non hai una parola.","ja":"中の洞窟は村の集会所より大きく、水は黒く静かで、あなたが言葉を持たない何かのにおいがします。","pt":"Lá dentro, a gruta é maior do que a casa do povo e a água é preta e parada e cheira a uma coisa para a qual não tens palavra.","ru":"Внутри пещера больше сельского зала, вода чёрная и неподвижная, и пахнет чем-то, для чего у тебя нет слова.","zh":"洞里比村公所还大，水又黑又静，散发着一种你叫不出名字的气味。"}],"k":{"en":"CHAPTER 2 · THE CAVES · MONDAY","ar":"الفصل 2 · الكهوف · الاثنين","de":"KAPITEL 2 · DIE HÖHLEN · MONTAG","es":"CAPÍTULO 2 · LAS CUEVAS · LUNES","fr":"CHAPITRE 2 · LES GROTTES · LUNDI","it":"CAPITOLO 2 · LE GROTTE · LUNEDÌ","ja":"第2章 · 洞窟 · 月曜日","pt":"CAPÍTULO 2 · AS GRUTAS · SEGUNDA-FEIRA","ru":"ГЛАВА 2 · ПЕЩЕРЫ · ПОНЕДЕЛЬНИК","zh":"第2章 · 洞穴 · 星期一"},"kind":"question","next":"2.6b","prompt":{"en":"Tulloch: \"Quiet. Something ___ at the back.\"","ar":"تولوخ: \"صمتًا. شيء ما ___ في الخلف.\"","de":"Tulloch: „Still. Etwas ___ sich hinten.“","es":"Tulloch: “Silencio. Algo ___ al fondo.”","fr":"Tulloch : « Silence. Quelque chose ___ au fond. »","it":"Tulloch: «Zitti. Qualcosa ___ in fondo.»","ja":"タロック：「静かに。奥で何かが___」","pt":"Tulloch: «Calados. Alguma coisa ___ ao fundo.»","ru":"Таллох: «Тихо. Что-то ___ в глубине.»","zh":"塔洛克：“安静。后面有东西___。”"},"opts":[{"en":"has just moved"},{"en":"has just move"},{"en":"have just moved"}],"answer":0,"fb":{"en":"JUST goes between HAS and the PAST PARTICIPLE: HAS JUST MOVED. MOVED is the participle, not MOVE. SOMETHING is singular and takes HAS, not HAVE.","ar":"JUST تأتي بين HAS وPAST PARTICIPLE: HAS JUST MOVED. الكلمة MOVED هي اسم المفعول، لا MOVE. وSOMETHING مفرد ويأخذ HAS لا HAVE.","de":"JUST steht zwischen HAS und dem PAST PARTICIPLE: HAS JUST MOVED. MOVED ist das Partizip, nicht MOVE. SOMETHING ist Singular und nimmt HAS, nicht HAVE.","es":"JUST va entre HAS y el PAST PARTICIPLE: HAS JUST MOVED. MOVED es el participio, no MOVE. SOMETHING es singular y lleva HAS, no HAVE.","fr":"JUST se place entre HAS et le PAST PARTICIPLE : HAS JUST MOVED. MOVED est le participe, pas MOVE. SOMETHING est singulier et prend HAS, pas HAVE.","it":"JUST va tra HAS e il PAST PARTICIPLE: HAS JUST MOVED. MOVED è il participio, non MOVE. SOMETHING è singolare e prende HAS, non HAVE.","ja":"JUST は HAS と PAST PARTICIPLE の間に入ります：HAS JUST MOVED。MOVED が過去分詞で、MOVE ではありません。SOMETHING は単数なので HAS を取り、HAVE ではありません。","pt":"JUST vai entre HAS e o PAST PARTICIPLE: HAS JUST MOVED. MOVED é o particípio, não MOVE. SOMETHING é singular e leva HAS, não HAVE.","ru":"JUST стоит между HAS и PAST PARTICIPLE: HAS JUST MOVED. MOVED — причастие, а не MOVE. SOMETHING — единственное число и требует HAS, а не HAVE.","zh":"JUST 放在 HAS 和 PAST PARTICIPLE 之间：HAS JUST MOVED。MOVED 是过去分词，不是 MOVE。SOMETHING 是单数，用 HAS，不用 HAVE。"},"fbRight":{"en":"Nothing moves again. That is worse.","ar":"لا شيء يتحرّك بعدها. وهذا أسوأ.","de":"Nichts bewegt sich mehr. Das ist schlimmer.","es":"Nada vuelve a moverse. Eso es peor.","fr":"Plus rien ne bouge. C'est pire.","it":"Non si muove più niente. È peggio.","ja":"もう何も動きません。そのほうが悪いのです。","pt":"Nada volta a mexer-se. Isso é pior.","ru":"Больше ничего не шевелится. Это хуже.","zh":"再也没有东西动。那更糟。"},"fbWrong":{"en":"Tulloch turns the lantern down.","ar":"يخفض تولوخ ضوء الفانوس.","de":"Tulloch dreht die Laterne herunter.","es":"Tulloch baja la luz del farol.","fr":"Tulloch baisse la lanterne.","it":"Tulloch abbassa la lanterna.","ja":"タロックはランタンの火を落とします。","pt":"Tulloch baixa a lanterna.","ru":"Таллох прикручивает фонарь.","zh":"塔洛克把风灯调暗。"},"clue":[{"en":"You hear: Vass, whispering: \"Look at the walls. It's been in here. Those marks are suckers.\"","ar":"تسمعين: فاس، هامسة: \"انظري إلى الجدران. لقد كان هنا. تلك العلامات آثار ممصّات.\"","de":"Du hörst: Vass, flüsternd: „Sieh dir die Wände an. Es war hier drin. Diese Spuren sind Saugnäpfe.“","es":"Oyes: Vass, susurrando: “Mirad las paredes. Ha estado aquí dentro. Esas marcas son ventosas.”","fr":"Tu entends : Vass, en chuchotant : « Regarde les parois. Il est venu ici. Ces marques sont des ventouses. »","it":"Senti: Vass, sussurrando: «Guarda le pareti. È stato qui dentro. Quei segni sono di ventose.»","ja":"聞こえる：ヴァス、ささやき声で：「壁を見て。あれはここにいたのよ。あの跡は吸盤」","pt":"Ouves: Vass, a sussurrar: «Olha para as paredes. Esteve aqui dentro. Aquelas marcas são ventosas.»","ru":"Ты слышишь: Васс, шёпотом: «Посмотри на стены. Оно здесь было. Эти следы — присоски.»","zh":"你听到：瓦丝，低声说：“看墙上。它来过这里。那些印子是吸盘。”"}]},"2.6b":{"img":"31_q6b_dinghy.webp","hot":[82.0,48.0,14.0,18.0],"title":{"en":"THE DINGHY","ar":"القارب الشراعي","de":"DIE JOLLE","es":"EL BOTE","fr":"LE DÉRIVEUR","it":"LA DERIVA","ja":"ディンギー","pt":"O BARCO À VELA","ru":"ШВЕРТБОТ","zh":"小帆船"},"story":[{"en":"In the back of the cave, half sunk on a ledge, is a white sailing dinghy with its mast snapped and a small lamp still burning on the bow. Vass knows it before you do.","ar":"في مؤخرة الكهف، نصف غارق على نتوء صخري، قارب شراعي أبيض صاريه مكسور، وعلى مقدّمته مصباح صغير ما زال مشتعلًا. تعرفه فاس قبلكِ.","de":"Hinten in der Höhle, halb gesunken auf einem Sims, liegt eine weiße Segeljolle mit gebrochenem Mast und einer kleinen Lampe, die am Bug noch brennt. Vass erkennt sie vor dir.","es":"Al fondo de la cueva, medio hundido sobre una repisa, hay un bote de vela blanco con el mástil partido y una lucecita todavía encendida en la proa. Vass lo reconoce antes que tú.","fr":"Au fond de la grotte, à demi coulé sur une corniche, il y a un dériveur blanc au mât brisé et une petite lampe encore allumée à l'avant. Vass le reconnaît avant toi.","it":"In fondo alla grotta, mezza affondata su un ripiano, c'è una deriva a vela bianca con l'albero spezzato e una lucina ancora accesa a prua. Vass la riconosce prima di te.","ja":"洞窟の奥、岩棚の上に半分沈んで、マストの折れた白いヨットのディンギーがあり、船首では小さなランプがまだ灯っています。ヴァスはあなたより先にそれが何かわかります。","pt":"Ao fundo da gruta, meio afundado num patamar, está um barco à vela branco com o mastro partido e uma luzinha ainda acesa à proa. Vass reconhece-o antes de ti.","ru":"В глубине пещеры, наполовину затопленный на уступе, стоит белый парусный швертбот со сломанной мачтой и всё ещё горящей лампочкой на носу. Васс узнаёт его раньше тебя.","zh":"洞的深处，一块岩架上半沉着一艘白色小帆船，桅杆折断了，船头还亮着一盏小灯。瓦丝比你先认出了它。"},{"en":"It is Sandy Weir's boat from the inner bay.","ar":"إنه قارب ساندي وير من الخليج الداخلي.","de":"Es ist Sandy Weirs Boot aus der inneren Bucht.","es":"Es el bote de Sandy Weir, el de la bahía interior.","fr":"C'est le bateau de Sandy Weir, celui de la baie intérieure.","it":"È la barca di Sandy Weir, quella della baia interna.","ja":"内湾のサンディ・ウィアーのボートです。","pt":"É o barco de Sandy Weir, o da baía interior.","ru":"Это лодка Сэнди Уира из внутренней бухты.","zh":"这是桑迪·威尔在内湾的那条船。"}],"k":{"en":"CHAPTER 2 · THE CAVES · MONDAY","ar":"الفصل 2 · الكهوف · الاثنين","de":"KAPITEL 2 · DIE HÖHLEN · MONTAG","es":"CAPÍTULO 2 · LAS CUEVAS · LUNES","fr":"CHAPITRE 2 · LES GROTTES · LUNDI","it":"CAPITOLO 2 · LE GROTTE · LUNEDÌ","ja":"第2章 · 洞窟 · 月曜日","pt":"CAPÍTULO 2 · AS GRUTAS · SEGUNDA-FEIRA","ru":"ГЛАВА 2 · ПЕЩЕРЫ · ПОНЕДЕЛЬНИК","zh":"第2章 · 洞穴 · 星期一"},"kind":"question","next":"2.7b","prompt":{"en":"Vass: \"That's the marshal's dinghy. It ___ here since Sunday. It carried it here. Three miles, through the moorings, with the lamp still on.\"","ar":"فاس: \"هذا قارب الحَكَم. إنه ___ هنا منذ الأحد. هو حمله إلى هنا. ثلاثة أميال، عبر المرسى، والمصباح ما زال مضاءً.\"","de":"Vass: „Das ist die Jolle des Wettfahrtleiters. Sie ___ seit Sonntag hier. Es hat sie hierher getragen. Drei Meilen, durch die Liegeplätze, mit noch brennender Lampe.“","es":"Vass: “Ese es el bote del juez de regata. ___ aquí desde el domingo. Lo trajo hasta aquí. Tres millas, por los amarres, con la luz todavía encendida.”","fr":"Vass : « C'est le dériveur du commissaire. Il ___ ici depuis dimanche. Il l'a porté jusqu'ici. Trois milles, à travers les corps-morts, avec la lampe encore allumée. »","it":"Vass: «È la deriva del giudice. ___ qui da domenica. Ce l'ha portata lui. Tre miglia, attraverso gli ormeggi, con la lampada ancora accesa.»","ja":"ヴァス：「あれは審判のディンギーよ。日曜日からここに___。あれがここまで運んできたの。三マイル、係留区域を抜けて、ランプを灯したまま」","pt":"Vass: «É o barco do árbitro. ___ aqui desde domingo. Trouxe-o até aqui. Três milhas, pelas amarrações, com a luz ainda acesa.»","ru":"Васс: «Это швертбот судьи. Он ___ здесь с воскресенья. Оно принесло его сюда. Три мили, через стоянку, с ещё горящей лампой.»","zh":"瓦丝：“那是裁判的小帆船。它从星期天起就___在这里。是它把船带到这里来的。三英里，穿过系泊区，灯还亮着。”"},"opts":[{"en":"was been"},{"en":"has been"},{"en":"is being"}],"answer":1,"fb":{"en":"a state with SINCE a point in time takes HAS + BEEN. The Present Continuous cannot carry SINCE; WAS never takes BEEN.","ar":"الحالة مع SINCE ونقطة زمنية تأخذ HAS + BEEN. Present Continuous لا يمكنه أن يحمل SINCE؛ وWAS لا تأخذ BEEN أبدًا.","de":"ein Zustand mit SINCE und einem Zeitpunkt nimmt HAS + BEEN. Das Present Continuous kann SINCE nicht tragen; WAS nimmt nie BEEN.","es":"un estado con SINCE y un momento concreto lleva HAS + BEEN. El Present Continuous no puede llevar SINCE; WAS nunca lleva BEEN.","fr":"un état avec SINCE et un point dans le temps prend HAS + BEEN. Le Present Continuous ne peut pas porter SINCE ; WAS ne prend jamais BEEN.","it":"uno stato con SINCE e un momento preciso prende HAS + BEEN. Il Present Continuous non può reggere SINCE; WAS non prende mai BEEN.","ja":"SINCE + 時点の状態は HAS + BEEN を取ります。Present Continuous は SINCE を取れず、WAS が BEEN を取ることは決してありません。","pt":"um estado com SINCE e um momento no tempo leva HAS + BEEN. O Present Continuous não pode levar SINCE; WAS nunca leva BEEN.","ru":"состояние с SINCE и точкой во времени требует HAS + BEEN. Present Continuous не может нести SINCE; WAS никогда не берёт BEEN.","zh":"带 SINCE 加时间点的状态用 HAS + BEEN。Present Continuous 不能表达 SINCE；WAS 从不接 BEEN。"},"fbRight":{"en":"Vass reaches for the lamp and Tulloch catches her wrist.","ar":"تمدّ فاس يدها نحو المصباح فيمسك تولوخ معصمها.","de":"Vass greift nach der Lampe, und Tulloch packt ihr Handgelenk.","es":"Vass va a coger la lámpara y Tulloch le agarra la muñeca.","fr":"Vass tend la main vers la lampe et Tulloch lui attrape le poignet.","it":"Vass allunga la mano verso la lampada e Tulloch le afferra il polso.","ja":"ヴァスがランプに手を伸ばすと、タロックがその手首をつかみます。","pt":"Vass estica a mão para o candeeiro e Tulloch agarra-lhe o pulso.","ru":"Васс тянется к лампе, и Таллох перехватывает её запястье.","zh":"瓦丝伸手去拿那盏灯，塔洛克一把抓住她的手腕。"},"fbWrong":{"en":"Vass reaches for the lamp anyway.","ar":"تمدّ فاس يدها نحو المصباح رغم ذلك.","de":"Vass greift trotzdem nach der Lampe.","es":"Vass coge la lámpara de todos modos.","fr":"Vass ееся FOR период до настоящего момента, требует HAS + BEEN + -ING. BEEN опускать нельзя; Present Continuous не может нести SINCE.","zh":"持续一段时间（FOR）直到现在的动作用 HAS + BEEN + -ING。BEEN 不能省略；Present Continuous 不能表达 SINCE。"},"fbRight":{"en":"In the cave mouth the water bulges, black, between you and the light. Tulloch, standing in the punt, fires the harpoon from three metres. The barrel goes over and the water goes flat.","ar":"عند مدخل الكهف ينتفخ الماء، أسود، بينكم وبين الضوء. يطلق تولوخ، واقفًا في القارب الصغير، الحربة من ثلاثة أمتار. يسقط البرميل من فوق الحافة ويستوي الماء.","de":"In der Höhlenmündung wölbt sich das Wasser, schwarz, zwischen euch und dem Licht. Tulloch, im Beiboot stehend, feuert die Harpune aus drei Metern ab. Die Tonne geht über Bord, und das Wasser wird glatt.","es":"En la boca de la cueva el agua se abomba, negra, entre vosotros y la luz. Tulloch, de pie en el bote, dispara el arpón a tres metros. El bidón cae por la borda y el agua se queda lisa.","fr":"À l'entrée de la grotte, l'eau se bombe, noire, entre vous et la lumière. Tulloch, debout dans sa plate, tire le harpon à trois mètres. Le baril passe par-dessus bord et l'eau redevient lisse.","it":"All'imboccatura della grotta l'acqua si gonfia, nera, tra voi e la luce. Tulloch, in piedi sul sandolino, spara l'arpione da tre metri. Il bidone va fuori bordo e l'acqua torna piatta.","ja":"洞窟の入り口で、あなたたちと光の間の水が黒く盛り上がります。タロックは小舟に立ったまま、三メートルの距離から銛を撃ちます。樽が舷の外へ落ち、水面が平らになります。","pt":"Na boca da gruta a água incha, preta, entre vocês e a luz. Tulloch, de pé no bote, dispara o arpão a três metros. O bidão vai pela borda fora e a água fica lisa.","ru":"В устье пещеры вода вспучивается, чёрная, между вами и светом. Таллох, стоя в лодке, стреляет гарпуном с трёх метров. Бочка уходит за борт, и вода разглаживается.","zh":"洞口处，黑色的海水在你们和光亮之间鼓起。塔洛克站在平底船上，从三米外射出鱼叉。浮桶翻出船外，水面平静下来。"},"fbWrong":{"en":"You get out. Only just.","ar":"تخرجون. بالكاد.","de":"Ihr kommt heraus. Gerade noch.","es":"Salís. Por los pelos.","fr":"Vous sortez. De justesse.","it":"Uscite. Per un pelo.","ja":"あなたたちは外へ出ます。ぎりぎりで。","pt":"Saem. Por pouco.","ru":"Вы выбираетесь. Еле-еле.","zh":"你们出来了。千钧一发。"},"relic":true,"pages":[{"t":"story","b":{"en":"The water on the cave floor is higher than it was. You did not notice it rise, but the wet line on the rock is a hand's width above the dry line now.","ar":"الماء على أرض الكهف أعلى مما كان. لم تلاحظي ارتفاعه، لكن الخط المبلول على الصخر صار الآن فوق الخط الجاف بعرض كفّ.","de":"Das Wasser auf dem Höhlenboden steht höher als vorher. Du hast es nicht steigen sehen, aber die nasse Linie am Fels ist jetzt eine Handbreit über der trockenen.","es":"El agua del suelo de la cueva está más alta que antes. No la has visto subir, pero la marca mojada en la roca está ahora un palmo por encima de la línea seca.","fr":"L'eau sur le sol de la grotte est plus haute qu'avant. Tu ne l'as pas vue monter, mais la ligne mouillée sur la roche est maintenant à une largeur de main au-dessus de la ligne sèche.","it":"L'acqua sul fondo della grotta è più alta di prima. Non l'hai vista salire, ma la linea bagnata sulla roccia adesso è un palmo sopra quella asciutta.","ja":"洞窟の底の水が前より高くなっています。上がってくるのには気づきませんでしたが、岩の濡れた線は今、乾いた線より手のひら一つ分上にあります。","pt":"A água no chão da gruta está mais alta do que estava. Não a viste subir, mas a linha molhada na rocha está agora um palmo acima da linha seca.","ru":"Вода на полу пещеры выше, чем была. Ты не заметила, как она поднялась, но мокрая линия на камне теперь на ладонь выше сухой.","zh":"洞底的水比刚才高了。你没注意到它在涨，但现在岩石上的湿线比干线高出一掌宽。"},"img":"insert_tide_detail.webp","hot":[74.0,21.0,12.0,16.0],"label":{"en":"THE TIDE","ar":"المدّ","de":"DIE FLUT","es":"LA MAREA","fr":"LA MARÉE","it":"LA MAREA","ja":"潮","pt":"A MARÉ","ru":"ПРИЛИВ","zh":"潮水"}},{"t":"story","b":{"en":"Tulloch is already pulling the punt round. Vass lifts the lantern. You catch the gunwale as the little boat swings towards the mouth. The three of you have to leave together.","ar":"تولوخ يدير القارب الصغير بالفعل. ترفع فاس الفانوس. تمسكين بالحافة بينما يتأرجح القارب الصغير نحو المدخل. عليكم أن تغادروا ثلاثتكم معًا.","de":"Tulloch dreht das Beiboot schon herum. Vass hebt die Laterne. Du greifst nach dem Dollbord, als das kleine Boot zur Mündung schwenkt. Ihr drei müsst zusammen raus.","es":"Tulloch ya está dando la vuelta al bote. Vass levanta el farol. Tú agarras la regala mientras la pequeña embarcación gira hacia la boca. Los tres tenéis que salir juntos.","fr":"Tulloch fait déjà virer le canot. Vass lève la lanterne. Tu attrapes le plat-bord au moment où la petite embarcation pivote vers la sortie. Vous devez partir tous les trois ensemble.","it":"Tulloch sta già girando il sandolino. Vass alza la lanterna. Tu afferri il bordo mentre la barchetta ruota verso l'imboccatura. Dovete uscire tutti e tre insieme.","ja":"タロックはもう小舟の向きを変えています。ヴァスがランタンを掲げます。小さな舟が入り口へ向かって揺れるとき、あなたは舷縁をつかみます。三人一緒に出なければなりません。","pt":"Tulloch já está a virar o bote. Vass levanta a lanterna. Tu agarras a borda enquanto o barquito roda para a saída. Têm de sair os três juntos.","ru":"Таллох уже разворачивает лодку. Васс поднимает фонарь. Ты хватаешься за планширь, когда лодочка разворачивается к выходу. Выходить надо втроём.","zh":"塔洛克已经在调转平底船了。瓦丝举起风灯。小船转向洞口时你抓住了船舷。你们三个必须一起离开。"},"img":"33_q8b_tideline.webp","hot":[83.0,54.0,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"You hear: Tulloch: \"The tide ___ for an hour. Out. Now. It doesn't need to come in here. It just needs to close the door.\"","ar":"تسمعين: تولوخ: \"المدّ ___ منذ ساعة. اخرجوا. الآن. لا يحتاج إلى أن يدخل إلى هنا. يكفيه أن يغلق الباب.\"","de":"Du hörst: Tulloch: „Die Flut ___ seit einer Stunde. Raus. Sofort. Es muss hier nicht hereinkommen. Es muss nur die Tür zumachen.“","es":"Oyes: Tulloch: “La marea ___ una hora. Fuera. Ya. No hace falta que entre aquí. Solo hace falta que cierre la puerta.”","fr":"Tu entends : Tulloch : « La marée ___ depuis une heure. Dehors. Tout de suite. Il n'a pas besoin d'entrer ici. Il a juste besoin de fermer la porte. »","it":"Senti: Tulloch: «La marea ___ da un'ora. Fuori. Subito. Non ha bisogno di entrare qui. Deve solo chiudere la porta.»","ja":"聞こえる：タロック：「潮が一時間___。出るぞ。今すぐ。あいつはここへ入ってくる必要はない。扉を閉めるだけでいいんだ」","pt":"Ouves: Tulloch: «A maré ___ há uma hora. Fora. Já. Não precisa de entrar aqui. Só precisa de fechar a porta.»","ru":"Ты слышишь: Таллох: «Прилив ___ уже час. Наружу. Сейчас. Ему не нужно сюда входить. Ему нужно только закрыть дверь.»","zh":"你听到：塔洛克：“潮水___一个小时了。出去。现在。它用不着进来。它只需要把门关上。”"},"img":"33_q8b_tideline.webp","hot":[83.0,54.0,12.0,16.0],"label":{"en":"YOU HEAR","ar":"تسمعين","de":"DU HÖRST","es":"OYES","fr":"TU ENTENDS","it":"SENTI","ja":"聞こえる","pt":"OUVES","ru":"ТЫ СЛЫШИШЬ","zh":"你听到"}}],"askImg":"33_q8b_tideline.webp","askHot":[83.0,54.0,12.0,16.0]},"2.9":{"img":"34_q9_ossian.webp","hot":[83.5,44.0,12.0,16.0],"title":{"en":"THE OSSIAN","ar":"أوسيان","de":"DIE OSSIAN","es":"EL OSSIAN","fr":"L'OSSIAN","it":"L'OSSIAN","ja":"オシアン号","pt":"O OSSIAN","ru":"«ОССИАН»","zh":"奥西恩号"},"story":[{"en":"The barrel comes up an hour later, at the top of the Narrows, in four metres of clear water. Below it, on its side on the white sand, lies a trawler with its wheelhouse gone and its name long since scoured off.","ar":"يطفو البرميل بعد ساعة، عند أعلى المضائق، في أربعة أمتار من الماء الصافي. تحته، على جنبها فوق الرمل الأبيض، سفينة صيد بلا غرفة قيادة، واسمها ممحوّ منذ زمن طويل.","de":"Die Tonne kommt eine Stunde später hoch, am oberen Ende der Engen, in vier Metern klarem Wasser. Darunter liegt auf der Seite im weißen Sand ein Trawler, das Steuerhaus fort und der Name längst abgescheuert.","es":"El bidón sube una hora después, en la cabecera de los Estrechos, en cuatro metros de agua clara. Debajo, tumbado de lado sobre la arena blanca, hay un arrastrero sin puente y con el nombre borrado hace mucho.","fr":"Le baril remonte une heure plus tard, en haut des Étroits, dans quatre mètres d'eau claire. En dessous, couché sur le flanc dans le sable blanc, gît un chalutier sans timonerie, le nom depuis longtemps effacé.","it":"Il bidone riemerge un'ora dopo, in cima agli Stretti, in quattro metri d'acqua limpida. Sotto, coricato su un fianco sulla sabbia bianca, giace un peschereccio senza timoneria e con il nome consumato da tempo.","ja":"一時間後、樽は狭水道の奥、澄んだ水深四メートルのところに浮かび上がります。その下の白い砂の上に、操舵室がなくなり、船名もとうに削れて消えたトロール船が横倒しになっています。","pt":"O bidão sobe uma hora depois, no topo dos Estreitos, em quatro metros de água limpa. Por baixo, deitado de lado na areia branca, está um arrastão sem casa do leme e com o nome há muito apagado.","ru":"Бочка всплывает через час, в верхней части Теснин, на четырёх метрах прозрачной воды. Под ней, на боку на белом песке, лежит траулер без рубки, с давно стёртым названием.","zh":"一小时后，浮桶在窄峡上端浮了上来，那里的水清澈，只有四米深。它下面，白沙上侧躺着一艘拖网渔船，驾驶室没了，船名早已被冲刷得看不见。"},{"en":"The Ossian. Tulloch cuts the engine and the boat drifts over it in silence. He has not said a word for ten minutes.","ar":"أوسيان. يطفئ تولوخ المحرّك وينجرف القارب فوقها في صمت. لم ينطق بكلمة منذ عشر دقائق.","de":"Die Ossian. Tulloch stellt den Motor ab, und das Boot treibt lautlos darüber hinweg. Er hat seit zehn Minuten kein Wort gesagt.","es":"El Ossian. Tulloch para el motor y el barco se desliza por encima en silencio. Lleva diez minutos sin decir una palabra.","fr":"L'Ossian. Tulloch coupe le moteur et le bateau dérive au-dessus en silence. Il n'a pas dit un mot depuis dix minutes.","it":"L'Ossian. Tulloch spegne il motore e la barca ci scivola sopra in silenzio. Non dice una parola da dieci minuti.","ja":"オシアン号です。タロックはエンジンを切り、船は静かにその上を漂っていきます。彼はもう十分間、一言も話していません。","pt":"O Ossian. Tulloch desliga o motor e o barco passa por cima em silêncio. Não diz uma palavra há dez minutos.","ru":"«Оссиан». Таллох глушит двигатель, и лодка в тишине проходит над ним. Он не сказал ни слова десять минут.","zh":"奥西恩号。塔洛克关掉引擎，船静静地从它上方漂过。他已经十分钟没说一句话了。"}],"k":{"en":"CHAPTER 3 · THE WRECK · MONDAY","ar":"الفصل 3 · الحطام · الاثنين","de":"KAPITEL 3 · DAS WRACK · MONTAG","es":"CAPÍTULO 3 · EL PECIO · LUNES","fr":"CHAPITRE 3 · L'ÉPAVE · LUNDI","it":"CAPITOLO 3 · IL RELITTO · LUNEDÌ","ja":"第3章 · 難破船 · 月曜日","pt":"CAPÍTULO 3 · O DESTROÇO · SEGUNDA-FEIRA","ru":"ГЛАВА 3 · ОБЛОМКИ · ПОНЕДЕЛЬНИК","zh":"第3章 · 沉船 · 星期一"},"kind":"question","next":"2.10","prompt":{"en":"Tulloch: \"I ___ down to her. Once. 1999, with a mask and a rope round my waist. I didn't go twice.\"","ar":"تولوخ: \"أنا ___ إليها في القاع. مرة واحدة. عام 1999، بقناع وحبل حول خصري. لم أنزل مرتين.\"","de":"Tulloch: „Ich ___ unten bei ihr. Einmal. 1999, mit einer Maske und einem Seil um die Taille. Ein zweites Mal bin ich nicht runter.“","es":"Tulloch: “___ hasta ella. Una vez. En 1999, con una máscara y un cabo a la cintura. No bajé dos veces.”","fr":"Tulloch : « Je ___ jusqu'à elle. Une fois. En 1999, avec un masque et une corde autour de la taille. Je n'y suis pas retourné. »","it":"Tulloch: «___ giù fino a lei. Una volta. Nel 1999, con una maschera e una cima in vita. Non ci sono sceso due volte.»","ja":"タロック：「俺は一度、あの船まで___。1999年、マスクをつけて、腰にロープを巻いて。二度目はなかった」","pt":"Tulloch: «___ lá abaixo até ela. Uma vez. Em 1999, com máscara e um cabo à cintura. Não desci duas vezes.»","ru":"Таллох: «Я ___ вниз к ней. Один раз. В 1999-м, с маской и верёвкой на поясе. Второй раз не пошёл.»","zh":"塔洛克：“我___下去到她那里。一次。1999年，戴着面罩，腰上系着绳子。我没去第二次。”"},"opts":[{"en":"have went"},{"en":"have been"},{"en":"have being"}],"answer":1,"fb":{"en":"HAVE BEEN describes a visit that is over: he went down to the wreck and returned. WENT is the Past Simple and cannot follow HAVE. BEING is not the past participle of BE.","ar":"HAVE BEEN تصف زيارة انتهت: نزل إلى الحطام ثم عاد. WENT هي Past Simple ولا يمكن أن تأتي بعد HAVE. وBEING ليست اسم مفعول BE.","de":"HAVE BEEN beschreibt einen Besuch, der vorbei ist: er ist zum Wrack hinuntergetaucht und zurückgekommen. WENT ist das Past Simple und kann nicht nach HAVE stehen. BEING ist nicht das Partizip von BE.","es":"HAVE BEEN describe una visita terminada: bajó al pecio y volvió. WENT es el Past Simple y no puede ir detrás de HAVE. BEING no es el participio de BE.","fr":"HAVE BEEN décrit une visite terminée : il est descendu à l'épave et il est revenu. WENT est le Past Simple et ne peut pas suivre HAVE. BEING n'est pas le participe passé de BE.","it":"HAVE BEEN descrive una visita finita: è sceso al relitto ed è tornato. WENT è il Past Simple e non può seguire HAVE. BEING non è il participio passato di BE.","ja":"HAVE BEEN は終わった訪問を表します。彼は難破船まで潜って、戻ってきました。WENT は Past Simple なので HAVE の後には来られません。BEING は BE の過去分詞ではありません。","pt":"HAVE BEEN descreve uma visita acabada: desceu ao destroço e voltou. WENT é o Past Simple e não pode vir depois de HAVE. BEING não é o particípio passado de BE.","ru":"HAVE BEEN описывает законченный визит: он спустился к обломкам и вернулся. WENT — это Past Simple, и оно не может стоять после HAVE. BEING не является причастием от BE.","zh":"HAVE BEEN 描述一次已经结束的造访：他下到沉船那里，又回来了。WENT 是 Past Simple，不能放在 HAVE 后面。BEING 不是 BE 的过去分词。"},"fbRight":{"en":"The barrel goes under again, slowly, and the line runs out towards the deep water.","ar":"يغوص البرميل من جديد، ببطء، ويندفع الحبل نحو المياه العميقة.","de":"Die Tonne geht wieder unter, langsam, und die Leine läuft aus, dem tiefen Wasser zu.","es":"El bidón vuelve a hundirse, despacio, y el cabo corre hacia el agua profunda.","fr":"Le baril s'enfonce de nouveau, lentement, et la ligne file vers l'eau profonde.","it":"Il bidone va di nuovo sotto, lentamente, e la cima corre verso l'acqua profonda.","ja":"樽がまたゆっくりと沈み、ロープが深い水のほうへ走っていきます。","pt":"O bidão volta a afundar, devagar, e o cabo corre para a água funda.","ru":"Бочка снова уходит под воду, медленно, и линь тянется к глубокой воде.","zh":"浮桶又慢慢沉了下去，缆绳朝深水放出去。"},"fbWrong":{"en":"Tulloch: \"I came back, sergeant. That's the point.\"","ar":"تولوخ: \"لقد عدت أيتها الرقيبة. هذا هو المهم.\"", TTED is not the past form of PUT. HAVE PUT does not fit this finished date.","ar":"IN 1994 زمن ماضٍ منتهٍ، فاستخدمي PAST SIMPLE: PUT. PUTTED ليست صيغة الماضي من PUT. وHAVE PUT لا تناسب هذا التاريخ المنتهي.","de":"IN 1994 ist eine abgeschlossene Vergangenheit, also nimmt man das PAST SIMPLE: PUT. PUTTED ist nicht die Vergangenheitsform von PUT. HAVE PUT passt nicht zu diesem abgeschlossenen Datum.","es":"IN 1994 es un tiempo pasado terminado, así que se usa el PAST SIMPLE: PUT. PUTTED no es el pasado de PUT. HAVE PUT no encaja con esta fecha terminada.","fr":"IN 1994 est un moment du passé, terminé, donc on emploie le PAST SIMPLE : PUT. PUTTED n'est pas le passé de PUT. HAVE PUT ne va pas avec cette date terminée.","it":"IN 1994 è un tempo passato finito, quindi si usa il PAST SIMPLE: PUT. PUTTED non è il passato di PUT. HAVE PUT non va con questa data finita.","ja":"IN 1994 は終わった過去の時なので、PAST SIMPLE を使います：PUT。PUTTED は PUT の過去形ではありません。HAVE PUT はこの終わった日付には合いません。","pt":"IN 1994 é um tempo passado acabado, por isso usa-se o PAST SIMPLE: PUT. PUTTED não é o passado de PUT. HAVE PUT não serve com esta data acabada.","ru":"IN 1994 — законченное прошедшее время, поэтому берётся PAST SIMPLE: PUT. PUTTED не является прошедшей формой PUT. HAVE PUT не подходит к этой законченной дате.","zh":"IN 1994 是一个已经结束的过去时间，所以用 PAST SIMPLE：PUT。PUTTED 不是 PUT 的过去式。HAVE PUT 不适合这个已经结束的日期。"},"fbWrong":{"en":"The barrel still goes; you count two, and Tulloch counts you.","ar":"يذهب البرميل مع ذلك؛ تعدّين اثنين، ويعدّكِ تولوخ.","de":"Die Tonne geht trotzdem; du zählst zwei, und Tulloch zählt dich.","es":"El bidón se va igualmente; tú cuentas dos, y Tulloch te cuenta a ti.","fr":"Le baril part quand même ; tu comptes deux, et Tulloch te compte.","it":"Il bidone se ne va lo stesso; tu conti due, e Tulloch conta te.","ja":"それでも樽は落ちていきます。あなたは二つ数え、タロックはあなたを数えています。","pt":"O bidão vai na mesma; tu contas dois, e o Tulloch conta-te a ti.","ru":"Бочка всё равно уходит; ты считаешь до двух, а Таллох считает  che tossisce, una burrasca possibile da un momento all'altro e la costa a quindici miglia.","ja":"樽が二つ付いていて、エンジンは咳き込み、嵐はいつ来てもおかしくなく、岸は十五マイル先です。","pt":"Dois bidões nele, o motor a tossir, um temporal possível a qualquer momento e a costa a quinze milhas.","ru":"Две бочки на нём, двигатель кашляет, шторм возможен в любой момент, а берег в пятнадцати милях.","zh":"它身上两个浮桶，引擎咳个不停，风暴随时可能来，岸在十五英里外。"},{"en":"You go into the wheelhouse and pick up the VHF to call the coastguard for a bigger boat, and Tulloch comes in behind you and takes the handset out of your hand.","ar":"تدخلين غرفة القيادة وترفعين جهاز VHF لتطلبي من خفر السواحل قاربًا أكبر، فيدخل تولوخ خلفكِ ويأخذ السمّاعة من يدكِ.","de":"Du gehst ins Steuerhaus und nimmst das UKW-Funkgerät, um die Küstenwache um ein größeres Boot zu bitten, und Tulloch kommt hinter dir herein und nimmt dir das Mikrofon aus der Hand.","es":"Entras en el puente y coges el VHF para llamar a salvamento y pedir un barco más grande, y Tulloch entra detrás de ti y te quita el micrófono de la mano.","fr":"Tu entres dans la timonerie et tu prends la VHF pour appeler les gardes-côtes et demander un plus gros bateau, et Tulloch entre derrière toi et te prend le combiné des mains.","it":"Entri in timoneria e prendi il VHF per chiamare la guardia costiera e chiedere una barca più grande, e Tulloch entra dietro di te e ti toglie il microfono di mano.","ja":"あなたは操舵室に入り、もっと大きな船を頼もうとVHFを取って沿岸警備隊を呼ぼうとします。タロックが後ろから入ってきて、あなたの手から送話器を取り上げます。","pt":"Entras na casa do leme e pegas no VHF para chamar a guarda costeira e pedir um barco maior, e Tulloch entra atrás de ti e tira-te o microfone da mão.","ru":"Ты входишь в рубку и берёшь трубку УКВ-рации, чтобы вызвать береговую охрану и попросить судно побольше, а Таллох входит следом и вынимает трубку у тебя из руки.","zh":"你走进驾驶室，拿起 VHF 想呼叫海岸警卫队派一条大船，塔洛克跟在你后面进来，把话筒从你手里拿走了。"}],"k":{"en":"CHAPTER 3 · THE WRECK · MONDAY NIGHT","ar":"الفصل 3 · الحطام · ليلة الاثنين","de":"KAPITEL 3 · DAS WRACK · MONTAGNACHT","es":" ; WAS ne prend jamais BEEN.","it":"IT'S THE FIRST TIME prende il Present Perfect: HAVE BEEN. Il Present Continuous non può seguire THE FIRST TIME; WAS non prende mai BEEN.","ja":"IT'S THE FIRST TIME は Present Perfect を取ります：HAVE BEEN。THE FIRST TIME の後に Present Continuous は来られず、WAS が BEEN を取ることは決してありません。","pt":"IT'S THE FIRST TIME leva o Present Perfect: HAVE BEEN. O Present Continuous não pode vir depois de THE FIRST TIME; WAS nunca leva BEEN.","ru":"IT'S THE FIRST TIME требует Present Perfect: HAVE BEEN. Present Continuous не может стоять после THE FIRST TIME; WAS никогда не берёт BEEN.","zh":"IT'S THE FIRST TIME 要用 Present Perfect：HAVE BEEN。Present Continuous 不能跟在 THE FIRST TIME 后面；WAS 从不接 BEEN。"},"fbRight":{"en":"Vass, from the doorway: \"I have a handheld in my case. It has two miles of range. Nobody touch it.\"","ar":"فاس، من الباب: \"معي جهاز لاسلكي محمول في حقيبتي. مداه ميلان. لا يلمسه أحد.\"","de":"Vass, von der Tür: „Ich habe ein Handfunkgerät im Koffer. Es hat zwei Meilen Reichweite. Niemand fasst es an.“","es":"Vass, desde la puerta: “Tengo un VHF portátil en el maletín. Tiene dos millas de alcance. Que nadie lo toque.”","fr":"Vass, depuis la porte : « J'ai une radio portative dans ma mallette. Elle porte à deux milles. Que personne n'y touche. »","it":"Vass, dalla porta: «Ho una radio portatile nella valigetta. Ha due miglia di portata. Nessuno la tocchi.»","ja":"ヴァス、戸口から：「私のケースに携帯無線機がある。届くのは二マイル。誰も触らないで」","pt":"Vass, da porta: «Tenho um rádio portátil na mala. Tem duas milhas de alcance. Ninguém lhe toca.»","ru":"Васс, из дверей: «У меня в чемоданчике портативная рация. Дальность две мили. Никому не трогать.»","zh":"瓦丝，在门口：“我箱子里有一台手持对讲机。它有两英里的范围。谁也别碰它。”"},"fbWrong":{"en":"Vass says nothing about her handheld yet.","ar":"لا تقول فاس شيئًا عن جهازها المحمول بعد.","de":"Vass sagt noch nichts von ihrem Handfunkgerät.","es":"Vass todavía no dice nada de su VHF portátil.","fr":"Vass ne dit encore rien de sa radio portative.","it":"Vass non dice ancora niente d ry":[{"en":"Vass takes her yellow handheld out of the case. Two miles of range, too far from shore to call for help, but it can receive the stronger coastguard signal, and at eight o'clock the coastguard puts out a gale warning.","ar":"تُخرج فاس جهازها اللاسلكي المحمول الأصفر من الحقيبة. مداه ميلان، والشاطئ أبعد من أن تطلب به النجدة، لكنه يستطيع التقاط إشارة خفر السواحل الأقوى، وفي الثامنة يبثّ خفر السواحل تحذيرًا من عاصفة.","de":"Vass nimmt ihr gelbes Handfunkgerät aus dem Koffer. Zwei Meilen Reichweite, zu weit von der Küste, um Hilfe zu rufen, aber es kann das stärkere Signal der Küstenwache empfangen, und um acht Uhr gibt die Küstenwache eine Sturmwarnung heraus.","es":"Vass saca del maletín su VHF portátil amarillo. Dos millas de alcance, demasiado lejos de la costa para pedir ayuda, pero puede recibir la señal más potente de salvamento, y a las ocho salvamento emite un aviso de temporal.","fr":"Vass sort sa VHF portative jaune de la mallette. Deux milles de portée, trop loin de la côte pour appeler à l'aide, mais elle peut recevoir le signal plus puissant des gardes-côtes, et à huit heures les gardes-côtes diffusent un avis de coup de vent.","it":"Vass tira fuori dalla valigetta la sua radio portatile gialla. Due miglia di portata, troppo lontano dalla costa per chiedere aiuto, ma può ricevere il segnale più forte della guardia costiera, e alle otto la guardia costiera diffonde un avviso di burrasca.","ja":"ヴァスがケースから黄色い携帯無線機を取り出します。届くのは二マイルで、岸から遠すぎて助けは呼べませんが、沿岸警備隊の強い電波は受信できます。そして八時、沿岸警備隊が強風警報を出します。","pt":"Vass tira o rádio portátil amarelo da mala. Duas milhas de alcance, demasiado longe da costa para pedir ajuda, mas consegue receber o sinal mais forte da guarda costeira, e às oito a guarda costeira emite um aviso de temporal.","ru":"Васс достаёт из чемоданчика жёлтую портативную рацию. Дальность две мили, слишком далеко от берега, чтобы звать на помощь, но она ловит более мощный сигнал береговой охраны, и в восемь береговая охрана даёт предупреждение о шторме.","zh":"瓦丝从箱子里拿出她那台黄色的手持对讲机。两英里的范围，离岸太远，没法呼救，但它能收到海岸警卫队更强的信号，八点钟，海岸警卫队发布了大风警报。"},{"en":"Tulloch has been staring at the barrels for ten minutes and does not turn round.","ar":"يحدّق تولوخ في البراميل منذ عشر دقائق ولا يلتفت.","de":"Tulloch starrt seit zehn Minuten auf die Tonnen und dreht sich nicht um.","es":"Tulloch lleva diez minutos mirando fijamente los bidones y no se da la vuelta.","fr":"Tulloch fixe les barils depuis dix minutes et ne se retourne pas.","it":"Tulloch fissa i bidoni da dieci minuti e non si gira.","ja":"タロックは十分間ずっと樽を見つめていて、振り向きません。","pt":"Tulloch olha fixamente para os bidões há dez minutos e não se vira.","ru":"Таллох смотрит на бочки десять минут и не оборачивается.","zh":"塔洛克已经盯着浮桶看了十分钟，头也不回。"}],"k":{"en":"CHAPTER 1 · THE CAULDRON · TUESDAY","ar":"الفصل 1 · المِرجل · الثلاثاء","de":"KAPITEL 1 · DER KESSEL · DIENSTAG","es":"CAPÍTULO 1 · EL CALDERO · MARTES","fr":"CHAPITRE 1 · LE CHAUDRON · MARDI","it":"CAPITOLO 1 · IL CALDERONE · MARTEDÌ","ja":"第1章 · 大釜 · 火曜日","pt":"CAPÍTULO 1 · O CALDEIRÃO · TERÇA-FEIRA","ru":"ГЛАВА 1 · КОТЁЛ · ВТОРНИК","zh":"第1章 · 大锅 · 星期二"},"kind":"question","next":"choice3","prompt":{"en":"Tulloch: \"SOON is six to twelve hours. It's eight now. Earliest the gale, then?\"","ar":"تولوخ: \"SOON تعني من ست إلى اثنتي عشرة ساعة. الساعة الآن الثامنة. إذن ما أبكر وقت للعاصفة؟\"","de":"Tulloch: „SOON ist sechs bis zwölf Stunden. Jetzt ist es acht. Wann also frühestens der Sturm?“","es":"Tulloch: “SOON es de seis a doce horas. Ahora son las ocho. ¿Lo más pronto para el temporal, entonces?”","fr":"Tulloch : « SOON, c'est six à douze heures. Il est huit heures. Au plus tôt, le coup de vent, alors ? »","it":"Tulloch: «SOON è da sei a dodici ore. Adesso sono le otto. Allora, quando arriva la burrasca, al più presto?»","ja":"タロック：「SOON は六時間から十二時間だ。今は八時。じゃあ嵐は最も早くていつだ？」","pt":"Tulloch: «SOON é de seis a doze horas. Agora são oito. O mais cedo para o temporal, então?»","ru":"Таллох: «SOON — это от шести до двенадцати часов. Сейчас восемь. Значит, самое раннее для шторма?»","zh":"塔洛克：“SOON 是六到十二个小时。现在是八点。那风暴最早什么时候到？”"},"opts":[{"en":"Nine o'clock this morning"},{"en":"Two this afternoon"},{"en":"Eight o'clock tonight"}],"answer":1,"fb":{"en":"SOON means six to twelve hours after issue; six hours after 08:00 is 14:00. Eight tonight is the latest, not the earliest.","ar":"SOON تعني من ست إلى اثنتي عشرة ساعة بعد الإصدار؛ ست ساعات بعد 08:00 هي 14:00. الثامنة مساءً هي أقصى موعد، لا أبكره.","de":"SOON bedeutet sechs bis zwölf Stunden nach der Ausgabe; sechs Stunden nach 08:00 ist 14:00. Acht Uhr heute Abend ist das Späteste, nicht das Früheste.","es":"SOON significa de seis a doce horas después de la emisión; seis horas después de las 08:00 son las 14:00. Las ocho de esta noche es lo más tarde, no lo más pronto.","fr":"SOON veut dire de six à douze heures après l'émission ; six heures après 08h00, cela fait 14h00. Vingt heures ce soir, c'est le plus tard, pas le plus tôt.","it":"SOON vuol dire da sei a dodici ore dopo l'emissione; sei ore dopo le 08:00 sono le 14:00. Le otto di stasera sono il momento più tardi, non il più presto.","ja":"SOON は発表から六〜十二時間後という意味です。08:00の六時間後は14:00。今夜八時は最も遅い時刻で、最も早い時刻ではありません。","pt":"SOON quer dizer de seis a doze horas depois da emissão; seis horas depois das 08:00 são 14:00. As oito desta noite são o mais tarde, não o mais cedo.","ru":"SOON означает от шести до двенадцати часов после выпуска; шесть часов после 08:00 — это 14:00. Восемь вечера — это самое позднее, а не самое раннее.","zh":"SOON 指发布后六到十二小时；08:00 之后六小时是 14:00。今晚八点是最晚的时间，不是最早的。"},"fbRight":{"en":"Vass: \"And VEERING means it's going round to the southwest, which is straight into the Cauldron. We have six hours.\"","ar":"فاس: \"وVEERING تعني أنها تتحوّل إلى الجنوب الغربي، أي مباشرة نحو المِرجل. لدينا ست ساعات.\"","de":"Vass: „Und VEERING heißt, er dreht auf Südwest, und das geht direkt in den Kessel. Wir haben sechs Stunden.“","es":"Vass: “Y VEERING significa que está rolando al suroeste, que es directo hacia el Caldero. Tenemos seis horas.”","fr":"Vass : « Et VEERING veut dire qu'il tourne au sud-ouest, droit dans le Chaudron. On a six heures. »","it":"Vass: «E VEERING vuol dire che gira a sud-ovest, dritto nel Calderone. Abbiamo sei ore.»","ja":"ヴァス：「それに VEERING は、風が南西へ回るという意味。まっすぐ大釜に向かってくる。あと六時間よ」","pt":"Vass: «E VEERING quer dizer que está a rodar para sudoeste, direto ao Caldeirão. Temos seis horas.»","ru":"Васс: «А VEERING значит, что ветер заходит на юго-запад, прямо в Котёл. У нас шесть часов.»","zh":"瓦丝：“而 VEERING 的意思是风在转向西南，正对着大锅。我们有六个小时。”"},"fbWrong":{"en":"Vass takes the handheld back. \"We have less than you think.\"","ar":"تستعيد فاس الجهاز المحمول. \"لدينا أقل مما تظنين.\"","de":"Vass nimmt das Handfunkgerät wieder an sich. „Wir haben weniger, als du denkst.“","es":"Vass recupera el VHF portátil. “Tenemos menos de lo que crees.”","fr":"Vass reprend la radio portative. « On a moins que tu ne crois. »","it":"Vass si riprende la radio portatile. «Ne abbiamo meno di quanto pensi.»","ja":"ヴァスは携帯無線機を取り返します。「時間はあなたが思っているより少ないわ」","pt":"Vass volta a pegar no rádio portátil. «Temos menos do que pensas.»","ru":"Васс забирает рацию обратно. «У нас меньше, чем ты думаешь.»","zh":"瓦丝把对讲机拿了回来。“我们的时间比你以为的少。”"},"clue":[{"en":"You hear — Stornoway Coastguard, gale warning, issued 08:00: \"Malin, Hebrides. Southerly gale 8 expected soon, veering southwesterly · severe gale 9 later.\"","ar":"تسمعين — خفر سواحل ستورنوي، تحذير من عاصفة، صادر 08:00: \"مالين، الهبريدز. عاصفة جنوبية 8 متوقعة قريبًا، تتحوّل إلى جنوبية غربية · عاصفة شديدة 9 لاحقًا.\"","de":"Du hörst — Küstenwache Stornoway, Sturmwarnung, herausgegeben 08:00: „Malin, Hebriden. Südlicher Sturm 8 bald erwartet, später auf Südwest drehend · schwerer Sturm 9.“","es":"Oyes — Salvamento de Stornoway, aviso de temporal, emitido a las 08:00: “Malin, Hébridas. Se espera temporal del sur 8 pronto, rolando al suroeste · temporal fuerte 9 más tarde.”","fr":"Tu entends — Gardes-côtes de Stornoway, avis de coup de vent, émis à 08h00 : « Malin, Hébrides. Coup de vent de sud 8 attendu bientôt, virant au sud-ouest · fort coup de vent 9 plus tard. »","it":"Senti — Guardia Costiera di Stornoway, avviso di burrasca, emesso alle 08:00: «Malin, Ebridi. Burrasca da sud 8 attesa presto, in rotazione a sud-ovest · burrasca forte 9 più tardi.»","ja":"聞こえる——ストーノウェイ沿岸警備隊、強風警報、08:00発表：「マリン、ヘブリディーズ。南の強風8がまもなく吹く見込み、南西に変わり · のち大強風9」","pt":"Ouves — Guarda Costeira de Stornoway, aviso de temporal, emitido às 08:00: «Malin, Hébridas. Temporal de sul 8 esperado em breve, rodando para sudoeste · temporal forte 9 mais tarde.»","ru":"Ты слышишь — береговая охрана Сторновей, предупреждение о шторме, выпущено в 08:00: «Малин, Гебриды. Южный шторм 8 ожидается вскоре, с поворотом на юго-запад · сильный шторм 9 позже.»","zh":"你听到——斯托诺韦海岸警卫队，大风警报，08:00 发布：“马林、赫布里底。预计很快有8级南风，转西南风 · 稍后9级烈风。”"}]},"choice3":{"img":"45_choice3_cauldron.webp","hot":[82.0,72.0,12.0,16.0],"title":{"en":"THE CAULDRON","ar":"المِرجل","de":"DER KESSEL","es":"EL CALDERO","fr":"LE CHAUDRON","it":"IL CALDERONE","ja":"大釜","pt":"O CALDEIRÃO","ru":"КОТЁЛ","zh":"大锅"},"story":[{"en":"The engine is dead. The boat is drifting towards the Cauldron. The thing is waiting for you there with three barrels on it.","ar":"المحرّك معطّل. القارب ينجرف نحو المِرجل. والشيء ينتظركم هناك وعليه ثلاثة براميل.","de":"Der Motor ist tot. Das Boot treibt auf den Kessel zu. Das Ding wartet dort auf euch, mit drei Tonnen daran.","es":"El motor está muerto. El barco va a la deriva hacia el Caldero. La cosa te está esperando allí con tres bidones puestos.","fr":"Le moteur est mort. Le bateau dérive vers le Chaudron. La chose vous y attend avec trois barils sur elle.","it":"Il motore è morto. La barca va alla deriva verso il Calderone. La cosa vi aspetta là con tre bidoni addosso.","ja":"エンジンは死んでいます。船は大釜のほうへ流されています。あいつが樽を三つ付けたまま、そこであなたたちを待っています。","pt":"O motor está morto. O barco vai à deriva para o Caldeirão. A coisa está à vossa espera lá com três bidões nela.","ru":"Двигатель мёртв. Лодку несёт к Котлу. Тварь ждёт вас там с тремя бочками на себе.","zh":"引擎坏了。船正漂向大锅。那东西带着三个浮桶在那里等你们。"}],"kind":"choice","routes":[{"name":{"en":"THE CAGE","ar":"القفص","de":"DER KÄFIG","es":"LA JAULA","fr":"LA CAGE","it":"LA GABBIA","ja":"檻","pt":"A JAULA","ru":"КЛЕТКА","zh":"笼子"},"desc":{"en":"Lower Vass in the steel cage. She will try to tag the animal and find its heart.","ar":"أنزلي فاس في القفص الفولاذي. ستحاول وسم الحيوان والعثور على قلبه.","de":"Vass im Stahlkäfig hinablassen. Sie wird versuchen, das Tier zu markieren und sein Herz zu finden.","es":"Bajar a Vass en la jaula de acero. Intentará marcar al animal y encontrarle el corazón.","fr":"Descendre Vass dans la cage d'acier. Elle essaiera de marquer l'animal et de trouver son cœur.","it":"Calare Vass nella gabbia d'acciaio. Proverà a marcare l'animale e a trovargli il cuore.","ja":"ヴァスを鋼の檻に入れて沈める。彼女は動物に標識を付け、心臓を見つけようとする。","pt":"Descer Vass na jaula de aço. Vai tentar marcar o animal e encontrar-lhe o coração.","ru":"Спустить Васс в стальной клетке. Она попробует пометить животное и найти его сердце.","zh":"把瓦丝放进钢笼子里沉下去。她会设法给那动物打上标记，找到它的心脏。"},"target":"3.5a","route":"THE CAGE"},{"name":{"en":"THE SHALLOWS","ar":"المياه الضحلة","de":"DAS FLACHWASSER","es":"LOS BAJÍOS","fr":"LES HAUTS-FONDS","it":"LE SECCHE","ja":"浅瀬","pt":"OS BAIXIOS","ru":"МЕЛКОВОДЬЕ","zh":"浅水区"},"desc":{"en":"Get a line on the barrels and tow the animal onto the skerry shelf.","ar":"اربطي حبلًا بالبراميل واسحبي الحيوان إلى جرف الصخرة البحرية.","de":"Eine Leine an die Tonnen bekommen und das Tier auf die Schärenbank schleppen.","es":"Enganchar un cabo a los bidones y remolcar al animal hasta la plataforma del islote.","fr":"Passer une ligne sur les barils et remorquer l'animal sur le plateau du récif.","it":"Passare una cima sui bidoni e rimorchiare l'animale sul pianoro dello scoglio.","ja":"樽にロープをかけ、動物を岩礁の浅瀬まで引いていく。","pt":"Pôr uma linha nos bidões e rebocar o animal para o baixio do ilhéu.","ru":"Завести линь на бочки и отбуксировать животное на отмель у шхеры.","zh":"把一根缆绳系到浮桶上，把那动物拖到礁石的浅滩上。"},"target":"3.5b","route":"THE SHALLOWS"}]},"3.5a":{"img":"46_q5a_cage.webp","hot":[75.0,48.0,12.0,16.0],"title":{"en":"THE CAGE","ar":"القفص","de":"DER KÄFIG","es":"LA JAULA","fr":"LA CAGE","it":"LA GABBIA","ja":"檻","pt":"A JAULA","ru":"КЛЕТКА","zh":"笼子"},"k":{"en":"CHAPTER 2 · THE CAGE · TUESDAY","ar":"الفصل 2 · القفص · الثلاثاء","de":"KAPITEL 2 · DER KÄFIG · DIENSTAG","es":"CAPÍTULO 2 · LA JAULA · MARTES","fr":"CHAPITRE 2 · LA CAGE · MARDI","it":"CAPITOLO 2 · LA GABBIA · MARTEDÌ","ja":"第2章 · 檻 · 火曜日","pt":"CAPÍTULO 2 · A JAULA · TERÇA-FEIRA","ru":"ГЛАВА 2 · КЛЕТКА · ВТОРНИК","zh":"第2章 · 笼子 · 星期二"},"kind":"question","next":"3.6a","prompt":{"en":"Tulloch: \"___ in a cage with one of these?\"","ar":"تولوخ: \"___ في قفص مع واحد من هذه؟\"","de":"Tulloch: „___ in einem Käfig mit so einem?“","es":"Tulloch: “¿___ en una jaula con uno de estos?”","fr":"Tulloch : « ___ dans une cage avec un de ces trucs ? »","it":"Tulloch: «___ in una gabbia con uno di questi?»","ja":"タロック：「こいつと一緒に檻に___？」","pt":"Tulloch: «___ numa jaula com um destes?»","ru":"Таллох: «___ в клетке с таким?»","zh":"塔洛克：“___和这种东西一起待在笼子里？”"},"opts":[{"en":"Did you ever been in"},{"en":"Have you ever being"},{"en":"Have you ever been"}],"answer":2,"fb":{"en":"EVER goes in a Present Perfect question: HAVE + subject + EVER + BEEN. DID never takes BEEN; HAVE takes the participle, not BEING.","ar":"EVER تأتي في سؤال Present Perfect: HAVE + الفاعل + EVER + BEEN. DID لا تأخذ BEEN أبدًا؛ وHAVE تأخذ اسم المفعول لا BEING.","de":"EVER steht in einer Frage im Present Perfect: HAVE + Subjekt + EVER + BEEN. DID nimmt nie BEEN; HAVE nimmt das Partizip, nicht BEING.","es":"EVER va en una pregunta en Present Perfect: HAVE + sujeto + EVER + BEEN. DID nunca lleva BEEN; HAVE lleva el participio, no BEING.","fr":"EVER se place dans une question au Present Perfect : HAVE + sujet + EVER + BEEN. DID ne prend jamais BEEN ; HAVE prend le participe, pas BEING.","it":"EVER va in una domanda al Present Perfect: HAVE + soggetto + EVER + BEEN. DID non prende mai BEEN; HAVE prende il participio, non BEING.","ja":"EVER は Present Perfect の疑問文に入ります：HAVE + 主語 + EVER + BEEN。DID が BEEN を取ることは決してなく、HAVE は過去分詞を取り、BEING ではありません。","pt":"EVER vai numa pergunta no Present Perfect: HAVE + sujeito + EVER + BEEN. DID nunca leva BEEN; HAVE leva o particípio, não BEING.","ru":"EVER стоит в вопросе в Present Perfect: HAVE + подлежащее + EVER + BEEN. DID никогда не берёт BEEN; HAVE берёт причастие, а не BEING.","zh":"EVER 用于 Present Perfect 疑问句：HAVE + 主语 + EVER + BEEN。DID 从不接 BEEN；HAVE 接过去分词，不接 BEING。"},"fbRight":{"en":"The cage goes over the side with Vass in it.","ar":"يُنزَل القفص من فوق الحافة وفيه فاس.","de":"Der Käfig geht über Bord, mit Vass darin.","es":"La jaula baja por la borda con Vass dentro.","fr":"La cage passe par-dessus bord avec Vass dedans.","it":"La gabbia va fuori bordo con Vass dentro.","ja":"ヴァスを乗せたまま、檻が舷の外へ下ろされます。","pt":"A jaula vai pela borda fora com Vass lá dentro.","ru":"Клетка уходит за борт, и Васс в ней.","zh":"笼子载着瓦丝翻过船舷沉了下去。"},"fbWrong":{"en":"The cage goes over anyway. Vass did not wait for your English.","ar":"يُنزَل القفص رغم ذلك. لم تنتظر فاس إنجليزيّتكِ.","de":"Der Käfig geht trotzdem über Bord. Vass hat nicht auf dein Englisch gewartet.","es":"La jaula baja de todos modos. Vass no esperó a tu inglés.","fr":"La cage passe quand même par-dessus bord. Vass n'a pas attendu ton anglais.","it":"La gabbia va fuori bordo lo stesso. Vass non ha aspettato il tuo inglese.","ja":"それでも檻は下ろされます。ヴァスはあなたの英語を待ちませんでした。","pt":"A jaula vai pela borda fora na mesma. Vass não esperou pelo teu inglês.","ru":"Клетка всё равно уходит за борт. Васс не стала ждать твоего английского.","zh":"笼子还是下去了。瓦丝没有等你的英语。"},"pages":[{"t":"story","b":{"en":"The cage is a steel creel cage the size of a phone box, welded shut on five sides.","ar":"القفص قفص صيد فولاذي بحجم كشك الهاتف، ملحوم ومغلق من خمس جهات.","de":"Der Käfig ist ein Stahlreusenkäfig von der Größe einer Telefonzelle, auf fünf Seiten zugeschweißt.","es":"La jaula es una jaula de acero para nasas del tamaño de una cabina de teléfono, soldada por cinco lados.","fr":"La cage est une cage à casiers en acier de la taille d'une cabine téléphonique, soudée sur cinq faces.","it":"La gabbia è una gabbia d'acciaio da nasse grande come una cabina telefonica, saldata su cinque lati.","ja":"檻は電話ボックスほどの大きさの、鋼のかご型の檻で、五面が溶接でふさがれています。","pt":"A jaula é uma jaula de aço para covos do tamanho de uma cabine telefónica, soldada de cinco lados.","ru":"Клетка — это стальная клеть вроде крабовой ловушки, размером с телефонную будку, заваренная с пяти сторон.","zh":"那笼子是一个钢制的蟹笼式笼子，有电话亭那么大，五面都焊死了。"},"img":"46_q5a_cage.webp","hot":[75.0,48.0,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"Vass is in a drysuit with a diving mask and a tank on her back and a two-metre tag pole, and she is talking fast, the way people do when they are frightened and have decided anyway.","ar":"ترتدي فاس بدلة غوص جافة وقناع غوص وعلى ظهرها أسطوانة، ومعها عصا وسم طولها متران، وتتكلّم بسرعة، كما يفعل الناس حين يكونون خائفين وقد حسموا أمرهم رغم ذلك.","de":"Vass trägt einen Trockenanzug mit Tauchmaske, eine Flasche auf dem Rücken und eine zwei Meter lange Markierungsstange, und sie redet schnell, so wie Menschen reden, die Angst haben und sich trotzdem entschieden haben.","es":"Vass lleva un traje seco, máscara de buceo, una botella a la espalda y una pértiga de marcaje de dos metros, y habla deprisa, como habla la gente cuando tiene miedo y ha decidido hacerlo igualmente.","fr":"Vass est en combinaison étanche, masque de plongée, bouteille sur le dos et perche de marquage de deux mètres, et elle parle vite, comme parlent les gens qui ont peur et qui ont décidé quand même.","it":"Vass è in muta stagna con maschera da sub, una bombola sulla schiena e un'asta da marcatura di due metri, e parla in fretta, come parla la gente che ha paura e ha deciso lo stesso.","ja":"ヴァスはドライスーツにダイビングマスク、背中にタンク、二メートルの標識棒を持ち、早口で話しています。怖くても、それでも決めてしまった人がそうするように。","pt":"Vass está de fato estanque com máscara de mergulho, uma garrafa às costas e uma vara de marcação de dois metros, e fala depressa, como fala quem tem medo e decidiu à mesma.","ru":"Васс в сухом гидрокостюме, с маской, баллоном за спиной и двухметровым шестом для метки, и говорит быстро, как говорят люди, которым страшно и которые всё равно решились.","zh":"瓦丝穿着干式潜水服，戴着潜水面罩，背着气瓶，拿着一根两米长的标记杆，她说话很快，就像人们害怕了却还是下定决心时那样。"},"img":"46_q5a_cage.webp","hot":[75.0,48.0,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"You hear: Tulloch: \"___ in a cage with one of these?\" Vass: \"No. Nobody has. That's rather the point.\"","ar":"تسمعين: تولوخ: \"___ في قفص مع واحد من هذه؟\" فاس: \"لا. لم يفعلها أحد. وهذا بالضبط بيت القصيد.\"","de":"Du hörst: Tulloch: „___ in einem Käfig mit so einem?“ Vass: „Nein. Niemand. Das ist ja gerade der Punkt.“","es":"Oyes: Tulloch: “¿___ en una jaula con uno de estos?” Vass: “No. Nadie lo ha hecho. De eso se trata precisamente.”","fr":"Tu entends : Tulloch : « ___ dans une cage avec un de ces trucs ? » Vass : « Non. Personne. C'est justement là tout l'intérêt. »","it":"Senti: Tulloch: «___ in una gabbia con uno di questi?» Vass: «No. Nessuno. È proprio questo il punto.»","ja":"聞こえる：タロック：「こいつと一緒に檻に___？」ヴァス：「いいえ。誰もないわ。だからこそよ」","pt":"Ouves: Tulloch: «___ numa jaula com um destes?» Vass: «Não. Ninguém. É precisamente essa a questão.»","ru":"Ты слышишь: Таллох: «___ в клетке с таким?» Васс: «Нет. Никто. В этом и смысл.»","zh":"你听到：塔洛克：“___和这种东西一起待在笼子里？”瓦丝：“没有。谁都没有。这正是关键。”"},"img":"46_q5a_cage.webp","hot":[75.0,48.0,12.0,16.0],"label":{"en":"YOU HEAR","ar":"تسمعين","de":"DU HÖRST","es":"OYES","fr":"TU ENTENDS","it":"SENTI","ja":"聞こえる","pt":"OUVES","ru":"ТЫ СЛЫШИШЬ","zh":"你听到"}},{"t":"story","b":{"en":"Vass, to you: \"Listen. If the cage comes up empty, don't wait for me. I'll have gone down to the kelp. I've got forty minutes of air. Finish it, and then come back for me.\"","ar":"فاس، لكِ: \"اسمعي. إذا صعد القفص فارغًا، فلا تنتظريني. سأكون قد نزلت إلى الأعشاب البحرية. معي أربعون دقيقة من الهواء. أنهي الأمر، ثم عودي من أجلي.\"","de":"Vass, zu dir: „Hör zu. Wenn der Käfig leer hochkommt, warte nicht auf mich. Dann bin ich hinunter zum Tang. Ich habe vierzig Minuten Luft. Bring es zu Ende, und dann komm mich holen.“","es":"Vass, a ti: “Escucha. Si la jaula sube vacía, no me esperes. Habré bajado a las algas. Tengo cuarenta minutos de aire. Termínalo, y luego vuelve a por mí.”","fr":"Vass, à toi : « Écoute. Si la cage remonte vide, ne m'attends pas. C'est que je serai descendue dans le varech. J'ai quarante minutes d'air. Finis-en, et reviens me chercher après. »","it":"Vass, a te: «Ascolta. Se la gabbia risale vuota, non aspettarmi. Vuol dire che sono scesa nelle alghe. Ho quaranta minuti d'aria. Finiscilo, e poi torna a prendermi.»","ja":"ヴァス、あなたに：「聞いて。檻が空で上がってきても、私を待たないで。海藻の森まで潜っているはずだから。空気は四十分ある。まずあれを仕留めて、それから私を迎えに来て」","pt":"Vass, para ti: «Ouve. Se a jaula subir vazia, não esperes por mim. É porque desci até às algas. Tenho quarenta minutos de ar. Acaba com aquilo, e depois volta para me buscar.»","ru":"Васс, тебе: «Слушай. Если клетка поднимется пустой, не жди меня. Значит, я ушла вниз, в ламинарии. У меня сорок минут воздуха. Закончи дело, а потом вернись за мной.»","zh":"瓦丝，对你说：“听着。如果笼子空着上来，别等我。那说明我已经下到海带林里了。我有四十分钟的空气。先把它解决掉，然后再回来找我。”"},"img":"46_q5a_cage.webp","hot":[75.0,48.0,12.0,16.0],"label":{"en":"YOU HEAR","ar":"تسمعين","de":"DU HÖRST","es":"OYES","fr":"TU ENTENDS","it":"SENTI","ja":"聞こえる","pt":"OUVES","ru":"ТЫ СЛЫШИШЬ","zh":"你听到"}},{"t":"story","b":{"en":"The cable tightens. Vass lowers her mask, takes the regulator in her mouth, and grips the tag pole. The mesh door is shut and latched. The surface closes above the cage.","ar":"يشتدّ الكابل. تُنزل فاس قناعها، وتضع منظّم التنفّس في فمها، وتقبض على عصا الوسم. الباب الشبكي مغلق ومقفل. ينغلق سطح الماء فوق القفص.","de":"Das Kabel wird stramm. Vass setzt die Maske auf, nimmt den Atemregler in den Mund und greift die Markierungsstange. Die Gittertür ist zu und verriegelt. Die Oberfläche schließt sich über dem Käfig.","es":"El cable se tensa. Vass se baja la máscara, se mete el regulador en la boca y agarra la pértiga de marcaje. La puerta de malla está cerrada y con el pestillo echado. La superficie se cierra sobre la jaula.","fr":"Le câble se tend. Vass abaisse son masque, met le détendeur en bouche et empoigne la perche de marquage. La porte grillagée est fermée et verrouillée. La surface se referme au-dessus de la cage.","it":"Il cavo si tende. Vass abbassa la maschera, mette in bocca l'erogatore e stringe l'asta da marcatura. Lo sportello di rete è chiuso e bloccato. La superficie si richiude sopra la gabbia.","ja":"ケーブルが張ります。ヴァスはマスクを下ろし、レギュレーターをくわえ、標識棒を握ります。網の扉は閉じられ、掛け金がかかっています。檻の上で水面が閉じます。","pt":"O cabo estica. Vass baixa a máscara, mete o regulador na boca e agarra a vara de marcação. A porta de rede está fechada e trancada. A superfície fecha-se por cima da jaula.","ru":"Трос натягивается. Васс опускает маску, берёт в рот загубник и сжимает шест для метки. Сетчатая дверь закрыта и защёлкнута. Поверхность смыкается над клеткой.","zh":"缆绳绷紧。瓦丝拉下面罩，把呼吸调节器含进嘴里，握紧标记杆。网门关好并扣上了。水面在笼子上方合拢。"},"img":"insert_cage_descent.webp","hot":[66.0,35.0,14.0,20.0],"label":{"en":"THE DESCENT","ar":"النزول","de":"DER ABSTIEG","es":"EL DESCENSO","fr":"LA DESCENTE","it":"LA DISCESA","ja":"潜降","pt":"A DESCIDA","ru":"СПУСК ПОД ВОДУ","zh":"下潜"}}],"askImg":"insert_cage_descent.webp","askHot":[66.0,35.0,14.0,20.0]},"3.6a":{"img":"47_q6a_bubbles.webp","hot":[80.0,61.0,12.0,16.0],"title":{"en":"THE TAG","ar":"الوسم","de":"DIE MARKIERUNG","es":"LA MARCA","fr":"LA MARQUE","it":"LA MARCATURA","ja":"標識","pt":"A MARCA","ru":"МЕТКА","zh":"标记"}
