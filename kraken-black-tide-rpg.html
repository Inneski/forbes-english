--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;

--accent:#efbb64;--accent-ink:#10222c;--deep:#08131c;--panel:rgba(8,19,28,.88);--scrim:rgba(8,19,28,.88);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55);
/* The scale unit. Every size below was authored as a fraction of a 16:9
   frame's width, so on a wider window the type outgrew the panel and the
   options fell below the fold. 1vw and 1.7778vh are equal at 16:9, so this
   changes nothing there and only ever caps, never enlarges. The frame is
   the viewport (.game is fixed inset:0), which is why vw/vh and not cqw. */
--u:min(1vw,1.7778vh)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* opt-in, per lesson: show the whole plate, letterboxed in the deep colour */
.fit-contain .scene-img{object-fit:contain}

/* The three utilities sit as bare icons and give their words back on hover or
   keyboard focus. Three labelled buttons across the top of a painted frame is
   a lot of furniture over somebody's artwork, and the keys (L, S, F) and the
   corner help line already say what they do. The label is collapsed by width
   rather than removed, so it stays in the accessibility tree and a screen
   reader still reads "SOUND OFF". */

@media(hover:none){.u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}}.lang-btn b{color:var(--accent)}
.utility:hover,.lang-btn:hover{border-color:var(--bone)}

/* A cover is a strip at the foot of the frame, with the panel fading up out of
   the picture instead of sitting on it as a box. The plate is the title
   screen; this is the caption under it.

   The foot is forced; the SIDE is not. Forcing both buried the cover marker on
   four of seven adventures — 43% on Frankenstein Part I, 37% on Sherlock —
   because a centred strip is ~64% of the zone and most cover objects sit near
   the middle. `pos` already carries each lesson's answer to that (Part I is
   `left`, Part II is `right`, both chosen against a measurement), so the
   strip honours it and centres only where the scene asks to be centred. */
.is-cover .zone{align-items:flex-end!important;bottom:16%}
.is-cover .content{width:auto!important;max-width:64%;margin:0!important;text-align:center;align-items:center;
  /* The scrim reaches full strength well above the first line of text. It used
     to start fading in at 42%, which put the kicker — accent colour, smallest
     type — on bare artwork: unreadable over snow on Part I and ice on Part II.
     The bottom padding clears the corner help bar, which the spec line used to
     sit on top of by 5-14px depending on how long that line is. */

  padding:calc(3.4 * var(--u)) calc(2.4 * var(--u)) calc(1.2 * var(--u));gap:calc(.5 * var(--u))}

.center .zone{justify-content:center}.center .content{width:64%;text-align:center}
.v-top .zone{align-items:flex-start}.v-center .zone{align-items:center}.v-bottom .zone{align-items:flex-end}
/* ── `band`: a wide, shallow strip across the foot of the frame ──
   A side panel assumes the picture has an empty side. Wonderland's plates are
   crowd scenes — Alice stands in the middle and the supporting cast fills both
   edges — so 46% of the width buried a named character on eighteen of thirty-
   five screens, and on the pink/blue contrast plates it covered half of the
   very thing the question compares. A band reads across instead of down: the
   prose in one column, the options in the other, so it is roughly a third of
   the height a stacked panel needs and the upper two thirds of the picture
   stay visible. Innes asked for it on the first fork on 2026-09-16 ("bottom
   central and more streamlined or in two parts") and it answers the occlusion
   everywhere else too.

   It comes after the .v-* rules on purpose: same specificity, so the foot wins
   whatever `v` the scene carries. A band scene's hotspot must sit above ~60%
   of the picture — check-rpg-panels.js measures that. */
.band .zone{justify-content:center;align-items:flex-end}
.band .content{text-align:left;display:grid;grid-template-columns:1.12fr 1fr;align-items:end;
  column-gap:calc(2 * var(--u));row-gap:calc(.3 * var(--u));margin-bottom:calc(1.6 * var(--u));
  padding:calc(1 * var(--u)) calc(1.3 * var(--u))}

.band-text,.band-act{display:flex;flex-direction:column;gap:calc(.6 * var(--u));min-width:0}
.band .continue,.band .start,.band .restart{align-self:flex-start}
/* The even split above is for a question, where the prompt and three options
   weigh about what the story does. The other kinds are lopsided.

   A story screen is prose and one button, so the button column shrinks to the
   button and the prose takes the whole strip: the same paragraph in a 64% column
   runs seven lines and in an 88% one runs five, and a band is only worth having
   while it stays shallow. The cap stops a long button label ("HELP ALICE STOP
   THE WARDEN") from taking a third of the strip back. */
.band.k-story:not(.has-rules) .content{grid-template-columns:1fr auto}.band.k-story:not(.has-rules) .band-act{max-width:calc(17 * var(--u))}
/* has-rules comes last: a story screen that carries a grammar table (the cake
   briefing) is a rules screen in everything but name, and the prose ratio
   squeezed the table into a column too narrow to read. */
.band.k-rules .content{grid-template-columns:1fr 2.4fr}
.band.has-rules:not(.k-rules) .content{grid-template-columns:1fr 1.6fr}
.band.k-choice .content{grid-template-columns:1.3fr 1fr}

<script>
/* Block Camp save file.
   One localStorage record shared by every camp page: the RPGs write a result
   at each ending, the tense decks write how far the learner paged, and the
   overworld (block-camp/quest.html) reads all of it back as a game.

   The engine (lesson-template/build/rpg/rpg.py) inlines this file into every
   RPG it builds, so a page stays one self-contained file; the hand-built
   adventures and the decks load it with <script src>. Either way the API is
   window.CampSave and every call is guarded — a browser with storage blocked
   just plays the lesson as before.

   Page ids are the file name without .html, so an RPG is 'lost-yellow-road-rpg'
   and a deck is 'blockcamp-past-simple'. The overworld maps those ids onto
   camps with the same tables the hub builder uses.

   Format (v1):
     { v:1, name:'', created, updated, last:{id,href,title,kind,at},
       rpg:  { id: { plays, last, parts: { chapter: {best,max,tiles,tilesMax,cleared,master,endings:{id:n}} } } },
       deck: { id: { plays, seen, total, done, last } } }
   'parts' is keyed by chapter index for a page that holds several games
   (the Kraken saga); every other RPG has one part, keyed '0'. */
(function () {
  var KEY = 'forbes-camp-save', V = 1, MAGIC = 'BLOCKCAMP1:';

  function pageId() {
    var p = (location.pathname || '').split('/').pop() || '';
    try { p = decodeURIComponent(p); } catch (_) {}
    return p.replace(/\.html?$/i, '') || 'index';
  }
  function blank() { return { v: V, name: '', created: Date.now(), updated: Date.now(), last: null, rpg: {}, deck: {} }; }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === V && s.rpg && s.deck) return s; } catch (_) {}
    return blank();
  }
  function store(s) {
    s.updated = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (_) {}
    try { window.dispatchEvent(new CustomEvent('campsave', { detail: s })); } catch (_) {}
    return s;
  }
  function touch(s, kind) {
    s.last = { id: pageId(), href: location.pathname.split('/').pop() || location.href, dir: /\/block-camp\//.test(location.pathname) ? 'block-camp' : '',
               title: (document.title || '').replace(/\s*\|.*$/, ''), kind: kind, at: Date.now() };
  }

  var CampSave = {
    KEY: KEY, id: pageId, load: load,

    /* every camp page calls this once on load: it is what "Continue" points at */
    visit: function (kind) { var s = load(); touch(s, kind || 'page'); return store(s); },

    /* an RPG calls this from its ending scene */
    rpgEnd: function (r) {
      var s = load(), id = pageId(), e = s.rpg[id] || (s.rpg[id] = { plays: 0, parts: {} });
      var k = String(r.chapter == null ? 0 : r.chapter), p = e.parts[k] || (e.parts[k] = { best: 0, max: 0, tiles: 0, tilesMax: 0, cleared: false, master: false, endings: {} });
      e.plays += 1; e.last = Date.now();
      p.max = Math.max(p.max, r.max || 0); p.tilesMax = Math.max(p.tilesMax, r.tilesMax || 0);
      if ((r.score || 0) >= p.best) { p.best = r.score || 0; p.tiles = Math.max(p.tiles, r.tiles || 0); }
      p.tiles = Math.max(p.tiles, r.tiles || 0);
      if (r.cleared) p.cleared = true;
      if (r.master) p.master = true;
      if (r.ending) p.endings[r.ending] = (p.endings[r.ending] || 0) + 1;
      touch(s, 'rpg');
      return store(s);
    },

    /* a deck calls this from show(): how far the learner has paged */
    deck: function (idx, total) {
      var s = load(), id = pageId(), e = s.deck[id] || (s.deck[id] = { plays: 0, seen: 0, total: 0 });
      if (idx === 0 && e.seen === 0) e.plays += 1;
      e.seen = Math.max(e.seen, (idx | 0) + 1); e.total = total | 0; e.done = e.total > 0 && e.seen >= e.total; e.last = Date.now();
      touch(s, 'deck');
      return store(s);
    },

    /* a page with state of its own (the village's rangers met) keeps it
       under its own key, so the record grows without a format bump */
    get: function (key) { var s = load(); return s[key] == null ? null : s[key]; },
    put: function (key, val) { var s = load(); s[key] = val; return store(s); },

    setName: function (name) { var s = load(); s.name = String(name || '').slice(0, 24); return store(s); },
    reset: function () { try { localStorage.removeItem(KEY); } catch (_) {} return store(blank()); },

    /* a save moves between browsers as one line of text */
    exportText: function () { try { return MAGIC + btoa(unescape(encodeURIComponent(JSON.stringify(load())))); } catch (_) { return ''; } },
    importText: function (t) {
      t = String(t || '').trim(); if (t.indexOf(MAGIC) !== 0) return null;
      try { var s = JSON.parse(decodeURIComponent(escape(atob(t.slice(MAGIC.length))))); if (s && s.v === V && s.rpg && s.deck) return store(s); } catch (_) {}
      return null;
    },

    /* scores every RPG on a common scale, whatever its own point ladder:
       0–100 for the best run, 25 a tile, 50 for clearing it, 50 more for the
       master ending. A deck is 50 read to the end, pro rata before that. */
    rpgXp: function (e) {
      var xp = 0; if (!e) return 0;
      Object.keys(e.parts).forEach(function (k) { var p = e.parts[k];
        xp += p.max ? Math.round(100 * p.best / p.max) : 0; xp += 25 * (p.tiles || 0); if (p.cleared) xp += 50; if (p.master) xp += 50; });
      return xp;
    },
    deckXp: function (e) { if (!e || !e.total) return 0; return e.done ? 50 : Math.round(50 * e.seen / e.total); },
    xp: function (s) {
      s = s || load(); var t = 0, self = this;
      Object.keys(s.rpg).forEach(function (k) { t += self.rpgXp(s.rpg[k]); });
      Object.keys(s.deck).forEach(function (k) { t += self.deckXp(s.deck[k]); });
      return t;
    }
  };
  window.CampSave = CampSave;
})();

8.5,70.2,12.0,16.0],"title":{"en":"THE NARROWS","ar":"المضائق","de":"DIE ENGEN","es":"LOS ESTRECHOS","fr":"LES ÉTROITS","it":"GLI STRETTI","ja":"狭水道","pt":"OS ESTREITOS","ru":"ТЕСНИНЫ","zh":"窄峡"},"story":[{"en":"Ten o'clock, and the light has almost gone. Davie Lennox and his nephew Tam are hauling creels at the mouth of the Narrows, where the deep water starts.","ar":"الساعة العاشرة، وقد كاد الضوء يختفي. ديفي لينوكس وابن أخيه تام يسحبان أقفاص الصيد عند مدخل المضائق، حيث تبدأ المياه العميقة.","de":"Zehn Uhr, und das Licht ist fast weg. Davie Lennox und sein Neffe Tam holen Reusen ein an der Mündung der Engen, wo das tiefe Wasser beginnt.","es":"Las diez, y casi no queda luz. Davie Lennox y su sobrino Tam recogen nasas en la boca de los Estrechos, donde empieza el agua profunda.","fr":"Dix heures, et la lumière a presque disparu. Davie Lennox et son neveu Tam relèvent des casiers à l'entrée des Étroits, là où commence l'eau profonde.","it":"Le dieci, e la luce se n'è quasi andata. Davie Lennox e suo nipote Tam stanno tirando su le nasse all'imboccatura degli Stretti, dove comincia l'acqua profonda.","ja":"夜十時、光はほとんど消えています。デイヴィ・レノックスと甥のタムは、深い水が始まる狭水道の入り口でかごを引き上げています。","pt":"Dez horas, e a luz quase desapareceu. Davie Lennox e o sobrinho Tam estão a alar covos à boca dos Estreitos, onde começa a água funda.","ru":"Десять часов, света почти не осталось. Дэви Леннокс и его племянник Там выбирают ловушки у входа в Теснины, там, где начинается глубокая вода.","zh":"晚上十点，天光几乎消失了。戴维·伦诺克斯和侄子塔姆正在窄峡口起蟹笼，那里是深水的开始。"},{"en":"Tam has been fishing with his uncle for three summers and he knows the sounds of the boat by heart: the winch, the creel on the rail, the gulls. Tonight there are no gulls. \"Davie. Where have the birds gone?\"","ar":"يصطاد تام مع عمّه منذ ثلاثة صيوف، ويحفظ أصوات القارب عن ظهر قلب: الرافعة، والقفص على الحافة، والنوارس. الليلة لا نوارس. \"ديفي. أين ذهبت الطيور؟\"","de":"Tam fischt seit drei Sommern mit seinem Onkel und kennt die Geräusche des Boots auswendig: die Winde, die Reuse an der Reling, die Möwen. Heute Nacht gibt es keine Möwen. „Davie. Wo sind die Vögel hin?“","es":"Tam lleva tres veranos pescando con su tío y se sabe de memoria los sonidos del barco: el torno, la nasa en la barandilla, las gaviotas. Esta noche no hay gaviotas. “Davie. ¿Adónde se han ido los pájaros?”","fr":"Tam pêche avec son oncle depuis trois étés et il connaît par cœur les bruits du bateau : le treuil, le casier sur le plat-bord, les mouettes. Ce soir il n'y a pas de mouettes. « Davie. Où sont passés les oiseaux ? »","it":"Tam pesca con lo zio da tre estati e conosce a memoria i rumori della barca: il verricello, la nassa sulla battagliola, i gabbiani. Stanotte non ci sono gabbiani. «Davie. Dove sono finiti gli uccelli?»","ja":"タムは叔父と三回の夏を漁で過ごしてきて、船の音をすっかり覚えています。巻き上げ機、舷に当たるかご、カモメ。今夜はカモメがいません。「デイヴィ。鳥はどこへ行ったの？」","pt":"Tam pesca com o tio há três verões e conhece de cor os sons do barco: o guincho, o covo na amurada, as gaivotas. Esta noite não há gaivotas. «Davie. Para onde foram os pássaros?»","ru":"Там рыбачит с дядей уже три лета и знает наизусть звуки лодки: лебёдка, ловушка о планширь, чайки. Сегодня чаек нет. «Дэви. Куда делись птицы?»","zh":"塔姆跟着叔叔打鱼已经三个夏天了，船上的声音他烂熟于心：绞盘声，蟹笼碰在船舷上的声音，海鸥的叫声。今晚没有海鸥。“戴维。鸟都去哪儿了？”"},{"en":"Davie doesn't answer. The rope on the winch has gone tight. Not creel-tight. Tight like something has taken hold of it and is pulling it down, slowly, with all the time in the world. The stern dips.","ar":"لا يجيب ديفي. الحبل على الرافعة اشتدّ. ليس شدّ القفص. شدٌّ كأن شيئًا أمسك به ويجرّه إلى الأسفل، ببطء، وكأن الوقت كله ملكه. تنخفض المؤخرة.","de":"Davie antwortet nicht. Das Seil an der Winde ist stramm geworden. Nicht reusenstramm. Stramm, als hätte etwas es gepackt und zöge es nach unten, langsam, mit aller Zeit der Welt. Das Heck taucht ein.","es":"Davie no contesta. El cabo del torno se ha tensado. No tenso como una nasa. Tenso como si algo lo hubiera agarrado y tirara de él hacia abajo, despacio, con todo el tiempo del mundo. La popa se hunde.","fr":"Davie ne répond pas. Le câble du treuil s'est tendu. Pas tendu comme un casier. Tendu comme si quelque chose l'avait saisi et le tirait vers le fond, lentement, avec tout le temps du monde. La poupe s'enfonce.","it":"Davie non risponde. Il cavo del verricello si è teso. Non teso come una nassa. Teso come se qualcosa lo avesse afferrato e lo tirasse giù, lentamente, con tutto il tempo del mondo. La poppa si abbassa.","ja":"デイヴィは答えません。巻き上げ機のロープがぴんと張っています。かごの張り方ではありません。何かがつかんで、ゆっくりと、いくらでも時間があるかのように、下へ引いている張り方です。船尾が沈みます。","pt":"Davie não responde. O cabo do guincho ficou esticado. Não esticado como um covo. Esticado como se algo lhe tivesse pegado e o puxasse para baixo, devagar, com todo o tempo do mundo. A popa afunda-se.","ru":"Дэви не отвечает. Трос на лебёдке натянулся. Не так, как от ловушки. Так, будто что-то схватило его и тянет вниз, медленно, никуда не торопясь. Корма оседает.","zh":"戴维没有回答。绞盘上的缆绳绷紧了。不是蟹笼那种紧。是像有什么东西抓住了它，正把它往下拖，慢慢地，好像时间全归它所有。船尾往下一沉。"},{"en":"The yellow marker barrel rolls across the deck. \"Cut it,\" says Davie. \"Cut the rope.\" Tam has the knife in his hand when the water beside the boat goes white.","ar":"يتدحرج برميل العلامة الأصفر على السطح. يقول ديفي: \"اقطعه. اقطع الحبل.\" السكين في يد تام حين يبيضّ الماء بجانب القارب.","de":"Die gelbe Markierungstonne rollt über das Deck. „Kapp es“, sagt Davie. „Kapp das Seil.“ Tam hat das Messer in der Hand, als das Wasser neben dem Boot weiß wird.","es":"El bidón marcador amarillo rueda por la cubierta. “Córtalo”, dice Davie. “Corta el cabo.” Tam tiene el cuchillo en la mano cuando el agua junto al barco se vuelve blanca.","fr":"Le baril jaune de balisage roule sur le pont. « Coupe », dit Davie. « Coupe le câble. » Tam a le couteau à la main quand l'eau à côté du bateau devient blanche.","it":"Il bidone giallo di segnalazione rotola sul ponte. «Taglialo», dice Davie. «Taglia il cavo.» Tam ha il coltello in mano quando l'acqua accanto alla barca diventa bianca.","ja":"黄色い目印の浮き樽が甲板を転がります。「切れ」とデイヴィが言います。「ロープを切れ」。タムがナイフを手にしたとき、船のそばの水が白く泡立ちます。","pt":"O bidão amarelo de marcação rola pelo convés. «Corta», diz Davie. «Corta o cabo.» Tam tem a faca na mão quando a água ao lado do barco fica branca.","ru":"Жёлтая маркировочная бочка катится по палубе. «Руби, — говорит Дэви. — Руби трос.» У Тама нож в руке, когда вода рядом с лодкой становится белой.","zh":"黄色的标记浮桶滚过甲板。“砍断它，”戴维说，“砍断缆绳。”塔姆手里刚握住刀，船边的海水就翻白了。"}],"k":{"en":"WEDNESDAY NIGHT","ar":"ليلة الأربعاء","de":"MITTWOCHNACHT","es":"MIÉRCOLES POR LA NOCHE","fr":"MERCREDI SOIR","it":"MERCOLEDÌ NOTTE","ja":"水曜日の夜","pt":"QUARTA-FEIRA À NOITE","ru":"СРЕДА, НОЧЬ","zh":"星期三夜里"},"kind":"story","next":"1.1"},"1.1":{"img":"03_q1_drift.webp","hot":[77.5,60.0,12.0,16.0],"title":{"en":"THE DRIFTING BOAT","ar":"القارب الهائم","de":"DAS TREIBENDE BOOT","es":"EL BARCO A LA DERIVA","fr":"LE BATEAU À LA DÉRIVE","it":"LA BARCA ALLA DERIVA","ja":"漂流する船","pt":"O BARCO À DERIVA","ru":"ЛОДКА ПО ТЕЧЕНИЮ","zh":"漂来的船"},"story":[{"en":"First light. You have been in Inverbrae six days and you have not yet seen the harbour empty. It is empty now.","ar":"أول الضوء. أنتِ في إنفربري منذ ستة أيام ولم تري الميناء فارغًا بعد. إنه فارغ الآن.","de":"Erstes Licht. Du bist seit sechs Tagen in Inverbrae und hast den Hafen noch nie leer gesehen. Jetzt ist er leer.","es":"Primera luz. Llevas seis días en Inverbrae y todavía no has visto el puerto vacío. Ahora está vacío.","fr":"Première lueur. Tu es à Inverbrae depuis six jours et tu n'as pas encore vu le port vide. Il est vide maintenant.","it":"Prima luce. Sei a Inverbrae da sei giorni e non hai ancora visto il porto vuoto. Adesso è vuoto.","ja":"夜明け。あなたがインヴァーブレイに来て六日、港が空になるのを見たことはまだありません。今は空です。","pt":"Primeira luz. Estás em Inverbrae há seis dias e ainda não viste o porto vazio. Agora está vazio.","ru":"Первый свет. Ты в Инвербрей шесть дней и ещё не видела гавань пустой. Сейчас она пуста.","zh":"天刚亮。你到因弗布雷六天了，还从没见过港口空荡荡的。现在它空了。"},{"en":"The Lennox boat has drifted in against the pier on its own, the mooring rope trailing in the water, the wheelhouse door open. Nobody aboard.","ar":"انجرف قارب لينوكس وحده حتى الرصيف، وحبل الرسو يجرّ في الماء، وباب غرفة القيادة مفتوح. لا أحد على متنه.","de":"Das Boot der Lennox ist von allein gegen die Pier getrieben, die Festmacherleine schleift im Wasser, die Tür des Steuerhauses steht offen. Niemand an Bord.","es":"El barco de los Lennox ha llegado solo a la deriva contra el muelle, con el cabo de amarre arrastrando en el agua y la puerta del puente abierta. No hay nadie a bordo.","fr":"Le bateau des Lennox est venu tout seul à la dérive contre la jetée, l'amarre traînant dans l'eau, la porte de la timonerie ouverte. Personne à bord.","it":"La barca dei Lennox è arrivata da sola alla deriva contro il molo, la cima d'ormeggio che si trascina in acqua, la porta della timoneria aperta. Nessuno a bordo.","ja":"レノックスの船がひとりでに桟橋に流れ着いています。係留ロープは水に垂れ、操舵室の扉は開いたまま。船には誰もいません。","pt":"O barco dos Lennox veio sozinho à deriva contra o cais, a amarra a arrastar na água, a porta da casa do leme aberta. Ninguém a bordo.","ru":"Лодка Ленноксов сама пришла по течению к причалу, швартов волочится по воде, дверь рубки открыта. На борту никого.","zh":"伦诺克斯家的船自己漂过来，靠在码头上，系泊缆拖在水里，驾驶室的门开着。船上没有人。"},{"en":"In the stern, one yellow marker barrel lies on its side, chewed and split, as if a dog the size of a bus had worried it and let it go.","ar":"في المؤخرة يرقد برميل علامة أصفر على جنبه، ممضوغًا ومشقوقًا، كأن كلبًا بحجم حافلة عبث به ثم تركه.","de":"Im Heck liegt eine gelbe Markierungstonne auf der Seite, zerbissen und aufgeplatzt, als hätte ein Hund von der Größe eines Busses sie geschüttelt und wieder losgelassen.","es":"En la popa, un bidón marcador amarillo yace de lado, mordido y partido, como si un perro del tamaño de un autobús lo hubiera zarandeado y lo hubiera soltado.","fr":"À la poupe, un baril jaune de balisage gît sur le flanc, mâchonné et fendu, comme si un chien de la taille d'un autobus l'avait secoué puis relâché.","it":"A poppa, un bidone giallo di segnalazione giace su un fianco, morsicato e spaccato, come se un cane grande quanto un autobus lo avesse scrollato e poi lasciato andare.","ja":"船尾には黄色い目印の浮き樽が一つ横倒しになっています。噛まれて裂け、まるでバスほどの大きさの犬がくわえて振り回し、放り出したかのようです。","pt":"À popa, um bidão amarelo de marcação está deitado de lado, mordido e rachado, como se um cão do tamanho de um autocarro o tivesse sacudido e depois largado.","ru":"На корме лежит на боку жёлтая маркировочная бочка, прокушенная и треснувшая, будто собака размером с автобус потрепала её и отпустила.","zh":"船尾有一个黄色标记浮桶侧躺着，被咬过，裂开了，像是被一条公共汽车那么大的狗撕扯过又丢下。"},{"en":"Fergus Brannan, the harbourmaster, is waiting for you with the night log open in his hands. He has not slept.","ar":"فيرغس برانان، مدير الميناء، ينتظركِ وسجلّ الليلة مفتوح بين يديه. لم ينم.","de":"Fergus Brannan, der Hafenmeister, wartet auf dich, das Nachtbuch offen in den Händen. Er hat nicht geschlafen.","es":"Fergus Brannan, el capitán del puerto, te espera con el libro de guardia abierto en las manos. No ha dormido.","fr":"Fergus Brannan, le capitaine du port, t'attend avec le registre de nuit ouvert entre les mains. Il n'a pas dormi.","it":"Fergus Brannan, il capitano del porto, ti aspetta con il registro notturno aperto tra le mani. Non ha dormito.","ja":"港長のファーガス・ブラナンが、夜の記録簿を開いて手に持ち、あなたを待っています。彼は眠っていません。","pt":"Fergus Brannan, o capitão do porto, espera por ti com o livro da noite aberto nas mãos. Não dormiu.","ru":"Фергус Брэннан, начальник порта, ждёт тебя с открытым ночным журналом в руках. Он не спал.","zh":"港务长弗格斯·布兰南在等你，手里摊着夜间日志。他一夜没睡。"}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","ar":"الفصل 1 · إنفربري · الخميس","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ","ja":"第1章 · インヴァーブレイ · 木曜日","pt":"CAPÍTULO 1 · INVERBRAE · QUINTA-FEIRA","ru":"ГЛАВА 1 · ИНВЕРБРЕЙ · ЧЕТВЕРГ","zh":"第1章 · 因弗布雷 · 星期四"},"kind":"question","next":"1.2","prompt":{"en":"Brannan: \"I tried the radio when they were overdue. Read me the log, sergeant. How long had they been overdue when I tried?\"","ar":"برانان: \"جرّبت اللاسلكي حين تأخّروا. اقرئي لي السجل أيتها الرقيبة. كم كانوا متأخرين حين جرّبت؟\"","de":"Brannan: „Ich habe über Funk gerufen, als sie überfällig waren. Lesen Sie mir das Buch vor, Sergeant. Wie lange waren sie überfällig, als ich gerufen habe?“","es":"Brannan: “Llamé por radio cuando se retrasaron. Léeme el libro, sargento. ¿Cuánto retraso llevaban cuando llamé?”","fr":"Brannan : « J'ai appelé à la radio quand ils étaient en retard. Lisez-moi le registre, sergent. Depuis combien de temps étaient-ils en retard quand j'ai appelé ? »","it":"Brannan: «Ho chiamato via radio quando erano in ritardo. Mi legga il registro, sergente. Da quanto erano in ritardo quando ho chiamato?»","ja":"ブラナン：「戻りが遅れたとき、無線を試したんだ。記録を読んでくれ、巡査部長。私が試したとき、どれだけ遅れていた？」","pt":"Brannan: «Chamei pelo rádio quando estavam atrasados. Leia-me o livro, sargento. Há quanto tempo estavam atrasados quando chamei?»","ru":"Брэннан: «Я вызывал их по рации, когда они задержались. Прочтите мне журнал, сержант. Насколько они опаздывали, когда я вызывал?»","zh":"布兰南：“他们逾期未归时我试过无线电。给我念念日志，警长。我试的时候他们已经逾期多久了？”"},"opts":[{"en":"Forty-five minutes"},{"en":"Six hours and twenty minutes"},{"en":"About fifteen minutes"}],"answer":0,"fb":{"en":"The boat was due at 23:30. The first radio call was at 00:15: FORTY-FIVE MINUTES later. Six hours and twenty minutes is the delay from 23:30 until the boat drifted in at 05:50.","ar":"كان موعد عودة القارب 23:30. كان أول نداء لاسلكي عند 00:15: بعد خمس وأربعين دقيقة. أما ست ساعات وعشرون دقيقة فهي المدة من 23:30 حتى انجرف القارب إلى الرصيف عند 05:50.","de":"Das Boot sollte um 23:30 zurück sein. Der erste Funkruf war um 00:15: FÜNFUNDVIERZIG MINUTEN später. Sechs Stunden und zwanzig Minuten sind die Zeit von 23:30, bis das Boot um 05:50 hereintrieb.","es":"El barco tenía que volver a las 23:30. La primera llamada por radio fue a las 00:15: CUARENTA Y CINCO MINUTOS después. Seis horas y veinte minutos es el tiempo desde las 23:30 hasta que el barco llegó a la deriva a las 05:50.","fr":"Le bateau devait rentrer à 23h30. Le premier appel radio a eu lieu à 00h15 : QUARANTE-CINQ MINUTES plus tard. Six heures et vingt minutes, c'est le délai entre 23h30 et l'arrivée du bateau à la dérive à 05h50.","it":"La barca doveva rientrare alle 23:30. La prima chiamata radio è stata alle 00:15: QUARANTACINQUE MINUTI dopo. Sei ore e venti minuti è il tempo dalle 23:30 a quando la barca è arrivata alla deriva alle 05:50.","ja":"船の帰港予定は23:30。最初の無線連絡は00:15で、45分後です。6時間20分は、23:30から船が05:50に流れ着くまでの時間です。","pt":"O barco devia voltar às 23:30. A primeira chamada de rádio foi às 00:15: QUARENTA E CINCO MINUTOS depois. Seis horas e vinte minutos é o tempo das 23:30 até o barco chegar à deriva às 05:50.","ru":"Лодка должна была вернуться в 23:30. Первый вызов по рации был в 00:15: на СОРОК ПЯТЬ МИНУТ позже. Шесть часов двадцать минут — это время с 23:30 до того, как лодка пришла по течению в 05:50.","zh":"船应在23:30返回。第一次无线电呼叫在00:15：晚了四十五分钟。六小时二十分钟是从23:30到船在05:50漂进来之间的时间。"},"fbRight":{"en":"Brannan tears it out and gives it to you. \"Keep that. Somebody's going to ask.\"","ar":"ينزع برانان الصفحة ويعطيكِ إياها. \"احتفظي بها. سيسأل أحدهم.\"","de":"Brannan reißt die Seite heraus und gibt sie dir. „Behalten Sie das. Irgendwer wird fragen.“","es":"Brannan arranca la hoja y te la da. “Guárdala. Alguien lo va a preguntar.”","fr":"Brannan arrache la page et te la donne. « Gardez ça. Quelqu'un va poser la question. »","it":"Brannan strappa la pagina e te la dà. «La tenga. Qualcuno lo chiederà.»","ja":"ブラナンはそのページを破り取ってあなたに渡します。「持っておけ。誰かが必ず聞いてくる」","pt":"Brannan arranca a folha e dá-ta. «Guarde isso. Alguém vai perguntar.»","ru":"Брэннан вырывает страницу и отдаёт тебе. «Сохраните. Кто-нибудь обязательно спросит.»","zh":"布兰南把那一页撕下来交给你。“留着。会有人问的。”"},"fbWrong":{"en":"\"You've read it wrong. Read the next one right.\"","ar":"\"قرأتِه خطأً. اقرئي التالي صحيحًا.\"","de":"„Sie haben es falsch gelesen. Lesen Sie den nächsten Eintrag richtig.“","es":"“Lo has leído mal. Lee bien la siguiente.”","fr":"« Vous avez mal lu. Lisez bien la suivante. »","it":"«Ha letto male. Legga bene la prossima.»","ja":"「読み違えたな。次はちゃんと読め」","pt":"«Leu mal. Leia bem a próxima.»","ru":"«Вы прочитали неправильно. Следующую прочитайте правильно.»","zh":"“你读错了。下一条读对。”"},"clue":[{"en":"You read — the harbour log, Wednesday night: 20:40 — Lennox, creel boat, two crew, out to the Narrows. Due back 23:30. · 23:30 — Not back. · 00:15 — No answer on VHF. Tried three times.","ar":"تقرئين — سجلّ الميناء، ليلة الأربعاء: 20:40 — لينوكس، قارب أقفاص، طاقم من اثنين، خرج إلى المضائق. العودة المتوقعة 23:30. · 23:30 — لم يعد. · 00:15 — لا ردّ على VHF. ثلاث محاولات.","de":"Du liest — das Hafenbuch, Mittwochnacht: 20:40 — Lennox, Reusenboot, zwei Mann, raus zu den Engen. Rückkehr 23:30. · 23:30 — Nicht zurück. · 00:15 — Keine Antwort auf UKW. Dreimal versucht.","es":"Lees — el libro de guardia del puerto, miércoles por la noche: 20:40 — Lennox, barco de nasas, dos tripulantes, salida a los Estrechos. Regreso previsto 23:30. · 23:30 — No ha vuelto. · 00:15 — Sin respuesta por VHF. Tres intentos.","fr":"Tu lis — le registre du port, mercredi soir : 20h40 — Lennox, caseyeur, deux hommes, sortie vers les Étroits. Retour prévu 23h30. · 23h30 — Pas rentré. · 00h15 — Pas de réponse en VHF. Trois tentatives.","it":"Leggi — il registro del porto, mercoledì notte: 20:40 — Lennox, barca da nasse, due uomini, uscita verso gli Stretti. Rientro previsto 23:30. · 23:30 — Non rientrata. · 00:15 — Nessuna risposta in VHF. Tre tentativi.","ja":"あなたは読みます——港の記録簿、水曜日の夜：20:40——レノックス、かご漁船、乗員二名、狭水道へ出港。帰港予定23:30。· 23:30——戻らず。· 00:15——VHFに応答なし。三回試行。","pt":"Lês — o livro do porto, quarta-feira à noite: 20:40 — Lennox, barco de covos, dois tripulantes, saída para os Estreitos. Regresso previsto 23:30. · 23:30 — Não regressou. · 00:15 — Sem resposta em VHF. Três tentativas.","ru":"Ты читаешь — журнал порта, ночь среды: 20:40 — Леннокс, краболовная лодка, двое на борту, вышли к Теснинам. Возврат 23:30. · 23:30 — Не вернулись. · 00:15 — Нет ответа на УКВ. Три попытки.","zh":"你读到——港口日志，星期三夜里：20:40——伦诺克斯，捕蟹船，两名船员，出海去窄峡。预计23:30返回。· 23:30——未返回。· 00:15——VHF无应答。试了三次。"},{"en":"05:50 — Boat drifted in against the pier. Empty.","ar":"05:50 — انجرف القارب إلى الرصيف. فارغ.","de":"05:50 — Boot treibt gegen die Pier. Leer.","es":"05:50 — El barco llega a la deriva contra el muelle. Vacío.","fr":"05h50 — Bateau venu à la dérive contre la jetée. Vide.","it":"05:50 — Barca arrivata alla deriva contro il molo. Vuota.","ja":"05:50——船が桟橋に流れ着く。無人。","pt":"05:50 — Barco chegou à deriva contra o cais. Vazio.","ru":"05:50 — Лодка пришла по течению к причалу. Пустая.","zh":"05:50——船漂回来靠在码头上。空无一人。"}],"relic":true},"1.2":{"img":"04_q2_bell.webp","hot":[89.0,17.6,12.0,16.0],"title":{"en":"THE HARBOUR BELL","ar":"جرس الميناء","de":"DIE HAFENGLOCKE","es":"LA CAMPANA DEL PUERTO","fr":"LA CLOCHE DU PORT","it":"LA CAMPANA DEL PORTO","ja":"港の鐘","pt":"O SINO DO PORTO","ru":"ПОРТОВЫЙ КОЛОКОЛ","zh":"港口的钟"},"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","ar":"الفصل 1 · إنفربري · الخميس","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ","ja":"第1章 · インヴァーブレイ · 木曜日","pt":"CAPÍTULO 1 · INVERBRAE · QUINTA-FEIRA","ru":"ГЛАВА 1 · ИНВЕРБРЕЙ · ЧЕТВЕРГ","zh":"第1章 · 因弗布雷 · 星期四"},"kind":"question","next":"1.3","prompt":{"en":"You: \"Ring it. Two men ___ back.\"","ar":"أنتِ: \"اقرعه. رجلان ___.\"","de":"Du: „Läuten Sie. Zwei Männer ___ zurück.“","es":"Tú: “Tócala. Dos hombres ___.”","fr":"Toi : « Sonnez-la. Deux hommes ___. »","it":"Tu: «Suonala. Due uomini ___.»","ja":"あなた：「鳴らして。男が二人、___」","pt":"Tu: «Toque-o. Dois homens ___.»","ru":"Ты: «Звоните. Двое мужчин ___.»","zh":"你：“敲钟。两个人___。”"},"opts":[{"en":"didn't came"},{"en":"haven't come"},{"en":"haven't came"}],"answer":1,"fb":{"en":"the negative Present Perfect is HAVEN'T + PAST PARTICIPLE. COME is the participle; CAME is the Past Simple and never follows HAVE.","ar":"صيغة النفي في Present Perfect هي HAVEN'T + PAST PARTICIPLE. الكلمة COME هي اسم المفعول؛ أما CAME فهي Past Simple ولا تأتي أبدًا بعد HAVE.","de":"das verneinte Present Perfect ist HAVEN'T + PAST PARTICIPLE. COME ist das Partizip; CAME ist das Past Simple und steht nie nach HAVE.","es":"el Present Perfect negativo es HAVEN'T + PAST PARTICIPLE. COME es el participio; CAME es el Past Simple y nunca va detrás de HAVE.","fr":"le Present Perfect négatif est HAVEN'T + PAST PARTICIPLE. COME est le participe ; CAME est le Past Simple et ne suit jamais HAVE.","it":"il Present Perfect negativo è HAVEN'T + PAST PARTICIPLE. COME è il participio; CAME è il Past Simple e non segue mai HAVE.","ja":"Present Perfect の否定は HAVEN'T + PAST PARTICIPLE。COME が過去分詞で、CAME は Past Simple なので HAVE の後には決して来ません。","pt":"o Present Perfect negativo é HAVEN'T + PAST PARTICIPLE. COME é o particípio; CAME é o Past Simple e nunca vem depois de HAVE.","ru":"отрицательный Present Perfect — это HAVEN'T + PAST PARTICIPLE. COME — причастие; CAME — это Past Simple, и оно никогда не стоит после HAVE.","zh":"Present Perfect 的否定形式是 HAVEN'T + PAST PARTICIPLE。COME 是过去分词；CAME 是 Past Simple，绝不放在 HAVE 后面。"},"fbRight":{"en":"The bell rings. Mrs Rennie sits down on the step.","ar":"يرنّ الجرس. تجلس السيدة ريني على الدرجة.","de":"Die Glocke läutet. Mrs Rennie setzt sich auf die Stufe.","es":"La campana suena. La señora Rennie se sienta en el escalón.","fr":"La cloche sonne. Mrs Rennie s'assoit sur la marche.","it":"La campana suona. La signora Rennie si siede sul gradino.","ja":"鐘が鳴ります。レニー夫人は階段に腰を下ろします。","pt":"O sino toca. A Mrs Rennie senta-se no degrau.","ru":"Колокол звонит. Миссис Ренни садится на ступеньку.","zh":"钟声响起。伦尼太太在台阶上坐了下来。"},"fbWrong":{"en":"Brannan rings it anyway. \"You'll learn the words for it. Everybody here has.\"","ar":"يقرعه برانان رغم ذلك. \"ستتعلّمين الكلمات المناسبة لهذا. الجميع هنا تعلّمها.\"","de":"Brannan läutet trotzdem. „Die Worte dafür lernen Sie noch. Das hat hier jeder.“","es":"Brannan la toca de todos modos. “Ya aprenderás las palabras para esto. Aquí todo el mundo las ha aprendido.”","fr":"Brannan la sonne quand même. « Vous apprendrez les mots pour ça. Tout le monde ici les a appris. »","it":"Brannan la suona lo stesso. «Le parole per dirlo le imparerà. Qui le hanno imparate tutti.»","ja":"ブラナンはそれでも鐘を鳴らします。「言い方はそのうち覚えるさ。ここの者はみんな覚えた」","pt":"Brannan toca-o na mesma. «Há de aprender as palavras para isto. Toda a gente aqui aprendeu.»","ru":"Брэннан всё равно звонит. «Слова для этого вы ещё выучите. Здесь их все выучили.»","zh":"布兰南还是敲了钟。“你会学会该怎么说的。这里每个人都学会了。”"},"pages":[{"t":"story","b":{"en":"There is a brass bell on a stone post at the head of the pier. It is rung when a boat is lost.","ar":"على عمود حجري عند رأس الرصيف جرس نحاسي. يُقرع حين يُفقد قارب.","de":"Auf einem Steinpfosten am Kopf der Pier hängt eine Messingglocke. Sie wird geläutet, wenn ein Boot verloren geht.","es":"Hay una campana de latón sobre un poste de piedra en la punta del muelle. Se toca cuando se pierde un barco.","fr":"Il y a une cloche en laiton sur un poteau de pierre au bout de la jetée. On la sonne quand un bateau est perdu.","it":"C'è una campana di ottone su un palo di pietra in cima al molo. La si suona quando una barca va perduta.","ja":"桟橋の先端の石柱に、真鍮の鐘があります。船が失われたときに鳴らされます。","pt":"Há um sino de latão num poste de pedra no topo do cais. Toca-se quando se perde um barco.","ru":"На каменном столбе в конце причала висит латунный колокол. В него звонят, когда теряют лодку.","zh":"码头尽头的石柱上挂着一口铜钟。有船失踪时才会敲响它。"},"img":"04_q2_bell.webp","hot":[89.0,17.6,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"Old Mrs Rennie, who has lived above the harbour for eighty years, tells you it has not been rung since the Ossian went down, and that was when you were a child.","ar":"تخبركِ السيدة ريني العجوز، التي تعيش فوق الميناء منذ ثمانين عامًا، أنه لم يُقرع منذ غرق أوسيان، وكان ذلك حين كنتِ طفلة.","de":"Die alte Mrs Rennie, die seit achtzig Jahren über dem Hafen wohnt, sagt dir, sie sei nicht mehr geläutet worden, seit die Ossian unterging, und das war, als du ein Kind warst.","es":"La señora Rennie, que lleva ochenta años viviendo encima del puerto, te dice que no se toca desde que se hundió el Ossian, y eso fue cuando tú eras niña.","fr":"La vieille Mrs Rennie, qui habite au-dessus du port depuis quatre-vingts ans, te dit qu'on ne l'a plus sonnée depuis le naufrage de l'Ossian, et c'était quand tu étais enfant.","it":"La vecchia signora Rennie, che abita sopra il porto da ottant'anni, ti dice che non la suonano più da quando è affondata l'Ossian, e quello è stato quando eri bambina.","ja":"港の上に八十年住んでいる年老いたレニー夫人は、オシアン号が沈んで以来この鐘は鳴らされていないと言います。それはあなたが子どもの頃のことです。","pt":"A velha Mrs Rennie, que vive por cima do porto há oitenta anos, diz-te que não toca desde que o Ossian se afundou, e isso foi quando eras criança.","ru":"Старая миссис Ренни, которая живёт над гаванью восемьдесят лет, говорит тебе, что в него не звонили с тех пор, как затонул «Оссиан», а это было, когда ты была ребёнком.","zh":"年迈的伦尼太太在港口上方住了八十年，她告诉你，自从奥西恩号沉没以后这口钟就再没敲过，那时你还是个孩子。"},"img":"04_q2_bell.webp","hot":[89.0,17.6,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"Brannan has the rope in his hand and he is looking at you, because you are the police and it is your call. Behind him the village has started to come down the hill. Nobody has said the word yet.","ar":"برانان يمسك الحبل وينظر إليكِ، لأنكِ الشرطة والقرار قراركِ. خلفه بدأت القرية تنزل التلّ. لم ينطق أحد بالكلمة بعد.","de":"Brannan hat das Seil in der Hand und sieht dich an, denn du bist die Polizei und es ist deine Entscheidung. Hinter ihm hat das Dorf angefangen, den Hügel herunterzukommen. Noch hat niemand das Wort ausgesprochen.","es":"Brannan tiene la cuerda en la mano y te está mirando, porque tú eres la policía y la decisión es tuya. Detrás de él el pueblo ha empezado a bajar la cuesta. Todavía nadie ha dicho la palabra.","fr":"Brannan a la corde à la main et il te regarde, parce que c'est toi la police et que c'est à toi de décider. Derrière lui le village a commencé à descendre la colline. Personne n'a encore dit le mot.","it":"Brannan ha la corda in mano e ti guarda, perché la polizia sei tu e la decisione è tua. Dietro di lui il paese ha cominciato a scendere dalla collina. Nessuno ha ancora detto la parola.","ja":"ブラナンはロープを手に、あなたを見ています。あなたが警察で、決めるのはあなただからです。彼の後ろで、村の人々が丘を下り始めています。まだ誰もその言葉を口にしていません。","pt":"Brannan tem a corda na mão e está a olhar para ti, porque a polícia és tu e a decisão é tua. Atrás dele a aldeia começou a descer a encosta. Ainda ninguém disse a palavra.","ru":"У Брэннана верёвка в руке, и он смотрит на тебя, потому что полиция — это ты, и решать тебе. За его спиной деревня начала спускаться с холма. Слово ещё никто не произнёс.","zh":"布兰南手握钟绳看着你，因为你是警察，这由你决定。他身后，村里的人已经开始走下山坡。还没有人说出那个词。"},"img":"04_q2_bell.webp","hot":[89.0,17.6,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"You hear: Brannan: \"Say it, sergeant, and I'll ring it.\"","ar":"تسمعين: برانان: \"قوليها أيتها الرقيبة، وأنا أقرعه.\"","de":"Du hörst: Brannan: „Sagen Sie es, Sergeant, und ich läute.“","es":"Oyes: Brannan: “Dilo, sargento, y la toco.”","fr":"Tu entends : Brannan : « Dites-le, sergent, et je sonne. »","it":"Senti: Brannan: «Lo dica, sergente, e io suono.»","ja":"聞こえる：ブラナン：「言ってくれ、巡査部長。そうしたら鳴らす」","pt":"Ouves: Brannan: «Diga-o, sargento, e eu toco.»","ru":"Ты слышишь: Брэннан: «Скажите это, сержант, и я ударю в колокол.»","zh":"你听到：布兰南：“你说一声，警长，我就敲。”"},"img":"insert_brannan_bell.webp","hot":[88.0,32.0,12.0,16.0],"label":{"en":"YOU HEAR","ar":"تسمعين","de":"DU HÖRST","es":"OYES","fr":"TU ENTENDS","it":"SENTI","ja":"聞こえる","pt":"OUVES","ru":"ТЫ СЛЫШИШЬ","zh":"你听到"}}],"askImg":"insert_bell_strike.webp","askHot":[70.0,45.0,12.0,16.0]},"1.3":{"img":"05_q3_provost.webp","hot":[76.0,70.0,12.0,16.0],"title":{"en":"THE PROVOST","ar":"العمدة","de":"DER BÜRGERMEISTER","es":"EL ALCALDE","fr":"LE MAIRE","it":"IL SINDACO","ja":"町長","pt":"O PRESIDENTE","ru":"МЭР","zh":"镇长"},"story":[{"en":"Provost Menzies finds you on the quay at nine, where the bunting has been going up all week for Regatta Week. Menzies has been Provost for eleven years and has never lost a vote.","ar":"يجدكِ العمدة منزيس على الرصيف في التاسعة، حيث تُعلَّق الرايات طوال الأسبوع استعدادًا لأسبوع السباق. منزيس عمدة منذ أحد عشر عامًا ولم يخسر تصويتًا قط.","de":"Bürgermeister Menzies findet dich um neun am Kai, wo die ganze Woche schon Wimpel für die Regattawoche aufgehängt werden. Menzies ist seit elf Jahren Bürgermeister und hat noch nie eine Wahl verloren.","es":"El alcalde Menzies te encuentra en el muelle a las nueve, donde llevan toda la semana colgando banderines para la Semana de la Regata. Menzies lleva once años de alcalde y nunca ha perdido una votación.","fr":"Le maire Menzies te trouve sur le quai à neuf heures, là où l'on accroche des fanions depuis le début de la semaine pour la Semaine de la Régate. Menzies est maire depuis onze ans et n'a jamais perdu un vote.","it":"Il sindaco Menzies ti trova sulla banchina alle nove, dove da una settimana stanno appendendo le bandierine per la Settimana della Regata. Menzies è sindaco da undici anni e non ha mai perso un voto.","ja":"九時、メンジーズ町長が岸壁であなたを見つけます。そこでは一週間ずっと、レガッタ・ウィークのための旗飾りが取り付けられています。メンジーズは十一年町長を務め、一度も投票で負けたことがありません。","pt":"O presidente Menzies encontra-te no cais às nove, onde há uma semana andam a pendurar bandeirinhas para a Semana da Regata. Menzies é presidente há onze anos e nunca perdeu uma votação.","ru":"Мэр Мензис находит тебя на набережной в девять, там, где всю неделю вешают флажки к Неделе Регаты. Мензис мэр одиннадцать лет и ни разу не проигрывал голосования.","zh":"九点，孟席斯镇长在码头上找到你，这一整周那里都在为赛艇周挂彩旗。孟席斯当了十一年镇长，从没输过一次投票。"},{"en":"He stands beside a big red mooring buoy that has just been painted for the visitors, and he does not look at the Lennox boat once.","ar":"يقف بجانب عوّامة رسو حمراء كبيرة طُليت للتوّ من أجل الزوار، ولا ينظر إلى قارب لينوكس ولو مرة.","de":"Er steht neben einer großen roten Festmachertonne, die gerade erst für die Besucher gestrichen wurde, und sieht das Boot der Lennox kein einziges Mal an.","es":"Está de pie junto a una gran boya roja de amarre recién pintada para los visitantes, y no mira ni una sola vez el barco de los Lennox.","fr":"Il se tient à côté d'une grosse bouée d'amarrage rouge qu'on vient de repeindre pour les visiteurs, et il ne regarde pas une seule fois le bateau des Lennox.","it":"Sta accanto a una grossa boa d'ormeggio rossa appena ridipinta per i visitatori, e non guarda la barca dei Lennox nemmeno una volta.","ja":"彼は観光客のために塗り直したばかりの大きな赤い係留ブイの横に立ち、レノックスの船には一度も目を向けません。","pt":"Está ao lado de uma grande boia de amarração vermelha acabada de pintar para os visitantes, e não olha uma única vez para o barco dos Lennox.","ru":"Он стоит рядом с большим красным швартовным буем, только что покрашенным для гостей, и ни разу не смотрит на лодку Ленноксов.","zh":"他站在一只刚为游客刷过漆的大红系泊浮筒旁边，一眼也不看伦诺克斯家的船。"}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","ar":"الفصل 1 · إنفربري · الخميس","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ","ja":"第1章 · インヴァーブレイ · 木曜日","pt":"CAPÍTULO 1 · INVERBRAE · QUINTA-FEIRA","ru":"ГЛАВА 1 · ИНВЕРБРЕЙ · ЧЕТВЕРГ","zh":"第1章 · 因弗布雷 · 星期四"},"kind":"question","next":"1.4","prompt":{"en":"Menzies: \"Two men had an accident. It happens on a coast. Tell me, in your career, ___ a harbour in August? No. Because nobody has.\"","ar":"منزيس: \"رجلان تعرّضا لحادث. هذا يحدث على الساحل. قولي لي، في مسيرتكِ، ___ ميناءً في أغسطس؟ لا. لأن أحدًا لم يفعل.\"","de":"Menzies: „Zwei Männer hatten einen Unfall. Das passiert an einer Küste. Sagen Sie mir, in Ihrer Laufbahn, ___ einen Hafen im August? Nein. Weil es niemand getan hat.“","es":"Menzies: “Dos hombres tuvieron un accidente. Pasa en la costa. Dígame, en su carrera, ¿___ un puerto en agosto? No. Porque nadie lo ha hecho.”","fr":"Menzies : « Deux hommes ont eu un accident. Ça arrive sur une côte. Dites-moi, dans votre carrière, ___ un port en août ? Non. Parce que personne ne l'a fait. »","it":"Menzies: «Due uomini hanno avuto un incidente. Succede su una costa. Mi dica, nella sua carriera, ___ un porto in agosto? No. Perché nessuno lo ha fatto.»","ja":"メンジーズ：「男が二人、事故にあった。海辺ではよくあることだ。教えてくれ、君のキャリアで、八月に港を ___？ないだろう。誰もしたことがないからだ」","pt":"Menzies: «Dois homens tiveram um acidente. Acontece numa costa. Diga-me, na sua carreira, ___ um porto em agosto? Não. Porque ninguém o fez.»","ru":"Мензис: «С двумя мужчинами произошёл несчастный случай. На побережье такое бывает. Скажите, за всю вашу службу, ___ гавань в августе? Нет. Потому что никто этого не делал.»","zh":"孟席斯：“两个人出了意外。海边就会有这种事。告诉我，在你的职业生涯里，你___八月份的港口吗？没有。因为谁都没关过。”"},"opts":[{"en":"did you ever closed"},{"en":"have you ever closing"},{"en":"have you ever closed"}],"answer":2,"fb":{"en":"An experience up to now can use HAVE + subject + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? DID takes CLOSE, not CLOSED. HAVE takes CLOSED, not CLOSING.","ar":"التجربة حتى الآن يمكن أن تستخدم HAVE + الفاعل + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? مع DID نستخدم CLOSE لا CLOSED. ومع HAVE نستخدم CLOSED لا CLOSING.","de":"Eine Erfahrung bis jetzt kann HAVE + Subjekt + EVER + PAST PARTICIPLE verwenden: HAVE YOU EVER CLOSED? DID nimmt CLOSE, nicht CLOSED. HAVE nimmt CLOSED, nicht CLOSING.","es":"Una experiencia hasta ahora puede usar HAVE + sujeto + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? DID lleva CLOSE, no CLOSED. HAVE lleva CLOSED, no CLOSING.","fr":"Une expérience jusqu'à maintenant peut utiliser HAVE + sujet + EVER + PAST PARTICIPLE : HAVE YOU EVER CLOSED ? DID prend CLOSE, pas CLOSED. HAVE prend CLOSED, pas CLOSING.","it":"Un'esperienza fino a ora può usare HAVE + soggetto + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? DID prende CLOSE, non CLOSED. HAVE prende CLOSED, non CLOSING.","ja":"これまでの経験は HAVE + 主語 + EVER + PAST PARTICIPLE で表せます：HAVE YOU EVER CLOSED? DID の後は CLOSE で、CLOSED ではありません。HAVE の後は CLOSED で、CLOSING ではありません。","pt":"Uma experiência até agora pode usar HAVE + sujeito + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? DID leva CLOSE, não CLOSED. HAVE leva CLOSED, não CLOSING.","ru":"Опыт до настоящего момента можно выразить как HAVE + подлежащее + EVER + PAST PARTICIPLE: HAVE YOU EVER CLOSED? После DID идёт CLOSE, а не CLOSED. После HAVE идёт CLOSED, а не CLOSING.","zh":"到目前为止的经历可以用 HAVE + 主语 + EVER + PAST PARTICIPLE：HAVE YOU EVER CLOSED? DID 后面用 CLOSE，不用 CLOSED。HAVE 后面用 CLOSED，不用 CLOSING。"},"fbRight":{"en":"Menzies gives you one thing: a police boat on the water for the regatta, at the council's expense. \"That is what you get. Not the harbour.\"","ar":"يمنحكِ منزيس شيئًا واحدًا: قارب شرطة على الماء خلال السباق، على نفقة المجلس. \"هذا ما تحصلين عليه. لا الميناء.\"","de":"Menzies gesteht dir eine Sache zu: ein Polizeiboot auf dem Wasser während der Regatta, auf Kosten des Gemeinderats. „Das bekommen Sie. Nicht den Hafen.“","es":"Menzies te concede una cosa: una lancha de la policía en el agua durante la regata, a cargo del ayuntamiento. “Eso es lo que tiene. No el puerto.”","fr":"Menzies t'accorde une chose : un bateau de police sur l'eau pendant la régate, aux frais du conseil. « Voilà ce que vous obtenez. Pas le port. »","it":"Menzies ti concede una cosa: una barca della polizia in acqua per la regata, a spese del consiglio. «Questo è ciò che ottiene. Non il porto.»","ja":"メンジーズがくれるものは一つだけです。レガッタの間、議会の費用で水上に警察の船を一隻。「君が得るのはそれだ。港ではない」","pt":"Menzies concede-te uma coisa: um barco da polícia na água durante a regata, pago pela câmara. «É isso que tem. Não o porto.»","ru":"Мензис уступает тебе одно: полицейскую лодку на воде во время регаты, за счёт совета. «Вот что вы получаете. Не гавань.»","zh":"孟席斯只给你一样东西：赛艇期间水面上有一艘警用船，费用由议会承担。“这就是你能得到的。不是港口。”"},"fbWrong":{"en":"Menzies has already stopped listening.","ar":"توقّف منزيس عن الإصغاء بالفعل.","de":"Menzies hört schon nicht mehr zu.","es":"Menzies ya ha dejado de escuchar.","fr":"Menzies a déjà cessé d'écouter.","it":"Menzies ha già smesso di ascoltare.","ja":"メンジーズはもう聞いていません。","pt":"Menzies já deixou de ouvir.","ru":"Мензис уже перестал слушать.","zh":"孟席斯已经不在听了。"},"clue":[{"en":"You hear: Menzies: \"This town has had three bad winters, sergeant. It has not had a bad August, and it will not start now. Regatta Week is four hundred visitors and every bed in the village is occupied.\"","ar":"تسمعين: منزيس: \"مرّت على هذه البلدة ثلاثة شتاءات سيئة أيتها الرقيبة. لم يمرّ عليها أغسطس سيئ، ولن يبدأ الآن. أسبوع السباق يعني أربعمئة زائر، وكل سرير في القرية مشغول.\"","de":"Du hörst: Menzies: „Diese Stadt hatte drei schlechte Winter, Sergeant. Sie hatte keinen schlechten August, und damit fängt sie jetzt nicht an. Die Regattawoche, das sind vierhundert Besucher, und jedes Bett im Dorf ist belegt.“","es":"Oyes: Menzies: “Este pueblo ha tenido tres inviernos malos, sargento. No ha tenido un agosto malo, y no va a empezar ahora. La Semana de la Regata son cuatrocientos visitantes y todas las camas del pueblo están ocupadas.”","fr":"Tu entends : Menzies : « Cette ville a eu trois mauvais hivers, sergent. Elle n'a pas eu de mauvais mois d'août, et ça ne va pas commencer maintenant. La Semaine de la Régate, c'est quatre cents visiteurs et tous les lits du village sont occupés. »","it":"Senti: Menzies: «Questo paese ha avuto tre brutti inverni, sergente. Non ha avuto un brutto agosto, e non comincerà adesso. La Settimana della Regata sono quattrocento visitatori e ogni letto del paese è occupato.»","ja":"聞こえる：メンジーズ：「この町は三度もひどい冬を越してきたんだ、巡査部長。ひどい八月はまだ一度もないし、今さら始めるつもりもない。レガッタ・ウィークには四百人の客が来て、村のベッドはすべて埋まっている」","pt":"Ouves: Menzies: «Esta terra teve três invernos maus, sargento. Não teve um agosto mau, e não vai começar agora. A Semana da Regata são quatrocentos visitantes e todas as camas da aldeia estão ocupadas.»","ru":"Ты слышишь: Мензис: «У этого города было три плохие зимы, сержант. Плохого августа у него не было, и начинать он не собирается. Неделя Регаты — это четыреста гостей, и все кровати в деревне заняты.»","zh":"你听到：孟席斯：“这个镇子已经熬过三个坏冬天了，警长。它还没有过一个坏八月，现在也不会开这个头。赛艇周有四百名游客，村里每张床都有人住。”"},{"en":"You: \"Two men haven't come home.\"","ar":"أنتِ: \"رجلان لم يعودا إلى البيت.\"","de":"Du: „Zwei Männer sind nicht nach Hause gekommen.“","es":"Tú: “Dos hombres no han vuelto a casa.”","fr":"Toi : « Deux hommes ne sont pas rentrés. »","it":"Tu: «Due uomini non sono tornati a casa.»","ja":"あなた：「男が二人、まだ家に帰っていません」","pt":"Tu: «Dois homens não voltaram a casa.»","ru":"Ты: «Двое мужчин не вернулись домой.»","zh":"你：“两个人还没回家。”"}]},"1.4":{"img":"06_q4_forecast.webp","hot":[78.0,62.0,12.0,16.0],"title":{"en":"THE FORECAST","ar":"النشرة الجوية","de":"DER WETTERBERICHT","es":"EL PARTE METEOROLÓGICO","fr":"LE BULLETIN MÉTÉO","it":"IL BOLLETTINO","ja":"天気予報","pt":"O BOLETIM","ru":"ПРОГНОЗ","zh":"天气预报"},"story":[{"en":"Brannan's office is a wooden hut at the end of the pier with a kettle, a barometer and a radio that has been on since 1987. At five past five he turns it up.","ar":"مكتب برانان كوخ خشبي في آخر الرصيف فيه غلاية وبارومتر وراديو يعمل منذ 1987. في الخامسة وخمس دقائق يرفع صوته.","de":"Brannans Büro ist eine Holzhütte am Ende der Pier mit einem Wasserkocher, einem Barometer und einem Radio, das seit 1987 läuft. Um fünf nach fünf dreht er es lauter.","es":"La oficina de Brannan es una caseta de madera al final del muelle con un hervidor, un barómetro y una radio encendida desde 1987. A las cinco y cinco sube el volumen.","fr":"Le bureau de Brannan est une cabane en bois au bout de la jetée, avec une bouilloire, un baromètre et une radio allumée depuis 1987. À dix-sept heures cinq il monte le son.","it":"L'ufficio di Brannan è una baracca di legno in fondo al molo con un bollitore, un barometro e una radio accesa dal 1987. Alle cinque e cinque alza il volume.","ja":"ブラナンの事務所は桟橋の端にある木の小屋で、やかんと気圧計、それに1987年からつけっぱなしのラジオがあります。五時五分、彼は音量を上げます。","pt":"O gabinete de Brannan é um barracão de madeira no fim do cais com uma chaleira, um barómetro e um rádio ligado desde 1987. Às cinco e cinco aumenta o volume.","ru":"Кабинет Брэннана — деревянная будка в конце причала с чайником, барометром и радио, которое включено с 1987 года. В пять минут шестого он прибавляет звук.","zh":"布兰南的办公室是码头尽头的一间木屋，里面有一把水壶、一个气压计和一台从1987年开到现在的收音机。五点零五分，他把音量调大。"},{"en":"He tells you the rules before it starts: IMMINENT means inside six hours, SOON means six to twelve, LATER means more than twelve, and the clock starts from the time the forecast is issued.","ar":"يشرح لكِ القواعد قبل أن تبدأ: IMMINENT تعني خلال ست ساعات، وSOON تعني من ست إلى اثنتي عشرة، وLATER تعني أكثر من اثنتي عشرة، ويبدأ العدّ من وقت إصدار النشرة.","de":"Er erklärt dir die Regeln, bevor es losgeht: IMMINENT heißt innerhalb von sechs Stunden, SOON heißt sechs bis zwölf, LATER heißt mehr als zwölf, und die Uhr läuft ab dem Zeitpunkt, zu dem der Bericht herausgegeben wird.","es":"Te explica las reglas antes de que empiece: IMMINENT significa dentro de seis horas, SOON significa de seis a doce, LATER significa más de doce, y el reloj empieza a contar desde la hora en que se emite el parte.","fr":"Il t'explique les règles avant que ça commence : IMMINENT veut dire dans les six heures, SOON veut dire de six à douze, LATER veut dire plus de douze, et l'horloge part de l'heure d'émission du bulletin.","it":"Ti spiega le regole prima che cominci: IMMINENT vuol dire entro sei ore, SOON vuol dire da sei a dodici, LATER vuol dire più di dodici, e l'orologio parte dall'ora in cui il bollettino viene emesso.","ja":"予報が始まる前に、彼は決まりを教えてくれます。IMMINENT は六時間以内、SOON は六〜十二時間、LATER は十二時間以上、そして時間は予報の発表時刻から数えます。","pt":"Explica-te as regras antes de começar: IMMINENT quer dizer dentro de seis horas, SOON quer dizer de seis a doze, LATER quer dizer mais de doze, e o relógio conta a partir da hora em que o boletim é emitido.","ru":"Он объясняет тебе правила до начала: IMMINENT — это в пределах шести часов, SOON — от шести до двенадцати, LATER — больше двенадцати, и отсчёт идёт от времени выпуска прогноза.","zh":"预报开始前他先告诉你规则：IMMINENT 指六小时以内，SOON 指六到十二小时，LATER 指十二小时以上，时间从预报发布时算起。"}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","ar":"الفصل 1 · إنفربري · الخميس","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES","fr":"CHAPITRE 1 · INVERBRAE · JEUDI","it":"CAPITOLO 1 · INVERBRAE · GIOVEDÌ","ja":"第1章 · インヴァーブレイ · 木曜日","pt":"CAPÍTULO 1 · INVERBRAE · QUINTA-FEIRA","ru":"ГЛАВА 1 · ИНВЕРБРЕЙ · ЧЕТВЕРГ","zh":"第1章 · 因弗布雷 · 星期四"},"kind":"question","next":"1.5","prompt":{"en":"Brannan: \"The regatta starts at ten tomorrow morning. If the forecast is right about LATER, what's the earliest the wind can get up to force 7?\"","ar":"برانان: \"يبدأ السباق في العاشرة صباح الغد. إذا صدقت النشرة بشأن LATER، فما أبكر وقت يمكن أن تبلغ فيه الريح القوة 7؟\"","de":"Brannan: „Die Regatta beginnt morgen früh um zehn. Wenn der Bericht mit LATER recht hat, wann kann der Wind frühestens Stärke 7 erreichen?“","es":"Brannan: “La regata empieza mañana a las diez de la mañana. Si el parte acierta con LATER, ¿cuándo es lo más pronto que el viento puede llegar a fuerza 7?”","fr":"Brannan : « La régate commence demain à dix heures du matin. Si le bulletin a raison pour LATER, au plus tôt, quand le vent peut-il atteindre force 7 ? »","it":"Brannan: «La regata comincia domani mattina alle dieci. Se il bollettino ha ragione su LATER, qual è il primo momento in cui il vento può arrivare a forza 7?»","ja":"ブラナン：「レガッタは明日の朝十時に始まる。予報の LATER が正しいとして、風が風力7に達するのは最も早くていつだ？」","pt":"Brannan: «A regata começa amanhã às dez da manhã. Se o boletim tiver razão quanto a LATER, o mais cedo, quando é que o vento pode chegar a força 7?»","ru":"Брэннан: «Регата начинается завтра в десять утра. Если прогноз прав насчёт LATER, когда самое раннее ветер может дойти до семи баллов?»","zh":"布兰南：“赛艇明天上午十点开始。如果预报说的 LATER 没错，风最早什么时候能到7级？”"},"opts":[{"en":"After 05:05 tomorrow morning"},{"en":"At ten tomorrow, when the racing starts"},{"en":"Before midnight tonight"}],"answer":0,"fb":{"en":"LATER means more than twelve hours after the time of issue. Twelve hours after 17:05 is 05:05 on Friday. It can come after that; nothing in the forecast says it will wait for the racing.","ar":"LATER تعني أكثر من اثنتي عشرة ساعة بعد وقت الإصدار. اثنتا عشرة ساعة بعد 17:05 هي 05:05 يوم الجمعة. قد تأتي بعد ذلك؛ ولا شيء في النشرة يقول إنها ستنتظر السباق.","de":"LATER bedeutet mehr als zwölf Stunden nach der Ausgabezeit. Zwölf Stunden nach 17:05 ist 05:05 am Freitag. Danach kann er kommen; nichts im Bericht sagt, dass er auf die Rennen wartet.","es":"LATER significa más de doce horas después de la hora de emisión. Doce horas después de las 17:05 son las 05:05 del viernes. Puede llegar después de eso; nada en el parte dice que vaya a esperar a las regatas.","fr":"LATER veut dire plus de douze heures après l'heure d'émission. Douze heures après 17h05, cela fait 05h05 vendredi. Il peut venir après ; rien dans le bulletin ne dit qu'il attendra les courses.","it":"LATER vuol dire più di dodici ore dopo l'ora di emissione. Dodici ore dopo le 17:05 sono le 05:05 di venerdì. Può arrivare in qualunque momento da lì in poi; niente nel bollettino dice che aspetterà le regate.","ja":"LATER は発表時刻から十二時間以上後という意味です。17:05の十二時間後は金曜日の05:05。それ以降ならいつでも来られます。予報のどこにも、レースを待ってくれるとは書いてありません。","pt":"LATER quer dizer mais de doze horas depois da hora de emissão. Doze horas depois das 17:05 são 05:05 de sexta-feira. Pode vir depois disso; nada no boletim diz que vai esperar pelas regatas.","ru":"LATER означает больше двенадцати часов после выпуска. Двенадцать часов после 17:05 — это 05:05 в пятницу. Позже ветер прийти может; ничто в прогнозе не говорит, что он подождёт гонок.","zh":"LATER 指发布时间之后十二小时以上。17:05 之后十二小时是星期五 05:05。风可以在那之后任何时候来；预报里没有任何一句说它会等比赛。"},"fbRight":{"en":"Brannan writes it out in pencil and hands it over. \"Show him that. He won't read it, but show him.\"","ar":"يكتبها برانان بقلم الرصاص ويناولكِ إياها. \"أريه هذا. لن يقرأه، لكن أريه.\"","de":"Brannan schreibt es mit Bleistift ab und reicht es dir. „Zeigen Sie ihm das. Er wird es nicht lesen, aber zeigen Sie es ihm.“","es":"Brannan lo escribe a lápiz y te lo da. “Enséñaselo. No lo va a leer, pero enséñaselo.”","fr":"Brannan le recopie au crayon et te le tend. « Montrez-lui ça. Il ne le lira pas, mais montrez-le-lui. »","it":"Brannan lo ricopia a matita e te lo porge. «Glielo faccia vedere. Non lo leggerà, ma glielo faccia vedere.»","ja":"ブラナンはそれを鉛筆で書き写して渡します。「彼に見せてやれ。読みはしないだろうが、見せるんだ」","pt":"Brannan passa-o a lápis e entrega-to. «Mostre-lhe isto. Ele não vai ler, mas mostre-lhe.»","ru":"Брэннан переписывает его карандашом и протягивает тебе. «Покажите ему. Он не станет читать, но покажите.»","zh":"布兰南用铅笔把它抄下来递给你。“给他看。他不会读的，但还是给他看。”"},"fbWrong":{"en":"\"You've got the words the wrong way round, and out there that's the difference between a boat and no boat.\"","ar":"\"وضعتِ الكلمات بالمقلوب، وهناك في البحر هذا هو الفرق بين أن يكون لديكِ قارب وألّا يكون.\"","de":"„Sie haben die Wörter verdreht, und da draußen ist das der Unterschied zwischen einem Boot und keinem Boot.“","es":"“Has puesto las palabras al revés, y ahí fuera esa es la diferencia entre tener barco y no tenerlo.”","fr":"« Vous avez mis les mots dans le mauvais ordre, et là-bas, c'est la différence entre un bateau et pas de bateau. »","it":"«Ha messo le parole al contrario, e là fuori è la differenza tra avere una barca e non averla.»","ja":"「言葉の順番が逆だ。海の上では、それが船があるかないかの違いになる」","pt":"«Trocou a ordem das palavras, e lá fora é essa a diferença entre ter barco e não ter.»","ru":"«Вы перепутали слова местами, а там, в море, это разница между лодкой и отсутствием лодки.»","zh":"“你把词说反了，在海上，这就是有船和没船的区别。”"},"clue":[{"en":"You hear — the shipping forecast, issued 17:05 Thursday: \"Malin, Hebrides. Southwesterly 3 or 4, increasing 5 to 7 later. Slight · or moderate, becoming rough later. Fair. Good.\" · \"Inshore, Ardnamurchan Point to Mull of Kintyre. Southwesterly 3 or 4,","ar":"تسمعين — النشرة البحرية، الصادرة 17:05 الخميس: \"مالين، الهبريدز. جنوبية غربية 3 أو 4، تشتدّ إلى 5 إلى 7 لاحقًا. خفيف · أو معتدل، يصبح هائجًا لاحقًا. صحو. جيدة.\" · \"المياه الساحلية، من رأس أردناميرخان إلى مول أوف كينتاير. جنوبية غربية 3 أو 4،","de":"Du hörst — den Seewetterbericht, herausgegeben 17:05 Donnerstag: „Malin, Hebriden. Südwest 3 oder 4, später zunehmend 5 bis 7. Leicht bewegt · oder mäßig, später grob werdend. Heiter. Gute Sicht.“ · „Küste, Ardnamurchan Point bis Mull of Kintyre. Südwest 3 oder 4,","es":"Oyes — el parte marítimo, emitido a las 17:05 del jueves: “Malin, Hébridas. Suroeste 3 o 4, aumentando a 5 o 7 más tarde. Marejadilla · o marejada, volviéndose gruesa más tarde. Buen tiempo. Buena visibilidad.” · “Costa, de Ardnamurchan Point a Mull of Kintyre. Suroeste 3 o 4,","fr":"Tu entends — le bulletin marine, émis à 17h05 jeudi : « Malin, Hébrides. Sud-ouest 3 à 4, fraîchissant 5 à 7 plus tard. Peu agitée · ou agitée, devenant forte plus tard. Beau. Bonne visibilité. » · « Côte, d'Ardnamurchan Point à Mull of Kintyre. Sud-ouest 3 à 4,","it":"Senti — il bollettino del mare, emesso alle 17:05 di giovedì: «Malin, Ebridi. Sud-ovest 3 o 4, in aumento 5-7 più tardi. Poco mossa · o mossa, in aumento fino ad agitata più tardi. Bello. Buona visibilità.» · «Costa, da Ardnamurchan Point a Mull of Kintyre. Sud-ovest 3 o 4,","ja":"聞こえる——海上予報、木曜日17:05発表：「マリン、ヘブリディーズ。南西の風3または4、のち5から7に強まる。波はおだやか · またはやや高く、のち高くなる。晴れ。視界良好」· 「沿岸、アードナマーハン岬からキンタイア岬。南西の風3または4、","pt":"Ouves — o boletim do mar, emitido às e radio: \"Brannan. Get the boards in. The dog ___.\"","ar":"أنتِ، عبر اللاسلكي: \"برانان. أخرِج الألواح من الماء. الكلب ___.\"","de":"Du, über Funk: „Brannan. Holen Sie die Boards rein. Der Hund ___.“","es":"Tú, por radio: “Brannan. Saca las tablas del agua. El perro ___.”","fr":"Toi, à la radio : « Brannan. Faites rentrer les planches. Le chien ___. »","it":"Tu, alla radio: «Brannan. Tira dentro le tavole. Il cane ___.»","ja":"あなた、無線で：「ブラナン。ボードを水から上げて。犬が___」","pt":"Tu, pelo rádio: «Brannan. Tire as pranchas da água. O cão ___.»","ru":"Ты, по рации: «Брэннан. Уберите доски из воды. Собака ___.»","zh":"你，用无线电：“布兰南。把桨板都弄上来。那条狗___。”"},"opts":[{"en":"just goes under"},{"en":"has just gone under"},{"en":"has just went under"}],"answer":1,"fb":{"en":"JUST sits between HAS and the PAST PARTICIPLE: HAS JUST GONE. WENT is the Past Simple and never follows HAS; the Present Simple has no JUST-now meaning here.","ar":"JUST تأتي بين HAS وPAST PARTICIPLE: HAS JUST GONE. أما WENT فهي Past Simple ولا تأتي أبدًا بعد HAS؛ وPresent Simple لا يحمل هنا معنى \"للتوّ\" الذي تعطيه JUST.","de":"JUST steht zwischen HAS und dem PAST PARTICIPLE: HAS JUST GONE. WENT ist das Past Simple und steht nie nach HAS; das Present Simple kann hier kein „gerade eben“ (JUST) ausdrücken.","es":"JUST va entre HAS y el PAST PARTICIPLE: HAS JUST GONE. WENT es el Past Simple y nunca va detrás de HAS; el Present Simple no tiene aquí el sentido de JUST, de ahora mismo.","fr":"JUST se place entre HAS et le PAST PARTICIPLE : HAS JUST GONE. WENT est le Past Simple et ne suit jamais HAS ; le Present Simple n'a pas ici le sens de JUST, à l'instant.","it":"JUST sta tra HAS e il PAST PARTICIPLE: HAS JUST GONE. WENT è il Past Simple e non segue mai HAS; il Present Simple qui non ha il senso di JUST, proprio adesso.","ja":"JUST は HAS と PAST PARTICIPLE の間に入ります：HAS JUST GONE。WENT は Past Simple なので HAS の後には決して来ません。Present Simple には、ここで JUST の「たった今」の意味がありません。","pt":"JUST fica entre HAS e o PAST PARTICIPLE: HAS JUST GONE. WENT é o Past Simple e nunca vem depois de HAS; o Present Simple não tem aqui o sentido de JUST, agora mesmo.","ru":"JUST стоит между HAS и PAST PARTICIPLE: HAS JUST GONE. WENT — это Past Simple, и оно никогда не стоит после HAS; у Present Simple здесь нет значения JUST, «только что».","zh":"JUST 放在 HAS 和 PAST PARTICIPLE 之间：HAS JUST GONE。WENT 是 Past Simple，绝不放在 HAS 后面；Present Simple 在这里没有 JUST 那种“刚刚”的意思。"},"fbRight":{"en":"Brannan's launch is already moving.","ar":"زورق برانان يتحرّك بالفعل.","de":"Brannans Boot fährt schon los.","es":"La lancha de Brannan ya se está moviendo.","fr":"La vedette de Brannan est déjà en route.","it":"La lancia di Brannan si sta già muovendo.","ja":"ブラナンのランチはもう動き出しています。","pt":"A lancha do Brannan já está a andar.","ru":"Катер Брэннана уже отходит.","zh":"布兰南的汽艇已经出发了。"},"fbWrong":{"en":"Ten seconds. It matters.","ar":"عشر ثوانٍ. إنها مهمّة.","de":"Zehn Sekunden. Sie zählen.","es":"Diez segundos. Importan.","fr":"Dix secondes. Elles comptent.","it":"Dieci secondi. Contano.","ja":"十秒。それが大事です。","pt":"Dez segundos. Contam.","ru":"Десять секунд. Они важны.","zh":"十秒钟。很关键。"},"pages":[{"t":"story","b":{"en":"Friday, ten o'clock, and the regatta opens in sunshine. There are children on paddleboards inside the moorings, a pipe band on the quay and a black-and-white collie on the slipway chasing a yellow ball into the water, again and again.","ar":"الجمعة، العاشرة، ويُفتتح السباق تحت الشمس. أطفال على ألواح التجديف داخل المرسى، وفرقة قِرَب على الرصيف، وكلب كولي أبيض وأسود على منحدر الإنزال يطارد كرة صفراء إلى الماء، مرة بعد مرة.","de":"Freitag, zehn Uhr, und die Regatta eröffnet bei Sonnenschein. Kinder stehen auf Paddleboards innerhalb der Liegeplätze, eine Dudelsackkapelle spielt am Kai, und ein schwarz-weißer Collie jagt auf der Slipanlage immer wieder einen gelben Ball ins Wasser.","es":"Viernes, las diez, y la regata se abre con sol. Hay niños en tablas de paddle surf dentro de los amarres, una banda de gaitas en el muelle y un border collie blanco y negro en la rampa persiguiendo una pelota amarilla hacia el agua, una y otra vez.","fr":"Vendredi, dix heures, et la régate s'ouvre sous le soleil. Il y a des enfants sur des paddles à l'intérieur des corps-morts, un pipe band sur le quai et un colley noir et blanc sur la cale qui court après une balle jaune dans l'eau, encore et encore.","it":"Venerdì, le dieci, e la regata si apre con il sole. Ci sono bambini sui paddle board dentro gli ormeggi, una banda di cornamuse sulla banchina e un collie bianco e nero sullo scivolo che insegue una palla gialla in acqua, una volta dopo l'altra.","ja":"金曜日の十時、レガッタは日差しの中で始まります。係留区域の内側ではパドルボードに乗った子どもたち、岸壁にはパイプバンド、スリップウェイでは白黒のコリー犬が黄色いボールを追って何度も何度も水に飛び込んでいます。","pt":"Sexta-feira, dez horas, e a regata abre com sol. Há crianças em pranchas dentro das amarrações, uma banda de gaitas de foles no cais e um collie preto e branco na rampa a correr atrás de uma bola amarela para dentro de água, vezes sem conta.","ru":"Пятница, десять часов, регата открывается под солнцем. Дети на сап-досках внутри стоянки, волыночный оркестр на набережной и чёрно-белый колли на спуске, снова и снова гоняющийся за жёлтым мячом в воду.","zh":"星期五，十点，赛艇在阳光中开幕。系泊区里有孩子们在玩桨板，码头上有风笛乐队，滑道上一只黑白相间的牧羊犬一次又一次地追着一个黄球跳进水里。"},"img":"insert_collie.webp","hot":[63.0,40.0,12.0,16.0],"label":{"en":"THE SLIPWAY","ar":"منحدر الإنزال","de":"DIE SLIPANLAGE","es":"LA RAMPA","fr":"LA CALE","it":"LO SCIVOLO","ja":"スリップウェイ","pt":"A RAMPA","ru":"СПУСК","zh":"滑道"}},{"t":"story","b":{"en":"The dog's owner is a man in a deckchair with a flask.","ar":"صاحب الكلب رجل على كرسي شاطئ ومعه ترمس.","de":"Der Besitzer des Hundes ist ein Mann in einem Liegestuhl mit einer Thermoskanne.","es":"El dueño del perro es un hombre en una tumbona con un termo.","fr":"Le maître du chien est un homme dans un transat avec un thermos.","it":"Il padrone del cane è un uomo su una sdraio con un thermos.","ja":"犬の飼い主は、魔法瓶を持ってデッキチェアに座っている男性です。","pt":"O dono do cão é um homem numa espreguiçadeira com um term  buy you the beak, Provost.","ar":"تسمعين: منزيس: \"خصّص المجلس عشرة آلاف جنيه لمن يأتي به. عشرة آلاف. في هذا الميناء قوارب تحتاج إليها.\" تولوخ: \"عشرة آلاف لن تشتري لك المنقار يا حضرة العمدة.","de":"Du hörst: Menzies: „Der Gemeinderat hat zehntausend Pfund ausgesetzt für den, der es hereinbringt. Zehntausend. In diesem Hafen gibt es Boote, die das brauchen könnten.“ Tulloch: „Für zehntausend kriegen Sie den Schnabel nicht, Herr Bürgermeister.","es":"Oyes: Menzies: “El ayuntamiento ha puesto diez mil libras para quien lo traiga. Diez mil. Hay barcos en este puerto a los que les vendrían bien.” Tulloch: “Diez mil no le compran el pico, alcalde.","fr":"Tu entends : Menzies : « Le conseil a mis dix mille livres pour celui qui le ramènera. Dix mille. Il y a des bateaux dans ce port qui en auraient besoin. » Tulloch : « Dix mille ne vous achètent pas le bec, monsieur le maire.","it":"Senti: Menzies: «Il consiglio ha messo diecimila sterline per chi lo porta a riva. Diecimila. Ci sono barche in questo porto a cui farebbero comodo.» Tulloch: «Diecimila non le comprano il becco, signor sindaco.","ja":"聞こえる：メンジーズ：「議会は、それを仕留めた者に一万ポンドを出す。一万だ。この港には、それがありがたい船もあるだろう」タロック：「一万じゃくちばしは買えませんよ、町長。","pt":"Ouves: Menzies: «A câmara pôs dez mil libras para quem o trouxer. Dez mil. Há barcos neste porto a quem davam jeito.» Tulloch: «Dez mil não lhe compram o bico, senhor presidente.","ru":"Ты слышишь: Мензис: «Совет выделил десять тысяч фунтов тому, кто его привезёт. Десять тысяч. В этой гавани есть лодки, которым это пригодилось бы.» Таллох: «Десять тысяч не купят вам клюв, господин мэр.","zh":"你听到：孟席斯：“议会拿出一万英镑，谁把它弄回来就归谁。一万。这个港口里有些船正用得着。”塔洛克：“一万块买不到那只喙，镇长。"},"img":"insert_tulloch_hall.webp","hot":[76.0,60.0,12.0,16.0],"label":{"en":"TULLOCH","ar":"تولوخ","de":"TULLOCH","es":"TULLOCH","fr":"TULLOCH","it":"TULLOCH","ja":"タロック","pt":"TULLOCH","ru":"ТАЛЛОХ","zh":"塔洛克"}},{"t":"story","b":{"en":"Ten will buy you a photograph and a funeral. Thirty thousand, my boat, my crew, my way. For thirty I'll bring you the beak and you'll never see it on this coast again. I've been after this thing since 1998.","ar":"العشرة تشتري لك صورة وجنازة. ثلاثون ألفًا، وقاربي، وطاقمي، وطريقتي. مقابل الثلاثين أُحضر لك المنقار ولن تراه على هذا الساحل مرة أخرى. أنا أطارد هذا الشيء منذ 1998.","de":"Für zehn kriegen Sie ein Foto und eine Beerdigung. Dreißigtausend, mein Boot, meine Leute, auf meine Art. Für dreißig bringe ich Ihnen den Schnabel, und Sie werden es an dieser Küste nie wiedersehen. Ich bin seit 1998 hinter diesem Ding her.","es":"Diez le compran una fotografía y un funeral. Treinta mil, mi barco, mi tripulación, a mi manera. Por treinta le traigo el pico y no volverá a verlo en esta costa. Llevo detrás de esta cosa desde 1998.","fr":"Dix vous achètent une photo et un enterrement. Trente mille, mon bateau, mon équipage, à ma façon. Pour trente je vous rapporte le bec et vous ne le reverrez jamais sur cette côte. Je traque cette chose depuis 1998.","it":"Dieci le comprano una fotografia e un funerale. Trentamila, la mia barca, il mio equipaggio, a modo mio. Per trenta le porto il becco e non lo rivedrà mai più su questa costa. Sto dietro a questa cosa dal 1998.","ja":"一万で買えるのは写真一枚と葬式一つだ。三万、俺の船、俺の乗組員、俺のやり方で。三万出せばくちばしを持ってきて、この海岸で二度と見ないようにしてやる。俺は1998年からこいつを追ってるんだ。","pt":"Dez compram-lhe uma fotografia e um funeral. Trinta mil, o meu barco, a minha tripulação, à minha maneira. Por trinta trago-lhe o bico e nunca mais o vê nesta costa. Ando atrás desta coisa desde 1998.","ru":"Десять купят вам фотографию и похороны. Тридцать тысяч, моя лодка, моя команда, мои методы. За тридцать я привезу вам клюв, и вы больше никогда не увидите его на этом побережье. Я за этой тварью с 1998 года.","zh":"一万块能给你买一张照片和一场葬礼。三万，用我的船，我的船员，照我的办法。给我三万，我把喙给你带回来，你在这片海岸再也不会见到它。我从1998年起就在追这东西。"},"img":"insert_tulloch_hall.webp","hot":[76.0,60.0,12.0,16.0],"label":{"en":"TULLOCH","ar":"تولوخ","de":"TULLOCH","es":"TULLOCH","fr":"TULLOCH","it":"TULLOCH","ja":"タロック","pt":"TULLOCH","ru":"ТАЛЛОХ","zh":"塔洛
