:root{--cake-a:rgba(207,52,125,.55);--cake-b:rgba(36,121,173,.55);
--cake-a-ink:#fff0f7;--cake-b-ink:#eef7ff;
--cake-a-edge:#ff8dc2;--cake-b-edge:#7cc4f2;
--cake-a-wash:rgba(207,52,125,.22);--cake-b-wash:rgba(36,121,173,.22);
--accent:#efbb64;--accent-ink:#10222c;--deep:#08131c;--panel:rgba(8,19,28,.88);--scrim:rgba(8,19,28,.88);--bone:#fff6d9;--muted:#d9ccb0;--soft:#efe2c0;--good:#77efb4;--bad:#ff6f82;--shadow:rgba(0,0,0,.55);
/* The scale unit. Every size below was authored as a fraction of a 16:9
   frame's width, so on a wider window the type outgrew the panel and the
   options fell below the fold. 1vw and 1.7778vh are equal at 16:9, so this
   changes nothing there and only ever caps, never enlarges. The frame is
   the viewport (.game is fixed inset:0), which is why vw/vh and not cqw. */
--u:min(1vw,1.7778vh)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0703;color:var(--bone);font-family:"Courier New",Courier,monospace}
/* Monocraft is the display face — titles, kickers, HUD, buttons, labels. The
   reading text (story, clue, prompt, options, feedback, glosses) stays in
   Courier New, as Blocula has it: a pixel face at paragraph length is hard
   work, and Innes asked for the split on 2026-09-06. */
.title,.kicker,.badge,.lang-btn,.utility,.lang-item b,.hot-label,.hide-btn,.option .key,.continue,.start,.restart,.rules-chips span,.rule-card b,.route b,.final-score,.feedback strong,.corner-help,.option .half small,.clue b{font-family:'Monocraft',"Courier New",Courier,monospace}
button{font:inherit}
.game{position:fixed;inset:0;background:#0a0703}
.frame{position:absolute;inset:0;overflow:hidden;container-type:inline-size}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.04) contrast(1.03)}
/* opt-in, per lesson: show the whole plate, letterboxed in the deep colour */
.fit-contain .scene-img{object-fit:contain}
.fit-contain{background:#08131c}
/* ── HUD ── */
.hud{position:absolute;z-index:5;top:calc(1.3 * var(--u));left:calc(1.5 * var(--u));right:calc(1.5 * var(--u));display:flex;align-items:center;justify-content:space-between;gap:calc(1 * var(--u));pointer-events:none}
.hud-group{display:flex;gap:calc(.55 * var(--u));align-items:center;flex-wrap:wrap}
.badge{background:var(--panel);backdrop-filter:blur(5px);border:1px solid rgba(255,246,217,.34);box-shadow:0 0 calc(1.3 * var(--u)) var(--shadow);padding:calc(.5 * var(--u)) calc(.8 * var(--u));font-size:calc(1.15 * var(--u));letter-spacing:.04em;white-space:nowrap}
.badge b{color:var(--accent);font-weight:700}
.langs{display:flex;gap:calc(.35 * var(--u));pointer-events:auto;position:relative}
.lang-btn,.utility{border:1px solid rgba(255,246,217,.35);color:var(--bone);background:var(--panel);padding:calc(.5 * var(--u)) calc(.75 * var(--u));cursor:pointer;font-size:calc(1.1 * var(--u));pointer-events:auto}
.lang-btn{display:flex;align-items:center;gap:0;white-space:nowrap}
/* The three utilities sit as bare icons and give their words back on hover or
   keyboard focus. Three labelled buttons across the top of a painted frame is
   a lot of furniture over somebody's artwork, and the keys (L, S, F) and the
   corner help line already say what they do. The label is collapsed by width
   rather than removed, so it stays in the accessibility tree and a screen
   reader still reads "SOUND OFF". */
.u-label{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:middle;transition:max-width .2s ease,opacity .18s ease}
.utility:hover .u-label,.utility:focus-visible .u-label,.langs:focus-within .u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}
/* a touch screen has no hover, so there the words are simply always on */
@media(hover:none){.u-label{max-width:20em;opacity:1;margin-left:calc(.4 * var(--u))}}.lang-btn b{color:var(--accent)}
.utility:hover,.lang-btn:hover{border-color:var(--bone)}
.utility.fs{display:flex;align-items:center;gap:calc(.35 * var(--u));color:var(--accent-ink);background:linear-gradient(180deg,#fff0b8,var(--accent));border:1px solid #fff8dc;font-weight:700;letter-spacing:.06em;animation:fsglow 2.4s ease-in-out infinite}
.utility.fs:hover{filter:brightness(1.08)}
.lang-menu[hidden]{display:none}
.lang-menu{position:absolute;right:0;top:calc(100% + calc(.4 * var(--u)));z-index:20;display:grid;grid-template-columns:1fr;gap:calc(.25 * var(--u));min-width:calc(18 * var(--u));padding:calc(.45 * var(--u));background:rgba(14,9,2,.97);border:1px solid rgba(255,246,217,.4);box-shadow:0 calc(1 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.7)}
.lang-item{display:grid;grid-template-columns:calc(3 * var(--u)) 1fr;align-items:center;gap:calc(.4 * var(--u));border:1px solid transparent;background:none;color:var(--bone);padding:calc(.45 * var(--u)) calc(.55 * var(--u));text-align:left;cursor:pointer;font-size:calc(1.05 * var(--u))}
.lang-item b{color:var(--accent);font-size:calc(.95 * var(--u))}.lang-item:hover{border-color:rgba(255,246,217,.5);background:rgba(60,40,5,.9)}
.lang-item.active{background:var(--accent);color:var(--accent-ink)}.lang-item.active b{color:var(--accent-ink)}
/* ── the panel ── */
.zone{position:absolute;z-index:4;top:8%;bottom:3.5%;left:2.2%;right:2.2%;display:flex;pointer-events:none}
.content{pointer-events:auto;display:flex;flex-direction:column;gap:calc(.8 * var(--u));width:46%;max-height:100%;overflow:auto;scrollbar-width:thin;padding:calc(1.2 * var(--u)) calc(1.4 * var(--u));background:var(--panel);border:1px solid rgba(255,246,217,.22);box-shadow:0 calc(1.4 * var(--u)) calc(4 * var(--u)) var(--shadow);backdrop-filter:blur(6px);transition:transform .38s cubic-bezier(.2,.9,.3,1.15),opacity .22s ease;transform-origin:50% 50%}

<body class="paywalled">
<main class="game" aria-live="polite">
  <section id="frame" class="frame left v-center">
    <img id="sceneImage" class="scene-img" alt="">
    <button id="hot" class="hot" aria-label="Show the text"><i></i><span id="hotLabel" class="hot-label">CLICK TO READ</span></button>

        <div class="badge" id="tilesBadge"><span id="lblTiles">TILES</span> <b id="tiles"></b></div>
        <div class="badge" id="chancesBadge"><span id="lblChances">CHANCES</span> <b id="chances"></b></div>
        <div class="badge" id="progressBadge" hidden><span id="lblProgress">SPELLS</span> <b id="progress"></b></div>
      </div>
      <div class="hud-group">
        <div class="langs">

nd das Licht ist fast weg. Davie Lennox und sein Neffe Tam holen Reusen ein an der Mündung der Engen, wo das tiefe Wasser beginnt.","es":"Las diez, y casi no queda luz. Davie Lennox y su sobrino Tam recogen nasas en la boca de los Estrechos, donde empieza el agua profunda."},{"en":"Tam has been fishing with his uncle for three summers and he knows the sounds of the boat by heart: the winch, the creel on the rail, the gulls. Tonight there are no gulls. \"Davie. Where have the birds gone?\"","de":"Tam fischt seit drei Sommern mit seinem Onkel und kennt die Geräusche des Boots auswendig: die Winde, die Reuse an der Reling, die Möwen. Heute Nacht gibt es keine Möwen. „Davie. Wo sind die Vögel hin?“","es":"Tam lleva tres veranos pescando con su tío y se sabe de memoria los sonidos del barco: el torno, la nasa en la barandilla, las gaviotas. Esta noche no hay gaviotas. “Davie. ¿Adónde se han ido los pájaros?”"},{"en":"Davie doesn't answer. The rope on the winch has gone tight. Not creel-tight. Tight like something has taken hold of it and is pulling it down, slowly, with all the time in the world. The stern dips.","de":"Davie antwortet nicht. Das Seil an der Winde ist stramm geworden. Nicht reusenstramm. Stramm, als hätte etwas es gepackt und zöge es nach unten, langsam, mit aller Zeit der Welt. Das Heck taucht ein.","es":"Davie no contesta. El cabo del torno se ha tensado. No tenso como una nasa. Tenso como si algo lo hubiera agarrado y tirara de él hacia abajo, despacio, con todo el tiempo del mundo. La popa se hunde."},{"en":"The yellow marker barrel rolls across the deck. \"Cut it,\" says Davie. \"Cut the rope.\" Tam has the knife in his hand when the water beside the boat goes white.","de":"Die gelbe Markierungstonne rollt über das Deck. „Kapp es“, sagt Davie. „Kapp das Seil.“ Tam hat das Messer in der Hand, als das Wasser neben dem Boot weiß wird.","es":"El bidón amarillo de marca rueda por la cubierta. “Córtalo”, dice Davie. “Corta el cabo.” Tam tiene el cuchillo en la mano cuando el agua junto al barco se vuelve blanca."}],"k":{"en":"WEDNESDAY NIGHT","de":"MITTWOCHNACHT","es":"MIÉRCOLES POR LA NOCHE"},"kind":"story","next":"1.1"},"1.1":{"img":"03_q1_drift.webp","hot":[77.5,60.0,12.0,16.0],"title":{"en":"THE DRIFTING BOAT","de":"DAS TREIBENDE BOOT","es":"EL BARCO A LA DERIVA"},"story":[{"en":"First light. You have been in Inverbrae six days and you have not yet seen the harbour empty. It is empty now.","de":"Erstes Licht. Du bist seit sechs Tagen in Inverbrae und hast den Hafen noch nie leer gesehen. Jetzt ist er leer.","es":"Primera luz. Llevas seis días en Inverbrae y todavía no has visto el puerto vacío. Ahora está vacío."},{"en":"The Lennox boat has drifted in against the pier on its own, the mooring rope trailing in the water, the wheelhouse door open. Nobody aboard.","de":"Das Boot der Lennox ist von allein gegen die Pier getrieben, die Festmacherleine schleift im Wasser, die Tür des Steuerhauses steht offen. Niemand an Bord.","es":"El barco de los Lennox ha llegado solo a la deriva contra el muelle, con el cabo de amarre arrastrando en el agua y la puerta del puente abierta. No hay nadie a bordo."},{"en":"In the stern, one yellow marker barrel lies on its side, chewed and split, as if a dog the size of a bus had worried it and let it go.","de":"Im Heck liegt eine gelbe Markierungstonne auf der Seite, zerbissen und aufgeplatzt, als hätte ein Hund von der Größe eines Busses sie geschüttelt und wieder losgelassen.","es":"En la popa, un bidón amarillo de marca yace de lado, mordido y partido, como si un perro del tamaño de un autobús lo hubiera zarandeado y lo hubiera soltado."},{"en":"Fergus Brannan, the harbourmaster, is waiting for you with the night log open in his hands. He has not slept.","de":"Fergus Brannan, der Hafenmeister, wartet auf dich, das Nachtbuch offen in den Händen. Er hat nicht geschlafen.","es":"Fergus Brannan, el capitán del puerto, te espera con el libro de guardia abierto en las manos. No ha dormido."}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES"},"kind":"question","next":"1.2","prompt":{"en":"Brannan: \"I tried the radio when they were overdue. Read me the log, sergeant. How long had they been overdue when I tried?\"","de":"Brannan: „Ich habe über Funk gerufen, als sie überfällig waren. Lesen Sie mir das Buch vor, Sergeant. Wie lange waren sie überfällig, als ich gerufen habe?“","es":"Brannan: “Llamé por radio cuando se retrasaron. Léeme el libro, sargento. ¿Cuánto retraso llevaban cuando llamé?”"},"opts":[{"en":"Forty-five minutes"},{"en":"Six hours and twenty minutes"},{"en":"About fifteen minutes"}],"answer":0,"fb":{"en":"The boat was due at 23:30. The first radio call was at 00:15: FORTY-FIVE MINUTES later. Six hours and twenty minutes is the delay from 23:30 until the boat drifted in at 05:50.","de":"Das Boot sollte um 23:30 zurück sein. Der erste Funkruf war um 00:15: FÜNFUNDVIERZIG MINUTEN später. Sechs Stunden und zwanzig Minuten sind die Zeit von 23:30 bis das Boot um 05:50 hereintrieb.","es":"El barco tenía que volver a las 23:30. La primera llamada por radio fue a las 00:15: CUARENTA Y CINCO MINUTOS después. Seis horas y veinte minutos es el tiempo desde las 23:30 hasta que el barco llegó a la deriva a las 05:50."},"clue":[{"en":"You read — the harbour log, Wednesday night: 20:40 — Lennox, creel boat, two crew, out to the Narrows. Due back 23:30. · 23:30 — Not back. · 00:15 — No answer on VHF. Tried three times.","de":"Du liest — das Hafenbuch, Mittwochnacht: 20:40 — Lennox, Reusenboot, zwei Mann, raus zu den Engen. Rückkehr 23:30. · 23:30 — Nicht zurück. · 00:15 — Keine Antwort auf UKW. Dreimal versucht.","es":"Lees — el libro de guardia del puerto, miércoles por la noche: 20:40 — Lennox, barco de nasas, dos tripulantes, salida a los Estrechos. Regreso previsto 23:30. · 23:30 — No ha vuelto. · 00:15 — Sin respuesta por VHF. Tres intentos."},{"en":"05:50 — Boat drifted in against the pier. Empty.","de":"05:50 — Boot treibt gegen die Pier. Leer.","es":"05:50 — El barco llega a la deriva contra el muelle. Vacío."}],"relic":true},"1.2":{"img":"04_q2_bell.webp","hot":[89.0,17.6,12.0,16.0],"title":{"en":"THE HARBOUR BELL","de":"DIE HAFENGLOCKE","es":"LA CAMPANA DEL PUERTO"},"story":[{"en":"There is a brass bell on a stone post at the head of the pier. It is rung when a boat is lost.","de":"Auf einem Steinpfosten am Kopf der Pier hängt eine Messingglocke. Sie wird geläutet, wenn ein Boot verloren geht.","es":"Hay una campana de latón sobre un poste de piedra en la punta del muelle. Se toca cuando se pierde un barco."},{"en":"Old Mrs Rennie, who has lived above the harbour for eighty years, tells you it has not been rung since the Ossian went down, and that was when you were a child.","de":"Die alte Mrs Rennie, die seit achtzig Jahren über dem Hafen wohnt, sagt dir, sie sei nicht mehr geläutet worden, seit die Ossian unterging, und das war, als du ein Kind warst.","es":"La señora Rennie, que lleva ochenta años viviendo encima del puerto, te dice que no se toca desde que se hundió el Ossian, y eso fue cuando tú eras niña."},{"en":"Brannan has the rope in his hand and he is looking at you, because you are the police and it is your call. Behind him the village has started to come down the hill. Nobody has said the word yet.","de":"Du: „Läute sie. Zwei Männer ___ zurück.“","es":"Brannan tiene la cuerda en la mano y te está mirando, porque tú eres la policía y la decisión es tuya. Detrás de él el pueblo ha empezado a bajar la cuesta. Todavía nadie ha dicho la palabra."}],"k":{"en":"CHAPTER 1 · INVERBRAE · THURSDAY","de":"KAPITEL 1 · INVERBRAE · DONNERSTAG","es":"CAPÍTULO 1 · INVERBRAE · JUEVES"},"kind":"question","next":"1.3","prompt":{"en":"You: \"Ring it. Two men ___ back.\"","de":"das verneinte Present Perfect ist HAVEN'T + PAST PARTICIPLE. COME ist das Partizip; CAME ist das Past Simple und steht nie nach HAVE.","es":"Tú: “Tócala. Dos hombres ___ .”"},"opts":[{"en":"didn't came"},{"en":"haven't come"},{"en":"haven't came"}],"answer":1,"fb":{"en":"the negative Present Perfect is HAVEN'T + PAST PARTICIPLE. COME is the participle; CAME is the Past Simple and never follows HAVE.","de":"Brannan hat das Seil in der Hand und sieht dich an, denn du bist die Polizei und es ist deine Entscheidung. Hinter ihm hat das Dorf angefangen, den Hügel herunterzukommen. Noch hat niemand das Wort ausgesprochen.","es":"el Present Perfect negativo es HAVEN'T + PAST PARTICIPLE. COME es el participio; CAME es el Past Simple y nunca va detrás de HAVE."},"clue":[{"en":"You hear: Brannan: \"Say it, sergeant, and I'll ring it.\"","de":"Du hörst: Brannan: „Sagen Sie es, Sergeant, und ich läute.“","es":"Oyes: Brannan: “Dílo, sargento, y la toco.”"}]},"1.3":{"img":"05_q3_provost.webp","hot":[76.0,70.0,12.0,16.0],"title":{"en":"THE PROVOST","de":"DER BÜRGERMEISTER","es":"EL ALCALDE"},"story":[{"en":"Provost Menzies finds you on the quay at nine, where the bunting has been going up all week for Regatta Week. Menzies has been Provost for eleven years and has never lost a vote.","de":"Bürgermeister Menzies findet dich um neun am Kai, wo die ganze Woche Wimpel für die Regattawoche aufgehängt werden. Menzies ist seit elf Jahren Bürgermeister und hat noch nie eine Abstimmung verloren.","es":"El alcalde Menzies te encuentra en el muelle a las nueve, donde llevan toda la semana colgando banderines para la Semana de la Regata. Menzies lleva once años de alcalde y nunca ha perdido una votación."},{"en":"He stands beside a big red mooring buoy that has just been painted for the visitors, and he does not look at the Lennox boat once.","de":"Er steht neben einer großen roten Festmachertonne, die gerade erst für die Besucher gestrichen wurde, und sieht das Boot der Lennox kein einziges Mal an.","es":"Está de pie junto a una gran boya roja de amarre recién pintada para los visitantes, y no mira ni una sola vez el barco de los Lennox."}],"k":{"e mal fuera de esta costa. No dice nada sobre cuándo. La fotografía es lo que, según él, se compra con diez mil."},"clue":[{"en":"You hear: Menzies: \"The council has put up ten thousand pounds for whoever brings it in. Ten thousand. There are boats in this harbour that could use it.\"","de":"Du hörst: Menzies: „Der Gemeinderat hat zehntausend Pfund ausgesetzt für den, der es hereinbringt. Zehntausend. In diesem Hafen gibt es Boote, die das brauchen könnten.“","es":"Oyes: Menzies: “El ayuntamiento ha puesto diez mil libras para quien lo traiga. Diez mil. Hay barcos en este puerto a los que les vendrían bien.”"},{"en":"Tulloch: \"Ten thousand won't buy you the beak, Provost. Ten will buy you a photograph and a funeral. Thirty thousand, my boat, my crew, my way. For thirty I'll bring you the beak and you'll never see it on this coast again. I've been after this thing since 1998. I'll not rush it for ten.\"","de":"Tulloch: „Zehntausend kaufen Ihnen nicht den Schnabel, Herr Bürgermeister. Zehn kaufen Ihnen ein Foto und eine Beerdigung. Dreißigtausend, mein Boot, meine Leute, meine Art. Für dreißig bringe ich Ihnen den Schnabel, und Sie werden es an dieser Küste nie wiedersehen. Ich bin seit 1998 hinter diesem Ding her. Für zehn überstürze ich nichts.“","es":"Tulloch: “Diez mil no le compran el pico, alcalde. Diez le compran una fotografía y un funeral. Treinta mil, mi barco, mi tripulación, a mi manera. Por treinta le traigo el pico y no volverá a verlo en esta costa. Llevo detrás de esta cosa desde 1998. No voy a darme prisa por diez.”"},{"en":"Dr Rhona Vass has been standing beside you since the radiator. She arrived off the Oban road an hour ago with a silver instrument case, and she has not stopped writing.","de":"Dr. Rhona Vass steht seit der Sache mit der Heizung neben dir. Sie kam vor einer Stunde über die Straße von Oban, mit einem silbernen Instrumentenkoffer, und sie hat nicht aufgehört zu schreiben.","es":"La doctora Rhona Vass lleva a tu lado desde lo del radiador. Llegó por la carretera de Oban hace una hora con un maletín plateado de instrumentos, y no ha parado de escribir."}]},"1.9":{"img":"11_q9_jar.webp","hot":[80.0,59.0,12.0,16.0],"title":{"en":"THE JAR","de":"DAS GLAS","es":"EL TARRO"},"story":[{"en":"The village hall kitchen, Saturday morning, cold light through the window. On the table is a wide glass jar of clear fluid and inside it, turning slowly, is a black curved ring the size of your fist.","de":"Die Küche des Gemeindehauses, Samstagmorgen, kaltes Licht durch das Fenster. Auf dem Tisch steht ein breites Glas mit klarer Flüssigkeit, und darin dreht sich langsam ein schwarzer gebogener Ring von der Größe deiner Faust.","es":"La cocina del salón del pueblo, sábado por la mañana, luz fría por la ventana. Sobre la mesa hay un tarro ancho de cristal con líquido transparente y dentro, girando despacio, un anillo negro curvado del tamaño de tu puño."},{"en":"Vass found it jammed in the splintered gunwale of the Lennox boat. She has studied squid for nine years, in Baja, in Norway, in the Sea of Cortez, and she has been looking at this jar for two hours.","de":"Vass hat ihn in der zersplitterten Reling des Lennox-Boots eingeklemmt gefunden. Sie erforscht Kalmare seit neun Jahren, in Baja, in Norwegen, im Golf von Kalifornien, und sie sieht dieses Glas seit zwei Stunden an.","es":"Vass lo encontró encajado en la regala astillada del barco de los Lennox. Lleva nueve años estudiando calamares, en Baja California, en Noruega, en el mar de Cortés, y lleva dos horas mirando este tarro."}],"k":{"en":"CHAPTER 1 · INVERBRAE · SATURDAY","de":"KAPITEL 1 · INVERBRAE · SAMSTAG","es":"CAPÍTULO 1 · INVERBRAE · SÁBADO"},"kind":"question","next":"1.10","prompt":{"en":"Vass: \"Here's the test, sergeant. If somebody hauls up a four-metre squid this afternoon and hangs it on the crane, what size of beak should it have?\"","de":"Vass: „Hier ist der Test, Sergeant. Wenn heute Nachmittag jemand einen vier Meter langen Kalmar heraufholt ter lang, Tulloch.“","es":"Oyes: Vass: “Contacto. Cuarenta metros abajo, justo debajo de nosotros. Mide veinte metros. Lleva diez minutos debajo y no se ha movido.” · Tulloch: “Entonces no está cazando. Está esperando.” · Vass: “Este barco mide doce metros, Tulloch.”"},{"en":"Tulloch: \"I know what my boat is.\"","de":"Tulloch: „Ich weiß, wie lang mein Boot ist.“","es":"Tulloch: “Sé lo que mide mi barco.”"}]},"choice2":{"img":"25_choice2_narrows.webp","hot":[74.5,42.0,12.0,16.0],"title":{"en":"THE NARROWS","de":"DIE ENGEN","es":"LOS ESTRECHOS"},"story":[{"en":"Tulloch: \"It has two doors. The reef, where it feeds. The caves, where it sleeps. Pick one, sergeant. It's your money.\"","de":"Tulloch: „Es hat zwei Türen. Das Riff, wo es frisst. Die Höhlen, wo es schläft. Wählen Sie eine, Sergeant. Es ist Ihr Geld.“","es":"Tulloch: “Tiene dos puertas. El arrecife, donde come. Las cuevas, donde duerme. Elija una, sargento. Es su dinero.”"}],"kind":"choice","routes":[{"name":{"en":"THE SKERRY","de":"DIE SCHÄRE","es":"EL ISLOTE"},"desc":{"en":"Follow the broken reef where the seals used to haul out.","de":"Dem zerbrochenen Riff folgen, wo die Robben früher an Land gingen.","es":"Seguir el arrecife roto donde las focas solían salir del agua."},"target":"2.5a","route":"THE SKERRY"},{"name":{"en":"THE CAVES","de":"DIE HÖHLEN","es":"LAS CUEVAS"},"desc":{"en":"Enter the sea caves under the far cliff at low water.","de":"Bei Niedrigwasser in die Meereshöhlen unter der fernen Klippe hineinfahren.","es":"Entrar en las cuevas marinas bajo el acantilado lejano con la marea baja."},"target":"2.5b","route":"THE CAVES"}]},"2.5a":{"img":"26_q5a_float.webp","hot":[82.0,68.0,12.0,16.0],"title":{"en":"THE FLOAT","de":"DIE BOJE","es":"LA BOYA"},"story":[{"en":"The Kittiwake works over the reef in grey chop. Vass's orange float bobs behind on its cable, then stops bobbing.","de":"Die Kittiwake arbeitet in grauer Kabbelsee über dem Riff. Vass' orangefarbene Boje tanzt hinterher an ihrem Kabel, dann hört sie auf zu tanzen.","es":"El Kittiwake trabaja sobre el arrecife con marejadilla gris. La boya naranja de Vass cabecea detrás sujeta al cable, y luego deja de cabecear."},{"en":"The cable goes tight, the float goes under, and thirty seconds later it comes up two hundred metres away with the end of the cable hanging off it like a cut thread.","de":"Das Kabel wird stramm, die Boje geht unter, und dreißig Sekunden später kommt sie zweihundert Meter entfernt hoch, mit dem Kabelende daran wie ein durchtrennter Faden.","es":"El cable se tensa, la boya desaparece bajo el agua, y treinta segundos después sale doscientos metros más allá con la punta del cable colgando como un hilo cortado."}],"k":{"en":"CHAPTER 2 · THE SKERRY · MONDAY","de":"KAPITEL 2 · DIE SCHÄRE · MONTAG","es":"CAPÍTULO 2 · EL ISLOTE · LUNES"},"kind":"question","next":"2.6a","prompt":{"en":"Vass: \"That cable is steel. It ___ the cable. It didn't bite it. It cut it.\"","de":"Vass: „Dieses Kabel ist aus Stahl. Es ___ das Kabel. Es hat nicht zugebissen. Es hat geschnitten.“","es":"Vass: “Ese cable es de acero. ___ el cable. No lo mordió. Lo cortó.”"},"opts":[{"en":"has already cutted"},{"en":"have already cut"},{"en":"has already cut"}],"answer":2,"fb":{"en":"CUT is irregular and the participle is CUT: HAS ALREADY CUT. IT takes HAS, not HAVE; CUTTED does not exist.","de":"CUT ist unregelmäßig und das Partizip ist CUT: HAS ALREADY CUT. IT nimmt HAS, nicht HAVE; CUTTED gibt es nicht.","es":"CUT es irregular y su participio es CUT: HAS ALREADY CUT. IT lleva HAS, no HAVE; CUTTED no existe."},"clue":[{"en":"You hear: Vass: \"That cable is steel. It ___ the cable. It didn't bite it. It cut it.\" · Tulloch: \"Aye. It does that.\"","de":"Du hörst: Vass: „Dieses Kabel ist aus Stahl. Es ___ das Kabel. Es hat nicht zugebissen. Es hat geschnitten.“ · Tulloch: „Ja. Das macht es.“","es":"Oyes: Vass: “Ese cable es de acero. ___ el cable. No lo mordió. Lo cortó.” · Tulloch: “Sí. Hace eso.”"}]},"2.6a":{"img":"27_q6a_net.webp","hot":[77.0,68.0,12.0,16.0],"title":{"en":"THE NET","de":"DAS NETZ","es":"LA RED"},"story":[{"en":"Half a creel net comes up on the winch, cut clean along one edge as if with scissors. Tulloch turns it over in his hands. It is a Lennox net; he knows the knots.","de":"Ein halbes Reusennetz kommt an der Winde hoch, an einer Kante glatt durchtrennt wie mit einer Schere. Tulloch dreht es in den Händen. Es ist ein Lennox-Netz; er kennt die Knoten.","es":"Media red de nasas sube por el torno, cortada limpiamente por un lado como con tijeras. Tulloch le da vueltas en las manos. Es una red de los Lennox; conoce los nudos."}],"k":{"en":"CHAPTER 2 · THE SKERRY · MONDAY","de":"KAPITEL 2 · DIE SCHÄRE · MONTAG","es":"CAPÍTULO 2 · EL ISLOTE · LUNES"},"kind":"question","next":"2.7a","prompt":{"en":"Tulloch: \"___ the rest of it in yet?\"","de":"Tulloch: „___ den Rest schon eingeholt?“","es":"Tulloch: “¿___ el resto todavía?”"},"opts":[{"en":"Have you hauled"},{"en":"Did you hauled in"},{"en":"Have you hauling"}],"answer":0,"fb":{"en":"YET goes with a Present Perfect question: HAVE + subject + PAST PARTICIPLE. DID takes the base verb; HAVE never takes -ING on its own.","de":"YET gehört zu einer Frage im Present Perfect: HAVE + Subjekt + PAST PARTICIPLE. DID nimmt die Grundform; HAVE nimmt nie allein -ING.","es":"YET acompaña a una pregunta en Present Perfect: HAVE + sujeto + PAST PARTICIPLE. DID lleva el verbo en su forma base; HAVE nunca lleva -ING por sí solo."},"clue":[{"en":"You hear: Tulloch: \"___ the rest of it in yet?\" · You: \"No.\" · Tulloch: \"Then leave it. It's been down there since Wednesday and it wants us to lean over the rail for it.\"","de":"Du hörst: Tulloch: „___ den Rest schon eingeholt?“ · Du: „Nein.“ · Tulloch: „Dann lassen Sie es. Es liegt seit Mittwoch da unten und will, dass wir uns dafür über die Reling beugen.“","es":"Oyes: Tulloch: “¿___ el resto todavía?” · Tú: “No.” · Tulloch: “Pues déjelo. Lleva ahí abajo desde el miércoles y quiere que nos asomemos por la borda a por ello.”"}]},"2.7a":{"img":"28_q7a_sealrock.webp","hot":[79.0,30.0,12.0,16.0],"title":{"en":"THE SEAL ROCK","de":"DER ROBBENFELSEN","es":"LA ROCA DE LAS FOCAS"},"story":[{"en":"The seal rock at the end of the reef. In July, Tulloch says, there were sixty seals on it. Now there is one, an old bull on the highest point, and it does not look at the boat.","de":"Der Robbenfelsen am Ende des Riffs. Im Juli, sagt Tulloch, waren sechzig Robben darauf. Jetzt ist es eine, ein alter Bulle auf dem höchsten Punkt, und er sieht das Boot nicht an.","es":"La roca de las focas al final del arrecife. En julio, dice Tulloch, había sesenta focas encima. Ahora hay una, un macho viejo en el punto más alto, y no mira al barco."},{"en":"It looks at the water.","de":"Er sieht das Wasser an.","es":"Mira al agua."}],"k":{"en":"CHAPTER 2 · THE SKERRY · MONDAY","de":"KAPITEL 2 · DIE SCHÄRE · MONTAG","es":"CAPÍTULO 2 · EL ISLOTE · LUNES"},"kind":"question","next":"2.8a","prompt":{"en":"Vass: \"So why have the seals gone, according to him?\"","de":"Vass: „Und warum sind die Robben weg, seiner Meinung nach?“","es":"Vass: “¿Y por qué se han ido las focas, según él?”"},"opts":[{"en":"The regatta boats have scared them away"},{"en":"Something has been hunting them"},{"en":"The bad weather has driven them off"}],"answer":1,"fb":{"en":"Tulloch rules out shooting, sickness, weather and boats, and names one thing: something coming up on the rock at night.","de":"Tulloch schließt Abschuss, Krankheit, Wetter und Boote aus und nennt eine Sache: etwas, das nachts auf den Felsen kommt.","es":"Tulloch descarta los disparos, la enfermedad, el tiempo y los barcos, y señala una sola cosa: algo que sube a la roca por la noche."},"clue":[{"en":"You hear: Tulloch: \"They've not been shot and they've not been sick. Seals don't leave a rock in August, not for weather, not for boats. Something has been coming up on that rock at night.\"","de":"Du hörst: Tulloch: „Sie sind nicht geschossen ete es el número de los que no salieron."},"clue":[{"en":"You hear:","de":"Du hörst:","es":"Oyes:"},{"en":"Tulloch: \"The Ossian went down on the ninth of March 1998. That's a finished thing. I can say it in the past. Eleven of us. Trawler, out of Inverbrae, running home through the Cauldron at night because the skipper wanted his bed. Something took the net, and then it took the stern, and she went down in four minutes. Eleven of us went in the water. It was March. The water was six degrees.","de":"Tulloch: „Die Ossian ist am neunten März 1998 untergegangen. Das ist eine abgeschlossene Sache. Ich kann es in der Vergangenheit sagen. Elf von uns. Trawler, aus Inverbrae, nachts durch den Kessel nach Hause, weil der Skipper in sein Bett wollte. Etwas nahm das Netz, und dann nahm es das Heck, und sie ging in vier Minuten unter. Elf von uns gingen ins Wasser. Es war März. Das Wasser hatte sechs Grad.","es":"Tulloch: “El Ossian se hundió el nueve de marzo de 1998. Eso es una cosa terminada. Puedo decirlo en pasado. Éramos once. Arrastrero, de Inverbrae, volviendo a casa por el Caldero de noche porque el patrón quería su cama. Algo se llevó la red, y luego se llevó la popa, y se hundió en cuatro minutos. Once caímos al agua. Era marzo. El agua estaba a seis grados."},{"en":"\"It didn't come for us all at once. It came every hour or so, like it was choosing. You'd hear a man shout and then you'd not hear him. We held on to each other. We held on to a hatch cover. Nine hours we were in that water. Nine. The lifeboat found four of us at first light. Four out of eleven.","de":"„Es kam nicht auf einmal zu uns allen. Es kam etwa jede Stunde, als wähle es aus. Man hörte einen Mann schreien, und dann hörte man ihn nicht mehr. Wir hielten uns aneinander fest. Wir hielten uns an einem Lukendeckel fest. Neun Stunden waren wir in diesem Wasser. Neun. Das Rettungsboot fand vier von uns bei erstem Licht. Vier von elf.","es":"“No vino a por todos a la vez. Venía cada hora más o menos, como si eligiera. Oías gritar a un hombre y luego ya no lo oías. Nos agarrábamos unos a otros. Nos agarrábamos a una tapa de escotilla. Nueve horas estuvimos en esa agua. Nueve. El bote salvavidas encontró a cuatro a primera luz. Cuatro de once."},{"en":"\"I've never told the papers that. I've never told the Provost. I've been telling it to the sea for twenty-eight years, and the sea has never once answered.","de":"„Das habe ich den Zeitungen nie erzählt. Dem Bürgermeister habe ich es nie erzählt. Ich erzähle es seit achtundzwanzig Jahren dem Meer, und das Meer hat kein einziges Mal geantwortet.","es":"“Nunca se lo he contado a los periódicos. Nunca se lo he contado al alcalde. Llevo veintiocho años contándoselo al mar, y el mar no me ha contestado ni una vez."},{"en":"\"That's why I'll not rush it for ten thousand, sergeant. I've been waiting a long time. I can wait a night.\"","de":"„Deshalb überstürze ich nichts für zehntausend, Sergeant. Ich warte seit langer Zeit. Ich kann eine Nacht warten.“","es":"“Por eso no voy a darme prisa por diez mil, sargento. Llevo mucho tiempo esperando. Puedo esperar una noche.”"}]},"2.12":{"img":"37_q12_secondbarrel.webp","hot":[82.0,61.0,12.0,16.0],"title":{"en":"THE SECOND BARREL","de":"DIE ZWEITE TONNE","es":"EL SEGUNDO BIDÓN"},"story":[{"en":"It hits the boat in the middle of the third verse. The whole Kittiwake lifts a foot out of the water and drops. The lamp goes over.","de":"Es trifft das Boot mitten in der dritten Strophe. Die ganze Kittiwake hebt sich einen Fuß aus dem Wasser und fällt zurück. Die Lampe kippt um.","es":"Golpea el barco en mitad de la tercera estrofa. El Kittiwake entero se levanta un palmo del agua y cae. La lámpara se vuelca."},{"en":"A black arm comes across the stern rail, feeling, and Tulloch is at the harpoon gun before the lamp has stopped rolling.","de":"Ein schwarzer Arm kommt über die Heckreling, tastend, und Tulloch ist an der Harpunenkanone, bevor die Lampe aufgehört hat zu rollen.","es":"Un braz    type to fit), which caps a block at about 28 words — fine for the camp
   games, hopeless for a saga whose panels run 60 to 150. Paging is what the
   Kraken export did and it is the right answer: the reader taps READ ON and
   the question only appears under the last page. A scene with a single story
   block has one page and behaves exactly as before. */
const storyPages=s=>s.story?(Array.isArray(s.story)?s.story:[s.story]):[];
/* A scene reads as a sequence of pages: its story blocks, then its clue blocks,
   then — on a question — the prompt and the options on a page of their own.
   Paging only the story was not enough: measured across all 68 scenes, 82
   screens overflowed the panel, in English as well as in gloss, because the
   last page carried story, clue, prompt and three options at once. The export
   pages the clue too ("THE CLUE / 3 OF 3" then "YOUR ANSWER"), and STORY.md
   says why it is the right reading: a CCQ gives you the information first and
   asks about it afterwards, so leaving the clue behind is the exercise. */
function scenePages(s){const out=storyPages(s).map(b=>({t:'story',b}));
  /* opt-in per lesson. Six of the shipped eleven put a clue on 115 questions
     and read it beside the options; moving those onto a page of their own
     would be a change to those lessons that nobody asked for. */
  if(G.pageClues){
    if(s.clue)(Array.isArray(s.clue)?s.clue:[s.clue]).forEach(c=>out.push({t:'clue',b:c}));
    if(s.kind==='question')out.push({t:'ask'});
  }
  return out.length?out:[{t:'story',b:null}]}
const frame=document.getElementById('frame'), content=document.getElementById('content'), sceneImage=document.getElementById('sceneImage');
const hot=document.getElementById('hot'), hotLabel=document.getElementById('hotLabel'), zone=document.getElementById('zone');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MARK=/\[\[(\/?)([ab])\]\]/g;
const bare=s=>String(s??'').replace(MARK,'');          /* plain text: alt, review, answer read-back */
const esct=s=>esc(s).replace(MARK,(_,c,k)=>c?'</span>':'<span class="tone-'+k+'">');
const tx=(o,l)=>o?(l&&o[l]?o[l]:o.en):'';
function ui(key,vars){let s=tx(G.labels[key],state.lang==='off'?null:state.lang);if(vars)for(const k in vars)s=s.replace('{'+k+'}',vars[k]);return s}
/* a gloss identical to the English (a formula, a name) is not shown — it would only repeat the line */
const gloss=obj=>state.lang!=='off'&&obj[state.lang]&&obj[state.lang]!==obj.en?obj[state.lang]:'';
function line(obj,cls=''){if(!obj)return '';const en=esct(obj.en),g=gloss(obj);return g?`<span class="${cls}">${en}<span class="translation">${esct(g)}</span></span>`:`<span class="${cls}">${en}</span>`}
function label(obj){if(!obj)return '';const g=gloss(obj);return g?`${esct(obj.en)}<span class="translation">${esct(g)}</span>`:esct(obj.en)}
/* an option is {en,…} or, for a two-blank item, {parts:[a,b], kinds:['a'|'b',…], tags:[{en,…},{en,…}]} — two coloured halves */
function optText(o){return bare(o.parts?o.parts.join(' / '):o.en)}
function optMarkup(o){if(!o.parts)return `<span>${label(o)}</span>`;return o.parts.map((p,i)=>`<span class="half ${o.kinds[i]}"><small>${label(G.tags[o.kinds[i]])}</small><b>${esc(p)}</b></span>`).join('')}
/* `tilesLabel` lets a chapter rename its own collectibles — the Kraken saga
   counts EVIDENCE in part one, MARKER BARRELS in part two and THE LAST FOUR
   in part three, on the same HUD badge. A lesson without one uses ui('tiles'). */
function updateHUD(){const c=CH();const onHub=G.scenes[state.scene]?.kind==='hub';document.getElementById('score').textContent=state.score;document.getElementById('tiles').textContent='◆'.repeat(state.tiles)+'◇'.repeat(Math.max(0,c.tiles-state.tiles));document.getElementById('chances').textContent='♥'.repeat(state.chances)+'♡'.repeat(Math.max(0,c.chances-state.chances));document.getElementById('lblPoints').textContent=ui('points');document.getElementById('lblTiles').textContent=c.tilesLabel?tx(c.tilesLabel,state.lang==='off'?null:state.lang):ui('tiles');document.getElementById('lblChances').textContent=ui('chances');document.getElementById('tilesBadge').hidden=!c.tiles||onHub;document.getElementById('chancesBadge').hidden=!c.chances||onHub;document.getElementById('progressBadge').hidden=!c.total||onHub;if(c.total){document.getElementById('lblProgress').textContent=ui('progress');document.getElementById('progress').textContent=`${state.answered}/${c.total}`}document.getElementById('help').textContent=ui('help')}
/* A cover whose plate carries a painted title lockup has no title of its own: the h1 would only say the same thing again. */
/* the kicker and title belong to the scene, so they stay put while the story
   pages under them — a title that reappeared on every tap would read as a new
   scene each time. */
function head(s,pg){const has=s.title&&bare(s.title.en||'').trim();const t=s.kind==='intro'?`<span class="big">${label(s.title)}</span>`:label(s.title);
  /* the page's own body: a story block, a clue block in its labelled box, or
     nothing at all on the page that asks the question. */
  const body=!pg?'':pg.t==='story'?line(pg.b,'story'):pg.t==='clue'?`<div class="clue"><b>${ui('visual')}</b><br>${label(pg.b)}</div>`:'';
  return `${line(s.k,'kicker')}${has?`<h1 class="title ${s.kind==='intro'?'cover-title':''}">${t}</h1>`:''}${body}`}
/* HOT = [cx, cy, w, h] as % of the PICTURE (3:2). The picture is object-fit:cover in the frame, so convert picture space to frame pixels; a phone shows a narrow central slice and the object stays on it. */
/* `fit:'contain'` shows the whole plate and letterboxes the remainder in the
   page's deep colour, instead of filling the frame and cropping. A 3:2 plate
   in a 16:9 window loses about 16% of its height to `cover`, and the slide
   below then puts that entire loss on one edge — which on the Kraken cover ate
   the word THE and on a quayside scene took both characters' heads off. When
   the art is the lesson, cropping it is not a trade worth making.
   The maths below already handles a letterboxed image: every `dw>W` / `dh>H`
   branch falls to centring, which is exactly right once the picture fits. */
/* a scene may carry its own imgW/imgH. Most games are one aspect throughout,
   but a cover is often drawn to the screen while the story plates are drawn to
   the art brief's ratio — Kraken's cover is 16:9 and its 58 plates are 3:2 —
   and the glow has to be placed in the picture's own space or it drifts. */
function placeHot(s){const h=s.hot,IW=s.imgW||G.imgW,IH=s.imgH||G.imgH;const W=frame.clientWidth,H=frame.clientHeight,sc=(G.fit==='contain'?Math.min:Math.max)(W/IW,H/IH),dw=IW*sc,dh=IH*sc;
  /* cover crops the picture; slide it so the object stays on screen (a portrait phone shows a third of the width) */
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const ox=dw>W?clamp(W/2-h[0]/100*dw,W-dw,0):(W-dw)/2,oy=dh>H?clamp(H/2-h[1]/100*dh,H-dh,0):(H-dh)/2;
  sceneImage.style.objectPosition=`${dw>W?ox/(W-dw)*100:50}% ${dh>H?oy/(H-dh)*100:50}%`;
  const cx=ox+h[0]/100*dw,cy=oy+h[1]/100*dh,w=h[2]/100*dw,hh=h[3]/100*dh;hot.style.left=cx+'px';hot.style.top=cy+'px';hot.style.width=w+'px';hot.style.height=hh+'px';hot.classList.toggle('above',cy+hh/2>H*.84);hotLabel.textContent=ui('read');
  document.getElementById('fsLabel').textContent=ui('fullscreen');document.getElementById('soundLabel').textContent=ui(sound?'soundOn':'soundOff');document.getElementById('langWord').textContent=ui('translate');document.getElementById('langCur').textContent=state.lang==='off'?'OFF':G.names[state.lang];
  document.querySelectorAll('.lang-item').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
function setOpen(on){state.open=!!on;if(on){const hr=hot.getBoundingClientRect(),zr=zone.getBoundingClientRect();const cl=zr.left+content.offsetLeft,ct=zr.top+content.offsetTop;content.style.transformOrigin=`${hr.left+hr.width/2-cl}px ${hr.top+hr.height/2-ct}px`}frame.classList.toggle('open',state.open)}
function openPanel(){if(!state.open)setOpen(true)}
function closePanel(){if(state.open)setOpen(false)}
function render(){const s=G.scenes[state.scene];frame.className=`frame ${s.pos||'left'} v-${s.v||'center'} k-${s.kind}${s.kind==='intro'?' is-cover':''}${RTL.includes(state.lang)?' rtl':''}${G.fit==='contain'?' fit-contain':''}`;sceneImage.src=G.dir+s.img;sceneImage.alt=bare((s.title&&s.title.en)||s.alt||'');placeHot(s);const tr=state.lang!=='off';frame.classList.toggle('tr-on',tr);frame.classList.toggle('has-rules',!!s.rules&&s.kind!=='intro');content.style.width=((s.width||(s.pos==='center'?64:s.pos==='band'?92:46))+(tr?(s.pos==='band'?3:8):0))+'%';content.style.marginLeft=s.pos==='left'&&s.inset?s.inset+'%':'';content.style.marginRight=s.pos==='right'&&s.inset?s.inset+'%':'';
  const hide=`<button class="hide-btn" onclick="closePanel()" title="Esc">✕ ${ui('hide')}</button>`;
  const pgs=scenePages(s),np=pgs.length,pi=Math.min(state.page||0,np-1);
  let html=head(s,pgs[pi]),act='';
  /* mid-story: the only thing on offer is the next page. The scene's own
     action — question, routes, restart — waits for the last one. */
  if(pi<np-1){content.innerHTML=hide+html+`<div class="story-pager"><span class="page-count">${pi+1} / ${np}</span><button class="continue" onclick="nextPage()">${ui('readOn')}</button></div>`;content.scrollTop=0;updateHUD();setOpen(false);return}
  if(s.kind==='intro'){act+=`${s.rules?`<div class="rules-chips">${s.rules.map(r=>`<span>${label(r)}</span>`).join('')}</div>`:''}<button class="start" onclick="go('${s.next}')">${label(s.start)}</button>${s.small?`<div class="small">${label(s.small)}</div>`:''}`}
  else if(s.kind==='rules'){act+=`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('begin')}</button>`}
  else if(s.kind==='story'){act+=`${s.rules?`<div class="rules-intro">${s.rules.map(r=>`<div class="rule-card${r.tone?' tone-card-'+r.tone:''}"><b>${label(r.name)}</b>${label(r.form)}</div>`).join('')}</div>`:''}${s.note?`<div class="rule-note">${label(s.note)}</div>`:''}<button class="continue" onclick="go('${s.next}')">${s.button?label(s.button):ui('continue')}</button>`}
  else if(s.kind==='question'){act+=`${(!G.pageClues&&s.clue)?`<div class="clue"><b>${ui('visual')}</b><br>${label(Array.isArray(s.clue)?s.clue[0]:s.clue)}</div>`:''}<div class="prompt">${label(s.prompt)}</div><div class="options">${s.opts.map((o,i)=>`<button class="option${o.parts?' split':''}" data-i="${i}" onclick="answer(${i})"><span class="key">${i+1}</span>${optMarkup(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="continue" class="continue" hidden onclick="advance()">${ui('continue')}</button>`}
  else if(s.kind==='choice'){act+=`<div class="route-options">${s.routes.map((r,i)=>`<button class="route" onclick="chooseRoute(${i})"><b>${i+1} · ${label(r.name)}</b>${label(r.desc)}</button>`).join('')}</div>`}
  else if(s.kind==='hub'){act+=`<div class="chapter-list">${G.chapters.map((c,i)=>`<button class="chapter" onclick="startChapter(${i})"><b>${i+1} · ${label(c.title)}</b>${c.lead?label(c.lead):''}</button>`).join('')}</div>${s.small?`<div class="small">${label(s.small)}</div>`:''}`}
  else if(s.kind==='ending'){const c=CH();/* an ending may close with a paragraph that depends on the route taken (routeStory) */const rt=s.routeStory?(Object.entries(s.routeStory).find(([k])=>state.route.includes(k))||[])[1]:null;const rev=G.repair?(state.mistakes.length?`<div class="review">${state.mistakes.map(id=>{const m=G.scenes[id];return `<div>${esct(m.prompt.en)}<br><b>${esc(optText(m.opts[m.answer]))}</b> — ${label(m.fb)}</div>`}).join('')}</div>`:`<div class="small">${ui('perfect')}</div>`):'';const ft=G.repair?` · ${state.score/(G.points||1)}/${c.total} ${ui('firstTry')}`:'';
    /* the next chapter is offered from every ending, won or lost — a part
       three that can only be reached by mastering part two is a part three
       most learners never see. */
    const nx=(G.chapters&&state.chapter!=null&&state.chapter+1<G.chapters.length)?`<button class="start" onclick="startChapter(${state.chapter+1})">${ui('nextChapter',{n:state.chapter+2})}</button>`:'';
    const hub=(G.chapters)?`<button class="restart" onclick="toHub()">${ui('chapters')}</button>`:'';
    act+=`${rt?line(rt,'story'):''}<div class="final-score">${ui('finalScore')} ${state.score}/${c.max}${ft} · ${'◆'.repeat(state.tiles)}${'◇'.repeat(Math.max(0,c.tiles-state.tiles))}</div>${rev}${state.route.length?`<div class="small">${ui('route')}: ${esc(state.route.join(' · ').toUpperCase())}</div>`:''}${s.link?`<a class="start" href="${s.link}">${label(s.linkLabel)}</a>`:''}${nx}<button class="restart" onclick="restart()">${ui('restart')}</button>${hub}`}
  /* a band lays the two halves side by side; every other position stacks them */
  content.innerHTML=s.pos==='band'?`${hide}<div class="band-text">${html}</div><div class="band-act">${act}</div>`:hide+html+act;
  content.scrollTop=0;updateHUD();setOpen(false);
  if(s.kind==='question'&&Object.prototype.hasOwnProperty.call(state.results,state.scene))setTimeout(()=>displayAnswer(state.results[state.scene],false),0)}
hot.addEventListener('click',e=>{e.stopPropagation();openPanel()});
sceneImage.addEventListener('click',()=>{closeMenu();closePanel()});
window.addEventListener('resize',()=>placeHot(G.scenes[state.scene]));
const langMenu=document.getElementById('langMenu'), langBtn=document.getElementById('langBtn');
function closeMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false')}
function toggleMenu(){langMenu.hidden=!langMenu.hidden;langBtn.setAttribute('aria-expanded',String(!langMenu.hidden))}
function go(id){state.scene=id;state.page=0;render()}
/* paging keeps the panel up — the reader is mid-sentence, and folding it away
   on every tap would mean re-opening the object three times to read one scene */
function nextPage(){state.page=(state.page||0)+1;render();setOpen(true)}
function displayAnswer(i,apply){const s=G.scenes[state.scene];const buttons=[...document.querySelectorAll('.option')];const ok=i===s.answer;const p=s.points||G.points;const fb=document.getElementById('feedback');const expl=s.fb?`<br>${label(s.fb)}`:'';
  if(apply)beep(ok);
  if(G.repair&&!ok){/* repair mode: mark it, explain, let them try again */buttons[i].classList.add('wrong');buttons[i].disabled=true;fb.innerHTML=`<strong>${ui('tryAgain')}</strong>${expl}`;fb.className='feedback show bad';if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}));return}
  buttons.forEach(b=>b.disabled=true);buttons[i]?.classList.add(ok?'correct':'wrong');buttons[s.answer]?.classList.add('correct');
  const retried=G.repair&&(state.attempts[state.scene]||0)>0;
  if(apply){if(ok&&!retried){state.score+=p}if(ok&&s.relic)state.tiles=Math.min(CH().tiles,state.tiles+1);if(!ok)state.chances=Math.max(0,state.chances-1);if(s.final)state.finalCorrect=ok;state.answered++}
  const head=ok?(retried?ui('repaired'):ui(s.relic?'relic':'correct',{p})):ui('wrong');const was=ok?'':`<br>${ui('answerWas')} ${esc(optText(s.opts[s.answer]))}`;
  fb.innerHTML=`<strong>${head}</strong>${was}${expl}`;fb.className=`feedback show ${ok?'good':'bad'}`;document.getElementById('continue').hidden=false;updateHUD();if(apply)requestAnimationFrame(()=>content.scrollTo({top:content.scrollHeight,behavior:'smooth'}))}
function answer(i){if(Object.prototype.hasOwnProperty.call(state.results,state.scene))return;const s=G.scenes[state.scene];if(G.repair&&i!==s.answer){if(!(state.attempts[state.scene]||0))state.mistakes.push(state.scene);state.attempts[state.scene]=(state.attempts[state.scene]||0)+1;displayAnswer(i,true);return}state.results[state.scene]=i;displayAnswer(i,true)}
/* `alive` is "the player has not run out of chances". A repair-mode lesson has
   no chance counter at all (G.chances is 0 by design), so testing state.chances>0
   there is always false and silently kills every ending but `missing`/`failed` —
   a flawless Wonderland run scored 160/160 and was sent to the escape ending.
   With chances in play this is exactly the old test. */
/* `bands` is an ending chosen by score alone: [[min, sceneId], …] highest
   first, the first band the score reaches wins. An export whose endings are
   pure score thresholds (Frostbound: 64+ / 40-63 / below 40) has no tiles and
   no chances to reason about, and the tile/chance ladder below would send a
   64-point run to `missing` because G.tiles is 0. Lessons without `bands` are
   unchanged. */
/* `passScore` is the third way an export can decide an ending, after the
   tile/chance ladder and score-only `bands`: a pass mark, then the collection,
   then a perfect score. The Kraken export's own rule, verbatim —
   `chances<=0 || n<60 ? failed : items<4 ? missing : n===70 ? master : complete`
   — and it deliberately does not consult the final question, which the ladder
   below does. A 60/70 run with one collectible missing is `missing`; the
   ladder called it `failed` because the last answer was wrong, which is a
   different game from the one the export shipped. */
function resolve(){const c=CH();if(c.passScore!=null){const live=!c.chances||state.chances>0;if(!live||state.score<c.passScore)return c.endings.failed;if(state.tiles<c.tiles)return c.endings.missing;if(state.score>=c.max)return c.endings.master;return c.endings.complete}
  if(c.bands&&c.bands.length){const b=c.bands.find(b=>state.score>=b[0]);if(b)return b[1]}
  const alive=!c.chances||state.chances>0;const full=state.tiles>=c.tiles&&alive;const flawless=state.finalCorrect&&full&&state.score>=c.max;if(flawless&&(!state.endingPick||state.endingMaster))return c.endings.master;if(state.endingPick&&alive&&c.endings[state.endingPick]&&!(state.endingMin&&state.score<state.endingMin))return c.endings[state.endingPick];if(state.finalCorrect&&full&&state.score>=c.completeScore)return c.endings.complete;if(state.finalCorrect&&state.tiles<c.tiles)return c.endings.missing;return c.endings.failed}
/* `G.chances &&` is the same guard resolve() carries: a lesson with no chance
   counter at all (G.chances is 0 by design) has state.chances<=0 from the
   first frame, so the old test threw the learner to the failed ending on their
   first wrong answer. With chances in play this is exactly the old test. */
function advance(){const s=G.scenes[state.scene];const c=CH();if(c.chances&&state.chances<=0&&state.results[state.scene]!==s.answer){go(c.endings.failed);return}if(s.next==='resolve'){go(resolve());return}go(s.next)}
/* `endingMin` is a score floor on a route's own ending: the route decides WHICH
   reward ending you get, the floor decides whether you have earned one at all.
   Without it a route ending applies at any score. Frankenstein sets none, so its
   behaviour is unchanged. */
/* `points` on a route is the export kind whose story choices score (Frostbound:
   the careful road pays 4, the shortcut 2, and the ending bands read the
   total). A route without `points` scores nothing, as every route did before. */
function chooseRoute(i){const r=G.scenes[state.scene].routes[i];if(r.route)state.route.push(r.route);if(r.points)state.score+=r.points;if(r.ending){state.endingPick=r.ending;state.endingMaster=!!r.master;state.endingMin=r.endingMin||0}go(r.min!=null&&state.score<r.min?r.else:r.target)}
function restart(){state=fresh(state.lang,state.chapter);render()}
/* the hub and the chapters it starts. `toHub` resets to no chapter at all, so
   the HUD badges go quiet until one is picked. */
function startChapter(i){state=fresh(state.lang,i);render()}
function toHub(){state=fresh(state.lang,null);render()}
(function(){['off',...LANGS].forEach(l=>{const b=document.createElement('button');b.className='lang-item';b.dataset.lang=l;b.innerHTML=l==='off'?`<b>OFF</b><span>${esc(G.labels.off.en)}</span>`:`<b>${l.toUpperCase()}</b><span>${esc(G.names[l])}</span>`;b.addEventListener('click',()=>{state.lang=l;closeMenu();setLang()});langMenu.appendChild(b)});langBtn.addEventListener('click',e=>{e.stopPropagation();toggleMenu()});document.addEventListener('click',e=>{if(!langMenu.hidden&&!langMenu.contains(e.target))closeMenu()})})();
function setLang(){const wasOpen=state.open;render();if(wasOpen)setOpen(true)}
document.getElementById('sound').addEventListener('click',()=>{setSound(!sound);beep(true)});
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{const k=e.key;if(k.toLowerCase()==='l'){const all=['off',...LANGS];state.lang=all[(all.indexOf(state.lang)+1)%all.length];setLang();return}if(k==='Escape'){if(!langMenu.hidden){closeMenu();return}closePanel();return}if(k.toLowerCase()==='f'){document.getElementById('fullscreen').click();return}if(k.toLowerCase()==='s'){document.getElementById('sound').click();return}if(!state.open&&(k==='Enter'||NUM.includes(k))){openPanel();return}const s=G.scenes[state.scene];if(NUM.includes(k)){const i=Number(k)-1;if(s.kind==='question')document.querySelector(`.option[data-i="${i}"]`)?.click();if(s.kind==='choice')document.querySelectorAll('.route')[i]?.click();return}if(k==='Enter')document.querySelector('.continue:not([hidden]),.start,.restart')?.click()});
setSound(sound);render();
