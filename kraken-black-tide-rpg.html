 mão e a jaula sobe dobrada como uma lata, a porta arrancada, vazia.","ru":"Таллох выбирает его, перехватывая руками, и клетка поднимается смятой, как жестянка, дверь сорвана, пустая.","zh":"塔洛克一把接一把地把它拉上来，笼子上来时像个铁皮罐一样被压弯了，门被扯掉了，里面是空的。"},{"en":"You remember Vass's words: \"If the cage comes up empty, don't wait for me. I'll have gone down to the kelp. I've got forty minutes of air. Finish it, and then come back for me.\"","ar":"تتذكّرين كلمات فاس: \"إذا صعد القفص فارغًا، فلا تنتظريني. سأكون قد نزلت إلى الأعشاب البحرية. معي أربعون دقيقة من الهواء. أنهي الأمر، ثم عودي من أجلي.\"","de":"Du erinnerst dich an Vass' Worte: „Wenn der Käfig leer hochkommt, warte nicht auf mich. Dann bin ich hinunter zum Tang. Ich habe vierzig Minuten Luft. Bring es zu Ende, und dann komm mich holen.“","es":"Recuerdas las palabras de Vass: “Si la jaula sube vacía, no me esperes. Habré bajado a las algas. Tengo cuarenta minutos de aire. Termínalo, y luego vuelve a por mí.”","fr":"Tu te souviens des mots de Vass : « Si la cage remonte vide, ne m'attends pas. C'est que je serai descendue dans le varech. J'ai quarante minutes d'air. Finis-en, et reviens me chercher après. »","it":"Ti ricordi le parole di Vass: «Se la gabbia risale vuota, non aspettarmi. Vuol dire che sono scesa nelle alghe. Ho quaranta minuti d'aria. Finiscilo, e poi torna a prendermi.»","ja":"あなたはヴァスの言葉を思い出します。「檻が空で上がってきても、私を待たないで。海藻の森まで潜っているはずだから。空気は四十分ある。まずあれを仕留めて、それから私を迎えに来て」","pt":"Lembras-te das palavras de Vass: «Se a jaula subir vazia, não esperes por mim. É porque desci até às algas. Tenho quarenta minutos de ar. Acaba com aquilo, e depois volta para me buscar.»","ru":"Ты вспоминаешь слова Васс: «Если клетка поднимется пустой, не жди меня. Значит, я ушла вниз, в ламинарии. У меня сорок минут воздуха. Закончи дело, а потом вернись за мной.»","zh":"你想起瓦丝的话：“如果笼子空着上来，别等我。那说明我已经下到海带林里了。我有四十分钟的空气。先把它解决掉，然后再回来找我。”"}],"k":{"en":"CHAPTER 2 · THE CAGE · TUESDAY","ar":"الفصل 2 · القفص · الثلاثاء","de":"KAPITEL 2 · DER KÄFIG · DIENSTAG","es":"CAPÍTULO 2 · LA JAULA · MARTES","fr":"CHAPITRE 2 · LA CAGE · MARDI","it":"CAPITOLO 2 · LA GABBIA · MARTEDÌ","ja":"第2章 · 檻 · 火曜日","pt":"CAPÍTULO 2 · A JAULA · TERÇA-FEIRA","ru":"ГЛАВА 2 · КЛЕТКА · ВТОРНИК","zh":"第2章 · 笼子 · 星期二"},"kind":"question","next":"3.7a","prompt":{"en":"Tulloch: \"Empty. What did she tell us to do, sergeant? Exactly what she said.\"","ar":"تولوخ: \"فارغ. ماذا قالت لنا أن نفعل أيتها الرقيبة؟ بالضبط ما قالته.\"","de":"Tulloch: „Leer. Was hat sie uns gesagt, Sergeant? Genau das, was sie gesagt hat.“","es":"Tulloch: “Vacía. ¿Qué nos dijo que hiciéramos, sargento? Exactamente lo que dijo.”","fr":"Tulloch : « Vide. Qu'est-ce qu'elle nous a dit de faire, sergent ? Exactement ce qu'elle a dit. »","it":"Tulloch: «Vuota. Cosa ci ha detto di fare, sergente? Esattamente quello che ha detto.»","ja":"タロック：「空だ。彼女は何をしろと言った、巡査部長？その通りにやるんだ」","pt":"Tulloch: «Vazia. O que é que ela nos disse para fazer, sargento? Exatamente o que ela disse.»","ru":"Таллох: «Пустая. Что она велела нам делать, сержант? Именно то, что она сказала.»","zh":"塔洛克：“空的。她叫我们做什么，警长？就照她说的做。”"},"opts":[{"en":"Finish it first, then go back"},{"en":"Wait right here for forty minutes"},{"en":"Go down after her straight away"}],"answer":0,"fb":{"en":"Vass's instruction was: don't wait, finish it, then come back for her. Forty minutes is her air, not a time to wait.","ar":"كانت تعليمات فاس: لا تنتظري، أنهي الأمر، ثم عودي من أجلها. الأربعون دقيقة هي مقدار هوائها، لا وقت للانتظار.","de":"Vass' Anweisung war: nicht warten, es zu Ende bringen, dann sie holen. Vierzig Minuten ist ihre Luft, keine Wartezeit.","es":"la instrucción de Vass fue: no esperar, terminarlo, y luego volver a por ella. Cuarenta minutos es su aire, no un tiempo de espera.","fr":"la consigne de Vass était : ne pas attendre, en finir, puis revenir la chercher. Quarante minutes, c'est son air, pas un temps d'attente.","it":"l'istruzione di Vass era: non aspettare, finirlo, e poi tornare a prenderla. Quaranta minuti è la sua aria, non un tempo di attesa.","ja":"ヴァスの指示はこうでした。待たずに、あれを仕留めて、それから彼女を迎えに戻る。四十分は彼女の空気の量で、待つ時間ではありません。","pt":"a instrução de Vass foi: não esperar, acabar com aquilo, e depois voltar para a buscar. Quarenta minutos é o ar dela, não um tempo de espera.","ru":"указание Васс было: не ждать, закончить дело, а потом вернуться за ней. Сорок минут — это её запас воздуха, а не время ожидания.","zh":"瓦丝的指示是：别等，先把它解决掉，再回来找她。四十分钟是她的空气，不是等待的时间。"},"fbRight":{"en":"Tulloch throws the cage in the sea. \"Then we finish it.\"","ar":"يرمي تولوخ القفص في البحر. \"إذن ننهي الأمر.\"","de":"Tulloch wirft den Käfig ins Meer. „Dann bringen wir es zu Ende.“","es":"Tulloch tira la jaula al mar. “Entonces lo terminamos.”","fr":"Tulloch jette la cage à la mer. « Alors on l'achève. »","it":"Tulloch butta la gabbia in mare. «Allora lo finiamo.»","ja":"タロックは檻を海へ投げ捨てます。「なら、仕留めるぞ」","pt":"Tulloch atira a jaula ao mar. «Então acabamos com aquilo.»","ru":"Таллох бросает клетку в море. «Значит, доводим дело до конца.»","zh":"塔洛克把笼子扔进海里。“那我们就把它解决掉。”"},"fbWrong":{"en":"Tulloch: \"She said it to your face.\"","ar":"تولوخ: \"قالتها لكِ في وجهكِ.\"","de":"Tulloch: „Sie hat es Ihnen ins Gesicht gesagt.“","es":"Tulloch: “Se lo dijo a la cara.”","fr":"Tulloch : « Elle vous l'a dit en face. »","it":"Tulloch: «Gliel'ha detto in faccia.»","ja":"タロック：「彼女はあんたの目の前で言ったんだ」","pt":"Tulloch: «Ela disse-lho na cara.»","ru":"Таллох: «Она сказала вам это в лицо.»","zh":"塔洛克：“她当面跟你说的。”"},"clue":[{"en":"You hear:","ar":"تسمعين:","de":"Du hörst:","es":"Oyes:","fr":"Tu entends :","it":"Senti:","ja":"聞こえる：","pt":"Ouves:","ru":"Ты слышишь:","zh":"你听到："}]},"3.7a":{"img":"48_q7a_threebarrels.webp","hot":[80.0,66.0,12.0,16.0],"title":{"en":"THE CUT LINE","ar":"الحبل المقطوع","de":"DIE GEKAPPTE LEINE","es":"EL CABO CORTADO","fr":"LA LIGNE COUPÉE","it":"LA CIMA TAGLIATA","ja":"切れたロープ","pt":"A LINHA CORTADA","ru":"ОБРЕЗАННЫЙ ЛИНЬ","zh":"断缆"},"story":[{"en":"It comes up under the boat.","ar":"يصعد من تحت القارب.","de":"Es kommt unter dem Boot hoch.","es":"Sube por debajo del barco.","fr":"Ça remonte sous le bateau.","it":"Risale sotto la barca.","ja":"それが船の下から上がってきます。","pt":"Vem à superfície por baixo do barco.","ru":"Оно всплывает под лодкой.","zh":"它从船下冒了上来。"},{"en":"Not an arm this time: the whole Kittiwake rises on something broad and pale and drops back with a crack of timber, and out on the water all three barrels go under at once, together, and stay under.","ar":"ليست ذراعًا هذه المرة: يرتفع كيتيويك كله على شيء عريض شاحب ثم يهوي بطقطقة خشب، وهناك على الماء تغوص البراميل الثلاثة دفعة واحدة، معًا، وتبقى تحت الماء.","de":"Diesmal kein Arm: die ganze Kittiwake hebt sich auf etwas Breitem, Blassem und fällt mit einem Knacken von Holz zurück, und draußen auf dem Wasser gehen alle drei Tonnen auf einmal unter, zusammen, und bleiben unten.","es":"Esta vez no es un brazo: el Kittiwake entero se levanta sobre algo ancho y pálido y vuelve a caer con un crujido de madera, y ahí fuera en el agua los tres bidones desaparecen a la vez, juntos, y no vuelven a subir.","fr":"Pas un bras cette fois : le Kittiwake tout entier se soulève sur quelque chose de large et de pâle et retombe dans un craquement de bois, et au large les trois barils disparaissent d'un coup, ensemble, et restent sous l'eau.","it":"Stavolta non un braccio: tutto il Kittiwake si solleva su qualcosa di largo e pallido e ricade con uno schianto di legno, e fuori sull'acqua tutti e tre i bidoni vanno giù insieme, in un colpo solo, e restano sotto.","ja":"今度は腕ではありません。キティウェイク号全体が何か広く白っぽいものに持ち上げられ、木の割れる音とともに落ちます。そして水面では三つの樽が一度に、そろって沈み、そのまま上がってきません。","pt":"Desta vez não é um braço: o Kittiwake inteiro sobe em cima de uma coisa larga e pálida e volta a cair com um estalo de madeira, e lá fora na água os três bidões vão ao fundo de uma vez, juntos, e ficam lá em baixo.","ru":"На этот раз не рука: весь «Киттивейк» поднимается на чём-то широком и бледном и падает обратно с треском дерева, а на воде все три бочки уходят под воду разом, вместе, и не ver. Not in forty years.\" · You: \"Where's the line?\" · Tulloch: \"Cut it. Cut it and get the rope on the last one.\"","ar":"تسمعين: تولوخ: \"ثلاثة براميل. أنا ___ ثلاثة براميل تغوص. أبدًا. ولا في أربعين عامًا.\" · أنتِ: \"أين الحبل؟\" · تولوخ: \"اقطعيه. اقطعيه واربطي الحبل بالأخير.\"","de":"Du hörst: Tulloch: „Drei Tonnen. Ich ___ noch nie drei Tonnen untergehen sehen. Nie. Nicht in vierzig Jahren.“ · Du: „Wo ist die Leine?“ · Tulloch: „Kappen. Kappen Sie sie und machen Sie das Tau an der letzten fest.“","es":"Oyes: Tulloch: “Tres bidones. ___ hundirse tres bidones. Nunca. Ni en cuarenta años.” · Tú: “¿Dónde está el cabo?” · Tulloch: “Córtelo. Córtelo y enganche el cabo al último.”","fr":"Tu entends : Tulloch : « Trois barils. Je ___ trois barils couler. Jamais. Pas en quarante ans. » · Toi : « Où est la ligne ? » · Tulloch : « Coupez-la. Coupez-la et passez le cordage sur le dernier. »","it":"Senti: Tulloch: «Tre bidoni. ___ tre bidoni andare giù. Mai. Non in quarant'anni.» · Tu: «Dov'è la cima?» · Tulloch: «La tagli. La tagli e passi la cima sull'ultimo.»","ja":"聞こえる：タロック：「樽が三つ。三つの樽が沈むのは___。一度もない。四十年で一度も」· あなた：「ロープはどこ？」· タロック：「切れ。切って、最後の一つにロープを付けろ」","pt":"Ouves: Tulloch: «Três bidões. ___ três bidões irem ao fundo. Nunca. Nem em quarenta anos.» · Tu: «Onde está a linha?» · Tulloch: «Corte-a. Corte-a e ponha o cabo no último.»","ru":"Ты слышишь: Таллох: «Три бочки. Я ___ , чтобы три бочки ушли под воду. Никогда. Ни за сорок лет.» · Ты: «Где линь?» · Таллох: «Рубите. Рубите и заводите трос на последнюю.»","zh":"你听到：塔洛克：“三个浮桶。我___三个浮桶沉下去。从来没有。四十年里都没有。”· 你：“缆绳在哪儿？”· 塔洛克：“割断它。割断它，把绳子系到最后一个上。”"}],"relic":true},"3.5b":{"img":"49_q5b_boathook.webp","hot":[81.9,66.8,12.0,16.0],"title":{"en":"THE TOW","ar":"السحب","de":"DAS SCHLEPPEN","es":"EL REMOLQUE","fr":"LE REMORQUAGE","it":"IL RIMORCHIO","ja":"曳航","pt":"O REBOQUE","ru":"БУКСИР","zh":"拖曳"},"story":[{"en":"No engine, so Tulloch rows. He rows the Kittiwake — twelve metres of boat — with two sweeps, standing, towards the barrels, and you lean over the bow with the boathook until you have the barrel line.","ar":"لا محرّك، فيجدّف تولوخ. يجدّف بكيتيويك — اثنا عشر مترًا من القارب — بمجدافين طويلين، واقفًا، نحو البراميل، وأنتِ تنحنين فوق المقدّمة بخطّاف القارب حتى تمسكي حبل البراميل.","de":"Kein Motor, also rudert Tulloch. Er rudert die Kittiwake — zwölf Meter Boot — stehend mit zwei Riemen auf die Tonnen zu, und du beugst dich mit dem Bootshaken über den Bug, bis du die Tonnenleine hast.","es":"Sin motor, así que Tulloch rema. Rema el Kittiwake — doce metros de barco — con dos remos, de pie, hacia los bidones, y tú te asomas por la proa con el bichero hasta que agarras el cabo del bidón.","fr":"Pas de moteur, alors Tulloch rame. Il fait avancer le Kittiwake — douze mètres de bateau — à deux avirons, debout, vers les barils, et tu te penches par-dessus l'étrave avec la gaffe jusqu'à attraper la ligne du baril.","it":"Niente motore, così Tulloch rema. Rema il Kittiwake — dodici metri di barca — con due remi, in piedi, verso i bidoni, e tu ti sporgi da prua con il mezzomarinaio finché non hai la cima del bidone.","ja":"エンジンがないので、タロックが漕ぎます。十二メートルの船、キティウェイク号を、立ったまま二本の長いオールで樽のほうへ漕ぎ、あなたは樽のロープをつかむまで、ボートフックを持って船首から身を乗り出します。","pt":"Sem motor, por isso Tulloch rema. Rema o Kittiwake — doze metros de barco — com dois remos, de pé, na direção dos bidões, e tu debruças-te pela proa com o croque até teres a linha do bidão.","ru":"Двигателя нет, поэтому Таллох гребёт. Он гребёт на «Киттивейке» — двенадцать метров лодки — двумя вёслами, стоя, к бочкам, а ты свешиваешься с носа с багром, пока не поймаешь линь бочки.","zh":"没有引擎，塔洛克只好划船。他站着，用两支长桨划着基蒂韦克号——十二米长的船——朝浮桶划去，你拿着船钩探身到船头外，直到钩住浮桶的缆绳。"},{"en":"The skerry shelf is half a mile behind you.","ar":"جرف الصخرة البحرية على بعد نصف ميل خلفكم.","de":"Die Schärenbank liegt eine halbe Meile hinter euch.","es":"La plataforma del islote queda media milla detrás.","fr":"Le plateau du récif est à un demi-mille derrière vous.","it":"Il pianoro dello scoglio è mezzo miglio dietro di voi.","ja":"岩礁の浅瀬は半マイル後ろです。","pt":"O baixio do ilhéu fica meia milha atrás de vocês.","ru":"Отмель у шхеры в полумиле позади вас.","zh":"礁石的浅滩在你们身后半英里处。"}],"k":{"en":"CHAPTER 2 · THE SHALLOWS · TUESDAY","ar":"الفصل 2 · المياه الضحلة · الثلاثاء","de":"KAPITEL 2 · DAS FLACHWASSER · DIENSTAG","es":"CAPÍTULO 2 · LOS BAJÍOS · MARTES","fr":"CHAPITRE 2 · LES HAUTS-FONDS · MARDI","it":"CAPITOLO 2 · LE SECCHE · MARTEDÌ","ja":"第2章 · 浅瀬 · 火曜日","pt":"CAPÍTULO 2 · OS BAIXIOS · TERÇA-FEIRA","ru":"ГЛАВА 2 · МЕЛКОВОДЬЕ · ВТОРНИК","zh":"第2章 · 浅水区 · 星期二"},"kind":"question","next":"3.6b","prompt":{"en":"Tulloch: \"Nobody ___ anything with one, sergeant. There's no book.\"","ar":"تولوخ: \"لا أحد ___ أي شيء مع واحد منها أيتها الرقيبة. لا يوجد كتاب.\"","de":"Tulloch: „Niemand ___ je etwas mit so einem versucht, Sergeant. Es gibt kein Handbuch.“","es":"Tulloch: “Nadie ___ nada con uno, sargento. No hay manual.”","fr":"Tulloch : « Personne ___ quoi que ce soit avec un de ces trucs, sergent. Il n'y a pas de manuel. »","it":"Tulloch: «Nessuno ___ niente con uno di questi, sergente. Non c'è un manuale.»","ja":"タロック：「こいつで何かを___やつはいない、巡査部長。手引き書なんかない」","pt":"Tulloch: «Ninguém ___ nada com um destes, sargento. Não há manual.»","ru":"Таллох: «Никто ___ ничего с таким, сержант. Учебника нет.»","zh":"塔洛克：“没人___拿这种东西做过什么，警长。没有书可查。”"},"opts":[{"en":"has ever tryed"},{"en":"have ever tried"},{"en":"has ever tried"}],"answer":2,"fb":{"en":"NOBODY is singular: HAS EVER TRIED. A consonant + Y changes to IED in TRIED. Use HAVE with I, YOU, WE and THEY; use HAS with HE, SHE, IT and singular subjects such as NOBODY.","ar":"NOBODY مفرد: HAS EVER TRIED. الحرف الساكن + Y يتحوّل إلى IED في TRIED. استخدمي HAVE مع I وYOU وWE وTHEY؛ واستخدمي HAS مع HE وSHE وIT ومع الفاعل المفرد مثل NOBODY.","de":"NOBODY ist Singular: HAS EVER TRIED. Ein Konsonant + Y wird in TRIED zu IED. HAVE steht bei I, YOU, WE und THEY; HAS steht bei HE, SHE, IT und singularischen Subjekten wie NOBODY.","es":"NOBODY es singular: HAS EVER TRIED. Una consonante + Y cambia a IED en TRIED. Se usa HAVE con I, YOU, WE y THEY; se usa HAS con HE, SHE, IT y sujetos singulares como NOBODY.","fr":"NOBODY est singulier : HAS EVER TRIED. Une consonne + Y devient IED dans TRIED. On emploie HAVE avec I, YOU, WE et THEY ; on emploie HAS avec HE, SHE, IT et les sujets singuliers comme NOBODY.","it":"NOBODY è singolare: HAS EVER TRIED. Una consonante + Y diventa IED in TRIED. Si usa HAVE con I, YOU, WE e THEY; si usa HAS con HE, SHE, IT e soggetti singolari come NOBODY.","ja":"NOBODY は単数です：HAS EVER TRIED。子音 + Y は TRIED で IED に変わります。I、YOU、WE、THEY には HAVE を、HE、SHE、IT や NOBODY のような単数の主語には HAS を使います。","pt":"NOBODY é singular: HAS EVER TRIED. Uma consoante + Y passa a IED em TRIED. Usa-se HAVE com I, YOU, WE e THEY; usa-se HAS com HE, SHE, IT e sujeitos singulares como NOBODY.","ru":"NOBODY — единственное число: HAS EVER TRIED. Согласная + Y переходит в IED в TRIED. HAVE с I, YOU, WE и THEY; HAS с HE, SHE, IT и единственными подлежащими вроде NOBODY.","zh":"NOBODY 是单数：HAS EVER TRIED。辅音 + Y 在 TRIED 中变成 IED。I、YOU、WE 和 THEY 用 HAVE；HE、SHE、IT 以及 NOBODY 这样的单数主语用 HAS。"},"fbRight":{"en":"The line comes aboard and goes round the bow post.","ar":"يصعد الحبل إلى المتن ويلتفّ حول عمود المقدّمة.","de":"Die Leine kommt an Bord und um den Bugpoller.","es":"El cabo sube a bordo y da vuelta a la bita de proa.","fr":"La ligne monte à bord et fait le tour de la bitte d'étrave.","it":"La cima sale a bordo e fa il giro della bitta di prua.","ja":"ロープが船に上がり、船首の柱に巻きつけられます。","pt":"O cabo vem para bordo e dá a volta ao cabeço da proa.","ru":"Линь попадает на борт и обносится вокруг носового кнехта.","zh":"缆绳拉上船，绕在船头桩上。"},"fbWrong":{"en":"Tulloch takes the boathook.","ar":"يأخذ تولوخ خطّاف القارب.","de":"Tulloch nimmt den Bootshaken.","es":"Tulloch coge el bichero.","fr":"Tulloch prend la gaffe.","it":"Tulloch prende il mezzomarinaio.","ja":"タロックはボートフックを取ります。","pt":"Tulloch pega no croque.","ru":"Таллох берёт багор.","zh":"塔洛克拿起船钩。"},"clue":[{"en":"You hear: You: \"Has anyone ever tried to strand one?\"","ar":"تسمعين: أنتِ: \"هل حاول أحد يومًا أن يُجنِح واحدًا منها؟\"","de":"Du hörst: Du: „Hat je jemand versucht, so eines auf Grund zu setzen?“","es":"Oyes: Tú: “¿Alguien ha intentado alguna vez varar uno?”","fr":"Tu entends : Toi : « Est-ce que quelqu'un a déjà essayé d'en échouer un ? »","it":"Senti: Tu: «Qualcuno ha mai provato a farne spiaggiare uno?»","ja":"聞こえる：あなた：「これを座礁させようとした人はいるんですか？」","pt":"Ouves: Tu: «Alguém alguma vez tentou encalhar um?»","ru":"Ты слышишь: Ты: «Кто-нибудь когда-нибудь пытался выбросить такое на мель?»","zh":"你听到：你：“有人试过让这种东西搁浅吗？”"}]},"3.6b":{"img":"50_q6b_shelf.webp","hot":[77.9,61.7,12.0,16.0],"title":{"en":"THE SHELF","ar":"الجرف","de":"DIE BANK","es":"LA PLATAFORMA","fr":"LE PLATEAU","it":"IL PIANORO","ja":"浅瀬","pt":"O BAIXIO","ru":"ОТМЕЛЬ","zh":"浅滩"},"story":[{"en":"It lets itself be towed. That is the worst part. The barrels follow the boat towards the skerry like a dog on a lead, and Tulloch says it is because it wants to see where you are going.","ar":"يدع نفسه يُسحب. وهذا أسوأ ما في الأمر. تتبع البراميل القارب نحو الصخرة البحرية ككلب مربوط بمقوده، ويقول تولوخ إن ذلك لأنه يريد أن يرى إلى أين تذهبون.","de":"Es lässt sich schleppen. Das ist das Schlimmste daran. Die Tonnen folgen dem Boot zur Schäre wie ein Hund an der Leine, und Tulloch sagt, das liege daran, dass es sehen will, wohin ihr fahrt.","es":"Se deja remolcar. Eso es lo peor. Los bidones siguen al barco hacia el islote como un perro con correa, y Tulloch dice que es porque quiere ver adónde vais.","fr":"Il se laisse remorquer. C'est ça le pire. Les barils suivent le bateau vers le récif comme un chien en laisse, et Tulloch dit que c'est parce qu'il veut voir où vous allez.","it":"Si lascia rimorchiare. È questa la parte peggiore. I bidoni seguono la barca verso lo scoglio come un cane al guinzaglio, e Tulloch dice che è perché vuole vedere dove state andando.","ja":"それはおとなしく引かれていきます。それが最悪なのです。樽は引き綱につながれた犬のように船について岩礁へ向かい、タロックは、あなたたちがどこへ行くのか見たいからだと言います。","pt":"Deixa-se rebocar. É essa a pior parte. Os bidões seguem o barco até ao ilhéu como um cão na trela, e Tulloch diz que é porque quer ver para onde vão.","ru":"Оно даёт себя тащить. Это хуже всего. Бочки идут за лодкой к шхере, как собака на поводке, и Таллох говорит, что это потому, что оно хочет видеть, куда вы идёте.","zh":"它任由自己被拖着走。这是最糟糕的。浮桶像被牵着的狗一样跟着船朝礁石走，塔洛克说那是因为它想看看你们要去哪儿。"}],"k":{"en":"CHAPTER 2 · THE SHALLOWS · TUESDAY","ar":"الفصل 2 · المياه الضحلة · الثلاثاء","de":"KAPITEL 2 · DAS FLACHWASSER · DIENSTAG","es":"CAPÍTULO 2 · LOS BAJÍOS · MARTES","fr":"CHAPITRE 2 · LES HAUTS-FONDS · MARDI","it":"CAPITOLO 2 · LE SECCHE · MARTEDÌ","ja":"第2章 · 浅瀬 · 火曜日","pt":"CAPÍTULO 2 · OS BAIXIOS · TERÇA-FEIRA","ru":"ГЛАВА 2 · МЕЛКОВОДЬЕ · ВТОРНИК","zh":"第2章 · 浅水区 · 星期二"},"kind":"question","next":"3.7b","prompt":{"en":"Vass: \"So how deep is the shelf in two hours?\"","ar":"فاس: \"إذن كم سيكون عمق الجرف بعد ساعتين؟\"","de":"Vass: „Und wie tief ist die Bank in zwei Stunden?“","es":"Vass: “¿Y qué profundidad tiene la plataforma dentro de dos horas?”","fr":"Vass : « Et quelle profondeur fait le plateau dans deux heures ? »","it":"Vass: «E quanto sarà profondo il pianoro tra due ore?»","ja":"ヴァス：「それで、二時間後の浅瀬の深さは？」","pt":"Vass: «E que profundidade tem o baixio daqui a duas horas?»","ru":"Васс: «И какая глубина на отмели через два часа?»","zh":"瓦丝：“那两小时后浅滩有多深？”"},"opts":[{"en":"Two metres"},{"en":"Three metres"},{"en":"Four metres"}],"answer":0,"fb":{"en":"three metres now, dropping half a metre an hour: in two hours, two metres. Four is high water; three is now.","ar":"ثلاثة أمتار الآن، وينخفض نصف متر كل ساعة: بعد ساعتين، متران. الأربعة عند المدّ العالي؛ والثلاثة الآن.","de":"jetzt drei Meter, fällt einen halben Meter pro Stunde: in zwei Stunden zwei Meter. Vier ist Hochwasser; drei ist jetzt.","es":"tres metros ahora, bajando medio metro por hora: dentro de dos horas, dos metros. Cuatro es la pleamar; tres es ahora.","fr":"trois mètres maintenant, en baisse d'un demi-mètre par heure : dans deux heures, deux mètres. Quatre, c'est la pleine mer ; trois, c'est maintenant.","it":"tre metri adesso, in calo di mezzo metro all'ora: tra due ore, due metri. Quattro è l'alta marea; tre è adesso.","ja":"今は三メートル、一時間に半メートル下がるので、二時間後は二メートル。四は満潮のとき、三は今です。","pt":"três metros agora, a descer meio metro por hora: daqui a duas horas, dois metros. Quatro é a preia-mar; três é agora.","ru":"сейчас три метра, падает на полметра в час: через два часа будет два метра. Четыре — это полная вода; три — это сейчас.","zh":"现在三米，每小时下降半米：两小时后，两米。四米是高潮时的深度；三米是现在。"},"fbRight":{"en":"Vass: \"Two metres. It can't turn in two metres.\"","ar":"فاس: \"متران. لا يستطيع أن يستدير في مترين.\"","de":"Vass: „Zwei Meter. In zwei Metern kann es nicht wenden.“","es":"Vass: “Dos metros. No puede girar en dos metros.”","fr":"Vass : « Deux mètres. Il ne peut pas se retourner dans deux mètres. »","it":"Vass: «Due metri. Non può girarsi in due metri.»","ja":"ヴァス：「二メートル。二メートルじゃ向きを変えられない」","pt":"Vass: «Dois metros. Não consegue virar-se em dois metros.»","ru":"Васс: «Два метра. Оно не сможет развернуться на двух метрах.»","zh":"瓦丝：“两米。它在两米深的水里转不了身。”"},"fbWrong":{"en":"Tulloch: \"Then you'd have us sat on it in three.\"","ar":"تولوخ: \"إذن كنتِ ستُجلسيننا فوقه في ثلاثة.\"","de":"Tulloch: „Dann hätten Sie uns bei drei Metern direkt draufgesetzt.“","es":"Tulloch: “Entonces nos tendría sentados encima en tres.”","fr":"Tulloch : « Alors vous nous auriez posés dessus dans trois. »","it":"Tulloch: «Allora ci avrebbe messi sopra di lui in tre.»","ja":"タロック：「なら、三メートルのうちにあいつの上に乗り上げさせることになる」","pt":"Tulloch: «Então tinha-nos sentado em cima dele com três.»","ru":"Таллох: «Тогда вы посадили бы нас прямо на него на трёх.»","zh":"塔洛克：“那你会让我们在三米深的时候就坐到它身上去。”"},"clue":[{"en":"You hear:","ar":"تسمعين:","de":"Du hörst:","es":"Oyes:","fr":"Tu entends :","it":"Senti:","ja":"聞こえる：","pt":"Ouves:","ru":"Ты слышишь:","zh":"你听到："},{"en":"Tulloch: \"It needs ten metres of water under it or it can't get its arms round a boat. The shelf's four metres at high water. It's been ebbing for two hours, so it's three now, and it drops half a metre an hour.\"","ar":"تولوخ: \"يحتاج إلى عشرة أمتار من الماء تحته وإلا لم يستطع أن يلفّ ذراعيه حول قارب. الجرف أربعة أمتار عند المدّ العالي. الجزر مستمر منذ ساعتين، فهو ثلاثة الآن، وينخفض نصف متر كل ساعة.\"","de":"Tulloch: „Es braucht zehn Meter Wasser unter sich, sonst kriegt es die Arme nicht um ein Boot. Die Bank hat bei Hochwasser vier Meter. Es läuft seit zwei Stunden ab, also sind es jetzt drei, und es fällt einen halben Meter pro Stunde.“","es":"Tulloch: “Necesita diez metros de agua debajo o no puede rodear un barco con los brazos. La plataforma tiene cuatro metros en pleamar. Lleva dos horas bajando, así que ahora tiene tres, y baja medio metro por hora.”","fr":"Tulloch : « Il lui faut dix mètres d'eau sous lui, sinon il ne peut pas passer ses bras autour d'un bateau. Le plateau fait quatre mètres à pleine mer. Ça descend depuis deux heures, donc il en fait trois maintenant, et ça baisse d'un demi-mètre par heure. »","it":"Tulloch: «Gli servono dieci metri d'acqua sotto o non riesce a mettere le braccia attorno a una barca. Il pianoro fa quattro metri con l'alta marea. Sta calando da due ore, quindi adesso ne fa tre, e cala di mezzo metro all'ora.»","ja":"タロック：「あいつは下に十メートルの水がないと、船に腕を回せない。浅瀬は満潮で四メートル。二時間引き潮が続いているから、今は三メートル、そして一時間に半メートル下がる」","pt":"Tulloch: «Precisa de dez metros de água por baixo, senão não consegue pôr os braços à volta de um barco. O baixio tem quatro metros na preia-mar. Está a vazar há duas horas, portanto agora tem três, e desce meio metro por hora.»","ru":"Таллох: «Ему нужно десять метров воды под собой, иначе оно не обхватит лодку руками. На отмели четыре метра в полную воду. Отлив идёт уже два часа, значит, сейчас три, и вода падает на полметра в час.»","zh":"塔洛克：“它身下需要十米的水，不然没法用臂缠住一条船。浅滩高潮时四米。已经退潮两个小时了，所以现在是三米，而且每小时下降半米。”"}]},"3.7b":{"img":"51_q7b_strand.webp","hot":[81.0,30.0,12.0,16.0],"title":{"en":"THE STRAND","ar":"الجنوح","de":"DAS AUFLAUFEN","es":"LA VARADA","fr":"L'ÉCHOUAGE","it":"LO SPIAGGIAMENTO","ja":"座礁","pt":"O ENCALHE","ru":"ПОСАДКА НА МЕЛЬ","zh":"搁浅"},"story":[{"en":"It follows you onto the shelf. Into four metres, three, two, with its barrels bumping the sand, and then the arms come over both rails at once and the boat does not lift this time. It is pulled down.","ar":"يتبعكم إلى الجرف. إلى أربعة أمتار، ثلاثة، اثنين، وبراميله ترتطم بالرمل، ثم تأتي الأذرع فوق الحافتين معًا ولا يرتفع القارب هذه المرة. إنه يُسحب إلى الأسفل.","de":"Es folgt euch auf die Bank. In vier Meter, drei, zwei, die Tonnen holpern über den Sand, und dann kommen die Arme über beide Relings zugleich, und diesmal hebt sich das Boot nicht. Es wird hinuntergezogen.","es":"Os sigue hasta la plataforma. Hasta cuatro metros, tres, dos, con sus bidones rozando la arena, y entonces los brazos pasan por encima de las dos bordas a la vez y esta vez el barco no se levanta. Lo arrastran hacia abajo.","fr":"Il vous suit sur le plateau. Dans quatre mètres, trois, deux, ses barils raclant le sable, et puis les bras passent par-dessus les deux bastingages en même temps et cette fois le bateau ne se soulève pas. Il est tiré vers le fond.","it":"Vi segue sul pianoro. In quattro metri, tre, due, con i suoi bidoni che sbattono sulla sabbia, e poi le braccia arrivano su tutte e due le battagliole insieme e stavolta la barca non si solleva. Viene tirata giù.","ja":"それはあなたたちを追って浅瀬に入ってきます。四メートル、三、二、樽が砂にぶつかり、それから腕が両舷を同時に越えてきて、今度は船が持ち上がりません。引きずり込まれるのです。","pt":"Segue-vos até ao baixio. Para quatro metros, três, dois, com os bidões a bater na areia, e depois os braços passam por cima das duas amuradas ao mesmo tempo e desta vez o barco não se levanta. É puxado para baixo.","ru":"Оно идёт за вами на отмель. В четыре метра, три, два, бочки волокутся по песку, а потом руки переваливаются через оба борта разом, и на этот раз лодка не поднимается. Её тянет вниз.","zh":"它跟着你们上了浅滩。四米，三米，两米，浮桶磕着沙底，然后那些臂同时越过两侧船舷，这一次船没有被抬起。它被拖了下去。"},{"en":"Vass goes over the side into two metres of water and starts swimming for the rocks, and Tulloch shouts at her to keep going.","ar":"تقفز فاس من فوق الحافة في مترين من الماء وتبدأ السباحة نحو الصخور، ويصرخ بها تولوخ أن تواصل.","de":"Vass geht über Bord in zwei Meter Wasser und schwimmt auf die Felsen zu, und Tulloch ruft ihr zu, sie solle weiterschwimmen.","es":"Vass se tira por la borda a dos metros de agua y empieza a nadar hacia las rocas, y Tulloch le grita que siga.","fr":"Vass passe par-dessus bord dans deux mètres d'eau et se met à nager vers les rochers, et Tulloch lui crie de continuer.","it":"Vass va fuori bordo in due metri d'acqua e comincia a nuotare verso le rocce, e Tulloch le grida di continuare.","ja":"ヴァスは舷を越えて水深二メートルの水に入り、岩に向かって泳ぎ出します。タロックは止まるなと彼女に叫びます。","pt":"Vass salta pela borda para dois metros de água e começa a nadar para as rochas, e Tulloch grita-lhe para continuar.","ru":"Васс переваливается через борт в два метра воды и плывёт к скалам, а Таллох кричит ей, чтобы она не останавливалась.","zh":"瓦丝翻过船舷跳进两米深的水里，开始朝岩石游去，塔洛克冲她大喊叫她别停。"}],"k":{"en":"CHAPTER 2 · THE SHALLOWS · TUESDAY","ar":"الفصل 2 · المياه الضحلة · الثلاثاء","de":"KAPITEL 2 · DAS FLACHWASSER · DIENSTAG","es":"CAPÍTULO 2 · LOS BAJÍOS · MARTES","fr":"CHAPITRE 2 · LES HAUTS-FONDS · MARDI","it":"CAPITOLO 2 · LE SECCHE · MARTEDÌ","ja":"第2章 · 浅瀬 · 火曜日","pt":"CAPÍTULO 2 · OS BAIXIOS · TERÇA-FEIRA","ru":"ГЛАВА 2 · МЕЛКОВОДЬЕ · ВТОРНИК","zh":"第2章 · 浅水区 · 星期二"},"kind":"question","next":"3.8","prompt":{"en":"Tulloch: \"It's come into two metres of water for us. Nothing ___ into two metres of water for a boat. Nothing.\"","ar":"تولوخ: \"لقد دخل مترين من الماء من أجلنا. لا شيء ___ مترين من الماء من أجل قارب. لا شيء.\"","de":"Tulloch: „Es ist unseretwegen in zwei Meter Wasser gekommen. Nichts ___ je für ein Boot in zwei Meter Wasser gekommen. Nichts.“","es":"Tulloch: “Ha entrado en dos metros de agua a por nosotros. Nada ___ en dos metros de agua a por un barco. Nada.”","fr":"Tulloch : « Il est venu dans deux mètres d'eau pour nous. Rien ___ dans deux mètres d'eau pour un bateau. Rien. »","it":"Tulloch: «È venuto in due metri d'acqua per noi. Niente ___ in due metri d'acqua per una barca. Niente.»","ja":"タロック：「あいつは俺たちのために水深二メートルまで入ってきた。船のために水深二メートルまで___ものなんていない。一つもだ」","pt":"Tulloch: «Veio para dois metros de água por nossa causa. Nada ___ para dois metros de água por causa de um barco. Nada.»","ru":"Таллох: «Оно зашло в два метра воды ради нас. Ничто ___ в два метра воды ради лодки. Ничто.»","zh":"塔洛克：“它为了我们进了两米深的水。从没有东西为了一条船___两米深的水。从来没有。”"},"opts":[{"en":"have ever come"},{"en":"has ever come"},{"en":"has ever came"}],"answer":1,"fb":{"en":"NOTHING is singular and takes HAS; EVER goes between HAS and the PAST PARTICIPLE. CAME is the Past Simple and never follows HAS.","ar":"NOTHING مفرد ويأخذ HAS؛ وتأتي EVER بين HAS وPAST PARTICIPLE. CAME هي Past Simple ولا تأتي أبدًا بعد HAS.","de":"NOTHING ist Singular und nimmt HAS; EVER steht zwischen HAS und dem PAST PARTICIPLE. CAME ist das Past Simple und steht nie nach HAS.","es":"NOTHING es singular y lleva HAS; EVER va entre HAS y el PAST PARTICIPLE. CAME es el Past Simple y nunca va detrás de HAS.","fr":"NOTHING est singulier et prend HAS ; EVER se place entre HAS et le PAST PARTICIPLE. CAME est le Past Simple et ne suit jamais HAS.","it":"NOTHING è singolare e prende HAS; EVER va tra HAS e il PAST PARTICIPLE. CAME è il Past Simple e non segue mai HAS.","ja":"NOTHING は単数なので HAS を取ります。EVER は HAS と PAST PARTICIPLE の間に入ります。CAME は Past Simple なので HAS の後には決して来ません。","pt":"NOTHING é singular e leva HAS; EVER vai entre HAS e o PAST PARTICIPLE. CAME é o Past Simple e nunca vem depois de HAS.","ru":"NOTHING — единственное число и требует HAS; EVER стоит между HAS и PAST PARTICIPLE. CAME — это Past Simple, и оно никогда не стоит после HAS.","zh":"NOTHING 是单数，用 HAS；EVER 放在 HAS 和 PAST PARTICIPLE 之间。CAME 是 Past Simple，绝不放在 HAS 后面。"},"fbRight":{"en":"Tulloch cuts the tow line and throws the coil at your chest. \"Keep that. You'll want it.\"","ar":"يقطع تولوخ حبل السحب ويرمي اللفّة على صدركِ. \"احتفظي بهذا. ستحتاجين إليه.\"","de":"Tulloch kappt die Schleppleine und wirft dir die aufgeschossene Leine gegen die Brust. „Behalten Sie das. Sie werden es brauchen.“","es":"Tulloch corta el cabo de remolque y te tira la adujada al pecho. “Guárdelo. Lo va a necesitar.”","fr":"Tulloch coupe la remorque et te jette la glène contre la poitrine. « Gardez ça. Vous en aurez besoin. »","it":"Tulloch taglia il cavo di rimorchio e ti lancia la matassa contro il petto. «La tenga. Le servirà.»","ja":"タロックは曳航ロープを切り、巻いたロープをあなたの胸に投げつけます。「持っておけ。必要になる」","pt":"Tulloch corta o cabo de reboque e atira-te a aducha ao peito. «Guarde isso. Vai precisar.»","ru":"Таллох перерезает буксирный трос и бросает бухту тебе в грудь. «Сохраните. Пригодится.»","zh":"塔洛克割断拖缆，把那卷绳子扔到你胸口。“留着。你会用得着。”"},"fbWrong":{"en":"You catch the rope late.","ar":"تمسكين الحبل متأخرة.","de":"Du fängst das Tau zu spät.","es":"Coges el cabo tarde.","fr":"Tu attrapes le cordage trop tard.","it":"Prendi la cima in ritardo.","ja":"あなたがロープを受け取るのが遅れます。","pt":"Apanhas o cabo tarde.","ru":"Ты ловишь верёвку слишком поздно.","zh":"你接绳子接晚了。"},"clue":[{"en":"You hear: Tulloch: \"It's come into two metres of water for us. Nothing ___ into two metres of water for a boat. Nothing.\" · You: \"Then it's not a squid.\" · Tulloch: \"I never said it was.\"","ar":"تسمعين: تولوخ: \"لقد دخل مترين من الماء من أجلنا. لا شيء ___ مترين من الماء من أجل قارب. لا شيء.\" · أنتِ: \"إذن ليس حبّارًا.\" · تولوخ: \"لم أقل قط إنه كذلك.\"","de":"Du hörst: Tulloch: „Es ist unseretwegen in zwei Meter Wasser gekommen. Nichts ___ je für ein Boot in zwei Meter Wasser gekommen. Nichts.“ · Du: „Dann ist es kein Kalmar.“ · Tulloch: „Ich habe nie gesagt, dass es einer ist.“","es":"Oyes: Tulloch: “Ha entrado en dos metros de agua a por nosotros. Nada ___ en dos metros de agua a por un barco. Nada.” · Tú: “Entonces no es un calamar.” · Tulloch: “Nunca dije que lo fuera.”","fr":"Tu entends : Tulloch : « Il est venu dans deux mètres d'eau pour nous. Rien ___ dans deux mètres d'eau pour un bateau. Rien. » · Toi : « Alors ce n'est pas un calmar. » · Tulloch : « Je n'ai jamais dit que c'en était un. »","it":"Senti: Tulloch: «È venuto in due metri d'acqua per noi. Niente ___ in due metri d'acqua per una barca. Niente.» · Tu: «Allora non è un calamaro.» · Tulloch: «Non ho mai detto che lo fosse.»","ja":"聞こえる：タロック：「あいつは俺たちのために水深二メートルまで入ってきた。船のために水深二メートルまで___ものなんていない。一つもだ」· あなた：「なら、イカじゃない」· タロック：「イカだなんて一度も言っていない」","pt":"Ouves: Tulloch: «Veio para dois metros de água por nossa causa. Nada ___ para dois metros de água por causa de um barco. Nada.» · Tu: «Então não é uma lula.» · Tulloch: «Nunca disse que fosse.»","ru":"Ты слышишь: Таллох: «Оно зашло в два метра воды ради нас. Ничто ___ в два метра воды ради лодки. Ничто.» · Ты: «Значит, это не кальмар.» · Таллох: «Я никогда и не говорил, что кальмар.»","zh":"你听到：塔洛克：“它为了我们进了两米深的水。从没有东西为了一条船___两米深的水。从来没有。”· 你：“那它不是鱿鱼。”· 塔洛克：“我从没说过它是。”"}],"relic":true},"3.8":{"img":"52_q8_boot.webp","hot":[78.0,66.0,12.0,16.0],"title":{"en":"THE STERN","ar":"المؤخرة","de":"DAS HECK","es":"LA POPA","fr":"LA POUPE","it":"LA POPPA","ja":"船尾","pt":"A POPA","ru":"КОРМА","zh":"船尾"},"k":{"en":"CHAPTER 3 · THE LAST RUN · TUESDAY","ar":"الفصل 3 · الجولة الأخيرة · الثلاثاء","de":"KAPITEL 3 · DIE LETZTE FAHRT · DIENSTAG","es":"CAPÍTULO 3 · LA ÚLTIMA SALIDA · MARTES","fr":"CHAPITRE 3 · LA DERNIÈRE SORTIE · MARDI","it":"CAPITOLO 3 · L'ULTIMA USCITA · MARTEDÌ","ja":"第3章 · 最後の勝負 · 火曜日","pt":"CAPÍTULO 3 · A ÚLTIMA SAÍDA · TERÇA-FEIRA","ru":"ГЛАВА 3 · ПОСЛЕДНИЙ ВЫХОД · ВТОРНИК","zh":"第3章 · 最后一搏 · 星期二"},"kind":"question","next":"3.9","prompt":{"en":"You hear — yourself, out loud, to nobody: \"Tulloch ___ over the side. I can't see him. I can't see him anywhere.\"","ar":"تسمعين — نفسكِ، بصوت عالٍ، لا تكلّمين أحدًا: \"تولوخ ___ من فوق الحافة. لا أراه. لا أراه في أي مكان.\"","de":"Du hörst — dich selbst, laut, zu niemandem: „Tulloch ___ über Bord gegangen. Ich sehe ihn nicht. Ich sehe ihn nirgends.“","es":"Oyes — a ti misma, en voz alta, a nadie: “Tulloch ___ por la borda. No lo veo. No lo veo por ninguna parte.”","fr":"Tu entends — toi-même, à voix haute, à personne : « Tulloch ___ par-dessus bord. Je ne le vois pas. Je ne le vois nulle part. »","it":"Senti — te stessa, ad alta voce, a nessuno: «Tulloch ___ fuori bordo. Non lo vedo. Non lo vedo da nessuna parte.»","ja":"聞こえる——あなた自身が、声に出して、誰にともなく：「タロックが舷の外へ___。見えない。どこにも見えない」","pt":"Ouves — a ti própria, em voz alta, a ninguém: «O Tulloch ___ pela borda fora. Não o vejo. Não o vejo em lado nenhum.»","ru":"Ты слышишь — себя, вслух, никому: «Таллох ___ за борт. Я его не вижу. Я его нигде не вижу.»","zh":"你听到——你自己，大声地，不是对任何人说：“塔洛克___到船外了。我看不见他。哪儿都看不见他。”"},"opts":[{"en":"has been"},{"en":"has went"},{"en":"has gone"}],"answer":2,"fb":{"en":"GONE means he went and is not back. BEEN would mean he has come back. WENT is the Past Simple and never follows HAS.","ar":"GONE تعني أنه ذهب ولم يعد. أما BEEN فتعني أنه عاد. WENT هي Past Simple ولا تأتي أبدًا بعد HAS.","de":"GONE bedeutet, er ist gegangen und nicht zurück. BEEN würde bedeuten, er ist zurückgekommen. WENT ist das Past Simple und steht nie nach HAS.","es":"GONE significa que se fue y no ha vuelto. BEEN significaría que ha vuelto. WENT es el Past Simple y nunca va detrás de HAS.","fr":"GONE veut dire qu'il est parti et n'est pas revenu. BEEN voudrait dire qu'il est revenu. WENT est le Past Simple et ne suit jamais HAS.","it":"GONE vuol dire che è andato e non è tornato. BEEN vorrebbe dire che è tornato. WENT è il Past Simple e non segue mai HAS.","ja":"GONE は、彼が行ってしまって戻っていないという意味です。BEEN なら、彼は戻ってきたという意味になります。WENT は Past Simple なので HAS の後には決して来ません。","pt":"GONE quer dizer que foi e não voltou. BEEN significaria que voltou. WENT é o Past Simple e nunca vem depois de HAS.","ru":"GONE означает, что он ушёл и не вернулся. BEEN означало бы, что он вернулся. WENT — это Past Simple, и оно никогда не стоит после HAS.","zh":"GONE 的意思是他走了，没有回来。BEEN 的意思是他已经回来了。WENT 是 Past Simple，绝不放在 HAS 后面。"},"fbRight":{"en":"You are alone on the boat.","ar":"أنتِ وحدكِ على القارب.","de":"Du bist allein auf dem Boot.","es":"Estás sola en el barco.","fr":"Tu es seule sur le bateau.","it":"Sei sola sulla barca.","ja":"船の上にいるのはあなた一人です。","pt":"Estás sozinha no barco.","ru":"Ты одна на лодке.","zh":"船上只剩你一个人。"},"fbWrong":{"en":"You are alone on the boat, and you have said it wrong.","ar":"أنتِ وحدكِ على القارب، وقد قلتِها خطأً.","de":"Du bist allein auf dem Boot, und du hast es falsch gesagt.","es":"Estás sola en el barco, y lo has dicho mal.","fr":"Tu es seule sur le bateau, et tu l'as mal dit.","it":"Sei sola sulla barca, e l'hai detto male.","ja":"船の上にいるのはあなた一人で、しかも言い方を間違えました。","pt":"Estás sozinha no barco, e disseste mal.","ru":"Ты одна на лодке, и ты сказала это неправильно.","zh":"船上只剩你一个人，而且你说错了。"},"pages":[{"t":"story","b":{"en":"A black arm hooks over the rail. Tulloch drives his gaff into it, eyes fixed on the suckers tightening against the wood.","ar":"ذراع سوداء تنعقف فوق الحافة. يغرز تولوخ خطّافه فيها، وعيناه مثبّتتان على الممصّات وهي تشتدّ على الخشب.","de":"Ein schwarzer Arm hakt sich über die Reling. Tulloch treibt sein Gaff hinein, die Augen auf die Saugnäpfe gerichtet, die sich gegen das Holz pressen.","es":"Un brazo negro se engancha sobre la borda. Tulloch le clava el bichero, con los ojos fijos en las ventosas que se aprietan contra la madera.","fr":"Un bras noir s'accroche par-dessus le bastingage. Tulloch y plante sa gaffe, les yeux fixés sur les ventouses qui se resserrent contre le bois.","it":"Un braccio nero si aggancia alla battagliola. Tulloch ci conficca il raffio, con gli occhi fissi sulle ventose che si stringono contro il legno.","ja":"黒い腕が手すりに引っかかります。タロックはそこへギャフを打ち込み、木に吸いつく吸盤をじっと見据えています。","pt":"Um braço negro engancha-se na amurada. Tulloch enterra-lhe o croque, de olhos fixos nas ventosas que apertam contra a m  when you were not listening, and you are listening now.","ar":"شرح لكِ تولوخ كيف يعمل المدفع ليلة الأحد، حين لم تكوني تصغين، وأنتِ تصغين الآن.","de":"Tulloch hat dir am Sonntagabend erklärt, wie die Kanone funktioniert, als du nicht zugehört hast, und jetzt hörst du zu.","es":"Tulloch te explicó cómo funciona el arpón el domingo por la noche, cuando no estabas escuchando, y ahora sí estás escuchando.","fr":"Tulloch t'a expliqué comment marche le canon dimanche soir, quand tu n'écoutais pas, et maintenant tu écoutes.","it":"Tulloch ti ha spiegato come funziona il fucile domenica sera, quando non stavi ascoltando, e adesso stai ascoltando.","ja":"日曜日の夜、あなたが聞いていなかったとき、タロックはこの砲の使い方を話してくれました。今、あなたは聞いています。","pt":"Tulloch explicou-te como funciona o arpão no domingo à noite, quando não estavas a ouvir, e agora estás a ouvir.","ru":"Таллох объяснил тебе, как работает пушка, в воскресенье вечером, когда ты не слушала, а теперь ты слушаешь.","zh":"星期天晚上塔洛克告诉过你这炮怎么用，那时你没在听，现在你在听了。"}],"k":{"en":"CHAPTER 3 · THE LAST RUN · TUESDAY","ar":"الفصل 3 · الجولة الأخيرة · الثلاثاء","de":"KAPITEL 3 · DIE LETZTE FAHRT · DIENSTAG","es":"CAPÍTULO 3 · LA ÚLTIMA SALIDA · MARTES","fr":"CHAPITRE 3 · LA DERNIÈRE SORTIE · MARDI","it":"CAPITOLO 3 · L'ULTIMA USCITA · MARTEDÌ","ja":"第3章 · 最後の勝負 · 火曜日","pt":"CAPÍTULO 3 · A ÚLTIMA SAÍDA · TERÇA-FEIRA","ru":"ГЛАВА 3 · ПОСЛЕДНИЙ ВЫХОД · ВТОРНИК","zh":"第3章 · 最后一搏 · 星期二"},"kind":"question","next":"3.10","prompt":{"en":"The question is Tulloch's, and it is the only one that matters: \"When do you fire?\"","ar":"السؤال سؤال تولوخ، وهو الوحيد المهم: \"متى تطلقين؟\"","de":"Die Frage ist Tullochs, und sie ist die einzige, die zählt: „Wann feuern Sie?“","es":"La pregunta es de Tulloch, y es la única que importa: “¿Cuándo disparas?”","fr":"La question est celle de Tulloch, et c'est la seule qui compte : « Quand est-ce que vous tirez ? »","it":"La domanda è di Tulloch, ed è l'unica che conta: «Quando spari?»","ja":"問いはタロックのもので、大事なのはそれだけです。「いつ撃つ？」","pt":"A pergunta é do Tulloch, e é a única que interessa: «Quando é que disparas?»","ru":"Вопрос Таллоха, и он единственный, который имеет значение: «Когда стрелять?»","zh":"问题是塔洛克的，也是唯一要紧的问题：“你什么时候开火？”"},"opts":[{"en":"When I can see the eye, level"},{"en":"From above, at the head"},{"en":"As soon as the arm comes over"}],"answer":0,"fb":{"en":"Tulloch's rule has three parts: wait for the eye, fire level, aim for the mouth. Above and the head are what he said not to do.","ar":"لقاعدة تولوخ ثلاثة أجزاء: انتظري العين، أطلقي أفقيًا، صوّبي نحو الفم. أما من الأعلى، وعلى الرأس، فهما ما قال ألّا تفعليه.","de":"Tullochs Regel hat drei Teile: auf das Auge warten, waagerecht feuern, auf das Maul zielen. Von oben und auf den Kopf ist das, was er verboten hat.","es":"la regla de Tulloch tiene tres partes: esperar al ojo, disparar a la misma altura, apuntar a la boca. Desde arriba y a la cabeza es lo que dijo que no hicieras.","fr":"la règle de Tulloch a trois parties : attendre l'œil, tirer à l'horizontale, viser la bouche. D'en haut et sur la tête, c'est ce qu'il a interdit.","it":"la regola di Tulloch ha tre parti: aspettare l'occhio, sparare in orizzontale, mirare alla bocca. Dall'alto e alla testa è ciò che ha detto di non fare.","ja":"タロックのルールは三つ。目が見えるまで待つ、水平に撃つ、口を狙う。上から撃つことと頭を狙うことは、するなと彼が言ったことです。","pt":"a regra de Tulloch tem três partes: esperar pelo olho, disparar à mesma altura, apontar à boca. De cima e à cabeça é o que ele disse para não fazer.","ru":"правило Таллоха из трёх частей: дождаться глаза, стрелять вровень, целиться в пасть. Сверху и в голову — это то, что он запретил.","zh":"塔洛克的规则有三部分：等看到眼睛，平射，瞄准嘴巴。从上面打、打头，都是他说不要做的。"},"fbRight":{"en":"You lift the gun off the stand. It is heavier than a child. You wait for the mouth and fire level. The line runs out. The fourth barrel goes over.","ar":"ترفعين المدفع عن قاعدته. إنه أثقل من طفل. تنتظرين الفم وتطلقين أفقيًا. يندفع الحبل. يسقط البرميل الرابع من فوق الحافة.","de":"Du hebst die Kanone aus der Halterung. Sie ist schwerer als ein Kind. Du wartest auf das Maul und feuerst waagerecht. Die Leine läuft aus. Die vierte Tonne geht über Bord.","es":"Levantas el cañón del soporte. Pesa más que un niño. Esperas a la boca y disparas a nivel. El cabo corre. El cuarto bidón cae por la borda.","fr":"Tu soulèves le canon de son support. Il est plus lourd qu'un enfant. Tu attends la gueule et tu tires à l'horizontale. La ligne file. Le quatrième baril passe par-dessus bord.","it":"Sollevi il fucile dal supporto. È più pesante di un bambino. Aspetti la bocca e spari in orizzontale. La cima corre. Il quarto bidone va fuori bordo.","ja":"あなたは砲を台から持ち上げます。子どもより重いのです。口が来るのを待ち、水平に撃ちます。ロープが走ります。四つ目の樽が舷の外へ落ちます。","pt":"Tiras o canhão do suporte. É mais pesado do que uma criança. Esperas pela boca e disparas a direito. O cabo corre. O quarto bidão vai pela borda fora.","ru":"Ты снимаешь пушку со станка. Она тяжелее ребёнка. Ты ждёшь пасть и стреляешь ровно. Линь уходит. Четвёртая бочка летит за борт.","zh":"你把炮从支架上抬起来。它比一个孩子还重。你等着嘴巴出现，平着开火。缆绳飞快放出。第四个浮桶翻出了船外。"},"fbWrong":{"en":"You fire early into the head and the harpoon skids off. One shot. Tulloch said one.","ar":"تطلقين مبكرًا على الرأس فتنزلق الحربة عنه. طلقة واحدة. قال تولوخ واحدة.","de":"Du feuerst zu früh auf den Kopf, und die Harpune prallt ab. Ein Schuss. Tulloch hat einer gesagt.","es":"Disparas pronto, a la cabeza, y el arpón rebota. Un solo disparo. Tulloch dijo uno.","fr":"Tu tires trop tôt, dans la tête, et le harpon ricoche. Un seul tir. Tulloch a dit un.","it":"Spari troppo presto, alla testa, e l'arpione rimbalza. Un colpo solo. Tulloch ha detto uno.","ja":"早すぎて頭を撃ってしまい、銛は滑ってそれます。一発だけ。タロックは一発だと言っていました。","pt":"Disparas cedo demais, à cabeça, e o arpão ressalta. Um tiro. O Tulloch disse um.","ru":"Ты стреляешь слишком рано, в голову, и гарпун отскакивает. Один выстрел. Таллох сказал — один.","zh":"你开火太早，打在头上，鱼叉滑开了。只有一发。塔洛克说过只有一发。"},"clue":[{"en":"You hear — Tulloch, in your head, from Sunday: \"The gun's got one shot. The line runs to the barrel. Don't fire till you can see the eye, and don't fire from above, because the head's armoured. Fire level, into the mouth.\"","ar":"تسمعين — تولوخ، في رأسكِ، من ليلة الأحد: \"للمدفع طلقة واحدة. الحبل موصول بالبرميل. لا تطلقي حتى تري العين، ولا تطلقي من الأعلى، لأن الرأس مدرّع. أطلقي أفقيًا، في الفم.\"","de":"Du hörst — Tulloch, in deinem Kopf, vom Sonntag: „Die Kanone hat einen Schuss. Die Leine läuft zur Tonne. Feuern Sie nicht, bevor Sie das Auge sehen, und feuern Sie nicht von oben, denn der Kopf ist gepanzert. Waagerecht feuern, ins Maul.“","es":"Oyes — a Tulloch, en tu cabeza, desde el domingo: “El arpón tiene un solo tiro. El cabo va al bidón. No dispare hasta que le vea el ojo, y no dispare desde arriba, porque la cabeza está acorazada. Dispare a la misma altura, a la boca.”","fr":"Tu entends — Tulloch, dans ta tête, depuis dimanche : « Le canon a un seul coup. La ligne va au baril. Ne tirez pas avant de voir l'œil, et ne tirez pas d'en haut, parce que la tête est blindée. Tirez à l'horizontale, dans la bouche. »","it":"Senti — Tulloch, nella tua testa, da domenica: «Il fucile ha un colpo solo. La cima va al bidone. Non spari finché non vede l'occhio, e non spari dall'alto, perché la testa è corazzata. Spari in orizzontale, in bocca.»","ja":"聞こえる——頭の中のタロック、日曜日の言葉：「この砲は一発きりだ。ロープは樽につながっている。目が見えるまで撃つな。上からも撃つな、頭は装甲だからだ。水平に、口の中へ撃て」","pt":"Ouves — Tulloch, na tua cabeça, desde domingo: «A arma tem um tiro só. A linha vai até ao bidão. Não dispare antes de ver o olho, e não dispare de cima, porque a cabeça é blindada. Dispare à mesma altura, para dentro da boca.»","ru":"Ты слышишь — Таллоха, у себя в голове, с воскресенья: «У пушки один выстрел. Линь идёт к бочке. Не стреляйте, пока не увидите глаз, и не стреляйте сверху, потому что голова бронирована. Стреляйте вровень, в пасть.»","zh":"你听到——塔洛克，在你脑子里，星期天说的：“这炮只有一发。缆绳连着浮桶。看到眼睛之前别开火，也别从上面打，因为它的头有甲。平射，打进嘴里。”"},{"en":"The window beside you goes dark. An eye, bigger than a dinner plate, ringed with gold, looks in at you through the glass, and does not blink.","ar":"تظلم النافذة بجانبكِ. عين، أكبر من صحن عشاء، محاطة بحلقة ذهبية، تنظر إليكِ عبر الزجاج، ولا ترمش.","de":"Das Fenster neben dir wird dunkel. Ein Auge, größer als ein Essteller, von Gold umringt, sieht dich durch das Glas an und blinzelt nicht.","es":"La ventana que tienes al lado se oscurece. Un ojo, más grande que un plato llano, con un anillo dorado, te mira a través del cristal, y no parpadea.","fr":"La fenêtre à côté de toi s'assombrit. Un œil, plus grand qu'une assiette, cerclé d'or, te regarde à travers la vitre, et ne cligne pas.","it":"La finestra accanto a te si oscura. Un occhio, più grande di un piatto piano, cerchiato d'oro, ti guarda attraverso il vetro, e non sbatte le palpebre.","ja":"すぐ横の窓が暗くなります。夕食の皿より大きく、金色の輪に縁取られた目が、ガラス越しにあなたをのぞき込み、まばたきもしません。","pt":"A janela ao teu lado escurece. Um olho, maior do que um prato raso, com um anel dourado, olha para ti através do vidro, e não pestaneja.","ru":"Окно рядом с тобой темнеет. Глаз, больше обеденной тарелки, обведённый золотом, смотрит на тебя через стекло и не моргает.","zh":"你旁边的窗户暗了下来。一只比餐盘还大、镶着金边的眼睛隔着玻璃往里看着你，一眨不眨。"}],"relic":true},"3.10":{"img":"54_q10_flare.webp","hot":[91.5,79.0,12.0,16.0],"title":{"en":"THE FLARE","ar":"شعلة الإشارة","de":"DIE LEUCHTKUGEL","es":"LA BENGALA","fr":"LA FUSÉE","it":"IL RAZZO","ja":"信号弾","pt":"O VERY-LIGHT","ru":"СИГНАЛЬНАЯ РАКЕТА","zh":"信号弹"},"story":[{"en":"A voice from the water. Vass. She has swum back to the boat and she is hanging off the rail with her mask round her neck, shouting up at you over the noise of the water.","ar":"صوت من الماء. فاس. سبحت عائدة إلى القارب وهي معلّقة بالحافة وقناعها حول عنقها، تصرخ إليكِ فوق هدير الماء.","de":"Eine Stimme aus dem Wasser. Vass. Sie ist zum Boot zurückgeschwommen und hängt an der Reling, die Maske um den Hals, und ruft über den Lärm des Wassers zu dir herauf.","es":"Una voz desde el agua. Vass. Ha vuelto nadando hasta el barco y está colgada de la borda con la máscara al cuello, gritándote por encima del ruido del agua.","fr":"Une voix depuis l'eau. Vass. Elle est revenue à la nage jusqu'au bateau et elle est accrochée au bastingage, le masque autour du cou, et te crie quelque chose par-dessus le bruit de l'eau.","it":"Una voce dall'acqua. Vass. È tornata a nuoto fino alla barca ed è aggrappata alla battagliola con la maschera al collo, e ti grida qualcosa sopra il rumore dell'acqua.","ja":"水の中から声がします。ヴァスです。船まで泳いで戻り、マスクを首にかけて手すりにぶら下がり、水音に負けじとあなたに叫んでいます。","pt":"Uma voz vinda da água. Vass. Voltou a nado até ao barco e está agarrada à amurada com a máscara ao pescoço, a gritar-te por cima do barulho da água.","ru":"Голос из воды. Васс. Она приплыла обратно к лодке и висит на планшире с маской на шее, крича тебе сквозь шум воды.","zh":"水里传来一个声音。是瓦丝。她游回了船边，挂在栏杆上，面罩挂在脖子上，盖过水声朝你大喊。"}],"k":{"en":"CHAPTER 3 · THE LAST RUN · TUESDAY","ar":"الفصل 3 · الجولة الأخيرة · الثلاثاء","de":"KAPITEL 3 · DIE LETZTE FAHRT · DIENSTAG","es":"CAPÍTULO 3 · LA ÚLTIMA SALIDA · MARTES","fr":"CHAPITRE 3 · LA DERNIÈRE SORTIE · MARDI","it":"CAPITOLO 3 · L'ULTIMA USCITA · MARTEDÌ","ja":"第3章 · 最後の勝負 · 火曜日","pt":"CAPÍTULO 3 · A ÚLTIMA SAÍDA · TERÇA-FEIRA","ru":"ГЛАВА 3 · ПОСЛЕДНИЙ ВЫХОД · ВТОРНИК","zh":"第3章 · 最后一搏 · 星期二"},"kind":"question","next":"3.11","prompt":{"en":"Vass: \"The gas bottle! The propane! Tulloch ___ it under the stove, it's full, and there's a flare pistol in the locker by your knee!\"","ar":"فاس: \"قارورة الغاز! البروبان! تولوخ ___ تحت الموقد، إنها ممتلئة، وفي الخزانة عند ركبتكِ مسدس إشارات!\"","de":"Vass: „Die Gasflasche! Das Propan! Tulloch ___ sie gerade unter dem Kocher gelassen, sie ist voll, und im Schrank an deinem Knie liegt eine Signalpistole!“","es":"Vass: “¡La bombona de gas! ¡El propano! ¡Tulloch ___ debajo del hornillo, está llena, y hay una pistola de bengalas en el armario que tienes junto a la rodilla!”","fr":"Vass : « La bouteille de gaz ! Le propane ! Tulloch ___ sous le réchaud, elle est pleine, et il y a un pistolet à fusées dans le coffre près de ton genou ! »","it":"Vass: «La bombola del gas! Il propano! Tulloch ___ sotto il fornello, è piena, e c'è una pistola lanciarazzi nell'armadietto vicino al tuo ginocchio!»","ja":"ヴァス：「ガスボンベ！プロパン！タロックがコンロの下に___の。満タンよ。それに、あなたの膝の横の物入れに信号拳銃がある！」","pt":"Vass: «A botija de gás! O propano! O Tulloch ___ debaixo do fogareiro, está cheia, e há uma pistola de very-lights no armário ao pé do teu joelho!»","ru":"Васс: «Газовый баллон! Пропан! Таллох ___ его под плиткой, он полный, а в рундуке у твоего колена есть ракетница!»","zh":"瓦丝：“煤气罐！丙烷！塔洛克___把它放在炉子下面，它是满的，你膝盖边的柜子里还有一把信号枪！”"},"opts":[{"en":"has just leave"},{"en":"has just left"},{"en":"has just leaved"}],"answer":1,"fb":{"en":"JUST goes between HAS and the PAST PARTICIPLE: HAS JUST LEFT. LEAVE is irregular. Its participle is LEFT, not LEAVE or LEAVED.","ar":"JUST تأتي بين HAS وPAST PARTICIPLE: HAS JUST LEFT. الفعل LEAVE شاذ. اسم المفعول منه LEFT، لا LEAVE ولا LEAVED.","de":"JUST steht zwischen HAS und dem PAST PARTICIPLE: HAS JUST LEFT. LEAVE ist unregelmäßig. Sein Partizip ist LEFT, nicht LEAVE oder LEAVED.","es":"JUST va entre HAS y el PAST PARTICIPLE: HAS JUST LEFT. LEAVE es irregular. Su participio es LEFT, no LEAVE ni LEAVED.","fr":"JUST se place entre HAS et le PAST PARTICIPLE : HAS JUST LEFT. LEAVE est irrégulier. Son participe est LEFT, pas LEAVE ni LEAVED.","it":"JUST va tra HAS e il PAST PARTICIPLE: HAS JUST LEFT. LEAVE è irregolare. Il suo participio è LEFT, non LEAVE né LEAVED.","ja":"JUST は HAS と PAST PARTICIPLE の間に入ります：HAS JUST LEFT。LEAVE は不規則動詞です。過去分詞は LEFT で、LEAVE でも LEAVED でもありません。","pt":"JUST vai entre HAS e o PAST PARTICIPLE: HAS JUST LEFT. LEAVE é irregular. O particípio é LEFT, não LEAVE nem LEAVED.","ru":"JUST стоит между HAS и PAST PARTICIPLE: HAS JUST LEFT. LEAVE — неправильный глагол. Его причастие — LEFT, а не LEAVE или LEAVED.","zh":"JUST 放在 HAS 和 PAST PARTICIPLE 之间：HAS JUST LEFT。LEAVE 是不规则动词。它的过去分词是 LEFT，不是 LEAVE 或 LEAVED。"},"fbRight":{"en":"Orange, wet, one cartridge in it.","ar":"برتقالي، مبلول، فيه خرطوشة واحدة.","de":"Orange, nass, eine Patrone darin.","es":"Naranja, mojada, con un cartucho dentro.","fr":"Orange, mouillé, une cartouche dedans.","it":"Arancione, bagnata, con una cartuccia dentro.","ja":"オレンジ色で、濡れていて、弾が一発入っています。","pt":"Cor de laranja, molhada, com um cartucho lá dentro.","ru":"Оранжевая, мокрая, в ней один патрон.","zh":"橙色的，湿的，里面有一发子弹。"},"fbWrong":{"en":"You find the locker on the second try.","ar":"تجدين الخزانة في المحاولة الثانية.","de":"Du findest den Schrank beim zweiten Versuch.","es":"Encuentras el armario al segundo intento.","fr":"Tu trouves le coffre au deuxième essai.","it":"Trovi l'armadietto al secondo tentativo.","ja":"二度目で物入れが見つかります。","pt":"Encontras o armário à segunda tentativa.","ru":"Ты находишь рундук со второй попытки.","zh":"你试到第二次才找到那个柜子。"},"clue":[{"en":"You hear: Vass: \"The gas bottle! The propane! Tulloch ___ it under the stove, it's full, and there's a flare pistol in the locker by your knee!\" · You: \"You said finish it first.\" · Vass: \"I'm helping!\"","ar":"تسمعين: فاس: \"قارورة الغاز! البروبان! تولوخ ___ تحت الموقد، إنها ممتلئة، وفي الخزانة عند ركبتكِ مسدس إشارات!\" · أنتِ: \"قلتِ أنهي الأمر أولًا.\" · فاس: \"أنا أساعد!\"","de":"Du hörst: Vass: „Die Gasflasche! Das Propan! Tulloch ___ sie gerade unter dem Kocher gelassen, sie ist voll, und im Schrank an deinem Knie liegt eine Signalpistole!“ · Du: „Du hast gesagt, erst zu Ende bringen.“ · Vass: „Ich helfe doch!“","es":"Oyes: Vass: “¡La bombona de gas! ¡El propano! ¡Tulloch ___ debajo del hornillo, está llena, y hay una pistola de bengalas en el armario que tienes junto a la rodilla!” · Tú: “Dijiste que primero lo terminara.” · Vass: “¡Estoy ayudando!”","fr":"Tu entends : Vass : « La bouteille de gaz ! Le propane ! Tulloch ___ sous le réchaud, elle est pleine, et il y a un pistolet à fusées dans le coffre près de ton genou ! » · Toi : « Tu as dit d'en finir d'abord. » · Vass : « Je t'aide ! »","it":"Senti: Vass: «La bombola del gas! Il pro nt sur le bois.","it":"Il portello di poppa è stato strappato via. Oltre l'apertura, il becco si alza all'altezza del ponte: nero, ricurvo, cento volte più grande dell'anello nel barattolo, che si apre e si chiude sul legno.","ja":"船尾の扉がもぎ取られています。開いたすき間の向こうで、くちばしが甲板の高さまで上がってきます。黒く、曲がっていて、瓶の輪の百倍も大きく、木の上で開いたり閉じたりしています。","pt":"O portelão de popa foi arrancado. Para lá da abertura, o bico ergue-se à altura do convés: preto, curvo, cem vezes maior do que o anel do frasco, a abrir e a fechar sobre a madeira.","ru":"Кормовая калитка сорвана. За открывшимся проёмом клюв поднимается вровень с палубой: чёрный, изогнутый, в сто раз больше кольца из банки, смыкаясь и размыкаясь на дереве.","zh":"船尾的尾门被扯掉了。缺口外面，那只喙升到与甲板齐平：黑色，弯曲，比罐子里的环大一百倍，在木头上一张一合。"},{"en":"You drag the small propane bottle from under the stove, lay it on its side, and send it rolling down the sloping deck. It passes through the open stern and into the beak. The beak closes on it.","ar":"تسحبين قارورة البروبان الصغيرة من تحت الموقد، وتضعينها على جنبها، وتدحرجينها على السطح المائل. تمرّ عبر المؤخرة المفتوحة وتدخل المنقار. ينغلق المنقار عليها.","de":"Du ziehst die kleine Propanflasche unter dem Kocher hervor, legst sie auf die Seite und schickst sie das schräge Deck hinunterrollen. Sie geht durch das offene Heck und in den Schnabel. Der Schnabel schließt sich darauf.","es":"Sacas la pequeña bombona de propano de debajo del hornillo, la tumbas de lado y la mandas rodando cubierta abajo. Pasa por la popa abierta y entra en el pico. El pico se cierra sobre ella.","fr":"Tu tires la petite bouteille de propane de sous le réchaud, la couches sur le flanc et l'envoies rouler le long du pont incliné. Elle passe par la poupe ouverte et entre dans le bec. Le bec se referme dessus.","it":"Tiri fuori la piccola bombola di propano da sotto il fornello, la metti su un fianco e la mandi a rotolare giù per il ponte inclinato. Passa dalla poppa aperta ed entra nel becco. Il becco si richiude sopra.","ja":"あなたは小さなプロパンボンベをコンロの下から引きずり出し、横に倒して、傾いた甲板を転がしていきます。それは開いた船尾を通って、くちばしの中へ入ります。くちばしがそれを噛み締めます。","pt":"Arrastas a pequena botija de propano de debaixo do fogareiro, deitas-a de lado e mandas-a a rolar pelo convés inclinado. Passa pela popa aberta e entra no bico. O bico fecha-se sobre ela.","ru":"Ты вытаскиваешь маленький пропановый баллон из-под плитки, кладёшь его на бок и пускаешь катиться вниз по наклонной палубе. Он проходит через открытую корму и попадает в клюв. Клюв смыкается на нём.","zh":"你把那只小丙烷瓶从炉子下拖出来，把它侧放，让它顺着倾斜的甲板滚下去。它穿过敞开的船尾，滚进了喙里。喙合上了。"},{"en":"You retreat up the deck to the wheelhouse and take the flare pistol in your right hand. Crouching behind the solid bulkhead, you aim through a narrow gap beside the door. The length of the deck lies between you and the beak.","ar":"تتراجعين على السطح صعودًا إلى غرفة القيادة وتأخذين مسدس الإشارات بيدكِ اليمنى. جاثيةً خلف الحاجز الصلب، تصوّبين عبر فتحة ضيقة بجانب الباب. بينكِ وبين المنقار طول السطح كله.","de":"Du ziehst dich das Deck hinauf ins Steuerhaus zurück und nimmst die Signalpistole in die rechte Hand. Hinter dem massiven Schott kauernd, zielst du durch einen schmalen Spalt neben der Tür. Zwischen dir und dem Schnabel liegt die ganze Länge des Decks.","es":"Te retiras cubierta arriba hasta el puente y coges la pistola de bengalas con la mano derecha. Agachada detrás del mamparo macizo, apuntas por una rendija estrecha junto a la puerta. Entre el pico y tú está toda la cubierta.","fr":"Tu remontes le pont jusqu'à la timonerie et prends le pistolet à fusées dans la main droite. Accroupie derrière la cloison pleine, tu vises par une fente étroite à côté de la porte. Toute la longueur du pont te sépare du bec.","it":"Ti ritiri su per il ponte fino alla timoneria e prendi la pistola lanciarazzi nella mano destra. Accovacciata dietro la paratia piena, miri attraverso una fessura stretta accanto alla porta. Fra te e il becco c'è tutta la lunghezza del ponte.","ja":"あなたは甲板を上って操舵室まで下がり、右手に信号拳銃を取ります。頑丈な隔壁の陰にかがみ、扉の横の細いすき間から狙います。あなたとくちばしの間には甲板の長さがまるごとあります。","pt":"Recuas convés acima até à casa do leme e pegas na pistola de very-lights com a mão direita. Agachada atrás da antepara maciça, apontas por uma fresta estreita ao lado da porta. Entre ti e o bico está todo o comprimento do convés.","ru":"Ты отходишь по палубе вверх к рубке и берёшь ракетницу в правую руку. Присев за сплошной переборкой, ты целишься через узкую щель рядом с дверью. Между тобой и клювом — вся длина палубы.","zh":"你沿着甲板退回驾驶室，右手拿起信号枪。你蹲在坚固的舱壁后面，从门边一道窄缝里瞄准。你和那只喙之间隔着整条甲板。"},{"en":"You have never been so calm in your life.","ar":"لم تكوني هادئة إلى هذا الحدّ في حياتكِ.","de":"Du bist noch nie in deinem Leben so ruhig gewesen.","es":"Nunca has estado tan tranquila en tu vida.","fr":"Tu n'as jamais été aussi calme de ta vie.","it":"Non sei mai stata così calma in vita tua.","ja":"あなたは生まれてからこんなに落ち着いたことはありません。","pt":"Nunca estiveste tão calma na tua vida.","ru":"Ты никогда в жизни не была так спокойна.","zh":"你这辈子从没这么冷静过。"}],"k":{"en":"CHAPTER 3 · THE LAST RUN · TUESDAY","ar":"الفصل 3 · الجولة الأخيرة · الثلاثاء","de":"KAPITEL 3 · DIE LETZTE FAHRT · DIENSTAG","es":"CAPÍTULO 3 · LA ÚLTIMA SALIDA · MARTES","fr":"CHAPITRE 3 · LA DERNIÈRE SORTIE · MARDI","it":"CAPITOLO 3 · L'ULTIMA USCITA · MARTEDÌ","ja":"第3章 · 最後の勝負 · 火曜日","pt":"CAPÍTULO 3 · A ÚLTIMA SAÍDA · TERÇA-FEIRA","ru":"ГЛАВА 3 · ПОСЛЕДНИЙ ВЫХОД · ВТОРНИК","zh":"第3章 · 最后一搏 · 星期二"},"kind":"question","next":"3.12","prompt":{"en":"You: \"You ___ two boats and a kayak this week. You're not having this one.\" You fire.","ar":"أنتِ: \"أنت ___ قاربين وكاياكًا هذا الأسبوع. لن تأخذ هذا.\" تطلقين.","de":"Du: „Du ___ diese Woche zwei Boote und ein Kajak geholt. Dieses hier bekommst du nicht.“ Du feuerst.","es":"Tú: “___ dos barcos y un kayak esta semana. Este no te lo llevas.” Disparas.","fr":"Toi : « Tu ___ deux bateaux et un kayak cette semaine. Celui-là, tu ne l'auras pas. » Tu tires.","it":"Tu: «Tu ___ due barche e un kayak questa settimana. Questa non te la prendi.» Spari.","ja":"あなた：「今週、あなたは船 nk gushes into the sea, spreading across the waves. Its arms strike the water once, then slide beneath the dark surface.","ar":"تنفجر القارورة. عبر الرذاذ المتساقط، ترين الكراكن يتراجع منتصبًا. يتدفّق حبر أسود في البحر وينتشر على الأمواج. تضرب أذرعه الماء مرة واحدة، ثم تنزلق تحت السطح المظلم.","de":"Die Flasche explodiert. Durch die fallende Gischt siehst du den Kraken zurückfahren. Schwarze Tinte quillt ins Meer und breitet sich über die Wellen. Seine Arme schlagen einmal aufs Wasser und gleiten dann unter die dunkle Oberfläche.","es":"La bombona estalla. A través de la espuma que cae, ves al Kraken echarse hacia atrás. Tinta negra brota en el mar y se extiende por las olas. Sus brazos golpean el agua una vez y luego se deslizan bajo la superficie oscura.","fr":"La bouteille explose. À travers les embruns qui retombent, tu vois le Kraken se cabrer. De l'encre noire jaillit dans la mer et s'étale sur les vagues. Ses bras frappent l'eau une fois, puis glissent sous la surface sombre.","it":"La bombola esplode. Attraverso gli spruzzi che ricadono, vedi il Kraken impennarsi all'indietro. Inchiostro nero si riversa in mare e si allarga sulle onde. Le sue braccia colpiscono l'acqua una volta, poi scivolano sotto la superficie scura.","ja":"ボンベが爆発します。降りそそぐしぶきの向こうで、クラーケンがのけぞるのが見えます。黒い墨が海に噴き出し、波の上に広がります。その腕が一度水面を打ち、それから暗い水面の下へ滑り込んでいきます。","pt":"A botija explode. Através da espuma que cai, vês o Kraken recuar. Tinta preta jorra para o mar e espalha-se pelas ondas. Os seus braços batem na água uma vez, e depois deslizam sob a superfície escura.","ru":"Баллон взрывается. Сквозь падающие брызги ты видишь, как Кракен отшатывается. Чёрная чернильная струя бьёт в море и растекается по волнам. Его руки один раз ударяют по воде, а потом ускользают под тёмную поверхность.","zh":"气罐爆炸了。透过落下的水花，你看到克拉肯向后仰起。黑色的墨汁涌进海里，在浪上扩散开来。它的臂拍了一下水面，然后滑入黑暗的海面之下。"},"img":"insert_kraken_ink.webp","hot":[85.0,70.0,12.0,16.0],"label":{"en":"THE BLACK TIDE","ar":"المدّ الأسود","de":"DIE SCHWARZE FLUT","es":" ","ja":"樽","pt":"OS BIDÕES","ru":"БОЧКИ","zh":"浮桶"}},{"t":"story","b":{"en":"Out on the flat water all four barrels come up together, their lines cut clean, and float. An hour passes. Nothing comes up after them.","ar":"على الماء الساكن تطفو البراميل الأربعة معًا، وحبالها مقطوعة بدقّة، وتبقى طافية. تمرّ ساعة. لا يصعد شيء بعدها.","de":"Draußen auf dem glatten Wasser kommen alle vier Tonnen zusammen hoch, die Leinen glatt durchtrennt, und treiben. Eine Stunde vergeht. Nichts kommt hinter ihnen hoch.","es":"Ahí fuera, en el agua lisa, los cuatro bidones suben juntos, con los cabos cortados limpiamente, y flotan. Pasa una hora. Detrás de ellos no sube nada.","fr":"Au large, sur l'eau plate, les quatre barils remontent ensemble, leurs lignes coupées net, et flottent. Une heure passe. Rien ne remonte derrière eux.","it":"Fuori, sull'acqua piatta, tutti e quattro i bidoni riemergono insieme, con le cime tagliate di netto, e galleggiano. Passa un'ora. Dietro di loro non risale niente.","ja":"平らな水面に、四つの樽がそろって浮かび上がります。ロープはきれいに切れていて、そのまま浮かんでいます。一時間が過ぎます。そのあとから浮かんでくるものはありません。","pt":"Lá fora, na água lisa, os quatro bidões sobem juntos, com as linhas cortadas a direito, e ficam a boiar. Passa uma hora. Atrás deles não vem nada.","ru":"Там, на гладкой воде, все четыре бочки всплывают вместе, с ровно обрезанными линями, и держатся на поверхности. Проходит час. За ними ничего не всплывает.","zh":"在平静的水面上，四个浮桶一起浮了上来，缆绳断得整整齐齐，就这样漂着。一个小时过去了。后面什么也没有浮上来。"},"img":"56_q12_fourbarrels.webp","hot":[78.0,64.0,12.0,16.0],"label":{"en":"THE BARRELS","ar":"البراميل","de":"DIE TONNEN","es":"LOS BIDONES","fr":"LES BARILS","it":"I BIDONI","ja":"樽","pt":"OS BIDÕES","ru":"БОЧКИ","zh":"浮桶"}},{"t":"story","b":{"en":"You hear — Tulloch's rule, from the shed on Monday: \"If it's dead, it sinks. The barrels come up when the lines part. If it's alive it keeps the barrels, and you'll see them again inside the hour.\"","ar":"تسمعين — قاعدة تولوخ، من السقيفة يوم الاثنين: \"إن كان ميتًا، يغرق. تطفو البراميل حين تنقطع الحبال. إن كان حيًّا يحتفظ بالبراميل، وسترينها من جديد خلال ساعة.\"","de":"Du hörst — Tullochs Regel, vom Montag im Schuppen: „Wenn es tot ist, sinkt es. Die Tonnen kommen hoch, wenn die Leinen reißen. Wenn es lebt, behält es die Tonnen, und Sie sehen sie innerhalb einer Stunde wieder.“","es":"Oyes — la regla de Tulloch, del cobertizo el lunes: “Si está muerto, se hunde. Los bidones suben cuando los cabos se parten. Si está vivo se queda con los bidones, y los volverás a ver antes de una hora.”","fr":"Tu entends — la règle de Tulloch, du hangar lundi : « S'il est mort, il coule. Les barils remontent quand les lignes rompent. S'il est vivant il garde les barils, et vous les reverrez dans l'heure. »","it":"Senti — la regola di Tulloch, dal capanno lunedì: «Se è morto, affonda. I bidoni risalgono quando le cime si spezzano. Se è vivo si tiene i bidoni, e li rivedrà entro un'ora.»","ja":"聞こえる——月曜日に小屋で聞いたタロックのルール：「死んでいれば沈む。ロープが切れれば樽が浮かぶ。生きていれば樽を連れたままで、一時間以内にまた樽が見える」","pt":"Ouves — a regra de Tulloch, do barracão na segunda-feira: «Se estiver morto, afunda-se. Os bidões sobem quando as linhas partem. Se estiver vivo fica com os bidões, e volta a vê-los dentro de uma hora.»","ru":"Ты слышишь — правило Таллоха, из сарая в понедельник: «Если оно мёртвое, оно тонет. Бочки всплывают, когда лини рвутся. Если оно живое, оно держит бочки, и вы увидите их снова в течение часа.»","zh":"你听到——塔洛克的规则，星期一在棚屋里说的：“如果它死了，它就会沉。缆绳断了浮桶就会浮上来。如果它活着，它会带着浮桶，一小时之内你就会再看到它们。”"},"img":"56_q12_fourbarrels.webp","hot":[78.0,64.0,12.0,16.0],"label":{"en":"THE CLUE","ar":"الدليل","de":"DER HINWEIS","es":"LA PISTA","fr":"L'INDICE","it":"L'INDIZIO","ja":"手がかり","pt":"A PISTA","ru":"ПОДСКАЗКА","zh":"线索"}},{"t":"story","b":{"en":"Vass: \"Four barrels up, lines parted, and it's been an hour. Alive or dead?\"","ar":"فاس: \"أربعة براميل طافية، وحبالها مقطوعة، ومرّت ساعة. حيّ أم ميت؟\"","de":"Vass: „Vier Tonnen oben, Leinen gerissen, und es ist eine Stunde vergangen. Lebendig oder tot?“","es":"Vass: “Cuatro bidones arriba, cabos partidos, y ha pasado una hora. ¿Vivo o muerto?”","fr":"Vass : « Quatre barils remontés, lignes rompues, et ça fait une heure. Vivant ou mort ? »","it":"Vass: «Quattro bidoni su, cime spezzate, ed è passata un'ora. Vivo o morto?»","ja":"ヴァス：「樽が四つ浮いて、ロープは切れて、一時間たった。生きている？死んでいる？」","pt":"Vass: «Quatro bidões à superfície, linhas partidas, e já passou uma hora. Vivo ou morto?»","ru":"Васс: «Четыре бочки наверху, лини оборваны, и прошёл час. Живое или мёртвое?»","zh":"瓦丝：“四个浮桶都浮上来了，缆绳都断了，已经一个小时了。活的还是死的？”"},"img":"56_q12_fourbarrels.webp","hot":[78.0,64.0,12.0,16.0],"label":{"en":"THE CLUE","ar":"الدليل","de":"DER HINWEIS","es":"LA PISTA","fr":"L'INDICE","it":"L'INDIZIO","ja":"手がかり","pt":"A PISTA","ru":"ПОДСКАЗКА","zh":"线索"}}],"askImg":"56_q12_fourbarrels.webp","askHot":[78.0,64.0,12.0,16.0]},"3.13":{"img":"57_q13_swim.webp","hot":[81.0,66.0,12.0,16.0],"title":{"en":"THE LONG SWIM","ar":"السباحة الطويلة","de":"DAS LANGE SCHWIMMEN","es":"LA TRAVESÍA LARGA","fr":"LA LONGUE NAGE","it":"LA LUNGA NUOTATA","ja":"長い泳ぎ","pt":"A LONGA TRAVESSIA","ru":"ДОЛГИЙ ЗАПЛЫВ","zh":"长泳"},"story":[{"en":"You lash two barrels together with the rope and kick for the skerry, a mile off, with the gale coming up behind you. It takes two hours. Vass talks the whole way because she says it keeps her warm.","ar":"تربطين برميلين معًا بالحبل وتسبحين نحو الصخرة البحرية، على بعد ميل، والعاصفة تشتدّ خلفكِ. يستغرق الأمر ساعتين. تتكلّم فاس طوال الطريق لأنها تقول إن ذلك يبقيها دافئة.","de":"Du bindest zwei Tonnen mit dem Tau zusammen und strampelst zur Schäre, eine Meile entfernt, mit dem Sturm im Rücken. Es dauert zwei Stunden. Vass redet den ganzen Weg, weil sie sagt, das hält sie warm.","es":"Atas dos bidones juntos con el cabo y pataleas hacia el islote, a una milla, con el temporal llegando por detrás. Tardáis dos horas. Vass habla todo el camino porque dice que así entra en calor.","fr":"Tu attaches deux barils ensemble avec le cordage et tu bats des jambes vers le récif, à un mille, avec le coup de vent qui monte derrière toi. Ça prend deux heures. Vass parle tout le long parce qu'elle dit que ça lui tient chaud.","it":"Leghi insieme due bidoni con la cima e nuoti verso lo scoglio, a un miglio, con la burrasca che sale alle tue spalle. Ci vogliono due ore. Vass parla per tutto il tragitto perché dice che così si tiene al caldo.","ja":"あなたはロープで樽を二つ縛り合わせ、背後から嵐が迫る中、一マイル先の岩礁へ向かって水を蹴ります。二時間かかります。ヴァスはずっとしゃべり続けます。そうすると体が温まるのだと言って。","pt":"Atas dois bidões com o cabo e nadas para o ilhéu, a uma milha, com o temporal a subir atrás de ti. Demora duas horas. Vass fala o caminho todo porque diz que assim se mantém quente.","ru":"Ты связываешь две бочки тросом и гребёшь к шхере, до которой миля, а шторм поднимается сзади. Это занимает два часа. Васс говорит всю дорогу, потому что, по её словам, так теплее.","zh":"你用绳子把两个浮桶绑在一起，蹬着水朝一英里外的礁石游去，风暴在你身后涌起。游了两个小时。瓦丝一路都在说话，因为她说这样能让她暖和。"}],"k":{"en":"CHAPTER 3 · THE LAST RUN · TUESDAY","ar":"الفصل 3 · الجولة الأخيرة · الثلاثاء","de":"KAPITEL 3 · DIE LETZTE FAHRT · DIENSTAG","es":"CAPÍTULO 3 · LA ÚLTIMA SALIDA · MARTES","fr":"CHAPITRE 3 · LA DERNIÈRE SORTIE · MARDI","it":"CAPITOLO 3 · L'ULTIMA USCITA · MARTEDÌ","ja":"第3章 · 最後の勝負 · 火曜日","pt":"CAPÍTULO 3 · A ÚLTIMA SAÍDA · TERÇA-FEIRA","ru":"ГЛАВА 3 · ПОСЛЕДНИЙ ВЫХОД · ВТОРНИК","zh":"第3章 · 最后一搏 · 星期二"},"kind":"question","next":"3.14","prompt":{"en":"You: \"I ___ in the water three times this week, and I still can't swim.\"","ar":"أنتِ: \"أنا ___ في الماء ثلاث مرات هذا الأسبوع، وما زلت لا أعرف السباحة.\"","de":"Du: „Ich ___ diese Woche dreimal im Wasser, und ich kann immer noch nicht schwimmen.“","es":"Tú: “___ en el agua tres veces esta semana, y sigo sin saber nadar.”","fr":"Toi : « Je ___ à l'eau trois fois cette semaine, et je ne sais toujours pas nager. »","it":"Tu: «___ in acqua tre volte questa settimana, e ancora non so nuotare.»","ja":"あなた：「今週、水に___のは三回目なのに、まだ泳げない」","pt":"Tu: «___ na água três vezes esta semana, e continuo sem saber nadar.»","ru":"Ты: «Я ___ в воде три раза на этой неделе и до сих пор не умею плавать.»","zh":"你：“这个星期我已经___水里三次了，可我还是不会游泳。”"},"opts":[{"en":"have being"},{"en":"have been"},{"en":"was been"}],"answer":1,"fb":{"en":"Here the speaker counts experiences in THIS WEEK, which is still in progress: HAVE BEEN. HAVE BEING and WAS BEEN are not correct forms.","ar":"هنا تعدّ المتكلّمة التجارب في THIS WEEK، وهو أسبوع لم ينتهِ بعد: HAVE BEEN. أما HAVE BEING وWAS BEEN فليستا صيغتين صحيحتين.","de":"Hier werden Erfahrungen innerhalb von THIS WEEK gezählt, und diese Woche ist noch nicht vorbei: HAVE BEEN. HAVE BEING und WAS BEEN sind keine korrekten Formen.","es":"Aquí la hablante cuenta experiencias dentro de THIS WEEK, que todavía no ha terminado: HAVE BEEN. HAVE BEING y WAS BEEN no son formas correctas.","fr":"Ici la personne compte des expériences à l'intérieur de THIS WEEK, qui n'est pas terminée : HAVE BEEN. HAVE BEING et WAS BEEN ne sont pas des formes correctes.","it":"Qui chi parla conta esperienze dentro THIS WEEK, che non è ancora finita: HAVE BEEN. HAVE BEING e WAS BEEN non sono forme corrette.","ja":"ここで話し手は、まだ終わっていない THIS WEEK の中の経験を数えています：HAVE BEEN。HAVE BEING や WAS BEEN は正しい形ではありません。","pt":"Aqui quem fala conta experiências dentro de THIS WEEK, que ainda não acabou: HAVE BEEN. HAVE BEING e WAS BEEN não são formas corretas.","ru":"Здесь говорящая считает случаи внутри THIS WEEK, которая ещё не закончилась: HAVE BEEN. HAVE BEING и WAS BEEN не являются правильными формами.","zh":"这里说话人在计算 THIS WEEK 里的经历，这个星期还没结束：HAVE BEEN。HAVE BEING 和 WAS BEEN 都不是正确形式。"},"fbRight":{"en":"Your feet touch the shelf.","ar":"تلمس قدماكِ الجرف.","de":"Deine Füße berühren die Bank.","es":"Tus pies tocan la plataforma.","fr":"Tes pieds touchent le plateau.","it":"I tuoi piedi toccano il pianoro.","ja":"あなたの足が浅瀬に触れます。","pt":"Os teus pés tocam no baixio.","ru":"Твои ноги касаются отмели.","zh":"你的脚碰到了浅滩。"},"fbWrong":{"en":"Vass: \"You'll be able to say it right by the rocks.\"","ar":"فاس: \"حين نصل إلى الصخور ستقولينها صحيحة.\"","de":"Vass: „Bis zu den Felsen kannst du es richtig sagen.“","es":"Vass: “Para cuando lleguemos a las rocas ya lo dirás bien.”","fr":"Vass : « D'ici aux rochers, tu sauras le dire correctement. »","it":"Vass: «Prima degli scogli riuscirai a dirlo bene.»","ja":"ヴァス：「岩に着くころには、ちゃんと言えるようになってるわ」","pt":"Vass: «Até às rochas vais conseguir dizê-lo bem.»","ru":"Васс: «К скалам ты уже сможешь сказать это правильно.»","zh":"瓦丝：“等到了岩石那儿，你就能说对了。”"},"clue":[{"en":"You hear: You: \"I've hated deep water all my life.\" · Vass: \"You've picked a strange week to stop.\" · You: \"I ___ in the water three times this week, and I still can't swim.\" · Vass: \"You're swimming now.\"","ar":"تسمعين: أنتِ: \"كرهت المياه العميقة طوال حياتي.\" · فاس: \"اخترتِ أسبوعًا غريبًا لتتوقّفي.\" · أنتِ: \"أنا ___ في الماء ثلاث مرات هذا الأسبوع، وما زلت لا أعرف السباحة.\" · فاس: \"أنتِ تسبحين الآن.\"","de":"Du hörst: Du: „Ich habe tiefes Wasser mein Leben lang gehasst.“ · Vass: „Du hast dir eine seltsame Woche ausgesucht, um damit aufzuhören.“ · Du: „Ich ___ diese Woche dreimal im Wasser, und ich kann immer noch nicht schwimmen.“ · Vass: „Du schwimmst gerade.“","es":"Oyes: Tú: “He odiado el agua profunda toda mi vida.” · Vass: “Has elegido una semana rara para dejar de hacerlo.” · Tú: “___ en el agua tres veces esta semana, y sigo sin saber nadar.” · Vass: “Ahora estás nadando.”","fr":"Tu entends : Toi : « J'ai détesté l'eau profonde toute ma vie. » · Vass : « Tu as choisi une semaine étrange pour arrêter. » · Toi : « Je ___ à l'eau trois fois cette semaine, et je ne sais toujours pas nager. » · Vass : « Tu nages, là. »","it":"Senti: Tu: «Ho odiato l'acqua profonda per tutta la vita.» · Vass: «Hai scelto una settimana strana per smettere.» · Tu: «___ in acqua tre volte questa settimana, e ancora non so nuotare.» · Vass: «Adesso stai nuotando.»","ja":"聞こえる：あなた：「生まれてからずっと深い水が嫌いだったの」· ヴァス：「やめるにしては変な週を選んだわね」· あなた：「今週、水に___のは三回目なのに、まだ泳げない」· ヴァス：「今、泳いでるじゃない」","pt":"Ouves: Tu: «Odiei água funda a vida toda.» · Vass: «Escolheste uma semana estranha para deixar de odiar.» · Tu: «___ na água três vezes esta semana, e continuo sem saber nadar.» · Vass: «Estás a nadar agora.»","ru":"Ты слышишь: Ты: «Я всю жизнь ненавидела глубокую воду.» · Васс: «Ты выбрала странную неделю, чтобы перестать.» · Ты: «Я ___ в воде три раза на этой неделе и до сих пор не умею плавать.» · Васс: «Ты сейчас плывёшь.»","zh":"你听到：你：“我这辈子都讨厌深水。”· 瓦丝：“你挑了个奇怪的星期来改掉这个毛病。”· 你：“这个星期我已经___水里三次了，可我还是不会游泳。”· 瓦丝：“你现在就在游。”"}]},"3.14":{"img":"58_q14_lifeboat.webp","hot":[82.0,39.0,12.0,16.0],"title":{"en":"THE LIFEBOAT","ar":"قارب النجاة","de":"DAS RETTUNGSBOOT","es":"EL BOTE SALVAVIDAS","fr":"LE CANOT DE SAUVETAGE","it":"LA SCIALUPPA","ja":"救命艇","pt":"O SALVA-VIDAS","ru":"СПАСАТЕЛЬНАЯ ШЛЮПКА","zh":"救生艇"},"story":[{"en":"The Inverbrae lifeboat comes round the skerry at four, with the first of the gale behind it, and lifts you both off the rock. The coxswain wraps you in foil and makes his call before he asks you a single question.","ar":"يلتفّ قارب نجاة إنفربري حول الصخرة البحرية في الرابعة، وأولى هبّات العاصفة خلفه، وينتشلكما كلتيكما من الصخرة. يلفّكما قائد القارب بالبطانيات الحرارية ويجري نداءه قبل أن يطرح عليكما سؤالًا واحدًا.","de":"Das Rettungsboot von Inverbrae kommt um vier um die Schäre, mit den ersten Sturmböen im Rücken, und holt euch beide vom Felsen. Der Vormann wickelt euch in Rettungsfolie und setzt seinen Funkspruch ab, bevor er euch eine einzige Frage stellt.","es":"El bote salvavidas de Inverbrae dobla el islote a las cuatro, con el principio del temporal detrás, y os recoge a las dos de la roca. El patrón os envuelve en mantas térmicas y hace su llamada antes de haceros una sola pregunta.","fr":"Le canot de sauvetage d'Inverbrae contourne le récif à seize heures, avec les premières rafales derrière lui, et vous récupère toutes les deux sur le rocher. Le patron vous enveloppe dans une couverture de survie et passe son message avant de vous poser une seule question.","it":"La scialuppa di Inverbrae gira attorno allo scoglio alle quattro, con le prime raffiche alle spalle, e vi solleva entrambe dalla roccia. Il capobarca vi avvolge in coperte termiche e fa la sua chiamata prima di farvi una sola domanda.","ja":"四時、嵐の最初の突風を背に、インヴァーブレイ救命艇が岩礁を回ってきて、二人を岩から引き上げます。艇長は二人を保温シートでくるみ、一つも質問をしないうちに無線連絡をします。","pt":"O salva-vidas de Inverbrae contorna o ilhéu às quatro, com as primeiras rajadas atrás, e tira-vos as duas da rocha. O arrais envolve-vos em mantas térmicas e faz a chamada antes de vos fazer uma única pergunta.","ru":"Спасательная шлюпка Инвербрей обходит шхеру в четыре, с первыми порывами шторма за спиной, и снимает вас обеих со скалы. Старшина заворачивает вас в термоодеяла и делает вызов, прежде чем задать хоть один вопрос.","zh":"四点，因弗布雷救生艇绕过礁石，风暴的第一阵狂风就在它身后，把你们俩从岩石上救了下来。艇长用保温毯把你们裹住，在问你们任何问题之前先发出了呼叫。"}],"k":{"en":"CHAPTER 3 · THE LAST RUN · TUESDAY","ar":"الفصل 3 · الجولة الأخيرة · الثلاثاء","de":"KAPITEL 3 · DIE LETZTE FAHRT · DIENSTAG","es":"CAPÍTULO 3 · LA ÚLTIMA SALIDA · MARTES","fr":"CHAPITRE 3 · LA DERNIÈRE SORTIE · MARDI","it":"CAPITOLO 3 · L'ULTIMA USCITA · MARTEDÌ","ja":"第3章 · 最後の勝負 · 火曜日","pt":"CAPÍTULO 3 · A ÚLTIMA SAÍDA · TERÇA-FEIRA","ru":"ГЛАВА 3 · ПОСЛЕДНИЙ ВЫХОД · ВТОРНИК","zh":"第3章 · 最后一搏 · 星期二"},"kind":"question","next":"resolve","prompt":{"en":"Vass, under the foil: \"What has he just told the coastguard?\"","ar":"فاس، تحت البطانية الحرارية: \"ماذا قال لخفر السواحل للتوّ؟\"","de":"Vass, unter der Folie: „Was hat er der Küstenwache gerade gesagt?“","es":"Vass, bajo la manta térmica: “¿Qué acaba de decirle a salvamento?”","fr":"Vass, sous la couverture : « Qu'est-ce qu'il vient de dire aux gardes-côtes ? »","it":"Vass, sotto la coperta: «Cosa ha appena detto alla guardia costiera?»","ja":"ヴァス、保温シートの下で：「彼は今、沿岸警備隊に何と言ったの？」","pt":"Vass, debaixo da manta: «O que é que ele acabou de dizer à guarda costeira?»","ru":"Васс, под термоодеялом: «Что он только что сказал береговой охране?»","zh":"瓦丝，裹在保温毯下：“他刚才跟海岸警卫队说了什么？”"},"opts":[{"en /* A scene's `story` is one block, or a list of them to be read a page at a
   time. The panel does not scroll by design (README section 1: never shrink
   type to fit), which caps a block at about 28 words — fine for the camp

const storyPages=s=>s.story?(Array.isArray(s.story)?s.story:[s.story]):[];
/* A scene reads as a sequence of pages: its story blocks, then its clue blocks,
   then — on a question — the prompt and the options on a page of their own.

   pages the clue too ("THE CLUE / 3 OF 3" then "YOUR ANSWER"), and STORY.md

   asks about it afterwards, so leaving the clue behind is the exercise. */
function scenePages(s){
  /* `pages` is an authored run: the export chose the pages, each with its own
     picture and its own label ("THE SCENE", "YOU HEAR", "THE BELL"), and the
     builder must not split the text itself. A question still gets its own page
     at the end. */
  if(s.pages)return s.kind==='question'?s.pages.concat([{t:'ask',img:s.askImg,hot:s.askHot}]):s.pages.slice();

  if(G.pageClues){

    if(s.kind==='question')out.push({t:'ask'});
  }
  return out.length?out:[{t:'story',b:null}]}
