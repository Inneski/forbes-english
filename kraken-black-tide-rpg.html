"zh":"“那你就会相信吊车。所有人都会。”"},"relic":true,"pages":[{"t":"story","b":{"en":"The village hall kitchen, Saturday morning, cold light through the window. On the table is a wide glass jar of clear fluid and inside it, turning slowly, is a black curved ring the size of your fist.","ar":"مطبخ قاعة القرية، صباح السبت، ضوء بارد عبر النافذة. على الطاولة برطمان زجاجي عريض فيه سائل صافٍ، وفي داخله، يدور ببطء، حلقة سوداء منحنية بحجم قبضتكِ.","de":"Die Küche des Gemeindehauses, Samstagmorgen, kaltes Licht durch das Fenster. Auf dem Tisch steht ein breites Glas mit klarer Flüssigkeit, und darin dreht sich langsam ein schwarzer gebogener Ring von der Größe deiner Faust.","es":"La cocina del salón del pueblo, sábado por la mañana, luz fría por la ventana. Sobre la mesa hay un tarro ancho de cristal con líquido transparente y dentro, girando despacio, un anillo negro curvado del tamaño de tu puño.","fr":"La cuisine de la salle des fêtes, samedi matin, lumière froide par la fenêtre. Sur la table il y a un large bocal en verre rempli de liquide clair et, à l'intérieur, tournant lentement, un anneau noir incurvé de la taille de ton poing.","it":"La cucina della sala del paese, sabato mattina, luce fredda dalla finestra. Sul tavolo c'è un grande barattolo di vetro pieno di un liquido trasparente e, dentro, un anello nero ricurvo grande quanto il tuo pugno che gira lentamente.","ja":"村の集会所の台所、土曜日の朝、窓から冷たい光。テーブルには透明な液体を満たした広口のガラス瓶があり、その中でこぶしほどの黒く曲がった輪がゆっくりと回っています。","pt":"A cozinha da casa do povo, sábado de manhã, luz fria pela janela. Sobre a mesa há um frasco largo de vidro com líquido transparente e lá dentro, a rodar devagar, um anel preto curvo do tamanho do teu punho.","ru":"Кухня сельского зала, субботнее утро, холодный свет из окна. На столе широкая стеклянная банка с прозрачной жидкостью, а внутри, медленно поворачиваясь, чёрное изогнутое кольцо размером с твой кулак.","zh":"村公所的厨房，星期六早上，冷冷的光从窗户照进来。桌上有一个宽口玻璃罐，装着透明液体，里面一个拳头大小的黑色弯环正在慢慢转动。"},"img":"11_q9_jar.webp","hot":[80.0,59.0,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"Vass found it jammed in the splintered gunwale of the Lennox boat. She has studied squid for nine years, in Baja, in Norway, in the Sea of Cortez, and she has been looking at this jar for two hours.","ar":"وجدتها فاس عالقة في الحافة المتشظّية لقارب لينوكس. تدرس الحبّار منذ تسع سنوات، في باها، وفي النرويج، وفي بحر كورتيز، وتحدّق في هذا البرطمان منذ ساعتين.","de":"Vass hat ihn in der zersplitterten Reling des Lennox-Boots eingeklemmt gefunden. Sie erforscht Kalmare seit neun Jahren, in Baja, in Norwegen, im Golf von Kalifornien, und sie starrt seit zwei Stunden auf dieses Glas.","es":"Vass lo encontró encajado en la regala astillada del barco de los Lennox. Lleva nueve años estudiando calamares, en Baja California, en Noruega, en el mar de Cortés, y lleva dos horas mirando este tarro.","fr":"Vass l'a trouvé coincé dans le plat-bord éclaté du bateau des Lennox. Elle étudie les calmars depuis neuf ans, en Basse-Californie, en Norvège, dans la mer de Cortès, et elle regarde ce bocal depuis deux heures.","it":"Vass lo ha trovato incastrato nella falchetta scheggiata della barca dei Lennox. Studia i calamari da nove anni, in Bassa California, in Norvegia, nel Mare di Cortez, e guarda questo barattolo da due ore.","ja":"ヴァスはそれを、レノックスの船の裂けた舷縁に挟まっているのを見つけました。彼女は九年間、バハで、ノルウェーで、コルテス海でイカを研究してきました。そしてこの瓶を二時間見つめています。","pt":"Vass encontrou-o entalado na amurada lascada do barco dos Lennox. Estuda lulas há nove anos, na Baixa Califórnia, na Noruega, no Mar de Cortez, e olha para este frasco há duas horas.","ru":"Васс нашла его застрявшим в расщеплённом планшире лодки Ленноксов. Она изучает кальмаров девять лет — в Нижней Калифорнии, в Норвегии, в море Кортеса — и смотрит на эту банку уже два часа.","zh":"瓦丝发现它卡在伦诺克斯家那艘船碎裂的舷缘里。她研究鱿鱼九年了，在下加利福尼亚，在挪威，在科尔特斯海，她已经盯着这个罐子看了两个小时。"},"img":"11_q9_jar.webp","hot":[80.0,59.0,12.0,16.0],"label":{"en":"THE SCENE","ar":"المشهد","de":"DIE SZENE","es":"LA ESCENA","fr":"LA SCÈNE","it":"LA SCENA","ja":"場面","pt":"A CENA","ru":"СЦЕНА","zh":"场景"}},{"t":"story","b":{"en":"You hear: Vass: \"A squid's beak grows with the animal. A four-metre squid has a beak about the size of my thumb. This ring is the size of my fist. The animal that left it is fourteen metres at least. Maybe twenty.","ar":"تسمعين: فاس: \"منقار الحبّار يكبر مع الحيوان. حبّار طوله أربعة أمتار له منقار بحجم إبهامي تقريبًا. هذه الحلقة بحجم قبضتي. الحيوان الذي تركها طوله أربعة عشر مترًا على الأقل. وربما عشرون.","de":"Du hörst: Vass: „Der Schnabel eines Kalmars wächst mit dem Tier. Ein vier Meter langer Kalmar hat einen Schnabel etwa so groß wie mein Daumen. Dieser Ring ist so groß wie meine Faust. Das Tier, das ihn hinterlassen hat, ist mindestens vierzehn Meter lang. Vielleicht zwanzig.","es":"Oyes: Vass: “El pico de un calamar crece con el animal. Un calamar de cuatro metros tiene un pico del tamaño de mi pulgar. Este anillo es del tamaño de mi puño. El animal que lo dejó mide catorce metros por lo menos. Puede que veinte.","fr":"Tu entends : Vass : « Le bec d'un calmar grandit avec l'animal. Un calmar de quatre mètres a un bec de la taille de mon pouce environ. Cet anneau fait la taille de mon poing. L'animal qui l'a laissé fait quatorze mètres au moins. Peut-être vingt.","it":"Senti: Vass: «Il becco di un calamaro cresce con l'animale. Un calamaro di quattro metri ha un becco grande all'incirca come il mio pollice. Questo anello è grande come il mio pugno. L'animale che lo ha lasciato è lungo almeno quattordici metri. Forse venti.","ja":"聞こえる：ヴァス：「イカのくちばしは体と一緒に大きくなる。四メートルのイカなら、くちばしはだいたい私の親指くらい。この輪は私のこぶしくらい。これを残した動物は少なくとも十四メートル。二十メートルかもしれない。","pt":"Ouves: Vass: «O bico de uma lula cresce com o animal. Uma lula de quatro metros tem um bico mais ou menos do tamanho do meu polegar. Este anel é do tamanho do meu punho. O animal que o deixou tem pelo menos catorze metros. Talvez vinte.","ru":"Ты слышишь: Васс: «Клюв кальмара растёт вместе с животным. У четырёхметрового кальмара клюв примерно с мой большой палец. Это кольцо — с мой кулак. Животное, которое его оставило, длиной не менее четырнадцати метров. Может, двадцать.","zh":"你听到：瓦丝：“鱿鱼的喙随着身体一起长。四米长的鱿鱼，喙大概有我拇指那么大。这个环有我拳头那么大。留下它的动物至少有十四米长。也许二十米。"},"img":"insert_beak_detail.webp","hot":[72.0,51.0,14.0,18.0],"label":{"en":"THE EVIDENCE","ar":"الدليل","de":"DER BEWEIS","es":"LA PRUEBA","fr":"LA PREUVE","it":"LA PROVA","ja":"証拠","pt":"A PROVA","ru":"УЛИКА","zh":"证据"}},{"t":"story","b":{"en":"Nothing that size has ever been recorded alive in these waters. Not once.\" You: \"You've seen a lot of squid.\" Vass: \"I have. I've never seen this.\"","ar":"لم يُسجَّل شيء بهذا الحجم حيًّا في هذه المياه قط. ولا مرة.\" أنتِ: \"لقد رأيتِ كثيرًا من الحبّار.\" فاس: \"نعم. لكنني لم أرَ هذا قط.\"","de":"Nichts in dieser Größe wurde in diesen Gewässern je lebend nachgewiesen. Kein einziges Mal.“ Du: „Sie haben viele Kalmare gesehen.“ Vass: „Habe ich. Das hier habe ich noch nie gesehen.“","es":"Nunca se ha registrado nada de ese tamaño vivo en estas aguas. Ni una sola vez.” Tú: “Has visto muchos calamares.” Vass: “Sí. Pero este no lo he visto nunca.”","fr":"Rien de cette taille n'a jamais été observé vivant dans ces eaux. Pas une seule fois. » Toi : « Vous avez vu beaucoup de calmars. » Vass : « Oui. Mais ça, je ne l'ai jamais vu. »","it":"Niente di quelle dimensioni è mai stato registrato vivo in queste acque. Nemmeno una volta.» Tu: «Ha visto tanti calamari.» Vass: «Sì. Ma questo non l'ho mai visto.»","ja":"この大きさのものが、この海域で生きたまま記録されたことは一度もない。ただの一度も」あなた：「イカはたくさん見てきたんですね」ヴァス：「ええ。でもこんなのは見たことがない」","pt":"Nada desse tamanho foi alguma vez registado vivo nestas águas. Nem uma única vez.» Tu: «Já viste muitas lulas.» Vass: «Vi. Mas isto nunca vi.»","ru":"Ничего такого размера никогда не регистрировали живым в этих водах. Ни разу.» Ты: «Вы видели много кальмаров.» Васс: «Видела. А вот этого никогда не видела.»","zh":"这么大的东西在这片海域从没被活着记录过。一次也没有。”你：“你见过很多鱿鱼。”瓦丝：“是的。但我从没见过这个。”"},"img":"insert_beak_detail.webp","hot":[72.0,51.0,14.0,18.0],"label":{"en":"THE EVIDENCE","ar":"الدليل","de":"DER BEWEIS","es":"LA PRUEBA","fr":"LA PREUVE","it":"LA PROVA","ja":"証拠","pt":"A PROVA","ru":"УЛИКА","zh":"证据"}},{"t":"story","b":{"en":"Vass: \"Here's the test, sergeant. If somebody hauls up a four-metre squid this afternoon and hangs it on the crane, what size of beak should it have?\"","ar":"فاس: \"إليكِ الاختبار أيتها الرقيبة. إذا انتشل أحدهم بعد ظهر اليوم حبّارًا طوله أربعة أمتار وعلّقه على الرافعة، فما حجم المنقار الذي يجب أن يكون له؟\"","de":"Vass: „Hier ist der Test, Sergeant. Wenn heute Nachmittag jemand einen vier Meter langen Kalmar heraufholt und ihn an den Kran hängt, wie groß müsste dann sein Schnabel sein?“","es":"Vass: “Aquí está la prueba, sargento. Si alguien saca esta tarde un calamar de cuatro metros y lo cuelga de la grúa, ¿de qué tamaño debería ser su pico?”","fr":"Vass : « Voilà le test, sergent. Si quelqu'un remonte cet après-midi un calmar de quatre mètres et le pend à la grue, quelle taille devrait faire son bec ? »","it":"Vass: «Ecco la prova, sergente. Se questo pomeriggio qualcuno tira su un calamaro di quattro metri e lo appende alla gru, quanto dovrebbe essere grande il suo becco?»","ja":"ヴァス：「テストをしましょう、巡査部長。今日の午後、誰かが四メートルのイカを引き上げてクレーンに吊るしたら、くちばしはどのくらいの大きさのはず？」","pt":"Vass: «Aqui está o teste, sargento. Se esta tarde alguém içar uma lula de quatro metros e a pendurar na grua, que tamanho devia ter o bico dela?»","ru":"Васс: «Вот проверка, сержант. Если сегодня днём кто-то вытащит четырёхметрового кальмара и повесит его на кран, какого размера должен быть его клюв?»","zh":"瓦丝：“来做个测试，警长。如果今天下午有人拖上来一只四米长的鱿鱼挂在吊车上，它的喙应该有多大？”"},"img":"insert_beak_detail.webp","hot":[72.0,51.0,14.0,18.0],"label":{"en":"THE EVIDENCE","ar":"الدليل","de":"DER BEWEIS","es":"LA PRUEBA","fr":"LA PREUVE","it":"LA PROVA","ja":"証拠","pt":"A PROVA","ru":"УЛИКА","zh":"证据"}}],"askImg":"insert_beak_detail ração, e BEEN não pode cair depois de HAS.","ru":"состояние, длящееся до настоящего момента, требует HAS + BEEN + прилагательное + FOR и период. IS ... SINCE — типичная ошибка для длительности, а BEEN после HAS опускать нельзя.","zh":"持续到现在的状态用 HAS + BEEN + 形容词 + FOR 加一段时间。表示持续时间时用 IS ... SINCE 是学习者常犯的错误，而且 HAS 后面的 BEEN 不能省略。"},"fbRight":{"en":"Menzies catches your eye across the crowd and mouths one word: smile.","ar":"يلتقط منزيس نظرتكِ عبر الحشد ويقول بشفتيه كلمة واحدة بلا صوت: ابتسمي.","de":"Menzies fängt über die Menge hinweg deinen Blick auf und formt mit den Lippen ein einziges Wort: Lächeln.","es":"Menzies te busca la mirada entre la multitud y vocaliza una sola palabra, sin voz: sonría.","fr":"Menzies croise ton regard par-dessus la foule et articule un seul mot, sans bruit : souriez.","it":"Menzies incrocia il tuo sguardo tra la folla e mima con le labbra una sola parola: sorrida.","ja":"メンジーズが人混みの向こうからあなたと目を合わせ、声を出さずに一言だけ口を動かします。笑え。","pt":"Menzies apanha o teu olhar por entre a multidão e forma uma só palavra com os lábios: sorria.","ru":"Мензис ловит твой взгляд поверх толпы и беззвучно произносит одно слово: улыбайтесь.","zh":"孟席斯隔着人群对上你的目光，用口型说了一个词：笑。"},"fbWrong":{"en":"Vass walks away. \"I'll explain it to somebody who listens.\"","ar":"تبتعد فاس. \"سأشرح الأمر لمن يصغي.\"","de":"Vass geht. „Ich erkläre es jemandem, der zuhört.“","es":"Vass se va. “Se lo explicaré a alguien que escuche.”","fr":"Vass s'en va. « Je l'expliquerai à quelqu'un qui écoute. »","it":"Vass se ne va. «Lo spiegherò a qualcuno che ascolta.»","ja":"ヴァスは立ち去ります。「聞く気のある人に説明するわ」","pt":"Vass afasta-se. «Explico a alguém que ouça.»","ru":"Васс уходит. «Объясню тому, кто слушает.»","zh":"瓦丝走开了。“我去给愿意听的人解释。”"},"clue":[{"en":"You hear: Menzies, to the crowd: \"Inverbrae has caught its monster!\"","ar":"تسمعين: منزيس، للحشد: \"إنفربري اصطادت وحشها!\"","de":"Du hörst: Menzies, zur Menge: „Inverbrae hat sein Ungeheuer gefangen!“","es":"Oyes: Menzies, a la multitud: “¡Inverbrae ha capturado a IR","it":"CAPITOLO 2 · IL COLTELLO · SABATO NOTTE","ja":"第2章 · ナイフ · 土曜日の夜","pt":"CAPÍTULO 2 · A FACA · SÁBADO À NOITE","ru":"ГЛАВА 2 · НОЖ · СУББОТА, НОЧЬ","zh":"第2章 · 刀 · 星期六夜里"},"kind":"question","next":"1.12a","prompt":{"en":"Vass: \"Hold the torch steady. I've done this to a hundred of these and never one that smelled like this. Pass me the bucket. I ___ my dinner yet and I'd like to keep it that way.\"","ar":"فاس: \"ثبّتي المصباح. فعلت هذا بمئة منها ولم تكن لأيٍّ منها رائحة كهذه. ناوليني الدلو. أنا ___ عشائي بعد، وأودّ أن يبقى الأمر كذلك.\"","de":"Vass: „Halt die Lampe ruhig. Ich habe das bei hundert von denen gemacht und keiner hat je so gerochen. Gib mir den Eimer. Ich ___ noch nicht zu Abend gegessen, und das möchte ich gern so lassen.“","es":"Vass: “Aguanta la linterna quieta. Le he hecho esto a cien de estos y ninguno olía así. Pásame el cubo. ___ todavía y me gustaría que siguiera siendo así.”","fr":"Vass : « Tiens bien la lampe, sans bouger. J'ai fait ça à une centaine de ces bêtes et aucune n'a jamais senti comme ça. Passe-moi le seau. Je ___ mon dîner et j'aimerais que ça reste comme ça. »","it":"Vass: «Tieni ferma la torcia. L'ho fatto a un centinaio di questi e nessuno ha mai avuto questo odore. Passami il secchio. ___ ancora e mi piacerebbe che restasse così.»","ja":"ヴァス：「懐中電灯をしっかり持って。こういうのは百匹はやってきたけど、こんなにおいのは一匹もなかった。バケツを取って。夕食はまだ___の。このままにしておきたいわ」","pt":"Vass: «Segura a lanterna quieta. Já fiz isto a uma centena destas e nenhuma cheirava assim. Passa-me o balde. ___ ainda e gostava que continuasse assim.»","ru":"Васс: «Держи фонарь ровно. Я делала это с сотней таких, и ни один не пах так. Подай ведро. Я ___ ужин, и мне бы хотелось, чтобы так и осталось.»","zh":"瓦丝：“手电拿稳。这种东西我剖过一百只，从没有一只是这个味儿。把桶递给我。我还___晚饭，希望一直这样。”"},"opts":[{"en":"didn't had"},{"en":"haven't had"},{"en":"haven't have"}],"answer":1,"fb":{"en":"HAVEN'T + PAST PARTICIPLE describes something that has not happened up to now. HAVE becomes HAD: HAVEN'T HAD. DIDN'T takes HAVE, not HAD. YET goes at the end of this sentence.","ar":"HAVEN'T + PAST PARTICIPLE تصف شيئًا لم يحدث حتى الآن. تصبح HAVE هنا HAD: HAVEN'T HAD. مع DIDN'T نستخدم HAVE لا HAD. وتأتي YET في نهاية هذه الجملة.","de":"HAVEN'T + PAST PARTICIPLE beschreibt etwas, das bis jetzt nicht passiert ist. HAVE wird zu HAD: HAVEN'T HAD. DIDN'T nimmt HAVE, nicht HAD. YET steht am Ende dieses Satzes.","es":"HAVEN'T + PAST PARTICIPLE describe algo que no ha ocurrido hasta ahora. HAVE se convierte en HAD: HAVEN'T HAD. DIDN'T lleva HAVE, no HAD. YET va al final de esta frase.","fr":"HAVEN'T + PAST PARTICIPLE décrit une chose qui n'a pas eu lieu jusqu'à maintenant. HAVE devient HAD : HAVEN'T HAD. DIDN'T prend HAVE, pas HAD. YET se place à la fin de cette phrase.","it":"HAVEN'T + PAST PARTICIPLE descrive qualcosa che non è successo fino a ora. HAVE diventa HAD: HAVEN'T HAD. DIDN'T prende HAVE, non HAD. YET va alla fine di questa frase.","ja":"HAVEN'T + PAST PARTICIPLE は、今までまだ起きていないことを表します。HAVE は HAD になります：HAVEN'T HAD。DIDN'T の後は HAVE で、HAD ではありません。YET はこの文の最後に置きます。","pt":"HAVEN'T + PAST PARTICIPLE descreve algo que não aconteceu até agora. HAVE passa a HAD: HAVEN'T HAD. DIDN'T leva HAVE, não HAD. YET vai no fim desta frase.","ru":"HAVEN'T + PAST PARTICIPLE описывает то, чего до сих пор не произошло. HAVE становится HAD: HAVEN'T HAD. После DIDN'T идёт HAVE, а не HAD. YET стоит в конце этого предложения.","zh":"HAVEN'T + PAST PARTICIPLE 描述到现在为止还没发生的事。HAVE 变成 HAD：HAVEN'T HAD。DIDN'T 后面用 HAVE，不用 HAD。YET 放在这个句子的末尾。"},"fbRight":{"en":"The knife goes in.","ar":"تدخل السكين.","de":"Das Messer fährt hinein.","es":"El cuchillo entra.","fr":"Le couteau entre.","it":"Il coltello entra.","ja":"ナイフが入ります。","pt":"A faca entra.","ru":"Нож входит.","zh":"刀切了进去。"},"fbWrong":{"en":"Vass: \"You hold the torch. I'll do the English.\"","ar":"فاس: \"أمسكي أنتِ المصباح. وأنا أتولّى الإنجليزية.\"","de":"Vass: „Du hältst die Lampe. Ich mache das Englisch.“","es":"Vass: “Tú sujeta la linterna. Yo me encargo del inglés.”","fr":"Vass : ástico e muita água. Nem cabo. Nem tinta. Nem pano. Vass dispõe tudo num tabuleiro de aço sob o candeeiro e olha para aquilo durante muito tempo.","ru":"Наружу вываливаются скумбрия, половина пластиковой бутылки и много воды. Никакой верёвки. Никакой краски. Никакой ткани. Васс раскладывает всё на стальном подносе под лампой и долго смотрит.","zh":"倒出来的是鲭鱼、半个塑料瓶和一大堆水。没有绳子。没有油漆。没有布。瓦丝把这些全摆在灯下的一个钢盘里，看了很久。"}],"k":{"en":"CHAPTER 2 · THE KNIFE · SATURDAY NIGHT","ar":"الفصل 2 · السكين · ليلة السبت","de":"KAPITEL 2 · DAS MESSER · SAMSTAGNACHT","es":"CAPÍTULO 2 · EL CUCHILLO · SÁBADO POR LA NOCHE","fr":"CHAPITRE 2 · LE COUTEAU · SAMEDI SOIR","it":"CAPITOLO 2 · IL COLTELLO · SABATO NOTTE","ja":"第2章 · ナイフ · 土曜日の夜","pt":"CAPÍTULO 2 · A FACA · SÁBADO À NOITE","ru":"ГЛАВА 2 · НОЖ · СУББОТА, НОЧЬ","zh":"第2章 · 刀 · 星期六夜里"},"kind":"question","next":"1.13","prompt":{"en":"You: \"So what does its stomach prove?\"","ar":"أنتِ: \"إذن ماذا تُثبت معدته؟\"","de":"Du: „Und was beweist sein Magen?“","es":"Tú: “¿Y qué demuestra su estómago?”","fr":"Toi : « Et qu'est-ce que son estomac prouve ? »","it":"Tu: «E cosa dimostra il suo stomaco?»","ja":"あなた：「それで、胃の中身で何がわかるんですか？」","pt":"Tu: «E o que é que o estômago dela prova?»","ru":"Ты: «И что доказывает его желудок?»","zh":"你：“那它的胃能证明什么？”"},"opts":[{"en":"It ate the Lennox men"},{"en":"It took the red kayak"},{"en":"It's not our animal"}],"answer":2,"fb":{"en":"no rope, no red paint, and it has been dead since before Wednesday. It could not have taken the boat or the kayak.","ar":"لا حبل، ولا طلاء أحمر، وهو ميت منذ ما قبل الأربعاء. ما كان يمكن أن يأخذ القارب أو الكاياك.","de":"kein Seil, keine rote Farbe, und es war schon vor Mittwoch tot. Es kann weder das Boot noch das Kajak geholt haben.","es":"ni cabo, ni pintura roja, y lleva muerto desde antes del miércoles. No pudo llevarse el barco ni el kayak.","fr":"pas de cordage, pas de peinture rouge, et il est mort depuis avant mercredi. Il n'a pas pu prendre le bateau ni le kayak.","it":"niente cavo, niente vernice rossa, ed è morto da prima di mercoledì. Non può aver preso né la barca né il kayak.","ja":"ロープも赤い塗料もなく、しかも水曜日より前から死んでいます。船もカヤックも奪えたはずがありません。","pt":"nem cabo, nem tinta vermelha, e está morta desde antes de quarta-feira. Não pode ter levado o barco nem o caiaque.","ru":"ни верёвки, ни красной краски, и он был мёртв ещё до среды. Он не мог забрать ни лодку, ни каяк.","zh":"没有绳子，没有红漆，而且它在星期三之前就已经死了。它不可能拖走那艘船或那艘皮划艇。"},"fbRight":{"en":"Vass: \"Now we know what it isn't. That's more than the Provost knows.\"","ar":"فاس: \"الآن نعرف ما ليس هو. وهذا أكثر مما يعرفه العمدة.\"","de":"Vass: „Jetzt wissen wir, was es nicht ist. Das ist mehr, als der Bürgermeister weiß.“","es":"Vass: “Ahora sabemos lo que no es. Eso es más de lo que sabe el alcalde.”","fr":"Vass : « Maintenant on sait ce que ce n'est pas. C'est plus que ce que sait le maire. »","it":"Vass: «Adesso sappiamo cosa non è. È più di quanto sappia il sindaco.»","ja":"ヴァス：「これで、何でないかはわかった。町長が知っているより多くのことよ」","pt":"Vass: «Agora sabemos o que não é. É mais do que o presidente sabe.»","ru":"Васс: «Теперь мы знаем, чем это не является. Это больше, чем знает мэр.»","zh":"瓦丝：“现在我们知道它不是什么了。这比镇长知道的多。”"},"fbWrong":{"en":"Vass stops explaining things to you.","ar":"تتوقّف فاس عن شرح الأمور لكِ.","de":"Vass hört auf, dir Dinge zu erklären.","es":"Vass deja de explicarte las cosas.","fr":"Vass cesse de t'expliquer les choses.","it":"Vass smette di spiegarti le cose.","ja":"ヴァスはあなたに説明するのをやめます。","pt":"Vass deixa de te explicar as coisas.","ru":"Васс перестаёт тебе что-либо объяснять.","zh":"瓦丝不再给你解释任何事情了。"},"clue":[{"en":"You hear:","ar":"تسمعين:","de":"Du hörst:","es":"Oyes:","fr":"Tu entends :","it":"Senti:","ja":"聞こえる：","pt":"Ouves:","ru":"Ты слышишь:","zh":"你听到："},{"en":"Vass: \"Its last meal was mackerel and a bottle. The Lennox boat was taken on Wednesday night. Ewan's kayak was red, and there isn't a flake of red in here. This animal has been dead since before any of it happened.\"","ar":"فاس: \"آخر وجبة له كانت ماكريل وقارورة. أُخذ قارب لينوكس ليلة الأربعاء. كان كاياك إيوان أحمر، ولا توجد هنا ذرّة من الأحمر. هذا الحيوان ميت منذ ما قبل أن يحدث أيٌّ من ذلك.\"","de":"Vass: „Seine letzte Mahlzeit waren Makrelen und eine Flasche. Das Lennox-Boot wurde Mittwochnacht geholt. Ewans Kajak war rot, und hier drin ist keine Spur von Rot. Dieses Tier war schon tot, bevor irgendetwas davon passiert ist.“","es":"Vass: “Su última comida fue caballa y una botella. El barco de los Lennox se lo llevaron el miércoles por la noche. El kayak de Ewan era rojo, y aquí no hay ni rastro de rojo. Este animal lleva muerto desde antes de que pasara nada de esto.”","fr":"Vass : « Son dernier repas, c'était du maquereau et une bouteille. Le bateau des Lennox a été pris mercredi soir. Le kayak d'Ewan était rouge, et il n'y a pas un éclat de rouge là-dedans. Cet animal est mort depuis avant que tout ça arrive. »","it":"Vass: «Il suo ultimo pasto era sgombro e una bottiglia. La barca dei Lennox è stata presa mercoledì notte. Il kayak di Ewan era rosso, e qui dentro non c'è una scaglia di rosso. Questo animale è morto da prima che succedesse tutto questo.»","ja":"ヴァス：「最後の食事はサバとボトル。レノックスの船は水曜日の夜に奪われた。ユアンのカヤックは赤だったけど、ここには赤のかけらもない。この動物は、どれが起きるより前から死んでいたのよ」","pt":"Vass: «A última refeição dela foi cavala e uma garrafa. O barco dos Lennox foi levado na quarta-feira à noite. O caiaque do Ewan era vermelho, e aqui dentro não há uma escama de vermelho. Este animal está morto desde antes de tudo isto acontecer.»","ru":"Васс: «Его последней едой была скумбрия и бутылка. Лодку Ленноксов забрали в ночь со среды на четверг. Каяк Эвана был красный, а здесь нет ни чешуйки красного. Это животное было мертво ещё до того, как всё это случилось.»","zh":"瓦丝：“它的最后一顿是鲭鱼和一个瓶子。伦诺克斯家的船是星期三夜里被拖走的。尤安的皮划艇是红色的，这里面一点红色都没有。这只动物在这一切发生之前就已经死了。”"},{"en":"You: \"So what does its stomach prove?\" · Vass: \"You tell me. You're the police.\"","ar":"أنتِ: \"إذن ماذا تُثبت معدته؟\" · فاس: \"قولي أنتِ. أنتِ الشرطة.\"","de":"Du: „Und was beweist sein Magen?“ · Vass: „Sag du es mir. Du bist die Polizei.“","es":"Tú: “¿Y qué demuestra su estómago?” · Vass: “Dímelo tú. La policía eres tú.”","fr":"Toi : « Et qu'est-ce que son estomac prouve ? » · Vass : « À toi de me le dire. C'est toi la police. »","it":"Tu: «E cosa dimostra il suo stomaco?» · Vass: «Dimmelo tu. La polizia sei tu.»","ja":"あなた：「それで、胃の中身で何がわかるんですか？」· ヴァス：「あなたが言って。警察なんだから」","pt":"Tu: «E o que é que o estômago dela prova?» · Vass: «Diz-me tu. A polícia és tu.»","ru":"Ты: «И что доказывает его желудок?» · Васс: «Скажи мне ты. Полиция — это ты.»","zh":"你：“那它的胃能证明什么？”· 瓦丝：“你来告诉我。你是警察。”"}]},"1.11b":{"img":"16_q11b_torch.webp","hot":[77.0,38.0,12.0,16.0],"title":{"en":"THE TORCH","ar":"المصباح","de":"DIE TASCHENLAMPE","es":"LA LINTERNA","fr":"LA LAMPE TORCHE","it":"LA TORCIA","ja":"懐中電灯","pt":"A LANTERNA","ru":"ФОНАРЬ","zh":"手电"},"story":[{"en":"Eleven o'clock, flat calm, no moon. You take the police RIB out past the moorings with Vass in the bow holding a torch. Dougie Ferrier fishes alone and lives alone, so nobody missed him.","ar":"الحادية عشرة، سكون تام، لا قمر. تخرجين بقارب الشرطة المطاطي متجاوزةً المرسى، وفاس في المقدّمة تحمل مصباحًا يدويًا. دوغي فيرير يصطاد وحده ويعيش وحده، فلم يفتقده أحد.","de":"Elf Uhr, spiegelglatte See, kein Mond. Du fährst mit dem Polizeischlauchboot an den Liegeplätzen vorbei, Vass im Bug mit einer Taschenlampe. Dougie Ferrier fischt allein und lebt allein, also hat ihn niemand vermisst.","es":"Las once, mar en calma, sin luna. Sacas la lancha de la policía más allá de los amarres con Vass en la proa sujetando una linterna. Dougie Ferrier pesca solo y vive solo, así que nadie lo echó de menos.","fr":"Onze heures, mer d'huile, pas de lune. Tu sors le semi-rigide de la police au-delà des corps-morts, Vass à l'avant avec une lampe torche. Dougie Ferrier pêche seul et vit seul, alors personne n'a remarqué son absence.","it":"Le undici, mare piatto, niente luna. Porti il gommone della polizia oltre gli ormeggi con Vass a prua che regge una torcia. Dougie Ferrier pesca da solo e vive da solo, così nessuno ha sentito la sua mancanza.","ja":"夜十一時、べた凪で、月はありません。あなたは警察のゴムボートで係留区域の外へ出ます。ヴァスは船首で懐中電灯を掲げています。ダギー・フェリアーは一人で漁をし、一人で暮らしているので、誰も彼がいないことに気づきませんでした。","pt":"Onze horas, mar chão, sem lua. Levas o bote da polícia para lá das amarrações com Vass à proa a segurar uma lanterna. Dougie Ferrier pesca sozinho e vive sozinho, por isso ninguém deu pela falta dele.","ru":"Одиннадцать часов, полный штиль, луны нет. Ты выводишь полицейскую лодку за стоянку, Васс на носу с фонарём. Дуги Ферриер ловит один и живёт один, поэтому его никто не хватился.","zh":"晚上十一点，海面平静，没有月亮。你开着警用橡皮艇驶过系泊区，瓦丝在船头举着手电。杜吉·费里尔一个人打鱼，一个人过日子，所以没人发觉他不见了。"},{"en":"His boat, the Kestrel, is off the skerry, drifting, and the torch finds it before you do: the wheelhouse crushed inward like a paper cup, the hull holed below the waterline.","ar":"قاربه، الكيستريل، قرب الصخرة البحرية، ينجرف، والمصباح يجده قبلكِ: غرفة القيادة مسحوقة إلى الداخل ككوب ورقي، والهيكل مثقوب تحت خط الماء.","de":"Sein Boot, die Kestrel, liegt treibend vor der Schäre, und die Lampe findet es vor dir: das Steuerhaus nach innen zerdrückt wie ein Pappbecher, der Rumpf unter der Wasserlinie durchschlagen.","es":"Su barco, el Kestrel, está frente al islote, a la deriva, y la linterna lo encuentra antes que tú: el puente aplastado hacia dentro como un vaso de papel, el casco perforado por debajo de la línea de flotación.","fr":"Son bateau, le Kestrel, est au large du récif, à la dérive, et la lampe le trouve avant toi : la timonerie écrasée vers l'intérieur comme un gobelet en carton, la coque percée sous la ligne de flottaison.","it":"La sua barca, il Kestrel, è al largo dello scoglio, alla deriva, e la torcia la trova prima di te: la timoneria schiacciata verso l'interno come un bicchiere di carta, lo scafo bucato sotto la linea di galleggiamento.","ja":"彼の船、ケストレル号は岩礁の沖を漂っていて、あなたより先に懐中電灯がそれを見つけます。操舵室は紙コップのように内側へつぶれ、船体は喫水線の下に穴が開いています。","pt":"O barco dele, o Kestrel, está ao largo do ilhéu, à deriva, e a lanterna encontra-o antes de ti: a casa do leme esmagada para dentro como um copo de papel, o casco furado abaixo da linha de água.","ru":"Его лодка, «Кестрел», дрейфует у шхеры, и фонарь находит её раньше тебя: рубка вдавлена внутрь, как бумажный стаканчик, корпус пробит ниже ватерлинии.","zh":"他的船凯斯特雷尔号在礁石外漂着，手电比你先找到它：驾驶室像纸杯一样被压扁了，船身在吃水线以下破了个洞。"}],"k":{"en":"CHAPTER 2 · THE KESTREL · SATURDAY NIGHT","ar":"الفصل 2 · الكيستريل · ليلة السبت","de":"KAPITEL 2 · DIE KESTREL · SAMSTAGNACHT","es":"CAPÍTULO 2 · EL KESTREL · SÁBADO POR LA NOCHE","fr":"CHAPITRE 2 · LE KESTREL · SAMEDI SOIR","it":"CAPITOLO 2 · IL KESTREL · SABATO NOTTE","ja":"第2章 · ケストレル号 · 土曜日の夜","pt":"CAPÍTULO 2 · O KESTREL · SÁBADO À NOITE","ru":"ГЛАВА 2 · «КЕСТРЕЛ» · СУББОТА, НОЧЬ","zh":"第2章 · 凯斯特雷尔号 · 星期六夜里"},"kind":"question","next":"1.12b","prompt":{"en":"Vass: \"He went out on Thursday. Nobody ___ him since. Nobody reported it because there was nobody to report it.\"","ar":"فاس: \"خرج يوم الخميس. لا أحد ___ منذ ذلك الحين. لم يبلّغ أحد لأنه لم يكن هناك من يبلّغ.\"","de":"Vass: „Er ist am Donnerstag rausgefahren. Niemand ___ ihn seitdem gesehen. Niemand hat es gemeldet, weil es niemanden gab, der es hätte melden können.“","es":"Vass: “Salió el jueves. Nadie ___ desde entonces. Nadie lo denunció porque no había nadie que lo denunciara.”","fr":"Vass : « Il est sorti jeudi. Personne ___ depuis. Personne ne l'a signalé parce qu'il n'y avait personne pour le signaler. »","it":"Vass: «È uscito giovedì. Nessuno ___ da allora. Nessuno lo ha segnalato perché non c'era nessuno a segnalarlo.»","ja":"ヴァス：「彼は木曜日に出港した。それ以来、誰も彼を___。誰も通報しなかった。通報する人がいなかったから」","pt":"Vass: «Saiu na quinta-feira. Ninguém ___ desde então. Ninguém deu parte porque não havia ninguém para dar parte.»","ru":"Васс: «Он вышел в четверг. Никто ___ его с тех пор. Никто не сообщил, потому что сообщать было некому.»","zh":"瓦丝：“他星期四出的海。从那以后没人___他。没人报案，因为没有人可以报案。”"},"opts":[{"en":"has seen"},{"en":"has saw"},{"en":"have seen"}],"answer":0,"fb":{"en":"NOBODY is singular and takes HAS. SEEN is the participle; SAW is the Past Simple and never follows HAS.","ar":"NOBODY مفرد ويأخذ HAS. الكلمة SEEN هي اسم المفعول؛ أما SAW فهي Past Simple ولا تأتي أبدًا بعد HAS.","de":"NOBODY ist Singular und nimmt HAS. SEEN ist das Partizip; SAW ist das Past Simple und steht nie nach HAS.","es":"NOBODY es singular y lleva HAS. SEEN es el participio; SAW es el Past Simple y nunca va detrás de HAS.","fr":"NOBODY est singulier et prend HAS. SEEN est le participe ; SAW est le Past Simple et ne suit jamais HAS.","it":"NOBODY è singolare e prende HAS. SEEN è il participio; SAW è il Past Simple e non segue mai HAS.","ja":"NOBODY は単数なので HAS を取ります。SEEN が過去分詞で、SAW は Past Simple なので HAS の後には決して来ません。","pt":"NOBODY é singular e leva HAS. SEEN é o particípio; SAW é o Past Simple e nunca vem depois de HAS.","ru":"NOBODY — единственное число и требует HAS. SEEN — причастие; SAW — это Past Simple, и оно никогда не стоит после HAS.","zh":"NOBODY 是单数，用 HAS。SEEN 是过去分词；SAW 是 Past Simple，绝不放在 HAS 后面。"},"fbRight":{"en":"The RIB drifts alongside.","ar":"ينجرف القارب المطاطي حتى يحاذي القارب.","de":"Das Schlauchboot treibt längsseits.","es":"La lancha se acerca a la deriva hasta el costado.","fr":"Le semi-rigide dérive jusqu'à se ranger le long du bord.","it":"Il gommone si accosta alla deriva.","ja":"ゴムボートが船の横に流れ着きます。","pt":"O bote encosta, à deriva.","ru":"Лодку подносит течением к борту.","zh":"橡皮艇漂到船边。"},"fbWrong":{"en":"The torch shakes. That is not the grammar.","ar":"يرتجف المصباح. والسبب ليس القواعد.","de":"Die Lampe zittert. Das liegt nicht an der Grammatik.","es":"La linterna tiembla. Eso no es la gramática.","fr":"La lampe tremble. Ce n'est pas la grammaire.","it":"La torcia trema. Non è la grammatica.","ja":"懐中電灯が震えています。それは文法のせいではありません。","pt":"A lanterna treme. Não é da gramática.","ru":"Фонарь дрожит. Дело не в грамматике.","zh":"手电在发抖。那不是因为语法。"},"clue":[{"en":"You hear: Vass: \"He went out on Thursday. Nobody ___ him since. Nobody reported it because there was nobody to report it.\" · You: \"Keep the torch on the hole.\"","ar":"تسمعين: فاس: \"خرج يوم الخميس. لا أحد ___ منذ ذلك الحين. لم يبلّغ أحد لأنه لم يكن هناك من يبلّغ.\" · أنتِ: \"أبقي المصباح على الثقب.\"","de":"Du hörst: Vass: „Er ist am Donnerstag rausgefahren. Niemand ___ ihn seitdem gesehen. Niemand hat es gemeldet, weil es niemanden gab, der es hätte melden können.“ · Du: „Halt die Lampe auf das Loch.“","es":"Oyes: Vass: “Salió el jueves. Nadie ___ desde entonces. Nadie lo denunció porque no había nadie que lo denunciara.” · Tú: “Mantén la linterna en el agujero.”","fr":"Tu entends : Vass : « Il est sorti jeudi. Personne ___ depuis. Personne ne l'a signalé parce qu'il n'y avait personne pour le signaler. » · Toi : « Garde la lampe sur le trou. »","it":"Senti: Vass: «È uscito giovedì. Nessuno ___ da allora. Nessuno lo ha segnalato perché non c'era nessuno a segnalarlo.» · Tu: «Tieni la torcia sul buco.»","ja":"聞こえる：ヴァス：「彼は木曜日に出港した。それ以来、誰も彼を___。誰も通報しなかった。通報する人がいなかったから」· あなた：「懐中電灯を穴に向けたままで」","pt":"Ouves: Vass: «Saiu na quinta-feira. Ninguém ___ desde então. Ninguém deu parte porque não havia ninguém para dar parte.» · Tu: «Mantém a lanterna no buraco.»","ru":"Ты слышишь: Васс: «Он вышел в четверг. Никто ___ его с тех пор. Никто не сообщил, потому что сообщать было некому.» · Ты: «Держи фонарь на отверстии.»","zh":"你听到：瓦丝：“他星期四出的海。从那以后没人___他。没人报案，因为没有人可以报案。”· 你：“手电照着那个洞。”"}]},"1.12b":{"img":"17_q12b_hole.webp","hot":[81.0,50.0,12.0,16.0],"title":{"en":"THE HOLE","ar":"الثقب","de":"DAS LOCH","es":"EL AGUJERO","fr":"LE TROU","it":"IL BUCO","ja":"穴","pt":"O BURACO","ru":"ОТВЕРСТИЕ","zh":"洞"},"story":[{"en":"Vass leans over and pulls a black curved shard out of the planking beside the hole. She holds it against the ring in the jar. Same curve, same edge. Then she puts the torch through the hole and you both look.","ar":"تنحني فاس وتنتزع شظية سوداء منحنية من الألواح بجانب الثقب. تضعها بجانب الحلقة التي في البرطمان. الانحناء نفسه، والحافة نفسها. ثم تمدّ المصباح عبر الثقب فتنظران كلتاكما.","de":"Vass beugt sich hinüber und zieht eine schwarze gebogene Scherbe aus der Beplankung neben dem Loch. Sie hält sie an den Ring im Glas. Gleiche Krümmung, gleiche Kante. Dann hält sie die Lampe durch das Loch, und ihr seht beide hinein.","es":"Vass se asoma y saca una esquirla negra y curvada del tablón junto al agujero. La compara con el anillo del tarro. Misma curva, mismo filo. Luego mete la linterna por el agujero y miráis los dos.","fr":"Vass se penche et tire un éclat noir incurvé du bordage à côté du trou. Elle le compare à l'anneau du bocal. Même courbe, même arête. Puis elle passe la lampe par le trou et vous regardez tous les deux.","it":"Vass si sporge e tira fuori una scheggia nera ricurva dal fasciame accanto al buco. La accosta all'anello nel barattolo. Stessa curva, stesso taglio. Poi infila la torcia nel buco e guardate tutti e due.","ja":"ヴァスは身を乗り出し、穴のそばの板から黒く曲がったかけらを引き抜きます。瓶の中の輪に当ててみます。同じ曲線、同じ縁。それから懐中電灯を穴に差し入れ、二人でのぞき込みます。","pt":"Vass debruça-se e tira um estilhaço preto curvo do tabuado ao lado do buraco. Encosta-o ao anel do frasco. Mesma curva, mesmo gume. Depois mete a lanterna pelo buraco e olham os dois.","ru":"Васс перегибается и вытаскивает чёрный изогнутый осколок из обшивки рядом с отверстием. Она прикладывает его к кольцу в банке. Тот же изгиб, тот же край. Потом она суёт фонарь в отверстие, и вы обе смотрите.","zh":"瓦丝探身从洞边的船板里拔出一块黑色的弯曲碎片。她把它贴在罐子里的环上比。同样的弧度，同样的边缘。然后她把手电伸进洞里，你们俩一起往里看。"}],"k":{"en":"CHAPTER 2 · THE KESTREL · SATURDAY NIGHT","ar":"الفصل 2 · الكيستريل · ليلة السبت","de":"KAPITEL 2 · DIE KESTREL · SAMSTAGNACHT","es":"CAPÍTULO 2 · EL KESTREL · SÁBADO POR LA NOCHE","fr":"CHAPITRE 2 · LE KESTREL · SAMEDI SOIR","it":"CAPITOLO 2 · IL KESTREL · SABATO NOTTE","ja":"第2章 · ケストレル号 · 土曜日の夜","pt":"CAPÍTULO 2 · O KESTREL · SÁBADO À NOITE","ru":"ГЛАВА 2 · «КЕСТРЕЛ» · СУББОТА, НОЧЬ","zh":"第2章 · 凯斯特雷尔号 · 星期六夜里"},"kind":"question","next":"1.13","prompt":{"en":"Vass, as you nimal.\"","ar":"تضع فاس الشظية في جيبها. \"منقاران، وحيوان واحد.\"","de":"Vass steckt die Scherbe ein. „Zwei Schnäbel, ein Tier.“","es":"Vass se guarda la esquirla en el bolsillo. “Dos picos, un animal.”","fr":"Vass met l'éclat dans sa poche. « Deux becs, un seul animal. »","it":"Vass si mette la scheggia in tasca. «Due becchi, un animale.»","ja":"ヴァスはかけらをポケットにしまいます。「くちばしが二つ、動物は一匹」","pt":"Vass mete o estilhaço no bolso. «Dois bicos, um animal.»","ru":"Васс кладёт осколок в карман. «Два клюва, одно животное.»","zh":"瓦丝把碎片放进口袋。“两只喙，一只动物。”"},"fbWrong":{"en":"Vass: \"You looked straight at it.\"","ar":"فاس: \"كنتِ تنظرين إليه مباشرة.\"","de":"Vass: „Du hattest es direkt vor Augen.“","es":"Vass: “Lo tenías delante de los ojos.”","fr":"Vass : « Tu l'avais sous les yeux. »","it":"Vass: «Ce l'avevi davanti agli occhi.»","ja":"ヴァス：「あなたはまっすぐそれを見ていたのに」","pt":"Vass: «Tinhas isso mesmo à frente dos olhos.»","ru":"Васс: «Ты смотрела прямо на это.»","zh":"瓦丝：“你明明直直地看着它。”"},"clue":[{"en":"You hear: Vass: \"A propeller cuts. A rock tears. Look at the edges. This is round, forty centimetres across, and every plank is bent inwards. This was pushed. Something outside the boat pushed the hull in.\"","ar":"تسمعين: فاس: \"المروحة تقطع. الصخرة تمزّق. انظري إلى الحواف. هذا مستدير، قطره أربعون سنتيمترًا، وكل لوح منثنٍ إلى الداخل. هذا دُفع. شيء خارج القارب دفع الهيكل إلى الداخل.\"","de":"Du hörst: Vass: „Eine Schraube schneidet. Ein Fels reißt. Sieh dir die Kanten an. Das hier ist rund, vierzig Zentimeter breit, und jede Planke ist nach innen gebogen. Das wurde gedrückt. Etwas außerhalb des Boots hat den Rumpf eingedrückt.“","es":"Oyes: Vass: “Una hélice corta. Una roca desgarra. Mira los bordes. Esto es redondo, cuarenta centímetros de ancho, y cada tabla está doblada hacia dentro. Esto fue empujado. Algo de fuera del barco empujó el casco hacia dentro.”","fr":"Tu entends : Vass : « Une hélice coupe. Un rocher déchire. Regarde les bords. C'est rond, quarante centimètres de large, et chaque bordage est plié vers l'intérieur. Ça a été poussé. Quelque chose à l'extérieur du bateau a enfoncé la coque. »","it":"Senti: Vass: «Un'elica taglia. Uno scoglio strappa. Guarda i bordi. Questo è rotondo, quaranta centimetri di diametro, e ogni tavola è piegata verso l'interno. Questo è stato spinto. Qualcosa fuori dalla barca ha spinto dentro lo scafo.»","ja":"聞こえる：ヴァス：「プロペラは切る。岩は裂く。縁を見て。これは丸くて、直径四十センチ、板は全部内側に曲がっている。押されたのよ。船の外にいた何かが船体を押し込んだ」","pt":"Ouves: Vass: «Uma hélice corta. Uma rocha rasga. Olha para os bordos. Isto é redondo, quarenta centímetros de largura, e cada tábua está dobrada para dentro. Isto foi empurrado. Alguma coisa fora do barco empurrou o casco para dentro.»","ru":"Ты слышишь: Васс: «Винт режет. Скала рвёт. Посмотри на края. Это круглое, сорок сантиметров в поперечнике, и каждая доска загнута внутрь. Это вдавили. Что-то снаружи лодки вдавило корпус внутрь.»","zh":"你听到：瓦丝：“螺旋桨是切。岩石是撕。看看边缘。这是圆的，直径四十厘米，每块船板都向内弯。这是被推的。船外面有东西把船壳推了进去。”"},{"en":"Something moves under the crushed wheelhouse. You do not wait to see what.","ar":"شيء يتحرّك تحت غرفة القيادة المسحوقة. لا تنتظرين لتري ما هو.","de":"Etwas bewegt sich unter dem zerdrückten Steuerhaus. Du wartest nicht ab, was.","es":"Algo se mueve bajo el puente aplastado. No esperas a ver qué.","fr":"Quelque chose bouge sous la timonerie écrasée. Tu n'attends pas de voir quoi.","it":"Qualcosa si muove sotto la timoneria schiacciata. Non aspetti di vedere cosa.","ja":"つぶれた操舵室の下で何かが動きます。あなたは何なのか確かめるまで待ちません。","pt":"Alguma coisa se mexe debaixo da casa do leme esmagada. Não esperas para ver o quê.","ru":"Что-то движется под раздавленной рубкой. Ты не ждёшь, чтобы увидеть что.","zh":"被压扁的驾驶室下面有东西在动。你没有等着看是什么。"}]},"1.13":{"img":"18_q13_raceday.webp","hot":[69.0,48.0,12.0,16.0],"title":{"en":"RACE DAY","ar":"يوم السباق","de":"RENNTAG","es":"DÍA DE REGATA","fr":"JOUR DE COURSE","it":"GIORNO DI REGATA","ja":"レース当日","pt":"DIA DE REGATA","ru":"ДЕНЬ ГОНКИ","zh":"比赛日"},"k":{"en":"CHAPTER 3 · RACE DAY · SUNDAY","ar":"الفص ambini e il giudice fanno sette persone. Due è il numero delle barche, non dei bambini.","ja":"子ども六人と審判で七人です。二は船の数で、子どもの数ではありません。","pt":"seis crianças e o árbitro fazem sete pessoas. Dois é o número de barcos, não de crianças.","ru":"шестеро детей и судья — семеро человек. Два — это число лодок, а не детей.","zh":"六个孩子加上裁判，一共七个人。二是船的数量，不是孩子的数量。"},"fbRight":{"en":"Every child comes out of the water. Kirsty comes out in Tulloch's arms, in shock, without her boat. Sandy Weir comes out last, and his dinghy does not come out at all.","ar":"كل الأطفال يخرجون من الماء. تخرج كيرستي بين ذراعي تولوخ، مصدومة، بلا قاربها. يخرج ساندي وير آخرًا، أما قاربه فلا يخرج أبدًا.","de":"Jedes Kind kommt aus dem Wasser. Kirsty kommt in Tullochs Armen heraus, unter Schock, ohne ihr Boot. Sandy Weir kommt als Letzter heraus, und seine Jolle kommt überhaupt nicht heraus.","es":"Todos los niños salen del agua. Kirsty sale en brazos de Tulloch, en estado de shock, sin su barco. Sandy Weir sale el último, y su bote no sale en absoluto.","fr":"Tous les enfants sortent de l'eau. Kirsty sort dans les bras de Tulloch, en état de choc, sans son bateau. Sandy Weir sort le dernier, et son dériveur, lui, ne ressort pas.","it":"Tutti i bambini escono dall'acqua. Kirsty esce tra le braccia di Tulloch, sotto shock, senza la sua barca. Sandy Weir esce per ultimo, e la sua deriva non riemerge affatto.","ja":"子どもたちは全員水から上がります。カースティはタロックの腕に抱かれて、ショック状態で、ボートをなくして上がってきます。サンディ・ウィアーは最後に上がり、彼のディンギーは二度と浮かんできません。","pt":"Todas as crianças saem da água. A Kirsty sai nos braços do Tulloch, em choque, sem o barco. O Sandy Weir sai em último, e o barco dele não volta a aparecer.","ru":"Все дети выбираются из воды. Кирсти выносит на руках Таллох, она в шоке и без своей лодки. Сэнди Уир выбирается последним, а его швертбот так и не всплывает.","zh":"每个孩子都从水里出来了。柯丝蒂是被塔洛克抱出来的，吓坏了，她的船没了。桑迪·威尔最后一个出来，而他的小帆船再也没有浮上来。"},"fbWrong":{"en":"You went in. You cannot swim well. Tulloch pulled you out too.","ar":"نزلتِ إلى الماء. لا تجيدين "}],"answer":0,"fb":{"en":"KEEP is irregular: HAVE KEPT. KEEPED does not exist; the Present Simple cannot carry FOR FOUR DAYS up to now.","ar":"KEEP فعل شاذ: HAVE KEPT. لا وجود لـ KEEPED؛ وPresent Simple لا يمكنه أن يحمل FOR FOUR DAYS حتى الآن.","de":"KEEP ist unregelmäßig: HAVE KEPT. KEEPED gibt es nicht; das Present Simple kann FOR FOUR DAYS bis jetzt nicht tragen.","es":"KEEP es irregular: HAVE KEPT. KEEPED no existe; el Present Simple no puede llevar FOR FOUR DAYS hasta ahora.","fr":"KEEP est irrégulier : HAVE KEPT. KEEPED n'existe pas ; le Present Simple ne peut pas porter FOR FOUR DAYS jusqu'à maintenant.","it":"KEEP è irregolare: HAVE KEPT. KEEPED non esiste; il Present Simple non può reggere FOR FOUR DAYS fino a ora.","ja":"KEEP は不規則動詞です：HAVE KEPT。KEEPED という語はなく、Present Simple では今までの FOR FOUR DAYS を表せません。","pt":"KEEP é irregular: HAVE KEPT. KEEPED não existe; o Present Simple não pode levar FOR FOUR DAYS até agora.","ru":"KEEP — неправильный глагол: HAVE KEPT. KEEPED не существует; Present Simple не может нести FOR FOUR DAYS до настоящего момента.","zh":"KEEP 是不规则动词：HAVE KEPT。KEEPED 这个词不存在；Present Simple 不能表达到现在为止的 FOR FOUR DAYS。"},"fbRight":{"en":"It is on your desk when you get back: a chart of the Narrows with one pencil cross between two islands, at the Cauldron, and no words on it at all. Under it, one line: Dawn. My boat. Bring the scientist and her box if you must. Don't bring the Provost.","ar":"إنها على مكتبكِ حين تعودين: خريطة بحرية للمضائق عليها علامة صليب واحدة بالرصاص بين جزيرتين، عند المِرجل، ولا كلمة عليها. تحتها سطر واحد: الفجر. قاربي. أحضري العالِمة وصندوقها إن كان لا بدّ. لا تحضري العمدة.","de":"Es liegt auf deinem Schreibtisch, als du zurückkommst: eine Seekarte der Engen mit einem einzigen Bleistiftkreuz zwischen zwei Inseln, am Kessel, und kein einziges Wort darauf. Darunter eine Zeile: Morgengrauen. Mein Boot. Bringen Sie die Wissenschaftlerin und ihren Kasten mit, wenn es sein muss. Bringen Sie nicht den Bürgermeister mit.","es":"Está en tu mesa cuando vuelves: una carta náutica de los Estrechos con una sola cruz a lápiz entre dos islas, en el Caldero, y ni una palabra. Debajo, una línea: Al amanecer. Mi barco. Traiga a la científica y su caja si no hay más remedio. No traiga al alcalde.","fr":"C'est sur ton bureau quand tu rentres : une carte des Étroits avec une seule croix au crayon entre deux îles, au Chaudron, et pas un mot dessus. Dessous, une ligne : L'aube. Mon bateau. Amenez la scientifique et sa boîte s'il le faut. N'amenez pas le maire.","it":"È sulla tua scrivania quando torni: una carta nautica degli Stretti con una sola croce a matita tra due isole, al Calderone, e nessuna parola. Sotto, una riga: Alba. La mia barca. Porti la scienziata e la sua cassetta, se proprio deve. Non porti il sindaco.","ja":"戻ると机の上にあります。狭水道の海図で、二つの島の間、大釜のところに鉛筆の十字が一つ、言葉は何もありません。その下に一行だけ：夜明け。俺の船。どうしてもと言うなら、科学者と彼女の箱を連れてこい。町長は連れてくるな。","pt":"Está na tua secretária quando voltas: uma carta dos Estreitos com uma única cruz a lápis entre duas ilhas, no Caldeirão, e nem uma palavra. Por baixo, uma linha: Madrugada. O meu barco. Traga a cientista e a caixa dela, se tiver de ser. Não traga o presidente.","ru":"Когда ты возвращаешься, это лежит у тебя на столе: карта Теснин с одним карандашным крестиком между двумя островами, у Котла, и ни одного слова. Под ней одна строчка: Рассвет. Моя лодка. Возьмите учёную и её ящик, если без этого никак. Мэра не берите.","zh":"你回去时它就放在你桌上：一张窄峡的海图，两座岛之间、在大锅的位置，画着一个铅笔十字，上面一个字也没有。下面只有一行：黎明。我的船。非带不可的话，带上那位科学家和她的箱子。别带镇长。"},"fbWrong":{"en":"Menzies signs anyway. He is not signing for you.","ar":"يوقّع منزيس رغم ذلك. لكنه لا يوقّع من أجلكِ.","de":"Menzies unterschreibt trotzdem. Er unterschreibt nicht für dich.","es":"Menzies firma de todos modos. No firma por ti.","fr":"Menzies signe quand même. Ce n'est pas pour toi qu'il signe.","it":"Menzies firma lo stesso. Non firma per te.","ja":"メンジーズはそれでも署名します。あなたのために署名するのではありません。","pt":"Menzies assina na mesma. Não é por ti que assina.","ru":"Мензис всё равно подписывает. Он подписывает не ради тебя.","zh":"孟席斯还是签了。他不是为你签的。"},"clue":[{"en":"You hear: You: \"You ___ that pier open for four days. Sign it.\" · Menzies: \"I've lived here all my life, sergeant.\" · You: \"Then you've known longer than me.\" Menzies signs.","ar":"تسمعين: أنتِ: \"أنت ___ ذلك الرصيف مفتوحًا أربعة أيام. وقّع.\" · منزيس: \"عشت هنا طوال حياتي أيتها الرقيبة.\" · أنتِ: \"إذن أنت تعرف منذ مدة أطول مني.\" يوقّع منزيس.","de":"Du hörst: Du: „Sie ___ diese Pier vier Tage lang offen gehalten. Unterschreiben Sie.“ · Menzies: „Ich habe mein ganzes Leben hier gelebt, Sergeant.“ · Du: „Dann wissen Sie es länger als ich.“ Menzies unterschreibt.","es":"Oyes: Tú: “___ ese muelle abierto cuatro días. Fírmelo.” · Menzies: “He vivido aquí toda mi vida, sargento.” · Tú: “Entonces lo ha sabido más tiempo que yo.” Menzies firma.","fr":"Tu entends : Toi : « Vous ___ cette jetée ouverte pendant quatre jours. Signez. » · Menzies : « J'ai vécu ici toute ma vie, sergent. » · Toi : « Alors vous le savez depuis plus longtemps que moi. » Menzies signe.","it":"Senti: Tu: «Lei ___ quel molo aperto per quattro giorni. Firmi.» · Menzies: «Ho vissuto qui tutta la vita, sergente.» · Tu: «Allora lo sa da più tempo di me.» Menzies firma.","ja":"聞こえる：あなた：「あなたはあの桟橋を四日間開けたままに___。署名してください」· メンジーズ：「私はずっとここに住んでいるんだ、巡査部長」· あなた：「なら、私より長く知っていたんですね」メンジーズは署名します。","pt":"Ouves: Tu: «O senhor ___ aquele cais aberto durante quatro dias. Assine.» · Menzies: «Vivi aqui toda a minha vida, sargento.» · Tu: «Então sabe há mais tempo do que eu.» Menzies assina.","ru":"Ты слышишь: Ты: «Вы ___ этот причал открытым четыре дня. Подпишите.» · Мензис: «Я прожил здесь всю жизнь, сержант.» · Ты: «Значит, вы знаете дольше моего.» Мензис подписывает.","zh":"你听到：你：“你___那个码头开放了四天。签字。”· 孟席斯：“我在这里住了一辈子，警长。”· 你：“那你知道得比我久。”孟席斯签了字。"}],"relic":true,"final":true},"end1_complete":{"kind":"ending","img":"01_cover.webp","hot":[80.0,55.0,14.0,18.0],"k":{"en":"INVERBRAE · COMPLETE","ar":"إنفربري · مكتمل","de":"I سة. حوت منك مرة، خطأً. لكنني لم أضع واحدًا على هذا قط.\"","de":"Du hörst: Tulloch: „Mein Boot, meine Regeln. Auf meinem Boot bin ich Skipper und Sie sind Ballast. Ich ___ diese Tonnen schon auf eine Menge Dinge gesetzt. Riesenhaie. Einen Zwergwal, einmal, aus Versehen. Auf so etwas habe ich noch nie eine gesetzt.“","es":"Oyes: Tulloch: “Mi barco, mis normas. En mi barco yo soy el patrón y usted es lastre. ___ estos bidones en muchas cosas. Tiburones peregrinos. Un rorcual, una vez, por error. Nunca le he puesto uno a esto.”","fr":"Tu entends : Tulloch : « Mon bateau, mes règles. Sur mon bateau je suis le patron et vous êtes du lest. J'___ ces barils sur des tas de choses. Des requins-pèlerins. Un petit rorqual, une fois, par erreur. Je n'en ai jamais mis un sur ça. »","it":"Senti: Tulloch: «La mia barca, le mie regole. Sulla mia barca io sono lo skipper e lei è zavorra. ___ questi bidoni su un sacco di cose. Squali elefante. Una balenottera, una volta, per sbaglio. Su una cosa così non ne ho mai messo uno.»","ja":"聞こえる：タロック：「俺の船、俺のルールだ。俺の船では俺が船長で、あんたはバラストだ。この樽はいろんなものに___。ウバザメ。一度、うっかりミンククジラ。だが、こんなものに付けたことは一度もない」","pt":"Ouves: Tulloch: «O meu barco, as minhas regras. No meu barco eu sou o mestre e a senhora é lastro. ___ estes bidões em muita coisa. Tubarões-frade. Uma baleia-anã, uma vez, por engano. Numa coisa destas nunca pus nenhum.»","ru":"Ты слышишь: Таллох: «Моя лодка, мои правила. На моей лодке я шкипер, а вы — балласт. Я ___ эти бочки на много чего. Гигантские акулы. Однажды малого полосатика, по ошибке. На такое я ещё ни разу не ставил.»","zh":"你听到：塔洛克：“我的船，我的规矩。在我的船上我是船长，你是压舱物。这些浮桶我___在很多东西上。姥鲨。有一次，误打误撞，一头小须鲸。但我从没往这种东西上放过。”"},{"en":"Vass: \"What bit through that barrel?\" · Tulloch: \"The thing we’re going after. One bite. That was all it needed.\"","ar":"فاس: \"ما الذي قضم ذلك البرميل؟\" · تولوخ: \"الشيء الذي نطارده. عضّة واحدة. لم يحتج إلى أكثر.\"","de":"Vass: „Was hat sich durch diese Tonne gebissen?“ · Tulloch: „Das Ding, hinter dem wir her sind. Ein Biss. Mehr hat es nicht gebraucht.“","es":"Vass: “¿Qué atravesó ese bidón de un mordisco?” · Tulloch: “Lo que vamos a cazar. Un mordisco. No necesitó más.”","fr":"Vass : « Qu'est-ce qui a tranché ce baril ? » · Tulloch : « La chose qu'on va chasser. Une morsure. Il ne lui en a pas fallu plus. »","it":"Vass: «Cosa ha morso quel bidone da parte a parte?» · Tulloch: «La cosa a cui stiamo andando dietro. Un morso. Non gliene è servito altro.»","ja":"ヴァス：「何があの樽を噛み抜いたの？」· タロック：「俺たちが追うやつだ。一噛み。それで十分だった」","pt":"Vass: «O que é que mordeu aquele bidão ao meio?» · Tulloch: «A coisa atrás da qual vamos. Uma dentada. Não precisou de mais.»","ru":"Васс: «Что прокусило эту бочку насквозь?» · Таллох: «То, за чем мы идём. Один укус. Больше ему не понадобилось.»","zh":"瓦丝：“是什么咬穿了那个浮桶？”· 塔洛克：“我们要去追的那东西。一口。它只需要一口。”"}]},"2.2":{"img":"22_q2_forecast2.webp","hot":[72.0,10.0,10.0,12.0],"title":{"en":"THE FORECAST","ar":"النشرة الجوية","de":"DER WETTERBERICHT","es":"EL PARTE METEOROLÓGICO","fr":"LE BULLETIN MÉTÉO","it":"IL BOLLETTINO","ja":"天気予報","pt":"O BOLETIM","ru":"ПРОГНОЗ","zh":"天气预报"},"story":[{"en":"The Kittiwake clears the harbour wall at ten past five with the lights of the village behind her and nothing in front but grey water.","ar":"يتجاوز كيتيويك سور الميناء في الخامسة وعشر دقائق، وأضواء القرية خلفه، وأمامه لا شيء سوى ماء رمادي.","de":"Die Kittiwake passiert die Hafenmauer um zehn nach fünf, die Lichter des Dorfes hinter sich und vor sich nichts als graues Wasser.","es":"El Kittiwake pasa el muro del puerto a las cinco y diez con las luces del pueblo detrás y nada delante salvo agua gris.","fr":"Le Kittiwake franchit la digue du port à cinq heures dix, les lumières du village derrière lui et devant rien que de l'eau grise.","it":"Il Kittiwake supera il muro del porto alle cinque e dieci con le luci del paese alle spalle e davanti nient'altro che acqua grigia.","ja":"五時十分、キティウェイク号は港の防波堤を越えます。後ろには村の灯り、前には灰色の水だけです。","pt":"O Kittiwake passa o molhe às cinco e dez com as luzes da aldei ":"تولوخ: \"LATER تعني أكثر من اثنتي عشرة ساعة. إذن ما أبكر وقت يمكن أن تصلنا فيه العاصفة أيتها الرقيبة؟\"","de":"Tulloch: „LATER ist mehr als zwölf Stunden. Wann kann dieser Sturm uns frühestens erreichen, Sergeant?“","es":"Tulloch: “LATER es más de doce horas. ¿Lo más pronto que ese temporal puede alcanzarnos, entonces, sargento?”","fr":"Tulloch : « LATER, c'est plus de douze heures. Au plus tôt, quand ce coup de vent peut-il nous atteindre, sergent ? »","it":"Tulloch: «LATER è più di dodici ore. Al più presto, quando può arrivarci addosso quella burrasca, sergente?»","ja":"タロック：「LATER は十二時間以上だ。じゃあ、嵐が俺たちのところに来るのは最も早くていつだ、巡査部長？」","pt":"Tulloch: «LATER é mais de doze horas. O mais cedo que aquele temporal nos pode apanhar, então, sargento?»","ru":"Таллох: «LATER — это больше двенадцати часов. Когда самое раннее этот шторм может до нас дойти, сержант?»","zh":"塔洛克：“LATER 是十二个小时以上。那风暴最早什么时候能到我们这儿，警长？”"},"opts":[{"en":"Before eleven this morning"},{"en":"Not until tomorrow morning"},{"en":"After 17:05 this evening"}],"answer":2,"fb":{"en":"the forecast was issued at 05:05; twelve hours later is 17:05. LATER is any time after that, so tonight is possible and tomorrow is not the earliest.","ar":"صدرت النشرة عند 05:05؛ واثنتا عشرة ساعة بعدها هي 17:05. LATER تعني أي وقت بعد ذلك، فالليلة ممكنة، والغد ليس أبكر وقت.","de":"der Bericht wurde um 05:05 herausgegeben; zwölf Stunden später ist 17:05. LATER ist jede Zeit danach, also ist heute Nacht möglich und morgen ist nicht das Früheste.","es":"el parte se emitió a las 05:05; doce horas después son las 17:05. LATER es cualquier momento posterior a esa hora, así que esta noche es posible y mañana no es lo más pronto.","fr":"le bulletin a été émis à 05h05 ; douze heures plus tard, cela fait 17h05. LATER, c'est n'importe quand après, donc ce soir est possible et demain n'est pas le plus tôt.","it":"il bollettino è stato emesso alle 05:05; dodici ore dopo sono le 17:05. LATER è qualsiasi momento dopo, quindi stanotte è possibile, e
