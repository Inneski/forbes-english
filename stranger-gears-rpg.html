er around the sound of your engine. You mark the cable and leave the drain open for later.":"隐藏的道路尽头是一条与你手臂同宽的活缆绳。在墙的另一边，数十只演示狗聚集在你的引擎声周围。您标记电缆并将排水管打开以供稍后使用。","Hamster says impossible roads are the only roads left.":"仓鼠说不可能的路是唯一剩下的路。","Which sentence gives the safe sequence?":"哪个句子给出了安全序列？","The distress call was never from the winter storm. It came from tonight, through the Gate, in your colleague's voice. You finally transmit the coordinates to Clarkson and Hamster. Both answer.":"求救信号从来都不是来自冬季风暴。这是今晚从大门传来的，是你同事的声音。您最终将坐标传输给克拉克森和仓鼠。两人都回答。","Vecna plays all three confessions at once":"维克纳同时演奏所有三个忏悔曲","The clocks chime twice. Clarkson hears the mechanic. Hamster hears the friend in the drain. May hears the unanswered distress call. Each voice tells its driver that the other two already crossed the Gate without him.":"时钟敲响两声。克拉克森听到机械师的声音。仓鼠听到朋友在下水道里的声音。梅听到无人应答的求救信号。每个声音都告诉司机，另外两个人已经在没有他的情况下穿过了大门。","Five minutes.":"五分钟。","The Mind Flayer is lowering a hand over the only tear back to Halloway.":"夺心者将一只手放在唯一的眼泪上，回到哈洛威。","Brute force. The Gate opens wide, but the Bruiser may not restart.":"蛮力。大门敞开，但暴徒可能不会重新启动。","Stranger Gears — The Last Broadcast":"《怪奇装备》——最后一次广播","You deploy the __ITEM__. The pack veers after the false engine note, buying all three cars a clear lane.":"您部署 __ITEM__。车队在错误的引擎提示后转向，为所有三辆车购买了一条畅通的车道。","You have nothing that can mask or divert the engines. Demodogs strike both rear cars, and May shouts that Clarkson has drawn them onto everyone.":"你没有任何东西可以掩盖或转移引擎。恶魔狗袭击了后面的两辆车，梅大声喊道克拉克森把它们吸引到了所有人身上。","The __ITEM__ finds purchase where the road has become flesh. The convoy climbs out before the vines close.":"__ITEM__ 在道路变得有血有肉的地方找到了购买点。车队在藤蔓关闭之前爬了出去。","The wheels sink to their hubs. They leave the cars to push, breathing spores while tendrils close around the axles.":"车轮沉入轮毂。它们让汽车推动，呼吸孢子，同时卷须靠近车轴。","Recovered equipment carries the convoy through the final pursuit: __ITEMS__.":"回收的装备载着车队完成最后的追击：__ITEMS__。","Driver story __COUNT__ of 3 complete":"已完成 __COUNT__ 个驾驶员故事"},"ru":{"Forbes English":"Форбс английский","An interactive Stranger Things story":"Интерактивная история «Очень странных дел»","Stranger Gears":"Незнакомые шестеренки","The Last Broadcast · Three drivers. Three confessions. One signal from the Upside Down that knows what each of them is trying not to say.":"Последняя трансляция · Три водителя. Три признания. Один сигнал с Изнаночной стороны, который знает то, что каждый из них старается не сказать.","Begin transmission":"Начать передачу","21:40 · Halloway · 97.3 FM":"21:40 · Прихожая · 97.3 FM","The radio says your name before you switch it on":"Радио произносит ваше имя, прежде чем вы его включите.","Every receiver in town snaps to the same dead frequency. A grandfather clock chimes four times. Then your own voice begins describing a memory you have never told Clarkson, Hamster or May.":"Все приемники в городе переключаются на одну и ту же мертвую частоту. Старинные часы бьют четыре раза. Затем ваш собственный голос начинает описывать воспоминания, о которых вы никогда не рассказывали Кларксону, Хомяку или Мэй.","Outside, red lightning opens a wound above the grain elevator. The broadcast ends with a promise:":"Снаружи красная молния открывает рану над элеватором. Эфир заканчивается обещанием:","at 02:17, one of you will choose who gets home.":"в 02:17 один из вас выберет, кто вернется домой.","Field notes · what is hunting you":"Полевые заметки · что за тобой охотится","The signal has teeth":"У сигнала есть зубцы","Vecna":"Векна","Inside the broadcast":"Внутри трансляции","He uses guilt as a doorway. Four chimes mean he has found yours.":"Он использует чувство вины как дверной проем. Четыре звонка означают, что он нашел ваш.","Demodogs":"Демособаки","On every road":"На каждой дороге","Blind, fast and drawn to engines, voices and electrical current.":"Слеп, быстр и привязан к двигателям, голосам и электрическому току.","Mind Flayer":"Пожиратель разума","Above the Gate":"Над воротами","A storm-shaped shadow descending one tendril at a time.":"Тень в форме шторма, спускающаяся по одному усику за раз.","How the campaign works":"Как работает кампания","Every correct answer becomes survival equipment":"Каждый правильный ответ становится средством выживания","Play all three drivers. Their stories are different and their equipment carries into the final run. Wrong answers cost nerve and trust.":"Сыграйте со всеми тремя гонщиками. Их истории разные, и их оборудование доходит до финальной стадии. Неправильные ответы стоят нервов и доверия.","At the climax, sound, power and traction each demand an item. The Needle decides whether all three drivers help one another through the Gate.":"В кульминации звук, мощь и тяга требуют каждого предмета. Игла решает, помогут ли все трое водящим друг другу пройти через Врата.","Choose the next transmission":"Выбрать следующую передачу","Whose voice answers the radio?":"Чей голос отвечает по радио?","Clarkson · the Bruiser":"Кларксон · Громила","A V8, an empty bypass and the accident he insists was not his fault.":"V8, пустой байпас и авария, как он утверждает, произошла не по его вине.","Suppression bottles":"Душащие баллоны","Hamster · the three-wheeler":"Хомяк · трехколесный транспорт","A storm drain, a failing headlamp and the friend he left behind once before.":"Ливневая канализация, вышедшая из строя фара и друг, которого он однажды оставил.","May · the diesel estate":"Май · дизельный универсал","A radio mast, a boot of numbered boxes and one message he never transmitted.":"Радиомачта, кипа пронумерованных ящиков и одно сообщение, которое он так и не передал.","Reset all stories":"Сбросить все истории","Clarkson · 22:03 · Foundry Bypass":"Кларксон · 22:03 · Обход литейного цеха","Your passenger is a cassette recorder":"Ваш пассажир — кассетный магнитофон","The tape plays the sound of rain, tyres and a young mechanic saying he trusts you. You remember sending him ahead in a car you knew had a bad steering rack.":"На пленке звучит дождь, шины и молодой механик, говорящий, что доверяет тебе. Вы помните, как отправили его вперед на машине, у которой, как вы знали, была неисправная рулевая рейка.","The clock chimes once. In the mirror, six Demodogs unfold from the verge and begin running. They are gaining whenever you lift off the throttle.":"Часы прозвенят один раз. В зеркале шесть Демодогов разворачиваются с края и начинают бежать. Они набирают обороты всякий раз, когда вы отпускаете газ.","Sound-dampening blanket":"Одеяло шумопоглощающее","Clarkson · pursuit · language under pressure":"Кларксон · преследование · язык под давлением","Which sentence makes the earlier danger clear?":"Какое предложение ясно раскрывает предыдущую опасность?","I knew the steering rack had already failed once":"Я знал, что рулевая рейка уже однажды вышла из строя","I knew the steering rack has fail tomorrow":"Я знал, что завтра рулевая рейка выйдет из строя","I had knew the steering rack already failing":"Я знал, что рулевая рейка уже вышла из строя","I knowed the steering rack had fails":"Я знал, что рулевая рейка вышла из строя.","Past perfect places the earlier failure before what you knew. The correct answer unlocks a blanket that masks the Bruiser's engine note.":"Прошедшее совершенное время ставит предыдущую неудачу перед тем, что вы знали. Правильный ответ откроет одеяло, скрывающее звук двигателя Громилы.","Clarkson · the first disagreement":"Кларксон · первое разногласие","Hamster asks whether the tape is true":"Хомяк спрашивает, правдива ли запись","Honest CB recording":"Честная запись CB","Tell both of them the whole truth":"Скажи им обоим всю правду","The silence afterward is terrible, but they know what Vecna is using.":"После этого тишина ужасна, но они знают, что использует Векна.","Needle +2 · nerve −1":"Игла +2 · нерв −1","Call the recording a fake":"Назовите запись фейком.","May says the rain on the tape matches the date. Hamster stops answering.":"Мэй говорит, что дождь на пленке соответствует дате. Хомяк перестает отвечать.","Needle −2":"Игла −2","Clarkson · 22:19 · mirror check":"Кларксон · 22:19 · проверка зеркала","One of them is on the roof":"Один из них на крыше.","Claws punch through the headlining. Another Demodog runs level with your window. Ahead, the bypass ends at a barricade of abandoned cars. Vecna's voice says the mechanic's name through every speaker.":"Когти пробивают потолок. Другой демодог работает на уровне вашего окна. Впереди объезд заканчивается баррикадой из брошенных машин. Голос Векны произносит имя механика через каждый динамик.","You have eight seconds before the pack boxes you in.":"У вас есть восемь секунд, прежде чем стая заключит вас.","Nitrous purge switch":"Переключатель продувки азотом","Clarkson · eight seconds":"Кларксон · восемь секунд","Which instruction is correct?":"Какая инструкция правильная?","Keep the revs up before you release the clutch":"Поддерживайте высокие обороты, прежде чем отпускать сцепление.","Kept the revs before you releasing it":"Сохранял обороты, прежде чем отпустить его.","Keep the revs up before you released it tomorrow":"Держи обороты, прежде чем завтра выпустить его.","Keeping revs before release clutch":"Сохранение оборотов перед отпусканием сцепления","The imperative keeps the sequence immediate. Correct: you wire a single-use nitrous purge that can break the pack's formation.":"Императив обеспечивает немедленную последовательность. Правильно: вы подключаете одноразовую продувку азотом, которая может нарушить структуру пакета.","Clarkson · escape the bypass":"Кларксон · выйти из обхода","The barricade fills the windscreen":"Баррикада заполняет лобовое стекло.","Tow chain":"Цепь буксировки","Ram a path through":"Протаранить путь","The Bruiser loses its grille but tears a tow chain from the wreckage.":"Синяк теряет решетку радиатора, но отрывает буксирную цепь от обломков.","condition −1 · fuel −1":"условие −1 · топливо −1","Foundry gate key":"Ключ от ворот литейного цеха","Dive through the foundry yard":"Нырнуть через литейный двор","The pack follows you inside; the spores are thick, but a gate key hangs by the furnace.":"Стая следует за вами внутрь; споры густые, а у печи висит ключ от ворот.","spores +1":"споры +1","Clarkson · 23:06 · transmission ends":"Кларксон · 23:06 · передача заканчивается","You reach the elevator with bite marks in the roof":"Вы добираетесь до лифта со следами укусов на крыше.","The tape has stopped, but the young mechanic's voice now comes from the red clouds. You leave the Bruiser idling. Whatever happens at 02:17, noise will be your weapon—and perhaps your apology.":"Запись остановилась, но голос молодого механика теперь доносится из красных облаков. Вы оставляете Bruiser на холостом ходу. Что бы ни случилось в 02:17, шум будет вашим оружием и, возможно, вашим извинением.","Hamster · 22:03 · North Drain":"Хомяк · 22:03 · Северный сток","Your missing friend knocks from inside the pipe":"Твой пропавший друг стучит из трубы.","The three-wheeler barely fits. Behind you, something crawls through the dark using your friend's voice. Years ago, when his car rolled, you ran for help and did not go back. Vecna calls that abandonment.":"Трехколесник едва помещается. Позади вас что-то ползет в темноте, используя голос вашего друга. Много лет назад, когда его машина перевернулась, вы побежали за помощью и не вернулись. Векна называет это отказом.","The clock chimes once. Your headlamp dies. The scraping becomes a sprint.":"Часы прозвенят один раз. Ваша фара умирает. Соскабливание превращается в спринт.","Sonic flare launcher":"Звуковая сигнальная ракетница","Hamster · pursuit · listen":"Хомяк · преследование · слушать","Which sentence correctly describes the sound?":"Какое предложение правильно описывает звук?","I could hear something gaining on me":"Я слышал, как что-то приближается ко мне.","I could heard something gained tomorrow":"Я слышал, что завтра что-то получится","I can hearing something to gain me":"Я могу услышать что-нибудь, что принесет мне пользу","I could have hear something gains":"Я мог бы что-то услышать","Hear + object + -ing describes an action in progress. Correct: you build a sonic flare launcher from a suppression bottle and the horn relay.":"Слушать + объект + -ing описывает происходящее действие. Правильно: вы строите звуковую сигнальную ракетницу из бутылки с глушителем и реле звукового сигнала.","Hamster · the first disagreement":"Хомяк · первая размолвка","Clarkson tells you to turn back":"Кларксон велит вам повернуть назад.","Shared tunnel map":"Общая карта туннелей","Send both drivers your exact route":"Отправьте обоим водителям точный маршрут.","If you vanish, they can still find you.":"Если ты исчезнешь, они все равно смогут тебя найти.","Needle +2":"Игла +2","Say the signal is breaking up":"Скажем, сигнал пропадает.","You refuse to be rescued by someone you do not trust.":"Вы отказываетесь от помощи человека, которому не доверяете.","Hamster · 22:31 · the flooded chamber":"Хомяк · 22:31 · затопленная камера","The tunnel opens into the Upside Down":"Туннель ведет в перевернутый мир.","Red lightning flashes beneath black water. A Demodog drops between you and the exit; three more splash down behind. The three-wheeler tips onto two wheels as you circle the chamber.":"Красная молния сверкает под черной водой. Демодог падает между вами и выходом; еще трое плескались сзади. Трехколесный транспорт опрокидывается на два колеса, когда вы кружите по камере.","Your friend's voice asks why you left. The water begins climbing the tyres.":"Голос твоего друга спрашивает, почему ты ушел. Вода начинает подниматься по шинам.","Reinforced tyre chains":"Цепи противоскольжения усиленные","Hamster · water rising":"Хомяк · поднимающаяся вода","Which deduction is correct?":"Какой вывод правильный?","The Gate must have opened below the chamber":"Врата под комнатой, должно быть, открылись.","The Gate must opened below it":"Врата под ним должны открыться","The Gate has must opening below it":"Ворота должны открыться под ними","The Gate must have open tomorrow":"Врата должны быть открыты завтра.","Must have + past participle expresses a strong deduction about the past. Correct: you recover tyre chains from a submerged maintenance cart.":"Must have + причастие прошедшего времени выражает сильный вывод о прошлом. Правильно: вы достаете цепи противоскольжения из затопленной тележки для технического обслуживания.","Hamster · escape the chamber":"Хомяк · выйти из комнаты","The pack closes the circle":"Пачка замыкает круг","Spore filter":"Споровый фильтр","Fire the suppression bottles into the water":"Выстрелить баллонами с тушением в воду","The chemical fog blinds the pack and leaves one usable respirator filter.":"Химический туман ослепляет рюкзак и оставляет один пригодный к использованию респираторный фильтр.","fuel −1":"топливо −1","Drain bolt cutters":"Кусачки для дренажных болтов","Cut the floodgate chain":"Разрезать цепь шлюза","The current tears a panel from the van but sweeps the Demodogs away.":"Ток срывает панель с фургона, но уносит демодогов.","condition −1 · nerve −1":"состояние −1 · нерв −1","Hamster · 23:06 · transmission ends":"Хомяк · 23:06 · передача завершена","You emerge beneath the grain elevator":"Вы выходите из-под элеватора.","The hidden road ends at a living cable the width of your arm. On the other side of the wall, dozens of Demodogs gather around the sound of your engine. You mark the cable and leave the drain open for later.":"Скрытая дорога заканчивается проводом шириной с вашу руку. По другую сторону стены вокруг звука вашего двигателя собираются десятки демодогов. Вы отмечаете кабель и оставляете слив открытым на потом.","May · 22:03 · Ridge Street mast":"Май · 22:03 · Мачта Ридж-стрит","The message you deleted is broadcasting itself":"Удаленное вами сообщение транслируется само по себе","Your old distress call fills every frequency: a colleague trapped in a winter storm, asking whether you sent his coordinates. You did not. You thought the reading was impossible and erased it.":"Ваш старый сигнал бедствия звучит на всех частотах: коллега, попавший в зимнюю бурю, спрашивает, отправили ли вы его координаты. Вы этого не сделали. Вы подумали, что чтение невозможно, и стерли его.","The clock chimes once. Tall shapes step between the streetlamps. One begins to run.":"Часы прозвенят один раз. Высокие фигуры шагают между уличными фонарями. Один начинает бежать.","Faraday ignition cage":"Клетка зажигания Фарадея","May · pursuit · deduction":"Май · преследование · удержание","The estate turns before you touch the wheel. Which deduction works?":"Усадьба поворачивается еще до того, как вы коснетесь руля. Какой вычет работает?","It must have intercepted the ignition signal":"Должно быть, он перехватил сигнал зажигания.","It must intercepted the ignition signal":"Он должен перехватить сигнал зажигания","It has must intercepting the signal":"Он должен перехватить сигнал","It must have intercept tomorrow":"У него завтра должен быть перехват","Must have + past participle makes a strong deduction about the past. Correct: you shield the ignition with a Faraday cage from numbered box 9.":"Must have + причастие прошедшего времени делает сильный вывод о прошлом. Правильно: вы экранируете зажигание клеткой Фарадея из коробки под номером 9.","May · the first disagreement":"Май · первая размолвка","Clarkson asks why you erased the coordinates":"Кларксон спрашивает, почему вы стерли координаты?","Original distress tape":"Оригинальная лента бедствия","Admit that you decided they were impossible":"Признайся, что ты решил, что это невозможно","Hamster says impossible roads are the only roads left.":"Хомяк говорит, что остались только невозможные дороги.","Blame interference on the mast":"Виноваты помехи на мачте","Clarkson recognises the lie. He begins making his own plan.":"Кларксон признает ложь. Он начинает строить свой собственный план.","May · 22:31 · Dead Frequency":"Май · 22:31 · Мертвая частота","Vecna starts predicting your turns":"Векна начинает предсказывать ваши ходы","Your voice names each road two seconds before you steer. In the mirror, the runner is close enough to touch the rear window. The radio mast ahead bends toward the estate like a fishing rod.":"Ваш голос называет каждую дорогу за две секунды до того, как вы поворачиваете. В зеркале бегун находится достаточно близко, чтобы коснуться заднего стекла. Радиомачта впереди наклоняется в сторону поместья, как удочка.","At its base, the armoured cable pulses once every eleven seconds.":"У его основания бронированный кабель пульсирует каждые одиннадцать секунд.","Eleven-second lightning timer":"Таймер молнии на одиннадцать секунд","May · the mast is falling":"Май · мачта падает","Which sentence gives the safe sequence?":"Какое предложение дает безопасную последовательность?","Cut the cable after the pulse has passed":"Отрежьте кабель после прохождения импульса","Cut the cable after the pulse passing tomorrow":"Отрежьте кабель после того, как завтра пройдет импульс","Cut cable after pulse have pass":"Обрезать кабель после прохождения импульса","Cutted it after the pulse has passing":"Обрезал после прохождения импульса","Present perfect makes the pulse complete before the cut. Correct: you calibrate a timer to the eleven-second cycle.":"Present Perfect делает импульс завершенным перед разрезом. Правильно: вы калибруете таймер на одиннадцатисекундный цикл.","May · escape the mast":"Май · сбежать с мачты","The runner reaches the rear door":"Бегущий достигает задней двери","Phase inverter":"Фазоинвертор","Reverse the alternator through the cable":"Переверните генератор через трос","The electrical backlash throws the creature clear.":"Электрическая реакция отбрасывает существо.","Warm armoured cable":"Кабель теплый бронированный","Drive through the mast supports":"Проехать через опоры мачты","The roof buckles, but you leave with the cable wound around the towbar.":"Крыша прогибается, но вы уезжаете с тросом, намотанным на фаркоп.","condition −1 · spores +1":"условие −1 · споры +1","May · 23:06 · transmission ends":"Май · 23:06 · завершение передачи","The impossible coordinates point to the elevator":"Невозможные координаты указывают на лифт.","The distress call was never from the winter storm. It came from tonight, through the Gate, in your colleague's voice. You finally transmit the coordinates to Clarkson and Hamster. Both answer.":"Звонок бедствия никогда не был вызван зимней бурей. Оно пришло сегодня вечером, через Врата, голосом вашего коллеги. Наконец вы передаете координаты Кларксону и Хомяку. Оба отвечают.","02:03 · grain elevator · final transmission":"02:03 · элеватор · главная передача","Vecna plays all three confessions at once":"Векна играет все три признания одновременно","The clocks chime twice. Clarkson hears the mechanic. Hamster hears the friend in the drain. May hears the unanswered distress call. Each voice tells its driver that the other two already crossed the Gate without him.":"Часы бьют дважды. Кларксон слышит механика. Хомяк слышит друга в канализации. Мэй слышит оставшийся без ответа сигнал бедствия. Каждый голос сообщает водителю, что двое других уже пересекли Врата без него.","Then the Mind Flayer descends. The yard turns grey and all three cars fall upward into the Upside Down. Demodogs pour from the elevator before the wheels land.":"Затем спускается Ловец Разума. Двор становится серым, и все три машины падают вверх тормашками. Демодоги высыпают из лифта еще до того, как колеса приземляются.","Gate-phase compass":"Фазовый компас","02:12 · Vecna is counting down":"02:12 · Векна ведет обратный отсчет","Five minutes.":"Пять минут.","The Mind Flayer is lowering a hand over the only tear back to Halloway.":"Ловец разума опускает руку на единственную пропасть, ведущую обратно в Хэллоуэй.","Which sentence keeps the team together?":"Какое предложение объединяет команду?","We leave after everyone has reached the Gate":"Выходим после того, как все дойдут до Врат.","We left after everyone will reaching it":"Мы ушли после того, как все дошли до него.","We leave after everyone have reach yesterday":"Мы уходим после того, как вчера все успели.","We are leave before everyone reaching":"Мы уходим раньше, чем все доберутся","Present simple after after expresses the future condition. Correct: the repaired compass points to the moving Gate rather than north.":"Настоящее простое after after выражает будущее состояние. Правильно: отремонтированный компас указывает на движущиеся Врата, а не на север.","02:14 · obstacle one · sound":"02:14 · препятствие первое · звук","The pack hears three engines":"Стая слышит три двигателя","02:15 · obstacle two · power":"02:15 · препятствие два · сила","Vecna reaches into the ignition":"Векна лезет в замок зажигания","02:16 · obstacle three · traction":"02:16 · препятствие три · тяга","The road becomes living mud":"Дорога становится живой грязью","02:17 · the last broadcast":"02:17 · последняя трансляция","How do you force the Gate open?":"Как открыть Врата?","Clarkson rams the living cable":"Кларксон протаранивает живой кабель","Brute force. The Gate opens wide, but the Bruiser may not restart.":"Грубая сила. Врата широко открываются, но Громила не удается перезапустить.","Hamster draws the pack into the drain":"Хомяк вытаскивает пакет в канализацию","It clears the road, but someone must remain behind until the last second.":"Дорогу расчищает, но кто-то должен оставаться позади до последней секунды.","May reverses the final transmission":"Мэй отменяет последнюю передачу","The signal becomes a road home—if the estate has enough fuel to hold it.":"Сигнал становится дорогой домой, если в поместье достаточно топлива, чтобы его удержать.","Conclusion · impact":"Вывод · воздействие","The Bruiser hits the Gate at sixty":"Бойщик попадает в ворота в шестьдесят","Outcome":"Результат","Conclusion · the decoy":"Вывод · приманка","The smallest engine turns back":"Самый маленький паровоз поворачивает назад","Conclusion · the reversed signal":"Вывод · обратный сигнал","The radio becomes a doorway":"Радио становится дверным проемом","Transmission complete":"Передача завершена","One voice has reached the elevator":"Один голос дошёл до лифта","Complete the remaining transmissions.":"Завершите оставшиеся передачи.","Play next driver":"Воспроизвести следующего водителя","Condition":"Состояние","Fuel":"Топливо","Nerve":"Нерв","Spores":"Споры","Needle":"Игла","Holding":"Холдинг","Fraying":"Износ","Split":"Сплит","Boot":"Ботинок","Empty":"Пусто","Correct":"Правильно","Not quite":"Не совсем","Check":"Проверить","Story completed":"История завершена","Survival equipment":"Спасательное снаряжение","Close inventory":"Закрыть инвентарь","Previous":"Предыдущий","Next":"Следующий","Stranger Gears — The Last Broadcast":"Stranger Gears — Последняя трансляция","__COUNT__ item":"__COUNT__ элемент","__COUNT__ items":"__COUNT__ шт.","Reward acquired: __ITEM__.":"Получена награда: __ITEM__.","Safety item acquired: __ITEM__.":"Обнаружен предмет безопасности: __ITEM__.","Artefact used · no loss":"Артефакт использован · потерь нет","Nerve −2 · Needle −1":"Нерв −2 · Игла −1","Fuel −2 · Condition −1":"Топливо −2 · Состояние −1","Condition −2 · Spores +2":"Состояние −2 · Споры +2","Spore filter used · spores −1":"Использованный фильтр для спор · споры −1","You deploy the __ITEM__. The pack veers after the false engine note, buying all three cars a clear lane.":"Вы развертываете __ITEM__. Стая отклоняется после ложного сигнала двигателя, давая всем трем машинам свободную полосу движения.","You have nothing that can mask or divert the engines. Demodogs strike both rear cars, and May shouts that Clarkson has drawn them onto everyone.":"У вас нет ничего, что могло бы замаскировать или отвлечь двигатели. Демодоги бьют по обеим задним машинам, и Мэй кричит, что Кларксон натравил их на всех.","The __ITEM__ blocks the copied signal. May keeps the ignition alive and calls the lightning strike exactly once.":"__ITEM__ блокирует скопированный сигнал. Мэй поддерживает зажигание и вызывает удар молнии ровно один раз.","The Mind Flayer enters the ignition circuit. All three engines die together; restarting them burns fuel and strips teeth from the Bruiser's starter.":"Ловец разума входит в цепь зажигания. Все три двигателя глохнут одновременно; их перезапуск сжигает топливо и срывает зубья стартера Bruiser.","The __ITEM__ finds purchase where the road has become flesh. The convoy climbs out before the vines close.":"__ITEM__ находит место там, где дорога стала плотью. Конвой вылезает прежде, чем виноградные лозы сомкнутся.","The wheels sink to their hubs. They leave the cars to push, breathing spores while tendrils close around the axles.":"Колеса проваливаются в ступицы. Они оставляют автомобили толкаться, выдыхая споры, в то время как усики смыкаются вокруг осей.","The Gate opens, but the damaged convoy cannot reach it. The Mind Flayer drops between you and the exit. The last thing through is the radio signal; all three drivers remain in the Upside Down. Restart the campaign and bring the missing safety equipment.":"Врата открываются, но поврежденный конвой не может до них добраться. Истязатель разума падает между вами и выходом. Последним проходит радиосигнал; все три водителя остаются в перевернутом положении. Перезапустите кампанию и принесите недостающее защитное снаряжение.","The Gate opens while the Demodogs close in. The Needle has split: when __LOST__ calls for help, the others hesitate one second too long. Two cars reach Halloway. __LOST__ turns back into the red storm to hold the pack away, and does not come through.":"Врата открываются, а демодоги приближаются. Игла раскололась: когда __LOST__ зовет на помощь, остальные колеблются на одну секунду дольше. Две машины доезжают до Холлоуэя. __LOST__ снова превращается в красную бурю, чтобы удержать стаю, но не проходит.","Recovered equipment carries the convoy through the final pursuit: __ITEMS__.":"Найденное оборудование проводит конвой через последнее преследование: __ITEMS__.","All three cars burst out of the Upside Down seconds before the Mind Flayer reaches the road. The Gate seals behind them at the county line.":"Все три машины вырвались из Перевернутого за несколько секунд до того, как Ловец Разума выехал на дорогу. Ворота закрываются за ними на границе графства.","__NAME__ reached the elevator with __COUNT__ artefact.":"__NAME__ добрался до лифта с __COUNT__ артефактом.","__NAME__ reached the elevator with __COUNT__ artefacts.":"__NAME__ добрался до лифта с __COUNT__ артефактами.","End of Part III · 02:24 · beyond Halloway":"Конец части III · 02:24 · за пределами Холлоуэя","Driver story __COUNT__ of 3 complete":"История водителя __COUNT__ из 3 завершена","No one reached the Gate":"Никто не достиг Врат","Only two drivers came back":"Вернулись только два водителя.","All three drivers escaped":"Все трое водителей скрылись.","Choose another driver to continue":"Выберите другого водителя, чтобы продолжить.","This driver has reached the grain elevator. Complete the remaining character stories to unlock the shared climax and final escape.":"Этот водитель подъехал к элеватору. Завершите оставшиеся истории персонажей, чтобы разблокировать общую кульминацию и последний побег.","Play all stories again":"Проиграть все истории еще раз","Choose the next driver":"Выбрать следующего водителя","Driver":"Водитель"},"ar":{"Forbes English":"فوربس الإنجليزية","An interactive Stranger Things story":"قصة تفاعلية لأشياء غريبة","Stranger Gears":"التروس الغريبة","The Last Broadcast · Three drivers. Three confessions. One signal from the Upside Down that knows what each of them is trying not to say.":"البث الأخير · ثلاثة سائقين. ثلاثة اعترافات. إشارة واحدة من Upside Down تعرف ما يحاول كل منهم عدم قوله.","Begin transmission":"بدء الإرسال","21:40 · Halloway · 97.3 FM":"21:40 · المدخل · 97.3 إف إم","The radio says your name before you switch it on":"يقول الراديو اسمك قبل تشغيله","Every receiver in town snaps to the same dead frequency. A grandfather clock chimes four times. Then your own voice begins describing a memory you have never told Clarkson, Hamster or May.":"كل جهاز استقبال في المدينة يستقر على نفس التردد الميت. ساعة الجد تدق أربع مرات. ثم يبدأ صوتك في وصف ذكرى لم تخبرها من قبل لكلاركسون أو هامستر أو ماي.","Outside, red lightning opens a wound above the grain elevator. The broadcast ends with a promise:":"في الخارج البرق الأحمر يفتح جرحاً فوق مخزن الحبوب. وينتهي البث بوعد:","at 02:17, one of you will choose who gets home.":"الساعة 02:17، سيختار أحدكم من يعود إلى المنزل.","Field notes · what is hunting you":"ملاحظات ميدانية · ما الذي يطاردك؟","The signal has teeth":"الإشارة لها أسنان","Vecna":"فيكنا","Inside the broadcast":"داخل البث","He uses guilt as a doorway. Four chimes mean he has found yours.":"يستخدم الذنب كمدخل. أربعة دقات تعني أنه وجد لك.","Demodogs":"ديمودوغ","On every road":"في كل طريق","Blind, fast and drawn to engines, voices and electrical current.":"أعمى وسريع ومنجذب للمحركات والأصوات والتيار الكهربائي.","Mind Flayer":"العقل فلاير","Above the Gate":"فوق البوابة","A storm-shaped shadow descending one tendril at a time.":"ظل على شكل عاصفة ينزل محلاقًا واحدًا في كل مرة.","How the campaign works":"كيفية عمل الحملة","Every correct answer becomes survival equipment":"كل إجابة صحيحة تصبح أداة للبقاء على قيد الحياة","Play all three drivers. Their stories are different and their equipment carries into the final run. Wrong answers cost nerve and trust.":"تشغيل جميع برامج التشغيل الثلاثة. قصصهم مختلفة ومعداتهم تستمر في الجولة النهائية. الإجابات الخاطئة تكلف الأعصاب والثقة.","At the climax, sound, power and traction each demand an item. The Needle decides whether all three drivers help one another through the Gate.":"في الذروة، يتطلب كل من الصوت والقوة والجر عنصرًا ما. تقرر The Needle ما إذا كان السائقون الثلاثة يساعدون بعضهم البعض عبر البوابة.","Choose the next transmission":"اختر ناقل الحركة التالي","Whose voice answers the radio?":"صوت من يرد على الراديو؟","Clarkson · the Bruiser":"كلاركسون · الكدمة","A V8, an empty bypass and the accident he insists was not his fault.":"محرك V8، وتجاوز فارغ والحادث الذي يصر على أنه لم يكن خطأه.","Suppression bottles":"زجاجات القمع","Hamster · the three-wheeler":"الهامستر · ذات الثلاث عجلات","A storm drain, a failing headlamp and the friend he left behind once before.":"مصرف العاصفة، والمصباح الأمامي الفاشل، والصديق الذي تركه وراءه من قبل.","May · the diesel estate":"مايو · عقار الديزل","A radio mast, a boot of numbered boxes and one message he never transmitted.":"صاري راديو وصندوق به صناديق مرقمة ورسالة واحدة لم يرسلها أبدًا.","Reset all stories":"إعادة تعيين كافة القصص","Clarkson · 22:03 · Foundry Bypass":"كلاركسون · 22:03 · تجاوز المسبك","Your passenger is a cassette recorder":"الراكب الخاص بك هو مسجل كاسيت","The tape plays the sound of rain, tyres and a young mechanic saying he trusts you. You remember sending him ahead in a car you knew had a bad steering rack.":"الشريط يشغل صوت المطر والإطارات وميكانيكي شاب يقول يثق فيك. تتذكر إرساله للأمام في سيارة كنت تعلم أن رف التوجيه بها سيئ.","The clock chimes once. In the mirror, six Demodogs unfold from the verge and begin running. They are gaining whenever you lift off the throttle.":"الساعة تدق مرة واحدة. في المرآة، يظهر ستة ديمودوغز من الحافة ويبدأون في الجري. إنهم يكسبون كلما رفعت دواسة الوقود.","Sound-dampening blanket":"بطانية عازلة للصوت","Clarkson · pursuit · language under pressure":"كلاركسون · السعي · اللغة تحت الضغط","Which sentence makes the earlier danger clear?":"ما الجملة التي توضح الخطر السابق؟","I knew the steering rack had already failed once":"كنت أعلم أن رف التوجيه قد فشل بالفعل مرة واحدة","I knew the steering rack has fail tomorrow":"كنت أعلم أن رف التوجيه سيتعطل غدًا","I had knew the steering rack already failing":"كنت أعلم أن رف التوجيه قد فشل بالفعل","I knowed the steering rack had fails":"كنت أعلم أن رف التوجيه قد فشل","Past perfect places the earlier failure before what you knew. The correct answer unlocks a blanket that masks the Bruiser's engine note.":"الماضي التام يضع الفشل السابق قبل ما كنت تعرفه. تفتح الإجابة الصحيحة غطاءً يخفي نغمة محرك Bruiser.","Clarkson · the first disagreement":"كلاركسون · الخلاف الأول","Hamster asks whether the tape is true":"هامستر يسأل عما إذا كان الشريط صحيحًا","Honest CB recording":"تسجيل CB صادق","Tell both of them the whole truth":"قل لهما الحقيقة كاملة","The silence afterward is terrible, but they know what Vecna is using.":"الصمت بعد ذلك فظيع، لكنهم يعرفون ما يستخدمه Vecna.","Needle +2 · nerve −1":"إبرة +2 · العصب −1","Call the recording a fake":"التسجيل مزيف","May says the rain on the tape matches the date. Hamster stops answering.":"ماي تقول أن المطر على الشريط يطابق التاريخ. توقف الهامستر عن الرد.","Needle −2":"إبرة −2","Clarkson · 22:19 · mirror check":"كلاركسون · 22:19 · فحص المرآة","One of them is on the roof":"واحد منهم على السطح","Claws punch through the headlining. Another Demodog runs level with your window. Ahead, the bypass ends at a barricade of abandoned cars. Vecna's voice says the mechanic's name through every speaker.":"مخالب تخترق بطانة السقف. يعمل Demodog آخر على مستوى نافذتك. أمامك، ينتهي الممر الالتفافي عند حاجز من السيارات المهجورة. يقول صوت Vecna ​​اسم الميكانيكي من خلال كل مكبر صوت.","You have eight seconds before the pack boxes you in.":"لديك ثماني ثوانٍ قبل أن تضعك العبوة في مكانها.","Nitrous purge switch":"مفتاح التطهير بالنيتروز","Clarkson · eight seconds":"كلاركسون · ثماني ثواني","Which instruction is correct?":"أي التعليمات صحيحة؟","Keep the revs up before you release the clutch":"حافظ على ارتفاع عدد الدورات قبل تحرير القابض","Kept the revs before you releasing it":"احتفظ بالمراجعات قبل إطلاقها","Keep the revs up before you released it tomorrow":"حافظ على الدورات مرتفعة قبل أن تطلقها غدًا","Keeping revs before release clutch":"الاحتفاظ بعدد الدورات قبل تحرير القابض","The imperative keeps the sequence immediate. Correct: you wire a single-use nitrous purge that can break the pack's formation.":"الأمر يبقي التسلسل فوريًا. صحيح: قمت بتوصيل مادة نيتروزية تستخدم لمرة واحدة والتي يمكن أن تكسر تكوين العبوة.","Clarkson · escape the bypass":"كلاركسون · الهروب من الممر الالتفافي","The barricade fills the windscreen":"الحاجز يملأ الزجاج الأمامي","Tow chain":"سلسلة السحب","Ram a path through":"طريق من خلال","The Bruiser loses its grille but tears a tow chain from the wreckage.":"يفقد Bruiser شبكته ولكنه يمزق سلسلة سحب من الحطام.","condition −1 · fuel −1":"الحالة −1 · الوقود −1","Foundry gate key":"مفتاح بوابة المسبك","Dive through the foundry yard":"الغوص في ساحة المسبك","The pack follows you inside; the spores are thick, but a gate key hangs by the furnace.":"القطيع يتبعك إلى الداخل؛ الجراثيم سميكة، لكن مفتاح البوابة معلق بجانب الفرن.","spores +1":"جراثيم +1","Clarkson · 23:06 · transmission ends":"كلاركسون · 23:06 · ينتهي الإرسال","You reach the elevator with bite marks in the roof":"تصل إلى المصعد وعليها علامات عض في السقف","The tape has stopped, but the young mechanic's voice now comes from the red clouds. You leave the Bruiser idling. Whatever happens at 02:17, noise will be your weapon—and perhaps your apology.":"توقف الشريط، لكن صوت الميكانيكي الشاب يأتي الآن من السحب الحمراء. يمكنك ترك Bruiser في وضع الخمول. مهما حدث في الساعة 02:17، سيكون الضجيج هو سلاحك، وربما اعتذارك.","Hamster · 22:03 · North Drain":"الهامستر · 22:03 · المصرف الشمالي","Your missing friend knocks from inside the pipe":"صديقك المفقود يقرع من داخل الأنبوب","The three-wheeler barely fits. Behind you, something crawls through the dark using your friend's voice. Years ago, when his car rolled, you ran for help and did not go back. Vecna calls that abandonment.":"الدراجة ذات الثلاث عجلات بالكاد تناسبها. خلفك، هناك شيء يزحف عبر الظلام باستخدام صوت صديقك. منذ سنوات مضت، عندما انقلبت سيارته، ركضت طلباً للمساعدة ولم تعد. Vecna ​​يدعو هذا التخلي.","The clock chimes once. Your headlamp dies. The scraping becomes a sprint.":"الساعة تدق مرة واحدة. يموت المصباح الأمامي الخاص بك. يصبح الكشط سباقًا سريعًا.","Sonic flare launcher":"قاذفة التوهج الصوتي","Hamster · pursuit · listen":"الهامستر · المطاردة · الاستماع","Which sentence correctly describes the sound?":"ما هي الجملة التي تصف الصوت بشكل صحيح؟","I could hear something gaining on me":"كنت أسمع شيئًا يكسبني","I could heard something gained tomorrow":"قد سمعت شيئًا مكتسبًا غدًا","I can hearing something to gain me":"أسمع شيئاً يكسبني","I could have hear something gains":"كان بإمكاني سماع شيء يكسب","Hear + object + -ing describes an action in progress. Correct: you build a sonic flare launcher from a suppression bottle and the horn relay.":"سماع + كائن + -ing يصف إجراءً قيد التنفيذ. صحيح: يمكنك إنشاء قاذفة مضيئة صوتية من زجاجة قمع ومرحل البوق.","Hamster · the first disagreement":"الهامستر · الخلاف الأول","Clarkson tells you to turn back":"يطلب منك كلاركسون العودة إلى الوراء","Shared tunnel map":"خريطة النفق المشترك","Send both drivers your exact route":"أرسل لكلا السائقين مسارك المحدد","If you vanish, they can still find you.":"إذا اختفيت، فلا يزال بإمكانهم العثور عليك.","Needle +2":"إبرة +2","Say the signal is breaking up":"قل أن الإشارة تنقطع","You refuse to be rescued by someone you do not trust.":"ترفض أن ينقذك شخص لا تثق به.","Hamster · 22:31 · the flooded chamber":"الهامستر · 22:31 · الغرفة المغمورة","The tunnel opens into the Upside Down":"النفق يفتح على الجانب المقلوب","Red lightning flashes beneath black water. A Demodog drops between you and the exit; three more splash down behind. The three-wheeler tips onto two wheels as you circle the chamber.":"ومضات البرق الأحمر تحت الماء الأسود. يسقط Demodog بينك وبين الخروج؛ ثلاثة آخرين يتناثرون في الخلف. نصائح العجلات الثلاث على عجلتين أثناء قيامك بالدوران حول الغرفة.","Your friend's voice asks why you left. The water begins climbing the tyres.":"صوت صديقك يسألك عن سبب رحيلك. يبدأ الماء في تسلق الإطارات.","Reinforced tyre chains":"سلاسل الإطارات المسلحة","Hamster · water rising":"الهامستر · ارتفاع الماء","Which deduction is correct?":"أي الخصم هو الصحيح؟","The Gate must have opened below the chamber":"لابد أن البوابة قد فتحت أسفل الحجرة","The Gate must opened below it":"البوابة يجب أن تفتح من تحتها","The Gate has must opening below it":"البوابة يجب أن تفتح من تحتها","The Gate must have open tomorrow":"يجب أن تكون البوابة مفتوحة غدًا","Must have + past participle expresses a strong deduction about the past. Correct: you recover tyre chains from a submerged maintenance cart.":"يجب أن يكون + النعت الماضي يعبر عن خصم قوي عن الماضي. الصحيح: يمكنك استعادة سلاسل الإطارات من عربة الصيانة المغمورة.","Hamster · escape the chamber":"الهامستر · الهروب من الغرفة","The pack closes the circle":"العبوة تغلق الدائرة","Spore filter":"مرشح البوغ","Fire the suppression bottles into the water":"أطلق زجاجات القمع في الماء","The chemical fog blinds the pack and leaves one usable respirator filter.":"الضباب الكيميائي يحجب العبوة ويترك مرشح تنفس واحد صالح للاستخدام.","fuel −1":"الوقود -1","Drain bolt cutters":"قواطع مسامير التصريف","Cut the floodgate chain":"قطع سلسلة بوابة الفيضان","The current tears a panel from the van but sweeps the Demodogs away.":"التيار يمزق لوحة من الشاحنة لكنه يجرف الديمودوجز بعيدًا.","condition −1 · nerve −1":"الحالة −1 · العصب −1","Hamster · 23:06 · transmission ends":"الهامستر · 23:06 · ينتهي الإرسال","You emerge beneath the grain elevator":"تظهر تحت مصعد الحبوب","The hidden road ends at a living cable the width of your arm. On the other side of the wall, dozens of Demodogs gather around the sound of your engine. You mark the cable and leave the drain open for later.":"الطريق المخفي ينتهي عند كيبل حي بعرض ذراعك. على الجانب الآخر من الجدار، يتجمع العشرات من الديمودوغ حول صوت محرك سيارتك. قمت بوضع علامة على الكابل وترك الصرف مفتوحًا لوقت لاحق.","May · 22:03 · Ridge Street mast":"مايو · 22:03 · سارية شارع ريدج","The message you deleted is broadcasting itself":"الرسالة التي قمت بحذفها تبث نفسها","Your old distress call fills every frequency: a colleague trapped in a winter storm, asking whether you sent his coordinates. You did not. You thought the reading was impossible and erased it.":"نداء الاستغاثة القديم الخاص بك يملأ كل تردد: زميل محاصر في عاصفة شتوية، يسألك عما إذا كنت قد أرسلت إحداثياته. أنت لم تفعل ذلك. ظننت أن القراءة مستحيلة فمسحتها.","The clock chimes once. Tall shapes step between the streetlamps. One begins to run.":"الساعة تدق مرة واحدة. الأشكال الطويلة تتدرج بين مصابيح الشوارع. يبدأ المرء في الجري.","Faraday ignition cage":"قفص الإشعال فاراداي","May · pursuit · deduction":"مايو · السعي · الخصم","The estate turns before you touch the wheel. Which deduction works?":"الملكية تدور قبل أن تلمس عجلة القيادة. أي خصم يعمل؟","It must have intercepted the ignition signal":"لا بد أنه اعترض إشارة الإشعال","It must intercepted the ignition signal":"يجب أن يعترض إشارة الإشعال","It has must intercepting the signal":"يجب أن يعترض الإشارة","It must have intercept tomorrow":"يجب أن يتم الاعتراض غدًا","Must have + past participle makes a strong deduction about the past. Correct: you shield the ignition with a Faraday cage from numbered box 9.":"يجب أن يكون لديك + النعت الماضي يجعل خصمًا قويًا حول الماضي. صحيح: قمت بحماية الإشعال بقفص فاراداي من المربع المرقّم 9.","May · the first disagreement":"مايو · الخلاف الأول","Clarkson asks why you erased the coordinates":"يسأل كلاركسون لماذا قمت بمسح الإحداثيات","Original distress tape":"شريط الاستغاثة الأصلي","Admit that you decided they were impossible":"اعترف أنك قررت أنها مستحيلة","Hamster says impossible roads are the only roads left.":"يقول الهامستر إن الطرق المستحيلة هي الطرق الوحيدة المتبقية.","Blame interference on the mast":"إلقاء اللوم على الصاري","Clarkson recognises the lie. He begins making his own plan.":"كلاركسون يتعرف على الكذب. يبدأ في وضع خطته الخاصة.","May · 22:31 · Dead Frequency":"مايو · 22:31 · التردد الميت","Vecna starts predicting your turns":"تبدأ فينا في التنبؤ بدوراتك","Your voice names each road two seconds before you steer. In the mirror, the runner is close enough to touch the rear window. The radio mast ahead bends toward the estate like a fishing rod.":"صوتك يسمي كل طريق قبل ثانيتين من توجيهك. في المرآة، يكون العداء قريبًا بما يكفي ليلمس النافذة الخلفية. ينحني سارية الراديو للأمام نحو العقار مثل صنارة الصيد.","At its base, the armoured cable pulses once every eleven seconds.":"في قاعدته، ينبض الكابل المدرع مرة واحدة كل إحدى عشرة ثانية.","Eleven-second lightning timer":"مؤقت البرق مدته إحدى عشرة ثانية","May · the mast is falling":"مايو · سقوط الصاري","Which sentence gives the safe sequence?":"أي جملة تعطي التسلسل الآمن؟","Cut the cable after the pulse has passed":"قطع الكابل بعد مرور النبضة","Cut the cable after the pulse passing tomorrow":"قطع الكابل بعد مرور النبضة غدا","Cut cable after pulse have pass":"قطع الكابل بعد مرور النبض","Cutted it after the pulse has passing":"قطعته بعد مرور النبض","Present perfect makes the pulse complete before the cut. Correct: you calibrate a timer to the eleven-second cycle.":"المضارع التام يجعل النبضة تكتمل قبل القطع. صحيح: قمت بمعايرة جهاز ضبط الوقت لدورة الإحدى عشرة ثانية.","May · escape the mast":"مايو · الهروب من الصاري","The runner reaches the rear door":"العداء يصل إلى الباب الخلفي","Phase inverter":"عاكس الطور","Reverse the alternator through the cable":"اعكس المولد من خلال الكابل","The electrical backlash throws the creature clear.":"رد الفعل الكهربائي يرمي المخلوق نظيفًا.","Warm armoured cable":"كابل مدرع دافئ","Drive through the mast supports":"القيادة عبر دعامات الصاري","The roof buckles, but you leave with the cable wound around the towbar.":"السقف ينغلق، لكنك تغادر والكابل ملفوف حول قضيب القطر.","condition −1 · spores +1":"الحالة −1 · الجراثيم +1","May · 23:06 · transmission ends":"مايو · 23:06 · ينتهي الإرسال","The impossible coordinates point to the elevator":"الإحداثيات المستحيلة تشير إلى المصعد","The distress call was never from the winter storm. It came from tonight, through the Gate, in your colleague's voice. You finally transmit the coordinates to Clarkson and Hamster. Both answer.":"نداء الاستغاثة لم يكن أبداً من عاصفة الشتاء. لقد جاء من الليلة، عبر البوابة، بصوت زميلك. قمت أخيرًا بإرسال الإحداثيات إلى كلاركسون وهامستر. كلاهما يجيب.","02:03 · grain elevator · final transmission":"02:03 · مصعد الحبوب · النقل النهائي","Vecna plays all three confessions at once":"Vecna تلعب الاعترافات الثلاثة في وقت واحد","The clocks chime twice. Clarkson hears the mechanic. Hamster hears the friend in the drain. May hears the unanswered distress call. Each voice tells its driver that the other two already crossed the Gate without him.":"الساعات تدق مرتين. كلاركسون يسمع الميكانيكي. الهامستر يسمع الصديق في البالوعة. قد تسمع نداء الاستغاثة الذي لم يتم الرد عليه. يخبر كل صوت سائقه أن الاثنين الآخرين عبرا البوابة بالفعل بدونه.","Then the Mind Flayer descends. The yard turns grey and all three cars fall upward into the Upside Down. Demodogs pour from the elevator before the wheels land.":"ثم ينزل فلاير العقل. يتحول لون الفناء إلى اللون الرمادي وتسقط السيارات الثلاث للأعلى في الاتجاه المقلوب. يتدفق الديمودوغ من المصعد قبل أن تهبط العجلات.","Gate-phase compass":"بوصلة مرحلة البوابة","02:12 · Vecna is counting down":"02:12 · يقوم Vecna بالعد التنازلي","Five minutes.":"خمس دقائق.","The Mind Flayer is lowering a hand over the only tear back to Halloway.":"العقل فلاير يخفض يده على الدمعة الوحيدة إلى هالواي.","Which sentence keeps the team together?":"ما هي الجملة التي تجعل الفريق متماسكاً؟","We leave after everyone has reached the Gate":"نغادر بعد أن يصل الجميع إلى البوابة","We left after everyone will reaching it":"غادرنا بعد أن يصل إليه الجميع","We leave after everyone have reach yesterday":"نغادر بعد وصول الجميع بالأمس","We are leave before everyone reaching":"نغادر قبل أن يصل الجميع","Present simple after after expresses the future condition. Correct: the repaired compass points to the moving Gate rather than north.":"المضارع البسيط بعد بعد يعبر عن حالة مستقبلية. الصحيح: تشير البوصلة التي تم إصلاحها إلى البوابة المتحركة وليس إلى الشمال.","02:14 · obstacle one · sound":"02:14 · العائق الأول · الصوت","The pack hears three engines":"العبوة تسمع ثلاثة محركات","02:15 · obstacle two · power":"02:15 · العائق الثاني · القوة","Vecna reaches into the ignition":"فيكنا تصل إلى مكان الإشعال","02:16 · obstacle three · traction":"02:16 · العائق الثالث · الجر","The road becomes living mud":"الطريق يصبح طينا حيا","02:17 · the last broadcast":"02:17 · البث الأخير","How do you force the Gate open?":"كيف تفتح البوابة بالقوة؟","Clarkson rams the living cable":"كلاركسون يصدم الكابل الحي","Brute force. The Gate opens wide, but the Bruiser may not restart.":"القوة الغاشمة. تفتح البوابة على مصراعيها، لكن قد لا يتم إعادة تشغيل Bruiser.","Hamster draws the pack into the drain":"الهامستر يسحب القطيع إلى البالوعة","It clears the road, but someone must remain behind until the last second.":"يُخلي الطريق ولكن يجب أن يبقى شخص ما في الخلف حتى الثانية الأخيرة.","May reverses the final transmission":"قد يعكس الإرسال النهائي","The signal becomes a road home—if the estate has enough fuel to hold it.":"تصبح الإشارة طريقًا إلى المنزل — إذا كان لدى العقار ما يكفي من الوقود لاستيعابها.","Conclusion · impact":"الخاتمة · الأثر","The Bruiser hits the Gate at sixty":"البروزر يضرب البوابة عند الستين","Outcome":"النتيجة","Conclusion · the decoy":"الخلاصة · الشرك","The smallest engine turns back":"أصغر محرك يعود إلى الوراء","Conclusion · the reversed signal":"الخلاصة · الإشارة المعكوسة","The radio becomes a doorway":"الراديو يصبح مدخلاً","Transmission complete":"اكتمل الإرسال","One voice has reached the elevator":"صوت واحد وصل للمصعد","Complete the remaining transmissions.":"أكمل الإرسالات المتبقية.","Play next driver":"تشغيل برنامج التشغيل التالي","Condition":"الحالة","Fuel":"الوقود","Nerve":"العصب","Spores":"جراثيم","Needle":"إبرة","Holding":"القابضة","Fraying":"الاهتراء","Split":"سبليت","Boot":"التمهيد","Empty":"فارغة","Correct":"صحيح","Not quite":"ليس تمامًا","Check":"الفحص","Story completed":"اكتملت القصة","Survival equipment":"معدات النجاة","Close inventory":"إغلاق المخزون","Previous":"السابق","Next":"التالي","Stranger Gears — The Last Broadcast":"العتاد الغريب - البث الأخير","__COUNT__ item":"__COUNT__ بند","__COUNT__ items":"__COUNT__ العناصر","Reward acquired: __ITEM__.":"المكافأة المكتسبة: __ITEM__.","Safety item acquired: __ITEM__.":"تم الحصول على عنصر السلامة: __ITEM__.","Artefact used · no loss":"القطعة الأثرية المستخدمة · لا خسارة","Nerve −2 · Needle −1":"العصب −2 · الإبرة −1","Fuel −2 · Condition −1":"الوقود −2 · الحالة −1","Condition −2 · Spores +2":"الحالة −2 · الجراثيم +2","Spore filter used · spores −1":"مرشح الجراثيم المستخدم · الجراثيم −1","You deploy the __ITEM__. The pack veers after the false engine note, buying all three cars a clear lane.":"قمت بنشر __ITEM__. تنحرف المجموعة بعد ملاحظة المحرك الكاذبة، مما يؤدي إلى شراء السيارات الثلاث في مسار واضح.","You have nothing that can mask or divert the engines. Demodogs strike both rear cars, and May shouts that Clarkson has drawn them onto everyone.":"ليس لديك أي شيء يمكنه إخفاء المحركات أو تحويلها. تضرب الديمودوغ السيارتين الخلفيتين، وتصرخ ماي بأن كلاركسون قد جذبهم إلى الجميع.","The __ITEM__ blocks the copied signal. May keeps the ignition alive and calls the lightning strike exactly once.":"يقوم __ITEM__ بحظر الإشارة المنسوخة. قد يبقي الإشعال حيًا ويطلق ضربة البرق مرة واحدة بالضبط.","The Mind Flayer enters the ignition circuit. All three engines die together; restarting them burns fuel and strips teeth from the Bruiser's starter.":"يدخل العقل فلاير دائرة الإشعال. تموت المحركات الثلاثة معًا. تؤدي إعادة تشغيلها إلى حرق الوقود وتجريد الأسنان من بادئ تشغيل Bruiser.","The __ITEM__ finds purchase where the road has become flesh. The convoy climbs out before the vines close.":"يجد __ITEM__ الشراء حيث أصبح الطريق جسدًا. تصعد القافلة قبل إغلاق الكروم.","The wheels sink to their hubs. They leave the cars to push, breathing spores while tendrils close around the axles.":"العجلات تغوص في محاورها. يتركون السيارات للدفع، ويتنفسون الجراثيم بينما تغلق المحلاق حول المحاور.","The Gate opens, but the damaged convoy cannot reach it. The Mind Flayer drops between you and the exit. The last thing through is the radio signal; all three drivers remain in the Upside Down. Restart the campaign and bring the missing safety equipment.":"البوابة تفتح ولكن القافلة المتضررة لا تستطيع الوصول إليها. يسقط العقل فلاير بينك وبين المخرج. آخر شيء يتم إرساله هو إشارة الراديو؛ يظل جميع السائقين الثلاثة في وضع مقلوب. أعد تشغيل الحملة وأحضر معدات السلامة المفقودة.","The Gate opens while the Demodogs close in. The Needle has split: when __LOST__ calls for help, the others hesitate one second too long. Two cars reach Halloway. __LOST__ turns back into the red storm to hold the pack away, and does not come through.":"تُفتح البوابة بينما يقترب الديمودوجز. انقسمت الإبرة: عندما يطلب __LOST__ المساعدة، يتردد الآخرون لمدة ثانية واحدة. تصل سيارتان إلى Halloway. __LOST__ يعود مرة أخرى إلى العاصفة الحمراء لإبعاد القطيع، ولا يمر عبره.","Recovered equipment carries the convoy through the final pursuit: __ITEMS__.":"المعدات المستردة تحمل القافلة خلال المطاردة النهائية: __ITEMS__.","All three cars burst out of the Upside Down seconds before the Mind Flayer reaches the road. The Gate seals behind them at the county line.":"انفجرت السيارات الثلاث من الطريق المقلوب بثواني قبل وصول العقل فلاير إلى الطريق. البوابة تغلق خلفهم على خط المقاطعة.","__NAME__ reached the elevator with __COUNT__ artefact.":"__NAME__ وصل إلى المصعد ومعه __COUNT__ قطعة أثرية.","__NAME__ reached the elevator with __COUNT__ artefacts.":"__NAME__ وصل إلى المصعد ومعه __COUNT__ من القطع الأثرية.","End of Part III · 02:24 · beyond Halloway":"نهاية الجزء الثالث · 02:24 · ما وراء هالواي","Driver story __COUNT__ of 3 complete":"قصة السائق __COUNT__ من 3 كاملة","No one reached the Gate":"لم يصل أحد إلى البوابة","Only two drivers came back":"عاد سائقان فقط","All three drivers escaped":"هرب السائقون الثلاثة","Choose another driver to continue":"اختر برنامج تشغيل آخر للمتابعة","This driver has reached the grain elevator. Complete the remaining character stories to unlock ntindo uma pista livre para os três carros.","You have nothing that can mask or divert the engines. Demodogs strike both rear cars, and May shouts that Clarkson has drawn them onto everyone.":"Você não tem nada que possa mascarar ou desviar os motores. Demodogs atacam ambos os carros traseiros e May grita que Clarkson os atraiu para todos.","The __ITEM__ blocks the copied signal. May keeps the ignition alive and calls the lightning strike exactly once.":"O __ITEM__ bloqueia o sinal copiado. May mantém a ignição acesa e dispara o raio exatamente uma vez.","The Mind Flayer enters the ignition circuit. All three engines die together; restarting them burns fuel and strips teeth from the Bruiser's starter.":"O Mind Flayer entra no circuito de ignição. Todos os três motores morrem juntos; reiniciá-los queima combustível e arranca os dentes do motor de arranque do Bruiser.","The __ITEM__ finds purchase where the road has become flesh. The convoy climbs out before the vines close.":"O __ITEM__ encontra apoio onde a estrada se tornou carne. O comboio sai antes que as vinhas se fechem.","The wheels sink to their hubs. They leave the cars to push, breathing spores while tendrils close around the axles.":"As rodas afundam em seus cubos. Eles deixam os carros empurrando, respirando esporos enquanto gavinhas se fecham em torno dos eixos.","The Gate opens, but the damaged convoy cannot reach it. The Mind Flayer drops between you and the exit. The last thing through is the radio signal; all three drivers remain in the Upside Down. Restart the campaign and bring the missing safety equipment.":"O portão se abre, mas o comboio danificado não consegue alcançá-lo. O Mind Flayer cai entre você e a saída. A última coisa a passar é o sinal de rádio; todos os três pilotos permanecem no Upside Down. Reinicie a campanha e traga os equipamentos de segurança que faltam.","The Gate opens while the Demodogs close in. The Needle has split: when __LOST__ calls for help, the others hesitate one seco var LANGS={en:'English',de:'Deutsch',fr:'Français',it:'Italiano',es:'Español',
  ja:'日本語',zh:'中文',ru:'Русский',ar:'العربية',pt:'Português'};
var RTL_LANGS=['ar'];
var UI_EN={needle:'Needle',condition:'Condition',fuel:'Fuel',nerve:'Nerve',bloom:'Spores',
  holding:'Holding',fraying:'Fraying',split:'Split',correct:'Correct',notquite:'Not quite',empty:'Empty'};
var savedLanguage='en';
try{savedLanguage=localStorage.getItem('strangerGearsLanguage')||'en'}catch(e){}
if(!LANGS[savedLanguage])savedLanguage='en';
var lang='en';
function ft(source,vars){
  var translated=lang==='en'?source:((FULL_I18N[lang]||{})[source]||source);
  Object.keys(vars||{}).forEach(function(key){
    translated=translated.split('__'+key.toUpperCase()+'__').join(vars[key]);
  });
  return translated;
}
function t(k){return ft(UI_EN[k]||k)}

var completed=[];
try{completed=JSON.parse(localStorage.getItem('strangerGearsCompletedV3')||'[]')}catch(e){completed=[]}
var campaign={};
try{campaign=JSON.parse(localStorage.getItem('strangerGearsCampaignV3')||'{}')}catch(e){campaign={}}
if(completed.length>=3){
  completed=[];
  campaign={};
  try{localStorage.removeItem('strangerGearsCompletedV3');localStorage.removeItem('strangerGearsCampaignV3')}catch(e){}
}
var S={pov:null,art:null,route:null,rt:null,escape:null,needle:6,
       car:5,fuel:4,nerve:3,bloom:0,items:[],score:0,done:{},completed:completed};
if(campaign.items)S.items=campaign.items;
['needle','car','fuel','nerve','bloom','score'].forEach(function(k){if(campaign[k]!==undefined)S[k]=campaign[k]});
S.fate=null;S.hazardsDone={};S.hazardResults={};S.usedItems=[];

var deck=document.getElementById('deck');
var storyTemplate=document.getElementById('last-broadcast-story');
deck.insertBefore(storyTemplate.content.cloneNode(true),storyTemplate.nextSibling);
var all=[].slice.call(deck.querySelectorAll('.slide'));
var i=0;

function visible(){
  return all.filter(function(s){
    if(s.getAttribute('data-first-only')==='yes'&&S.completed.length>0)return false;
    var w=s.getAttribute('data-when'); if(!w) return true;
    var p=w.split(':');
    if(p[0]==='all')return (S.completed.length>=2?'yes':'no')===p[1];
    return S[p[0]]===p[1];
  });
}
function gauge(key,val,cls){
  return '<div class="gauge '+(cls||'')+'"><div class="gl"><span>'+t(key)+'</span><span>'+val+'/5</span></div>'
    +'<div class="gt"><div class="gf" style="width:'+(val*20)+'%"></div></div></div>';
}
function tele(){
  document.getElementById('tele').innerHTML=
    gauge('condition',S.car,S.car<=2?'warn':'')+gauge('fuel',S.fuel,S.fuel<=1?'warn':'')
   +gauge('nerve',S.nerve,S.nerve<=1?'warn':'')+gauge('bloom',S.bloom,'bloom');
  document.getElementById('bootcount').textContent=ft(S.items.length===1?'__COUNT__ item':'__COUNT__ items',{count:S.items.length});
  document.getElementById('bootlist').innerHTML=S.items.length
    ?S.items.map(function(item){return '<span class="inventory-item">'+ft(item)+'</span>'}).join('')
    :'<span class="inventory-item">'+t('empty')+'</span>';
}
function hasAny(names){return names.some(function(n){return S.items.indexOf(n)>-1})}
function renderHazard(kind){
  var r=S.hazardResults[kind],el=document.getElementById('hazard-'+kind);if(!r||!el)return;
  var safeText={
    sound:'You deploy the __ITEM__. The pack veers after the false engine note, buying all three cars a clear lane.',
    power:'The __ITEM__ blocks the copied signal. May keeps the ignition alive and calls the lightning strike exactly once.',
    traction:'The __ITEM__ finds purchase where the road has become flesh. The convoy climbs out before the vines close.'
  };
  var failText={
    sound:'You have nothing that can mask or divert the engines. Demodogs strike both rear cars, and May shouts that Clarkson has drawn them onto everyone.',
    power:'The Mind Flayer enters the ignition circuit. All three engines die together; restarting them burns fuel and strips teeth from the Bruiser\'s starter.',
    traction:'The wheels sink to their hubs. They leave the cars to push, breathing spores while tendrils close around the axles.'
  };
  el.innerHTML=r.safe
    ?'<p>'+ft(safeText[kind],{item:'<b>'+ft(r.item)+'</b>'})+'</p><span class="gain">'+ft('Artefact used · no loss')+'</span>'
    :'<p>'+ft(failText[kind])+'</p><span class="gain cost">'+ft(r.cost)+'</span>';
  if(r.sporeUsed)el.innerHTML+='<p class="gain">'+ft('Spore filter used · spores −1')+'</p>';
}
function resolveHazard(kind){
  if(S.hazardsDone[kind]){renderHazard(kind);return;}
  S.hazardsDone[kind]=true;
  var safe=false,item='',cost='',sporeUsed=false;
  if(kind==='sound'){
    var soundItems=['Sound-dampening blanket','Sonic flare launcher','Honest CB recording','Original distress tape','Suppression bottles'];
    safe=hasAny(soundItems);item=soundItems.find(function(x){return S.items.indexOf(x)>-1})||'';
    if(!safe){S.nerve=Math.max(0,S.nerve-2);S.needle=Math.max(0,S.needle-1);cost='Nerve −2 · Needle −1';}
  }else if(kind==='power'){
    var powerItems=['Faraday ignition cage','Eleven-second lightning timer','Phase inverter','Warm armoured cable'];
    safe=hasAny(powerItems);item=powerItems.find(function(x){return S.items.indexOf(x)>-1})||'';
    if(!safe){S.fuel=Math.max(0,S.fuel-2);S.car=Math.max(0,S.car-1);cost='Fuel −2 · Condition −1';}
  }else{
    var tractionItems=['Reinforced tyre chains','Shared tunnel map','Nitrous purge switch','Tow chain','Foundry gate key','Drain bolt cutters','Gate-phase compass'];
    safe=hasAny(tractionItems);item=tractionItems.find(function(x){return S.items.indexOf(x)>-1})||'';
    if(!safe){S.car=Math.max(0,S.car-2);S.bloom=Math.min(5,S.bloom+2);cost='Condition −2 · Spores +2';}
    if(S.items.indexOf('Spore filter')>-1&&S.bloom>0){
      S.bloom=Math.max(0,S.bloom-1);sporeUsed=true;
      if(S.usedItems.indexOf('Spore filter')<0)S.usedItems.push('Spore filter');
    }
  }
  if(safe&&S.usedItems.indexOf(item)<0)S.usedItems.push(item);
  S.hazardResults[kind]={safe:safe,item:item,cost:cost,sporeUsed:sporeUsed};
  renderHazard(kind);
  if(S.car<=0||S.fuel<=0||S.bloom>=5)S.fate='trapped';
  else if(band()==='split')S.fate='sacrifice';
  else S.fate='all';
  tele();needleUI();
}
function endingCopy(method){
  if(S.car<=0||S.fuel<=0||S.bloom>=5)S.fate='trapped';
  else if(band()==='split')S.fate='sacrifice';
  else S.fate='all';
  if(S.fate==='trapped')return ft('The Gate opens, but the damaged convoy cannot reach it. The Mind Flayer drops between you and the exit. The last thing through is the radio signal; all three drivers remain in the Upside Down. Restart the campaign and bring the missing safety equipment.');
  if(S.fate==='sacrifice'){
    var lost=S.pov==='denny'?'Clarkson':S.pov==='cal'?'Hamster':'May';
    return ft('The Gate opens while the Demodogs close in. The Needle has split: when __LOST__ calls for help, the others hesitate one second too long. Two cars reach Halloway. __LOST__ turns back into the red storm to hold the pack away, and does not come through.',{lost:lost});
  }
  var used=S.usedItems.slice(-3);
  return (used.length?ft('Recovered equipment carries the convoy through the final pursuit: __ITEMS__.',{items:used.map(function(x){return ft(x)}).join(', ')})+' ':'')+
    ft('All three cars burst out of the Upside Down seconds before the Mind Flayer reaches the road. The Gate seals behind them at the county line.');
}
function show(){
  var seq=visible();
  if(i>=seq.length)i=seq.length-1; if(i<0)i=0;
  all.forEach(function(s){s.classList.remove('on')});
  seq[i].classList.add('on');
  var onCover=seq[i].getAttribute('data-type')==='cover';
  document.getElementById('tele').style.display=onCover?'none':'flex';
  document.getElementById('boot').style.display=onCover?'none':'flex';
  document.getElementById('chrome').style.display=onCover?'none':'flex';
  document.getElementById('bootpanel').hidden=true;
  document.getElementById('boot').setAttribute('aria-expanded','false');
  var hazard=seq[i].getAttribute('data-hazard');if(hazard)resolveHazard(hazard);
  if(seq[i].getAttribute('data-when')&&seq[i].getAttribute('data-when').indexOf('escape:')===0){
    var ep=seq[i].querySelector('p[id^=ending-]');if(ep)ep.textContent=endingCopy(S.escape);
  }
  var pct=(i+1)/seq.length;
  document.getElementById('barfill').style.width=(pct*100)+'%';
  odometer(Math.round((1-pct)*11840));
  needleUI(); tele();
  var blocked=seq[i].getAttribute('data-type')==='choose' && seq[i].getAttribute('data-chosen')!=='yes';
  document.getElementById('next').disabled = blocked || i>=seq.length-1;
  document.getElementById('prev').disabled = i<=0;
  if(seq[i].getAttribute('data-type')==='results')results();
}
function odometer(n){
  var s=String(n),h=''; while(s.length<6)s='0'+s;
  for(var k=0;k<6;k++)h+='<span class="'+(k>3?'hot':'')+'">'+s[k]+'</span>';
  document.getElementById('odo').innerHTML=h;
}
function band(){return S.needle>=6?'holding':S.needle>=4?'fraying':'split'}
function needleUI(){
  var el=document.getElementById('nd'),b=band();
  el.className='needle '+(b==='holding'?'':b==='fraying'?'fray':'split');
  el.innerHTML='<span>'+t('needle')+'</span> <b>'+t(b)+'</b>';
}
function go(d){i+=d;show()}
document.getElementById('next').onclick=function(){go(1)};
document.getElementById('prev').onclick=function(){go(-1)};
var bootButton=document.getElementById('boot'),bootPanel=document.getElementById('bootpanel');
bootButton.onclick=function(){
  var opening=bootPanel.hidden;
  bootPanel.hidden=!opening;
  bootButton.setAttribute('aria-expanded',opening?'true':'false');
};
document.getElementById('bootclose').onclick=function(){
  bootPanel.hidden=true;bootButton.setAttribute('aria-expanded','false');bootButton.focus();
};
deck.addEventListener('click',function(e){
  var n=e.target.closest?e.target.closest('[data-nav=next]'):null; if(n)go(1);
});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'&&!document.getElementById('next').disabled)go(1);
  if(e.key==='ArrowLeft'&&!document.getElementById('prev').disabled)go(-1);
});

function applySet(str){
  str.split(';').forEach(function(kv){
    var p=kv.split('='),k=p[0],v=p[1];
    if(k==='needle')S.needle=Math.max(0,Math.min(10,S.needle+parseInt(v,10)));
    else if(k==='item'){if(S.items.indexOf(v)<0)S.items.push(v)}
    else if(['car','fuel','nerve','bloom'].indexOf(k)>-1)
      S[k]=Math.max(0,Math.min(5,S[k]+parseInt(v,10)));
    else S[k]=v;
  });
}
[].slice.call(deck.querySelectorAll('.opt[data-set]')).forEach(function(b){
  var initialSet=b.getAttribute('data-set');
  var povMatch=initialSet.match(/(?:^|;)pov=([^;]+)/);
  if(povMatch&&S.completed.indexOf(povMatch[1])>-1){
    b.disabled=true;b.style.opacity=.35;
    var finished=document.createElement('small');finished.textContent=ft('Story completed');b.querySelector('span:last-child').appendChild(finished);
  }
  b.onclick=function(){
    applySet(b.getAttribute('data-set'));
    var par=b.parentNode.parentNode;
    [].slice.call(par.querySelectorAll('.opt')).forEach(function(o){
      o.disabled=true; if(o!==b)o.style.opacity=.45;
    });
    b.classList.add('correct');
    /* Mark the slide as answered. The Next button used to infer this from
       "is any option disabled", which is false on the second and third runs:
       a completed driver's button is already disabled before the player has
       touched anything, so Next went live and one press skipped the whole
       story. Record the choice instead of guessing at it. */
    var slideEl=b.closest?b.closest('.slide'):null;
    if(slideEl)slideEl.setAttribute('data-chosen','yes');
    show();
  };
});

[].slice.call(deck.querySelectorAll('[data-type=mc]')).forEach(function(sl){
  var opts=[].slice.call(sl.querySelectorAll('.opt')),wrap=sl.querySelector('.options');
  for(var k=opts.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));wrap.appendChild(opts[j]);opts.splice(j,1)}
  [].slice.call(sl.querySelectorAll('.opt')).forEach(function(o,n){
    o.querySelector('.ltr').textContent='ABCD'[n];
    o.onclick=function(){
      var q=sl.getAttribute('data-q'); if(S.done[q])return; S.done[q]=1;
      var ok=o.hasAttribute('data-correct');
      var dn=parseInt(sl.getAttribute('data-needle')||'0',10);
      var reward=sl.getAttribute('data-reward');
      if(ok){S.score++;if(dn)S.needle=Math.min(10,S.needle+dn);if(reward&&S.items.indexOf(reward)<0)S.items.push(reward)}
      else {S.needle=Math.max(0,S.needle-1);S.nerve=Math.max(0,S.nerve-1)}
      [].slice.call(sl.querySelectorAll('.opt')).forEach(function(x){
        x.disabled=true;
        if(x.hasAttribute('data-correct'))x.classList.add('correct');
        else if(x===o)x.classList.add('wrong');
      });
      var fb=sl.querySelector('.feedback');
      fb.className='feedback show'+(ok?'':' no');
      fb._feedbackOk=ok;fb._feedbackReward=reward||'';
      fb.innerHTML='<b>'+(ok?t('correct'):t('notquite'))+'.</b> '+ft(fb.getAttribute('data-explain'))+
        (ok&&reward?' <b>'+ft('Reward acquired: __ITEM__.',{item:ft(reward)})+'</b>':'');
      needleUI(); tele();
    };
  });
});

function results(){
  if(S.pov&&S.completed.indexOf(S.pov)<0){
    S.completed.push(S.pov);
    try{localStorage.setItem('strangerGearsCompletedV3',JSON.stringify(S.completed))}catch(e){}
  }
  try{localStorage.setItem('strangerGearsCampaignV3',JSON.stringify({items:S.items,needle:S.needle,car:S.car,fuel:S.fuel,nerve:S.nerve,bloom:S.bloom,score:S.score}))}catch(e){}
  document.getElementById('sc').textContent=S.score;
  document.getElementById('bandline').textContent=t('needle')+': '+t(band());
  var names={denny:'Clarkson · the Bruiser',cal:'Hamster · the three-wheeler',ray:'May · the estate'};
  document.getElementById('reslog').textContent=ft(S.items.length===1
    ?'__NAME__ reached the elevator with __COUNT__ artefact.'
    :'__NAME__ reached the elevator with __COUNT__ artefacts.',
    {name:names[S.pov]||ft('Driver'),count:S.items.length});
  document.getElementById('carry').textContent=
    band().toUpperCase()+' · '+S.car+S.fuel+S.nerve+S.bloom;
  var finalRun=S.completed.length>=3;
  document.getElementById('result-eyebrow').textContent=finalRun?ft('End of Part III · 02:24 · beyond Halloway'):ft('Driver story __COUNT__ of 3 complete',{count:S.completed.length});
  var finalTitle=S.fate==='trapped'?'No one reached the Gate':S.fate==='sacrifice'?'Only two drivers came back':'All three drivers escaped';
  document.getElementById('result-title').textContent=finalRun?ft(finalTitle):ft('Choose another driver to continue');
  document.getElementById('result-copy').textContent=finalRun
    ?endingCopy(S.escape)
    :ft('This driver has reached the grain elevator. Complete the remaining character stories to unlock the shared climax and final escape.');
  document.getElementById('again').textContent=finalRun?ft('Play all stories again'):ft('Choose the next driver');
}
document.getElementById('again').onclick=function(){
  if(S.completed.length>=3){try{localStorage.removeItem('strangerGearsCompletedV3');localStorage.removeItem('strangerGearsCampaignV3')}catch(e){}}
  location.reload();
};
document.getElementById('reset-stories').onclick=function(){
  try{localStorage.removeItem('strangerGearsCompletedV3');localStorage.removeItem('strangerGearsCampaignV3')}catch(e){}
  location.reload();
};

var sel=document.getElementById('langsel');
Object.keys(LANGS).forEach(function(code){
  var o=document.createElement('option');o.value=code;o.textContent=LANGS[code];sel.appendChild(o);
});
var translationNodes=[],translationAttrs=[];
function captureTranslationSources(){
  var walker=document.createTreeWalker(deck,NodeFilter.SHOW_TEXT,null);
  var node;
  while((node=walker.nextNode())){
    var raw=node.nodeValue,source=raw.replace(/\s+/g,' ').trim();
    if(!source)continue;
    var leading=(raw.match(/^\s*/)||[''])[0],trailing=(raw.match(/\s*$/)||[''])[0];
    translationNodes.push({node:node,source:source,leading:leading,trailing:trailing});
  }
  [].slice.call(deck.querySelectorAll('[aria-label]')).forEach(function(el){
    translationAttrs.push({el:el,name:'aria-label',source:el.getAttribute('aria-label')});
  });
}
function applyFullLanguage(){
  document.documentElement.lang=lang;
  document.documentElement.dir=RTL_LANGS.indexOf(lang)>-1?'rtl':'ltr';
  document.title=ft('Stranger Gears — The Last Broadcast');
  translationNodes.forEach(function(record){
    record.node.nodeValue=record.leading+ft(record.source)+record.trailing;
  });
  translationAttrs.forEach(function(record){record.el.setAttribute(record.name,ft(record.source))});
  [].slice.call(deck.querySelectorAll('.feedback.show')).forEach(function(fb){
    if(fb._feedbackOk===undefined)return;
    fb.innerHTML='<b>'+(fb._feedbackOk?t('correct'):t('notquite'))+'.</b> '+ft(fb.getAttribute('data-explain'))+
      (fb._feedbackOk&&fb._feedbackReward?' <b>'+ft('Reward acquired: __ITEM__.',{item:ft(fb._feedbackReward)})+'</b>':'');
  });
  Object.keys(S.hazardResults).forEach(renderHazard);
  var ending=deck.querySelector('.slide.on p[id^=ending-]');if(ending)ending.textContent=endingCopy(S.escape);
  if(deck.querySelector('.slide.on[data-type=results]'))results();
  needleUI();tele();
}
sel.onchange=function(){
  lang=sel.value;
  try{localStorage.setItem('strangerGearsLanguage',lang)}catch(e){}
  applyFullLanguage();
};
captureTranslationSources();
lang=savedLanguage;sel.value=lang;applyFullLanguage();

function fit(){deck.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}
addEventListener('resize',fit);fit();

[].slice.call(document.querySelectorAll('.logo')).forEach(function(l){l.innerHTML=LOGO});
function revealLogos(){[].slice.call(document.querySelectorAll('.logo')).forEach(function(l){l.classList.add('ready')})}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(revealLogos)}
setTimeout(revealLogos,1500);
show();
</script>
</body>
