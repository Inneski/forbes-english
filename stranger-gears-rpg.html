<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stranger Gears — The Last Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ============ REPLACE 1 of 2 — hero + palette ============ */
:root{
  --hero: url('StrangerGears/hero.jpg');

  --void:          #120A0A;
  --surface:       #221414;
  --surface2:      #2D1C1D;
  --border:        #4F3333;
  --text:          #F3EFEF;
  --text-dim:      #C3B4B4;
  --accent:        #B22E30;
  --accent-bright: #DA6C6D;
  --accent-dim:    #711D1F;
  --secondary:     #477AAE;
  --contrast:      #47D18A;

  --logo-mark: var(--contrast);
  --bg-opacity: 0.62;

  /* tense colour system — lesson-template/tense-palette.css */
  --t-past-simple:  #B08968;
  --t-past-perfect: #6E0B24;
  --t-pp-lit: color-mix(in srgb, var(--t-past-perfect) 55%, white);
}
/* ============ end REPLACE 1 of 2 ============ */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--text);
  font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#deck{width:1280px;height:720px;position:relative;transform-origin:center center;
  background:var(--void);overflow:hidden}

.slide{position:absolute;inset:0;padding:64px;display:none;flex-direction:column}
.slide.on{display:flex}
.slide:not([data-type=cover])::before{content:'';position:absolute;inset:0;
  background:var(--hero) center/cover no-repeat;opacity:var(--bg-opacity);
  filter:saturate(.95) contrast(1.04);z-index:0}
.slide:not([data-type=cover])::after{content:'';position:absolute;inset:0;z-index:0;
  background:linear-gradient(180deg,#120A0AA6 0%,#120A0A5C 45%,#120A0AB8 100%)}
.slide>*{position:relative;z-index:2}

/* ---- cover ---- */
[data-type=cover]{background:var(--hero) center/cover no-repeat;justify-content:flex-start}
[data-type=cover]::before{content:'';position:absolute;inset:0;z-index:1;
  background:radial-gradient(105% 92% at 78% 46%,#120A0A96 0%,#120A0A54 38%,#120A0A05 74%)}
.cover-inner{max-width:660px;margin:0 0 0 auto;text-align:right}
.cover h1{font-family:'Playfair Display',serif;font-weight:900;font-size:62px;
  line-height:1.03;margin:0 0 12px}
.cover .lede{font-size:20px;color:var(--text-dim);max-width:520px;margin-left:auto}
.begin{margin-top:34px}

/* ---- logo ---- */
.logo{display:block;opacity:0;direction:ltr;unicode-bidi:isolate}
.logo.ready{opacity:1;transition:opacity .35s}
.logo--cover{width:232px;position:absolute;top:64px;left:64px}
.logo--slide{width:152px;position:absolute;top:34px;right:64px;z-index:3}
.mark{fill:var(--logo-mark)}
.word{fill:var(--text);font-family:'DM Sans',sans-serif;font-weight:600;
  font-size:20.8px;letter-spacing:8px}

/* ---- typography ---- */
.eyebrow{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent-bright)}
h2{font-family:'Playfair Display',serif;font-weight:700;font-size:38px;
  line-height:1.1;margin:10px 0 22px;max-width:900px}
.stem{font-size:25px;line-height:1.35;margin-bottom:20px;max-width:940px}
p{font-size:19px;line-height:1.55}
p+p{margin-top:14px}

/* ---- cards ---- */
.card{background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(3px);border:1px solid var(--border);
  padding:22px 24px;border-radius:3px}
.card+.card{margin-top:14px}
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;align-items:stretch}
.cols .card+.card{margin-top:0}
.cols .card{display:flex;flex-direction:column}
.who{font-family:'Playfair Display',serif;font-size:23px;margin-bottom:4px}
.role{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--secondary);margin-bottom:10px}
.card p{font-size:18px}

/* ---- options ---- */
.options{display:grid;gap:10px;margin-top:4px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:14px 18px;font:400 19px/1.4 'DM Sans',sans-serif;cursor:pointer;
  border-radius:3px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--contrast);outline-offset:2px}
.opt .ltr{font-family:'DM Mono',monospace;font-size:14px;color:var(--text-dim);
  padding-top:2px;min-width:18px}
.opt small{display:block;font-size:15px;color:var(--text-dim);margin-top:5px}
.opt.correct{border-color:var(--contrast);background:#174D35;color:#fff}
.opt.wrong{border-color:var(--accent);opacity:.62}
.opt:disabled{cursor:default}

/* ---- gaps ---- */
.gap-row{display:flex;flex-direction:column;gap:10px}
.gap-row+.gap-row{margin-top:12px}
.gap-sentence{font-size:20px;line-height:1.5}
.cue{font-family:'DM Mono',monospace;font-size:15px;color:var(--secondary)}
.gap-in{display:flex;gap:10px}
input[type=text]{flex:1;background:var(--void);border:1px solid var(--border);
  color:var(--text);padding:11px 14px;font:400 19px 'DM Sans',sans-serif;border-radius:3px}
input[type=text]:focus{outline:none;border-color:var(--contrast)}

.feedback{font-size:17px;line-height:1.45;min-height:0;display:none}
.feedback.show{display:block;margin-top:12px}
.feedback b{color:var(--contrast)}
.feedback.no b{color:var(--accent-bright)}

button.act{background:var(--accent);color:#fff;border:0;padding:13px 26px;
  font:700 17px 'DM Sans',sans-serif;cursor:pointer;border-radius:3px}
button.act:hover{background:var(--accent-dim)}
button.act:focus-visible{outline:2px solid var(--contrast);outline-offset:2px}
button.act[disabled]{opacity:.4;cursor:default}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}

/* ---- tense chips ---- */
.tense{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:3px 9px;border-radius:2px;color:var(--void);font-weight:500}
.tense.ps{background:var(--t-past-simple)}
.tense.pp{background:var(--t-pp-lit)}

/* ---- chrome ---- */
#chrome{position:absolute;left:64px;right:64px;bottom:26px;height:34px;z-index:5;
  display:flex;align-items:center;gap:20px}
.odo{display:flex;gap:3px;font-family:'DM Mono',monospace;font-size:15px}
.odo span{background:var(--surface2);border:1px solid var(--border);
  padding:3px 6px;border-radius:2px;color:var(--text-dim)}
.odo span.hot{color:var(--accent-bright);border-color:var(--accent-dim)}
.bar{flex:1;height:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.needle{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-dim)}
.needle b{color:var(--contrast)}
.needle.fray b{color:var(--t-past-simple)}
.needle.split b{color:var(--accent-bright)}
.nav{display:flex;gap:8px}
.nav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  width:34px;height:30px;cursor:pointer;font-size:15px;border-radius:2px}
.nav button:disabled{opacity:.3;cursor:default}
#langsel{position:absolute;top:30px;left:64px;z-index:6;background:var(--surface2);
  color:var(--text);border:1px solid var(--border);font:400 12px 'DM Mono',monospace;
  padding:5px 8px;border-radius:2px}

/* ---- results / activate ---- */
.score{font-family:'Playfair Display',serif;font-size:62px;line-height:1}
.band{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--contrast)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--contrast);color:var(--contrast);border-radius:2px;
  padding:5px 11px;font-family:'DM Mono',monospace;font-size:12px}
textarea{width:100%;height:118px;resize:none;background:var(--void);
  border:1px solid var(--border);color:var(--text);padding:12px;
  font:400 17px/1.45 'DM Sans',sans-serif;border-radius:3px}
textarea:focus{outline:none;border-color:var(--contrast)}
.wc{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-dim)}
.wc.ok{color:var(--contrast)}
.prompt-list li{font-size:18px;line-height:1.45;margin-left:20px}
.prompt-list li+li{margin-top:9px}
.print-mirror{display:none}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;height:auto}
  #stage{position:static;display:block}
  #deck{transform:none!important;width:1280px;height:auto}
  .slide{display:flex!important;position:relative;width:1280px;height:720px;
    page-break-after:always;background:var(--void)}
  .slide:not([data-type=cover]){background:var(--hero) center/cover no-repeat}
  #chrome,#langsel,.nav,.begin{display:none!important}
  textarea{display:none}
  .print-mirror{display:block;font-size:16px;line-height:1.5;
    border:1px solid var(--border);padding:10px;min-height:118px}
}
</style>
<style>
/* --- telemetry: condition / fuel / nerve / bloom, plus the boot --- */
#tele{position:absolute;top:28px;left:250px;z-index:5;display:flex;gap:16px;align-items:flex-start}
.gauge{min-width:96px}
.gauge .gl{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--text-dim);display:flex;justify-content:space-between}
.gauge .gt{height:4px;background:var(--surface2);margin-top:4px;overflow:hidden;border:1px solid var(--border)}
.gauge .gf{height:100%;background:var(--secondary);transition:width .3s}
.gauge.bloom .gf{background:var(--accent)}
.gauge.warn .gf{background:var(--t-past-simple)}
#boot{position:absolute;top:28px;right:64px;z-index:7;display:flex;align-items:center;gap:10px;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;
  font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;border-radius:3px}
#boot:hover,#boot[aria-expanded=true]{border-color:var(--contrast)}
#boot b{color:var(--contrast);font-size:10.5px}
#bootcount{color:var(--text-dim)}
#bootpanel{position:absolute;top:72px;right:64px;z-index:8;width:350px;max-height:500px;
  overflow:auto;background:#160d0df5;border:1px solid var(--contrast);padding:18px;
  box-shadow:0 18px 50px #000b}
#bootpanel[hidden]{display:none}
.boot-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--contrast)}
#bootclose{border:0;background:transparent;color:var(--text);font-size:22px;cursor:pointer;line-height:1}
#bootlist{display:flex;flex-wrap:wrap;gap:8px}
#bootlist .inventory-item{border:1px solid var(--border);background:var(--surface2);padding:7px 9px;
  color:var(--text-dim);font:11px/1.3 'DM Mono',monospace;letter-spacing:.03em}
.logo--slide{top:auto;bottom:60px;right:64px}
.beast{border-left:2px solid var(--accent);padding-left:16px}
.gain{font-family:'DM Mono',monospace;font-size:12px;color:var(--contrast);margin-top:8px;display:block}
.cost{color:var(--accent-bright)}
.ending-band{border:1px solid var(--contrast);padding:14px 18px;margin-top:12px}
.ending-band .en{font-family:'Playfair Display',serif;font-size:26px;color:var(--contrast)}
.ending-band.bad{border-color:var(--accent)}
.ending-band.bad .en{color:var(--accent-bright)}
@media print{#tele,#boot{display:flex}}
</style>
</head>
<body>

<div id="stage"><div id="deck">

<select id="langsel" aria-label="Language"></select>

<!-- ============ REPLACE 2 of 2 — slides ============ -->

<template id="last-broadcast-story">
<section class="slide cover on" data-type="cover" data-first-only="yes">
  <svg class="logo logo--cover" viewBox="0 0 200 78" role="img" aria-label="Forbes English"></svg>
  <div class="cover-inner">
    <div class="eyebrow">An interactive Stranger Things story</div>
    <h1>Stranger Gears</h1>
    <p class="lede">The Last Broadcast · Three drivers. Three confessions. One signal
      from the Upside Down that knows what each of them is trying not to say.</p>
    <div class="begin"><button class="act" data-nav="next">Begin transmission</button></div>
  </div>
</section>

<section class="slide" data-type="teach" data-first-only="yes">
  <div class="eyebrow">21:40 · Halloway · 97.3 FM</div>
  <h2>The radio says your name before you switch it on</h2>
  <div class="card">
    <p>Every receiver in town snaps to the same dead frequency. A grandfather clock
      chimes four times. Then your own voice begins describing a memory you have never
      told Clarkson, Hamster or May.</p>
    <p>Outside, red lightning opens a wound above the grain elevator. The broadcast
      ends with a promise: <b>at 02:17, one of you will choose who gets home.</b></p>
  </div>
</section>

<section class="slide" data-type="teach" data-first-only="yes">
  <div class="eyebrow">Field notes · what is hunting you</div>
  <h2>The signal has teeth</h2>
  <div class="cols" style="--n:3">
    <div class="card beast"><div class="who">Vecna</div><div class="role">Inside the broadcast</div>
      <p>He uses guilt as a doorway. Four chimes mean he has found yours.</p></div>
    <div class="card beast"><div class="who">Demodogs</div><div class="role">On every road</div>
      <p>Blind, fast and drawn to engines, voices and electrical current.</p></div>
    <div class="card beast"><div class="who">Mind Flayer</div><div class="role">Above the Gate</div>
      <p>A storm-shaped shadow descending one tendril at a time.</p></div>
  </div>
</section>

<section class="slide" data-type="teach" data-first-only="yes">
  <div class="eyebrow">How the campaign works</div>
  <h2>Every correct answer becomes survival equipment</h2>
  <div class="cols" style="--n:2">
    <div class="card"><p>Play all three drivers. Their stories are different and their
      equipment carries into the final run. Wrong answers cost nerve and trust.</p></div>
    <div class="card"><p>At the climax, sound, power and traction each demand an item.
      The Needle decides whether all three drivers help one another through the Gate.</p></div>
  </div>
</section>

<section class="slide" data-type="choose">
  <div class="eyebrow">Choose the next transmission</div>
  <h2>Whose voice answers the radio?</h2>
  <div class="options">
    <button class="opt" data-set="pov=denny;fuel=-1"><span class="ltr">1</span><span>Clarkson · the Bruiser
      <small>A V8, an empty bypass and the accident he insists was not his fault.</small></span></button>
    <button class="opt" data-set="pov=cal;item=Suppression bottles"><span class="ltr">2</span><span>Hamster · the three-wheeler
      <small>A storm drain, a failing headlamp and the friend he left behind once before.</small></span></button>
    <button class="opt" data-set="pov=ray;fuel=1"><span class="ltr">3</span><span>May · the diesel estate
      <small>A radio mast, a boot of numbered boxes and one message he never transmitted.</small></span></button>
  </div>
  <p style="margin-top:12px"><button class="act ghost" id="reset-stories">Reset all stories</button></p>
</section>

<!-- CLARKSON -->
<section class="slide" data-type="teach" data-when="pov:denny">
  <div class="eyebrow">Clarkson · 22:03 · Foundry Bypass</div>
  <h2>Your passenger is a cassette recorder</h2>
  <div class="card">
    <p>The tape plays the sound of rain, tyres and a young mechanic saying he trusts you.
      You remember sending him ahead in a car you knew had a bad steering rack.</p>
    <p>The clock chimes once. In the mirror, six Demodogs unfold from the verge and begin
      running. They are gaining whenever you lift off the throttle.</p>
  </div>
</section>

<section class="slide" data-type="mc" data-q="c1" data-reward="Sound-dampening blanket" data-when="pov:denny">
  <div class="eyebrow">Clarkson · pursuit · language under pressure</div>
  <p class="stem">Which sentence makes the earlier danger clear?</p>
  <div class="options">
    <button class="opt" data-correct><span class="ltr"></span><span>I knew the steering rack had already failed once</span></button>
    <button class="opt"><span class="ltr"></span><span>I knew the steering rack has fail tomorrow</span></button>
    <button class="opt"><span class="ltr"></span><span>I had knew the steering rack already failing</span></button>
    <button class="opt"><span class="ltr"></span><span>I knowed the steering rack had fails</span></button>
  </div>
  <div class="feedback" data-explain="Past perfect places the earlier failure before what you knew. The correct answer unlocks a blanket that masks the Bruiser's engine note."></div>
</section>

<section class="slide" data-type="choose" data-when="pov:denny">
  <div class="eyebrow">Clarkson · the first disagreement</div>
  <h2>Hamster asks whether the tape is true</h2>
  <div class="options">
    <button class="opt" data-set="art=confessed;needle=2;nerve=-1;item=Honest CB recording"><span class="ltr">1</span><span>Tell both of them the whole truth
      <small>The silence afterward is terrible, but they know what Vecna is using. <span class="gain">Needle +2 · nerve −1</span></small></span></button>
    <button class="opt" data-set="art=denied;needle=-2;nerve=1"><span class="ltr">2</span><span>Call the recording a fake
      <small>May says the rain on the tape matches the date. Hamster stops answering. <span class="gain cost">Needle −2</span></small></span></button>
  </div>
</section>

<section class="slide" data-type="teach" data-when="pov:denny">
  <div class="eyebrow">Clarkson · 22:19 · mirror check</div>
  <h2>One of them is on the roof</h2>
  <div class="card">
    <p>Claws punch through the headlining. Another Demodog runs level with your window.
      Ahead, the bypass ends at a barricade of abandoned cars. Vecna's voice says the
      mechanic's name through every speaker.</p>
    <p>You have eight seconds before the pack boxes you in.</p>
  </div>
</section>

<section class="slide" data-type="mc" data-q="c2" data-reward="Nitrous purge switch" data-when="pov:denny">
  <div class="eyebrow">Clarkson · eight seconds</div>
  <p class="stem">Which instruction is correct?</p>
  <div class="options">
    <button class="opt" data-correct><span class="ltr"></span><span>Keep the revs up before you release the clutch</span></button>
    <button class="opt"><span class="ltr"></span><span>Kept the revs before you releasing it</span></button>
    <button class="opt"><span class="ltr"></span><span>Keep the revs up before you released it tomorrow</span></button>
    <button class="opt"><span class="ltr"></span><span>Keeping revs before release clutch</span></button>
  </div>
  <div class="feedback" data-explain="The imperative keeps the sequence immediate. Correct: you wire a single-use nitrous purge that can break the pack's formation."></div>
</section>

<section class="slide" data-type="choose" data-when="pov:denny">
  <div class="eyebrow">Clarkson · escape the bypass</div>
  <h2>The barricade fills the windscreen</h2>
  <div class="options">
    <button class="opt" data-set="car=-1;fuel=-1;item=Tow chain"><span class="ltr">1</span><span>Ram a path through
      <small>The Bruiser loses its grille but tears a tow chain from the wreckage. <span class="gain cost">condition −1 · fuel −1</span></small></span></button>
    <button class="opt" data-set="nerve=-1;bloom=1;item=Foundry gate key"><span class="ltr">2</span><span>Dive through the foundry yard
      <small>The pack follows you inside; the spores are thick, but a gate key hangs by the furnace. <span class="gain cost">spores +1</span></small></span></button>
  </div>
</section>

<section class="slide" data-type="teach" data-when="pov:denny">
  <div class="eyebrow">Clarkson · 23:06 · transmission ends</div>
  <h2>You reach the elevator with bite marks in the roof</h2>
  <div class="card"><p>The tape has stopped, but the young mechanic's voice now comes
    from the red clouds. You leave the Bruiser idling. Whatever happens at 02:17, noise
    will be your weapon—and perhaps your apology.</p></div>
</section>

<!-- HAMSTER -->
<section class="slide" data-type="teach" data-when="pov:cal">
  <div class="eyebrow">Hamster · 22:03 · North Drain</div>
  <h2>Your missing friend knocks from inside the pipe</h2>
  <div class="card">
    <p>The three-wheeler barely fits. Behind you, something crawls through the dark using
      your friend's voice. Years ago, when his car rolled, you ran for help and did not
      go back. Vecna calls that abandonment.</p>
    <p>The clock chimes once. Your headlamp dies. The scraping becomes a sprint.</p>
  </div>
</section>

<section class="slide" data-type="mc" data-q="h1" data-reward="Sonic flare launcher" data-when="pov:cal">
  <div class="eyebrow">Hamster · pursuit · listen</div>
  <p class="stem">Which sentence correctly describes the sound?</p>
  <div class="options">
    <button class="opt" data-correct><span class="ltr"></span><span>I could hear something gaining on me</span></button>
    <button class="opt"><span class="ltr"></span><span>I could heard something gained tomorrow</span></button>
    <button class="opt"><span class="ltr"></span><span>I can hearing something to gain me</span></button>
    <button class="opt"><span class="ltr"></span><span>I could have hear something gains</span></button>
  </div>
  <div class="feedback" data-explain="Hear + object + -ing describes an action in progress. Correct: you build a sonic flare launcher from a suppression bottle and the horn relay."></div>
</section>

<section class="slide" data-type="choose" data-when="pov:cal">
  <div class="eyebrow">Hamster · the first disagreement</div>
  <h2>Clarkson tells you to turn back</h2>
  <div class="options">
    <button class="opt" data-set="art=trusted;needle=2;item=Shared tunnel map"><span class="ltr">1</span><span>Send both drivers your exact route
      <small>If you vanish, they can still find you. <span class="gain">Needle +2</span></small></span></button>
    <button class="opt" data-set="art=withheld;needle=-2;nerve=1"><span class="ltr">2</span><span>Say the signal is breaking up
      <small>You refuse to be rescued by someone you do not trust. <span class="gain cost">Needle −2</span></small></span></button>
  </div>
</section>

<section class="slide" data-type="teach" data-when="pov:cal">

t einmal. Ihr Scheinwerfer ist kaputt. Das Schaben wird zum Sprint.","Sonic flare launcher":"Sonic Flare Launcher","Hamster · pursuit · listen":"Hamster · Verfolgung · Zuhören","Which sentence correctly describes the sound?":"Welcher Satz beschreibt den Laut richtig?","I could hear something gaining on me":"Ich konnte hören, wie etwas auf mich zukam","I could heard something gained tomorrow":"Ich konnte hören, dass morgen etwas gewonnen wurde","I can hearing something to gain me":"Ich kann etwas hören, das mich gewinnt","I could have hear something gains":"Ich hätte etwas hören können","Hear + object + -ing describes an action in progress. Correct: you build a sonic flare launcher from a suppression bottle and the horn relay.":"Hear + object + -ing beschreibt eine laufende Aktion. Richtig: Sie bauen aus einer Unterdrückungsflasche und dem Hornrelais einen Schallraketenwerfer.","Hamster · the first disagreement":"Hamster · die erste Meinungsverschiedenheit","Clarkson tells you to turn back":"Clarkson fordert Sie auf, umzukehren","Shared tunnel map":"Gemeinsame Tunnelkarte","Send both drivers your exact route":"Senden Sie beiden Fahrern Ihre genaue Route","If you vanish, they can still find you.":"Wenn du verschwindest, können sie dich immer noch finden.","Needle +2":"Nadel +2","Say the signal is breaking up":"Angenommen, das Signal wird unterbrochen","You refuse to be rescued by someone you do not trust.":"Sie weigern sich, von jemandem gerettet zu werden, dem Sie nicht vertrauen.","Hamster · 22:31 · the flooded chamber":"Hamster · 22:31 · die überflutete Kammer","The tunnel opens into the Upside Down":"Der Tunnel öffnet sich ins Upside Down","Red lightning flashes beneath black water. A Demodog drops between you and the exit; three more splash down behind. The three-wheeler tips onto two wheels as you circle the chamber.":"Rote Blitze zucken unter schwarzem Wasser. Ein Demodog fällt zwischen Sie und den Ausgang; drei weitere plätschern dahinter. Das Dreirad kippt auf zwei Räder, während Sie die Kammer umrunden.","Your friend's voice asks why you left. The water begins climbing the tyres.":"Die Stimme deines Freundes fragt, warum du gegangen bist. Das Wasser beginnt an den Reifen hochzusteigen.","Reinforced tyre chains":"Verstärkte Reifenketten","Hamster · water rising":"Hamster · Wasser steigt","Which deduction is correct?":"Welche Schlussfolgerung ist richtig?","The Gate must have opened below the chamber":"Das Tor muss sich unterhalb der Kammer geöffnet haben","The Gate must opened below it":"Das Tor muss sich darunter öffnen","The Gate has must opening below it":"Das Tor hat unten eine große Öffnung","The Gate must have open tomorrow":"Das Tor muss morgen geöffnet sein","Must have + past participle expresses a strong deduction about the past. Correct: you recover tyre chains from a submerged maintenance cart.":"Must have + Partizip Perfekt drückt eine starke Schlussfolgerung über die Vergangenheit aus. Richtig: Sie bergen Schneeketten aus einem untergetauchten Wartungswagen.","Hamster · escape the chamber":"Hamster · Entkomme aus der Kammer","The pack closes the circle":"Das Rudel schließt den Kreis","Spore filter":"Sporenfilter","Fire the suppression bottles into the water":"Feuere die Unterdrückungsflaschen ins Wasser","The chemical fog blinds the pack and leaves one usable respirator filter.":"Der chemische Nebel blendet die Packung und hinterlässt einen nutzbaren Atemschutzfilter.","fuel −1":"Kraftstoff −1","Drain bolt cutters":"Bolzenschneider ablassen","Cut the floodgate chain":"Durchtrennen Sie die Schleusenkette","The current tears a panel from the van but sweeps the Demodogs away.":"Die Strömung reißt eine Platte vom Van, schwemmt aber die Demodogs mit.","condition −1 · nerve −1":"Bedingung −1 · Nerv −1","Hamster · 23:06 · transmission ends":"Hamster · 23:06 · Übertragung endet","You emerge beneath the grain elevator":"Sie tauchen unter dem Getreideelevator auf","The hidden road ends at a living cable the width of sent perfect makes the pulse complete before the cut. Correct: you calibrate a timer to the eleven-second cycle.":"Das Perfekt der Gegenwart vervollständigt den Puls vor dem Schnitt. Richtig: Sie kalibrieren einen Timer auf den Elf-Sekunden-Zyklus.","May · escape the mast":"Mai · dem Mast entkommen","The runner reaches the rear door":"Der Läufer erreicht die Hintertür","Phase inverter":"Phasenwender","Reverse the alternator through the cable":"Drehen Sie die Lichtmaschine über das Kabel um","The electrical backlash throws the creature clear.":"Der elektrische Rückschlag wirft die Kreatur weg.","Warm armoured cable":"Warme Panzerkabel","Drive through the mast supports":"Fahren Sie durch die Maststützen","The roof buckles, but you leave with the cable wound around the towbar.":"Das Dach knickt ein, aber Sie fahren mit um die Anhängerkupplung gewickeltem Kabel davon.","condition −1 · spores +1":"Zustand −1 · Sporen +1","May · 23:06 · transmission ends":"Mai · 23:06 · Übertragung endet","The impossible coordinates point to the elevator":"Die unmöglichen Koordinaten deuten auf den Aufzug","The distress call was never from the winter storm. It came from tonight, through the Gate, in your colleague's voice. You finally transmit the coordinates to Clarkson and Hamster. Both answer.":"Der Notruf kam nie vom Wintersturm. Es kam von heute Abend, durch das Tor, mit der Stimme Ihres Kollegen. Sie übermitteln schließlich die Koordinaten an Clarkson und Hamster. Beide antworten.","02:03 · grain elevator · final transmission":"02:03 · Getreideelevator · Endgetriebe","Vecna plays all three confessions at once":"Vecna spielt alle drei Geständnisse gleichzeitig","The clocks chime twice. Clarkson hears the mechanic. Hamster hears the friend in the drain. May hears the unanswered distress call. Each voice tells its driver that the other two already crossed the Gate without him.":"Die Uhren schlagen zweimal. Clarkson hört den Mechaniker. Hamster hört den Freund im Abfluss. May hört den unbeantworteten Notruf. Jede Stimme sagt ihrem Fahrer, dass die anderen beiden bereits ohne ihn das Tor überquert haben.","Then the Mind Flayer descends. The yard turns grey and all three cars fall upward into the Upside Down. Demodogs pour from the elevator before the wheels land.":"Dann steigt der Mind Flayer herab. Der Hof wird grau und alle drei Autos fallen auf den Kopf. Demodogs strömen aus dem Aufzug, bevor die Räder landen.","Gate-phase compass":"Gate-Phasenkompass","02:12 · Vecna is counting down":"02:12 · Vecna zählt herunter","Five minutes.":"Fünf Minuten.","The Mind Flayer is lowering a hand over the only tear back to Halloway.":"Der Mind Flayer senkt eine Hand über die einzige Träne zurück zu Halloway.","Which sentence keeps the team together?":"Welcher Satz hält das Team zusammen?","We leave after everyone has reached the Gate":"Wir gehen, nachdem alle das Tor erreicht haben","We left after everyone will reaching it":"Wir gingen, nachdem alle angekommen waren","We leave after everyone have reach yesterday":"Wir brechen auf, nachdem alle gestern angekommen sind","We are leave before everyone reaching":"Wir gehen, bevor alle ankommen","Present simple after after expresses the future condition. Correct: the repaired compass points to the moving Gate rather than north.":"Present simple after after drückt den zukünftigen Zustand aus. Richtig: Der reparierte Kompass zeigt auf das sich bewegende Tor und nicht nach Norden.","02:14 · obstacle one · sound":"02:14 · Hindernis eins · Ton","The pack hears three engines":"Das Rudel hört drei Motoren","02:15 · obstacle two · power":"02:15 · Hindernis zwei · Kraft","Vecna reaches into the ignition":"Vecna greift in die Zündung","02:16 · obstacle three · traction":"02:16 · Hindernis drei · Traktion","The road becomes living mud":"Die Straße wird zu lebendigem Schlamm","02:17 · the last broadcast":"02:17 · die letzte Sendung","How do you force the Gate open?":"Wie öffnet man das Tor mit Gewalt?","Clarkson rams the living cable":"Clarkson rammt das lebende Kabel","Brute force. The Gate opens wide, but the Bruiser may not restart.":"Brutale Gewalt. Das Tor öffnet sich weit, aber der Bruiser darf nicht neu starten.","Hamster draws the pack into the drain":"Hamster zieht die Packung in den Abfluss","It clears the road, but someone must remain behind until the last second.":"Es gibt die Straße frei, aber jemand muss bis zur letzten Sekunde zurückbleiben.","May reverses the final transmission":"May kehrt die endgültige Übertragung um","The signal becomes a road home—if the estate has enough fuel to hold it.":"Das Signal wird zur Straße nach Hause – wenn das Anwesen genug Treibstoff hat, um es zu halten.","Conclusion · impact":"Fazit · Wirkung","The Bruiser hits the Gate at sixty":"Der Bruiser erreicht das Tor bei sechzig","Outcome":"Ergebnis","Conclusion · the decoy":"Fazit · der Lockvogel","The smallest engine turns back":"Die kleinste Lokomotive dreht zurück","Conclusion · the reversed signal":"Fazit · das umgekehrte Signal","The radio becomes a doorway":"Das Radio wird zur Tür","Transmission complete":"Übertragung abgeschlossen","One voice has reached the elevator":"Eine Stimme hat den Aufzug erreicht","Complete the remaining transmissions.":"Schließen Sie die verbleibenden Übertragungen ab.","Play next driver":"Nächsten Fahrer abspielen","Condition":"Bedingung","Fuel":"Kraftstoff","Nerve":"Nerv","Spores":"Sporen","Needle":"Nadel","Holding":"Halten","Fraying":"Ausfransen","Split":"Split","Boot":"Booten","Empty":"Leer","Correct":"Richtig","Not quite":"Nicht ganz","Check":"Überprüfen","Story completed":"Geschichte abgeschlossen","Survival equipment":"Überlebensausrüstung","Close inventory":"Inventar schließen","Previous":"Zurück","Next":"Weiter","Stranger Gears — The Last Broadcast":"Stranger Gears – Die letzte Sendung","__COUNT__ item":"__COUNT__ Element","__COUNT__ items":"__COUNT__ Artikel","Reward acquired: __ITEM__.":"Erworbene Belohnung: __ITEM__.","Safety item acquired: __ITEM__.  maison.","Field notes · what is hunting you":"Notes de terrain · qu'est-ce qui vous traque","The signal has teeth":"Le signal a du mordant","Vecna":"Vecna","Inside the broadcast":"À l'intérieur de la diffusion","He uses guilt as a doorway. Four chimes mean he has found yours.":"Il utilise la culpabilité comme une porte. Quatre carillons signifient qu'il a trouvé le vôtre.","Demodogs":"Démochiens","On every road":"Sur chaque route","Blind, fast and drawn to engines, voices and electrical current.":"Aveugle, rapide et attiré par les moteurs, les voix et le courant électrique.","Mind Flayer":"Ecorcheur d'esprit","Above the Gate":"Au-dessus de la porte","A storm-shaped shadow descending one tendril at a time.":"Une ombre en forme de tempête descendant une vrille à la fois.","How the campaign works":"Comment fonctionne la campagne","Every correct answer becomes survival equipment":"Chaque bonne réponse devient un équipement de survie","Play all three drivers. Their stories are different and their equipment carries into the final run. Wrong answers cost nerve and trust.":"Jouez les trois pilotes. Leurs histoires sont différentes et leur équipement se poursuit jusqu'au final. Les mauvaises réponses coûtent du courage et de la confiance.","At the climax, sound, power and traction each demand an item. The Needle decides whether all three drivers help one another through the Gate.":"Au point culminant, le son, la puissance et la traction exigent chacun un élément. L'Aiguille décide si les trois conducteurs s'entraident pour franchir la Porte.","Choose the next transmission":"Choisissez la prochaine transmission","Whose voice answers the radio?":"Quelle voix répond à la radio ?","Clarkson · the Bruiser":"Clarkson · le Cogneur","A V8, an empty bypass and the accident he insists was not his fault.":"Un V8, un contournement à vide et l'accident, selon lui, n'était pas de sa faute.","Suppression bottles":"Flacons de suppression","Hamster · the three-wheeler":"Hamster · le trois-roues","A storm drain, a failing headlamp and the friend he left behind once before.":"Un égout pluvial, une lampe frontale défaillante et l'ami qu'il a laissé derrière lui une fois auparavant.","May · the diesel estate":"Mai · le break diesel","A radio mast, a boot of numbered boxes and one message he never transmitted.":"Un mât radio, un coffre de boîtes numérotées et un message qu'il n'a jamais transmis.","Reset all stories":"Réinitialiser toutes les histoires","Clarkson · 22:03 · Foundry Bypass":"Clarkson · 22:03 · Contournement de la fonderie","Your passenger is a cassette recorder":"Votre passager est un magnétophone","The tape plays the sound of rain, tyres and a young mechanic saying he trusts you. You remember sending him ahead in a car you knew had a bad steering rack.":"La cassette diffuse le bruit de la pluie, des pneus et un jeune mécanicien disant qu'il vous fait confiance. Vous vous souvenez de l'avoir envoyé devant dans une voiture dont vous saviez qu'elle avait une crémaillère de direction défectueuse.","The clock chimes once. In the mirror, six Demodogs unfold from the verge and begin running. They are gaining whenever you lift off the throttle.":"L'horloge sonne une fois. Dans le miroir, six Demodogs se déplient du bord et commencent à courir. Ils gagnent chaque fois que vous relâchez l’accélérateur.","Sound-dampening blanket":"Couverture insonorisante","Clarkson · pursuit · language under pressure":"Clarkson · poursuite · langage sous pression","Which sentence makes the earlier danger clear?":"Quelle phrase rend clair le danger antérieur ?","I knew the steering rack had already failed once":"Je savais que la crémaillère de direction était déjà tombée en panne une fois","I knew the steering rack has fail tomorrow":"Je savais que la crémaillère de direction était en panne demain","I had knew the steering rack already failing":"Je savais que la crémaillère de direction était déjà en panne","I knowed the steering rack had fails":"Je savais que la crém wer and traction each demand an item. The Needle decides whether all three drivers help one another through the Gate.":"Al culmine, suono, potenza e trazione richiedono ciascuno un oggetto. L'Ago decide se tutti e tre i conducenti si aiutano a vicenda attraverso il Cancello.","Choose the next transmission":"Scegli la trasmissione successiva","Whose voice answers the radio?":"Quale voce risponde alla radio?","Clarkson · the Bruiser":"Clarkson · il Bruciatore","A V8, an empty bypass and the accident he insists was not his fault.":"Un V8, una tangenziale vuota e l'incidente, sostiene, non è stato colpa sua.","Suppression bottles":"Bottiglie di soppressione","Hamster · the three-wheeler":"Criceto · il tre ruote","A storm drain, a failing headlamp and the friend he left behind once before.":"Un tombino, un faro guasto e l'amico che ha lasciato indietro una volta.","May · the diesel estate":"Maggio · la station wagon diesel","A radio mast, a boot of numbered boxes and one message he never transmitted.":"Un'antenna radio, uno stivale di scatole numerate e un messaggio che non ha mai trasmesso.","Reset all stories":"Reimposta tutte le storie","Clarkson · 22:03 · Foundry Bypass":"Clarkson · 22:03 · Bypass della fonderia","Your passenger is a cassette recorder":"Il tuo passeggero è un registratore a cassette","The tape plays the sound of rain, tyres and a young mechanic saying he trusts you. You remember sending him ahead in a car you knew had a bad steering rack.":"La cassetta riproduce il rumore della pioggia, dei pneumatici e di un giovane meccanico che dice di fidarsi di te. Ti ricordi di averlo mandato avanti con un'auto che sapevi aveva la cremagliera dello sterzo difettosa.","The clock chimes once. In the mirror, six Demodogs unfold from the verge and begin running. They are gaining whenever you lift off the throttle.":"L'orologio suona una volta. Nello specchio, sei Democani si aprono dal bordo e iniziano a correre. Stanno guadagnando ogni volta che alzi l'accelerator ":"Hear + object + -ing descrive un'azione in corso. Corretto: costruisci un lanciatore di razzi sonici da una bottiglia di soppressione e il relè del clacson.","Hamster · the first disagreement":"Criceto · il primo disaccordo","Clarkson tells you to turn back":"Clarkson ti dice di tornare indietro","Shared tunnel map":"Mappa tunnel condivisa","Send both drivers your exact route":"Invia a entrambi gli autisti il percorso esatto","If you vanish, they can still find you.":"Se sparisci, potranno ancora trovarti.","Needle +2":"Ago +2","Say the signal is breaking up":"Diciamo che il segnale si sta interrompendo","You refuse to be rescued by someone you do not trust.":"Rifiuti di farti salvare da qualcuno di cui non ti fidi.","Hamster · 22:31 · the flooded chamber":"Criceto · 22:31 · la camera allagata","The tunnel opens into the Upside Down":"Il tunnel si apre nel Sottosopra","Red lightning flashes beneath black water. A Demodog drops between you and the exit; three more splash down behind. The three-wheeler tips onto two wheels as you circle the chamber.":"Un lampo rosso lampeggia sotto l'acqua nera. Un Demodog si posiziona tra te e l'uscita; altri tre si tuffano dietro. Il tre ruote si inclina su due ruote mentre giri intorno alla camera.","Your friend's voice asks why you left. The water begins climbing the tyres.":"La voce del tuo amico ti chiede perché te ne sei andato. L'acqua inizia a salire sui pneumatici.","Reinforced tyre chains":"Catene da neve rinforzate","Hamster · water rising":"Criceto · acqua che sale","Which deduction is correct?":"Quale deduzione è corretta?","The Gate must have opened below the chamber":"La porta deve essersi aperta sotto la camera","The Gate must opened below it":"Il Cancello deve essere aperto sotto di esso","The Gate has must opening below it":"Il cancello ha un'apertura sotto di esso","The Gate must have open tomorrow":"La porta deve essere aperta domani","Must have + past participle expresses a strong deduction about the past. Cor cia del mástil","Clarkson recognises the lie. He begins making his own plan.":"Clarkson reconoce la mentira. Comienza a hacer su propio plan.","May · 22:31 · Dead Frequency":"Mayo · 22:31 · Frecuencia Muerta","Vecna starts predicting your turns":"Vecna comienza a predecir tus giros","Your voice names each road two seconds before you steer. In the mirror, the runner is close enough to touch the rear window. The radio mast ahead bends toward the estate like a fishing rod.":"Tu voz nombra cada carretera dos segundos antes de girar. En el espejo, el corredor está lo suficientemente cerca como para tocar la ventana trasera. El mástil de radio que hay delante se inclina hacia la finca como una caña de pescar.","At its base, the armoured cable pulses once every eleven seconds.":"En su base, el cable blindado pulsa una vez cada once segundos.","Eleven-second lightning timer":"Relámpago de once segundos","May · the mast is falling":"Mayo · el mástil está cayendo","Which sentence gives the safe sequence?":"¿Qué oración da la secuencia segura?","Cut the cable after the pulse has passed":"Cortar el cable una vez pasado el pulso","Cut the cable after the pulse passing tomorrow":"Corta el cable después de que pase el pulso mañana","Cut cable after pulse have pass":"Cortar cable después de pasar el pulso","Cutted it after the pulse has passing":"Lo corté después de que pasó el pulso.","Present perfect makes the pulse complete before the cut. Correct: you calibrate a timer to the eleven-second cycle.":"El presente perfecto hace que el pulso se complete antes del corte. Correcto: calibras un temporizador al ciclo de once segundos.","May · escape the mast":"May · escapar del mástil","The runner reaches the rear door":"El corredor llega a la puerta trasera.","Phase inverter":"Inversor de fase","Reverse the alternator through the cable":"Invertir el alternador a través del cable","The electrical backlash throws the creature clear.":"La reacción eléctrica arroja a la criatura lejos.","W inal","The signal becomes a road home—if the estate has enough fuel to hold it.":"La señal se convierte en un camino a casa, si la finca tiene suficiente combustible para sostenerla.","Conclusion · impact":"Conclusión · impacto","The Bruiser hits the Gate at sixty":"El Bruiser golpea la puerta a los sesenta","Outcome":"Resultado","Conclusion · the decoy":"Conclusión · el señuelo","The smallest engine turns back":"El motor más pequeño da marcha atrás","Conclusion · the reversed signal":"Conclusión · la señal invertida","The radio becomes a doorway":"La radio se convierte en una puerta","Transmission complete":"Transmisión completa","One voice has reached the elevator":"Una voz ha llegado al ascensor","Complete the remaining transmissions.":"Completar las transmisiones restantes.","Play next driver":"Reproducir siguiente controlador","Condition":"Condición","Fuel":"Combustible","Nerve":"Nervio","Spores":"Esporas","Needle":"Aguja","Holding":"Sosteniendo","Fraying":"Deshilachado","Split":"División","Boot":"Arranque","Empty":"Vacío","Correct":"Correcto","Not quite":"No del todo","Check":"Verificar","Story completed":"Historia completada","Survival equipment":"Equipo de supervivencia","Close inventory":"Cerrar inventario","Previous":"Anterior","Next":"Siguiente","Stranger Gears — The Last Broadcast":"Stranger Gears — La última transmisión","__COUNT__ item":"__COUNT__ elemento","__COUNT__ items":"__COUNT__ elementos","Reward acquired: __ITEM__.":"Recompensa adquirida: __ITEM__.","Safety item acquired: __ITEM__.":"Artículo de seguridad adquirido: __ITEM__.","Artefact used · no loss":"Artefacto usado · sin pérdida","Nerve −2 · Needle −1":"Nervio −2 · Aguja −1","Fuel −2 · Condition −1":"Combustible −2 · Condición −1","Condition −2 · Spores +2":"Condición −2 · Esporas +2","Spore filter used · spores −1":"Filtro de esporas utilizado · esporas −1","You deploy the __ITEM__. The pack veers after the false engine note, buying all three cars a clear lane.":"Implementas el __ITEM__.  split: when __LOST__ calls for help, the others hesitate one second too long. Two cars reach Halloway. __LOST__ turns back into the red storm to hold the pack away, and does not come through.":"La Puerta se abre mientras los Demodogs se acercan. La Aguja se ha dividido: cuando __LOST__ pide ayuda, los demás dudan un segundo de más. Dos coches llegan a Halloway. __LOST__ vuelve a convertirse en la tormenta roja para mantener alejada la manada y no sale adelante.","Recovered equipment carries the convoy through the final pursuit: __ITEMS__.":"El equipo recuperado lleva el convoy a través de la persecución final: __ITEMS__.","All three cars burst out of the Upside Down seconds before the Mind Flayer reaches the road. The Gate seals behind them at the county line.":"Los tres coches salen disparados del Upside Down segundos antes de que Mind Flayer llegue a la carretera. La Puerta se cierra detrás de ellos en la frontera del condado.","__NAME__ reached the elevator with __COUNT__ artefact.":"__NAME__ llegó al ascensor con __COUNT__ artefacto.","__NAME__ reached the elevator with __COUNT__ artefacts.":"__NAME__ llegó al ascensor con __COUNT__ artefactos.","End of Part III · 02:24 · beyond Halloway":"Fin de la Parte III · 02:24 · más allá de Halloway","Driver story __COUNT__ of 3 complete":"Historia del conductor __COUNT__ de 3 completa","No one reached the Gate":"Nadie llegó a la puerta","Only two drivers came back":"Solo regresaron dos conductores","All three drivers escaped":"Los tres conductores escaparon","Choose another driver to continue":"Elija otro controlador para continuar","This driver has reached the grain elevator. Complete the remaining character stories to unlock the shared climax and final escape.":"Este conductor ha llegado al elevador de granos. Completa las historias de personajes restantes para desbloquear el clímax compartido y el escape final.","Play all stories again":"Reproducir todas las historias nuevamente","Choose the next driver":"Elija el siguiente controlador","Driver":"Conductor"},"ja":{"Forbes English":"フォーブス英語","An interactive Stranger Things story":"インタラクティブなストレンジャー シングスの物語","Stranger Gears":"見知らぬ歯車","The Last Broadcast · Three drivers. Three confessions. One signal from the Upside Down that knows what each of them is trying not to say.":"最後の放送 · 3 人のドライバー。 ３つの告白。 Upside Down からの 1 つの信号は、それぞれが何を言わないようにしているかを知っています。","Begin transmission":"送信開始","21:40 · Halloway · 97.3 FM":"21:40 · ハロウェイ · 97.3 FM","The radio says your name before you switch it on":"ラジオはスイッチを入れる前にあなたの名前を言います","Every receiver in town snaps to the same dead frequency. A grandfather clock chimes four times. Then your own voice begins describing a memory you have never told Clarkson, Hamster or May.":"街中のすべての受信機が同じデッド周波数にスナップします。おじいさんの時計が四回鐘を鳴らします。そして、あなた自身の声が、クラークソンにも、ハムスターにも、メイにも語らなかった記憶を語り始めます。","Outside, red lightning opens a wound above the grain elevator. The broadcast ends with a promise:":"外では、赤い稲妻が穀物エレベーターの上に傷口を開きます。放送は次の約束で終わります。","at 02:17, one of you will choose who gets home.":"02:17、どちらかが帰宅する人を選びます。","Field notes · what is hunting you":"フィールドノート · 何を追いかけているのか","The signal has teeth":"信号には歯がある","Vecna":"ベクナ","Inside the broadcast":"放送内","He uses guilt as a doorway. Four chimes mean he has found yours.":"彼は罪悪感を入り口として利用します。チャイムが 4 回鳴れば、彼があなたのものを見つけたことを意味します。","Demodogs":"デモドッグ","On every road":"あらゆる道で","Blind, fast and drawn to engines, voices and electrical current.":"目が見えず、足が速く、エンジン、声、電流に惹かれる。","Mind Flayer":"マインドフレイヤー","Above the Gate":"門の上","A storm-shaped shadow descending one tendril at a time.":"蔓を一本ずつ降りてくる嵐のような影。","How the campaign works":"キャンペーンの仕組み","Every correct answer becomes survival equipment":"すべての正解はサバイバル装備になる","Play all three drivers. Their stories are different and their equipment carries into the final run. Wrong answers cost nerve and trust.":"3 つのドライバーすべてをプレイします。彼らのストーリーは異なり、装備は最終実行まで引き継がれます。間違った答えは神経と信頼を奪います。","At the climax, sound, power and traction each demand an item. The Needle decides whether all た以前の失敗を置きます。正解すると、ブルーザーのエンジン音を隠すブランケットのロックが解除されます。","Clarkson · the first disagreement":"クラークソン · 最初の意見の相違","Hamster asks whether the tape is true":"ハムスターがテープは本当か尋ねる","Honest CB recording":"正直な CB 録音","Tell both of them the whole truth":"二人にすべての真実を話してください","The silence afterward is terrible, but they know what Vecna is using.":"その後の沈黙はひどいですが、彼らはベクナが何を使っているか知っています。","Needle +2 · nerve −1":"針+2・神経-1","Call the recording a fake":"その録音を偽物だと呼ぶ","May says the rain on the tape matches the date. Hamster stops answering.":"メイは、テープの雨が日付と一致すると言います。ハムスターが返事をしなくなった。","Needle −2":"針 −2","Clarkson · 22:19 · mirror check":"クラークソン · 22:19 · ミラーチェック","One of them is on the roof":"そのうちの 1 つは屋根の上にあります","Claws punch through the headlining. Another Demodog runs level with your window. Ahead, the bypass ends at a barricade of abandoned cars. Vecna's voice says the mechanic's name through every speaker.":"爪が見出しを突き破る。別の Demodog がウィンドウと同じレベルで実行されます。この先、バイパスは放置された車のバリケードで終わります。ベクナの声がすべてのスピーカーから整備士の名前を告げます。","You have eight seconds before the pack boxes you in.":"パックが箱に入るまで、あと 8 秒あります。","Nitrous purge switch":"亜硝酸パージスイッチ","Clarkson · eight seconds":"クラークソン · 8 秒","Which instruction is correct?":"どの指示が正しいですか?","Keep the revs up before you release the clutch":"クラッチを切る前に回転数を上げ続けてください","Kept the revs before you releasing it":"回転数を離す前に維持した","Keep the revs up before you released it tomorrow":"明日リリースする前に回転数を上げ続けてください","Keeping revs before release clutch":"クラッチを解放する前に回転数を維持する","The imperative keeps the sequence immediate. Correct: you wire a single-use nitrous purge that can break the pack's formation.":"命令はシーケンスを即時に保ちます。正解: パックの形成を破壊する可能性がある使い捨て亜窒素パージを配線します。","Clarkson · escape the bypass":"クラークソン · バイパスから逃げる","The barricade fills the windscreen":"フロントガラスを埋めるバリケード","Tow chain":"牽引チェーン","Ram a path through":"小道に突っ込む","The Bruiser loses its grille but tears a tow chain from the wreckage.":"ブルーザーはグリルを失いましたが、残骸から牽引チェーンが引き裂かれました。","condition −1 · fuel −1":"条件 −1 · 燃料 −1","Foundry gate key":"鋳造所の門の鍵","Dive through the foundry yard":"鋳物工場をダイブする","The pack follows you inside; the spores are thick, but a gate key hangs by the furnace.":"群れがあなたの後を追ってきます。胞子は厚いですが、炉のそばにゲートキーがぶら下がっています。","spores +1":"胞子+1","Clarkson · 23:06 · transmission ends":"クラークソン · 23:06 · 送信終了","You reach the elevator with bite marks in the roof":"エレベーターに到着すると屋根に噛み跡が残る","The tape has stopped, but the young mechanic's voice now comes from the red clouds. You leave the Bruiser idling. Whatever happens at 02:17, noise will be your weapon—and perhaps your apology.":"テープは止まったが、若い整備士の声が赤い雲から聞こえてくる。ブルーザーをアイドリングのままにしておきます。 02:17に何が起こっても、騒音はあなたの武器となり、おそらく謝罪となるでしょう。","Hamster · 22:03 · North Drain":"ハムスター · 22:03 · ノースドレイン","Your missing friend knocks from inside the pipe":"行方不明の友人がパイプの中からノックする","The three-wheeler barely fits. Behind you, something crawls through the dark using your friend's voice. Years ago, when his car rolled, you ran for help and did not go back. Vecna calls that abandonment.":"三輪車はかろうじて入ります。あなたの後ろで、友人の声を頼りに暗闇を何かが這っています。何年も前、彼の車が横転したとき、あなたは助けを求めて走ったまま、戻らなかった。ヴェクナはそれを放棄と呼んでいます。","The clock chimes once. Your headlamp dies. The scraping becomes a sprint.":"時計が一度チャイムを鳴らします。ヘッドランプが切れてしまいます。スクレイピングはスプリントになります。","Sonic flare launcher":"ソニックフレアランチャー","Hamster · pursuit · listen":"ハムスター · 追跡 · 聞く","Which sentence correctly describes the sound?":"音を正しく説明している文はどれですか?","I could hear something gaining on me":"何かが私に迫ってくる音が聞こえました","I could heard something gained tomorrow":"明日何か得られる音が聞こえた","I can hearing something to gain me":"何か得するものが聞こえる","I could have hear something gains":"何かが得られる音が聞こえたかもしれない","Hear + object + -ing describes an action in progress. Correct: you build a sonic flare launcher from a suppression bottle and the horn relay.":"Hear + object + -ing は進行中のアクションを表します。正解: サプレッション ボトルとホーン リレーからソニック フレア ランチャーを構築します。","Hamster · the first disagreement":"ハムスター · 初めての意見の相違","Clarkson tells you to turn back":"クラークソンは引き返すように言う","Shared tunnel map":"共有トンネルの地図","Send both drivers your exact route":"両方のドライバーに正確なルートを送信","If you vanish, they can still find you.":"あなたが消えても、彼らはあなたを見つけることができます。","Needle +2":"針+2","Say the signal is breaking up":"信号が途絶えたと言う","You refuse to be rescued by someone you do not trust.":"あなたは信頼できない人からの救助を拒否します。","Hamster · 22:31 · the flooded chamber":"ハムスター · 22:31 · 水浸しの部屋","The tunnel opens into the Upside Down":"トンネルが逆さまに開く","Red lightning flashes beneath black water. A Demodog drops between you and the exit; three more splash down behind. The three-wheeler tips onto two wheels as you circle the chamber.":"黒い水の下で赤い稲妻が光る。デモドッグがあなたと出口の間に降りてきます。さらに3人が後ろに飛び散る。チャンバー内を旋回すると、三輪車が 2 つの車輪に傾きます。","Your friend's voice asks why you left. The water begins climbing the tyres.":"友達の声はなぜ辞めたのか尋ねます。水がタイヤを登り始めます。","Reinforced tyre chains":"強化タイヤチェーン","Hamster · water rising":"ハムスター・増水","Which deduction is correct?":"どの推理が正しいですか?","The Gate must have opened below the chamber":"門は部屋の下で開いたに違いない","The Gate must opened below it":"ゲートはその下で開かなければなりません","The Gate has must opening below it":"ゲートはその下で開かなければなりません","The Gate must have open tomorrow":"明日はゲートが開くはずです","Must have + past participle expresses a strong deduction about the past. Correct: you recover tyre chains from a submerged maintenance cart.":"Must have + 過去分詞は、過去についての強力な推論を表します。正解: 水没したメンテナンス カートからタイヤ チェーンを回収します。","Hamster · escape the chamber":"ハムスター · 部屋から逃げる","The pack closes the circle":"パックがサークルを閉じる","Spore filter":"胞子フィルター","Fire the suppression bottles into the water":"制圧ボトルを水中に発射する","The chemical fog blinds the pack and leaves one usable respirator filter.":"化学霧によりパックが見えなくなり、使用可能なマスクのフィルターが 1 つ残ります。","fuel −1":"燃料 −1","Drain bolt cutters":"ドレンボルトカッター","Cut the floodgate chain":"水門の鎖を切断する","The current tears a panel from the van but sweeps the Demodogs away.":"電流がバンのパネルを引き裂きますが、デモドッグたちを押し流します。","condition −1 · nerve −1":"状態 −1・神経 −1","Hamster · 23:06 · transmission ends":"ハムスター · 23:06 · 送信終了","You emerge beneath the grain elevator":"あなたは穀物エレベーターの下に出ます","The hidden road ends at a living cable the width ecna があなたのターンを予測し始める","Your voice names each road two seconds before you steer. In the mirror, the runner is close enough to touch the rear window. The radio mast ahead bends toward the estate like a fishing rod.":"ハンドルを切る 2 秒前に、あなたの声で各道路の名前が決まります。ミラーではランナーがリアウィンドウに触れるほどの距離にいます。前方の無線マストは釣り竿のように敷地に向かって曲がっています。","At its base, the armoured cable pulses once every eleven seconds.":"その基部では、装甲ケーブルが 11 秒に 1 回パルスします。","Eleven-second lightning timer":"11 秒の稲妻タイマー","May · the mast is falling":"5月・マストが落ちる","Which sentence gives the safe sequence?":"安全な順序を与える文はどれですか?","Cut the cable after the pulse has passed":"パルスが通過した後、ケーブルを切断します","Cut the cable after the pulse passing tomorrow":"明日パルスが通過したらケーブルを切断してください","Cut cable after pulse have pass":"パルスが通過した後にケーブルを切断します","Cutted it after the pulse has passing":"パルスが過ぎた後にカットしました","Present perfect makes the pulse complete before the cut. Correct: you calibrate a timer to the eleven-second cycle.":"現在完了により、カットの前にパルスが完了します。正解: タイマーを 11 秒のサイクルに調整します。","May · escape the mast":"5月・マストから脱出する","The runner reaches the rear door":"ランナーが後部ドアに到達","Phase inverter":"位相反転器","Reverse the alternator through the cable":"ケーブルを介してオルタネーターを逆回転させます","The electrical backlash throws the creature clear.":"電気の反発で生き物は一掃される。","Warm armoured cable":"暖かい装甲ケーブル","Drive through the mast supports":"マストサポートを通り抜ける","The roof buckles, but you leave with the cable wound around the towbar.":"ルーフが折れるが、ケーブルをトウバーに巻き付けたまま出発する。","condition −1 · spores +1":"条件 −1 · 胞子 +1","May · 23:06 · transmission ends":"5月 · 23:06 · 送信終了","The impossible coordinates point to the elevator":"ありえない座標はエレベーターを指す","The distress call was never from the winter storm. It came from tonight, through the Gate, in your colleague's voice. You finally transmit the coordinates to Clarkson and Hamster. Both answer.":"救難信号は決して冬の嵐によるものではありませんでした。それは今夜、門を通ってあなたの同僚の声で聞こえました。最後に、座標をクラークソンとハムスターに送信します。両方とも答えます。","02:03 · grain elevator · final transmission":"02:03 · 穀物エレベーター · 最終送信","Vecna plays all three confessions t remain behind until the last second.":"道路は空いていますが、誰かが最後の瞬間まで後ろに残らなければなりません。","May reverses the final transmission":"最終的な送信を反転する可能性があります","The signal becomes a road home—if the estate has enough fuel to hold it.":"敷地内に十分な燃料がある場合、信号は家への道になります。","Conclusion · impact":"結論・影響","The Bruiser hits the Gate at sixty":"ブルーザーは60歳で門を叩く","Outcome":"結果","Conclusion · the decoy":"結論 · おとり","The smallest engine turns back":"最小のエンジンが元に戻る","Conclusion · the reversed signal":"結論 · 逆信号","The radio becomes a doorway":"ラジオが玄関になる","Transmission complete":"送信完了","One voice has reached the elevator":"一つの声がエレベーターに届いた","Complete the remaining transmissions.":"残りの送信を完了します。","Play next driver":"次のドライバーをプレイ","Condition":"状態","Fuel":"燃料","Nerve":"神経","Spores":"胞子","Needle":"針","Holding":"ホールド","Fraying":"ほつれ","Split":"分割","Boot":"ブート","Empty":"空","Correct":"正解","Not quite":"まだです","Check":"チェックしてください","Story completed":"ストーリーが完了しました","Survival equipment":"サバイバル装備","Close inventory":"在庫を閉じる","Previous":"前","Next":"次へ","Stranger Gears — The Last Broadcast":"ストレンジャー・ギア — 最後の放送","__COUNT__ item":"__COUNT__ 件のアイテム","__COUNT__ items":"__COUNT__ 個のアイテム","Reward acquired: __ITEM__.":"獲得した報酬: __ITEM__。","Safety item acquired: __ITEM__.":"安全アイテムを取得しました: __ITEM__。","Artefact used · no loss":"使用済みアーティファクト · 損失なし","Nerve −2 · Needle −1":"神経 −2・針 −1","Fuel −2 · Condition −1":"燃料 -2 · 状態 -1","Condition −2 · Spores +2":"条件 −2 · 胞子 +2","Spore filter used · spores −1":"使用した胞子フィルター · 胞子 -1","You deploy the __ITEM__. The pack veers after the false engine note, buying all three cars a clear lane.":"__ITEM__ をデプロイします。偽のエンジン音の後、集団は進路を変え、3台すべてに空き車線を譲りました。","You have nothing that can mask or divert the engines. Demodogs strike both rear cars, and May shouts that Clarkson has drawn them onto everyone.":"エンジンを隠したり方向転換したりできるものは何もありません。デモドッグが両方の後部車両を攻撃し、メイはクラークソンがデモドッグを全員に引き寄せたと叫びます。","The __ITEM__ blocks the copied signal. May keeps the ignition alive and calls the lightning strike exactly once.":"__ITEM__ はコピーされた信号をブロックしま  · obstacle two · power":"02:15 · 障碍二 · 力量","Vecna reaches into the ignition":"维克纳把手伸进点火装置","02:16 · obstacle three · traction":"02:16 · 障碍三 · 牵引力","The road becomes living mud":"道路变成活泥","02:17 · the last broadcast":"02:17 · 最后一次广播","How do you force the Gate open?":"如何强行打开大门？","Clarkson rams the living cable":"克拉克森撞击活缆\n0192 |||蛮力。大门敞开，但暴徒可能不会重新启动。","Hamster draws the pack into the drain":"仓鼠把包拉进下水道","It clears the road, but someone must remain behind until the last second.":"它清理了道路，但必须有人留到最后一秒。","May reverses the final transmission":"五月逆转最终传送","The signal becomes a road home—if the estate has enough fuel to hold it.":"信号灯成为回家的路——如果庄园有足够的燃料来容纳它。","Conclusion · impact":"结论·影响","The Bruiser hits the Gate at sixty":"猛男六十岁时撞门","Outcome":"结果","Conclusion · the decoy":"结论·诱饵","The smallest engine turns back":"最小的引擎回来了","Conclusion · the reversed signal":"结论·反转信号","The radio becomes a doorway":"收音机成为门口","Transmission complete":"传输完成","One voice has reached the elevator":"一个声音已到达电梯","Complete the remaining transmissions.":"完成剩余的传输。","Play next driver":"播放下一个驱动程序","Condition":"条件","Fuel":"燃料","Nerve":"神经","Spores":"孢子","Needle":"针","Holding":"控股","Fraying":"磨损","Split":"分裂","Boot":"启动","Empty":"空","Correct":"正确","Not quite":"不完全是","Check":"检查","Story completed":"故事完成","Survival equipment":"救生装备","Close inventory":"关闭库存","Previous":"上一页","Next":"下一页\n0226 |||怪奇装备 — 最后广播","__COUNT__ item":"__COUNT__ 项","__COUNT__ items":"__COUNT__ 项","Reward acquired: __ITEM__.":"获得奖励：__ITEM__。","Safety item acquired: __ITEM__.":"获得安全物品：__ITEM__。","Artefact used · no loss":"神器已使用·无损失","Nerve −2 · Needle −1":"神经−2·针−1","Fuel −2 · Condition −1":"燃料−2·条件−1","Condition −2 · Spores +2":"条件−2·孢子+2","Spore filter used · spores −1":"使用孢子过滤器·孢子-1\n0236 |||您部署 __ITEM__。车队在错误的引擎提示后转向，为所有三辆车购买了一条畅通的车道。\n0237 |||你没有任何东西可以掩盖或转移引擎。恶魔狗袭击了后面的两辆车，梅大声喊道克拉克森把它们吸引到了所有人身上。","The __ITEM__ blocks the copied signal. May keeps the ignition alive and calls the lightning strike exactly once.":"__ITEM__ 阻止复制的信号。梅保持点火状态并仅
