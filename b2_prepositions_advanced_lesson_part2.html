<style>
  :root{
    --fe-navy:#1c2b4a;
    --fe-teal:#1f8a86;
    --fe-orange:#e0703a;
    --fe-purple:#6c5ce0;
    --fe-green:#3a9c5f;
    --fe-cream:#f7f3ec;
    --fe-paper:#ffffff;
    --fe-ink:#20242b;
    --fe-muted:#6b7280;
    --fe-error:#c0392b;
    --fe-border:#e3ded3;
    --fe-es:#b5651d;
    --cat-color: var(--fe-teal);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--fe-cream);
    color:var(--fe-ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1,h2,h3{font-family:'Fraunces',serif;}
  .app{width:100%;max-width:760px;padding:20px 18px 60px;}
  header.top{display:flex;align-items:center;gap:14px;padding:14px 0 8px;}
  .logo{width:46px;height:46px;flex-shrink:0;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;color:var(--fe-navy);}
  .brand-text .tag{font-size:0.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fe-muted);}

  .scorebar{
    position:sticky;top:0;z-index:20;
    background:rgba(247,243,236,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--fe-border);
    padding:10px 0 12px;
    margin-bottom:18px;
  }
  .progress-track{height:8px;width:100%;background:#e8e3d6;border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:var(--cat-color);transition:width .4s ease;}
  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:0.82rem;color:var(--fe-muted);}
  .score-pill{background:var(--fe-navy);color:#fff;padding:3px 11px;border-radius:999px;font-weight:600;font-size:0.78rem;}

  .card{
    background:var(--fe-paper);
    border:1px solid var(--fe-border);
    border-radius:16px;
    padding:26px 24px;
    box-shadow:0 2px 10px rgba(28,43,74,0.05);
    margin-bottom:20px;
  }

  .section-badge{
    display:inline-block;font-size:0.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--cat-color);
    background:color-mix(in srgb, var(--cat-color) 12%, white);
    padding:4px 10px;border-radius:999px;margin-bottom:12px;
  }

  .intro-card h2{margin-top:0;color:var(--fe-navy);}
  .intro-card p{line-height:1.55;color:#3a3f4a;}
  .lesson-map{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px;}
  .lesson-map li{display:flex;gap:10px;align-items:center;font-size:0.92rem;padding:8px 10px;border-radius:10px;background:var(--fe-cream);}
  .lesson-map .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;
    padding:11px 22px;border-radius:10px;border:none;cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn-primary{background:var(--fe-navy);color:#fff;}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:disabled{background:#c9cdd6;cursor:not-allowed;transform:none;}
  .btn-ghost{background:transparent;color:var(--fe-navy);border:1px solid var(--fe-navy);}
  .btn-es{
    background:transparent;
    color:var(--fe-es);
    border:1.5px solid var(--fe-es);
    font-size:0.82rem;
    padding:6px 13px;
    border-radius:999px;
  }
  .btn-es:hover{background:color-mix(in srgb, var(--fe-es) 10%, white);}

  .q-prompt{font-size:1.08rem;line-height:1.6;margin-bottom:14px;color:var(--fe-ink);}
  .q-prompt .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--fe-navy);text-align:center;font-weight:700;color:var(--fe-navy);}

  .es-row{margin-bottom:16px;}
  .es-note{
    display:none;
    margin-top:9px;
    padding:10px 13px;
    background:#fbf1e6;
    border:1px solid #ecd3ad;
    border-radius:10px;
    font-size:0.86rem;
    color:#7a4a12;
    line-height:1.5;
  }
  .es-note.show{display:block;}

  .options{display:grid;gap:10px;margin-bottom:6px;}
  .option{
    text-align:left;background:var(--fe-cream);border:1.5px solid var(--fe-border);
    border-radius:12px;padding:12px 16px;font-size:0.98rem;font-family:'Inter',sans-serif;
    cursor:pointer;transition:border-color .12s ease, background .12s ease;
  }
  .option:hover:not(:disabled){border-color:var(--cat-color);}
  .option:disabled{cursor:default;}
  .option.correct{background:#e6f4ea;border-color:var(--fe-green);color:#1f5c34;font-weight:600;}
  .option.incorrect{background:#fbeceb;border-color:var(--fe-error);color:#8a2c22;font-weight:600;}
  .option.dim{opacity:0.55;}

  .feedback{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:0.92rem;line-height:1.5;display:none;}
  .feedback.show{display:block;}
  .feedback.right{background:#e6f4ea;color:#1f5c34;border:1px solid #bfe2ca;}
  .feedback.wrong{background:#fbeceb;color:#8a2c22;border:1px solid #f1c6c0;}

  .nav-row{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;align-items:center;}
  .nav-row.split{justify-content:space-between;}

  .results-card{text-align:center;}
  .results-score{font-family:'Fraunces',serif;font-size:3rem;color:var(--fe-navy);margin:6px 0;}
  .results-msg{color:#3a3f4a;line-height:1.55;margin-bottom:20px;}
  .breakdown{display:grid;gap:8px;text-align:left;margin:20px 0;}
  .breakdown-row{display:flex;justify-content:space-between;padding:9px 12px;background:var(--fe-cream);border-radius:10px;font-size:0.9rem;}

  .hidden{display:none !important;}

  footer.foot{margin-top:26px;text-align:center;color:var(--fe-muted);font-size:0.78rem;}

  @media (max-width:480px){
    .card{padding:20px 16px;}
    .results-score{font-size:2.3rem;}
  }
</style>

  <header class="top">

      <circle cx="32" cy="32" r="30" fill="none" stroke="var(--fe-navy)" stroke-width="3"/>
      <path d="M20 42 L20 22 L40 22" fill="none" stroke="var(--cat-color)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 32 L34 32" fill="none" stroke="var(--cat-color)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="44" cy="42" r="4" fill="var(--fe-orange)"/>
    </svg>
    <div class="brand-text">
      <div class="name">Forbes English</div>
      <div class="tag">Lesson &middot; B2 &middot; Advanced Prepositions &middot; Part 2</div>
    </div>
  </header>

  <div class="scorebar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="meta-row">
      <span id="stepLabel">Getting started</span>
      <span class="score-pill">Score: <span id="scoreVal">0</span>/<span id="scoreMax">0</span></span>
    </div>
  </div>

  <main id="main"></main>

  <footer class="foot">Forbes English &middot; Advanced Prepositions &middot; B2 &middot; Part 2 &middot; Con apoyo en espanol</footer>
</div>

<script>
(function(){

  // ---------- DATA ----------
  var SECTIONS = [
    {
      id:"trends",
      title:"Part 1: Trends, Change & Quantity",
      color:"var(--fe-teal)",
      intro:"Talking about statistics, trends, and comparisons requires precise prepositions - especially in reports, news, and academic writing.",
      questions:[
        {before:"There has been a steady rise", after:"demand for electric cars over the past five years.", options:["in","of","by","at"], correct:"in", explanation:"We use \"a rise/increase in something\" to describe the area or topic that is growing.", es:"Se usa para describir el aspecto o tema que esta aumentando, como una tendencia."},
        {before:"The company reported an increase", after:"eight percent in quarterly revenue.", options:["of","in","by","from"], correct:"of", explanation:"We use \"an increase of + amount\" to give the exact size of a rise.", es:"Se usa para dar la cantidad exacta de un aumento."},
        {before:"Costs fell sharply, dropping", after:"almost a fifth in just one year.", options:["by","of","in","from"], correct:"by", explanation:"We use \"fall/drop by + amount\" to state the size of a decrease.", es:"Indica la cantidad exacta de una disminucion o caida."},
        {before:"Membership rose", after:"500 to over 800 within two years.", options:["from","by","of","at"], correct:"from", explanation:"\"Rise from X to Y\" marks the starting point of a change before the end point is given.", es:"Introduce el punto de partida de un cambio, antes de mencionar el punto final."},
        {before:"Compared", after:"its main competitor, this airline offers far better value for money.", options:["to","for","of","at"], correct:"to", explanation:"\"Compared to\" introduces a direct comparison between two things.", es:"Se usa para establecer una comparacion directa entre dos cosas."},
        {before:"There is currently a serious shortage", after:"affordable housing in the city centre.", options:["of","in","for","with"], correct:"of", explanation:"\"A shortage of something\" states exactly what is lacking.", es:"Indica de que hay escasez o falta."},
        {before:"Staff satisfaction has improved dramatically", after:"regard to flexible working arrangements.", options:["with","upon","by","for"], correct:"with", explanation:"\"With regard to\" is a formal fixed phrase meaning \"concerning\" or \"about\".", es:"Significa en cuanto a o con respecto a un tema concreto."}
      ]
    },
    {
      id:"idiomatic2",
      title:"Part 2: More Fixed Idiomatic Phrases",
      color:"var(--fe-orange)",
      intro:"A further set of fixed prepositional phrases that appear constantly in professional and everyday English.",
      questions:[
        {before:"She has been", after:"charge of the marketing department since January.", options:["in","on","at","of"], correct:"in", explanation:"\"In charge of something\" means responsible for managing it.", es:"Significa responsable de o a cargo de algo."},
        {before:"Most residents are", after:"favour of the new cycling lanes.", options:["in","on","for","at"], correct:"in", explanation:"\"In favour of something\" means supporting or agreeing with it.", es:"Significa apoyar una idea o propuesta."},
        {before:"He offered to fix my car", after:"return for a home-cooked meal.", options:["in","for","on","at"], correct:"in", explanation:"\"In return for something\" means as an exchange for it.", es:"Significa a cambio de algo."},
        {before:"Taking another day off this week is completely out", after:"the question.", options:["of","for","in","at"], correct:"of", explanation:"\"Out of the question\" means completely impossible or not allowed.", es:"Significa que algo es totalmente imposible o inaceptable."},
        {before:"Firefighters say the blaze is now", after:"control after burning for six hours.", options:["under","in","on","at"], correct:"under", explanation:"\"Under control\" means a difficult situation is being successfully managed.", es:"Significa que una situacion dificil esta siendo manejada con exito."},
        {before:"Her talent is", after:"doubt the best I have seen on this course.", options:["beyond","around","before","under"], correct:"beyond", explanation:"\"Beyond doubt\" means something is completely certain, with no question about it.", es:"Significa que algo es completamente cierto, sin ninguna duda."},
        {before:"", after:"addition to her salary, she receives a generous pension.", options:["In","On","At","With"], correct:"In", explanation:"\"In addition to something\" means as well as it, adding something extra.", es:"Significa ademas de algo."}
      ]
    },
    {
      id:"dependent2",
      title:"Part 3: More Advanced Verb & Adjective + Preposition",
      color:"var(--fe-purple)",
      intro:"A further set of fixed verb and adjective + preposition pairs common in formal, professional, and academic English.",
      questions:[
        {before:"You can always rely", after:"him to be on time, whatever the weather.", options:["on","in","at","for"], correct:"on", explanation:"\"Rely on someone/something\" means to trust them to do what is needed.", es:"Significa confiar en alguien o depender de alguien."},
        {before:"Many local residents objected", after:"the new road being built through the park.", options:["to","for","against","of"], correct:"to", explanation:"\"Object to something\" means to disagree with or oppose it - note that \"to\" here is a preposition, followed by a gerund, not the infinitive marker.", es:"Significa oponerse a algo o no estar de acuerdo con ello."},
        {before:"Please excuse me", after:"interrupting, but I have an urgent question.", options:["for","of","from","about"], correct:"for", explanation:"\"Excuse someone for something\" is used to formally apologise for an action.", es:"Se usa para disculparse formalmente por una accion."},
        {before:"The hotel boasts", after:"a rooftop pool with stunning views over the old town.", options:["about","on","for","with"], correct:"about", explanation:"\"Boast about something\" means to talk proudly, sometimes excessively, about it.", es:"Significa hablar con orgullo o presumir de algo."},
        {before:"He resigned", after:"his position shortly after the scandal became public.", options:["from","of","at","with"], correct:"from", explanation:"\"Resign from a position\" means to leave a job voluntarily.", es:"Significa dejar un puesto de trabajo voluntariamente."},
        {before:"In her speech, the CEO referred", after:"the recent changes in company policy.", options:["to","at","about","for"], correct:"to", explanation:"\"Refer to something\" means to mention or allude to it.", es:"Significa mencionar o aludir a algo en un discurso o texto."},
        {before:"Small businesses will benefit greatly", after:"the new tax relief scheme.", options:["from","of","with","for"], correct:"from", explanation:"\"Benefit from something\" means to gain an advantage from it.", es:"Significa obtener una ventaja o beneficio de algo."}
      ]
    },
    {
      id:"phrasal2",
      title:"Part 4: More Prepositional Phrasal Verbs",
      color:"var(--fe-green)",
      intro:"A further set of common multi-word verbs, useful for sounding natural in everyday conversation and workplace English.",
      questions:[
        {before:"Managers need to deal", after:"conflicts quickly and fairly.", options:["with","in","for","at"], correct:"with", explanation:"\"Deal with something\" means to manage or resolve a problem.", es:"Significa gestionar o resolver un problema."},
        {before:"It can be hard to cope", after:"so much pressure at once.", options:["with","against","on","for"], correct:"with", explanation:"\"Cope with something\" means to handle a difficult or stressful situation.", es:"Significa sobrellevar una situacion dificil o estresante."},
        {before:"It took him a long time to get", after:"the loss of his job.", options:["over","off","back","down"], correct:"over", explanation:"\"Get over something\" means to recover emotionally from something difficult.", es:"Significa superar algo dificil, como una perdida o un problema."},
        {before:"Stop putting", after:"the decision - you need to choose today.", options:["off","up","down","out"], correct:"off", explanation:"\"Put off something\" means to postpone or delay it.", es:"Significa posponer o aplazar una decision o tarea."},
        {before:"I came", after:"an old photo of my grandparents while cleaning the attic.", options:["across","into","over","through"], correct:"across", explanation:"\"Come across something\" means to find it by chance, without looking for it.", es:"Significa encontrar algo por casualidad."},
        {before:"I ran", after:"my old teacher at the supermarket yesterday.", options:["into","over","down","up"], correct:"into", explanation:"\"Run into someone\" means to meet them unexpectedly.", es:"Significa encontrarse con alguien inesperadamente."},
        {before:"If you don't submit the report today, we'll fall", after:"schedule.", options:["behind","back","off","under"], correct:"behind", explanation:"\"Fall behind schedule\" means to become delayed compared to a plan.", es:"Significa retrasarse respecto a un plan o calendario."}
      ]
    }
  ];

  // ---------- STATE ----------
  var state = { flatQuestions: [], score: 0, answered: false };

  SECTIONS.forEach(function(sec){
    sec.questions.forEach(function(q){
      state.flatQuestions.push({sectionId: sec.id, sectionTitle: sec.title, color: sec.color, q: q});
    });
  });

  var totalSteps = state.flatQuestions.length + SECTIONS.length + 2;
  var stepsDone = 0;

  document.getElementById("scoreMax").textContent = state.flatQuestions.length;

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function setCatColor(color){ document.documentElement.style.setProperty("--cat-color", color); }

  function updateProgress(label){
    stepsDone++;
    var pct = Math.min(100, Math.round((stepsDone / totalSteps) * 100));
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("stepLabel").textContent = label;
  }

  function updateScoreDisplay(){ document.getElementById("scoreVal").textContent = state.score; }

  var main = document.getElementById("main");

  function renderWelcome(){
    setCatColor("var(--fe-teal)");
    updateProgress("Welcome");
    main.innerHTML =
      '<section class="card intro-card">' +
        '<span class="section-badge">B2 Lesson &middot; Part 2</span>' +
        '<h2>Advanced Prepositions in Context - Part 2</h2>' +
        '<p>This second lesson builds on Part 1 with a fresh set of patterns: describing trends and statistics, more fixed idiomatic phrases, more advanced dependent prepositions, and more prepositional phrasal verbs for natural, fluent English. Spanish notes are available for extra support - tap the "ES" button next to any question.</p>' +
        '<ul class="lesson-map">' +
          '<li><span class="dot" style="background:var(--fe-teal)"></span> Part 1 &middot; Trends, Change &amp; Quantity</li>' +
          '<li><span class="dot" style="background:var(--fe-orange)"></span> Part 2 &middot; More Fixed Idiomatic Phrases</li>' +
          '<li><span class="dot" style="background:var(--fe-purple)"></span> Part 3 &middot; More Advanced Dependent Prepositions</li>' +
          '<li><span class="dot" style="background:var(--fe-green)"></span> Part 4 &middot; More Prepositional Phrasal Verbs</li>' +
        '</ul>' +
        '<div class="nav-row"><button class="btn btn-primary" id="startBtn">Start Lesson</button></div>' +
      '</section>';
    document.getElementById("startBtn").addEventListener("click", goToNext);
  }

  function renderSectionIntro(sectionIndex){
    var sec = SECTIONS[sectionIndex];
    setCatColor(sec.color);
    updateProgress(sec.title);
    main.innerHTML =
      '<section class="card">' +
        '<span class="section-badge">' + sec.title + '</span>' +
        '<h2 style="margin-top:0;color:var(--fe-navy);">' + sec.title + '</h2>' +
        '<p style="line-height:1.55;color:#3a3f4a;">' + sec.intro + '</p>' +
        '<div class="nav-row"><button class="btn btn-primary" id="continueBtn">Begin Practice</button></div>' +
      '</section>';
    document.getElementById("continueBtn").addEventListener("click", goToNext);
  }

  function renderQuestion(flatIndex){
    var item = state.flatQuestions[flatIndex];
    var q = item.q;
    setCatColor(item.color);
    updateProgress(item.sectionTitle + " - Question");
    state.answered = false;

    var shuffledOptions = shuffle(q.options);

    var promptHtml = (q.before ? q.before + ' ' : '') + '<span class="gap">______</span>' + (q.after ? ' ' + q.after : '');

    var html = '<section class="card">';
    html += '<span class="section-badge">' + item.sectionTitle + '</span>';
    html += '<div class="q-prompt">' + promptHtml + '</div>';
    html += '<div class="es-row">';
    html += '<button class="btn btn-es" id="esToggle" type="button">ES &middot; Ayuda en espanol</button>';
    html += '<div class="es-note" id="esNote">' + escapeHtml(q.es) + '</div>';
    html += '</div>';
    html += '<div class="options" id="optionsWrap">';
    shuffledOptions.forEach(function(opt, i){
      html += '<button class="option" data-value="' + escapeAttr(opt) + '" data-index="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="feedback" id="feedbackBox"></div>';
    html += '<div class="nav-row"><button class="btn btn-primary" id="nextBtn" disabled>Next</button></div>';
    html += '</section>';

    main.innerHTML = html;

    document.getElementById("esToggle").addEventListener("click", function(){
      document.getElementById("esNote").classList.toggle("show");
    });

    var optionButtons = main.querySelectorAll(".option");
    optionButtons.forEach(function(btn){
      btn.addEventListener("click", function(){
        if (state.answered) return;
        state.answered = true;
        var chosen = btn.getAttribute("data-value");
        var isCorrect = (chosen === q.correct);

        optionButtons.forEach(function(b){
          b.disabled = true;
          var v = b.getAttribute("data-value");
          if (v === q.correct){ b.classList.add("correct"); }
          else if (v === chosen && !isCorrect){ b.classList.add("incorrect"); }
          else { b.classList.add("dim"); }
        });

        var fb = document.getElementById("feedbackBox");
        fb.classList.add("show");
        if (isCorrect){
          state.score++;
          updateScoreDisplay();
          fb.classList.add("right");
          fb.textContent = "Correct! " + q.explanation;
        } else {
          fb.classList.add("wrong");
          fb.textContent = "Not quite. The correct answer is \"" + q.correct + "\". " + q.explanation;
        }

        item.gotCorrect = isCorrect;
        document.getElementById("nextBtn").disabled = false;
      });
    });

    document.getElementById("nextBtn").addEventListener("click", goToNext);
  }

  function renderResults(){
    setCatColor("var(--fe-navy)");
    updateProgress("Results");
    var total = state.flatQuestions.length;
    var pct = Math.round((state.score / total) * 100);
    var msg;
    if (pct >= 85){
      msg = "Excellent command of advanced preposition patterns - purpose structures, fixed idioms, dependent prepositions, and phrasal verbs. This is confident B2/C1 usage.";
    } else if (pct >= 65){
      msg = "Solid progress. Go back over any section where you lost points, especially the fixed idiomatic phrases - they simply need to be memorised as whole chunks.";
    } else {
      msg = "Good effort - these advanced patterns take repeated exposure. Review the explanations and Spanish notes, then try the lesson again in a few days.";
    }

    var breakdown = "";
    SECTIONS.forEach(function(sec){
      var secScore = 0;
      var secTotal = sec.questions.length;
      state.flatQuestions.forEach(function(item){
        if (item.sectionId === sec.id && item.gotCorrect) secScore++;
      });
      breakdown += '<div class="breakdown-row"><span>' + sec.title + '</span><span>' + secScore + ' / ' + secTotal + '</span></div>';
    });

    main.innerHTML =
      '<section class="card results-card">' +
        '<span class="section-badge">Lesson Complete</span>' +
        '<h2 style="color:var(--fe-navy);margin-bottom:0;">Your Results</h2>' +
        '<div class="results-score">' + state.score + ' / ' + total + '</div>' +
        '<p class="results-msg">' + msg + '</p>' +
        '<div class="breakdown">' + breakdown + '</div>' +
        '<div class="nav-row" style="justify-content:center;gap:12px;">' +
          '<button class="btn btn-ghost" id="restartBtn">Restart Lesson</button>' +
        '</div>' +
      '</section>';

    document.getElementById("restartBtn").addEventListener("click", function(){ location.reload(); });
  }

  var sequence = [];
  sequence.push({type:"welcome"});
  var flatCursor = 0;
  SECTIONS.forEach(function(sec, sIdx){
    sequence.push({type:"sectionIntro", sectionIndex: sIdx});
    sec.questions.forEach(function(){
      sequence.push({type:"question", flatIndex: flatCursor});
      flatCursor++;
    });
  });
  sequence.push({type:"results"});

  var cursor = -1;

  function goToNext(){
    cursor++;
    if (cursor >= sequence.length) return;
    var step = sequence[cursor];
    if (step.type === "welcome") renderWelcome();
    else if (step.type === "sectionIntro") renderSectionIntro(step.sectionIndex);
    else if (step.type === "question") renderQuestion(step.flatIndex);
    else if (step.type === "results") renderResults();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function escapeHtml(str){
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(str){ return escapeHtml(str).replace(/"/g, "&quot;"); }

  goToNext();

})();
</script>
</body>
</html>
