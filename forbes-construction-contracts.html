<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Contracts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --card: #1e2333;
    --border: #2a3045;
    --accent: #e8a830;
    --accent-dim: rgba(232,168,48,0.15);
    --accent-hover: #f0bc4a;
    --text: #e8eaf0;
    --muted: #7a829e;
    --correct: #3db88a;
    --correct-bg: rgba(61,184,138,0.12);
    --wrong: #e05c5c;
    --wrong-bg: rgba(224,92,92,0.12);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* ─── HEADER ─────────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    text-align: center;
    position: relative;
  }

  .logo-svg { display: block; margin: 0 auto 6px; }

  .lesson-tag {
    display: inline-block;
    background: var(--accent-dim);
    border: 1px solid rgba(232,168,48,0.3);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-top: 10px;
  }

  /* ─── LANGUAGE SWITCH ─────────────────────────── */
  .lang-switch {
    position: absolute;
    top: 20px;
    right: 20px;
  }

  .lang-switch select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 20px;
    cursor: pointer;
  }

  .lang-switch select:focus { outline: none; border-color: var(--accent); color: var(--text); }

  /* ─── BACKGROUND PHOTO (persistent, low-opacity) ─ */
  .bg-photo {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
  }

  .bg-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    opacity: 0.32;
    filter: saturate(0.75);
  }

  .bg-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--bg) 0%, rgba(15,17,23,0.15) 40%, var(--bg) 100%);
  }

  /* ─── COVER / FRONT PAGE ──────────────────────── */
  .cover-screen {
    max-width: 820px;
    margin: 0 auto;
    padding: 2.4rem 20px 1rem;
  }

  .cover-hero {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 14px 38px rgba(0,0,0,0.45);
    margin-bottom: 26px;
    border: 1px solid var(--border);
  }

  .cover-hero img { width: 100%; height: auto; display: block; }

  .cover-hero-overlay {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 26px 24px;
    background: linear-gradient(180deg, transparent, rgba(10,12,17,0.92) 78%);
  }

  .cover-hero-overlay .lesson-tag { margin: 0 0 12px; }

  .cover-hero-overlay h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.1rem;
    font-weight: 700;
    color: #fdfdfd;
    line-height: 1.18;
  }

  .cover-hero-overlay h1 em { color: var(--accent); font-style: normal; }

  .cover-hero-overlay p {
    color: var(--muted);
    font-size: 0.94rem;
    margin-top: 12px;
    max-width: 540px;
    line-height: 1.5;
  }

  .cover-start-wrap { text-align: center; margin-top: 6px; }

  @media (max-width: 600px) {
    .cover-hero-overlay { padding: 20px 18px 18px; }
    .cover-hero-overlay h1 { font-size: 1.5rem; }
    .lang-switch { position: static; margin-top: 12px; text-align: center; }
  }

  /* ─── SCORE BAR ───────────────────────────────── */
  .score-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    font-size: 13px;
    font-weight: 500;
  }

  .score-pill {
    background: var(--accent-dim);
    border: 1px solid rgba(232,168,48,0.3);
    color: var(--accent);
    padding: 5px 14px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .progress-wrap {
    flex: 1;
    margin: 0 20px;
  }

  .progress-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
    text-align: center;
  }

  .progress-bar {
    background: var(--border);
    border-radius: 4px;
    height: 4px;
    overflow: hidden;
  }

  .progress-fill {
    background: var(--accent);
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* ─── MAIN LAYOUT ─────────────────────────────── */
  .main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 0;
  }

  /* ─── ACTIVITY HEADER ─────────────────────────── */
  .activity-header {
    margin-bottom: 28px;
    animation: fadeUp 0.5s ease both;
  }

  .activity-num {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .activity-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .activity-subtitle {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ─── QUESTION CARD ───────────────────────────── */
  .question-card {
    background: rgba(30,35,51,0.78);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease both;
  }

  .q-counter {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 17px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 24px;
  }

  .q-text em {
    color: var(--accent);
    font-style: normal;
    font-weight: 600;
  }

  /* ─── ANSWER OPTIONS ─────────────────────────── */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 14px 18px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text);
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    line-height: 1.5;
    text-align: left;
  }

  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: var(--accent-dim);
    transform: translateX(3px);
  }

  .option.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .option.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }

  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }

  .option.disabled { cursor: default; }

  .opt-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }

  .option.selected .opt-label { background: var(--accent); color: #0f1117; }
  .option.correct .opt-label { background: var(--correct); color: #fff; }
  .option.wrong .opt-label { background: var(--wrong); color: #fff; }

  /* ─── FEEDBACK ────────────────────────────────── */
  .feedback {
    border-radius: 9px;
    padding: 16px 18px;
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }

  .feedback.show { display: block; animation: fadeUp 0.3s ease; }
  .feedback.correct-fb { background: var(--correct-bg); border: 1px solid rgba(61,184,138,0.3); color: #6ee7b7; }
  .feedback.wrong-fb { background: var(--wrong-bg); border: 1px solid rgba(224,92,92,0.3); color: #fca5a5; }

  .feedback strong { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }

  /* ─── FILL IN THE BLANK ───────────────────────── */
  .blank-input {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    transition: border-color 0.2s;
    outline: none;
  }

  .blank-input:focus { border-color: var(--accent); }
  .blank-input.correct { border-color: var(--correct); background: var(--correct-bg); }
  .blank-input.wrong { border-color: var(--wrong); background: var(--wrong-bg); }

  .word-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .word-chip {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-family: 'DM Mono', monospace;
  }

  .word-chip:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .word-chip.used { opacity: 0.35; pointer-events: none; }

  .fitb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .fitb-sentence {
    font-size: 15px;
    line-height: 1.6;
    flex: 1;
    min-width: 200px;
  }

  /* ─── MATCHING ────────────────────────────────── */
  .matching-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .match-col { display: flex; flex-direction: column; gap: 8px; }

  .match-term {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    min-height: 54px;
    display: flex;
    align-items: center;
  }

  .match-select {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
    min-height: 54px;
    -webkit-appearance: none;
  }

  .match-select:focus { border-color: var(--accent); }
  .match-select.correct { border-color: var(--correct); background: var(--correct-bg); }
  .match-select.wrong { border-color: var(--wrong); background: var(--wrong-bg); }

  /* ─── BUTTONS ─────────────────────────────────── */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .btn {
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 9px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    letter-spacing: 0.2px;
  }

  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary {
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .btn.secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .btn[style*="display: none"], .btn.hidden { display: none !important; }

  /* ─── FINAL SCREEN ────────────────────────────── */
  .final-screen {
    text-align: center;
    padding: 40px 24px;
    animation: fadeUp 0.6s ease;
  }

  .final-icon {
    font-size: 56px;
    margin-bottom: 16px;
    display: block;
  }

  .final-score-big {
    font-family: 'Playfair Display', serif;
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 8px;
  }

  .final-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .final-message {
    font-size: 18px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto 32px;
    font-family: 'Playfair Display', serif;
  }

  /* ─── DIVIDER ─────────────────────────────────── */
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 36px 0;
  }

  /* ─── ANIMATIONS ──────────────────────────────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── DRAG & DROP ─────────────────────────────── */
  .drag-container { display: flex; flex-direction: column; gap: 24px; }

  .drag-bank-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .drag-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 44px;
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  .drag-chip {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: grab;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    transition: border-color 0.2s, background 0.2s, transform 0.15s, opacity 0.2s;
    user-select: none;
  }

  .drag-chip:hover { border-color: var(--accent); background: var(--accent-dim); transform: scale(1.03); }
  .drag-chip.dragging { opacity: 0.4; transform: scale(0.96); }
  .drag-chip.placed { opacity: 0.35; pointer-events: none; }

  .drop-targets { display: flex; flex-direction: column; gap: 12px; }

  .drop-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px 16px;
  }

  .drop-sentence {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    flex: 1;
  }

  .drop-zone {
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    min-width: 140px;
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    transition: border-color 0.2s, background 0.2s;
  }

  .drop-zone.over { border-color: var(--accent); background: var(--accent-dim); }
  .drop-zone.filled { border-style: solid; border-color: var(--border); color: var(--text); cursor: pointer; }
  .drop-zone.filled:hover { border-color: var(--wrong); }
  .drop-zone.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
  .drop-zone.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }

  select option { background: #1e2333; color: #e8eaf0; }

  @media (max-width: 600px) {
    .matching-grid { grid-template-columns: 1fr; }
    .activity-title { font-size: 22px; }
  }
</style>
</head>

function applyStaticText(t) {
  const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };

  // Score bar / progress (safe to refresh regardless of lesson state)
  updateScoreBar();

  const act = activities[currentActivity];

  // Activity header (num / title / subtitle) — only present while an activity is on screen
  if (act) {
    if (act.type === 'mc') {
      setText('actNum', mcCurrentQ === 0 ? t.act1Num : `${t.act1Num} · ${t.act1Title}`);
      setText('actTitle', t.act1Title);
      setText('actSubtitle', t.act1Subtitle);
      setText('qCounter', t.questionCounter(mcCurrentQ + 1, act.questions.length));
      const fbPrefix = document.getElementById('fbPrefix');
      if (fbPrefix) {
        const fb = document.getElementById('feedback');
        fbPrefix.textContent = fb && fb.classList.contains('correct-fb') ? t.correctPrefix : t.incorrectPrefix;
      }
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) nextBtn.textContent = (mcCurrentQ >= act.questions.length - 1) ? t.nextActivityBtn : t.nextQuestionBtn;
    } else if (act.type === 'drag') {
      setText('actNum', t.act2Num);
      setText('actTitle', t.act2Title);
      setText('actSubtitle', t.act2Subtitle);
      setText('dragBankLabel', t.dragBankLabel);
      document.querySelectorAll('.drop-zone').forEach(dz => {
        if (!dragAnswered && !dz.dataset.placed) dz.textContent = t.dropHere;
      });
      setText('checkDragBtn', t.checkAnswersBtn);
      setText('dragNextBtn', t.nextActivityBtn);
      const dragFb = document.getElementById('dragFeedback');
      if (dragFb && dragAnswered) dragFb.innerHTML = computeDragFeedback();
    } else if (act.type === 'match') {
      setText('actNum', t.act3Num);
      setText('actTitle', t.act3Title);
      setText('actSubtitle', t.act3Subtitle);
      document.querySelectorAll('.match-select option[value=""]').forEach(o => o.textContent = t.selectDefinitionPlaceholder);
      setText('checkMatchBtn', t.checkAnswersBtn);
      setText('matchNextBtn', t.seeResultsBtn);
      const matchFb = document.getElementById('matchFeedback');
      if (matchFb && matchAnswered) matchFb.innerHTML = computeMatchFeedback();
    }
  }

  // Final screen
  const finalLabel = document.getElementById('finalLabel');
  if (finalLabel) {
    finalLabel.textContent = t.finalLabel(score, totalQuestions);

let totalQuestions = 0;
activities.forEach(a => {
  if (a.type === 'mc') totalQuestions += a.questions.length;
  else if (a.type === 'drag') totalQuestions += a.items.length;
  else if (a.type === 'match') totalQuestions += a.pairs.length;
});

let score = 0;
let answeredCount = 0;
let currentActivity = 0;

// ─── MC state
let mcCurrentQ = 0;
let mcAnswered = false;

// ─── Drag state
let dragPlaced = {};
let dragAnswered = false;
let draggingChip = null;

// ─── Match state
let matchAnswered = false;

// ═══════════════════════════════════════════════════════
// RENDER ROUTER
// ═══════════════════════════════════════════════════════

function updateScoreBar() {
  const t = UI_I18N[currentLang];
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('progressLabel').textContent = t.progressLabel(currentActivity + 1, activities.length);
  const pct = (answeredCount / totalQuestions) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('qCounterGlobal').textContent = t.qCounterGlobal(answeredCount, totalQuestions);
}

function render() {
  updateScoreBar();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if (currentActivity >= activities.length) {
    renderFinal(main);
    return;
  }
  const act = activities[currentActivity];
  if (act.type === 'mc') renderMC(main, act);
  else if (act.type === 'drag') renderDrag(main, act);
  else if (act.type === 'match') renderMatch(main, act);
}

// ═══════════════════════════════════════════════════════
// ACTIVITY 1 – MULTIPLE CHOICE
// ═══════════════════════════════════════════════════════

function renderMC(container, act) {
  mcAnswered = false;
  const t = UI_I18N[currentLang];

  const q = act.questions[mcCurrentQ];
  const totalInAct = act.questions.length;

  // Header (only on first question)
  if (mcCurrentQ === 0) {
    const hdr = document.createElement('div');
    hdr.className = 'activity-header';
    hdr.innerHTML = `
      <div class="activity-num" id="actNum">${t.act1Num}</div>
      <div class="activity-title" id="actTitle">${t.act1Title}</div>
      <div class="activity-subtitle" id="actSubtitle">${t.act1Subtitle}</div>`;
    container.appendChild(hdr);
  } else {
    const mini = document.createElement('div');
    mini.className = 'activity-header';
    mini.innerHTML = `<div class="activity-num" id="actNum">${t.act1Num} · ${t.act1Title}</div>`;
    container.appendChild(mini);
  }

  const card = document.createElement('div');
  card.className = 'question-card';
  card.innerHTML = `
    <div class="q-counter" id="qCounter">${t.questionCounter(mcCurrentQ + 1, totalInAct)}</div>
    <div class="q-text">${q.text}</div>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>`;
  container.appendChild(card);

  const optWrap = card.querySelector('#optionsWrap');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.innerHTML = `<span class="opt-label">${opt.label}</span><span>${opt.text}</span>`;
    btn.addEventListener('click', () => selectMC(i, q, optWrap, card));
    optWrap.appendChild(btn);
  });

  const nextLabel = (mcCurrentQ >= totalInAct - 1) ? t.nextActivityBtn : t.nextQuestionBtn;
  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  btnRow.innerHTML = `<button class="btn" id="nextBtn" style="display:none" onclick="nextMC(${JSON.stringify(act.questions.length)})">${nextLabel}</button>`;
  container.appendChild(btnRow);
}

function selectMC(idx, q, optWrap, card) {
  if (mcAnswered) return;
  mcAnswered = true;
  answeredCount++;
  const t = UI_I18N[currentLang];

  const opts = optWrap.querySelectorAll('.option');
  opts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === q.correct) o.classList.add('correct');
    else if (i === idx) o.classList.add('wrong');
  });

  const isCorrect = idx === q.correct;
  if (isCorrect) score++;

  const fb = card.querySelector('#feedback');
  fb.className = `feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'} show`;
  fb.innerHTML = `<strong id="fbPrefix">${isCorrect ? t.correctPrefix : t.incorrectPrefix}</strong>${q.explanation}`;

  document.getElementById('nextBtn').style.display = 'block';
  updateScoreBar();
}

function nextMC(total) {
  mcCurrentQ++;
  if (mcCurrentQ >= total) {
    currentActivity++;
    mcCurrentQ = 0;
  }
  render();
}

function renderDrag(container, act) {
  dragPlaced = {};
  dragAnswered = false;
  const t = UI_I18N[currentLang];

  const hdr = document.createElement('div');
  hdr.className = 'activity-header';
  hdr.innerHTML = `
    <div class="activity-num" id="actNum">${t.act2Num}</div>
    <div class="activity-title" id="actTitle">${t.act2Title}</div>
    <div class="activity-subtitle" id="actSubtitle">${t.act2Subtitle}</div>`;
  container.appendChild(hdr);

  const card = document.createElement('div');
  card.className = 'question-card';

  // Word bank
  const bankLabel = document.createElement('div');
  bankLabel.className = 'drag-bank-label';
  bankLabel.id = 'dragBankLabel';
  bankLabel.textContent = t.dragBankLabel;
  card.appendChild(bankLabel);

  const bank = document.createElement('div');
  bank.className = 'drag-bank';
  bank.id = 'dragBank';

  // Shuffle bank
  const shuffled = [...act.bank].sort(() => Math.random() - 0.5);
  shuffled.forEach(word => {
    const chip = createDragChip(word);
    bank.appendChild(chip);
  });
  card.appendChild(bank);

  // Drop targets
  const targets = document.createElement('div');
  targets.className = 'drop-targets';
  targets.style.marginTop = '20px';

  act.items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'drop-row';
    row.innerHTML = `
      <div class="drop-sentence">${item.sentence.replace('___', '<span style="color:var(--accent);font-weight:600">___</span>')}</div>
      <div class="drop-zone" id="drop-${i}" data-index="${i}" data-answer="${item.answer}">${t.dropHere}</div>`;
    targets.appendChild(row);
  });
  card.appendChild(targets);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  btnRow.innerHTML = `
    <button class="btn" id="checkDragBtn" onclick="checkDrag(${act.items.length})">${t.checkAnswersBtn}</button>
    <div class="feedback" id="dragFeedback" style="margin-top:0; display:none; flex:1"></div>`;
  card.appendChild(btnRow);

  container.appendChild(card);

  // Set up drop zones
  act.items.forEach((_, i) => {
    const dz = document.getElementById(`drop-${i}`);
    setupDropZone(dz);
  });

  // Set up drag chips
  card.querySelectorAll('.drag-chip').forEach(chip => setupDragChip(chip));
}

function createDragChip(word) {
  const chip = document.createElement('div');
  chip.className = 'drag-chip';
  chip.textContent = word;
  chip.draggable = true;
  chip.dataset.word = word;
  return chip;
}

function setupDragChip(chip) {
  chip.addEventListener('dragstart', e => {
    draggingChip = chip;
    chip.classList.add('dragging');
    e.dataTransfer.setData('text/plain', chip.dataset.word);
  });
  chip.addEventListener('dragend', () => {
    chip.classList.remove('dragging');
    draggingChip = null;
  });
}

function setupDropZone(dz) {
  dz.addEventListener('dragover', e => {
    e.preventDefault();
    dz.classList.add('over');
  });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('over');
    const word = e.dataTransfer.getData('text/plain');
    placeInDropZone(dz, word);
  });
  // Click to remove
  dz.addEventListener('click', () => {
    if (dz.classList.contains('filled') && !dragAnswered) {
      const word = dz.dataset.placed;
      delete dragPlaced[dz.dataset.index];
      // Restore chip
      const chip = document.querySelector(`[data-word="${word}"].drag-chip`);
      if (chip) chip.classList.remove('placed');
      dz.textContent = UI_I18N[currentLang].dropHere;
      dz.className = 'drop-zone';
      delete dz.dataset.placed;
    }
  });
}

function placeInDropZone(dz, word) {
  if (dragAnswered) return;
  const idx = dz.dataset.index;

  // If something was already here, return it
  if (dz.dataset.placed) {
    const old = dz.dataset.placed;
    const oldChip = document.querySelector(`[data-word="${old}"].drag-chip`);
    if (oldChip) oldChip.classList.remove('placed');
    delete dragPlaced[idx];
  }

  // Mark chip as placed
  const chip = document.querySelector(`[data-word="${word}"].drag-chip`);
  if (chip) chip.classList.add('placed');

  dz.textContent = word;
  dz.className = 'drop-zone filled';
  dz.dataset.placed = word;
  dragPlaced[idx] = word;
}

function computeDragFeedback() {
  const t = UI_I18N[currentLang];
  const zones = document.querySelectorAll('.drop-zone');
  const total = zones.length;
  const correct = document.querySelectorAll('.drop-zone.correct').length;
  let body;
  if (correct === total) body = t.dragAllCorrect;
  else if (correct > total / 2) body = t.dragGoodEffort;
  else {
    const missed = [...document.querySelectorAll('.drop-zone.wrong')].map(dz => `<em>${dz.textContent}</em>`).join(', ');
    body = t.dragKeepPracticingPrefix + missed;
  }
  return `<strong>${t.dragResultPrefix(correct, total)}</strong>${body}`;
}

function checkDrag(total) {
  if (dragAnswered) return;
  dragAnswered = true;
  const t = UI_I18N[currentLang];

  const act = activities[currentActivity];
  let correct = 0;

  for (let i = 0; i < total; i++) {
    const dz = document.getElementById(`drop-${i}`);
    const expected = act.items[i].answer;
    const placed = dragPlaced[i] || '';
    if (placed === expected) {
      correct++;
      score++;
      dz.classList.add('correct');
    } else {
      dz.classList.add('wrong');
      dz.title = `Answer: ${expected}`;
    }
  }

  answeredCount += total;
  updateScoreBar();

  // Show correct answers in wrong zones
  for (let i = 0; i < total; i++) {
    const dz = document.getElementById(`drop-${i}`);
    if (dz.classList.contains('wrong')) {
      dz.textContent = act.items[i].answer;
    }
  }

  const fb = document.getElementById('dragFeedback');
  fb.style.display = 'block';
  fb.className = `feedback ${correct === total ? 'correct-fb' : correct > total / 2 ? 'correct-fb' : 'wrong-fb'} show`;
  fb.style.marginTop = '16px';
  fb.innerHTML = computeDragFeedback();

  // Replace check button with next
  document.getElementById('checkDragBtn').outerHTML = `<button class="btn" id="dragNextBtn" onclick="nextActivity()">${t.nextActivityBtn}</button>`;
}

function nextActivity() {
  currentActivity++;
  render();
}

// ═══════════════════════════════════════════════════════
// ACTIVITY 3 – MATCHING
// ═══════════════════════════════════════════════════════

function renderMatch(container, act) {
  matchAnswered = false;
  const t = UI_I18N[currentLang];

  const hdr = document.createElement('div');
  hdr.className = 'activity-header';
  hdr.innerHTML = `
    <div class="activity-num" id="actNum">${t.act3Num}</div>
    <div class="activity-title" id="actTitle">${t.act3Title}</div>
    <div class="activity-subtitle" id="actSubtitle">${t.act3Subtitle}</div>`;
  container.appendChild(hdr);

  const card = document.createElement('div');
  card.className = 'question-card';

  // Shuffle definitions for dropdown options
  const defs = act.pairs.map(p => p.def);
  const shuffledDefs = [...defs].sort(() => Math.random() - 0.5);

  const grid = document.createElement('div');
  grid.className = 'matching-grid';

  const leftCol = document.createElement('div');
  leftCol.className = 'match-col';
  const rightCol = document.createElement('div');
  rightCol.className = 'match-col';

  act.pairs.forEach((pair, i) => {
    const term = document.createElement('div');
    term.className = 'match-term';
    term.textContent = pair.term;
    leftCol.appendChild(term);

    const sel = document.createElement('select');
    sel.className = 'match-select';
    sel.id = `match-${i}`;
    sel.innerHTML = `<option value="">${t.selectDefinitionPlaceholder}</option>` +
      shuffledDefs.map(d => `<option value="${d}">${d}</option>`).join('');
    rightCol.appendChild(sel);
  });

  grid.appendChild(leftCol);
  grid.appendChild(rightCol);
  card.appendChild(grid);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'matchFeedback';
  card.appendChild(fb);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  btnRow.innerHTML = `<button class="btn" id="checkMatchBtn" onclick="checkMatch(${act.pairs.length})">${t.checkAnswersBtn}</button>`;
  card.appendChild(btnRow);

  container.appendChild(card);
}

function computeMatchFeedback() {
  const t = UI_I18N[currentLang];
  const total = document.querySelectorAll('.match-select').length;
  const correct = document.querySelectorAll('.match-select.correct').length;
  const body = correct === total ? t.matchAllCorrect :
    correct >= Math.ceil(total / 2) ? t.matchGood :
    t.matchKeep;
  return `<strong>${t.matchResultPrefix(correct, total)}</strong>${body}`;
}

function checkMatch(total) {
  if (matchAnswered) return;
  matchAnswered = true;
  const t = UI_I18N[currentLang];

  const act = activities[currentActivity];
  let correct = 0;

  for (let i = 0; i < total; i++) {
    const sel = document.getElementById(`match-${i}`);
    const expected = act.pairs[i].def;
    if (sel.value === expected) {
      correct++;
      score++;
      sel.classList.add('correct');
    } else {
      sel.classList.add('wrong');
    }
    sel.disabled = true;
  }

  answeredCount += total;
  updateScoreBar();

  const fb = document.getElementById('matchFeedback');
  fb.className = `feedback ${correct >= total * 0.8 ? 'correct-fb' : 'wrong-fb'} show`;
  fb.innerHTML = computeMatchFeedback();

  document.getElementById('checkMatchBtn').outerHTML = `<button class="btn" id="matchNextBtn" onclick="nextActivity()">${t.seeResultsBtn}</button>`;
}

// ═══════════════════════════════════════════════════════
// FINAL SCREEN
// ═══════════════════════════════════════════════════════

function renderFinal(container) {
  const t = UI_I18N[currentLang];
  const pct = Math.round((score / totalQuestions) * 100);
  let icon = '🏗️', msg = '';
  if (pct >= 85) { icon = '🏆'; msg = t.finalOutstandingMsg; }
  else if (pct >= 65) { icon = '📋'; msg = t.finalStrongMsg; }
  else { icon = '📐'; msg = t.finalKeepMsg; }

  container.innerHTML = `
    <div class="final-screen">
      <span class="final-icon">${icon}</span>
      <div class="final-score-big">${pct}%</div>
      <div class="final-label" id="finalLabel">${t.finalLabel(score, totalQuestions)}</div>
      <div class="final-message" id="finalMessage">${msg}</div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn" id="tryAgainBtn" onclick="restartLesson()">${t.tryAgain}</button>
        <button class="btn secondary" id="reviewTermsBtn" onclick="showReview()">${t.reviewTerms}</button>
      </div>
      <div id="reviewPanel" style="display:none; margin-top:32px; text-align:left;"></div>
    </div>`;
}

function showReview() {
  const t = UI_I18N[currentLang];
  const panel = document.getElementById('reviewPanel');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    panel.innerHTML = `
      <hr class="section-divider">
      <div id="reviewHeadingText" style="font-family:'Playfair Display',serif; font-size:20px; font-weight:700; margin-bottom:20px;">${t.reviewHeading}</div>
      <div style="display:grid; gap:12px;">
        ${[
          ['Lump-sum contract', 'A single fixed price agreed before work begins; cost overruns are the contractor\'s responsibility.'],
          ['Cost-plus contract', 'Client pays all verified costs plus an agreed fee or percentage; financial risk sits with the client.'],
          ['Target cost contract', 'Savings and overruns are shared between client and contractor via a pre-agreed \'pain/gain\' formula.'],
          ['Performance bonus', 'A financial incentive paid to the contractor for exceeding agreed targets (time, quality, cost).'],
          ['Penalty clauses', 'Contract provisions that impose financial penalties for failure to meet specified obligations.'],
          ['Risk allocation', 'The process of deciding which party is financially responsible for specific project uncertainties.'],
          ['Value engineering', 'A systematic review to achieve equivalent function at lower cost or better performance at equivalent cost.'],
          ['Change order', 'A formal contractual instruction to modify the agreed scope, price, or schedule.'],
          ['Procurement strategy', 'A planned approach to selecting contractors and structuring the commercial relationship.'],
        ].map(([term, def]) => `
          <div style="background:var(--card); border:1px solid var(--border); border-radius:9px; padding:16px 18px;">
            <div style="font-weight:600; color:var(--accent); font-size:14px; margin-bottom:6px;">${term}</div>
            <div style="font-size:14px; color:var(--muted); line-height:1.6;">${def}</div>
          </div>`).join('')}
      </div>`;
  } else {
    panel.style.display = 'none';
  }
}

function restartLesson() {
  score = 0;
  answeredCount = 0;
  currentActivity = 0;
  mcCurrentQ = 0;
  dragPlaced = {};
  dragAnswered = false;
  matchAnswered = false;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startLesson() {
  document.getElementById('coverScreen').style.display = 'none';
  document.getElementById('scoreBar').style.display = 'flex';
  document.getElementById('mainContent').style.display = 'block';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

initLangSwitch();
</script>
