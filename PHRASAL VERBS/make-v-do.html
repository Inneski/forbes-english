<!DOCTYPE html>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Make v Do — Forbes English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf7f2;
    --ink: #1f2430;
    --ink-soft: #565c6b;
    --make: #146b5c;
    --make-soft: #d9ece7;
    --make-deep: #0c463c;
    --do: #3c4a9e;
    --do-soft: #e1e4f7;
    --do-deep: #262f6b;
    --line: #e4ded3;
    --wrong: #b3432f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .app { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }

  .topbar {
    position: sticky;
    top: 0;
    background: var(--paper);
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }

  .topbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand-block { display: flex; align-items: center; gap: 10px; }

  .logo-mark { width: 38px; height: 38px; flex-shrink: 0; }

  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }

  #brandName { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }

  #lessonTitle { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; }

  .topbar-controls { display: flex; align-items: center; gap: 10px; }

  #langBtn {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 20px;
    padding: 7px 14px;
    cursor: pointer;
  }

  .score-chip {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    background: var(--make-soft);
    color: var(--make-deep);
    border-radius: 20px;
    padding: 7px 14px;
    white-space: nowrap;
  }

  .progress-track {
    margin-top: 12px;
    height: 6px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--make), var(--do));
    transition: width 0.35s ease;
  }

  #progressLabel {
    display: block;
    text-align: right;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  main { padding-top: 28px; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 28px;
    animation: rise 0.35s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .subtitle { color: var(--ink-soft); font-size: 15px; margin-top: 0; }

  .intro h2 { font-family: 'Fraunces', serif; font-size: 19px; margin-bottom: 14px; }

  .rule-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .rule-row p { margin: 0; font-size: 15px; line-height: 1.5; }

  .pill {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .pill.make { background: var(--make-soft); color: var(--make-deep); }
  .pill.do { background: var(--do-soft); color: var(--do-deep); }

  .rule-warning {
    font-size: 14px;
    color: var(--ink-soft);
    background: #fbf3ec;
    border-left: 3px solid #c98a4b;
    padding: 10px 14px;
    border-radius: 8px;
    margin: 18px 0 22px;
  }

  .btn.primary {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    cursor: pointer;
    width: 100%;
  }
  .btn.primary:hover { background: #000; }

  .q-sentence {
    font-family: 'Fraunces', serif;
    font-size: 21px;
    line-height: 1.5;
    margin-bottom: 26px;
  }

  .gap {
    display: inline-block;
    border-bottom: 2px dashed var(--ink-soft);
    padding: 0 6px;
  }

  .q-prompt { color: var(--ink-soft); font-size: 14px; margin-bottom: 14px; }

  .options {
    display: flex;
    gap: 12px;
    margin-bottom: 6px;
  }
  .options.stacked { flex-direction: column; }

  .opt-btn {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: center;
  }
  .opt-btn.make:hover:not(:disabled) { border-color: var(--make); }
  .opt-btn.do:hover:not(:disabled) { border-color: var(--do); }
  .opt-btn.pv:hover:not(:disabled) { border-color: var(--do); }
  .opt-btn:disabled { cursor: default; }

  .opt-btn.correct { background: var(--make-soft); border-color: var(--make); color: var(--make-deep); }
  .opt-btn.wrong { background: #fbe8e4; border-color: var(--wrong); color: var(--wrong); }

  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .feedback.good { background: var(--make-soft); color: var(--make-deep); }
  .feedback.bad { background: #fbe8e4; color: var(--wrong); }
  .feedback strong { font-family: 'Fraunces', serif; font-size: 16px; }
  .feedback em { font-style: normal; color: var(--ink-soft); font-size: 13.5px; }

  #nextBtn, #sortNextBtn { margin-top: 22px; }

  .sort-card h2 { font-family: 'Fraunces', serif; font-size: 19px; margin-top: 0; }
  .sort-help { color: var(--ink-soft); font-size: 14px; margin-top: -6px; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0 26px;
  }

  .chip {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 20px;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
  }
  .chip.selected { border-color: var(--ink); background: #f1efe9; }
  .chip.locked { cursor: default; }
  .chip.locked.correct { background: var(--make-soft); border-color: var(--make); color: var(--make-deep); }
  .chip.locked.wrong { background: #fbe8e4; border-color: var(--wrong); color: var(--wrong); }

  .buckets { display: flex; gap: 12px; }

  .bucket {
    flex: 1;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    padding: 18px;
    border-radius: 14px;
    border: 2px dashed var(--line);
    background: #fff;
    cursor: pointer;
  }
  .bucket.make { color: var(--make-deep); }
  .bucket.make:hover { border-color: var(--make); background: var(--make-soft); }
  .bucket.do { color: var(--do-deep); }
  .bucket.do:hover { border-color: var(--do); background: var(--do-soft); }

  .results { text-align: center; }
  .results h2 { font-family: 'Fraunces', serif; font-size: 22px; }
  .score-circle {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 30px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 18px auto;
    background: linear-gradient(135deg, var(--make-soft), var(--do-soft));
  }
  .tier-msg { font-size: 15px; color: var(--ink-soft); margin-bottom: 20px; }
  .review-list { text-align: left; font-size: 14px; color: var(--ink-soft); padding-left: 20px; margin-bottom: 24px; }
  .review-list li { margin-bottom: 6px; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    .q-sentence { font-size: 18px; }
    .buckets { flex-direction: column; }
  }
</style>
</head>

// ===== Make v Do — logic =====

function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

}

    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", () => goTo(screenIndex + 1));
}

function renderPvIntro() {
  root.innerHTML = `
    <div class="card intro">
      <h2>${t("pvHeading")}</h2>
      <p class="subtitle">${t("pvSubtitle")}</p>
      <button class="btn primary" id="pvStartBtn">${t("pvStart")}</button>
    </div>
  `;
  document.getElementById("pvStartBtn").addEventListener("click", () => goTo(screenIndex + 1));
}

function renderBlank(item) {
  const opts = fisherYates(["make", "do"]);
  root.innerHTML = `
    <div class="card">
      <div class="q-sentence">${item.sentence.replace("___", '<span class="gap">___</span>')}</div>
      <div class="options" id="optionsRow"></div>
      <div class="feedback" id="feedback" hidden></div>
      <button class="btn primary" id="nextBtn" hidden>${t("next")}</button>
    </div>
  `;
  const optionsRow = document.getElementById("optionsRow");
  opts.forEach(word => {
    const b = document.createElement("button");
    b.className = "opt-btn " + word;
    b.textContent = word.toUpperCase();
    b.addEventListener("click", () => handleBlankAnswer(item, word, b, optionsRow));
    optionsRow.appendChild(b);
  });
}

function handleBlankAnswer(item, chosen, btnEl, row) {
  Array.from(row.children).forEach(c => (c.disabled = true));
  const isCorrect = chosen === item.answer;
  markResult(isCorrect, btnEl, row, item.answer);
  showFeedback(isCorrect, item.en, item.de, item.sentence.replace("___", item.answer.toUpperCase()));
  recordAnswer(isCorrect, item.sentence.replace("___", "___ (" + item.answer + ")"));
}

function renderChoice(item) {
  const opts = fisherYates(item.options);
  root.innerHTML = `
    <div class="card">
      <p class="q-prompt">${t("check")}:</p>
      <div class="options stacked" id="optionsRow"></div>
      <div class="feedback" id="feedback" hidden></div>
      <button class="btn primary" id="nextBtn" hidden>${t("next")}</button>
    </div>
  `;
  const optionsRow = document.getElementById("optionsRow");
  opts.forEach(phrase => {
    const b = document.createElement("button");
    b.className = "opt-btn phrase " + (phrase.startsWith("make") ? "make" : "do");
    b.textContent = phrase;
    b.addEventListener("click", () => handleChoiceAnswer(item, phrase, b, optionsRow));
    optionsRow.appendChild(b);
  });
}

function handleChoiceAnswer(item, chosen, btnEl, row) {
  Array.from(row.children).forEach(c => (c.disabled = true));
  const isCorrect = chosen === item.answer;
  markResult(isCorrect, btnEl, row, item.answer, true);
  showFeedback(isCorrect, item.en, item.de);
  recordAnswer(isCorrect, item.answer);
}

function renderPv(item) {
  const opts = fisherYates(item.options);
  root.innerHTML = `
    <div class="card">
      <div class="q-sentence pv-sentence">${item.sentence.replace("___", '<span class="gap">___</span>')}</div>
      <div class="options stacked" id="optionsRow"></div>
      <div class="feedback" id="feedback" hidden></div>
      <button class="btn primary" id="nextBtn" hidden>${t("next")}</button>
    </div>
  `;
  const optionsRow = document.getElementById("optionsRow");
  opts.forEach(phrase => {
    const b = document.createElement("button");
    b.className = "opt-btn phrase pv";
    b.textContent = phrase;
    b.addEventListener("click", () => handlePvAnswer(item, phrase, b, optionsRow));
    optionsRow.appendChild(b);
  });
}

function handlePvAnswer(item, chosen, btnEl, row) {
  Array.from(row.children).forEach(c => (c.disabled = true));
  const isCorrect = chosen === item.answer;
  markResult(isCorrect, btnEl, row, item.answer, true);
  showFeedback(isCorrect, item.en, item.de, item.sentence.replace("___", item.answer.toUpperCase()));
  recordAnswer(isCorrect, item.sentence.replace("___", "___ (" + item.answer + ")"));
}

function markResult(isCorrect, btnEl, row, correctValue, isPhrase) {
  btnEl.classList.add(isCorrect ? "correct" : "wrong");
  if (!isCorrect) {
    Array.from(row.children).forEach(c => {
      const val = isPhrase ? c.textContent : c.textContent.toLowerCase();
      if (val === correctValue) c.classList.add("correct");
    });
  }
}

function showFeedback(isCorrect, enText, deText, extra) {
  const fb = document.getElementById("feedback");
  fb.hidden = false;
  fb.className = "feedback " + (isCorrect ? "good" : "bad");
  const headline = isCorrect ? t("correct") : t("incorrect");
  const explanation = lang === "en" ? enText : deText;
  fb.innerHTML = `<strong>${headline}</strong><span>${explanation}</span>${extra ? `<em>${extra}</em>` : ""}`;
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.hidden = false;
  nextBtn.onclick = () => goTo(screenIndex + 1);
}

function recordAnswer(isCorrect, label) {
  answeredCount++;
  if (isCorrect) score++;
  else missed.push(label);
  updateChrome();
}

function renderSort(screenData) {
  root.innerHTML = `
    <div class="card sort-card">
      <h2>${t("sortTitle")}</h2>
      <p class="sort-help">${t("sortHelp")}</p>
      <div class="chips" id="chips"></div>
      <div class="buckets">
        <button class="bucket make" id="bucketMake">MAKE</button>
        <button class="bucket do" id="bucketDo">DO</button>
      </div>
      <button class="btn primary" id="sortNextBtn" hidden>${t("next")}</button>
    </div>
  `;
  const chipsEl = document.getElementById("chips");
  let selected = null;
  let doneCount = 0;

  screenData.items.forEach(it => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = it.phrase;
    chip.dataset.id = it.id;
    chip.addEventListener("click", () => {
      if (chip.classList.contains("locked")) return;
      Array.from(chipsEl.children).forEach(c => c.classList.remove("selected"));
      chip.classList.add("selected");
      selected = { chip, data: it };
    });
    chipsEl.appendChild(chip);
  });

  function assign(bucketAnswer) {
    if (!selected) return;
    const { chip, data } = selected;
    const isCorrect = bucketAnswer === data.answer;
    chip.classList.remove("selected");
    chip.classList.add("locked", isCorrect ? "correct" : "wrong", bucketAnswer);
    if (!isCorrect) {
      chip.title = lang === "en"
        ? `Correct: ${data.answer.toUpperCase()}`
        : `Richtig: ${data.answer.toUpperCase()}`;
    }
    recordAnswer(isCorrect, data.phrase + " → " + data.answer);
    selected = null;
    doneCount++;
    if (doneCount === screenData.items.length) {
      const nextBtn = document.getElementById("sortNextBtn");
      nextBtn.hidden = false;
      nextBtn.onclick = () => goTo(screenIndex + 1);
    }
  }

  document.getElementById("bucketMake").addEventListener("click", () => assign("make"));
  document.getElementById("bucketDo").addEventListener("click", () => assign("do"));
}

function renderResults() {
  const pct = totalItems ? Math.round((score / totalItems) * 100) : 0;
  let tier = "resultsLow";
  if (pct >= 85) tier = "resultsGood";
  else if (pct >= 60) tier = "resultsMid";

  root.innerHTML = `
    <div class="card results">
      <h2>${t("resultsTitle")}</h2>
      <div class="score-circle">${score}/${totalItems}</div>
      <p class="tier-msg">${t(tier)}</p>
      ${missed.length ? `
        <h3>${t("reviewTitle")}</h3>
        <ul class="review-list">${missed.map(m => `<li>${m}</li>`).join("")}</ul>
      ` : ""}
      <button class="btn primary" id="retryBtn">${t("retry")}</button>
    </div>
  `;
  document.getElementById("retryBtn").addEventListener("click", () => window.location.reload());
}

function goTo(index) {
  screenIndex = index;
  const s = screens[index];
  if (s === "intro") renderIntro();
  else if (s === "pv-intro") renderPvIntro();
  else if (s === "results") renderResults();
  else if (s.kind === "blank") renderBlank(s.item);
  else if (s.kind === "choice") renderChoice(s.item);
  else if (s.kind === "pv") renderPv(s.item);
  else if (s.kind === "sort") renderSort(s);
  updateChrome();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

langBtn.addEventListener("click", () => {
  lang = lang === "en" ? "de" : "en";
  goTo(screenIndex);
});

goTo(0);
</script>
</body>
</html>
