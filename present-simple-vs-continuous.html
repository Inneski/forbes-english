<title>Present Simple vs Present Continuous (A2) | Forbes English</title>

<style>
/* Palette derived from PresentTenses/hero.jpg with extract-palette.py, like
   every other lesson on the site. The old version of this page invented
   #1a1a2e and two bin gradients from nothing. */
:root {
  --hero: url('PresentTenses/hero.jpg');
  --void          : #0c0f0e;
  --surface       : #161c1a;
  --surface2      : #1f2725;
  --border        : #ac6162;
  --text          : #f5f2f2;
  --text-dim      : #bfa3a4;
  --accent        : #e48f90;
  --accent-bright : #f3adae;
  --accent-dim    : #cc4b4c;
  --secondary     : #586e84;
  --contrast      : #1ded86;
  --ok: #35c98b; --no: #e4626f;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-ui: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, monospace;
  --r: 14px;
  /* The height of the bin row. The falling card, the progress bar, the centre
     rail and the why-line are all positioned off this, so it is one number,
     not four — the narrow-screen bug was three of them drifting apart. */
  --bins-h: 200px;

  /* Tense colours, from lesson-template/tense-palette.css. This lesson
     contrasts two tenses the system already owns, so it uses the system's
     values rather than the hero accent — which had been painting the
     present-simple box in the present-continuous pink. Both published values
     are dark, so each is lightened 55% toward white as that file instructs:
     navy 5.25:1 on --surface, pink 6.34:1.

     The third box is not a tense and takes no tense colour. --text-dim is
     pink-tinted in this palette and sits 46 RGB units from the continuous
     pink, so a true neutral is used: 71 units away, 7.68:1. */
  --t-present-simple    : color-mix(in srgb, #16345C 55%, white);
  --t-present-continuous: color-mix(in srgb, #C2185B 55%, white);
  --t-either            : #A8AEAE;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-ui); color: var(--text); background: var(--void);
  height: 100vh; width: 100vw; overflow: hidden;
}
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
#bg::before {
  content: ''; position: absolute; inset: 0;
  background: var(--hero) center / cover no-repeat;
  opacity: .30; filter: saturate(.8);
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--void) 55%, transparent) 0%,
    color-mix(in srgb, var(--void) 25%, transparent) 40%,
    color-mix(in srgb, var(--void) 80%, transparent) 100%);
}
#wrap {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  max-width: 1100px; margin: 0 auto;
}

/* ── top bar ── */
#top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 12px 20px;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
  background: color-mix(in srgb, var(--void) 70%, transparent);
  backdrop-filter: blur(6px);
}
.fe-logo { width: 96px; height: auto; display: block; }
.fe-logo-mark { color: var(--accent); }
.fe-logo-word { fill: var(--text); opacity: 0; transition: opacity .25s ease; }
.fonts-ready .fe-logo-word { opacity: 1; }
#top-right { display: flex; align-items: center; gap: 10px; }
.badge {
  font-family: var(--font-mono); font-size: 12px; color: var(--text);
  background: color-mix(in srgb, var(--surface2) 80%, transparent);
  border: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
  border-radius: 999px; padding: 5px 13px; white-space: nowrap;
}
.tbtn {
  font-family: var(--font-mono); font-size: 12px; color: var(--text);
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
  border-radius: 999px; padding: 5px 13px; cursor: pointer;
}
.tbtn:hover { border-color: var(--accent); }
select.tbtn { padding-right: 8px; }

/* ── arena ── */
#arena { flex: 1; position: relative; overflow: hidden; }
#rail {
  position: absolute; left: 50%; top: 0; bottom: var(--bins-h);
  transform: translateX(-50%); width: 2px;
  background: linear-gradient(180deg,
    transparent, color-mix(in srgb, var(--accent) 45%, transparent), transparent);
}
#card {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 30px; font-weight: 700;
  color: var(--void); background: var(--text);
  border-radius: var(--r); padding: 14px 30px; white-space: nowrap;
  box-shadow: 0 10px 40px rgba(0,0,0,.45); cursor: grab; user-select: none;
  z-index: 20;
}
#card:active { cursor: grabbing; }
#card.dragging { opacity: .5; }
#card.good { background: var(--ok); }
#card.bad  { background: var(--no); color: var(--text); animation: shake .3s; }
@keyframes shake { 25%{transform:translateX(calc(-50% - 5px))} 75%{transform:translateX(calc(-50% + 5px))} }

/* ── bins ── */
#bins {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bins-h);
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 12px 16px 18px;
  z-index: 15;
}
.bin {
  border-radius: var(--r); cursor: pointer; position: relative;
  border: 2px dashed color-mix(in srgb, var(--border) 55%, transparent);
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 14px; text-align: center;
  transition: border-color .12s, background .12s, transform .1s;
}
/* One box per tense, in the site's tense colours. The third box is not a
   tense and takes the neutral. */
.bin[data-bin="0"] { --bin-colour: var(--t-present-simple); }
.bin[data-bin="1"] { --bin-colour: var(--t-present-continuous); }
.bin[data-bin="2"] { --bin-colour: var(--t-either); }
.bin { border-color: color-mix(in srgb, var(--bin-colour) 60%, transparent); }
.bin-label { color: var(--bin-colour); }
.bin:hover, .bin.over { border-style: solid; border-color: var(--bin-colour); transform: translateY(-2px); }
.bin.pop { animation: pop .22s ease-out; }
@keyframes pop { 50% { transform: scale(1.04); } }
.bin-key {
  font-family: var(--font-mono); font-size: 11px; color: var(--void);
  background: var(--bin-colour); border-radius: 999px; width: 22px; height: 22px;
  display: grid; place-items: center;
}
.bin-label { font-family: var(--font-ui); font-weight: 600; font-size: 17px; }
.bin-sub {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-dim);
}
.bin-count {
  position: absolute; top: 10px; right: 12px;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
}
#bar-wrap { position: absolute; left: 0; right: 0; bottom: var(--bins-h); height: 3px;
  background: rgba(0,0,0,.35); z-index: 15; }
#bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

/* ── why line ── */
#why {
  position: absolute; left: 50%; bottom: calc(var(--bins-h) + 14px); transform: translateX(-50%);
  width: min(760px, 92%); z-index: 18;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  border: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  border-left: 5px solid var(--ok);
  border-radius: 10px; padding: 12px 16px;
  font-size: 16px; line-height: 1.45; color: var(--text);
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
#why .why-go {
  display: none; margin-top: 8px;
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-dim);
}
#why.waiting .why-go { display: block; }
#why.show { opacity: 1; }
#why.no { border-left-color: var(--no); }

/* ── overlays ── */
.overlay {
  position: fixed; inset: 0; z-index: 100; display: none;
  /* flex-start + auto margins on the sheet, not align-items:center — a centred
     flex child taller than the viewport has its top cut off and cannot be
     scrolled to. At 320px that put the Play button out of reach. */
  align-items: flex-start; justify-content: center; padding: 24px;
  overflow-y: auto;
  background: color-mix(in srgb, var(--void) 78%, transparent);
  backdrop-filter: blur(5px);
}
.overlay.show { display: flex; }
.sheet {
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  border: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  border-radius: 20px; padding: 30px 34px; max-width: 880px; width: 100%; margin: auto;
  box-shadow: 0 20px 70px rgba(0,0,0,.6);
}
.eyebrow {
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent-bright); margin-bottom: 8px;
}
.sheet h2 {
  font-family: var(--font-display); font-size: 32px; font-weight: 700;
  line-height: 1.15; margin-bottom: 18px;
}
.sheet h2 em { color: var(--accent-bright); font-style: italic; }
.rules { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.rule {
  background: color-mix(in srgb, var(--surface2) 85%, transparent);
  border: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
  border-radius: 12px; padding: 16px;
}
.rule h3 { font-size: 17px; font-weight: 700; color: var(--accent-bright); margin-bottom: 6px; }
.rule p { font-size: 15.5px; line-height: 1.45; }
.rule .n { font-size: 13.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
.howto { font-size: 14.5px; color: var(--text-dim); margin-bottom: 18px; }
.btn {
  font-family: var(--font-ui); font-size: 16px; font-weight: 600;
  background: var(--accent); color: var(--void); border: none;
  border-radius: 999px; padding: 13px 32px; cursor: pointer;
}
.btn:hover { background: var(--accent-bright); }
.big { font-family: var(--font-display); font-size: 58px; font-weight: 900; line-height: 1; }
.big span { color: var(--text-dim); font-size: 32px; }
.pills { display: flex; gap: 12px; justify-content: center; margin: 14px 0 18px; }
.pill { font-family: var(--font-mono); font-size: 13px; border-radius: 999px; padding: 7px 16px; }
.pill.g { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.pill.b { background: color-mix(in srgb, var(--no) 22%, transparent); color: var(--no); }
.centre { text-align: center; }
/* Narrow screens stack the three bins, but they must stay pinned to the bottom
   of the arena. The previous rule set `position: static`, which moved them to
   the TOP — straight under the falling card, which has the higher z-index and
   covered the first bin completely. On a phone the game showed a card and only
   two of the three boxes, with "Present simple" hidden underneath, and the card
   never fell because its stop is computed from the bins and came out negative. */
@media (max-width: 820px) {
  :root { --bins-h: 264px; }
  .rules { grid-template-columns: 1fr; }
  #bins { grid-template-columns: 1fr; gap: 8px; padding: 8px 12px 12px; }
  .bin { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 16px; }
  .bin-label { font-size: 16px; text-align: left; }
  .bin-count { top: 50%; transform: translateY(-50%); }
  #card { font-size: 24px; padding: 12px 22px; max-width: 88%; white-space: normal; text-align: center; }
  #why { font-size: 14.5px; padding: 10px 14px; }
}

/* On a phone the header ran off the right edge and clipped the score. */
@media (max-width: 560px) {
  #top { padding: 10px 12px; gap: 8px; }
  #top-right { gap: 6px; }
  .badge, .tbtn { font-size: 11px; padding: 4px 9px; }
  .fe-logo { width: 74px; flex: 0 0 auto; }
}
</style>

<script>
const DATA = {"words": [{"t": "every day", "b": 0, "why": "A repeated, regular time. Frequency like this is the core of the present simple: <em>I check my email every day</em>."}, {"t": "always", "b": 2, "why": "<strong>Both.</strong> As a frequency adverb it takes the simple: <em>She always takes the bus</em>. With the continuous it stops being a timetable and becomes a complaint: <em>He&rsquo;s always interrupting</em>. Same adverb, two grammars, two meanings."}, {"t": "usually", "b": 0, "why": "Frequency adverb → present simple. It sits before the main verb: <em>I usually walk</em>."}, {"t": "never", "b": 0, "why": "Frequency adverb → present simple, and the verb stays positive: <em>He never eats meat</em>, not <em>doesn't never</em>."}, {"t": "sometimes", "b": 0, "why": "Frequency adverb → present simple. It is the one that can also open the sentence: <em>Sometimes I walk home</em>."}, {"t": "on Mondays", "b": 0, "why": "A repeating appointment. Note the plural <em>-s</em> — that is what makes it every Monday rather than one particular one."}, {"t": "twice a week", "b": 0, "why": "A stated frequency → present simple: <em>She swims twice a week</em>."}, {"t": "in general", "b": 0, "why": "Signals a general truth, which is the present simple's other main job: <em>In general, people prefer the direct train</em>."}, {"t": "often", "b": 0, "why": "Frequency adverb → present simple."}, {"t": "rarely", "b": 0, "why": "Frequency adverb → present simple, and like <em>never</em> it carries the negative itself: <em>I rarely see him</em>."}, {"t": "every summer", "b": 0, "why": "A repeated season → present simple: <em>They visit every summer</em>."}, {"t": "as a rule", "b": 0, "why": "A more formal way of saying <em>usually</em> → present simple."}, {"t": "right now", "b": 1, "why": "This exact moment → present continuous: <em>I'm writing right now</em>."}, {"t": "at the moment", "b": 1, "why": "This moment, or the current stretch of time → present continuous: <em>She's living in Berlin at the moment</em>."}, {"t": "currently", "b": 1, "why": "The formal version of <em>at the moment</em> → present continuous: <em>We are currently reviewing your application</em>."}, {"t": "at present", "b": 1, "why": "Formal, and points at now → present continuous."}, {"t": "Look!", "b": 1, "why": "An instruction to look at something happening in front of you → present continuous: <em>Look! It's snowing</em>."}, {"t": "Listen!", "b": 1, "why": "Works exactly like <em>Look!</em> — it points at this second: <em>Listen! Someone's knocking</em>."}, {"t": "at this moment", "b": 1, "why": "As explicit as it gets → present continuous."}, {"t": "while you wait", "b": 1, "why": "An action in progress around another one → present continuous: <em>I'm printing it while you wait</em>."}, {"t": "today", "b": 2, "why": "<strong>Both &mdash; but the continuous is the default.</strong> <em>I&rsquo;m working from home today</em> is the ordinary case: a temporary arrangement inside a day that is still running. The simple is the exception, and it wants a state or a fixed schedule &mdash; <em>I have three lessons today</em>, <em>the shop closes at six today</em>."}, {"t": "this week", "b": 2, "why": "<strong>Both &mdash; continuous by default.</strong> <em>I&rsquo;m covering for Sam this week</em> is the ordinary case. The simple needs a state or a timetable: <em>the shop closes at six this week</em>."}, {"t": "this month", "b": 2, "why": "<strong>Both &mdash; continuous by default.</strong> A temporary arrangement running through the month takes the continuous. The simple appears with states and fixed arrangements: <em>the rent falls due on the 1st this month</em>."}, {"t": "these days", "b": 2, "why": "<strong>Both.</strong> <em>These days people work from home</em> is a general truth — simple. <em>These days I'm cycling in</em> is a temporary change — continuous."}, {"t": "nowadays", "b": 2, "why": "<strong>Both</strong>, though the simple is far commoner: <em>Nowadays most people book online</em>. The continuous appears for a change still under way."}, {"t": "this year", "b": 2, "why": "<strong>Both &mdash; continuous by default.</strong> <em>I&rsquo;m learning Italian this year</em>. The simple is for states and scheduled facts: <em>my birthday falls on a Sunday this year</em>."}], "bins": {"en": ["Present simple", "Present continuous", "Either — the meaning decides"], "de": ["Present Simple", "Present Continuous", "Beides — die Bedeutung entscheidet"]}, "i18n": {"en": {"title": "Present Simple vs Present <em>Continuous</em>", "sub": "Speed sorting — twenty-six time expressions, three boxes", "ruleEyebrow": "Read this first", "ruleTitle": "The rule the game is testing", "r1h": "Present simple", "r1b": "Repeated, permanent, or generally true.", "r1n": "every day &middot; usually &middot; often &middot; on Mondays &middot; twice a week", "r2h": "Present continuous", "r2b": "Happening now, or temporary.", "r2n": "right now &middot; at the moment &middot; currently &middot; Look! &middot; Listen!", "r3h": "And the third box", "r3b": "Some expressions take either — but most of them lean one way.", "r3n": "<em>today</em>, <em>this week</em>, <em>this year</em> — continuous by default, with the simple kept for states and timetables. <em>nowadays</em> leans the other way, and <em>always</em> with the continuous is a complaint. Seven of the twenty-six belong here.", "play": "Play &rarr;", "howto": "Click a box, drag the card into it, or press <b>1</b>, <b>2</b>, <b>3</b>. You do not have to wait for the card to land.", "left": "left", "scoreLabel": "Score", "again": "Play again", "doneTitle": "Finished", "correct": "correct", "wrong": "wrong", "band4": "Full marks — including the seven that go either way, which is the hard part.", "band3": "Strong. Check which of the three boxes your misses came from.", "band2": "A fair start. Read the rule card again — especially the third box.", "band1": "Read the rule card, then play again. Everything you need is on it.", "backRule": "Show the rule", "continueHint": "Click or press space to continue"}, "de": {"title": "Present Simple vs Present <em>Continuous</em>", "sub": "Schnelles Sortieren — 26 Zeitangaben, drei Kästen", "ruleEyebrow": "Zuerst lesen", "ruleTitle": "Die Regel, um die es im Spiel geht", "r1h": "Present Simple", "r1b": "Wiederholt, dauerhaft oder allgemein gültig.", "r1n": "every day &middot; usually &middot; often &middot; on Mondays &middot; twice a week", "r2h": "Present Continuous", "r2b": "Passiert gerade jetzt, oder vorübergehend.", "r2n": "right now &middot; at the moment &middot; currently &middot; Look! &middot; Listen!", "r3h": "Und der dritte Kasten", "r3b": "Manche Ausdrücke passen zu beidem — die meisten neigen aber zu einer Seite.", "r3n": "<em>today</em>, <em>this week</em>, <em>this year</em> — standardmäßig Continuous, das Simple bleibt Zuständen und festen Plänen vorbehalten. <em>nowadays</em> neigt zur anderen Seite, und <em>always</em> mit dem Continuous ist eine Beschwerde. Sieben der 26 gehören hierher.", "play": "Spielen &rarr;", "howto": "Klicke einen Kasten an, zieh die Karte hinein oder drücke <b>1</b>, <b>2</b>, <b>3</b>. Du musst nicht warten, bis die Karte unten ist.", "left": "übrig", "scoreLabel": "Punkte", "again": "Nochmal spielen", "doneTitle": "Fertig", "correct": "richtig", "wrong": "falsch", "band4": "Volle Punktzahl — inklusive der sieben, die zu beidem passen. Das ist der schwierige Teil.", "band3": "Stark. Schau nach, aus welchem der drei Kästen deine Fehler kamen.", "band2": "Ein ordentlicher Anfang. Lies die Regelkarte noch einmal — vor allem den dritten Kasten.", "band1": "Lies die Regelkarte und spiel noch einmal. Alles, was du brauchst, steht darauf.", "backRule": "Regel anzeigen", "continueHint": "Klicken oder Leertaste zum Weiterlesen"}}};
const WORDS = DATA.words, BINS = DATA.bins, I18N = DATA.i18n;
let lang = 'en';
const t = k => (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : I18N.en[k];

document.fonts.ready.then(() => document.documentElement.classList.add('fonts-ready'));
setTimeout(() => document.documentElement.classList.add('fonts-ready'), 1500);

const $ = id => document.getElementById(id);
const cardEl = $('card'), whyEl = $('why'), binsEl = $('bins');

function buildBins() {
  binsEl.innerHTML = '';
  BINS[lang].forEach((label, i) => {
    const b = document.createElement('div');
    b.className = 'bin'; b.dataset.bin = i;
    b.innerHTML = '<div class="bin-key">' + (i + 1) + '</div>' +
      '<div class="bin-label">' + label + '</div>' +
      '<div class="bin-count" data-count="' + i + '">0</div>';
    binsEl.appendChild(b);
  });
}

function paint() {
  document.documentElement.lang = lang;
  $('i-eyebrow').innerHTML = t('ruleEyebrow');
  $('i-title').innerHTML = t('ruleTitle');
  ['r1h','r1b','r1n','r2h','r2b','r2n','r3h','r3b','r3n']
    .forEach(k => $(k).innerHTML = t(k));
  $('i-howto').innerHTML = t('howto');
  $('i-play').innerHTML = t('play');
  $('btn-rule').innerHTML = t('backRule');
  $('left-l').innerHTML = t('left');
  $('score-l').innerHTML = t('scoreLabel');
  $('d-eyebrow').innerHTML = t('doneTitle');
  $('d-again').innerHTML = t('again');
  buildBins();
  renderCounts();
}

/* ── game state ── */
let queue = [], i = 0, right = 0, wrong = 0, counts = [0,0,0];
let live = false, locked = false, dragging = false;
let y = 0, raf = null;

const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

function start() {
  $('intro').classList.remove('show');
  $('done').classList.remove('show');
  queue = shuffle(WORDS.map((w, n) => n));
  i = 0; right = 0; wrong = 0; counts = [0,0,0];
  live = true;
  renderCounts(); next();
}

function renderCounts() {
  counts.forEach((c, n) => {
    const el = binsEl.querySelector('[data-count="' + n + '"]');
    if (el) el.textContent = c;
  });
  $('left').textContent = Math.max(0, queue.length - i);
  $('score').textContent = right;
  $('bar').style.width = (queue.length ? (i / queue.length) * 100 : 0) + '%';
}

function next() {
  if (i >= queue.length) return finish();
  const w = WORDS[queue[i]];
  cardEl.innerHTML = w.t;
  cardEl.className = '';
  cardEl.style.display = 'block';
  cardEl.setAttribute('draggable', 'true');
  y = 8; cardEl.style.top = y + 'px';
  locked = false;
  hideWhy();
  cancelAnimationFrame(raf);
  fall();
}

/* The card falls, but an answer is accepted from the first frame — the old
   version refused input until it landed, which put dead time in front of
   every single item in a game called speed sorting. */
function fall() {
  const stop = binsEl.getBoundingClientRect().top
             - $('arena').getBoundingClientRect().top - cardEl.offsetHeight - 74;
  if (y < stop) { y += 1.9; cardEl.style.top = y + 'px'; raf = requestAnimationFrame(fall); }
  else { y = Math.max(8, stop); cardEl.style.top = y + 'px'; }
}

function showWhy(text, ok) {
  whyEl.innerHTML = text +
    '<span class="why-go">' + t('continueHint') + '</span>';
  whyEl.classList.toggle('no', !ok);
  whyEl.classList.add('show');
}
function hideWhy() { whyEl.classList.remove('show'); }

function answer(bin) {
  if (!live || locked) return;
  locked = true;
  cancelAnimationFrame(raf);
  const w = WORDS[queue[i]];
  const ok = bin === w.b;
  // The tally counts every card dropped in a box, right or wrong. It used to
  // increment only on a correct answer, so a learner who missed one watched
  // the number stay put and reasonably concluded it was broken.
  counts[bin]++;
  if (ok) { right++; } else { wrong++; }
  cardEl.classList.add(ok ? 'good' : 'bad');
  const b = binsEl.querySelector('.bin[data-bin="' + bin + '"]');
  if (b) { b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 230); }
  // Every card explains itself. The old version's entire feedback was a
  // colour, so a learner who did not already know could not find out.
  showWhy(w.why, ok);
  renderCounts();

  // The explanation used to be pulled off screen after 1.1s (2.6s on a miss),
  // which is not long enough to read a two-clause sentence in a second
  // language — the card you most need to read is the one you got wrong, and it
  // was gone before you finished it. Now:
  //   * a miss does not auto-advance at all. You read it, then continue.
  //   * a hit advances on a timer scaled to the length of its explanation,
  //     floored so the shortest one still sits long enough to be read.
  //   * either way, a click or Space/Enter goes on immediately, so nobody who
  //     reads quickly is held up.
  const words = w.why.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).length;
  armAdvance(ok ? Math.min(9000, Math.max(2600, words * 320)) : null);
}

/* Advancing is one path whether it fires from the timer, a click or a key. */
let advanceTimer = null, advanceFn = null;

function armAdvance(ms) {
  clearTimeout(advanceTimer);
  advanceFn = () => {
    if (!advanceFn) return;
    advanceFn = null;
    clearTimeout(advanceTimer);
    whyEl.classList.remove('waiting');
    cardEl.style.display = 'none';
    i++; renderCounts();
    setTimeout(() => (i < queue.length ? next() : finish()), 150);
  };
  whyEl.classList.toggle('waiting', ms === null);
  if (ms !== null) advanceTimer = setTimeout(() => advanceFn && advanceFn(), ms);
}

whyEl.addEventListener('click', () => advanceFn && advanceFn());

function finish() {
  live = false;
  cardEl.style.display = 'none';
  hideWhy();
  const total = queue.length;
  $('d-score').textContent = right;
  $('d-score').nextElementSibling.textContent = ' / ' + total;
  $('d-good').textContent = '\u2713 ' + right + ' ' + t('correct');
  $('d-bad').textContent  = '\u2717 ' + wrong + ' ' + t('wrong');
  const p = total ? right / total : 0;
  $('d-msg').innerHTML = p === 1 ? t('band4') : p >= .75 ? t('band3')
                        : p >= .5 ? t('band2') : t('band1');
  $('done').classList.add('show');
}

/* ── input: click a bin, drag onto it, or press 1/2/3 ── */
binsEl.addEventListener('click', e => {
  const b = e.target.closest('.bin');
  if (b) answer(+b.dataset.bin);
});
cardEl.addEventListener('dragstart', e => {
  if (!live || locked) return e.preventDefault();
  dragging = true; cardEl.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
});
cardEl.addEventListener('dragend', () => {
  dragging = false; cardEl.classList.remove('dragging');
  binsEl.querySelectorAll('.bin').forEach(b => b.classList.remove('over'));
});
binsEl.addEventListener('dragover', e => {
  const b = e.target.closest('.bin');
  if (!b) return;
  e.preventDefault(); b.classList.add('over');
});
binsEl.addEventListener('dragleave', e => {
  const b = e.target.closest('.bin');
  if (b) b.classList.remove('over');
});
binsEl.addEventListener('drop', e => {
  const b = e.target.closest('.bin');
  if (!b) return;
  e.preventDefault(); b.classList.remove('over');
  answer(+b.dataset.bin);
});
addEventListener('keydown', e => {
  if (!live) return;
  if ((e.key === ' ' || e.key === 'Enter') && advanceFn) { e.preventDefault(); advanceFn(); return; }
  if (e.key === '1' || e.key === 'ArrowLeft')  answer(0);
  if (e.key === '2' || e.key === 'ArrowDown')  answer(1);
  if (e.key === '3' || e.key === 'ArrowRight') answer(2);
});

$('i-play').addEventListener('click', start);
$('d-again').addEventListener('click', start);
$('btn-rule').addEventListener('click', () => {
  live = false; cancelAnimationFrame(raf); cardEl.style.display = 'none';
  $('intro').classList.add('show');
});
$('lang').addEventListener('change', e => { lang = e.target.value; paint(); });

paint();
</script>
</body>
</html>
